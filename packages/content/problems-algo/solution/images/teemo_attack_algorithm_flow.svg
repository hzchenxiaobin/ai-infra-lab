<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次遍历累加 min(duration, 间隔)</text>

  <!-- Start -->
  <rect x="250" y="44" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="63" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">开始</text>
  <line x1="300" y1="72" x2="300" y2="90" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="92" width="300" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="114" text-anchor="middle" font-size="12" fill="#555">total = 0, i = 0, n = len(timeSeries)</text>
  <line x1="300" y1="126" x2="300" y2="144" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond 1: i < n-1 ? -->
  <polygon points="300,146 392,188 300,230 208,188" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="184" text-anchor="middle" font-size="12" fill="#3a5a2a">i &lt; n−1 ?</text>
  <text x="300" y="200" text-anchor="middle" font-size="10" fill="#3a5a2a">（后面还有攻击）</text>

  <!-- Yes -> down to accumulate box -->
  <line x1="300" y1="230" x2="300" y2="248" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="316" y="244" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="80" y="250" width="440" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="270" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">gap = timeSeries[i+1] − timeSeries[i]</text>
  <text x="300" y="287" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">total += min(duration, gap)</text>

  <line x1="300" y1="296" x2="300" y2="314" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="240" y="316" width="120" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="337" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">i++</text>

  <!-- Loopback to Diamond 1 -->
  <path d="M 300 348 L 300 374 L 50 374 L 50 188 L 206 188" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="62" y="368" font-size="11" fill="#666">↻ 回到「i &lt; n−1 ?」</text>

  <!-- No -> last attack contribution -->
  <line x1="392" y1="188" x2="438" y2="188" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="415" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="170" width="146" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="513" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">已是最后一次</text>
  <text x="513" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">total += duration</text>

  <!-- arrow down from last box to return -->
  <path d="M 513 210 L 513 408 L 380 408" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- return total -->
  <rect x="250" y="394" width="130" height="30" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="315" y="414" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 total</text>

  <!-- caption -->
  <rect x="60" y="436" width="480" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="453" text-anchor="middle" font-size="11" fill="#555">每个非末次攻击贡献「被下次打断前的存活时长」，末次贡献满 duration</text>
</svg>
