<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：4 行周五骨架 → LEFT JOIN 匹配 → 求和补零 → 周序输出</text>

  <text x="95" y="44" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">日历骨架 Fridays</text>
  <rect x="30" y="48" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="63" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d（周五）</text>
  <rect x="30" y="70" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="87" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2023-11-03</text>
  <rect x="30" y="96" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="113" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">2023-11-10</text>
  <rect x="30" y="122" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="139" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">2023-11-17</text>
  <rect x="30" y="148" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2023-11-24</text>

  <path d="M 165 100 L 203 100" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">JOIN</text>

  <text x="295" y="44" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">LEFT JOIN 后每组的 amount_spend</text>
  <rect x="210" y="48" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="48" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="63" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">周五</text>
  <text x="330" y="63" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">amount_spend</text>
  <rect x="210" y="70" width="70" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="70" width="100" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="87" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11-03</text>
  <text x="330" y="87" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5117</text>
  <rect x="210" y="96" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="96" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="113" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">11-10</text>
  <text x="330" y="113" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">NULL</text>
  <rect x="210" y="122" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="122" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="139" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">11-17</text>
  <text x="330" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">NULL</text>
  <rect x="210" y="148" width="70" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="148" width="100" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11-24</text>
  <text x="330" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">9692, 12000</text>

  <path d="M 385 100 L 413 100" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="399" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">求和</text>

  <text x="480" y="44" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">输出（恒 4 行）</text>
  <rect x="420" y="48" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="450" y="48" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="502" y="48" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="63" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">wk</text>
  <text x="476" y="63" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">date</text>
  <text x="522" y="63" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">total</text>
  <rect x="420" y="70" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="450" y="70" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="502" y="70" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="87" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="476" y="87" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11-03</text>
  <text x="522" y="87" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5117</text>
  <rect x="420" y="96" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="450" y="96" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="502" y="96" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="476" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11-10</text>
  <text x="522" y="113" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="420" y="122" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="450" y="122" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="502" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="476" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11-17</text>
  <text x="522" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="420" y="148" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="450" y="148" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="502" y="148" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="476" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11-24</text>
  <text x="522" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">21692</text>

  <rect x="30" y="190" width="500" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">SUM(amount_spend) 依次为：5117 / NULL / NULL / 21692</text>
  <text x="280" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">全 NULL 的组 SUM 返回 NULL 而非 0 → 必须 IFNULL(SUM(·), 0) 兜底</text>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">CEIL(DAYOFMONTH(d)/7)：3→1，10→2，17→3，24→4，按 1/2/3/4 升序输出</text>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">11-10、11-17 的「行」由骨架提供，「0」由 IFNULL 提供</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（非周五的 5 笔交易在 JOIN 时匹配不上骨架，天然被过滤掉）</text>
</svg>
