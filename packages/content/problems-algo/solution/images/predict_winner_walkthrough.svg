<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,5,2]（奇数长度），dp[0][2] = −2 &lt; 0 → false</text>

  <!-- nums row -->
  <text x="40" y="58" font-size="11" fill="#888">nums:</text>
  <rect x="180" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="61" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="224" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="61" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="268" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="61" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="202" y="82" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="246" y="82" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="290" y="82" text-anchor="middle" font-size="9" fill="#aaa">2</text>

  <!-- column header j -->
  <text x="120" y="108" text-anchor="middle" font-size="10" fill="#aaa">i \ j</text>
  <text x="170" y="108" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="220" y="108" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="270" y="108" text-anchor="middle" font-size="10" fill="#aaa">2</text>

  <!-- row header i -->
  <text x="120" y="136" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="120" y="176" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="120" y="216" text-anchor="middle" font-size="10" fill="#aaa">2</text>

  <!-- row 0: dp[0][0]=1 dp[0][1]=4 dp[0][2]=-2(answer) -->
  <rect x="145" y="118" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="141" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="195" y="118" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="141" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="245" y="118" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="141" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>

  <!-- row 1: dp[1][1]=5 dp[1][2]=3(dep) -->
  <rect x="195" y="158" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="181" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="245" y="158" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="181" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- row 2: dp[2][2]=2 -->
  <rect x="245" y="198" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="221" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- dependency arrows into dp[0][2]: from dp[1][2](below) and dp[0][1](left) -->
  <path d="M 270 194 L 270 158" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="288" y="178" font-size="9" fill="#b85450">依赖↓</text>
  <path d="M 243 136 L 247 136" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="212" y="110" font-size="9" fill="#b85450">依赖←</text>

  <!-- computation box -->
  <rect x="40" y="250" width="440" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[0][2] = max( nums[0] − dp[1][2] , nums[2] − dp[0][1] )</text>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#444">= max( 1 − 3 , 2 − 4 ) = max( −2 , −2 )</text>
  <text x="260" y="320" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= −2 &lt; 0  →  玩家1净亏 2（3 vs 5）→ false</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#888">两选项净赚相同且均为负：无论先拿 1 还是 2，玩家2都能抢到中间的 5</text>
</svg>
