<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrs" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M 9 0 L 0 4.5 L 9 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：60 分钟「窗口」是滑动的，可跨钟点</text>

  <!-- ① 原始记录 -->
  <text x="40" y="44" font-size="11" fill="#666" filter="url(#rough2)">① 原始记录（乱序）</text>

  <rect x="40" y="50" width="78" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="79" y="67" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a 0549</text>
  <rect x="127" y="50" width="78" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="166" y="67" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">b 0457</text>
  <rect x="214" y="50" width="78" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="253" y="67" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a 0532</text>
  <rect x="301" y="50" width="78" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="67" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a 0621</text>
  <rect x="388" y="50" width="78" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="427" y="67" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">b 0540</text>

  <path d="M 260 80 L 260 98" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="94" font-size="11" fill="#666" filter="url(#rough2)">哈希分组</text>

  <!-- ② 分组结果 -->
  <rect x="55" y="104" width="195" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="66" y="124" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <text x="152" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0532, 0549, 0621]</text>
  <text x="152" y="153" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">→ 分钟 [332, 349, 381]</text>

  <rect x="275" y="104" width="195" height="56" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="286" y="124" font-size="12" font-weight="bold" fill="#a87a1a" filter="url(#rough2)">b</text>
  <text x="372" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0457, 0540]</text>
  <text x="372" y="153" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">→ 分钟 [297, 340]</text>

  <path d="M 152 162 L 152 182" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="178" font-size="11" fill="#666" filter="url(#rough2)">排序 + 拉上时间轴</text>

  <!-- ③ 时间轴 -->
  <text x="40" y="198" font-size="11" fill="#666" filter="url(#rough2)">③ a 的时间轴（分钟值）</text>
  <text x="276" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">滑动 60 分钟窗口 [05:32, 06:31)</text>

  <rect x="179" y="210" width="194" height="52" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" rx="6" filter="url(#rough2)"/>

  <path d="M 270 210 L 270 278" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="40" y="226" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ 钟点边界 06:00</text>
  <text x="40" y="240" font-size="10" fill="#b85450" filter="url(#rough2)">按钟点分组会把 a 拆散 ✗</text>

  <path d="M 60 252 L 474 252" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 76 248 L 76 256" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 173 248 L 173 256" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 270 248 L 270 256" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 367 248 L 367 256" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 464 248 L 464 256" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="270" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">05:00</text>
  <text x="173" y="270" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">05:30</text>
  <text x="270" y="270" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">06:00</text>
  <text x="367" y="270" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">06:30</text>
  <text x="464" y="270" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">07:00</text>

  <circle cx="180" cy="252" r="5.5" fill="#446688" stroke="#ffffff" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="234" cy="252" r="5.5" fill="#446688" stroke="#ffffff" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="338" cy="252" r="5.5" fill="#446688" stroke="#ffffff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="240" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">05:32</text>
  <text x="234" y="240" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">05:49</text>
  <text x="338" y="240" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">06:21</text>

  <path d="M 184 288 L 334 288" stroke="#4a7a3a" stroke-width="1.6" marker-start="url(#arrs)" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="259" y="303" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">跨度 49 分钟 &lt; 60 ✓</text>

  <!-- ④ 判定结论 -->
  <rect x="40" y="312" width="228" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="154" y="326" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">a：49 分钟 &lt; 60 → 三次同窗</text>
  <text x="154" y="341" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">高访问员工 ✓</text>

  <rect x="283" y="312" width="197" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="381" y="326" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">b：仅 2 条记录</text>
  <text x="381" y="341" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">不足 3 次 ✗</text>
</svg>
