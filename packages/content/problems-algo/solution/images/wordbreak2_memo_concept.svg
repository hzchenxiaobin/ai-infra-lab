<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单词拆分 II：记忆化 DFS（子问题复用）</text>

  <!-- String row -->
  <text x="40" y="58" font-size="11" fill="#888">s =</text>
  <rect x="78" y="44" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="63" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="114" y="44" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="63" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="150" y="44" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="63" text-anchor="middle" font-size="12" fill="#333">t</text>
  <rect x="186" y="44" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="63" text-anchor="middle" font-size="12" fill="#333">s</text>
  <rect x="222" y="44" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="63" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="258" y="44" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="63" text-anchor="middle" font-size="12" fill="#333">n</text>
  <rect x="294" y="44" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="63" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="330" y="44" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="63" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="366" y="44" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="383" y="63" text-anchor="middle" font-size="12" fill="#333">o</text>
  <rect x="402" y="44" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="419" y="63" text-anchor="middle" font-size="12" fill="#333">g</text>
  <text x="78" y="84" font-size="9" fill="#888">0</text>
  <text x="186" y="84" font-size="9" fill="#888">3</text>
  <text x="258" y="84" font-size="9" fill="#888">4</text>
  <text x="294" y="84" font-size="9" fill="#888">5</text>
  <text x="330" y="84" font-size="9" fill="#888">6</text>
  <text x="366" y="84" font-size="9" fill="#888">7</text>
  <text x="436" y="84" font-size="9" fill="#888">10</text>

  <!-- Recursion tree -->
  <!-- dfs(0) -->
  <rect x="248" y="100" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(0)</text>

  <!-- edge 0->3 "cat" -->
  <path d="M 260 126 Q 200 140 175 156" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="138" font-size="10" fill="#4a7a3a" font-weight="bold">cat</text>

  <!-- edge 0->4 "cats" -->
  <path d="M 300 126 Q 360 140 385 156" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="138" font-size="10" fill="#d6a040" font-weight="bold">cats</text>

  <!-- dfs(3) -->
  <rect x="142" y="156" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="174" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(3)</text>

  <!-- dfs(4) -->
  <rect x="354" y="156" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="386" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(4)</text>

  <!-- edge 3->7 "sand" -->
  <path d="M 195 182 Q 230 200 258 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="206" font-size="10" fill="#4a7a3a" font-weight="bold">sand</text>

  <!-- edge 4->7 "and" (memo hit - dashed red) -->
  <path d="M 365 182 Q 330 200 302 214" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="328" y="206" font-size="10" fill="#b85450" font-weight="bold">and · 命中!</text>

  <!-- dfs(7) - highlighted shared subproblem -->
  <rect x="248" y="214" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(7)</text>
  <text x="280" y="252" text-anchor="middle" font-size="9" fill="#b85450">↑ 共享子问题</text>

  <!-- edge 7->10 "dog" -->
  <path d="M 280 244 L 280 268" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="260" font-size="10" fill="#446688" font-weight="bold">dog</text>

  <!-- dfs(10) base case -->
  <rect x="240" y="268" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(10)=[“”]</text>

  <!-- memo cache box -->
  <rect x="30" y="312" width="500" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">memo 缓存表：dfs(start) → s[start:] 的所有句子</text>

  <text x="48" y="356" font-size="10" fill="#555">memo[10]</text>
  <rect x="108" y="344" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="358" text-anchor="middle" font-size="10" fill="#333">[“”]</text>

  <text x="48" y="382" font-size="10" fill="#555">memo[7]</text>
  <rect x="108" y="370" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="148" y="384" text-anchor="middle" font-size="10" fill="#333">[“dog”]</text>

  <text x="208" y="356" font-size="10" fill="#555">memo[3]</text>
  <rect x="268" y="344" width="116" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="326" y="358" text-anchor="middle" font-size="10" fill="#333">[“sand dog”]</text>

  <text x="208" y="382" font-size="10" fill="#555">memo[4]</text>
  <rect x="268" y="370" width="116" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="326" y="384" text-anchor="middle" font-size="10" fill="#333">[“and dog”]</text>

  <text x="400" y="356" font-size="10" fill="#555">memo[0]</text>
  <rect x="400" y="364" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="378" text-anchor="middle" font-size="9" fill="#333">“cat sand dog”</text>
  <text x="460" y="392" text-anchor="middle" font-size="9" fill="#333">“cats and dog”</text>
</svg>
