<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">计数 + 前缀和：把人按年龄装桶，区间求和 O(1)</text>

  <!-- ages input row -->
  <text x="30" y="58" font-size="12" fill="#888">ages:</text>
  <rect x="70" y="44" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="63" text-anchor="middle" font-size="12" fill="#333">16</text>
  <rect x="124" y="44" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="63" text-anchor="middle" font-size="12" fill="#333">17</text>
  <rect x="178" y="44" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="63" text-anchor="middle" font-size="12" fill="#333">18</text>
  <text x="245" y="63" font-size="11" fill="#888">→ 按年龄装桶 cnt[a]</text>

  <!-- cnt row: ages 14..20 -->
  <text x="30" y="116" font-size="12" fill="#888">age a:</text>
  <g font-size="10" fill="#888">
    <text x="95" y="100" text-anchor="middle">14</text>
    <text x="149" y="100" text-anchor="middle">15</text>
    <text x="203" y="100" text-anchor="middle">16</text>
    <text x="257" y="100" text-anchor="middle">17</text>
    <text x="311" y="100" text-anchor="middle">18</text>
    <text x="365" y="100" text-anchor="middle">19</text>
    <text x="419" y="100" text-anchor="middle">20</text>
  </g>
  <!-- cnt values: 0,0,1,1,1,0,0 ; highlight 16,17,18 -->
  <rect x="70" y="106" width="50" height="28" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="125" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <rect x="124" y="106" width="50" height="28" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="125" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <rect x="178" y="106" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="203" y="125" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="232" y="106" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="257" y="125" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="286" y="106" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="311" y="125" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="340" y="106" width="50" height="28" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="125" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <rect x="394" y="106" width="50" height="28" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="419" y="125" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <!-- arrow to prefix -->
  <text x="460" y="125" font-size="11" fill="#888">→ 前缀和</text>

  <!-- prefix row -->
  <text x="30" y="180" font-size="12" fill="#888">pref[a]:</text>
  <g font-size="10" fill="#888">
    <text x="95" y="164" text-anchor="middle">14</text>
    <text x="149" y="164" text-anchor="middle">15</text>
    <text x="203" y="164" text-anchor="middle">16</text>
    <text x="257" y="164" text-anchor="middle">17</text>
    <text x="311" y="164" text-anchor="middle">18</text>
    <text x="365" y="164" text-anchor="middle">19</text>
    <text x="419" y="164" text-anchor="middle">20</text>
  </g>
  <!-- prefix values: 0,0,1,2,3,3,3 -->
  <rect x="70" y="170" width="50" height="28" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="189" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <rect x="124" y="170" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="149" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="178" y="170" width="50" height="28" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="189" text-anchor="middle" font-size="12" fill="#bbb">1</text>
  <rect x="232" y="170" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="257" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="286" y="170" width="50" height="28" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="311" y="189" text-anchor="middle" font-size="12" fill="#bbb">3</text>
  <rect x="340" y="170" width="50" height="28" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="189" text-anchor="middle" font-size="12" fill="#bbb">3</text>
  <rect x="394" y="170" width="50" height="28" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="419" y="189" text-anchor="middle" font-size="12" fill="#bbb">3</text>

  <!-- bracket showing range [16,17] for x=17 -->
  <path d="M 178 206 L 178 214 L 282 214 L 282 206" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="230" y="226" text-anchor="middle" font-size="10" fill="#b85450">x=17: 合法 y ∈ [16,17]</text>

  <!-- range query formula -->
  <rect x="40" y="238" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count = prefix[x] − prefix[lower−1]</text>
  <text x="260" y="275" text-anchor="middle" font-size="11" fill="#555">本例 = prefix[17] − prefix[15] = 2 − 0 = 2</text>

  <!-- contribution formula -->
  <rect x="40" y="292" width="440" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans += cnt[x] × (count − 1)</text>
  <text x="260" y="331" text-anchor="middle" font-size="11" fill="#888">−1 是因为「不给自己发」；本例 cnt[17]×(2−1) = 1</text>
</svg>
