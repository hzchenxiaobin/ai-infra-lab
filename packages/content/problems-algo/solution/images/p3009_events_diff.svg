<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">线段 ⇔ 高度区间：下端 +1、上端 −1，从下往上扫描</text>

  <!-- height axis -->
  <path d="M 78 330 L 78 92" stroke="#999" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="78" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">从下往上扫</text>
  <text x="66" y="314" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="66" y="209" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="66" y="104" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <!-- guide lines -->
  <path d="M 78 310 L 262 310" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 78 205 L 262 205" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 78 100 L 262 100" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- segment bars: s0..s3 = [1,2], s4 = [1,3], s5 = [2,3] -->
  <rect x="104" y="205" width="16" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="205" width="16" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="156" y="205" width="16" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="182" y="205" width="16" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="208" y="100" width="16" height="210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="234" y="100" width="16" height="105" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <!-- +1 marks at bar bottoms (green) -->
  <text x="112" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="138" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="164" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="190" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="216" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="242" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+</text>

  <!-- −1 marks at bar tops (red) -->
  <text x="112" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="138" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="164" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="190" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="216" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="242" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−</text>

  <text x="168" y="344" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">线段 s0~s5 的高度区间（示例 1）</text>

  <!-- sweep table -->
  <text x="390" y="96" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">扫描计数</text>
  <rect x="300" y="106" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="325" y="123" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">高度</text>
  <text x="377" y="123" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Δ</text>
  <text x="442" y="123" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cur</text>

  <rect x="300" y="134" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="325" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="377" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+5</text>
  <text x="442" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="490" y="153" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">★</text>

  <rect x="300" y="166" width="180" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="377" y="185" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−3</text>
  <text x="442" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="300" y="198" width="180" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="377" y="217" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="442" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="390" y="246" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">★ 最大 cur = 5，即答案</text>
  <text x="390" y="262" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur 在相邻高度之间恒定</text>

  <!-- bottom note -->
  <rect x="55" y="354" width="410" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="371" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">谷 = 两个下端同高（+2），峰 = 两个上端同高（−2）</text>
  <text x="260" y="387" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">单调点 +1/−1 抵消，端点 ±1 —— 与官方 hints 的顶点视角等价</text>
</svg>
