<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：逐位滚动 dp + 前缀和，O(n·V)</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">V = max(nums) ≤ 50，全程对 10⁹+7 取模</text>

  <!-- ============ 左：主流程 ============ -->
  <rect x="36" y="54" width="264" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="76" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">初始化：dp[s] = 1（0 ≤ s ≤ nums[0]），i ← 1</text>

  <path d="M 168 90 L 168 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="36" y="104" width="264" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="120" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">先算 Δ = nums[i] − nums[i−1]；</text>
  <text x="168" y="134" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">再求上一层前缀和 pre[k] = Σ&#8202;t&lt;k&#8202;dp[t]</text>

  <path d="M 168 140 L 168 152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="36" y="154" width="264" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="172" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">转移：s = 0..nums[i]，</text>
  <text x="168" y="186" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">tmax = min(s, s − Δ)；tmax ≥ 0 时</text>
  <text x="168" y="200" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">ndp[s] = pre[tmax+1]，否则 ndp[s] = 0</text>

  <path d="M 168 206 L 168 218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="36" y="220" width="264" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="240" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">dp ← ndp（滚动），i ← i + 1</text>

  <path d="M 168 252 L 168 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="168,264 224,292 168,320 112,292" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="296" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 是：左侧回环 -->
  <path d="M 112 292 L 22 292 L 22 122 L 32 122" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="60" y="284" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">是</text>
  <text x="22" y="108" font-size="9" fill="#2f5d24" filter="url(#rough2)">下一轮</text>

  <!-- 否：右侧出答案 -->
  <path d="M 224 292 L 258 292" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="238" y="283" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">否</text>

  <rect x="262" y="272" width="232" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="378" y="290" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">答案 = Σ dp[s]（0 ≤ s ≤ nums[n−1]）</text>
  <text x="378" y="306" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">对 10⁹ + 7 取模后返回</text>

  <!-- ============ 右：旁注 ============ -->
  <rect x="330" y="54" width="164" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="72" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">Δ 每轮现算：</text>
  <text x="412" y="88" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">nums 抬多少，带就挤多少</text>

  <rect x="330" y="106" width="164" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="124" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">每轮 O(V)：算前缀和 + 转移</text>
  <text x="412" y="140" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">总计 O(n·V) ≈ 10⁵</text>

  <rect x="330" y="158" width="164" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="176" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">约束只有单侧上界，</text>
  <text x="412" y="192" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">窗口恒为前缀 [0, tmax]，</text>
  <text x="412" y="208" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">pre 一次查询 O(1)</text>

  <rect x="330" y="226" width="164" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="242" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">s 每加 1，tmax 恰好加 1：</text>
  <text x="412" y="257" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">滑窗匀速右移</text>

  <!-- 底部结论 -->
  <rect x="30" y="326" width="462" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="343" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">两个数组只留一个自由度：dp 滚在「最后一位填了几」上，其余全部交给前缀和</text>
</svg>
