<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：N=3, K=3，dp 表逐周填表，答案 = 12</text>

  <!-- ===== Left: flights & days matrices ===== -->
  <text x="40" y="56" font-size="11" fill="#888" font-weight="bold">flights</text>
  <!-- flights 3x3, cell 26x26, origin (40,64) -->
  <!-- row0 -->
  <rect x="40" y="64" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="53" y="82" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="66" y="64" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="79" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="92" y="64" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="105" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <!-- row1 -->
  <rect x="40" y="90" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="53" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="66" y="90" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="79" y="108" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="92" y="90" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="105" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <!-- row2 -->
  <rect x="40" y="116" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="53" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="66" y="116" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="79" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="92" y="116" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="134" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <text x="118" y="108" font-size="9" fill="#888">对角=0</text>
  <text x="118" y="120" font-size="9" fill="#888">但仍可留</text>

  <!-- days -->
  <text x="40" y="172" font-size="11" fill="#888" font-weight="bold">days</text>
  <!-- row0: 1 3 1 -->
  <rect x="40" y="180" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="198" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="66" y="180" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="79" y="198" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="92" y="180" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="198" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- row1: 6 0 3 -->
  <rect x="40" y="206" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <rect x="66" y="206" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="79" y="224" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="92" y="206" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="224" text-anchor="middle" font-size="11" fill="#333">3</text>
  <!-- row2: 3 3 3 -->
  <rect x="40" y="232" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="250" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="66" y="232" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="79" y="250" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="92" y="232" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="250" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- ===== Right: DP table ===== -->
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">dp 表（行=城市 c，列=周 w）</text>
  <!-- table origin (240, 64). label col 56, week cols 64. header row 30, city rows 38 -->
  <!-- header -->
  <rect x="240" y="64" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="268" y="84" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">c＼w</text>
  <rect x="296" y="64" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="328" y="84" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">w=0</text>
  <rect x="360" y="64" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="392" y="84" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">w=1</text>
  <rect x="424" y="64" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="456" y="84" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">w=2</text>

  <!-- row c=0: 1 9 10 -->
  <rect x="240" y="94" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c=0</text>
  <rect x="296" y="94" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="118" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="360" y="94" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="118" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="424" y="94" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="456" y="118" text-anchor="middle" font-size="12" fill="#333">10</text>

  <!-- row c=1: 6 6 12(highlight) -->
  <rect x="240" y="132" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c=1</text>
  <rect x="296" y="132" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="360" y="132" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="156" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="424" y="132" width="64" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="456" y="156" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">12</text>

  <!-- row c=2: 3 9 12(highlight) -->
  <rect x="240" y="170" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c=2</text>
  <rect x="296" y="170" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="194" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="360" y="170" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="194" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="424" y="170" width="64" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="456" y="194" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">12</text>

  <!-- annotations on dp -->
  <text x="328" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ 从城市0飞0→1，休6</text>
  <text x="392" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3+max(1,6,3)=9</text>
  <text x="456" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3+max(9,6,9)=12</text>

  <!-- ===== Bottom: optimal path ===== -->
  <rect x="40" y="280" width="520" height="68" fill="#fafafa" stroke="#999" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#777" font-weight="bold">回溯一条最优路径（从 dp[2][2]=12 反推前驱）</text>

  <!-- path boxes -->
  <rect x="60" y="312" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="96" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">城市 0</text>
  <path d="M 132 327 L 162 327" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="147" y="320" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">w0</text>

  <rect x="162" y="312" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="198" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">城市 1</text>
  <text x="198" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+6</text>
  <path d="M 234 327 L 264 327" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="249" y="320" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">w1</text>

  <rect x="264" y="312" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">城市 2</text>
  <text x="300" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+3</text>
  <path d="M 336 327 L 366 327" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="351" y="320" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">w2</text>

  <rect x="366" y="312" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="402" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">城市 2</text>
  <text x="402" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+3</text>

  <text x="470" y="332" font-size="12" fill="#b85450" font-weight="bold">= 12 ✓</text>

  <!-- footer note -->
  <text x="300" y="380" text-anchor="middle" font-size="10" fill="#888">注：本例航班图几乎完备，每个 p 都能到每个 c；dp[w−1][p]&lt;0 的非法前驱在转移时跳过</text>
  <text x="300" y="396" text-anchor="middle" font-size="10" fill="#888">回溯时若某 dp 值有多个等值前驱，任选其一即可得到一条最优路径</text>
</svg>
