<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：2×threshold &gt; 区间长度 → 唯一多数元素</text>

  <!-- arr label -->
  <text x="60" y="88" font-size="12" fill="#666" filter="url(#rough2)">arr:</text>

  <!-- index labels -->
  <text x="160" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="208" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="256" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="304" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="352" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="400" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>

  <!-- cells: 1,1,2,2,1,1 ; width 48 starting x=136 -->
  <rect x="136" y="66" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="66" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="232" y="66" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="280" y="66" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="328" y="66" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="376" y="66" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- query range bracket [0,5] -->
  <path d="M 136 106 Q 136 116 146 116 L 414 116 Q 424 116 424 106" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">query(0, 5, 4)：区间长度 = 6，threshold = 4</text>

  <!-- constraint box -->
  <rect x="70" y="146" width="420" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2 × threshold = 8 &gt; 6 = 区间长度 → 最多一个元素达标</text>

  <!-- reasoning -->
  <rect x="70" y="186" width="420" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">若存在达标元素，它占比 &gt; 1/2</text>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">→ 随机取区间内一个位置，命中概率 &gt; 1/2</text>

  <!-- positions map -->
  <text x="60" y="252" font-size="11" fill="#666" filter="url(#rough2)">预处理：</text>
  <rect x="120" y="240" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="185" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 → [0, 1, 4, 5]</text>
  <rect x="260" y="240" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 → [2, 3]</text>
  <text x="370" y="257" font-size="10" fill="#888" filter="url(#rough2)">值→有序下标表</text>

  <!-- key insight box -->
  <rect x="60" y="282" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">随机采样 K 次，每次取 arr[随机下标] 当候选</text>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">用二分在下标表里数 [left, right] 内出现次数</text>

  <!-- probability note -->
  <rect x="120" y="342" width="320" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">K = 20 → 漏检概率 &lt; (1/2)²⁰ ≈ 10⁻⁶</text>
</svg>
