<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 428" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="428" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：后序求子树和 + 计数 ≡ 0 的刀口</text>

  <!-- step 1 -->
  <rect x="200" y="38" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 建邻接表，以 0 为根</text>
  <path d="M 300 72 L 300 88" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="170" y="90" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② 迭代 DFS：前序 order + parent</text>
  <path d="M 300 124 L 300 140" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="150" y="142" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="164" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">③ 逆序取 u = order[i]（即后序）</text>
  <path d="M 300 176 L 300 198" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="300,200 400,240 300,280 200,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="245" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">sub[u] % k == 0 ?</text>

  <!-- yes branch -->
  <text x="410" y="230" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 400 240 L 426 240" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="222" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="505" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">ans++（刀口 / 最后一块）</text>
  <path d="M 505 258 L 505 298 L 312 298" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- no branch -->
  <text x="310" y="292" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 300 280 L 300 302" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="140" y="304" width="320" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="323" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">④ sub[parent[u]] += sub[u]（u ≠ 根）</text>
  <text x="300" y="341" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">上推完整子树和</text>

  <!-- loop back -->
  <path d="M 140 327 L 70 327 L 70 159 L 146 159" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="70" y="238" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">还有节点</text>
  <text x="70" y="254" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下一个 u</text>

  <!-- exit -->
  <path d="M 300 350 L 300 372" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="366" font-size="10.5" fill="#888" filter="url(#rough2)">处理完毕</text>
  <rect x="210" y="374" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="396" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans</text>

  <!-- side note -->
  <rect x="414" y="276" width="172" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="500" y="298" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">💡 为什么切了还上推？</text>
  <text x="500" y="320" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">切走的块 ≡ 0 (mod k)，</text>
  <text x="500" y="338" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">推与不推只差一个</text>
  <text x="500" y="356" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">k 的倍数</text>
  <text x="500" y="380" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">—— 余数不灭</text>
</svg>
