<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8a94a2"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="372" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 + 一个奇偶位</text>

  <rect x="65" y="28" width="150" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="48" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ans = 0，flip = 0</text>

  <path d="M 140 58 V 70" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <polygon points="140,72 206,100 140,128 74,100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="104" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 140 128 V 142" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="148" y="140" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">是</text>

  <polygon points="140,144 208,174 140,204 72,174" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="172" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">nums[i] ⊕ flip</text>
  <text x="140" y="186" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">== 0 ?</text>

  <path d="M 140 204 V 218" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="148" y="216" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">是</text>

  <rect x="40" y="220" width="200" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="240" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans++，flip ^= 1</text>
  <text x="140" y="257" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">从 i 发起一次后缀翻转</text>

  <path d="M 208 174 H 252 V 243 H 244" stroke="#8a94a2" stroke-width="1.5" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="258" y="166" font-size="9.5" fill="#555" filter="url(#rough2)">否（有效值已是 1）</text>

  <path d="M 140 266 V 282" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="90" y="284" width="100" height="30" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="303" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i++</text>

  <path d="M 90 299 H 26 V 100 H 68" stroke="#8a94a2" stroke-width="1.5" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="18" y="200" transform="rotate(-90 18 200)" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">循环</text>

  <path d="M 206 100 H 395 V 312" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="242" y="94" font-size="9.5" fill="#555" filter="url(#rough2)">否（扫完）</text>

  <rect x="300" y="316" width="190" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="337" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans（必有解）</text>

  <text x="395" y="364" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">每个位置都有以自己为起点的操作，无需收尾判定</text>
</svg>
