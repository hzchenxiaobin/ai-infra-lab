<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：words=["one.two.three","four.five","six"], sep='.'</text>

  <!-- ===== Row 1: one.two.three ===== -->
  <text x="20" y="60" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">w₁</text>
  <!-- word box with highlighted separators -->
  <rect x="40" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>
  <rect x="80" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n</text>
  <rect x="120" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>
  <rect x="160" y="48" width="24" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="68" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">.</text>
  <rect x="184" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="204" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">t</text>
  <rect x="224" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="244" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">w</text>
  <rect x="264" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="284" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>
  <rect x="304" y="48" width="24" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="68" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">.</text>
  <rect x="328" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="348" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">t</text>
  <rect x="368" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="388" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">h</text>
  <rect x="408" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="428" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r</text>
  <rect x="448" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="468" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>
  <rect x="488" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="508" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>

  <!-- cut arrows -->
  <path d="M 172 80 L 172 96" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 316 80 L 316 96" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- tokens row 1 -->
  <rect x="40" y="100" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="100" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">one</text>
  <rect x="184" y="100" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="244" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">two</text>
  <rect x="328" y="100" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="408" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">three</text>

  <!-- ===== Row 2: four.five ===== -->
  <text x="20" y="170" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">w₂</text>
  <rect x="40" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f</text>
  <rect x="80" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>
  <rect x="120" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">u</text>
  <rect x="160" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="180" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r</text>
  <rect x="200" y="158" width="24" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">.</text>
  <rect x="224" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="244" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f</text>
  <rect x="264" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="284" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i</text>
  <rect x="304" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="324" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>
  <rect x="344" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="364" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>

  <path d="M 212 190 L 212 206" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="40" y="210" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="120" y="229" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">four</text>
  <rect x="224" y="210" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="304" y="229" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">five</text>

  <!-- ===== Row 3: six (no separator) ===== -->
  <text x="20" y="280" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">w₃</text>
  <rect x="40" y="268" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="288" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s</text>
  <rect x="80" y="268" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="288" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i</text>
  <rect x="120" y="268" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="288" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x</text>

  <text x="200" y="288" font-size="11" fill="#888" filter="url(#rough2)">无分隔符 → 整串作为一个 token</text>

  <!-- accumulate arrows to result -->
  <path d="M 408 320 L 408 322" stroke="none"/>
  <path d="M 100 128 L 100 318" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)" opacity="0"/>
  <path d="M 244 128 L 244 318" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)" opacity="0"/>
  <path d="M 100 296 L 100 320" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ===== Result row ===== -->
  <rect x="40" y="320" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">res = [one, two, three, four, five, six]</text>
</svg>
