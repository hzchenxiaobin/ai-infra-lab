<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二倍数对数组：算法流程</text>

  <!-- Step 1: count -->
  <rect x="160" y="42" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 统计频次 count[x]</text>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#888">哈希表 O(n)</text>

  <path d="M 260 86 L 260 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 2: sort keys by abs -->
  <rect x="140" y="98" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 键按 |x| 升序排序</text>
  <text x="260" y="134" text-anchor="middle" font-size="10" fill="#888">|2x| ≥ |x|，保证 2x 在下游</text>

  <path d="M 260 142 L 260 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 3: loop -->
  <rect x="150" y="154" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 遍历每个键 x</text>

  <path d="M 260 194 L 260 202" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Decision: count[x]==0? -->
  <path d="M 260 204 L 360 244 L 260 284 L 160 244 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count[x]</text>
  <text x="260" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">== 0 ?</text>

  <!-- Yes branch (skip, loop back) -->
  <path d="M 360 244 L 470 244" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="415" y="236" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="430" y="256" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="276" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">跳过</text>

  <!-- No branch (check 2x) -->
  <path d="M 160 244 L 100 244" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="130" y="236" text-anchor="middle" font-size="11" fill="#d6a040">否</text>

  <!-- Decision: count[2x] >= count[x]? -->
  <path d="M 60 270 L 140 270 L 100 318 L 20 318 L 20 290 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="293" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">count[2x]</text>
  <text x="80" y="307" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">≥ count[x]?</text>

  <!-- No -> false -->
  <path d="M 20 304 L 20 340" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="34" y="328" font-size="10" fill="#b85450">否</text>
  <rect x="30" y="346" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="368" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes -> consume, loop back -->
  <path d="M 140 294 L 200 294" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="170" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="200" y="278" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">count[2x] −= count[x]</text>
  <text x="260" y="310" text-anchor="middle" font-size="9" fill="#888">消耗配对</text>

  <!-- loop back arrows -->
  <path d="M 320 298 L 470 298 L 470 244" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 470 288 L 470 174 L 370 174" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="430" y="168" font-size="10" fill="#888">下一个 x</text>

  <!-- Final: loop ends -> true -->
  <path d="M 260 194 L 380 174" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)" opacity="0"/>
  <rect x="350" y="346" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>
  <path d="M 470 288 L 470 346" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr2)" filter="url(#rough2)" opacity="0"/>

  <text x="260" y="392" text-anchor="middle" font-size="10" fill="#888">遍历完所有键均能配对 ⇒ return true</text>
</svg>
