<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：六次 book 的状态演化</text>

  <!-- Coordinate: x0=110, unit=8 per value-unit, range 0..55 (we use 0..55) -->
  <!-- So value v -> x = 110 + 8*v -->

  <!-- Step 1: book(10,20) -> true -->
  <text x="34" y="56" font-size="11" fill="#446688" font-weight="bold">① book(10,20)</text>
  <rect x="190" y="44" width="80" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="58" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ true</text>
  <text x="360" y="58" font-size="10" fill="#888">overlaps = ∅</text>

  <!-- Step 2: book(50,60) -> true -->
  <text x="34" y="92" font-size="11" fill="#446688" font-weight="bold">② book(50,60)</text>
  <rect x="190" y="80" width="80" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="510" y="80" width="80" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="94" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ true</text>
  <text x="360" y="94" font-size="10" fill="#888">overlaps = ∅（互不相交）</text>

  <!-- Step 3: book(10,40) -> true, overlap [10,20) -->
  <text x="34" y="128" font-size="11" fill="#446688" font-weight="bold">③ book(10,40)</text>
  <rect x="190" y="116" width="240" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <!-- highlight new overlap -->
  <rect x="190" y="116" width="80" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="134" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ true</text>
  <text x="360" y="134" font-size="10" fill="#d6a040" font-weight="bold">overlaps = {[10,20)}</text>

  <!-- Step 4: book(5,15) -> false -->
  <text x="34" y="164" font-size="11" fill="#b85450" font-weight="bold">④ book(5,15)</text>
  <rect x="150" y="152" width="80" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- show existing overlap [10,20) dashed above -->
  <rect x="190" y="148" width="80" height="22" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <!-- intersection [10,15) marked -->
  <rect x="190" y="152" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="164" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">交</text>
  <text x="280" y="166" font-size="10.5" fill="#b85450" font-weight="bold">→ false ✗</text>
  <text x="360" y="166" font-size="10" fill="#b85450">[5,15) ∩ [10,20) = [10,15) ≠ ∅</text>

  <!-- Step 5: book(5,10) -> true -->
  <text x="34" y="200" font-size="11" fill="#446688" font-weight="bold">⑤ book(5,10)</text>
  <rect x="150" y="188" width="40" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="202" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ true</text>
  <text x="360" y="202" font-size="10" fill="#888">半开 [5,10) 不触到 10 → 不相交</text>

  <!-- Step 6: book(25,55) -> true, new overlaps [25,40),[50,55) -->
  <text x="34" y="236" font-size="11" fill="#446688" font-weight="bold">⑥ book(25,55)</text>
  <rect x="310" y="224" width="240" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <!-- new overlap [25,40) -->
  <rect x="310" y="224" width="120" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <!-- new overlap [50,55) -->
  <rect x="510" y="224" width="40" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="238" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ true</text>
  <text x="360" y="252" font-size="10" fill="#d6a040" font-weight="bold">新增 overlaps: [25,40), [50,55)</text>

  <!-- shared time axis -->
  <line x1="110" y1="284" x2="540" y2="284" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 540 284 L 532 280 L 532 288 Z" fill="#888" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <line x1="110" y1="280" x2="110" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="110" y="304">0</text>
    <line x1="150" y1="280" x2="150" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="150" y="304">5</text>
    <line x1="190" y1="280" x2="190" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="190" y="304">10</text>
    <line x1="230" y1="280" x2="230" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="230" y="304">15</text>
    <line x1="270" y1="280" x2="270" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="270" y="304">20</text>
    <line x1="310" y1="280" x2="310" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="310" y="304">25</text>
    <line x1="350" y1="280" x2="350" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="350" y="304">30</text>
    <line x1="390" y1="280" x2="390" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="390" y="304">35</text>
    <line x1="430" y1="280" x2="430" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="430" y="304">40</text>
    <line x1="470" y1="280" x2="470" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="470" y="304">45</text>
    <line x1="510" y1="280" x2="510" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="510" y="304">50</text>
    <line x1="550" y1="280" x2="550" y2="290" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/><text x="550" y="304">55</text>
  </g>

  <!-- Legend -->
  <rect x="40" y="320" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="340" font-size="11.5" fill="#444" font-weight="bold">图例</text>

  <rect x="60" y="350" width="28" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="96" y="361" font-size="10.5" fill="#444">已预订事件（booked）</text>

  <rect x="60" y="370" width="28" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="96" y="381" font-size="10.5" fill="#444">双重预订段（overlaps，两两之交）</text>

  <rect x="60" y="390" width="28" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="96" y="401" font-size="10.5" fill="#444">被拒绝的新事件（会引发三重）</text>

  <rect x="290" y="350" width="28" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="326" y="361" font-size="10.5" fill="#444">触发三重的相交区域</text>

  <text x="290" y="381" font-size="10.5" fill="#666">关键判定：max(os, s) &lt; min(oe, e)？</text>
  <text x="290" y="398" font-size="10.5" fill="#666">半开 [5,10) 与 [10,20) 在 10 处不相交</text>
  <text x="290" y="415" font-size="10.5" fill="#666">→ 步骤⑤能通过，步骤④不能</text>

  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#888">最终 booked = {[10,20),[50,60),[10,40),[5,10),[25,55)}，overlaps = {[10,20),[25,40),[50,55)}</text>
</svg>
