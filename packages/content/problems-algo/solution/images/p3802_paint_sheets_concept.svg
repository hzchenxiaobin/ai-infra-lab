<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="348" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">固定切分 x：合法方案 = A(x)·B(x) − 同色对</text>

  <!-- 纸条 n=10 -->
  <text x="80" y="40" font-size="11" fill="#666" filter="url(#rough2)">纸条 n = 10</text>
  <g filter="url(#rough2)">
    <rect x="80"  y="48" width="38" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="120" y="48" width="38" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="160" y="48" width="38" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="48" width="38" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="242" y="48" width="38" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="282" y="48" width="38" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="322" y="48" width="38" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="362" y="48" width="38" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="402" y="48" width="38" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="442" y="48" width="38" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="99"  y="68" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="139" y="68" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="179" y="68" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="219" y="68" text-anchor="middle" font-size="11" fill="#333">4</text>
    <text x="261" y="68" text-anchor="middle" font-size="11" fill="#333">5</text>
    <text x="301" y="68" text-anchor="middle" font-size="11" fill="#333">6</text>
    <text x="341" y="68" text-anchor="middle" font-size="11" fill="#333">7</text>
    <text x="381" y="68" text-anchor="middle" font-size="11" fill="#333">8</text>
    <text x="421" y="68" text-anchor="middle" font-size="11" fill="#333">9</text>
    <text x="461" y="68" text-anchor="middle" font-size="11" fill="#333">10</text>
    <path d="M 241 44 L 239 88" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" fill="none"/>
    <text x="240" y="38" text-anchor="middle" font-size="11" fill="#b85450">剪一刀：x = 4</text>
  </g>

  <!-- 两张纸的说明 -->
  <g filter="url(#rough2)">
    <text x="160" y="102" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">左纸 x = 4 格</text>
    <text x="160" y="119" text-anchor="middle" font-size="11" fill="#33506b">涂颜色 i：须 limit[i] ≥ 4</text>
    <text x="360" y="102" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">右纸 n−x = 6 格</text>
    <text x="360" y="119" text-anchor="middle" font-size="11" fill="#2f5d24">涂颜色 j：须 limit[j] ≥ 6</text>
    <text x="280" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i ≠ j —— 两纸必须异色</text>
  </g>

  <!-- 容斥三框 -->
  <g filter="url(#rough2)">
    <rect x="28" y="156" width="176" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="178" text-anchor="middle" font-size="12.5" fill="#33506b">全部有序对 (i, j)</text>
    <text x="116" y="197" text-anchor="middle" font-size="11.5" fill="#33506b">num_ge(x) × num_ge(n−x)</text>
    <text x="116" y="214" text-anchor="middle" font-size="10" fill="#666">（暂且允许 i = j）</text>
    <text x="222" y="197" text-anchor="middle" font-size="24" fill="#333">−</text>
    <rect x="240" y="156" width="180" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="330" y="178" text-anchor="middle" font-size="12.5" fill="#8a3030">同色对 i = j</text>
    <text x="330" y="197" text-anchor="middle" font-size="11.5" fill="#8a3030">num_ge(max(x, n−x))</text>
    <text x="330" y="214" text-anchor="middle" font-size="10" fill="#666">（同色须盖住两张纸）</text>
    <text x="436" y="197" text-anchor="middle" font-size="20" fill="#333">=</text>
    <rect x="452" y="156" width="88" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="496" y="182" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold">f(x)</text>
    <text x="496" y="202" text-anchor="middle" font-size="11" fill="#2f5d24">合法方案数</text>
  </g>

  <!-- 代入数字 -->
  <g filter="url(#rough2)">
    <rect x="45" y="240" width="470" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="262" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">代入：n = 10，x = 4，limit = [5, 8, 6]（排序后 [5, 6, 8]）</text>
    <text x="280" y="283" text-anchor="middle" font-size="11.5" fill="#33506b">左纸 4 格：颜色 5、8、6 都够 → num_ge(4) = 3</text>
    <text x="280" y="302" text-anchor="middle" font-size="11.5" fill="#2f5d24">右纸 6 格：只有 8、6 够 → num_ge(6) = 2；max(4,6)=6 → 同色 2 种</text>
    <text x="280" y="324" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">f(4) = 3 × 2 − 2 = 4</text>
  </g>
</svg>
