<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrGy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">二维状态空间：(城市, 时间) 联合状态</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">费用最低的路可能太慢，最快的路可能太贵 → 必须同时跟踪两个维度</text>

  <!-- ===== Left: conflict illustration ===== -->
  <text x="36" y="74" font-size="11" fill="#446688" font-weight="bold">费用 vs 时间的冲突</text>

  <!-- City 0 -->
  <circle cx="60" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="60" y="138" text-anchor="middle" font-size="9" fill="#888">费用5</text>

  <!-- City 5 -->
  <circle cx="60" cy="220" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="60" y="248" text-anchor="middle" font-size="9" fill="#888">费用3</text>

  <!-- Path A: cheap but slow (green) -->
  <path d="M 76 112 Q 130 130 130 165" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="118" y="128" font-size="9" fill="#4a7a3a" font-weight="bold">0→1</text>
  <text x="118" y="140" font-size="8" fill="#4a7a3a">10min</text>
  <circle cx="130" cy="165" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="169" text-anchor="middle" font-size="10" fill="#333">1</text>
  <path d="M 130 178 Q 130 195 130 208" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="196" font-size="9" fill="#4a7a3a" font-weight="bold">1→2→5</text>
  <text x="140" y="208" font-size="8" fill="#4a7a3a">+20min</text>

  <!-- Path A label -->
  <rect x="180" y="118" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="240" y="136" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">路径 A：便宜但慢</text>
  <text x="240" y="150" text-anchor="middle" font-size="9" fill="#555">费用 11，耗时 30min</text>
  <text x="240" y="162" text-anchor="middle" font-size="9" fill="#4a7a3a">maxTime≥30 时最优 ✓</text>

  <!-- Path B: expensive but fast (orange) -->
  <path d="M 76 114 Q 100 180 76 218" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="50" y="170" font-size="9" fill="#d6a040" font-weight="bold">0→3</text>
  <text x="50" y="182" font-size="8" fill="#d6a040">1min</text>

  <!-- Path B label -->
  <rect x="180" y="190" width="120" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="240" y="208" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">路径 B：贵但快</text>
  <text x="240" y="222" text-anchor="middle" font-size="9" fill="#555">费用 48，耗时 26min</text>
  <text x="240" y="234" text-anchor="middle" font-size="9" fill="#d6a040">maxTime&lt;30 时唯一合法 ✓</text>

  <!-- Conflict note -->
  <rect x="36" y="272" width="300" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="186" y="292" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠ 普通 Dijkstra 只看费用 → 锁定路径 A</text>
  <text x="186" y="306" text-anchor="middle" font-size="10" fill="#555">但 maxTime=29 时路径 A 超时！</text>
  <text x="186" y="320" text-anchor="middle" font-size="10" fill="#b85450">→ 必须把时间纳入状态</text>

  <!-- ===== Right: 2D state grid ===== -->
  <text x="400" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">状态空间 (城市 × 时间)</text>

  <!-- Grid axes -->
  <text x="400" y="90" text-anchor="middle" font-size="9" fill="#888">城市 →</text>
  <text x="360" y="110" font-size="9" fill="#888">时间↓</text>

  <!-- Time labels (rows) -->
  <text x="356" y="128" text-anchor="end" font-size="9" fill="#888">0</text>
  <text x="356" y="150" text-anchor="end" font-size="9" fill="#888">1</text>
  <text x="356" y="172" text-anchor="end" font-size="9" fill="#888">10</text>
  <text x="356" y="194" text-anchor="end" font-size="9" fill="#888">20</text>
  <text x="356" y="216" text-anchor="end" font-size="9" fill="#888">26</text>
  <text x="356" y="238" text-anchor="end" font-size="9" fill="#888">30</text>

  <!-- City labels (columns) -->
  <text x="372" y="112" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="396" y="112" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="420" y="112" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="444" y="112" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="468" y="112" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="492" y="112" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- Grid cells -->
  <!-- Row t=0: city 0 reachable -->
  <rect x="364" y="120" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="374" y="134" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">5</text>
  <rect x="388" y="120" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="412" y="120" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="436" y="120" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="120" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="484" y="120" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- Row t=1: city 3 reachable (cost 25) -->
  <rect x="364" y="142" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="388" y="142" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="412" y="142" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="436" y="142" width="20" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="446" y="156" text-anchor="middle" font-size="8" fill="#333">25</text>
  <rect x="460" y="142" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="484" y="142" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- Row t=10: city 1 reachable (cost 6) -->
  <rect x="364" y="164" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="388" y="164" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="398" y="178" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">6</text>
  <rect x="412" y="164" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="436" y="164" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="164" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="484" y="164" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- Row t=20: city 2 reachable (cost 8) -->
  <rect x="364" y="186" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="388" y="186" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="412" y="186" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="422" y="200" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">8</text>
  <rect x="436" y="186" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="186" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="484" y="186" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- Row t=26: city 5 via path B (cost 48) -->
  <rect x="364" y="208" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="388" y="208" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="412" y="208" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="436" y="208" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="208" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="484" y="208" width="20" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="494" y="222" text-anchor="middle" font-size="8" fill="#333">48</text>

  <!-- Row t=30: city 5 via path A (cost 11) -->
  <rect x="364" y="230" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="388" y="230" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="412" y="230" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="436" y="230" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="230" width="20" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="484" y="230" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="494" y="244" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">11</text>

  <!-- Transition arrows on grid -->
  <!-- (0,0) -> (1,10) -->
  <path d="M 380 130 Q 392 148 394 160" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- (1,10) -> (2,20) -->
  <path d="M 402 174 Q 412 182 414 182" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- (2,20) -> (5,30) -->
  <path d="M 428 196 Q 460 216 486 226" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- (0,0) -> (3,1) -->
  <path d="M 380 132 Q 410 140 442 148" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Right side: legend -->
  <rect x="360" y="272" width="170" height="80" fill="#f0f7ff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="290" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">状态转移</text>
  <text x="370" y="306" font-size="9" fill="#555">绿格 = 路径 A 经过状态</text>
  <text x="370" y="320" font-size="9" fill="#555">橙格 = 路径 B 经过状态</text>
  <text x="370" y="334" font-size="9" fill="#555">格中数字 = 该状态最小费用</text>
  <text x="370" y="348" font-size="9" fill="#888">Dijkstra 按费用排序弹出</text>

  <!-- Footer -->
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#888">把 (城市, 时间) 作为联合状态 → Dijkstra 在状态图上搜索 → 第一次弹出终点即最优</text>
</svg>
