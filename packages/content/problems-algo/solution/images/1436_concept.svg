<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：终点站 = 只作为「到达站」、从不作为「出发站」的城市</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#888">cityBi ∉ { 所有 cityAi } ⟺ 该城市没有出边 ⟺ 终点站</text>

  <!-- Chain of cities -->
  <rect x="55" y="80" width="110" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="106" text-anchor="middle" font-size="13" fill="#333">London</text>

  <rect x="195" y="80" width="110" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="106" text-anchor="middle" font-size="13" fill="#333">New York</text>

  <rect x="335" y="80" width="110" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="106" text-anchor="middle" font-size="13" fill="#333">Lima</text>

  <rect x="475" y="80" width="110" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="530" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Sao Paulo</text>
  <text x="530" y="70" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">★ 终点站</text>

  <!-- arrows between cities -->
  <path d="M 165 101 L 193 101" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 305 101 L 333 101" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 445 101 L 473 101" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="320" y="146" text-anchor="middle" font-size="10.5" fill="#888">每条箭头 = 一个 path = [cityAi, cityBi]；除终点外，每个城市都作为某条 path 的 cityAi</text>

  <!-- Sets section header -->
  <text x="320" y="176" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">把所有 cityAi 收进集合 starts，再扫所有 cityBi 找不在 starts 里的那个</text>

  <!-- starts set (blue) -->
  <rect x="40" y="196" width="270" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="218" font-size="12" fill="#446688" font-weight="bold">starts = { cityAi }</text>
  <text x="60" y="242" font-size="12" fill="#333">London, New York, Lima</text>
  <text x="60" y="264" font-size="10.5" fill="#888">有出边的城市（非终点候选）</text>

  <!-- ends set (green) -->
  <rect x="330" y="196" width="270" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="218" font-size="12" fill="#4a7a3a" font-weight="bold">ends = { cityBi }</text>
  <text x="350" y="242" font-size="12" fill="#333">New York, Lima, Sao Paulo</text>
  <text x="350" y="264" font-size="10.5" fill="#888">被到达的城市（含终点候选）</text>

  <!-- operation -->
  <text x="320" y="306" text-anchor="middle" font-size="12.5" fill="#444">终点 = ends 中不在 starts 里的元素</text>

  <!-- result box -->
  <rect x="160" y="322" width="320" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="344" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Sao Paulo ∉ starts ⟹ 返回 "Sao Paulo"</text>
  <text x="320" y="362" text-anchor="middle" font-size="10.5" fill="#888">无出边 ⟺ 只作为到达站出现</text>

  <!-- footer -->
  <text x="320" y="398" text-anchor="middle" font-size="10.5" fill="#888">一次建集合 O(n) + 一次扫 cityBi 查集合 O(n) = 总 O(n)</text>
</svg>
