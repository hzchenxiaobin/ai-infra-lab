<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">按值分层：一个色块 = 一次操作</text>

  <!-- ===== 示例 2：[3,1,2,1] ===== -->
  <text x="30" y="54" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例② [3, 1, 2, 1] → 3 次操作</text>

  <!-- 柱子（白底灰边） -->
  <rect x="58" y="122" width="46" height="90" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="114" y="182" width="46" height="30" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="170" y="152" width="46" height="60" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="226" y="182" width="46" height="30" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 层级刻度 -->
  <text x="48" y="141" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">v=3</text>
  <text x="48" y="171" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">v=2</text>
  <text x="48" y="201" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">v=1</text>

  <!-- 三个块（每次操作一个色块） -->
  <rect x="56" y="125" width="50" height="21" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="168" y="155" width="50" height="21" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="56" y="185" width="218" height="21" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- 柱值 -->
  <text x="81" y="231" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="137" y="231" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="193" y="231" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="249" y="231" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 操作标注 -->
  <text x="286" y="139" font-size="12" fill="#446688" filter="url(#rough2)">op③ v=3</text>
  <text x="286" y="169" font-size="12" fill="#c08020" filter="url(#rough2)">op② v=2（两侧 1&lt;2 被隔断）</text>
  <text x="286" y="199" font-size="12" fill="#4a7a3a" filter="url(#rough2)">op① v=1（整段一次）</text>

  <!-- 关键观察框 -->
  <rect x="296" y="62" width="208" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="400" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">关键观察</text>
  <text x="400" y="99" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">值 v 的段能穿过更大值，</text>
  <text x="400" y="113" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">却穿不过更小的值</text>

  <line x1="20" y1="248" x2="500" y2="248" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- ===== 示例 3：[1,2,1,2,1,2] ===== -->
  <text x="30" y="272" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例③ [1, 2, 1, 2, 1, 2] → 4 次操作</text>

  <!-- 柱子 -->
  <rect x="58" y="348" width="34" height="24" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="324" width="34" height="48" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="142" y="348" width="34" height="24" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="184" y="324" width="34" height="48" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="226" y="348" width="34" height="24" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="268" y="324" width="34" height="48" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 清零后的 1 变成隔断 -->
  <text x="75" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="159" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="243" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- v=1 整段一块 -->
  <rect x="56" y="352" width="248" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- v=2 被拆成三段 -->
  <rect x="98" y="328" width="38" height="15" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="182" y="328" width="38" height="15" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="266" y="328" width="38" height="15" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <!-- 柱值 -->
  <text x="75" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="117" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="159" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="201" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="243" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="285" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- 右侧标注 -->
  <text x="312" y="300" font-size="12" fill="#b85450" filter="url(#rough2)">清零后的 1 = 永久隔断</text>
  <path d="M310,306 L262,332" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="342" font-size="12" fill="#c08020" filter="url(#rough2)">op②~④：v=2 被拆成 3 段</text>
  <text x="312" y="368" font-size="12" fill="#4a7a3a" filter="url(#rough2)">op①：v=1 整段一次清完</text>
</svg>
