<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 530" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="530" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：滚动维护「以 i 结尾的 OR 值集合」</text>

  <rect x="160" y="36" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="55" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = +∞；ors = [ ]（空列表）</text>

  <path d="M 270 66 L 270 80" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="160" y="84" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="103" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">取下一个元素 x = nums[i]</text>

  <path d="M 270 114 L 270 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="160" y="132" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="151" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ors 末尾追加哨兵 0</text>

  <path d="M 270 162 L 270 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="160" y="180" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="199" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ors 中每个 v 替换为 v | x</text>

  <path d="M 270 210 L 270 224" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="160" y="228" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="247" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">相邻去重（列表保持降序）</text>

  <path d="M 270 258 L 270 272" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="160" y="276" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="295" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">每个 v：ans = min(ans, |v − k|)</text>

  <path d="M 270 306 L 270 320" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="205,352 270,322 335,352 270,382" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="357" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans == 0 ?</text>

  <path d="M 335 352 L 360 352" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="348" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="364" y="334" width="128" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="428" y="350" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 0</text>
  <text x="428" y="366" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（绝对差理论下界）</text>

  <path d="M 270 382 L 270 396" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="281" y="394" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <polygon points="205,430 270,400 335,430 270,460" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="435" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有元素 ?</text>

  <path d="M 205 430 L 92 430 L 92 99 L 156 99" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="190" y="423" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 270 460 L 270 476" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="281" y="472" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="160" y="480" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="501" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="384" y="132" width="120" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="444" y="154" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">每轮开销</text>
  <text x="444" y="174" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">列表长度 ≤ 30</text>
  <text x="444" y="192" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">去重+扫描 O(30)</text>
  <text x="444" y="210" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">总计 O(30n)</text>
  <text x="444" y="230" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">≈ 3×10⁶（n=10⁵）</text>
</svg>
