<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：特殊子串 ⇔（字符, 长度）—— 按连续段计数</text>

  <!-- ===== left top: run decomposition of aaabaaa ===== -->
  <text x="30" y="70" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">s =</text>

  <rect x="70" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="83" y="71" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="96" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="71" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="122" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="71" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="154" y="52" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="71" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">b</text>
  <rect x="186" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="71" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="212" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="71" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="238" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="71" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>

  <rect x="66" y="48" width="86" height="36" fill="none" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <rect x="150" y="48" width="34" height="36" fill="none" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <rect x="182" y="48" width="86" height="36" fill="none" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>

  <text x="109" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a 段 L=3</text>
  <text x="167" y="100" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">b 段 L=1</text>
  <text x="225" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a 段 L=3</text>

  <text x="167" y="126" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">拆成极大同字符段</text>
  <text x="167" y="146" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">runs：a: [3,3]　b: [1]</text>

  <!-- ===== left bottom: film strip L=5, k=2 ===== -->
  <text x="30" y="186" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">段长 L=5 的段内，k=2 的出现位置：</text>

  <rect x="64" y="196" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="77" y="213" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">c</text>
  <rect x="90" y="196" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="103" y="213" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">c</text>
  <rect x="116" y="196" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="129" y="213" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">c</text>
  <rect x="142" y="196" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="213" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">c</text>
  <rect x="168" y="196" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="181" y="213" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">c</text>

  <rect x="64" y="232" width="130" height="22" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="64" y="232" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="90" y="247" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">cc</text>
  <text x="205" y="247" font-size="10.5" fill="#555" filter="url(#rough2)">第 1 次</text>

  <rect x="64" y="258" width="130" height="22" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="90" y="258" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="116" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">cc</text>
  <text x="205" y="273" font-size="10.5" fill="#555" filter="url(#rough2)">第 2 次</text>

  <rect x="64" y="284" width="130" height="22" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="116" y="284" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="142" y="299" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">cc</text>
  <text x="205" y="299" font-size="10.5" fill="#555" filter="url(#rough2)">第 3 次</text>

  <rect x="64" y="310" width="130" height="22" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="142" y="310" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="168" y="325" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">cc</text>
  <text x="205" y="325" font-size="10.5" fill="#555" filter="url(#rough2)">第 4 次</text>

  <text x="130" y="358" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">L−k+1 = 5−2+1 = 4 次</text>
  <text x="130" y="376" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（k &gt; L 时该段贡献 0）</text>

  <!-- ===== right: three observations ===== -->
  <rect x="310" y="48" width="190" height="300" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="405" y="74" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">三条观察</text>

  <text x="405" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 特殊子串 ⇔ (c, k)</text>
  <text x="405" y="119" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同字符同长度 = 同一个串</text>

  <text x="405" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 段长 L 对长度 k</text>
  <text x="405" y="165" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">贡献 max(0, L−k+1) 次</text>

  <text x="405" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ k 变短 ⇒ 次数不减</text>
  <text x="405" y="211" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">可行长度是前缀区间</text>

  <path d="M 325 228 L 485 228" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <text x="405" y="256" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">count(c, k) =</text>
  <text x="405" y="278" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Σ max(0, L − k + 1)</text>
  <text x="405" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">≥ 3 即可行</text>
  <text x="405" y="332" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">26 个字符互相独立</text>
</svg>
