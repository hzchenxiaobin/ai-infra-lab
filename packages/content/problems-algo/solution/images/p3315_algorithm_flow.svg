<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：每个元素 O(1) —— 奇偶判断 + lowbit</text>

  <!-- 开始 -->
  <rect x="210" y="36" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">对每个 p ∈ nums</text>

  <path d="M 280 68 L 280 86" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断1：奇偶 -->
  <polygon points="280,88 372,124 280,160 188,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">p 是偶数？</text>
  <text x="280" y="137" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">（唯一的偶质数是 2）</text>

  <path d="M 372 124 L 392 124" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="382" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="392" y="106" width="116" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="128" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">ans[i] = −1</text>

  <path d="M 280 160 L 280 174" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="291" y="171" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 步骤2：lowbit -->
  <rect x="196" y="176" width="190" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="291" y="194" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">t = p + 1，low = t &amp; (−t)</text>
  <text x="291" y="212" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">= 2ᵐ（m：尾部连续 1 的个数）</text>

  <path d="M 291 220 L 291 236" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤3：减 -->
  <rect x="196" y="238" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="291" y="256" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans[i] = p − low / 2</text>
  <text x="291" y="274" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">清掉尾部 1 段的最高位</text>

  <path d="M 291 282 L 291 296" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断2：循环 -->
  <polygon points="280,298 356,324 280,350 204,324" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">还有下一个 p？</text>

  <path d="M 356 324 L 392 324" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="316" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="392" y="306" width="116" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="328" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 回环 -->
  <path d="M 204 324 L 40 324 L 40 52 L 206 52" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="216" y="316" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="120" y="46" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">取下一个 p，重复 n 次</text>

  <!-- 左侧注解：偶数无解 -->
  <rect x="56" y="168" width="130" height="56" fill="#ffffff" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="121" y="184" text-anchor="middle" font-size="9.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">偶数 p 无解：</text>
  <text x="121" y="198" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">x 与 x+1 一奇一偶</text>
  <text x="121" y="212" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">OR 最低位恒 1 → 必奇</text>

  <!-- 左下注解：复杂度 -->
  <rect x="56" y="250" width="130" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="121" y="265" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">总计 O(n)</text>
  <text x="121" y="279" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">每元素 O(1)：一次判奇</text>
  <text x="121" y="291" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">一次 lowbit</text>

  <!-- 右侧注解：lowbit -->
  <rect x="398" y="170" width="112" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="454" y="188" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">lowbit(x) = x &amp; (−x)</text>
  <text x="454" y="204" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">例：12 &amp; −12 = 4</text>

  <rect x="398" y="226" width="112" height="52" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="454" y="243" text-anchor="middle" font-size="9" fill="#7a5a20" filter="url(#rough2)">p = 11：</text>
  <text x="454" y="258" text-anchor="middle" font-size="9" fill="#7a5a20" filter="url(#rough2)">lowbit(12) = 4</text>
  <text x="454" y="273" text-anchor="middle" font-size="9" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">ans = 11 − 2 = 9</text>
</svg>
