<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：父边的去留 = 孩子边的「度数预算」</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[u][0] 预算 k ｜ dp[u][1] 预算 k−1（父边占 1 名额）</text>

  <!-- 左：树片段 -->
  <circle cx="112" cy="100" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="112" y="104" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">父p</text>

  <line x1="112" y1="115" x2="112" y2="168" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="122" y="146" font-size="9.5" fill="#b85450" filter="url(#rough2)">父边 wₚ（去留未定）</text>

  <circle cx="112" cy="188" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="112" y="193" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">u</text>

  <line x1="100" y1="202" x2="52" y2="268" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="112" y1="207" x2="112" y2="267" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="124" y1="202" x2="172" y2="268" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="45" cy="280" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="45" y="284" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">v₁</text>
  <circle cx="112" cy="280" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="284" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">v₂</text>
  <circle cx="179" cy="280" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="179" y="284" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">v₃</text>

  <text x="62" y="236" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">w₁</text>
  <text x="121" y="240" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">w₂</text>
  <text x="160" y="236" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">w₃</text>

  <!-- 右：状态与收益 -->
  <rect x="248" y="60" width="262" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="379" y="80" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">状态 0 ｜ 父边不保留</text>
  <text x="379" y="100" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">dp[u][0]：孩子边至多 k 条</text>

  <rect x="248" y="124" width="262" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="379" y="144" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">状态 1 ｜ 父边保留</text>
  <text x="379" y="164" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">dp[u][1]：占 1 名额，孩子边至多 k−1 条</text>

  <rect x="248" y="188" width="262" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="379" y="208" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">孩子边的边际收益</text>
  <text x="379" y="227" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">gain = dp[v][1] + w − dp[v][0]</text>
  <text x="379" y="245" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">即「保留比不保留多赚多少」</text>
  <text x="379" y="260" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">≤ 0 时坚决不保留</text>

  <!-- 底：gains 排序取正 -->
  <text x="260" y="310" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">gains 降序 → 预算内只取正的（部分背包式贪心）</text>

  <rect x="100" y="318" width="105" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="332" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+12 留</text>
  <rect x="215" y="318" width="55" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="332" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+5</text>
  <rect x="278" y="318" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="303" y="332" text-anchor="middle" font-size="10" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">−3 ✗</text>
  <text x="340" y="332" font-size="9.5" fill="#666" filter="url(#rough2)">预算再大也不取非正</text>

  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[u][s] = Σ dp[v][0] + 预算内正 gain 之和</text>
</svg>
