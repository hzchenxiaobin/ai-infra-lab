<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 5, k = 2 —— 递推表 vs 模拟删除</text>

  <!-- ===== DP Table ===== -->
  <text x="300" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">递推表（0 下标 ans，最终 +1）</text>

  <!-- Header row -->
  <rect x="55" y="60" width="490" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="145" y1="60" x2="145" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="255" y1="60" x2="255" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="415" y1="60" x2="415" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">规模 i</text>
  <text x="200" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">上轮 ans</text>
  <text x="335" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(ans+k) mod i</text>
  <text x="465" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">本轮 ans</text>

  <!-- Row i=1 -->
  <rect x="55" y="90" width="490" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="200" y="108" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="335" y="108" text-anchor="middle" font-size="11" fill="#888">基准：只剩 1 人</text>
  <text x="465" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Row i=2 -->
  <rect x="55" y="118" width="490" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="136" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="200" y="136" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="335" y="136" text-anchor="middle" font-size="11" fill="#333">(0+2) mod 2 = 0</text>
  <text x="465" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Row i=3 -->
  <rect x="55" y="146" width="490" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="200" y="164" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="335" y="164" text-anchor="middle" font-size="11" fill="#333">(0+2) mod 3 = 2</text>
  <text x="465" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row i=4 -->
  <rect x="55" y="174" width="490" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="200" y="192" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="335" y="192" text-anchor="middle" font-size="11" fill="#333">(2+2) mod 4 = 0</text>
  <text x="465" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Row i=5 (final highlight) -->
  <rect x="55" y="202" width="490" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="200" y="222" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="335" y="222" text-anchor="middle" font-size="11" fill="#333">(0+2) mod 5 = 2</text>
  <text x="465" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Result -->
  <rect x="120" y="240" width="360" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="261" font-size="11" fill="#555">赢家 =</text>
  <text x="190" y="262" font-size="13" fill="#4a7a3a" font-weight="bold">ans + 1 = 2 + 1 = 3</text>

  <!-- ===== Simulation strip ===== -->
  <text x="300" y="296" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">模拟删除（验证同一结果）</text>

  <!-- Round 1 -->
  <rect x="55" y="304" width="490" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="322" font-size="10" fill="#888">轮1</text>
  <text x="110" y="322" font-size="11" fill="#333">1  2  3  4  5</text>
  <text x="240" y="322" font-size="10" fill="#d6a040">—数 2→</text>
  <text x="300" y="322" font-size="11" fill="#b85450" font-weight="bold">删 2</text>
  <text x="360" y="322" font-size="10" fill="#888">剩</text>
  <text x="390" y="322" font-size="11" fill="#333">3  4  5  1</text>

  <!-- Round 2 -->
  <rect x="55" y="332" width="490" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="350" font-size="10" fill="#888">轮2</text>
  <text x="110" y="350" font-size="11" fill="#333">3  4  5  1</text>
  <text x="240" y="350" font-size="10" fill="#d6a040">—数 2→</text>
  <text x="300" y="350" font-size="11" fill="#b85450" font-weight="bold">删 4</text>
  <text x="360" y="350" font-size="10" fill="#888">剩</text>
  <text x="390" y="350" font-size="11" fill="#333">5  1  3</text>

  <!-- Round 3 -->
  <rect x="55" y="360" width="490" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="378" font-size="10" fill="#888">轮3</text>
  <text x="110" y="378" font-size="11" fill="#333">5  1  3</text>
  <text x="240" y="378" font-size="10" fill="#d6a040">—数 2→</text>
  <text x="300" y="378" font-size="11" fill="#b85450" font-weight="bold">删 1</text>
  <text x="360" y="378" font-size="10" fill="#888">剩</text>
  <text x="390" y="378" font-size="11" fill="#333">3  5</text>

  <!-- Round 4 (final) -->
  <rect x="55" y="388" width="490" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="407" font-size="10" fill="#4a7a3a">轮4</text>
  <text x="110" y="407" font-size="11" fill="#333">3  5</text>
  <text x="240" y="407" font-size="10" fill="#d6a040">—数 2→</text>
  <text x="300" y="407" font-size="11" fill="#b85450" font-weight="bold">删 5</text>
  <text x="360" y="407" font-size="10" fill="#4a7a3a">剩</text>
  <text x="390" y="407" font-size="12" fill="#4a7a3a" font-weight="bold">3  ✓ 赢家</text>

  <!-- Note -->
  <rect x="55" y="426" width="490" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="446" text-anchor="middle" font-size="11" fill="#666">递推法无需真的删除，只 ans=(ans+k)%i 迭代 4 次即得赢家 3，与模拟一致</text>
</svg>
