<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：滑动窗口 + XOR 撤销左端（双指针 O(n)）</text>

  <!-- Init -->
  <rect x="180" y="40" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化：mask=0, left=0, ans=1</text>
  <path d="M 280 74 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for-loop header -->
  <rect x="160" y="98" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for right = 0 → n-1：x = nums[right]</text>
  <path d="M 280 132 L 280 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,160 360,185 280,210 200,185" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mask &amp; x</text>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">!= 0 ?</text>

  <!-- Yes branch label -->
  <text x="372" y="178" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 360 185 L 398 185" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Yes box: shrink left via XOR -->
  <rect x="400" y="167" width="142" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="471" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mask ^= nums[left]</text>
  <text x="471" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">left += 1</text>

  <!-- Yes return: down, left, up to diamond left point (200,185) -->
  <path d="M 471 203 L 471 228 L 210 228 L 210 188" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="340" y="222" font-size="10" fill="#b85450">重新检测 mask &amp; x</text>

  <!-- No branch label -->
  <text x="288" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 280 210 L 280 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No box: add x, update ans -->
  <rect x="170" y="240" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">mask |= x</text>
  <text x="280" y="275" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = max(ans, right - left + 1)</text>

  <!-- next-right loopback: No box left -> up to for-header left -->
  <path d="M 170 262 L 120 262 L 120 115 L 158 115" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="84" y="200" font-size="10" fill="#4a7a3a">下一 right</text>

  <!-- exit to return ans: for-header right -> right edge -> down -> into return ans right -->
  <path d="M 400 115 L 548 115 L 548 337 L 352 337" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="250" font-size="10" fill="#888">遍历结束</text>

  <!-- return ans -->
  <rect x="210" y="320" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>

  <!-- side note -->
  <rect x="400" y="240" width="142" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" rx="8" filter="url(#rough2)"/>
  <text x="471" y="258" text-anchor="middle" font-size="10" fill="#888">优雅窗口里</text>
  <text x="471" y="272" text-anchor="middle" font-size="10" fill="#888">OR == XOR，故 ^ 可撤销</text>
</svg>
