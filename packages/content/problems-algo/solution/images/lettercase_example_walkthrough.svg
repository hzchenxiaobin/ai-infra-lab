<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "a1b2" 的决策树（4 条根到叶路径 = 4 个结果）</text>

  <text x="14" y="52" font-size="9" fill="#888">根</text>
  <text x="14" y="100" font-size="9" fill="#888">位0 a</text>
  <text x="14" y="148" font-size="9" fill="#888">位1 1</text>
  <text x="14" y="196" font-size="9" fill="#888">位2 b</text>
  <text x="14" y="244" font-size="9" fill="#888">位3 2</text>
  <text x="14" y="294" font-size="9" fill="#888">结果</text>

  <path d="M 300 61 L 150 83" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 300 61 L 450 83" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 150 109 L 150 131" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 450 109 L 450 131" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 150 157 L 84 179" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 150 157 L 216 179" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 450 157 L 384 179" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 450 157 L 516 179" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 84 205 L 84 227" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 216 205 L 216 227" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 384 205 L 384 227" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 516 205 L 516 227" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 84 253 L 84 275" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 216 253 L 216 275" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 384 253 L 384 275" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 516 253 L 516 275" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <circle cx="300" cy="48" r="13" fill="#eee" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#555">∅</text>

  <circle cx="150" cy="96" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <circle cx="450" cy="96" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">A</text>

  <circle cx="150" cy="144" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <circle cx="450" cy="144" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <circle cx="84" cy="192" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">b</text>
  <circle cx="216" cy="192" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="216" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B</text>
  <circle cx="384" cy="192" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">b</text>
  <circle cx="516" cy="192" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="516" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B</text>

  <circle cx="84" cy="240" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <circle cx="216" cy="240" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="216" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <circle cx="384" cy="240" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <circle cx="516" cy="240" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="516" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="52" y="278" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="84" y="295" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a1b2</text>
  <rect x="184" y="278" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="216" y="295" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a1B2</text>
  <rect x="352" y="278" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="384" y="295" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">A1b2</text>
  <rect x="484" y="278" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="516" y="295" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">A1B2</text>

  <rect x="40" y="316" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="326" font-size="9" fill="#666">字母（分支）</text>
  <rect x="150" y="316" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="326" font-size="9" fill="#666">数字（直通）</text>
  <rect x="260" y="316" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="326" font-size="9" fill="#666">结果串</text>
  <text x="340" y="326" font-size="9" fill="#888">字母位翻倍节点数，数字位节点数不变 → 2^k 个叶</text>
</svg>
