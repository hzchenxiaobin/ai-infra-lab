<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [2,1,3,1,2,3,3]</text>

  <!-- ===== Group value=2 ===== -->
  <text x="40" y="58" font-size="11" fill="#446688" font-weight="bold">值 2 → 下标组 [0, 4]，m=2，total=4</text>
  <!-- header -->
  <rect x="40" y="68" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="83" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i</text>
  <rect x="100" y="68" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="83" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">pᵢ</text>
  <rect x="160" y="68" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="83" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">prefix[i]</text>
  <rect x="240" y="68" width="180" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="83" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">pᵢ·(2i−m)+total−2·prefix</text>
  <rect x="420" y="68" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="83" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ans[pᵢ]</text>

  <!-- row i=0 -->
  <rect x="40" y="90" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="104" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="100" y="90" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="104" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="160" y="90" width="80" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="104" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="240" y="90" width="180" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="104" text-anchor="middle" font-size="9" fill="#555">0·(−2)+4−0 = 4</text>
  <rect x="420" y="90" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- row i=1 -->
  <rect x="40" y="110" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="124" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="100" y="110" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="124" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="160" y="110" width="80" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="240" y="110" width="180" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="124" text-anchor="middle" font-size="9" fill="#555">4·0+4−0 = 4</text>
  <rect x="420" y="110" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- ===== Group value=1 ===== -->
  <text x="40" y="156" font-size="11" fill="#4a7a3a" font-weight="bold">值 1 → 下标组 [1, 3]，m=2，total=4</text>
  <!-- row i=0 -->
  <rect x="40" y="166" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="180" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="100" y="166" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="180" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="160" y="166" width="80" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="240" y="166" width="180" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="180" text-anchor="middle" font-size="9" fill="#555">1·(−2)+4−0 = 2</text>
  <rect x="420" y="166" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row i=1 -->
  <rect x="40" y="186" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="200" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="100" y="186" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="200" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="160" y="186" width="80" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="240" y="186" width="180" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="200" text-anchor="middle" font-size="9" fill="#555">3·0+4−2 = 2</text>
  <rect x="420" y="186" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Group value=3 (highlight) ===== -->
  <text x="40" y="232" font-size="11" fill="#d6a040" font-weight="bold">值 3 → 下标组 [2, 5, 6]，m=3，total=13</text>
  <!-- row i=0 -->
  <rect x="40" y="242" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="256" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="100" y="242" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="256" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="160" y="242" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="256" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="240" y="242" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="256" text-anchor="middle" font-size="9" fill="#555">2·(−3)+13−0 = 7</text>
  <rect x="420" y="242" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- row i=1 -->
  <rect x="40" y="262" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="276" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="100" y="262" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="276" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="160" y="262" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="276" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="240" y="262" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="276" text-anchor="middle" font-size="9" fill="#555">5·(−1)+13−4 = 4</text>
  <rect x="420" y="262" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- row i=2 -->
  <rect x="40" y="282" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="296" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="100" y="282" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="296" text-anchor="middle" font-size="10" fill="#333">6</text>
  <rect x="160" y="282" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="296" text-anchor="middle" font-size="10" fill="#333">7</text>
  <rect x="240" y="282" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="296" text-anchor="middle" font-size="9" fill="#555">6·(1)+13−14 = 5</text>
  <rect x="420" y="282" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Final result bar -->
  <rect x="40" y="330" width="510" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="295" y="352" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">按原下标回填 → intervals</text>
  <text x="295" y="372" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">[4, 2, 7, 2, 4, 4, 5] ✓</text>

  <!-- bottom note -->
  <text x="295" y="410" text-anchor="middle" font-size="10" fill="#888">三组各自独立套公式，组内天然有序无需排序，总扫描 O(n)</text>
  <text x="295" y="426" text-anchor="middle" font-size="9" fill="#888">关注值 3 组：i=0 时 2i−m=−3（左侧少、右侧多，结果偏正）；i=2 时反号</text>
</svg>
