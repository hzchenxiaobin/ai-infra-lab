<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">N 叉树直径：在某节点处取「最深两个孩子」</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">孩子数量任意，取最大的两个高度相加（543 的 N 叉推广）</text>

  <!-- Non-path edges (dashed gray) -->
  <line x1="300" y1="92" x2="300" y2="134" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="204" y1="166" x2="216" y2="216" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Highlighted diameter path: 5 -> 3 -> 1 -> 4 -->
  <path d="M 150 232 L 190 152 L 300 72 L 410 152" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <!-- Root 1 (bend point) -->
  <circle cx="300" cy="72" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="300" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="332" y="76" font-size="11" fill="#b85450" font-weight="bold">折弯点</text>

  <!-- Child 3 (on path, orange) -->
  <circle cx="190" cy="152" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="214" y="157" font-size="10" fill="#d6a040" font-weight="bold">h=2</text>

  <!-- Child 2 (not on path, blue) -->
  <circle cx="300" cy="152" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="324" y="157" font-size="10" fill="#888">h=1</text>

  <!-- Child 4 (on path, red) -->
  <circle cx="410" cy="152" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="410" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="434" y="157" font-size="10" fill="#888">h=1</text>

  <!-- Child 5 (on path, red) -->
  <circle cx="150" cy="232" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="237" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="172" y="237" font-size="10" fill="#888">h=1</text>

  <!-- Child 6 (not on path, blue) -->
  <circle cx="230" cy="232" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="237" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="252" y="237" font-size="10" fill="#888">h=1</text>

  <!-- top2 annotation near root -->
  <text x="372" y="64" font-size="10" fill="#b85450" font-weight="bold">top2 = 2 + 1 = 3</text>
  <path d="M 370 68 L 340 70" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="30" y="275" width="500" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="299" font-size="13" fill="#333" font-weight="bold">经过 node 的路径边数 = 最深孩子 h₁ + 次深孩子 h₂</text>
  <text x="50" y="322" font-size="12" fill="#555">本例在节点 1：孩子高度 [2, 1, 1] → top2 = 2 + 1 = 3 ✓</text>
  <text x="50" y="344" font-size="11" fill="#888">• dfs(node) 返回 max(各孩子高度) + 1（与 543 的「max(left,right)+1」同构）</text>
  <text x="50" y="360" font-size="11" fill="#888">• 孩子不足两个时，缺位按 0 计（叶子 top2 = 0，ans 不变）</text>
</svg>
