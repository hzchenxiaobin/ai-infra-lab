<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：乘积的不同质因数 = 各元素不同质因数的「并集」</text>

  <!-- Top row: array elements nums = [2,4,3,7,10,6] -->
  <text x="40" y="62" font-size="12" fill="#888">nums</text>
  <rect x="70" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="69" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="69" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="230" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="69" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="310" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="69" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="390" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="69" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10</text>
  <rect x="470" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="494" y="69" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- Arrows down to factorization -->
  <path d="M 94 80 L 94 110" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 174 80 L 174 110" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 254 80 L 254 110" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 334 80 L 334 110" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 414 80 L 414 110" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 494 80 L 494 110" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Factorization boxes -->
  <rect x="68" y="110" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="94" y="128" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <rect x="148" y="110" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="174" y="128" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <rect x="228" y="110" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="254" y="128" text-anchor="middle" font-size="11" fill="#333">{3}</text>
  <rect x="308" y="110" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="334" y="128" text-anchor="middle" font-size="11" fill="#333">{7}</text>
  <rect x="388" y="110" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="414" y="128" text-anchor="middle" font-size="11" fill="#333">{2,5}</text>
  <rect x="468" y="110" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="494" y="128" text-anchor="middle" font-size="11" fill="#333">{2,3}</text>

  <!-- Converging arrows into union set -->
  <path d="M 94 136 L 300 180" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 174 136 L 300 180" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 254 136 L 300 180" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 334 136 L 300 180" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 414 136 L 300 180" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 494 136 L 300 180" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="540" y="158" text-anchor="middle" font-size="11" fill="#888">并集 ∪</text>

  <!-- Union set box -->
  <rect x="200" y="180" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="198" text-anchor="middle" font-size="12" fill="#2f5d20" font-weight="bold">不同质因数集合</text>
  <text x="300" y="216" text-anchor="middle" font-size="14" fill="#2f5d20" font-weight="bold">{2, 3, 5, 7}</text>

  <path d="M 300 224 L 300 252" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="240" y="252" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="278" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">返回 4</text>

  <!-- Right note: don't multiply -->
  <rect x="430" y="178" width="150" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="505" y="202" text-anchor="middle" font-size="12" fill="#b07820" font-weight="bold">⚠ 不要真去乘</text>
  <text x="505" y="224" text-anchor="middle" font-size="11" fill="#333">1000^(10^4) 会爆</text>
  <text x="505" y="244" text-anchor="middle" font-size="11" fill="#333">任何整数类型</text>
  <text x="505" y="268" text-anchor="middle" font-size="11" fill="#333">→ 只收集质因子</text>
  <text x="505" y="284" text-anchor="middle" font-size="11" fill="#888">进哈希集合</text>

  <!-- Bottom note: unique factorization -->
  <rect x="30" y="312" width="540" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="335" text-anchor="middle" font-size="12" fill="#333">依据：<tspan font-weight="bold">算术基本定理</tspan>（唯一分解）</text>
  <text x="300" y="352" text-anchor="middle" font-size="11" fill="#666">∏ nums[i] 的质因子 = 各 nums[i] 质因子的并；重数不影响「不同」计数</text>
</svg>
