<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：三点距离 = 2 × (max − min)，中间下标"白送"</text>

  <!-- 示例 2 的数组：值 2 出现在下标 2, 4, 6 -->
  <text x="202" y="46" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">i = 2 (min)</text>
  <text x="318" y="46" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">j = 4 (中间)</text>
  <text x="434" y="46" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">k = 6 (max)</text>

  <rect x="60" y="52" width="52" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="118" y="52" width="52" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="176" y="52" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="234" y="52" width="52" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <rect x="292" y="52" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="350" y="52" width="52" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="408" y="52" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="434" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="86" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="144" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="202" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="260" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="318" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="376" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="434" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>

  <!-- 跨度括弧 -->
  <path d="M 202 106 L 202 120 L 434 120 L 434 106" fill="none" stroke="#b85450" stroke-width="2"
        marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="318" y="138" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">跨度 k − i = 6 − 2 = 4</text>
  <text x="318" y="156" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">j 的贡献 (j−i) + (k−j) = k − i = 4，恰好再凑一个跨度</text>

  <!-- 公式框 -->
  <rect x="25" y="168" width="232" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="141" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">距离公式（设 i &lt; j &lt; k）</text>
  <text x="141" y="206" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">|i−j| + |j−k| + |k−i|</text>
  <text x="141" y="223" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">= (j−i) + (k−j) + (k−i) = 2(k−i)</text>
  <text x="141" y="241" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 距离只由两端下标决定！</text>

  <!-- 转化框 -->
  <rect x="270" y="168" width="225" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="382" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">问题转化</text>
  <text x="382" y="206" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">最小化距离 ⇔ 最小化同值三次出现跨度</text>
  <text x="382" y="223" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans = 2 × min( p[s+2] − p[s] )</text>
  <text x="382" y="241" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">p：某值升序的下标列表</text>

  <!-- 论证框 -->
  <rect x="25" y="258" width="470" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">为什么「相邻三次出现」就够？</text>
  <text x="260" y="297" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">任取同值三元组 (p[a], p[b], p[c])，a &lt; b &lt; c ⇒ c ≥ a + 2</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">故 p[c] − p[a] ≥ p[a+2] − p[a]：两端收紧到相邻出现只会更小</text>
  <text x="260" y="335" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">∴ 枚举相邻三次出现 (p[s], p[s+1], p[s+2]) 即可覆盖最优解</text>
</svg>
