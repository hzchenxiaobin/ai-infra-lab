<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="4.5" refY="7.5" orient="auto">
      <path d="M0,0 L4.5,7.5 L9,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：相邻互斥 ⇒ 独立集；只抬被选位置，代价逐点独立</text>

  <!-- 抬高标注 -->
  <path d="M 196 54 L 196 40" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="196" y="34" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">抬 4 → 6</text>
  <text x="324" y="44" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 已是峰（+0）</text>

  <!-- 数组 [5,2,1,4,3] -->
  <rect x="104" y="56" width="56" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="82" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">5</text>

  <rect x="168" y="56" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="196" y="82" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="232" y="56" width="56" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">1</text>

  <rect x="296" y="56" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="324" y="82" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="360" y="56" width="56" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="388" y="82" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">3</text>

  <!-- 下标与状态 -->
  <text x="132" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="196" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="260" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="324" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="388" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>

  <text x="132" y="126" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">端点 ✗</text>
  <text x="196" y="126" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">选中 c=4</text>
  <text x="260" y="126" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">不选</text>
  <text x="324" y="126" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">选中 c=0</text>
  <text x="388" y="126" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">端点 ✗</text>

  <!-- 相邻矛盾示意 -->
  <text x="164" y="150" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">nums[i] &gt; nums[i+1]</text>
  <rect x="95" y="158" width="58" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="180" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">峰 i</text>
  <rect x="175" y="158" width="58" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="204" y="180" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">峰 i+1</text>
  <path d="M 152 160 L 176 190" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 176 160 L 152 190" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="164" y="206" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">nums[i+1] &gt; nums[i]</text>

  <rect x="268" y="146" width="204" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="165" text-anchor="middle" font-size="10.5" fill="#8f3a34" font-weight="bold" filter="url(#rough2)">两个严格大于不能同时成立</text>
  <text x="370" y="181" text-anchor="middle" font-size="10" fill="#8f3a34" filter="url(#rough2)">⇒ 相邻位置互斥，特殊集合</text>
  <text x="370" y="197" text-anchor="middle" font-size="10" fill="#8f3a34" filter="url(#rough2)">是 1..n−2 上的独立集</text>

  <!-- 代价公式 -->
  <rect x="60" y="218" width="400" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">c(i) = max(0, max(nums[i−1], nums[i+1]) + 1 − nums[i])</text>
  <text x="260" y="256" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">邻居不选且永不抬高 ⇒ 门槛 = 原始邻居值；总代价 = Σ c(i)，逐点独立可加</text>

  <!-- 问题坍缩 -->
  <rect x="60" y="276" width="400" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">问题坍缩：路径 1..n−2 上选独立集，先最大化个数、再最小化 Σ c(i)</text>
  <text x="260" y="314" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">任何独立集都可达（值可无限抬）⇒ 最大个数 = ⌈(n−2)/2⌉；打家劫舍骨架 + 字典序双目标</text>

  <!-- 图例 -->
  <rect x="60" y="342" width="14" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="352" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">选中为特殊（抬到 max(邻居)+1）</text>
  <rect x="300" y="342" width="14" height="12" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="352" font-size="9.5" fill="#888" filter="url(#rough2)">不选 / 端点，保持原值</text>
</svg>
