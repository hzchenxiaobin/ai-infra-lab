<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：UNION ALL → 求总分 → 分组排名 → 取每组第一</text>

  <!-- ===== Left: UNION ALL + GROUP BY result ===== -->
  <text x="120" y="52" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">GROUP BY player_id, SUM(score)</text>

  <!-- header -->
  <rect x="40" y="58" width="160" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="73" font-size="9" fill="#333">player_id</text>
  <text x="135" y="73" font-size="9" fill="#333">total_score</text>
  <line x1="100" y1="58" x2="100" y2="80" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- data rows -->
  <rect x="40" y="80" width="160" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="65" y="93" font-size="9.5" fill="#446688" font-weight="bold">15</text>
  <text x="135" y="93" font-size="9.5" fill="#446688" font-weight="bold">5</text>
  <line x1="100" y1="80" x2="100" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="40" y="98" width="160" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="65" y="111" font-size="9.5" fill="#333">30</text>
  <text x="135" y="111" font-size="9.5" fill="#333">3</text>
  <line x1="100" y1="98" x2="100" y2="116" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="40" y="116" width="160" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="65" y="129" font-size="9.5" fill="#333">25</text>
  <text x="135" y="129" font-size="9.5" fill="#333">2</text>
  <line x1="100" y1="116" x2="100" y2="134" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="40" y="134" width="160" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="65" y="147" font-size="9.5" fill="#333">40</text>
  <text x="135" y="147" font-size="9.5" fill="#333">5</text>
