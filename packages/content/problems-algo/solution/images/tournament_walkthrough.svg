  <rect x="40" y="188" width="160" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="65" y="201" font-size="9.5" fill="#333">50</text>
  <text x="135" y="201" font-size="9.5" fill="#333">1</text>
  <line x1="100" y1="188" x2="100" y2="206" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="40" y="206" width="160" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="65" y="219" font-size="9.5" fill="#333">45</text>
  <text x="135" y="219" font-size="9.5" fill="#333">0</text>
  <line x1="100" y1="206" x2="100" y2="224" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- arrow right -->
  <path d="M200 143 L240 143" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="220" y="138" text-anchor="middle" font-size="8" fill="#d6a040">JOIN</text>

  <!-- ===== Middle: JOIN Players + ROW_NUMBER ===== -->
  <text x="380" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">JOIN Players + ROW_NUMBER</text>

  <!-- header -->
  <rect x="260" y="58" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="73" font-size="8.5" fill="#333">group_id</text>
  <text x="328" y="73" font-size="8.5" fill="#333">player_id</text>
  <text x="380" y="73" font-size="8.5" fill="#333">total</text>
  <text x="430" y="73" font-size="8.5" fill="#333">rn</text>
  <line x1="305" y1="58" x2="305" y2="80" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="58" x2="355" y2="80" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="405" y1="58" x2="405" y2="80" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Group 1 separator -->
  <text x="252" y="93" font-size="8" fill="#446688" font-weight="bold">G1</text>

  <!-- Group 1 rows -->
  <rect x="260" y="80" width="240" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="278" y="93" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="328" y="93" font-size="9" fill="#446688" font-weight="bold">15</text>
  <text x="380" y="93" font-size="9" fill="#446688" font-weight="bold">5</text>
  <text x="430" y="93" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <line x1="305" y1="80" x2="305" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="80" x2="355" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="405" y1="80" x2="405" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="260" y="98" width="240" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="278" y="111" font-size="9" fill="#333">1</text>
  <text x="328" y="111" font-size="9" fill="#333">30</text>
  <text x="380" y="111" font-size="9" fill="#333">3</text>
  <text x="430" y="111" font-size="9" fill="#999">2</text>
  <line x1="305" y1="98" x2="305" y2="116" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="98" x2="355" y2="116" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="405" y1="98" x2="405" y2="116" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="260" y="116" width="240" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="278" y="129" font-size="9" fill="#333">1</text>
