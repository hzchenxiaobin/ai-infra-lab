  <!-- Group 3 rows -->
  <rect x="260" y="220" width="240" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="278" y="233" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <text x="328" y="233" font-size="9" fill="#d6a040" font-weight="bold">40</text>
  <text x="380" y="233" font-size="9" fill="#d6a040" font-weight="bold">5</text>
  <text x="430" y="233" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <line x1="305" y1="220" x2="305" y2="238" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="220" x2="355" y2="238" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="405" y1="220" x2="405" y2="238" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="260" y="238" width="240" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="278" y="251" font-size="9" fill="#333">3</text>
  <text x="328" y="251" font-size="9" fill="#333">20</text>
  <text x="380" y="251" font-size="9" fill="#333">2</text>
  <text x="430" y="251" font-size="9" fill="#999">2</text>
  <line x1="305" y1="238" x2="305" y2="256" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="238" x2="355" y2="256" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="405" y1="238" x2="405" y2="256" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- arrow down to winners -->
  <path d="M380 262 L380 280" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="276" font-size="9" fill="#b85450" font-weight="bold">WHERE rn = 1</text>

  <!-- ===== Bottom: Winners ===== -->
  <text x="380" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果（每组优胜者）</text>

  <rect x="300" y="302" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="317" font-size="9" fill="#333">group_id</text>
  <text x="395" y="317" font-size="9" fill="#333">player_id</text>
  <line x1="360" y1="302" x2="360" y2="324" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="300" y="324" width="160" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="325" y="337" font-size="9.5" fill="#446688" font-weight="bold">1</text>
  <text x="395" y="337" font-size="9.5" fill="#446688" font-weight="bold">15</text>
  <line x1="360" y1="324" x2="360" y2="342" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="300" y="342" width="160" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="325" y="355" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="395" y="355" font-size="9.5" fill="#4a7a3a" font-weight="bold">35</text>
  <line x1="360" y1="342" x2="360" y2="360" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="300" y="360" width="160" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="325" y="373" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="395" y="373" font-size="9.5" fill="#d6a040" font-weight="bold">40</text>
  <line x1="360" y1="360" x2="360" y2="378" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- ===== Callout boxes (bottom) ===== -->

  <!-- Group 1 callout -->
  <rect x="20" y="300" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="35" y="318" font-size="9.5" fill="#446688" font-weight="bold">Group 1：15 号总分 5（最高）</text>
  <text x="35" y="332" font-size="9" fill="#555">match 1 得 3 + match 3 得 2 = 5</text>

  <!-- Group 2 callout (tie-breaking highlight) -->
  <rect x="20" y="352" width="260" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="35" y="370" font-size="9.5" fill="#b85450" font-weight="bold">Group 2：35 与 50 并列总分 1</text>
  <text x="35" y="384" font-size="9" fill="#555">tie-breaking → player_id 更小者胜</text>
  <text x="35" y="398" font-size="9" fill="#b85450" font-weight="bold">35 &lt; 50 → 35 号当选 ✓</text>

  <!-- Group 3 callout -->
  <rect x="20" y="416" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="35" y="434" font-size="9.5" fill="#d6a040" font-weight="bold">Group 3：40 号总分 5（最高）</text>
  <text x="35" y="448" font-size="9" fill="#555">match 4 得 5，无并列</text>

  <!-- arrow from group 2 callout to row 35 -->
  <path d="M280 380 L295 351" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- note about player 10 -->
  <rect x="480" y="198" width="130" height="36" fill="#fafafa" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="495" y="213" font-size="8" fill="#999">10 号未参赛</text>
  <text x="495" y="225" font-size="8" fill="#999">LEFT JOIN → total=0</text>
</svg>
