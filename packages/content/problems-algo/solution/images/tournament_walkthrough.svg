  <text x="380" y="129" font-size="9" fill="#333">2</text>
  <text x="430" y="129" font-size="9" fill="#999">3</text>
  <line x1="305" y1="116" x2="305" y2="134" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="116" x2="355" y2="134" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="405" y1="116" x2="405" y2="134" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="260" y="134" width="240" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="278" y="147" font-size="9" fill="#333">1</text>
  <text x="328" y="147" font-size="9" fill="#333">45</text>
  <text x="380" y="147" font-size="9" fill="#333">0</text>
  <text x="430" y="147" font-size="9" fill="#999">4</text>
  <line x1="305" y1="134" x2="305" y2="152" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="134" x2="355" y2="152" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="405" y1="134" x2="405" y2="152" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Group 2 separator -->
  <text x="252" y="175" font-size="8" fill="#4a7a3a" font-weight="bold">G2</text>

  <!-- Group 2 rows -->
  <rect x="260" y="162" width="240" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="278" y="175" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="328" y="175" font-size="9" fill="#4a7a3a" font-weight="bold">35</text>
  <text x="380" y="175" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="430" y="175" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <line x1="305" y1="162" x2="305" y2="180" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="162" x2="355" y2="180" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="405" y1="162" x2="405" y2="180" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="260" y="180" width="240" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="193" font-size="9" fill="#333">2</text>
  <text x="328" y="193" font-size="9" fill="#333">50</text>
  <text x="380" y="193" font-size="9" fill="#333">1</text>
  <text x="430" y="193" font-size="9" fill="#999">2</text>
  <line x1="305" y1="180" x2="305" y2="198" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="180" x2="355" y2="198" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="405" y1="180" x2="405" y2="198" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="260" y="198" width="240" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="278" y="211" font-size="9" fill="#333">2</text>
  <text x="328" y="211" font-size="9" fill="#999">10</text>
  <text x="380" y="211" font-size="9" fill="#999">0</text>
  <text x="430" y="211" font-size="9" fill="#999">3</text>
  <line x1="305" y1="198" x2="305" y2="216" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="198" x2="355" y2="216" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="405" y1="198" x2="405" y2="216" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Group 3 separator -->
