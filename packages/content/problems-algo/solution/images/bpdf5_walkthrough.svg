<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：逐位取模递推过程
  </text>

  <!-- ======== Example 1: nums = [0, 1, 1] ======== -->
  <text x="40" y="54" font-size="12" fill="#555" filter="url(#rough2)">示例 1：nums = [0, 1, 1]</text>

  <!-- Header row -->
  <g filter="url(#rough2)">
    <rect x="40" y="62" width="50" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="90" y="62" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="62" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="210" y="62" width="170" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="380" y="62" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="440" y="62" width="100" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="65" y="79">i</text>
    <text x="120" y="79">nums[i]</text>
    <text x="180" y="79">r_{i-1}</text>
    <text x="295" y="79">r_{i-1} × 2 + nums[i]</text>
    <text x="410" y="79">r_i</text>
    <text x="490" y="79">answer[i]</text>
  </g>

  <!-- Row 0: i=0, nums[0]=0, r_prev=0, 0×2+0=0, r=0, true -->
  <g filter="url(#rough2)">
    <rect x="40" y="88" width="50" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="90" y="88" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="88" width="60" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="210" y="88" width="170" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="380" y="88" width="60" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="440" y="88" width="100" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="65" y="106">0</text>
    <text x="120" y="106">0</text>
    <text x="180" y="106">0</text>
    <text x="295" y="106">0 × 2 + 0 = 0</text>
    <text x="410" y="106" font-weight="bold">0</text>
    <text x="490" y="106" fill="#4a7a3a" font-weight="bold">true ✓</text>
  </g>

  <!-- carry arrow r_0 -> r_1 (down) -->
  <path d="M410,114 L410,120 L180,120 L180,126" fill="none" stroke="#d6a040"
        stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 1: i=1, nums[1]=1, r_prev=0, 0×2+1=1, r=1, false -->
  <g filter="url(#rough2)">
    <rect x="40" y="114" width="50" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="90" y="114" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="114" width="60" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="210" y="114" width="170" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="380" y="114" width="60" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="440" y="114" width="100" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="65" y="132">1</text>
    <text x="120" y="132">1</text>
    <text x="180" y="132">0</text>
    <text x="295" y="132">0 × 2 + 1 = 1</text>
    <text x="410" y="132">1</text>
    <text x="490" y="132" fill="#b85450">false</text>
  </g>

  <!-- carry arrow r_1 -> r_2 -->
  <path d="M410,140 L410,146 L180,146 L180,152" fill="none" stroke="#d6a040"
        stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: i=2, nums[2]=1, r_prev=1, 1×2+1=3, r=3, false -->
  <g filter="url(#rough2)">
    <rect x="40" y="140" width="50" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="90" y="140" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="140" width="60" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="210" y="140" width="170" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="380" y="140" width="60" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="440" y="140" width="100" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="65" y="158">2</text>
    <text x="120" y="158">1</text>
    <text x="180" y="158">1</text>
    <text x="295" y="158">1 × 2 + 1 = 3</text>
    <text x="410" y="158">3</text>
    <text x="490" y="158" fill="#b85450">false</text>
  </g>

  <!-- ======== Example 2: nums = [1, 0, 1] ======== -->
  <text x="40" y="194" font-size="12" fill="#555" filter="url(#rough2)">示例 2：nums = [1, 0, 1]</text>

  <!-- Header row -->
  <g filter="url(#rough2)">
    <rect x="40" y="202" width="50" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="90" y="202" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="202" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="210" y="202" width="170" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="380" y="202" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="440" y="202" width="100" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="65" y="219">i</text>
    <text x="120" y="219">nums[i]</text>
    <text x="180" y="219">r_{i-1}</text>
    <text x="295" y="219">r_{i-1} × 2 + nums[i]</text>
    <text x="410" y="219">r_i</text>
    <text x="490" y="219">answer[i]</text>
  </g>

  <!-- Row 0: i=0, nums[0]=1, r_prev=0, 0×2+1=1, r=1, false -->
  <g filter="url(#rough2)">
    <rect x="40" y="228" width="50" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="90" y="228" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="228" width="60" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="210" y="228" width="170" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="380" y="228" width="60" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="440" y="228" width="100" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="65" y="246">0</text>
    <text x="120" y="246">1</text>
    <text x="180" y="246">0</text>
    <text x="295" y="246">0 × 2 + 1 = 1</text>
    <text x="410" y="246">1</text>
    <text x="490" y="246" fill="#b85450">false</text>
  </g>

  <path d="M410,254 L410,260 L180,260 L180,266" fill="none" stroke="#d6a040"
        stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 1: i=1, nums[1]=0, r_prev=1, 1×2+0=2, r=2, false -->
  <g filter="url(#rough2)">
    <rect x="40" y="254" width="50" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="90" y="254" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="254" width="60" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="210" y="254" width="170" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="380" y="254" width="60" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="440" y="254" width="100" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="65" y="272">1</text>
    <text x="120" y="272">0</text>
    <text x="180" y="272">1</text>
    <text x="295" y="272">1 × 2 + 0 = 2</text>
    <text x="410" y="272">2</text>
    <text x="490" y="272" fill="#b85450">false</text>
  </g>

  <path d="M410,280 L410,286 L180,286 L180,292" fill="none" stroke="#d6a040"
        stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: i=2, nums[2]=1, r_prev=2, 2×2+1=5, r=0, true -->
  <g filter="url(#rough2)">
    <rect x="40" y="280" width="50" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="90" y="280" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="280" width="60" height="26" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="210" y="280" width="170" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="380" y="280" width="60" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="440" y="280" width="100" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="65" y="298">2</text>
    <text x="120" y="298">1</text>
    <text x="180" y="298">2</text>
    <text x="295" y="298" font-weight="bold">2 × 2 + 1 = 5</text>
    <text x="410" y="298" font-weight="bold">0</text>
    <text x="490" y="298" fill="#4a7a3a" font-weight="bold">true ✓</text>
  </g>

  <!-- Note box -->
  <rect x="40" y="326" width="500" height="56" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="348" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    虚线箭头：r_i 传递到下一步的 r_{i-1}，只需 0–4 的余数即可续推
  </text>
  <text x="290" y="368" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    示例 2 最后一步 5 mod 5 = 0 → 整除 → answer[2] = true
  </text>
</svg>
