<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：数 letter 次数 cnt → cnt×100÷n 向下取整</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">以 s="foobar", letter='o' 为例：n=6，命中 2 次</text>

  <!-- index labels -->
  <text x="140" y="74" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="192" y="74" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="244" y="74" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="296" y="74" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="348" y="74" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="400" y="74" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- string "foobar"; 'o' at idx 1,2 highlighted -->
  <rect x="117" y="80" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="104" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">f</text>
  <rect x="169" y="80" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="192" y="104" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">o</text>
  <rect x="221" y="80" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="104" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">o</text>
  <rect x="273" y="80" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="296" y="104" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="325" y="80" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="348" y="104" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="377" y="80" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="400" y="104" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">r</text>

  <!-- count bracket over the two 'o' (idx 1,2) -->
  <path d="M 169 122 Q 169 130 180 132 L 256 132 Q 267 130 267 122" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="218" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cnt = 2</text>

  <!-- n bracket over whole string -->
  <path d="M 117 158 Q 117 166 128 168 L 412 168 Q 423 166 423 158" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n = len(s) = 6</text>

  <!-- arrow down to formula -->
  <path d="M 270 190 Q 270 200 270 208" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="60" y="214" width="420" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">ans = ⌊cnt × 100 / n⌋ = ⌊2×100/6⌋ = ⌊33.33⌋ = 33</text>
  <text x="270" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a">非负整数除法天然向下取整</text>

  <!-- contrast: correct vs wrong -->
  <rect x="40" y="288" width="460" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="308" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 先乘后除</text>
  <text x="150" y="308" font-size="12" fill="#333" font-weight="bold">cnt × 100 // n  →  200 // 6 = 33</text>
  <text x="58" y="330" font-size="10.5" fill="#4a7a3a">先放大 100 倍保留精度，最后整数除法取整一次</text>

  <rect x="40" y="356" width="460" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="376" font-size="12" fill="#b85450" font-weight="bold">✗ 先除后乘</text>
  <text x="150" y="376" font-size="12" fill="#333" font-weight="bold">cnt // n × 100  →  2 // 6 = 0  →  0 × 100 = 0</text>
  <text x="58" y="398" font-size="10.5" fill="#b85450">过早取整把 0.33 抹成 0，精度全丢</text>
</svg>
