<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两趟扫描，均为 O(n)</text>

  <!-- ===== Pass 1 ===== -->
  <rect x="30" y="36" width="460" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="58" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 第一趟 ← 从右向左：预计算 suf[i] = nums[i..n−1] 不同元素数</text>

  <rect x="190" y="70" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">suf[n] = 0（边界）</text>

  <path d="M 260 100 L 260 116" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,120 350,154 260,188 170,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &gt;= 0 ?</text>
  <text x="260" y="168" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i 从 n−1 递减</text>

  <path d="M 350 154 L 420 154" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="148" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="408" y="140" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="446" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">完成 suf</text>

  <path d="M 260 188 L 260 206" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="202" font-size="10" fill="#888" filter="url(#rough2)">是</text>

  <rect x="96" y="210" width="328" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt[nums[i]]==0 ? suf[i]=suf[i+1]+1 : suf[i+1]</text>

  <path d="M 96 225 L 60 225 L 60 154 L 170 154" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="68" y="190" font-size="10" fill="#888" filter="url(#rough2)">i−−</text>

  <!-- connector -->
  <path d="M 260 244 L 260 276" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Pass 2 ===== -->
  <rect x="30" y="286" width="460" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="308" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 第二趟 → 从左向右：维护 pre，写 diff[i] = pre − suf[i+1]</text>

  <rect x="180" y="320" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">pre=0, seen 清空</text>

  <path d="M 260 350 L 260 366" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,370 350,404 260,438 170,404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="418" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i 从 0 递增</text>

  <path d="M 350 404 L 420 404" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="408" y="390" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="446" y="410" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">返回 diff</text>

  <path d="M 260 438 L 260 456" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="452" font-size="10" fill="#888" filter="url(#rough2)">是</text>

  <rect x="76" y="460" width="368" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="480" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">seen[nums[i]]==0 ? pre++ ; diff[i]=pre−suf[i+1]</text>

  <path d="M 76 475 L 60 475 L 60 404 L 170 404" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="68" y="440" font-size="10" fill="#888" filter="url(#rough2)">i++</text>
</svg>
