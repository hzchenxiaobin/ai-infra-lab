<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：courses = [[7,11],[2,12],[5,12],[6,14]]</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">排序后顺序不变（lastDay 已升序）</text>

  <!-- Column headers -->
  <rect x="20" y="50" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤</text>
  <text x="120" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">课程(d,dl)</text>
  <text x="190" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">time</text>
  <text x="260" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">判断</text>
  <text x="370" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">决策</text>
  <text x="470" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">堆</text>

  <!-- Step 1 -->
  <rect x="20" y="78" width="520" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="86" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="121" y="104" text-anchor="middle" font-size="9.5" fill="#333">7, 11</text>
  <text x="190" y="96" text-anchor="middle" font-size="10" fill="#888">0→</text>
  <text x="190" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="260" y="104" text-anchor="middle" font-size="10" fill="#333">0+7=7 ≤ 11</text>
  <rect x="340" y="86" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="370" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">选课 ✓</text>
  <rect x="444" y="86" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="104" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">{7}</text>

  <!-- Step 2 -->
  <rect x="20" y="124" width="520" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="96" y="132" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="121" y="150" text-anchor="middle" font-size="9.5" fill="#333">2, 12</text>
  <text x="190" y="142" text-anchor="middle" font-size="10" fill="#888">7→</text>
  <text x="190" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <text x="260" y="150" text-anchor="middle" font-size="10" fill="#333">7+2=9 ≤ 12</text>
  <rect x="340" y="132" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="370" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">选课 ✓</text>
  <rect x="444" y="132" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="150" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">{7,2}</text>

  <!-- Step 3: REPLACEMENT -->
  <rect x="20" y="170" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="198" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <rect x="96" y="178" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="121" y="196" text-anchor="middle" font-size="9.5" fill="#333">5, 12</text>
  <text x="190" y="186" text-anchor="middle" font-size="9.5" fill="#888">9</text>
  <text x="190" y="200" text-anchor="middle" font-size="9.5" fill="#888">↓</text>
  <text x="190" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <text x="260" y="186" text-anchor="middle" font-size="9.5" fill="#b85450">9+5=14 &gt; 12 ✗</text>
  <text x="260" y="200" text-anchor="middle" font-size="9.5" fill="#d6a040">堆顶 7 &gt; 5 ?</text>
  <text x="260" y="214" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">是 → 替换</text>
  <rect x="334" y="178" width="72" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="196" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">替换 ⚡</text>
  <rect x="440" y="178" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="470" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">{5,2}</text>

  <!-- Step 4 -->
  <rect x="20" y="232" width="520" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="96" y="240" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="121" y="258" text-anchor="middle" font-size="9.5" fill="#333">6, 14</text>
  <text x="190" y="250" text-anchor="middle" font-size="10" fill="#888">7→</text>
  <text x="190" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">13</text>
  <text x="260" y="258" text-anchor="middle" font-size="10" fill="#333">7+6=13 ≤ 14</text>
  <rect x="340" y="240" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="370" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">选课 ✓</text>
  <rect x="440" y="240" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="258" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">{6,5,2}</text>

  <!-- Result -->
  <rect x="20" y="284" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果：heap.size() = 3 门课 ✓</text>

  <!-- Comparison: without replacement -->
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">对比：若步骤 3 不替换（直接跳过）</text>

  <rect x="40" y="348" width="480" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <text x="60" y="368" font-size="9.5" fill="#333" font-weight="bold">步骤3</text>
  <rect x="100" y="356" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="371" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">跳过 ✗</text>
  <text x="180" y="371" font-size="9.5" fill="#888">time=9, heap={7,2}</text>

  <text x="60" y="396" font-size="9.5" fill="#333" font-weight="bold">步骤4</text>
  <rect x="100" y="384" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="399" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">跳过 ✗</text>
  <text x="180" y="399" font-size="9.5" fill="#888">9+6=15 &gt; 14, 装不下</text>

  <rect x="380" y="372" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="392" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结果：仅 2 门 ✗</text>

  <!-- bottom note -->
  <rect x="30" y="420" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="440" font-size="10" fill="#333">⚡ <tspan fill="#d6a040" font-weight="bold">替换的威力</tspan>：步骤 3 把 d=7 换成 d=5，time 从 9 降到 7，</text>
  <text x="50" y="456" font-size="10" fill="#333">为步骤 4 (d=6) 腾出空间。课程数不变但总时长减少 → 后续更容易塞下</text>
</svg>
