<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">两条方向相反的约束：纵向相等 ↔ 横向不等</text>

  <!-- 2x3 grid, cell 48, vgap 30, hgap 34, origin (60,78) -->
  <!-- row 0 -->
  <rect x="60" y="78" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="78" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="78" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- row 1 -->
  <rect x="60" y="156" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="156" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="156" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- values (example 1) -->
  <text x="84" y="107" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="166" y="107" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="248" y="107" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="84" y="185" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="166" y="185" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="248" y="185" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <!-- vertical double arrows (equal) in row gap -->
  <path d="M 84 128 L 84 154" stroke="#446688" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)" filter="url(#rough2)"/>
  <path d="M 166 128 L 166 154" stroke="#446688" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)" filter="url(#rough2)"/>
  <path d="M 248 128 L 248 154" stroke="#446688" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="146" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="178" y="146" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="260" y="146" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>

  <!-- horizontal "not equal" marks in column gaps -->
  <text x="125" y="108" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="207" y="108" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="125" y="186" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="207" y="186" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>

  <!-- legend -->
  <rect x="320" y="70" width="222" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="334" y="90" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">纵向：等于下邻（若存在）</text>
  <text x="334" y="110" font-size="11.5" fill="#446688" filter="url(#rough2)">grid[i][j] == grid[i+1][j]</text>

  <rect x="320" y="136" width="222" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="334" y="156" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">横向：不等于右邻（若存在）</text>
  <text x="334" y="176" font-size="11.5" fill="#b85450" filter="url(#rough2)">grid[i][j] != grid[i][j+1]</text>

  <!-- bottom notes -->
  <rect x="320" y="204" width="222" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="334" y="226" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">· 最后一行没有下邻，最后一列没有右邻</text>
  <text x="334" y="246" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">  对应约束自动豁免，无需特判</text>
  <text x="334" y="266" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">· 图中即示例 1：全部满足 → true</text>

  <text x="164" y="240" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只有边界格子单侧豁免</text>
  <text x="164" y="258" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">其余格子两条约束都要查</text>
</svg>
