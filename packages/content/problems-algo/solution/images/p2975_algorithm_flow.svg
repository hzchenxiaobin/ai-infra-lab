<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：对差入集合 → 查交集 → 取最大平方</text>

  <!-- start -->
  <ellipse cx="240" cy="54" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="58" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 240 70 L 240 80" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- build H/V -->
  <rect x="118" y="84" width="244" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="105" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">H ← hFences ∪ {1, m}；V ← vFences ∪ {1, n}，排序</text>
  <path d="M 240 118 L 240 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- build set -->
  <rect x="100" y="132" width="280" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="150" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">枚举 H 的所有数对 (i &lt; j)：</text>
  <text x="240" y="169" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">diffs ← h[j] − h[i]（哈希集合，先 reserve）</text>
  <path d="M 240 178 L 240 188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- scan V pairs -->
  <rect x="128" y="192" width="224" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="212" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">枚举 V 的数对 (i &lt; j)：d = v[j] − v[i]</text>
  <path d="M 240 224 L 240 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond: in set? -->
  <polygon points="155,278 240,238 325,278 240,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="282" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">d ∈ diffs ?</text>

  <path d="M 325 278 L 364 278" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="344" y="270" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="370" y="260" width="106" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="423" y="282" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">best = max(best, d)</text>

  <path d="M 240 318 L 240 330" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="250" y="328" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- next pair -->
  <rect x="180" y="334" width="120" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="353" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">下一对 (i, j)</text>

  <!-- best=v merges back -->
  <path d="M 423 296 C 423 330, 330 336, 304 345" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 180 349 L 90 349 L 90 208 L 124 208" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="136" y="342" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">V 的对未枚举完</text>

  <!-- exit to final check -->
  <path d="M 300 349 L 348 349" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="326" y="341" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">枚举完</text>

  <!-- diamond: best found? -->
  <polygon points="163,400 248,364 333,400 248,436" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="248" y="404" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">best ≥ 0 ?</text>

  <path d="M 248 436 L 248 450" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="258" y="448" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="140" y="454" width="216" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="248" y="475" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 best² mod (10⁹+7)</text>

  <path d="M 333 400 L 384 400" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="358" y="392" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="390" y="382" width="94" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="437" y="404" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>
</svg>
