<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：处理顺序 = 一条路径，dp[mask][i] 记最早完成时刻</text>
    <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">从状态 (mask, i) 出发处理下一个请求 j：先直达移动 d = |f_i − f_j| 秒，早到就原地等到 a_j</text>

    <!-- left: state box -->
    <rect x="40" y="58" width="210" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="145" y="80" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">状态 dp[mask][i]</text>
    <text x="145" y="99" text-anchor="middle" font-size="9.5" fill="#33506b">已处理集合 = mask</text>
    <text x="145" y="115" text-anchor="middle" font-size="9.5" fill="#33506b">电梯停在 f_i</text>
    <text x="145" y="131" text-anchor="middle" font-size="9.5" fill="#33506b">时刻 t（该状态下的最早值）</text>

    <!-- arrow between -->
    <path d="M 250 102 L 368 102" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" fill="none"/>
    <text x="310" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">直达移动 d 秒</text>
    <text x="310" y="120" text-anchor="middle" font-size="8.5" fill="#6b7f99">每秒 ±1 层，绕路只会更晚</text>

    <!-- right: request box -->
    <rect x="370" y="58" width="210" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="475" y="80" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">请求 j ∉ mask</text>
    <text x="475" y="99" text-anchor="middle" font-size="9.5" fill="#7a5c1a">目标楼层 f_j</text>
    <text x="475" y="115" text-anchor="middle" font-size="9.5" fill="#7a5c1a">到达时刻 a_j</text>
    <text x="475" y="131" text-anchor="middle" font-size="8.5" fill="#7a5c1a">只能不早于 a_j 被处理</text>

    <!-- timeline -->
    <text x="310" y="172" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">时间轴：完成时刻 = max(t + d, a_j)——早到就等在原地</text>

    <path d="M 70 252 H 545" stroke="#999" stroke-width="1.6" marker-end="url(#arrG)" fill="none"/>
    <text x="560" y="256" font-size="10" fill="#777">时间</text>

    <path d="M 100 252 H 280" stroke="#446688" stroke-width="6" fill="none"/>
    <path d="M 280 252 H 440" stroke="#d6a040" stroke-width="6" fill="none"/>

    <path d="M 100 244 V 260" stroke="#555" stroke-width="1.4"/>
    <path d="M 280 244 V 260" stroke="#555" stroke-width="1.4"/>
    <path d="M 440 244 V 260" stroke="#555" stroke-width="1.4"/>

    <circle cx="440" cy="252" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>

    <text x="100" y="236" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">t</text>
    <text x="100" y="272" text-anchor="middle" font-size="8.5" fill="#777">出发（在 f_i）</text>
    <text x="280" y="236" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">t + d</text>
    <text x="280" y="272" text-anchor="middle" font-size="8.5" fill="#777">到达 f_j</text>
    <text x="440" y="236" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">a_j</text>
    <text x="440" y="272" text-anchor="middle" font-size="8.5" fill="#a87020">请求 j 到达</text>
    <text x="498" y="240" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">处理 j ✓</text>

    <text x="190" y="292" text-anchor="middle" font-size="9" fill="#446688">移动 d = |f_i − f_j|</text>
    <text x="360" y="292" text-anchor="middle" font-size="9" fill="#a87020">停在 f_j 原地等待</text>
    <text x="310" y="314" text-anchor="middle" font-size="8.5" fill="#888">若 t + d ≥ a_j：无等待段，一到即完成——两种情况统一为 max(t + d, a_j)</text>

    <!-- formula box -->
    <rect x="40" y="330" width="540" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="310" y="352" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">dp[mask ∪ {j}][j] = min(i ∈ mask) max( dp[mask][i] + |f_i − f_j| , a_j )</text>
    <text x="310" y="372" text-anchor="middle" font-size="9.5" fill="#33506b">初始化 dp[{i}][i] = max(|start − f_i|, a_i)；答案 = min(i) dp[全集][i]</text>

    <!-- observations box -->
    <rect x="40" y="406" width="540" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="310" y="426" text-anchor="middle" font-size="11" fill="#2f5527" font-weight="bold">三个观察 ⇒ 状压 DP</text>
    <text x="58" y="446" font-size="9.5" fill="#2f5527">① 每秒 ±1 层：两楼层直达耗时 = 楼层差；早到可等 ⇒ 一步代价 max(t + d, a_j)</text>
    <text x="58" y="464" font-size="9.5" fill="#2f5527">② 任意方案按实际处理时刻排序后：各不早于自己的 a、相邻受楼层差限制；反之满足即能实现</text>
    <text x="58" y="482" font-size="9.5" fill="#2f5527">③ 顺序的后续只由（已处理集合，最后一个）决定 ⇒ dp[mask][i]：2^m × m 状态，每状态 O(m) 转移</text>
    <text x="58" y="504" font-size="8.5" fill="#6b7f99">（m ≤ 16 ⇒ 2^16 = 65536；答案 ≤ 10⁹ + 16×10⁹ ≈ 1.7×10¹⁰，必须 64 位整数；n 只定值域）</text>
    <text x="58" y="520" font-size="8.5" fill="#6b7f99">（贪心死刑：start = 0, requests = [[0,10],[5,0]]：先到先服务 20，先在 0 层等到 5 再上去只要 15）</text>
  </g>
</svg>
