<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：新增子序列必含插入字符 ⟹ 增益拆成三路</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">原串 LCT 一个不少（base）；新字符只有扮演 L / C / T 才有贡献，插其它字母增益为 0</text>

  <!-- ============ Panel 1: 插 L 放开头 ============ -->
  <text x="30" y="66" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 插 L · 放开头</text>

  <g filter="url(#rough2)">
    <rect x="120" y="80" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="162" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="204" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="288" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="102" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L</text>
    <text x="182" y="102" text-anchor="middle" font-size="12" fill="#333">L</text>
    <text x="224" y="102" text-anchor="middle" font-size="12" fill="#333">C</text>
    <text x="266" y="102" text-anchor="middle" font-size="12" fill="#333">C</text>
    <text x="308" y="102" text-anchor="middle" font-size="12" fill="#333">T</text>
    <text x="140" y="74" text-anchor="middle" font-size="8.5" fill="#b85450">新插入</text>

    <path d="M 204 120 v 6 h 124 v -6" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <text x="266" y="140" text-anchor="middle" font-size="9.5" fill="#2a5a2a">原串 CT 子序列 = 2</text>
  </g>

  <g filter="url(#rough2)">
    <text x="352" y="94" font-size="9.5" fill="#555">新 L 配后面每个 CT 对</text>
    <text x="352" y="111" font-size="9.5" fill="#555">插得越早 CT 越多 ⇒ 开头</text>
    <text x="352" y="130" font-size="10" fill="#b85450" font-weight="bold">gainL = cntCT = 2</text>
  </g>

  <!-- ============ Panel 2: 插 C 枚举位置 ============ -->
  <text x="30" y="172" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 插 C · 枚举位置</text>

  <g filter="url(#rough2)">
    <rect x="120" y="186" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="162" y="186" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="204" y="186" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="186" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="208" text-anchor="middle" font-size="12" fill="#333">L</text>
    <text x="182" y="208" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">C</text>
    <text x="224" y="208" text-anchor="middle" font-size="12" fill="#333">C</text>
    <text x="266" y="208" text-anchor="middle" font-size="12" fill="#333">T</text>
    <text x="182" y="180" text-anchor="middle" font-size="8.5" fill="#b85450">新插入</text>

    <path d="M 120 226 v 6 h 40 v -6" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <text x="140" y="246" text-anchor="middle" font-size="9.5" fill="#2a5a2a">左 L = 1</text>
    <path d="M 246 226 v 6 h 40 v -6" fill="none" stroke="#d6a040" stroke-width="2"/>
    <text x="266" y="246" text-anchor="middle" font-size="9.5" fill="#8a6d1f">右 T = 1</text>
  </g>

  <g filter="url(#rough2)">
    <text x="352" y="200" font-size="9.5" fill="#555">新 C 左取 L、右取 T 配对</text>
    <text x="352" y="217" font-size="9.5" fill="#555">插入点要枚举 n+1 个</text>
    <text x="352" y="236" font-size="10" fill="#b85450" font-weight="bold">gainC = preL×sufT = 1</text>
  </g>

  <!-- ============ Panel 3: 插 T 放结尾 ============ -->
  <text x="30" y="278" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 插 T · 放结尾</text>

  <g filter="url(#rough2)">
    <rect x="120" y="292" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="162" y="292" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="204" y="292" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="292" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="288" y="292" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="140" y="314" text-anchor="middle" font-size="12" fill="#333">L</text>
    <text x="182" y="314" text-anchor="middle" font-size="12" fill="#333">C</text>
    <text x="224" y="314" text-anchor="middle" font-size="12" fill="#333">C</text>
    <text x="266" y="314" text-anchor="middle" font-size="12" fill="#333">T</text>
    <text x="308" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">T</text>
    <text x="308" y="286" text-anchor="middle" font-size="8.5" fill="#b85450">新插入</text>

    <path d="M 120 332 v 6 h 124 v -6" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <text x="182" y="352" text-anchor="middle" font-size="9.5" fill="#2a5a2a">原串 LC 子序列 = 2</text>
  </g>

  <g filter="url(#rough2)">
    <text x="352" y="306" font-size="9.5" fill="#555">新 T 配前面每个 LC 对</text>
    <text x="352" y="323" font-size="9.5" fill="#555">插得越晚 LC 越多 ⇒ 结尾</text>
    <text x="352" y="342" font-size="10" fill="#b85450" font-weight="bold">gainT = cntLC = 2</text>
  </g>

  <!-- ============ Bottom note ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="372" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="260" y="394" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">答案 = base（原串 LCT 子序列数）+ max(gainL, gainC, gainT)</text>
    <text x="260" y="414" text-anchor="middle" font-size="10" fill="#8a6d1f">插其它字母增益为 0；「最多插一个」⇒ 不插的情形被非负增益天然覆盖</text>
  </g>
</svg>
