<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：奇偶交替只有两种模板，错位位恰好各花一次 ±1</text>
  <text x="260" y="33" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">示例 nums = [-2, -3, 1, 4]：绿 = 奇偶对位（0 次操作），粉 = 错位（±1 一次）</text>

  <!-- ======== 模板 A 行 ======== -->
  <text x="75" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">模板 A</text>
  <text x="75" y="98" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">第 i 位奇偶 ≡ i</text>

  <!-- 错位徽章（A 行：i=2, i=3） -->
  <rect x="325" y="46" width="26" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="338" y="58" text-anchor="middle" font-size="9" fill="#a07020" font-weight="bold" filter="url(#rough2)">±1</text>
  <path d="M 338 62 L 338 68" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="403" y="46" width="26" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="58" text-anchor="middle" font-size="9" fill="#a07020" font-weight="bold" filter="url(#rough2)">±1</text>
  <path d="M 416 62 L 416 68" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- A 行格子：-2 ✓, -3 ✓, 1 ✗, 4 ✗ -->
  <rect x="150" y="70" width="64" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">-2</text>
  <text x="206" y="82" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="228" y="70" width="64" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">-3</text>
  <text x="284" y="82" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="306" y="70" width="64" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="338" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="362" y="82" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="384" y="70" width="64" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="416" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="440" y="82" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- A 行：要求奇偶 + 下标 -->
  <text x="182" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">需偶</text>
  <text x="260" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">需奇</text>
  <text x="338" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">需偶</text>
  <text x="416" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">需奇</text>
  <text x="182" y="132" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">i=0</text>
  <text x="260" y="132" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">i=1</text>
  <text x="338" y="132" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">i=2</text>
  <text x="416" y="132" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">i=3</text>
  <text x="484" y="90" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">cost=2</text>

  <!-- ======== 模板 B 行 ======== -->
  <text x="75" y="192" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">模板 B</text>
  <text x="75" y="206" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">第 i 位奇偶 ≢ i</text>

  <!-- 错位徽章（B 行：i=0, i=1） -->
  <rect x="169" y="154" width="26" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="166" text-anchor="middle" font-size="9" fill="#a07020" font-weight="bold" filter="url(#rough2)">±1</text>
  <path d="M 182 170 L 182 176" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="247" y="154" width="26" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="9" fill="#a07020" font-weight="bold" filter="url(#rough2)">±1</text>
  <path d="M 260 170 L 260 176" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- B 行格子：-2 ✗, -3 ✗, 1 ✓, 4 ✓ -->
  <rect x="150" y="178" width="64" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="182" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">-2</text>
  <text x="206" y="190" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="228" y="178" width="64" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">-3</text>
  <text x="284" y="190" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="306" y="178" width="64" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="338" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="362" y="190" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="384" y="178" width="64" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="440" y="190" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- B 行：要求奇偶 + 下标 -->
  <text x="182" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">需奇</text>
  <text x="260" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">需偶</text>
  <text x="338" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">需奇</text>
  <text x="416" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">需偶</text>
  <text x="182" y="240" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">i=0</text>
  <text x="260" y="240" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">i=1</text>
  <text x="338" y="240" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">i=2</text>
  <text x="416" y="240" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">i=3</text>
  <text x="484" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">cost=2</text>

  <!-- 底部要点框 -->
  <rect x="20" y="258" width="480" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">① 奇偶交替 ⟺ 全数组贴合两种模板之一：偶奇偶奇…（A）或 奇偶奇偶…（B）</text>
  <text x="260" y="296" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">② 错位位必须花奇数次操作（±1 翻转奇偶）⇒ 恰好 answer[0] 次时每错位位恰一次</text>
  <text x="260" y="314" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">③ answer[0] = min(cost_A, cost_B)；本题两模板打平（都为 2）⇒ 极差两边都要算</text>
  <text x="260" y="332" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">④ 错位位 ±1 二选一 ⇒ 极差由「谁 +1 谁 −1」决定，阈值枚举最小化得 answer[1]</text>
  <text x="260" y="356" text-anchor="middle" font-size="9" fill="#a07020" font-weight="bold" filter="url(#rough2)">示例：模板 A 取 1→2、4→3 得 [-2,-3,2,3]，极差 3−(−3)=6 ⇒ answer = [2, 6]</text>
</svg>
