<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <ellipse cx="260" cy="33" rx="78" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="38" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始 heaps = { }</text>

  <rect x="165" y="66" width="190" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个元素 (v, l)</text>

  <rect x="140" y="128" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">把 v 压入 limit = l 的最小堆</text>

  <polygon points="260,186 358,228 260,270 162,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="233" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">堆大小 &gt; l ?</text>

  <rect x="392" y="208" width="118" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="451" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">弹出堆顶</text>
  <text x="451" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">（当前最小值）</text>

  <rect x="150" y="304" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">累加所有堆中元素 → 返回</text>

  <line x1="260" y1="50" x2="260" y2="65" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="260" y1="104" x2="260" y2="127" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="260" y1="166" x2="260" y2="185" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="358" y1="228" x2="391" y2="228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="219" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <line x1="260" y1="270" x2="260" y2="292" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="285" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <circle cx="260" cy="292" r="3" fill="#666" filter="url(#rough2)"/>

  <path d="M 260 292 L 66 292 L 66 85 L 163 85" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="284" font-size="10.5" fill="#666" filter="url(#rough2)">还有元素</text>

  <line x1="260" y1="292" x2="260" y2="303" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="302" font-size="10.5" fill="#666" filter="url(#rough2)">全部处理完</text>

  <path d="M 451 208 L 451 85 L 357 85" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="459" y="150" font-size="10.5" fill="#666" filter="url(#rough2)">继续</text>
</svg>
