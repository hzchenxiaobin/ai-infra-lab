<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：k 镜像数 = 十进制回文 ∧ k 进制回文（双重回文）</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">同一个正整数在两种进制下都必须从前往后读 = 从后往前读</text>

  <!-- ===== Row 1: 9 is a 2-mirror ===== -->
  <text x="40" y="82" font-size="11" fill="#666">例 A（k = 2）</text>
  <!-- number card -->
  <rect x="40" y="90" width="70" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="108" text-anchor="middle" font-size="10" fill="#888">十进制</text>
  <text x="75" y="134" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">9</text>

  <!-- arrow to base10 check -->
  <path d="M 112 120 L 150 120" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- base10 representation -->
  <rect x="156" y="92" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="231" y="110" text-anchor="middle" font-size="10" fill="#888">base 10 表示</text>
  <text x="231" y="132" text-anchor="middle" font-size="16" fill="#333" font-family="'Comic Sans MS', monospace">"9"</text>
  <text x="296" y="134" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 回文</text>

  <!-- arrow to base2 check -->
  <path d="M 312 120 L 350 120" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- base2 representation -->
  <rect x="356" y="92" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="436" y="110" text-anchor="middle" font-size="10" fill="#888">base 2 表示</text>
  <text x="436" y="132" text-anchor="middle" font-size="16" fill="#333" font-family="'Comic Sans MS', monospace">"1001"</text>
  <text x="506" y="134" font-size="13" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <!-- verdict row 1 -->
  <rect x="156" y="158" width="360" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="336" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">两进制皆回文 → 9 是 2 镜像数 ✓</text>

  <!-- ===== Row 2: 4 is NOT a 2-mirror ===== -->
  <text x="40" y="216" font-size="11" fill="#666">例 B（k = 2）</text>
  <rect x="40" y="224" width="70" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="242" text-anchor="middle" font-size="10" fill="#888">十进制</text>
  <text x="75" y="268" text-anchor="middle" font-size="22" fill="#333" font-weight="bold">4</text>

  <path d="M 112 254 L 150 254" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="156" y="226" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="231" y="244" text-anchor="middle" font-size="10" fill="#888">base 10 表示</text>
  <text x="231" y="266" text-anchor="middle" font-size="16" fill="#333" font-family="'Comic Sans MS', monospace">"4"</text>
  <text x="296" y="268" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 回文</text>

  <path d="M 312 254 L 350 254" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="356" y="226" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="436" y="244" text-anchor="middle" font-size="10" fill="#888">base 2 表示</text>
  <text x="436" y="266" text-anchor="middle" font-size="16" fill="#333" font-family="'Comic Sans MS', monospace">"100"</text>
  <text x="506" y="268" font-size="13" fill="#b85450" font-weight="bold" text-anchor="end">✗</text>

  <rect x="156" y="292" width="360" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="336" y="310" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">base 2 非回文 → 4 不是 2 镜像数 ✗</text>

  <!-- Bottom insight -->
  <rect x="30" y="332" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">策略：只枚举十进制回文（天然升序、构造便宜），逐个过滤 k 进制回文</text>
  <text x="270" y="365" text-anchor="middle" font-size="10.5" fill="#555">取前 n 个命中累加即答案，无需排序、无需上界预估</text>
</svg>
