<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，先查表、后入桶</text>

  <rect x="110" y="38" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始：输入 hours（n ≤ 5×10⁵）</text>

  <path d="M 240 70 L 240 84" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="110" y="88" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">初始化：ans = 0，cnt[0..23] = 0</text>

  <path d="M 240 120 L 240 134" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="110" y="138" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="158" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">枚举 j = 0 … n−1（h = hours[j]）</text>

  <path d="M 240 170 L 240 184" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="110" y="188" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="208" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">取余：r ← h mod 24（10⁹ → 0…23）</text>

  <path d="M 240 220 L 240 234" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="98" y="238" width="284" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="255" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">查表：ans += cnt[(24 − r) mod 24]</text>
  <text x="240" y="271" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">补集余数：r=0 时 (24−0)%24=0，不会越界</text>

  <path d="M 240 276 L 240 290" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="98" y="294" width="284" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="311" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">入桶：cnt[r] += 1</text>
  <text x="240" y="327" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">查完才插 → 表里只有 i &lt; j 的元素</text>

  <path d="M 240 332 L 240 346" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="240,350 320,378 240,406 160,378" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="382" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &lt; n ？</text>

  <path d="M 160 378 L 70 378 L 70 154 L 104 154" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="112" y="370" font-size="10" fill="#8a6d3b" filter="url(#rough2)">是，处理下一个</text>

  <path d="M 240 406 L 240 420" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="252" y="418" font-size="10" fill="#8a6d3b" filter="url(#rough2)">否</text>

  <rect x="110" y="424" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="446" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans（最大 ≈ 1.25×10¹¹）</text>

  <!-- 溢出警示框 -->
  <rect x="398" y="88" width="112" height="106" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="454" y="108" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 溢出警示</text>
  <text x="454" y="126" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">C(5×10⁵, 2)</text>
  <text x="454" y="141" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">≈ 1.25×10¹¹</text>
  <text x="454" y="156" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">&gt; 2³¹ − 1</text>
  <text x="454" y="174" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans 必须</text>
  <text x="454" y="187" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">用 long long</text>
</svg>
