<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- ============ 情形 A：i < j ============ -->
  <text x="280" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">情形 A：i &lt; j（最小值在最大值左侧）</text>

  <!-- cells y=84, values [5,1,4,3,9,2], i=1(idx1), j=4(idx4) -->
  <rect x="120" y="84" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <rect x="176" y="84" width="50" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="201" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d5a22" filter="url(#rough2)">1</text>
  <rect x="232" y="84" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="257" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <rect x="288" y="84" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="313" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="344" y="84" width="50" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="369" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00" filter="url(#rough2)">9</text>
  <rect x="400" y="84" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>

  <!-- index labels -->
  <text x="145" y="150" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <text x="201" y="150" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <text x="257" y="150" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">2</text>
  <text x="313" y="150" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>
  <text x="369" y="150" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">4</text>
  <text x="425" y="150" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">5</text>

  <!-- min arrow idx1 -> idx0 (leftward) -->
  <path d="M201,68 L145,68" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="173" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i = 1 步</text>
  <!-- max arrow idx4 -> idx5 (rightward) -->
  <path d="M369,68 L425,68" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="397" y="60" text-anchor="middle" font-size="12" fill="#8a5a00" filter="url(#rough2)">n−1−j = 1 步</text>

  <text x="280" y="180" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">路径不交叉 → i + (n−1−j) = 1 + 1 = 2</text>

  <!-- divider -->
  <line x1="70" y1="208" x2="490" y2="208" stroke="#bbb" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ============ 情形 B：i > j ============ -->
  <text x="280" y="242" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">情形 B：i &gt; j（最小值在最大值右侧）</text>

  <!-- cells y=300, values [5,9,3,4,1,2], i=4(idx4), j=1(idx1) -->
  <rect x="120" y="300" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="330" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <rect x="176" y="300" width="50" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="201" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00" filter="url(#rough2)">9</text>
  <rect x="232" y="300" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="257" y="330" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="288" y="300" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="313" y="330" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <rect x="344" y="300" width="50" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="369" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d5a22" filter="url(#rough2)">1</text>
  <rect x="400" y="300" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="330" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>

  <!-- index labels -->
  <text x="145" y="366" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <text x="201" y="366" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <text x="257" y="366" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">2</text>
  <text x="313" y="366" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>
  <text x="369" y="366" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">4</text>
  <text x="425" y="366" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">5</text>

  <!-- min arrow idx4 -> idx0 (long, leftward) -->
  <path d="M369,288 L145,288" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="165" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i = 4 步</text>
  <!-- max arrow idx1 -> idx5 (shorter, rightward, above min) -->
  <path d="M201,276 L425,276" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="395" y="268" text-anchor="middle" font-size="12" fill="#8a5a00" filter="url(#rough2)">n−1−j = 4 步</text>

  <!-- crossing badge in overlap region [201,369] -->
  <circle cx="285" cy="282" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="285" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">省1</text>

  <text x="280" y="400" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">路径交叉 → i + (n−1−j) − 1 = 4 + 4 − 1 = 7</text>

</svg>
