<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，桶计数 + less 整桶进出（O(n)）</text>

  <!-- 左侧主流程 -->
  <rect x="30" y="36" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="170" y="54" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">初始化：cur = 0（= P[0]），cnt[cur]++</text>
  <text x="170" y="71" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">less = 0，ans = 0</text>

  <path d="M 170 80 L 170 94" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="98" width="230" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="115" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">遍历 k = 1..n：取 x = nums[k−1]</text>

  <path d="M 170 124 L 170 136" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="170,138 240,166 170,194 100,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="171" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">x == target ?</text>

  <text x="88" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 100 166 L 62 166 L 62 202" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="252" y="158" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 240 166 L 278 166 L 278 202" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="20" y="206" width="140" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="223" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">上台阶 ↑</text>
  <text x="90" y="239" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">less += cnt[cur]</text>
  <text x="90" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cur += 1</text>

  <rect x="170" y="206" width="140" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="223" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">下台阶 ↓</text>
  <text x="240" y="239" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cur −= 1</text>
  <text x="240" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">less −= cnt[cur]</text>

  <path d="M 90 260 L 90 288" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 260 L 240 288" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="35" y="292" width="220" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="310" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans += less ← 右端 k 的合法左端数</text>
  <text x="145" y="327" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cnt[cur]++ ← 插入 P[k]，less 不变</text>

  <path d="M 255 315 L 263 315" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="266" y="298" width="68" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="319" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">return ans</text>

  <path d="M 35 315 L 10 315 L 10 111 L 51 111" fill="none" stroke="#999" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="16" y="178" font-size="10" fill="#666" filter="url(#rough2)">未扫完 ↺</text>

  <!-- 右侧解释面板 -->
  <rect x="338" y="36" width="167" height="280" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="421" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">为什么每步是 O(1)？</text>
  <text x="348" y="80" font-size="10.5" fill="#333" filter="url(#rough2)">相邻前缀和之差恰为 ±1，</text>
  <text x="348" y="95" font-size="10.5" fill="#333" filter="url(#rough2)">cur 沿数轴逐格游走</text>

  <text x="406" y="104" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">cur</text>
  <path d="M 406 106 L 406 110" fill="none" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>

  <rect x="348" y="112" width="21" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="358.5" y="131" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="372" y="112" width="21" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="382.5" y="131" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="396" y="112" width="21" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="406.5" y="131" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="420" y="112" width="21" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="430.5" y="131" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="444" y="112" width="21" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="454.5" y="131" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="468" y="112" width="21" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="478.5" y="131" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <text x="358.5" y="153" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">−2</text>
  <text x="382.5" y="153" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">−1</text>
  <text x="406.5" y="153" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="430.5" y="153" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">+1</text>
  <text x="454.5" y="153" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">+2</text>
  <text x="478.5" y="153" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">+3</text>

  <path d="M 348 160 L 348 166 L 391 166 L 391 160" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="369" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">less</text>

  <text x="348" y="204" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">上台阶 c→c+1：</text>
  <text x="356" y="219" font-size="10.5" fill="#333" filter="url(#rough2)">桶 c 整体并入 less</text>
  <text x="348" y="242" font-size="10.5" fill="#b85450" filter="url(#rough2)">下台阶 c→c−1：</text>
  <text x="356" y="257" font-size="10.5" fill="#333" filter="url(#rough2)">桶 c−1 整体移出 less</text>
  <text x="348" y="282" font-size="10.5" fill="#333" filter="url(#rough2)">查询 + 插入每步 O(1)，</text>
  <text x="348" y="297" font-size="10.5" fill="#333" filter="url(#rough2)">无需离散化 / 树状数组，</text>
  <text x="348" y="312" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">总复杂度 O(n) ✓</text>

  <text x="16" y="352" font-size="10" fill="#999" filter="url(#rough2)">⚠️ 桶下标整体 +n 平移到 [0, 2n]；ans 用 long long（上界约 5×10⁹）</text>
</svg>
