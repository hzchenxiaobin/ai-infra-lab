<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：字符串拆成「同字符连续段(run)」，能量 = 最长 run 的长度</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888">s = "leetcode"  →  runs: l | ee | t | c | o | d | e  →  power = 2</text>

  <!-- String chars (8 boxes, width 44, start x=72) -->
  <rect x="72" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="87" text-anchor="middle" font-size="14" fill="#333">l</text>

  <rect x="116" y="62" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="138" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="160" y="62" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="182" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>

  <rect x="204" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="87" text-anchor="middle" font-size="14" fill="#333">t</text>
  <rect x="248" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="87" text-anchor="middle" font-size="14" fill="#333">c</text>
  <rect x="292" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="314" y="87" text-anchor="middle" font-size="14" fill="#333">o</text>
  <rect x="336" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="87" text-anchor="middle" font-size="14" fill="#333">d</text>
  <rect x="380" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="87" text-anchor="middle" font-size="14" fill="#333">e</text>

  <!-- index labels -->
  <text x="94" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="138" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="182" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="226" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="270" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="314" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>
  <text x="358" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">6</text>
  <text x="402" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">7</text>

  <!-- Run brackets and lengths -->
  <path d="M 74 132 L 74 138 L 114 138 L 114 132" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="94" y="154" text-anchor="middle" font-size="11" fill="#666">len=1</text>

  <path d="M 118 132 L 118 140 L 202 140 L 202 132" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="160" y="156" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">len=2 ← 最长</text>

  <path d="M 206 132 L 206 138 L 246 138 L 246 132" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="226" y="154" text-anchor="middle" font-size="11" fill="#666">len=1</text>
  <path d="M 250 132 L 250 138 L 290 138 L 290 132" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="270" y="154" text-anchor="middle" font-size="11" fill="#666">len=1</text>
  <path d="M 294 132 L 294 138 L 334 138 L 334 132" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="314" y="154" text-anchor="middle" font-size="11" fill="#666">len=1</text>
  <path d="M 338 132 L 338 138 L 378 138 L 378 132" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="358" y="154" text-anchor="middle" font-size="11" fill="#666">len=1</text>
  <path d="M 382 132 L 382 138 L 422 138 L 422 132" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="402" y="154" text-anchor="middle" font-size="11" fill="#666">len=1</text>

  <!-- Recurrence formula box -->
  <rect x="60" y="186" width="480" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="208" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">递推（滚动 DP / Kadane 风格）</text>
  <text x="300" y="230" text-anchor="middle" font-size="12" fill="#333">若 s[i] == s[i-1]：cur = cur + 1（续段）</text>
  <text x="300" y="250" text-anchor="middle" font-size="12" fill="#333">否则：cur = 1（开新段）；每步 ans = max(ans, cur)</text>

  <!-- cur / ans tracking -->
  <text x="60" y="284" font-size="12" fill="#888">维护两个变量：</text>
  <rect x="150" y="270" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="225" y="290" text-anchor="middle" font-size="11.5" fill="#333">cur = 当前段累计长度</text>
  <rect x="330" y="270" width="150" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="290" text-anchor="middle" font-size="11.5" fill="#333">ans = 全局最长</text>

  <!-- footer note -->
  <rect x="60" y="328" width="480" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="346" text-anchor="middle" font-size="11" fill="#555">一次扫描，O(n) 时间 / O(1) 空间；只需比较 s[i] 与 s[i-1]，无需枚举子串</text>
  <text x="300" y="360" text-anchor="middle" font-size="10.5" fill="#888">类比 53 最大子数组和 Kadane：维护「以 i 结尾最优」+「全局最优」</text>
</svg>
