<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="620" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">24 点算法流程：DFS 归约</text>
  <path d="M 210 38 Q 380 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="310" y="52" width="140" height="34" rx="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="380" y="74" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">solve(nums)</text>

  <path d="M 380 86 L 380 106" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断 len==1 -->
  <g filter="url(#sk)"><polygon points="380,110 480,150 380,190 280,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="380" y="146" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">len(nums)</text>
  <text x="380" y="162" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">== 1 ?</text>

  <!-- yes 分支 -->
  <path d="M 480 150 L 540 150" stroke="#2e8b57" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="500" y="144" font-size="10" fill="#2e8b57" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="540" y="134" width="170" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="625" y="156" text-anchor="middle" font-size="11" fill="#2e6e2e">|nums[0]−24| &lt; 1e-6 ?</text>
  <path d="M 625 168 L 625 192" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><polygon points="625,196 695,222 625,248 555,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="625" y="226" text-anchor="middle" font-size="10" fill="#9a6a20">命中 24?</text>
  <path d="M 625 248 L 625 268" stroke="#2e8b57" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="635" y="262" font-size="9" fill="#2e8b57">是</text>
  <g filter="url(#sk)"><rect x="570" y="270" width="110" height="30" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="625" y="290" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true ✓</text>
  <path d="M 555 222 L 510 222" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="528" y="216" font-size="9" fill="#b85450">否</text>
  <g filter="url(#sk)"><rect x="400" y="208" width="110" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="455" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false ✗</text>

  <!-- no 分支 -->
  <path d="M 280 150 L 200 150" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="260" y="144" font-size="10" fill="#4a8edb" font-weight="bold">否</text>

  <!-- 枚举 (i,j) 对 -->
  <g filter="url(#sk)"><rect x="60" y="130" width="140" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="130" y="148" text-anchor="middle" font-size="11" fill="#2b6e9e">枚举所有 (i,j) 对</text>
  <text x="130" y="162" text-anchor="middle" font-size="10" fill="#888">i&lt;j, i,j ∈ [0,len)</text>
  <path d="M 130 170 L 130 194" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 6 种运算 -->
  <g filter="url(#sk)"><rect x="40" y="196" width="180" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="130" y="214" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">对每对试 6 种运算</text>
  <text x="130" y="230" text-anchor="middle" font-size="10" fill="#888">a+b, a−b, b−a, a×b, a÷b, b÷a</text>
  <path d="M 130 240 L 130 264" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 除零检查 -->
  <g filter="url(#sk)"><polygon points="130,266 230,300 130,334 30,300" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="130" y="296" text-anchor="middle" font-size="10" fill="#b85450">除法且</text>
  <text x="130" y="310" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">分母==0 ?</text>
  <path d="M 230 300 L 290 300" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="250" y="294" font-size="9" fill="#b85450">是</text>
  <g filter="url(#sk)"><rect x="290" y="286" width="80" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="330" y="304" text-anchor="middle" font-size="10" fill="#b85450">跳过</text>

  <!-- 计算结果 -->
  <path d="M 130 334 L 130 358" stroke="#2e8b57" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="140" y="352" font-size="9" fill="#2e8b57">否</text>
  <g filter="url(#sk)"><rect x="50" y="360" width="160" height="40" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="130" y="378" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">算出 result</text>
  <text x="130" y="392" text-anchor="middle" font-size="10" fill="#888">删 nums[i],nums[j]，加 result</text>
  <path d="M 130 400 L 130 424" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 递归 -->
  <g filter="url(#sk)"><rect x="50" y="426" width="160" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="130" y="444" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">递归 solve(next_nums)</text>
  <text x="130" y="458" text-anchor="middle" font-size="10" fill="#888">数量减 1，进入下一层</text>
  <path d="M 130 466 L 130 490" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 递归返回判断 -->
  <g filter="url(#sk)"><polygon points="130,492 240,528 130,564 20,528" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="130" y="524" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">递归返回</text>
  <text x="130" y="540" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">true ?</text>

  <path d="M 240 528 L 360 528" stroke="#2e8b57" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="296" y="522" font-size="10" fill="#2e8b57" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="360" y="510" width="140" height="36" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="430" y="534" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true ✓</text>

  <!-- 否：继续下一对 -->
  <path d="M 20 528 L 20 150" stroke="#4a8edb" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#sk)"/>
  <path d="M 20 150 L 56 150" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="28" y="300" font-size="10" fill="#4a8edb" font-weight="bold" transform="rotate(-90 28 300)">否 → 试下一对</text>

  <!-- 所有对都试完 -->
  <path d="M 130 564 L 130 588" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="60" y="590" width="140" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="130" y="608" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">所有对用完 → false</text>

  <!-- 右下角说明 -->
  <g filter="url(#sk)"><rect x="540" y="440" width="200" height="130" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="640" y="462" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">关键剪枝与不变量</text>
  <text x="552" y="482" font-size="10" fill="#2b6e9e">• ε=1e-6 容忍浮点误差</text>
  <text x="552" y="500" font-size="10" fill="#2b6e9e">• 除零跳过，不报错</text>
  <text x="552" y="518" font-size="10" fill="#2b6e9e">• −,÷ 不可交换→双向试</text>
  <text x="552" y="536" font-size="10" fill="#2b6e9e">• +,× 可交换→只算一次</text>
  <text x="552" y="554" font-size="10" fill="#2b6e9e">• 深度固定 3 层(4→3→2→1)</text>
</svg>
