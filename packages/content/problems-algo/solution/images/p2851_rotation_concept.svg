<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察①：一次操作 = 循环移位，k 次操作 = 净位移相加</text>

  <!-- row 1: single operation -->
  <text x="60" y="62" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">一次操作（取后缀 l=2 前置）：</text>

  <rect x="60" y="74" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="94" y="74" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="128" y="74" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="162" y="74" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="179" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <text x="205" y="94" font-size="13" fill="#666" filter="url(#rough2)">→</text>

  <rect x="232" y="74" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="266" y="74" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="283" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="300" y="74" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="334" y="74" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>

  <text x="392" y="94" font-size="12" fill="#888" filter="url(#rough2)">= R₂(s)</text>

  <!-- row 2: composition formula -->
  <rect x="60" y="128" width="500" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="154" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">R_a( R_b(s) ) = R_(a+b) mod n (s)　（还满足交换律）</text>
  <text x="310" y="178" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">k 步之后 s 只由 L = (l₁ + l₂ + … + l_k) mod n 决定，与顺序无关</text>

  <!-- row 3: good offsets via s+s -->
  <text x="60" y="224" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">好偏移 = t 在 s+s 中的出现位置（p=2 → L = n−p = 2）：</text>

  <rect x="80" y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="114" y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="148" y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="182" y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="216" y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="250" y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="284" y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="318" y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>

  <!-- match bracket -->
  <path d="M 148 276 L 148 283 L 318 283 L 318 276" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="233" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">t = "cdab" 命中于 p = 2 ⇒ 好偏移 L = 4 − 2 = 2</text>

  <path d="M 392 253 C 430 253 440 236 468 236" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="472" y="220" width="126" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="535" y="241" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">KMP 数出现次数</text>

  <!-- caution box -->
  <rect x="60" y="316" width="500" height="50" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="310" y="336" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">⚠️ 单步 l ∈ [1, n−1]：一步不能"不动"，但多步合成净位移可为 0</text>
  <text x="310" y="354" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">不同 l 即使得到相同字符串（s 有周期）也算不同方案 —— 见示例 2</text>
</svg>
