<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：右端点固定时 OR 单调不减，不同值至多 30 种</text>

  <!-- separator line -->
  <line x1="300" y1="44" x2="300" y2="250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Left: subarray extension ===== -->
  <text x="40" y="52" font-size="11" fill="#888">以 i=2 为右端点 (arr = [1, 2, 4])：</text>

  <!-- Array boxes -->
  <rect x="40" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="85" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="90" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="85" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="140" y="64" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="160" y="58" text-anchor="middle" font-size="9" fill="#d6a040">i=2</text>

  <!-- Subarray brackets and OR values -->
  <path d="M 142 110 L 142 116 L 178 116 L 178 110" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="186" y="120" font-size="11" fill="#b85450">OR = 4</text>

  <path d="M 92 132 L 92 138 L 178 138 L 178 132" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="186" y="142" font-size="11" fill="#b85450">OR = 6</text>

  <path d="M 42 154 L 42 160 L 178 160 L 178 154" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="186" y="164" font-size="11" fill="#b85450">OR = 7</text>

  <!-- leftward arrow -->
  <path d="M 178 182 L 50 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="114" y="176" text-anchor="middle" font-size="10" fill="#666">左端点左移 →</text>

  <!-- monotonic note -->
  <rect x="36" y="194" width="210" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="141" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4 ≤ 6 ≤ 7，单调不减 ✓</text>

  <!-- ===== Right: bit analysis ===== -->
  <text x="330" y="52" font-size="11" fill="#888">OR 只能置位，不能清位：</text>

  <!-- Bit rows: 3-bit representation -->
  <!-- 4 = 100 -->
  <text x="320" y="86" font-size="11" fill="#555">4 =</text>
  <rect x="346" y="70" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="358" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="374" y="70" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="386" y="86" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="402" y="70" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="414" y="86" text-anchor="middle" font-size="12" fill="#ccc">0</text>

  <!-- 6 = 110 -->
  <text x="320" y="120" font-size="11" fill="#555">6 =</text>
  <rect x="346" y="104" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="358" y="120" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="374" y="104" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="386" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="402" y="104" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="414" y="120" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <text x="438" y="120" font-size="9" fill="#b85450">← 新增位</text>

  <!-- 7 = 111 -->
  <text x="320" y="154" font-size="11" fill="#555">7 =</text>
  <rect x="346" y="138" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="358" y="154" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="374" y="138" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="386" y="154" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="402" y="138" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="414" y="154" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="438" y="154" font-size="9" fill="#b85450">← 新增位</text>

  <!-- down arrows between rows -->
  <path d="M 358 96 L 358 100" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 358 130 L 358 134" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bit count boxes -->
  <rect x="316" y="178" width="218" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="425" y="196" text-anchor="middle" font-size="11" fill="#d6a040">arr[i] &lt; 2³⁰ → 至多 30 bit</text>

  <rect x="316" y="216" width="218" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="425" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">每次变化 ≥ 1 新位 → ≤ 31 种</text>

  <!-- ===== Bottom: key insight ===== -->
  <rect x="36" y="258" width="488" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">滚动集合转移：</text>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#446688">cur_i = { arr[i] } ∪ { arr[i] OR y  :  y ∈ cur_{i-1} }</text>

  <rect x="36" y="322" width="488" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">|cur_i| ≤ 31  ⇒  n 轮总计 O(31n) = O(n · log max)</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#4a7a3a">集合自动去重，跳过 O(n²) 冗余子数组</text>
</svg>
