<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">频次即下界：最高频值决定最少行数</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">同一值每行至多一份 → f 份副本必须落到 f 个不同行</text>

  <!-- ===== nums array ===== -->
  <text x="30" y="82" font-size="11" fill="#446688" font-weight="bold">nums =</text>
  <g font-size="12">
    <!-- 1 (red) 3 4 1(red) 2 3 1(red) -->
    <rect x="78"  y="66" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="95"  y="84" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="114" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="131" y="84" text-anchor="middle" fill="#333">3</text>
    <rect x="150" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="167" y="84" text-anchor="middle" fill="#333">4</text>
    <rect x="186" y="66" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="203" y="84" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="222" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="239" y="84" text-anchor="middle" fill="#333">2</text>
    <rect x="258" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="275" y="84" text-anchor="middle" fill="#333">3</text>
    <rect x="294" y="66" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="311" y="84" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>
  <text x="95" y="110" text-anchor="middle" font-size="9" fill="#b85450">第0次</text>
  <text x="203" y="110" text-anchor="middle" font-size="9" fill="#b85450">第1次</text>
  <text x="311" y="110" text-anchor="middle" font-size="9" fill="#b85450">第2次</text>

  <!-- ===== freq table (right) ===== -->
  <text x="440" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">频次表</text>
  <g font-size="12">
    <rect x="392" y="68" width="26" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="405" y="83" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="426" y="83" font-size="11" fill="#888">→</text>
    <text x="450" y="83" fill="#b85450" font-weight="bold">3</text>
    <text x="478" y="83" font-size="9" fill="#b85450">← max</text>

    <rect x="392" y="94" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="405" y="109" text-anchor="middle" fill="#333">3</text>
    <text x="426" y="109" font-size="11" fill="#888">→</text>
    <text x="450" y="109" fill="#333">2</text>

    <rect x="392" y="120" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="405" y="135" text-anchor="middle" fill="#333">2</text>
    <text x="426" y="135" font-size="11" fill="#888">→</text>
    <text x="450" y="135" fill="#333">1</text>

    <rect x="392" y="146" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="405" y="161" text-anchor="middle" fill="#333">4</text>
    <text x="426" y="161" font-size="11" fill="#888">→</text>
    <text x="450" y="161" fill="#333">1</text>
  </g>

  <!-- ===== arrows: each 1 → its own row ===== -->
  <path d="M 95 112 L 95 196" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 203 112 L 203 236" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 311 112 L 311 276" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== result rows ===== -->
  <g font-size="12">
    <text x="30" y="212" font-size="10" fill="#888">row 0</text>
    <rect x="78" y="196" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="95" y="214" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="120" y="214" font-size="11" fill="#888">…</text>

    <text x="30" y="252" font-size="10" fill="#888">row 1</text>
    <rect x="186" y="236" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="203" y="254" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="228" y="254" font-size="11" fill="#888">…</text>

    <text x="30" y="292" font-size="10" fill="#888">row 2</text>
    <rect x="294" y="276" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="311" y="294" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="336" y="294" font-size="11" fill="#888">…</text>
  </g>
  <text x="375" y="252" font-size="9" fill="#b85450">3 份 1 各占一行</text>
  <text x="375" y="266" font-size="9" fill="#888">互不能合并</text>

  <!-- ===== conclusion ===== -->
  <rect x="40" y="316" width="460" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="11" fill="#8a5a10" font-weight="bold">下界 R ≥ maxFreq = 3；取 R = 3 行可行 → 最少行数恰为 maxFreq</text>
</svg>
