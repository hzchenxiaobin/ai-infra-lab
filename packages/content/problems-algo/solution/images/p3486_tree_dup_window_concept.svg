<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：根链滑窗 + 容忍一个重复值</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">以示例 1 的链 0→1→3→6→8 为例（节点值 1, 1, 3, 1, 0）</text>

  <!-- 回跳箭头：第 3 次出现（红）与第 2 次出现（绿） -->
  <g filter="url(#rough2)">
    <path d="M 344 130 C 306 72, 150 72, 50 130" stroke="#b85450" stroke-width="2" fill="none"
          stroke-dasharray="6 4" marker-end="url(#arrR)"/>
    <text x="225" y="64" text-anchor="middle" font-size="10.5" fill="#b85450">进入 6：值 1 第 3 次入窗 → top ← 0+1 = 1</text>
    <path d="M 138 128 C 124 98, 94 98, 78 128" stroke="#4a7a3a" stroke-width="1.8" fill="none"
          stroke-dasharray="5 4" marker-end="url(#arrG)"/>
    <text x="100" y="97" text-anchor="middle" font-size="9.5" fill="#4a7a3a">第 2 次：容忍（dup=1）</text>
  </g>

  <!-- 路径链 -->
  <g filter="url(#rough2)">
    <line x1="84" y1="158" x2="126" y2="158" stroke="#888" stroke-width="2"/>
    <line x1="174" y1="158" x2="216" y2="158" stroke="#888" stroke-width="2"/>
    <line x1="264" y1="158" x2="306" y2="158" stroke="#888" stroke-width="2"/>
    <line x1="354" y1="158" x2="396" y2="158" stroke="#888" stroke-width="2"/>
    <text x="105" y="151" text-anchor="middle" font-size="10" fill="#666">w=1</text>
    <text x="195" y="151" text-anchor="middle" font-size="10" fill="#666">w=1</text>
    <text x="285" y="151" text-anchor="middle" font-size="10" fill="#666">w=5</text>
    <text x="375" y="151" text-anchor="middle" font-size="10" fill="#666">w=3</text>

    <circle cx="60" cy="158" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="150" cy="158" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <circle cx="240" cy="158" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="330" cy="158" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <circle cx="420" cy="158" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="60" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">0</text>
    <text x="150" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">1</text>
    <text x="240" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">3</text>
    <text x="330" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">6</text>
    <text x="420" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">8</text>

    <text x="60" y="200" text-anchor="middle" font-size="11" fill="#333">值 1</text>
    <text x="150" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">值 1</text>
    <text x="240" y="200" text-anchor="middle" font-size="11" fill="#333">值 3</text>
    <text x="330" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">值 1</text>
    <text x="420" y="200" text-anchor="middle" font-size="11" fill="#333">值 0</text>

    <text x="60" y="216" text-anchor="middle" font-size="9.5" fill="#7a7a7a">d=0 dist=0</text>
    <text x="150" y="216" text-anchor="middle" font-size="9.5" fill="#7a7a7a">d=1 dist=1</text>
    <text x="240" y="216" text-anchor="middle" font-size="9.5" fill="#7a7a7a">d=2 dist=2</text>
    <text x="330" y="216" text-anchor="middle" font-size="9.5" fill="#7a7a7a">d=3 dist=7</text>
    <text x="420" y="216" text-anchor="middle" font-size="9.5" fill="#7a7a7a">d=4 dist=10</text>

    <text x="60" y="233" text-anchor="middle" font-size="9" fill="#b85450">（最旧的 1 被砍）</text>
  </g>

  <!-- 窗口框 -->
  <g filter="url(#rough2)">
    <rect x="116" y="124" width="334" height="104" fill="#e6f4ea" fill-opacity="0.35"
          stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="8 5" rx="12"/>
    <text x="116" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24">top=1</text>
    <text x="448" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24">i=4</text>
    <text x="283" y="244" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">窗口 [top=1 .. i=4]：值 1 恰好出现 2 次（唯一 dup）→ 合法</text>
  </g>

  <!-- 底部：答案公式与不变量 -->
  <g filter="url(#rough2)">
    <rect x="40" y="256" width="284" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="182" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">以「终点 = 节点 8」更新答案</text>
    <text x="182" y="291" text-anchor="middle" font-size="10" fill="#33506b">长度 = dist[4] − dist[1] = 10 − 1 = 9，节点数 = 4</text>
    <text x="182" y="307" text-anchor="middle" font-size="9.5" fill="#33506b">另一条 1→2→4 等长但只有 3 个节点 → 取 min</text>

    <rect x="344" y="256" width="152" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="420" y="274" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f">窗口不变量</text>
    <text x="420" y="289" text-anchor="middle" font-size="9.5" fill="#8a6d1f">每个值 ≤ 2 次，且至多</text>
    <text x="420" y="303" text-anchor="middle" font-size="9.5" fill="#8a6d1f">一个值恰好 2 次（dup）</text>
    <text x="420" y="317" text-anchor="middle" font-size="9.5" fill="#8a6d1f">第 3 次出现才收缩</text>

    <rect x="40" y="332" width="456" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="268" y="349" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">⚠ 回溯必须恢复现场：top 与 dup 还原为进入前的值，occ[v] 弹出末尾下标</text>
  </g>
</svg>
