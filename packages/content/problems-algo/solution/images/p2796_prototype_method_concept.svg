<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">原型挂载：repeatString 挂到 String.prototype，所有字符串共享</text>

  <!-- the string instance "code" -->
  <text x="320" y="50" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">字符串实例 / 字面量</text>
  <rect x="250" y="56" width="140" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="83" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">"code"</text>

  <!-- arrow down: prototype lookup -->
  <path d="M 320 100 L 320 140" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="124" font-size="10" fill="#446688" filter="url(#rough2)">__proto__</text>

  <!-- String.prototype box -->
  <rect x="80" y="148" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="170" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">String.prototype（所有字符串共享的方法表）</text>

  <!-- method slots -->
  <rect x="100" y="182" width="150" height="30" fill="#fafafa" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="175" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">repeat(n) ·内置</text>

  <rect x="265" y="180" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="350" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">repeatString(num)</text>

  <rect x="450" y="182" width="90" height="30" fill="#fafafa" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="495" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">…</text>

  <text x="320" y="244" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">挂上一次，所有字符串实例都能调用 repeatString</text>

  <!-- this arrow back up to instance -->
  <path d="M 350 180 Q 440 140 392 100" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="455" y="138" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">this = "code"</text>

  <!-- call + result -->
  <path d="M 320 276 L 320 298" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="335" y="292" font-size="10" fill="#888" filter="url(#rough2)">调用</text>

  <rect x="130" y="302" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="329" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"code".repeatString(3) → "codecodecode"</text>

  <text x="320" y="378" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">字面量访问方法时被引擎临时包装成 String 对象，沿原型链定位方法</text>
</svg>
