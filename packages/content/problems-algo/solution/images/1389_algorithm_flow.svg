<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：顺序遍历，逐个 insert 到指定下标</text>

  <!-- Step 1: init -->
  <rect x="160" y="50" width="240" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 初始化 target = [ ]</text>
  <text x="280" y="86" text-anchor="middle" font-size="10" fill="#888">空数组，i = 0</text>

  <path d="M 280 98 L 280 112" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: diamond i < n -->
  <polygon points="280,116 420,170 280,224 140,170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② i &lt; n ?</text>
  <text x="280" y="182" text-anchor="middle" font-size="10" fill="#666">还有元素未处理</text>

  <!-- Yes branch: down to read -->
  <path d="M 280 224 L 280 240" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="292" y="236" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 3: read nums[i], index[i] -->
  <rect x="140" y="244" width="280" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 读取 nums[i] 与 index[i]</text>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#888">约束保证 index[i] ∈ [0, i] 合法</text>

  <path d="M 280 290 L 280 304" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: insert -->
  <rect x="120" y="308" width="320" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ target.insert(index[i], nums[i])</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#888">库自动把 index[i] 及右侧元素右移一位</text>

  <!-- i++ loop back -->
  <path d="M 440 333 L 480 333 L 480 170 L 420 170" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="488" y="254" font-size="10" fill="#666" font-weight="bold">i++</text>
  <text x="488" y="268" font-size="10" fill="#888">继续</text>

  <!-- No branch: left to return -->
  <path d="M 140 170 L 80 170 L 80 372" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="96" y="162" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- return -->
  <rect x="160" y="374" width="240" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">⑤ 返回 target</text>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#888">已包含全部 n 个元素</text>

  <path d="M 80 372 L 80 397 L 160 397" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
</svg>
