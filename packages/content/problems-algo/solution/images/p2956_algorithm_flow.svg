<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 590" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="590" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：建集合 → 双向各扫一趟计数，O(n + m)</text>

  <!-- build sets -->
  <rect x="140" y="32" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="49" text-anchor="middle" font-size="12" fill="#33476b" font-weight="bold" filter="url(#rough2)">去重建集合</text>
  <text x="230" y="67" text-anchor="middle" font-size="11" fill="#33476b" filter="url(#rough2)">s1 = set(nums1)，s2 = set(nums2)</text>
  <path d="M 230 76 L 230 88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- phase 1 loop head -->
  <path d="M 230 92 L 345 120 L 230 148 L 115 120 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="124" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">nums1 还有 x ?</text>

  <!-- loop head: no -> phase 2 (right side) -->
  <text x="352" y="114" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 345 120 L 462 120 L 462 300 L 230 300 L 230 316" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="240" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">第一趟结束</text>

  <!-- loop head: yes -> decision -->
  <text x="240" y="162" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 230 148 L 230 164" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- phase 1 decision -->
  <path d="M 230 168 L 345 196 L 230 224 L 115 196 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="200" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">x ∈ s2 ?</text>

  <text x="352" y="190" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 345 196 L 363 196" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="366" y="178" width="84" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="200" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer1++</text>

  <text x="238" y="242" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 230 224 L 230 252" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- phase 1 loop back -->
  <path d="M 408 214 L 408 258 L 92 258 L 92 120 L 111 120" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="250" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">取下一个 x</text>

  <!-- phase 2 loop head -->
  <path d="M 230 322 L 345 350 L 230 378 L 115 350 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="354" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">nums2 还有 y ?</text>

  <!-- loop head: no -> return (right side) -->
  <text x="352" y="344" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 345 350 L 462 350 L 462 528 L 230 528 L 230 542" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="470" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">第二趟结束</text>

  <!-- loop head: yes -> decision -->
  <text x="240" y="392" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 230 378 L 230 394" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- phase 2 decision -->
  <path d="M 230 398 L 345 426 L 230 454 L 115 426 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="430" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">y ∈ s1 ?</text>

  <text x="352" y="420" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 345 426 L 363 426" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="366" y="408" width="84" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="430" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer2++</text>

  <text x="238" y="472" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 230 454 L 230 482" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- phase 2 loop back -->
  <path d="M 408 444 L 408 488 L 92 488 L 92 350 L 111 350" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="480" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">取下一个 y</text>

  <!-- return -->
  <rect x="140" y="542" width="180" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="564" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">返回 [answer1, answer2]</text>
</svg>
