<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">反转字母表：镜像对称，位置互补</text>

  <!-- 镜像轴 -->
  <text x="259" y="44" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">镜像</text>
  <path d="M 259 48 L 259 142" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- 字母行：a b c d e ⋯ w x y z -->
  <rect x="40" y="52" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="61" y="74" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="84" y="52" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="128" y="52" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="172" y="52" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="193" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="216" y="52" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <text x="281" y="74" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">⋯</text>
  <rect x="304" y="52" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">w</text>
  <rect x="348" y="52" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="369" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">x</text>
  <rect x="392" y="52" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">y</text>
  <rect x="436" y="52" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="457" y="74" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">z</text>

  <!-- 正序位置行 -->
  <text x="30" y="112" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">pos</text>
  <text x="61" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="105" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <text x="149" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <text x="193" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>
  <text x="237" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <text x="281" y="112" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">⋯</text>
  <text x="325" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">23</text>
  <text x="369" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">24</text>
  <text x="413" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">25</text>
  <text x="457" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">26</text>

  <!-- 反转位置行 -->
  <text x="30" y="136" text-anchor="end" font-size="10" fill="#8a6d3a" filter="url(#rough2)">rev</text>
  <text x="61" y="136" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">26</text>
  <text x="105" y="136" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">25</text>
  <text x="149" y="136" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">24</text>
  <text x="193" y="136" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">23</text>
  <text x="237" y="136" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">22</text>
  <text x="281" y="136" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">⋯</text>
  <text x="325" y="136" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="369" y="136" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="413" y="136" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="457" y="136" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 左标注：'a' -->
  <rect x="24" y="180" width="164" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="203" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">'a'：pos = 1</text>
  <text x="106" y="225" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">反转后 rev = 26</text>
  <path d="M 90 180 C 58 152, 40 118, 40 90" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 右标注：'z' -->
  <rect x="332" y="180" width="164" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="203" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">'z'：pos = 26</text>
  <text x="414" y="225" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">反转后 rev = 1</text>
  <path d="M 430 180 C 462 152, 478 118, 478 90" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 公式框 -->
  <rect x="110" y="262" width="300" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="13" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">rev(c) + pos(c) = 27</text>
  <text x="260" y="303" text-anchor="middle" font-size="11.5" fill="#8a6d3a" filter="url(#rough2)">代码里一步算出：'z' − c + 1</text>

  <!-- 示例结果 -->
  <rect x="110" y="330" width="300" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">"abc"：26×1 + 25×2 + 24×3 = 148</text>
</svg>
