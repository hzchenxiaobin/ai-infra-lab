<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">函数图：每个节点至多一条出边 → 若干 ρ 形分量</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">沿出边一直走，要么撞 −1（无环），要么进入本分量唯一的环</text>

  <!-- ===== 左：环 + 挂链 ===== -->
  <text x="150" y="78" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">分量 A：环 + 挂链（有环）</text>

  <!-- 挂链 0 -> 3 -->
  <circle cx="70" cy="135" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <!-- 挂链 1 -> 3 -->
  <circle cx="70" cy="180" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="40" y="160" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">挂链</text>

  <!-- 环：3 → 2 → 4 → 3（三角形） -->
  <!-- 3 顶 -->
  <circle cx="150" cy="160" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- 2 右下 -->
  <circle cx="205" cy="235" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="205" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <!-- 4 左下 -->
  <circle cx="95" cy="235" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="95" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 0 -> 3 -->
  <path d="M 85 140 Q 120 148 134 156" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 1 -> 3 -->
  <path d="M 85 178 Q 120 172 135 165" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 环边 3 -> 2 -->
  <path d="M 164 174 Q 195 200 198 220" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 环边 2 -> 4 -->
  <path d="M 188 235 Q 150 235 112 235" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 环边 4 -> 3 -->
  <path d="M 102 220 Q 105 195 136 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">环长 3 ✓ 最长</text>
  <text x="150" y="293" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3 → 2 → 4 → 3</text>

  <!-- ===== 右：纯挂链到 -1 ===== -->
  <text x="430" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">分量 B：纯挂链撞 −1（无环）</text>

  <circle cx="380" cy="135" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="430" cy="190" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="430" cy="265" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="269" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- -1 终点（虚线框） -->
  <rect x="406" y="295" width="48" height="30" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="430" y="314" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">−1</text>

  <path d="M 390 148 Q 410 165 425 178" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 430 205 L 430 252" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 430 280 L 430 293" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="430" y="345" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">走到 −1 即终止</text>
  <text x="430" y="360" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">该分量无环</text>

  <!-- ===== 底部说明 ===== -->
  <rect x="30" y="370" width="500" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">每个 ρ 形分量恰含一个环；挂链上的点最终汇入环或撞 −1，不会产生新环</text>
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">⇒ 每个分量只需遍历一次，给每个点盖时间戳即可定位环并算长度</text>
</svg>
