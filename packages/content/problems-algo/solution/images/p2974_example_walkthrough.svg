<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [5,4,2,3]（示例 1）</text>

  <!-- Step 1: sort -->
  <text x="30" y="78" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 排序</text>

  <rect x="112" y="56" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">5</text>
  <rect x="154" y="56" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="172" y="78" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">4</text>
  <rect x="196" y="56" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="214" y="78" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <rect x="238" y="56" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="256" y="78" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">3</text>

  <path d="M 282 73 L 308 73" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="314" y="56" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="78" text-anchor="middle" font-size="13" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="356" y="56" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="374" y="78" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="398" y="56" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="416" y="78" text-anchor="middle" font-size="13" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="440" y="56" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="458" y="78" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Step 2: round 1 -->
  <text x="30" y="152" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 第 1 轮</text>

  <rect x="112" y="130" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="152" text-anchor="middle" font-size="13" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="154" y="130" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="152" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="151" y="182" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">Alice 取最小 2，Bob 取次小 3</text>

  <path d="M 196 147 L 306 147" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="251" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Bob 先放</text>

  <rect x="314" y="130" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="152" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="356" y="130" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="152" text-anchor="middle" font-size="13" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="436" y="152" font-size="11" fill="#555" filter="url(#rough2)">← arr = [3,2]</text>

  <!-- Step 3: round 2 -->
  <text x="30" y="236" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 第 2 轮</text>

  <rect x="112" y="214" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="236" text-anchor="middle" font-size="13" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="154" y="214" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="236" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="151" y="266" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">Alice 取 4，Bob 取 5</text>

  <path d="M 196 231 L 306 231" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="251" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">追加 5, 4</text>

  <rect x="314" y="214" width="36" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="236" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <rect x="356" y="214" width="36" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="236" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <rect x="398" y="214" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="236" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="440" y="214" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="458" y="236" text-anchor="middle" font-size="13" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="436" y="266" font-size="11" fill="#555" filter="url(#rough2)">← arr = [3,2,5,4]</text>

  <!-- result -->
  <rect x="48" y="290" width="424" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="13.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最终 arr = [3,2,5,4] ✓</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">构造视角：排序 [2,3,4,5] → 相邻两两交换 → [3,2,5,4]，与逐轮模拟完全一致</text>
  <text x="260" y="362" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例 2 自行验证：[2,5] → 排序 [2,5] → 交换 [5,2] ✓</text>

  <text x="260" y="408" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">「先取的人后放」= 每个相邻对内部顺序颠倒</text>
</svg>
