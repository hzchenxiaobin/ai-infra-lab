<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：生成质数 → 完全背包 → 判 ∞</text>

  <!-- 开始 -->
  <ellipse cx="150" cy="50" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 150 66 L 150 80" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 生成质数 -->
  <rect x="52" y="84" width="196" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 生成前 m 个质数</text>
  <text x="150" y="113" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">试除法：只用已得质数除到 √x</text>
  <path d="M 150 120 L 150 134" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 初始化 -->
  <rect x="52" y="138" width="196" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② dp[0]=0，dp[1..target]=∞</text>
  <path d="M 150 166 L 150 180" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 外层 -->
  <rect x="52" y="184" width="196" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 外层 for i = 1 .. target</text>
  <path d="M 150 212 L 150 226" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 内层 -->
  <rect x="52" y="230" width="196" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 内层 for p ∈ primes</text>
  <text x="150" y="259" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">p 升序，p &gt; i 即 break</text>
  <path d="M 150 266 L 150 280" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 菱形 -->
  <polygon points="150,284 232,320 150,356 68,320" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="317" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p ≤ i 且</text>
  <text x="150" y="331" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[i−p] ≠ ∞ ?</text>

  <!-- ⑤ 否 → 右侧跳过 -->
  <path d="M 232 320 L 258 320" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="245" y="312" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="262" y="302" width="66" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="318" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="295" y="332" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">continue</text>

  <!-- ⑤ 是 ↓ -->
  <path d="M 150 356 L 150 370" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="366" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ⑥ 松弛 -->
  <rect x="52" y="372" width="196" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="388" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⑥ dp[i] ← min(dp[i], dp[i−p]+1)</text>

  <!-- 循环回边（左侧） -->
  <path d="M 52 384 C 30 384, 30 248, 50 248" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="300" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 34 300)" filter="url(#rough2)">p++ / i++ 循环</text>

  <!-- 右列：循环结束 -->
  <path d="M 248 384 C 320 384, 300 208, 340 204" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="240" font-size="10" fill="#666" filter="url(#rough2)">双循环结束</text>

  <rect x="344" y="192" width="96" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="392" y="209" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑦ 看 dp[target]</text>
  <path d="M 392 218 L 392 234" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判 ∞ 菱形 -->
  <polygon points="392,238 462,266 392,294 322,266" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[target] ≠ ∞ ?</text>

  <!-- 是 ↓ 输出 -->
  <path d="M 392 294 L 392 316" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="308" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="344" y="320" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="339" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">输出 dp[target]</text>

  <!-- 否 → 输出 -1 -->
  <path d="M 462 266 L 482 266" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="472" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="452" y="316" width="58" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <path d="M 481 266 L 481 312" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="481" y="335" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">输出 −1</text>
</svg>
