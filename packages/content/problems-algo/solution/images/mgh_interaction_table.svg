<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">交互增量表 &amp; 三进制 mask 编码</text>

  <!-- ===== 交互增量表 ===== -->
  <text x="60" y="64" font-size="13" fill="#446688" font-weight="bold">score[cur][nei]：放置 cur 紧邻已有 nei</text>

  <!-- 表头 -->
  <g font-size="12" fill="#444">
    <rect x="130" y="76" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="96" text-anchor="middle" font-weight="bold">cur ＼ nei</text>
    <rect x="210" y="76" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="245" y="96" text-anchor="middle" fill="#4a7a3a" font-weight="bold">内向(1)</text>
    <rect x="280" y="76" width="70" height="30" fill="#f3e8f5" stroke="#884488" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="315" y="96" text-anchor="middle" fill="#884488" font-weight="bold">外向(2)</text>
  </g>

  <!-- 行 1：内向 -->
  <g font-size="13" fill="#333">
    <rect x="130" y="110" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">内向(1)</text>
    <rect x="210" y="110" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="245" y="131" text-anchor="middle" fill="#b85450" font-weight="bold">−60</text>
    <rect x="280" y="110" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="315" y="131" text-anchor="middle" fill="#d6a040" font-weight="bold">−10</text>
  </g>

  <!-- 行 2：外向 -->
  <g font-size="13" fill="#333">
    <rect x="130" y="146" width="80" height="32" fill="#f3e8f5" stroke="#884488" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="167" text-anchor="middle" fill="#884488" font-weight="bold">外向(2)</text>
    <rect x="210" y="146" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="245" y="167" text-anchor="middle" fill="#d6a040" font-weight="bold">−10</text>
    <rect x="280" y="146" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="315" y="167" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+40</text>
  </g>

  <!-- 推导说明 -->
  <text x="370" y="120" font-size="10" fill="#888">−30(cur) + −30(nei)</text>
  <text x="370" y="137" font-size="10" fill="#888">−30(cur) + 20(nei)</text>
  <text x="370" y="156" font-size="10" fill="#888">20(cur) + −30(nei)</text>
  <text x="370" y="173" font-size="10" fill="#888">20(cur) + 20(nei)</text>

  <!-- 对称性箭头 -->
  <path d="M 245 142 Q 245 150 245 146" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 315 142 Q 315 150 315 146" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="395" y="200" font-size="10" fill="#446688">score[1][2] = score[2][1] = −10（对称）</text>

  <!-- ===== mask 编码示例 ===== -->
  <text x="60" y="230" font-size="13" fill="#446688" font-weight="bold">mask 编码示例（n=3）</text>

  <!-- 示例网格 -->
  <g font-size="12" fill="#333">
    <!-- row 0 -->
    <rect x="80" y="244" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="102" y="265" text-anchor="middle">■</text>
    <rect x="124" y="244" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="146" y="265" text-anchor="middle" fill="#aaa">·</text>
    <rect x="168" y="244" width="44" height="32" fill="#f3e8f5" stroke="#884488" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="190" y="265" text-anchor="middle">◆</text>
    <text x="72" y="265" text-anchor="end" font-size="10" fill="#888">r=0</text>
    <!-- row 1 -->
    <rect x="80" y="280" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="102" y="301" text-anchor="middle" fill="#aaa">·</text>
    <rect x="124" y="280" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="146" y="301" text-anchor="middle" fill="#aaa">·</text>
    <rect x="168" y="280" width="44" height="32" fill="#f3e8f5" stroke="#884488" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="190" y="301" text-anchor="middle">◆</text>
    <text x="72" y="301" text-anchor="end" font-size="10" fill="#888">r=1</text>
  </g>

  <!-- 箭头指向编码 -->
  <line x1="220" y1="278" x2="260" y2="278" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mask 编码 -->
  <rect x="260" y="244" width="240" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="380" y="264" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">填完 (1,2) 后 mask</text>
  <g font-size="14" fill="#333">
    <rect x="280" y="274" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="300" y="293" text-anchor="middle">1</text>
    <rect x="325" y="274" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="345" y="293" text-anchor="middle">0</text>
    <rect x="370" y="274" width="40" height="28" fill="#f3e8f5" stroke="#884488" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="390" y="293" text-anchor="middle">2</text>
  </g>
  <text x="380" y="306" text-anchor="middle" font-size="10" fill="#888">= 1×9 + 0×3 + 2×1 = 11 (十进制)</text>

  <!-- 操作说明 -->
  <rect x="40" y="328" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">mask 读写操作</text>
  <text x="54" y="366" font-size="11" fill="#333">读第 i 位：mask / p3[i] % 3</text>
  <text x="54" y="378" font-size="11" fill="#333">写第 i 位为 v：mask − old × p3[i] + v × p3[i]</text>
</svg>
