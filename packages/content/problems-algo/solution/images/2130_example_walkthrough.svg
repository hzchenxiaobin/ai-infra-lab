<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：head = [5, 4, 2, 1]</text>

  <!-- ===== ① 找中点 ===== -->
  <text x="40" y="62" font-size="12" fill="#d6a040" font-weight="bold">① 找中点：fast 到 ∅，slow 落在后半段起点（值 2）</text>
  <g font-size="13">
    <rect x="100" y="78" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="125" y="99" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <line x1="150" y1="94" x2="178" y2="94" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="184" y="78" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="209" y="99" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="234" y1="94" x2="262" y2="94" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="268" y="78" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="293" y="99" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <line x1="318" y1="94" x2="346" y2="94" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="352" y="78" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="377" y="99" text-anchor="middle" fill="#333" font-weight="bold">1</text>
  </g>
  <text x="293" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ slow</text>

  <!-- ===== ② 反转后半 ===== -->
  <text x="40" y="160" font-size="12" fill="#b85450" font-weight="bold">② 反转后半段：[2 → 1] 掉头成 [1 → 2]</text>
  <g font-size="13">
    <rect x="100" y="176" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="125" y="197" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <line x1="150" y1="192" x2="178" y2="192" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="184" y="176" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="209" y="197" text-anchor="middle" fill="#333" font-weight="bold">4</text>

    <text x="270" y="197" font-size="14" fill="#d6a040" font-weight="bold">⇒</text>

    <rect x="306" y="176" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="331" y="197" text-anchor="middle" fill="#8a3a36" font-weight="bold">1</text>
    <line x1="356" y1="192" x2="384" y2="192" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <rect x="390" y="176" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="415" y="197" text-anchor="middle" fill="#8a3a36" font-weight="bold">2</text>
  </g>
  <text x="209" y="226" text-anchor="middle" font-size="10" fill="#888">前半段：p1 起点</text>
  <text x="415" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">p2 起点</text>

  <!-- ===== ③ 配对求和 ===== -->
  <text x="40" y="258" font-size="12" fill="#4a7a3a" font-weight="bold">③ 配对求和：p1、p2 同步走，ans 取最大</text>

  <!-- 第 1 轮 -->
  <text x="40" y="290" font-size="11" fill="#446688" font-weight="bold">轮 1</text>
  <g font-size="13">
    <rect x="92" y="276" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="115" y="296" text-anchor="middle" fill="#8a6a20" font-weight="bold">5</text>
    <rect x="148" y="276" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="171" y="296" text-anchor="middle" fill="#333">4</text>

    <rect x="262" y="276" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="285" y="296" text-anchor="middle" fill="#8a6a20" font-weight="bold">1</text>
    <rect x="318" y="276" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="341" y="296" text-anchor="middle" fill="#8a3a36">2</text>
  </g>
  <text x="200" y="296" font-size="12" fill="#4a7a3a" font-weight="bold">p1(5) + p2(1) = 6</text>
  <text x="430" y="296" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 6</text>

  <!-- 第 2 轮 -->
  <text x="40" y="340" font-size="11" fill="#446688" font-weight="bold">轮 2</text>
  <g font-size="13">
    <rect x="92" y="326" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="115" y="346" text-anchor="middle" fill="#333">5</text>
    <rect x="148" y="326" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="171" y="346" text-anchor="middle" fill="#8a6a20" font-weight="bold">4</text>

    <rect x="262" y="326" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="285" y="346" text-anchor="middle" fill="#8a3a36">1</text>
    <rect x="318" y="326" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="341" y="346" text-anchor="middle" fill="#8a6a20" font-weight="bold">2</text>
  </g>
  <text x="200" y="346" font-size="12" fill="#4a7a3a" font-weight="bold">p1(4) + p2(2) = 6</text>
  <text x="430" y="346" font-size="12" fill="#4a7a3a" font-weight="bold">ans = max(6,6)=6</text>

  <!-- 终止 -->
  <text x="40" y="390" font-size="11" fill="#888" font-weight="bold">终止</text>
  <text x="92" y="390" font-size="12" fill="#888">p2 走到 ∅，循环结束，返回 ans = 6 ✓</text>

  <rect x="190" y="404" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="424" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最大孪生和 = 6</text>
</svg>
