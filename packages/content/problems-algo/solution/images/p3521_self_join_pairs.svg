<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：同用户自连接 + p1 &lt; p2，把购物篮两两展开成无序对</text>

  <!-- 用户 4 的购物篮 -->
  <text x="260" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">用户 4 的购物篮（user_id = 4）</text>
  <rect x="144" y="58" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">101</text>
  <rect x="204" y="58" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">102</text>
  <rect x="264" y="58" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">103</text>
  <rect x="324" y="58" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">104</text>

  <!-- 自连接箭头 -->
  <path d="M 260 94 L 260 116" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="108" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">自连接：ON user_id 相同，两两配对</text>

  <text x="260" y="140" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">再加 p1.product_id &lt; p2.product_id：4 件商品 → C(4,2) = 6 个无序对</text>

  <!-- 6 个产品对，两行三列 -->
  <rect x="88" y="150" width="104" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">(101,102)</text>
  <rect x="208" y="150" width="104" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">(101,103)</text>
  <rect x="328" y="150" width="104" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">(101,104)</text>
  <rect x="88" y="188" width="104" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">(102,103)</text>
  <rect x="208" y="188" width="104" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">(102,104)</text>
  <rect x="328" y="188" width="104" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">(103,104)</text>

  <!-- 反例：不加 < 号的垃圾行 -->
  <rect x="64" y="230" width="392" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">若不加 &lt; 号，自连接还会产出垃圾行：</text>
  <text x="260" y="273" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(102,101) 镜像重复 ✗、(101,101) 自己配自己 ✗ —— 同一对被数两遍</text>

  <!-- 结论框 -->
  <rect x="56" y="302" width="408" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">ON user_id 把配对锁进同一个购物篮，&lt; 号把无序对唯一化</text>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每个 (用户, 无序产品对) 恰好一行 → COUNT(DISTINCT user_id)</text>
  <text x="260" y="364" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">就是共同购买人数；quantity 是烟雾弹——题目数的是「不同客户」</text>
</svg>
