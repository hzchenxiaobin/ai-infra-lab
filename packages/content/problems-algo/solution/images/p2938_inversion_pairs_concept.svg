<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：最小步数 =「10」逆序对的个数</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 s = "10100" 为例（● = 黑球 1，○ = 白球 0）</text>

  <!-- index labels -->
  <text x="100" y="66" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="158" y="66" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="216" y="66" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="274" y="66" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="332" y="66" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=4</text>

  <!-- balls -->
  <circle cx="100" cy="88" r="17" fill="#446688" stroke="#2f4860" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="93" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="158" cy="88" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="158" y="93" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="216" cy="88" r="17" fill="#446688" stroke="#2f4860" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="216" y="93" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="274" cy="88" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="274" y="93" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="332" cy="88" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="332" y="93" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- inversion pair arcs -->
  <path d="M 100 108 Q 129 132 158 108" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 100 108 Q 187 158 274 108" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 100 108 Q 216 178 332 108" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 216 108 Q 245 132 274 108" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 216 108 Q 274 158 332 108" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="216" y="163" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">每条绿弧 = 一对「1 在前、0 在后」</text>

  <!-- right annotations -->
  <text x="356" y="76" font-size="11" fill="#555" filter="url(#rough2)">第 1 个 1：右边有 3 个 0</text>
  <text x="356" y="95" font-size="11" fill="#555" filter="url(#rough2)">第 2 个 1：右边有 2 个 0</text>
  <text x="356" y="118" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">K = 3 + 2 = 5 对</text>

  <!-- effect of one adjacent swap -->
  <rect x="35" y="196" width="450" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">一次相邻交换，逆序对数的变化只有三种：</text>
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">「10」→「01」：−1（有效）　　「01」→「10」：+1（倒退）</text>
  <text x="260" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">「11」/「00」互换：不变 —— 纯浪费一步，最优解永远不做</text>

  <!-- conclusion -->
  <rect x="35" y="286" width="450" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">终态「0…01…1」逆序对为 0；每步至多消 1 个 ⇒ 至少 K 步，逐对消除 ⇒ K 步可达</text>
  <text x="260" y="332" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = #{ (i, j) : i &lt; j, s[i]='1', s[j]='0' }</text>

  <!-- tip -->
  <rect x="35" y="366" width="450" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">换个说法：每个 0 左边有几个 1，它就得被换过几次</text>
  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">一遍扫描就能全部数出来 —— 见下方算法流程</text>
</svg>
