<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：KMP 数好偏移 → 闭式计数 → 模意义拼答案</text>

  <!-- step 1 -->
  <rect x="150" y="48" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① KMP：数 t 在 s+s 中、起点 ≤ n−1 的出现次数 m</text>
  <text x="310" y="83" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（每个出现位置 p 对应好偏移 L = (n−p) mod n）</text>

  <path d="M 310 92 L 310 112" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="310,114 420,142 310,170 200,142" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="147" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">m == 0 ？</text>

  <path d="M 420 142 L 470 142 L 470 165" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="448" y="134" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="436" y="167" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="501" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return 0</text>
  <text x="501" y="216" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">t 根本不是 s 的旋转</text>

  <path d="M 310 170 L 310 192" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="186" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- step 2 -->
  <rect x="150" y="194" width="320" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 拆好偏移：m₀ = [s == t]，m₁ = m − m₀</text>
  <text x="310" y="229" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（偏移 0 用 x_k 计数，其余 m₁ 个偏移共用 y_k）</text>

  <path d="M 310 236 L 310 256" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="150" y="258" width="320" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="276" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 快速幂：p = (n−1)^k，sign = (−1)^k，invN = n⁻¹</text>
  <text x="310" y="293" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（k 高达 10¹⁵，O(log k) 必须快速幂）</text>

  <path d="M 310 300 L 310 320" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="150" y="322" width="320" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="340" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">④ 闭式：x = (p + sign·(n−1))·invN，y = (p − sign)·invN</text>
  <text x="310" y="357" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（模 10⁹+7；注意负数先 +MOD 再取模）</text>

  <path d="M 310 364 L 310 384" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="150" y="386" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="406" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑤ 答案 = (m₀·x + m₁·y) mod (10⁹+7)</text>
</svg>
