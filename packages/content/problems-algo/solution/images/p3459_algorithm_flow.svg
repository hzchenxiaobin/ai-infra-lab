<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：主循环枚举「1 起点 × 4 方向」，记忆化 dfs 双分支</text>

  <!-- Left: main flow -->
  <rect x="88" y="38" width="60" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 118 66 L 118 84" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="28" y="86" width="180" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="104" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">枚举每个值为 1 的格子 (i,j)</text>
  <text x="118" y="120" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">× 初始方向 d = 0..3</text>

  <path d="M 118 130 L 118 150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="28" y="152" width="180" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="170" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">ans ← max(ans,</text>
  <text x="118" y="186" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">1 + dfs(i, j, d, 0))</text>

  <path d="M 118 196 L 118 236" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="68" y="238" width="100" height="30" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="258" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">返回 ans</text>

  <!-- call arrow into dfs frame -->
  <path d="M 208 174 L 246 174" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="227" y="166" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">调用</text>
  <path d="M 246 214 C 226 214 226 196 208 194" fill="none" stroke="#d6a040" stroke-width="1.5"
        stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="222" y="228" text-anchor="middle" font-size="9" fill="#b07516" filter="url(#rough2)">回传</text>

  <!-- Left bottom: complexity note -->
  <rect x="26" y="292" width="190" height="122" rx="8" fill="#f5f0e6" stroke="#b85450" stroke-width="1" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="121" y="312" text-anchor="middle" font-size="10.5" fill="#7a4a2b" filter="url(#rough2)">复杂度与易错点</text>
  <text x="36" y="330" font-size="9.5" fill="#7a4a2b" filter="url(#rough2)">· 状态 (r,c,d,t) 共 8nm 个</text>
  <text x="36" y="346" font-size="9.5" fill="#7a4a2b" filter="url(#rough2)">· 每状态 O(1) 转移 → O(n·m)</text>
  <text x="36" y="362" font-size="9.5" fill="#7a4a2b" filter="url(#rough2)">· 转向分支仅在 t=0 时存在</text>
  <text x="36" y="378" font-size="9.5" fill="#7a4a2b" filter="url(#rough2)">· 两分支共用同一期望值 nxt</text>
  <text x="36" y="394" font-size="9.5" fill="#7a4a2b" filter="url(#rough2)">· memo 初值 −1，合法值 ≥ 0</text>

  <!-- Right: dfs frame -->
  <rect x="246" y="56" width="262" height="358" rx="10" fill="none" stroke="#4a7a3a"
        stroke-width="1.5" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="377" y="76" text-anchor="middle" font-size="11.5" fill="#2d5523" filter="url(#rough2)">dfs(r, c, d, turned) 递归体</text>

  <!-- memo check diamond -->
  <polygon points="340 91 405 110 340 129 275 110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="106" text-anchor="middle" font-size="9" fill="#7a5a18" filter="url(#rough2)">memo[r][c][d][t] ≥ 0 ?</text>
  <text x="340" y="118" text-anchor="middle" font-size="9" fill="#7a5a18" filter="url(#rough2)">（已算过？）</text>
  <path d="M 405 110 L 428 110" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="416" y="102" text-anchor="middle" font-size="9" fill="#b07516" filter="url(#rough2)">是</text>
  <rect x="430" y="96" width="70" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="114" text-anchor="middle" font-size="10" fill="#7a5a18" filter="url(#rough2)">返回 memo</text>
  <path d="M 340 129 L 340 146" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="142" font-size="9" fill="#666" filter="url(#rough2)">否</text>

  <!-- nxt box -->
  <rect x="265" y="148" width="150" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nxt = (v==2 ? 0 : 2)</text>

  <!-- split to two branches -->
  <path d="M 340 176 L 340 188 L 305 188 L 305 202" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 188 L 448 188 L 448 202" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- branch 1: straight -->
  <rect x="250" y="204" width="110" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="220" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">分支一：直走一步</text>
  <text x="305" y="235" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">(r+dr[d], c+dc[d])</text>

  <path d="M 305 242 L 305 254" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="305 256 360 275 305 294 250 275" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="271" text-anchor="middle" font-size="9" fill="#2d5523" filter="url(#rough2)">界内 且</text>
  <text x="305" y="283" text-anchor="middle" font-size="9" fill="#2d5523" filter="url(#rough2)">grid[nr][nc]==nxt ?</text>

  <path d="M 305 294 L 305 316" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="315" y="308" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="250" y="318" width="110" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="334" text-anchor="middle" font-size="9" fill="#2d5523" filter="url(#rough2)">best ← max(best,</text>
  <text x="305" y="348" text-anchor="middle" font-size="9" fill="#2d5523" filter="url(#rough2)">1+dfs(nr,nc,d,t))</text>

  <!-- branch 2: turn -->
  <rect x="390" y="204" width="112" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="446" y="220" text-anchor="middle" font-size="10" fill="#7a5a18" filter="url(#rough2)">分支二：顺时针转向</text>
  <text x="446" y="235" text-anchor="middle" font-size="9" fill="#7a5a18" filter="url(#rough2)">d2 = (d+1) % 4</text>

  <path d="M 448 242 L 448 254" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="448 256 503 275 448 294 393 275" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="448" y="271" text-anchor="middle" font-size="9" fill="#7a5a18" filter="url(#rough2)">未转向 且 界内</text>
  <text x="448" y="283" text-anchor="middle" font-size="9" fill="#7a5a18" filter="url(#rough2)">且 == nxt ?</text>

  <path d="M 448 294 L 448 316" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="458" y="308" font-size="9" fill="#b07516" filter="url(#rough2)">是</text>

  <rect x="390" y="318" width="112" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="446" y="334" text-anchor="middle" font-size="9" fill="#7a5a18" filter="url(#rough2)">best ← max(best,</text>
  <text x="446" y="348" text-anchor="middle" font-size="9" fill="#7a5a18" filter="url(#rough2)">1+dfs(nr,nc,d2,1))</text>

  <!-- no branches merge to return -->
  <path d="M 360 275 L 376 275" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 393 275 L 376 275 L 376 374" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="368" y="266" font-size="9" fill="#666" filter="url(#rough2)">否</text>
  <text x="384" y="300" font-size="9" fill="#666" filter="url(#rough2)">否</text>

  <!-- update boxes down to return -->
  <path d="M 305 358 L 305 374" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 448 358 L 448 374" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- return box -->
  <rect x="265" y="376" width="220" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="396" text-anchor="middle" font-size="10" fill="#7a2f2b" filter="url(#rough2)">memo[r][c][d][t] ← best，返回 best</text>
</svg>
