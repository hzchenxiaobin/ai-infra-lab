<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：频率统计 → t 轮原地转移 → 求和取模</text>

  <!-- 开始 -->
  <rect x="210" y="42" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 72 L 260 90" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 统计频率 -->
  <rect x="160" y="92" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">扫一遍 s，建 cnt[26]</text>
  <text x="260" y="120" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">O(n)，丢掉顺序只留频率</text>
  <path d="M 260 126 L 260 146" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环菱形 -->
  <polygon points="260,148 340,178 260,208 180,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">已转移 step 轮</text>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">step &lt; t ?</text>
  <path d="M 340 178 L 392 178" fill="none" stroke="#a07830" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="366" y="170" text-anchor="middle" font-size="10" fill="#8a3833" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="238" y="222" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 208 L 260 228" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转移框 -->
  <rect x="120" y="230" width="280" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">z = cnt[25]（先暂存，防覆盖）</text>
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">倒序搬移：cnt[i] = cnt[i−1]（i = 25 … 1）</text>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">cnt[0] = z；cnt[1] = (cnt[1] + z) mod p</text>

  <!-- 回边 -->
  <path d="M 120 260 L 76 260 L 76 178 L 176 178" fill="none" stroke="#a07830" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="76" y="252" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">step+1</text>

  <!-- 求和输出 -->
  <path d="M 392 178 L 440 178 L 440 240 L 404 240" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="306" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="327" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = Σ cnt[i] mod (1e9+7)</text>
  <path d="M 440 240 C 440 282, 400 300, 402 306" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部备注 -->
  <rect x="20" y="344" width="480" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="362" font-size="10.5" fill="#555" filter="url(#rough2)">💡 倒序搬移可原地完成：写 cnt[i] 时读 cnt[i−1]，被写位置本轮不再被读，O(26) 空间零额外数组</text>
</svg>
