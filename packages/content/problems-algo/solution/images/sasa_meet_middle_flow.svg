<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Meet in the Middle：折半枚举 + 哈希汇合</text>

  <!-- Array b split -->
  <text x="60" y="56" font-size="11" fill="#888">数组 b[]</text>
  <rect x="110" y="44" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="61" text-anchor="middle" font-size="10" fill="#333">b₀</text>
  <rect x="152" y="44" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="61" text-anchor="middle" font-size="10" fill="#333">b₁</text>
  <text x="195" y="61" font-size="10" fill="#888">···</text>
  <rect x="216" y="44" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">b_{n/2-1}</text>

  <text x="310" y="61" font-size="14" fill="#888">|</text>

  <rect x="324" y="44" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="61" text-anchor="middle" font-size="10" fill="#333">b_{n/2}</text>
  <text x="369" y="61" font-size="10" fill="#888">···</text>
  <rect x="390" y="44" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">b_{n-1}</text>

  <!-- Left half label -->
  <rect x="110" y="78" width="146" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="183" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">左半（n/2 个）</text>

  <!-- Right half label -->
  <rect x="324" y="78" width="106" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="377" y="92" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">右半（n/2 个）</text>

  <!-- Left: enumerate subsets -->
  <rect x="40" y="110" width="240" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="160" y="130" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">枚举 2^{n/2} 个子集</text>
  <text x="160" y="148" text-anchor="middle" font-size="10" fill="#555">每个子集记录 (sum, size)</text>
  <text x="160" y="166" text-anchor="middle" font-size="10" fill="#888">2^{15} = 32768 个</text>

  <!-- Right: enumerate subsets -->
  <rect x="320" y="110" width="240" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">枚举 2^{n/2} 个子集</text>
  <text x="440" y="148" text-anchor="middle" font-size="10" fill="#555">每个子集记录 (sum, size)</text>
  <text x="440" y="166" text-anchor="middle" font-size="10" fill="#888">2^{15} = 32768 个</text>

  <!-- Left arrow to hash map -->
  <path d="M 160 182 L 160 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="172" y="196" font-size="9" fill="#4a7a3a">建表</text>

  <!-- Hash map -->
  <rect x="50" y="204" width="220" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="160" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">哈希表 map</text>
  <line x1="160" y1="230" x2="160" y2="298" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="246" font-size="10" fill="#888">sum</text>
  <text x="220" y="246" font-size="10" fill="#888">sizes</text>
  <text x="80" y="264" font-size="10" fill="#333">0</text>
  <text x="220" y="264" font-size="10" fill="#333">{0}</text>
  <text x="80" y="280" font-size="10" fill="#333">-28</text>
  <text x="220" y="280" font-size="10" fill="#333">{1}</text>
  <text x="80" y="296" font-size="10" fill="#d6a040" font-weight="bold">-32</text>
  <text x="220" y="296" font-size="10" fill="#d6a040" font-weight="bold">{2}</text>

  <!-- Right arrow to hash map (query) -->
  <path d="M 440 182 L 440 200 L 300 200 L 280 220" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="196" font-size="9" fill="#b85450">查 −sum_r</text>

  <!-- Match check -->
  <rect x="100" y="320" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="342" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">命中？检查 1 ≤ size_l + size_r ≤ n−1</text>
  <text x="300" y="356" text-anchor="middle" font-size="10" fill="#b85450">是 → return true ✓</text>

  <!-- Complexity -->
  <rect x="100" y="378" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="398" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">O(2^{n/2} · n)  时间 / O(2^{n/2}) 空间</text>
</svg>
