<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：连续同值段（run）每段至多选一个，取每段首个</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">groups = [0, 0, 1, 1, 1, 0, 1] → 切成 4 段 → 最长交替子序列长度 = 4</text>

  <!-- pick / skip marks -->
  <g filter="url(#rough2)" font-size="14" font-weight="bold">
    <text x="110" y="64" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="166" y="64" text-anchor="middle" fill="#b85450">✗</text>
    <text x="222" y="64" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="278" y="64" text-anchor="middle" fill="#b85450">✗</text>
    <text x="334" y="64" text-anchor="middle" fill="#b85450">✗</text>
    <text x="390" y="64" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="446" y="64" text-anchor="middle" fill="#4a7a3a">✓</text>
  </g>

  <!-- words row -->
  <text x="76" y="89" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">words</text>
  <g filter="url(#rough2)" font-size="13">
    <rect x="84" y="68" width="52" height="32" fill="#f5f5f5" stroke="#888888" stroke-width="1.4" rx="4"/>
    <text x="110" y="89" text-anchor="middle" fill="#333">a</text>
    <rect x="140" y="68" width="52" height="32" fill="#f5f5f5" stroke="#888888" stroke-width="1.4" rx="4"/>
    <text x="166" y="89" text-anchor="middle" fill="#333">b</text>
    <rect x="196" y="68" width="52" height="32" fill="#f5f5f5" stroke="#888888" stroke-width="1.4" rx="4"/>
    <text x="222" y="89" text-anchor="middle" fill="#333">c</text>
    <rect x="252" y="68" width="52" height="32" fill="#f5f5f5" stroke="#888888" stroke-width="1.4" rx="4"/>
    <text x="278" y="89" text-anchor="middle" fill="#333">d</text>
    <rect x="308" y="68" width="52" height="32" fill="#f5f5f5" stroke="#888888" stroke-width="1.4" rx="4"/>
    <text x="334" y="89" text-anchor="middle" fill="#333">e</text>
    <rect x="364" y="68" width="52" height="32" fill="#f5f5f5" stroke="#888888" stroke-width="1.4" rx="4"/>
    <text x="390" y="89" text-anchor="middle" fill="#333">f</text>
    <rect x="420" y="68" width="52" height="32" fill="#f5f5f5" stroke="#888888" stroke-width="1.4" rx="4"/>
    <text x="446" y="89" text-anchor="middle" fill="#333">g</text>
  </g>

  <!-- groups row -->
  <text x="76" y="129" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">groups</text>
  <g filter="url(#rough2)" font-size="13">
    <rect x="84" y="108" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="110" y="129" text-anchor="middle" fill="#2e5c22" font-weight="bold">0</text>
    <rect x="140" y="108" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="166" y="129" text-anchor="middle" fill="#2e5c22">0</text>
    <rect x="196" y="108" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="222" y="129" text-anchor="middle" fill="#b07818" font-weight="bold">1</text>
    <rect x="252" y="108" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="278" y="129" text-anchor="middle" fill="#b07818">1</text>
    <rect x="308" y="108" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="334" y="129" text-anchor="middle" fill="#b07818">1</text>
    <rect x="364" y="108" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="390" y="129" text-anchor="middle" fill="#2e5c22" font-weight="bold">0</text>
    <rect x="420" y="108" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="446" y="129" text-anchor="middle" fill="#b07818" font-weight="bold">1</text>
  </g>

  <!-- indices -->
  <g filter="url(#rough2)" font-size="11" fill="#777">
    <text x="76" y="158" text-anchor="end">下标 i</text>
    <text x="110" y="158" text-anchor="middle">0</text>
    <text x="166" y="158" text-anchor="middle">1</text>
    <text x="222" y="158" text-anchor="middle">2</text>
    <text x="278" y="158" text-anchor="middle">3</text>
    <text x="334" y="158" text-anchor="middle">4</text>
    <text x="390" y="158" text-anchor="middle">5</text>
    <text x="446" y="158" text-anchor="middle">6</text>
  </g>

  <!-- run brackets -->
  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="1.8">
    <path d="M 84 162 L 84 174 L 192 174 L 192 162"/>
    <path d="M 196 162 L 196 174 L 360 174 L 360 162"/>
    <path d="M 364 162 L 364 174 L 416 174 L 416 162"/>
    <path d="M 420 162 L 420 174 L 472 174 L 472 162"/>
  </g>
  <g filter="url(#rough2)" font-size="11" font-weight="bold">
    <text x="138" y="192" text-anchor="middle" fill="#4a7a3a">段① 值0</text>
    <text x="278" y="192" text-anchor="middle" fill="#b07818">段② 值1</text>
    <text x="390" y="192" text-anchor="middle" fill="#4a7a3a">段③ 值0</text>
    <text x="446" y="192" text-anchor="middle" fill="#b07818">段④ 值1</text>
  </g>

  <!-- greedy construction box -->
  <rect x="36" y="212" width="272" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#2e5c22">
    <text x="172" y="236" text-anchor="middle" font-weight="bold">贪心构造：每段取首个元素</text>
    <text x="172" y="258" text-anchor="middle">选中 i = 0, 2, 5, 6（打 ✓ 处）</text>
    <text x="172" y="278" text-anchor="middle">组值序列 [0, 1, 0, 1]，相邻两两不同 ✓</text>
    <text x="172" y="298" text-anchor="middle">长度 = 段数 = 4，与上界重合 → 最优</text>
    <text x="172" y="318" text-anchor="middle">「段首」= i==0 或 groups[i]≠groups[i−1]</text>
  </g>

  <!-- counterexample box -->
  <rect x="324" y="212" width="200" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#8c3a36">
    <text x="424" y="236" text-anchor="middle" font-weight="bold">为什么每段至多一个？</text>
    <text x="424" y="258" text-anchor="middle">同段选两个，如 i=2 与 i=4：</text>
    <text x="424" y="278" text-anchor="middle">中间（i=3）组值也全是 1</text>
    <text x="424" y="298" text-anchor="middle">不选中间 → 1,1 相邻 ✗</text>
    <text x="424" y="318" text-anchor="middle">选中间 → 仍 1,1 相邻 ✗</text>
  </g>
</svg>
