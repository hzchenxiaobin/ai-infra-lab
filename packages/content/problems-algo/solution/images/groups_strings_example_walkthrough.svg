<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：words = ["a","b","ab","cde"]</text>

  <!-- step 1: mask table -->
  <text x="20" y="50" font-size="12" fill="#555" font-weight="bold">① 掩码表：</text>
  <!-- header -->
  <rect x="20" y="58" width="80" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="middle" font-size="10.5" fill="#555">字符串</text>
  <rect x="100" y="58" width="120" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="72" text-anchor="middle" font-size="10.5" fill="#555">掩码（低5位）</text>
  <rect x="220" y="58" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="72" text-anchor="middle" font-size="10.5" fill="#555">下标</text>

  <rect x="20" y="78" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="92" text-anchor="middle" font-size="10.5" fill="#333">"a"</text>
  <rect x="100" y="78" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="160" y="92" text-anchor="middle" font-size="10.5" fill="#333">00001</text>
  <rect x="220" y="78" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="250" y="92" text-anchor="middle" font-size="10.5" fill="#333">0</text>

  <rect x="20" y="98" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="112" text-anchor="middle" font-size="10.5" fill="#333">"b"</text>
  <rect x="100" y="98" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="160" y="112" text-anchor="middle" font-size="10.5" fill="#333">00010</text>
  <rect x="220" y="98" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="250" y="112" text-anchor="middle" font-size="10.5" fill="#333">1</text>

  <rect x="20" y="118" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="132" text-anchor="middle" font-size="10.5" fill="#333">"ab"</text>
  <rect x="100" y="118" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="160" y="132" text-anchor="middle" font-size="10.5" fill="#333">00011</text>
  <rect x="220" y="118" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="250" y="132" text-anchor="middle" font-size="10.5" fill="#333">2</text>

  <rect x="20" y="138" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="152" text-anchor="middle" font-size="10.5" fill="#333">"cde"</text>
  <rect x="100" y="138" width="120" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="160" y="152" text-anchor="middle" font-size="10.5" fill="#333">11100</text>
  <rect x="220" y="138" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="250" y="152" text-anchor="middle" font-size="10.5" fill="#333">3</text>

  <!-- step 2: add/remove edges -->
  <text x="310" y="50" font-size="12" fill="#555" font-weight="bold">② 添加/删去（位翻转）：</text>
  <rect x="310" y="58" width="230" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="78" font-size="11" fill="#333">"a"(1) 翻 bit1 → 3("ab") ✓</text>
  <text x="320" y="96" font-size="11" fill="#333">"b"(2) 翻 bit0 → 3("ab") ✓</text>
  <text x="320" y="114" font-size="11" fill="#333">"ab"(3) 翻 bit0→2, bit1→1 ✓</text>
  <text x="320" y="132" font-size="11" fill="#b85450">"cde"(28) 翻任意位 → 不在表</text>
  <text x="320" y="150" font-size="11" fill="#4a7a3a">→ {a,b,ab} 连通；{cde} 独立</text>

  <!-- step 3: replace virtual -->
  <text x="20" y="182" font-size="12" fill="#555" font-weight="bold">③ 替换虚点（以 "a","b" 为例）：</text>
  <rect x="20" y="190" width="520" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <rect x="40" y="206" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"a"={a}</text>
  <text x="100" y="238" text-anchor="middle" font-size="10" fill="#555">删 a → sub=0(空集)</text>

  <rect x="220" y="200" width="120" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">虚点 v0 = ∅</text>
  <text x="280" y="240" text-anchor="middle" font-size="10" fill="#555">sub = m ^ (1&lt;&lt;bit)</text>

  <rect x="400" y="206" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"b"={b}</text>
  <text x="460" y="238" text-anchor="middle" font-size="10" fill="#555">删 b → sub=0(空集)</text>

  <text x="280" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a">"a" 与 "b" 共享虚点 v0 → 替换 a↔b，并入同组</text>

  <!-- step 4: result -->
  <text x="20" y="302" font-size="12" fill="#555" font-weight="bold">④ 统计（只数真实节点）：</text>
  <rect x="20" y="310" width="520" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <rect x="40" y="322" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="150" y="344" text-anchor="middle" font-size="11" fill="#333">根 r1: {a,b,ab} → 大小 3</text>

  <rect x="290" y="322" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="400" y="344" text-anchor="middle" font-size="11" fill="#333">根 r2: {cde} → 大小 1</text>

  <!-- final -->
  <rect x="120" y="384" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = [2, 3]</text>
</svg>
