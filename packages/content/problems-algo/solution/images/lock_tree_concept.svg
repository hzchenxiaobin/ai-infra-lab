<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="384" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心：parent[] 向上查祖先，children[] 向下查子孙</text>

  <!-- ===== tree edges (gray) ===== -->
  <line x1="270" y1="92" x2="190" y2="148" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="270" y1="92" x2="350" y2="148" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="190" y1="148" x2="150" y2="224" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="190" y1="148" x2="230" y2="224" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="350" y1="148" x2="310" y2="224" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="350" y1="148" x2="390" y2="224" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- ===== green down-walk path 0 -> 1 -> 4 (route to locked node) ===== -->
  <path d="M262 98 L196 144" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M198 160 L226 214" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== nodes ===== -->
  <circle cx="270" cy="92" r="17" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="12" fill="#333">0</text>

  <circle cx="190" cy="148" r="17" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="152" text-anchor="middle" font-size="12" fill="#333">1</text>

  <circle cx="350" cy="148" r="17" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="152" text-anchor="middle" font-size="12" fill="#333">2</text>

  <circle cx="150" cy="224" r="15" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="228" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- node 4: locked -->
  <circle cx="230" cy="224" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="230" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <text x="230" y="252" text-anchor="middle" font-size="9.5" fill="#b85450">U5 上锁</text>

  <circle cx="310" cy="224" r="15" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="228" text-anchor="middle" font-size="11" fill="#333">5</text>

  <circle cx="390" cy="224" r="15" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="228" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- ===== blue up-arrow from node 0 ===== -->
  <path d="M286 84 Q 330 64 374 58" stroke="#446688" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- up callout -->
  <rect x="380" y="40" width="148" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="454" y="58" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">向上查祖先</text>
  <text x="454" y="74" text-anchor="middle" font-size="9.5" fill="#555">parent[0]=-1 → 无祖先 ✓</text>

  <!-- down callout (left) -->
  <rect x="20" y="250" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="105" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">向下 DFS 子孙</text>
  <text x="105" y="282" text-anchor="middle" font-size="9.5" fill="#555">遍历 children[] → 4 已上锁 ✓</text>

  <!-- ===== legend ===== -->
  <g filter="url(#rough2)">
    <rect x="74" y="300" width="18" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <text x="98" y="310" font-size="10" fill="#555">向下查子孙</text>
    <rect x="214" y="300" width="18" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="238" y="310" font-size="10" fill="#555">向上查祖先</text>
    <rect x="354" y="300" width="18" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2"/>
    <text x="378" y="310" font-size="10" fill="#555">已上锁</text>
  </g>

  <!-- ===== lockUser[] table ===== -->
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">lockUser[]：-1 = 未上锁，否则为上锁用户 id</text>
  <g filter="url(#rough2)">
    <!-- index row -->
    <rect x="116" y="340" width="44" height="20" fill="#f6f8fa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="160" y="340" width="44" height="20" fill="#f6f8fa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="204" y="340" width="44" height="20" fill="#f6f8fa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="248" y="340" width="44" height="20" fill="#f6f8fa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="292" y="340" width="44" height="20" fill="#f6f8fa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="336" y="340" width="44" height="20" fill="#f6f8fa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="380" y="340" width="44" height="20" fill="#f6f8fa" stroke="#bbb" stroke-width="1" rx="3"/>
    <!-- value row -->
    <rect x="116" y="360" width="44" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="160" y="360" width="44" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="204" y="360" width="44" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="248" y="360" width="44" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="292" y="360" width="44" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="336" y="360" width="44" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="380" y="360" width="44" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
  </g>
  <g font-size="10" fill="#333">
    <text x="138" y="354" text-anchor="middle">0</text>
    <text x="182" y="354" text-anchor="middle">1</text>
    <text x="226" y="354" text-anchor="middle">2</text>
    <text x="270" y="354" text-anchor="middle">3</text>
    <text x="314" y="354" text-anchor="middle">4</text>
    <text x="358" y="354" text-anchor="middle">5</text>
    <text x="402" y="354" text-anchor="middle">6</text>
    <text x="138" y="374" text-anchor="middle">-1</text>
    <text x="182" y="374" text-anchor="middle">-1</text>
    <text x="226" y="374" text-anchor="middle">-1</text>
    <text x="270" y="374" text-anchor="middle">-1</text>
    <text x="314" y="374" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="358" y="374" text-anchor="middle">-1</text>
    <text x="402" y="374" text-anchor="middle">-1</text>
  </g>
</svg>
