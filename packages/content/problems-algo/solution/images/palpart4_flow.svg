<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程图：分割回文串 IV</text>

  <!-- Step 1: preprocess -->
  <rect x="160" y="50" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Step 1：预处理回文表</text>
  <text x="280" y="86" text-anchor="middle" font-size="10" fill="#888">isPal[i][j]，区间 DP，O(n²)</text>

  <path d="M 280 96 L 280 114" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: outer loop i -->
  <rect x="160" y="116" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Step 2：外层循环 i = 0 → n−3</text>
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#888">第一刀切在 i 后，第一段 = s[0..i]</text>

  <path d="M 280 162 L 280 180" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: isPal[0][i]? -->
  <polygon points="280,184 380,220 280,256 180,220" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">isPal[0][i]?</text>
  <text x="280" y="230" text-anchor="middle" font-size="10" fill="#888">第一段是回文?</text>

  <!-- No branch: skip, back to loop i -->
  <path d="M 180 220 L 120 220 L 120 138 L 156 138" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="212" font-size="10" fill="#888">否</text>
  <text x="124" y="178" font-size="9" fill="#888">跳过该 i</text>

  <!-- Yes branch: inner loop j -->
  <path d="M 280 256 L 280 274" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="268" font-size="10" fill="#888">是</text>

  <rect x="150" y="276" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Step 3：内层循环 j = i+1 → n−2</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#888">第二刀切在 j 后，第二段 = s[i+1..j]，第三段 = s[j+1..n−1]</text>

  <path d="M 280 322 L 280 340" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: three palindromes? -->
  <polygon points="280,344 400,392 280,440 160,392" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">isPal[i+1][j]</text>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">&amp;&amp; isPal[j+1][n−1]?</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#888">后两段都回文?</text>

  <!-- Yes: return true -->
  <path d="M 400 392 L 460 392 L 460 70 L 404 70" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="384" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="404" y="50" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="469" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true ⭐</text>
  <text x="469" y="86" text-anchor="middle" font-size="9" fill="#888">短路返回</text>

  <!-- No: continue inner loop j -->
  <path d="M 160 392 L 100 392 L 100 298 L 146 298" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="384" font-size="10" fill="#888">否</text>
  <text x="110" y="350" font-size="9" fill="#888">j++</text>

  <!-- Loop exhaustion: i++ / return false -->
  <path d="M 280 440 L 280 452" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="450" font-size="9" fill="#888">j 越界</text>
  <rect x="120" y="456" width="120" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="470" text-anchor="middle" font-size="10" fill="#888">i++ 继续外层</text>
  <rect x="320" y="456" width="160" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="470" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">全部枚举完 → return false</text>
</svg>
