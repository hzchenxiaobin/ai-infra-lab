<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：并查集建组 → DFS 回溯枚举</text>

  <!-- ===== Phase 1: Build ===== -->
  <text x="40" y="54" font-size="11" fill="#446688" font-weight="bold">阶段一：建同义组</text>

  <!-- Step 1: collect words -->
  <rect x="40" y="64" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">收集所有近义词</text>
  <text x="100" y="96" text-anchor="middle" font-size="10" fill="#555">word → index 映射</text>

  <path d="M 160 84 L 190 84" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: union -->
  <rect x="190" y="64" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="82" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">UnionFind 初始化</text>
  <text x="250" y="96" text-anchor="middle" font-size="10" fill="#555">union(每对近义词)</text>

  <path d="M 310 84 L 340 84" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: group + sort -->
  <rect x="340" y="64" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="82" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">按 root 分组</text>
  <text x="415" y="96" text-anchor="middle" font-size="10" fill="#555">组内字典序排序</text>

  <!-- ===== Phase 2: DFS ===== -->
  <text x="40" y="130" font-size="11" fill="#b85450" font-weight="bold">阶段二：DFS 回溯枚举</text>

  <!-- Split text -->
  <rect x="40" y="140" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="90" y="162" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">text.split()</text>

  <path d="M 140 158 L 175 158" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- DFS entry -->
  <rect x="175" y="140" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="225" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dfs(i=0)</text>

  <path d="M 225 176 L 225 196" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="225,200 285,235 225,270 165,235" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="230" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">word[i] 是</text>
  <text x="225" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">近义词?</text>

  <!-- No branch: keep original -->
  <path d="M 165 235 L 100 235 L 100 280" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="226" font-size="10" fill="#888" font-weight="bold">否</text>

  <rect x="50" y="284" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="302" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">保留原词</text>
  <text x="100" y="316" text-anchor="middle" font-size="10" fill="#555">t.append(word[i])</text>

  <path d="M 100 324 L 100 348" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch: try all synonyms -->
  <path d="M 285 235 L 370 235 L 370 280" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="320" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="310" y="284" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">遍历同义组</text>
  <text x="370" y="316" text-anchor="middle" font-size="10" fill="#555">for syn in group</text>

  <path d="M 370 324 L 370 348" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Merge: dfs(i+1) -->
  <rect x="160" y="352" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">t.append(选词) → dfs(i+1) → t.pop() 回溯</text>

  <path d="M 270 388 L 270 408" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Base case -->
  <rect x="140" y="412" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="430" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">i == len → ' '.join(t) 加入 ans</text>
  <text x="270" y="442" text-anchor="middle" font-size="9.5" fill="#888">（组已排序 → ans 天然字典序）</text>

  <!-- annotations on right -->
  <text x="490" y="200" font-size="9" fill="#888" text-anchor="middle">回溯</text>
  <text x="490" y="214" font-size="9" fill="#888" text-anchor="middle">模板</text>
  <path d="M 430 360 Q 460 360 460 300 Q 460 235 370 235" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="475" y="300" font-size="9" fill="#bbb">下一词</text>
</svg>
