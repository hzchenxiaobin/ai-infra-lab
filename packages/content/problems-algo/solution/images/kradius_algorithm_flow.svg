<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：定长滑窗求 k 半径平均值</text>

  <!-- Step 1: init ans = -1 -->
  <rect x="170" y="50" width="260" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 ans 长度 n，全填 −1</text>
  <text x="300" y="90" text-anchor="middle" font-size="10" fill="#888">边界下标天然无合法窗口，保持 −1</text>

  <path d="M 300 104 L 300 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: window > n ? -->
  <rect x="150" y="128" width="300" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="300" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">window = 2k+1 &gt; n ?</text>
  <text x="300" y="170" text-anchor="middle" font-size="10" fill="#888">数组能否装下一个完整窗口</text>

  <!-- branch Yes -->
  <path d="M 450 155 L 490 155 L 490 200" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="464" y="148" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="410" y="204" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="495" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回全 −1</text>
  <text x="495" y="240" text-anchor="middle" font-size="10" fill="#888">无合法中心</text>

  <!-- branch No -->
  <path d="M 300 186 L 300 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="202" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step 3: initial window sum -->
  <rect x="120" y="214" width="290" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="265" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">求首窗 [0, 2k] 之和 sum</text>
  <text x="265" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">sum = nums[0] + … + nums[2k]</text>
  <text x="265" y="266" text-anchor="middle" font-size="10" fill="#888">用 long long 累加防溢出</text>

  <path d="M 265 274 L 265 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: ans[k] = sum / window -->
  <rect x="140" y="300" width="250" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="265" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">首个中心 i = k</text>
  <text x="265" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans[k] = sum / window</text>

  <path d="M 265 350 L 265 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: loop slide -->
  <rect x="90" y="376" width="350" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="398" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">循环 i = k+1 … n−1−k（即 i+k &lt; n）</text>
  <text x="265" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">sum += nums[i+k] − nums[i−k−1]</text>
  <text x="265" y="432" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans[i] = sum / window</text>

  <!-- loop back arrow -->
  <path d="M 440 406 Q 490 406 490 340 Q 490 286 290 286 Q 265 286 265 376" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="346" font-size="10" fill="#888" transform="rotate(90 498 346)">i 右移直到越界</text>

  <!-- side notes -->
  <rect x="40" y="446" width="520" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="60" y="464" font-size="10" fill="#666">要点：定长窗口只平移不伸缩，每步「出一进一」O(1) 转移；先填 −1 免去边界判断。</text>
</svg>
