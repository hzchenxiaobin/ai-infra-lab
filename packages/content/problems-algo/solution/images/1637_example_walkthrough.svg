<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：points = [[3,1],[9,0],[1,0],[1,4],[5,3],[8,8]]</text>

  <!-- Step 1: extract x -->
  <text x="40" y="52" font-size="11" fill="#888">① 提取 x</text>
  <rect x="80" y="58" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="124" y="58" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="168" y="58" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="212" y="58" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="256" y="58" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="300" y="58" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>

  <!-- sort arrow -->
  <path d="M 360 72 L 392 72" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="64" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">排序</text>

  <!-- Step 2: sorted x -->
  <text x="40" y="112" font-size="11" fill="#888">② 排序后</text>
  <rect x="80" y="118" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="118" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="118" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="212" y="118" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="256" y="118" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="300" y="118" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <!-- index labels -->
  <text x="102" y="160" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="146" y="160" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="190" y="160" text-anchor="middle" font-size="9" fill="#888">i=2</text>
  <text x="234" y="160" text-anchor="middle" font-size="9" fill="#888">i=3</text>
  <text x="278" y="160" text-anchor="middle" font-size="9" fill="#888">i=4</text>
  <text x="322" y="160" text-anchor="middle" font-size="9" fill="#888">i=5</text>

  <!-- Step 3: compute adjacent diffs -->
  <text x="40" y="192" font-size="11" fill="#888">③ 相邻差</text>

  <!-- diff i=1: 1-1=0 -->
  <path d="M 102 168 L 102 176 L 146 176 L 146 168" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="400" y="182" font-size="11" fill="#888">i=1: 1 − 1 = 0</text>

  <!-- diff i=2: 3-1=2 -->
  <path d="M 146 190 L 146 198 L 190 198 L 190 190" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="400" y="204" font-size="11" fill="#888">i=2: 3 − 1 = 2</text>

  <!-- diff i=3: 5-3=2 -->
  <path d="M 190 212 L 190 220 L 234 220 L 234 212" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="400" y="226" font-size="11" fill="#888">i=3: 5 − 3 = 2</text>

  <!-- diff i=4: 8-5=3 (MAX) -->
  <path d="M 234 234 L 234 242 L 278 242 L 278 234" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <rect x="232" y="232" width="48" height="12" fill="#fce4ec" opacity="0.5" filter="url(#rough2)"/>
  <text x="400" y="248" font-size="11" fill="#b85450" font-weight="bold">i=4: 8 − 5 = 3 ← max ✓</text>

  <!-- diff i=5: 9-8=1 -->
  <path d="M 278 256 L 278 264 L 322 264 L 322 256" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="400" y="270" font-size="11" fill="#888">i=5: 9 − 8 = 1</text>

  <!-- result -->
  <rect x="80" y="296" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">ans = max(0, 2, 2, 3, 1) = 3</text>

  <!-- note -->
  <rect x="80" y="348" width="400" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#888">同 x 的点（i=1 处差为 0）不影响最大值</text>
</svg>
