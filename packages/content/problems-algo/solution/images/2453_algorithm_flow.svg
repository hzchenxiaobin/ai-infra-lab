<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="450" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：同余分组建表 → 扫表选最大组 → 平局取组内 min 最小 → 返回 ans</text>

  <!-- Start -->
  <ellipse cx="270" cy="44" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="49" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>

  <path d="M 270 59 L 270 74" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Box 1: build table -->
  <rect x="60" y="76" width="420" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="97" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① 建表 cnt/min（按余数 r 索引）</text>
  <text x="270" y="116" text-anchor="middle" font-size="10.5" fill="#333">for v in nums:</text>
  <text x="270" y="132" text-anchor="middle" font-size="10.5" fill="#333">r = v % space;  cnt[r]++;  min[r] = min(min[r], v)</text>

  <path d="M 270 144 L 270 158" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Box 2: scan and select -->
  <rect x="60" y="160" width="420" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 扫表选最优（bestCnt = 0, ans = +∞）</text>
  <text x="270" y="199" text-anchor="middle" font-size="10.5" fill="#333">for (r, c) in cnt:</text>
  <text x="270" y="215" text-anchor="middle" font-size="10.5" fill="#333">if c &gt; bestCnt:  bestCnt = c;  ans = min[r]</text>
  <text x="270" y="231" text-anchor="middle" font-size="10.5" fill="#333">elif c == bestCnt:  ans = min(ans, min[r])</text>

  <path d="M 270 242 L 270 254" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond: tie? -->
  <polygon points="270,254 372,300 270,346 168,300" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="295" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">存在并列</text>
  <text x="270" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最大组?</text>

  <!-- No branch (left) -->
  <path d="M 168 300 L 158 300" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="162" y="291" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="14" y="280" width="144" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="86" y="298" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">否：仅 if 分支触发</text>
  <text x="86" y="314" text-anchor="middle" font-size="10.5" fill="#333">ans = 唯一最大组的 min</text>

  <!-- Yes branch (right) -->
  <path d="M 372 300 L 382 300" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="378" y="291" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="382" y="280" width="144" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="454" y="298" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是：elif 分支触发</text>
  <text x="454" y="314" text-anchor="middle" font-size="10.5" fill="#333">ans = 并列组 min 的最小</text>

  <!-- merge arrows down to return -->
  <path d="M 86 322 L 86 360 L 270 360" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 454 322 L 454 360 L 270 360" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 270 346 L 270 360" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 270 360 L 270 374" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="200" y="376" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="398" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- Notes -->
  <text x="20" y="426" font-size="10.5" fill="#888">• 建表 O(n)，扫表 O(表项数) ≤ O(n)；两组阶段线性</text>
  <text x="20" y="442" font-size="10.5" fill="#888">• 平局规则作用在 seed 值上：并列最大组里比各组 min，取最小</text>
</svg>
