<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">ThroneInheritance 四个操作的流程</text>

  <!-- ===== Data structures panel ===== -->
  <rect x="40" y="44" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="64" font-size="11" fill="#446688" font-weight="bold">数据结构</text>
  <text x="60" y="82" font-size="10.5" fill="#555">children: HashMap&lt;String, List&lt;String&gt;&gt;  （父亲 → 子女列表，按出生顺序）</text>
  <text x="300" y="82" font-size="10.5" fill="#555">dead: HashSet&lt;String&gt;  king: String</text>

  <path d="M 280 94 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Constructor ===== -->
  <rect x="40" y="112" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="136" r="15" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="68" y="140" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">C</text>
  <text x="98" y="132" font-size="12" fill="#333" font-weight="bold">ThroneInheritance(kingName)</text>
  <text x="98" y="150" font-size="10.5" fill="#555">记录 king = kingName；初始化 children[kingName] = [] 和 dead = {}</text>

  <path d="M 280 160 L 280 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== birth ===== -->
  <rect x="40" y="178" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="202" r="15" fill="#d6a040" filter="url(#rough2)"/>
  <text x="68" y="206" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">B</text>
  <text x="98" y="198" font-size="12" fill="#333" font-weight="bold">birth(parentName, childName)</text>
  <text x="98" y="216" font-size="10.5" fill="#555">children[parentName].append(childName)  — 尾插保序，新生者排在所有兄姐之后</text>

  <path d="M 280 226 L 280 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== death ===== -->
  <rect x="40" y="244" width="480" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="268" r="15" fill="#b85450" filter="url(#rough2)"/>
  <text x="68" y="272" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">D</text>
  <text x="98" y="264" font-size="12" fill="#333" font-weight="bold">death(name)</text>
  <text x="98" y="282" font-size="10.5" fill="#555">dead.add(name)  — 只标记，不动树结构（不影响 Successor 与继承顺序）</text>

  <path d="M 280 292 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== getInheritanceOrder ===== -->
  <rect x="40" y="310" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="339" r="15" fill="#446688" filter="url(#rough2)"/>
  <text x="68" y="343" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">G</text>
  <text x="98" y="334" font-size="12" fill="#333" font-weight="bold">getInheritanceOrder()</text>
  <text x="98" y="352" font-size="10.5" fill="#555">从 king 出发前序 DFS：访问根 → 递归每个子女</text>
  <text x="98" y="366" font-size="10.5" fill="#555">若当前节点不在 dead 中则加入结果列表，否则跳过（子女仍要递归）</text>

  <!-- bottom note -->
  <rect x="40" y="388" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">birth / death 均 O(1)；getInheritanceOrder 为 O(n) 全树遍历</text>
  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#888">n = 累计出生人数，调用次数 ≤ 10，总开销可控</text>
</svg>
