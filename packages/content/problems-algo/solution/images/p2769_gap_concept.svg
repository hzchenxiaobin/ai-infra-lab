<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">盯住差距 d = x − num，每步缩 2</text>

  <!-- 操作前：数轴上 num 在左、x 在右 -->
  <text x="120" y="78" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">操作前</text>
  <rect x="80" y="88" width="360" height="6" fill="#446688" rx="2" filter="url(#rough2)"/>
  <circle cx="140" cy="91" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="124" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">num</text>
  <circle cx="380" cy="91" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="124" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">x</text>
  <!-- 差距标注 -->
  <path d="M150,150 L370,150" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4"
        marker-start="url(#arr)" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">差距 d</text>

  <!-- 一次操作：x 左移 1，num 右移 1 -->
  <text x="260" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">一次操作：x − 1，num + 1</text>
  <path d="M372,91 L148,91" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M148,91 L372,91" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- 操作后：两点靠近，差距缩小 2 -->
  <text x="120" y="226" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">操作后</text>
  <rect x="80" y="236" width="360" height="6" fill="#446688" rx="2" filter="url(#rough2)"/>
  <circle cx="180" cy="239" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="272" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">num+1</text>
  <circle cx="340" cy="239" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="272" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">x−1</text>
  <path d="M190,298 L330,298" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4"
        marker-start="url(#arr)" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">差距 d − 2</text>

  <!-- 结论框 -->
  <rect x="70" y="312" width="380" height="38" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">t 步最多缩小 2t ⇒ x ≤ num + 2t</text>
</svg>
