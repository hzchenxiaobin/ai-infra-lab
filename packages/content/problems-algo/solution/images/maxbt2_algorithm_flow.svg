<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：沿右脊递归插入 val</text>

  <!-- 起点 -->
  <rect x="140" y="44" width="240" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">insert(node, val)</text>

  <line x1="260" y1="78" x2="260" y2="100" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1 node为空? -->
  <polygon points="260,104 348,140 260,176 172,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#333">node 为空?</text>

  <line x1="348" y1="140" x2="396" y2="140" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="398" y="124" width="108" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="144" text-anchor="middle" font-size="11" fill="#333">return TreeNode(val)</text>
  <text x="452" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">③ 落叶</text>

  <line x1="260" y1="176" x2="260" y2="198" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="192" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 菱形2 val > node.val? -->
  <polygon points="260,202 360,242 260,282 160,242" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="11" fill="#333">val &gt; node.val?</text>

  <line x1="360" y1="242" x2="396" y2="242" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="236" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="398" y="218" width="108" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="236" text-anchor="middle" font-size="10" fill="#333">new = TreeNode(val)</text>
  <text x="452" y="250" text-anchor="middle" font-size="10" fill="#333">new.left = node</text>
  <text x="452" y="262" text-anchor="middle" font-size="10" fill="#333">return new</text>
  <text x="452" y="278" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">① 篡位</text>

  <line x1="260" y1="282" x2="260" y2="304" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="298" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 下行 -->
  <rect x="70" y="306" width="380" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#333">node.right = insert(node.right, val)</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#333">return node</text>
  <text x="60" y="332" font-size="9" fill="#446688" font-weight="bold">② 下行</text>

  <!-- 自循环箭头表示递归 -->
  <path d="M 410 328 Q 470 328 470 200 Q 470 60 260 60" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="478" y="200" font-size="9" fill="#446688">递归</text>
  <text x="478" y="212" font-size="9" fill="#446688">下行</text>

  <!-- 底部说明 -->
  <rect x="20" y="356" width="480" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="10" fill="#7a3a3a">三分支统一返回「插入后的新子树根」，调用方用 node.right = ... 接住</text>
</svg>
