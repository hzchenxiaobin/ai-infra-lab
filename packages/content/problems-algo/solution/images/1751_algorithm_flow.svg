<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 二分前驱 → 双层 DP</text>

  <!-- Step 1: sort -->
  <rect x="140" y="46" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 排序</text>
  <text x="260" y="80" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">events.sort(key=endDay)；抽 ends 数组</text>

  <path d="M 260 92 L 260 110" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init dp -->
  <rect x="140" y="114" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="139" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② dp[0..n][0..k] = 0（哨兵行/列）</text>

  <path d="M 260 156 L 260 174" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop i decision -->
  <polygon points="260,178 370,222 260,266 150,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i ≤ n ?</text>
  <text x="260" y="232" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">外层遍历每个会议</text>

  <!-- No: return -->
  <path d="M 370 222 L 440 222" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="440" y="200" width="72" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="476" y="218" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="476" y="234" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[n][k]</text>

  <!-- Yes: down -->
  <path d="M 260 266 L 260 284" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="280" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- binary search p -->
  <rect x="110" y="288" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 二分：p = bisect_left(ends, startDay_i)</text>
  <text x="260" y="322" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">= 「endDay 严格 &lt; startDay_i」的个数</text>

  <path d="M 260 332 L 260 348" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner loop j -->
  <rect x="110" y="352" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ for j in 1..k：</text>
  <text x="260" y="386" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[i][j] = max(dp[i−1][j], dp[p][j−1] + v)</text>

  <!-- loop back arrow: from inner loop up to i<=n decision -->
  <path d="M 410 374 L 470 374 L 470 222 L 370 222" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="300" font-size="9" fill="#aaa" filter="url(#rough2)">i++</text>

  <!-- Footer -->
  <text x="260" y="438" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">状态数 n·k ≤ 10⁶，每次转移 O(log n) → 总 O(n·k·log n)</text>
  <text x="260" y="456" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">「至多 j」让不选分支把更少选数最优值向后传递，dp[n][k] 自动覆盖 0..k</text>
</svg>
