<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：6 行按 managerId 分 2 桶，101 桶计数 5 通过</text>

  <!-- Employee table (left) -->
  <text x="135" y="50" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Employee</text>
  <rect x="20" y="56" width="230" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="35" y="72" font-size="9" fill="#333">id</text>
  <text x="72" y="72" font-size="9" fill="#333">name</text>
  <text x="130" y="72" font-size="9" fill="#333">dept</text>
  <text x="185" y="72" font-size="9" fill="#b85450">managerId</text>
  <line x1="55" y1="56" x2="55" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="56" x2="110" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="56" x2="160" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="80" width="230" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="35" y="94" font-size="9" fill="#333">101</text>
  <text x="72" y="94" font-size="9" fill="#333">John</text>
  <text x="130" y="94" font-size="9" fill="#333">A</text>
  <text x="185" y="94" font-size="9" fill="#888">NULL</text>
  <line x1="55" y1="80" x2="55" y2="100" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="80" x2="110" y2="100" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="80" x2="160" y2="100" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="100" width="230" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="35" y="114" font-size="9" fill="#333">102</text>
  <text x="72" y="114" font-size="9" fill="#333">Dan</text>
  <text x="130" y="114" font-size="9" fill="#333">A</text>
  <text x="185" y="114" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <line x1="55" y1="100" x2="55" y2="120" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="100" x2="110" y2="120" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="100" x2="160" y2="120" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="120" width="230" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="35" y="134" font-size="9" fill="#333">103</text>
  <text x="72" y="134" font-size="9" fill="#333">James</text>
  <text x="130" y="134" font-size="9" fill="#333">A</text>
  <text x="185" y="134" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <line x1="55" y1="120" x2="55" y2="140" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="120" x2="110" y2="140" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="120" x2="160" y2="140" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="140" width="230" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="35" y="154" font-size="9" fill="#333">104</text>
  <text x="72" y="154" font-size="9" fill="#333">Amy</text>
  <text x="130" y="154" font-size="9" fill="#333">A</text>
  <text x="185" y="154" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <line x1="55" y1="140" x2="55" y2="160" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="140" x2="110" y2="160" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="140" x2="160" y2="160" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="160" width="230" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="35" y="174" font-size="9" fill="#333">105</text>
  <text x="72" y="174" font-size="9" fill="#333">Anne</text>
  <text x="130" y="174" font-size="9" fill="#333">A</text>
  <text x="185" y="174" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <line x1="55" y1="160" x2="55" y2="180" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="160" x2="110" y2="180" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="160" x2="160" y2="180" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="180" width="230" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="35" y="194" font-size="9" fill="#333">106</text>
  <text x="72" y="194" font-size="9" fill="#333">Ron</text>
  <text x="130" y="194" font-size="9" fill="#333">B</text>
  <text x="185" y="194" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <line x1="55" y1="180" x2="55" y2="200" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="180" x2="110" y2="200" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="180" x2="160" y2="200" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrows: rows to buckets -->
  <path d="M250 130 L300 130" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="275" y="124" text-anchor="middle" font-size="8.5" fill="#d6a040">分桶</text>
  <path d="M250 90 L300 90" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="275" y="84" text-anchor="middle" font-size="8.5" fill="#888">NULL 桶</text>

  <!-- Verdict table (right) -->
  <text x="430" y="50" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">分桶计数 + HAVING 判定</text>
  <rect x="300" y="56" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="72" font-size="9" fill="#333">managerId</text>
  <text x="395" y="72" font-size="9" fill="#333">桶内下属</text>
  <text x="490" y="72" font-size="9" fill="#333">COUNT</text>
  <line x1="375" y1="56" x2="375" y2="80" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="56" x2="475" y2="80" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="80" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="315" y="96" font-size="9" fill="#4a7a3a" font-weight="bold">101</text>
  <text x="395" y="96" font-size="8.5" fill="#333">Dan,James,</text>
  <text x="395" y="108" font-size="8.5" fill="#333">Amy,Anne,Ron</text>
  <text x="495" y="104" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <line x1="375" y1="80" x2="375" y2="120" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="80" x2="475" y2="120" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="120" width="240" height="28" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="138" font-size="9" fill="#888">NULL</text>
  <text x="395" y="138" font-size="9" fill="#888">John</text>
  <text x="495" y="138" font-size="10" fill="#888">1</text>
  <line x1="375" y1="120" x2="375" y2="148" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="120" x2="475" y2="148" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Verdict annotations -->
  <text x="430" y="166" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">101: 5 ≥ 5 ✓ 保留</text>
  <text x="430" y="180" text-anchor="middle" font-size="9.5" fill="#888">NULL: 1 &lt; 5 ✗ 丢弃（且无对应员工 id）</text>

  <!-- Down arrow to lookup -->
  <path d="M420 188 L420 214" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="206" font-size="9" fill="#d6a040">候选 {101}</text>

  <!-- Lookup step -->
  <rect x="60" y="240" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">外层：SELECT name FROM Employee WHERE id IN (101)</text>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#333">在 Employee 表中找 id = 101 的行 → name = John</text>
  <text x="280" y="292" text-anchor="middle" font-size="9" fill="#888">（John 这行 managerId=NULL，他本人是顶层经理，不参与分桶计数）</text>

  <!-- Result -->
  <path d="M280 298 L280 322" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="150" y="326" width="260" height="76" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最终结果</text>
  <rect x="240" y="354" width="80" height="26" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">John</text>
  <text x="280" y="396" text-anchor="middle" font-size="9" fill="#888">John 带 5 名直接下属，满足「≥5」门槛</text>
</svg>
