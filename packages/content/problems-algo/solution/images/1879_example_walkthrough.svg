<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="2.2"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">n=3 状态转移 DAG：nums1=[1,0,3], nums2=[5,3,4]</text>
  <text x="300" y="40" text-anchor="middle" font-size="11" fill="#888">节点 = mask（dp 值），边 = 把 nums2[j] 配到 nums1[i]，标注 = 增量代价</text>

  <!-- level labels -->
  <text x="20" y="76" font-size="11" fill="#888">i=0</text>
  <text x="20" y="166" font-size="11" fill="#888">i=1</text>
  <text x="20" y="266" font-size="11" fill="#888">i=2</text>
  <text x="20" y="362" font-size="11" fill="#888">完成</text>

  <!-- Level 0: 000 -->
  <rect x="260" y="56" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">000 (0)</text>

  <!-- Level 1: 001(4), 010(2), 100(5) -->
  <rect x="90" y="146" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">001 (4)</text>
  <rect x="260" y="146" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">010 (2)</text>
  <rect x="430" y="146" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">100 (5)</text>

  <!-- edges level0 -> level1 (nums1[0]=1) -->
  <path d="M 280 96 L 150 144" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="170" y="120" font-size="10" fill="#b85450" font-weight="bold">j=0, 1^5=4</text>
  <path d="M 300 96 L 300 144" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="124" font-size="10" fill="#4a7a3a">j=1, 1^3=2</text>
  <path d="M 320 96 L 450 144" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="120" font-size="10" fill="#4a7a3a">j=2, 1^4=5</text>

  <!-- Level 2: 011(7), 101(8), 110(6) -->
  <rect x="90" y="246" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">011 (7)</text>
  <rect x="260" y="246" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">101 (8)</text>
  <rect x="430" y="246" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">110 (6)</text>

  <!-- edges level1 -> level2 (nums1[1]=0, 0^x=x) -->
  <path d="M 130 186 L 130 244" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="218" font-size="10" fill="#4a7a3a">j=1, +3</text>
  <path d="M 150 186 L 270 244" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="200" y="218" font-size="10" fill="#b85450" font-weight="bold">j=2, +4</text>
  <path d="M 280 186 L 150 244" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="232" font-size="9" fill="#999">j=0,+5(同7)</text>
  <path d="M 320 186 L 450 244" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="218" font-size="10" fill="#4a7a3a">j=2, +4</text>
  <path d="M 450 186 L 330 244" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="232" font-size="9" fill="#b85450">j=0,+5&gt;8舍</text>
  <path d="M 470 186 L 470 244" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="218" font-size="10" fill="#4a7a3a">j=1, +3</text>

  <!-- Level 3: 111 (8) -->
  <rect x="260" y="342" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">111 (8) ⭐</text>

  <!-- edges level2 -> level3 (nums1[2]=3) -->
  <path d="M 150 286 L 270 340" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="318" font-size="10" fill="#4a7a3a">j=2, 3^4=+7 → 14</text>
  <path d="M 300 286 L 300 340" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="308" y="316" font-size="10" fill="#b85450" font-weight="bold">j=1, 3^3=+0 → 8 ✓</text>
  <path d="M 450 286 L 330 340" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="330" font-size="9" fill="#b85450">j=0,+6&gt;8舍</text>

  <!-- footnote -->
  <rect x="40" y="400" width="520" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="300" y="420" text-anchor="middle" font-size="11" fill="#555">最优路径（红）: 000 → 001 → 101 → 111，代价 4 + 4 + 0 = 8</text>
  <text x="300" y="438" text-anchor="middle" font-size="11" fill="#555">对应 nums2 重排为 [5, 4, 3]：(1^5)+(0^4)+(3^3) = 4+4+0 = 8</text>
</svg>
