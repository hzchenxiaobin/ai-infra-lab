<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：矩阵 → 逐行高度直方图 → 统计以每行为底的全 1 子矩形</text>

  <!-- ===== Left: Matrix ===== -->
  <text x="113" y="50" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">原始矩阵 mat</text>

  <rect x="50" y="60" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="71" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="92" y="60" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="113" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="134" y="60" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="50" y="102" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="71" y="129" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="92" y="102" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="113" y="129" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="134" y="102" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="129" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <rect x="50" y="144" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="71" y="171" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="92" y="144" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="113" y="171" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="134" y="144" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="171" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <text x="40" y="87" text-anchor="end" font-size="10" fill="#888">行0</text>
  <text x="40" y="129" text-anchor="end" font-size="10" fill="#888">行1</text>
  <text x="40" y="171" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">行2</text>

  <!-- Arrow -->
  <path d="M 190 165 L 245 165" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="217" y="155" text-anchor="middle" font-size="9" fill="#888">h[j] = 向上</text>
  <text x="217" y="178" text-anchor="middle" font-size="9" fill="#888">连续 1 数</text>

  <!-- ===== Right: Histogram for row 2 ===== -->
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">行 2 的高度直方图 h = [3, 2, 0]</text>

  <line x1="290" y1="195" x2="510" y2="195" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="300" y="105" width="50" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="325" y="100" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>

  <rect x="370" y="135" width="50" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="130" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <text x="465" y="190" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <line x1="455" y1="193" x2="485" y2="193" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="325" y="212" text-anchor="middle" font-size="10" fill="#888">列0</text>
  <text x="395" y="212" text-anchor="middle" font-size="10" fill="#888">列1</text>
  <text x="465" y="212" text-anchor="middle" font-size="10" fill="#888">列2</text>

  <!-- Highlight: submatrix [列0,列1] with height min=2 -->
  <rect x="297" y="133" width="126" height="64" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="5,3" rx="5" filter="url(#rough2)"/>
  <text x="360" y="228" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">列区间[0,1]: min=2 → 2 个子矩形</text>

  <!-- ===== Bottom: Insight ===== -->
  <rect x="30" y="245" width="500" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">以第 i 行为底的全 1 子矩形数 = Σ min(h[l..r])，对所有列区间 [l, r]</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#555">选列区间 [l,r] 后，高度可取 1 ~ min(h[l..r])，共 min(h[l..r]) 个</text>

  <!-- Example calculation -->
  <rect x="30" y="303" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">示例 h = [3, 2, 0]：逐列区间求 min</text>
  <text x="280" y="343" text-anchor="middle" font-size="11" fill="#555">[0,0]→3 + [0,1]→2 + [0,2]→0 + [1,1]→2 + [1,2]→0 + [2,2]→0 = 7</text>
  <text x="280" y="359" text-anchor="middle" font-size="10" fill="#888">逐行累加：行0(2) + 行1(4) + 行2(7) = 13</text>
</svg>
