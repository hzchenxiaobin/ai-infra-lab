<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="20" y="24" font-size="13" fill="#333" filter="url(#rough2)">流程：逐字符扫描 → 45 桶滚动转移 → 末位非 0 才累加答案</text>

  <!-- start -->
  <rect x="190" y="36" width="140" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#2d4d22" filter="url(#rough2)">开始：数字串 s</text>
  <path d="M260,64 L260,76" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="130" y="78" width="260" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans ← 0；45 个余数桶 f[d][r] ← 0（两层滚动）</text>
  <path d="M260,108 L260,122" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond A -->
  <polygon points="260,124 356,152 260,180 164,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有字符？</text>
  <text x="260" y="166" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（i 递增）</text>

  <!-- A-no: return -->
  <text x="364" y="148" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M356,152 L388,152" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="130" width="114" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="447" y="148" text-anchor="middle" font-size="11.5" fill="#2d4d22" filter="url(#rough2)">返回 ans</text>
  <text x="447" y="165" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（64 位整数）</text>

  <!-- A-yes: transfer -->
  <text x="268" y="194" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M260,180 L260,196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="76" y="198" width="368" height="58" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x ← 下一字符的数字；新层 nf ← 0</text>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d=1..9、r=0..d−1：nf[d][(10r+x) mod d] += f[d][r]</text>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每个 d：nf[d][x mod d] += 1（新开单字符子串）</text>
  <path d="M260,256 L260,266" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="264" font-size="9.5" fill="#666" filter="url(#rough2)">f ← nf（滚动）</text>

  <!-- diamond B -->
  <polygon points="260,268 356,296 260,324 164,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x ≠ 0 ？</text>
  <text x="260" y="310" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（末位能否作除数）</text>

  <!-- B-yes: accumulate -->
  <text x="364" y="292" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M356,296 L388,296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="274" width="118" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="449" y="292" text-anchor="middle" font-size="11.5" fill="#2d4d22" filter="url(#rough2)">ans += f[x][0]</text>
  <text x="449" y="309" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（模 x 余 0 的整桶）</text>

  <!-- B-no: zero note -->
  <text x="270" y="340" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M260,324 L260,340" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="342" width="300" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">末位 0：不贡献答案（不能除以 0）</text>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">但桶已更新 —— 0 是未来子串的中间段</text>

  <!-- loop back -->
  <path d="M449,318 L449,396 L40,396 L40,152 L162,152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,378 L260,396" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="52" y="390" font-size="9.5" fill="#666" filter="url(#rough2)">下一字符</text>

  <!-- bottom note -->
  <rect x="76" y="412" width="368" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="430" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">时间 O(45n)：n=10⁵ 时约 4.5×10⁶ 次桶转移</text>
  <text x="260" y="448" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">空间 O(1)：两层 × 45 桶；ans ≤ n(n+1)/2 ≈ 5×10⁹（64 位）</text>
</svg>
