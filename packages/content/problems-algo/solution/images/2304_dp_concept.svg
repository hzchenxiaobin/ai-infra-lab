<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">网格 DP：逐行转移，每格取所有入边的最小</text>

  <!-- Row labels -->
  <text x="40" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">上一行</text>
  <text x="40" y="100" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第 i-1 行</text>
  <text x="40" y="226" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">当前行</text>
  <text x="40" y="226" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第 i 行</text>

  <!-- ===== Row i-1 : 3 cells (vals 5,1,2) y=70..120 ===== -->
  <rect x="80"  y="70" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="180" y="70" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="280" y="70" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="100" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <text x="220" y="100" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="100" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <!-- k index below -->
  <text x="120" y="136" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">k=0</text>
  <text x="220" y="136" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">k=1</text>
  <text x="320" y="136" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">k=2</text>

  <!-- ===== Row i : 3 cells (vals 4,0,3) y=200..250 ===== -->
  <rect x="80"  y="200" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="180" y="200" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <!-- highlight target cell j=2 -->
  <rect x="280" y="200" width="80" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="230" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <text x="220" y="230" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <text x="320" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>
  <!-- j index -->
  <text x="120" y="266" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">j=0</text>
  <text x="220" y="266" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">j=1</text>
  <text x="320" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">j=2</text>

  <!-- ===== Arrows: from each top cell to each bottom cell (9 total) ===== -->
  <!-- light gray for non-highlighted, orange for arrows into j=2 -->
  <!-- into j=0 -->
  <path d="M120,122 L120,198" stroke="#b8c4d6" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M220,122 L128,198" stroke="#b8c4d6" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M320,122 L132,198" stroke="#b8c4d6" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- into j=1 -->
  <path d="M120,122 L218,198" stroke="#b8c4d6" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M220,122 L220,198" stroke="#b8c4d6" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M320,122 L224,198" stroke="#b8c4d6" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- into j=2 (highlighted) -->
  <path d="M124,122 L316,198" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M224,122 L320,198" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M320,122 L324,198" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- label one arrow: from k=0 to j=2, moveCost[5][2] -->
  <text x="470" y="150" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">橙色入边 = 各 k 到 j=2</text>
  <text x="470" y="166" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">代价 = moveCost[ grid[i-1][k] ][ j ]</text>

  <!-- ===== Formula box ===== -->
  <rect x="60" y="296" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[i][j] = grid[i][j] + min_k { dp[i-1][k] + moveCost[ grid[i-1][k] ][j] }</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">单元格值 + 上一行所有入边（dp 值 + 移动代价）中的最小</text>

  <!-- right note -->
  <text x="470" y="222" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">从上一行任意列</text>
  <text x="470" y="236" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">都能走到本格</text>
</svg>
