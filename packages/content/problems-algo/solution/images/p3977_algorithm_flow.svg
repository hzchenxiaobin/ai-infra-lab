<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">流程：状态 (节点 u, 剩余电量 p) 上的 Dijkstra</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="32" rx="40" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="36" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 260 45 L 260 52" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="110" y="54" width="300" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dist[source][power] = 0，堆放入 (0, source, power)</text>
  <path d="M 260 80 L 260 86" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 弹出堆顶 -->
  <rect x="185" y="88" width="150" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">弹出堆顶 (d, u, p)</text>
  <path d="M 260 114 L 260 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断1：过期？ -->
  <polygon points="260,120 350,149 260,178 170,149" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">d &gt; dist[u][p] ?</text>
  <text x="260" y="161" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">过期堆条目</text>

  <!-- 是 → 丢弃 -->
  <path d="M 350 149 L 370 149" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="359" y="141" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="372" y="135" width="130" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="437" y="153" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">丢弃 · 取下一个</text>

  <!-- 否 ↓ -->
  <path d="M 260 178 L 260 186" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="186" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 判断2：电量够转发？ -->
  <polygon points="260,186 350,215 260,244 170,215" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">p ≥ cost[u] ?</text>
  <text x="260" y="227" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">电量够转发吗</text>

  <!-- 否 → 卡死 -->
  <path d="M 170 215 L 150 215" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="159" y="207" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="30" y="201" width="118" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="89" y="219" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">卡死 · 取下一个</text>

  <!-- 是 ↓ -->
  <path d="M 260 244 L 260 252" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="252" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 松弛出边 -->
  <rect x="95" y="252" width="330" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="260" y="267" font-size="11" fill="#446688" font-weight="bold">对每条出边 u → v, t：</text>
    <text x="260" y="283" font-size="10.5" fill="#333">d + t &lt; dist[v][p − cost[u]] ⇒ 更新并入堆</text>
  </g>
  <path d="M 260 292 L 260 300" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断3：堆空？ -->
  <polygon points="260,300 318,326 260,352 202,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">堆空？</text>

  <!-- 否 → 回环 -->
  <path d="M 202 326 L 20 326 L 20 101 L 181 101" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="318" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">堆非空 · 继续弹出</text>

  <!-- 是 ↓ -->
  <path d="M 260 352 L 260 360" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="360" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 收割答案 -->
  <rect x="100" y="360" width="320" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="260" y="375" font-size="10.5" fill="#333">扫 target 行：T = min dist[target][p]</text>
    <text x="260" y="391" font-size="10.5" fill="#333">best = max{ p : dist[target][p] = T }</text>
  </g>
  <path d="M 260 400 L 260 408" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断4：不可达？ -->
  <polygon points="260,408 322,434 260,460 198,434" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="438" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">T = ∞ ?</text>

  <!-- 是 → [-1,-1] -->
  <path d="M 198 434 L 152 434" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="427" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="36" y="420" width="112" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="438" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">返回 [-1, -1]</text>

  <!-- 否 → [T, best] -->
  <path d="M 322 434 L 368 434" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="427" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="370" y="420" width="118" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="429" y="438" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">返回 [T, best]</text>
</svg>
