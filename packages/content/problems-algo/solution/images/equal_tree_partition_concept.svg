<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">均匀树划分：删一条边 → 两棵子树权和相等 ⟺ 存在子树和 = S/2</text>

  <!-- 左半部分高亮区域 -->
  <ellipse cx="210" cy="120" rx="78" ry="78" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- 右半部分高亮区域 -->
  <ellipse cx="360" cy="190" rx="78" ry="78" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 树结构 -->
  <!-- 根 5 -->
  <circle cx="250" cy="70" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="75" text-anchor="middle" font-size="13" fill="#333">5</text>

  <!-- 边 5 -> 左 10 (实线, 保留) -->
  <line x1="240" y1="84" x2="195" y2="138" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 边 5 -> 右 10 (虚线红, 切断!) -->
  <line x1="262" y1="84" x2="335" y2="138" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <!-- 剪刀标记 -->
  <text x="300" y="100" font-size="18" fill="#b85450" font-weight="bold">✂</text>

  <!-- 左 10 -->
  <circle cx="185" cy="150" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="155" text-anchor="middle" font-size="13" fill="#333">10</text>

  <!-- 右 10 -->
  <circle cx="345" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="345" y="155" text-anchor="middle" font-size="13" fill="#333">10</text>

  <!-- 边 右10 -> 2 -->
  <line x1="338" y1="166" x2="305" y2="222" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 边 右10 -> 3 -->
  <line x1="354" y1="166" x2="385" y2="222" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 叶 2 -->
  <circle cx="295" cy="235" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="295" y="240" text-anchor="middle" font-size="13" fill="#333">2</text>

  <!-- 叶 3 -->
  <circle cx="395" cy="235" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="240" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- 求和标注 -->
  <rect x="120" y="295" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="315" font-size="11" fill="#4a7a3a" font-weight="bold">左半部分 {5, 10}</text>
  <text x="130" y="336" font-size="13" fill="#333" font-weight="bold">sum = 5 + 10 = 15</text>

  <rect x="320" y="295" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="315" font-size="11" fill="#446688" font-weight="bold">右半部分 {10, 2, 3}</text>
  <text x="330" y="336" font-size="13" fill="#333" font-weight="bold">sum = 10+2+3 = 15</text>

  <!-- 中间等号 -->
  <text x="260" y="332" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold">=</text>

  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#888">S = 30 (偶) → target = 15，存在子树(右10)权和 = 15 → 返回 true</text>
</svg>
