<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>

  <text x="360" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">n = 7 的 5 棵满二叉树（卡塔兰数 C₃ = 5）</text>

  <text x="380" y="40" text-anchor="middle" font-size="10" fill="#888">红=根　蓝=内部节点　绿=叶节点</text>

  <!-- ===== Tree A: split (1,5) → right (1,3), cx=110 ===== -->
  <!-- edges -->
  <line x1="110" y1="58" x2="86" y2="78" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="110" y1="58" x2="134" y2="78" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="134" y1="88" x2="122" y2="108" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="134" y1="88" x2="146" y2="108" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="146" y1="118" x2="134" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="146" y1="118" x2="158" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- nodes -->
  <circle cx="110" cy="52" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="86" cy="82" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="134" cy="82" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="122" cy="112" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="146" cy="112" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="134" cy="142" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="158" cy="142" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="168" text-anchor="middle" font-size="10" fill="#555">① 左1 右5→(1,3)</text>

  <!-- ===== Tree C: split (3,3) balanced, cx=360 ===== -->
  <line x1="360" y1="58" x2="336" y2="78" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="360" y1="58" x2="384" y2="78" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="336" y1="88" x2="324" y2="108" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="336" y1="88" x2="348" y2="108" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="384" y1="88" x2="372" y2="108" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="384" y1="88" x2="396" y2="108" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="360" cy="52" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="336" cy="82" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="384" cy="82" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="324" cy="112" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="348" cy="112" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="372" cy="112" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="396" cy="112" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="168" text-anchor="middle" font-size="10" fill="#555">③ 左3 右3（平衡）</text>

  <!-- ===== Tree D: split (5,1) → left (3,1), cx=610 ===== -->
  <line x1="610" y1="58" x2="586" y2="78" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="610" y1="58" x2="634" y2="78" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="586" y1="88" x2="574" y2="108" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="586" y1="88" x2="598" y2="108" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="574" y1="118" x2="562" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="574" y1="118" x2="586" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="610" cy="52" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="586" cy="82" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="634" cy="82" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="574" cy="112" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="598" cy="112" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="562" cy="142" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="586" cy="142" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="610" y="168" text-anchor="middle" font-size="10" fill="#555">④ 左5→(3,1) 右1</text>

  <!-- ===== Tree B: split (1,5) → right (3,1), cx=235 ===== -->
  <line x1="235" y1="208" x2="211" y2="228" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="235" y1="208" x2="259" y2="228" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="259" y1="238" x2="247" y2="258" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="259" y1="238" x2="271" y2="258" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="247" y1="268" x2="235" y2="288" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="247" y1="268" x2="259" y2="288" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="235" cy="202" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="211" cy="232" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="259" cy="232" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="247" cy="262" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="271" cy="262" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="235" cy="292" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="259" cy="292" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="318" text-anchor="middle" font-size="10" fill="#555">② 左1 右5→(3,1)</text>

  <!-- ===== Tree E: split (5,1) → left (1,3), cx=485 ===== -->
  <line x1="485" y1="208" x2="461" y2="228" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="485" y1="208" x2="509" y2="228" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="461" y1="238" x2="449" y2="258" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="461" y1="238" x2="473" y2="258" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="473" y1="268" x2="461" y2="288" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="473" y1="268" x2="485" y2="288" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="485" cy="202" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="461" cy="232" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="509" cy="232" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="449" cy="262" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="473" cy="262" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="461" cy="292" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="485" cy="292" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="318" text-anchor="middle" font-size="10" fill="#555">⑤ 左5→(1,3) 右1</text>

  <!-- arrow pairs indicator -->
  <text x="110" y="186" text-anchor="middle" font-size="9" fill="#b85450">①↔④ 镜像</text>
  <text x="235" y="336" text-anchor="middle" font-size="9" fill="#b85450">②↔⑤ 镜像</text>
  <text x="360" y="186" text-anchor="middle" font-size="9" fill="#4a7a3a">③ 自对称</text>
</svg>
