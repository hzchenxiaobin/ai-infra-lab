<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">进击的骑士：8 对称折叠 + 负向裁剪</text>
  <path d="M 260 42 Q 440 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: 8-fold symmetry ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="62" width="400" height="430" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="230" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">① 8 对称：任意 (x,y) → (|x|,|y|)</text>

  <!-- axes -->
  <g filter="url(#sk)">
    <line x1="230" y1="110" x2="230" y2="450" stroke="#888" stroke-width="1.2"/>
    <line x1="60" y1="280" x2="400" y2="280" stroke="#888" stroke-width="1.2"/>
    <text x="404" y="284" font-size="10" fill="#888">x</text>
    <text x="234" y="108" font-size="10" fill="#888">y</text>
  </g>

  <!-- 8 knight move arrows from origin (230,280), unit=34px -->
  <g filter="url(#sk)">
    <!-- (1,2) -> (264,212) -->
    <line x1="230" y1="280" x2="264" y2="212" stroke="#4a8edb" stroke-width="1.5" marker-end="url(#ar2)"/>
    <!-- (2,1) -> (298,246) -->
    <line x1="230" y1="280" x2="298" y2="246" stroke="#4a8edb" stroke-width="1.5" marker-end="url(#ar2)"/>
    <!-- (2,-1) -> (298,314) -->
    <line x1="230" y1="280" x2="298" y2="314" stroke="#4a8edb" stroke-width="1.5" marker-end="url(#ar2)"/>
    <!-- (1,-2) -> (264,348) -->
    <line x1="230" y1="280" x2="264" y2="348" stroke="#4a8edb" stroke-width="1.5" marker-end="url(#ar2)"/>
    <!-- (-1,-2) -> (196,348) -->
    <line x1="230" y1="280" x2="196" y2="348" stroke="#4a8edb" stroke-width="1.5" marker-end="url(#ar2)"/>
    <!-- (-2,-1) -> (162,314) -->
    <line x1="230" y1="280" x2="162" y2="314" stroke="#4a8edb" stroke-width="1.5" marker-end="url(#ar2)"/>
    <!-- (-2,1) -> (162,246) -->
    <line x1="230" y1="280" x2="162" y2="246" stroke="#4a8edb" stroke-width="1.5" marker-end="url(#ar2)"/>
    <!-- (-1,2) -> (196,212) -->
    <line x1="230" y1="280" x2="196" y2="212" stroke="#4a8edb" stroke-width="1.5" marker-end="url(#ar2)"/>
  </g>

  <!-- origin knight -->
  <g filter="url(#sk)">
    <ellipse cx="230" cy="280" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="230" y="284" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">马</text>
  </g>

  <!-- 4 symmetric targets -->
  <g filter="url(#sk)">
    <!-- (3,2) Q1 -> (332,212) -->
    <rect x="322" y="202" width="20" height="20" rx="3" fill="#fff3cd" stroke="#d6a040" stroke-width="1.5"/>
    <text x="332" y="216" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">T</text>
    <!-- (-3,2) Q2 -> (128,212) -->
    <rect x="118" y="202" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2"/>
    <text x="128" y="216" text-anchor="middle" font-size="9" fill="#b85450">T'</text>
    <!-- (-3,-2) Q3 -> (128,348) -->
    <rect x="118" y="338" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2"/>
    <text x="128" y="352" text-anchor="middle" font-size="9" fill="#b85450">T'</text>
    <!-- (3,-2) Q4 -> (332,348) -->
    <rect x="322" y="338" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2"/>
    <text x="332" y="352" text-anchor="middle" font-size="9" fill="#b85450">T'</text>
  </g>

  <!-- dashed reflection arrows to Q1 target -->
  <g filter="url(#sk)" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <path d="M 138 212 Q 230 180 322 212" marker-end="url(#ar3)"/>
    <path d="M 128 358 Q 230 410 322 358" marker-end="url(#ar3)"/>
    <path d="M 138 348 Q 180 280 322 212" marker-end="url(#ar3)"/>
  </g>

  <text x="230" y="396" text-anchor="middle" font-size="11" fill="#444">
    <tspan x="230" dy="0">马走 8 个 L 形：(±1,±2)、(±2,±1)</tspan>
    <tspan x="230" dy="16">→ 步数对 x/y 取正负号不变</tspan>
    <tspan x="230" dy="16" fill="#b85450" font-weight="bold">故 answer(x,y) = answer(|x|,|y|)</tspan>
  </text>
  <text x="230" y="466" text-anchor="middle" font-size="10" fill="#888">四个象限的目标，折叠到第一象限统一求解</text>

  <!-- ===== Right: pruning region ===== -->
  <g filter="url(#sk)">
    <rect x="450" y="62" width="400" height="430" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="650" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">② 负向裁剪：只搜 x≥-2 且 y≥-2</text>

  <!-- mini grid: origin at (560, 300), unit=30px, show [-2..3] x [-2..3] -->
  <!-- shaded region x>=-2,y>=-2 -->
  <g filter="url(#sk)">
    <rect x="500" y="150" width="210" height="210" fill="#eaf6ee" stroke="none" opacity="0.5"/>
  </g>

  <!-- grid lines -->
  <g filter="url(#sk)" stroke="#cccccc" stroke-width="0.8">
    <line x1="500" y1="150" x2="500" y2="360"/>
    <line x1="530" y1="150" x2="530" y2="360"/>
    <line x1="560" y1="150" x2="560" y2="360"/>
    <line x1="590" y1="150" x2="590" y2="360"/>
    <line x1="620" y1="150" x2="620" y2="360"/>
    <line x1="650" y1="150" x2="650" y2="360"/>
    <line x1="680" y1="150" x2="680" y2="360"/>
    <line x1="710" y1="150" x2="710" y2="360"/>
    <line x1="500" y1="150" x2="710" y2="150"/>
    <line x1="500" y1="180" x2="710" y2="180"/>
    <line x1="500" y1="210" x2="710" y2="210"/>
    <line x1="500" y1="240" x2="710" y2="240"/>
    <line x1="500" y1="270" x2="710" y2="270"/>
    <line x1="500" y1="300" x2="710" y2="300"/>
    <line x1="500" y1="330" x2="710" y2="330"/>
    <line x1="500" y1="360" x2="710" y2="360"/>
  </g>

  <!-- axes: x-axis at y=0 -> pixel 300, y-axis at x=0 -> pixel 560 -->
  <g filter="url(#sk)">
    <line x1="500" y1="300" x2="710" y2="300" stroke="#888" stroke-width="1.3"/>
    <line x1="560" y1="150" x2="560" y2="360" stroke="#888" stroke-width="1.3"/>
    <text x="714" y="304" font-size="10" fill="#888">x</text>
    <text x="564" y="148" font-size="10" fill="#888">y</text>
    <!-- axis labels -->
    <text x="530" y="316" text-anchor="middle" font-size="9" fill="#aaa">-1</text>
    <text x="500" y="316" text-anchor="middle" font-size="9" fill="#aaa">-2</text>
    <text x="500" y="336" text-anchor="middle" font-size="9" fill="#aaa">-2</text>
    <text x="530" y="336" text-anchor="middle" font-size="9" fill="#aaa">-1</text>
  </g>

  <!-- origin (0,0) -> (560,300) -->
  <g filter="url(#sk)">
    <ellipse cx="560" cy="300" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="560" y="304" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">马</text>
  </g>

  <!-- target (1,1) -> (590,270) -->
  <g filter="url(#sk)">
    <rect x="580" y="260" width="20" height="20" rx="3" fill="#fff3cd" stroke="#d6a040" stroke-width="2"/>
    <text x="590" y="274" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">T</text>
  </g>

  <!-- intermediate (2,-1) -> (620,330) -->
  <g filter="url(#sk)">
    <rect x="610" y="320" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="620" y="334" text-anchor="middle" font-size="9" fill="#446688">中</text>
  </g>

  <!-- path arrows: (0,0)->(2,-1)->(1,1) -->
  <g filter="url(#sk)" stroke="#b85450" stroke-width="2" fill="none">
    <path d="M 573 300 L 610 330" marker-end="url(#ar3)"/>
    <path d="M 620 320 L 593 280" marker-end="url(#ar3)"/>
  </g>

  <text x="650" y="392" text-anchor="middle" font-size="11" fill="#444">
    <tspan x="650" dy="0">目标 (1,1)：最优路径</tspan>
    <tspan x="650" dy="16">(0,0) → (2,<tspan fill="#b85450" font-weight="bold">-1</tspan>) → (1,1)，2 步</tspan>
  </text>
  <text x="650" y="438" text-anchor="middle" font-size="11" fill="#444">
    <tspan x="650" dy="0" font-weight="bold" fill="#2e6e2e">为何放行到 -2？</tspan>
    <tspan x="650" dy="16">折叠到第一象限后，最优路径</tspan>
    <tspan x="650" dy="16">最多短暂下探到 -1（如上例）</tspan>
    <tspan x="650" dy="16">放行 -2 留出安全余量，绝不剪掉最优解</tspan>
  </text>
</svg>
