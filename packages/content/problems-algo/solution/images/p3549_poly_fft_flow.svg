<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">FFT 多项式乘法流程</text>

  <!-- 步骤 1：读入 -->
  <rect x="110" y="36" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">读入 a、b；need = n+m−1；sz = 1</text>

  <path d="M 260 68 L 260 82" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2：sz 翻倍循环（菱形 + 左侧回边） -->
  <polygon points="260,86 350,112 260,138 170,112" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">sz &lt; need ?</text>

  <rect x="28" y="96" width="88" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="72" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">sz ← sz × 2</text>

  <path d="M 170 112 L 120 112" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="143" y="106" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 72 96 C 72 66, 180 62, 248 82" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M 260 138 L 260 152" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="150" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 步骤 3：补零 -->
  <rect x="110" y="154" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="175" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">末尾补零：a、b 长度都变为 sz</text>

  <path d="M 260 186 L 260 200" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 4：FFT -->
  <rect x="110" y="202" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">FFT × 2：系数 → 点值 A[k]、B[k]</text>
  <text x="416" y="222" font-size="10" fill="#888" filter="url(#rough2)">O(n log n)</text>

  <path d="M 260 234 L 260 248" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 5：逐点乘 -->
  <rect x="110" y="250" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">逐点相乘：C[k] = A[k] × B[k]</text>
  <text x="416" y="270" font-size="10" fill="#888" filter="url(#rough2)">O(n)</text>

  <path d="M 260 282 L 260 296" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 6：IFFT + 取整 -->
  <rect x="110" y="298" width="300" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">IFFT 回系数域；llround 取整，返回前 need 个</text>

  <!-- 右侧精度备注 -->
  <rect x="422" y="240" width="92" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="468" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">真值为整数</text>
  <text x="468" y="278" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">浮点误差 ≪ 0.5</text>
  <text x="468" y="294" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">取整即精确</text>

  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总复杂度 O((n+m)·log(n+m))</text>
</svg>
