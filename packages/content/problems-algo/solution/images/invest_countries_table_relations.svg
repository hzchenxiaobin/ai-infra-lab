<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三张表如何串联：通话 → 人 → 国家</text>

  <!-- ===== Person table (left) ===== -->
  <rect x="24" y="120" width="210" height="150" fill="#fff" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="24" y="120" width="210" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="129" y="138" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Person</text>

  <text x="40" y="168" font-size="12" fill="#333" font-weight="bold">id</text>
  <text x="220" y="168" text-anchor="end" font-size="10" fill="#888">int · 唯一</text>
  <line x1="34" y1="176" x2="224" y2="176" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="198" font-size="12" fill="#333">name</text>
  <text x="220" y="198" text-anchor="end" font-size="10" fill="#888">varchar</text>
  <line x1="34" y1="206" x2="224" y2="206" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="228" font-size="12" fill="#b85450" font-weight="bold">phone_number</text>
  <text x="220" y="228" text-anchor="end" font-size="10" fill="#888">varchar</text>
  <text x="129" y="252" text-anchor="middle" font-size="10" fill="#b85450">格式 'xxx-yyyyyyy'</text>

  <!-- ===== Country table (top right) ===== -->
  <rect x="334" y="44" width="200" height="92" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="334" y="44" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="434" y="62" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Country</text>

  <text x="350" y="92" font-size="12" fill="#333">name</text>
  <text x="220" y="92" text-anchor="end" font-size="10" fill="#888"></text>
  <line x1="344" y1="100" x2="524" y2="100" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="122" font-size="12" fill="#4a7a3a" font-weight="bold">country_code</text>
  <text x="520" y="122" text-anchor="end" font-size="10" fill="#888">唯一</text>

  <!-- ===== Calls table (bottom right) ===== -->
  <rect x="334" y="232" width="200" height="116" fill="#fff" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="334" y="232" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="434" y="250" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Calls</text>

  <text x="350" y="280" font-size="12" fill="#d6a040" font-weight="bold">caller_id</text>
  <text x="520" y="280" text-anchor="end" font-size="10" fill="#888">→ Person.id</text>
  <line x1="344" y1="288" x2="524" y2="288" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="310" font-size="12" fill="#d6a040" font-weight="bold">callee_id</text>
  <text x="520" y="310" text-anchor="end" font-size="10" fill="#888">→ Person.id</text>
  <line x1="344" y1="318" x2="524" y2="318" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="338" font-size="12" fill="#333">duration</text>
  <text x="520" y="338" text-anchor="end" font-size="10" fill="#888">分钟</text>

  <!-- ===== Arrow: Person.id -> Calls (caller_id / callee_id) ===== -->
  <path d="M 234 168 C 280 168, 290 280, 330 285" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="196" width="118" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="209" text-anchor="middle" font-size="10" fill="#a07020" font-weight="bold">id IN (caller_id,callee_id)</text>

  <!-- ===== Arrow: Person.phone_number -> Country.country_code ===== -->
  <path d="M 234 228 C 280 228, 290 122, 330 120" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="236" y="150" width="112" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="292" y="163" text-anchor="middle" font-size="10" fill="#3a6a2a" font-weight="bold">LEFT(phone,3)=code</text>

  <!-- ===== Bottom note ===== -->
  <rect x="24" y="300" width="270" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="159" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">核心：每通电话 = 2 个参与者</text>
  <text x="159" y="340" text-anchor="middle" font-size="10" fill="#555">caller 与 callee 各贡献一次 duration</text>
  <text x="159" y="354" text-anchor="middle" font-size="10" fill="#555">→ 同国通话时长被计两次</text>
</svg>
