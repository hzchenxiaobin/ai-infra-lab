<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums1=[1,2,3,3], nums2=[1,1,2,2]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">重复值经集合化后被自动合并</text>

  <!-- ===== nums1 row ===== -->
  <text x="40" y="72" font-size="11" fill="#888">nums1:</text>
  <rect x="80" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="124" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="168" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="212" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <!-- arrow: nums1 -> set1 -->
  <path d="M 234 94 L 234 116" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- set1 box -->
  <rect x="80" y="118" width="176" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="168" y="138" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">set1 = {1, 2, 3}（重复 3 合并）</text>

  <!-- ===== nums2 row ===== -->
  <text x="320" y="72" font-size="11" fill="#888">nums2:</text>
  <rect x="360" y="58" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="78" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="400" y="58" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="78" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="440" y="58" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="78" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="480" y="58" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="78" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- arrow: nums2 -> set2 -->
  <path d="M 500 94 L 500 116" stroke="#d6a040" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- set2 box -->
  <rect x="360" y="118" width="176" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="448" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">set2 = {1, 2}（重复合并）</text>

  <!-- ===== Difference computation row ===== -->
  <text x="40" y="178" font-size="11" fill="#555" font-weight="bold">求差：</text>

  <!-- ans0 = set1 - set2 -->
  <rect x="80" y="168" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="180" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">set1 − set2 = {3}</text>

  <!-- ans1 = set2 - set1 -->
  <rect x="320" y="168" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="420" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">set2 − set1 = {} （空）</text>

  <!-- arrows down to final -->
  <path d="M 180 204 L 180 226" stroke="#4a7a3a" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 204 L 420 226" stroke="#4a7a3a" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Final answer ===== -->
  <rect x="100" y="228" width="360" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"
        rx="8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">
    answer = [[3], [ ]]
  </text>

  <!-- ===== Explanation note ===== -->
  <rect x="60" y="280" width="440" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"
        rx="8" filter="url(#rough2)"/>
  <text x="80" y="302" font-size="11" fill="#b85450" font-weight="bold">要点：</text>
  <text x="80" y="320" font-size="10.5" fill="#555">· nums1 中两个 3 经 set 去重后只剩一个 → answer[0] = [3]</text>
  <text x="80" y="338" font-size="10.5" fill="#555">· nums2 的 1、2 全都出现在 set1 中 → set2−set1 = ∅ → answer[1] = []</text>
  <text x="80" y="356" font-size="10.5" fill="#555">· “不同整数”= 集合语义，去重是题目硬性要求，非额外优化</text>
  <text x="80" y="374" font-size="10.5" fill="#555">· 返回顺序任意，无需排序</text>
</svg>
