<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：milestones = [5, 2, 1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">max = 5（项目0），rest = 3（项目1×2 + 项目2×1）</text>

  <text x="280" y="68" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">槽位视角：4 个槽填 P0，3 个分隔符消耗 rest</text>

  <rect x="60" y="80" width="56" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="103" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">P0</text>
  <rect x="124" y="80" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="103" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">P1</text>
  <rect x="188" y="80" width="56" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="103" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">P0</text>
  <rect x="252" y="80" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="103" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">P1</text>
  <rect x="316" y="80" width="56" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="103" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">P0</text>
  <rect x="380" y="80" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="103" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">P2</text>
  <rect x="444" y="80" width="56" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="103" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">P0</text>

  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4 个 P0 填满 4 个槽（= rest+1），3 个分隔符 = rest 已耗尽</text>

  <text x="280" y="160" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">逐周安排（7 周，相邻无同项目）</text>

  <rect x="60" y="172" width="56" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="195" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">P0</text>
  <rect x="124" y="172" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="195" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">P1</text>
  <rect x="188" y="172" width="56" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="195" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">P0</text>
  <rect x="252" y="172" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">P1</text>
  <rect x="316" y="172" width="56" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="195" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">P0</text>
  <rect x="380" y="172" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="195" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">P2</text>
  <rect x="444" y="172" width="56" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="195" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">P0</text>

  <text x="88" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">W1</text>
  <text x="152" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">W2</text>
  <text x="216" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">W3</text>
  <text x="280" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">W4</text>
  <text x="344" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">W5</text>
  <text x="408" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">W6</text>
  <text x="472" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">W7</text>

  <path d="M 472 212 L 500 212 L 500 250 L 460 250 L 460 246" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="390" y="252" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">W8: P0 ✗</text>
  <text x="280" y="274" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">仅剩 P0，与 W7 相邻 → 违规，停止</text>

  <rect x="120" y="304" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 2·rest + 1 = 2×3 + 1 = 7</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">项目 0 余 1 个阶段任务未完成（5 − 4 = 1）</text>
</svg>
