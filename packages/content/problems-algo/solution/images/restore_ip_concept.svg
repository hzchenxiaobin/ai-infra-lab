<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">复原 IP 地址：把数字串切成 4 段合法八位组</text>

  <!-- 原始字符串 -->
  <text x="40" y="64" font-size="11" fill="#888" font-weight="bold">原始数字串 s = "25525511135"</text>
  <g font-size="13">
    <rect x="40" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="57" y="96" text-anchor="middle" fill="#333">2</text>
    <rect x="76" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="93" y="96" text-anchor="middle" fill="#333">5</text>
    <rect x="112" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="129" y="96" text-anchor="middle" fill="#333">5</text>
    <rect x="148" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="165" y="96" text-anchor="middle" fill="#333">2</text>
    <rect x="184" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="201" y="96" text-anchor="middle" fill="#333">5</text>
    <rect x="220" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="237" y="96" text-anchor="middle" fill="#333">5</text>
    <rect x="256" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="273" y="96" text-anchor="middle" fill="#333">1</text>
    <rect x="292" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="309" y="96" text-anchor="middle" fill="#333">1</text>
    <rect x="328" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="345" y="96" text-anchor="middle" fill="#333">1</text>
    <rect x="364" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="381" y="96" text-anchor="middle" fill="#333">3</text>
    <rect x="400" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="417" y="96" text-anchor="middle" fill="#333">5</text>
  </g>

  <!-- 切分方案 A -->
  <text x="40" y="148" font-size="11" fill="#888" font-weight="bold">方案 A：255 . 255 . 11 . 135</text>
  <g font-size="13" font-weight="bold">
    <rect x="40" y="158" width="106" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="93" y="180" text-anchor="middle" fill="#333">255</text>
    <text x="156" y="180" text-anchor="middle" font-size="16" fill="#888">.</text>
    <rect x="170" y="158" width="106" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="223" y="180" text-anchor="middle" fill="#4a7a3a">255</text>
    <text x="286" y="180" text-anchor="middle" font-size="16" fill="#888">.</text>
    <rect x="300" y="158" width="72" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="336" y="180" text-anchor="middle" fill="#8a6a20">11</text>
    <text x="382" y="180" text-anchor="middle" font-size="16" fill="#888">.</text>
    <rect x="396" y="158" width="106" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="449" y="180" text-anchor="middle" fill="#b85450">135</text>
  </g>
  <text x="93" y="206" text-anchor="middle" font-size="10" fill="#446688">≤255 ✓</text>
  <text x="336" y="206" text-anchor="middle" font-size="10" fill="#d6a040">无前导零 ✓</text>
  <text x="449" y="206" text-anchor="middle" font-size="10" fill="#b85450">≤255 ✓</text>

  <!-- 切分方案 B -->
  <text x="40" y="236" font-size="11" fill="#888" font-weight="bold">方案 B：255 . 255 . 111 . 35</text>
  <g font-size="13" font-weight="bold">
    <rect x="40" y="246" width="106" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="93" y="268" text-anchor="middle" fill="#333">255</text>
    <text x="156" y="268" text-anchor="middle" font-size="16" fill="#888">.</text>
    <rect x="170" y="246" width="106" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="223" y="268" text-anchor="middle" fill="#4a7a3a">255</text>
    <text x="286" y="268" text-anchor="middle" font-size="16" fill="#888">.</text>
    <rect x="300" y="246" width="106" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="353" y="268" text-anchor="middle" fill="#8a6a20">111</text>
    <text x="416" y="268" text-anchor="middle" font-size="16" fill="#888">.</text>
    <rect x="430" y="246" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="466" y="268" text-anchor="middle" fill="#b85450">35</text>
  </g>
  <text x="353" y="294" text-anchor="middle" font-size="10" fill="#d6a040">≤255 ✓</text>
  <text x="466" y="294" text-anchor="middle" font-size="10" fill="#b85450">无前导零 ✓</text>

  <!-- 规则框 -->
  <rect x="40" y="318" width="540" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="342" font-size="12" fill="#8a6a20" font-weight="bold">合法八位组判定（3 条）</text>
  <text x="60" y="364" font-size="11" fill="#555">① 长度 1~3 位（一位 0-9，两位 10-99，三位 100-255）</text>
  <text x="60" y="382" font-size="11" fill="#555">② 无前导零：长度 &gt; 1 时首位 ≠ '0'（"0" 合法，"01" 非法）</text>
  <text x="60" y="400" font-size="11" fill="#555">③ 数值 ≤ 255（三位数时校验，如 "256" 非法）</text>
  <text x="380" y="364" font-size="11" fill="#4a7a3a" font-weight="bold">回溯切分：</text>
  <text x="380" y="382" font-size="11" fill="#555">seg==4 &amp;&amp; start==n</text>
  <text x="380" y="400" font-size="11" fill="#555">→ 4 段恰好覆盖整串</text>
</svg>
