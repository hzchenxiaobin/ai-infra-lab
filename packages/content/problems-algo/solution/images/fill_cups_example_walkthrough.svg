<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：情形 A / 情形 B / 情形 A 退化</text>

  <!-- Ex1 -->
  <rect x="36" y="38" width="488" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="58" font-size="12.5" fill="#333" font-weight="bold">例1：amount=[1,4,2] → 输出 4</text>
  <text x="52" y="78" font-size="11" fill="#555">s = 1+4+2 = 7，m = max = 4；2·m = 8 ≥ 7 → 情形 A</text>
  <text x="52" y="96" font-size="11" fill="#555">下界② m = 4 主导：其余(1冷+2热=3)逐一与温水4配对 → 3 秒 + 余 1 杯 = 4 秒</text>
  <text x="52" y="120" font-size="11" fill="#b85450" font-weight="bold">return max(m, ⌈s/2⌉) = max(4, 4) = 4 ✓</text>

  <!-- Ex2 -->
  <rect x="36" y="152" width="488" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="172" font-size="12.5" fill="#333" font-weight="bold">例2：amount=[5,4,4] → 输出 7</text>
  <text x="52" y="192" font-size="11" fill="#555">s = 5+4+4 = 13，m = max = 5；2·m = 10 &lt; 13 → 情形 B</text>
  <text x="52" y="210" font-size="11" fill="#555">下界① ⌈s/2⌉ = 7 主导：三类彼此配平，两两配对 6 秒 + 余 1 杯 = 7 秒</text>
  <text x="52" y="234" font-size="11" fill="#446688" font-weight="bold">return max(m, ⌈s/2⌉) = max(5, 7) = 7 ✓</text>

  <!-- Ex3 -->
  <rect x="36" y="266" width="488" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="286" font-size="12.5" fill="#333" font-weight="bold">例3：amount=[5,0,0] → 输出 5</text>
  <text x="52" y="306" font-size="11" fill="#555">s = 5，m = 5；2·m = 10 ≥ 5 → 情形 A（含 0 类不影响判定）</text>
  <text x="52" y="324" font-size="11" fill="#555">下界② m = 5 主导：仅有冷水 5 杯，每秒一杯 → 5 秒</text>
  <text x="52" y="348" font-size="11" fill="#d6a040" font-weight="bold">return max(m, ⌈s/2⌉) = max(5, 3) = 5 ✓</text>

  <!-- notes -->
  <text x="36" y="394" font-size="11" fill="#555">• 情形由 2·m 与 s 的大小关系判定，与具体哪类多无关；0 类天然并入情形 A。</text>
  <text x="36" y="414" font-size="11" fill="#555">• s 的奇偶仅影响 ⌈s/2⌉ 的上取整，不影响情形归属。</text>
  <text x="36" y="438" font-size="10.5" fill="#888">三类示例覆盖"最大类主导"与"总量主导"两种瓶颈，公式统一为 max。</text>
</svg>
