<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：逐条对角线「取出 → 排序 → 写回」</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="140" y="36" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="200" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">开始（d = −(n−1)）</text>
  </g>
  <path d="M 200 64 L 200 80" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1: extract diagonal -->
  <g filter="url(#rough2)">
    <rect x="85" y="82" width="190" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="180" y="99" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">① 取出对角线 d 的全部元素</text>
    <text x="180" y="114" text-anchor="middle" font-size="9.5" fill="#55677d">起点：d≥0 → (d,0)；d&lt;0 → (0,−d)</text>
    <text x="180" y="128" text-anchor="middle" font-size="9.5" fill="#55677d">沿 ↘ 每次 i++、j++ 直到出界</text>
  </g>
  <path d="M 200 134 L 200 148" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: d >= 0 ? -->
  <g filter="url(#rough2)">
    <path d="M 200 212 L 256 180 L 200 148 L 144 180 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="200" y="184" text-anchor="middle" font-size="11" fill="#8a6d1f">d ≥ 0 ?</text>
  </g>
  <path d="M 256 180 L 278 180" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="264" y="171" font-size="10" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 144 180 L 122 180" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="171" font-size="10" fill="#8a6d1f" filter="url(#rough2)">否</text>

  <!-- sort boxes -->
  <g filter="url(#rough2)">
    <rect x="280" y="162" width="104" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="332" y="177" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">② 降序排序</text>
    <text x="332" y="190" text-anchor="middle" font-size="8.5" fill="#55677d">sort(rbegin, rend)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="16" y="162" width="104" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="68" y="177" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f">② 升序排序</text>
    <text x="68" y="190" text-anchor="middle" font-size="8.5" fill="#55677d">sort(begin, end)</text>
  </g>

  <!-- merge into write-back -->
  <path d="M 68 198 L 68 218 L 160 218 L 160 236" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 198 L 332 218 L 240 218 L 240 236" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: write back -->
  <g filter="url(#rough2)">
    <rect x="110" y="236" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="200" y="251" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">③ 按取出顺序写回 grid</text>
    <text x="200" y="265" text-anchor="middle" font-size="9.5" fill="#55677d">第 k 个值 → 第 k 个格子</text>
  </g>
  <path d="M 200 274 L 200 284" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: more diagonals? -->
  <g filter="url(#rough2)">
    <path d="M 200 340 L 258 312 L 200 284 L 142 312 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="200" y="316" text-anchor="middle" font-size="10" fill="#8f3a35">d &lt; n−1 ?</text>
  </g>

  <!-- yes: loop back -->
  <path d="M 258 312 L 455 312 L 455 108 L 279 108" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="322" y="304" font-size="10" fill="#8f3a35" filter="url(#rough2)">是：d++，处理下一条</text>

  <!-- no: return -->
  <path d="M 200 340 L 200 352" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="349" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="140" y="352" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="200" y="369" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">返回 grid</text>
  </g>

  <!-- side note: complexity -->
  <g filter="url(#rough2)">
    <rect x="370" y="40" width="140" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="440" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f">时间 O(n² log n)</text>
    <text x="440" y="78" text-anchor="middle" font-size="10" fill="#55677d">空间 O(n)（单条对角线）</text>
    <text x="440" y="92" text-anchor="middle" font-size="10" fill="#55677d">共 2n−1 条，互不相交</text>
  </g>

  <!-- side note: why no misplacement -->
  <g filter="url(#rough2)">
    <rect x="330" y="336" width="180" height="38" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="10"/>
    <text x="420" y="351" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b">收集顺序 = 写回顺序</text>
    <text x="420" y="366" text-anchor="middle" font-size="9.5" fill="#55677d">都沿 ↘，位置一一对应</text>
  </g>
</svg>
