<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="510" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,1,2,2,3]，排序后仍为 [1,1,2,2,3]</text>

  <!-- Table header -->
  <rect x="40" y="48" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="90" y1="48" x2="90" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="48" x2="150" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="48" x2="220" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="48" x2="310" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="48" x2="380" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="120" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <text x="185" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i-1]</text>
  <text x="265" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">换层?</text>
  <text x="345" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt</text>
  <text x="470" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans（累加）</text>

  <!-- Row i=1: same value -->
  <rect x="40" y="80" width="520" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="185" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="265" y="100" text-anchor="middle" font-size="10" fill="#888">同值</text>
  <text x="345" y="100" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="470" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Row i=2: tier change -->
  <rect x="40" y="114" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="185" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="265" y="134" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">换层 ↑</text>
  <text x="345" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="470" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 + 1 = 1</text>

  <!-- Row i=3: same value -->
  <rect x="40" y="148" width="520" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="168" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="168" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="185" y="168" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="265" y="168" text-anchor="middle" font-size="10" fill="#888">同值</text>
  <text x="345" y="168" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="470" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 + 1 = 2</text>

  <!-- Row i=4: tier change -->
  <rect x="40" y="182" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="202" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="120" y="202" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="185" y="202" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="265" y="202" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">换层 ↑</text>
  <text x="345" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="470" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 + 2 = 4</text>

  <!-- Result box -->
  <rect x="160" y="224" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="246" font-size="11" fill="#555">最终结果：</text>
  <text x="270" y="247" font-size="14" fill="#4a7a3a" font-weight="bold">操作次数 = 4</text>

  <!-- Operation simulation section -->
  <text x="300" y="280" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">实际操作模拟（验证计数）</text>

  <!-- Initial state -->
  <text x="70" y="312" font-size="10" fill="#888">初始：</text>
  <rect x="160" y="298" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="298" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="298" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="280" y="298" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="320" y="298" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- arrow op1 -->
  <path d="M 260 328 L 260 342" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="338" font-size="10" fill="#b85450" font-weight="bold">op1: 3→2</text>

  <!-- After op1 -->
  <text x="70" y="360" font-size="10" fill="#888">op1：</text>
  <rect x="160" y="346" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="364" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="346" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="364" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="346" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="280" y="346" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="364" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="320" y="346" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="364" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- arrow op2 -->
  <path d="M 260 376 L 260 390" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="386" font-size="10" fill="#d6a040" font-weight="bold">op2: 2→1</text>

  <!-- After op2 -->
  <text x="70" y="408" font-size="10" fill="#888">op2：</text>
  <rect x="160" y="394" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="412" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="394" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="412" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="394" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="280" y="394" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="412" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="320" y="394" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="412" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- arrow op3 -->
  <path d="M 300 424 L 300 438" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="434" font-size="10" fill="#d6a040" font-weight="bold">op3: 2→1</text>

  <!-- After op3 -->
  <text x="70" y="456" font-size="10" fill="#888">op3：</text>
  <rect x="160" y="442" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="460" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="442" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="460" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="442" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="460" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="280" y="442" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="460" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="320" y="442" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="460" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- arrow op4 -->
  <path d="M 340 472 L 340 486" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="482" font-size="10" fill="#d6a040" font-weight="bold">op4: 2→1 → 全等</text>

  <!-- Bottom note -->
  <rect x="40" y="486" width="320" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="500" text-anchor="middle" font-size="10" fill="#666">4 次操作 = 层数之和 0+0+1+1+2 ✓</text>
</svg>
