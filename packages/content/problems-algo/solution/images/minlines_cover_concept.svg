<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">一条直线 ↔ 一个点掩码：共线的点位置 1</text>

  <!-- ===== Left: small coordinate plane ===== -->
  <rect x="30" y="50" width="240" height="220" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- axes -->
  <path d="M 60 240 L 60 70" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 60 240 L 255 240" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="52" y="74" font-size="10" fill="#888">y</text>
  <text x="258" y="244" font-size="10" fill="#888">x</text>

  <!-- the line y = x+1 through P0,P1,P2 (extend beyond points) -->
  <path d="M 75 255 L 235 65" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="232" y="60" font-size="11" fill="#d6a040" font-weight="bold">y = x+1</text>

  <!-- points: origin (90,240), scale 35 per unit; data (x,y) -> (90+35x, 240-35y) -->
  <!-- P0=(0,1) -> (90,205) ; P1=(2,3) -> (160,135) ; P2=(4,5) -> (230,65) ; P3=(4,3) -> (230,135) -->
  <circle cx="90" cy="205" r="6" fill="#446688" stroke="#224" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="200" font-size="11" fill="#224" font-weight="bold">P0</text>
  <text x="74" y="214" font-size="9" fill="#888">(0,1)</text>

  <circle cx="160" cy="135" r="6" fill="#446688" stroke="#224" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="130" font-size="11" fill="#224" font-weight="bold">P1</text>
  <text x="144" y="144" font-size="9" fill="#888">(2,3)</text>

  <circle cx="230" cy="65" r="6" fill="#446688" stroke="#224" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="214" y="60" font-size="11" fill="#224" font-weight="bold">P2</text>
  <text x="214" y="74" font-size="9" fill="#888">(4,5)</text>

  <!-- P3 off the line -->
  <circle cx="230" cy="135" r="6" fill="#b85450" stroke="#7a2a26" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="238" y="132" font-size="11" fill="#7a2a26" font-weight="bold">P3</text>
  <text x="238" y="146" font-size="9" fill="#888">(4,3)</text>

  <!-- ===== Right: bitmask encoding ===== -->
  <text x="380" y="64" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">点的编号</text>
  <rect x="300" y="74" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="96" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="348" y="74" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="96" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="396" y="74" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="96" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="444" y="74" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="96" text-anchor="middle" font-size="13" fill="#333">3</text>

  <text x="380" y="128" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">直线 y=x+1 的掩码</text>
  <rect x="300" y="138" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="348" y="138" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="396" y="138" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="444" y="138" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="160" text-anchor="middle" font-size="14" fill="#999">0</text>

  <!-- legend -->
  <rect x="300" y="188" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="204" font-size="10" fill="#4a7a3a">= 在直线上（置 1）</text>
  <rect x="300" y="216" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="232" font-size="10" fill="#b85450">= 不在直线上（置 0）</text>

  <!-- bottom summary box -->
  <rect x="30" y="290" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#444">lineMask = 0111₂ = 7 → 这条直线一次性覆盖 {P0, P1, P2}</text>
  <text x="260" y="328" text-anchor="middle" font-size="11" fill="#666">每条直线就是一个 n 位掩码；问题 = 选最少的掩码使其按位或 == 全 1</text>

  <!-- arrow from plane to mask -->
  <path d="M 272 160 L 296 155" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
