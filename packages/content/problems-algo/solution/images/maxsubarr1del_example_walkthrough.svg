<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1, −2, 0, 3]</text>

  <!-- Table header -->
  <rect x="30" y="44" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>

  <rect x="110" y="44" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">arr[i]</text>

  <rect x="200" y="44" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp0（不删）</text>

  <rect x="310" y="44" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp1（删1次）</text>

  <rect x="420" y="44" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans</text>

  <!-- Row 0: i=0, arr=1 -->
  <rect x="30" y="84" width="80" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="106" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="110" y="84" width="90" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="155" y="106" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="200" y="84" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="310" y="84" width="110" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="106" text-anchor="middle" font-size="12" fill="#888">−∞</text>
  <rect x="420" y="84" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Row 1: i=1, arr=-2 -->
  <rect x="30" y="124" width="80" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="146" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="110" y="124" width="90" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="155" y="146" text-anchor="middle" font-size="12" fill="#333">−2</text>
  <rect x="200" y="124" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="146" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="310" y="124" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="420" y="124" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Row 2: i=2, arr=0 -->
  <rect x="30" y="164" width="80" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="186" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="110" y="164" width="90" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="155" y="186" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="200" y="164" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="186" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="310" y="164" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="186" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="420" y="164" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Row 3: i=3, arr=3 -->
  <rect x="30" y="204" width="80" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="110" y="204" width="90" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="155" y="226" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="200" y="204" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="226" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="310" y="204" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="420" y="204" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>

  <!-- Explanation -->
  <rect x="30" y="256" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="278" font-size="12" fill="#333" font-weight="bold">i=3 时 dp1[3] = max(dp0[2], dp1[2]+3) = max(0, 1+3) = 4</text>
  <text x="50" y="296" font-size="11" fill="#555">对应子数组 [1, −2, 0, 3] 删去 −2 → [1, 0, 3] 和为 4 ✓</text>

  <!-- Array visualization with deletion -->
  <rect x="60" y="328" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="125" y="328" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="348" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−2</text>
  <line x1="135" y1="332" x2="175" y2="354" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="190" y="328" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="255" y="328" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="340" y="348" font-size="12" fill="#4a7a3a" font-weight="bold">→ 1 + 0 + 3 = 4</text>
</svg>
