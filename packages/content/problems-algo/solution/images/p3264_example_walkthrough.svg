<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：nums = [2,1,3,5,6]，k = 5，multiplier = 2</text>
  <text x="105" y="46" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">动作（弹出 (值, 下标)）</text>
  <text x="283" y="46" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">数组状态</text>

  <!-- 初始 -->
  <text x="30" y="72" font-size="10.5" fill="#333" filter="url(#rough2)">初始</text>
  <rect x="200" y="56" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="72" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="234" y="56" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="249" y="72" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="268" y="56" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="72" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="302" y="56" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="72" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="336" y="56" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="72" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>

  <!-- 第 1 轮 -->
  <text x="30" y="104" font-size="10.5" fill="#333" filter="url(#rough2)">① 弹 (1,1) → 2</text>
  <rect x="200" y="88" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="234" y="88" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="249" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="268" y="88" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="302" y="88" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="336" y="88" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>

  <!-- 第 2 轮 -->
  <text x="30" y="136" font-size="10.5" fill="#333" filter="url(#rough2)">② 弹 (2,0) → 4</text>
  <rect x="200" y="120" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="215" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="234" y="120" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="249" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="268" y="120" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="302" y="120" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="336" y="120" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="438" y="130" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">两个 2 并列</text>
  <text x="438" y="144" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">取最前下标 0</text>

  <!-- 第 3 轮 -->
  <text x="30" y="168" font-size="10.5" fill="#333" filter="url(#rough2)">③ 弹 (2,1) → 4</text>
  <rect x="200" y="152" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="234" y="152" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="249" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="268" y="152" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="302" y="152" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="336" y="152" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>

  <!-- 第 4 轮 -->
  <text x="30" y="200" font-size="10.5" fill="#333" filter="url(#rough2)">④ 弹 (3,2) → 6</text>
  <rect x="200" y="184" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="234" y="184" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="249" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="268" y="184" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="283" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="302" y="184" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="336" y="184" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>

  <!-- 第 5 轮 -->
  <text x="30" y="232" font-size="10.5" fill="#333" filter="url(#rough2)">⑤ 弹 (4,0) → 8</text>
  <rect x="200" y="216" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="215" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="234" y="216" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="249" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="268" y="216" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="302" y="216" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="336" y="216" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="438" y="226" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">两个 4 并列</text>
  <text x="438" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">取最前下标 0</text>

  <!-- 最终 -->
  <text x="30" y="269" font-size="11" fill="#4a7a3a" filter="url(#rough2)">最终（k 用完）</text>
  <rect x="200" y="250" width="32" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="216" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="236" y="250" width="32" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="272" y="250" width="32" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="288" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="308" y="250" width="32" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="324" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="344" y="250" width="32" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <!-- 小结 -->
  <rect x="40" y="294" width="440" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每轮只动一个格子：弹出的永远是当前全局最小（并列取最前）</text>
  <text x="260" y="331" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">被乘过的格子值变大、自动「沉底」，后续轮次轮到别的最小格子</text>

  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">红 = 初始全局最小；橙 = 本轮被乘的格子；绿 = 最终答案</text>
</svg>
