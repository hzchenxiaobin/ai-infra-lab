<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：后序 DFS 计算离地高度并分组</text>

  <!-- start -->
  <rect x="220" y="48" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dfs(node)</text>
  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: null? -->
  <polygon points="280,100 360,134 280,168 200,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#888">空节点</text>

  <!-- yes branch: return -1 -->
  <path d="M 360 134 L 420 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="128" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="420" y="118" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return -1</text>

  <!-- no branch -->
  <path d="M 280 168 L 280 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="182" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- recurse left & right -->
  <rect x="160" y="190" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="11" fill="#333">l = dfs(node.left)</text>
  <text x="280" y="223" text-anchor="middle" font-size="11" fill="#333">r = dfs(node.right)</text>
  <path d="M 280 230 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute layer -->
  <rect x="180" y="252" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="273" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">layer = max(l, r) + 1</text>
  <path d="M 280 284 L 280 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ensure bucket -->
  <rect x="160" y="306" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="327" text-anchor="middle" font-size="10.5" fill="#446688">若 layer == res.size(): res.push([])</text>
  <path d="M 280 338 L 280 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- append -->
  <rect x="180" y="360" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">res[layer].append(val)</text>
  <path d="M 280 392 L 280 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="220" y="414" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="11" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">return layer</text>

  <!-- side note -->
  <rect x="420" y="190" width="120" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="210" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">关键性质</text>
  <text x="430" y="228" font-size="9.5" fill="#555">• 后序：先递归</text>
  <text x="430" y="242" font-size="9.5" fill="#555">  左右再处理根</text>
  <text x="430" y="256" font-size="9.5" fill="#555">• layer 即下标</text>
  <text x="430" y="270" font-size="9.5" fill="#555">• res 按需扩容</text>
</svg>
