<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，合法且严格更小才换代</text>
  <text x="260" y="33" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">bestCap 初值取大于值域上界（101 / INT_MAX）；bestIdx = −1 兜底无解</text>

  <!-- step 1: init -->
  <rect x="180" y="46" width="160" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">① bestCap = 101，bestIdx = −1</text>

  <path d="M 260 72 L 260 84" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- decision 1: i < n ? -->
  <polygon points="260,88 360,124 260,160 160,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- no branch (scan done) -> return -->
  <path d="M 160 124 L 138 124" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="150" y="116" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="150" y="140" text-anchor="middle" font-size="7" fill="#888" filter="url(#rough2)">扫完</text>

  <rect x="14" y="108" width="124" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="122" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">返回 bestIdx</text>
  <text x="76" y="134" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">（无解时恰为 −1）</text>

  <!-- yes branch -> decision 2 -->
  <path d="M 260 160 L 260 172" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="272" y="170" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- decision 2: valid and smaller? -->
  <polygon points="260,176 372,212 260,248 148,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">capacity[i] ≥ itemSize</text>
  <text x="260" y="220" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">且 &lt; bestCap ?</text>

  <!-- yes: update champion -->
  <path d="M 372 212 L 392 212" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="382" y="204" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="396" y="196" width="100" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="446" y="210" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">换代：bestCap = c</text>
  <text x="446" y="222" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">bestIdx = i</text>

  <!-- no: skip -->
  <path d="M 148 212 L 126 212" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="137" y="204" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="20" y="196" width="106" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="210" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">跳过：不合法</text>
  <text x="73" y="222" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">或不够小</text>

  <!-- converge to i++ -->
  <path d="M 446 228 L 446 258 L 354 258" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <path d="M 73 228 L 73 258 L 166 258" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <rect x="170" y="246" width="180" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">② i ← i + 1，继续扫描</text>

  <!-- loop back to decision 1 -->
  <path d="M 342 272 L 342 292 L 502 292 L 502 124 L 366 124" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="288" text-anchor="middle" font-size="7.5" fill="#b85450" filter="url(#rough2)">回到 ① 判定</text>

  <!-- left note: initial values -->
  <rect x="14" y="150" width="136" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="164" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">⚠️ 初值 101 &gt; 值域上界 100</text>
  <text x="82" y="175" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">⇒ 首个合法者必上位；</text>
  <text x="82" y="186" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">bestIdx = −1 即无解答案</text>

  <!-- bottom left note: early stop -->
  <rect x="16" y="300" width="236" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="134" y="314" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">💡 早停：bestCap == itemSize 即达</text>
  <text x="134" y="325" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">合法容量下界（合法 ⟺ ≥ itemSize）</text>
  <text x="134" y="336" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">后面不可能更小 ⇒ 可立即返回</text>
  <text x="134" y="347" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">（n ≤ 100 无所谓，流式场景白赚）</text>

  <!-- bottom right note: key points -->
  <rect x="272" y="300" width="232" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="388" y="314" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">复杂度：时间 O(n) 一趟 / 空间 O(1)</text>
  <text x="388" y="325" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">条件顺序：先判合法再判更小（短路）</text>
  <text x="388" y="336" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">严格 &lt; 保平局最左——≤ 会错答 3</text>
  <text x="388" y="347" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">两变量打擂台，无解零特判</text>
</svg>
