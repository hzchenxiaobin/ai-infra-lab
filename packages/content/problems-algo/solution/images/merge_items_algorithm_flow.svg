<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希聚合 → 取键排序 → 构建结果</text>

  <!-- Start -->
  <rect x="200" y="40" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333">开始 map = {}</text>
  <path d="M 280 70 L 280 86" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: iterate items1 -->
  <rect x="150" y="88" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 items1</text>
  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#555">对每个 [v, w]：map[v] += w</text>
  <path d="M 280 128 L 280 144" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: iterate items2 -->
  <rect x="150" y="146" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 items2</text>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#555">对每个 [v, w]：map[v] += w</text>
  <path d="M 280 186 L 280 202" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: extract entries -->
  <rect x="150" y="204" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取出 map 全部 (v, w) 对</text>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#555">keys = list(map.keys())</text>
  <path d="M 280 244 L 280 260" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: sort by value -->
  <polygon points="280,262 376,296 280,330 184,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#333">按 v 升序排序</text>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#555">sort(keys)</text>
  <path d="M 280 330 L 280 346" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: build result -->
  <rect x="150" y="348" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">构建 [[v, map[v]], ...]</text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#555">按排序后的 v 依次取 map[v]</text>
  <path d="M 280 388 L 280 404" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="200" y="406" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="12" fill="#333">返回 ret</text>

  <!-- side note -->
  <text x="430" y="108" font-size="10.5" fill="#888" font-style="italic">两轮累加</text>
  <text x="430" y="124" font-size="10.5" fill="#888" font-style="italic">各 O(n)/O(m)</text>
  <text x="430" y="224" font-size="10.5" fill="#888" font-style="italic">键数 ≤ n+m</text>
  <text x="430" y="298" font-size="10.5" fill="#888" font-style="italic">O(k log k)</text>
</svg>
