<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">两类跳跃 = 两个「下一个」元素</text>
  <text x="290" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">以 i = 0（nums[0] = 3）为例</text>

  <!-- Type 1 arc: 0 -> 2 (above) -->
  <path d="M82,120 C 82,78 226,78 226,120" fill="none" stroke="#446688"
        stroke-width="2.5" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="154" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">类型一 · 下一个 ≥ 3 → j = 2</text>

  <!-- Type 2 arc: 0 -> 1 (below) -->
  <path d="M82,178 C 82,228 154,228 154,178" fill="none" stroke="#4a7a3a"
        stroke-width="2.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="118" y="252" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">类型二 · 下一个 &lt; 3 → j = 1</text>

  <!-- Array cells: nums = [3,2,4,4,1], x = 50 + i*72 -->
  <!-- cell 0 -->
  <rect x="50" y="120" width="64" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="82" y="163" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <!-- cell 1 -->
  <rect x="122" y="120" width="64" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="154" y="163" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <!-- cell 2 -->
  <rect x="194" y="120" width="64" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="226" y="163" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <!-- cell 3 -->
  <rect x="266" y="120" width="64" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="298" y="163" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <!-- cell 4 -->
  <rect x="338" y="120" width="64" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=4</text>
  <text x="370" y="163" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <!-- hint: middle of 0->2 is < 3 -->
  <text x="154" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">中间 2 &lt; 3 ✓</text>

  <!-- Explanation box A (blue): type 1 stack -->
  <rect x="30" y="285" width="255" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="308" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">单调栈 #1：弹出 nums[k] &lt; nums[i]</text>
  <text x="157" y="328" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">→ 栈顶 = 下一个 ≥ （类型一）</text>

  <!-- Explanation box B (green): type 2 stack -->
  <rect x="295" y="285" width="255" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="422" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">单调栈 #2：弹出 nums[k] ≥ nums[i]</text>
  <text x="422" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 栈顶 = 下一个 &lt; （类型二）</text>

  <!-- Note box (orange) -->
  <rect x="30" y="365" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="385" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">每个 i 至多 2 条出边 → 图共 ≤ 2n 条边</text>
  <text x="290" y="403" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">单调栈 O(n) 建图 + 下标顺序 DP = 全程 O(n)</text>
</svg>
