<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：定长滑动窗口 + 整除判定</text>

  <!-- Step 1: init -->
  <rect x="130" y="44" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① s = str(num)，n = len(s)，ans = 0</text>

  <!-- arrow -->
  <line x1="270" y1="82" x2="270" y2="100" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: for loop -->
  <rect x="120" y="104" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for i = 0 .. n−k：</text>

  <!-- arrow into loop body -->
  <line x1="270" y1="138" x2="270" y2="154" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: take window of k -->
  <rect x="90" y="158" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">取窗口 val = int(s[i : i+k])</text>

  <!-- arrow -->
  <line x1="270" y1="192" x2="270" y2="206" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond 1: val == 0? -->
  <polygon points="270,210 380,250 270,290 160,250" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">val == 0 ?</text>
  <text x="270" y="262" text-anchor="middle" font-size="10" fill="#888">（0 不整除任何数）</text>

  <!-- Yes branch (right) -> skip -->
  <line x1="380" y1="250" x2="430" y2="250" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="244" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="434" y="234" width="90" height="32" fill="#f4f7fb" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="479" y="254" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">跳过</text>

  <!-- No branch (left) -->
  <line x1="160" y1="250" x2="120" y2="250" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="244" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step: check divisibility -->
  <rect x="14" y="232" width="106" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="67" y="248" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">num % val</text>
  <text x="67" y="262" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">== 0 ?</text>

  <!-- arrow down from divisibility check -->
  <line x1="67" y1="268" x2="67" y2="288" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: update ans -->
  <rect x="14" y="292" width="106" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="67" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <!-- converge -->
  <line x1="67" y1="326" x2="67" y2="346" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="479" y1="266" x2="479" y2="346" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="67" y1="346" x2="479" y2="346" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="270" y1="346" x2="270" y2="362" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow (right side) -->
  <path d="M 470 176 Q 520 176 520 121 L 420 121" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="150" font-size="9.5" fill="#888">下一 i</text>

  <!-- Step 6: return -->
  <rect x="110" y="366" width="320" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="390" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 遍历结束：返回 ans</text>

  <!-- footer -->
  <rect x="40" y="424" width="465" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="272" y="443" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：先判 val ≠ 0 再取模，避免除零；前缀 0 合法，按原样转整数</text>
  <text x="272" y="457" text-anchor="middle" font-size="10" fill="#888">可用滚动值把取窗转整数从 O(k) 降到 O(1)，见第 5 节扩展</text>
</svg>
