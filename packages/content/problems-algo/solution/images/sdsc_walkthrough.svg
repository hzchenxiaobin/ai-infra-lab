<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="940" height="560" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "bcabc" → "abc"</text>
  <path d="M 320 44 Q 470 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始计数提示 -->
  <g filter="url(#sk)">
    <rect x="60" y="60" width="820" height="30" rx="6" fill="#f7faff" stroke="#446688"/>
  </g>
  <text x="470" y="80" text-anchor="middle" font-size="12" fill="#446688">初始计数 cnt：b=2, c=2, a=1　│　栈=[]，in_stack 全为 false</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="60" y="100" width="820" height="32" rx="4" fill="#446688"/>
  </g>
  <text x="100" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">i</text>
  <text x="170" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">字符 c</text>
  <text x="290" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">cnt[c] 处理后</text>
  <text x="470" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">栈（底→顶）</text>
  <text x="720" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">动作</text>

  <!-- 行 i=0 -->
  <g filter="url(#sk)">
    <rect x="60" y="132" width="820" height="34" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="100" y="154" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="170" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">b</text>
  <text x="290" y="154" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="470" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">[b]</text>
  <text x="720" y="154" text-anchor="middle" font-size="11" fill="#666">栈空，b 入栈</text>

  <!-- 行 i=1 -->
  <g filter="url(#sk)">
    <rect x="60" y="166" width="820" height="34" fill="#f7faff" stroke="#bbb"/>
  </g>
  <text x="100" y="188" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="170" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">c</text>
  <text x="290" y="188" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="470" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">[b, c]</text>
  <text x="720" y="188" text-anchor="middle" font-size="11" fill="#666">b&lt;c 不弹；c 入栈</text>

  <!-- 行 i=2 关键行 -->
  <g filter="url(#sk)">
    <rect x="60" y="200" width="820" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="100" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">2</text>
  <text x="170" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">a</text>
  <text x="290" y="225" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="470" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">[a]</text>
  <text x="720" y="220" text-anchor="middle" font-size="11" fill="#b85450">c&gt;a 且 cnt[c]=1&gt;0 ⟹ 弹 c</text>
  <text x="720" y="234" text-anchor="middle" font-size="11" fill="#b85450">b&gt;a 且 cnt[b]=1&gt;0 ⟹ 弹 b；a 入栈</text>

  <!-- 行 i=3 -->
  <g filter="url(#sk)">
    <rect x="60" y="240" width="820" height="34" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="100" y="262" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="170" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">b</text>
  <text x="290" y="262" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="470" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">[a, b]</text>
  <text x="720" y="262" text-anchor="middle" font-size="11" fill="#666">b 不在栈中；a&lt;b 不弹；b 入栈</text>

  <!-- 行 i=4 -->
  <g filter="url(#sk)">
    <rect x="60" y="274" width="820" height="34" fill="#f7faff" stroke="#bbb"/>
  </g>
  <text x="100" y="296" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="170" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">c</text>
  <text x="290" y="296" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="470" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">[a, b, c]</text>
  <text x="720" y="296" text-anchor="middle" font-size="11" fill="#666">c 不在栈中；b&lt;c 不弹；c 入栈</text>

  <!-- 关键说明框 -->
  <g filter="url(#sk)">
    <rect x="60" y="326" width="820" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="80" y="348" font-size="13" font-weight="bold" fill="#7a5415">★ 关键一步 i=2：</text>
  <text x="80" y="368" font-size="12" fill="#7a5415">遇到 a 时栈顶 c、b 都比 a 大，但 cnt[c]=1、cnt[b]=1 都大于 0，说明后面还会出现，可安全弹出。</text>
  <text x="80" y="382" font-size="12" fill="#7a5415">于是 c、b 依次弹掉，a 落到栈底——前缀尽量小正是字典序最小的来源。</text>

  <!-- 结果 -->
  <text x="80" y="420" font-size="13" font-weight="bold" fill="#555">遍历结束，栈底→栈顶拼接：</text>
  <g filter="url(#sk)">
    <rect x="300" y="404" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="346" y="404" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="392" y="404" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="322" y="425" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">a</text>
  <text x="368" y="425" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">b</text>
  <text x="414" y="425" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">c</text>
  <path d="M 444 420 L 482 420" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="488" y="404" width="130" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="553" y="425" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">"abc" ✓</text>

  <text x="470" y="470" text-anchor="middle" font-size="12" fill="#888">注意 i=2 连弹两个：只要栈顶更大且后面还有，就一路弹到不能弹为止。</text>
  <text x="470" y="490" text-anchor="middle" font-size="12" fill="#888">每个字符至多入栈、出栈各一次，总耗时 O(n)；栈与计数表只占 O(∣Σ∣)=O(1)。</text>
</svg>
