<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双调数组切分：峰值共享 → 总和守恒与峰值相消</text>

  <!-- mountain silhouette -->
  <path d="M 146 122 L 226 78 L 306 52 L 386 108" fill="none" stroke="#446688"
        stroke-width="2.2" stroke-linejoin="round" filter="url(#rough)"/>
  <text x="160" y="72" font-size="11" fill="#446688">严格递增 ↗</text>
  <text x="352" y="82" font-size="11" fill="#4a7a3a">↘ 严格递减</text>

  <!-- peak marker -->
  <circle cx="306" cy="52" r="4" fill="#d6a040" stroke="#a87020" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="40" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">峰值 nums[2] = 5</text>

  <!-- cells: 2 4 5 2 -->
  <rect x="110" y="130" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="130" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="130" width="72" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="130" width="72" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="146" y="159" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="226" y="159" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="306" y="159" text-anchor="middle" font-size="15" fill="#a87020" font-weight="bold">5</text>
  <text x="386" y="159" text-anchor="middle" font-size="14" fill="#333">2</text>

  <!-- zone labels -->
  <text x="186" y="196" text-anchor="middle" font-size="11" fill="#446688">S_L = 2+4 = 6</text>
  <text x="306" y="196" text-anchor="middle" font-size="11" fill="#a87020">峰值（共享）</text>
  <text x="386" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a">S_R = 2</text>

  <!-- asc bracket (cells 0..2) -->
  <path d="M 110 228 L 110 236 L 342 236 L 342 228" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="258" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">递增部分 asc = 2+4+5 = 11</text>

  <!-- shared note between brackets -->
  <text x="306" y="284" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">峰值 5 被数了两次！</text>
  <path d="M 306 272 L 306 242" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 306 290 L 306 316" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- desc bracket (cells 2..3) -->
  <path d="M 270 306 L 270 314 L 422 314 L 422 306" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="366" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">递减部分 desc = 5+2 = 7</text>

  <!-- formula boxes -->
  <rect x="55" y="356" width="450" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">
    total = asc + desc − 峰值 = 11 + 7 − 5 = 13 ✓（即 desc = total − asc + nums[p]）
  </text>
  <rect x="55" y="406" width="450" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">
    asc − desc = S_L − S_R = 6 − 2 &gt; 0 → 返回 0（峰值在差值中相消）
  </text>
</svg>
