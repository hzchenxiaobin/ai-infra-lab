<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [10, 20, 30]，非零状态一览</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">记号 (g1, g2) = 方案数；红色 = 对角线 g1 = g2（计入答案）</text>

  <!-- 初始 -->
  <rect x="8" y="56" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="33" y="71" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">初始</text>
  <rect x="64" y="56" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="71" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,0)=1</text>

  <!-- x=10 -->
  <rect x="8" y="88" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="33" y="103" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x=10</text>
  <rect x="64" y="88" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="103" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,0)=1</text>
  <rect x="128" y="88" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="103" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(10,0)=1</text>
  <rect x="192" y="88" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="103" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,10)=1</text>
  <text x="270" y="103" font-size="9.5" fill="#888" filter="url(#rough2)">← 3 个非零状态</text>

  <!-- x=20 -->
  <rect x="8" y="120" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="33" y="135" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x=20</text>
  <rect x="64" y="120" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="135" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,0)=1</text>
  <rect x="128" y="120" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="135" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(10,0)=2</text>
  <rect x="192" y="120" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="135" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(20,0)=1</text>
  <rect x="256" y="120" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="135" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,10)=2</text>
  <rect x="320" y="120" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="135" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,20)=1</text>
  <rect x="384" y="120" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="135" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(10,20)=1</text>
  <rect x="448" y="120" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="478" y="135" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(20,10)=1</text>

  <!-- x=30 第一行 -->
  <rect x="8" y="156" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="33" y="171" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x=30</text>
  <rect x="64" y="156" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="171" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,0)=1</text>
  <rect x="128" y="156" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="171" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(10,0)=5</text>
  <rect x="192" y="156" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="171" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(20,0)=1</text>
  <rect x="256" y="156" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="171" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(30,0)=1</text>
  <rect x="320" y="156" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="171" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,10)=5</text>
  <rect x="384" y="156" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="171" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,20)=1</text>
  <rect x="448" y="156" width="60" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="478" y="171" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,30)=1</text>

  <!-- x=30 第二行（含对角线高亮） -->
  <rect x="64" y="184" width="64" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="96" y="200" text-anchor="middle" font-size="9.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">(10,10)=2★</text>
  <rect x="134" y="184" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="200" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(10,20)=2</text>
  <rect x="198" y="184" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="200" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(10,30)=2</text>
  <rect x="262" y="184" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="200" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(20,10)=2</text>
  <rect x="326" y="184" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="200" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(20,30)=1</text>
  <rect x="390" y="184" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="200" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(30,10)=2</text>
  <rect x="454" y="184" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="484" y="200" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(30,20)=1</text>

  <!-- 答案 -->
  <rect x="20" y="226" width="480" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = dp[10][10] = 2 ✓</text>
  <text x="260" y="263" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">正是示例 2 的两组有序对：({10,20}, {30}) 与 ({30}, {10,20})，gcd 均为 10</text>

  <!-- 看点 -->
  <rect x="20" y="286" width="480" height="112" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="306" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">💡 看点</text>
  <text x="34" y="326" font-size="10.5" fill="#555" filter="url(#rough2)">· 状态数 1 → 3 → 7 → 14，上限 (V+1)² = 961 —— DP 表高度稀疏，跳零状态稳赚</text>
  <text x="34" y="344" font-size="10.5" fill="#555" filter="url(#rough2)">· x=30 到来时 (10,20) 与 (20,10) 各裂变出 (10,10)：gcd(10,30) = gcd(20,30) = 10</text>
  <text x="34" y="362" font-size="10.5" fill="#555" filter="url(#rough2)">· (10,0)、(0,10) 这类单侧为 0 的状态 = 有一边还是空序列，收尾时被 g ≥ 1 一刀切掉</text>
  <text x="34" y="380" font-size="10.5" fill="#555" filter="url(#rough2)">· 另两组官方示例：[1,2,3,4] → 10，[1,1,1,1] → 50，同一份代码全部命中</text>
</svg>
