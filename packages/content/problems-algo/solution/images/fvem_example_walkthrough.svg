<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">7 位用户邮箱校验演算</text>

  <!-- ===== Header row ===== -->
  <rect x="20" y="40" width="520" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="56" text-anchor="middle" font-size="10" fill="white" font-weight="bold">user_id</text>
  <text x="135" y="56" text-anchor="middle" font-size="10" fill="white" font-weight="bold">name</text>
  <text x="290" y="56" text-anchor="middle" font-size="10" fill="white" font-weight="bold">mail</text>
  <text x="430" y="56" text-anchor="middle" font-size="10" fill="white" font-weight="bold">结果</text>
  <text x="500" y="56" text-anchor="middle" font-size="10" fill="white" font-weight="bold">原因</text>

  <!-- ===== Row 1: Winston (valid) ===== -->
  <rect x="20" y="66" width="520" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="90" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="135" y="90" text-anchor="middle" font-size="11" fill="#333">Winston</text>
  <text x="290" y="90" text-anchor="middle" font-size="11" fill="#333">winston@leetcode.com</text>
  <text x="430" y="90" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="500" y="90" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- ===== Row 2: Jonathan (invalid) ===== -->
  <rect x="20" y="106" width="520" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="130" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="135" y="130" text-anchor="middle" font-size="11" fill="#333">Jonathan</text>
  <text x="290" y="130" text-anchor="middle" font-size="11" fill="#333">jonathanisgreat</text>
  <text x="430" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="500" y="130" text-anchor="middle" font-size="10" fill="#b85450">无域名</text>

  <!-- ===== Row 3: Annabelle (valid) ===== -->
  <rect x="20" y="146" width="520" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="170" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="135" y="170" text-anchor="middle" font-size="11" fill="#333">Annabelle</text>
  <text x="290" y="170" text-anchor="middle" font-size="11" fill="#333">bella-@leetcode.com</text>
  <text x="430" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="500" y="170" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- ===== Row 4: Sally (valid) ===== -->
  <rect x="20" y="186" width="520" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="210" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="135" y="210" text-anchor="middle" font-size="11" fill="#333">Sally</text>
  <text x="290" y="210" text-anchor="middle" font-size="11" fill="#333">sally.come@leetcode.com</text>
  <text x="430" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="500" y="210" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- ===== Row 5: Marwan (invalid) ===== -->
  <rect x="20" y="226" width="520" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="250" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="135" y="250" text-anchor="middle" font-size="11" fill="#333">Marwan</text>
  <text x="290" y="250" text-anchor="middle" font-size="11" fill="#333">quarz#2020@leetcode.com</text>
  <text x="430" y="250" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="500" y="250" text-anchor="middle" font-size="10" fill="#b85450">含 #</text>

  <!-- ===== Row 6: David (invalid) ===== -->
  <rect x="20" y="266" width="520" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="290" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="135" y="290" text-anchor="middle" font-size="11" fill="#333">David</text>
  <text x="290" y="290" text-anchor="middle" font-size="11" fill="#333">david69@gmail.com</text>
  <text x="430" y="290" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="500" y="290" text-anchor="middle" font-size="10" fill="#b85450">域名错误</text>

  <!-- ===== Row 7: Shapiro (invalid) ===== -->
  <rect x="20" y="306" width="520" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="330" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="135" y="330" text-anchor="middle" font-size="11" fill="#333">Shapiro</text>
  <text x="290" y="330" text-anchor="middle" font-size="11" fill="#333">.shapo@leetcode.com</text>
  <text x="430" y="330" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="500" y="330" text-anchor="middle" font-size="10" fill="#b85450">前缀以 . 开头</text>

  <!-- ===== Summary ===== -->
  <rect x="60" y="352" width="440" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3 位通过 → user_id 1, 3, 4（Winston, Annabelle, Sally）</text>
</svg>
