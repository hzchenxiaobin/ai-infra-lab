<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：color = #09f166 → #11ee66</text>

  <!-- 列背景：表头 + 结果列 -->
  <rect x="55" y="46" width="450" height="32" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="375" y="46" width="70" height="140" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- 外框 -->
  <rect x="55" y="46" width="450" height="140" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 横线 -->
  <line x1="55" y1="78" x2="505" y2="78" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="55" y1="112" x2="505" y2="112" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="55" y1="146" x2="505" y2="146" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="55" y1="186" x2="505" y2="186" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 竖线 -->
  <line x1="105" y1="46" x2="105" y2="186" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="165" y1="46" x2="165" y2="186" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="225" y1="46" x2="225" y2="186" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="305" y1="46" x2="305" y2="186" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="375" y1="46" x2="375" y2="186" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="445" y1="46" x2="445" y2="186" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 表头文字 (y=67) -->
  <text x="80"  y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">通道</text>
  <text x="135" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">hex</text>
  <text x="195" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v</text>
  <text x="265" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v / 17</text>
  <text x="340" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">round(d)</text>
  <text x="410" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">简写</text>
  <text x="475" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">|Δ|</text>

  <!-- 行 1 R (y=98) -->
  <text x="80"  y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">R</text>
  <text x="135" y="98" text-anchor="middle" font-size="12" fill="#333">09</text>
  <text x="195" y="98" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="265" y="98" text-anchor="middle" font-size="12" fill="#333">0.53</text>
  <text x="340" y="98" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="410" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">11</text>
  <text x="475" y="98" text-anchor="middle" font-size="12" fill="#333">8</text>

  <!-- 行 2 G (y=132) -->
  <text x="80"  y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">G</text>
  <text x="135" y="132" text-anchor="middle" font-size="12" fill="#333">f1</text>
  <text x="195" y="132" text-anchor="middle" font-size="12" fill="#333">241</text>
  <text x="265" y="132" text-anchor="middle" font-size="12" fill="#333">14.18</text>
  <text x="340" y="132" text-anchor="middle" font-size="12" fill="#333">14</text>
  <text x="410" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ee</text>
  <text x="475" y="132" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- 行 3 B (y=166) -->
  <text x="80"  y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B</text>
  <text x="135" y="166" text-anchor="middle" font-size="12" fill="#333">66</text>
  <text x="195" y="166" text-anchor="middle" font-size="12" fill="#333">102</text>
  <text x="265" y="166" text-anchor="middle" font-size="12" fill="#333">6.00</text>
  <text x="340" y="166" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="410" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">66</text>
  <text x="475" y="166" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- 底部结论 -->
  <rect x="55" y="204" width="450" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">→ 拼接 # 11  ee  66 = #11ee66</text>
  <text x="280" y="250" text-anchor="middle" font-size="10.5" fill="#888">三通道各自取最近 ⇒ 平方差之和最小 ⇒ 全局最相似</text>
</svg>
