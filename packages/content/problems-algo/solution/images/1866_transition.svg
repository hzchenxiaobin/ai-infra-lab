<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态转移：dp[n][k] = dp[n−1][k−1] + (n−1)·dp[n−1][k]</text>

  <!-- Recurrence formula box -->
  <rect x="50" y="44" width="420" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">dp[n][k] = dp[n−1][k−1] + (n−1)·dp[n−1][k]</text>

  <!-- arrows to two branches -->
  <path d="M 150 96 L 150 124" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 370 96 L 370 124" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Left branch: Case A -->
  <rect x="30" y="126" width="240" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">情况 A：高度 1 放最左</text>
  <text x="150" y="170" text-anchor="middle" font-size="11" fill="#555">→ 可见，贡献 1 根</text>
  <text x="150" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp[n−1][k−1]</text>
  <text x="150" y="208" text-anchor="middle" font-size="10" fill="#888">剩余需 k−1 根可见</text>

  <!-- Right branch: Case B -->
  <rect x="290" y="126" width="200" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="390" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情况 B：放其余位置</text>
  <text x="390" y="170" text-anchor="middle" font-size="11" fill="#555">→ 不可见，贡献 0 根</text>
  <text x="390" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">(n−1)·dp[n−1][k]</text>
  <text x="390" y="208" text-anchor="middle" font-size="10" fill="#888">n−1 个位置 × 剩余需 k 根</text>

  <!-- Base case -->
  <rect x="30" y="232" width="220" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="140" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">边界：dp[0][0] = 1</text>
  <text x="140" y="276" text-anchor="middle" font-size="11" fill="#555">空排列算 1 种（基石）</text>

  <!-- Answer -->
  <rect x="270" y="232" width="220" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案：dp[n][k]</text>
  <text x="380" y="276" text-anchor="middle" font-size="11" fill="#555">每步 mod 10⁹+7</text>

  <!-- complexity footnote -->
  <rect x="30" y="306" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#555">O(n·k)，n, k ≤ 1000 约 10⁶ 次；滚动数组空间 O(k)</text>
</svg>
