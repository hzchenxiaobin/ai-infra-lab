<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="760" height="480" fill="#fdfcf7"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">魔法字典：Trie + 1 次替换预算的模糊匹配</text>
  <path d="M 210 40 Q 380 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="380" y="58" text-anchor="middle" font-size="11" fill="#888">dictionary = ["hello","hallo","leetcode"] → 建一棵前缀树，search 允许恰好 1 处替换</text>

  <!-- ===== Trie tree (h-subtree详细, leetcode分支折叠) ===== -->
  <g filter="url(#sk)"><ellipse cx="70" cy="230" rx="22" ry="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="70" y="234" text-anchor="middle" font-size="10" fill="#4a8edb" font-weight="bold">root</text>

  <!-- root -> h -->
  <path d="M 90 226 L 138 200" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="110" y="208" font-size="10" fill="#888">h</text>
  <g filter="url(#sk)"><circle cx="152" cy="196" r="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="152" y="200" text-anchor="middle" font-size="10" fill="#4a8edb" font-weight="bold">h</text>

  <!-- h -> e (exact, green) -->
  <path d="M 166 190 L 226 150" stroke="#2e8b57" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="186" y="166" font-size="10" fill="#2e8b57" font-weight="bold">e</text>
  <g filter="url(#sk)"><circle cx="240" cy="146" r="14" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="240" y="150" text-anchor="middle" font-size="10" fill="#2e8b57" font-weight="bold">e</text>

  <!-- h -> a (substitute, orange dashed) -->
  <path d="M 166 202 L 226 250" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arO)" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="184" y="240" font-size="10" fill="#d6a040" font-weight="bold">a</text>
  <text x="206" y="266" font-size="9" fill="#d6a040">替换!</text>
  <g filter="url(#sk)"><circle cx="240" cy="266" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="240" y="270" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">a</text>

  <!-- e -> l -> l -> o★ -->
  <path d="M 254 146 L 314 146" stroke="#2e8b57" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="284" y="140" font-size="9" fill="#2e8b57">l</text>
  <g filter="url(#sk)"><circle cx="328" cy="146" r="13" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="328" y="150" text-anchor="middle" font-size="10" fill="#2e8b57">l</text>
  <path d="M 341 146 L 401 146" stroke="#2e8b57" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="371" y="140" font-size="9" fill="#2e8b57">l</text>
  <g filter="url(#sk)"><circle cx="415" cy="146" r="13" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="415" y="150" text-anchor="middle" font-size="10" fill="#2e8b57">l</text>
  <path d="M 428 146 L 488 146" stroke="#2e8b57" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="458" y="140" font-size="9" fill="#2e8b57">o</text>
  <g filter="url(#sk)"><circle cx="504" cy="146" r="16" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/></g>
  <text x="504" y="150" text-anchor="middle" font-size="9" fill="#2e8b57" font-weight="bold">o★</text>

  <!-- a -> l -> l -> o★ -->
  <path d="M 254 266 L 314 266" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="284" y="260" font-size="9" fill="#888">l</text>
  <g filter="url(#sk)"><circle cx="328" cy="266" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="328" y="270" text-anchor="middle" font-size="10" fill="#888">l</text>
  <path d="M 341 266 L 401 266" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="371" y="260" font-size="9" fill="#888">l</text>
  <g filter="url(#sk)"><circle cx="415" cy="266" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="415" y="270" text-anchor="middle" font-size="10" fill="#888">l</text>
  <path d="M 428 266 L 488 266" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="458" y="260" font-size="9" fill="#888">o</text>
  <g filter="url(#sk)"><circle cx="504" cy="266" r="16" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/></g>
  <text x="504" y="270" text-anchor="middle" font-size="9" fill="#2e8b57" font-weight="bold">o★</text>

  <!-- leetcode 折叠分支 -->
  <path d="M 90 238 L 138 360" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="108" y="352" font-size="10" fill="#888">l</text>
  <g filter="url(#sk)"><circle cx="152" cy="370" r="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="152" y="374" text-anchor="middle" font-size="10" fill="#4a8edb">l</text>
  <path d="M 166 370 L 226 370" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="196" y="364" font-size="9" fill="#888">e</text>
  <g filter="url(#sk)"><circle cx="240" cy="370" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="240" y="374" text-anchor="middle" font-size="10" fill="#4a8edb">e</text>
  <text x="260" y="374" font-size="10" fill="#888">→ e → t → c → o → d → e★</text>
  <text x="260" y="388" font-size="9" fill="#aaa">("leetcode" 分支，8 层)</text>

  <text x="380" y="416" text-anchor="middle" font-size="9" fill="#2e8b57">★ = 单词结尾（is_end = true）   绿色 = 精确匹配(diff 不变)   橙色虚线 = 消耗 1 次替换预算(diff→1)</text>

  <!-- ===== 右侧：search("hello") 决策树 ===== -->
  <text x="640" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">search("hello")</text>
  <text x="640" y="116" text-anchor="middle" font-size="9" fill="#888">在 Trie 上 DFS，预算 diff=1</text>

  <g filter="url(#sk)">
    <rect x="556" y="132" width="168" height="30" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
  </g>
  <text x="640" y="152" text-anchor="middle" font-size="10" fill="#2e6e2e">pos0 'h' 精确 → diff=0</text>

  <path d="M 600 164 L 600 184" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 680 164 L 680 184" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="556" y="188" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
  </g>
  <text x="598" y="206" text-anchor="middle" font-size="9" fill="#2e6e2e">pos1 'e' 精确</text>
  <text x="598" y="220" text-anchor="middle" font-size="9" fill="#2e6e2e">diff=0</text>

  <g filter="url(#sk)">
    <rect x="660" y="188" width="84" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="702" y="206" text-anchor="middle" font-size="9" fill="#9a6a20">pos1 替换</text>
  <text x="702" y="220" text-anchor="middle" font-size="9" fill="#9a6a20">'e'→'a' diff=1</text>

  <path d="M 598 232 L 598 252" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 702 232 L 702 252" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="556" y="256" width="84" height="40" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="598" y="272" text-anchor="middle" font-size="9" fill="#2e6e2e">llo 精确</text>
  <text x="598" y="286" text-anchor="middle" font-size="9" fill="#2e6e2e">→ "hello"★</text>

  <g filter="url(#sk)">
    <rect x="660" y="256" width="84" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="702" y="272" text-anchor="middle" font-size="9" fill="#9a6a20">llo 精确</text>
  <text x="702" y="286" text-anchor="middle" font-size="9" fill="#9a6a20">→ "hallo"★</text>

  <path d="M 598 296 L 598 316" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 702 296 L 702 316" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="556" y="320" width="84" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="598" y="340" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">diff=0 ✗</text>

  <g filter="url(#sk)">
    <rect x="660" y="320" width="84" height="30" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.2"/>
  </g>
  <text x="702" y="340" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">diff=1 ✓</text>

  <g filter="url(#sk)">
    <rect x="556" y="362" width="168" height="40" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
  </g>
  <text x="640" y="380" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">分支②命中 "hallo"</text>
  <text x="640" y="394" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ return true</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="436" width="680" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="380" y="453" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 关键：恰好 1 处替换 = DFS 带「1 次预算」—— 某一位换成 Trie 上其他子节点(预算-1)，其余位必须精确匹配</text>
  <text x="380" y="466" text-anchor="middle" font-size="10" fill="#2b6e9e">走到词尾时 diff 必须恰好为 1（避免「0 处替换 = 原词本身」误判）</text>
</svg>
