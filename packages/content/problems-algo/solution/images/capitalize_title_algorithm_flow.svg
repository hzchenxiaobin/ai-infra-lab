<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：切分 → 逐词改写 → 拼接</text>

  <!-- Start node -->
  <ellipse cx="280" cy="62" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">开始: 输入 title</text>

  <!-- Arrow down -->
  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: split -->
  <rect x="170" y="104" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">words = title.split(' ')</text>

  <!-- Arrow down -->
  <path d="M 280 138 L 280 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop box -->
  <rect x="160" y="160" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for each word in words</text>

  <!-- Arrow down -->
  <path d="M 280 192 L 280 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: len(word) <= 2 ? -->
  <polygon points="280,214 410,262 280,310 150,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#333">len(word)</text>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#333">≤ 2 ?</text>

  <!-- Yes branch (left): all lowercase -->
  <path d="M 150 262 L 90 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#d6a040">是</text>
  <rect x="20" y="240" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="55" y="258" text-anchor="middle" font-size="10" fill="#333">全小写</text>
  <text x="55" y="274" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">.lower()</text>

  <!-- No branch (right): capitalize first + lower rest -->
  <path d="M 410 262 L 470 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="254" text-anchor="middle" font-size="11" fill="#446688">否 (≥3)</text>
  <rect x="470" y="234" width="80" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="510" y="252" text-anchor="middle" font-size="10" fill="#333">首字母大写</text>
  <text x="510" y="266" text-anchor="middle" font-size="10" fill="#333">其余小写</text>
  <text x="510" y="282" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">cap[0]+low[1:]</text>

  <!-- both branches converge -->
  <path d="M 55 284 L 55 330 L 280 330" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 290 L 510 330 L 280 330" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- collect transformed word -->
  <rect x="180" y="340" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">收集改写后的单词</text>

  <!-- Loop back to for loop -->
  <path d="M 380 356 L 540 356 L 540 176 L 400 176" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="266" text-anchor="middle" font-size="9" fill="#888">下一词</text>

  <!-- After loop: join -->
  <path d="M 280 372 L 280 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="394" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ' '.join(words)</text>

  <!-- End node -->
  <path d="M 280 428 L 280 444" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="280" cy="462" rx="80" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="466" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回改写后的 title</text>

  <!-- Summary note -->
  <text x="280" y="30" text-anchor="middle" font-size="10" fill="#888">每词独立改写，规则只看长度</text>
</svg>
