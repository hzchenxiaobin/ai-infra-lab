<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：asteroids = [5, 10, -5]</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">蓝色=向右(+)，粉色=向左(−)，叉号=爆炸</text>

  <!-- Header -->
  <text x="30" y="68" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="80" y="68" font-size="12" fill="#444" font-weight="bold">当前 a</text>
  <text x="160" y="68" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="320" y="68" font-size="12" fill="#444" font-weight="bold">栈（底→顶）</text>
  <text x="510" y="68" font-size="12" fill="#444" font-weight="bold">说明</text>
  <line x1="20" y1="76" x2="580" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 0: initial -->
  <text x="30" y="100" font-size="11" fill="#888">初始</text>
  <text x="80" y="100" font-size="11" fill="#999">—</text>
  <text x="160" y="100" font-size="11" fill="#999">—</text>
  <rect x="320" y="88" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="104" text-anchor="middle" font-size="10" fill="#999">空</text>
  <text x="510" y="100" font-size="11" fill="#888">栈为空</text>

  <!-- Step 1: a=5, push -->
  <text x="30" y="132" font-size="11" fill="#333">1</text>
  <circle cx="95" cy="128" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="160" y="132" font-size="11" fill="#4a7a3a" font-weight="bold">push →</text>
  <rect x="320" y="120" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="136" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="510" y="132" font-size="11" fill="#888">向右，直接入栈</text>

  <!-- Step 2: a=10, push -->
  <text x="30" y="172" font-size="11" fill="#333">2</text>
  <circle cx="95" cy="168" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="160" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">push →</text>
  <rect x="320" y="160" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="366" y="160" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="510" y="172" font-size="11" fill="#888">向右，直接入栈</text>

  <!-- Step 3: a=-5, collision 10 vs 5 -->
  <text x="30" y="212" font-size="11" fill="#333">3</text>
  <circle cx="95" cy="208" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−5</text>
  <text x="160" y="212" font-size="11" fill="#b85450" font-weight="bold">碰撞!</text>
  <text x="220" y="212" font-size="11" fill="#555">10 &gt; 5</text>
  <rect x="320" y="200" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="366" y="200" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="510" y="212" font-size="11" fill="#b85450">栈顶 10 &gt; |−5| → a 爆炸</text>

  <!-- explosion mark -->
  <text x="130" y="212" font-size="14" fill="#b85450" font-weight="bold">✕</text>

  <!-- Result -->
  <line x1="20" y1="240" x2="580" y2="240" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="256" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="278" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">结果：[5, 10]</text>
  <text x="300" y="294" text-anchor="middle" font-size="11" fill="#888">−5 与 10 碰撞，10 更大存活；5 和 10 同向不碰</text>

  <!-- Second example -->
  <text x="300" y="332" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">再演算 [8, -8]</text>

  <!-- Step 1: a=8 -->
  <text x="30" y="360" font-size="11" fill="#333">1</text>
  <circle cx="70" cy="356" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="360" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>
  <text x="95" y="360" font-size="11" fill="#4a7a3a">push</text>
  <rect x="160" y="348" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="363" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>
  <text x="220" y="360" font-size="11" fill="#888">向右入栈</text>

  <!-- Step 2: a=-8, equal -->
  <text x="30" y="392" font-size="11" fill="#333">2</text>
  <circle cx="70" cy="388" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="392" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">−8</text>
  <text x="95" y="392" font-size="11" fill="#b85450" font-weight="bold">碰撞 8=8</text>
  <text x="175" y="392" font-size="11" fill="#b85450" font-weight="bold">pop ✕✕ 都爆</text>
  <text x="320" y="392" font-size="11" fill="#888">栈空 → 结果 []</text>
  <text x="130" y="392" font-size="14" fill="#b85450" font-weight="bold">✕</text>
</svg>
