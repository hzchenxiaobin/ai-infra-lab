<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [5, 0, 3, 8, 6]</text>

  <!-- Column headers -->
  <text x="50" y="48" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="110" y="48" font-size="10" fill="#888" font-weight="bold">当前元素</text>
  <text x="220" y="48" font-size="10" fill="#888" font-weight="bold">数组状态（蓝=left / 灰=right）</text>
  <text x="500" y="48" font-size="10" fill="#888" font-weight="bold">leftMax / curMax / boundary</text>

  <!-- ===== Step 0: init ===== -->
  <text x="50" y="74" font-size="11" fill="#555" font-weight="bold">初始化</text>
  <text x="110" y="74" font-size="11" fill="#555">nums[0]=5</text>
  <!-- cells: boundary=0, only first is left -->
  <rect x="180" y="56" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="224" y="56" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="75" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="268" y="56" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="75" text-anchor="middle" font-size="12" fill="#999">3</text>
  <rect x="312" y="56" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="75" text-anchor="middle" font-size="12" fill="#999">8</text>
  <rect x="356" y="56" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="75" text-anchor="middle" font-size="12" fill="#999">6</text>
  <text x="480" y="74" font-size="10" fill="#446688" font-weight="bold">5 / 5 / 0</text>

  <!-- ===== Step 1: i=1, nums[1]=0 ===== -->
  <text x="50" y="112" font-size="11" fill="#555" font-weight="bold">i=1</text>
  <text x="110" y="112" font-size="11" fill="#b85450" font-weight="bold">0 &lt; 5 → 并入</text>
  <rect x="180" y="94" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="224" y="94" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="268" y="94" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="113" text-anchor="middle" font-size="12" fill="#999">3</text>
  <rect x="312" y="94" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="113" text-anchor="middle" font-size="12" fill="#999">8</text>
  <rect x="356" y="94" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="113" text-anchor="middle" font-size="12" fill="#999">6</text>
  <text x="480" y="112" font-size="10" fill="#b85450" font-weight="bold">5 / 5 / 1</text>

  <!-- ===== Step 2: i=2, nums[2]=3 ===== -->
  <text x="50" y="150" font-size="11" fill="#555" font-weight="bold">i=2</text>
  <text x="110" y="150" font-size="11" fill="#b85450" font-weight="bold">3 &lt; 5 → 并入</text>
  <rect x="180" y="132" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="224" y="132" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="268" y="132" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="312" y="132" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="151" text-anchor="middle" font-size="12" fill="#999">8</text>
  <rect x="356" y="132" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="151" text-anchor="middle" font-size="12" fill="#999">6</text>
  <text x="480" y="150" font-size="10" fill="#b85450" font-weight="bold">5 / 5 / 2</text>

  <!-- ===== Step 3: i=3, nums[3]=8 ===== -->
  <text x="50" y="188" font-size="11" fill="#555" font-weight="bold">i=3</text>
  <text x="110" y="188" font-size="11" fill="#82b366" font-weight="bold">8 ≥ 5 → 跳过</text>
  <rect x="180" y="170" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="224" y="170" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="268" y="170" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="312" y="170" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="356" y="170" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="189" text-anchor="middle" font-size="12" fill="#999">6</text>
  <text x="480" y="188" font-size="10" fill="#d6a040" font-weight="bold">5 / 8 / 2</text>

  <!-- ===== Step 4: i=4, nums[4]=6 ===== -->
  <text x="50" y="226" font-size="11" fill="#555" font-weight="bold">i=4</text>
  <text x="110" y="226" font-size="11" fill="#82b366" font-weight="bold">6 ≥ 5 → 跳过</text>
  <rect x="180" y="208" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="224" y="208" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="268" y="208" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="312" y="208" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="227" text-anchor="middle" font-size="12" fill="#999">8</text>
  <rect x="356" y="208" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="480" y="226" font-size="10" fill="#d6a040" font-weight="bold">5 / 8 / 2</text>

  <!-- separator -->
  <path d="M 40 252 L 540 252" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Final result ===== -->
  <text x="50" y="280" font-size="12" fill="#555" font-weight="bold">最终结果</text>
  <text x="110" y="280" font-size="11" fill="#555">boundary=2 → left 长度 = boundary+1 = 3</text>

  <!-- final array with partition line -->
  <rect x="180" y="292" width="132" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="292" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="313" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="224" y="292" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="313" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="268" y="292" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="313" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="312" y="292" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="313" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="356" y="292" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="313" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- partition divider -->
  <path d="M 312 286 L 312 330" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- zone labels -->
  <text x="246" y="340" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left = [5,0,3]</text>
  <text x="246" y="354" text-anchor="middle" font-size="10" fill="#666">max = 5</text>
  <text x="356" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">right = [8,6]</text>
  <text x="356" y="354" text-anchor="middle" font-size="10" fill="#666">min = 6 ≥ 5 ✓</text>

  <!-- summary box -->
  <rect x="80" y="372" width="420" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="394" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：0 和 3 都 &lt; leftMax=5，被迫并入 left</text>
  <text x="290" y="412" text-anchor="middle" font-size="11" fill="#666">8 和 6 ≥ leftMax=5，可安全留在 right</text>
  <text x="290" y="430" text-anchor="middle" font-size="11" fill="#888">leftMax 始终为 5（curMax 升到 8 但未触发并入）→ 返回 3 ✓</text>
</svg>
