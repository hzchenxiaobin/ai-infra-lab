<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="760" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：capacity = 3 的循环队列</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="68" text-anchor="middle" font-size="11" fill="#666">初始：data=[_, _, _], front=0, rear=0, count=0 ｜ 注意第⑨步 rear 绕回 0，复用已出队的槽位</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="30" y="84" width="60" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="90" y="84" width="170" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="260" y="84" width="60" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="320" y="84" width="60" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="380" y="84" width="60" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="440" y="84" width="70" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="510" y="84" width="70" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="580" y="84" width="70" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="650" y="84" width="220" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
  </g>
  <text x="60" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">#</text>
  <text x="175" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">操作</text>
  <text x="290" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">[0]</text>
  <text x="350" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">[1]</text>
  <text x="410" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">[2]</text>
  <text x="475" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">front</text>
  <text x="545" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">rear</text>
  <text x="615" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a2828">count</text>
  <text x="760" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">返回</text>

  <!-- 每行高 56，从 y=120 开始 -->
  <!-- 行1: enQueue(1) -->
  <g filter="url(#sk)">
    <rect x="260" y="124" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="320" y="124" width="60" height="40" rx="3" fill="#fff" stroke="#bbb"/>
    <rect x="380" y="124" width="60" height="40" rx="3" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="60" y="150" text-anchor="middle" font-size="11" fill="#666">①</text>
  <text x="175" y="150" text-anchor="middle" font-size="11" fill="#333">enQueue(1)</text>
  <text x="290" y="150" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="350" y="150" text-anchor="middle" font-size="11" fill="#ccc">_</text>
  <text x="410" y="150" text-anchor="middle" font-size="11" fill="#ccc">_</text>
  <text x="475" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a">0</text>
  <text x="545" y="150" text-anchor="middle" font-size="12" fill="#d6a040">1</text>
  <text x="615" y="150" text-anchor="middle" font-size="12" fill="#7a2828">1</text>
  <text x="760" y="150" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- 行2: enQueue(2) -->
  <g filter="url(#sk)">
    <rect x="260" y="170" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="320" y="170" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="380" y="170" width="60" height="40" rx="3" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="60" y="196" text-anchor="middle" font-size="11" fill="#666">②</text>
  <text x="175" y="196" text-anchor="middle" font-size="11" fill="#333">enQueue(2)</text>
  <text x="290" y="196" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="350" y="196" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="410" y="196" text-anchor="middle" font-size="11" fill="#ccc">_</text>
  <text x="475" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a">0</text>
  <text x="545" y="196" text-anchor="middle" font-size="12" fill="#d6a040">2</text>
  <text x="615" y="196" text-anchor="middle" font-size="12" fill="#7a2828">2</text>
  <text x="760" y="196" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- 行3: enQueue(3) — rear 绕回 0 -->
  <g filter="url(#sk)">
    <rect x="260" y="216" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="320" y="216" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="380" y="216" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="60" y="242" text-anchor="middle" font-size="11" fill="#666">③</text>
  <text x="175" y="238" text-anchor="middle" font-size="11" fill="#333">enQueue(3)</text>
  <text x="175" y="252" text-anchor="middle" font-size="9" fill="#d6a040">rear 绕回</text>
  <text x="290" y="242" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="350" y="242" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="410" y="242" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="475" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a">0</text>
  <text x="545" y="242" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <text x="615" y="242" text-anchor="middle" font-size="12" fill="#7a2828">3</text>
  <text x="760" y="242" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- 行4: enQueue(4) — 满，拒绝 -->
  <g filter="url(#sk)">
    <rect x="260" y="262" width="60" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="320" y="262" width="60" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="380" y="262" width="60" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="60" y="288" text-anchor="middle" font-size="11" fill="#666">④</text>
  <text x="175" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">enQueue(4)</text>
  <text x="175" y="298" text-anchor="middle" font-size="9" fill="#b85450">已满拒绝</text>
  <text x="290" y="288" text-anchor="middle" font-size="13" fill="#999">1</text>
  <text x="350" y="288" text-anchor="middle" font-size="13" fill="#999">2</text>
  <text x="410" y="288" text-anchor="middle" font-size="13" fill="#999">3</text>
  <text x="475" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a">0</text>
  <text x="545" y="288" text-anchor="middle" font-size="12" fill="#d6a040">0</text>
  <text x="615" y="288" text-anchor="middle" font-size="12" fill="#7a2828">3</text>
  <text x="760" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- 行5: Rear() -> 3 -->
  <text x="60" y="334" text-anchor="middle" font-size="11" fill="#666">⑤</text>
  <text x="175" y="334" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">Rear()</text>
  <text x="290" y="334" text-anchor="middle" font-size="13" fill="#999">1</text>
  <text x="350" y="334" text-anchor="middle" font-size="13" fill="#999">2</text>
  <text x="410" y="334" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">3</text>
  <text x="475" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a">0</text>
  <text x="545" y="334" text-anchor="middle" font-size="12" fill="#d6a040">0</text>
  <text x="615" y="334" text-anchor="middle" font-size="12" fill="#7a2828">3</text>
  <text x="760" y="334" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- 行6: isFull() -> true -->
  <text x="60" y="380" text-anchor="middle" font-size="11" fill="#666">⑥</text>
  <text x="175" y="380" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">isFull()</text>
  <text x="290" y="380" text-anchor="middle" font-size="13" fill="#999">1</text>
  <text x="350" y="380" text-anchor="middle" font-size="13" fill="#999">2</text>
  <text x="410" y="380" text-anchor="middle" font-size="13" fill="#999">3</text>
  <text x="475" y="380" text-anchor="middle" font-size="12" fill="#4a7a3a">0</text>
  <text x="545" y="380" text-anchor="middle" font-size="12" fill="#d6a040">0</text>
  <text x="615" y="380" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">3</text>
  <text x="760" y="380" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- 行7: deQueue() — front 前进 -->
  <g filter="url(#sk)">
    <rect x="260" y="354" width="60" height="40" rx="3" fill="#fce4ec" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="320" y="354" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="380" y="354" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="60" y="426" text-anchor="middle" font-size="11" fill="#666">⑦</text>
  <text x="175" y="422" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">deQueue()</text>
  <text x="175" y="436" text-anchor="middle" font-size="9" fill="#d6a040">front→1</text>
  <text x="290" y="426" text-anchor="middle" font-size="13" fill="#ccc" strike-through="true">1</text>
  <text x="350" y="426" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="410" y="426" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="475" y="426" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="545" y="426" text-anchor="middle" font-size="12" fill="#d6a040">0</text>
  <text x="615" y="426" text-anchor="middle" font-size="12" fill="#7a2828">2</text>
  <text x="760" y="426" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- 行8: deQueue() — front 再前进 -->
  <g filter="url(#sk)">
    <rect x="260" y="400" width="60" height="40" rx="3" fill="#fce4ec" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="320" y="400" width="60" height="40" rx="3" fill="#fce4ec" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="380" y="400" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="60" y="472" text-anchor="middle" font-size="11" fill="#666">⑧</text>
  <text x="175" y="468" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">deQueue()</text>
  <text x="175" y="482" text-anchor="middle" font-size="9" fill="#d6a040">front→2</text>
  <text x="290" y="472" text-anchor="middle" font-size="13" fill="#ccc">1</text>
  <text x="350" y="472" text-anchor="middle" font-size="13" fill="#ccc">2</text>
  <text x="410" y="472" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="475" y="472" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="545" y="472" text-anchor="middle" font-size="12" fill="#d6a040">0</text>
  <text x="615" y="472" text-anchor="middle" font-size="12" fill="#7a2828">1</text>
  <text x="760" y="472" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- 行9: enQueue(4) — 复用 slot 0! -->
  <g filter="url(#sk)">
    <rect x="260" y="446" width="60" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="320" y="446" width="60" height="40" rx="3" fill="#fce4ec" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="380" y="446" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="60" y="518" text-anchor="middle" font-size="11" fill="#666">⑨</text>
  <text x="175" y="514" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">enQueue(4)</text>
  <text x="175" y="528" text-anchor="middle" font-size="9" fill="#4a7a3a">复用 slot 0</text>
  <text x="290" y="518" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="350" y="518" text-anchor="middle" font-size="13" fill="#ccc">2</text>
  <text x="410" y="518" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="475" y="518" text-anchor="middle" font-size="12" fill="#4a7a3a">2</text>
  <text x="545" y="518" text-anchor="middle" font-size="12" fill="#d6a040">1</text>
  <text x="615" y="518" text-anchor="middle" font-size="12" fill="#7a2828">2</text>
  <text x="760" y="518" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- 行10: enQueue(5) — 复用 slot 1, rear 绕回 2 -->
  <g filter="url(#sk)">
    <rect x="260" y="492" width="60" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="320" y="492" width="60" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="380" y="492" width="60" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="60" y="564" text-anchor="middle" font-size="11" fill="#666">⑩</text>
  <text x="175" y="560" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">enQueue(5)</text>
  <text x="175" y="574" text-anchor="middle" font-size="9" fill="#4a7a3a">复用 slot 1</text>
  <text x="290" y="564" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="350" y="564" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="410" y="564" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="475" y="564" text-anchor="middle" font-size="12" fill="#4a7a3a">2</text>
  <text x="545" y="564" text-anchor="middle" font-size="12" fill="#d6a040">2</text>
  <text x="615" y="564" text-anchor="middle" font-size="12" fill="#7a2828">3</text>
  <text x="760" y="564" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- 行11: Rear() -> 5 -->
  <text x="60" y="610" text-anchor="middle" font-size="11" fill="#666">⑪</text>
  <text x="175" y="610" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">Rear()</text>
  <text x="290" y="610" text-anchor="middle" font-size="13" fill="#999">4</text>
  <text x="350" y="610" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">5</text>
  <text x="410" y="610" text-anchor="middle" font-size="13" fill="#999">3</text>
  <text x="475" y="610" text-anchor="middle" font-size="12" fill="#4a7a3a">2</text>
  <text x="545" y="610" text-anchor="middle" font-size="12" fill="#d6a040">2</text>
  <text x="615" y="610" text-anchor="middle" font-size="12" fill="#7a2828">3</text>
  <text x="760" y="610" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>

  <!-- 底部小结 -->
  <g filter="url(#sk)">
    <rect x="60" y="640" width="820" height="92" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="80" y="664" font-size="12" font-weight="bold" fill="#2e6e2e">关键看点：</text>
  <text x="80" y="686" font-size="11" fill="#444">① 第③步 rear=(2+1)%3=0，绕回开头——这就是“环”生效的瞬间。</text>
  <text x="80" y="706" font-size="11" fill="#444">② 第⑨步 enQueue(4) 写入 data[rear=0]，复用了第⑦步出队腾出的槽位 0——不浪费空间。</text>
  <text x="80" y="724" font-size="11" fill="#444">③ 第⑪步 Rear() 取 data[(2-1+3)%3]=data[1]=5；front=2 指向队首 3，逻辑顺序为 3→4→5（FIFO）。</text>
</svg>
