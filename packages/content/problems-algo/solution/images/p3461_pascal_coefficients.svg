<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">相邻求和金字塔 —— 系数恰是杨辉三角（例：s = "34789"）</text>

  <g stroke="#c8c8c8" stroke-width="1">
    <path d="M 62 75 L 97 95" filter="url(#rough2)"/>
    <path d="M 132 75 L 97 95" filter="url(#rough2)"/>
    <path d="M 132 75 L 167 95" filter="url(#rough2)"/>
    <path d="M 202 75 L 167 95" filter="url(#rough2)"/>
    <path d="M 202 75 L 237 95" filter="url(#rough2)"/>
    <path d="M 272 75 L 237 95" filter="url(#rough2)"/>
    <path d="M 272 75 L 307 95" filter="url(#rough2)"/>
    <path d="M 342 75 L 307 95" filter="url(#rough2)"/>
    <path d="M 97 125 L 132 145" filter="url(#rough2)"/>
    <path d="M 167 125 L 132 145" filter="url(#rough2)"/>
    <path d="M 167 125 L 202 145" filter="url(#rough2)"/>
    <path d="M 237 125 L 202 145" filter="url(#rough2)"/>
    <path d="M 237 125 L 272 145" filter="url(#rough2)"/>
    <path d="M 307 125 L 272 145" filter="url(#rough2)"/>
    <path d="M 132 175 L 167 195" filter="url(#rough2)"/>
    <path d="M 202 175 L 167 195" filter="url(#rough2)"/>
    <path d="M 202 175 L 237 195" filter="url(#rough2)"/>
    <path d="M 272 175 L 237 195" filter="url(#rough2)"/>
  </g>

  <text x="33" y="64" text-anchor="end" font-size="10" fill="#888">s =</text>
  <text x="68" y="114" text-anchor="end" font-size="10" fill="#888">第1次</text>
  <text x="103" y="164" text-anchor="end" font-size="10" fill="#888">第2次</text>
  <text x="138" y="214" text-anchor="end" font-size="10" fill="#888">第3次</text>

  <rect x="40" y="45" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="64" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="110" y="45" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="64" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="180" y="45" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="64" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="250" y="45" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="64" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="320" y="45" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="64" text-anchor="middle" font-size="12" fill="#333">9</text>

  <rect x="75" y="95" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="114" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="145" y="95" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="114" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="215" y="95" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="114" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="285" y="95" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="114" text-anchor="middle" font-size="12" fill="#333">7</text>

  <rect x="110" y="145" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="164" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="180" y="145" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="164" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="250" y="145" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="164" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="145" y="195" width="44" height="30" fill="#fff8e1" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="215" y="195" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <rect x="375" y="45" width="135" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左边 4：</text>
  <text x="442" y="89" text-anchor="middle" font-size="10" fill="#333">1×3 + 3×4 + 3×7 + 1×8</text>
  <text x="442" y="112" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">= 44 → mod 10 = 4</text>

  <rect x="375" y="145" width="135" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">右边 8：</text>
  <text x="442" y="189" text-anchor="middle" font-size="10" fill="#333">1×4 + 3×7 + 3×8 + 1×9</text>
  <text x="442" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">= 58 → mod 10 = 8</text>

  <rect x="375" y="245" width="135" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">系数 1, 3, 3, 1</text>
  <text x="442" y="284" text-anchor="middle" font-size="10.5" fill="#333">正是杨辉三角第 3 行</text>
  <text x="442" y="300" text-anchor="middle" font-size="9" fill="#888">（这里 n − 2 = 3）</text>

  <rect x="40" y="245" width="320" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">n 位数字经 n − 2 轮后剩两位：</text>
  <text x="200" y="284" text-anchor="middle" font-size="10.5" fill="#333">左 = Σ C(n−2, j)·d[j] mod 10</text>
  <text x="200" y="300" text-anchor="middle" font-size="10.5" fill="#333">右 = Σ C(n−2, j)·d[j+1] mod 10</text>

  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#555">杨辉递推 C(k,j) = C(k−1,j−1) + C(k−1,j) 只含加法 → 在 mod 10 下天然成立，无需逆元</text>
</svg>
