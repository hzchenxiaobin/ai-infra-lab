<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三种情形一览</text>

  <!-- ===== Example 3: [1,2,3] S=0 → win (top, full width) ===== -->
  <rect x="30" y="44" width="540" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="48" y="66" font-size="12" fill="#4a7a3a" font-weight="bold">示例 3：nums=[1,2,3]　S=1⊕2⊕3=0 → Alice 胜 ✓</text>

  <rect x="60" y="78" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="96" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="100" y="78" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="96" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="140" y="78" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="96" text-anchor="middle" font-size="11" fill="#333">3</text>

  <text x="196" y="96" font-size="11" fill="#d6a040" font-weight="bold">S = 0</text>
  <text x="252" y="96" font-size="10" fill="#4a7a3a">→ 开局轮到 Alice，XOR 已为 0</text>
  <text x="252" y="110" font-size="10" fill="#4a7a3a" font-weight="bold">直接获胜，无需走子</text>

  <!-- ===== Example 2: [0,1] S=1≠0, n=2 even → win (left-bottom) ===== -->
  <rect x="30" y="136" width="260" height="148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="48" y="158" font-size="12" fill="#4a7a3a" font-weight="bold">示例 2：nums=[0,1]　n=2(偶) → 胜 ✓</text>

  <rect x="56" y="170" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="74" y="188" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="96" y="170" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="188" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="148" y="188" font-size="11" fill="#d6a040" font-weight="bold">S=1≠0</text>

  <text x="48" y="216" font-size="10" fill="#444">Alice 擦 0 → 余 [1], XOR=1≠0</text>
  <text x="48" y="232" font-size="10" fill="#444">→ Bob 必须擦 1，余空 XOR=0</text>
  <text x="48" y="248" font-size="10" fill="#b85450">→ Bob 擦完即败，Alice 胜</text>
  <text x="48" y="270" font-size="10" fill="#4a7a3a" font-weight="bold">奇偶判定：n 偶 ⇒ 必有安全手</text>

  <!-- ===== Example 1: [1,1,2] S=2≠0, n=3 odd → lose (right-bottom) ===== -->
  <rect x="310" y="136" width="260" height="268" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="328" y="158" font-size="12" fill="#b85450" font-weight="bold">示例 1：nums=[1,1,2]　n=3(奇) → 败 ✗</text>

  <rect x="336" y="170" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="188" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="376" y="170" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="188" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="416" y="170" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="188" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="468" y="188" font-size="11" fill="#d6a040" font-weight="bold">S=2≠0</text>

  <text x="328" y="216" font-size="10" fill="#444" font-weight="bold">分支 A：擦 2</text>
  <text x="328" y="232" font-size="10" fill="#444">余 [1,1], XOR=1⊕1=0</text>
  <text x="328" y="248" font-size="10" fill="#b85450">→ 擦完即败 ✗</text>

  <text x="328" y="274" font-size="10" fill="#444" font-weight="bold">分支 B：擦 1</text>
  <text x="328" y="290" font-size="10" fill="#444">余 [1,2], XOR=1⊕2=3≠0</text>
  <text x="328" y="306" font-size="10" fill="#444">→ Bob 随便擦一个，余 1 个≠0</text>
  <text x="328" y="322" font-size="10" fill="#444">→ Alice 擦最后一数，余空=0</text>
  <text x="328" y="338" font-size="10" fill="#b85450">→ Alice 擦完即败 ✗</text>

  <text x="328" y="366" font-size="10" fill="#b85450" font-weight="bold">两支皆败 ⇒ n 奇(S≠0) 必败</text>
  <text x="328" y="384" font-size="10" fill="#888">印证结论：xorGame = (S==0) or (n偶)</text>

  <!-- footer -->
  <text x="160" y="388" text-anchor="middle" font-size="10" fill="#999">擦最小不安全手即可</text>
  <text x="160" y="402" text-anchor="middle" font-size="10" fill="#999">（此处擦 0 留 1≠0）</text>
</svg>
