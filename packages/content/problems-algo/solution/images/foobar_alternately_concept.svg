<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="330" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">交替执行：Foo 与 Bar 线程轮流推进</text>

  <text x="145" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Foo 线程 (printFoo)</text>
  <text x="395" y="54" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Bar 线程 (printBar)</text>
  <text x="495" y="54" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">turn</text>

  <rect x="90" y="70" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="90" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">print "foo"</text>
  <rect x="340" y="70" width="110" height="30" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="395" y="90" text-anchor="middle" font-size="12" fill="#999">等待…</text>
  <path d="M 205 85 Q 270 72 335 85" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="10" fill="#b85450">notify bar</text>
  <text x="495" y="90" text-anchor="middle" font-size="11" fill="#666">T→F</text>

  <rect x="90" y="125" width="110" height="30" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="145" y="145" text-anchor="middle" font-size="12" fill="#999">等待…</text>
  <rect x="340" y="125" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="395" y="145" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">print "bar"</text>
  <path d="M 335 140 Q 270 127 205 140" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="270" y="123" text-anchor="middle" font-size="10" fill="#4a7a3a">notify foo</text>
  <text x="495" y="145" text-anchor="middle" font-size="11" fill="#666">F→T</text>

  <rect x="90" y="180" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="200" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">print "foo"</text>
  <rect x="340" y="180" width="110" height="30" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="395" y="200" text-anchor="middle" font-size="12" fill="#999">等待…</text>
  <path d="M 205 195 Q 270 182 335 195" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="495" y="200" text-anchor="middle" font-size="11" fill="#666">T→F</text>

  <rect x="90" y="235" width="110" height="30" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="145" y="255" text-anchor="middle" font-size="12" fill="#999">等待…</text>
  <rect x="340" y="235" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="395" y="255" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">print "bar"</text>
  <path d="M 335 250 Q 270 237 205 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="495" y="255" text-anchor="middle" font-size="11" fill="#666">F→T</text>

  <path d="M 60 275 Q 270 272 480 275" stroke="#ddd" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="70" y="285" width="400" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="306" text-anchor="middle" font-size="13" fill="#444">输出：foobar foobar …（共 n 组）</text>
</svg>
