<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一维滚动 DP，01 背包式倒序更新</text>

  <!-- ① 初始化 -->
  <rect x="160" y="30" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">① dp = [−∞, −∞, −∞, −∞]</text>
  <path d="M 260 54 L 260 64" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② 取元素 -->
  <rect x="160" y="68" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">② 取当前元素 x = b[j]</text>
  <path d="M 260 92 L 260 102" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ 倒序更新 -->
  <rect x="95" y="106" width="330" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">③ 倒序 k = 3, 2, 1：</text>
  <text x="260" y="137" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">dp[k] = max(dp[k], dp[k−1] + a[k]·x)</text>
  <path d="M 260 146 L 260 156" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ④ k=0 -->
  <rect x="95" y="160" width="330" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">④ dp[0] = max(dp[0], a[0]·x)</text>
  <path d="M 260 184 L 260 194" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ⑤ 判定 -->
  <polygon points="260,198 385,226 260,254 135,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⑤ b 遍历完？</text>

  <!-- 否：回到 ② -->
  <path d="M 135 226 C 45 226 45 80 158 80" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="38" y="156" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 是：输出 -->
  <path d="M 260 254 L 260 266" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="272" y="264" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="135" y="270" width="250" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⑥ 返回 dp[3]</text>

  <!-- 倒序原因注记 -->
  <rect x="30" y="308" width="460" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="9.5" fill="#8a4a48" filter="url(#rough2)">⚠️ 为何必须倒序？正序时 dp[k−1] 可能已「吃过」当前 x，</text>
  <text x="260" y="340" text-anchor="middle" font-size="9.5" fill="#8a4a48" filter="url(#rough2)">同一元素被多个阶段重复使用；倒序保证读的是旧值 —— 与 01 背包同理</text>
</svg>
