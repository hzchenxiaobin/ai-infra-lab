<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程（解法 A）：编号 → 交换键自连接 → 禁自配 → 选代表 → 去重排序</text>

  <!-- 步骤 ① -->
  <rect x="36" y="50" width="282" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="177" y="76" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① P：ROW_NUMBER() OVER () AS id, x, y</text>

  <!-- 步骤 ② -->
  <rect x="36" y="112" width="282" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="177" y="138" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">② 自连接 ON p1.x = p2.y AND p1.y = p2.x</text>

  <!-- 步骤 ③ -->
  <rect x="36" y="174" width="282" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="177" y="200" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">③ AND p1.id != p2.id（禁止自身配对）</text>

  <!-- 步骤 ④ -->
  <rect x="36" y="236" width="282" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="177" y="262" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">④ WHERE p1.x &lt;= p1.y（每对留一个代表）</text>

  <!-- 步骤 ⑤ -->
  <rect x="36" y="298" width="282" height="44" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="177" y="324" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">⑤ DISTINCT ＋ ORDER BY x, y 升序输出</text>

  <!-- 步骤间箭头 -->
  <path d="M 177 94 L 177 106" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 177 156 L 177 168" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 177 218 L 177 230" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 177 280 L 177 292" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧注解 -->
  <rect x="334" y="50" width="154" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="411" y="68" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">无主键也能区分「行」</text>
  <text x="411" y="84" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">两行 (20,20) 的 id 不同</text>

  <rect x="334" y="112" width="154" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="411" y="130" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">镜像 = 两列交叉相等</text>
  <text x="411" y="146" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">即 swap(x, y) 是否存在</text>

  <rect x="334" y="174" width="154" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="411" y="192" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">单行 (x,x) 找不到伴 ✗</text>
  <text x="411" y="208" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">两个 (20,20) ✓ 互相配对</text>

  <rect x="334" y="236" width="154" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="411" y="254" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">(20,21) ✓ 留 / (21,20) ✗ 删</text>
  <text x="411" y="270" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">对角 (x,x) 自为代表</text>

  <rect x="334" y="298" width="154" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="411" y="316" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">输出 (20,20) (20,21) (22,23)</text>
  <text x="411" y="332" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">按 x、y 升序排列</text>
</svg>
