<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：增量构造 + 正向完全背包在线维护</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="120" cy="48" rx="44" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="120" y="53" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">开始</text>
  </g>

  <path d="M 120 65 L 120 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="52" y="84" width="136" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="120" y="100" text-anchor="middle" font-size="10" fill="#333">f[0]=1, 其余 f=0</text>
    <text x="120" y="115" text-anchor="middle" font-size="10" fill="#333">ans = []，i = 1</text>
  </g>

  <path d="M 120 124 L 120 142" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判断 -->
  <g filter="url(#rough2)">
    <polygon points="120,144 176,168 120,192 64,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="120" y="172" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">i ≤ n ?</text>
  </g>

  <path d="M 176 168 L 400 168" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 400 168 L 400 186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="161" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">否（扫描完毕）</text>

  <path d="M 120 192 L 120 208" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="204" font-size="9.5" fill="#446688" font-weight="bold">是</text>

  <!-- 计算 rem -->
  <g filter="url(#rough2)">
    <rect x="42" y="210" width="156" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="120" y="231" text-anchor="middle" font-size="10" fill="#2a5a2a" font-weight="bold">rem = numWays[i] − f[i]</text>
  </g>

  <path d="M 120 244 L 120 260" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 rem==0 -->
  <g filter="url(#rough2)">
    <polygon points="120,262 172,286 120,310 68,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="120" y="290" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">rem == 0 ?</text>
  </g>

  <!-- rem==0 → 左侧跳过框，回到循环 -->
  <path d="M 68 286 L 30 286 L 30 168 L 62 168" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 62 168 L 64 168" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="279" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="26" y="232" font-size="8.5" fill="#666" transform="rotate(-90 26 232)">i 不是面值，i++</text>

  <path d="M 120 310 L 120 326" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="322" font-size="9" fill="#b85450" font-weight="bold">否</text>

  <!-- 菱形 rem==1 -->
  <g filter="url(#rough2)">
    <polygon points="120,328 176,352 120,376 64,352" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="120" y="350" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">rem == 1 ?</text>
    <text x="120" y="364" text-anchor="middle" font-size="8" fill="#b85450">（rem&lt;0 或 ≥2 均矛盾）</text>
  </g>

  <!-- rem==1 → 右侧认定面值框 -->
  <path d="M 176 352 L 214 352" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="345" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">是</text>

  <!-- rem!=1 → 无解 -->
  <path d="M 120 376 L 120 392" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="390" font-size="9" fill="#b85450" font-weight="bold">否 → 返回 []</text>

  <!-- 认定面值 + 背包 -->
  <g filter="url(#rough2)">
    <rect x="216" y="322" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="291" y="343" text-anchor="middle" font-size="10" fill="#2a5a2a" font-weight="bold">ans 追加面值 i</text>
  </g>

  <path d="M 291 322 L 291 304" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="196" y="258" width="190" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="291" y="275" text-anchor="middle" font-size="10" fill="#333">正向完全背包补贡献：</text>
    <text x="291" y="292" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">f[t] += f[t−i]，t = i…n（递增）</text>
  </g>

  <!-- 回到循环 -->
  <path d="M 386 280 L 420 280 L 420 168 L 178 168" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 180 168 L 178 168" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="232" font-size="8.5" fill="#666" transform="rotate(90 420 232)">i++ 继续扫描</text>

  <!-- 结束框 -->
  <g filter="url(#rough2)">
    <rect x="330" y="188" width="152" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="406" y="208" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">返回 ans</text>
    <text x="406" y="226" text-anchor="middle" font-size="8.5" fill="#333">全程未失败 ⟹ f ≡ numWays</text>
  </g>

  <!-- 底部注释 -->
  <g filter="url(#rough2)">
    <rect x="240" y="322" width="258" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8"/>
    <text x="369" y="341" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">两处关键不变量：</text>
    <text x="369" y="356" text-anchor="middle" font-size="9" fill="#555">① 每个面值都是被迫认定（rem=1 无第二种解释）</text>
    <text x="369" y="370" text-anchor="middle" font-size="9" fill="#555">② 经过金额 i 时必有 f[i]=numWays[i]，此后冻结</text>
  </g>
</svg>
