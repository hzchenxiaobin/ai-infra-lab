<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍预处理后缀最小 + 一遍枚举山峰</text>

  <rect x="70" y="38" width="420" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 从右往左递推后缀最小数组</text>
  <text x="280" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">suf_min[n−1] = nums[n−1]；suf_min[i] = min(nums[i], suf_min[i+1])</text>

  <path d="M 280 86 L 280 102" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <rect x="60" y="104" width="440" height="192" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② for j = 1 … n−2（枚举山峰）</text>
  <text x="280" y="143" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">滚动变量 pre_min 始终 = min(nums[0..j−1])，进入循环前先装好 nums[0]</text>

  <rect x="84" y="152" width="392" height="40" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">判断：pre_min &lt; nums[j] 且 suf_min[j+1] &lt; nums[j] ？</text>
  <text x="280" y="186" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（两侧最小值都比山峰矮，j 才立得住）</text>

  <rect x="84" y="200" width="392" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">是 → ans = min(ans, pre_min + nums[j] + suf_min[j+1])</text>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">否 → 这个 j 当不成山峰，跳过（ans 不动）</text>

  <rect x="84" y="252" width="392" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">滚动更新：pre_min = min(pre_min, nums[j]) —— 留给下一个 j 用</text>

  <path d="M 500 220 C 526 220, 526 126, 502 126" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="527" y="164" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">下</text>
  <text x="527" y="176" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">一</text>
  <text x="527" y="188" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">个</text>
  <text x="527" y="200" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">j</text>

  <path d="M 280 296 L 280 312" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <rect x="130" y="314" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">③ 返回 ans</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">（ans 从未更新、仍是 +∞ → 返回 −1）</text>

  <rect x="40" y="378" width="480" height="86" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么 pre_min 能滚动、suf_min 却要预处理？</text>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">主循环从左往右走：左侧窗口右端不断扩张 → 新元素 min 进滚动变量即可，O(1) 维护</text>
  <text x="280" y="434" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">右侧窗口左端不断收缩 → min 不支持「删除元素」，没法在线维护</text>
  <text x="280" y="452" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 只能事先沿它自己的扩张方向（右→左）递推一遍存进数组</text>
</svg>
