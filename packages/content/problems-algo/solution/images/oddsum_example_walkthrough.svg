<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1, 2, 3, 4, 5, 6, 7]</text>

  <!-- Column headers -->
  <rect x="10" y="38" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步骤</text>
  <text x="95" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">元素</text>
  <text x="155" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">S</text>
  <text x="215" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">r=S%2</text>
  <text x="290" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">命中</text>
  <text x="360" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans</text>
  <text x="475" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">count [偶, 奇]</text>

  <!-- Row 0: 初始 -->
  <rect x="10" y="66" width="540" height="28" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="84" text-anchor="middle" font-size="10.5" fill="#888">初始</text>
  <text x="95" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="155" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="215" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="290" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="360" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="475" y="84" text-anchor="middle" font-size="10" fill="#333">[1, 0]</text>

  <!-- Row 1: j=0, x=1, r=1(奇) -->
  <rect x="10" y="96" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="114" text-anchor="middle" font-size="10.5" fill="#888">j=0 ★</text>
  <rect x="82" y="100" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="114" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="155" y="114" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="215" y="114" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">奇</text>
  <text x="290" y="114" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">1 ←</text>
  <text x="360" y="114" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="475" y="114" text-anchor="middle" font-size="10" fill="#333">[1, 1]</text>

  <!-- Row 2: j=1, x=2, r=1(奇) -->
  <rect x="10" y="126" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="144" text-anchor="middle" font-size="10.5" fill="#888">j=1 ★</text>
  <rect x="82" y="130" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="144" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <text x="155" y="144" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="215" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">奇</text>
  <text x="290" y="144" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">1 ←</text>
  <text x="360" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="475" y="144" text-anchor="middle" font-size="10" fill="#333">[1, 2]</text>

  <!-- Row 3: j=2, x=3, r=0(偶) -->
  <rect x="10" y="156" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="174" text-anchor="middle" font-size="10.5" fill="#888">j=2 ★</text>
  <rect x="82" y="160" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="174" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <text x="155" y="174" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="215" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶</text>
  <text x="290" y="174" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">2 ←</text>
  <text x="360" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="475" y="174" text-anchor="middle" font-size="10" fill="#333">[2, 2]</text>

  <!-- Row 4: j=3, x=4, r=0(偶) -->
  <rect x="10" y="186" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="204" text-anchor="middle" font-size="10.5" fill="#888">j=3 ★</text>
  <rect x="82" y="190" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="204" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <text x="155" y="204" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="215" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶</text>
  <text x="290" y="204" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">2 ←</text>
  <text x="360" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="475" y="204" text-anchor="middle" font-size="10" fill="#333">[3, 2]</text>

  <!-- Row 5: j=4, x=5, r=1(奇) -->
  <rect x="10" y="216" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="234" text-anchor="middle" font-size="10.5" fill="#888">j=4 ★</text>
  <rect x="82" y="220" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="234" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">5</text>
  <text x="155" y="234" text-anchor="middle" font-size="11" fill="#333">15</text>
  <text x="215" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">奇</text>
  <text x="290" y="234" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">3 ←</text>
  <text x="360" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">9</text>
  <text x="475" y="234" text-anchor="middle" font-size="10" fill="#333">[3, 3]</text>

  <!-- Row 6: j=5, x=6, r=1(奇) -->
  <rect x="10" y="246" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="264" text-anchor="middle" font-size="10.5" fill="#888">j=5 ★</text>
  <rect x="82" y="250" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="264" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">6</text>
  <text x="155" y="264" text-anchor="middle" font-size="11" fill="#333">21</text>
  <text x="215" y="264" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">奇</text>
  <text x="290" y="264" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">3 ←</text>
  <text x="360" y="264" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">12</text>
  <text x="475" y="264" text-anchor="middle" font-size="10" fill="#333">[3, 4]</text>

  <!-- Row 7: j=6, x=7, r=0(偶) -->
  <rect x="10" y="276" width="540" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="38" y="294" text-anchor="middle" font-size="10.5" fill="#888">j=6 ★</text>
  <rect x="82" y="280" width="26" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="95" y="294" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">7</text>
  <text x="155" y="294" text-anchor="middle" font-size="11" fill="#333">28</text>
  <text x="215" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶</text>
  <text x="290" y="294" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">4 ←</text>
  <text x="360" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16</text>
  <text x="475" y="294" text-anchor="middle" font-size="10" fill="#333">[4, 4]</text>

  <!-- Explanation box 1: parity rule -->
  <rect x="10" y="316" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">★ 命中 = count[1−r]</text>
  <text x="140" y="352" text-anchor="middle" font-size="10" fill="#555">r=奇 → 查偶的个数</text>
  <text x="140" y="366" text-anchor="middle" font-size="10" fill="#555">r=偶 → 查奇的个数</text>

  <!-- Explanation box 2: color legend -->
  <rect x="290" y="316" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="336" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">颜色说明</text>
  <text x="420" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a">绿行 = 前缀和为偶</text>
  <text x="420" y="366" text-anchor="middle" font-size="10" fill="#d6a040">橙行 = 前缀和为奇</text>

  <!-- Summary box -->
  <rect x="10" y="384" width="540" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">最终 ans = 16   （偶 4 个 × 奇 4 个 = 16 ✓）</text>
  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#888">每步「先查 count[1−r]，再 count[r]++」，一次遍历 O(n)</text>
</svg>
