<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：a = "ulacfd", b = "jizalu" → check(a, b)</text>

  <!-- Step 1: l=0, r=5 -->
  <text x="30" y="56" font-size="12" fill="#888" font-weight="bold">① l=0, r=5：a[0]='u' ↔ b[5]='u'</text>
  <g filter="url(#rough2)">
    <rect x="80" y="64" width="50" height="28" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="105" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">u</text>
    <rect x="130" y="64" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="155" y="83" text-anchor="middle" font-size="13" fill="#333">l</text>
    <rect x="180" y="64" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="205" y="83" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="230" y="64" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="255" y="83" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="280" y="64" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="305" y="83" text-anchor="middle" font-size="13" fill="#333">f</text>
    <rect x="330" y="64" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="355" y="83" text-anchor="middle" font-size="13" fill="#333">d</text>
  </g>
  <text x="60" y="83" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">a</text>

  <g filter="url(#rough2)">
    <rect x="80" y="98" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="105" y="117" text-anchor="middle" font-size="13" fill="#333">j</text>
    <rect x="130" y="98" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="155" y="117" text-anchor="middle" font-size="13" fill="#333">i</text>
    <rect x="180" y="98" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="205" y="117" text-anchor="middle" font-size="13" fill="#333">z</text>
    <rect x="230" y="98" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="255" y="117" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="280" y="98" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="305" y="117" text-anchor="middle" font-size="13" fill="#333">l</text>
    <rect x="330" y="98" width="50" height="28" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="355" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">u</text>
  </g>
  <text x="60" y="117" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">b</text>
  <path d="M105,92 Q230,140 355,98" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="420" y="88" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="470" y="104" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">'u'=='u' ✓</text>

  <!-- Step 2: l=1, r=4 -->
  <text x="30" y="146" font-size="12" fill="#888" font-weight="bold">② l=1, r=4：a[1]='l' ↔ b[4]='l'</text>
  <g filter="url(#rough2)">
    <rect x="80" y="154" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="130" y="154" width="50" height="28" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="155" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
    <rect x="180" y="154" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="205" y="173" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="230" y="154" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="255" y="173" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="280" y="154" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="305" y="173" text-anchor="middle" font-size="13" fill="#333">f</text>
    <rect x="330" y="154" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  <text x="60" y="173" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">a</text>

  <g filter="url(#rough2)">
    <rect x="80" y="188" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="130" y="188" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="180" y="188" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="205" y="207" text-anchor="middle" font-size="13" fill="#333">z</text>
    <rect x="230" y="188" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="255" y="207" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="280" y="188" width="50" height="28" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="305" y="207" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
    <rect x="330" y="188" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  <text x="60" y="207" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">b</text>
  <path d="M155,182 Q230,225 305,188" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="420" y="178" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="470" y="194" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">'l'=='l' ✓</text>

  <!-- Step 3: l=2, r=3 -->
  <text x="30" y="236" font-size="12" fill="#888" font-weight="bold">③ l=2, r=3：a[2]='a' ↔ b[3]='a'</text>
  <g filter="url(#rough2)">
    <rect x="80" y="244" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="130" y="244" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="180" y="244" width="50" height="28" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="205" y="263" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
    <rect x="230" y="244" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="255" y="263" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="280" y="244" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="330" y="244" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  <text x="60" y="263" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">a</text>

  <g filter="url(#rough2)">
    <rect x="80" y="278" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="130" y="278" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="180" y="278" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="230" y="278" width="50" height="28" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="255" y="297" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
    <rect x="280" y="278" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="330" y="278" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  <text x="60" y="297" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">b</text>
  <path d="M205,272 Q230,310 255,278" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="420" y="268" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="470" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">'a'=='a' ✓</text>

  <!-- Step 4: l=3, r=2, l >= r -->
  <text x="30" y="326" font-size="12" fill="#888" font-weight="bold">④ l=3, r=2：l ≥ r → 外层完全匹配！</text>

  <!-- combined result -->
  <rect x="80" y="338" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">aprefix="ula" + bsuffix="alu" = "ulaalu"</text>

  <!-- palindrome check arrows -->
  <g filter="url(#rough2)">
    <text x="110" y="386" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">u</text>
    <text x="150" y="386" text-anchor="middle" font-size="12" fill="#888">l</text>
    <text x="190" y="386" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">a</text>
    <text x="230" y="386" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">a</text>
    <text x="270" y="386" text-anchor="middle" font-size="12" fill="#888">l</text>
    <text x="310" y="386" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">u</text>
  </g>
  <path d="M110,372 Q210,368 310,372" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M150,372 Q230,366 270,372" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <path d="M190,374 Q210,376 230,374" fill="none" stroke="#d6a040" stroke-width="1" stroke-dasharray="2,2" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="80" y="400" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="421" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">"ulaalu" 是回文串 → return true ✓</text>
</svg>
