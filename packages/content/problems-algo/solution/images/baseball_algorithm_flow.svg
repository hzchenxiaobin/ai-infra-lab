<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍扫描 + 单栈模拟</text>

  <!-- Start -->
  <rect x="180" y="46" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化空栈 stack</text>

  <path d="M 270 80 L 270 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 还有 op? -->
  <polygon points="270,98 370,150 270,202 170,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">还有 op?</text>
  <text x="270" y="162" text-anchor="middle" font-size="10" fill="#888">遍历 ops</text>

  <!-- No branch: return sum -->
  <path d="M 370 150 L 450 150 L 450 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="142" font-size="10" fill="#4a7a3a">否</text>
  <rect x="378" y="64" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="453" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return Σ stack</text>

  <!-- Yes branch: read op -->
  <path d="M 270 202 L 270 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="214" font-size="10" fill="#4a7a3a">是</text>
  <rect x="180" y="220" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#333">读入 op</text>

  <path d="M 270 250 L 270 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: op 是哪类? -->
  <polygon points="270,266 370,316 270,366 170,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="12" fill="#333">op 分类</text>
  <text x="270" y="328" text-anchor="middle" font-size="10" fill="#888">四分支</text>

  <!-- Branch A: 整数 -->
  <path d="M 170 316 L 90 316 L 90 388" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="308" font-size="9" fill="#446688">整数</text>
  <rect x="20" y="388" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="410" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">push(int(op))</text>

  <!-- Branch B: C -->
  <path d="M 220 360 L 160 360 L 160 388" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="376" font-size="9" fill="#b85450">"C"</text>
  <rect x="170" y="388" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="410" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">pop()</text>

  <!-- Branch C: D -->
  <path d="M 320 360 L 380 360 L 380 388" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="376" font-size="9" fill="#4a7a3a">"D"</text>
  <rect x="230" y="388" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="410" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">push(2 × top)</text>

  <!-- Branch D: + -->
  <path d="M 370 316 L 450 316 L 450 388" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="308" font-size="9" fill="#d6a040">"+"</text>
  <rect x="380" y="388" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="410" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">push(top + 次顶)</text>

  <!-- loop back to diamond -->
  <path d="M 90 388 L 90 150 L 170 150" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 388 L 450 150 L 370 150" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="10" fill="#888">↑ 回到循环，处理下一个 op</text>

  <!-- bottom callout -->
  <rect x="20" y="422" width="500" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="270" y="432" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">每 op 处理 O(1)，共 n 个 op → 总时间 O(n)，空间 O(n)</text>
</svg>
