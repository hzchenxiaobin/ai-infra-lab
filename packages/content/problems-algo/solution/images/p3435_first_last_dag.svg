<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">word "xy" ⟺ first(x) → last(y)，重复字母的 last 是死胡同</text>

  <!-- Region 1: string with first/last -->
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① words = ["ab","ba"] 的一个 SCS「aba」：a 出现 2 次，b 出现 1 次</text>

  <rect x="167" y="62" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a₁</text>
  <rect x="237" y="62" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="307" y="62" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a₂</text>

  <text x="190" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">first(a)</text>
  <text x="260" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">first(b)=last(b)</text>
  <text x="330" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">last(a)</text>

  <path d="M 195,100 Q 227,128 255,100" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="126" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">"ab"</text>
  <path d="M 265,100 Q 297,128 325,100" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="126" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">"ba"</text>
  <path d="M 185,100 Q 260,168 335,100" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="10.5" fill="#a06a20" filter="url(#rough2)">重复字母：first(a) → last(a)</text>

  <text x="260" y="186" text-anchor="middle" font-size="10.5" fill="#7a4a2b" filter="url(#rough2)">每条 word 的见证对都可换成「更靠前的 x」和「更靠后的 y」→ 所有边都向前 → 无环即可行</text>

  <path d="M 60,198 L 460,198" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- Region 2: cycle view, two panels -->
  <text x="260" y="220" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② 环只会卡在「只出现 1 次」的字母上——删掉的字母恰好出现 2 次</text>

  <rect x="55" y="232" width="190" height="118" rx="8" fill="#fff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a、b 都只出现 1 次</text>

  <circle cx="105" cy="282" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <circle cx="195" cy="282" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>

  <path d="M 120,282 L 178,282" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="274" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">"ab"</text>
  <path d="M 195,297 Q 150,332 105,297" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="324" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">"ba"</text>
  <text x="150" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 有环，谁也排不到前面</text>

  <rect x="275" y="232" width="190" height="118" rx="8" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">让 a 出现 2 次（删 a 破环）</text>

  <circle cx="312" cy="282" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="312" y="287" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a₁</text>
  <circle cx="378" cy="282" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <circle cx="444" cy="282" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="444" y="287" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a₂</text>

  <path d="M 327,282 L 361,282" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="274" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">"ab"</text>
  <path d="M 393,282 L 427,282" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="274" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">"ba"</text>
  <path d="M 312,297 Q 378,330 444,297" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="378" y="324" text-anchor="middle" font-size="9.5" fill="#a06a20" filter="url(#rough2)">a₂ 无出边</text>
  <text x="370" y="344" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 无环，拓扑序 a₁ b a₂ = "aba"</text>

  <path d="M 60,362 L 460,362" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- Region 3: conclusion -->
  <rect x="55" y="374" width="410" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="396" text-anchor="middle" font-size="11" fill="#7a4a2b" filter="url(#rough2)">③ 「最少让哪些字母出现 2 次」= 图的最小反馈点集 D</text>
  <text x="260" y="416" text-anchor="middle" font-size="10.5" fill="#7a4a2b" filter="url(#rough2)">freq[c]：未出现 = 0，保留 = 1，被删（重复）= 2；最短长度 = |P| + |D|</text>
</svg>
