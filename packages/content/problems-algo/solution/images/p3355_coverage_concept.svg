<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：可行 ⇔ 每个下标被覆盖次数 cov[i] ≥ nums[i]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">nums = [4,3,2,1]，queries = [[1,3],[0,2]] —— 每条查询给覆盖的下标各发一张「减 1 券」</text>

  <!-- nums 行 -->
  <text x="124" y="80" text-anchor="end" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="132" y="58" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="80" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="196" y="58" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="80" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="260" y="58" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="80" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="324" y="58" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="80" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 下标 -->
  <text x="164" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">下标 0</text>
  <text x="228" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="292" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="356" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <!-- 查询区间条 -->
  <rect x="196" y="120" width="192" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="292" y="133" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">query [1,3]</text>
  <rect x="132" y="146" width="192" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="228" y="159" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">query [0,2]</text>
  <path d="M 410 129 L 442 129" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="133" font-size="10" fill="#2f5d24" filter="url(#rough2)">券①</text>
  <path d="M 410 155 L 442 155" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="159" font-size="10" fill="#a07830" filter="url(#rough2)">券②</text>

  <!-- cov 行 -->
  <text x="124" y="200" text-anchor="end" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">cov 券数</text>
  <rect x="132" y="178" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="200" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="196" y="178" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="200" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="260" y="178" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="200" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="324" y="178" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="200" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 逐位比较 -->
  <text x="124" y="243" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">比较</text>
  <text x="164" y="243" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1≥4 ✗</text>
  <text x="228" y="243" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2≥3 ✗</text>
  <text x="292" y="243" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2≥2 ✓</text>
  <text x="356" y="243" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1≥1 ✓</text>

  <!-- 结论框 -->
  <rect x="20" y="262" width="480" height="122" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="284" font-size="10.5" fill="#333" filter="url(#rough2)">① 「选子集」= 每张券可用可不用 → 下标 i 总共可被减 0 ~ cov[i] 中的任意整数次；</text>
  <text x="34" y="304" font-size="10.5" fill="#333" filter="url(#rough2)">② 减法可交换 → 查询顺序无关，n 个下标各自独立判定：想减到 0 ⇔ cov[i] ≥ nums[i]，</text>
  <text x="34" y="324" font-size="10.5" fill="#333" filter="url(#rough2)">   富余没关系（少用几张券），不足必无解；</text>
  <text x="34" y="344" font-size="10.5" fill="#333" filter="url(#rough2)">③ 本例 cov = [1,2,2,1]，下标 0 处 1 &lt; 4 → 券不够，返回 false；</text>
  <text x="34" y="366" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">④ cov 怎么算？区间覆盖计数 → 差分数组，见下一张图。</text>
</svg>
