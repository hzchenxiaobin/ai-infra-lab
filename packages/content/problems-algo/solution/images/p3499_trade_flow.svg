<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，prev / cur 收尾每个 0 段</text>

  <!-- 初始化 -->
  <rect x="160" y="36" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">初始化：ones = 数 '1' 个数</text>
  <text x="260" y="69" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">prev = cur = best = 0</text>

  <path d="M 260 76 L 260 92" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="175" y="94" width="170" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">循环：逐字符 c ∈ t</text>

  <path d="M 260 120 L 260 126" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1 -->
  <polygon points="260,128 335,152 260,176 185,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11.5" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">c == '0' ?</text>

  <!-- 是 → cur++ -->
  <path d="M 335 152 L 362 152" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="347" y="145" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="362" y="138" width="100" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="156" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">cur++</text>

  <!-- 否 ↓ -->
  <path d="M 260 176 L 260 188" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="184" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 菱形 2 -->
  <polygon points="260,190 332,214 260,238 188,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="11.5" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">cur &gt; 0 ?</text>
  <text x="260" y="224" text-anchor="middle" font-size="8.5" fill="#8a6d3a" filter="url(#rough2)">（0 段刚收尾）</text>

  <!-- 否 → 跳过 -->
  <path d="M 332 214 L 356 214" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="207" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="356" y="200" width="106" height="28" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="409" y="218" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">跳过（连续 '1'）</text>

  <!-- 是 ↓ -->
  <path d="M 260 238 L 260 250" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="246" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 更新框 -->
  <rect x="105" y="252" width="310" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">若 prev &gt; 0：best = max(best, prev + cur)</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">prev = cur；cur = 0</text>

  <!-- 回边总线：三处并入，回到循环头 -->
  <path d="M 462 152 L 488 152" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 462 214 L 488 214" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 415 275 L 488 275" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 488 275 L 488 95 L 347 95" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="88" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">取下一字符 ↺</text>

  <!-- 左侧退出通道：扫完 → 返回 -->
  <path d="M 175 95 L 60 95 L 60 324 L 118 324" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="115" y="88" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（扫完）</text>
  <text x="68" y="205" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">扫描结束</text>

  <!-- 返回 -->
  <rect x="120" y="310" width="280" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 ones + best</text>

  <text x="260" y="354" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">t 首尾的 '1' 哨兵保证最后一个 0 段必在循环内收尾，无需循环后补处理</text>
</svg>
