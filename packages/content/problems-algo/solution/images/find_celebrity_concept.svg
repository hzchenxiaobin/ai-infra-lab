<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">搜寻名人核心：每次 knows() 排除一人 — 两遍扫描 O(n)</text>

  <!-- Section A: Celebrity definition -->
  <text x="34" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">名人定义：</text>

  <!-- Person 0 -->
  <ellipse cx="110" cy="90" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="95" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- Person 1 -->
  <ellipse cx="195" cy="90" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="95" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- Celebrity -->
  <ellipse cx="340" cy="90" rx="26" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="340" y="96" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">★</text>

  <!-- Arrows: 0 → celebrity, 1 → celebrity -->
  <path d="M 132 90 Q 200 78 312 88" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 217 90 Q 260 82 314 89" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- Celebrity knows nobody (red X arrow) -->
  <path d="M 368 90 L 440 90" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="452" y="80" font-size="11" fill="#b85450" font-weight="bold">✗ 不认识</text>
  <text x="452" y="95" font-size="10" fill="#b85450">任何人</text>

  <!-- Caption -->
  <rect x="40" y="118" width="480" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="11" fill="#333">名人 = 所有人都认识TA ＋ TA不认识任何人（至多 1 个）</text>

  <!-- Section B: Elimination principle -->
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">排除原理：每次 knows(a, b) 调用排除恰好一人</text>

  <!-- Left panel: knows(a,b) = true -->
  <rect x="30" y="176" width="240" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="150" y="194" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">knows(a, b) = true</text>

  <!-- a (eliminated, red) -->
  <ellipse cx="80" cy="225" rx="20" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="80" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a</text>
  <text x="80" y="258" text-anchor="middle" font-size="9" fill="#b85450">被排除</text>

  <!-- b (new candidate, blue) -->
  <ellipse cx="200" cy="225" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>

  <!-- Arrow a→b -->
  <path d="M 102 225 L 178 225" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="218" text-anchor="middle" font-size="10" fill="#888">认识</text>

  <text x="150" y="272" text-anchor="middle" font-size="10" fill="#555">a 认识 b → a 不是名人 → 候选换成 b</text>

  <!-- Right panel: knows(a,b) = false -->
  <rect x="290" y="176" width="240" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="194" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">knows(a, b) = false</text>

  <!-- a (still candidate, blue) -->
  <ellipse cx="340" cy="225" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>

  <!-- b (eliminated, red) -->
  <ellipse cx="460" cy="225" rx="20" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="460" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">b</text>
  <text x="460" y="258" text-anchor="middle" font-size="9" fill="#b85450">被排除</text>

  <!-- Arrow a→b (dashed, no knowing) -->
  <path d="M 362 225 L 438 225" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#b85450">✗ 不认识</text>

  <text x="410" y="272" text-anchor="middle" font-size="10" fill="#555">a 不认识 b → b 不是名人 → a 仍为候选</text>

  <!-- Section C: Two-pass summary -->
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#888">n−1 次调用 → 排除 n−1 人 → 仅剩 1 名候选（但不一定是名人，需验证）</text>

  <!-- Pass 1 box -->
  <rect x="40" y="322" width="220" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="342" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第一遍：排除法找候选</text>
  <text x="150" y="360" text-anchor="middle" font-size="10" fill="#666">n−1 次 knows() 调用，O(1) 空间</text>

  <!-- Pass 2 box -->
  <rect x="300" y="322" width="220" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">第二遍：验证候选</text>
  <text x="410" y="360" text-anchor="middle" font-size="10" fill="#666">2(n−1) 次双向检查</text>

  <!-- Bottom insight -->
  <rect x="40" y="386" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#333">总计 ≤ 3n 次 knows() 调用 → O(n) 时间 / O(1) 空间</text>
</svg>
