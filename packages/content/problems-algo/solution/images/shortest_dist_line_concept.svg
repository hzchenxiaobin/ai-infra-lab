<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后最小距离必在相邻两点之间</text>

  <!-- Number line -->
  <line x1="40" y1="140" x2="520" y2="140" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <polygon points="520,140 512,136 512,144" fill="#446688" filter="url(#rough2)"/>
  <text x="530" y="144" font-size="11" fill="#446688">x</text>

  <!-- Tick marks and labels: -1, 0, 2, 3, 5 -->
  <!-- Point -1 -->
  <line x1="100" y1="135" x2="100" y2="145" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="100" cy="140" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="128" text-anchor="middle" font-size="11" fill="#333">-1</text>

  <!-- Point 0 -->
  <line x1="160" y1="135" x2="160" y2="145" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="160" cy="140" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="128" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- Point 2 -->
  <line x1="280" y1="135" x2="280" y2="145" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="280" cy="140" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- Point 3 -->
  <line x1="340" y1="135" x2="340" y2="145" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="340" cy="140" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="128" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- Point 5 -->
  <line x1="460" y1="135" x2="460" y2="145" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="460" cy="140" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="128" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- Adjacent gaps highlighted -->
  <!-- Gap -1 to 0 = 1 (min, red) -->
  <path d="M100 168 L100 178 L160 178 L160 168" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="130" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">gap=1 ★min</text>

  <!-- Gap 0 to 2 = 2 (green) -->
  <path d="M160 168 L160 178 L280 178 L280 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="220" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a">gap=2</text>

  <!-- Gap 2 to 3 = 1 (red, also min) -->
  <path d="M280 168 L280 178 L340 178 L340 168" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="310" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">gap=1 ★min</text>

  <!-- Gap 3 to 5 = 2 (green) -->
  <path d="M340 168 L340 178 L460 178 L460 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="400" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a">gap=2</text>

  <!-- Non-adjacent pair: -1 to 5 = 6, dashed -->
  <path d="M100 230 L460 230" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="10" fill="#999">非相邻对: |-1 - 5| = 6 ≥ 任一相邻 gap</text>

  <!-- Callout -->
  <rect x="60" y="260" width="440" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">数学证明：非相邻对的距离 = 中间相邻 gap 之和</text>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#333">|x_j - x_i| = (x_{i+1}-x_i) + (x_{i+2}-x_{i+1}) + ... + (x_j - x_{j-1})</text>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#333">每项 ≥ 0，故和 ≥ 任一单项 → 全局最小必在相邻 gap 中</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">O(n²) 自连接 → O(n log n) 排序 + LAG</text>
</svg>
