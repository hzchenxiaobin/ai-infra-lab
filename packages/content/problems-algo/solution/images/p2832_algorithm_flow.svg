<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两趟单调栈 + 一次合并（栈内下标对应值严格递减）</text>

  <!-- side annotation -->
  <text x="14" y="74" font-size="10" fill="#999" filter="url(#rough2)">被弹出者 ≤ nums[i]，</text>
  <text x="14" y="90" font-size="10" fill="#999" filter="url(#rough2)">不会再当任何人的左边界</text>

  <!-- pass 1 start -->
  <rect x="200" y="40" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="57" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第一趟（左→右）：i = 0 … n−1</text>
  <path d="M 300 66 L 300 78" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="300,80 390,112 300,144 210,112" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="108" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">栈非空 且</text>
  <text x="300" y="124" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">栈顶值 ≤ nums[i]？</text>

  <!-- yes branch: pop -->
  <path d="M 390 112 L 418 112" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="402" y="104" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="420" y="98" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="455" y="116" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹栈</text>
  <path d="M 455 98 C 455 68, 345 56, 306 78" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="392" y="66" font-size="10" fill="#b85450" filter="url(#rough2)">回到判断</text>

  <!-- no branch: record left -->
  <path d="M 300 144 L 300 160" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="158" font-size="10.5" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="185" y="162" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="179" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">left[i] = 栈顶（栈空则 −1）</text>
  <path d="M 300 188 L 300 200" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- push -->
  <rect x="205" y="202" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="219" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">压入 i</text>
  <path d="M 205 215 C 158 215, 158 112, 206 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="152" y="166" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i++</text>
  <text x="152" y="180" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">回到判断</text>

  <!-- pass 2 summary -->
  <path d="M 300 228 L 300 246" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="248" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="266" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第二趟（右→左）：完全对称</text>
  <text x="300" y="284" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">right[i] = 栈顶（栈空则 n）；⚠ 先清空栈再扫</text>
  <path d="M 300 292 L 300 306" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge -->
  <rect x="150" y="308" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="328" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans[i] = right[i] − left[i] − 1</text>
  <path d="M 300 338 L 300 350" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="235" y="352" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="369" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="30" y="392" font-size="10.5" fill="#999" filter="url(#rough2)">均摊复杂度：每个下标每趟至多入栈一次、出栈一次，两趟总操作 ≤ 4n → O(n)</text>
</svg>
