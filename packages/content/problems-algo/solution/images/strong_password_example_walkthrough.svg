<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">示例演算：n&gt;20 情形</text>
  <text x="290" y="42" text-anchor="middle" font-size="11.5" fill="#666">password = "aaaaaabbbbbbccccccdddddd"（24 字符，全小写）</text>

  <rect x="20" y="58" width="540" height="78" fill="#e8f0fe" fill-opacity="0.45" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="78" font-size="11.5" fill="#446688" font-weight="bold">步骤 1：统计基础量</text>
  <text x="34" y="98" font-size="11" fill="#555">• n = 24  →  delete = 24 − 20 = 4</text>
  <text x="34" y="116" font-size="11" fill="#555">• 三类字符全缺 → missing_types = 3</text>
  <text x="34" y="132" font-size="11" fill="#555">• 4 段连续重复：[6, 6, 6, 6]，每段 L%3==0，⌊6/3⌋=2 → replace = 8，one = 4，two = 0</text>

  <rect x="20" y="148" width="540" height="78" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="168" font-size="11.5" fill="#4a7a3a" font-weight="bold">步骤 2：Phase 1 — 优先删 L%3==0 的段（1 删 = 1 减）</text>
  <text x="34" y="188" font-size="11" fill="#555">one_used = min(one=4, delete=4) = 4</text>
  <text x="34" y="206" font-size="11" fill="#555">replace: 8 − 4 = 4 ，  delete: 4 − 4 = 0</text>
  <text x="34" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 4 次删除全部用在 L%3==0 段上，每次都减 1 替换，效率最高</text>

  <rect x="20" y="238" width="540" height="60" fill="#fff8e1" fill-opacity="0.6" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="258" font-size="11.5" fill="#d6a040" font-weight="bold">步骤 3：Phase 2 / 3（本例不触发）</text>
  <text x="34" y="276" font-size="11" fill="#555">delete=0，跳过 Phase 2（two=0）和 Phase 3（delete//3=0）。replace 维持 4</text>
  <text x="34" y="292" font-size="11" fill="#888">若 delete 仍有剩余：Phase 2 删 2 减 1（two 段），Phase 3 每 3 删减 1</text>

  <rect x="20" y="310" width="540" height="78" fill="#fce4ec" fill-opacity="0.5" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="330" font-size="11.5" fill="#b85450" font-weight="bold">步骤 4：汇总答案</text>
  <text x="34" y="350" font-size="11" fill="#555">总操作 = 删除数 + max(剩余 replace, missing_types)</text>
  <text x="34" y="368" font-size="11" fill="#333" font-weight="bold">        = (n−20) + max(replace', missing_types) = 4 + max(4, 3) = 4 + 4 = 8</text>
  <text x="34" y="384" font-size="11" fill="#888">注：替换可同时补缺失种类（3 ≤ 4），故 max 取 4</text>

  <rect x="20" y="400" width="540" height="48" fill="#fff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="420" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">关键直觉：把"删除"花在最划算的段上</text>
  <text x="290" y="438" text-anchor="middle" font-size="10.5" fill="#666">L%3==0 一次删 1 就能减 1 替换；L%3==2 要删 3 才减 1，性价比差 3 倍</text>
</svg>
