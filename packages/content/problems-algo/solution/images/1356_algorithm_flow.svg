<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：算 popcount → 构造复合键 → 排序 → 取值</text>

  <!-- Box 1: 输入 arr -->
  <rect x="180" y="52" width="200" height="34" rx="8" fill="#f5f5f5" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">输入：整数数组 arr</text>
  <path d="M 280 88 L 280 106" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Box 2: 遍历 + popcount -->
  <rect x="140" y="108" width="280" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历 arr：对每个 x</text>
  <text x="280" y="145" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">计算 popcount(x)</text>
  <path d="M 280 156 L 280 174" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Box 3: 构造复合键 -->
  <rect x="160" y="176" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">构造复合键 (popcount(x), x)</text>
  <path d="M 280 212 L 280 230" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Box 4: 排序 -->
  <rect x="170" y="232" width="220" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">按 (popcount, 值) 升序排序</text>
  <path d="M 280 268 L 280 286" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Box 5: 提取 x -->
  <rect x="170" y="288" width="220" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">提取第二维 x 得结果</text>
  <path d="M 280 324 L 280 342" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Box 6: 返回 -->
  <rect x="200" y="344" width="160" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回排序结果</text>

  <!-- 右侧 side note：popcount 求法 -->
  <path d="M 420 131 L 446 131" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <rect x="448" y="92" width="168" height="148" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="532" y="114" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">popcount 求法</text>
  <text x="460" y="138" font-size="10.5" fill="#555" filter="url(#rough2)">① 库函数</text>
  <text x="472" y="153" font-size="10" fill="#888" filter="url(#rough2)">__builtin_popcount</text>
  <text x="472" y="167" font-size="10" fill="#888" filter="url(#rough2)">x.bit_count()  → O(1)</text>
  <text x="460" y="188" font-size="10.5" fill="#555" filter="url(#rough2)">② Brian Kernighan</text>
  <text x="472" y="203" font-size="10" fill="#888" filter="url(#rough2)">x &amp;= x − 1 循环</text>
  <text x="472" y="217" font-size="10" fill="#888" filter="url(#rough2)">→ O(1 的个数)</text>
  <text x="460" y="234" font-size="10.5" fill="#555" filter="url(#rough2)">③ DP 递推（批量）</text>
</svg>
