<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">原型链挂载：last 定义在 Array.prototype 上，全体数组共享；this 指向调用实例</text>

  <!-- ===== Left: prototype chain (vertical) ===== -->
  <!-- instance -->
  <rect x="44" y="56" width="226" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="78" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">数组实例</text>
  <text x="157" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">arr = [null, {}, 3]</text>

  <!-- __proto__ arrow -->
  <path d="M 157 122 L 157 156" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="144" font-size="10" fill="#888" filter="url(#rough2)">[[Prototype]]</text>

  <!-- Array.prototype -->
  <rect x="44" y="160" width="226" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="157" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Array.prototype</text>
  <!-- highlighted last() method -->
  <rect x="60" y="188" width="194" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="157" y="206" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">last() {</text>
  <text x="157" y="222" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">  return this.length</text>
  <text x="157" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">    ? this[len-1] : -1</text>
  <text x="157" y="254" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">}</text>
  <text x="157" y="274" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">（其它方法：push / pop / map …）</text>

  <!-- __proto__ arrow -->
  <path d="M 157 286 L 157 320" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="308" font-size="10" fill="#888" filter="url(#rough2)">[[Prototype]]</text>

  <!-- Object.prototype -->
  <rect x="44" y="324" width="226" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="351" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">Object.prototype（toString …）</text>

  <!-- arrow to null -->
  <path d="M 157 370 L 157 394" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="388" font-size="11" fill="#888" filter="url(#rough2)">null</text>

  <!-- ===== Right: call narrative ===== -->
  <rect x="318" y="120" width="240" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="438" y="146" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">调用 arr.last()</text>
  <line x1="338" y1="158" x2="538" y2="158" stroke="#e0c080" stroke-width="1" filter="url(#rough2)"/>
  <text x="438" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr 自身无 last 属性</text>
  <text x="438" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ 沿 [[Prototype]] 查找</text>
  <text x="438" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 命中 Array.prototype.last</text>
  <text x="438" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">this = arr（调用实例）</text>
  <text x="438" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ 执行并返回 arr 末元素</text>

  <!-- this binding arrow: from narrative box to instance -->
  <path d="M 318 240 C 286 200 268 150 270 120" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="196" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">this</text>

  <!-- result pill -->
  <rect x="372" y="312" width="132" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="438" y="340" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">返回 3</text>
  <text x="438" y="374" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">this[this.length - 1]</text>
</svg>
