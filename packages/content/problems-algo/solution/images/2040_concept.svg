<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：二分答案 v，对每个 x 按正/负/零在有序 nums2 中计数</text>
  <text x="310" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">count(v) 单调不减 → 二分最小 v 使 count(v) ≥ k</text>

  <!-- Binary search bar -->
  <g filter="url(#rough2)">
    <text x="40" y="80" font-size="11" fill="#333" font-weight="bold">二分答案值 v：</text>
    <rect x="130" y="66" width="430" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="13"/>
    <text x="140" y="84" font-size="11" fill="#446688" font-weight="bold">lo = 四角最小</text>
    <text x="540" y="84" font-size="11" fill="#446688" font-weight="bold" text-anchor="end">四角最大 = hi</text>
    <!-- mid marker -->
    <path d="M 300 60 L 300 92" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3"/>
    <text x="300" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mid = (lo+hi)//2</text>
    <text x="300" y="106" text-anchor="middle" font-size="9.5" fill="#888">问：≤ mid 的乘积有几个？</text>
  </g>

  <!-- arrow down to x loop -->
  <path d="M 300 116 L 300 138" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- x loop banner -->
  <rect x="170" y="142" width="260" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="161" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">遍历每个 x = nums1[i]</text>

  <!-- three branch arrows -->
  <path d="M 220 172 L 110 198" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 300 172 L 300 198" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 380 172 L 490 198" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Branch: x > 0 -->
  <rect x="30" y="202" width="180" height="172" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="120" y="223" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x &gt; 0</text>
  <text x="120" y="241" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">不等号方向不变</text>
  <text x="40" y="262" font-size="10.5" fill="#333" filter="url(#rough2)">x·y ≤ v</text>
  <text x="40" y="278" font-size="10.5" fill="#333" filter="url(#rough2)">⟹ y ≤ ⌊v/x⌋</text>
  <text x="40" y="300" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">数「≤ 阈值」的左段</text>
  <text x="40" y="318" font-size="10" fill="#333" filter="url(#rough2)">bisect_right(nums2, ⌊v/x⌋)</text>
  <text x="40" y="338" font-size="9.5" fill="#888" filter="url(#rough2)">nums2 升序 → 左段连续</text>
  <text x="40" y="354" font-size="9.5" fill="#888" filter="url(#rough2)">阈值下取整</text>
  <!-- mini nums2 row -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <rect x="44" y="362" width="22" height="14" fill="#cfe8d5" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
    <rect x="66" y="362" width="22" height="14" fill="#cfe8d5" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
    <rect x="88" y="362" width="22" height="14" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
    <rect x="110" y="362" width="22" height="14" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
    <path d="M 88 360 L 88 384" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3,2"/>
    <text x="84" y="358" font-size="8" fill="#b85450">阈值</text>
  </g>

  <!-- Branch: x < 0 -->
  <rect x="220" y="202" width="180" height="172" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="223" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x &lt; 0 ⚠️陷阱</text>
  <text x="310" y="241" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">除以负数，不等号翻转</text>
  <text x="230" y="262" font-size="10.5" fill="#333" filter="url(#rough2)">x·y ≤ v</text>
  <text x="230" y="278" font-size="10.5" fill="#333" filter="url(#rough2)">⟹ y ≥ ⌈v/x⌉</text>
  <text x="230" y="300" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">数「≥ 阈值」的右段</text>
  <text x="230" y="318" font-size="10" fill="#333" filter="url(#rough2)">len − bisect_left(⌈v/x⌉)</text>
  <text x="230" y="338" font-size="9.5" fill="#888" filter="url(#rough2)">方向反转 + 上取整</text>
  <text x="230" y="354" font-size="9.5" fill="#888" filter="url(#rough2)">C++ 需 ceilDiv 修正</text>
  <!-- mini nums2 row -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <rect x="234" y="362" width="22" height="14" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="2"/>
    <rect x="256" y="362" width="22" height="14" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="2"/>
    <rect x="278" y="362" width="22" height="14" fill="#cfddfa" stroke="#446688" stroke-width="1.2" rx="2"/>
    <rect x="300" y="362" width="22" height="14" fill="#cfddfa" stroke="#446688" stroke-width="1.2" rx="2"/>
    <path d="M 278 360 L 278 384" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3,2"/>
    <text x="284" y="358" font-size="8" fill="#b85450">阈值</text>
  </g>

  <!-- Branch: x == 0 -->
  <rect x="410" y="202" width="180" height="172" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="500" y="223" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">x = 0</text>
  <text x="500" y="241" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">乘积恒为 0</text>
  <text x="420" y="262" font-size="10.5" fill="#333" filter="url(#rough2)">0·y = 0 ≤ v ?</text>
  <text x="420" y="288" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">v ≥ 0 → 全计</text>
  <text x="420" y="304" font-size="10" fill="#333" filter="url(#rough2)">贡献 = len(nums2)</text>
  <text x="420" y="328" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">v &lt; 0 → 不计</text>
  <text x="420" y="344" font-size="10" fill="#333" filter="url(#rough2)">贡献 = 0</text>
  <text x="420" y="366" font-size="9.5" fill="#888" filter="url(#rough2)">整段判定，O(1)</text>

  <!-- arrows converging -->
  <path d="M 120 388 L 280 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 388 L 310 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 388 L 340 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sum + compare -->
  <rect x="150" y="416" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="436" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Σ 三分支贡献 = count(mid)</text>
  <text x="310" y="454" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">count ≥ k → hi = mid；否则 lo = mid+1</text>
</svg>
