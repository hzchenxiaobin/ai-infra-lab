<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">数位和封顶 27：下标 ≥ 28 的格子注定失配</text>

  <!-- 示例行 -->
  <text x="46" y="52" font-size="11" fill="#888" filter="url(#rough2)">以 nums = [1, 10, 11, 999, 1000] 为例：</text>

  <rect x="38" y="60" width="84" height="64" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="76" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#0</text>
  <text x="80" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">1</text>
  <text x="80" y="117" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">s = 1</text>

  <rect x="130" y="60" width="84" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="172" y="76" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">#1</text>
  <text x="172" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">10</text>
  <text x="172" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">s = 1</text>

  <rect x="222" y="60" width="84" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="76" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">#2</text>
  <text x="264" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">11</text>
  <text x="264" y="117" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">s = 2</text>

  <rect x="314" y="60" width="84" height="64" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="356" y="76" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#3</text>
  <text x="356" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">999</text>
  <text x="356" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">s = 27</text>

  <rect x="406" y="60" width="84" height="64" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="76" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">#4</text>
  <text x="448" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">1000</text>
  <text x="448" y="117" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">s = 1</text>

  <text x="172" y="142" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 命中 i = 1（最小）</text>
  <text x="356" y="142" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">s = 27：全场之巅</text>

  <!-- 上界推导 -->
  <rect x="55" y="152" width="410" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s(x) ≤ 9 × 位数，而 x ≤ 1000 中唯一的 4 位数是 1000（s=1）</text>
  <text x="260" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">最大数位和在 999 处：s = 9 + 9 + 9 = 27</text>

  <!-- 下标轴 -->
  <text x="46" y="222" font-size="11" fill="#888" filter="url(#rough2)">把下标轴摊开看（n ≤ 100）：</text>

  <line x1="46" y1="256" x2="162" y2="256" stroke="#4a7a3a" stroke-width="6" filter="url(#rough2)"/>
  <line x1="162" y1="256" x2="474" y2="256" stroke="#b85450" stroke-width="6" filter="url(#rough2)"/>
  <line x1="46" y1="248" x2="46" y2="264" stroke="#333" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="162" y1="248" x2="162" y2="264" stroke="#333" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="474" y1="248" x2="474" y2="264" stroke="#333" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="162" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">27</text>
  <text x="474" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100</text>

  <text x="104" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i ≤ 27 可能命中</text>
  <text x="318" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">i ≥ 28：s ≤ 27 &lt; i 必失配</text>
  <text x="104" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">有效扫描区（至多 28 格）</text>
  <text x="318" y="300" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">白扫区（n − 28 格）</text>

  <!-- 结论 -->
  <rect x="85" y="318" width="350" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">循环上限 = min(n, 28)</text>
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">n = 100 时砍掉 72% 的无效数位和计算</text>
</svg>
