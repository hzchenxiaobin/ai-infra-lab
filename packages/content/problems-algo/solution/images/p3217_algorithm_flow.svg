<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：建集合 O(m) + 一趟扫描 O(n)</text>

  <!-- 开始：建集合 -->
  <rect x="105" y="40" width="230" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums 全部装入哈希集合 s</text>

  <path d="M220,72 L220,92" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="105" y="94" width="230" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dummy.next = head；curr = dummy</text>

  <path d="M220,126 L220,146" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：空判断 -->
  <polygon points="220,148 316,183 220,218 124,183" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">curr.next 为空 ?</text>

  <text x="326" y="178" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M316,183 L366,183" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="370" y="164" width="132" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="436" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 dummy.next</text>
  <text x="436" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 新链表头</text>

  <text x="228" y="234" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <path d="M220,218 L220,242" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2：命中判断 -->
  <polygon points="220,244 322,281 220,318 118,281" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="278" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">curr.next.val ∈ s ?</text>
  <text x="220" y="295" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">（O(1) 哈希查询）</text>

  <text x="330" y="272" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M322,281 L356,281" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 跳过 -->
  <rect x="360" y="262" width="148" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="434" y="278" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">curr.next = curr.next.next</text>
  <text x="434" y="294" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过！curr 原地不动</text>

  <path d="M434,260 L434,183 L324,183" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="446" y="222" font-size="10" fill="#b85450" transform="rotate(90 446 222)" text-anchor="middle" filter="url(#rough2)">回到循环开头</text>

  <text x="228" y="334" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <path d="M220,318 L220,340" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 前进 -->
  <rect x="135" y="342" width="170" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="362" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">curr = curr.next（前进）</text>

  <path d="M135,358 L64,358 L64,183 L116,183" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="56" y="272" font-size="10" fill="#888" transform="rotate(-90 56 272)" text-anchor="middle" filter="url(#rough2)">继续循环</text>

  <!-- 底部注释 -->
  <rect x="60" y="390" width="400" height="30" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="410" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">curr 只进不退，curr.next 每轮恰被检验一次 → 整体 O(n + m)</text>
</svg>
