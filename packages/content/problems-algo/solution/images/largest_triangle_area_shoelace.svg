<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrCyc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">鞋带公式（叉乘法）求三角形面积</text>

  <!-- Triangle -->
  <polygon points="150,240 350,240 230,90" fill="#e8f0fe" fill-opacity="0.6" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- Vertices -->
  <circle cx="150" cy="240" r="6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="350" cy="240" r="6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="230" cy="90" r="6" fill="#446688" filter="url(#rough2)"/>

  <!-- Vertex labels -->
  <text x="110" y="262" font-size="13" fill="#333" filter="url(#rough2)">P₁(x₁,y₁)</text>
  <text x="326" y="262" font-size="13" fill="#333" filter="url(#rough2)">P₂(x₂,y₂)</text>
  <text x="226" y="78" font-size="13" fill="#333" filter="url(#rough2)">P₃(x₃,y₃)</text>

  <!-- Cyclic arrows: P1 -> P2 -> P3 -> P1 -->
  <path d="M 165,248 Q 250,270 335,248" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrCyc)"/>
  <path d="M 345,233 Q 310,160 238,100" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrCyc)"/>
  <path d="M 222,97 Q 165,165 155,232" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrCyc)"/>

  <!-- Formula box -->
  <rect x="40" y="290" width="440" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">S = ½ |x₁(y₂−y₃) + x₂(y₃−y₁) + x₃(y₁−y₂)|</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每项 = 当前点 xₖ × (下一点 y − 上一点 y)，沿红箭头环形循环</text>
</svg>
