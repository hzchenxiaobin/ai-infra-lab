<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">对偶方向：枚举倍数——对每个 b 枚举 b·k, 2b·k, 3b·k, …</text>

  <rect x="28" y="38" width="464" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">反向：把 nums1 计入值域数组 cnt1[0..maxV]（本例 maxV = 12）</text>
  <text x="260" y="74" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">对 nums2 每个去重值 b：以步长 t = b·k 枚举 t, 2t, 3t, … ≤ maxV，命中累加 c·cnt1[v]</text>

  <text x="46" y="104" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">b = 2（c = 1）：步长 t = 2×3 = 6</text>
  <text x="300" y="104" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中 6、12 → 0+1 → 贡献 1</text>

  <path d="M243,108 Q350,88 451,106" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="330" y="86" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">步长 6 跳</text>

  <rect x="46" y="112" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <rect x="82" y="112" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <rect x="118" y="112" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <rect x="154" y="112" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <rect x="190" y="112" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="207" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <rect x="226" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="243" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="262" y="112" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="279" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">7</text>
  <rect x="298" y="112" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">8</text>
  <rect x="334" y="112" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">9</text>
  <rect x="370" y="112" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">10</text>
  <rect x="406" y="112" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="423" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">11</text>
  <rect x="442" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="459" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12</text>

  <text x="46" y="176" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">b = 4（c = 1）：步长 t = 4×3 = 12</text>
  <text x="300" y="176" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中 12 → 1 → 贡献 1</text>

  <rect x="46" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <rect x="82" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <rect x="118" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <rect x="154" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <rect x="190" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="207" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <rect x="226" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="243" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>
  <rect x="262" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="279" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">7</text>
  <rect x="298" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">8</text>
  <rect x="334" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">9</text>
  <rect x="370" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">10</text>
  <rect x="406" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="423" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">11</text>
  <rect x="442" y="184" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="459" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12</text>

  <text x="459" y="228" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">12 = t 本身</text>

  <rect x="28" y="246" width="464" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="269" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 1×(cnt1[6]+cnt1[12]) + 1×cnt1[12] = 1 + 1 = 2 ✓</text>

  <rect x="28" y="296" width="464" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">总步数 = Σ ⌊maxV / (b·k)⌋（对 nums2 去重值 b 求和，调和级数）</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">最坏 V = 10⁶、k = 1、去重值 1…10⁵：约 1.2×10⁷ 步，纯 Python 也轻松</text>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">k 越大步长越大跳得越快；约数法相反——k 越大 x/k 越小试除越省，两法互补</text>

  <text x="260" y="384" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">对比主解（枚举约数）O(D·√(V/k))：最坏约 10⁸ 次试除，Python 有超时风险</text>
</svg>
