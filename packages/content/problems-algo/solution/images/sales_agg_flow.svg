<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 逻辑执行顺序</text>

  <!-- FROM -->
  <rect x="60" y="48" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="68" font-size="12.5" fill="#446688" font-weight="bold">1. FROM Sales</text>
  <text x="80" y="84" font-size="10.5" fill="#555">读取源表全部行（sale_id, product_id, year, quantity, price）</text>

  <path d="M 290 94 L 290 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- GROUP BY -->
  <rect x="60" y="118" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="138" font-size="12.5" fill="#4a7a3a" font-weight="bold">2. GROUP BY product_id</text>
  <text x="80" y="154" font-size="10.5" fill="#555">按 product_id 把行归并为分组，每组 = 一个产品的所有销售行</text>

  <path d="M 290 164 L 290 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- SELECT + SUM -->
  <rect x="60" y="188" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="208" font-size="12.5" fill="#d6a040" font-weight="bold">3. SELECT product_id, SUM(quantity) AS total_quantity</text>
  <text x="80" y="224" font-size="10.5" fill="#555">对每组的 quantity 列求和，输出 product_id 与合计销量</text>

  <path d="M 290 234 L 290 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="60" y="258" width="460" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="278" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">结果集（每个 product_id 一行）</text>
  <text x="290" y="296" text-anchor="middle" font-size="10.5" fill="#555">product_id | total_quantity</text>

  <!-- Note box -->
  <rect x="50" y="326" width="480" height="78" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="346" font-size="11" fill="#555" font-weight="bold">⚠️ 为什么不需要 JOIN Product？</text>
  <text x="70" y="362" font-size="10.5" fill="#888">输出列只有 product_id 和总销量，product_name 不在结果中。</text>
  <text x="70" y="378" font-size="10.5" fill="#888">仅在 Sales 表上 GROUP BY 即可覆盖所有“有销售”的产品。</text>
  <text x="70" y="394" font-size="10.5" fill="#888">若要输出产品名或包含“零销量”产品，才需 LEFT JOIN Product。</text>
</svg>
