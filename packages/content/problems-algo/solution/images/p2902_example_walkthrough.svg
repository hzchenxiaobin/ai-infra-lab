<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[2,1,4,2,7], l=1, r=5</text>

  <!-- table header -->
  <text x="130" y="56" font-size="11" fill="#888">阶段</text>
  <text x="200" y="56" text-anchor="middle" font-size="11" fill="#888">f[0]</text>
  <text x="245" y="56" text-anchor="middle" font-size="11" fill="#888">f[1]</text>
  <text x="290" y="56" text-anchor="middle" font-size="11" fill="#888">f[2]</text>
  <text x="335" y="56" text-anchor="middle" font-size="11" fill="#888">f[3]</text>
  <text x="380" y="56" text-anchor="middle" font-size="11" fill="#888">f[4]</text>
  <text x="425" y="56" text-anchor="middle" font-size="11" fill="#888">f[5]</text>

  <!-- row 1: init -->
  <text x="130" y="82" font-size="11" fill="#555">初始（空集）</text>
  <rect x="182" y="68" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="84" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="227" y="68" width="36" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="84" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="272" y="68" width="36" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="290" y="84" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="317" y="68" width="36" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="84" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="362" y="68" width="36" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="380" y="84" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="407" y="68" width="36" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="425" y="84" text-anchor="middle" font-size="11" fill="#999">0</text>

  <!-- row 2: v=1 -->
  <text x="130" y="114" font-size="11" fill="#555">+ v=1, c=1</text>
  <rect x="182" y="100" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="227" y="100" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="272" y="100" width="36" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="290" y="116" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="317" y="100" width="36" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="116" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="362" y="100" width="36" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="380" y="116" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="407" y="100" width="36" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="425" y="116" text-anchor="middle" font-size="11" fill="#999">0</text>

  <!-- row 3: v=2 -->
  <text x="130" y="146" font-size="11" fill="#555">+ v=2, c=2</text>
  <rect x="182" y="132" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="148" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="227" y="132" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="148" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="272" y="132" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="148" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="317" y="132" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="148" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="362" y="132" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="148" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="407" y="132" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="148" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- row 4: v=4 -->
  <text x="130" y="178" font-size="11" fill="#555">+ v=4, c=1</text>
  <rect x="182" y="164" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="227" y="164" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="272" y="164" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="317" y="164" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="362" y="164" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="407" y="164" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- row 5: v=7 skip -->
  <text x="130" y="210" font-size="11" fill="#555">v=7 &gt; r=5</text>
  <text x="230" y="210" font-size="11" fill="#b85450">跳过（单选 7 已超上界）</text>

  <!-- answer -->
  <rect x="120" y="226" width="330" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="285" y="251" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = f[1]+f[2]+f[3]+f[4]+f[5] = 7</text>

  <!-- enumerate the 7 subsets -->
  <text x="60" y="292" font-size="12" fill="#4a7a3a" font-weight="bold">7 个子多重集合:</text>
  <rect x="55" y="302" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="87" y="320" text-anchor="middle" font-size="11" fill="#333">{1}</text>
  <rect x="127" y="302" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="159" y="320" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <rect x="199" y="302" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="231" y="320" text-anchor="middle" font-size="11" fill="#333">{4}</text>
  <rect x="271" y="302" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="309" y="320" text-anchor="middle" font-size="11" fill="#333">{2,2}</text>
  <rect x="355" y="302" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="393" y="320" text-anchor="middle" font-size="11" fill="#333">{1,2}</text>

  <rect x="55" y="336" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="93" y="354" text-anchor="middle" font-size="11" fill="#333">{1,4}</text>
  <rect x="139" y="336" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="185" y="354" text-anchor="middle" font-size="11" fill="#333">{1,2,2}</text>

  <text x="260" y="354" font-size="11" fill="#888">和分别为 1,2,4,4,3,5,5 → 均落在 [1,5]</text>

  <rect x="290" y="336" width="210" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="395" y="354" text-anchor="middle" font-size="11" fill="#d6a040">两个 {2} 只算一种选法</text>
</svg>
