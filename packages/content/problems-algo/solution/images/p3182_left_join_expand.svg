<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">机制：两步连接把除法摊平成一张可数的中间表</text>

  <!-- Step 1 box -->
  <rect x="16" y="36" width="232" height="128" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="132" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① JOIN courses ON major</text>
  <text x="132" y="67" text-anchor="middle" font-size="8" fill="#557799" filter="url(#rough2)">每个学生 × 本专业每门课（只画 1、2 号）</text>
  <rect x="30" y="74" width="48" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="54" y="86" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">sid</text>
  <rect x="78" y="74" width="96" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="126" y="86" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cid（专业课）</text>

  <rect x="30" y="90" width="48" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="102" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="78" y="90" width="96" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="126" y="102" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">101</text>

  <rect x="30" y="106" width="48" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="118" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="78" y="106" width="96" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="126" y="118" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">102</text>

  <rect x="30" y="122" width="48" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="134" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="78" y="122" width="96" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="126" y="134" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">101</text>

  <rect x="30" y="138" width="48" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="150" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="78" y="138" width="96" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="126" y="150" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">102</text>

  <!-- arrow step1 -> step3 -->
  <path d="M 248 96 C 258 96, 258 60, 258 54" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2 box -->
  <rect x="16" y="172" width="232" height="150" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="132" y="190" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② LEFT JOIN enrollments</text>
  <text x="132" y="203" text-anchor="middle" font-size="8" fill="#557799" filter="url(#rough2)">ON (student_id, course_id)：选了的贴成绩，没选的补 NULL</text>
  <rect x="30" y="210" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="222" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">sid</text>
  <rect x="70" y="210" width="42" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="91" y="222" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cid</text>
  <rect x="112" y="210" width="54" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="139" y="222" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">grade</text>
  <rect x="166" y="210" width="64" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="198" y="222" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold" filter="url(#rough2)">grade='A'</text>

  <rect x="30" y="226" width="40" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="238" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="226" width="42" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="91" y="238" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">101</text>
  <rect x="112" y="226" width="54" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="139" y="238" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="166" y="226" width="64" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="198" y="238" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="30" y="242" width="40" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="254" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="242" width="42" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="91" y="254" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">102</text>
  <rect x="112" y="242" width="54" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="139" y="254" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="166" y="242" width="64" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="198" y="254" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="30" y="258" width="40" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="270" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="70" y="258" width="42" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="91" y="270" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">101</text>
  <rect x="112" y="258" width="54" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="139" y="270" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="166" y="258" width="64" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="198" y="270" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="30" y="274" width="40" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="286" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="70" y="274" width="42" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="91" y="286" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">102</text>
  <rect x="112" y="274" width="54" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="139" y="286" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="166" y="274" width="64" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="198" y="286" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="30" y="290" width="40" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="302" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="70" y="290" width="42" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="91" y="302" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">105</text>
  <rect x="112" y="290" width="54" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="139" y="302" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">NULL</text>
  <rect x="166" y="290" width="64" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="198" y="302" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="132" y="317" text-anchor="middle" font-size="7.5" fill="#a04a46" filter="url(#rough2)">假想行：新课 105 未选 → NULL：占分母、不进分子</text>

  <!-- arrow step2 -> verdicts -->
  <path d="M 248 244 C 266 244, 266 120, 258 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3 header -->
  <rect x="262" y="36" width="242" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="383" y="58" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ GROUP BY student_id + HAVING</text>

  <!-- verdict card 1 -->
  <rect x="262" y="78" width="242" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="383" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sid = 1：SUM = 2，COUNT = 2 → ✓</text>
  <text x="383" y="110" text-anchor="middle" font-size="8.5" fill="#557799" filter="url(#rough2)">每行都是 A 行 → 全修全 A</text>

  <!-- verdict card 2 -->
  <rect x="262" y="124" width="242" height="40" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="383" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">sid = 2：SUM = 1，COUNT = 2 → ✗</text>
  <text x="383" y="156" text-anchor="middle" font-size="8.5" fill="#a04a46" filter="url(#rough2)">101 是 B → 分子缺 1（漏选亦同）</text>

  <!-- why LEFT JOIN box -->
  <rect x="262" y="172" width="242" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="383" y="190" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⚠ 为什么必须 LEFT JOIN？</text>
  <text x="383" y="206" text-anchor="middle" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">INNER JOIN 会删掉「未选」的行——</text>
  <text x="383" y="219" text-anchor="middle" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">只修 1 门且拿 A 的学生反而混过判定</text>
  <text x="383" y="234" text-anchor="middle" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">LEFT JOIN 把未选变成 NULL 行，让计数失配</text>

  <!-- NULL rules box -->
  <rect x="262" y="252" width="242" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="383" y="268" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">NULL 流动三则（三值逻辑）</text>
  <text x="383" y="284" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">· LEFT JOIN 失配 → grade = NULL</text>
  <text x="383" y="297" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">· NULL = 'A' → NULL（不是 0），SUM 跳过</text>
  <text x="383" y="310" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">· 'B' → 0：占分母、不进分子</text>

  <!-- bottom strip -->
  <rect x="16" y="330" width="490" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="261" y="345" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 一条 HAVING 收口 → ⑤ ORDER BY student_id 升序输出 {1, 3}</text>
</svg>
