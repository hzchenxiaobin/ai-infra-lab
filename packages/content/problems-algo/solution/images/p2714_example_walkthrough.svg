<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：1→0→2→3，两次跨越白嫖权 4 与权 6</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">k=2；只剩权 2 的边付费，总代价 = 2</text>

  <!-- ===== chain graph ===== -->
  <!-- edge 1-0 : hop (free) -->
  <path d="M 108 140 L 196 140" stroke="#4a7a3a" stroke-width="2.6" fill="none"
        stroke-dasharray="7 5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="152" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">跨越 免费</text>
  <text x="152" y="158" text-anchor="middle" font-size="9" fill="#9aa" text-decoration="line-through">w=4</text>

  <!-- edge 0-2 : pay 2 -->
  <path d="M 244 140 L 332 140" stroke="#4a7a3a" stroke-width="2.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">付费 +2</text>
  <text x="288" y="158" text-anchor="middle" font-size="9" fill="#666">w=2</text>

  <!-- edge 2-3 : hop (free) -->
  <path d="M 388 140 L 476 140" stroke="#4a7a3a" stroke-width="2.6" fill="none"
        stroke-dasharray="7 5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="432" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">跨越 免费</text>
  <text x="432" y="158" text-anchor="middle" font-size="9" fill="#9aa" text-decoration="line-through">w=6</text>

  <!-- nodes -->
  <ellipse cx="84" cy="140" rx="26" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="84" y="145" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <text x="84" y="180" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">起点 s</text>

  <ellipse cx="220" cy="140" rx="24" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="145" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>

  <ellipse cx="356" cy="140" rx="24" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="145" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>

  <ellipse cx="500" cy="140" rx="26" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="500" y="145" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">3</text>
  <text x="500" y="180" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">终点 d</text>

  <!-- ===== cost progression ===== -->
  <text x="40" y="220" font-size="11" fill="#446688" font-weight="bold">累计代价演进</text>

  <g font-size="11">
    <!-- step 0: at node1, cost0 -->
    <rect x="40" y="232" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="80" y="250" text-anchor="middle" font-size="10" fill="#888">在 1 (c=0)</text>
    <text x="80" y="265" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>

    <!-- arrow -->
    <path d="M 122 252 L 138 252" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- step 1: hop to 0, +0 -->
    <rect x="142" y="232" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="187" y="250" text-anchor="middle" font-size="10" fill="#888">跨到 0 (c=1)</text>
    <text x="187" y="265" text-anchor="middle" fill="#446688" font-weight="bold">+0 = 0</text>

    <path d="M 234 252 L 250 252" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- step 2: pay to 2, +2 -->
    <rect x="254" y="232" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="299" y="250" text-anchor="middle" font-size="10" fill="#888">付到 2 (c=1)</text>
    <text x="299" y="265" text-anchor="middle" fill="#446688" font-weight="bold">+2 = 2</text>

    <path d="M 346 252 L 362 252" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- step 3: hop to 3, +0 -->
    <rect x="366" y="232" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="411" y="250" text-anchor="middle" font-size="10" fill="#888">跨到 3 (c=2)</text>
    <text x="411" y="265" text-anchor="middle" fill="#b85450" font-weight="bold">+0 = 2</text>

    <!-- answer -->
    <path d="M 458 252 L 472 252" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <rect x="476" y="232" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
    <text x="508" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">答案</text>
    <text x="508" y="270" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <text x="280" y="290" text-anchor="middle" font-size="10" fill="#888">虚线=跨越(免费) / 实线=付费；两次跨越用满 k=2，恰掉两条最贵的边</text>
</svg>
