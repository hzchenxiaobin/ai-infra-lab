<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一个设备当"回收站"，其余设备的评分全部升到次小值 b</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">自拟示例 units = [[1,3],[2,2],[4,6]] —— 红格 = 各设备的最小值 a，绿格 = 次小值 b</text>

  <!-- 操作前：三个设备 -->
  <text x="24" y="96" font-size="9.5" fill="#999" filter="url(#rough2)">操作前</text>
  <g filter="url(#rough2)">
    <rect x="56" y="56" width="136" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="124" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">设备 0</text>
    <rect x="78" y="80" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="91" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
    <rect x="110" y="80" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="123" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
    <text x="124" y="124" text-anchor="middle" font-size="9" fill="#555">rating = a₀ = 1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="196" y="56" width="136" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="264" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">设备 1</text>
    <rect x="218" y="80" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="231" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
    <rect x="250" y="80" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="263" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
    <text x="264" y="124" text-anchor="middle" font-size="9" fill="#555">rating = a₁ = 2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="336" y="56" width="136" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="404" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">设备 2</text>
    <rect x="358" y="80" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="371" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
    <rect x="390" y="80" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="403" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">6</text>
    <text x="404" y="124" text-anchor="middle" font-size="9" fill="#555">rating = a₂ = 4</text>
  </g>

  <!-- 移除最小值 → 回收站 -->
  <path d="M 91 112 C 91 148, 190 148, 234 166" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 371 112 C 371 148, 330 148, 294 166" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="146" y="150" text-anchor="middle" font-size="8" fill="#8a6d1f" filter="url(#rough2)">移除 a₀ = 1</text>
  <text x="376" y="150" text-anchor="middle" font-size="8" fill="#8a6d1f" filter="url(#rough2)">移除 a₂ = 4</text>

  <!-- 操作后 -->
  <text x="24" y="210" font-size="9.5" fill="#999" filter="url(#rough2)">操作后</text>
  <g filter="url(#rough2)">
    <rect x="56" y="168" width="136" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="124" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">设备 0（作源）</text>
    <rect x="111" y="190" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="124" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
    <text x="124" y="238" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">rating = b₀ = 3</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="196" y="168" width="136" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="264" y="184" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">设备 1 · 回收站</text>
    <rect x="216" y="190" width="22" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <text x="227" y="206" text-anchor="middle" font-size="10" fill="#666">2</text>
    <rect x="240" y="190" width="22" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <text x="251" y="206" text-anchor="middle" font-size="10" fill="#666">2</text>
    <rect x="264" y="190" width="22" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="275" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
    <rect x="288" y="190" width="22" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="299" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
    <text x="264" y="230" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">rating = 1 = g</text>
    <text x="264" y="244" text-anchor="middle" font-size="8" fill="#8a6d1f">收进所有最小值，被压到全局最小</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="336" y="168" width="136" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="404" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">设备 2（作源）</text>
    <rect x="391" y="190" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="404" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a">6</text>
    <text x="404" y="238" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">rating = b₂ = 6</text>
  </g>

  <!-- 底部公式框 -->
  <rect x="30" y="262" width="460" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">答案 = Σb − min b + g = (3 + 2 + 6) − 2 + 1 = 10</text>
  <text x="260" y="306" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">上界：每个设备评分 ≤ 自己的 b；g 单元的归宿设备评分必为 g ⇒ 总和 ≤ g + 其余 b 之和</text>
  <text x="260" y="322" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">构造：除回收站外全部作源、各移除最小值发给它；回收站选 b 最小者，牺牲的潜力最少</text>
  <text x="260" y="338" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">本例 b₁ = 2 最小 → 设备 1 当回收站：自己被压到 g = 1，换来其余设备升满各自的 b</text>
</svg>
