<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 2, 3, 3, 2, 2]，mx = max(nums) = 3</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">维护 cur = 当前等于 mx 的连续段长度；ans = 其历史最大值</text>

  <!-- Table grid: columns x=75,125,215,325,405,485 ; header y=58-88 ; rows h=28 -->
  <!-- column boundaries vertical lines -->
  <rect x="75" y="58" width="410" height="228" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 125 58 L 125 286" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 215 58 L 215 286" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 325 58 L 325 286" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 405 58 L 405 286" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 75 88 L 485 88" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- highlight rows i=2,3 (y=88-116, 116-144) green -->
  <rect x="75" y="116" width="410" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="75" y="144" width="410" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <!-- redraw grid over highlight so borders crisp -->
  <rect x="75" y="58" width="410" height="228" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 125 58 L 125 286" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 215 58 L 215 286" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 325 58 L 325 286" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 405 58 L 405 286" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 75 88 L 485 88" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- Header -->
  <text x="100" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="170" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">== mx ?</text>
  <text x="365" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">cur</text>
  <text x="445" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- Row 0: i=0, 1, no, cur=0, ans=0 ; y center 102 -->
  <text x="100" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="170" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="270" y="106" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="365" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- Row 1: i=1, 2, no, 0, 0 ; center 134 -->
  <text x="100" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="170" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="365" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- Row 2: i=2, 3, yes, 1, 1 ; center 162 (green) -->
  <text x="100" y="162" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="170" y="162" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="365" y="162" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="445" y="162" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Row 3: i=3, 3, yes, 2, 2 ; center 190 (green, ans bold) -->
  <text x="100" y="190" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="170" y="190" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="270" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="365" y="190" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="445" y="190" text-anchor="middle" font-size="12" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 4: i=4, 2, no, 0, 2 ; center 218 -->
  <text x="100" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="170" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="270" y="218" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="365" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- Row 5: i=5, 2, no, 0, 2 ; center 246 -->
  <text x="100" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="170" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="270" y="246" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="365" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- horizontal row separators -->
  <path d="M 75 116 L 485 116 M 75 144 L 485 144 M 75 172 L 485 172 M 75 200 L 485 200 M 75 228 L 485 228 M 75 256 L 485 256" stroke="#446688" stroke-width="1" opacity="0.5" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">最长连续段为 [3, 3]（i = 2, 3），长度 2 → 返回 2</text>
</svg>
