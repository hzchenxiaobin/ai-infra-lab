<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：order 的扫描顺序 = 答案顺序，集合只管「是不是朋友」</text>

  <!-- top row: friends -> set -->
  <rect x="30" y="44" width="175" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="63" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">friends = [1, 3, 4]</text>
  <text x="117" y="80" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">严格递增 = ID 序 ≠ 名次序</text>

  <path d="M 207 68 L 233 68" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="237" y="44" width="140" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="307" y="63" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">fs = {1, 3, 4}</text>
  <text x="307" y="80" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">成员判定 O(1)</text>

  <rect x="413" y="44" width="122" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="474" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">order 是 1..n 排列</text>
  <text x="474" y="80" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">⇒ bool is[n+1] 代劳</text>

  <!-- order row -->
  <text x="212" y="124" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">order（完成顺序，名次从左到右）</text>

  <rect x="30" y="134" width="60" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="156" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="60" y="173" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">第1名 ✓</text>

  <rect x="106" y="134" width="60" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="136" y="156" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="136" y="173" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">第2名 ✓</text>

  <rect x="182" y="134" width="60" height="48" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="212" y="156" text-anchor="middle" font-size="15" fill="#999" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="212" y="173" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">第3名 ✗</text>

  <rect x="258" y="134" width="60" height="48" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="288" y="156" text-anchor="middle" font-size="15" fill="#999" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="288" y="173" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">第4名 ✗</text>

  <rect x="334" y="134" width="60" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="364" y="156" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="364" y="173" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">第5名 ✓</text>

  <!-- legend -->
  <text x="474" y="148" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">绿 = 朋友，保留</text>
  <text x="474" y="164" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">灰 = 非朋友，跳过</text>

  <!-- filter arrows -->
  <path d="M 60 186 L 60 242" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 136 186 L 136 242" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 364 186 L 364 242" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result row -->
  <rect x="30" y="248" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="60" y="275" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="106" y="248" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="136" y="275" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="334" y="248" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="364" y="275" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="474" y="266" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = [3, 1, 4]</text>
  <text x="474" y="282" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">相对顺序原样保留</text>

  <!-- insight -->
  <rect x="30" y="322" width="500" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">顺序信息的唯一来源：x 在 order 中的相对位置</text>
  <text x="280" y="365" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">friends 的「严格递增」是干扰项——ID 大小与名次无关（示例 2：[2,5] → [5,2]）</text>
</svg>
