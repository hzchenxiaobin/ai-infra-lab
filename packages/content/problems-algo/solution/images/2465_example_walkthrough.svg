<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：nums = [4,1,4,0,3,5] → 排序首尾配对 → 不同平均值 2</text>

  <!-- original nums -->
  <text x="40" y="56" font-size="11" fill="#888">nums</text>
  <rect x="80" y="40" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="62" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="120" y="40" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="62" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="160" y="40" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="62" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="200" y="40" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="240" y="40" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="280" y="40" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="13" fill="#333">5</text>

  <!-- arrow sort -->
  <path d="M 270 80 L 270 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="95" font-size="11" fill="#446688">① 排序得 sorted = [0,1,3,4,4,5]</text>

  <!-- sorted with pair arcs -->
  <rect x="100" y="106" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="128" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="160" y="106" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="220" y="106" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="128" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="280" y="106" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="340" y="106" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="128" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="400" y="106" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="128" text-anchor="middle" font-size="13" fill="#333">5</text>
  <!-- arcs -->
  <path d="M 120 106 Q 270 86 420 106" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 180 106 Q 270 96 360 106" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 240 106 Q 270 104 300 106" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- arrow to table -->
  <path d="M 270 144 L 270 162" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="159" font-size="11" fill="#446688">② 逐对求和、入集合</text>

  <!-- table header -->
  <rect x="40" y="168" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="185" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="170" y="185" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">配对 (a,b)</text>
  <text x="260" y="185" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">和 s=a+b</text>
  <text x="350" y="185" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">平均值</text>
  <text x="450" y="185" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">集合 set</text>
  <path d="M 120 168 L 120 262" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 215 168 L 215 262" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 305 168 L 305 262" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 395 168 L 395 262" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- row 0 -->
  <rect x="40" y="194" width="460" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="212" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="170" y="212" text-anchor="middle" font-size="11.5" fill="#446688">(0, 5)</text>
  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="350" y="212" text-anchor="middle" font-size="12" fill="#333">2.5</text>
  <text x="450" y="212" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">{5}</text>

  <!-- row 1 -->
  <rect x="40" y="222" width="460" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="170" y="240" text-anchor="middle" font-size="11.5" fill="#4a7a3a">(1, 4)</text>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5（重复）</text>
  <text x="350" y="240" text-anchor="middle" font-size="12" fill="#333">2.5</text>
  <text x="450" y="240" text-anchor="middle" font-size="11.5" fill="#888">{5}（不变）</text>

  <!-- row 2 -->
  <rect x="40" y="250" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="170" y="268" text-anchor="middle" font-size="11.5" fill="#4a7a3a">(3, 4)</text>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7（新增）</text>
  <text x="350" y="268" text-anchor="middle" font-size="12" fill="#333">3.5</text>
  <text x="450" y="268" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">{5, 7}</text>

  <!-- arrow -->
  <path d="M 270 280 L 270 298" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="295" font-size="11" fill="#4a7a3a">③ 集合大小 |{5, 7}| = 2 → 不同平均值数</text>

  <!-- result -->
  <rect x="150" y="302" width="240" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="330" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">ans = 2 ✓</text>

  <!-- notes -->
  <text x="40" y="366" font-size="10.5" fill="#888">• 三轮配对得到平均值 2.5、2.5、3.5，去重后 {2.5, 3.5} 共 2 个</text>
  <text x="40" y="384" font-size="10.5" fill="#888">• 配对由排序固定：无需逐轮真的删 min/max，排序后 i 与 n−1−i 一一配对</text>
</svg>
