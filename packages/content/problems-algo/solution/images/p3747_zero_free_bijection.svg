<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="28" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：删零映射的像集 = [1, n] 中不含数字 0 的整数全体</text>

  <!-- 左：定义域 x ∈ [1,n] -->
  <rect x="55" y="42" width="130" height="232" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">x ∈ [1, n]</text>
  <text x="120" y="92"  text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="120" y="120" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">7</text>
  <text x="120" y="148" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">10</text>
  <text x="120" y="176" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">11</text>
  <text x="120" y="204" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">20</text>
  <text x="120" y="232" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">101</text>
  <text x="120" y="260" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">105</text>

  <!-- 右：像（无零数） -->
  <rect x="375" y="42" width="130" height="232" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">删零后记下</text>
  <text x="440" y="92"  text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">1</text>
  <text x="440" y="120" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">7</text>
  <text x="440" y="148" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="440" y="176" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">11</text>
  <text x="440" y="204" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="440" y="232" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="440" y="260" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">15</text>

  <!-- 删零箭头（多对一） -->
  <path d="M 187 88 L 371 88"  fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 187 116 L 371 116" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 187 144 L 371 144" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 187 172 L 371 172" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 187 200 L 371 200" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 187 228 L 371 228" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 187 256 L 371 256" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="279" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">删零（去掉所有 0）</text>

  <!-- 重复值圈注 -->
  <ellipse cx="440" cy="143" rx="15" ry="11" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <ellipse cx="440" cy="227" rx="15" ry="11" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">红色 = 重复记下（10→1、101→11 撞车），不同值只算一次</text>

  <!-- ① 正向 -->
  <rect x="30" y="300" width="245" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">① 正向：删零只删不加</text>
  <text x="152" y="338" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">⇒ 结果 ≤ x ≤ n，且不含 0</text>

  <!-- ② 反向 -->
  <rect x="285" y="300" width="245" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="407" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">② 反向：无零数 y ≤ n</text>
  <text x="407" y="338" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">⇒ 令 x = y，必被记下</text>

  <!-- 结论 -->
  <rect x="30" y="368" width="500" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">结论：答案 = [1, n] 中「十进制不含 0」的整数个数 → 转成纯计数问题</text>
</svg>
