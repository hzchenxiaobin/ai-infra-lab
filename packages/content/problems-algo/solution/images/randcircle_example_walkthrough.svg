<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：R = 1，圆心 (0, 0)</text>

  <!-- Table header -->
  <rect x="30" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="50" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">#</text>

  <rect x="70" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="100" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">U₁</text>

  <rect x="130" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">U₂</text>

  <rect x="190" y="48" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="235" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">θ = 2πU₁</text>

  <rect x="280" y="48" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="320" y="68" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ρ = √U₂</text>

  <rect x="360" y="48" width="85" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="402" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">x</text>

  <rect x="445" y="48" width="85" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="487" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">y</text>

  <!-- Row 1 -->
  <rect x="30" y="80" width="40" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="70" y="80" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#333">0.25</text>
  <rect x="130" y="80" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="100" text-anchor="middle" font-size="11" fill="#333">0.16</text>
  <rect x="190" y="80" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="100" text-anchor="middle" font-size="11" fill="#333">π/2 ≈ 1.57</text>
  <rect x="280" y="80" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="320" y="100" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0.40</text>
  <rect x="360" y="80" width="85" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="402" y="100" text-anchor="middle" font-size="11" fill="#333">0.00</text>
  <rect x="445" y="80" width="85" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="487" y="100" text-anchor="middle" font-size="11" fill="#333">0.40</text>

  <!-- Row 2 -->
  <rect x="30" y="112" width="40" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="132" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="70" y="112" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="132" text-anchor="middle" font-size="11" fill="#333">0.50</text>
  <rect x="130" y="112" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="132" text-anchor="middle" font-size="11" fill="#333">0.64</text>
  <rect x="190" y="112" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="132" text-anchor="middle" font-size="11" fill="#333">π ≈ 3.14</text>
  <rect x="280" y="112" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0.80</text>
  <rect x="360" y="112" width="85" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="402" y="132" text-anchor="middle" font-size="11" fill="#333">-0.80</text>
  <rect x="445" y="112" width="85" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="487" y="132" text-anchor="middle" font-size="11" fill="#333">0.00</text>

  <!-- Row 3 -->
  <rect x="30" y="144" width="40" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="164" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="70" y="144" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#333">0.125</text>
  <rect x="130" y="144" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="164" text-anchor="middle" font-size="11" fill="#333">0.49</text>
  <rect x="190" y="144" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="164" text-anchor="middle" font-size="11" fill="#333">π/4 ≈ 0.79</text>
  <rect x="280" y="144" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="320" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0.70</text>
  <rect x="360" y="144" width="85" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="402" y="164" text-anchor="middle" font-size="11" fill="#333">0.50</text>
  <rect x="445" y="144" width="85" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="487" y="164" text-anchor="middle" font-size="11" fill="#333">0.50</text>

  <!-- Row 4 -->
  <rect x="30" y="176" width="40" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="196" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="70" y="176" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="196" text-anchor="middle" font-size="11" fill="#333">0.75</text>
  <rect x="130" y="176" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="196" text-anchor="middle" font-size="11" fill="#333">0.81</text>
  <rect x="190" y="176" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="196" text-anchor="middle" font-size="11" fill="#333">3π/2 ≈ 4.71</text>
  <rect x="280" y="176" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0.90</text>
  <rect x="360" y="176" width="85" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="402" y="196" text-anchor="middle" font-size="11" fill="#333">0.00</text>
  <rect x="445" y="176" width="85" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="487" y="196" text-anchor="middle" font-size="11" fill="#333">-0.90</text>

  <!-- Mini disk visualization of the 4 points -->
  <ellipse cx="280" cy="300" rx="80" ry="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="280" cy="300" r="2" fill="#333" filter="url(#rough2)"/>
  <text x="288" y="304" font-size="9" fill="#333">O</text>

  <!-- point 1: (0, 0.40) -> screen (280, 300-32) = (280, 268) (y up = minus) -->
  <line x1="280" y1="300" x2="280" y2="268" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="280" cy="268" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="292" y="266" font-size="10" fill="#d6a040" font-weight="bold">1</text>

  <!-- point 2: (-0.80, 0) -> screen (280-64, 300) = (216, 300) -->
  <line x1="280" y1="300" x2="216" y2="300" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="216" cy="300" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="200" y="296" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- point 3: (0.50, 0.50) -> screen (280+40, 300-40) = (320, 260) -->
  <line x1="280" y1="300" x2="320" y2="260" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="320" cy="260" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="330" y="256" font-size="10" fill="#b85450" font-weight="bold">3</text>

  <!-- point 4: (0, -0.90) -> screen (280, 300+72) = (280, 372) -->
  <line x1="280" y1="300" x2="280" y2="372" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="280" cy="372" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="292" y="378" font-size="10" fill="#446688" font-weight="bold">4</text>

  <!-- note -->
  <rect x="60" y="392" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#666">注意 U₂=0.16 → ρ=0.40（非 0.16）：√U 把小值「拉开」，补偿近心处面积小</text>
</svg>
