<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：行掩码 ⊆ 选中列掩码 → 该行被覆盖</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888">每行 1 的列压成掩码（bit j = col j），判定塌缩成一次按位与</text>

  <!-- ============ Left: matrix with selected columns ============ -->
  <text x="130" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">选中列 sel = {0, 2}（绿底）</text>

  <!-- column index header (matrix: col0 col1 col2 left→right) -->
  <g filter="url(#rough2)">
    <text x="70"  y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">col0</text>
    <text x="110" y="92" text-anchor="middle" font-size="11" fill="#888">col1</text>
    <text x="150" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">col2</text>
  </g>
  <!-- selected column highlight bands (col0, col2) -->
  <rect x="50" y="98" width="40" height="140" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <rect x="130" y="98" width="40" height="140" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <!-- row 0: 0 0 0 -->
  <text x="42" y="119" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">r0</text>
  <g filter="url(#rough2)">
    <rect x="50"  y="104" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70"  y="123" text-anchor="middle" font-size="13" fill="#888">0</text>
    <rect x="90"  y="104" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="110" y="123" text-anchor="middle" font-size="13" fill="#888">0</text>
    <rect x="130" y="104" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="150" y="123" text-anchor="middle" font-size="13" fill="#888">0</text>
  </g>

  <!-- row 1: 1 0 1 -->
  <text x="42" y="151" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">r1</text>
  <g filter="url(#rough2)">
    <rect x="50"  y="136" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="70"  y="155" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="90"  y="136" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="110" y="155" text-anchor="middle" font-size="13" fill="#888">0</text>
    <rect x="130" y="136" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="150" y="155" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- row 2: 0 1 1 -->
  <text x="42" y="183" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">r2</text>
  <g filter="url(#rough2)">
    <rect x="50"  y="168" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70"  y="187" text-anchor="middle" font-size="13" fill="#888">0</text>
    <rect x="90"  y="168" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="110" y="187" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
    <rect x="130" y="168" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="150" y="187" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <!-- red note: col1 的 1 未被选中 -->
  <text x="110" y="208" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">↑ col1 未选</text>

  <!-- row 3: 0 0 1 -->
  <text x="42" y="215" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">r3</text>
  <g filter="url(#rough2)">
    <rect x="50"  y="200" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70"  y="219" text-anchor="middle" font-size="13" fill="#888">0</text>
    <rect x="90"  y="200" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="110" y="219" text-anchor="middle" font-size="13" fill="#888">0</text>
    <rect x="130" y="200" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="150" y="219" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- divider vertical line -->
  <line x1="220" y1="70" x2="220" y2="280" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ============ Right: row masks + subset check ============ -->
  <text x="400" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">行掩码与 sel 比位（bit j = col j）</text>

  <!-- header: bits shown col2 col1 col0 (standard binary, bit0 rightmost) -->
  <g filter="url(#rough2)">
    <text x="248" y="92" text-anchor="middle" font-size="10.5" fill="#888">行</text>
    <text x="276" y="92" text-anchor="middle" font-size="9.5" fill="#888">col2</text>
    <text x="304" y="92" text-anchor="middle" font-size="9.5" fill="#888">col1</text>
    <text x="332" y="92" text-anchor="middle" font-size="9.5" fill="#888">col0</text>
    <text x="384" y="92" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">sel=101</text>
    <text x="452" y="92" text-anchor="middle" font-size="10.5" fill="#888">row⊆sel?</text>
    <text x="512" y="92" text-anchor="middle" font-size="10.5" fill="#888">覆盖</text>
  </g>

  <!-- row 0: row=000 (∅), subset ∅⊆ ✓ -->
  <g filter="url(#rough2)">
    <text x="248" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r0</text>
    <rect x="262" y="104" width="84" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="276" y="120" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="304" y="120" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="332" y="120" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="384" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">101</text>
    <text x="452" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">∅⊆ ✓</text>
    <text x="512" y="120" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- row 1: row=101 ({0,2}), ⊆ ✓ -->
  <g filter="url(#rough2)">
    <text x="248" y="155" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r1</text>
    <rect x="262" y="140" width="84" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="276" y="156" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="304" y="156" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="332" y="156" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="384" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">101</text>
    <text x="452" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⊆ ✓</text>
    <text x="512" y="156" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- row 2: row=110 ({1,2}), col1=1 not in sel → ⊄ ✗ -->
  <g filter="url(#rough2)">
    <text x="248" y="191" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r2</text>
    <rect x="262" y="176" width="84" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="276" y="192" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="304" y="192" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <text x="332" y="192" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="384" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">101</text>
    <text x="452" y="192" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⊄ ✗</text>
    <text x="512" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  </g>
  <text x="304" y="208" text-anchor="middle" font-size="9.5" fill="#b85450">↑ col1 位不在 sel</text>

  <!-- row 3: row=100 ({2}), ⊆ ✓ -->
  <g filter="url(#rough2)">
    <text x="248" y="227" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r3</text>
    <rect x="262" y="212" width="84" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="276" y="228" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="304" y="228" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="332" y="228" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="384" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">101</text>
    <text x="452" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⊆ ✓</text>
    <text x="512" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- covered count summary -->
  <rect x="240" y="250" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="390" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">该组合覆盖 3 行（r0, r1, r3）✓</text>

  <!-- ============ Insight box ============ -->
  <rect x="40" y="320" width="500" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="344" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">行 r 被覆盖 ⟺ row_r 的每个 1 位都在 sel 中</text>
  <text x="290" y="364" text-anchor="middle" font-size="12" fill="#666">⟺ row_r ⊆ sel（列集合子集关系）</text>
  <text x="290" y="384" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⟺ (row_r &amp; sel) == row_r　（一次按位与 + 比较，O(1)）</text>
  <text x="290" y="406" text-anchor="middle" font-size="10.5" fill="#888">全 0 行 row_r = 0 天然满足：0 &amp; sel == 0，恒覆盖</text>
  <text x="290" y="420" text-anchor="middle" font-size="9.5" fill="#888">注：bit j 对应 col j；子集关系与位序无关，判定结果不变</text>
</svg>
