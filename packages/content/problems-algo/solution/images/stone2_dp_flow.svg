<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：0-1 背包求最接近 S/2 的子集和</text>

  <!-- Step 1: 计算总和 -->
  <rect x="60" y="44" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="64" font-size="11" fill="#446688" font-weight="bold">①</text>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#333">S = sum(stones)，target = S // 2</text>
  <text x="290" y="78" text-anchor="middle" font-size="10.5" fill="#888">例：[2,7,4,1,8,1] → S=23, target=11</text>

  <path d="M 290 86 L 290 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 初始化 dp -->
  <rect x="60" y="106" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="126" font-size="11" fill="#4a7a3a" font-weight="bold">②</text>
  <text x="290" y="126" text-anchor="middle" font-size="12" fill="#333">dp[j] = 能凑出的 ≤ j 的最大子集和</text>
  <text x="290" y="142" text-anchor="middle" font-size="10.5" fill="#888">初始 dp[0..target] = 0（空集凑出 0）</text>

  <path d="M 290 152 L 290 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 0-1 背包转移 -->
  <rect x="40" y="172" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="192" font-size="11" fill="#d6a040" font-weight="bold">③</text>
  <text x="290" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对每个 stone，j 从 target 倒序到 stone：</text>
  <text x="290" y="210" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">dp[j] = max(dp[j], dp[j − stone] + stone)</text>
  <text x="290" y="226" text-anchor="middle" font-size="10.5" fill="#888">倒序保证每个 stone 只用一次（0-1 背包核心）</text>

  <path d="M 290 238 L 290 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 返回答案 -->
  <rect x="60" y="258" width="460" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="80" y="278" font-size="11" fill="#b85450" font-weight="bold">④</text>
  <text x="290" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = S − 2 × dp[target]</text>
  <text x="290" y="296" text-anchor="middle" font-size="10.5" fill="#888">dp[target] 是最接近 S/2 的子集和，差值即最小剩余重量</text>

  <!-- 转移方程推导 -->
  <path d="M 290 308 L 290 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="328" width="420" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="11" fill="#555">设 best = dp[target]，则两组分别为 best 和 S−best</text>

  <rect x="80" y="370" width="420" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#555">剩余 = |best − (S−best)| = S − 2·best</text>
</svg>
