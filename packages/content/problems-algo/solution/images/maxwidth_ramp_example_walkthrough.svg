<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：A = [9,8,1,0,1,9,4,0,4,1]，n = 10</text>

  <!-- ===== Array row ===== -->
  <text x="30" y="52" font-size="11" fill="#446688" font-weight="bold">数组（下标 0–9）</text>
  <g font-size="9">
    <!-- index labels -->
    <text x="48" y="68" text-anchor="middle" font-size="8" fill="#888">0</text>
    <text x="88" y="68" text-anchor="middle" font-size="8" fill="#888">1</text>
    <text x="128" y="68" text-anchor="middle" font-size="8" fill="#888">2</text>
    <text x="168" y="68" text-anchor="middle" font-size="8" fill="#888">3</text>
    <text x="208" y="68" text-anchor="middle" font-size="8" fill="#888">4</text>
    <text x="248" y="68" text-anchor="middle" font-size="8" fill="#888">5</text>
    <text x="288" y="68" text-anchor="middle" font-size="8" fill="#888">6</text>
    <text x="328" y="68" text-anchor="middle" font-size="8" fill="#888">7</text>
    <text x="368" y="68" text-anchor="middle" font-size="8" fill="#888">8</text>
    <text x="408" y="68" text-anchor="middle" font-size="8" fill="#888">9</text>

    <!-- boxes: candidates 0-3 blue/green, rest gray; j=9 highlighted -->
    <rect x="30" y="74" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="48" y="93" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">9</text>
    <rect x="70" y="74" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="88" y="93" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">8</text>
    <rect x="110" y="74" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="128" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="150" y="74" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="168" y="93" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>
    <rect x="190" y="74" width="36" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="208" y="93" text-anchor="middle" font-size="10" fill="#999">1</text>
    <rect x="230" y="74" width="36" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="248" y="93" text-anchor="middle" font-size="10" fill="#999">9</text>
    <rect x="270" y="74" width="36" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="288" y="93" text-anchor="middle" font-size="10" fill="#999">4</text>
    <rect x="310" y="74" width="36" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="328" y="93" text-anchor="middle" font-size="10" fill="#999">0</text>
    <rect x="350" y="74" width="36" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="368" y="93" text-anchor="middle" font-size="10" fill="#999">4</text>
    <rect x="390" y="74" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="408" y="93" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
    <text x="408" y="64" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">j=9</text>
  </g>

  <!-- ===== Phase 1 result ===== -->
  <text x="30" y="124" font-size="11" fill="#446688" font-weight="bold">阶段一·建栈结果（值严格递减）</text>
  <g font-size="10">
    <rect x="150" y="134" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="190" y="152" text-anchor="middle" fill="#446688" font-weight="bold">下标0→9</text>
    <rect x="230" y="134" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="270" y="152" text-anchor="middle" fill="#446688" font-weight="bold">下标1→8</text>
    <rect x="310" y="134" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="350" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold">下标2→1</text>
    <rect x="390" y="134" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="430" y="152" text-anchor="middle" fill="#446688" font-weight="bold">下标3→0</text>
    <text x="475" y="152" font-size="9" fill="#888">← 栈顶</text>
  </g>
  <text x="30" y="152" font-size="9" fill="#888">i=4..9 均被压制，跳过</text>

  <!-- ===== Phase 2: j=9 ===== -->
  <text x="30" y="184" font-size="11" fill="#d6a040" font-weight="bold">阶段二·j = 9, A[j] = 1：连弹两个候选</text>

  <!-- pop index 3 -->
  <g font-size="10">
    <rect x="150" y="194" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="190" y="212" text-anchor="middle" fill="#446688" font-weight="bold">下标0→9</text>
    <rect x="230" y="194" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="270" y="212" text-anchor="middle" fill="#446688" font-weight="bold">下标1→8</text>
    <rect x="310" y="194" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="350" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">下标2→1</text>
    <rect x="390" y="194" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="430" y="212" text-anchor="middle" fill="#b85450" font-weight="bold">下标3→0</text>
  </g>
  <path d="M 390 207 L 350 207" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="208" font-size="9" fill="#b85450" font-weight="bold">弹出 3</text>
  <text x="300" y="222" font-size="9" fill="#b85450">A[3]=0 ≤ 1 ✓ w=9−3=6</text>

  <!-- pop index 2 -->
  <g font-size="10">
    <rect x="150" y="240" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="190" y="258" text-anchor="middle" fill="#446688" font-weight="bold">下标0→9</text>
    <rect x="230" y="240" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="270" y="258" text-anchor="middle" fill="#446688" font-weight="bold">下标1→8</text>
    <rect x="310" y="240" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="350" y="258" text-anchor="middle" fill="#b85450" font-weight="bold">下标2→1</text>
  </g>
  <path d="M 310 253 L 270 253" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="254" font-size="9" fill="#b85450" font-weight="bold">弹出 2</text>
  <text x="200" y="268" font-size="9" fill="#b85450">A[2]=1 ≤ 1 ✓（等值！） w=9−2=7</text>

  <!-- stop at index 1 -->
  <g font-size="10">
    <rect x="190" y="286" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="230" y="304" text-anchor="middle" fill="#446688" font-weight="bold">下标0→9</text>
    <rect x="270" y="286" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="310" y="304" text-anchor="middle" fill="#d6a040" font-weight="bold">下标1→8</text>
  </g>
  <text x="360" y="298" font-size="9" fill="#d6a040" font-weight="bold">A[1]=8 &gt; 1 → 停</text>
  <text x="360" y="312" font-size="9" fill="#888">等更小 j 再试</text>

  <!-- ===== Optimal ramp visualization ===== -->
  <text x="30" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">最优坡：(i=2, j=9)，A[2]=1 ≤ A[9]=1，宽度 = 9 − 2 = 7</text>

  <!-- array mini row for ramp -->
  <g font-size="9">
    <rect x="110" y="352" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="128" y="368" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="128" y="346" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">i=2</text>
    <rect x="150" y="352" width="36" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
    <text x="168" y="368" text-anchor="middle" fill="#bbb">0</text>
    <rect x="190" y="352" width="36" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
    <text x="208" y="368" text-anchor="middle" fill="#bbb">1</text>
    <rect x="230" y="352" width="36" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
    <text x="248" y="368" text-anchor="middle" fill="#bbb">9</text>
    <rect x="270" y="352" width="36" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
    <text x="288" y="368" text-anchor="middle" fill="#bbb">4</text>
    <rect x="310" y="352" width="36" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
    <text x="328" y="368" text-anchor="middle" fill="#bbb">0</text>
    <rect x="350" y="352" width="36" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
    <text x="368" y="368" text-anchor="middle" fill="#bbb">4</text>
    <rect x="390" y="352" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="408" y="368" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <text x="408" y="346" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">j=9</text>
  </g>
  <path d="M 128 390 Q 268 406 408 390" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="268" y="404" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">宽度 = 7</text>

  <!-- ===== Summary ===== -->
  <rect x="40" y="416" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">关键：j=9 时 A[2]=1 与 A[9]=1 相等，≤ 判定让等值坡成立 → 宽度 7</text>
  <text x="280" y="448" text-anchor="middle" font-size="9" fill="#555">候选 3（值0）也被弹出得 w=6，但 7 &gt; 6 取更大者</text>
</svg>
