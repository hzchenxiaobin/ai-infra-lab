<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">美丽数 = 积 mod 和 == 0：解剖 + 两条关键观察</text>

  <!-- ===== 左：236 不美丽 ===== -->
  <rect x="52" y="40" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="96" y="40" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="140" y="40" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <path d="M 114 78 L 114 100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="104" width="140" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="120" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">和 = 2+3+6 = 11</text>
  <rect x="44" y="134" width="140" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="150" text-anchor="middle" font-size="11.5" fill="#8a6d3a" filter="url(#rough2)">积 = 2·3·6 = 36</text>

  <rect x="38" y="168" width="152" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="114" y="185" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">36 mod 11 = 3 ≠ 0 ✗</text>

  <!-- ===== 右：224 美丽 ===== -->
  <rect x="312" y="40" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="356" y="40" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="374" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="400" y="40" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 374 78 L 374 100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="304" y="104" width="140" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="374" y="120" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">和 = 2+2+4 = 8</text>
  <rect x="304" y="134" width="140" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="374" y="150" text-anchor="middle" font-size="11.5" fill="#8a6d3a" filter="url(#rough2)">积 = 2·2·4 = 16</text>

  <rect x="298" y="168" width="152" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="374" y="185" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">16 mod 8 = 0 ✓ 美丽</text>

  <!-- ===== 中：两条观察 ===== -->
  <rect x="24" y="212" width="228" height="106" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="138" y="232" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 含数位 0 → 必美丽</text>
  <text x="138" y="254" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">数位含 0 ⇒ 积 = 0</text>
  <text x="138" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 能被任何和整除</text>
  <text x="138" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">例：105 → 1×0×5 = 0 ✓</text>
  <text x="138" y="308" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">计数：x − 无0数（组合公式）</text>

  <rect x="268" y="212" width="228" height="106" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="382" y="232" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 无 0 → 直接进数位 DP</text>
  <text x="382" y="254" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">数位 ∈ 1~9，积 ≤ 9⁹</text>
  <text x="382" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">状态 (剩余位, 和 ≤ 81, 积)</text>
  <text x="382" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">末尾一次判定 积 % 和</text>
  <text x="382" y="308" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">可达积仅 ~4 万种（多重集）</text>

  <!-- ===== 底：前缀相减 ===== -->
  <rect x="60" y="344" width="170" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="360" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1 ⋯ l−1</text>
  <rect x="230" y="344" width="230" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="360" text-anchor="middle" font-size="11.5" fill="#8a6d3a" filter="url(#rough2)">l ⋯ r（所求）</text>

  <path d="M 145 370 C 145 380, 190 384, 218 388" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 345 370 C 345 380, 300 384, 302 388" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="160" y="386" width="200" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="404" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">答案 = f(r) − f(l−1)</text>
</svg>
