<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：成功 vs 赤字失败</text>

  <!-- ===== Case 1: success ===== -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">例 3（成功）：ransom="aa", magazine="aab"</text>

  <!-- magazine count table -->
  <text x="44" y="92" font-size="11" fill="#888">建表 cnt:</text>
  <rect x="120" y="76" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 2</text>
  <rect x="180" y="76" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b: 1</text>

  <!-- step 1 -->
  <text x="44" y="138" font-size="11" fill="#888">ransom[0]=a</text>
  <text x="150" y="138" font-size="11" fill="#666">→ cnt[a]−−</text>
  <rect x="248" y="122" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 1</text>
  <text x="316" y="142" font-size="11" fill="#4a7a3a">≥0 ✓</text>

  <!-- step 2 -->
  <text x="44" y="184" font-size="11" fill="#888">ransom[1]=a</text>
  <text x="150" y="184" font-size="11" fill="#666">→ cnt[a]−−</text>
  <rect x="248" y="168" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 0</text>
  <text x="316" y="188" font-size="11" fill="#4a7a3a">≥0 ✓</text>

  <!-- result -->
  <rect x="40" y="210" width="360" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">无赤字 → 返回 true ✓</text>

  <!-- ===== Case 2: fail ===== -->
  <text x="40" y="276" font-size="12" fill="#b85450" font-weight="bold">例 2（失败）：ransom="aa", magazine="ab"</text>

  <!-- magazine count table -->
  <text x="44" y="310" font-size="11" fill="#888">建表 cnt:</text>
  <rect x="120" y="294" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 1</text>
  <rect x="180" y="294" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b: 1</text>

  <!-- step 1 -->
  <text x="44" y="356" font-size="11" fill="#888">ransom[0]=a</text>
  <text x="150" y="356" font-size="11" fill="#666">→ cnt[a]−−</text>
  <rect x="248" y="340" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="360" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 0</text>
  <text x="316" y="360" font-size="11" fill="#4a7a3a">≥0 ✓</text>

  <!-- step 2: deficit -->
  <text x="44" y="402" font-size="11" fill="#888">ransom[1]=a</text>
  <text x="150" y="402" font-size="11" fill="#666">→ cnt[a]−−</text>
  <rect x="248" y="386" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="406" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a: −1</text>
  <text x="316" y="406" font-size="11" fill="#b85450" font-weight="bold">&lt;0 ✗ 赤字</text>

  <!-- result -->
  <rect x="40" y="420" width="360" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="440" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">出现赤字(cnt&lt;0) → 返回 false ✗</text>
</svg>
