<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：A=[1,3,2,4], B=[3,1,2,4]</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">✓ 表示该数 cnt 达到 2，成为公共元素</text>

  <!-- table grid: x=30..500 -->
  <!-- columns: i(30-70) A[i](70-120) B[i](120-170) cnt增量(170-380) common(380-440) C[i](440-500) -->
  <!-- header y=58..86 -->
  <rect x="30" y="58" width="470" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="70" y1="58" x2="70" y2="86" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="58" x2="120" y2="86" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="58" x2="170" y2="86" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="58" x2="380" y2="86" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="58" x2="440" y2="86" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="76" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <text x="95" y="76" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A[i]</text>
  <text x="145" y="76" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B[i]</text>
  <text x="275" y="76" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt 增量</text>
  <text x="410" y="76" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">common</text>
  <text x="470" y="76" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">C[i]</text>

  <!-- row0 y=86..124 -->
  <rect x="30" y="86" width="470" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="70" y1="86" x2="70" y2="124" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="86" x2="120" y2="124" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="86" x2="170" y2="124" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="86" x2="380" y2="124" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="86" x2="440" y2="124" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="95" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="145" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="275" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[1]+1→1；cnt[3]+1→1</text>
  <text x="410" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="440" y="86" width="60" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="470" y="109" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <!-- row1 y=124..162 -->
  <rect x="30" y="124" width="470" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="70" y1="124" x2="70" y2="162" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="124" x2="120" y2="162" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="124" x2="170" y2="162" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="124" x2="380" y2="162" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="124" x2="440" y2="162" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="95" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="145" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="275" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[3]+1→2 ✓；cnt[1]+1→2 ✓</text>
  <text x="410" y="147" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="440" y="124" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="470" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- row2 y=162..200 -->
  <rect x="30" y="162" width="470" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="70" y1="162" x2="70" y2="200" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="162" x2="120" y2="200" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="162" x2="170" y2="200" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="162" x2="380" y2="200" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="162" x2="440" y2="200" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="95" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="145" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="275" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[2]+1→1；cnt[2]+1→2 ✓</text>
  <text x="410" y="185" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="440" y="162" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="470" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- row3 y=200..238 -->
  <rect x="30" y="200" width="470" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="70" y1="200" x2="70" y2="238" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="200" x2="120" y2="238" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="200" x2="170" y2="238" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="200" x2="380" y2="238" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="200" x2="440" y2="238" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="95" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="145" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="275" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[4]+1→1；cnt[4]+1→2 ✓</text>
  <text x="410" y="223" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="440" y="200" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="470" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- bottom note -->
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">最终 C = [0, 2, 3, 4]</text>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">关键：cnt 从 1→2 的瞬间才 common++；</text>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">因为 A、B 是排列，每个数 cnt 上限恰为 2，不会重复触发。</text>
</svg>
