<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="560" height="420" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">BFS 逐层扩展演算</text>
  <path d="M 150 38 Q 280 46 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#888">arr = [4,2,3,0,3,1,2]，start = 5</text>

  <!-- array cells row: 7 cells, width 56, x from 80 -->
  <text x="40" y="100" font-size="11" fill="#888">下标</text>
  <text x="40" y="130" font-size="11" fill="#888">值</text>

  <!-- cell 0 -->
  <g filter="url(#sk)"><rect x="80" y="84" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="80" y="114" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="106" y="103" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="106" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- cell 1 -->
  <g filter="url(#sk)"><rect x="136" y="84" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="136" y="114" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="162" y="103" text-anchor="middle" font-size="12" fill="#2b4b6e">1</text>
  <text x="162" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- cell 2 -->
  <g filter="url(#sk)"><rect x="192" y="84" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="192" y="114" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="218" y="103" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="218" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- cell 3: target 0 -->
  <g filter="url(#sk)"><rect x="248" y="84" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="248" y="114" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="274" y="103" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="274" y="133" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>

  <!-- cell 4 -->
  <g filter="url(#sk)"><rect x="304" y="84" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="304" y="114" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="330" y="103" text-anchor="middle" font-size="12" fill="#2b4b6e">4</text>
  <text x="330" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- cell 5: start -->
  <g filter="url(#sk)"><rect x="360" y="84" width="52" height="28" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="360" y="114" width="52" height="28" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="386" y="103" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">5</text>
  <text x="386" y="133" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">1</text>

  <!-- cell 6 -->
  <g filter="url(#sk)"><rect x="416" y="84" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="416" y="114" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="442" y="103" text-anchor="middle" font-size="12" fill="#2b4b6e">6</text>
  <text x="442" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <text x="386" y="78" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">起点</text>
  <text x="274" y="78" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">目标</text>

  <!-- BFS layer trace: arrow from start=5 down to layer table -->
  <path d="M 386 142 L 386 168" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- layer 0 box -->
  <g filter="url(#sk)"><rect x="60" y="170" width="440" height="38" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="76" y="194" font-size="11" fill="#7a5415" font-weight="bold">层 0</text>
  <text x="120" y="194" font-size="11" fill="#444">弹出 5 → 后继 6, 4 → 均入队（未访问）</text>
  <text x="430" y="194" font-size="10" fill="#888">队列: [6, 4]</text>

  <path d="M 280 208 L 280 224" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- layer 1 box -->
  <g filter="url(#sk)"><rect x="60" y="226" width="440" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="246" font-size="11" fill="#2b4b6e" font-weight="bold">层 1</text>
  <text x="120" y="246" font-size="11" fill="#444">弹出 6 → 后继 4（已访问，跳过）</text>
  <text x="120" y="264" font-size="11" fill="#444">弹出 4 → 后继 1 → 入队（arr[1]=2≠0）</text>
  <text x="430" y="256" font-size="10" fill="#888">队列: [1]</text>

  <path d="M 280 276 L 280 292" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- layer 2 box: hit! -->
  <g filter="url(#sk)"><rect x="60" y="294" width="440" height="46" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="76" y="322" font-size="11" fill="#2e6e2e" font-weight="bold">层 2</text>
  <text x="120" y="322" font-size="11" fill="#2e6e2e" font-weight="bold">弹出 1 → 后继 3（1+2）→ arr[3]==0 ✓ 命中！</text>

  <path d="M 162 142 L 162 294" stroke="#4a8e4a" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="168" y="220" font-size="9" fill="#2e6e2e">5→6→4→1→3</text>

  <!-- conclusion -->
  <g filter="url(#sk)"><rect x="60" y="356" width="440" height="48" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">第 2 层首次到达 arr[3]==0，返回 true</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#888">路径 5→4→1→3 或 5→6→4→1→3（BFS 任取其一即可）</text>
</svg>
