<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">dfs(node) 先序匹配流程（全局游标 i）</text>

  <!-- Entry -->
  <rect x="180" y="48" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#333">dfs(node)</text>

  <path d="M 280 80 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: node null? -->
  <polygon points="280,98 380,130 280,162 180,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#333">node == null？</text>
  <text x="280" y="142" text-anchor="middle" font-size="9" fill="#888">空子树跳过</text>

  <path d="M 180 130 L 120 130 L 120 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="122" font-size="10" fill="#82b366">是</text>
  <rect x="80" y="172" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="191" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return true</text>

  <path d="M 280 162 L 280 184" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="178" font-size="10" fill="#b85450">否</text>

  <!-- Diamond 2: val match? -->
  <polygon points="280,186 400,220 280,254 160,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333">node.val == voyage[i]？</text>
  <text x="280" y="232" text-anchor="middle" font-size="9" fill="#888">根值必须匹配</text>

  <path d="M 400 220 L 460 220 L 460 172" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="212" font-size="10" fill="#b85450">否</text>
  <rect x="420" y="148" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return false</text>

  <path d="M 280 254 L 280 274" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="268" font-size="10" fill="#82b366">是</text>

  <!-- Consume node: i++ -->
  <rect x="170" y="278" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="299" text-anchor="middle" font-size="11" fill="#333">i++  （消费当前节点）</text>

  <path d="M 280 310 L 280 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 3: left exists & mismatch next? -->
  <polygon points="280,330 420,368 280,406 140,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#333">有左子 &amp;&amp; left.val ≠ voyage[i]？</text>
  <text x="280" y="378" text-anchor="middle" font-size="9" fill="#888">下一位对不上</text>

  <!-- No branch: skip flip -->
  <path d="M 140 368 L 90 368 L 90 470" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="360" font-size="10" fill="#82b366">否</text>
  <text x="98" y="420" font-size="9" fill="#888">左子匹配或无左子</text>
  <text x="98" y="434" font-size="9" fill="#888">→ 不翻转</text>

  <!-- Yes branch: check right -->
  <path d="M 420 368 L 470 368 L 470 396" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="360" font-size="10" fill="#b85450">是</text>

  <polygon points="470,398 540,424 470,450 400,424" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="422" text-anchor="middle" font-size="9" fill="#333">有右子 &amp;&amp;</text>
  <text x="470" y="436" text-anchor="middle" font-size="9" fill="#333">right.val==voy[i]？</text>

  <!-- right matches -> flip -->
  <path d="M 470 450 L 470 472" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="464" font-size="9" fill="#82b366">是</text>
  <rect x="380" y="476" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="470" y="494" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">翻转！记录 node.val</text>
  <text x="470" y="508" text-anchor="middle" font-size="9" fill="#555">swap(left, right)</text>

  <!-- right no match -> false -->
  <path d="M 400 424 L 350 424" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="416" font-size="9" fill="#b85450">否</text>
  <rect x="270" y="410" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="429" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">false</text>

  <!-- Merge: recurse -->
  <rect x="40" y="464" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="486" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">递归先序</text>
  <text x="170" y="502" text-anchor="middle" font-size="9" fill="#555">dfs(node.left) → dfs(node.right)</text>
  <text x="170" y="514" text-anchor="middle" font-size="9" fill="#555">全部 true → return true</text>

  <path d="M 470 498 L 470 510 Q 470 520 460 520 L 310 520" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
