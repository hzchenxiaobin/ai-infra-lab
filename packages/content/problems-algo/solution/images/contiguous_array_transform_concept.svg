<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：把 0 当作 −1，转化为「前缀和相等」</text>

  <!-- nums row -->
  <text x="40" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="145" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="195" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="245" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">0</text>

  <text x="170" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="270" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>

  <!-- transform arrow with note -->
  <path d="M 170 112 L 170 128" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 220 112 L 220 128" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 270 112 L 270 128" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="300" y="108" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="360" y="123" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0 → −1，1 → +1</text>

  <!-- transformed row -->
  <text x="36" y="150" font-size="12" fill="#888">变换后:</text>
  <rect x="145" y="134" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="195" y="134" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">+1</text>
  <rect x="245" y="134" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="154" text-anchor="middle" font-size="12" fill="#333">−1</text>

  <!-- bracket spanning transformed[0..1] whose sum = 0 -->
  <path d="M 150 176 Q 150 184 158 184 L 232 184 Q 240 184 240 176" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="195" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">子数组 [0,1]：一个 0 一个 1</text>

  <!-- equation box -->
  <rect x="40" y="196" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">0 和 1 数量相等  ⇔  变换后子数组和 = 0</text>
  <text x="260" y="240" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇔  prefix[j+1] == prefix[i]</text>

  <!-- generalization -->
  <rect x="40" y="270" width="440" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#333">和 = 0 ⟺ 两端前缀和相等（不减反为 0）</text>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#444">用哈希表存每个前缀和的「最早下标」</text>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a">命中即得长度 i − first[i]，取最大</text>
</svg>
