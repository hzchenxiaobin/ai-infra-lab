<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：解析 → 判溢出 → 进位 → 格式化</text>

  <!-- parse -->
  <rect x="180" y="48" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="11.5" fill="#333">解析 y, m, d = 拆分 "YYYY-MM-DD"</text>
  <path d="M270 82 L270 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- leap check box -->
  <rect x="175" y="104" width="190" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="11" fill="#333">days[2] = 闰年? 29 : 28</text>
  <path d="M270 134 L270 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond 1: day == lastDay? -->
  <polygon points="270,152 390,196 270,240 150,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">day == 月末?</text>
  <text x="270" y="208" text-anchor="middle" font-size="10" fill="#888">days[m]</text>

  <!-- No branch (left): simple -->
  <path d="M150 196 L80 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="116" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="14" y="180" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="46" y="201" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">day+1</text>

  <!-- Yes branch (down): month rollover -->
  <path d="M270 240 L270 258" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="282" y="254" font-size="11" fill="#d6a040" font-weight="bold">是</text>

  <!-- set day=1 -->
  <rect x="215" y="262" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="11.5" fill="#333">day = 1</text>
  <path d="M270 292 L270 306" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond 2: month == 12? -->
  <polygon points="270,310 370,348 270,386 170,348" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">month == 12?</text>

  <!-- No branch (left): month+1 -->
  <path d="M170 348 L130 348" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="152" y="340" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <rect x="30" y="332" width="98" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="79" y="353" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">month+1</text>

  <!-- Yes branch (right): year rollover -->
  <path d="M370 348 L410 348" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="412" y="332" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="467" y="353" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">month=1,year+1</text>

  <!-- format arrows converging -->
  <path d="M46 180 L46 156 L460 156 L460 48 L360 48" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M79 332 L79 156 L460 156" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M467 332 L467 156 L460 156" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- format box top-right -->
  <rect x="378" y="14" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="453" y="34" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">格式化 "%04d-%02d-%02d"</text>
  <text x="430" y="8" font-size="10" fill="#888">汇合</text>
</svg>
