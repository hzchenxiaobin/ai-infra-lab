<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 385"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="385" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">惩罚 λ 吸收段数维度：带权二分（Aliens trick）</text>

  <!-- ======== 左图：f(m) 凸函数 + 支撑线 ======== -->
  <!-- 坐标轴 -->
  <path d="M 60 295 L 285 295" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 295 L 60 62" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="313" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">段数 m →</text>
  <text x="36" y="178" text-anchor="middle" font-size="11" fill="#666" transform="rotate(-90 36 178)" filter="url(#rough2)">最小分数 f(m)</text>

  <!-- f(m) 凸递减折线 -->
  <path d="M 88 118 L 122 170 L 156 205 L 190 228 L 224 244 L 258 255"
        fill="none" stroke="#446688" stroke-width="2.5" stroke-linejoin="round" filter="url(#rough)"/>
  <circle cx="88" cy="118" r="3.2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="122" cy="170" r="3.2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="156" cy="205" r="3.2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="190" cy="228" r="3.2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="224" cy="244" r="3.2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="258" cy="255" r="3.2" fill="#446688" filter="url(#rough2)"/>

  <!-- 支撑线：斜率 -λ -->
  <path d="M 68 157 L 280 273" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="74" y="148" font-size="11" fill="#d6a040" filter="url(#rough2)">支撑线：斜率 −λ（每开一段罚 λ）</text>

  <!-- 切点 -->
  <circle cx="156" cy="205" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="163" y="192" font-size="11.5" fill="#b85450" filter="url(#rough2)">切点 m = k</text>

  <text x="172" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">f(m) 凸 ⇒ 每条斜率 −λ 的支撑线切于某个 m</text>

  <!-- ======== 右图：m*(λ) 阶梯 ======== -->
  <!-- 可行域底色（先画，被覆盖） -->
  <rect x="350" y="60" width="106" height="210" fill="#e8f0fe" opacity="0.55" filter="url(#rough2)"/>
  <path d="M 350 270 L 505 270" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 270 L 350 62" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="288" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">惩罚 λ →</text>
  <text x="330" y="178" text-anchor="end" font-size="11" fill="#666" transform="rotate(-90 330 178)" filter="url(#rough2)">最优段数 m*(λ)</text>

  <!-- 阶梯 -->
  <path d="M 350 95 L 392 95 L 392 140 L 424 140 L 424 185 L 456 185 L 456 230 L 505 230"
        fill="none" stroke="#446688" stroke-width="2.5" stroke-linejoin="round" filter="url(#rough)"/>
  <text x="345" y="99" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="345" y="144" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="345" y="189" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="345" y="234" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <!-- k 水平线 与 λ* 竖线 -->
  <path d="M 350 185 L 505 185" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="344" y="181" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">k</text>
  <path d="M 456 62 L 456 270" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="462" y="80" font-size="12" fill="#b85450" filter="url(#rough2)">λ*</text>

  <text x="398" y="118" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">m* ≥ k</text>
  <text x="483" y="215" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">m* &lt; k</text>
  <text x="430" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">m*(λ) 单调不增 ⇒ 二分 λ*</text>

  <!-- ======== 底部公式条 ======== -->
  <rect x="60" y="340" width="400" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="357" text-anchor="middle" font-size="12.5" fill="#2d5a1e" filter="url(#rough2)">A(λ) = min&#8344; ( f(m) + λ·m )　　f(k) = A(λ*) − λ*·k</text>
  <text x="260" y="373" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（×2 单位制：V(s) = s·(s+1)，λ 二分全程整数）</text>
</svg>
