<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#446688" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    两组点连通：主连接 + 额外连接
  </text>

  <!-- Group 1 label -->
  <text x="80" y="60" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">
    第一组 (size1)
  </text>
  <!-- Group 2 label -->
  <text x="420" y="60" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    第二组 (size2 ≤ 12)
  </text>

  <!-- Group 1 circles -->
  <circle cx="80" cy="100" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <circle cx="80" cy="170" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="175" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <circle cx="80" cy="240" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- Group 2 circles -->
  <circle cx="420" cy="100" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <circle cx="420" cy="170" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="175" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <circle cx="420" cy="240" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- Primary connections (solid) -->
  <line x1="100" y1="100" x2="400" y2="100" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="93" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">主连接 cost[0][0]</text>

  <line x1="100" y1="170" x2="400" y2="170" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="163" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">主连接 cost[1][1]</text>

  <line x1="100" y1="240" x2="400" y2="100" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="165" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-15 250 165)">主连接 cost[2][0]</text>

  <!-- Extra connection (dashed) -->
  <line x1="100" y1="170" x2="400" y2="240" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="250" y="220" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">额外连接 minCost2[2]</text>

  <!-- Constraint boxes -->
  <rect x="40" y="290" width="200" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    G1 每点 ≥ 1 条出边（主连接）
  </text>

  <rect x="280" y="290" width="200" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    G2 每点 ≥ 1 条入边（主+额外）
  </text>

  <!-- Summary -->
  <rect x="60" y="340" width="400" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    答案 = min(dp[mask] + extraCost[mask])
  </text>
</svg>
