<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "leet**cod*e"，逐字符维护栈（底 → 顶）</text>

  <!-- input reference line -->
  <text x="330" y="54" text-anchor="middle" font-size="13" fill="#444">s = <tspan fill="#446688" font-weight="bold">leet</tspan><tspan fill="#b85450" font-weight="bold">**</tspan><tspan fill="#446688" font-weight="bold">cod</tspan><tspan fill="#b85450" font-weight="bold">*</tspan><tspan fill="#446688" font-weight="bold">e</tspan></text>

  <!-- ============ Table header ============ -->
  <g filter="url(#rough2)">
    <rect x="40" y="84" width="580" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="60"  y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步</text>
    <text x="105" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">字符</text>
    <text x="200" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">操作</text>
    <text x="390" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">栈状态（底 → 顶）</text>
    <text x="565" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">说明</text>
    <line x1="80"  y1="84" x2="80"  y2="112" stroke="#446688" stroke-width="1"/>
    <line x1="130" y1="84" x2="130" y2="112" stroke="#446688" stroke-width="1"/>
    <line x1="270" y1="84" x2="270" y2="112" stroke="#446688" stroke-width="1"/>
    <line x1="510" y1="84" x2="510" y2="112" stroke="#446688" stroke-width="1"/>
  </g>

  <!-- ============ Rows (y_top = 112 + k*24, center = 124 + k*24) ============ -->
  <g filter="url(#rough2)">
    <!-- column dividers (vertical lines spanning all rows) -->
    <line x1="80"  y1="112" x2="80"  y2="376" stroke="#ddd" stroke-width="1"/>
    <line x1="130" y1="112" x2="130" y2="376" stroke="#ddd" stroke-width="1"/>
    <line x1="270" y1="112" x2="270" y2="376" stroke="#ddd" stroke-width="1"/>
    <line x1="510" y1="112" x2="510" y2="376" stroke="#ddd" stroke-width="1"/>

    <!-- row 0: l, push -->
    <rect x="40" y="112" width="580" height="24" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="129" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="90" y="114" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">l</text>
    <text x="200" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">push l</text>
    <text x="282" y="129" font-size="12" fill="#333"><tspan font-weight="bold" fill="#4a7a3a">l</tspan></text>
    <text x="565" y="129" text-anchor="middle" font-size="11" fill="#888">入栈</text>

    <!-- row 1: e, push -->
    <rect x="40" y="136" width="580" height="24" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="153" text-anchor="middle" font-size="11" fill="#666">1</text>
    <rect x="90" y="138" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="153" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
    <text x="200" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">push e</text>
    <text x="282" y="153" font-size="12" fill="#333">l <tspan font-weight="bold" fill="#4a7a3a">e</tspan></text>
    <text x="565" y="153" text-anchor="middle" font-size="11" fill="#888">入栈</text>

    <!-- row 2: e, push -->
    <rect x="40" y="160" width="580" height="24" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="177" text-anchor="middle" font-size="11" fill="#666">2</text>
    <rect x="90" y="162" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="177" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
    <text x="200" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">push e</text>
    <text x="282" y="177" font-size="12" fill="#333">l e <tspan font-weight="bold" fill="#4a7a3a">e</tspan></text>
    <text x="565" y="177" text-anchor="middle" font-size="11" fill="#888">入栈</text>

    <!-- row 3: t, push -->
    <rect x="40" y="184" width="580" height="24" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="201" text-anchor="middle" font-size="11" fill="#666">3</text>
    <rect x="90" y="186" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="201" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">t</text>
    <text x="200" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">push t</text>
    <text x="282" y="201" font-size="12" fill="#333">l e e <tspan font-weight="bold" fill="#4a7a3a">t</tspan></text>
    <text x="565" y="201" text-anchor="middle" font-size="11" fill="#888">入栈</text>

    <!-- row 4: *, pop t -->
    <rect x="40" y="208" width="580" height="24" fill="#fbeef0" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="225" text-anchor="middle" font-size="11" fill="#666">4</text>
    <rect x="90" y="210" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="105" y="225" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">*</text>
    <text x="200" y="225" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop → 删 t</text>
    <text x="282" y="225" font-size="12" fill="#333">l e <tspan font-weight="bold" fill="#446688">e</tspan></text>
    <text x="565" y="225" text-anchor="middle" font-size="11" fill="#888">弹栈顶 t</text>

    <!-- row 5: *, pop e -->
    <rect x="40" y="232" width="580" height="24" fill="#fbeef0" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="249" text-anchor="middle" font-size="11" fill="#666">5</text>
    <rect x="90" y="234" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="105" y="249" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">*</text>
    <text x="200" y="249" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop → 删 e</text>
    <text x="282" y="249" font-size="12" fill="#333">l <tspan font-weight="bold" fill="#446688">e</tspan></text>
    <text x="565" y="249" text-anchor="middle" font-size="11" fill="#888">弹栈顶 e</text>

    <!-- row 6: c, push -->
    <rect x="40" y="256" width="580" height="24" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="273" text-anchor="middle" font-size="11" fill="#666">6</text>
    <rect x="90" y="258" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="273" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
    <text x="200" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">push c</text>
    <text x="282" y="273" font-size="12" fill="#333">l e <tspan font-weight="bold" fill="#4a7a3a">c</tspan></text>
    <text x="565" y="273" text-anchor="middle" font-size="11" fill="#888">入栈</text>

    <!-- row 7: o, push -->
    <rect x="40" y="280" width="580" height="24" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="297" text-anchor="middle" font-size="11" fill="#666">7</text>
    <rect x="90" y="282" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="297" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">o</text>
    <text x="200" y="297" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">push o</text>
    <text x="282" y="297" font-size="12" fill="#333">l e c <tspan font-weight="bold" fill="#4a7a3a">o</tspan></text>
    <text x="565" y="297" text-anchor="middle" font-size="11" fill="#888">入栈</text>

    <!-- row 8: d, push -->
    <rect x="40" y="304" width="580" height="24" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="321" text-anchor="middle" font-size="11" fill="#666">8</text>
    <rect x="90" y="306" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="321" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">d</text>
    <text x="200" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">push d</text>
    <text x="282" y="321" font-size="12" fill="#333">l e c o <tspan font-weight="bold" fill="#4a7a3a">d</tspan></text>
    <text x="565" y="321" text-anchor="middle" font-size="11" fill="#888">入栈</text>

    <!-- row 9: *, pop d -->
    <rect x="40" y="328" width="580" height="24" fill="#fbeef0" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="345" text-anchor="middle" font-size="11" fill="#666">9</text>
    <rect x="90" y="330" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="105" y="345" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">*</text>
    <text x="200" y="345" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop → 删 d</text>
    <text x="282" y="345" font-size="12" fill="#333">l e c <tspan font-weight="bold" fill="#446688">o</tspan></text>
    <text x="565" y="345" text-anchor="middle" font-size="11" fill="#888">弹栈顶 d</text>

    <!-- row 10: e, push -->
    <rect x="40" y="352" width="580" height="24" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="369" text-anchor="middle" font-size="11" fill="#666">10</text>
    <rect x="90" y="354" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="369" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
    <text x="200" y="369" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">push e</text>
    <text x="282" y="369" font-size="12" fill="#333">l e c o <tspan font-weight="bold" fill="#4a7a3a">e</tspan></text>
    <text x="565" y="369" text-anchor="middle" font-size="11" fill="#888">入栈</text>
  </g>

  <!-- result box -->
  <rect x="100" y="390" width="460" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="330" y="415" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终栈 = [l, e, c, o, e] → 拼接得 "lecoe" ✓</text>
</svg>
