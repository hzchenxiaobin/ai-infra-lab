<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">剥叶子 + 反向填距离 流程</text>

  <!-- Start -->
  <ellipse cx="280" cy="58" rx="170" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">建邻接表 g（set）+ 统计度</text>

  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init queue -->
  <rect x="140" y="100" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="12" fill="#333">度=1 的节点入队 q；seq、f 备好</text>

  <path d="M 280 136 L 280 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: queue empty? -->
  <polygon points="280,160 372,206 280,252 188,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="12" fill="#333">q 为空?</text>
  <text x="280" y="218" text-anchor="middle" font-size="10" fill="#888">(叶子剥完)</text>

  <!-- Yes branch right -> fill phase -->
  <path d="M 372 206 L 440 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="198" text-anchor="middle" font-size="11" fill="#82b366">是</text>

  <!-- Fill phase box -->
  <rect x="430" y="186" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="488" y="204" text-anchor="middle" font-size="11" fill="#333">ans[i]=0（环）</text>
  <text x="488" y="218" text-anchor="middle" font-size="11" fill="#333">反向填 seq</text>

  <path d="M 488 226 L 488 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Reverse fill -->
  <rect x="380" y="286" width="216" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="488" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">反向遍历 seq:</text>
  <text x="488" y="324" text-anchor="middle" font-size="12" fill="#333">ans[i] = ans[f[i]] + 1</text>

  <path d="M 488 342 L 488 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="488" cy="392" rx="78" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="396" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- No branch down -->
  <path d="M 280 252 L 280 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="268" font-size="11" fill="#b85450">否</text>

  <!-- Pop i -->
  <rect x="190" y="278" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="299" text-anchor="middle" font-size="12" fill="#333">出队 i，记入 seq</text>

  <path d="M 280 310 L 280 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Peel action -->
  <rect x="100" y="332" width="360" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">找 i 的唯一邻居 j：</text>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#333">f[i]=j；g[j] 删 i；若 deg[j]==1 则 j 入队</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#888">g[i].clear()（i 已脱离图）</text>

  <!-- loop back -->
  <path d="M 100 363 L 50 363 L 50 206 L 188 206" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="38" y="284" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 38 284)">继续剥下一片叶子</text>

  <!-- Note -->
  <rect x="40" y="420" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="200" y="440" text-anchor="middle" font-size="11" fill="#444">seq 按「外→内」记录剥离顺序</text>
  <text x="200" y="456" text-anchor="middle" font-size="11" fill="#666">反向遍历即「内→外」填距离，f[i] 已先算好</text>
</svg>
