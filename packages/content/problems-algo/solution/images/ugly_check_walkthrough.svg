<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：丑数 vs 非丑数</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888">左：n=6（丑数，剥光后剩 1）｜右：n=14（非丑数，剥光后剩 7）</text>

  <!-- ===== left column header ===== -->
  <rect x="40" y="60" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="79" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">n = 6  →  true</text>

  <!-- step 1: 6 -->
  <rect x="80" y="104" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="120" text-anchor="middle" font-size="10" fill="#888">初始</text>
  <text x="150" y="136" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>

  <path d="M 150 144 L 150 164" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="158" text-anchor="middle" font-size="9" fill="#446688">6%2==0</text>

  <!-- step 2: 3 -->
  <rect x="80" y="168" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="184" text-anchor="middle" font-size="10" fill="#888">÷2 →</text>
  <text x="150" y="200" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>

  <path d="M 150 208 L 150 228" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a">3%3==0</text>

  <!-- step 3: 1 -->
  <rect x="80" y="232" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="248" text-anchor="middle" font-size="10" fill="#888">÷3 →</text>
  <text x="150" y="264" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>

  <path d="M 150 272 L 150 296" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result: ugly -->
  <rect x="60" y="300" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="319" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">residue = 1 → 丑数 ✓</text>
  <text x="150" y="335" text-anchor="middle" font-size="10" fill="#4a7a3a">6 = 2 × 3</text>

  <text x="150" y="362" text-anchor="middle" font-size="9" fill="#888">÷5 不触发（1%5≠0），直接判 1</text>

  <!-- ===== divider ===== -->
  <line x1="290" y1="60" x2="290" y2="360" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== right column header ===== -->
  <rect x="300" y="60" width="220" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="79" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">n = 14  →  false</text>

  <!-- step 1: 14 -->
  <rect x="340" y="104" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="120" text-anchor="middle" font-size="10" fill="#888">初始</text>
  <text x="410" y="136" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">14</text>

  <path d="M 410 144 L 410 164" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="158" text-anchor="middle" font-size="9" fill="#446688">14%2==0</text>

  <!-- step 2: 7 -->
  <rect x="340" y="168" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="184" text-anchor="middle" font-size="10" fill="#888">÷2 →</text>
  <text x="410" y="200" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">7</text>

  <path d="M 410 208 L 410 228" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="468" y="222" text-anchor="middle" font-size="9" fill="#b85450">7%3, 7%5 ≠ 0</text>

  <!-- step 3: 7 (stuck) -->
  <rect x="340" y="232" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="248" text-anchor="middle" font-size="10" fill="#888">除不动 →</text>
  <text x="410" y="264" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>

  <path d="M 410 272 L 410 296" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- result: not ugly -->
  <rect x="320" y="300" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="319" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">residue = 7 ≠ 1 → 非丑数 ✗</text>
  <text x="410" y="335" text-anchor="middle" font-size="10" fill="#b85450">14 = 2 × 7（7 是其他质因子）</text>

  <text x="410" y="362" text-anchor="middle" font-size="9" fill="#888">关键：余数 &gt; 1 说明还藏着 2/3/5 以外的质因子</text>
</svg>
