<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arwf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- ===== Left column: main flow ===== -->
  <text x="130" y="38" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">整体流程</text>

  <!-- Box 1: RLE encode S -->
  <rect x="25" y="48" width="210" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="68" text-anchor="middle" font-size="11" fill="#333">① RLE 编码 S → groups_S</text>

  <path d="M 130 78 L 130 86" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <!-- Box 2: ans = 0 -->
  <rect x="25" y="88" width="210" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="106" text-anchor="middle" font-size="11" fill="#333">② ans = 0</text>

  <path d="M 130 114 L 130 122" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <!-- Box 3: for word in words -->
  <rect x="25" y="124" width="210" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="142" text-anchor="middle" font-size="11" fill="#333">③ for word in words</text>

  <path d="M 130 150 L 130 158" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <!-- Box 4: isStretchy call -->
  <rect x="25" y="160" width="210" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="180" text-anchor="middle" font-size="11" fill="#333">④ isStretchy(word, S)?</text>

  <path d="M 130 192 L 130 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <!-- Box 5: if true, ans++ -->
  <rect x="25" y="202" width="210" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="220" text-anchor="middle" font-size="11" fill="#333">⑤ if true: ans++</text>

  <path d="M 130 228 L 130 252" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>
  <text x="148" y="244" font-size="9" fill="#888">遍历完</text>

  <!-- Loop-back arrow from ⑤ to ③ -->
  <path d="M 25 215 L 12 215 L 12 137 L 25 137" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="8" y="178" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 8 178)">下一个 word</text>

  <!-- Box 6: return ans -->
  <rect x="25" y="254" width="210" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑥ return ans</text>

  <!-- ===== Right column: isStretchy check ===== -->
  <text x="387" y="38" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">isStretchy(word, S) 判定</text>

  <!-- Box R1: RLE encode word -->
  <rect x="275" y="48" width="225" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="387" y="68" text-anchor="middle" font-size="11" fill="#333">RLE 编码 word → groups_w</text>

  <path d="M 387 78 L 387 86" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <!-- Box R2: group count check -->
  <rect x="275" y="88" width="225" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="387" y="108" text-anchor="middle" font-size="11" fill="#333">组数不同? → return false</text>

  <path d="M 387 118 L 387 126" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <!-- Box R3: per-group check (tall box) -->
  <rect x="275" y="128" width="225" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="387" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">逐组 i = 0..m−1 检查：</text>
  <text x="295" y="168" font-size="10.5" fill="#444">① char_S[i] == char_w[i]</text>
  <text x="295" y="186" font-size="10.5" fill="#444">② cnt_S[i] ≥ cnt_w[i]</text>
  <text x="295" y="204" font-size="10.5" fill="#444">③ cnt_S = cnt_w 或 cnt_S ≥ 3</text>
  <text x="387" y="216" text-anchor="middle" font-size="10" fill="#b85450">任一不满足 → return false</text>

  <path d="M 387 220 L 387 228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <!-- Box R4: all pass -->
  <rect x="275" y="230" width="225" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="387" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全通过 → return true</text>

  <!-- Cross arrows: call and return -->
  <path d="M 235 176 L 275 63" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="118" text-anchor="middle" font-size="9" fill="#888">调用</text>

  <path d="M 275 243 L 235 215" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="236" text-anchor="middle" font-size="9" fill="#888">true</text>
</svg>
