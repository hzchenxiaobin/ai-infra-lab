<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums1 = [1,2,3,0,0,0] (m=3)，nums2 = [2,5,6] (n=3)</text>

  <!-- ===== column headers ===== -->
  <text x="20" y="56" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="78" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">p1→值</text>
  <text x="148" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">p2→值</text>
  <text x="240" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">取谁</text>
  <text x="350" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">写入</text>
  <text x="490" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">nums1 状态</text>
  <line x1="14" y1="64" x2="566" y2="64" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== init row ===== -->
  <text x="20" y="86" font-size="11" fill="#aaa">初始</text>
  <text x="78" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2→3</text>
  <text x="148" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2→6</text>
  <text x="240" y="86" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="350" y="86" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="490" y="86" text-anchor="middle" font-size="11" fill="#333">[1,2,3,0,0,0]</text>

  <!-- ===== step 1: take 6 (nums2) ===== -->
  <text x="20" y="110" font-size="11" fill="#333">1</text>
  <text x="78" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2→3</text>
  <text x="148" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2→6</text>
  <text x="240" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">6 (nums2)</text>
  <text x="350" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">nums1[5]=6</text>
  <text x="490" y="110" text-anchor="middle" font-size="11" fill="#333">[1,2,3,0,0,6]</text>

  <!-- ===== step 2: take 5 (nums2) ===== -->
  <text x="20" y="134" font-size="11" fill="#333">2</text>
  <text x="78" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2→3</text>
  <text x="148" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1→5</text>
  <text x="240" y="134" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">5 (nums2)</text>
  <text x="350" y="134" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">nums1[4]=5</text>
  <text x="490" y="134" text-anchor="middle" font-size="11" fill="#333">[1,2,3,0,5,6]</text>

  <!-- ===== step 3: take 3 (nums1) ===== -->
  <text x="20" y="158" font-size="11" fill="#333">3</text>
  <text x="78" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2→3</text>
  <text x="148" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0→2</text>
  <text x="240" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">3 (nums1)</text>
  <text x="350" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">nums1[3]=3</text>
  <text x="490" y="158" text-anchor="middle" font-size="11" fill="#333">[1,2,3,3,5,6]</text>

  <!-- ===== step 4: take 2 (nums2) ===== -->
  <text x="20" y="182" font-size="11" fill="#333">4</text>
  <text x="78" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1→2</text>
  <text x="148" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0→2</text>
  <text x="240" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2 (nums2)</text>
  <text x="350" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">nums1[2]=2</text>
  <text x="490" y="182" text-anchor="middle" font-size="11" fill="#333">[1,2,2,3,5,6]</text>

  <line x1="14" y1="196" x2="566" y2="196" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== end row ===== -->
  <text x="20" y="216" font-size="11" fill="#333" font-weight="bold">结束</text>
  <text x="78" y="216" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="148" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p2=−1</text>
  <text x="240" y="216" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="350" y="216" text-anchor="middle" font-size="10" fill="#888">前[1,2]已就位</text>
  <text x="490" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,2,2,3,5,6] ✓</text>

  <!-- ===== before array ===== -->
  <text x="20" y="258" font-size="11" fill="#888" font-weight="bold">合并前 nums1：</text>
  <g font-size="12">
    <rect x="150" y="244" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="172" y="263" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="194" y="244" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="216" y="263" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="238" y="244" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="263" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="282" y="244" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="304" y="263" text-anchor="middle" fill="#d6a040">0</text>
    <rect x="326" y="244" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="348" y="263" text-anchor="middle" fill="#d6a040">0</text>
    <rect x="370" y="244" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="392" y="263" text-anchor="middle" fill="#d6a040">0</text>
  </g>

  <!-- arrow down -->
  <path d="M 290 276 L 290 304" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="304" y="294" font-size="10.5" fill="#d6a040" font-weight="bold">原地合并</text>

  <!-- ===== after array ===== -->
  <text x="20" y="330" font-size="11" fill="#888" font-weight="bold">合并后 nums1：</text>
  <g font-size="12">
    <rect x="150" y="316" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="172" y="335" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="194" y="316" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="216" y="335" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="238" y="316" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="335" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="282" y="316" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="304" y="335" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="326" y="316" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="348" y="335" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="370" y="316" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="392" y="335" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
</svg>
