<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：最少椅子数 = 在场人数的峰值（最大前缀和）</text>

  <text x="46" y="44" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">s = "ELELEEL"</text>

  <!-- event boxes centered at x(i) = 70 + 56i -->
  <rect x="52" y="52" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="72" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">E</text>
  <text x="70" y="87" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">+1</text>

  <rect x="108" y="52" width="36" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="72" text-anchor="middle" font-size="16" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">L</text>
  <text x="126" y="87" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">−1</text>

  <rect x="164" y="52" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="182" y="72" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">E</text>
  <text x="182" y="87" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">+1</text>

  <rect x="220" y="52" width="36" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="238" y="72" text-anchor="middle" font-size="16" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">L</text>
  <text x="238" y="87" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">−1</text>

  <rect x="276" y="52" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="294" y="72" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">E</text>
  <text x="294" y="87" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">+1</text>

  <rect x="332" y="52" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="72" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">E</text>
  <text x="350" y="87" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">+1</text>

  <rect x="388" y="52" width="36" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="406" y="72" text-anchor="middle" font-size="16" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">L</text>
  <text x="406" y="87" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">−1</text>

  <!-- dashed guides: event box -> chart -->
  <path d="M 70 94 L 70 140" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 126 94 L 126 140" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 182 94 L 182 140" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 238 94 L 238 140" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 294 94 L 294 140" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 350 94 L 350 140" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 406 94 L 406 140" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- axes -->
  <path d="M 70 140 L 70 262" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 70 262 L 466 262" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- level gridlines + labels -->
  <path d="M 70 214 L 462 214" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="62" y="266" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">0 人</text>
  <text x="62" y="218" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">1 人</text>
  <text x="62" y="170" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">2 人</text>

  <!-- peak dashed line -->
  <path d="M 70 166 L 350 166" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="76" y="160" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 2（峰值）</text>

  <!-- step curve: cur = 1 0 1 0 1 2 1 -->
  <path d="M 70 262 L 70 214 L 126 214 L 126 262 L 182 262 L 182 214 L 238 214 L 238 262 L 294 262 L 294 214 L 350 214 L 350 166 L 406 166 L 406 214 L 462 214"
        stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- peak segment highlighted -->
  <path d="M 350 214 L 350 166 L 406 166" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <circle cx="350" cy="166" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">秒 5：峰值 2</text>
  <text x="428" y="152" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">至少 2 把椅子</text>

  <!-- x tick labels -->
  <text x="70" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">秒0</text>
  <text x="126" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">秒1</text>
  <text x="182" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">秒2</text>
  <text x="238" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">秒3</text>
  <text x="294" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">秒4</text>
  <text x="350" y="278" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">秒5</text>
  <text x="406" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">秒6</text>
  <text x="466" y="278" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">时间</text>

  <rect x="48" y="292" width="424" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cur = (+1 / −1) 的前缀和 = 每秒后在场人数</text>

  <rect x="48" y="336" width="424" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="355" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = max cur（峰值）</text>
  <text x="260" y="374" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下界：峰值时刻全员在场，人人要椅；上界：人数 ≤ 峰值，'E' 前必有空椅</text>
</svg>
