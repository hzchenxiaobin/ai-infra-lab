<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：10 次访问 → 交易计数 → 分布补缺 → 输出</text>

  <text x="280" y="50" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">步骤①：Visits LEFT JOIN 交易聚合 → 每次访问的交易数 cnt</text>

  <rect x="60" y="58" width="45" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">user</text>
  <rect x="105" y="58" width="65" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">visit_date</text>
  <rect x="170" y="58" width="35" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">cnt</text>

  <rect x="60" y="78" width="45" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="82" y="89" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">1</text>
  <rect x="105" y="78" width="65" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="137" y="89" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">1/1</text>
  <rect x="170" y="78" width="35" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="187" y="89" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">0</text>

  <rect x="60" y="94" width="45" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="82" y="105" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">2</text>
  <rect x="105" y="94" width="65" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="137" y="105" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">1/2</text>
