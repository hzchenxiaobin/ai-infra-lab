  <rect x="60" y="110" width="45" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="82" y="121" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">12</text>
  <rect x="105" y="110" width="65" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="137" y="121" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">1/1</text>
  <rect x="170" y="110" width="35" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="187" y="121" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">0</text>

  <rect x="60" y="126" width="45" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="82" y="137" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">19</text>
  <rect x="105" y="126" width="65" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="137" y="137" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">1/3</text>
  <rect x="170" y="126" width="35" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="187" y="137" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">0</text>

  <rect x="60" y="142" width="45" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="82" y="153" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="105" y="142" width="65" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="137" y="153" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1/2</text>
  <rect x="170" y="142" width="35" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="187" y="153" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="340" y="58" width="45" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">user</text>
  <rect x="385" y="58" width="65" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">visit_date</text>
  <rect x="450" y="58" width="35" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="467" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">cnt</text>

  <rect x="340" y="78" width="45" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="362" y="89" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="385" y="78" width="65" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="417" y="89" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1/3</text>
  <rect x="450" y="78" width="35" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="467" y="89" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="340" y="94" width="45" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="362" y="105" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="385" y="94" width="65" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="417" y="105" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1/4</text>
  <rect x="450" y="94" width="35" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="467" y="105" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="340" y="110" width="45" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="362" y="121" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="385" y="110" width="65" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="417" y="121" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1/11</text>
  <rect x="450" y="110" width="35" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="467" y="121" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="340" y="126" width="45" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="362" y="137" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">9</text>
  <rect x="385" y="126" width="65" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="417" y="137" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">1/25</text>
  <rect x="450" y="126" width="35" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="467" y="137" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">3</text>

  <rect x="340" y="142" width="45" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="362" y="153" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">8</text>
  <rect x="385" y="142" width="65" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="417" y="153" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1/28</text>
  <rect x="450" y="142" width="35" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="467" y="153" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="135" y="172" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">4 次访问 cnt=0（无交易）</text>
  <text x="415" y="172" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">5 次 cnt=1，1 次 cnt=3</text>

  <path d="M280 178 L280 198" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="175" y="179" width="210" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="9.5" fill="#333">GROUP BY cnt → 分布 + RECURSIVE 补缺口</text>

  <text x="280" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">步骤②：GROUP BY cnt → 分布（cnt=2 缺失）→ 递归补齐</text>

  <text x="105" y="234" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">原始分布</text>
  <rect x="60" y="240" width="45" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="254" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">cnt</text>
  <rect x="105" y="240" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="254" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">visits</text>
  <rect x="60" y="260" width="45" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="82" y="271" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="105" y="260" width="50" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="130" y="271" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="60" y="276" width="45" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="82" y="287" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="105" y="276" width="50" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="130" y="287" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="60" y="292" width="45" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="82" y="303" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">2</text>
  <rect x="105" y="292" width="50" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="130" y="303" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">?</text>
  <rect x="60" y="308" width="45" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="82" y="319" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">3</text>
  <rect x="105" y="308" width="50" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="130" y="319" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">1</text>
  <text x="165" y="303" font-size="8" fill="#b85450" font-weight="bold">缺口</text>

  <path d="M175 300 L215 300" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="195" y="293" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">补齐</text>

  <rect x="220" y="240" width="120" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">RECURSIVE CTE</text>
  <rect x="220" y="260" width="120" height="16" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="8" fill="#333">SELECT 0 AS n</text>
  <rect x="220" y="276" width="120" height="16" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="8" fill="#333">UNION ALL n+1</text>
  <rect x="220" y="292" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">n &lt; max(cnt)=3</text>
  <rect x="220" y="308" width="120" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">→ {0, 1, 2, 3}</text>

  <path d="M345 300 L385 300" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="365" y="293" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">JOIN</text>

  <text x="450" y="234" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">最终输出</text>
  <rect x="390" y="240" width="55" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="254" text-anchor="middle" font-size="7.5" fill="#446688" font-weight="bold">txn_cnt</text>
  <rect x="445" y="240" width="55" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="254" text-anchor="middle" font-size="7.5" fill="#446688" font-weight="bold">visits_cnt</text>
  <rect x="390" y="260" width="55" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="417" y="271" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="445" y="260" width="55" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="472" y="271" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="390" y="276" width="55" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="417" y="287" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="445" y="276" width="55" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="472" y="287" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="390" y="292" width="55" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="417" y="303" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">2</text>
  <rect x="445" y="292" width="55" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="472" y="303" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">0</text>
  <rect x="390" y="308" width="55" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="417" y="319" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">3</text>
  <rect x="445" y="308" width="55" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="472" y="319" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">1</text>
  <text x="417" y="338" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">cnt=2 补 0</text>

  <rect x="15" y="352" width="540" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="370" font-size="9.5" fill="#333">10 次访问：4 次无交易（cnt=0）、5 次各 1 笔、1 次有 3 笔。max=3，故输出 0..3 四行。</text>
  <text x="35" y="386" font-size="9.5" fill="#333">cnt=2 无对应访问 → <tspan fill="#d6a040" font-weight="bold">RECURSIVE 生成 {0,1,2,3} 补齐</tspan>，LEFT JOIN 后 COUNT 得 0。</text>
</svg>
