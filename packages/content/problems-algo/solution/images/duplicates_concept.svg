<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：值 v → 下标 v−1，已为负 ⇒ v 重复</text>

  <!-- Step 1: value v maps to index v-1 -->
  <text x="40" y="64" font-size="12" fill="#446688" font-weight="bold">① 值与下标的天然映射</text>

  <!-- value box v=2 -->
  <rect x="40" y="76" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="100" y="100" font-size="11" fill="#888">值 v = 2</text>

  <!-- arrow to index -->
  <text x="130" y="96" font-size="11" fill="#d6a040" font-weight="bold">v − 1</text>
  <path d="M 152 94 L 186 94" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- index box v-1=1 -->
  <rect x="190" y="76" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="100" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="250" y="100" font-size="11" fill="#888">下标 v−1 = 1</text>

  <!-- note -->
  <text x="300" y="96" font-size="11" fill="#4a7a3a">→ 在 nums[1] 处记录「2 是否见过」</text>

  <!-- divider -->
  <path d="M 40 132 L 500 132" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: first time -> mark negative -->
  <text x="40" y="160" font-size="12" fill="#446688" font-weight="bold">② 首次出现：取负标记「v 已见过」</text>

  <!-- before: positive 3 -->
  <rect x="60" y="176" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="201" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="130" y="200" font-size="11" fill="#888">nums[v−1] &gt; 0</text>

  <text x="232" y="200" font-size="18" fill="#d6a040" font-weight="bold">⇒</text>

  <!-- after: negative -3 -->
  <rect x="260" y="176" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="201" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−3</text>
  <text x="330" y="200" font-size="11" fill="#b85450">取负 = 值 2 见过一次</text>

  <!-- divider -->
  <path d="M 40 238 L 500 238" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: second time -> already negative -> duplicate -->
  <text x="40" y="266" font-size="12" fill="#446688" font-weight="bold">③ 再次出现：nums[v−1] 已负 ⇒ v 是重复数！</text>

  <!-- read value 2 again -->
  <rect x="40" y="280" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="304" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="60" y="332" font-size="9.5" fill="#888">第二次读到</text>

  <text x="100" y="302" font-size="11" fill="#d6a040" font-weight="bold">v−1=1</text>
  <path d="M 132 300 L 166 300" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- already negative -3 -->
  <rect x="170" y="280" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="305" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−3</text>
  <text x="236" y="300" font-size="11" fill="#b85450">已 &lt; 0</text>

  <text x="282" y="302" font-size="18" fill="#4a7a3a" font-weight="bold">⇒</text>

  <!-- result: 2 is duplicate -->
  <rect x="310" y="280" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="305" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2 重复!</text>

  <!-- footer: compare with 448 -->
  <rect x="40" y="340" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">一趟扫描即时判定：nums[v−1] &lt; 0 → v 重复（当场收集）</text>
  <text x="270" y="378" text-anchor="middle" font-size="10.5" fill="#555">对偶题 448：扫完再看 nums[i] &gt; 0 → i+1 缺失</text>
</svg>
