<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描维护双 min，收尾相减</text>

  <!-- start -->
  <rect x="160" y="44" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始：读入 nums1 / nums2</text>

  <path d="M 260 76 L 260 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init note -->
  <rect x="368" y="60" width="142" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="439" y="78" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">初值：min1 = min2 = +∞</text>
  <text x="439" y="94" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">（或直接调两次 min）</text>

  <!-- decision diamond -->
  <path d="M 260 100 L 340 140 L 260 180 L 180 140 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="145" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- yes branch -->
  <path d="M 260 184 L 260 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="202" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- loop body -->
  <rect x="140" y="216" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">min1 = min(min1, nums1[i])</text>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">min2 = min(min2, nums2[i])</text>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">i ← i + 1</text>

  <!-- loop back -->
  <path d="M 382 245 L 452 245 L 452 140 L 344 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="460" y="196" font-size="10.5" fill="#888" filter="url(#rough2)">循环</text>

  <!-- no branch -->
  <path d="M 176 140 L 96 140 L 96 320 L 164 320" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="140" y="132" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- return -->
  <rect x="168" y="304" width="184" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">return min2 − min1</text>

  <!-- bottom note -->
  <rect x="100" y="352" width="320" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一趟 O(n)、O(1) 空间 —— 不排序、不建哈希表</text>
</svg>
