<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：按字符类型三向分支</text>

  <!-- Start -->
  <rect x="180" y="42" width="200" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">开始：cur={}, stack=[], i=0</text>
  <path d="M 280 70 L 280 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取字符 c -->
  <rect x="210" y="88" width="140" height="26" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="11" fill="#333">取字符 c = formula[i]</text>
  <path d="M 280 114 L 280 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,130 356,166 280,202 204,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">c 的类型？</text>
  <text x="280" y="180" text-anchor="middle" font-size="9" fill="#888">( / ) / 大写字母</text>

  <!-- fan-out arrows to three boxes -->
  <path d="M 240 184 C 180 200, 110 206, 78 212" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 202 L 280 212" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 184 C 380 200, 450 206, 482 212" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 1: '(' -->
  <rect x="20" y="214" width="120" height="118" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="234" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">'('</text>
  <line x1="30" y1="242" x2="130" y2="242" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="262" text-anchor="middle" font-size="10" fill="#333">stack.push(cur)</text>
  <text x="80" y="280" text-anchor="middle" font-size="10" fill="#333">cur = {}</text>
  <text x="80" y="298" text-anchor="middle" font-size="10" fill="#333">i++</text>
  <text x="80" y="320" text-anchor="middle" font-size="9" fill="#888">外层现场压栈</text>

  <!-- Box 2: ')' -->
  <rect x="210" y="214" width="140" height="118" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">')'</text>
  <line x1="220" y1="242" x2="340" y2="242" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="9.5" fill="#333">i++; 读 mult(默认1)</text>
  <text x="280" y="276" text-anchor="middle" font-size="9.5" fill="#333">top = stack.pop()</text>
  <text x="280" y="294" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">cur 各项 ×= mult</text>
  <text x="280" y="312" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">并入 top（同名累加）</text>
  <text x="280" y="328" text-anchor="middle" font-size="9" fill="#333">cur = top</text>

  <!-- Box 3: 大写字母 -->
  <rect x="420" y="214" width="120" height="118" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">大写字母</text>
  <line x1="430" y1="242" x2="530" y2="242" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="480" y="260" text-anchor="middle" font-size="9.5" fill="#333">读原子名</text>
  <text x="480" y="276" text-anchor="middle" font-size="9" fill="#888">大写+后续小写</text>
  <text x="480" y="296" text-anchor="middle" font-size="9.5" fill="#333">读 cnt(默认1)</text>
  <text x="480" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">cur[atom]+=cnt</text>

  <!-- converge arrows down -->
  <path d="M 80 332 L 80 352 L 280 352" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 332 L 280 352" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 480 332 L 480 352 L 280 352" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 352 L 280 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: 还有字符? -->
  <polygon points="280,368 344,394 280,420 216,394" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i &lt; n ?</text>

  <!-- 是: loop back up -->
  <path d="M 344 394 L 540 394 L 540 101 L 352 101" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="552" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(90 552 248)">是 → 取下一字符</text>

  <!-- 否: 排序输出 -->
  <path d="M 280 420 L 280 432" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="195" y="434" width="170" height="0" fill="none"/>
  <text x="280" y="430" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否 → 排序 cur 输出</text>
</svg>
