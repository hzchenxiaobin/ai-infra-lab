<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：gcd 不变量 → 可行性 → 含1? → 最短 gcd=1 段</text>

  <!-- Step 1: compute overall gcd -->
  <rect x="150" y="44" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="12" fill="#333">① 算 g₀ = gcd(全数组)</text>

  <path d="M 270 84 L 270 104" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: g0 == 1? -->
  <polygon points="270,108 360,150 270,192 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">g₀ == 1?</text>
  <text x="270" y="161" text-anchor="middle" font-size="10" fill="#888">不变量判定</text>

  <!-- No branch: return -1 (left) -->
  <text x="175" y="142" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 180 150 L 96 150" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="16" y="130" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="155" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 -1</text>

  <!-- Yes branch: down -->
  <text x="278" y="210" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 270 192 L 270 212" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: count ones -->
  <rect x="150" y="212" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="237" text-anchor="middle" font-size="12" fill="#333">② 数 ones = #{x == 1}</text>

  <path d="M 270 252 L 270 272" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: ones > 0? -->
  <polygon points="270,276 360,316 270,356 180,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="12" fill="#333">ones &gt; 0?</text>
  <text x="270" y="327" text-anchor="middle" font-size="10" fill="#888">已有现成的1</text>

  <!-- Yes: return n - ones (right) -->
  <text x="365" y="308" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 360 316 L 444 316" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="444" y="296" width="84" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="486" y="321" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 n−ones</text>

  <!-- No: down to step 3 -->
  <text x="278" y="374" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 270 356 L 270 376" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: shortest gcd-1 subarray -->
  <rect x="120" y="376" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="395" text-anchor="middle" font-size="11.5" fill="#333">③ 找最短 L：gcd(连续段)==1 的最小长度</text>
  <text x="270" y="410" text-anchor="middle" font-size="10" fill="#888">双重循环，cur 降到1 即 break</text>

  <path d="M 270 416 L 270 430" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return (L-1)+(n-1) -->
  <rect x="150" y="430" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="451" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 (L−1) + (n−1)</text>
</svg>
