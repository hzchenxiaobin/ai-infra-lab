<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：枚举左旋 r + 镜像对独立计费 min(d, 26−d)</text>
    <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">示例 1：s = "abc"，取 r = 1（左旋一次）得 "bca"；旋转只挪位置，递增只改字符</text>

    <!-- ===== left column ===== -->
    <text x="40" y="88" text-anchor="start" font-size="11" fill="#446688" font-weight="bold">原串 s</text>

    <rect x="110" y="64" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="131" y="88" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">a</text>
    <rect x="156" y="64" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="177" y="88" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">b</text>
    <rect x="202" y="64" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="223" y="88" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">c</text>

    <path d="M 177 106 V 128" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <text x="188" y="120" text-anchor="start" font-size="9" fill="#446688">左旋 1 次（r = 1）</text>

    <rect x="110" y="134" width="42" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="131" y="154" text-anchor="middle" font-size="14" fill="#7a5c1a" font-weight="bold">b</text>
    <text x="131" y="168" text-anchor="middle" font-size="8" fill="#a87020">i = 0</text>

    <rect x="156" y="134" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,3" rx="4"/>
    <text x="177" y="154" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold">c</text>
    <text x="177" y="168" text-anchor="middle" font-size="8" fill="#4a7a3a">中位</text>

    <rect x="202" y="134" width="42" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="223" y="154" text-anchor="middle" font-size="14" fill="#7a5c1a" font-weight="bold">a</text>
    <text x="223" y="168" text-anchor="middle" font-size="8" fill="#a87020">i = 2</text>

    <text x="252" y="152" text-anchor="start" font-size="8.5" fill="#4a7a3a">← 中位免检</text>
    <text x="252" y="165" text-anchor="start" font-size="8.5" fill="#4a7a3a">（自己配自己）</text>

    <path d="M 131 176 C 131 200, 223 200, 223 176" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7,5" fill="none"/>
    <text x="177" y="214" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">镜像对 t[0] ↔ t[2]</text>

    <rect x="40" y="222" width="320" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="200" y="244" text-anchor="middle" font-size="9.5" fill="#2f5d24">镜像对代价：d = ∣b − a∣ = 1，pair = min(1, 25) = 1</text>
    <text x="200" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">cost(r = 1) = r + pair = 1 + 1 = 2 ✓</text>
    <text x="200" y="282" text-anchor="middle" font-size="8" fill="#557">（r = 0 直改也是 2，并列最优 ⇒ 答案 2）</text>

    <!-- ===== right column: cyclic alphabet ring ===== -->
    <rect x="376" y="56" width="218" height="234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="485" y="76" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold">循环字母表：双向取短</text>

    <circle cx="485" cy="158" r="60" fill="none" stroke="#b8c4d0" stroke-width="1.2" stroke-dasharray="4,4"/>

    <circle cx="537" cy="128" r="1.6" fill="#b8c4d0"/>
    <circle cx="545" cy="158" r="1.6" fill="#b8c4d0"/>
    <circle cx="537" cy="188" r="1.6" fill="#b8c4d0"/>
    <circle cx="515" cy="210" r="1.6" fill="#b8c4d0"/>
    <circle cx="485" cy="218" r="1.6" fill="#b8c4d0"/>
    <circle cx="455" cy="210" r="1.6" fill="#b8c4d0"/>
    <circle cx="433" cy="188" r="1.6" fill="#b8c4d0"/>
    <circle cx="425" cy="158" r="1.6" fill="#b8c4d0"/>
    <circle cx="433" cy="128" r="1.6" fill="#b8c4d0"/>

    <path d="M 457 105 A 60 60 0 1 1 499 100" stroke="#9aa7b5" stroke-width="1.6" stroke-dasharray="6,4" fill="none"/>

    <text x="457" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">y</text>
    <text x="470" y="104" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">z</text>
    <text x="485" y="102" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">a</text>
    <text x="500" y="104" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>

    <path d="M 457 105 A 60 60 0 0 1 499 100" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>

    <text x="485" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">y → b：短弧 3 步 ✓</text>
    <text x="485" y="162" text-anchor="middle" font-size="8" fill="#889">长弧 23 步（绕远）</text>
    <text x="485" y="176" text-anchor="middle" font-size="7" fill="#a8a8a8">· · · 其余 22 个字母 · · ·</text>

    <text x="485" y="242" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">pair(c₁, c₂) = min(d, 26 − d)</text>
    <text x="485" y="258" text-anchor="middle" font-size="8.5" fill="#7a5c1a">d = ∣c₁ − c₂∣（'z' 之后是 'a'，循环递增）</text>
    <text x="485" y="274" text-anchor="middle" font-size="8.5" fill="#7a5c1a">示例 2 "yb"：min(23, 3) = 3，而非 23</text>

    <!-- ===== bottom takeaway ===== -->
    <rect x="40" y="306" width="550" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="315" y="326" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">要点小结</text>
    <text x="58" y="346" text-anchor="start" font-size="9" fill="#33506b">① 解耦：任意操作序列的净效果 = 左旋 r 次（只需考虑 0 ≤ r &lt; n）+ 每个字符各自递增，与先后顺序无关</text>
    <text x="58" y="364" text-anchor="start" font-size="9" fill="#33506b">② 计费：固定 r 后 t[i] = s[(i+r) mod n]，每个镜像对独立付 pair(t[i], t[n−1−i])，总代价 cost(r) = r + Σ pair</text>
    <text x="58" y="382" text-anchor="start" font-size="9" fill="#33506b">③ 取 min：答案 = min 全部 cost(r)；奇数长度的中位字符与自己镜像、免检（i 只扫到 ⌊n/2⌋−1）</text>
    <text x="58" y="400" text-anchor="start" font-size="9" fill="#33506b">④ 规模：n = 2000 ⇒ n 种旋转 × 1000 对 ≈ 2×10⁶ 次 O(1) 计算；答案 ≤ 13·n/2 + n − 1 &lt; 14n，int 富余</text>
  </g>
</svg>
