<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [3, 1, 2, 10, 1]</text>

  <!-- Step lines -->
  <text x="40" y="50" font-size="11.5" fill="#333">① res[0] = nums[0] = 3（边界，无需递推）</text>
  <text x="40" y="68" font-size="11.5" fill="#333">② 遍历 i = 1..4，每轮 res[i] = res[i−1] + nums[i]</text>

  <!-- Table header row -->
  <rect x="50" y="82" width="500" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="145" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <text x="225" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res[i−1]</text>
  <text x="335" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res[i]</text>
  <text x="480" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res 进展</text>

  <!-- vertical separators -->
  <path d="M 108 82 L 108 294 M 180 82 L 180 294 M 260 82 L 260 294 M 390 82 L 390 294" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row 0 -->
  <rect x="50" y="110" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="133" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="145" y="133" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">3</text>
  <text x="225" y="133" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="335" y="133" text-anchor="middle" font-size="11" fill="#333">3（边界）</text>
  <text x="480" y="133" text-anchor="middle" font-size="10.5" fill="#555">[3,_,_,_,_]</text>

  <!-- row 1 -->
  <rect x="50" y="146" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="169" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="145" y="169" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <text x="225" y="169" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="335" y="169" text-anchor="middle" font-size="11" fill="#333">3 + 1 = 4</text>
  <text x="480" y="169" text-anchor="middle" font-size="10.5" fill="#555">[3,4,_,_,_]</text>

  <!-- row 2 -->
  <rect x="50" y="182" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="205" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="145" y="205" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <text x="225" y="205" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="335" y="205" text-anchor="middle" font-size="11" fill="#333">4 + 2 = 6</text>
  <text x="480" y="205" text-anchor="middle" font-size="10.5" fill="#555">[3,4,6,_,_]</text>

  <!-- row 3 -->
  <rect x="50" y="218" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="241" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="145" y="241" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">10</text>
  <text x="225" y="241" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="335" y="241" text-anchor="middle" font-size="11" fill="#333">6 + 10 = 16</text>
  <text x="480" y="241" text-anchor="middle" font-size="10.5" fill="#555">[3,4,6,16,_]</text>

  <!-- row 4 -->
  <rect x="50" y="254" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="277" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="145" y="277" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <text x="225" y="277" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">16</text>
  <text x="335" y="277" text-anchor="middle" font-size="11" fill="#333">16 + 1 = 17</text>
  <text x="480" y="277" text-anchor="middle" font-size="10.5" fill="#555">[3,4,6,16,17]</text>

  <!-- Result -->
  <text x="300" y="316" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">结果 res = [3, 4, 6, 16, 17]</text>

  <!-- color legend -->
  <rect x="120" y="328" width="18" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146" y="340" font-size="10.5" fill="#555">nums[i]（当前元素）</text>
  <rect x="340" y="328" width="18" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="366" y="340" font-size="10.5" fill="#555">res[i−1]（前一次结果）</text>

  <!-- footer note -->
  <rect x="60" y="352" width="480" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="11" fill="#555">每轮只需一次加法：复用 res[i−1]，无需从头累加</text>
  <text x="300" y="382" text-anchor="middle" font-size="10" fill="#888">n = 5 个元素，i = 1..4 共 4 次递推 + 1 次边界初始化</text>
</svg>
