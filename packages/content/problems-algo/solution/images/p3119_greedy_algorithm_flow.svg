<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：切块 → 降序排序 → 整块贪修 → 一段收尾</text>

  <!-- start -->
  <rect x="225" y="34" width="70" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 58 L 260 70" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 1: split -->
  <rect x="118" y="74" width="284" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="91" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">按 '.' 切分 road</text>
  <text x="260" y="108" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">得到各连续坑洼块的块长 L₁ … Lₘ</text>

  <path d="M 260 116 L 260 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2: sort -->
  <rect x="118" y="132" width="284" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">块长降序排序（长块每坑摊销最低）</text>

  <path d="M 260 166 L 260 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3: loop header -->
  <rect x="118" y="182" width="284" height="36" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">取下一块 L（没有剩余块 → 直接返回）</text>

  <path d="M 260 218 L 260 230" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="260,232 372,272 260,312 148,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="269" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">budget ≥ L + 1 ？</text>
  <text x="260" y="286" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">（整块修得起吗）</text>

  <!-- yes branch -->
  <text x="380" y="262" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 372 272 L 390 272" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="394" y="252" width="118" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="453" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">ans += L</text>
  <text x="453" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">budget −= L+1</text>

  <!-- loop back arrow -->
  <path d="M 453 252 L 453 200 L 406 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="474" y="228" font-size="10" fill="#4a7a3a" filter="url(#rough2)">循环</text>

  <!-- no branch -->
  <text x="270" y="328" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 312 L 260 328" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="140" y="330" width="240" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">收尾：ans += max(0, budget − 1)，停止</text>

  <path d="M 260 366 L 260 378" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="210" y="382" width="100" height="26" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="399" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- dashed exit: no more blocks -->
  <path d="M 118 200 L 62 200 L 62 395 L 204 395" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="48" y="300" font-size="10.5" fill="#999" transform="rotate(-90 48 300)" text-anchor="middle" filter="url(#rough2)">块用完</text>
</svg>
