<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, 4, 6, 8, 10]，ans = 7</text>

  <text x="20" y="54" font-size="12" fill="#888">i=1, j=0：diff=2</text>
  <rect x="20" y="62" width="560" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="82" font-size="11" fill="#333">cnt=dp[0][2]=0 → ans+=0；dp[1][2] += 0+1 = 1</text>
  <rect x="430" y="66" width="140" height="22" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="500" y="81" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[1] = {2:1}</text>

  <text x="20" y="112" font-size="12" fill="#888">i=2</text>
  <rect x="20" y="120" width="560" height="58" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="138" font-size="11" fill="#333">j=0：diff=4, cnt=dp[0][4]=0 → ans+=0；dp[2][4] += 1</text>
  <text x="35" y="156" font-size="11" fill="#333">j=1：diff=2, cnt=dp[1][2]=1 → ans+=1（[2,4,6]）dp[2][2] += 1+1 = 2</text>
  <text x="35" y="173" font-size="10.5" fill="#82b366" font-weight="bold">ans = 1</text>
  <rect x="430" y="124" width="140" height="22" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="500" y="139" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[2] = {4:1, 2:2}</text>

  <text x="20" y="198" font-size="12" fill="#888">i=3</text>
  <rect x="20" y="206" width="560" height="76" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="224" font-size="11" fill="#333">j=0：diff=6, cnt=0 → dp[3][6] += 1</text>
  <text x="35" y="242" font-size="11" fill="#333">j=1：diff=4, cnt=dp[1][4]=0 → dp[3][4] += 1</text>
  <text x="35" y="260" font-size="11" fill="#333">j=2：diff=2, cnt=dp[2][2]=2 → ans+=2（[4,6,8]、[2,4,6,8]）dp[3][2] += 2+1 = 3</text>
  <text x="35" y="277" font-size="10.5" fill="#82b366" font-weight="bold">ans = 3</text>
  <rect x="420" y="210" width="150" height="22" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="495" y="225" text-anchor="middle" font-size="9.5" fill="#4a7a3a">dp[3]={6:1,4:1,2:3}</text>

  <text x="20" y="304" font-size="12" fill="#888">i=4</text>
  <rect x="20" y="312" width="560" height="94" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="330" font-size="11" fill="#333">j=0：diff=8, cnt=0 → dp[4][8] += 1</text>
  <text x="35" y="348" font-size="11" fill="#333">j=1：diff=6, cnt=dp[1][6]=0 → dp[4][6] += 1</text>
  <text x="35" y="366" font-size="11" fill="#333">j=2：diff=4, cnt=dp[2][4]=1 → ans+=1（[2,6,10]）dp[4][4] += 1+1 = 2</text>
  <text x="35" y="384" font-size="11" fill="#333">j=3：diff=2, cnt=dp[3][2]=3 → ans+=3（[6,8,10]、[4,6,8,10]、[2,4,6,8,10]）dp[4][2] += 3+1 = 4</text>
  <text x="35" y="400" font-size="10.5" fill="#82b366" font-weight="bold">ans = 7</text>

  <rect x="20" y="420" width="560" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="440" font-size="12" fill="#333" font-weight="bold">最终 ans = 7（验证）：</text>
  <text x="40" y="458" font-size="11" fill="#555">diff=2（6 个）：[2,4,6]、[4,6,8]、[6,8,10]、[2,4,6,8]、[4,6,8,10]、[2,4,6,8,10]</text>
  <text x="40" y="474" font-size="11" fill="#555">diff=4（1 个）：[2,6,10]</text>

  <rect x="20" y="490" width="560" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="510" font-size="11" fill="#444" font-weight="bold">关键：cnt=dp[j][diff] 进答案（延长后≥3）；cnt+1 进 dp[i][diff]（含新的二元对）</text>
  <text x="40" y="528" font-size="10.5" fill="#888">二元对 [nums[j],nums[i]] 自身长度 2 不算答案，但留给后续 k&gt;i 续接时长成 ≥3</text>
  <text x="40" y="542" font-size="10.5" fill="#888">所以 dp 存「弱子序列（≥2）」而非「强子序列（≥3）」，这是续接性的关键</text>
</svg>
