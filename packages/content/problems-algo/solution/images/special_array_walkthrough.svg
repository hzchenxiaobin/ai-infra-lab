<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [0,4,3,0,4]，排序后逐 x 计数</text>

  <!-- Sorted array display -->
  <text x="40" y="56" text-anchor="start" font-size="11" fill="#888" font-weight="bold">排序后</text>
  <rect x="100" y="40" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="60" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <rect x="144" y="40" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="60" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <rect x="188" y="40" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="60" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">3</text>
  <rect x="232" y="40" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="60" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">4</text>
  <rect x="276" y="40" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="60" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">4</text>

  <text x="340" y="56" text-anchor="start" font-size="10.5" fill="#888">n = 5</text>

  <!-- Table header -->
  <rect x="40" y="92" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="180" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">bisect_left(nums, x)</text>
  <text x="330" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt = 5 − pos</text>
  <text x="470" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt == x ?</text>

  <!-- Vertical separators -->
  <line x1="130" y1="92" x2="130" y2="318" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="92" x2="240" y2="318" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="420" y1="92" x2="420" y2="318" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Outer frame -->
  <rect x="40" y="92" width="500" height="226" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Row x=5 -->
  <text x="80" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">5</text>
  <text x="180" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">5</text>
  <text x="330" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">0</text>
  <text x="470" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="40" y1="146" x2="540" y2="146" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row x=4 -->
  <text x="80" y="166" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">4</text>
  <text x="180" y="166" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">3</text>
  <text x="330" y="166" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">2</text>
  <text x="470" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="40" y1="176" x2="540" y2="176" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row x=3 (HIT) -->
  <rect x="42" y="178" width="496" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">3</text>
  <text x="180" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">2</text>
  <text x="330" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">3</text>
  <text x="470" y="196" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">是 ✓</text>
  <line x1="40" y1="208" x2="540" y2="208" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row x=2 -->
  <text x="80" y="226" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">2</text>
  <text x="180" y="226" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">2</text>
  <text x="330" y="226" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">3</text>
  <text x="470" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="40" y1="236" x2="540" y2="236" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row x=1 -->
  <text x="80" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">1</text>
  <text x="180" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">2</text>
  <text x="330" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">3</text>
  <text x="470" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="40" y1="266" x2="540" y2="266" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row x=0 -->
  <text x="80" y="286" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">0</text>
  <text x="180" y="286" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">0</text>
  <text x="330" y="286" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">5</text>
  <text x="470" y="286" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Annotation for the hit -->
  <rect x="40" y="328" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="346" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">x = 3 时：pos = 2（首个 ≥ 3 的位置），cnt = 5 − 2 = 3 = x</text>
  <text x="290" y="362" text-anchor="middle" font-size="10.5" fill="#888">即排序后下标 2,3,4 共 3 个元素（3,4,4）≥ 3 → 返回 3</text>
</svg>
