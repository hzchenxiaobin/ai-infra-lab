<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：±1 映射 + 前缀和，多数判定变「数上升对」</text>
  <text x="260" y="42" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [1, 2, 2, 3]，target = 2（标橙的格子）</text>

  <!-- nums 行 -->
  <text x="80" y="74" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="88" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="140" y="52" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#b8860b" filter="url(#rough2)">2</text>
  <rect x="192" y="52" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#b8860b" filter="url(#rough2)">2</text>
  <rect x="244" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 150 88 L 150 104" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="100" font-size="10.5" fill="#666" filter="url(#rough2)">等于 target 记 +1，否则记 −1</text>

  <!-- b 行 -->
  <text x="80" y="128" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">b</text>
  <rect x="88" y="106" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="128" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="140" y="106" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <rect x="192" y="106" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <rect x="244" y="106" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="128" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>

  <path d="M 150 142 L 150 156" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="153" font-size="10.5" fill="#666" filter="url(#rough2)">P[0]=0，P[k]=P[k−1]+b[k−1]</text>

  <!-- 上升对弧线 -->
  <path d="M 165 192 Q 191 174 217 192" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 217 192 Q 243 174 269 192" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 165 192 Q 217 160 269 192" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 113 192 Q 191 148 269 192" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 165 192 Q 243 136 321 192" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="352" y="168" font-size="10" fill="#4a7a3a" filter="url(#rough2)">合法对：i &lt; j 且</text>
  <text x="352" y="183" font-size="10" fill="#4a7a3a" filter="url(#rough2)">P[i] &lt; P[j]，共 5 对 ✓</text>

  <!-- P 行 -->
  <text x="80" y="212" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">P</text>
  <rect x="88" y="190" width="50" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="140" y="190" width="50" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="192" y="190" width="50" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="244" y="190" width="50" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="296" y="190" width="50" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="113" y="238" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="165" y="238" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="217" y="238" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="269" y="238" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="321" y="238" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="80" y="238" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">下标</text>

  <!-- 对 → 子数组 -->
  <text x="88" y="260" font-size="10.5" fill="#333" filter="url(#rough2)">(0,3)→[1,2,2]   (1,2)→[2]   (1,3)→[2,2]   (2,3)→[2]</text>
  <text x="88" y="277" font-size="10.5" fill="#333" filter="url(#rough2)">(1,4)→[2,2,3]   ⇒ 答案 = <tspan font-weight="bold" fill="#b85450">5</tspan>，与示例逐一对应</text>

  <!-- 洞察框 -->
  <rect x="15" y="288" width="490" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">段和 = (target 个数) − (其他个数) = 2c − L &gt; 0 ⟺ target 严格过半</text>
  <text x="260" y="325" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">原问题 = 数上升对 (i &lt; j, P[i] &lt; P[j]) —— 逆序对问题的对偶</text>

  <text x="16" y="350" font-size="10" fill="#999" filter="url(#rough2)">⚠️ 偶数长度时出现次数恰为一半不算多数：对应 P[i] == P[j]，不计数（严格小于）</text>
</svg>
