<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 15，逐位拼接过程</text>

  <!-- ===== Table header ===== -->
  <!-- columns: i=36, %3=110, %5=170, s+="Fizz"=230, s+="Buzz"=300, output=420 -->
  <rect x="28" y="40" width="504" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <text x="56" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">i</text>
  <line x1="84" y1="44" x2="84" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="120" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i%3==0</text>
  <line x1="156" y1="44" x2="156" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="192" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i%5==0</text>
  <line x1="228" y1="44" x2="228" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="286" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">拼接过程</text>
  <line x1="344" y1="44" x2="344" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="420" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">输出</text>

  <!-- ===== rows: 1,3,5,15 highlighted; show subset for clarity ===== -->
  <!-- Row: i=1 -->
  <rect x="28" y="72" width="504" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="56" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="120" y="88" text-anchor="middle" font-size="10.5" fill="#888">否</text>
  <text x="192" y="88" text-anchor="middle" font-size="10.5" fill="#888">否</text>
  <text x="286" y="88" text-anchor="middle" font-size="10.5" fill="#888">s="" → 空</text>
  <rect x="402" y="74" width="36" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="420" y="88" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">1</text>

  <!-- Row: i=3 -->
  <rect x="28" y="96" width="504" height="22" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="56" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="120" y="112" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是 ✓</text>
  <text x="192" y="112" text-anchor="middle" font-size="10.5" fill="#888">否</text>
  <text x="286" y="112" text-anchor="middle" font-size="10.5" fill="#333">s="" +"Fizz"=<tspan fill="#d6a040" font-weight="bold">"Fizz"</tspan></text>
  <rect x="396" y="98" width="48" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="420" y="112" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">Fizz</text>

  <!-- Row: i=5 -->
  <rect x="28" y="120" width="504" height="22" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="56" y="136" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="120" y="136" text-anchor="middle" font-size="10.5" fill="#888">否</text>
  <text x="192" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是 ✓</text>
  <text x="286" y="136" text-anchor="middle" font-size="10.5" fill="#333">s="" +"Buzz"=<tspan fill="#d6a040" font-weight="bold">"Buzz"</tspan></text>
  <rect x="396" y="122" width="48" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="420" y="136" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">Buzz</text>

  <!-- Row: i=6 -->
  <rect x="28" y="144" width="504" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="56" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="120" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是 ✓</text>
  <text x="192" y="160" text-anchor="middle" font-size="10.5" fill="#888">否</text>
  <text x="286" y="160" text-anchor="middle" font-size="10.5" fill="#333">s="" +"Fizz"=<tspan fill="#d6a040" font-weight="bold">"Fizz"</tspan></text>
  <rect x="396" y="146" width="48" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="420" y="160" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">Fizz</text>

  <!-- Row: i=10 -->
  <rect x="28" y="168" width="504" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="56" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="120" y="184" text-anchor="middle" font-size="10.5" fill="#888">否</text>
  <text x="192" y="184" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是 ✓</text>
  <text x="286" y="184" text-anchor="middle" font-size="10.5" fill="#333">s="" +"Buzz"=<tspan fill="#d6a040" font-weight="bold">"Buzz"</tspan></text>
  <rect x="396" y="170" width="48" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="420" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">Buzz</text>

  <!-- Row: i=15 (highlight) -->
  <rect x="28" y="192" width="504" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="56" y="210" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">15</text>
  <text x="120" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是 ✓</text>
  <text x="192" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是 ✓</text>
  <text x="286" y="210" text-anchor="middle" font-size="10.5" fill="#333">"" +"Fizz" +"Buzz"=<tspan fill="#b85450" font-weight="bold">"FizzBuzz"</tspan></text>
  <rect x="390" y="194" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">FizzBuzz</text>

  <!-- ellipsis -->
  <rect x="28" y="222" width="504" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#888">…（4,7,8,9,11,12,13,14 同理：两规则皆否则填回数字）…</text>

  <!-- ===== annotation box ===== -->
  <rect x="28" y="256" width="504" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="44" y="276" font-size="11.5" fill="#4a7a3a" font-weight="bold">关键观察：</text>
  <text x="44" y="294" font-size="11" fill="#333">• i=15 同时命中两条规则 → 两次拼接自动得到 "FizzBuzz"，<tspan font-weight="bold" fill="#4a7a3a">无需特判 i%15</tspan></text>
  <text x="44" y="312" font-size="11" fill="#333">• 两规则皆否（如 i=1）→ s 仍为空 → 回填 str(i)，保证非规则数原样输出</text>
  <text x="44" y="330" font-size="11" fill="#333">• 拼接顺序由规则遍历顺序决定：先 Fizz 后 Buzz，故 "FizzBuzz" 而非 "BuzzFizz"</text>
  <text x="44" y="346" font-size="10.5" fill="#888">↳ 顺序需与题目约定的字符串顺序一致</text>

  <!-- ===== final output strip ===== -->
  <rect x="28" y="360" width="504" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="44" y="380" font-size="11" fill="#d6a040" font-weight="bold">最终 ans（n=15）：</text>
  <text x="44" y="398" font-size="10.5" fill="#333">["1","2","Fizz","4","Buzz","Fizz","7","8","Fizz","Buzz","11","Fizz","13","14","FizzBuzz"]</text>
</svg>
