<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：前序 DFS 逐节点检查，绿色=独生，橙色=独生父母</text>

  <!-- 树结构：root=7 -->
  <!-- 连线 -->
  <line x1="248" y1="70" x2="172" y2="110" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="272" y1="70" x2="358" y2="110" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="148" y1="140" x2="122" y2="190" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="358" y1="140" x2="332" y2="190" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="382" y1="140" x2="408" y2="190" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="432" y1="222" x2="458" y2="280" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <!-- ① 根 7：双孩子 → 蓝 -->
  <circle cx="260" cy="56" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="284" y="48" font-size="10" fill="#446688" font-weight="bold">①</text>
  <text x="284" y="60" font-size="8" fill="#888">双孩子</text>

  <!-- ② 节点 1：只左 → 橙 -->
  <circle cx="160" cy="126" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="130" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="134" y="118" font-size="10" fill="#d6a040" font-weight="bold">②</text>
  <text x="108" y="118" font-size="8" fill="#d6a040">只左⚠</text>

  <!-- ④ 节点 4：双孩子 → 蓝 -->
  <circle cx="370" cy="126" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="130" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="394" y="118" font-size="10" fill="#446688" font-weight="bold">④</text>
  <text x="394" y="130" font-size="8" fill="#888">双孩子</text>

  <!-- ③ 叶 6：独生节点 → 绿 -->
  <circle cx="115" cy="206" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="115" y="210" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="88" y="198" font-size="10" fill="#4a7a3a" font-weight="bold">③</text>
  <text x="82" y="210" font-size="8" fill="#4a7a3a">✓独生</text>

  <!-- ⑤ 叶 5：无孩子 → 蓝 -->
  <circle cx="325" cy="206" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="210" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="300" y="198" font-size="10" fill="#446688" font-weight="bold">⑤</text>

  <!-- ⑥ 节点 3：只右 → 橙 -->
  <circle cx="420" cy="206" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="420" y="210" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="444" y="198" font-size="10" fill="#d6a040" font-weight="bold">⑥</text>
  <text x="444" y="210" font-size="8" fill="#d6a040">只右⚠</text>

  <!-- ⑦ 叶 2：独生节点 → 绿 -->
  <circle cx="465" cy="296" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="465" y="300" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="488" y="288" font-size="10" fill="#4a7a3a" font-weight="bold">⑦</text>
  <text x="488" y="300" font-size="8" fill="#4a7a3a">✓独生</text>

  <!-- 说明框 -->
  <rect x="36" y="326" width="488" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">前序遍历顺序：①7 → ②1 → ③6 → ④4 → ⑤5 → ⑥3 → ⑦2</text>
  <text x="54" y="368" font-size="11" fill="#4a7a3a">绿色 ✓ = 独生节点（6、2）：②节点1 只左 → 收集6；⑥节点3 只右 → 收集2</text>
  <text x="54" y="384" font-size="11" fill="#d6a040">橙色 ⚠ = 只有一个孩子的父母（1、3），其余节点双孩子或无孩子 → 不收集</text>
</svg>
