<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：Z 数组 + 逐轮判定</text>

  <!-- start -->
  <rect x="115" y="40" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="190" y="60" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：读入 word, k</text>
  <path d="M 190 70 L 190 86" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="65" y="90" width="250" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="190" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 对 word 求 Z 数组（z[0] = n）</text>
  <text x="190" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Z-box 复用，一遍 O(n)</text>
  <path d="M 190 130 L 190 146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="95" y="150" width="190" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="190" y="170" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② t = 1，i = t·k</text>
  <path d="M 190 180 L 190 198" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="190,202 275,240 190,278 105,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="245" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i ≥ n ?</text>
  <path d="M 275 240 L 402 240 L 402 300 L 412 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 190 278 L 190 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="292" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">否</text>

  <!-- diamond 2 -->
  <polygon points="190,300 280,338 190,376 100,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="336" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">z[i] ≥ n − i ?</text>
  <text x="190" y="352" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">（后缀是前缀？）</text>
  <path d="M 280 338 L 402 338 L 402 318 L 412 318" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="336" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 190 376 L 190 392" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="388" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">否</text>

  <!-- step 3: t++ -->
  <rect x="115" y="396" width="150" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="190" y="415" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">t++，i = t·k</text>
  <path d="M 115 410 L 60 410 L 60 165 L 89 165" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- return box -->
  <rect x="415" y="278" width="115" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="472" y="304" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 t ★</text>
  <text x="472" y="324" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">最短恢复时间</text>

  <!-- note box -->
  <rect x="360" y="60" width="180" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="450" y="80" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">循环至多 ⌈n/k⌉ 轮必返回</text>
  <text x="450" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（t·k ≥ n 时原字符已移空，</text>
  <text x="450" y="110" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">整串自己填 → 必可恢复）</text>
  <text x="450" y="136" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">总复杂度 O(n) + O(n/k) = O(n)</text>

  <!-- side note -->
  <text x="330" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">原字符全部移除，任填即恢复</text>
  <text x="336" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w[i:] 是前缀，一轮可恢复</text>
</svg>
