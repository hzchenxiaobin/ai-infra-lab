<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：有序集合管邻居，线段树管 d 的区间加 / 区间 max</text>

  <!-- start -->
  <rect x="195" y="40" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">逐个处理 queries[i]</text>
  <path d="M 260 68 L 260 84" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- type diamond -->
  <polygon points="260,86 330,110 260,134 190,110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">操作类型？</text>

  <!-- type 1 branch -->
  <path d="M 190 110 L 102 110 L 102 138" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="102" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">type 1</text>

  <rect x="28" y="140" width="148" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="102" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">有序集合插入 x</text>
  <text x="102" y="176" text-anchor="middle" font-size="10" fill="#555">prev = 左邻居，next = 右邻居</text>
  <path d="M 102 186 L 102 206" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="28" y="208" width="148" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="102" y="226" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">线段树区间加</text>
  <text x="102" y="244" text-anchor="middle" font-size="10" fill="#555">[x+1, next] += prev − x</text>

  <!-- loop back -->
  <path d="M 28 231 L 12 231 L 12 54 L 193 54" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="150" font-size="9" fill="#999" transform="rotate(-90 20 150)">下一操作</text>

  <!-- note under left branch -->
  <path d="M 102 254 L 102 284" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="34" y="286" width="142" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="304" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">d[x] 不必单独更新：</text>
  <text x="105" y="320" text-anchor="middle" font-size="9" fill="#d6a040">插入前它本就 = x − prev</text>

  <!-- type 2 branch -->
  <path d="M 330 110 L 420 110 L 420 136" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="102" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">type 2</text>

  <rect x="344" y="138" width="152" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420" y="156" text-anchor="middle" font-size="10" fill="#555">若 sz &gt; x：直接 false</text>
  <text x="420" y="174" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否则查 max d[sz..x]</text>
  <path d="M 420 184 L 420 202" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="420,204 478,228 420,252 362,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="232" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">max ≥ sz ?</text>

  <path d="M 420 252 L 420 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="262" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="352" y="266" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="385" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">true</text>

  <path d="M 478 228 L 466 228 L 466 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="222" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <rect x="434" y="266" width="62" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="465" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">false</text>

  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#888">插入与查询都是一次 O(log C) 的线段树操作，总计 O(q log C)</text>
</svg>
