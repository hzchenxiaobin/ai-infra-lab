<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[10,5,15,3,7,null,18]，[7,15] → 32</text>

  <!-- ===== 左侧：BST 访问顺序标注 ===== -->
  <text x="170" y="56" text-anchor="middle" font-size="12" fill="#888">DFS 访问顺序（绿色=命中累加，蓝/橙=剪枝跳过一侧）</text>

  <g font-size="12">
    <!-- 根 10 命中 (步1) -->
    <circle cx="170" cy="92" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="170" y="97" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <text x="143" y="80" font-size="10" fill="#4a7a3a" font-weight="bold">①+10</text>
    <!-- 5 偏左 (步2) -->
    <circle cx="110" cy="148" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="110" y="153" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
    <text x="86" y="138" font-size="10" fill="#446688" font-weight="bold">② 舍左</text>
    <!-- 15 命中 (步5) -->
    <circle cx="230" cy="148" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="230" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">15</text>
    <text x="248" y="138" font-size="10" fill="#4a7a3a" font-weight="bold">⑤+15</text>
    <!-- 连线根->5,根->15 -->
    <line x1="160" y1="105" x2="120" y2="134" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="180" y1="105" x2="220" y2="134" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- 7 命中 (步3) -->
    <circle cx="145" cy="206" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="145" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
    <text x="118" y="198" font-size="10" fill="#4a7a3a" font-weight="bold">③+7</text>
    <!-- 3 偏左被剪 (步4)：叉号 -->
    <circle cx="95" cy="206" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="95" y="211" text-anchor="middle" font-size="11" fill="#446688">3</text>
    <path d="M 82 193 L 108 219" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <path d="M 108 193 L 82 219" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="58" y="200" font-size="9" fill="#b85450">④ 舍左</text>
    <!-- 连线 5->3(虚线，剪掉), 5->7 -->
    <line x1="102" y1="161" x2="98" y2="192" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <line x1="118" y1="161" x2="138" y2="192" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <!-- 18 偏右被剪 (步6) -->
    <circle cx="280" cy="206" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="280" y="211" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">18</text>
    <path d="M 267 193 L 293 219" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <path d="M 293 193 L 267 219" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="298" y="200" font-size="9" fill="#b85450">⑥ 舍右</text>
    <!-- 连线 15->18(虚线橙) -->
    <line x1="238" y1="161" x2="272" y2="192" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)"/>
  </g>

  <!-- 访问路径箭头链 -->
  <text x="170" y="252" text-anchor="middle" font-size="10" fill="#888">访问链：10 → 5 → 7 → 3 → 15 → 18</text>

  <!-- ===== 右侧：逐步累加表 ===== -->
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#888">逐步累加</text>

  <!-- 表头 -->
  <rect x="370" y="68" width="180" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="395" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <text x="445" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">节点</text>
  <text x="510" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">累加和</text>

  <!-- 行 -->
  <g font-size="11">
    <!-- ① 10 +10 -->
    <rect x="370" y="92" width="180" height="22" rx="2" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="395" y="107" text-anchor="middle" fill="#333">①</text>
    <text x="445" y="107" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <text x="510" y="107" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <!-- ② 5 跳过 -->
    <rect x="370" y="114" width="180" height="22" rx="2" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="395" y="129" text-anchor="middle" fill="#333">②</text>
    <text x="445" y="129" text-anchor="middle" fill="#446688">5</text>
    <text x="510" y="129" text-anchor="middle" fill="#666">10</text>
    <!-- ③ 7 +7 -->
    <rect x="370" y="136" width="180" height="22" rx="2" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="395" y="151" text-anchor="middle" fill="#333">③</text>
    <text x="445" y="151" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <text x="510" y="151" text-anchor="middle" fill="#4a7a3a" font-weight="bold">17</text>
    <!-- ④ 3 跳过 -->
    <rect x="370" y="158" width="180" height="22" rx="2" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="395" y="173" text-anchor="middle" fill="#333">④</text>
    <text x="445" y="173" text-anchor="middle" fill="#446688">3</text>
    <text x="510" y="173" text-anchor="middle" fill="#666">17</text>
    <!-- ⑤ 15 +15 -->
    <rect x="370" y="180" width="180" height="22" rx="2" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="395" y="195" text-anchor="middle" fill="#333">⑤</text>
    <text x="445" y="195" text-anchor="middle" fill="#4a7a3a" font-weight="bold">15</text>
    <text x="510" y="195" text-anchor="middle" fill="#4a7a3a" font-weight="bold">32</text>
    <!-- ⑥ 18 跳过 -->
    <rect x="370" y="202" width="180" height="22" rx="2" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="395" y="217" text-anchor="middle" fill="#333">⑥</text>
    <text x="445" y="217" text-anchor="middle" fill="#d6a040">18</text>
    <text x="510" y="217" text-anchor="middle" fill="#666">32</text>
  </g>

  <!-- 最终结果框 -->
  <rect x="370" y="236" width="180" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="259" text-anchor="middle" font-size="13" fill="#7a5a20" font-weight="bold">答案 = 32</text>

  <!-- ===== 底部图例 ===== -->
  <rect x="30" y="300" width="540" height="124" rx="8" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="322" font-size="12" fill="#444" font-weight="bold">图例</text>

  <circle cx="62" cy="346" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="350" font-size="11" fill="#333">命中：low ≤ val ≤ high，累加 val，左右都递归</text>

  <circle cx="62" cy="372" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="376" font-size="11" fill="#333">偏左：val &lt; low，自身及左子树全越界，舍弃左、只走右</text>

  <circle cx="62" cy="398" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="402" font-size="11" fill="#333">偏右：val &gt; high，自身及右子树全越界，舍弃右、只走左</text>

  <path d="M 56 414 L 70 428" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 70 414 L 56 428" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="82" y="424" font-size="11" fill="#333">叉号：该子树被整体剪掉，不再访问</text>
</svg>
