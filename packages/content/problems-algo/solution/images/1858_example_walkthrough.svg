<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：words = ["a","ap","app","appl","apple","apply","banana"]
  </text>

  <line x1="20" y1="50" x2="560" y2="50" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="30" y="75" font-size="12" fill="#4a7a3a" filter="url(#rough2)">DFS 路径（按 a→z 字典序遍历）：</text>

  <rect x="30" y="88" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">root (is_end ✓)</text>

  <path d="M90,116 L90,136" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="130" font-size="10" fill="#d6a040" filter="url(#rough2)">a</text>

  <rect x="30" y="140" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"a" (end✓) ans="a"</text>

  <path d="M90,168 L90,188" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="182" font-size="10" fill="#d6a040" filter="url(#rough2)">p</text>

  <rect x="30" y="192" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"ap" (end✓) ans="ap"</text>

  <path d="M90,220 L90,240" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="234" font-size="10" fill="#d6a040" filter="url(#rough2)">p</text>

  <rect x="30" y="244" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="263" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"app" (end✓) ans="app"</text>

  <path d="M90,272 L90,292" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="286" font-size="10" fill="#d6a040" filter="url(#rough2)">l</text>

  <rect x="30" y="296" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="315" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"appl" (end✓) ans="appl"</text>

  <path d="M90,324 L75,344" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="72" y="338" font-size="10" fill="#d6a040" filter="url(#rough2)">e</text>

  <rect x="10" y="348" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="367" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"apple" ★ ans</text>

  <path d="M130,338 L160,348" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="338" font-size="10" fill="#d6a040" filter="url(#rough2)">y</text>

  <rect x="150" y="352" width="100" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="371" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">"apply" 等长</text>

  <path d="M110,324 L300,344" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="338" font-size="10" fill="#d6a040" filter="url(#rough2)">b</text>

  <rect x="290" y="348" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="367" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">"b" end✗</text>

  <text x="340" y="392" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 断路，不递归</text>

  <rect x="410" y="88" width="160" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="110" font-size="11" fill="#333" filter="url(#rough2)">结果分析：</text>
  <text x="425" y="130" font-size="10.5" fill="#555" filter="url(#rough2)">• apple: len=5, end✓</text>
  <text x="425" y="148" font-size="10.5" fill="#555" filter="url(#rough2)">• apply: len=5, end✓</text>
  <text x="425" y="166" font-size="10.5" fill="#555" filter="url(#rough2)">  等长 → 不替换（e&lt;y）</text>
  <text x="425" y="184" font-size="10.5" fill="#555" filter="url(#rough2)">• banana: b 非 end → 断路</text>
  <text x="425" y="202" font-size="11" fill="#d6a040" filter="url(#rough2)">→ 返回 "apple"</text>

  <rect x="410" y="220" width="160" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="242" font-size="11" fill="#333" filter="url(#rough2)">DFS 遍历顺序：</text>
  <text x="425" y="260" font-size="10" fill="#555" filter="url(#rough2)">root → a → p → p → l</text>
  <text x="425" y="276" font-size="10" fill="#555" filter="url(#rough2)">  → e(apple) → y(apply)</text>
  <text x="425" y="292" font-size="10" fill="#555" filter="url(#rough2)">  → b(断路)</text>
</svg>
