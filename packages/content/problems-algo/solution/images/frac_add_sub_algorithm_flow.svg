<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分数加减运算：算法流程</text>

  <!-- Start -->
  <rect x="230" y="38" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 280 64 L 280 80" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="160" y="82" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="11" fill="#333">num = 0, den = 1（累加器初值 0/1）</text>
  <text x="280" y="116" text-anchor="middle" font-size="11" fill="#333">i = 0</text>
  <path d="M 280 126 L 280 142" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond i<n? -->
  <path d="M 280 144 L 372 172 L 280 200 L 188 172 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="11" fill="#333">i &lt; n?</text>

  <!-- Yes: down -->
  <path d="M 280 200 L 280 222" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="216" font-size="10" fill="#4a7a3a">是</text>

  <!-- No: left then down to reduce -->
  <path d="M 188 172 L 60 172 L 60 374 L 128 374" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="166" font-size="10" fill="#b85450">否</text>

  <!-- loop container -->
  <rect x="100" y="214" width="360" height="120" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#888" font-style="italic">遍历每个分数</text>

  <!-- Parse box -->
  <rect x="120" y="228" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#333">读符号 sign（'−' → −1，'+' → +1，首位无符号视为 +）</text>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#333">读分子 a；跳过 '/'；读分母 b</text>
  <path d="M 280 272 L 280 290" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Combine box -->
  <rect x="120" y="292" width="320" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333">num = num×b + a×den；den = den×b</text>

  <!-- back edge: combine → right → up → to diamond right -->
  <path d="M 440 308 L 500 308 L 500 172 L 372 172" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="244" font-size="10" fill="#4a7a3a">继续</text>

  <!-- Reduce -->
  <rect x="130" y="356" width="300" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#333">g = gcd(|num|, den)；num /= g；den /= g</text>
  <path d="M 280 392 L 280 410" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="130" y="412" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="432" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return "num/den"</text>
  <text x="280" y="446" text-anchor="middle" font-size="10" fill="#888">den 恒正，符号随 num</text>
</svg>
