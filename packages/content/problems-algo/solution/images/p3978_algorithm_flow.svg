<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：定位中间元素 → 单遍计数 → 判定</text>

  <!-- 开始 -->
  <ellipse cx="140" cy="42" rx="34" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="47" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M140,57 L140,65" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 初始化 -->
  <rect x="68" y="68" width="144" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="86" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">① mid ← nums[n/2]；cnt ← 0</text>
  <path d="M140,96 L140,104" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 循环条件 -->
  <polygon points="140,106 204,132 140,158 76,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="136" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">② 还有元素 x？</text>

  <path d="M204,132 L324,132" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="124" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否 · 扫完</text>

  <path d="M140,158 L140,173" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="170" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- ③ 比较 -->
  <polygon points="140,178 200,204 140,230 80,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="208" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">③ x == mid ?</text>

  <path d="M200,204 L241,204" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="219" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="245" y="191" width="62" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="276" y="208" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold" filter="url(#rough2)">cnt++</text>

  <path d="M140,230 L140,256" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="247" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 回到② -->
  <path d="M276,217 L276,258 L34,258 L34,132 L72,132" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="274" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">取下一个 x，回到 ②</text>

  <!-- ④ 判定 -->
  <polygon points="392,104 456,132 392,160 328,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="136" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">④ cnt == 1 ?</text>

  <path d="M392,160 L392,177" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="173" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="348" y="180" width="88" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="392" y="197" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold" filter="url(#rough2)">return true</text>

  <path d="M456,132 L456,246 L440,246" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="464" y="152" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="348" y="233" width="88" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="392" y="250" text-anchor="middle" font-size="10.5" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- 底注 -->
  <rect x="40" y="296" width="445" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="262" y="314" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">一遍扫描 O(n) 时间 · 一个计数器 O(1) 空间</text>
  <text x="262" y="331" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">⚠️ 先在原数组取值再计数——排序会挪动中间元素</text>
</svg>
