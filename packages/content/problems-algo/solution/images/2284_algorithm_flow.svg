<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="480" fill="#fafafa"/>

  <text x="240" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希聚合 → 取最大（平局字典序最大）</text>

  <ellipse cx="240" cy="56" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="61" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>
  <line x1="240" y1="74" x2="240" y2="92" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="96" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="121" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">cnt = {}  空哈希表</text>
  <line x1="240" y1="136" x2="240" y2="154" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="158" width="360" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="180" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">① 遍历 i = 0 .. n−1</text>
  <text x="240" y="200" text-anchor="middle" font-size="11.5" fill="#333">w = messages[i] 中空格数；cnt[senders[i]] += w + 1</text>
  <text x="430" y="178" text-anchor="end" font-size="10" fill="#888" font-weight="bold">O(n·L)</text>
  <line x1="240" y1="214" x2="240" y2="232" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="236" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② ans = 空, best = −1；遍历 (name, c) ∈ cnt</text>
  <line x1="240" y1="276" x2="240" y2="294" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="240,296 332,336 240,376 148,336" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="330" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">c &gt; best 或</text>
  <text x="240" y="346" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(c == best 且 name &gt; ans)?</text>

  <line x1="332" y1="336" x2="346" y2="336" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="335" y="330" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="346" y="316" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="406" y="340" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">best=c; ans=name</text>
  <path d="M 406 356 L 406 382 L 244 382" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <line x1="240" y1="376" x2="240" y2="384" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="382" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <line x1="240" y1="384" x2="240" y2="402" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="406" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="431" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return ans</text>

  <rect x="80" y="454" width="320" height="20" fill="#fafafa" stroke="none"/>
  <text x="240" y="468" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">时间 O(n·L)，空间 O(n)；L = 平均消息长度</text>
</svg>
