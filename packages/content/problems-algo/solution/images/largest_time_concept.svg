<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：4 位数字仅 4!=24 种排列，全枚举取最大有效时间</text>

  <!-- 左列：输入 4 位数字 -->
  <text x="60" y="64" font-size="11" fill="#888">输入 4 位数字</text>
  <rect x="40" y="72" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="94" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="84" y="72" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="94" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <rect x="128" y="72" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="94" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <rect x="172" y="72" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="94" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <path d="M 126 112 L 126 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 全排列枚举 -->
  <rect x="36" y="160" width="180" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="126" y="184" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">全排列枚举</text>
  <text x="126" y="202" text-anchor="middle" font-size="11" fill="#888">4! = 24 种（极小搜索空间）</text>

  <path d="M 126 214 L 126 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 有效性筛选 -->
  <rect x="36" y="260" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="126" y="284" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">有效性筛选</text>
  <text x="126" y="302" text-anchor="middle" font-size="11" fill="#555">HH &lt; 24 且 MM &lt; 60</text>

  <!-- 箭头到右侧有效时间列表 -->
  <path d="M 216 288 Q 270 288 300 200" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 右列：有效时间列表 -->
  <text x="430" y="64" text-anchor="middle" font-size="11" fill="#888">有效时间（部分）</text>
  <rect x="350" y="72" width="160" height="240" fill="none" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <text x="430" y="98" text-anchor="middle" font-size="12" fill="#555">12:34</text>
  <text x="430" y="120" text-anchor="middle" font-size="12" fill="#555">13:42</text>
  <text x="430" y="142" text-anchor="middle" font-size="12" fill="#555">14:23</text>
  <text x="430" y="164" text-anchor="middle" font-size="12" fill="#555">21:34</text>
  <text x="430" y="186" text-anchor="middle" font-size="12" fill="#555">21:43</text>
  <text x="430" y="208" text-anchor="middle" font-size="12" fill="#555">23:14</text>

  <!-- 最大值高亮 -->
  <rect x="356" y="222" width="148" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="243" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">23:41</text>
  <text x="430" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑ 字符串最大即时间最大</text>

  <!-- 底部论证 -->
  <rect x="30" y="340" width="520" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="362" font-size="11.5" fill="#b85450" font-weight="bold">为何「全枚举」是最优解？</text>
  <text x="50" y="378" font-size="10.5" fill="#555">搜索空间 4!=24 恒定，每种排列 O(1) 判定；无需贪心剪枝，逻辑无歧义、最不易出错</text>
</svg>
