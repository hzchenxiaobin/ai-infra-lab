<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分查找流程（闭区间 [left, right]）</text>

  <!-- start -->
  <rect x="210" y="44" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#333">left=0, right=n−1</text>
  <path d="M 270 78 L 270 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop cond diamond -->
  <polygon points="270,100 360,150 270,200 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left ≤ right ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="10.5" fill="#888">否则区间为空</text>

  <!-- no branch -> return -1 -->
  <path d="M 360 150 L 470 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="410" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="162" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return −1</text>

  <!-- yes branch down -->
  <path d="M 270 200 L 270 218" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="282" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- mid compute -->
  <rect x="180" y="222" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="244" text-anchor="middle" font-size="12" fill="#333">mid = left + (right−left)/2</text>
  <path d="M 270 256 L 270 276" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <polygon points="270,280 380,330 270,380 160,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[mid] vs target</text>
  <text x="270" y="344" text-anchor="middle" font-size="10.5" fill="#888">三种情况</text>

  <!-- equal -> return mid (left) -->
  <path d="M 160 330 L 110 330 L 110 372" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="132" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">==</text>
  <rect x="50" y="376" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="397" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return mid ✅</text>

  <!-- less -> left=mid+1 (down) -->
  <path d="M 270 380 L 270 402" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="396" font-size="11" fill="#446688" font-weight="bold">mid &lt; target</text>
  <rect x="180" y="406" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="428" text-anchor="middle" font-size="12" fill="#333">left = mid + 1（答案在右半）</text>

  <!-- greater -> right=mid-1 (right) -->
  <path d="M 380 330 L 440 330 L 440 372" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="416" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mid &gt; target</text>
  <rect x="360" y="376" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="397" text-anchor="middle" font-size="12" fill="#333">right = mid − 1（左半）</text>

  <!-- loop back arrows -->
  <path d="M 270 440 L 270 452 L 460 452 L 460 150 L 470 150" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 445 376 L 445 150 L 470 150" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="498" y="300" text-anchor="middle" font-size="10" fill="#888">回循环</text>
</svg>
