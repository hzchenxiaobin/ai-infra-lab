<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#aaa"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：只有两种交替目标——分别比对取最小</text>
  <text x="320" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">A 起始 '0'：0101…   B 起始 '1'：1010…   两者逐位互补</text>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="148" y="72">i=0</text>
    <text x="212" y="72">i=1</text>
    <text x="276" y="72">i=2</text>
    <text x="340" y="72">i=3</text>
  </g>

  <!-- s row -->
  <text x="50" y="101" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">s</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="80" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="148" y="101" fill="#333" font-weight="bold">0</text>
    <rect x="184" y="80" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="212" y="101" fill="#333" font-weight="bold">1</text>
    <rect x="248" y="80" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="276" y="101" fill="#333" font-weight="bold">0</text>
    <rect x="312" y="80" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="340" y="101" fill="#333" font-weight="bold">0</text>
  </g>
  <text x="500" y="101" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 4</text>

  <!-- Pattern A row: 0 1 0 1 ; mismatch at pos3 -->
  <text x="45" y="156" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">A(0起)</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="135" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="148" y="156" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="184" y="135" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="212" y="156" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="248" y="135" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="276" y="156" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="312" y="135" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="340" y="156" fill="#b85450" font-weight="bold">1</text>
  </g>
  <rect x="425" y="138" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="156" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">diffA = 1</text>

  <!-- A match labels -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <text x="148" y="182" fill="#4a7a3a">✓</text>
    <text x="212" y="182" fill="#4a7a3a">✓</text>
    <text x="276" y="182" fill="#4a7a3a">✓</text>
    <text x="340" y="182" fill="#b85450" font-weight="bold">✗ 改</text>
  </g>

  <!-- Pattern B row: 1 0 1 0 ; mismatches at pos0,1,2 -->
  <text x="45" y="221" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">B(1起)</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="200" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="148" y="221" fill="#b85450" font-weight="bold">1</text>
    <rect x="184" y="200" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="212" y="221" fill="#b85450" font-weight="bold">0</text>
    <rect x="248" y="200" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="276" y="221" fill="#b85450" font-weight="bold">1</text>
    <rect x="312" y="200" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="340" y="221" fill="#4a7a3a" font-weight="bold">0</text>
  </g>
  <rect x="425" y="203" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="221" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">diffB = 3</text>

  <!-- B match labels -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <text x="148" y="247" fill="#b85450" font-weight="bold">✗ 改</text>
    <text x="212" y="247" fill="#b85450" font-weight="bold">✗ 改</text>
    <text x="276" y="247" fill="#b85450" font-weight="bold">✗ 改</text>
    <text x="340" y="247" fill="#4a7a3a">✓</text>
  </g>

  <!-- arrow down to min box -->
  <path d="M 500 229 L 500 258" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- min result box -->
  <rect x="360" y="258" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="500" y="281" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = min(diffA, diffB) = min(1, 3) = 1</text>

  <!-- bottom note -->
  <rect x="50" y="304" width="540" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">A、B 互补：同一位置 i 必有一方匹配、一方不匹配</text>
  <text x="320" y="346" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">故 diffA + diffB = n  →  只需算 diffA，diffB = n − diffA</text>
  <text x="320" y="368" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">一趟扫描统计与 pattern A 的差异位数即可</text>
</svg>
