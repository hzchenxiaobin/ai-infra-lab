<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：双指针同步推进</text>

  <!-- ========================================= -->
  <!-- ===== Example 1: nums = [4,3,-2,5] ====== -->
  <!-- ========================================= -->
  <text x="28" y="50" font-size="11" fill="#444" font-weight="bold">示例 1：nums = [4,3,-2,5]，total = 10</text>

  <!-- header row of step table -->
  <text x="40" y="78" font-size="9.5" fill="#888">步骤</text>
  <text x="100" y="78" font-size="9.5" fill="#888">nums[i]</text>
  <text x="175" y="78" font-size="9.5" fill="#446688">l(前缀)</text>
  <text x="250" y="78" font-size="9.5" fill="#4a7a3a">r(后缀)</text>
  <text x="330" y="78" font-size="9.5" fill="#d6a040">max(l,r)</text>
  <text x="430" y="78" font-size="9.5" fill="#888">ans</text>
  <line x1="30" y1="84" x2="510" y2="84" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row: initial -->
  <text x="40" y="102" font-size="10" fill="#555">初始</text>
  <text x="100" y="102" font-size="10" fill="#888">—</text>
  <rect x="160" y="90" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="235" y="90" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <text x="330" y="104" font-size="10" fill="#888">—</text>
  <text x="430" y="104" font-size="10" fill="#b85450">-∞</text>

  <!-- row 1: i=0, nums[0]=4 -->
  <text x="40" y="128" font-size="10" fill="#555">① i=0</text>
  <rect x="88" y="116" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="131" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <rect x="160" y="116" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="130" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <rect x="235" y="116" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="130" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <rect x="315" y="116" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="130" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <text x="430" y="130" font-size="10" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- row 2: i=1, nums[1]=3 -->
  <text x="40" y="154" font-size="10" fill="#555">② i=1</text>
  <rect x="88" y="142" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="157" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="142" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="156" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <rect x="235" y="142" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="156" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <rect x="315" y="142" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="156" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="430" y="156" font-size="10" fill="#888">10</text>

  <!-- row 3: i=2, nums[2]=-2 -->
  <text x="40" y="180" font-size="10" fill="#555">③ i=2</text>
  <rect x="88" y="168" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="183" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">-2</text>
  <rect x="160" y="168" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="182" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="235" y="168" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="182" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="315" y="168" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="182" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="430" y="182" font-size="10" fill="#888">10</text>

  <!-- row 4: i=3, nums[3]=5 -->
  <text x="40" y="206" font-size="10" fill="#555">④ i=3</text>
  <rect x="88" y="194" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="209" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">5</text>
  <rect x="160" y="194" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="208" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <rect x="235" y="194" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="208" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="315" y="194" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="208" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <text x="430" y="208" font-size="10" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- result example 1 -->
  <rect x="40" y="222" width="470" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="240" font-size="10.5" fill="#333" font-weight="bold">结果：ans = 10 ✓（最大前缀和=10，最大后缀和=10，取大=10）</text>

  <!-- =========================================== -->
  <!-- ===== Example 2: nums = [-3,-5] =========== -->
  <!-- =========================================== -->
  <text x="28" y="282" font-size="11" fill="#444" font-weight="bold">示例 2：nums = [-3,-5]，total = -8（全负陷阱）</text>

  <text x="40" y="308" font-size="9.5" fill="#888">步骤</text>
  <text x="100" y="308" font-size="9.5" fill="#888">nums[i]</text>
  <text x="175" y="308" font-size="9.5" fill="#446688">l(前缀)</text>
  <text x="250" y="308" font-size="9.5" fill="#4a7a3a">r(后缀)</text>
  <text x="330" y="308" font-size="9.5" fill="#d6a040">max(l,r)</text>
  <text x="430" y="308" font-size="9.5" fill="#888">ans</text>
  <line x1="30" y1="314" x2="510" y2="314" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- initial -->
  <text x="40" y="332" font-size="10" fill="#555">初始</text>
  <text x="100" y="332" font-size="10" fill="#888">—</text>
  <rect x="160" y="320" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="334" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="235" y="320" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="334" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-8</text>
  <text x="330" y="334" font-size="10" fill="#888">—</text>
  <text x="430" y="334" font-size="10" fill="#b85450">-∞</text>

  <!-- row 1: i=0, -3 -->
  <text x="40" y="358" font-size="10" fill="#555">① i=0</text>
  <rect x="88" y="346" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="361" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">-3</text>
  <rect x="160" y="346" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="360" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-3</text>
  <rect x="235" y="346" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="360" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-8</text>
  <rect x="315" y="346" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="360" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-3</text>
  <text x="430" y="360" font-size="10" fill="#4a7a3a" font-weight="bold">-3</text>

  <!-- row 2: i=1, -5 -->
  <text x="40" y="384" font-size="10" fill="#555">② i=1</text>
  <rect x="88" y="372" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="387" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">-5</text>
  <rect x="160" y="372" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="386" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-8</text>
  <rect x="235" y="372" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="386" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-5</text>
  <rect x="315" y="372" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="386" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-5</text>
  <text x="430" y="386" font-size="10" fill="#888">-3</text>

  <!-- result example 2 -->
  <rect x="40" y="402" width="470" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="420" font-size="10.5" fill="#333" font-weight="bold">结果：ans = -3 ✓（最大前缀和=-3，最大后缀和=-5，取大=-3）</text>

  <!-- ===== Footer warning ===== -->
  <rect x="40" y="438" width="470" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="275" y="456" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⚠️ 全负陷阱：ans 初值必须为极小(-∞)，否则示例 2 会误返回 0</text>
  <text x="275" y="469" text-anchor="middle" font-size="9.5" fill="#b85450">总和可达 10^10，须用 long long / Python 大整数</text>
</svg>
