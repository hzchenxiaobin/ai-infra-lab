<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：一维下标 idx = i × n + j 映射到二维 [i][j]</text>

  <!-- 1D array label -->
  <text x="40" y="74" font-size="12" fill="#888">original (1D)：</text>

  <!-- 1D array cells: [1,2,3,4], n=2 -->
  <rect x="150" y="58" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="208" y="58" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="266" y="58" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="324" y="58" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- index labels under 1D -->
  <text x="178" y="104" text-anchor="middle" font-size="10" fill="#888">idx=0</text>
  <text x="236" y="104" text-anchor="middle" font-size="10" fill="#888">idx=1</text>
  <text x="294" y="104" text-anchor="middle" font-size="10" fill="#888">idx=2</text>
  <text x="352" y="104" text-anchor="middle" font-size="10" fill="#888">idx=3</text>

  <!-- chunk brackets -->
  <text x="207" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">第 0 行 (idx 0..n−1)</text>
  <text x="321" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">第 1 行 (idx n..2n−1)</text>

  <!-- arrows from 1D chunks down to 2D rows -->
  <path d="M 207 124 Q 207 160 170 180" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 321 124 Q 321 160 290 180" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2D array label -->
  <text x="40" y="196" font-size="12" fill="#888">result (2D, m=2, n=2)：</text>

  <!-- 2D array grid -->
  <!-- row 0 -->
  <rect x="150" y="184" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="208" y="184" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="140" y="206" text-anchor="end" font-size="10" fill="#446688" font-weight="bold">i=0</text>

  <!-- row 1 -->
  <rect x="150" y="220" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="242" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="208" y="220" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="242" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="140" y="242" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">i=1</text>

  <!-- column labels -->
  <text x="178" y="272" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <text x="236" y="272" text-anchor="middle" font-size="10" fill="#888">j=1</text>

  <!-- formula box -->
  <rect x="370" y="58" width="250" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="495" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">下标映射公式</text>
  <text x="495" y="106" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">result[i][j] = original[i × n + j]</text>
  <text x="495" y="126" text-anchor="middle" font-size="10" fill="#888">第 i 行第 j 列 ← 第 (i×n+j) 个元素</text>

  <!-- length check box -->
  <rect x="370" y="150" width="250" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="495" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">前置条件：长度校验</text>
  <text x="495" y="198" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">original.length == m × n ?</text>
  <text x="495" y="218" text-anchor="middle" font-size="10" fill="#888">不等 → 直接返回空数组 []</text>

  <!-- key insight -->
  <rect x="40" y="296" width="560" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="320" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">为什么这样映射一定对？</text>
  <text x="60" y="344" font-size="11" fill="#555">• 二维数组按行主序存储时，内存线性下标正是 idx = i × n + j。</text>
  <text x="60" y="364" font-size="11" fill="#555">• 题目规定"前 n 个元素成第 0 行，第 n~2n−1 成第 1 行"——即行主序填充。</text>
  <text x="60" y="384" font-size="11" fill="#555">• 所以只需一次双重循环，用公式直接取值，无需搬运或额外空间。</text>
  <text x="60" y="398" font-size="11" fill="#4a7a3a" font-weight="bold">  本质：把 reshape 操作还原为「行主序」下标的代数映射。</text>
</svg>
