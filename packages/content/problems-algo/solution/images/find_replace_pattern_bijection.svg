<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">逐词双射判定：从列表筛出同构于 pattern 的词</text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每个 word 与 pattern 做一次 205 式双向哈希核对</text>

  <!-- pattern 行：abb 居中 -->
  <text x="200" y="96" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">pattern</text>
  <rect x="238" y="76" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="252" y="98" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <rect x="268" y="76" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="282" y="98" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <rect x="298" y="76" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="312" y="98" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>

  <!-- 从 pattern 向下分叉到 6 个词的虚线 -->
  <path d="M 280 110 Q 280 140 100 168" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 110 Q 280 140 240 168" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 110 Q 280 140 380 168" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 110 Q 280 230 100 300" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 110 Q 280 230 240 300" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 110 Q 280 230 380 300" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第一行词：abc ✗ , deq ✗ , mee ✓ -->
  <!-- abc -->
  <rect x="72" y="170" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="84" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="98" y="170" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="110" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="124" y="170" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="136" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="110" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ b→c 冲突</text>

  <!-- deq -->
  <rect x="212" y="170" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="224" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="238" y="170" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="250" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="264" y="170" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="276" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">q</text>
  <text x="250" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ b→q 冲突</text>

  <!-- mee -->
  <rect x="352" y="170" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="364" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">m</text>
  <rect x="378" y="170" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="390" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="404" y="170" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="416" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <text x="390" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ m↔a, e↔b</text>

  <!-- 第二行词：aqq ✓ , dkd ✗ , ccc ✗ -->
  <!-- aqq -->
  <rect x="72" y="300" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="84" y="320" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="98" y="300" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="110" y="320" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">q</text>
  <rect x="124" y="300" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="136" y="320" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">q</text>
  <text x="110" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ a↔a, q↔b</text>

  <!-- dkd -->
  <rect x="212" y="300" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="224" y="320" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="238" y="300" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="250" y="320" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">k</text>
  <rect x="264" y="300" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="276" y="320" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <text x="250" y="344" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ b→k≠d</text>

  <!-- ccc -->
  <rect x="352" y="300" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="364" y="320" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="378" y="300" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="390" y="320" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="404" y="300" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="416" y="320" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="390" y="344" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ a/c 撤射</text>

  <!-- 底部输出结论 -->
  <rect x="150" y="362" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输出：["mee", "aqq"]</text>
</svg>
