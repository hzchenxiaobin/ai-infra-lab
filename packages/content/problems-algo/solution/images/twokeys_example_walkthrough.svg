<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 12 的操作序列</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">因数链 2 × 2 × 3，每段「复制 + 粘贴 k−1 次」= k 步，合计 2+2+3 = 7</text>

  <!-- ===== Stage 1: 1 A ===== -->
  <rect x="20" y="70" width="96" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="68" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始</text>
  <text x="68" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1 个 A</text>

  <!-- op arrow 1 -->
  <path d="M 116 99 L 150 99" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="118" y="76" width="32" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="134" y="89" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">×2</text>
  <text x="133" y="120" text-anchor="middle" font-size="9" fill="#888">2 步</text>

  <!-- ===== Stage 2: 2 A ===== -->
  <rect x="152" y="70" width="96" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Copy+Paste</text>
  <text x="200" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2 个 A</text>

  <!-- op arrow 2 -->
  <path d="M 248 99 L 282 99" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="76" width="32" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="266" y="89" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">×2</text>
  <text x="265" y="120" text-anchor="middle" font-size="9" fill="#888">2 步</text>

  <!-- ===== Stage 3: 4 A ===== -->
  <rect x="284" y="70" width="96" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="332" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Copy+Paste</text>
  <text x="332" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4 个 A</text>

  <!-- op arrow 3 -->
  <path d="M 380 99 L 414 99" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="76" width="36" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="398" y="89" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">×3</text>
  <text x="397" y="120" text-anchor="middle" font-size="9" fill="#888">3 步</text>

  <!-- ===== Stage 4: 12 A ===== -->
  <rect x="416" y="70" width="120" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="476" y="92" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Copy+Paste×2</text>
  <text x="476" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">12 个 A</text>

  <!-- ===== running total ===== -->
  <line x1="20" y1="148" x2="536" y2="148" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <text x="20" y="172" font-size="11" fill="#555" font-weight="bold">累计步数：</text>

  <rect x="96" y="160" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="175" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <path d="M 140 171 L 196 171" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="160" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="175" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>

  <path d="M 244 171 L 300 171" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="304" y="160" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="324" y="175" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>

  <path d="M 348 171 L 404 171" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="408" y="160" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="430" y="175" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">7 ✓</text>

  <!-- ===== factor chain ===== -->
  <rect x="20" y="210" width="516" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="278" y="230" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">因数链：12 = 2 × 2 × 3</text>
  <text x="278" y="246" text-anchor="middle" font-size="10" fill="#666">每段乘 k 花 k 步 → 总步数 = 因子之和 = 2 + 2 + 3 = 7</text>

  <!-- ===== DP highlights ===== -->
  <text x="20" y="284" font-size="12" fill="#444" font-weight="bold">DP 表关键值：</text>

  <rect x="20" y="296" width="500" height="64" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>

  <rect x="40" y="308" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="324" text-anchor="middle" font-size="10" fill="#666">dp[2]</text>
  <text x="68" y="340" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <rect x="124" y="308" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="324" text-anchor="middle" font-size="10" fill="#666">dp[4]</text>
  <text x="152" y="340" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>

  <rect x="208" y="308" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="324" text-anchor="middle" font-size="10" fill="#666">dp[6]</text>
  <text x="236" y="340" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>

  <rect x="292" y="308" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="324" text-anchor="middle" font-size="10" fill="#666">dp[9]</text>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">6</text>

  <rect x="376" y="308" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[12]</text>
  <text x="412" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7 ✓</text>

  <text x="466" y="332" font-size="9" fill="#888">= 质因数之和</text>
</svg>
