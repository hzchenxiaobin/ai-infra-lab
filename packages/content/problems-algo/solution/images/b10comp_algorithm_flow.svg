<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：掩码法求补数（含 n=0 兜底）</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="58" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="260" y1="78" x2="260" y2="94" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- read n -->
  <rect x="180" y="98" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">输入 n（n ≥ 0）</text>

  <line x1="260" y1="132" x2="260" y2="148" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: n == 0 ? -->
  <polygon points="260,152 346,194 260,236 174,194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n == 0 ?</text>
  <text x="260" y="206" text-anchor="middle" font-size="10.5" fill="#888">边界兜底</text>

  <!-- Yes branch: right to return 1 -->
  <text x="354" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="346" y1="194" x2="396" y2="194" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="396" y="176" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="442" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return 1</text>

  <!-- No branch: down -->
  <text x="268" y="252" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <line x1="260" y1="236" x2="260" y2="254" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- L = bit_length(n) -->
  <rect x="120" y="258" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">L = bit_length(n)   // 有效位数</text>

  <line x1="260" y1="292" x2="260" y2="308" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mask = (1 << L) - 1 -->
  <rect x="120" y="312" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">mask = (1 &lt;&lt; L) − 1   // 低 L 位全 1</text>

  <line x1="260" y1="346" x2="260" y2="362" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return n ^ mask -->
  <rect x="120" y="366" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return n ^ mask   // 异或翻转有效位</text>

  <line x1="260" y1="400" x2="260" y2="416" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="260" cy="436" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="441" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- side note: merge into max trick -->
  <rect x="396" y="258" width="116" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="454" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">一行合并写法</text>
  <text x="454" y="302" text-anchor="middle" font-size="10" fill="#666">L = max(1, L)</text>
  <text x="454" y="318" text-anchor="middle" font-size="10" fill="#666">免 if 兜底</text>
  <text x="454" y="338" text-anchor="middle" font-size="9.5" fill="#888">n=0 时 mask=1</text>
</svg>
