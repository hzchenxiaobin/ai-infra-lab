<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：一个 true，一个 false</text>

  <!-- Panel 1: example 1 -->
  <rect x="20" y="38" width="252" height="252" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="146" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例 1：t = 6 ≥ d = 5 → true</text>

  <!-- grid 6 cols x=2..7, 5 rows y=3..7, cell 26, origin (70,74) -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="70" y1="74" x2="70" y2="204"/>
    <line x1="96" y1="74" x2="96" y2="204"/>
    <line x1="122" y1="74" x2="122" y2="204"/>
    <line x1="148" y1="74" x2="148" y2="204"/>
    <line x1="174" y1="74" x2="174" y2="204"/>
    <line x1="200" y1="74" x2="200" y2="204"/>
    <line x1="226" y1="74" x2="226" y2="204"/>
    <line x1="70" y1="74" x2="226" y2="74"/>
    <line x1="70" y1="100" x2="226" y2="100"/>
    <line x1="70" y1="126" x2="226" y2="126"/>
    <line x1="70" y1="152" x2="226" y2="152"/>
    <line x1="70" y1="178" x2="226" y2="178"/>
    <line x1="70" y1="204" x2="226" y2="204"/>
  </g>

  <!-- path cells -->
  <g filter="url(#rough2)">
    <rect x="96" y="126" width="26" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <rect x="122" y="100" width="26" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <rect x="148" y="100" width="26" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <rect x="174" y="100" width="26" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <rect x="200" y="100" width="26" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3"/>
  </g>

  <!-- S / F -->
  <rect x="70" y="152" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="83" y="164" text-anchor="middle" font-size="9" font-weight="bold" fill="#446688" filter="url(#rough2)">S</text>
  <text x="83" y="174" text-anchor="middle" font-size="7" fill="#446688" filter="url(#rough2)">(2,4)</text>
  <rect x="200" y="74" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="213" y="86" text-anchor="middle" font-size="9" font-weight="bold" fill="#d6a040" filter="url(#rough2)">F</text>
  <text x="213" y="96" text-anchor="middle" font-size="7" fill="#d6a040" filter="url(#rough2)">(7,7)</text>

  <!-- path arrows -->
  <g stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)">
    <line x1="83" y1="165" x2="109" y2="139" marker-end="url(#arrGreen)"/>
    <line x1="109" y1="139" x2="135" y2="113" marker-end="url(#arrGreen)"/>
    <line x1="135" y1="113" x2="161" y2="139" marker-end="url(#arrGreen)"/>
    <line x1="161" y1="139" x2="187" y2="139" marker-end="url(#arrGreen)"/>
    <line x1="187" y1="139" x2="213" y2="139" marker-end="url(#arrGreen)"/>
    <line x1="213" y1="139" x2="213" y2="103" marker-end="url(#arrGreen)"/>
  </g>
  <g filter="url(#rough2)" font-size="8.5" fill="#4a7a3a">
    <text x="88" y="148">斜</text>
    <text x="114" y="122">斜</text>
    <text x="146" y="132">右</text>
    <text x="172" y="132">右</text>
    <text x="198" y="132">右</text>
    <text x="220" y="122">上</text>
  </g>

  <g text-anchor="middle" filter="url(#rough2)">
    <text x="146" y="226" font-size="10" fill="#333">dx = 5，dy = 3 → d = max = 5</text>
    <text x="146" y="244" font-size="10" fill="#333">t = 6：把一个斜走拆成「右 + 上」</text>
    <text x="146" y="262" font-size="10" fill="#333">→ 恰好 6 步（斜斜右右右上）</text>
    <text x="146" y="280" font-size="11" font-weight="bold" fill="#4a7a3a">6 ≥ 5 ✓ true</text>
  </g>

  <!-- Panel 2: example 2 -->
  <rect x="288" y="38" width="252" height="252" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="414" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">示例 2：t = 3 &lt; d = 4 → false</text>

  <!-- grid 5 cols x=3..7, 3 rows y=1..3, cell 26, origin (346,74) -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="346" y1="74" x2="346" y2="152"/>
    <line x1="372" y1="74" x2="372" y2="152"/>
    <line x1="398" y1="74" x2="398" y2="152"/>
    <line x1="424" y1="74" x2="424" y2="152"/>
    <line x1="450" y1="74" x2="450" y2="152"/>
    <line x1="476" y1="74" x2="476" y2="152"/>
    <line x1="346" y1="74" x2="476" y2="74"/>
    <line x1="346" y1="100" x2="476" y2="100"/>
    <line x1="346" y1="126" x2="476" y2="126"/>
    <line x1="346" y1="152" x2="476" y2="152"/>
  </g>

  <!-- path cells -->
  <g filter="url(#rough2)">
    <rect x="372" y="100" width="26" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3"/>
    <rect x="398" y="74" width="26" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3"/>
    <rect x="424" y="74" width="26" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3"/>
  </g>

  <!-- S / F -->
  <rect x="346" y="126" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="359" y="138" text-anchor="middle" font-size="9" font-weight="bold" fill="#446688" filter="url(#rough2)">S</text>
  <text x="359" y="148" text-anchor="middle" font-size="7" fill="#446688" filter="url(#rough2)">(3,1)</text>
  <rect x="450" y="74" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="463" y="86" text-anchor="middle" font-size="9" font-weight="bold" fill="#d6a040" filter="url(#rough2)">F</text>
  <text x="463" y="96" text-anchor="middle" font-size="7" fill="#d6a040" filter="url(#rough2)">(7,3)</text>

  <!-- path arrows (shortest, 4 steps) -->
  <g stroke="#b85450" stroke-width="2" filter="url(#rough2)">
    <line x1="359" y1="139" x2="385" y2="113" marker-end="url(#arrRed)"/>
    <line x1="385" y1="113" x2="411" y2="87" marker-end="url(#arrRed)"/>
    <line x1="411" y1="87" x2="437" y2="87" marker-end="url(#arrRed)"/>
    <line x1="437" y1="87" x2="463" y2="87" marker-end="url(#arrRed)"/>
  </g>
  <g filter="url(#rough2)" font-size="8.5" fill="#b85450">
    <text x="364" y="122">斜</text>
    <text x="390" y="96">斜</text>
    <text x="422" y="80">右</text>
    <text x="448" y="80">右</text>
  </g>

  <!-- ghost marker: where you can be at second 3 -->
  <circle cx="437" cy="87" r="12" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="437" y="66" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">(6,3)</text>

  <g text-anchor="middle" filter="url(#rough2)">
    <text x="414" y="176" font-size="10" fill="#666">最短路也要 4 步（斜斜右右）</text>
    <text x="414" y="226" font-size="10" fill="#333">dx = 4，dy = 2 → d = max = 4</text>
    <text x="414" y="244" font-size="10" fill="#333">每轴每秒最多推进 1</text>
    <text x="414" y="262" font-size="10" fill="#333">3 秒后 x 最多到 6，够不到 7</text>
    <text x="414" y="280" font-size="11" font-weight="bold" fill="#b85450">3 &lt; 4 ✗ false</text>
  </g>

  <!-- bottom strip -->
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">一句话：d = max(|dx|, |dy|) —— 异格看 t ≥ d，同格防 t = 1</text>
  <text x="280" y="338" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">两个示例恰好覆盖「绕路凑满」与「时间不足」两条分支</text>
</svg>
