<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：周期取余 + 三角波公式，O(1) 一步出解</text>

  <!-- ===== 左侧：流程 ===== -->
  <!-- 输入 -->
  <rect x="60" y="46" width="230" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="175" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 n, time</text>
  <path d="M 175 86 L 175 104" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 周期 -->
  <rect x="60" y="106" width="230" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">① 往返一次 = 周期</text>
  <text x="175" y="139" text-anchor="middle" font-size="12" fill="#333">T = 2(n − 1)</text>
  <path d="M 175 146 L 175 164" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取余 -->
  <rect x="60" y="166" width="230" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="184" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 取余：落在一个周期内</text>
  <text x="175" y="199" text-anchor="middle" font-size="12" fill="#333">t = time mod T</text>
  <path d="M 175 206 L 175 224" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 三角波公式 -->
  <rect x="56" y="226" width="238" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="175" y="245" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 三角波折回（到端点反向）</text>
  <text x="175" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">pos = n − |t − (n − 1)|</text>
  <path d="M 175 274 L 175 292" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="60" y="294" width="230" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="175" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 pos</text>

  <!-- ===== 右侧：代入示例 ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">代入示例：n = 4, time = 5</text>

  <rect x="330" y="74" width="210" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="435" y="92" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">① 周期</text>
  <text x="435" y="108" text-anchor="middle" font-size="11" fill="#333">T = 2(4 − 1) = 6</text>

  <rect x="330" y="126" width="210" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="435" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 取余</text>
  <text x="435" y="160" text-anchor="middle" font-size="11" fill="#333">t = 5 mod 6 = 5</text>

  <rect x="330" y="178" width="210" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)" opacity="0.8"/>
  <text x="435" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 三角波折回</text>
  <text x="435" y="213" text-anchor="middle" font-size="11" fill="#333">pos = 4 − |5 − 3|</text>
  <text x="435" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= 4 − 2 = 2</text>

  <rect x="330" y="240" width="210" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)" opacity="0.8"/>
  <text x="435" y="265" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ 返回 2 ✓</text>

  <!-- 说明框 -->
  <rect x="330" y="294" width="210" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="435" y="312" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">两种等价写法</text>
  <text x="435" y="328" text-anchor="middle" font-size="10" fill="#555">分支：t&lt;n 取 1+t，否则 2n−1−t</text>
  <text x="435" y="344" text-anchor="middle" font-size="10" fill="#555">闭合：n − |t − (n−1)|</text>

  <!-- 连线箭头：左流程 → 右示例 -->
  <path d="M 290 124 L 330 95" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 185 L 330 147" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 294 249 L 330 203" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
