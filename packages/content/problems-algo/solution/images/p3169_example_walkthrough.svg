<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：days = 10，排序后 [[1,3],[5,7],[9,10]]</text>

  <rect x="40" y="40" width="448" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="130" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">会议 [s,e]</text>
  <text x="220" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">s &gt; cur_end ?</text>
  <text x="319" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">空隙</text>
  <text x="398" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">cur_end</text>
  <text x="458" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">free</text>

  <rect x="40" y="68" width="448" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">①</text>
  <text x="130" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,3]</text>
  <text x="220" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 &gt; 0 ✓</text>
  <text x="319" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+0</text>
  <text x="398" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="458" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="100" width="448" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">②</text>
  <text x="130" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[5,7]</text>
  <text x="220" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 &gt; 3 ✓</text>
  <text x="319" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1（第4天）</text>
  <text x="398" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="458" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="40" y="132" width="448" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③</text>
  <text x="130" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[9,10]</text>
  <text x="220" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9 &gt; 7 ✓</text>
  <text x="319" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1（第8天）</text>
  <text x="398" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="458" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="40" y="164" width="448" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="65" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">末</text>
  <text x="130" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">尾部</text>
  <text x="220" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">—</text>
  <text x="319" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">days−10 = 0</text>
  <text x="398" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">10</text>
  <text x="458" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 ✓</text>

  <path d="M 90 40 L 90 196" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 170 40 L 170 196" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 270 40 L 270 196" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 368 40 L 368 196" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 428 40 L 428 196" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="32" y="234" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2：days = 5，meetings = [[2,4],[1,3]]（重叠 + 尾部）</text>

  <text x="90" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="130" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="170" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="210" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="250" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>

  <rect x="70" y="262" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="278" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[1,3]</text>

  <rect x="110" y="292" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="170" y="308" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">[2,4]</text>

  <rect x="230" y="262" width="40" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="250" y="300" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">闲</text>

  <text x="300" y="272" font-size="10.5" fill="#555" filter="url(#rough2)">排序后 [1,3] 先来 → cur_end = 3</text>
  <text x="300" y="296" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">[2,4]：2 ≤ 3 重叠 → 不数空隙</text>
  <text x="300" y="314" font-size="10.5" fill="#555" filter="url(#rough2)">cur_end = max(3, 4) = 4</text>
  <text x="300" y="338" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">尾部：free += 5 − 4 = 1 → 答案 1 ✓</text>

  <rect x="32" y="356" width="456" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ cur_end 必须取 max：[[1,10],[2,3]] 直接赋值会把 10 回退成 3</text>
  <text x="260" y="396" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">排序只保证左端点有序，右端点可能乱序 → 凭空多算空隙</text>

  <rect x="32" y="420" width="456" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="443" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">三个位置一个公式：头部 s₁−1 · 中间 s−cur_end−1 · 尾部 days−cur_end</text>
</svg>
