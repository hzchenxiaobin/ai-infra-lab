<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算</text>

  <!-- ===== Assignment table ===== -->
  <text x="30" y="54" font-size="12" fill="#666" filter="url(#rough2)">① 给 -1 项目分配新组号</text>

  <!-- header: item index -->
  <rect x="110" y="64" width="60" height="26" fill="#eee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="81" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">项目</text>
  <rect x="170" y="64" width="34" height="26" fill="#eee" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="187" y="81" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <rect x="204" y="64" width="34" height="26" fill="#eee" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="221" y="81" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <rect x="238" y="64" width="34" height="26" fill="#eee" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="255" y="81" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <rect x="272" y="64" width="34" height="26" fill="#eee" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="289" y="81" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <rect x="306" y="64" width="34" height="26" fill="#eee" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="323" y="81" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <rect x="340" y="64" width="34" height="26" fill="#eee" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="357" y="81" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <rect x="374" y="64" width="34" height="26" fill="#eee" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="391" y="81" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">6</text>
  <rect x="408" y="64" width="34" height="26" fill="#eee" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="425" y="81" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">7</text>

  <!-- row: 原组 -->
  <rect x="110" y="90" width="60" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="107" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">原组</text>
  <rect x="170" y="90" width="34" height="26" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="187" y="107" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">-1</text>
  <rect x="204" y="90" width="34" height="26" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="221" y="107" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">-1</text>
  <rect x="238" y="90" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="255" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="272" y="90" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="289" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="306" y="90" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="323" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="340" y="90" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="357" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="374" y="90" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="391" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="408" y="90" width="34" height="26" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="425" y="107" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">-1</text>

  <!-- row: 新组 -->
  <rect x="110" y="116" width="60" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="133" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">新组</text>
  <rect x="170" y="116" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="187" y="133" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="204" y="116" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="221" y="133" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">3</text>
  <rect x="238" y="116" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="255" y="133" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="272" y="116" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="289" y="133" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="306" y="116" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="323" y="133" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="340" y="116" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="357" y="133" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="374" y="116" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="391" y="133" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="408" y="116" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="425" y="133" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">4</text>

  <!-- ===== Group order ===== -->
  <text x="30" y="172" font-size="12" fill="#666" filter="url(#rough2)">② 小组拓扑序：G0 → G3 → G1 → G2 → G4</text>

  <rect x="40" y="184" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="65" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G0</text>
  <path d="M90,200 L108,200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="108" y="184" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="133" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G3</text>
  <path d="M158,200 L176,200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="176" y="184" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="201" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G1</text>
  <path d="M226,200 L244,200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="244" y="184" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="269" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G2</text>
  <path d="M294,200 L312,200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="312" y="184" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="337" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G4</text>
  <text x="380" y="205" font-size="10" fill="#888" filter="url(#rough2)">(G0→G3 是唯一约束)</text>

  <!-- ===== Per-group item topo ===== -->
  <text x="30" y="248" font-size="12" fill="#666" filter="url(#rough2)">③ 每组内项目拓扑排序后拼接</text>

  <rect x="30" y="260" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G0: 6→3→4</text>
  <rect x="230" y="260" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G3: 1</text>
  <rect x="310" y="260" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G1: 5→2</text>
  <rect x="410" y="260" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G2:0</text>
  <rect x="470" y="260" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="500" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G4:7</text>

  <path d="M280,294 L280,316" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Final result ===== -->
  <rect x="60" y="320" width="440" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="349" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">结果：[6, 3, 4, 1, 5, 2, 0, 7]</text>

  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同组相邻 ✓ 依赖满足 ✓（6 在 1/3/4 前，5 在 2 前，3 与 6 在 4 前）</text>
</svg>
