<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">单条查询流程：两个菱形三个分支，答案永远看堆顶</text>

  <!-- A 起始 -->
  <rect x="90" y="36" width="160" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="53" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">查询 (x, y) 到达</text>
  <path d="M 170 62 L 170 74" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B 算距离 -->
  <rect x="90" y="78" width="160" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="95" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">d = |x| + |y|</text>
  <path d="M 170 104 L 170 114" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C 菱形：堆未满？ -->
  <polygon points="170,118 256,148 170,178 84,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="152" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">堆大小 &lt; k？</text>
  <path d="M 256 148 C 274 148, 284 141, 296 141" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="139" font-size="10" fill="#7a6a50" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 170 178 L 170 188" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="187" font-size="10" fill="#7a6a50" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- D 菱形：比堆顶近？ -->
  <polygon points="170,192 256,222 170,252 84,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="226" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">d &lt; 堆顶？</text>
  <path d="M 256 222 C 274 222, 284 211, 296 211" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="209" font-size="10" fill="#7a6a50" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 170 252 L 170 281 L 294 281" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="179" y="270" font-size="10" fill="#7a6a50" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 右侧三个动作框 -->
  <rect x="300" y="124" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="145" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">d 入堆（堆未满）</text>

  <rect x="300" y="194" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="215" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">弹堆顶，d 入堆（换人）</text>

  <rect x="300" y="264" width="160" height="34" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="285" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">丢弃 d（堆不动）</text>

  <!-- 汇流总线（虚线） -->
  <path d="M 460 141 L 480 141 L 480 312" fill="none" stroke="#a07830" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 211 L 480 211" fill="none" stroke="#a07830" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 460 281 L 480 281" fill="none" stroke="#a07830" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- E 出答案 -->
  <rect x="60" y="318" width="430" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="275" y="333" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">出答案：堆已满（= k）→ results[i] = 堆顶；未满 → −1</text>
  <text x="275" y="347" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">↺ 下一条查询，共 n 轮 · 每轮至多一次堆操作 O(log k)</text>
</svg>
