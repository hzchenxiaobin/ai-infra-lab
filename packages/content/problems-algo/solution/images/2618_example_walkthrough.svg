<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="330" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：四个用例的原型链上溯过程</text>

  <!-- header row -->
  <rect x="10"  y="38" width="60"  height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="70"  y="38" width="120" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="38" width="110" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="38" width="210" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="510" y="38" width="60"  height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40"  y="58" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">示例</text>
  <text x="130" y="58" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">obj / 值</text>
  <text x="245" y="58" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">classFunction</text>
  <text x="405" y="58" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">原型链上溯过程</text>
  <text x="540" y="58" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">结果</text>

  <!-- row 1 -->
  <rect x="10"  y="68" width="60"  height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70"  y="68" width="120" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="68" width="110" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="300" y="68" width="210" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="510" y="68" width="60"  height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40"  y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">new Date()</text>
  <text x="245" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Date</text>
  <text x="405" y="94" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">Date.prototype ✓命中</text>
  <text x="540" y="94" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">true</text>

  <!-- row 2 -->
  <rect x="10"  y="112" width="60"  height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70"  y="112" width="120" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="112" width="110" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="300" y="112" width="210" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="510" y="112" width="60"  height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40"  y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">new Dog()</text>
  <text x="245" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Animal</text>
  <text x="405" y="138" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">Dog.prototype → Animal.prototype ✓</text>
  <text x="540" y="138" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">true</text>

  <!-- row 3 -->
  <rect x="10"  y="156" width="60"  height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70"  y="156" width="120" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="156" width="110" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="300" y="156" width="210" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="510" y="156" width="60"  height="44" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40"  y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="130" y="182" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Date（函数）</text>
  <text x="245" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Date</text>
  <text x="405" y="182" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">Function.p → Object.p → null ✗</text>
  <text x="540" y="182" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">false</text>

  <!-- row 4 -->
  <rect x="10"  y="200" width="60"  height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70"  y="200" width="120" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="200" width="110" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="300" y="200" width="210" height="44" rx="3" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="510" y="200" width="60"  height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40"  y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="130" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5（原始值）</text>
  <text x="245" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Number</text>
  <text x="405" y="226" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">Number.prototype ✓命中（装箱）</text>
  <text x="540" y="226" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">true</text>

  <!-- bottom note -->
  <text x="290" y="276" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">关键：把 classFunction.prototype 当成靶子，沿 obj 的原型链逐格比对</text>
  <text x="290" y="296" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">链尽头 null 仍未命中即返回 false；原始值靠 getPrototypeOf 自动装箱入链</text>
</svg>
