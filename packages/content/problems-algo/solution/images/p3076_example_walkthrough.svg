<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：arr = ["cab","ad","bad","c"] 的归属表与答案</text>

  <!-- table header -->
  <rect x="40" y="42" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="60" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">子串</text>
  <text x="215" y="60" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mask（出现下标集合）</text>
  <text x="440" y="60" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- rows: shared (red-ish) -->
  <rect x="40" y="68" width="480" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="85" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"a"</text>
  <text x="215" y="85" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{0, 1, 2}</text>
  <text x="440" y="85" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 三家共享</text>

  <rect x="40" y="92" width="480" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="109" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"c"</text>
  <text x="215" y="109" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{0, 3}</text>
  <text x="440" y="109" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ cab 与 c 共享</text>

  <rect x="40" y="116" width="480" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="133" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"b" / "d"</text>
  <text x="215" y="133" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{0, 2} / {1, 2}</text>
  <text x="440" y="133" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 两家共享</text>

  <rect x="40" y="140" width="480" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"ad"</text>
  <text x="215" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{1, 2}</text>
  <text x="440" y="157" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ bad 也含 ad → i=1 无解</text>

  <!-- rows: uncommon -->
  <rect x="40" y="164" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="181" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">"ca"</text>
  <text x="215" y="181" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">{0}</text>
  <text x="440" y="181" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 长 2 候选（i=0）</text>

  <rect x="40" y="188" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="205" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">"ab"</text>
  <text x="215" y="205" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">{0}</text>
  <text x="440" y="205" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓ 同长，ab &lt; ca ★ 胜出</text>

  <rect x="40" y="212" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="229" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">"ba"</text>
  <text x="215" y="229" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">{2}</text>
  <text x="440" y="229" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓ 长 2，i=2 的答案 ★</text>

  <rect x="40" y="236" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="253" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">"cab" / "bad"</text>
  <text x="215" y="253" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">{0} / {2}</text>
  <text x="440" y="253" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">✓ 长 3，劣于同串更短候选</text>

  <!-- per-i summary -->
  <rect x="40" y="278" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="300" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">i=0：{ca, ab} 同长 2 → 字典序取 ab</text>
  <text x="300" y="300" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">i=1：a/d/ad 全共享 → ""</text>
  <text x="70" y="322" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">i=2：ba（长 2）→ ba</text>
  <text x="300" y="322" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">i=3：仅有的 c 被共享 → ""</text>

  <rect x="40" y="350" width="480" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">输出：["ab", "", "ba", ""]</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">注意 i=0 的教学点：位置序先遇 ca，但字典序 ab 更小 —— 不能依赖枚举顺序</text>
</svg>
