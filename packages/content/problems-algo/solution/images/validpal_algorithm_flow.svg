<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
    <marker id="arrY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
    <marker id="arrN" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针跳过非字母数字并比较</text>

  <!-- Start -->
  <ellipse cx="280" cy="56" rx="48" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 76 L 280 88" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="190" y="90" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#555">left = 0, right = n - 1</text>
  <path d="M 280 130 L 280 142" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision: left < right ? -->
  <polygon points="280,144 360,180 280,216 200,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left &lt; right ?</text>
  <text x="280" y="192" text-anchor="middle" font-size="10" fill="#888">未相遇</text>

  <!-- No -> return true -->
  <path d="M 360 180 L 430 180" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="174" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="430" y="160" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">相遇</text>
  <text x="485" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 true ✓</text>

  <!-- Yes -> down -->
  <path d="M 280 216 L 280 228" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="226" font-size="10" fill="#555" font-weight="bold">是</text>

  <!-- skip left -->
  <rect x="120" y="230" width="200" height="40" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="220" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">左指针跳过非字母数字</text>
  <text x="220" y="262" text-anchor="middle" font-size="10" fill="#666">while left&lt;right &amp;&amp; !isalnum(s[left])</text>
  <path d="M 280 250 L 320 250" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- skip right -->
  <rect x="320" y="230" width="200" height="40" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="420" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">右指针跳过非字母数字</text>
  <text x="420" y="262" text-anchor="middle" font-size="10" fill="#666">while left&lt;right &amp;&amp; !isalnum(s[right])</text>
  <path d="M 420 270 L 280 270 L 280 282" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compare decision -->
  <polygon points="280,284 380,324 280,364 180,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">tolower(s[left])</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">== tolower(s[right]) ?</text>

  <!-- No -> return false -->
  <path d="M 180 324 L 110 324" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <text x="150" y="318" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="10" y="304" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">不配对</text>
  <text x="60" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 false ✗</text>

  <!-- Yes -> loop back -->
  <path d="M 380 324 L 440 324 L 440 180 L 360 180" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="318" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="448" y="252" font-size="10" fill="#4a7a3a">left++, right--</text>
  <text x="448" y="266" font-size="10" fill="#888">回到循环顶部</text>

  <!-- footnote -->
  <rect x="40" y="400" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">⚠️ 内层「跳过」循环必须带 left &lt; right 守卫</text>
  <text x="280" y="434" text-anchor="middle" font-size="10" fill="#888">否则全非字母数字的串（如 "   "）会让指针越界对撞后继续走</text>
</svg>
