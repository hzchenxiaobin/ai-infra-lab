<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：答案 = 基础满意 + 窗口内「本会生气」的顾客数</text>

  <!-- index labels -->
  <text x="82"  y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="132" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="182" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="232" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="282" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="332" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="382" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>
  <text x="432" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">7</text>

  <!-- row labels -->
  <text x="50" y="84"  text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">顾客</text>
  <text x="50" y="134" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">情绪</text>
  <text x="50" y="184" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">增益</text>

  <!-- customers row: [1,0,1,2,1,1,7,5] -->
  <rect x="60"  y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="110" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="410" y="62" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82"  y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="132" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="182" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="232" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="282" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="332" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="382" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="432" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <!-- grumpy row: [0,1,0,1,0,1,0,1]  0=好(green) 1=气(pink) -->
  <rect x="60"  y="112" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="110" y="112" width="44" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="112" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="112" width="44" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="112" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="112" width="44" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="112" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="410" y="112" width="44" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82"  y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">好</text>
  <text x="132" y="136" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">气</text>
  <text x="182" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">好</text>
  <text x="232" y="136" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">气</text>
  <text x="282" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">好</text>
  <text x="332" y="136" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">气</text>
  <text x="382" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">好</text>
  <text x="432" y="136" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">气</text>

  <!-- gain row: customers[i]*grumpy[i] = [0,0,0,2,0,1,0,5] -->
  <rect x="60"  y="162" width="44" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="162" width="44" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="160" y="162" width="44" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="210" y="162" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="162" width="44" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="162" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="162" width="44" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="410" y="162" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82"  y="186" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="132" y="186" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="182" y="186" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="232" y="186" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="282" y="186" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="332" y="186" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="382" y="186" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="432" y="186" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">5</text>

  <!-- technique window highlight [5,7] -->
  <rect x="306" y="58" width="148" height="146" rx="8" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="380" y="216" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">↑ 秘技窗口 [5,7]，X=3</text>

  <!-- formula box -->
  <rect x="60" y="238" width="400" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="266" font-size="13" fill="#333" filter="url(#rough2)">基础满意 = Σ customers[i]，其中 grumpy[i]=0</text>
  <text x="80" y="288" font-size="13" fill="#333" filter="url(#rough2)">            = 1 + 1 + 1 + 7 = 10  （绿格「好」处）</text>
  <text x="80" y="312" font-size="13" fill="#333" filter="url(#rough2)">窗口增益 = Σ 增益[i]，i ∈ 秘技窗口 = 1 + 5 = 6</text>
  <text x="80" y="340" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 10 + 6 = 16</text>
</svg>
