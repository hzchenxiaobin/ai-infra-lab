<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">哈希分割 = 定长分块 → 求和取模 → 查字母表</text>

  <!-- 左侧主流程 -->
  <text x="136" y="46" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">s = "abcd"，k = 2（n = 4 → 2 块）</text>

  <!-- 虚线块框 -->
  <rect x="52" y="50" width="90" height="46" rx="6" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="140" y="50" width="90" height="46" rx="6" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- 字符格子 a b c d -->
  <rect x="57" y="54" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="76" y="86" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">0</text>

  <rect x="101" y="54" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="120" y="86" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="145" y="54" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="164" y="86" text-anchor="middle" font-size="9" fill="#a06a10" filter="url(#rough2)">2</text>

  <rect x="189" y="54" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <text x="208" y="86" text-anchor="middle" font-size="9" fill="#a06a10" filter="url(#rough2)">3</text>

  <text x="97" y="106" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 0 块</text>
  <text x="185" y="106" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">第 1 块</text>

  <path d="M97,112 L97,126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M185,112 L185,126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 求和框 -->
  <rect x="57" y="128" width="80" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="97" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 + 1 = 1</text>

  <rect x="145" y="128" width="80" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 + 3 = 5</text>

  <path d="M97,154 L97,168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M185,154 L185,168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取模框 -->
  <rect x="47" y="170" width="100" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="97" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 mod 26 = 1</text>

  <rect x="135" y="170" width="100" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="185" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 mod 26 = 5</text>

  <path d="M97,196 L97,212" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M185,196 L185,212" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果字母 -->
  <rect x="77" y="214" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="97" y="238" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="97" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">result[0]</text>

  <rect x="165" y="214" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="238" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">f</text>
  <text x="185" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">result[1]</text>

  <text x="136" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">result = "bf"（n/k = 2 个字符）</text>

  <!-- 右侧三个说明框 -->
  <rect x="290" y="44" width="212" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">字符 ↔ 数值（双射）</text>
  <text x="396" y="88" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">编码：c − 'a'，解码：'a' + h</text>
  <text x="396" y="106" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">'a'→0，'b'→1，…，'z'→25</text>
  <text x="396" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">查表就是一次加减法</text>

  <rect x="290" y="142" width="212" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">模 26：块尾模一次就够</text>
  <text x="396" y="186" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">块和 ≤ 25 × 100 = 2500</text>
  <text x="396" y="204" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(a + b) mod 26 可拆开先模</text>
  <text x="396" y="220" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">大数 / 大字符集才需边加边模</text>

  <rect x="290" y="240" width="212" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">彩蛋：k = 1</text>
  <text x="396" y="284" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">单字符块：值 mod 26 = 自身</text>
  <text x="396" y="302" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">result 与 s 完全相同（恒等）</text>
  <text x="396" y="318" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">顺手当调试基准 ✓</text>

  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">「哈希」二字别被唬住：分块 + 求和取模 + 查表 = 纯模拟</text>
</svg>
