<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">平衡串 = aaa...bbb...：枚举分割点</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">左侧全 a、右侧全 b → 删掉左侧的 b 和右侧的 a</text>

  <!-- Section labels -->
  <text x="143" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左侧（应全 a）</text>
  <text x="300" y="64" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">右侧（应全 b）</text>

  <!-- Character boxes: a a b a | b b a b  (split at i=4) -->
  <rect x="68" y="74" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="107" y="74" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="146" y="74" width="34" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <line x1="150" y1="78" x2="176" y2="110" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="185" y="74" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <!-- Split line -->
  <line x1="221.5" y1="56" x2="221.5" y2="128" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="221.5" y="50" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">分割点</text>

  <rect x="224" y="74" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="263" y="74" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="302" y="74" width="34" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <line x1="306" y1="78" x2="332" y2="110" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="341" y="74" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- Delete labels -->
  <text x="163" y="128" text-anchor="middle" font-size="10" fill="#b85450">删 b</text>
  <text x="319" y="128" text-anchor="middle" font-size="10" fill="#b85450">删 a</text>

  <!-- Result string -->
  <text x="28" y="170" font-size="10.5" fill="#666">删除后</text>
  <rect x="68" y="158" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="180" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="107" y="158" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="180" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="146" y="158" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="180" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="185" y="158" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="180" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="224" y="158" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="180" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="263" y="158" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="312" y="180" font-size="11" fill="#888">→ "aaabbb"（平衡）</text>

  <!-- Cost formula -->
  <rect x="50" y="212" width="420" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">代价 = 左侧 b 的个数 + 右侧 a 的个数</text>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#555">= 1 + 1 = 2  （枚举所有分割点取最小）</text>

  <!-- Footer -->
  <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#888">totalA 预处理一次；扫描时维护 aLeft / bLeft，aRight = totalA − aLeft</text>
  <text x="260" y="312" text-anchor="middle" font-size="10" fill="#aaa">每个分割点 O(1) 计算 → 总 O(n) 时间、O(1) 空间</text>
</svg>
