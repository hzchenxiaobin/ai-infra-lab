<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ap" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例 2 二分判定（dist 表见上图）
  </text>

  <!-- ===== LEFT: v=2 connected ===== -->
  <text x="127" y="50" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">v = 2：只走 dist≥2 → 连通 ✓</text>
  <!-- cells: col0 x40..98 col1 98..156 col2 156..214 ; row0 y60..118 row1 118..176 row2 176..234 -->
  <!-- (0,0)d2 path -->
  <rect x="40" y="60" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="69" y="96" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <!-- (0,1)d1 blocked -->
  <rect x="98" y="60" width="58" height="58" fill="#efefef" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="96" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">1</text>
  <!-- (0,2)d0 blocked -->
  <rect x="156" y="60" width="58" height="58" fill="#efefef" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="96" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">0</text>
  <!-- (1,0)d3 path -->
  <rect x="40" y="118" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="69" y="154" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <!-- (1,1)d2 walkable -->
  <rect x="98" y="118" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="127" y="154" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <!-- (1,2)d1 blocked -->
  <rect x="156" y="118" width="58" height="58" fill="#efefef" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="154" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">1</text>
  <!-- (2,0)d4 path -->
  <rect x="40" y="176" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="69" y="212" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <!-- (2,1)d3 path -->
  <rect x="98" y="176" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="127" y="212" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <!-- (2,2)d2 path(end) -->
  <rect x="156" y="176" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="212" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <!-- path polyline through centers: (0,0)->(1,0)->(2,0)->(2,1)->(2,2) -->
  <path d="M69,89 L69,205 M69,205 L185,205" fill="none" stroke="#b85450" stroke-width="2.6" stroke-dasharray="6 4" marker-end="url(#ap)" filter="url(#rough2)"/>
  <text x="20" y="96" font-size="11" fill="#b85450" filter="url(#rough2)">起</text>
  <text x="218" y="212" font-size="11" fill="#b85450" filter="url(#rough2)">终</text>
  <text x="127" y="252" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">灰格=dist&lt;2 被封锁</text>
  <text x="127" y="268" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">红线=安全系数2的可行路径</text>

  <!-- ===== RIGHT: v=3 not connected ===== -->
  <text x="386" y="50" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">v = 3：起终点被封锁 → 不通 ✗</text>
  <!-- col0 x300..358 col1 358..416 col2 416..474 -->
  <!-- (0,0)d2 blocked(start) -->
  <rect x="300" y="60" width="58" height="58" fill="#efefef" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="329" y="96" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="329" y="86" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <!-- (0,1)d1 -->
  <rect x="358" y="60" width="58" height="58" fill="#efefef" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="96" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">1</text>
  <!-- (0,2)d0 -->
  <rect x="416" y="60" width="58" height="58" fill="#efefef" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="96" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">0</text>
  <!-- (1,0)d3 walkable -->
  <rect x="300" y="118" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="329" y="154" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">3</text>
  <!-- (1,1)d2 blocked -->
  <rect x="358" y="118" width="58" height="58" fill="#efefef" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="154" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">2</text>
  <!-- (1,2)d1 -->
  <rect x="416" y="118" width="58" height="58" fill="#efefef" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="154" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">1</text>
  <!-- (2,0)d4 walkable -->
  <rect x="300" y="176" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="329" y="212" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">4</text>
  <!-- (2,1)d3 walkable -->
  <rect x="358" y="176" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="387" y="212" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">3</text>
  <!-- (2,2)d2 blocked(end) -->
  <rect x="416" y="176" width="58" height="58" fill="#efefef" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="212" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="445" y="202" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="280" y="96" font-size="11" fill="#b85450" filter="url(#rough2)">起</text>
  <text x="478" y="212" font-size="11" fill="#b85450" filter="url(#rough2)">终</text>
  <text x="386" y="252" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">蓝格=dist≥3 可走，但孤立</text>
  <text x="386" y="268" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">起终点 dist=2&lt;3 直接判否</text>

  <!-- bottom conclusion -->
  <text x="270" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    二分收敛：最大可行 v = 2  →  返回 2
  </text>
</svg>
