<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：阈值过滤 + 去重计数</text>

  <!-- ===== Bar chart axis ===== -->
  <line x1="60" y1="60" x2="60" y2="300" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="60" y1="300" x2="350" y2="300" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Y axis labels (amount) -->
  <text x="52" y="304" text-anchor="end" font-size="8" fill="#888">0</text>
  <text x="52" y="264" text-anchor="end" font-size="8" fill="#888">200</text>
  <text x="52" y="224" text-anchor="end" font-size="8" fill="#888">400</text>
  <text x="52" y="184" text-anchor="end" font-size="8" fill="#888">600</text>
  <text x="52" y="144" text-anchor="end" font-size="8" fill="#888">800</text>
  <text x="38" y="180" text-anchor="middle" font-size="9" fill="#666" transform="rotate(-90 38 180)">amount</text>

  <!-- gridlines -->
  <line x1="60" y1="260" x2="350" y2="260" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="60" y1="220" x2="350" y2="220" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="60" y1="180" x2="350" y2="180" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="60" y1="140" x2="350" y2="140" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Threshold line at 500 (y = 300 - 500/200*40 = 300-100 = 200) ===== -->
  <line x1="60" y1="200" x2="350" y2="200" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="345" y="196" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">阈值 500</text>

  <!-- ===== Bars (height = amount/200*40 = amount/5; y_top = 300 - amount/5) ===== -->
  <!-- Bar 1: bill 6, cust 1, 549 → y_top=300-109.8=190, h=110 -->
  <rect x="80" y="190" width="34" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="97" y="184" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">549</text>
  <text x="97" y="316" text-anchor="middle" font-size="8" fill="#555">bill6</text>
  <text x="97" y="328" text-anchor="middle" font-size="8" fill="#888">cust 1</text>

  <!-- Bar 2: bill 8, cust 1, 834 → y_top=300-166.8=133, h=167 -->
  <rect x="132" y="133" width="34" height="167" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="149" y="127" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">834</text>
  <text x="149" y="316" text-anchor="middle" font-size="8" fill="#555">bill8</text>
  <text x="149" y="328" text-anchor="middle" font-size="8" fill="#888">cust 1</text>

  <!-- Bar 3: bill 4, cust 2, 394 → y_top=300-78.8=221, h=79 -->
  <rect x="184" y="221" width="34" height="79" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="201" y="215" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">394</text>
  <text x="201" y="316" text-anchor="middle" font-size="8" fill="#555">bill4</text>
  <text x="201" y="328" text-anchor="middle" font-size="8" fill="#888">cust 2</text>

  <!-- Bar 4: bill 11, cust 3, 657 → y_top=300-131.4=169, h=131 -->
  <rect x="236" y="169" width="34" height="131" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="253" y="163" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">657</text>
  <text x="253" y="316" text-anchor="middle" font-size="8" fill="#555">bill11</text>
  <text x="253" y="328" text-anchor="middle" font-size="8" fill="#888">cust 3</text>

  <!-- Bar 5: bill 13, cust 3, 257 → y_top=300-51.4=249, h=51 -->
  <rect x="288" y="249" width="34" height="51" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="305" y="243" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">257</text>
  <text x="305" y="316" text-anchor="middle" font-size="8" fill="#555">bill13</text>
  <text x="305" y="328" text-anchor="middle" font-size="8" fill="#888">cust 3</text>

  <!-- ===== Legend ===== -->
  <rect x="370" y="60" width="200" height="56" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="378" y="68" width="14" height="8" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="396" y="75" font-size="8" fill="#b85450">amount &gt; 500（富账单）</text>
  <rect x="378" y="80" width="14" height="8" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="396" y="87" font-size="8" fill="#999">amount ≤ 500（普通账单）</text>
  <line x1="378" y1="100" x2="392" y2="100" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="396" y="104" font-size="8" fill="#b85450">阈值线 500</text>

  <!-- ===== Flow: filter → distinct → count ===== -->
  <path d="M 290 200 L 372 200" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step: WHERE amount > 500 -->
  <rect x="376" y="130" width="190" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="471" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">WHERE amount &gt; 500</text>
  <text x="471" y="164" text-anchor="middle" font-size="8" fill="#666">筛出富账单：3 行</text>

  <!-- Arrow down -->
  <path d="M 471 174 L 471 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: DISTINCT customer_id -->
  <rect x="376" y="196" width="190" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="471" y="214" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">DISTINCT customer_id</text>
  <text x="471" y="230" text-anchor="middle" font-size="8" fill="#666">cust 1, cust 1, cust 3 → {1, 3}</text>

  <!-- Arrow down -->
  <path d="M 471 240 L 471 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: COUNT -->
  <rect x="376" y="262" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="471" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">COUNT → rich_count</text>
  <text x="471" y="298" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="352" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="372" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">两步合一：阈值过滤 + 去重计数</text>
  <text x="290" y="390" text-anchor="middle" font-size="9" fill="#666">① WHERE amount &gt; 500 筛「富账单」（行级范围谓词，严格大于）</text>
  <text x="290" y="404" text-anchor="middle" font-size="9" fill="#666">② COUNT(DISTINCT customer_id) 把「富账单」归并为「富客户数」</text>
  <text x="290" y="418" text-anchor="middle" font-size="9" fill="#b85450">⚠ 一客户多张富账单只计一次 → 必须 DISTINCT</text>
</svg>
