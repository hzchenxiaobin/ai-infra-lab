<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍遍历，累加元素和与数字和</text>

  <!-- ====== Input ====== -->
  <rect x="200" y="38" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="13" fill="#333">输入 nums</text>

  <path d="M 270 76 L 270 94" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Init ====== -->
  <rect x="170" y="96" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="114" text-anchor="middle" font-size="12" fill="#333">初始化：elem = 0, digit = 0</text>
  <text x="270" y="129" text-anchor="middle" font-size="10.5" fill="#888">分别累加元素和 / 数字和</text>

  <path d="M 270 136 L 270 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Loop diamond: 遍历完? ====== -->
  <polygon points="270,158 360,200 270,242 180,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">还有元素 x?</text>
  <text x="270" y="214" text-anchor="middle" font-size="10" fill="#888">（未遍历完）</text>

  <!-- Yes branch (left) into loop body -->
  <path d="M 180 200 L 80 200 L 80 224" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="128" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Loop body box -->
  <rect x="20" y="226" width="120" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="80" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">循环体</text>
  <text x="80" y="262" text-anchor="middle" font-size="10.5" fill="#555">elem += x</text>
  <text x="80" y="278" text-anchor="middle" font-size="10.5" fill="#555">t = x</text>
  <text x="80" y="294" text-anchor="middle" font-size="10.5" fill="#555">while t:</text>
  <text x="80" y="308" text-anchor="middle" font-size="10.5" fill="#555">  digit += t%10</text>
  <text x="80" y="322" text-anchor="middle" font-size="10.5" fill="#555">  t //= 10</text>

  <!-- loop back arrow from body up to diamond -->
  <path d="M 80 226 L 80 178 L 178 178 L 178 200" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="172" text-anchor="middle" font-size="9.5" fill="#888">取下一元素</text>

  <!-- No branch (right) to return -->
  <path d="M 360 200 L 460 200 L 460 224" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="408" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="380" y="226" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="246" text-anchor="middle" font-size="11" fill="#888">|elem − digit|</text>
  <text x="450" y="262" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return elem − digit</text>

  <!-- ====== bottom note ====== -->
  <rect x="40" y="294" width="320" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="314" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">两累加器并行推进：elem 吃整个数，digit 拆位吃</text>
  <text x="200" y="332" text-anchor="middle" font-size="10.5" fill="#888">x 为正整数 ⇒ elem ≥ digit 恒成立，故可省 abs</text>
  <text x="200" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">拆位用副本 t，不破坏 x（若后续仍需原值）</text>
  <text x="200" y="364" text-anchor="middle" font-size="9.5" fill="#888">数字和 = O(Σ 位长) = O(n·log₁₀max)，常数极小</text>
</svg>
