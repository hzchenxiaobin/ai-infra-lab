<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：极大连续 '1' 块独立 —— 范围 [l−1, r] 里恰好「缺一格」</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1：nums = [9, 2, 6, 1]，s = "0101" → 块 [1,1] 与 [3,3]，各自连同块前一格构成范围</text>

  <text x="118" y="52" text-anchor="end" font-size="9.5" fill="#778899" filter="url(#rough2)">下标</text>
  <text x="118" y="80" text-anchor="end" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">nums</text>
  <text x="118" y="111" text-anchor="end" font-size="10.5" fill="#778899" filter="url(#rough2)">s</text>
  <text x="118" y="140" text-anchor="end" font-size="10.5" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">覆盖</text>

  <text x="186" y="52" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="252" y="52" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="318" y="52" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="384" y="52" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>

  <rect x="158" y="62" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="62" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="62" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="356" y="62" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="81" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="252" y="81" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="318" y="81" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="384" y="81" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="158" y="94" width="56" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="94" width="56" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="94" width="56" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="356" y="94" width="56" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="112" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="318" y="112" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <circle cx="252" cy="107" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="384" cy="107" r="5" fill="#d6a040" filter="url(#rough2)"/>

  <rect x="158" y="124" width="56" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="124" width="56" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="124" width="56" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="356" y="124" width="56" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="186" cy="136" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="318" cy="136" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="252" y="142" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="384" y="142" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>

  <path d="M 246 112 C 236 124, 210 128, 194 130" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 378 112 C 368 124, 342 128, 326 130" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="150" y="56" width="134" height="92" rx="10" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="286" y="56" width="132" height="92" rx="10" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="217" y="162" text-anchor="middle" font-size="10" fill="#33507a" filter="url(#rough2)">范围 [0,1]：和 11 − min 2 = 9</text>
  <text x="352" y="162" text-anchor="middle" font-size="10" fill="#3a6a2a" filter="url(#rough2)">范围 [2,3]：和 7 − min 1 = 6</text>

  <text x="260" y="184" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">块内最优形态：前 j 个标记各左移一格（j = 0…k，缺哪格自选）</text>

  <text x="120" y="200" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">l−1</text>
  <text x="190" y="200" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">l</text>
  <text x="260" y="200" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">l+1</text>
  <text x="330" y="200" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">l+2</text>
  <text x="400" y="200" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">r</text>

  <rect x="89" y="204" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="159" y="204" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="229" y="204" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="299" y="204" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="369" y="204" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="190" cy="218" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="260" cy="218" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="330" cy="218" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="400" cy="218" r="5" fill="#d6a040" filter="url(#rough2)"/>

  <path d="M 188 234 L 126 248" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 258 234 L 196 248" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 330 232 L 330 249" fill="none" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 400 232 L 400 249" fill="none" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="89" y="250" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="159" y="250" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="229" y="250" width="62" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="299" y="250" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="369" y="250" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="120" cy="264" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="190" cy="264" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <circle cx="330" cy="264" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="400" cy="264" r="5" fill="#4a7a3a" filter="url(#rough2)"/>

  <text x="260" y="292" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">覆盖 [l−1, r] 中除一格外的全部 —— 缺哪格自选 ⟹ 贡献 = 范围和 − 范围最小值</text>

  <rect x="26" y="302" width="468" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">块 [l, r] 且 l ≥ 1：贡献 = sum(nums[l−1..r]) − min(nums[l−1..r])</text>
  <text x="260" y="335" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">l = 0（标记 0 动不了）：贡献 = sum(nums[0..r])；示例 1：9 + 6 = 15 ✓</text>
  <text x="260" y="349" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">任意方案的覆盖集 ⊆ 范围且至多 k 个 ⟹ 上式已达该块理论上界</text>
</svg>
