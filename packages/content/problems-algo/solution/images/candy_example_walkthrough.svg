<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：ratings = [1,2,5,5,5,2,1]，最小糖果 = 13</text>

  <!-- legend -->
  <rect x="36" y="34" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="44" font-size="11" fill="#446688">评分 rating</text>
  <rect x="150" y="34" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="44" font-size="11" fill="#4a7a3a">糖果 candy</text>

  <!-- x axis -->
  <path d="M 30 330 L 530 330" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- rating bars (blue) : 1 unit = 30px, baseline 330 -->
  <rect x="42"  y="300" width="24" height="30"  fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="112" y="270" width="24" height="60"  fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="182" y="180" width="24" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="252" y="180" width="24" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="322" y="180" width="24" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="392" y="270" width="24" height="60"  fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="462" y="300" width="24" height="30"  fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- candy bars (green) -->
  <rect x="74"  y="300" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86"  y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="144" y="270" width="24" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="214" y="240" width="24" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="226" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="284" y="300" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="296" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="354" y="240" width="24" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="366" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="424" y="270" width="24" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="494" y="300" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="506" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="70"  y="346" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="140" y="346" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="210" y="346" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <text x="350" y="346" text-anchor="middle" font-size="10.5" fill="#888">4</text>
  <text x="420" y="346" text-anchor="middle" font-size="10.5" fill="#888">5</text>
  <text x="490" y="346" text-anchor="middle" font-size="10.5" fill="#888">6</text>

  <!-- plateau bracket above rating bars idx2,3,4 -->
  <path d="M 182 174 L 182 166 L 346 166 L 346 174" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="264" y="160" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">评分相等（5=5=5）</text>

  <!-- dip callout: idx3 candy=1 -->
  <path d="M 296 296 Q 296 250 250 232" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sum box -->
  <rect x="30" y="358" width="500" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#333">Σ candy = 1+2+3+1+3+2+1 = <tspan fill="#b85450" font-weight="bold">13</tspan>　←　中间 idx3 评分也是 5，但两侧相等无约束，1 颗即可</text>
</svg>
