<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fdfcf7"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：路径长度恒定，0/1 各半，看目标 T 是否落在可达区间</text>
  <path d="M 210 38 Q 360 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ Left: example1 grid 3x4 with valid path ============ -->
  <!-- non-path cells (blue) -->
  <g filter="url(#sk)">
    <rect x="58" y="74" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="104" y="74" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="150" y="74" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="196" y="74" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="58" y="120" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="104" y="120" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="150" y="120" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="196" y="120" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="58" y="166" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="104" y="166" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="150" y="166" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="196" y="166" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <!-- path cells (green) P=(0,0)(0,1)(1,1)(2,1)(2,2)(2,3) -->
  <g filter="url(#sk)">
    <rect x="58" y="74" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="104" y="74" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="104" y="120" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="104" y="166" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="150" y="166" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="196" y="166" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <!-- path polyline through centers -->
  <path d="M 80 96 L 126 96 L 126 188 L 172 188 L 218 188" stroke="#4a7a3a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#sk)"/>
  <!-- digits -->
  <g font-size="16" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="80" y="101" fill="#2e6e2e">0</text>
    <text x="126" y="101" fill="#2e6e2e">1</text>
    <text x="172" y="101" fill="#2b4a66">0</text>
    <text x="218" y="101" fill="#2b4a66">0</text>
    <text x="80" y="147" fill="#2b4a66">0</text>
    <text x="126" y="147" fill="#2e6e2e">1</text>
    <text x="172" y="147" fill="#2b4a66">0</text>
    <text x="218" y="147" fill="#2b4a66">0</text>
    <text x="80" y="193" fill="#2b4a66">1</text>
    <text x="126" y="193" fill="#2e6e2e">0</text>
    <text x="172" y="193" fill="#2e6e2e">1</text>
    <text x="218" y="193" fill="#2e6e2e">0</text>
  </g>
  <text x="150" y="232" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">绿色路径 6 格 = 3 个 0 / 3 个 1</text>

  <!-- ============ Right: formula box ============ -->
  <g filter="url(#sk)">
    <rect x="290" y="74" width="400" height="148" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="310" y="100" font-size="13" font-weight="bold" fill="#444" filter="url(#sk)">① 每条「右 / 下」单调路径，经过格子数恒为</text>
  <text x="560" y="100" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">L = m + n − 1</text>
  <text x="310" y="126" font-size="13" fill="#444" filter="url(#sk)">② 要 0 数 = 1 数，故需 L 为偶；否则直接 false</text>
  <text x="310" y="150" font-size="13" fill="#444" filter="url(#sk)">③ 目标 T = L / 2（0 与 1 各 T 个）</text>
  <text x="310" y="176" font-size="13" fill="#444" filter="url(#sk)">④ 可达 0 数构成连续区间 [min0, max0]</text>
  <text x="310" y="202" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">   答 = (L 偶) 且 (min0 ≤ T ≤ max0)</text>

  <!-- ============ Bottom: interval diagram ============ -->
  <text x="360" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">可达 0 数轴（示例1：L = 6，T = 3，[min0, max0] = [3, 5]）</text>

  <!-- number line -->
  <line x1="70" y1="330" x2="650" y2="330" stroke="#5a5a5a" stroke-width="1.8" filter="url(#sk)"/>
  <g stroke="#5a5a5a" stroke-width="1.4" filter="url(#sk)">
    <line x1="70" y1="324" x2="70" y2="336"/>
    <line x1="178" y1="324" x2="178" y2="336"/>
    <line x1="286" y1="324" x2="286" y2="336"/>
    <line x1="394" y1="324" x2="394" y2="336"/>
    <line x1="502" y1="324" x2="502" y2="336"/>
    <line x1="610" y1="324" x2="610" y2="336"/>
    <line x1="650" y1="324" x2="650" y2="336"/>
  </g>
  <!-- L=6 -> 7 ticks 0..6, step = 96.67 -> use 0,1,2,3,4,5,6 mapping: 70,167,264,361,458,555,650 -->
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="70" y="352">0</text>
    <text x="167" y="352">1</text>
    <text x="264" y="352">2</text>
    <text x="361" y="352">3</text>
    <text x="458" y="352">4</text>
    <text x="555" y="352">5</text>
    <text x="650" y="352">6 = L</text>
  </g>
  <!-- band [3,5]: x from 361 to 555 -->
  <g filter="url(#sk)">
    <rect x="361" y="322" width="194" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="458" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">可达区间 [min0=3, max0=5]</text>
  <!-- T=3 dot at x=361 -->
  <circle cx="361" cy="330" r="6.5" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="361" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">T = 3</text>
  <text x="361" y="396" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">落在区间端点 ⇒ true</text>

  <text x="360" y="430" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">注：路径长度恒定是「数 0/1」转化的关键；连续区间性质见下图（2×2 角翻转引理）</text>
</svg>
