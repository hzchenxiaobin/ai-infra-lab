<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：按二进制长度分层统计（O(log n)）</text>

  <!-- 起点 -->
  <rect x="170" y="38" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 n（0 ≤ n ≤ 10^15）</text>
  <path d="M 250 70 L 250 84" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定 n=0 -->
  <polygon points="250,88 328,118 250,148 172,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="123" text-anchor="middle" font-size="12" fill="#b3541e" filter="url(#rough2)">n = 0 ?</text>

  <path d="M 328 118 L 354 118" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="341" y="110" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <rect x="358" y="100" width="140" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="428" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 1</text>
  <text x="428" y="131" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（"0" 本身是回文）</text>

  <text x="262" y="166" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <path d="M 250 148 L 250 174" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Box A -->
  <rect x="95" y="178" width="310" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s = bin(n)，L = |s|（至多 50 位）</text>
  <text x="250" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 1（先算上 k = 0）</text>
  <path d="M 250 222 L 250 236" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Box B -->
  <rect x="95" y="240" width="310" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">短长度批发：l = 1 … L−1</text>
  <text x="250" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每个 l 各加 2^(⌈l/2⌉−1)</text>
  <path d="M 250 284 L 250 298" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Box C -->
  <rect x="95" y="302" width="310" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">等长临界：h = ⌈L/2⌉，p = s 前 h 位</text>
  <text x="250" y="337" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans += p − 2^(h−1)（前缀更小 ⇒ 回文 &lt; n）</text>
  <path d="M 250 346 L 250 360" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Box D -->
  <rect x="95" y="364" width="310" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="382" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t = 前缀 p 镜像还原成等长回文</text>
  <text x="250" y="399" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">若 t ≤ n：ans += 1</text>
  <path d="M 250 408 L 250 422" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="170" y="426" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="447" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 右侧注解面板 -->
  <rect x="418" y="178" width="132" height="230" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="484" y="202" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">回文的三个来源</text>
  <text x="484" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① k = 0（记 1）</text>
  <text x="484" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 长度 &lt; L</text>
  <text x="484" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">必 &lt; n，公式批发</text>
  <text x="484" y="304" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 长度 = L</text>
  <text x="484" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">前缀 q &lt; p 全收入</text>
  <text x="484" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">q = p 比镜像值 t</text>
  <text x="484" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">q &gt; p 全出局</text>
  <text x="484" y="390" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">全程 O(50) 步</text>
</svg>
