<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2764w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两个用例逐步推栈</text>

  <!-- ===== Example 1 ===== -->
  <rect x="20" y="40" width="520" height="178" fill="#f6fbf7" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="36" y="60" font-size="12" fill="#4a7a3a" font-weight="bold">示例1：[[0,-1],[1,0],[2,0],[3,2],[4,2]]</text>
  <text x="492" y="60" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">→ true</text>

  <!-- column headers -->
  <text x="30" y="80" font-size="10" fill="#888">步</text>
  <text x="64" y="80" font-size="10" fill="#888">节点</text>
  <text x="150" y="80" font-size="10" fill="#888">动作</text>
  <text x="350" y="80" font-size="10" fill="#888">栈状态</text>

  <!-- step1 -->
  <text x="36" y="102" font-size="11" fill="#888">1</text>
  <rect x="60" y="90" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="92" y="105" text-anchor="middle" font-size="11" fill="#333">[0,-1]</text>
  <text x="150" y="105" font-size="11" fill="#333">根入栈</text>
  <rect x="350" y="90" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="105" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[ 0 ]</text>

  <!-- step2 -->
  <text x="36" y="126" font-size="11" fill="#888">2</text>
  <rect x="60" y="114" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="92" y="129" text-anchor="middle" font-size="11" fill="#333">[1,0]</text>
  <text x="150" y="129" font-size="11" fill="#4a7a3a">栈顶0==父0 ✓ 入栈</text>
  <rect x="350" y="114" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="129" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[ 0, 1 ]</text>

  <!-- step3 -->
  <text x="36" y="150" font-size="11" fill="#888">3</text>
  <rect x="60" y="138" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="92" y="153" text-anchor="middle" font-size="11" fill="#333">[2,0]</text>
  <text x="150" y="153" font-size="11" fill="#333">栈顶1≠0 弹→顶0==0 ✓</text>
  <rect x="350" y="138" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[ 0, 2 ]</text>

  <!-- step4 -->
  <text x="36" y="174" font-size="11" fill="#888">4</text>
  <rect x="60" y="162" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="92" y="177" text-anchor="middle" font-size="11" fill="#333">[3,2]</text>
  <text x="150" y="177" font-size="11" fill="#4a7a3a">栈顶2==父2 ✓ 入栈</text>
  <rect x="350" y="162" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[ 0,2,3 ]</text>

  <!-- step5 -->
  <text x="36" y="198" font-size="11" fill="#888">5</text>
  <rect x="60" y="186" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="92" y="201" text-anchor="middle" font-size="11" fill="#333">[4,2]</text>
  <text x="150" y="201" font-size="11" fill="#333">栈顶3≠2 弹→顶2==2 ✓</text>
  <rect x="350" y="186" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[ 0,2,4 ]</text>

  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全程栈非空 ⇒ 前序成立 ✓</text>

  <!-- ===== Example 2 ===== -->
  <rect x="20" y="226" width="520" height="178" fill="#fdf5f6" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="36" y="246" font-size="12" fill="#b85450" font-weight="bold">示例2：[[0,-1],[1,0],[2,0],[3,1],[4,1]]</text>
  <text x="492" y="246" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">→ false</text>

  <text x="30" y="266" font-size="10" fill="#888">步</text>
  <text x="64" y="266" font-size="10" fill="#888">节点</text>
  <text x="150" y="266" font-size="10" fill="#888">动作</text>
  <text x="350" y="266" font-size="10" fill="#888">栈状态</text>

  <!-- step1 -->
  <text x="36" y="288" font-size="11" fill="#888">1</text>
  <rect x="60" y="276" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="92" y="291" text-anchor="middle" font-size="11" fill="#333">[0,-1]</text>
  <text x="150" y="291" font-size="11" fill="#333">根入栈</text>
  <rect x="350" y="276" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="291" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[ 0 ]</text>

  <!-- step2 -->
  <text x="36" y="312" font-size="11" fill="#888">2</text>
  <rect x="60" y="300" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="92" y="315" text-anchor="middle" font-size="11" fill="#333">[1,0]</text>
  <text x="150" y="315" font-size="11" fill="#4a7a3a">栈顶0==父0 ✓ 入栈</text>
  <rect x="350" y="300" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="315" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[ 0, 1 ]</text>

  <!-- step3 -->
  <text x="36" y="336" font-size="11" fill="#888">3</text>
  <rect x="60" y="324" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="92" y="339" text-anchor="middle" font-size="11" fill="#333">[2,0]</text>
  <text x="150" y="339" font-size="11" fill="#333">栈顶1≠0 弹→顶0==0 ✓</text>
  <rect x="350" y="324" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="339" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[ 0, 2 ]</text>

  <!-- step4 fail -->
  <text x="36" y="360" font-size="11" fill="#888">4</text>
  <rect x="60" y="348" width="64" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="363" text-anchor="middle" font-size="11" fill="#333">[3,1]</text>
  <text x="150" y="363" font-size="11" fill="#b85450">顶2≠1 弹→顶0≠1 弹→栈空 ✗</text>
  <rect x="350" y="348" width="120" height="22" fill="#eeeeee" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="363" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[ 空 ]</text>

  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">父1已不在栈上（子树1早已走完）⇒ 非前序 ✗</text>
</svg>
