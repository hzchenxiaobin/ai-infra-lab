<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：端点事件 + 差分数组</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">起点 +color，终点 −color，扫描线累加得到区间颜色和</text>

  <!-- number line -->
  <text x="50" y="78" font-size="12" fill="#888">数轴</text>
  <line x1="80" y1="88" x2="600" y2="88" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11" fill="#666">
    <text x="120" y="106" text-anchor="middle">1</text>
    <text x="240" y="106" text-anchor="middle">4</text>
    <text x="420" y="106" text-anchor="middle">7</text>
  </g>
  <g stroke="#888" stroke-width="1.2" filter="url(#rough2)">
    <line x1="120" y1="84" x2="120" y2="92"/>
    <line x1="240" y1="84" x2="240" y2="92"/>
    <line x1="420" y1="84" x2="420" y2="92"/>
  </g>

  <!-- segment 1: [1,4) color 5 -->
  <rect x="120" y="120" width="120" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="136" text-anchor="middle" font-size="11" fill="#446688">[1,4) 颜色5</text>

  <!-- segment 2: [4,7) color 7 -->
  <rect x="240" y="148" width="180" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a">[4,7) 颜色7</text>

  <!-- segment 3: [1,7) color 9 -->
  <rect x="120" y="176" width="300" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="11" fill="#d6a040">[1,7) 颜色9</text>

  <!-- arrow down to events -->
  <path d="M 330 206 L 330 226" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- diff events -->
  <rect x="40" y="232" width="580" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="254" font-size="12" fill="#b85450" font-weight="bold">差分事件：端点处 ±color</text>
  <g font-size="11" font-family="monospace">
    <text x="60" y="276" fill="#4a7a3a">diff[1] += 5, +9 → 14</text>
    <text x="250" y="276" fill="#b85450">diff[4] += 7, −5 → +2</text>
    <text x="430" y="276" fill="#b85450">diff[7] −= 7, −9 → −16</text>
  </g>

  <!-- arrow down to sweep -->
  <path d="M 330 296 L 330 316" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- running sum curve -->
  <rect x="40" y="322" width="580" height="108" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="344" font-size="12" fill="#446688" font-weight="bold">扫描线：按端点排序，累加 diff 得区间颜色和</text>

  <!-- baseline -->
  <line x1="80" y1="400" x2="600" y2="400" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <!-- sum=14 on [1,4) -->
  <rect x="120" y="362" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="386" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">sum=14</text>

  <!-- sum=16 on [4,7) -->
  <rect x="240" y="346" width="180" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">sum=16</text>

  <!-- labels -->
  <g font-size="10" fill="#888">
    <text x="120" y="418" text-anchor="middle">1</text>
    <text x="240" y="418" text-anchor="middle">4</text>
    <text x="420" y="418" text-anchor="middle">7</text>
  </g>

  <text x="500" y="386" font-size="11" fill="#b85450" font-weight="bold">输出：</text>
  <text x="500" y="402" font-size="10" fill="#555" font-family="monospace">[1,4,14]</text>
  <text x="500" y="416" font-size="10" fill="#555" font-family="monospace">[4,7,16]</text>
</svg>
