<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#fdfcf7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">remove 的下标集合维护：删一位置、补一位置</text>
  <path d="M 280 46 Q 450 54 620 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="62" text-anchor="middle" font-size="11.5" fill="#7a5415">演示 remove(3)：vals=[1,3,1,5,7]，idx[3]={1}，末尾 last=7@4</text>

  <!-- ===== Step 0: 初始 ===== -->
  <text x="60" y="100" font-size="12.5" font-weight="bold" fill="#2b6e9e">① 初始</text>
  <text x="60" y="116" font-size="10.5" fill="#888">idx = {1:{0,2}, 3:{1}, 5:{3}, 7:{4}}</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="60" y="124" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="85" y="146" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="110" y="124" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="135" y="146" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="160" y="124" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="185" y="146" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="210" y="124" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="235" y="146" text-anchor="middle" fill="#2b6e9e">5</text>
    <g filter="url(#sk)"><rect x="260" y="124" width="50" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="285" y="146" text-anchor="middle" fill="#7a5415" font-weight="bold">7</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="85" y="172" text-anchor="middle">0</text>
    <text x="135" y="172" text-anchor="middle" fill="#b03a3a">1 ←删</text>
    <text x="185" y="172" text-anchor="middle">2</text>
    <text x="235" y="172" text-anchor="middle">3</text>
    <text x="285" y="172" text-anchor="middle" fill="#7a5415">4 末尾</text>
  </g>
  <!-- idx sets under vals -->
  <g font-size="10" fill="#7a5415">
    <text x="185" y="190" text-anchor="middle">idx[1]={0,2}</text>
    <text x="285" y="190" text-anchor="middle">idx[7]={4}</text>
  </g>

  <!-- arrow down -->
  <path d="M 135 200 L 135 222" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="216" font-size="10.5" fill="#542">i = *idx[3].begin() = 1   last = vals[4] = 7</text>

  <!-- ===== Step 1: 从 idx[3] 删 i ===== -->
  <text x="60" y="244" font-size="12.5" font-weight="bold" fill="#b03a3a">② idx[3].erase(i=1)</text>
  <text x="60" y="260" font-size="10.5" fill="#888">先把要删的位置从 val 的集合里摘掉</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="60" y="268" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="85" y="290" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="110" y="268" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" stroke-dasharray="3 2"/></g>
    <text x="135" y="290" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="160" y="268" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="185" y="290" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="210" y="268" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="235" y="290" text-anchor="middle" fill="#2b6e9e">5</text>
    <g filter="url(#sk)"><rect x="260" y="268" width="50" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="285" y="290" text-anchor="middle" fill="#7a5415" font-weight="bold">7</text>
  </g>
  <text x="330" y="284" font-size="10.5" fill="#b03a3a">idx[3]: {1} → ∅ （待会儿键也删掉）</text>
  <text x="330" y="298" font-size="9.5" fill="#888">此时 vals 还没动，先理清「谁要走」</text>

  <!-- arrow down -->
  <path d="M 135 308 L 135 330" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="324" font-size="10.5" fill="#542">i(1) ≠ n-1(4) → 末尾 7 搬过来填空洞</text>

  <!-- ===== Step 2: 搬末尾 + 更新 idx[7] ===== -->
  <text x="60" y="352" font-size="12.5" font-weight="bold" fill="#7a5415">③ vals[1]=7 ; idx[7].erase(4); idx[7].insert(1)</text>
  <text x="60" y="368" font-size="10.5" fill="#888">末尾搬到位置 1，idx[7] 同步：旧位置 4 删、新位置 1 加</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="60" y="376" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="85" y="398" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="110" y="376" width="50" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/></g>
    <text x="135" y="398" text-anchor="middle" fill="#7a5415" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="160" y="376" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="185" y="398" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="210" y="376" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="235" y="398" text-anchor="middle" fill="#2b6e9e">5</text>
    <g filter="url(#sk)"><rect x="260" y="376" width="50" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="3 2"/></g>
    <text x="285" y="398" text-anchor="middle" fill="#7a5415">7</text>
  </g>
  <!-- arrow: 7 moves from pos 4 to pos 1 -->
  <path d="M 285 382 Q 220 358 150 382" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="330" y="392" font-size="10.5" fill="#7a5415">idx[7]: {4} → ∅ → {1}</text>
  <text x="330" y="406" font-size="9.5" fill="#888">位置 4 的 7 暂为多余拷贝，待 pop</text>

  <!-- arrow down -->
  <path d="M 135 416 L 135 438" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="432" font-size="10.5" fill="#542">vals.pop_back() ; idx[3] 空了 → erase(3)</text>

  <!-- ===== Step 3: 结果 ===== -->
  <text x="60" y="460" font-size="12.5" font-weight="bold" fill="#2e6e2e">④ 完成</text>
  <text x="60" y="476" font-size="10.5" fill="#888">vals=[1,7,1,5]，idx={1:{0,2}, 5:{3}, 7:{1}}</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="60" y="484" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="85" y="506" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="110" y="484" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="135" y="506" text-anchor="middle" fill="#2e6e2e">7</text>
    <g filter="url(#sk)"><rect x="160" y="484" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="185" y="506" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="210" y="484" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="235" y="506" text-anchor="middle" fill="#2e6e2e">5</text>
  </g>
  <text x="330" y="500" font-size="10.5" fill="#2e6e2e">下标 1 现归 7；下标 4 已 pop</text>
  <text x="330" y="514" font-size="10.5" fill="#2e6e2e" font-weight="bold">idx[3] 已空 → 整个键删除</text>

  <!-- ===== Right: boundary box ===== -->
  <g filter="url(#sk)"><rect x="540" y="100" width="320" height="220" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="700" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">关键：先删 i，再搬末尾</text>
  <text x="700" y="146" text-anchor="middle" font-size="11" fill="#542">顺序错了会遇到「val == last」的边界</text>
  <g font-size="11" fill="#542">
    <text x="560" y="172">若按 380 的「先搬再 erase」顺序：</text>
    <text x="560" y="192" fill="#b03a3a">remove(3) on [1,3,1,5,3]（末尾也是 3）</text>
    <text x="560" y="212" fill="#888">i=1, last=3, 先 idx[3].erase(4)</text>
    <text x="560" y="230" fill="#888">→ idx[3].insert(1) 把 1 加回</text>
    <text x="560" y="248" fill="#b03a3a">→ 再 erase(1) 又误删了刚加的</text>
    <text x="560" y="270" fill="#2e6e2e" font-weight="bold">正确顺序：先 idx[val].erase(i)</text>
    <text x="560" y="286" fill="#2e6e2e" font-weight="bold">再视情况搬末尾+更新 idx[last]</text>
    <text x="560" y="304" fill="#888">val==last 时 i 已不在 idx 中</text>
  </g>

  <!-- ===== Bottom summary ===== -->
  <g filter="url(#sk)"><rect x="540" y="338" width="320" height="180" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="700" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">remove 四步法</text>
  <g font-size="11.5" fill="#346">
    <text x="560" y="390">1. i = *idx[val].begin()</text>
    <text x="560" y="410">2. idx[val].erase(i)</text>
    <text x="560" y="430" fill="#7a5415">3. if i ≠ n-1:</text>
    <text x="580" y="448" fill="#7a5415">   vals[i]=last</text>
    <text x="580" y="466" fill="#7a5415">   idx[last].erase(n-1)</text>
    <text x="580" y="484" fill="#7a5415">   idx[last].insert(i)</text>
    <text x="560" y="504">4. vals.pop_back(); 若空则 erase 键</text>
  </g>

  <text x="450" y="540" text-anchor="middle" font-size="11" fill="#888">val ≠ last：标准搬末尾；val == last 且 i ≠ n-1：值相同但位置集合仍要「删 n-1 加 i」</text>
  <text x="450" y="558" text-anchor="middle" font-size="10.5" fill="#aaa">先 erase(i) 隔离要删的实例，再处理搬运 → 顺序天然覆盖所有边界</text>
  <text x="450" y="580" text-anchor="middle" font-size="10" fill="#aaa">时间仍为 O(1)：集合操作均摊常数</text>
</svg>
