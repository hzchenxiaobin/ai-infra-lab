<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：水平对差集合 ∩ 垂直对差集合</text>

  <!-- step 1: build H and V -->
  <rect x="40" y="46" width="215" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="147" y="68" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">H = hFences ∪ {1, m}</text>
  <text x="147" y="88" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">示例 1：H = [1, 2, 3, 4]</text>
  <text x="147" y="105" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">外围栅栏不能拆，但永远在场！</text>

  <rect x="265" y="46" width="215" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="372" y="68" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">V = vFences ∪ {1, n}</text>
  <text x="372" y="88" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">示例 1：V = [1, 2, 3]</text>
  <text x="372" y="105" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">并边界 + 排序，j &gt; i 差恒正</text>

  <path d="M 147 112 L 147 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 372 112 L 372 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2: pair diffs into sets (venn) -->
  <!-- left circle S_h -->
  <ellipse cx="185" cy="216" rx="118" ry="76" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <!-- right circle S_v -->
  <ellipse cx="335" cy="216" rx="118" ry="76" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <text x="112" y="170" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">S_h：H 的对差</text>
  <text x="112" y="216" text-anchor="middle" font-size="13" fill="#334" filter="url(#rough2)">{ 1, 2, 3 }</text>
  <text x="112" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">C(4,2)=6 对</text>
  <text x="112" y="256" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">去重后 3 个</text>

  <text x="408" y="170" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">S_v：V 的对差</text>
  <text x="408" y="216" text-anchor="middle" font-size="13" fill="#334" filter="url(#rough2)">{ 1, 2 }</text>
  <text x="408" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">C(3,2)=3 对</text>
  <text x="408" y="256" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">去重后 2 个</text>

  <!-- intersection -->
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">交集</text>
  <text x="260" y="226" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">{ 1, 2 }</text>
  <text x="260" y="248" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两边都能凑出的边长</text>

  <!-- step 3: take max -->
  <path d="M 260 292 L 260 310" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="276" y="306" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">取最大</text>

  <rect x="130" y="314" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">best = max(S_h ∩ S_v) = 2</text>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">面积 = best² mod (10⁹+7) = 4</text>

  <!-- bottom note -->
  <rect x="40" y="372" width="440" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">交集为空 ⇒ 没有同长度的水平差与垂直差 ⇒ 返回 −1；</text>
  <text x="260" y="408" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">实现上不求交：一边对差入哈希集合，另一边枚举对差查询命中。</text>
</svg>
