<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M9,1 L0,5 L9,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">单词规律 II = 字符 ↔ 非空子串的双射</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">pattern="abab"  s="redblueredblue"（无空格，子串首尾相接拼成 s）</text>

  <text x="40" y="108" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">pattern</text>
  <rect x="60" y="88" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="88" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <rect x="148" y="88" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="176" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <rect x="236" y="88" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="264" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <rect x="324" y="88" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="352" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>

  <text x="40" y="262" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">s 子串</text>
  <rect x="60" y="244" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">red</text>
  <rect x="124" y="244" width="74" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="161" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">blue</text>
  <rect x="202" y="244" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">red</text>
  <rect x="266" y="244" width="74" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="303" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">blue</text>

  <text x="40" y="300" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">s 原串</text>
  <text x="60" y="300" font-size="11" fill="#888" filter="url(#rough2)">redblueredblue（无空格，边界要自己试出来）</text>

  <line x1="88" y1="130" x2="90" y2="242" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <line x1="176" y1="130" x2="161" y2="242" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <line x1="264" y1="130" x2="232" y2="242" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <text x="270" y="192" font-size="10" fill="#d6a040" filter="url(#rough2)">同 a</text>
  <line x1="352" y1="130" x2="303" y2="242" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <text x="358" y="192" font-size="10" fill="#d6a040" filter="url(#rough2)">同 a</text>

  <rect x="392" y="150" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="442" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c2w (char→子串)</text>
  <text x="442" y="183" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">{a:red, b:blue}</text>
  <rect x="392" y="200" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="442" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w2c (子串→char)</text>
  <text x="442" y="233" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">{red:a, blue:b}</text>

  <rect x="30" y="324" width="250" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="346" font-size="12" fill="#4a7a3a" filter="url(#rough2)">290 单词规律</text>
  <text x="48" y="364" font-size="11" fill="#666" filter="url(#rough2)">空格分好边界 → split</text>
  <text x="48" y="380" font-size="11" fill="#666" filter="url(#rough2)">→ 双向哈希 O(n) 一遍核对</text>
  <text x="48" y="396" font-size="11" fill="#888" filter="url(#rough2)">边界已知，单条路径</text>

  <rect x="290" y="324" width="250" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="308" y="346" font-size="12" fill="#d6a040" filter="url(#rough2)">291 单词规律 II（本题）</text>
  <text x="308" y="364" font-size="11" fill="#666" filter="url(#rough2)">无空格 → 边界未知</text>
  <text x="308" y="380" font-size="11" fill="#666" filter="url(#rough2)">→ 回溯枚举子串长度</text>
  <text x="308" y="396" font-size="11" fill="#888" filter="url(#rough2)">双射规则相同，多一层搜索</text>
</svg>
