<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：password = "IloveLe3tcode!"（长度 14）</text>

  <!-- ===== char boxes row ===== -->
  <!-- I (upper) -->
  <rect x="47" y="50" width="30" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">I</text>
  <!-- l (lower) -->
  <rect x="79" y="50" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="94" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <!-- o (lower) -->
  <rect x="111" y="50" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>
  <!-- v (lower) -->
  <rect x="143" y="50" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="158" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">v</text>
  <!-- e (lower) -->
  <rect x="175" y="50" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <!-- L (upper) -->
  <rect x="207" y="50" width="30" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">L</text>
  <!-- e (lower) -->
  <rect x="239" y="50" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="254" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <!-- 3 (digit) -->
  <rect x="271" y="50" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="286" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <!-- t (lower) -->
  <rect x="303" y="50" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="318" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">t</text>
  <!-- c (lower) -->
  <rect x="335" y="50" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="350" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <!-- o (lower) -->
  <rect x="367" y="50" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="382" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>
  <!-- d (lower) -->
  <rect x="399" y="50" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="414" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
  <!-- e (lower) -->
  <rect x="431" y="50" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="446" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <!-- ! (special) -->
  <rect x="463" y="50" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="478" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">!</text>

  <!-- ===== legend ===== -->
  <rect x="100" y="100" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="112" font-size="11" fill="#446688" font-weight="bold">小写</text>
  <rect x="200" y="100" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="112" font-size="11" fill="#d6a040" font-weight="bold">大写</text>
  <rect x="300" y="100" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="112" font-size="11" fill="#4a7a3a" font-weight="bold">数字</text>
  <rect x="400" y="100" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="112" font-size="11" fill="#b85450" font-weight="bold">特殊</text>

  <!-- ===== consecutive check ===== -->
  <rect x="60" y="124" width="420" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="143" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">相邻字符两两不同 → 无连续重复 ✓</text>

  <!-- ===== 4 flag chips ===== -->
  <rect x="52" y="176" width="100" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="102" y="198" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">小写 ✓</text>
  <text x="102" y="216" text-anchor="middle" font-size="10.5" fill="#888">首现 l (#2)</text>

  <rect x="164" y="176" width="100" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="214" y="198" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">大写 ✓</text>
  <text x="214" y="216" text-anchor="middle" font-size="10.5" fill="#888">首现 I (#1)</text>

  <rect x="276" y="176" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="326" y="198" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">数字 ✓</text>
  <text x="326" y="216" text-anchor="middle" font-size="10.5" fill="#888">首现 3 (#8)</text>

  <rect x="388" y="176" width="100" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="438" y="198" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">特殊 ✓</text>
  <text x="438" y="216" text-anchor="middle" font-size="10.5" fill="#888">首现 ! (#14)</text>

  <!-- ===== len check ===== -->
  <rect x="150" y="238" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="257" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">长度 14 ≥ 8 ✓</text>

  <!-- ===== result ===== -->
  <rect x="90" y="282" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="307" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">4 标志全 true ∧ 无重复 ∧ len≥8 → 强密码 ✓</text>

  <!-- ===== examples 2 & 3 ===== -->
  <rect x="40" y="336" width="460" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="358" font-size="11.5" fill="#b85450" font-weight="bold">示例 2 "Me+You--IsMyDream"：含 "--" 连续相同 → return false</text>
  <text x="56" y="380" font-size="11.5" fill="#b85450" font-weight="bold">示例 3 "1aB!"：长度 4 &lt; 8 → return false</text>
</svg>
