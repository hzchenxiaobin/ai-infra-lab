<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：三条件本质 = 两种「字母值域切分」+ 一种「同字母归并」
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    条件 1/2 用边界 c 切字母表；条件 3 把两串都压成同一字母
  </text>

  <!-- alphabet ribbon -->
  <g filter="url(#rough2)">
    <rect x="40" y="58" width="480" height="22" fill="#fff8e1" stroke="#d6a040" rx="4"/>
  </g>
  <g font-size="10" fill="#7a5415" filter="url(#rough2)">
    <text x="60"  y="73" text-anchor="middle">a</text>
    <text x="100" y="73" text-anchor="middle">b</text>
    <text x="140" y="73" text-anchor="middle">c</text>
    <text x="180" y="73" text-anchor="middle">d</text>
    <text x="220" y="73" text-anchor="middle">e</text>
    <text x="280" y="73" text-anchor="middle">…</text>
    <text x="400" y="73" text-anchor="middle">x</text>
    <text x="440" y="73" text-anchor="middle">y</text>
    <text x="480" y="73" text-anchor="middle">z</text>
  </g>

  <!-- ===== Condition 1: a < b ===== -->
  <rect x="40" y="100" width="480" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="120" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">条件 1：a 中字母 &lt; b 中字母</text>

  <!-- left half (a side) -->
  <rect x="60" y="132" width="180" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="152" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">a 全部压到 ≤ c</text>
  <!-- right half (b side) -->
  <rect x="320" y="132" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="410" y="152" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#rough2)">b 全部压到 &gt; c</text>
  <!-- boundary marker -->
  <path d="M 250,80 L 250,168" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="285" y="151" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#rough2)">边界 c</text>
  <path d="M 285,150 L 256,150" stroke="#7a5415" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Condition 2: b < a ===== -->
  <rect x="40" y="184" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="204" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">条件 2：b 中字母 &lt; a 中字母（对称）</text>
  <text x="56" y="223" font-size="10" fill="#555" filter="url(#rough2)">把 b 压到 ≤ c，把 a 压到 &gt; c —— 同一条边界，左右对调即可</text>

  <!-- ===== Condition 3: both single letter ===== -->
  <rect x="40" y="244" width="480" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="264" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">条件 3：a 与 b 都只含同一字母</text>
  <g filter="url(#rough2)">
    <rect x="80" y="278" width="150" height="26" fill="#eaf6ee" stroke="#4a8e4a" rx="4"/>
    <rect x="330" y="278" width="150" height="26" fill="#eaf6ee" stroke="#4a8e4a" rx="4"/>
  </g>
  <text x="155" y="296" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">a → 全 c</text>
  <text x="405" y="296" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">b → 全 c</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#rough2)">同一个 c</text>
  <path d="M 232,291 L 318,291" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="328" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">
    统一视角：枚举「边界 c」即可覆盖三条件
  </text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    条件 1/2 枚举 c ∈ [a..y]（切左右）；条件 3 枚举 c ∈ [a..z]（取目标字母）
  </text>
</svg>
