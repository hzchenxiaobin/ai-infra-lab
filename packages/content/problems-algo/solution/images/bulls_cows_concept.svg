<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">猜数字游戏：公牛 A 与 奶牛 B</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">secret = "1807"    guess = "7810"</text>

  <text x="102" y="84" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="182" y="84" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="262" y="84" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="342" y="84" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <text x="50" y="120" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">secret</text>
  <rect x="70" y="92" width="64" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="120" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="92" width="64" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="120" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">8</text>
  <rect x="230" y="92" width="64" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="120" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">0</text>
  <rect x="310" y="92" width="64" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="120" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">7</text>

  <text x="50" y="196" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">guess</text>
  <rect x="70" y="168" width="64" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="196" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">7</text>
  <rect x="150" y="168" width="64" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="196" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">8</text>
  <rect x="230" y="168" width="64" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="196" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <rect x="310" y="168" width="64" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="196" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">0</text>

  <line x1="182" y1="136" x2="182" y2="166" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="156" font-size="11" fill="#4a7a3a" filter="url(#rough2)">A 公牛</text>

  <path d="M 102 134 Q 180 158 262 166" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="150" y="150" font-size="9" fill="#446688" filter="url(#rough2)">数字对位置错</text>

  <rect x="420" y="92" width="120" height="118" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="480" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">图例</text>
  <rect x="432" y="120" width="20" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="460" y="132" font-size="10" fill="#666" filter="url(#rough2)">公牛 A：位置+数字都对</text>
  <rect x="432" y="142" width="20" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="460" y="154" font-size="10" fill="#666" filter="url(#rough2)">奶牛 B：数字对位置错</text>
  <text x="460" y="174" font-size="10" fill="#666" filter="url(#rough2)">同色 = 同数字</text>
  <text x="460" y="192" font-size="10" fill="#666" filter="url(#rough2)">排除公牛后配对</text>

  <text x="80" y="248" font-size="13" fill="#333" filter="url(#rough2)">奶牛统计（排除公牛位后按数字计数）</text>
  <rect x="80" y="258" width="400" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">数字 d</text>
  <text x="220" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">secret 余量</text>
  <text x="320" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">guess 余量</text>
  <text x="420" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">min(s,g)</text>

  <rect x="80" y="282" width="400" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="299" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="220" y="299" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="299" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="420" y="299" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="80" y="306" width="400" height="24" fill="#fff8e1" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="323" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">0</text>
  <text x="220" y="323" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="323" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="420" y="323" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="80" y="330" width="400" height="24" fill="#fce4ec" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="347" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="220" y="347" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="347" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="420" y="347" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="80" y="354" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">奶牛 B = Σ min = 1 + 1 + 1 = 3</text>

  <rect x="80" y="392" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">结果：1A3B（1 公牛 + 3 奶牛）</text>
</svg>
