<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">按列思考：每列是一个"状态"</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">m ≤ 5 很小 → 枚举每列的合法着色（纵向相邻不同色）</text>

  <!-- grid 3x4 with colored cells, one column highlighted -->
  <text x="150" y="78" text-anchor="middle" font-size="11" fill="#888">m×n 网格（以 3×4 为例）</text>

  <!-- column 0 -->
  <rect x="60" y="88" width="40" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="113" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <rect x="60" y="128" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="153" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>
  <rect x="60" y="168" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="193" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">G</text>

  <!-- column 1 (highlighted) -->
  <rect x="56" y="84" width="48" height="128" rx="6" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <rect x="104" y="88" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="124" y="113" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">G</text>
  <rect x="104" y="128" width="40" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="124" y="153" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <rect x="104" y="168" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="124" y="193" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>

  <!-- column 2 -->
  <rect x="148" y="88" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="168" y="113" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>
  <rect x="148" y="128" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="168" y="153" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">G</text>
  <rect x="148" y="168" width="40" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="168" y="193" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>

  <!-- column 3 -->
  <rect x="192" y="88" width="40" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="212" y="113" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <rect x="192" y="128" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="212" y="153" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>
  <rect x="192" y="168" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="212" y="193" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">G</text>

  <!-- arrow from highlighted column to "state" box -->
  <path d="M 128 220 L 128 248" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="142" y="240" font-size="10" fill="#d6a040">提取为状态</text>

  <!-- state representation -->
  <rect x="70" y="252" width="116" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="277" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">列状态 = (G, R, B)</text>

  <!-- vertical constraint note -->
  <text x="30" y="113" font-size="9" fill="#888" transform="rotate(-90 30 113)">纵向相邻不同色</text>

  <!-- right side: valid column count -->
  <rect x="300" y="84" width="300" height="200" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="110" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">合法列着色数 = 3 × 2^(m−1)</text>
  <text x="320" y="132" font-size="11" fill="#555">第 1 行：3 种颜色可选</text>
  <text x="320" y="150" font-size="11" fill="#555">第 2~m 行：每行 ≠ 上一行 → 2 种</text>

  <!-- table of counts -->
  <g font-size="12">
    <rect x="320" y="166" width="50" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="345" y="183" text-anchor="middle" fill="#444" font-weight="bold">m</text>
    <rect x="372" y="166" width="80" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="412" y="183" text-anchor="middle" fill="#444" font-weight="bold">合法列数 S</text>
    <rect x="454" y="166" width="120" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="514" y="183" text-anchor="middle" fill="#444" font-weight="bold">DP 状态空间</text>

    <rect x="320" y="192" width="50" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="345" y="206" text-anchor="middle" fill="#444">1</text>
    <rect x="372" y="192" width="80" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="412" y="206" text-anchor="middle" fill="#444">3</text>
    <rect x="454" y="192" width="120" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="514" y="206" text-anchor="middle" fill="#444">3</text>

    <rect x="320" y="214" width="50" height="20" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="345" y="228" text-anchor="middle" fill="#444">2</text>
    <rect x="372" y="214" width="80" height="20" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="412" y="228" text-anchor="middle" fill="#444">6</text>
    <rect x="454" y="214" width="120" height="20" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="514" y="228" text-anchor="middle" fill="#444">6</text>

    <rect x="320" y="236" width="50" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="345" y="250" text-anchor="middle" fill="#444">3</text>
    <rect x="372" y="236" width="80" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="412" y="250" text-anchor="middle" fill="#444">12</text>
    <rect x="454" y="236" width="120" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="514" y="250" text-anchor="middle" fill="#444">12</text>

    <rect x="320" y="258" width="50" height="20" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="345" y="272" text-anchor="middle" fill="#444">4</text>
    <rect x="372" y="258" width="80" height="20" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="412" y="272" text-anchor="middle" fill="#444">24</text>
    <rect x="454" y="258" width="120" height="20" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="514" y="272" text-anchor="middle" fill="#444">24</text>
  </g>

  <!-- bottom summary -->
  <rect x="30" y="310" width="560" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="336" font-size="13" fill="#444" font-weight="bold">关键洞察</text>
  <text x="50" y="356" font-size="12" fill="#4a7a3a">m ≤ 5 ⇒ S ≤ 48 个状态。把 m×n 网格拆成 n 列，每列选一个合法着色 → 逐列 DP</text>

  <text x="310" y="400" text-anchor="middle" font-size="10" fill="#aaa">纵向：同一列内相邻行不同色 | 横向：相邻列同行不同色（下一张图）</text>
</svg>
