<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="282" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：target = 2</text>

  <!-- 表头 -->
  <rect x="30" y="56" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="47" y="74" text-anchor="middle" font-size="10.5" fill="#333">i</text>
  <rect x="64" y="56" width="108" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="74" text-anchor="middle" font-size="10.5" fill="#333">[a, b, c, m]</text>
  <rect x="172" y="56" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="74" text-anchor="middle" font-size="10.5" fill="#333">a^b</text>
  <rect x="230" y="56" width="96" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="74" text-anchor="middle" font-size="10.5" fill="#333">x = a^b % 10</text>
  <rect x="326" y="56" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="74" text-anchor="middle" font-size="10.5" fill="#333">x^c</text>
  <rect x="384" y="56" width="96" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="74" text-anchor="middle" font-size="10.5" fill="#333">y = x^c % m</text>
  <rect x="480" y="56" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="507" y="74" text-anchor="middle" font-size="10.5" fill="#333">y == 2 ?</text>

  <!-- 行 0：好下标 -->
  <rect x="30" y="84" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="47" y="105" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="64" y="84" width="108" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="105" text-anchor="middle" font-size="12" fill="#333">[2, 3, 3, 10]</text>
  <rect x="172" y="84" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="105" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="230" y="84" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="105" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="326" y="84" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="105" text-anchor="middle" font-size="12" fill="#333">512</text>
  <rect x="384" y="84" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="105" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="480" y="84" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="507" y="105" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 行 1：非好下标（m = 1） -->
  <rect x="30" y="118" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="47" y="139" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="64" y="118" width="108" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="139" text-anchor="middle" font-size="12" fill="#333">[3, 3, 3, 1]</text>
  <rect x="172" y="118" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="139" text-anchor="middle" font-size="12" fill="#333">27</text>
  <rect x="230" y="118" width="96" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="139" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="326" y="118" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="139" text-anchor="middle" font-size="12" fill="#333">343</text>
  <rect x="384" y="118" width="96" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="139" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="480" y="118" width="54" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="507" y="139" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>

  <!-- 行 2：好下标 -->
  <rect x="30" y="152" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="47" y="173" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="64" y="152" width="108" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="173" text-anchor="middle" font-size="12" fill="#333">[6, 1, 1, 4]</text>
  <rect x="172" y="152" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="173" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="230" y="152" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="173" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="326" y="152" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="173" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="384" y="152" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="173" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="480" y="152" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="507" y="173" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="282" y="212" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">ans = <tspan fill="#4a7a3a">[0, 2]</tspan>（好下标顺序不限）</text>

  <!-- 细节注记 -->
  <rect x="48" y="232" width="464" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="11.5" fill="#333">⚠ 细节：下标 1 的 m = 1 —— 任何整数 mod 1 恒为 0</text>
  <text x="280" y="274" text-anchor="middle" font-size="11.5" fill="#333">第二段恒得 0：这类行当且仅当 target = 0 时才是好下标</text>
  <text x="280" y="294" text-anchor="middle" font-size="11.5" fill="#333">快速幂初值写 1 % m（而非 1），正是为无声兼容 m = 1</text>
</svg>
