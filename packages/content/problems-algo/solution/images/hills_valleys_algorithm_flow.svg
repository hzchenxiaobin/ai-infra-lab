<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：压缩 + 一次遍历判定</text>

  <!-- ===== Start ===== -->
  <rect x="212" y="32" width="96" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <line x1="260" y1="60" x2="260" y2="72" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Compress ===== -->
  <rect x="130" y="74" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="11" fill="#555">压缩数组：去除相邻重复元素 → a[]</text>
  <line x1="260" y1="110" x2="260" y2="122" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond m < 3 ===== -->
  <polygon points="260,124 380,156 260,188 140,156" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">m &lt; 3 ?</text>
  <!-- yes → right -->
  <line x1="380" y1="156" x2="400" y2="156" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="148" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="400" y="142" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="446" y="162" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 0</text>
  <!-- no → down -->
  <line x1="260" y1="188" x2="260" y2="202" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="198" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- ===== Init ===== -->
  <rect x="170" y="204" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#555">ans = 0,  i = 1</text>
  <line x1="260" y1="238" x2="260" y2="250" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond i <= m-2 ===== -->
  <polygon points="260,252 380,284 260,316 140,284" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i ≤ m−2 ?</text>
  <!-- no → right -->
  <line x1="380" y1="284" x2="400" y2="284" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="276" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="400" y="270" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="446" y="290" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 ans</text>
  <!-- yes → down -->
  <line x1="260" y1="316" x2="260" y2="328" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="326" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Diamond hill/valley check ===== -->
  <polygon points="260,330 400,362 260,394 120,362" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a[i] 比两侧</text>
  <text x="260" y="370" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">都大或都小 ?</text>
  <!-- yes → down -->
  <line x1="260" y1="394" x2="260" y2="406" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="404" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== ans++ ===== -->
  <rect x="200" y="408" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="426" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans++（峰/谷）</text>

  <!-- no → right then down to i++ -->
  <path d="M 400 362 L 432 362 L 432 457 L 322 457" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="354" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ans++ → i++ -->
  <line x1="260" y1="436" x2="260" y2="444" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== i++ ===== -->
  <rect x="202" y="446" width="116" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="464" text-anchor="middle" font-size="11" fill="#555">i++</text>

  <!-- ===== loop back: i++ left → up → diamond i<=m-2 left ===== -->
  <path d="M 202 460 L 64 460 L 64 284 L 138 284" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="372" font-size="9" fill="#888" transform="rotate(-90 48 372)">继续下一轮 i</text>
</svg>
