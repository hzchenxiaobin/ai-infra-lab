<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 逻辑执行流程</text>

  <!-- Box 1: FROM -->
  <rect x="130" y="50" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① FROM Sales s</text>
  <text x="260" y="85" text-anchor="middle" font-size="9" fill="#555">扫描 Sales 表（驱动表），加载全部销售记录</text>

  <!-- Arrow 1 -->
  <path d="M260 94 L260 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Box 2: JOIN -->
  <rect x="70" y="110" width="380" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② JOIN Product p ON s.product_id = p.product_id</text>
  <text x="260" y="148" text-anchor="middle" font-size="9" fill="#555">按 product_id 匹配，保留两表都有对应行的组合</text>
  <text x="260" y="160" text-anchor="middle" font-size="9" fill="#b85450">无匹配行被丢弃（如 Product 300/Samsung）</text>

  <!-- Arrow 2 -->
  <path d="M260 164 L260 180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Box 3: SELECT -->
  <rect x="110" y="180" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="199" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ SELECT product_name, year, price</text>
  <text x="260" y="215" text-anchor="middle" font-size="9" fill="#555">从匹配行中投影输出三列</text>

  <!-- Arrow 3 -->
  <path d="M260 224 L260 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Box 4: Result -->
  <rect x="150" y="240" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果集（3 行 × 3 列）</text>

  <!-- Note -->
  <text x="260" y="298" text-anchor="middle" font-size="9" fill="#b85450">⚠️ 书写顺序 SELECT→FROM→JOIN ≠ 执行顺序 FROM→JOIN→SELECT</text>
  <text x="260" y="312" text-anchor="middle" font-size="9" fill="#555">引擎先确定数据源（FROM/JOIN），再做投影（SELECT）</text>
</svg>
