<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 3 演算　words = ["aaa","c","aba"]</text>

  <!-- Step 0 -->
  <text x="60" y="78" font-size="12" fill="#888" filter="url(#rough2)">步骤 0（"aaa"）</text>
  <rect x="210" y="58" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="86" text-anchor="middle" font-size="15" fill="#5a3a10" filter="url(#rough2)">首 a | 尾 a : 3</text>

  <!-- arrow + word -->
  <path d="M270,108 L270,138" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="318" y="116" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="378" y="135" text-anchor="middle" font-size="12" fill="#243" filter="url(#rough2)">单词 "c"（首尾 c）</text>

  <!-- Step 1: two states -->
  <text x="60" y="178" font-size="12" fill="#888" filter="url(#rough2)">步骤 1（"c"）</text>
  <rect x="120" y="158" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="185" y="186" text-anchor="middle" font-size="15" fill="#224" filter="url(#rough2)">首 a | 尾 c : 4</text>
  <text x="185" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">右接 A</text>

  <rect x="290" y="158" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="355" y="186" text-anchor="middle" font-size="15" fill="#224" filter="url(#rough2)">首 c | 尾 a : 4</text>
  <text x="355" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">左接 B</text>

  <!-- arrows down from two states, converging -->
  <path d="M185,208 L240,242" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M355,208 L300,242" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- word 2 label -->
  <rect x="380" y="224" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="440" y="243" text-anchor="middle" font-size="12" fill="#243" filter="url(#rough2)">单词 "aba"（首尾 a）</text>

  <!-- Step 2: three states -->
  <text x="60" y="282" font-size="12" fill="#888" filter="url(#rough2)">步骤 2（"aba"）</text>

  <!-- from a|c: A -> a|a:7 ; B overlap -> a|c:6 -->
  <rect x="50" y="262" width="140" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="290" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">首 a | 尾 a : 7</text>
  <text x="120" y="254" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">A 不删</text>

  <rect x="200" y="262" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="14" fill="#5a3a10" filter="url(#rough2)">首 a | 尾 c : 6</text>
  <text x="270" y="254" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">B 重叠删 1</text>

  <rect x="350" y="262" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="290" text-anchor="middle" font-size="14" fill="#5a3a10" filter="url(#rough2)">首 c | 尾 a : 6</text>
  <text x="420" y="254" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">A 重叠删 1</text>

  <!-- connectors from step1 states to step2 boxes (light) -->
  <path d="M185,208 L120,262" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M185,208 L270,262" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M355,208 L420,262" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M355,208 L270,262" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- arrow to answer -->
  <path d="M270,314 L270,344" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- answer box -->
  <rect x="110" y="354" width="320" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="376" text-anchor="middle" font-size="14" fill="#7a3a3a" filter="url(#rough2)">min{7, 6, 6} = 6</text>
  <text x="270" y="396" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 6　（"abaaac"）</text>

  <!-- footer note -->
  <text x="270" y="432" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">最短方案：aaa→右接 c→aaac→左接 aba（首尾 a 重叠）→abaaac</text>
</svg>
