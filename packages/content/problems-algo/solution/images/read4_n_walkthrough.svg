<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：两种边界——「读多了」与「EOF 提前」</text>

  <!-- ===== 示例 A：读多了（n 小于文件） ===== -->
  <rect x="20" y="44" width="270" height="404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="155" y="66" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">示例 A：file = "leetcode"，n = 5</text>
  <text x="155" y="82" text-anchor="middle" font-size="10" fill="#888">文件比 n 长，最后一轮 read 多了要丢弃</text>

  <!-- 表头 -->
  <g font-size="10" fill="#444">
    <rect x="34" y="96" width="242" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="111" text-anchor="middle" font-weight="bold">轮</text>
    <text x="115" y="111" text-anchor="middle" font-weight="bold">got</text>
    <text x="175" y="111" text-anchor="middle" font-weight="bold">buf4</text>
    <text x="230" y="111" text-anchor="middle" font-weight="bold">need</text>
    <text x="266" y="111" text-anchor="middle" font-weight="bold">total</text>
  </g>

  <!-- 行 1 -->
  <g font-size="10" fill="#444">
    <rect x="34" y="118" width="242" height="34" fill="#fff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="60" y="139" text-anchor="middle">1</text>
    <text x="115" y="139" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="175" y="135" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">l e e t</text>
    <text x="230" y="139" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="266" y="139" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="155" y="148" text-anchor="middle" font-size="8" fill="#888">min(4, 5−0)=4 · 拷 "leet"</text>
  </g>

  <!-- 行 2（关键：need=1，丢弃 3 个） -->
  <g font-size="10" fill="#444">
    <rect x="34" y="152" width="242" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="60" y="177" text-anchor="middle">2</text>
    <text x="115" y="177" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="175" y="173" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">c o d e</text>
    <text x="230" y="177" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="266" y="177" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="155" y="186" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">min(4, 5−4)=1 · 只拷 "c"，弃 "ode"</text>
  </g>

  <!-- 结束行 -->
  <g font-size="10" fill="#444">
    <rect x="34" y="192" width="242" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="155" y="209" text-anchor="middle" font-weight="bold" fill="#4a7a3a">total==n ⇒ 返回 5</text>
  </g>

  <!-- buf 可视化 -->
  <text x="155" y="236" text-anchor="middle" font-size="10" fill="#888">buf 最终（n=5）：</text>
  <g font-size="10">
    <rect x="50" y="244" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="63" y="263" text-anchor="middle" fill="#4a7a3a" font-weight="bold">l</text>
    <rect x="76" y="244" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="89" y="263" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="102" y="244" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="115" y="263" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="128" y="244" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="141" y="263" text-anchor="middle" fill="#4a7a3a" font-weight="bold">t</text>
    <rect x="154" y="244" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="167" y="263" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
    <rect x="180" y="244" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
    <text x="193" y="263" text-anchor="middle" font-size="9" fill="#b85450">弃</text>
  </g>
  <text x="155" y="290" text-anchor="middle" font-size="9" fill="#b85450">"ode" 留在 buf4 未拷出（单次调用可丢）</text>

  <rect x="34" y="300" width="242" height="140" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="318" font-size="10" fill="#444" font-weight="bold">关键点：</text>
  <text x="44" y="336" font-size="10" fill="#444">• got=4 但只需 1 ⇒ need=min(4,1)=1</text>
  <text x="44" y="354" font-size="10" fill="#444">• 拷 1 个后 total==n 立即退出</text>
  <text x="44" y="372" font-size="10" fill="#b85450">• buf4 剩 3 个字符被丢弃</text>
  <text x="44" y="390" font-size="10" fill="#444">• read4 游标已前进 8 字符</text>
  <text x="44" y="412" font-size="9" fill="#888">→ 多次调用版（158）需缓存这 3 个</text>
  <text x="44" y="428" font-size="9" fill="#888">　 否则下次 read 会丢数据</text>

  <!-- ===== 示例 B：EOF 提前 ===== -->
  <rect x="310" y="44" width="270" height="404" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="445" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例 B：file = "abc"，n = 5</text>
  <text x="445" y="82" text-anchor="middle" font-size="10" fill="#888">文件比 n 短，EOF 触发提前结束</text>

  <!-- 表头 -->
  <g font-size="10" fill="#444">
    <rect x="324" y="96" width="242" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="350" y="111" text-anchor="middle" font-weight="bold">轮</text>
    <text x="405" y="111" text-anchor="middle" font-weight="bold">got</text>
    <text x="465" y="111" text-anchor="middle" font-weight="bold">buf4</text>
    <text x="520" y="111" text-anchor="middle" font-weight="bold">need</text>
    <text x="556" y="111" text-anchor="middle" font-weight="bold">total</text>
  </g>

  <!-- 行 1（got=3 < 4 ⇒ EOF） -->
  <g font-size="10" fill="#444">
    <rect x="324" y="118" width="242" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="350" y="139" text-anchor="middle">1</text>
    <text x="405" y="139" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="465" y="135" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">a b c</text>
    <text x="520" y="139" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="556" y="139" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="445" y="152" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">got=3 &lt; 4 ⇒ EOF！</text>
  </g>

  <!-- 结束行 -->
  <g font-size="10" fill="#444">
    <rect x="324" y="158" width="242" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="445" y="175" text-anchor="middle" font-weight="bold" fill="#4a7a3a">got&lt;4 ⇒ 返回 3（未读满 n）</text>
  </g>

  <!-- buf 可视化 -->
  <text x="445" y="202" text-anchor="middle" font-size="10" fill="#888">buf 最终（n=5 但只填 3）：</text>
  <g font-size="10">
    <rect x="370" y="210" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="383" y="229" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="396" y="210" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="409" y="229" text-anchor="middle" fill="#4a7a3a" font-weight="bold">b</text>
    <rect x="422" y="210" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="435" y="229" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
    <rect x="448" y="210" width="26" height="28" fill="#fff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
    <text x="461" y="229" text-anchor="middle" font-size="9" fill="#aaa">空</text>
    <rect x="474" y="210" width="26" height="28" fill="#fff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
    <text x="487" y="229" text-anchor="middle" font-size="9" fill="#aaa">空</text>
  </g>
  <text x="445" y="256" text-anchor="middle" font-size="9" fill="#888">返回值 3 &lt; n=5，告诉调用方「已到文件尾」</text>

  <rect x="324" y="268" width="242" height="172" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="334" y="286" font-size="10" fill="#444" font-weight="bold">关键点：</text>
  <text x="334" y="304" font-size="10" fill="#444">• got=3 &lt; 4 ⇒ 文件已读完（EOF）</text>
  <text x="334" y="322" font-size="10" fill="#444">• need=min(3, 5−0)=3，拷 3 个</text>
  <text x="334" y="340" font-size="10" fill="#444">• total=3，仍 &lt; n=5</text>
  <text x="334" y="358" font-size="10" fill="#b85450">• 但 got&lt;4 触发提前退出</text>
  <text x="334" y="376" font-size="10" fill="#444">• 返回 total=3（不是 n=5）</text>
  <text x="334" y="398" font-size="9" fill="#888">→ 调用方靠「返回值 &lt; n」判断 EOF</text>
  <text x="334" y="416" font-size="9" fill="#888">　 这与 C 标准库 fread 语义一致</text>
  <text x="334" y="434" font-size="9" fill="#888">　 read 系列函数的通用契约</text>
</svg>
