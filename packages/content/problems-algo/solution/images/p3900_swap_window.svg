<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：跨窗口交换 ⟺ 前缀 bal 差 ±2</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1：s = "100001"（cnt₀ = 4，cnt₁ = 2）</text>

  <text x="58" y="72" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">交换前</text>

  <rect x="110" y="54" width="54" height="34" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="172" y="54" width="54" height="34" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="234" y="54" width="54" height="34" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="296" y="54" width="54" height="34" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="358" y="54" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="420" y="54" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="137" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="199" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="261" y="76" text-anchor="middle" font-size="13" fill="#a0433f" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="323" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="385" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="447" y="76" text-anchor="middle" font-size="13" fill="#a0433f" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="137" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="199" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="261" y="100" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="323" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="385" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="447" y="100" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="268" y="117" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">窗口 [0,3] = "1000"：c₀=3, c₁=1 —— 0 恰好多 2 个（bal 差 −2）</text>

  <path d="M 261 124 C 261 154, 447 154, 447 124" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="354" y="150" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">一次交换：② 的 0 ↔ ⑤ 的 1</text>

  <text x="58" y="172" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">交换后</text>

  <rect x="110" y="154" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="172" y="154" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="234" y="154" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="296" y="154" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="358" y="154" width="54" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="420" y="154" width="54" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="137" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="199" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="261" y="176" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="323" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="385" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="447" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="268" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">窗口 [0,3] = "1010"：c₀=2, c₁=2 —— 平衡 ✓ 长度 4</text>

  <path d="M 20 216 L 500 216" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,5" filter="url(#rough2)"/>

  <rect x="14" y="226" width="156" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="248" text-anchor="middle" font-size="11" fill="#2f5c24" font-weight="bold" filter="url(#rough2)">Case A · 差 0</text>
  <text x="92" y="268" text-anchor="middle" font-size="9.5" fill="#3a5c30" filter="url(#rough2)">bal[r] == bal[l]</text>
  <text x="92" y="286" text-anchor="middle" font-size="9.5" fill="#3a5c30" filter="url(#rough2)">窗口天然平衡，无需交换</text>
  <text x="92" y="304" text-anchor="middle" font-size="9.5" fill="#3a5c30" filter="url(#rough2)">哈希记首次出现位置</text>
  <text x="92" y="322" text-anchor="middle" font-size="9.5" fill="#3a5c30" filter="url(#rough2)">（525 连续数组套路）</text>

  <rect x="182" y="226" width="156" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">Case B · 差 −2</text>
  <text x="260" y="268" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">0 多 2 个：换出 0、换入 1</text>
  <text x="260" y="286" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">窗口内有 0 ⟹ 自动满足</text>
  <text x="260" y="304" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">窗口外有 1（可换入）</text>
  <text x="260" y="322" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">⟺ len ≤ 2·cnt₁</text>

  <rect x="350" y="226" width="156" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="248" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">Case C · 差 +2</text>
  <text x="428" y="268" text-anchor="middle" font-size="9.5" fill="#3d5a80" filter="url(#rough2)">1 多 2 个：换出 1、换入 0</text>
  <text x="428" y="286" text-anchor="middle" font-size="9.5" fill="#3d5a80" filter="url(#rough2)">窗口内有 1 ⟹ 自动满足</text>
  <text x="428" y="304" text-anchor="middle" font-size="9.5" fill="#3d5a80" filter="url(#rough2)">窗口外有 0（可换入）</text>
  <text x="428" y="322" text-anchor="middle" font-size="9.5" fill="#3d5a80" filter="url(#rough2)">⟺ len ≤ 2·cnt₀</text>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">三种情况全是纯前缀查询；答案上界 2·min(cnt₀, cnt₁)</text>
</svg>
