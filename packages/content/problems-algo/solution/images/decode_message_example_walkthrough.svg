<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：key 含全部 26 字母，逐字查表解码</text>

  <!-- 去重序列（带下标）两行 -->
  <text x="36" y="58" font-size="11.5" fill="#888">key 去重序列（下标 = 字母表偏移）：</text>
  <g font-size="11" text-anchor="middle">
    <!-- row1 idx 0-12 -->
    <g fill="#333">
      <rect x="60" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="82" y="86" font-size="12.5">t</text><text x="82" y="112" font-size="9.5" fill="#888">0</text>
      <rect x="106" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="128" y="86" font-size="12.5">h</text><text x="128" y="112" font-size="9.5" fill="#888">1</text>
      <rect x="152" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="174" y="86" font-size="12.5">e</text><text x="174" y="112" font-size="9.5" fill="#888">2</text>
      <rect x="198" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="220" y="86" font-size="12.5">q</text><text x="220" y="112" font-size="9.5" fill="#888">3</text>
      <rect x="244" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="266" y="86" font-size="12.5">u</text><text x="266" y="112" font-size="9.5" fill="#888">4</text>
      <rect x="290" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="312" y="86" font-size="12.5">i</text><text x="312" y="112" font-size="9.5" fill="#888">5</text>
      <rect x="336" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="358" y="86" font-size="12.5">c</text><text x="358" y="112" font-size="9.5" fill="#888">6</text>
      <rect x="382" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="404" y="86" font-size="12.5">k</text><text x="404" y="112" font-size="9.5" fill="#888">7</text>
      <rect x="428" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="450" y="86" font-size="12.5">b</text><text x="450" y="112" font-size="9.5" fill="#888">8</text>
      <rect x="474" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="496" y="86" font-size="12.5">r</text><text x="496" y="112" font-size="9.5" fill="#888">9</text>
      <rect x="520" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="542" y="86" font-size="12.5">o</text><text x="542" y="112" font-size="9.5" fill="#888">10</text>
      <rect x="566" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="588" y="86" font-size="12.5">w</text><text x="588" y="112" font-size="9.5" fill="#888">11</text>
      <rect x="612" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="634" y="86" font-size="12.5">n</text><text x="634" y="112" font-size="9.5" fill="#888">12</text>
    </g>
    <!-- row2 idx 13-25 -->
    <g fill="#333">
      <rect x="60" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="82" y="140" font-size="12.5">f</text><text x="82" y="166" font-size="9.5" fill="#888">13</text>
      <rect x="106" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="128" y="140" font-size="12.5">x</text><text x="128" y="166" font-size="9.5" fill="#888">14</text>
      <rect x="152" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="174" y="140" font-size="12.5">j</text><text x="174" y="166" font-size="9.5" fill="#888">15</text>
      <rect x="198" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="220" y="140" font-size="12.5">m</text><text x="220" y="166" font-size="9.5" fill="#888">16</text>
      <rect x="244" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="266" y="140" font-size="12.5">p</text><text x="266" y="166" font-size="9.5" fill="#888">17</text>
      <rect x="290" y="120" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="312" y="140" font-size="12.5" font-weight="bold" fill="#b85450">s</text><text x="312" y="166" font-size="9.5" fill="#b85450">18</text>
      <rect x="336" y="120" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="358" y="140" font-size="12.5" font-weight="bold" fill="#b85450">v</text><text x="358" y="166" font-size="9.5" fill="#b85450">19</text>
      <rect x="382" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="404" y="140" font-size="12.5">l</text><text x="404" y="166" font-size="9.5" fill="#888">20</text>
      <rect x="428" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="450" y="140" font-size="12.5">a</text><text x="450" y="166" font-size="9.5" fill="#888">21</text>
      <rect x="474" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="496" y="140" font-size="12.5">z</text><text x="496" y="166" font-size="9.5" fill="#888">22</text>
      <rect x="520" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="542" y="140" font-size="12.5">y</text><text x="542" y="166" font-size="9.5" fill="#888">23</text>
      <rect x="566" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="588" y="140" font-size="12.5">d</text><text x="588" y="166" font-size="9.5" fill="#888">24</text>
      <rect x="612" y="120" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="634" y="140" font-size="12.5">g</text><text x="634" y="166" font-size="9.5" fill="#888">25</text>
    </g>
  </g>

  <!-- divider -->
  <path d="M 36 184 L 684 184" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="36" y="206" font-size="11.5" fill="#888">逐字解码 message = "vkbs bs t suepuv"：</text>

  <!-- message cells + output cells; 16 positions, cell width 40, start x=40 -->
  <!-- positions: v k b s sp b s sp t sp s u e p u v -->
  <!-- indices:  19 7 8 18 - 8 18 - 0 - 18 4 2 17 4 19 -->
  <!-- outputs:  t h i s _ h s _ a _ s e c r e t -->

  <!-- index row -->
  <g text-anchor="middle" font-size="10" fill="#b85450">
    <text x="60" y="232">19</text>
    <text x="100" y="232">7</text>
    <text x="140" y="232">8</text>
    <text x="180" y="232">18</text>
    <text x="260" y="232">8</text>
    <text x="300" y="232">18</text>
    <text x="380" y="232">0</text>
    <text x="460" y="232">18</text>
    <text x="500" y="232">4</text>
    <text x="540" y="232">2</text>
    <text x="580" y="232">17</text>
    <text x="620" y="232">4</text>
    <text x="660" y="232">19</text>
  </g>

  <!-- message char cells -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="42" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="60" y="261">v</text>
    <rect x="82" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="100" y="261">k</text>
    <rect x="122" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="140" y="261">b</text>
    <rect x="162" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="180" y="261">s</text>
    <text x="220" y="261" font-size="16" fill="#aaa">·</text>
    <rect x="242" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="260" y="261">b</text>
    <rect x="282" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="300" y="261">s</text>
    <text x="340" y="261" font-size="16" fill="#aaa">·</text>
    <rect x="362" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="380" y="261">t</text>
    <text x="420" y="261" font-size="16" fill="#aaa">·</text>
    <rect x="442" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="460" y="261">s</text>
    <rect x="482" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="500" y="261">u</text>
    <rect x="522" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="540" y="261">e</text>
    <rect x="562" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="580" y="261">p</text>
    <rect x="602" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="620" y="261">u</text>
    <rect x="642" y="238" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="660" y="261">v</text>
  </g>

  <!-- arrows down -->
  <g stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)">
    <path d="M 60 274 L 60 294"/>
    <path d="M 100 274 L 100 294"/>
    <path d="M 140 274 L 140 294"/>
    <path d="M 180 274 L 180 294"/>
    <path d="M 260 274 L 260 294"/>
    <path d="M 300 274 L 300 294"/>
    <path d="M 380 274 L 380 294"/>
    <path d="M 460 274 L 460 294"/>
    <path d="M 500 274 L 500 294"/>
    <path d="M 540 274 L 540 294"/>
    <path d="M 580 274 L 580 294"/>
    <path d="M 620 274 L 620 294"/>
    <path d="M 660 274 L 660 294"/>
  </g>

  <!-- output cells -->
  <g font-size="13.5" fill="#333" text-anchor="middle">
    <rect x="42" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="60" y="321" font-weight="bold" fill="#4a7a3a">t</text>
    <rect x="82" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="100" y="321" font-weight="bold" fill="#4a7a3a">h</text>
    <rect x="122" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="140" y="321" font-weight="bold" fill="#4a7a3a">i</text>
    <rect x="162" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="180" y="321" font-weight="bold" fill="#4a7a3a">s</text>
    <text x="220" y="321" font-size="16" fill="#aaa">·</text>
    <rect x="242" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="260" y="321" font-weight="bold" fill="#4a7a3a">h</text>
    <rect x="282" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="300" y="321" font-weight="bold" fill="#4a7a3a">s</text>
    <text x="340" y="321" font-size="16" fill="#aaa">·</text>
    <rect x="362" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="380" y="321" font-weight="bold" fill="#4a7a3a">a</text>
    <text x="420" y="321" font-size="16" fill="#aaa">·</text>
    <rect x="442" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="460" y="321" font-weight="bold" fill="#4a7a3a">s</text>
    <rect x="482" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="500" y="321" font-weight="bold" fill="#4a7a3a">e</text>
    <rect x="522" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="540" y="321" font-weight="bold" fill="#4a7a3a">c</text>
    <rect x="562" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="580" y="321" font-weight="bold" fill="#4a7a3a">r</text>
    <rect x="602" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="620" y="321" font-weight="bold" fill="#4a7a3a">e</text>
    <rect x="642" y="298" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="660" y="321" font-weight="bold" fill="#4a7a3a">t</text>
  </g>

  <!-- result box -->
  <path d="M 360 348 L 360 372" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="180" y="378" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="360" y="404" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">结果："this is a secret" ✓</text>

  <!-- legend -->
  <text x="36" y="448" font-size="11" fill="#555">• 空格（·）原样输出；字母按去重序列下标 i 输出 'a'+i</text>
  <text x="36" y="466" font-size="11" fill="#555">• v 在下标 19 → 'a'+19 = 't'；t 在下标 0 → 'a'+0 = 'a'，依此推得全文</text>
</svg>
