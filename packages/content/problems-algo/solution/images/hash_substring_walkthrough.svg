<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "leetcode"，power=7，modulo=20，k=2，hashValue=0</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">pk = 7² mod 20 = 9；val: l=12 e=5 t=20 c=3 o=15 d=4；逆序 i = 7 → 0</text>

  <!-- Header row -->
  <rect x="40" y="62" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>
  <text x="135" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s[i]</text>
  <text x="235" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">窗口 s[i..i+1]</text>
  <text x="365" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">移出 s[i+k]</text>
  <text x="465" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">哈希 h</text>
  <text x="545" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">命中</text>

  <!-- column separators -->
  <line x1="105" y1="62" x2="105" y2="362" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="62" x2="170" y2="362" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="62" x2="305" y2="362" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="62" x2="425" y2="362" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="505" y1="62" x2="505" y2="362" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row i=7 (build phase) -->
  <rect x="40" y="94" width="540" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="114" text-anchor="middle" font-size="12" fill="#888">7</text>
  <text x="135" y="114" text-anchor="middle" font-size="12" fill="#555">e (5)</text>
  <text x="235" y="114" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">建窗中…</text>
  <text x="365" y="114" text-anchor="middle" font-size="12" fill="#aaa">—</text>
  <text x="465" y="114" text-anchor="middle" font-size="12" fill="#888">5</text>
  <text x="545" y="114" text-anchor="middle" font-size="12" fill="#aaa">—</text>

  <!-- Row i=6 -->
  <rect x="40" y="126" width="540" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="146" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="135" y="146" text-anchor="middle" font-size="12" fill="#333">d (4)</text>
  <text x="235" y="146" text-anchor="middle" font-size="12" fill="#333">de</text>
  <text x="365" y="146" text-anchor="middle" font-size="12" fill="#aaa">—</text>
  <text x="465" y="146" text-anchor="middle" font-size="12" fill="#333">19</text>
  <text x="545" y="146" text-anchor="middle" font-size="12" fill="#b85450">✗</text>

  <!-- Row i=5 -->
  <rect x="40" y="158" width="540" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="178" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="135" y="178" text-anchor="middle" font-size="12" fill="#333">o (15)</text>
  <text x="235" y="178" text-anchor="middle" font-size="12" fill="#333">od</text>
  <text x="365" y="178" text-anchor="middle" font-size="12" fill="#888">e · 9</text>
  <text x="465" y="178" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="545" y="178" text-anchor="middle" font-size="12" fill="#b85450">✗</text>

  <!-- Row i=4 -->
  <rect x="40" y="190" width="540" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="210" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="135" y="210" text-anchor="middle" font-size="12" fill="#333">c (3)</text>
  <text x="235" y="210" text-anchor="middle" font-size="12" fill="#333">co</text>
  <text x="365" y="210" text-anchor="middle" font-size="12" fill="#888">d · 9</text>
  <text x="465" y="210" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="545" y="210" text-anchor="middle" font-size="12" fill="#b85450">✗</text>

  <!-- Row i=3 -->
  <rect x="40" y="222" width="540" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="242" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="135" y="242" text-anchor="middle" font-size="12" fill="#333">t (20)</text>
  <text x="235" y="242" text-anchor="middle" font-size="12" fill="#333">tc</text>
  <text x="365" y="242" text-anchor="middle" font-size="12" fill="#888">o · 9</text>
  <text x="465" y="242" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="545" y="242" text-anchor="middle" font-size="12" fill="#b85450">✗</text>

  <!-- Row i=2 -->
  <rect x="40" y="254" width="540" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="274" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="135" y="274" text-anchor="middle" font-size="12" fill="#333">e (5)</text>
  <text x="235" y="274" text-anchor="middle" font-size="12" fill="#333">et</text>
  <text x="365" y="274" text-anchor="middle" font-size="12" fill="#888">c · 9</text>
  <text x="465" y="274" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="545" y="274" text-anchor="middle" font-size="12" fill="#b85450">✗</text>

  <!-- Row i=1 MATCH -->
  <rect x="40" y="286" width="540" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="307" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="135" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e (5)</text>
  <text x="235" y="307" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ee ★</text>
  <text x="365" y="307" text-anchor="middle" font-size="12" fill="#888">t · 9</text>
  <text x="465" y="307" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="545" y="307" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ res=1</text>

  <!-- Row i=0 -->
  <rect x="40" y="320" width="540" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="340" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="135" y="340" text-anchor="middle" font-size="12" fill="#333">l (12)</text>
  <text x="235" y="340" text-anchor="middle" font-size="12" fill="#333">le</text>
  <text x="365" y="340" text-anchor="middle" font-size="12" fill="#888">e · 9</text>
  <text x="465" y="340" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="545" y="340" text-anchor="middle" font-size="12" fill="#b85450">✗</text>

  <!-- Notes -->
  <text x="310" y="384" text-anchor="middle" font-size="11" fill="#555">i=7：仅累计 e，尚未构成 k=2 的完整窗口（建窗阶段）</text>
  <text x="310" y="404" text-anchor="middle" font-size="11" fill="#555">i=6：累计得 W(6)="de"=4+5·7=39→19，成为首个有效窗口</text>
  <text x="310" y="424" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i=1：W(1)="ee"=5+5·7=40→0 命中！逆序最后命中 ⇒ 最左下标</text>
  <text x="310" y="448" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">返回 s[1:3] = "ee"</text>
</svg>
