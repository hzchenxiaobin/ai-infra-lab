<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DP 状态转移：每个 i 取两种选择的最小值</text>

  <!-- String s = leetscode -->
  <text x="30" y="60" font-size="12" fill="#888">s =</text>
  <rect x="64" y="46" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="81" y="65" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="98" y="46" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="65" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="132" y="46" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="65" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="166" y="46" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="65" text-anchor="middle" font-size="13" fill="#333">t</text>
  <!-- extra char s in red -->
  <rect x="200" y="46" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="65" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">s</text>
  <rect x="234" y="46" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="65" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="268" y="46" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="65" text-anchor="middle" font-size="13" fill="#333">o</text>
  <rect x="302" y="46" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="65" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="336" y="46" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="353" y="65" text-anchor="middle" font-size="13" fill="#333">e</text>

  <!-- index labels -->
  <text x="81" y="90" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="149" y="90" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="183" y="90" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="217" y="90" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <text x="353" y="90" text-anchor="middle" font-size="9" fill="#aaa">8</text>

  <!-- dp[i] target node -->
  <rect x="300" y="240" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="360" y="261" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">dp[i]</text>
  <text x="360" y="277" text-anchor="middle" font-size="9" fill="#888">前 i 字符的最少额外</text>

  <!-- Branch A: s[i-1] as extra -->
  <rect x="40" y="130" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="125" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">选择 A：丢弃</text>
  <text x="125" y="167" text-anchor="middle" font-size="11" fill="#555">s[i-1] 留作额外字符</text>
  <!-- formula -->
  <rect x="56" y="190" width="138" height="32" fill="#fafafa" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="125" y="211" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">dp[i-1] + 1</text>

  <path d="M 125 224 Q 220 232 300 258" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Branch B: match a word s[j:i] -->
  <rect x="40" y="240" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">选择 B：匹配一个单词</text>
  <text x="140" y="277" text-anchor="middle" font-size="11" fill="#555">找 j 使 s[j:i] ∈ 字典</text>
  <!-- formula -->
  <rect x="70" y="294" width="140" height="32" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="140" y="315" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">dp[j]</text>

  <path d="M 210 300 Q 252 280 300 270" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- match bracket over s[j:i] = "code" -->
  <path d="M 234 108 Q 234 122 251 122 L 353 122 Q 370 122 370 108" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="302" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a">s[j:i]="code"</text>

  <!-- min node -->
  <text x="360" y="305" text-anchor="middle" font-size="11" fill="#888">= min(A, B)</text>

  <!-- Summary box -->
  <rect x="20" y="330" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="11" fill="#333">dp[0]=0；每个 i 取「丢弃 +1」与「匹配单词 dp[j]」中的最小</text>
</svg>
