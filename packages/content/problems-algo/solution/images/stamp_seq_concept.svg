<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">戳印序列核心观察：反向消去印章</text>

  <!-- ===== Forward direction (top, blue, hard) ===== -->
  <text x="40" y="64" font-size="12" fill="#446688" font-weight="bold">正向（难）</text>
  <text x="40" y="80" font-size="10" fill="#888">从 ? 建到 target，看不出哪次盖印最终保留</text>

  <!-- forward states -->
  <rect x="110" y="92" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="111" text-anchor="middle" font-size="13" fill="#333">?????</text>

  <rect x="270" y="92" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="111" text-anchor="middle" font-size="13" fill="#333">abc??</text>

  <rect x="430" y="92" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="111" text-anchor="middle" font-size="13" fill="#333">ababc</text>

  <line x1="240" y1="106" x2="270" y2="106" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="400" y1="106" x2="430" y2="106" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="100" text-anchor="middle" font-size="9" fill="#888">盖0</text>
  <text x="415" y="100" text-anchor="middle" font-size="9" fill="#888">盖2</text>

  <!-- hard note -->
  <rect x="110" y="128" width="450" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="335" y="148" text-anchor="middle" font-size="11" fill="#b85450">⚠️ 后盖覆盖先盖 → 某次盖印可能完全被覆盖，剪枝困难</text>

  <!-- divider -->
  <line x1="40" y1="178" x2="540" y2="178" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- ===== Reverse direction (bottom, green, easy) ===== -->
  <text x="40" y="204" font-size="12" fill="#4a7a3a" font-weight="bold">反向（易）</text>
  <text x="40" y="220" font-size="10" fill="#888">从 target 消回 ?，末次盖印必留完整匹配窗口</text>

  <!-- reverse states: target -> ab??? -> ????? -->
  <rect x="110" y="232" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="251" text-anchor="middle" font-size="13" fill="#333">ababc</text>

  <rect x="270" y="232" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="251" text-anchor="middle" font-size="13" fill="#333">ab???</text>

  <rect x="430" y="232" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="251" text-anchor="middle" font-size="13" fill="#333">?????</text>

  <!-- reverse arrows (pointing left) -->
  <line x1="270" y1="246" x2="240" y2="246" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="430" y1="246" x2="400" y2="246" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="255" y="274" text-anchor="middle" font-size="9" fill="#b85450">撤销2</text>
  <text x="415" y="274" text-anchor="middle" font-size="9" fill="#b85450">撤销0</text>

  <!-- highlight window 2 fully matches stamp -->
  <rect x="430" y="228" width="78" height="36" fill="none" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="469" y="286" text-anchor="middle" font-size="10" fill="#d6a040">窗口2 = abc 全匹配</text>

  <!-- key insight box -->
  <rect x="60" y="300" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">末次盖印不被覆盖 → target 中留完整 stamp 窗口</text>
  <text x="290" y="336" text-anchor="middle" font-size="11" fill="#888">反向识别「非?位全匹配 stamp」的窗口即可撤销</text>

  <!-- topological mapping box -->
  <rect x="60" y="356" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">建模为拓扑排序：todo[i] = 窗口内不匹配位</text>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#888">位置消除 → 通知被阻塞窗口 → todo 空即入队撤销</text>

  <!-- reverse-order note -->
  <rect x="60" y="412" width="460" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="430" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">撤销序列逆序 = 正向盖印顺序</text>
  <text x="290" y="445" text-anchor="middle" font-size="10" fill="#888">撤销 [2,0] → 盖印 [0,2]</text>
</svg>
