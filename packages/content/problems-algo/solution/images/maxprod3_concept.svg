<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排序后最大乘积只有两种候选</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">绿格 = 候选一选取，橙格 = 候选二选取</text>

  <text x="40" y="82" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后 nums =</text>
  <text x="40" y="98" font-size="10" fill="#888" filter="url(#rough2)">（升序）</text>

  <g filter="url(#rough2)" font-size="9" fill="#999">
    <text x="120" y="98" text-anchor="middle">0</text>
    <text x="168" y="98" text-anchor="middle">1</text>
    <text x="216" y="98" text-anchor="middle">2</text>
    <text x="264" y="98" text-anchor="middle">3</text>
    <text x="312" y="98" text-anchor="middle">4</text>
    <text x="360" y="98" text-anchor="middle">5</text>
    <text x="408" y="98" text-anchor="middle">n-1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="98" y="104" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="120" y="127" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−100</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="146" y="104" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="168" y="127" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−98</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="194" y="104" width="44" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" rx="4"/>
    <text x="216" y="127" text-anchor="middle" font-size="13" fill="#888">…</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="242" y="104" width="44" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" rx="4"/>
    <text x="264" y="127" text-anchor="middle" font-size="13" fill="#888">…</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="290" y="104" width="44" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" rx="4"/>
    <text x="312" y="127" text-anchor="middle" font-size="13" fill="#888">…</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="338" y="104" width="44" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" rx="4"/>
    <text x="360" y="127" text-anchor="middle" font-size="13" fill="#888">…</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="386" y="104" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="408" y="127" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">max</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="50" y="160" width="220" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="160" y="184" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">候选一：三个最大值</text>
    <text x="160" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a">nums[n-3] × nums[n-2] × nums[n-1]</text>
    <text x="160" y="222" text-anchor="middle" font-size="10.5" fill="#666">三个最大正数相乘</text>
    <text x="160" y="240" text-anchor="middle" font-size="10.5" fill="#666">全正 / 正数足够多时最优</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="290" y="160" width="220" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="400" y="184" text-anchor="middle" font-size="12.5" fill="#a07820" font-weight="bold">候选二：两最小 × 最大</text>
    <text x="400" y="204" text-anchor="middle" font-size="11" fill="#d6a040">nums[0] × nums[1] × nums[n-1]</text>
    <text x="400" y="222" text-anchor="middle" font-size="10.5" fill="#666">两负数相乘得正，再乘最大</text>
    <text x="400" y="240" text-anchor="middle" font-size="10.5" fill="#666">负数绝对值大时反超</text>
  </g>

  <path d="M 120 138 L 120 158" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 168 138 L 168 158" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 138 L 408 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 138 L 300 158" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 312 138 L 250 158" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="140" y="272" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="280" y="294" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">答案 = max(候选一, 候选二)</text>
    <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#888">两种候选覆盖所有情况，无需特判</text>
  </g>

  <path d="M 160 252 L 200 272" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 252 L 360 272" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="330" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="354" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">为什么只需两种？</text>
  <text x="48" y="372" font-size="11" fill="#555" filter="url(#rough2)">① 负数必须成对使用（奇数个负 → 乘积为负，非最大）</text>
  <text x="48" y="386" font-size="11" fill="#555" filter="url(#rough2)">② 两负凑最大正 → 取最小的两个；第三个取最大 → 候选二唯一确定</text>
</svg>
