<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：先向左「归位」，再向右「采集」</text>

  <!-- ================= 示例 1 ================= -->
  <text x="30" y="56" font-size="11.5" fill="#555" filter="url(#rough2)">示例 1（官方样例）：链表 [1,2,3,4,5]，拿到值为 5 的节点（尾节点）</text>

  <path d="M 102,84 C 180,56 360,56 442,84" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="272" y="78" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">② 沿 next 采集：1→2→3→4→5</text>

  <rect x="90" y="88" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="88" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="250" y="88" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="272" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="330" y="88" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="410" y="88" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="432" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <path d="M 432,124 C 340,152 200,152 116,126" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="272" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">① 沿 prev 归位：5→4→3→2→1（走到 prev=null 为止）</text>

  <rect x="188" y="168" width="144" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输出：[1,2,3,4,5]</text>

  <text x="260" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠ 常见错解：拿到节点直接沿 next 采集 → 只得到 [5]，漏掉前面的 1~4</text>

  <!-- ================= 补充例 ================= -->
  <text x="30" y="240" font-size="11.5" fill="#555" filter="url(#rough2)">补充例（自造）：链表 [7,8,9,10]，拿到值为 9 的节点（中间节点）</text>

  <path d="M 132,268 C 220,240 380,240 452,268" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="292" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">② 沿 next 采集：7→8→9→10</text>

  <rect x="120" y="272" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="220" y="272" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="242" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="320" y="272" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="342" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="420" y="272" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="442" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>

  <path d="M 342,308 C 280,336 200,336 156,310" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="247" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">① 沿 prev 归位：9→8→7</text>

  <rect x="218" y="352" width="148" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="292" y="369" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输出：[7,8,9,10]</text>

  <!-- 底部注释 -->
  <text x="260" y="394" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">归位止于 prev=null，采集止于 next=null —— 拿到的节点在头 / 中 / 尾均适用</text>
</svg>
