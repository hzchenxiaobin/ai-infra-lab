<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：tree = [1,2,3,4,null,5,6,null,null,7]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每轮 i==0 出队的节点值覆盖 ans；第 4 轮（最后一层）ans 稳定为 7</text>

  <!-- ===== Mini tree (top-left) ===== -->
  <text x="20" y="74" font-size="10" fill="#446688" font-weight="bold">树形</text>
  <g font-size="10">
    <circle cx="70" cy="92" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="96" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <circle cx="45" cy="120" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="45" y="124" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <circle cx="95" cy="120" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="95" y="124" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <line x1="64" y1="100" x2="50" y2="113" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <line x1="76" y1="100" x2="90" y2="113" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <circle cx="25" cy="148" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="25" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="85" cy="148" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="85" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="110" cy="148" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="110" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <line x1="40" y1="128" x2="28" y2="141" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <line x1="90" y1="128" x2="82" y2="141" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <line x1="100" y1="128" x2="108" y2="141" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <circle cx="78" cy="178" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="78" y="182" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <line x1="83" y1="156" x2="78" y2="170" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  </g>

  <!-- ===== Rounds table (right side) ===== -->
  <!-- header -->
  <text x="170" y="74" font-size="10" fill="#444" font-weight="bold">BFS 逐轮追踪</text>
  <g font-size="9" fill="#888" font-weight="bold">
    <text x="170" y="92">轮次</text>
    <text x="220" y="92">队列初始</text>
    <text x="320" y="92">size</text>
    <text x="355" y="92">出队(首元素标红)</text>
    <text x="470" y="92">ans</text>
  </g>
  <line x1="165" y1="98" x2="540" y2="98" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Round 1 -->
  <g font-size="10">
    <text x="172" y="116" fill="#b85450" font-weight="bold">1</text>
    <rect x="210" y="104" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="240" y="120" text-anchor="middle" fill="#b85450" font-weight="bold">[1]</text>
    <text x="320" y="120" fill="#333">1</text>
    <text x="357" y="120" fill="#b85450" font-weight="bold">1</text>
    <text x="400" y="120" font-size="8" fill="#888">→ push 2,3</text>
    <text x="472" y="120" fill="#333">1</text>
  </g>

  <!-- Round 2 -->
  <g font-size="10">
    <text x="172" y="150" fill="#b85450" font-weight="bold">2</text>
    <rect x="210" y="138" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="250" y="154" text-anchor="middle" fill="#446688" font-weight="bold">[2, 3]</text>
    <text x="320" y="154" fill="#333">2</text>
    <text x="357" y="154" fill="#b85450" font-weight="bold">2</text>
    <text x="370" y="154" fill="#888">→ 3</text>
    <text x="400" y="154" font-size="8" fill="#888">push 4;5,6</text>
    <text x="472" y="154" fill="#333">2</text>
  </g>

  <!-- Round 3 -->
  <g font-size="10">
    <text x="172" y="184" fill="#b85450" font-weight="bold">3</text>
    <rect x="210" y="172" width="95" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="257" y="188" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[4,5,6]</text>
    <text x="320" y="188" fill="#333">3</text>
    <text x="357" y="188" fill="#b85450" font-weight="bold">4</text>
    <text x="370" y="188" fill="#888">→5→6</text>
    <text x="400" y="188" font-size="8" fill="#888">push 7</text>
    <text x="472" y="188" fill="#333">4</text>
  </g>

  <!-- Round 4 (answer) -->
  <g font-size="10">
    <text x="172" y="218" fill="#b85450" font-weight="bold">4</text>
    <rect x="210" y="206" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="240" y="222" text-anchor="middle" fill="#d6a040" font-weight="bold">[7]</text>
    <text x="320" y="222" fill="#333">1</text>
    <text x="357" y="222" fill="#b85450" font-weight="bold">7</text>
    <text x="400" y="222" font-size="8" fill="#888">(无子)</text>
    <rect x="455" y="208" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="475" y="222" text-anchor="middle" fill="#b85450" font-weight="bold">7 ⭐</text>
  </g>

  <!-- Round 5: empty -->
  <g font-size="10">
    <text x="172" y="252" fill="#888">5</text>
    <rect x="210" y="240" width="60" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
    <text x="240" y="256" text-anchor="middle" fill="#888">[]</text>
    <text x="320" y="256" fill="#888">—</text>
    <text x="357" y="256" fill="#888">队列空，结束</text>
    <text x="472" y="256" fill="#888">—</text>
  </g>

  <!-- arrow down between rounds indicating ans carry -->
  <path d="M 475 130 L 475 200" stroke="#b85450" stroke-width="1.2" stroke-dasharray="2,2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="495" y="168" font-size="8" fill="#b85450">每轮覆盖</text>

  <!-- ===== Insight box ===== -->
  <rect x="20" y="290" width="520" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="40" y="312" font-size="11" fill="#4a7a3a" font-weight="bold">关键观察：ans 在每轮被覆盖，只有到「最后一层」才稳定</text>
  <text x="40" y="330" font-size="10" fill="#555">轮 1→2→3 记录的 1、2、4 都不是答案 —— 它们只是各自层的最左，但不是「最后一行」。</text>
  <text x="40" y="346" font-size="10" fill="#555">轮 4 是最后一层（之后队列为空），此时 ans = 7 才是真正的「最后一行最左」。</text>

  <rect x="20" y="372" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="392" font-size="11" fill="#d6a040" font-weight="bold">为什么不能提前返回？</text>
  <text x="40" y="408" font-size="10" fill="#555">BFS 是「逐层推进」的，只有队列空了才知道「刚才那层是最后一层」。提前返回会误把中间层的最左当答案。</text>
  <text x="40" y="422" font-size="10" fill="#555">这是「最后一行」语义的固有代价 —— 与 199 右视图「每层取最右」不同，513 必须等到 BFS 结束。</text>
</svg>
