<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：逐物品倒序刷表（二维 0/1 背包）</text>

  <!-- 初始化 -->
  <rect x="140" y="28" width="240" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">初始化：reach[0][0] = 1</text>
  <text x="260" y="59" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">其余格子全为 0（空手出发）</text>

  <path d="M 260 66 L 260 74" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 物品循环 -->
  <rect x="118" y="78" width="284" height="34" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">逐个取出物品 w</text>
  <text x="260" y="107" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">若 w &gt; c₁ 且 w &gt; c₂：两袋都放不进，直接跳过</text>

  <path d="M 260 112 L 260 118" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 倒序枚举 -->
  <rect x="108" y="122" width="304" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">倒序枚举格子：a 从 c₁ → 0，b 从 c₂ → 0</text>

  <!-- 分流箭头 -->
  <path d="M 200 152 C 190 158, 170 160, 152 162" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 152 C 330 158, 350 160, 368 162" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 转移：袋1 -->
  <rect x="44" y="166" width="206" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="147" y="184" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">物品进袋1（需 a ≥ w）</text>
  <text x="147" y="203" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">reach[a][b] ∨= reach[a−w][b]</text>

  <!-- 转移：袋2 -->
  <rect x="270" y="166" width="206" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="373" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">物品进袋2（需 b ≥ w）</text>
  <text x="373" y="203" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">reach[a][b] ∨= reach[a][b−w]</text>

  <!-- 汇聚到循环判断 -->
  <path d="M 150 222 C 160 236, 220 240, 248 246" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 370 222 C 360 236, 300 240, 272 246" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 循环判断菱形 -->
  <polygon points="260,244 310,264 260,284 210,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">物品都处理完？</text>

  <!-- 否：回到物品循环 -->
  <path d="M 210 264 L 30 264 L 30 95 L 114 95" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="256" font-size="9" fill="#666" filter="url(#rough2)">否（取下一个 w）</text>

  <!-- 是：向下 -->
  <path d="M 260 284 L 260 292" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="270" y="291" font-size="9" fill="#666" filter="url(#rough2)">是</text>

  <!-- 扫描答案 -->
  <rect x="110" y="296" width="300" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">扫描全表：ans = max(a+b)，reach[a][b] = 1</text>

  <path d="M 410 310 L 432 310" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="436" y="296" width="76" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="474" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- 倒序警示 -->
  <rect x="366" y="24" width="142" height="64" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="40" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ a、b 必须双倒序</text>
  <text x="437" y="54" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">来源格 (a−w,b)、(a,b−w)</text>
  <text x="437" y="66" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">才仍是旧值（不含 w）</text>
  <text x="437" y="78" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">否则同一物品被用两次</text>

  <text x="56" y="248" font-size="9" fill="#666" filter="url(#rough2)">不放 = 状态原样保留</text>
  <text x="56" y="260" font-size="9" fill="#666" filter="url(#rough2)">（∨= 语义天然自带）</text>
</svg>
