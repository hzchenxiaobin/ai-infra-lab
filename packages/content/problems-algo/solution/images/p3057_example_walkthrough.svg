<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：4 行明细 → 2 个团队均值 → 逐行比较 → 输出 2 行</text>

  <!-- ① JOIN 明细表 -->
  <text x="36" y="55" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">① JOIN 后明细（Project ⋈ Employees）</text>
  <rect x="24" y="60" width="472" height="84" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <path d="M 24 76 L 496 76" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">project_id</text>
  <text x="145" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">employee_id</text>
  <text x="235" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">name</text>
  <text x="315" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">team</text>
  <text x="423" y="72" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">workload</text>
  <path d="M 100 76 L 100 144" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 190 76 L 190 144" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 280 76 L 280 144" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 350 76 L 350 144" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 24 93 L 496 93" stroke="#c9d6e8" stroke-width="0.7" filter="url(#rough2)"/>
  <text x="62" y="88" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="145" y="88" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="235" y="88" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Khaled</text>
  <rect x="301" y="79" width="28" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="315" y="89" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="423" y="88" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">45</text>
  <path d="M 24 110 L 496 110" stroke="#c9d6e8" stroke-width="0.7" filter="url(#rough2)"/>
  <text x="62" y="105" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="145" y="105" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <text x="235" y="105" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Ali</text>
  <rect x="301" y="96" width="28" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="315" y="106" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="423" y="105" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">90</text>
  <path d="M 24 127 L 496 127" stroke="#c9d6e8" stroke-width="0.7" filter="url(#rough2)"/>
  <text x="62" y="122" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <text x="145" y="122" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <text x="235" y="122" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">John</text>
  <rect x="301" y="113" width="28" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="315" y="123" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="423" y="122" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">12</text>
  <text x="62" y="139" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <text x="145" y="139" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <text x="235" y="139" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Doe</text>
  <rect x="301" y="130" width="28" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="315" y="140" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="423" y="139" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">68</text>

  <!-- ② 均值 chips -->
  <rect x="24" y="158" width="232" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="176" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② Team A：avg = (45+68)/2 = 56.50</text>
  <rect x="264" y="158" width="232" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="176" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">Team B：avg = (90+12)/2 = 51.00</text>

  <!-- ③ 比较表 -->
  <text x="36" y="213" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 逐行比较（严格大于）</text>
  <rect x="24" y="218" width="264" height="84" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <path d="M 24 234 L 288 234" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="62" y="230" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">员工</text>
  <text x="118" y="230" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">team</text>
  <text x="164" y="230" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">workload</text>
  <text x="216" y="230" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">团队avg</text>
  <text x="264" y="230" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">入选?</text>
  <path d="M 100 234 L 100 302" stroke="#e8c4c1" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 136 234 L 136 302" stroke="#e8c4c1" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 192 234 L 192 302" stroke="#e8c4c1" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 240 234 L 240 302" stroke="#e8c4c1" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="62" y="247" font-size="9" fill="#333" filter="url(#rough2)">1 · Khaled</text>
  <text x="118" y="247" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="164" y="247" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">45</text>
  <text x="216" y="247" text-anchor="middle" font-size="9" fill="#8f3a36" filter="url(#rough2)">56.50</text>
  <text x="264" y="248" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <path d="M 24 251 L 288 251" stroke="#e8c4c1" stroke-width="0.7" filter="url(#rough2)"/>
  <rect x="24" y="251" width="264" height="17" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="62" y="264" font-size="9" fill="#333" filter="url(#rough2)">2 · Ali</text>
  <text x="118" y="264" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="164" y="264" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">90</text>
  <text x="216" y="264" text-anchor="middle" font-size="9" fill="#8f3a36" filter="url(#rough2)">51.00</text>
  <text x="264" y="265" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <path d="M 24 268 L 288 268" stroke="#e8c4c1" stroke-width="0.7" filter="url(#rough2)"/>
  <text x="62" y="281" font-size="9" fill="#333" filter="url(#rough2)">3 · John</text>
  <text x="118" y="281" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="164" y="281" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">12</text>
  <text x="216" y="281" text-anchor="middle" font-size="9" fill="#8f3a36" filter="url(#rough2)">51.00</text>
  <text x="264" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <path d="M 24 285 L 288 285" stroke="#e8c4c1" stroke-width="0.7" filter="url(#rough2)"/>
  <rect x="24" y="285" width="264" height="17" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="62" y="298" font-size="9" fill="#333" filter="url(#rough2)">4 · Doe</text>
  <text x="118" y="298" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="164" y="298" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">68</text>
  <text x="216" y="298" text-anchor="middle" font-size="9" fill="#8f3a36" filter="url(#rough2)">56.50</text>
  <text x="264" y="299" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- ④ 输出表 -->
  <text x="312" y="213" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ 输出（重命名四列）</text>
  <rect x="300" y="218" width="196" height="84" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <path d="M 300 234 L 496 234" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="322" y="230" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">employee_id</text>
  <text x="364" y="230" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">project_id</text>
  <text x="410" y="230" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">name</text>
  <text x="466" y="230" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">workload</text>
  <path d="M 344 234 L 344 302" stroke="#d4e5cc" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 384 234 L 384 302" stroke="#d4e5cc" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 436 234 L 436 302" stroke="#d4e5cc" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="300" y="234" width="196" height="34" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="322" y="255" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <text x="364" y="255" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="410" y="255" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Ali</text>
  <text x="466" y="255" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">90</text>
  <path d="M 300 268 L 496 268" stroke="#d4e5cc" stroke-width="0.7" filter="url(#rough2)"/>
  <rect x="300" y="268" width="196" height="34" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="322" y="289" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <text x="364" y="289" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <text x="410" y="289" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Doe</text>
  <text x="466" y="289" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">68</text>
  <text x="398" y="309" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">（name→employee_name 等重命名）</text>

  <!-- 底部注记 -->
  <rect x="24" y="322" width="472" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">排序键：employee_id 优先 → (2, 1, Ali, 90) 排在 (4, 2, Doe, 68) 前</text>
  <text x="260" y="348" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">自检：A 组 45/68 对 56.50，B 组 90/12 对 51.00 —— 各比各的，互不串线</text>
</svg>
