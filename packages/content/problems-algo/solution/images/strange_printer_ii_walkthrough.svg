<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算（示例 3）：两个颜色互包 → 依赖成环 → false</text>

  <!-- ===== 左侧：3×3 网格 ===== -->
  <!-- cell 44×44, origin (56,70) -->
  <!-- row0: 1 2 1 -->
  <rect x="56" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="100" y="70" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="122" y="98" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold">2</text>
  <rect x="144" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="166" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- row1: 2 1 2 -->
  <rect x="56" y="114" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="142" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold">2</text>
  <rect x="100" y="114" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="122" y="142" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="144" y="114" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="166" y="142" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold">2</text>
  <!-- row2: 1 2 1 -->
  <rect x="56" y="158" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="186" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="100" y="158" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="122" y="186" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold">2</text>
  <rect x="144" y="158" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="166" y="186" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- 颜色1 包围矩形 = 整个网格（蓝粗实线，外扩 6） -->
  <rect x="50" y="64" width="144" height="144" fill="none" stroke="#446688" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="122" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">颜色1 包围矩形（整图）</text>

  <!-- 颜色2 包围矩形 = 整个网格（橙粗虚线，外扩 10） -->
  <rect x="46" y="60" width="152" height="152" fill="none" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="6,4" rx="6" filter="url(#rough2)"/>
  <text x="122" y="224" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">颜色2 包围矩形（同样整图）</text>

  <!-- ===== 右侧：依赖图（成环） ===== -->
  <text x="400" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">依赖图：出现环</text>

  <!-- 颜色1 的矩形内有 2 → 1→2 -->
  <!-- 颜色2 的矩形内有 1 → 2→1 -->
  <!-- 节点1 -->
  <ellipse cx="330" cy="140" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="145" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- 节点2 -->
  <ellipse cx="470" cy="140" rx="26" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="145" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold">2</text>

  <!-- 上弧 1→2 -->
  <path d="M 356 132 Q 400 108 444 132" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1 的矩形含 2</text>
  <!-- 下弧 2→1 -->
  <path d="M 444 150 Q 400 174 356 150" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2 的矩形含 1</text>

  <!-- 矛盾说明 -->
  <rect x="280" y="200" width="240" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">矛盾：1 须先于 2，且 2 须先于 1</text>
  <text x="400" y="240" text-anchor="middle" font-size="11" fill="#555">两个颜色都在对方的矩形里</text>
  <text x="400" y="258" text-anchor="middle" font-size="11" fill="#555">谁先打印都会被对方覆盖 → 无解</text>

  <!-- ===== 底部结论 ===== -->
  <rect x="60" y="300" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">拓扑排序无法处理所有颜色 → 有环 → 返回 false</text>

  <!-- 小提示 -->
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#888">对比示例 1：颜色1 的矩形含 2（1→2），但颜色2 的矩形内只有 2（无边），无环 → true</text>
</svg>
