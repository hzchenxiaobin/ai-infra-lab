<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：累加 + 命中 target 即切一段
  </text>

  <!-- 1. 开始 -->
  <rect x="230" y="46" width="100" height="32" rx="16" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <line x1="280" y1="78" x2="280" y2="96" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 求 total -->
  <rect x="140" y="98" width="280" height="40" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    total = sum(arr)
  </text>
  <line x1="280" y1="138" x2="280" y2="156" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 判定 total%3 菱形 cx=280 cy=180 -->
  <path d="M280,158 L402,180 L280,202 L158,180 Z" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    total % 3 ≠ 0 ?
  </text>

  <!-- Yes -> 返回 false (右侧) -->
  <line x1="402" y1="180" x2="446" y2="180" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="172" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="446" y="160" width="100" height="40" rx="16" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="496" y="185" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回 false</text>

  <!-- No -> 下 -->
  <line x1="280" y1="202" x2="280" y2="222" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="216" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 4. 初始化 target/count/cur -->
  <rect x="120" y="224" width="320" height="44" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    target = total / 3，cur = 0，count = 0
  </text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    从左到右遍历每个元素 x
  </text>
  <line x1="280" y1="268" x2="280" y2="286" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 累加 -->
  <rect x="150" y="288" width="260" height="38" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    cur += x
  </text>
  <line x1="280" y1="326" x2="280" y2="344" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. 判定 cur==target 菱形 cx=280 cy=368 -->
  <path d="M280,346 L384,368 L280,390 L176,368 Z" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    cur == target ?
  </text>

  <!-- Yes -> 左侧 count++ / cur=0 -->
  <line x1="176" y1="368" x2="158" y2="368" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="360" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="30" y="346" width="128" height="46" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="94" y="366" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">count + +</text>
  <text x="94" y="382" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">cur = 0</text>

  <!-- 回到累加框 (左侧曲线) -->
  <path d="M94,346 C94,318 220,318 280,284" fill="none" stroke="#4a7a3a"
        stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No -> 下 -->
  <line x1="280" y1="390" x2="280" y2="408" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="402" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 回到累加框 (右侧曲线，下一轮) -->
  <path d="M280,408 C420,408 420,308 410,308" fill="none" stroke="#446688"
        stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="356" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下</text>
  <text x="438" y="370" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">一</text>
  <text x="438" y="384" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">轮</text>

  <!-- 7. 遍历结束 -> 返回 -->
  <rect x="180" y="416" width="200" height="40" rx="16" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="441" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    遍历结束：返回 count ≥ 3
  </text>
</svg>
