<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="none" stroke="#888" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">数值平衡数：每个出现的数字 d 恰好出现 d 次</text>

  <!-- ===== 平衡数 区 ===== -->
  <text x="40" y="66" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 平衡数</text>

  <!-- 22 -->
  <text x="40" y="92" font-size="11" fill="#888">22 :</text>
  <rect x="120" y="74" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="164" y="74" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="220" y="96" font-size="11" fill="#4a7a3a">数字 2 出现 2 次 ✓</text>

  <!-- 1333 -->
  <text x="40" y="138" font-size="11" fill="#888">1333 :</text>
  <rect x="120" y="120" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="164" y="120" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="142" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="208" y="120" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="142" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="252" y="120" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="142" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="308" y="142" font-size="11" fill="#446688">1→1 次</text>
  <text x="308" y="156" font-size="11" fill="#4a7a3a">3→3 次 ✓</text>

  <!-- ===== 非平衡数 区 ===== -->
  <text x="40" y="196" font-size="12" fill="#b85450" font-weight="bold">✗ 非平衡数</text>

  <!-- 123 -->
  <text x="40" y="222" font-size="11" fill="#888">123 :</text>
  <rect x="120" y="204" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="226" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="164" y="204" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="226" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="208" y="204" width="40" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="226" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">3</text>
  <text x="264" y="222" font-size="11" fill="#b85450">数字 2 只出现 1 次</text>
  <text x="264" y="236" font-size="11" fill="#b85450">却需出现 2 次 ✗</text>

  <!-- ===== 关键观察框 ===== -->
  <rect x="50" y="262" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">观察一：平衡数中不可能出现 0</text>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#666">0 须出现 0 次 → 凡含 0 的数必不合法（如 1000、10）</text>

  <!-- ===== 构成规则框 ===== -->
  <rect x="50" y="322" width="460" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">观察二：选数字集合 S → d 出现 d 次 → 多重集全排列</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#666">总位数 L = Σd，S={1,3} ⇒ 多重集 {1,3,3,3} ⇒ 1333/3133/3313/3331</text>
</svg>
