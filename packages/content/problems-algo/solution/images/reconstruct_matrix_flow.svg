<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="680" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">两遍扫描贪心算法流程</text>

  <!-- Start -->
  <rect x="180" y="48" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">初始化 res = 2×n 全 0</text>

  <path d="M 260 86 L 260 104" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 1 label -->
  <rect x="100" y="108" width="320" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第 1 遍：遍历 colsum，i = 0 → n-1</text>

  <path d="M 260 138 L 260 152" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: colsum[i] == 2? -->
  <polygon points="260,156 360,200 260,244 160,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#444">colsum[i] == 2 ?</text>
  <text x="260" y="212" text-anchor="middle" font-size="10.5" fill="#888">（列和为 2？）</text>

  <!-- Yes branch -->
  <path d="M 360 200 L 400 200 L 400 270" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="194" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="330" y="274" width="140" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="294" text-anchor="middle" font-size="11" fill="#446688">res[0][i] = 1</text>
  <text x="400" y="310" text-anchor="middle" font-size="11" fill="#446688">res[1][i] = 1</text>
  <text x="400" y="324" text-anchor="middle" font-size="10" fill="#888">upper-- &amp; lower--</text>

  <!-- No branch (skip) -->
  <path d="M 160 200 L 120 200 L 120 274" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="194" font-size="11" fill="#888" font-weight="bold">否</text>

  <rect x="60" y="278" width="120" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="304" text-anchor="middle" font-size="11" fill="#888">跳过该列</text>

  <!-- Merge -->
  <path d="M 120 320 L 120 340" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 324 L 400 340" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 120 340 L 400 340" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <path d="M 260 340 L 260 358" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop back for pass 1 -->
  <rect x="170" y="362" width="180" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#888">i++ &amp; 循环至 i == n</text>

  <path d="M 260 394 L 260 412" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 2 label -->
  <rect x="100" y="416" width="320" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="435" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">第 2 遍：遍历 colsum，i = 0 → n-1</text>

  <path d="M 260 446 L 260 460" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: colsum[i] == 1? -->
  <polygon points="260,464 360,508 260,552 160,508" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="504" text-anchor="middle" font-size="12" fill="#444">colsum[i] == 1 ?</text>

  <!-- Yes: upper > 0? -->
  <path d="M 360 508 L 400 508" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="502" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <polygon points="430,508 480,530 430,552 380,530" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="535" text-anchor="middle" font-size="11" fill="#b85450">upper&gt;0?</text>

  <!-- upper > 0: give to row 0 -->
  <path d="M 480 530 L 510 530 L 510 580" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="524" font-size="10" fill="#446688">是</text>
  <rect x="455" y="584" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="600" text-anchor="middle" font-size="10" fill="#446688">上行=1</text>
  <text x="485" y="614" text-anchor="middle" font-size="9" fill="#888">upper--</text>

  <!-- upper == 0: give to row 1 -->
  <path d="M 430 552 L 430 580" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="572" font-size="10" fill="#b85450">否</text>
  <rect x="370" y="584" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="600" text-anchor="middle" font-size="10" fill="#b85450">下行=1</text>
  <text x="400" y="614" text-anchor="middle" font-size="9" fill="#888">lower--</text>

  <!-- No: skip -->
  <path d="M 160 508 L 120 508 L 120 580" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="502" font-size="11" fill="#888">否</text>
  <rect x="75" y="584" width="90" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="608" text-anchor="middle" font-size="11" fill="#888">跳过该列</text>

  <!-- Final check -->
  <path d="M 120 620 L 120 636 L 260 636" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 400 620 L 400 636 L 260 636" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 485 620 L 485 636 L 260 636" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <path d="M 260 636 L 260 650" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="654" width="240" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="668" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">upper==0 &amp;&amp; lower==0 ? 返回 res : []</text>
</svg>
