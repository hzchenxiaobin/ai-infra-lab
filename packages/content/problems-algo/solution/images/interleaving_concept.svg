<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fdfcf7"/>

  <text x="300" y="32" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">交错字符串：双源合并</text>
  <path d="M 210 42 Q 300 50 390 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="300" y="58" text-anchor="middle" font-size="11" fill="#888">s3 的每个字符来自 s1 或 s2，各自相对顺序保持不变</text>

  <!-- s1 row -->
  <text x="40" y="112" font-size="13" fill="#446688" font-weight="bold">s1</text>
  <g filter="url(#sk)"><rect x="70" y="88" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="90" y="112" text-anchor="middle" font-size="14" fill="#2b4a6a" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="118" y="88" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="138" y="112" text-anchor="middle" font-size="14" fill="#2b4a6a" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="166" y="88" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="186" y="112" text-anchor="middle" font-size="14" fill="#2b4a6a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="214" y="88" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="234" y="112" text-anchor="middle" font-size="14" fill="#2b4a6a" font-weight="bold">c</text>
  <g filter="url(#sk)"><rect x="262" y="88" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="282" y="112" text-anchor="middle" font-size="14" fill="#2b4a6a" font-weight="bold">c</text>
  <text x="318" y="112" font-size="11" fill="#446688">← 指针 i</text>

  <!-- s3 row (color coded by source: B=blue s1, G=green s2) -->
  <text x="40" y="222" font-size="13" fill="#b85450" font-weight="bold">s3</text>
  <!-- s3[0]=a (s1) -->
  <g filter="url(#sk)"><rect x="70" y="198" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="85" y="220" text-anchor="middle" font-size="13" fill="#2b4a6a" font-weight="bold">a</text>
  <!-- s3[1]=a (s1) -->
  <g filter="url(#sk)"><rect x="104" y="198" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="119" y="220" text-anchor="middle" font-size="13" fill="#2b4a6a" font-weight="bold">a</text>
  <!-- s3[2]=d (s2) -->
  <g filter="url(#sk)"><rect x="138" y="198" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="153" y="220" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold">d</text>
  <!-- s3[3]=b (s1) -->
  <g filter="url(#sk)"><rect x="172" y="198" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="187" y="220" text-anchor="middle" font-size="13" fill="#2b4a6a" font-weight="bold">b</text>
  <!-- s3[4]=b (s2) -->
  <g filter="url(#sk)"><rect x="206" y="198" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="221" y="220" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold">b</text>
  <!-- s3[5]=c (s1) -->
  <g filter="url(#sk)"><rect x="240" y="198" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="255" y="220" text-anchor="middle" font-size="13" fill="#2b4a6a" font-weight="bold">c</text>
  <!-- s3[6]=b (s2) -->
  <g filter="url(#sk)"><rect x="274" y="198" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="289" y="220" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold">b</text>
  <!-- s3[7]=c (s2) -->
  <g filter="url(#sk)"><rect x="308" y="198" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="323" y="220" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold">c</text>
  <!-- s3[8]=a (s2) -->
  <g filter="url(#sk)"><rect x="342" y="198" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="357" y="220" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold">a</text>
  <!-- s3[9]=c (s1) -->
  <g filter="url(#sk)"><rect x="376" y="198" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="391" y="220" text-anchor="middle" font-size="13" fill="#2b4a6a" font-weight="bold">c</text>
  <text x="416" y="220" font-size="11" fill="#b85450">← 指针 k = i + j</text>

  <!-- s2 row -->
  <text x="40" y="332" font-size="13" fill="#4a7a3a" font-weight="bold">s2</text>
  <g filter="url(#sk)"><rect x="70" y="308" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="90" y="332" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">d</text>
  <g filter="url(#sk)"><rect x="118" y="308" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="138" y="332" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="166" y="308" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="186" y="332" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="214" y="308" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="234" y="332" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">c</text>
  <g filter="url(#sk)"><rect x="262" y="308" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="282" y="332" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">a</text>
  <text x="318" y="332" font-size="11" fill="#4a7a3a">← 指针 j</text>

  <!-- merge arrows: s1 -> s3 (blue) and s2 -> s3 (green), on the far left -->
  <path d="M 64 106 Q 50 160 64 214" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <text x="30" y="166" font-size="10" fill="#446688">取 s1</text>
  <path d="M 64 326 Q 50 272 64 218" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="30" y="288" font-size="10" fill="#4a7a3a">取 s2</text>

  <!-- decision box (right) -->
  <g filter="url(#sk)">
    <rect x="440" y="88" width="148" height="120" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="514" y="110" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">每步决策</text>
  <text x="450" y="132" font-size="11" fill="#444">k = i + j</text>
  <text x="450" y="152" font-size="11" fill="#446688">s1[i]==s3[k]?</text>
  <text x="468" y="168" font-size="10" fill="#446688">→ 取 s1, i++</text>
  <text x="450" y="186" font-size="11" fill="#4a7a3a">s2[j]==s3[k]?</text>
  <text x="468" y="200" font-size="10" fill="#4a7a3a">→ 取 s2, j++</text>

  <!-- legend box (right, lower) -->
  <g filter="url(#sk)">
    <rect x="440" y="230" width="148" height="92" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="514" y="252" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">图例</text>
  <g filter="url(#sk)"><rect x="452" y="264" width="20" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="480" y="276" font-size="11" fill="#444">字符来自 s1</text>
  <g filter="url(#sk)"><rect x="452" y="290" width="20" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="480" y="302" font-size="11" fill="#444">字符来自 s2</text>
  <text x="452" y="316" font-size="10" fill="#888">颜色编码即交错方案</text>
</svg>
