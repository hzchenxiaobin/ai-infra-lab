<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最短回文串 · KMP 算法流程</text>

  <rect x="120" y="48" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 构造 pattern = s + "#" + reverse(s)</text>
  <text x="270" y="88" text-anchor="middle" font-size="11" fill="#666">长度 m = 2n + 1，# 隔离防伪匹配</text>

  <path d="M270 100 L270 122" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="126" width="400" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="148" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 构建 LPS 表（与 28 题同构）</text>
  <text x="90" y="170" font-size="11" fill="#444" font-family="monospace">lps[0]=0, j=0</text>
  <text x="90" y="186" font-size="11" fill="#444" font-family="monospace">for i in 1..m-1:</text>
  <text x="106" y="200" font-size="10.5" fill="#4a7a3a" font-family="monospace">while j&gt;0 &amp;&amp; pat[i]!=pat[j]: j=lps[j-1]</text>
  <text x="106" y="214" font-size="10.5" fill="#b85450" font-family="monospace" font-weight="bold">i 永不回退 → O(n) 均摊</text>

  <path d="M270 212 L270 234" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="238" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 取 L = lps[m−1]</text>
  <text x="270" y="278" text-anchor="middle" font-size="11" fill="#666">L = s 的最长回文前缀长度</text>

  <path d="M270 290 L270 312" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="316" width="360" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">④ 返回 reverse(s)[:n−L] + s</text>
  <text x="270" y="356" text-anchor="middle" font-size="11" fill="#666">翻转剩余后缀补到最前面</text>

  <rect x="60" y="376" width="420" height="18" fill="none" stroke="none"/>
  <text x="270" y="390" text-anchor="middle" font-size="10.5" fill="#888">时间 O(n) · 空间 O(n) · # 保证 lps[末位] ≤ n</text>
</svg>
