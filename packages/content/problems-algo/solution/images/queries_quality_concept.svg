<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 思路：GROUP BY query_name + 两个聚合公式</text>

  <!-- Step 1: 原始表 -->
  <text x="40" y="58" font-size="11.5" fill="#888">① 原始表 Queries（每行 = 一条查询结果，可能有重复行）</text>
  <rect x="40" y="68" width="500" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">query_name</text>
  <text x="220" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">result</text>
  <text x="340" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">position</text>
  <text x="450" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">rating</text>
  <text x="290" y="106" text-anchor="middle" font-size="10.5" fill="#888">position∈[1,500]，rating∈[1,5]，rating&lt;3 为劣质</text>

  <path d="M 290 118 L 290 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY -->
  <text x="40" y="152" font-size="11.5" fill="#888">② GROUP BY query_name — 按查询名分组</text>
  <rect x="50" y="160" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">GROUP BY query_name</text>
  <text x="290" y="196" text-anchor="middle" font-size="10.5" fill="#555">同一 query_name 的所有行合并为一个分组</text>

  <path d="M 290 206 L 290 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 两个聚合公式 -->
  <text x="40" y="240" font-size="11.5" fill="#888">③ 每组算两个聚合值</text>

  <!-- quality 公式框 -->
  <rect x="50" y="248" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="266" font-size="11" fill="#d6a040" font-weight="bold">quality</text>
  <text x="64" y="282" font-size="10.5" fill="#555">= ROUND( AVG(rating / position), 2 )</text>
  <text x="300" y="274" text-anchor="middle" font-size="10" fill="#888">评分与位置比率的平均值</text>

  <!-- poor_query_percentage 公式框 -->
  <rect x="50" y="296" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="314" font-size="11" fill="#b85450" font-weight="bold">poor_query_percentage</text>
  <text x="64" y="330" font-size="10.5" fill="#555">= ROUND( AVG(rating &lt; 3) * 100, 2 )</text>
  <text x="320" y="322" text-anchor="middle" font-size="10" fill="#888">劣质查询（rating&lt;3）占比 ×100</text>

  <path d="M 290 338 L 290 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="353" font-size="10" fill="#888">输出</text>

  <!-- Result -->
  <rect x="50" y="362" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="382" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">SELECT query_name, quality, poor_query_percentage</text>
  <text x="290" y="400" text-anchor="middle" font-size="10.5" fill="#555">每个 query_name 一行，两个指标均四舍五入到两位小数</text>

  <!-- Key insight box -->
  <rect x="40" y="424" width="500" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="442" font-size="11" fill="#555" font-weight="bold">💡 AVG(布尔) 技巧：</text>
  <text x="60" y="456" font-size="10.5" fill="#888">MySQL 中 rating&lt;3 返回 1/0，AVG 直接得比例（0~1），×100 转百分比</text>
</svg>
