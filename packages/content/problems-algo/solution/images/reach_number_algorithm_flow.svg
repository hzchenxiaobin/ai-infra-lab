<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：累加 S，找最小的 k 使 S ≥ target 且 (S−target) 为偶数</text>

  <!-- Step 1: target = abs(target) -->
  <rect x="190" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① target = abs(target)</text>
  <text x="290" y="78" text-anchor="middle" font-size="9" fill="#666">左右对称，只看正方向</text>

  <path d="M 290 88 L 290 104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="190" y="106" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="124" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② k = 0,  S = 0</text>
  <text x="290" y="138" text-anchor="middle" font-size="9" fill="#666">从第 0 步开始</text>

  <path d="M 290 148 L 290 164" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: k++, S += k -->
  <rect x="170" y="166" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="185" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ k = k + 1,  S = S + k</text>
  <text x="290" y="201" text-anchor="middle" font-size="9" fill="#666">多走一步，累计和增大</text>

  <!-- loop back arrow (right side) -->
  <path d="M 412 188 Q 470 188 470 280 Q 470 360 412 360" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="274" font-size="10" fill="#888" filter="url(#rough2)">不满足</text>
  <text x="486" y="288" font-size="10" fill="#888" filter="url(#rough2)">则回 ③</text>

  <path d="M 290 212 L 290 232" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: S >= target ? -->
  <polygon points="290,236 380,286 290,336 200,286" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">S ≥ target ?</text>
  <text x="290" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a">累计够了吗</text>

  <!-- No branch: loop back up -->
  <path d="M 200 286 L 150 286 Q 130 286 130 230 Q 130 188 168 188" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="110" y="240" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Yes branch: down -->
  <path d="M 290 338 L 290 358" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="306" y="352" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision diamond 2: (S - target) even ? -->
  <polygon points="290,362 390,412 290,462 190,412" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(S−target)</text>
  <text x="290" y="422" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">为偶数 ?</text>

  <!-- No branch: loop back to step 3 (left side, dashed) -->
  <path d="M 190 412 L 120 412 Q 100 412 100 360 Q 100 188 168 188" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="78" y="300" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="78" y="314" font-size="9" fill="#b85450" filter="url(#rough2)">(奇→补步)</text>

  <!-- Yes branch: return k -->
  <path d="M 290 464 L 290 484" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="306" y="478" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="200" y="486" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="506" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 k  ✓</text>
  <text x="290" y="520" text-anchor="middle" font-size="9" fill="#888">首次满足两条件即最小步数</text>
</svg>
