<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：「最大只比最小多 1」⟹ 所有盒子大小只能是 {x, x+1}</text>
  <text x="280" y="45" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例：balls = [10,10,10,3,1,1] → 按编号数频率：10×3、3×1、1×2</text>

  <!-- illegal plan -->
  <rect x="30" y="58" width="270" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">✗ 整堆塞一个盒子（3 盒，更少但违规）</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="44" y="92" width="86" height="34" fill="#fff" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="87" y="113" text-anchor="middle" fill="#8c3a36">10 · 10 · 10</text>
    <text x="87" y="140" text-anchor="middle" fill="#8c3a36" font-size="11">size = 3</text>
    <rect x="140" y="92" width="50" height="34" fill="#fff" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="165" y="113" text-anchor="middle" fill="#8c3a36">3</text>
    <text x="165" y="140" text-anchor="middle" fill="#8c3a36" font-size="11">size = 1</text>
    <rect x="200" y="92" width="62" height="34" fill="#fff" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="231" y="113" text-anchor="middle" fill="#8c3a36">1 · 1</text>
    <text x="231" y="140" text-anchor="middle" fill="#8c3a36" font-size="11">size = 2</text>
    <text x="165" y="168" text-anchor="middle" fill="#8c3a36" font-weight="bold">最大 3 − 最小 1 = 2 &gt; 1，违规 ✗</text>
  </g>

  <!-- legal plan -->
  <rect x="30" y="200" width="270" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c22" filter="url(#rough2)">✓ 拆成 x=1 / x+1=2 的盒子（4 盒，合法）</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="44" y="234" width="44" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="66" y="255" text-anchor="middle" fill="#2e5c22">10</text>
    <text x="66" y="282" text-anchor="middle" fill="#2e5c22" font-size="11">x=1</text>
    <rect x="98" y="234" width="56" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="126" y="255" text-anchor="middle" fill="#2e5c22">10 · 10</text>
    <text x="126" y="282" text-anchor="middle" fill="#2e5c22" font-size="11">x+1=2</text>
    <rect x="164" y="234" width="44" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="186" y="255" text-anchor="middle" fill="#2e5c22">3</text>
    <text x="186" y="282" text-anchor="middle" fill="#2e5c22" font-size="11">x=1</text>
    <rect x="218" y="234" width="56" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="246" y="255" text-anchor="middle" fill="#2e5c22">1 · 1</text>
    <text x="246" y="282" text-anchor="middle" fill="#2e5c22" font-size="11">x+1=2</text>
    <text x="165" y="310" text-anchor="middle" fill="#2e5c22" font-weight="bold">大小只有 1 和 2 两种，差恰为 1 ✓</text>
  </g>

  <!-- right rules box -->
  <rect x="316" y="58" width="214" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#2c4a6e">
    <text x="423" y="80" text-anchor="middle" font-weight="bold">两条规则的转化</text>
    <text x="423" y="102" text-anchor="middle">① 同盒同编号 → 各编号独立拆分</text>
    <text x="423" y="122" text-anchor="middle">② 最大 − 最小 ≤ 1</text>
    <text x="423" y="142" text-anchor="middle">⟹ 全局盒大小 ∈ {x, x+1}</text>
    <text x="423" y="164" text-anchor="middle">枚举小尺寸 x，大尺寸即 x+1</text>
  </g>

  <!-- capacity interval box -->
  <rect x="316" y="192" width="214" height="138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#8a6414">
    <text x="423" y="214" text-anchor="middle" font-weight="bold">单编号判定：f 个球，g 个盒</text>
    <text x="423" y="236" text-anchor="middle">每盒 x ~ x+1 个 ⟹ 容量区间</text>
    <text x="423" y="258" text-anchor="middle">[g·x , g·(x+1)]</text>
    <text x="423" y="280" text-anchor="middle">可行 ⟺ f 落进某 g 的区间</text>
    <text x="423" y="302" text-anchor="middle">最少盒数 g = ⌈f/(x+1)⌉</text>
    <text x="423" y="322" text-anchor="middle">再验 g·x ≤ f 即可</text>
  </g>

  <path d="M 305 265 C 312 265 308 262 314 262" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
</svg>
