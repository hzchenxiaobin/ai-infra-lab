<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="580" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：matrix = [[1,2,3],[4,5,6]]  →  result = [[1,4],[2,5],[3,6]]</text>

  <!-- ===== Input matrix (2x3) top-left ===== -->
  <text x="140" y="60" text-anchor="middle" font-size="12" fill="#888">输入 matrix (2×3)</text>
  <!-- row 0 -->
  <rect x="90" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="94" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="138" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="94" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="186" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="94" text-anchor="middle" font-size="14" fill="#333">3</text>
  <!-- row 1 -->
  <rect x="90" y="108" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="130" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="138" y="108" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="130" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="186" y="108" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="130" text-anchor="middle" font-size="14" fill="#333">6</text>
  <!-- col/row index hints -->
  <text x="70" y="94" text-anchor="middle" font-size="10" fill="#aaa">i=0</text>
  <text x="70" y="130" text-anchor="middle" font-size="10" fill="#aaa">i=1</text>
  <text x="113" y="156" text-anchor="middle" font-size="10" fill="#aaa">j=0</text>
  <text x="161" y="156" text-anchor="middle" font-size="10" fill="#aaa">j=1</text>
  <text x="209" y="156" text-anchor="middle" font-size="10" fill="#aaa">j=2</text>

  <!-- ===== Result matrix (3x2) top-right ===== -->
  <text x="460" y="60" text-anchor="middle" font-size="12" fill="#888">输出 result (3×2)</text>
  <!-- row 0 -->
  <rect x="410" y="72" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="433" y="94" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="458" y="72" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="94" text-anchor="middle" font-size="14" fill="#333">4</text>
  <!-- row 1 -->
  <rect x="410" y="108" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="433" y="130" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="458" y="108" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="130" text-anchor="middle" font-size="14" fill="#333">5</text>
  <!-- row 2 -->
  <rect x="410" y="144" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="433" y="166" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="458" y="144" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="166" text-anchor="middle" font-size="14" fill="#333">6</text>
  <!-- index hints -->
  <text x="390" y="94" text-anchor="middle" font-size="10" fill="#aaa">j=0</text>
  <text x="390" y="130" text-anchor="middle" font-size="10" fill="#aaa">j=1</text>
  <text x="390" y="166" text-anchor="middle" font-size="10" fill="#aaa">j=2</text>
  <text x="433" y="190" text-anchor="middle" font-size="10" fill="#aaa">i=0</text>
  <text x="481" y="190" text-anchor="middle" font-size="10" fill="#aaa">i=1</text>

  <!-- divider -->
  <line x1="40" y1="210" x2="580" y2="210" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="310" y="234" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">逐元素映射过程（按 i 外层、j 内层顺序）</text>

  <!-- ===== Step table ===== -->
  <!-- header -->
  <rect x="60" y="248" width="500" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="267" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">步</text>
  <text x="200" y="267" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">源 (i,j)</text>
  <text x="290" y="267" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">值</text>
  <text x="400" y="267" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">目标 result[j][i]</text>
  <text x="520" y="267" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">写入</text>

  <!-- step rows -->
  <g font-size="12" fill="#333">
    <!-- step 1 -->
    <rect x="60" y="280" width="500" height="26" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="298" text-anchor="middle">1</text>
    <text x="200" y="298" text-anchor="middle">(0,0)</text>
    <text x="290" y="298" text-anchor="middle">1</text>
    <text x="400" y="298" text-anchor="middle">result[0][0]</text>
    <text x="520" y="298" text-anchor="middle" fill="#b85450" font-weight="bold">= 1</text>
    <!-- step 2 -->
    <rect x="60" y="308" width="500" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="326" text-anchor="middle">2</text>
    <text x="200" y="326" text-anchor="middle">(0,1)</text>
    <text x="290" y="326" text-anchor="middle">2</text>
    <text x="400" y="326" text-anchor="middle">result[1][0]</text>
    <text x="520" y="326" text-anchor="middle" fill="#b85450" font-weight="bold">= 2</text>
    <!-- step 3 -->
    <rect x="60" y="336" width="500" height="26" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="354" text-anchor="middle">3</text>
    <text x="200" y="354" text-anchor="middle">(0,2)</text>
    <text x="290" y="354" text-anchor="middle">3</text>
    <text x="400" y="354" text-anchor="middle">result[2][0]</text>
    <text x="520" y="354" text-anchor="middle" fill="#b85450" font-weight="bold">= 3</text>
    <!-- step 4 -->
    <rect x="60" y="364" width="500" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="382" text-anchor="middle">4</text>
    <text x="200" y="382" text-anchor="middle">(1,0)</text>
    <text x="290" y="382" text-anchor="middle">4</text>
    <text x="400" y="382" text-anchor="middle">result[0][1]</text>
    <text x="520" y="382" text-anchor="middle" fill="#b85450" font-weight="bold">= 4</text>
    <!-- step 5 -->
    <rect x="60" y="392" width="500" height="26" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="410" text-anchor="middle">5</text>
    <text x="200" y="410" text-anchor="middle">(1,1)</text>
    <text x="290" y="410" text-anchor="middle">5</text>
    <text x="400" y="410" text-anchor="middle">result[1][1]</text>
    <text x="520" y="410" text-anchor="middle" fill="#b85450" font-weight="bold">= 5</text>
    <!-- step 6 -->
    <rect x="60" y="420" width="500" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="438" text-anchor="middle">6</text>
    <text x="200" y="438" text-anchor="middle">(1,2)</text>
    <text x="290" y="438" text-anchor="middle">6</text>
    <text x="400" y="438" text-anchor="middle">result[2][1]</text>
    <text x="520" y="438" text-anchor="middle" fill="#b85450" font-weight="bold">= 6</text>
  </g>

  <!-- note -->
  <rect x="60" y="462" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="484" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">观察：输入第 i 行 → 变成输出第 i 列</text>
  <text x="310" y="504" text-anchor="middle" font-size="11" fill="#555">行 0 [1,2,3] → 列 0 [1,2,3]ᵀ；行 1 [4,5,6] → 列 1 [4,5,6]ᵀ</text>

  <text x="310" y="546" text-anchor="middle" font-size="12" fill="#4a7a3a">最终结果 result = [[1,4],[2,5],[3,6]] ✓</text>
</svg>
