<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">一和零 = 二维费用 0-1 背包</text>

  <!-- 字符串列表 -->
  <text x="40" y="60" font-size="12" fill="#888">每个字符串 = 一件物品，消耗两种费用</text>

  <rect x="40" y="70" width="92" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"10"</text>
  <text x="86" y="107" text-anchor="middle" font-size="10" fill="#666">0:1  1:1</text>

  <rect x="140" y="70" width="92" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="186" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"0001"</text>
  <text x="186" y="107" text-anchor="middle" font-size="10" fill="#666">0:3  1:1</text>

  <rect x="240" y="70" width="92" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="286" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"111001"</text>
  <text x="286" y="107" text-anchor="middle" font-size="10" fill="#666">0:2  1:4</text>

  <rect x="340" y="70" width="92" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="386" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"1"</text>
  <text x="386" y="107" text-anchor="middle" font-size="10" fill="#666">0:0  1:1</text>

  <rect x="440" y="70" width="92" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="486" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"0"</text>
  <text x="486" y="107" text-anchor="middle" font-size="10" fill="#666">0:1  1:0</text>

  <text x="300" y="130" text-anchor="middle" font-size="10" fill="#888">绿色 = 选入最优子集 ⭐</text>

  <!-- 转化箭头 -->
  <path d="M 300 134 L 300 160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="152" font-size="10" fill="#888">建模为背包</text>

  <!-- 二维背包框 -->
  <rect x="110" y="166" width="380" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">二维费用 0-1 背包</text>

  <rect x="130" y="200" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="205" y="222" text-anchor="middle" font-size="12" fill="#333">费用① : 0 的个数 ≤ m</text>

  <rect x="320" y="200" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="395" y="222" text-anchor="middle" font-size="12" fill="#333">费用② : 1 的个数 ≤ n</text>

  <rect x="180" y="244" width="240" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="265" text-anchor="middle" font-size="12" fill="#333">每件物品价值 = 1，求最大件数</text>

  <!-- 答案 -->
  <path d="M 300 286 L 300 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="312" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="12" fill="#333">m=5, n=3 → 选 {"10","0001","1","0"}</text>
  <text x="300" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0 用量 5 ≤ 5，1 用量 3 ≤ 3 → 答案 4</text>

  <text x="300" y="390" text-anchor="middle" font-size="11" fill="#888">关键：把「挑字符串」抽象成「在两种预算下选最多物品」</text>
  <text x="300" y="406" text-anchor="middle" font-size="11" fill="#888">状态从一维容量 dp[j] 升级为二维 dp[j][k]</text>
</svg>
