<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：s = "L1e2t1C1o1d1e1" → "LeetCode"</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="30" y="50" width="540" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <line x1="90" y1="50" x2="90" y2="80" stroke="#446688" stroke-width="1.2"/>
    <line x1="190" y1="50" x2="190" y2="80" stroke="#446688" stroke-width="1.2"/>
    <line x1="290" y1="50" x2="290" y2="80" stroke="#446688" stroke-width="1.2"/>
    <line x1="390" y1="50" x2="390" y2="80" stroke="#446688" stroke-width="1.2"/>
    <line x1="490" y1="50" x2="490" y2="80" stroke="#446688" stroke-width="1.2"/>
    <text x="60" y="70" text-anchor="middle" font-size="12" fill="#333">步</text>
    <text x="140" y="70" text-anchor="middle" font-size="12" fill="#333">操作</text>
    <text x="240" y="70" text-anchor="middle" font-size="12" fill="#333">cur</text>
    <text x="340" y="70" text-anchor="middle" font-size="12" fill="#333">rem</text>
    <text x="440" y="70" text-anchor="middle" font-size="12" fill="#333">ptr</text>
    <text x="540" y="70" text-anchor="middle" font-size="12" fill="#333">返回</text>
  </g>

  <!-- rows: y starts 80, each 32 high -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <!-- row 0: init -->
    <rect x="30" y="80" width="540" height="32" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="101" text-anchor="middle">0</text>
    <text x="140" y="101" text-anchor="middle">构造</text>
    <text x="240" y="101" text-anchor="middle">L</text>
    <text x="340" y="101" text-anchor="middle">1</text>
    <text x="440" y="101" text-anchor="middle">2</text>
    <text x="540" y="101" text-anchor="middle" fill="#888">—</text>

    <!-- row 1: next -> L -->
    <rect x="30" y="112" width="540" height="32" rx="3" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="133" text-anchor="middle">1</text>
    <text x="140" y="133" text-anchor="middle">next()</text>
    <text x="240" y="133" text-anchor="middle">e</text>
    <text x="340" y="133" text-anchor="middle">2</text>
    <text x="440" y="133" text-anchor="middle">4</text>
    <text x="540" y="133" text-anchor="middle" fill="#b85450">L</text>

    <!-- row 2: next -> e -->
    <rect x="30" y="144" width="540" height="32" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="165" text-anchor="middle">2</text>
    <text x="140" y="165" text-anchor="middle">next()</text>
    <text x="240" y="165" text-anchor="middle">e</text>
    <text x="340" y="165" text-anchor="middle">1</text>
    <text x="440" y="165" text-anchor="middle">4</text>
    <text x="540" y="165" text-anchor="middle" fill="#b85450">e</text>

    <!-- row 3: next -> e (rem->0, load t) -->
    <rect x="30" y="176" width="540" height="32" rx="3" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="197" text-anchor="middle">3</text>
    <text x="140" y="197" text-anchor="middle">next()</text>
    <text x="240" y="197" text-anchor="middle">t</text>
    <text x="340" y="197" text-anchor="middle">1</text>
    <text x="440" y="197" text-anchor="middle">6</text>
    <text x="540" y="197" text-anchor="middle" fill="#b85450">e</text>

    <!-- row 4: next -> t -->
    <rect x="30" y="208" width="540" height="32" rx="3" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="229" text-anchor="middle">4</text>
    <text x="140" y="229" text-anchor="middle">next()</text>
    <text x="240" y="229" text-anchor="middle">C</text>
    <text x="340" y="229" text-anchor="middle">1</text>
    <text x="440" y="229" text-anchor="middle">8</text>
    <text x="540" y="229" text-anchor="middle" fill="#b85450">t</text>

    <!-- row 5: next -> C -->
    <rect x="30" y="240" width="540" height="32" rx="3" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="261" text-anchor="middle">5</text>
    <text x="140" y="261" text-anchor="middle">next()</text>
    <text x="240" y="261" text-anchor="middle">o</text>
    <text x="340" y="261" text-anchor="middle">1</text>
    <text x="440" y="261" text-anchor="middle">10</text>
    <text x="540" y="261" text-anchor="middle" fill="#b85450">C</text>

    <!-- row 6: next -> o -->
    <rect x="30" y="272" width="540" height="32" rx="3" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="293" text-anchor="middle">6</text>
    <text x="140" y="293" text-anchor="middle">next()</text>
    <text x="240" y="293" text-anchor="middle">d</text>
    <text x="340" y="293" text-anchor="middle">1</text>
    <text x="440" y="293" text-anchor="middle">12</text>
    <text x="540" y="293" text-anchor="middle" fill="#b85450">o</text>

    <!-- row 7: hasNext -> true -->
    <rect x="30" y="304" width="540" height="32" rx="3" fill="#fff8e1" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="325" text-anchor="middle">7</text>
    <text x="140" y="325" text-anchor="middle">hasNext()</text>
    <text x="240" y="325" text-anchor="middle">d</text>
    <text x="340" y="325" text-anchor="middle">1</text>
    <text x="440" y="325" text-anchor="middle">12</text>
    <text x="540" y="325" text-anchor="middle" fill="#d6a040">true</text>

    <!-- row 8: next -> d -->
    <rect x="30" y="336" width="540" height="32" rx="3" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="357" text-anchor="middle">8</text>
    <text x="140" y="357" text-anchor="middle">next()</text>
    <text x="240" y="357" text-anchor="middle">e</text>
    <text x="340" y="357" text-anchor="middle">1</text>
    <text x="440" y="357" text-anchor="middle">16</text>
    <text x="540" y="357" text-anchor="middle" fill="#b85450">d</text>

    <!-- row 9: next -> e (last) -->
    <rect x="30" y="368" width="540" height="32" rx="3" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="389" text-anchor="middle">9</text>
    <text x="140" y="389" text-anchor="middle">next()</text>
    <text x="240" y="389" text-anchor="middle">—</text>
    <text x="340" y="389" text-anchor="middle">0</text>
    <text x="440" y="389" text-anchor="middle">16</text>
    <text x="540" y="389" text-anchor="middle" fill="#b85450">e</text>

    <!-- row 10: hasNext -> false -->
    <rect x="30" y="400" width="540" height="32" rx="3" fill="#fff8e1" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="421" text-anchor="middle">10</text>
    <text x="140" y="421" text-anchor="middle">hasNext()</text>
    <text x="240" y="421" text-anchor="middle">—</text>
    <text x="340" y="421" text-anchor="middle">0</text>
    <text x="440" y="421" text-anchor="middle">16</text>
    <text x="540" y="421" text-anchor="middle" fill="#d6a040">false</text>
  </g>

  <!-- column lines -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="90" y1="80" x2="90" y2="432"/>
    <line x1="190" y1="80" x2="190" y2="432"/>
    <line x1="290" y1="80" x2="290" y2="432"/>
    <line x1="390" y1="80" x2="390" y2="432"/>
    <line x1="490" y1="80" x2="490" y2="432"/>
  </g>

  <!-- annotation -->
  <text x="30" y="456" font-size="11" fill="#4a7a3a" filter="url(#rough2)">绿行 = 触发 load()：rem 归 0 后从 ptr 解析下一组 (字母+数字)</text>
</svg>
