<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：cur=1,ans=1,i=1 → 循环 i&lt;n → 比较相邻 → cur+1/1 → ans=max → i++</text>

  <!-- Start -->
  <ellipse cx="180" cy="50" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="54" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 180 66 L 180 78" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: init -->
  <rect x="100" y="80" width="160" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="100" text-anchor="middle" font-size="11.5" fill="#333">cur=1; ans=1; i=1</text>

  <path d="M 180 112 L 180 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: i < n ? -->
  <polygon points="180,126 264,164 180,202 96,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="168" text-anchor="middle" font-size="11.5" fill="#333">i &lt; n ?</text>

  <!-- No branch right -->
  <path d="M 264 164 L 306 164" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="158" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="306" y="148" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="366" y="168" text-anchor="middle" font-size="11.5" fill="#333">返回 ans</text>

  <path d="M 366 180 L 366 192" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="366" cy="210" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="366" y="214" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- Yes branch down -->
  <path d="M 180 202 L 180 218" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond2: s[i] == s[i-1] ? -->
  <polygon points="180,220 264,258 180,296 96,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="262" text-anchor="middle" font-size="11" fill="#333">s[i] == s[i-1] ?</text>

  <!-- Yes (cur++) branch left -->
  <path d="M 96 258 L 60 258 L 60 300" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="14" y="302" width="104" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="66" y="322" text-anchor="middle" font-size="11" fill="#333">cur += 1（续段）</text>

  <!-- No (cur=1) branch right -->
  <path d="M 264 258 L 300 258 L 300 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="252" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="248" y="302" width="104" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="11" fill="#333">cur = 1（新段）</text>

  <!-- merge to ans = max -->
  <path d="M 66 332 L 66 350 L 180 350" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 300 332 L 300 350 L 180 350" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="108" y="338" width="144" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="358" text-anchor="middle" font-size="11.5" fill="#333">ans = max(ans, cur)</text>

  <path d="M 180 368 L 180 380" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i += 1 -->
  <rect x="130" y="382" width="100" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="400" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>

  <!-- loop back to diamond1 -->
  <path d="M 180 382 L 180 376 L 40 376 L 40 164 L 96 164" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="44" y="156" font-size="10.5" fill="#4a7a3a">回到判断</text>

  <!-- footer note -->
  <rect x="350" y="372" width="200" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450" y="392" text-anchor="middle" font-size="10.5" fill="#555">循环执行 n−1 轮</text>
  <text x="450" y="408" text-anchor="middle" font-size="10" fill="#888">每轮 O(1) → 总 O(n)</text>
  <text x="450" y="422" text-anchor="middle" font-size="10" fill="#888">只用 cur, ans → O(1) 空间</text>
  <text x="450" y="436" text-anchor="middle" font-size="10" fill="#888">n=1 时不进循环，返回 1</text>
</svg>
