<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：四种移动都让 gcd 守恒为 2 的幂</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">起点 (1,1) 的 gcd=1=2⁰；任何移动都无法引入奇素因子</text>

  <!-- ===== Part ① subtraction moves ===== -->
  <text x="40" y="72" font-size="11" fill="#446688" font-weight="bold">① 减法移动：gcd 完全不变（辗转相减）</text>

  <!-- move 1: (x, y) -> (x, y - x) -->
  <rect x="48" y="82" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="96" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(x, y)</text>
  <path d="M 146 98 L 214 98" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="90" text-anchor="middle" font-size="9" fill="#888">y−x</text>
  <rect x="216" y="82" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="274" y="103" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(x, y−x)</text>
  <rect x="350" y="82" width="170" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="435" y="103" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">gcd(x, y−x)=gcd(x,y) ✓</text>

  <!-- move 2: (x, y) -> (x - y, y) -->
  <rect x="48" y="124" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="96" y="145" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(x, y)</text>
  <path d="M 146 140 L 214 140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="132" text-anchor="middle" font-size="9" fill="#888">x−y</text>
  <rect x="216" y="124" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="274" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(x−y, y)</text>
  <rect x="350" y="124" width="170" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="435" y="145" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">gcd(x−y, y)=gcd(x,y) ✓</text>

  <!-- ===== Part ② doubling moves ===== -->
  <text x="40" y="182" font-size="11" fill="#446688" font-weight="bold">② 翻倍移动：gcd 最多 ×2（仍为 2 的幂）</text>

  <!-- move 3: (x, y) -> (2x, y) -->
  <rect x="48" y="192" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="96" y="213" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(x, y)</text>
  <path d="M 146 208 L 214 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="9" fill="#888">×2</text>
  <rect x="216" y="192" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="266" y="213" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(2x, y)</text>
  <rect x="332" y="192" width="188" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="426" y="213" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">gcd ∈ {g, 2g}（g=gcd）✓</text>

  <!-- move 4: (x, y) -> (x, 2y) -->
  <rect x="48" y="234" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="96" y="255" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(x, y)</text>
  <path d="M 146 250 L 214 250" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="242" text-anchor="middle" font-size="9" fill="#888">×2</text>
  <rect x="216" y="234" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="266" y="255" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(x, 2y)</text>
  <rect x="332" y="234" width="188" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="426" y="255" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">gcd ∈ {g, 2g}（g=gcd）✓</text>

  <!-- ===== Conclusion ===== -->
  <rect x="40" y="290" width="480" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">必要：可达 ⟹ gcd(X,Y) 是 2 的幂</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#555">减法不碰 gcd；翻倍只可能把 2 的幂再乘一个 2</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#555">⟹ 从 gcd=1 的 (1,1) 出发，gcd 永远是 2⁰·2ⁱ = 2ᵏ</text>

  <!-- ===== Sufficiency note ===== -->
  <rect x="40" y="384" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">充分：gcd 是 2 的幂 ⟹ 可达（反向归约可降到 (1,1)，见演算）</text>
  <text x="280" y="418" text-anchor="middle" font-size="9" fill="#888">故 答案 = gcd(X,Y) 是否为 2 的幂</text>
</svg>
