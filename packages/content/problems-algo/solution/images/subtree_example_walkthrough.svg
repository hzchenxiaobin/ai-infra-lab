<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root=[3,4,5,1,2], subRoot=[4,1,2]</text>

  <!-- ===== Left: root tree with traversal order ===== -->
  <text x="95" y="52" text-anchor="middle" font-size="11" fill="#888">root（DFS 遍历顺序）</text>

  <!-- edges -->
  <line x1="95" y1="76" x2="65" y2="118" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="95" y1="76" x2="150" y2="118" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="65" y1="118" x2="40" y2="166" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="65" y1="118" x2="95" y2="166" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- highlight subtree box -->
  <rect x="22" y="100" width="98" height="78" fill="#fce4ec" fill-opacity="0.4" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>

  <!-- node 3 -->
  <circle cx="95" cy="76" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="113" y="72" font-size="9" fill="#446688">①</text>

  <!-- node 4 -->
  <circle cx="65" cy="118" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="65" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="82" y="114" font-size="9" fill="#b85450">②</text>

  <!-- node 5 -->
  <circle cx="150" cy="118" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- node 1 -->
  <circle cx="40" cy="166" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="170" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <!-- node 2 -->
  <circle cx="95" cy="166" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="170" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>

  <!-- ===== Right: steps table ===== -->
  <rect x="195" y="48" width="430" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="225" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
  <text x="300" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">node</text>
  <text x="395" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">isSame(node,sub)?</text>
  <text x="555" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">动作</text>
  <line x1="255" y1="48" x2="255" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="340" y1="48" x2="340" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="465" y1="48" x2="465" y2="74" stroke="#fafafa" stroke-width="1"/>

  <!-- row 1: node 3 -->
  <rect x="195" y="74" width="430" height="30" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="225" y="93" text-anchor="middle" font-size="10" fill="#333">①</text>
  <text x="300" y="93" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="395" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">false（3≠4）</text>
  <text x="555" y="93" text-anchor="middle" font-size="10" fill="#555">递归 left / right</text>

  <!-- row 2: node 4 -->
  <rect x="195" y="104" width="430" height="30" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="123" text-anchor="middle" font-size="10" fill="#333">②</text>
  <text x="300" y="123" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="395" y="123" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">true ✓</text>
  <text x="555" y="123" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- row 3: node 5 (not reached) -->
  <rect x="195" y="134" width="430" height="30" fill="#f5f5f5" filter="url(#rough2)"/>
  <text x="225" y="153" text-anchor="middle" font-size="10" fill="#aaa">③</text>
  <text x="300" y="153" text-anchor="middle" font-size="10" fill="#aaa">5</text>
  <text x="395" y="153" text-anchor="middle" font-size="10" fill="#aaa">—（短路未访问）</text>
  <text x="555" y="153" text-anchor="middle" font-size="10" fill="#aaa">—</text>

  <!-- table border -->
  <rect x="195" y="48" width="430" height="116" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="255" y1="74" x2="255" y2="164" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="340" y1="74" x2="340" y2="164" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="465" y1="74" x2="465" y2="164" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- ===== Bottom: isSame(4, subRoot) detail ===== -->
  <text x="320" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">isSame(节点②4, subRoot) 逐位比对：</text>

  <!-- left subtree (node 4 in root) -->
  <text x="150" y="212" text-anchor="middle" font-size="10" fill="#888">root 中的子树</text>
  <line x1="150" y1="226" x2="110" y2="256" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="150" y1="226" x2="190" y2="256" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="150" cy="226" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <circle cx="110" cy="256" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="260" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="190" cy="256" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="260" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>

  <!-- subRoot -->
  <text x="490" y="212" text-anchor="middle" font-size="10" fill="#888">subRoot</text>
  <line x1="490" y1="226" x2="450" y2="256" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="490" y1="226" x2="530" y2="256" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="490" cy="226" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <circle cx="450" cy="256" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450" y="260" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="530" cy="256" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="260" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>

  <!-- match checks -->
  <text x="240" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a">4 == 4 ✓</text>
  <text x="240" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a">1 == 1 ✓</text>
  <text x="240" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a">2 == 2 ✓</text>
  <line x1="295" y1="242" x2="395" y2="242" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="345" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">结构与值一致</text>

  <!-- conclusion -->
  <rect x="60" y="300" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="319" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">isSame 返回 true → isSubtree(4) 返回 true → 全局 true ✓</text>
  <text x="320" y="334" text-anchor="middle" font-size="10" fill="#555">|| 短路：left 命中即返回，不再访问 right(节点 5)</text>

  <!-- false case note -->
  <rect x="60" y="350" width="520" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="369" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">反例：若 root 中节点 2 下多一个 0，则 isSame(4,sub) 因结构不同返回 false</text>
  <text x="320" y="385" text-anchor="middle" font-size="10" fill="#b85450">→ 子树要求「全部后代」一致，多/少一个节点都不算（区别于 LC 100 子结构）</text>
</svg>
