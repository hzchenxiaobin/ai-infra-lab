<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：合法对「扩窗」封闭 → 固定 left 一揽子数右边</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">至少有一个字符 ≥ k 次：窗口扩张频次只增不减，合法的超集仍合法</text>

  <!-- ① 扩窗封闭 -->
  <text x="30" y="68" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 扩窗封闭：合法的超集仍合法</text>

  <rect x="60" y="82" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="92" y="82" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <rect x="124" y="82" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="156" y="82" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <rect x="188" y="82" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>

  <text x="76" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="108" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="140" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="172" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="204" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <rect x="56" y="78" width="104" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="152" y="78" width="72" height="38" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4" rx="6" filter="url(#rough2)"/>

  <text x="108" y="144" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[0,2]「aba」：a×2 ≥ k ✓ 达标</text>
  <text x="188" y="158" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">终点 ≥ 2 的子串全部合法（超集封闭）</text>

  <rect x="252" y="78" width="244" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="374" y="98" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">固定 left = 0：need(0) = 2（最小合法终点）</text>
  <text x="374" y="116" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">贡献 = n − need = 5 − 2 = 3 个</text>

  <!-- ② need 单调不降 -->
  <text x="30" y="194" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">② need 单调不降 → 右指针只进不退</text>

  <rect x="30" y="208" width="122" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="91" y="229" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">left=0 → need=2</text>
  <path d="M 152 225 L 168 225" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="172" y="208" width="122" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="233" y="229" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">left=1 → need=4</text>
  <path d="M 294 225 L 310 225" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="314" y="208" width="122" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="375" y="229" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">left=2 → ∞（break）</text>

  <text x="260" y="262" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">若 [left+1, j] 合法 ⇒ [left, j]（超集）也合法 ⇒ need(left) ≤ need(left+1)</text>
  <text x="260" y="278" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每个字符至多入窗、出窗各一次 → 整体 O(n)，空间 O(26)</text>

  <!-- ③ 方向对调 -->
  <text x="30" y="306" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">③ 方向对调：至少型数右边，至多型数左边</text>

  <rect x="30" y="318" width="228" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="144" y="336" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">至少型（本题）</text>
  <text x="144" y="353" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">外层枚举 left：ans += n − right + 1</text>

  <rect x="268" y="318" width="228" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="382" y="336" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">至多型（713 / 3258）</text>
  <text x="382" y="353" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">外层枚举 right：ans += right − left + 1</text>

  <!-- 底部备注 -->
  <rect x="20" y="374" width="480" height="46" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="392" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">💡 over = 窗口内频次 ≥ k 的字符种数</text>
  <text x="34" y="408" font-size="10" fill="#555" filter="url(#rough2)">入窗频次恰从 k−1→k 则 over++；出窗恰从 k→k−1 则 over−−（先判后减）；over &gt; 0 ⟺ 合法</text>
</svg>
