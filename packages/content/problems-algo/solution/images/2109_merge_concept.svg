<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：两个有序序列的归并</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">字符下标 0,1,2,… 与 spaces[] 严格递增 ⇒ 单次遍历完成插入</text>

  <!-- ===== Stream A: characters (blue) ===== -->
  <text x="40" y="80" font-size="11.5" fill="#446688" font-weight="bold">字符流 s</text>
  <text x="40" y="94" font-size="10" fill="#888">指针 i →</text>

  <rect x="150" y="68" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="89" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s[0]</text>

  <text x="212" y="88" text-anchor="middle" font-size="14" fill="#888">…</text>

  <rect x="234" y="68" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="89" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s[i]</text>
  <path d="M258,52 L258,64" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="258" y="48" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i</text>

  <text x="296" y="88" text-anchor="middle" font-size="14" fill="#888">…</text>

  <rect x="318" y="68" width="58" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="89" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s[n−1]</text>

  <path d="M155,112 L372,112" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <!-- ===== Stream B: spaces (orange) ===== -->
  <text x="40" y="150" font-size="11.5" fill="#d6a040" font-weight="bold">空格位 spaces</text>
  <text x="40" y="164" font-size="10" fill="#888">指针 j →</text>

  <rect x="150" y="138" width="58" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="159" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sp[0]</text>

  <text x="222" y="158" text-anchor="middle" font-size="14" fill="#888">…</text>

  <rect x="244" y="138" width="58" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="159" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sp[j]</text>
  <path d="M273,122 L273,134" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="273" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j</text>

  <text x="316" y="158" text-anchor="middle" font-size="14" fill="#888">…</text>

  <rect x="338" y="138" width="66" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="159" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sp[m−1]</text>

  <!-- ===== Merge logic box (green) ===== -->
  <rect x="40" y="190" width="440" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">归并规则（每步先判空格，再写字符）</text>
  <text x="60" y="231" font-size="11" fill="#333">① 若 j &lt; m 且 i == spaces[j]：先写一个空格 ' '，再 j++</text>
  <text x="60" y="249" font-size="11" fill="#333">② 然后写 s[i]，再 i++（i 从 0 走到 n−1，必走完）</text>
  <text x="60" y="265" font-size="10.5" fill="#666">spaces 严格递增 ⇒ 每个 sp[j] 至多匹配一次 ⇒ 总代价 O(n + m)</text>

  <!-- ===== Output preview (example 2) ===== -->
  <text x="40" y="294" font-size="11" fill="#444" font-weight="bold">输出（s = "icodeinpython", spaces = [1,5,7,9]）</text>
  <!-- cells: i _ c o d e _ i n _ p y …  (12 cells then …) -->
  <!-- char cells blue, space cells orange -->
  <rect x="40" y="302" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>

  <rect x="68" y="302" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">␣</text>

  <rect x="96" y="302" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c</text>

  <rect x="124" y="302" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">o</text>

  <rect x="152" y="302" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">d</text>

  <rect x="180" y="302" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>

  <rect x="208" y="302" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">␣</text>

  <rect x="236" y="302" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="249" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>

  <rect x="264" y="302" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n</text>

  <rect x="292" y="302" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">␣</text>

  <rect x="320" y="302" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">p</text>

  <rect x="348" y="302" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">y</text>

  <text x="392" y="320" text-anchor="middle" font-size="14" fill="#888">…</text>

  <!-- legend -->
  <rect x="420" y="306" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="438" y="317" font-size="9.5" fill="#666">字符</text>
  <rect x="420" y="326" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="438" y="337" font-size="9.5" fill="#666">空格</text>

  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#aaa">蓝格=原字符 · 橙格=插入的空格 · ␣ 表示空格</text>
</svg>
