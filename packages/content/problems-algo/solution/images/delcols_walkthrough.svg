<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：strs = ["cba","daf","ghi"]（n=3, m=3）</text>

  <!-- ===== Column 0 ===== -->
  <text x="40" y="60" font-size="12" fill="#888" font-weight="bold">列 j=0</text>
  <text x="110" y="60" font-size="11" fill="#555">字符 c, d, g → c≤d ✓, d≤g ✓ → 非降，保留</text>

  <rect x="196" y="66" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="86" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="196" y="96" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="116" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <rect x="196" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="146" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">g</text>

  <text x="252" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">c ≤ d ✓</text>
  <text x="252" y="132" font-size="11" fill="#4a7a3a" font-weight="bold">d ≤ g ✓</text>

  <text x="218" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">非降 → 保留</text>
  <rect x="372" y="92" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="412" y="111" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">ans = 0</text>

  <!-- separator -->
  <path d="M 40 188 L 520 188" stroke="#e0e0e0" stroke-width="1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Column 1 ===== -->
  <text x="40" y="210" font-size="12" fill="#888" font-weight="bold">列 j=1</text>
  <text x="110" y="210" font-size="11" fill="#555">字符 b, a, h → b≤a? ✗（b&gt;a）→ 违反，删除（break）</text>

  <rect x="196" y="216" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="236" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="196" y="246" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="266" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="196" y="276" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="296" text-anchor="middle" font-size="15" fill="#bbb">h</text>

  <!-- violation arrow -->
  <path d="M 218 246 L 218 250" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="252" y="252" font-size="11" fill="#b85450" font-weight="bold">b &gt; a ✗</text>
  <text x="252" y="286" font-size="10" fill="#999" font-style="italic">（break，不查 a≤h）</text>

  <text x="218" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">违反 → 删除</text>
  <rect x="372" y="242" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="412" y="261" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 1</text>

  <!-- separator -->
  <path d="M 40 338 L 520 338" stroke="#e0e0e0" stroke-width="1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Column 2 ===== -->
  <text x="40" y="360" font-size="12" fill="#888" font-weight="bold">列 j=2</text>
  <text x="110" y="360" font-size="11" fill="#555">字符 a, f, i → a≤f ✓, f≤i ✓ → 非降，保留</text>

  <rect x="196" y="366" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="384" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="196" y="392" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="410" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>
  <rect x="196" y="418" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="436" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">i</text>

  <text x="252" y="392" font-size="11" fill="#4a7a3a" font-weight="bold">a ≤ f ✓</text>
  <text x="252" y="424" font-size="11" fill="#4a7a3a" font-weight="bold">f ≤ i ✓</text>

  <text x="218" y="458" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">非降 → 保留</text>
  <rect x="372" y="392" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="412" y="411" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">ans = 1</text>
</svg>
