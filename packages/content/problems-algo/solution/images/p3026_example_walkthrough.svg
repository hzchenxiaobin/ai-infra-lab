<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="352" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [−1, 3, 2, 4, 5]，k = 3（s = 处理 x 之前的前缀和）</text>

  <!-- table body bg -->
  <rect x="26" y="76" width="608" height="190" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="26" y="152" width="608" height="38" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="26" y="228" width="608" height="38" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="26" y="48" width="608" height="28" fill="#e8f0fe" filter="url(#rough2)"/>

  <!-- grid lines -->
  <g stroke="#999" stroke-width="1" filter="url(#rough2)">
    <line x1="26" y1="48" x2="26" y2="266"/>
    <line x1="60" y1="48" x2="60" y2="266"/>
    <line x1="96" y1="48" x2="96" y2="266"/>
    <line x1="152" y1="48" x2="152" y2="266"/>
    <line x1="388" y1="48" x2="388" y2="266"/>
    <line x1="546" y1="48" x2="546" y2="266"/>
    <line x1="634" y1="48" x2="634" y2="266"/>
    <line x1="26" y1="48" x2="634" y2="48"/>
    <line x1="26" y1="76" x2="634" y2="76"/>
    <line x1="26" y1="114" x2="634" y2="114"/>
    <line x1="26" y1="152" x2="634" y2="152"/>
    <line x1="26" y1="190" x2="634" y2="190"/>
    <line x1="26" y1="228" x2="634" y2="228"/>
    <line x1="26" y1="266" x2="634" y2="266"/>
  </g>

  <!-- header -->
  <text x="43" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="78" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="124" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="270" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">查 x−k / x+k → 候选和</text>
  <text x="467" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">插入 map[x] = s</text>
  <text x="590" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 0 -->
  <text x="43" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="78" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="124" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="270" y="99" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">查 −4 ✗　查 2 ✗</text>
  <text x="467" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">map{−1: 0}</text>
  <text x="590" y="99" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−∞</text>

  <!-- row 1 -->
  <text x="43" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="78" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="124" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="270" y="137" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">查 0 ✗　查 6 ✗</text>
  <text x="467" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">map{3: −1}</text>
  <text x="590" y="137" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−∞</text>

  <!-- row 2 (green) -->
  <text x="43" y="175" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="78" y="175" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="124" y="175" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">2</text>
  <text x="270" y="175" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">查 −1 ✓（前缀 0）→ 2+2−0 = 4</text>
  <text x="467" y="175" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">map{2: 2}</text>
  <text x="590" y="175" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- row 3 -->
  <text x="43" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="78" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="124" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="270" y="213" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">查 1 ✗　查 7 ✗</text>
  <text x="467" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">map{4: 4}</text>
  <text x="590" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- row 4 (orange) -->
  <text x="43" y="251" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="78" y="251" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="124" y="251" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">8</text>
  <text x="270" y="251" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">查 2 ✓（前缀 2）→ 8+5−2 = 11 ★</text>
  <text x="467" y="251" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">map{5: 8}</text>
  <text x="590" y="251" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">11</text>

  <!-- summary -->
  <text x="340" y="290" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">遍历结束 ans = 11 ≠ −∞ → 返回 11，对应好子数组 [2, 4, 5]（|2 − 5| = 3 = k）✓</text>

  <!-- note -->
  <rect x="26" y="304" width="608" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="340" y="320" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">候选和 = s + x − map[目标]，恰好就是 prefix[j+1] − prefix[i]：</text>
  <text x="340" y="336" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">s 是 nums[j] 之前的前缀和，map[t] 是值为 t 的左端点之前的最小前缀和</text>
</svg>
