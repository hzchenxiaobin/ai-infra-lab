<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：citations = [3,0,6,1,5] → 降序 [6,5,3,1,0]</text>

  <!-- table grid -->
  <!-- columns: i(60) | citations[i](110) | i+1(90) | 满足 ≥ ?(120) | h(90)  total=470, start x=45 -->
  <!-- col x: 45,105,215,305,425,515 -->

  <!-- header row -->
  <rect x="45" y="60" width="470" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="105" y1="60" x2="105" y2="94" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="215" y1="60" x2="215" y2="94" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="305" y1="60" x2="305" y2="94" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="425" y1="60" x2="425" y2="94" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="75" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>
  <text x="160" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">citations[i]</text>
  <text x="260" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i+1</text>
  <text x="365" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">citations[i] ≥ i+1?</text>
  <text x="470" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">h = i+1</text>

  <!-- row 0: i=0, 6, 1, yes, 1 -->
  <rect x="45" y="94" width="470" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="105" y1="94" x2="105" y2="128" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="94" x2="215" y2="128" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="94" x2="305" y2="128" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="94" x2="425" y2="128" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="116" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="160" y="116" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="365" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6 ≥ 1 ✓</text>
  <text x="470" y="116" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- row 1: i=1, 5, 2, yes, 2 -->
  <rect x="45" y="128" width="470" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="105" y1="128" x2="105" y2="162" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="128" x2="215" y2="162" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="128" x2="305" y2="162" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="128" x2="425" y2="162" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="150" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="160" y="150" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="365" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5 ≥ 2 ✓</text>
  <text x="470" y="150" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- row 2: i=2, 3, 3, yes, 3  (highlight = answer) -->
  <rect x="45" y="162" width="470" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="105" y1="162" x2="105" y2="198" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="162" x2="215" y2="198" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="162" x2="305" y2="198" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="162" x2="425" y2="198" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="160" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="260" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="365" y="185" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3 ≥ 3 ✓</text>
  <text x="470" y="185" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">3</text>

  <!-- row 3: i=3, 1, 4, no, break -->
  <rect x="45" y="198" width="470" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="105" y1="198" x2="105" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="198" x2="215" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="198" x2="305" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="198" x2="425" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="220" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="160" y="220" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="260" y="220" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="365" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1 ≥ 4 ✗</text>
  <text x="470" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">停止</text>

  <!-- conclusion box -->
  <rect x="120" y="258" width="320" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">首个不满足时停止，h = i = 3</text>
  <text x="280" y="296" text-anchor="middle" font-size="10.5" fill="#666">3 篇被引 ≥ 3，第 4 篇仅 1 &lt; 4</text>

  <!-- note -->
  <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#888">降序遍历保证：已遍历的 i 篇都满足被引 ≥ i+1，故 h 的最大可能即首个 break 处的 i</text>
</svg>
