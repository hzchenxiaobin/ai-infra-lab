<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：二叉树看成无向图，答案 = start 到最远节点的边数</text>

  <text x="150" y="56" text-anchor="middle" font-size="11" fill="#888">原二叉树（父-子边双向可达）</text>

  <circle cx="150" cy="86" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <path d="M 138 99 L 100 140" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 162 99 L 202 140" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="92" cy="152" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="157" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <circle cx="212" cy="152" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="212" y="157" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="212" y="135" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">start</text>

  <path d="M 92 168 L 92 206" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 200 165 L 168 206" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 224 165 L 256 206" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="92" cy="218" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="223" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <circle cx="160" cy="218" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="223" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <circle cx="264" cy="218" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="223" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <path d="M 80 232 L 60 268" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 104 232 L 122 268" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="56" cy="280" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="56" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <circle cx="128" cy="280" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="128" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <path d="M 300 170 L 344 170" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="322" y="160" text-anchor="middle" font-size="10" fill="#888">连父边成图</text>

  <text x="460" y="56" text-anchor="middle" font-size="11" fill="#888">start=3 到各节点边数</text>

  <g font-size="11" fill="#333">
    <rect x="378" y="72" width="164" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="390" y="87">3 → 3 ：0</text>
    <rect x="378" y="100" width="164" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="390" y="115">3 → 1 / 10 / 6 ：1</text>
    <rect x="378" y="128" width="164" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="390" y="143">3 → 5 ：2</text>
    <rect x="378" y="156" width="164" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="390" y="171">3 → 4 ：3</text>
    <rect x="378" y="184" width="164" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="390" y="201" fill="#b85450" font-weight="bold">3 → 9 / 2 ：4 ← 最远</text>
  </g>

  <rect x="378" y="226" width="164" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = max 距离</text>
  <text x="460" y="266" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">= 4</text>

  <text x="40" y="328" font-size="10" fill="#888">感染每分钟沿一条边扩散 → 分钟数 = 最远节点的边数（start 的离心率）</text>
  <text x="40" y="346" font-size="10" fill="#888">父-子边可双向通行，故须把父节点也连入无向图</text>
</svg>
