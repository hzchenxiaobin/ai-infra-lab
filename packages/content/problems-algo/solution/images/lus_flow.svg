<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一行判定，O(1) 时间</text>

  <!-- Start -->
  <rect x="180" y="46" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="20" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">输入字符串 a, b</text>

  <!-- arrow down -->
  <path d="M 260 90 L 260 116" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: a == b ? -->
  <polygon points="260,120 380,180 260,240 140,180" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">a == b ?</text>
  <text x="260" y="190" text-anchor="middle" font-size="10" fill="#888">逐字符完全相同</text>

  <!-- Yes branch (left) -->
  <path d="M 140 180 L 80 180 L 80 270" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="100" y="172" font-size="12" fill="#b85450" font-weight="bold">是</text>

  <!-- No branch (right) -->
  <path d="M 380 180 L 440 180 L 440 270" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="410" y="172" font-size="12" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Yes result: -1 -->
  <rect x="20" y="274" width="120" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="80" y="298" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 -1</text>
  <text x="80" y="316" text-anchor="middle" font-size="10" fill="#888">所有子序列都被共享</text>

  <!-- No result: max(len) -->
  <rect x="380" y="274" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="440" y="298" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 max</text>
  <text x="440" y="316" text-anchor="middle" font-size="10" fill="#888">(len(a), len(b))</text>

  <!-- middle reasoning -->
  <rect x="160" y="274" width="200" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#666">为何不等即取较长串？</text>
  <text x="260" y="310" text-anchor="middle" font-size="10" fill="#888">较长串不可能是较短串的子序列</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#888">等长不等 → 整串互不为子序列</text>
</svg>
