<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：离散化 + 倒序双 BIT，O(n log n)</text>

  <g filter="url(#rough2)">
    <rect x="60" y="38" width="250" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="185" y="56" text-anchor="middle" font-size="10.5" fill="#33506b">① 离散化：sv = sort + unique(nums)</text>
    <text x="185" y="72" text-anchor="middle" font-size="10.5" fill="#33506b">rank(v) = v 在 sv 中的下标 + 1（1 起）</text>

    <path d="M185 82 L185 94" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="60" y="98" width="250" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="185" y="116" text-anchor="middle" font-size="10.5" fill="#33506b">② 建两棵 BIT（各 m+1 槽）</text>
    <text x="185" y="132" text-anchor="middle" font-size="10.5" fill="#33506b">bit[0] 偶桶 · bit[1] 奇桶；i = n−1</text>

    <path d="M185 142 L185 152" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <polygon points="185,156 257,186 185,216 113,186" fill="#fafafa" stroke="#b85450" stroke-width="1.8"/>
    <text x="185" y="190" text-anchor="middle" font-size="10.5" fill="#8a3030">i ≥ 0 ？</text>

    <text x="193" y="232" font-size="10" fill="#8a3030" font-weight="bold">是</text>
    <path d="M185 216 L185 238" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="85" y="240" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="185" y="259" text-anchor="middle" font-size="10.5" fill="#33506b">③ p ← nums[i] &amp; 1（当前元素奇偶）</text>

    <path d="M185 270 L185 280" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="60" y="284" width="240" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="180" y="302" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">④ 先查（只碰对面桶 p⊕1）</text>
    <text x="180" y="318" text-anchor="middle" font-size="9.5" fill="#8a6d1a">ans[i] ← bit[p⊕1].pre(rank(nums[i]) − 1)</text>
    <text x="180" y="334" text-anchor="middle" font-size="9" fill="#8a6d1a">＝右侧异奇偶且 &lt; nums[i] 的个数</text>

    <path d="M185 342 L185 352" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="60" y="356" width="240" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="180" y="374" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">⑤ 后插（只碰本桶 p）</text>
    <text x="180" y="390" text-anchor="middle" font-size="9.5" fill="#2f5d24">bit[p].add(rank(nums[i]), +1)</text>

    <path d="M185 400 L185 410" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="85" y="414" width="200" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="185" y="432" text-anchor="middle" font-size="10.5" fill="#33506b">⑥ i ← i − 1</text>

    <path d="M 85 428 L 25 428 L 25 186 L 107 186" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)"/>
    <text x="58" y="420" text-anchor="middle" font-size="9" fill="#446688">下一轮</text>

    <text x="263" y="178" font-size="10" fill="#8a3030" font-weight="bold">否</text>
    <path d="M257 186 L303 186" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="307" y="168" width="140" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="377" y="190" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">⑦ 返回 ans</text>

    <rect x="310" y="228" width="230" height="128" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="425" y="246" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">不变式（灵魂）</text>
    <text x="425" y="266" text-anchor="middle" font-size="9.5" fill="#33506b">倒序 + 先查后插 ⇒</text>
    <text x="425" y="282" text-anchor="middle" font-size="9.5" fill="#33506b">两桶恒装「下标 &gt; i 的全体」；</text>
    <text x="425" y="298" text-anchor="middle" font-size="9.5" fill="#33506b">查询只碰对面桶 p⊕1，</text>
    <text x="425" y="314" text-anchor="middle" font-size="9.5" fill="#33506b">插入只碰本桶 p —— 两条腿不相交</text>
    <text x="425" y="330" text-anchor="middle" font-size="9.5" fill="#33506b">（本题先后甚至可互换，</text>
    <text x="425" y="346" text-anchor="middle" font-size="9.5" fill="#33506b">　但「先查后插」的口径最稳）</text>

    <rect x="310" y="370" width="230" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="425" y="388" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold">复杂度</text>
    <text x="425" y="406" text-anchor="middle" font-size="9.5" fill="#8a3030">离散化 O(n log n)；</text>
    <text x="425" y="422" text-anchor="middle" font-size="9.5" fill="#8a3030">每元素一查一插各 O(log m)</text>
    <text x="425" y="438" text-anchor="middle" font-size="9.5" fill="#8a3030">总计 O(n log n)，空间 O(n)</text>
  </g>
</svg>
