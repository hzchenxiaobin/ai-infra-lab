<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：双指针对撞判定回文（以 "racecar" 为例）</text>

  <!-- ====== Step 1: l=0, r=6, compare r vs r ====== -->
  <text x="36" y="68" font-size="11" fill="#4a7a3a" font-weight="bold">步 1：l=0, r=6 → 'r' vs 'r' ✅</text>
  <rect x="90" y="80" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">r</text>
  <rect x="130" y="80" width="40" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="106" text-anchor="middle" font-size="16" fill="#999">a</text>
  <rect x="170" y="80" width="40" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="106" text-anchor="middle" font-size="16" fill="#999">c</text>
  <rect x="210" y="80" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="106" text-anchor="middle" font-size="16" fill="#d6a040">e</text>
  <rect x="250" y="80" width="40" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="106" text-anchor="middle" font-size="16" fill="#999">c</text>
  <rect x="290" y="80" width="40" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="310" y="106" text-anchor="middle" font-size="16" fill="#999">a</text>
  <rect x="330" y="80" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">r</text>
  <!-- pointers -->
  <text x="110" y="74" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ l</text>
  <text x="350" y="74" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">r ↓</text>

  <!-- arrow l->r and r->l -->
  <path d="M 112 138 L 348 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="230" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a">匹配 → 双指针向中间收拢</text>

  <!-- divider -->
  <path d="M 30 160 L 530 160" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Step 2: l=1, r=5, a vs a ====== -->
  <text x="36" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">步 2：l=1, r=5 → 'a' vs 'a' ✅</text>
  <rect x="90" y="196" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="222" text-anchor="middle" font-size="16" fill="#999">r</text>
  <rect x="130" y="196" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="222" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="170" y="196" width="40" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="222" text-anchor="middle" font-size="16" fill="#999">c</text>
  <rect x="210" y="196" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="222" text-anchor="middle" font-size="16" fill="#d6a040">e</text>
  <rect x="250" y="196" width="40" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="16" fill="#999">c</text>
  <rect x="290" y="196" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="222" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="330" y="196" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="222" text-anchor="middle" font-size="16" fill="#999">r</text>
  <text x="150" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ l</text>
  <text x="310" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">r ↓</text>

  <!-- divider -->
  <path d="M 30 250 L 530 250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Step 3: l=2, r=4, c vs c ====== -->
  <text x="36" y="274" font-size="11" fill="#4a7a3a" font-weight="bold">步 3：l=2, r=4 → 'c' vs 'c' ✅</text>
  <rect x="90" y="286" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="312" text-anchor="middle" font-size="16" fill="#999">r</text>
  <rect x="130" y="286" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="312" text-anchor="middle" font-size="16" fill="#999">a</text>
  <rect x="170" y="286" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="312" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
  <rect x="210" y="286" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="312" text-anchor="middle" font-size="16" fill="#d6a040">e</text>
  <rect x="250" y="286" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
  <rect x="290" y="286" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="312" text-anchor="middle" font-size="16" fill="#999">a</text>
  <rect x="330" y="286" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="312" text-anchor="middle" font-size="16" fill="#999">r</text>
  <text x="190" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ l</text>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">r ↓</text>

  <!-- ====== Stop: l=3, r=3 ====== -->
  <path d="M 30 340 L 530 340" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="60" y="354" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">停止：l=3 ≥ r=3，中间字符 'e' 无需比较 → 是回文 ✓</text>
</svg>
