<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 528" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="528" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：分层图上的堆优化 Dijkstra（状态 = 格子 × 下一行动奇偶）</text>

  <!-- init box -->
  <rect x="60" y="40" width="252" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="58" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">初始化：dist[(0,0,奇)] = 1</text>
  <text x="186" y="74" text-anchor="middle" font-size="8.5" fill="#556" filter="url(#rough2)">预付起点 (0,0) 的入口代价，压入堆</text>

  <!-- parity meaning note -->
  <rect x="330" y="40" width="206" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="433" y="58" text-anchor="middle" font-size="9" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">p 的含义：下一行动编号的奇偶</text>
  <text x="433" y="74" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">p = 1（奇数行动）：→↓ 合规</text>
  <text x="433" y="90" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">p = 0（偶数行动）：←↑ 合规</text>

  <path d="M 186 86 L 186 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- heap empty diamond -->
  <polygon points="186,102 106,130 186,158 266,130" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="186" y="134" text-anchor="middle" font-size="11" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">堆空？</text>

  <path d="M 266 130 L 302 130" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="306" y="108" width="222" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="417" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return −1（不可达）</text>
  <text x="417" y="142" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">本题网格必连通，仅作兜底</text>

  <path d="M 186 158 L 186 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="194" y="172" text-anchor="start" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- pop box -->
  <rect x="60" y="180" width="252" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="198" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">弹出堆顶 (d, u)，u ↔ (i, j, p)</text>
  <text x="186" y="214" text-anchor="middle" font-size="8.5" fill="#556" filter="url(#rough2)">若 d &gt; dist[u]：过期堆项，丢弃重弹</text>

  <path d="M 186 230 L 186 248" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- target diamond -->
  <polygon points="186,250 100,280 186,310 272,280" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="186" y="284" text-anchor="middle" font-size="10" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">(i,j) == (m−1,n−1) ?</text>

  <path d="M 272 280 L 306 280" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="274" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="310" y="250" width="218" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="419" y="268" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return d</text>
  <text x="419" y="284" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">Dijkstra 首次弹出即最短</text>
  <text x="419" y="300" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">两种奇偶层先到先得，无需比较</text>

  <path d="M 186 310 L 186 326" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="194" y="322" text-anchor="start" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- relax box -->
  <rect x="50" y="330" width="330" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="348" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">松弛 5 条边（全部指向 p⊕1 层）</text>
  <text x="66" y="366" text-anchor="start" font-size="9" fill="#7a5c1a" filter="url(#rough2)">移动×4：w = 入口(ni,nj) + (违规 ? penalty[i][j] : 0)</text>
  <text x="66" y="382" text-anchor="start" font-size="9" fill="#7a5c1a" filter="url(#rough2)">等待：w = penalty[i][j]（原地换层）</text>
  <text x="66" y="398" text-anchor="start" font-size="9" fill="#7a5c1a" filter="url(#rough2)">若 d + w &lt; dist[v]：更新 dist[v] 并入堆</text>

  <!-- loop back -->
  <path d="M 50 372 L 24 372 L 24 130 L 102 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="12" y="250" font-size="9" fill="#446688" transform="rotate(-90 12 250)" filter="url(#rough2)">循环</text>

  <!-- summary box -->
  <rect x="50" y="436" width="460" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="454" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">复杂度与实现要点</text>
  <text x="280" y="470" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">状态 2mn ≤ 2×10⁵、边 ≈ 10⁶ ⇒ 时间 O(mn·log(mn))、空间 O(mn)</text>
  <text x="280" y="485" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">dist 与堆元素用 64 位：入口可达 10¹⁰，答案上界约 10¹⁵</text>
  <text x="280" y="500" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">违规判定只看方向与 p：右/下合规 ⟺ p=1，左/上合规 ⟺ p=0</text>
</svg>
