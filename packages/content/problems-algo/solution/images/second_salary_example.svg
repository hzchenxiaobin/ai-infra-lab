<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="370" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三种示例演算</text>

  <!-- Case A: normal -->
  <rect x="20" y="42" width="175" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="107" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例 1：正常情况</text>

  <rect x="35" y="74" width="80" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="88" text-anchor="middle" font-size="9" fill="#333">salary</text>
  <rect x="35" y="94" width="80" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="107" text-anchor="middle" font-size="9" fill="#333">100</text>
  <rect x="35" y="112" width="80" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="125" text-anchor="middle" font-size="9" fill="#333">200</text>
  <rect x="35" y="130" width="80" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="143" text-anchor="middle" font-size="9" fill="#333">300</text>

  <path d="M120 112 L150 112" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="155" y="94" width="35" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="107" text-anchor="middle" font-size="9" fill="#333">300</text>
  <rect x="155" y="112" width="35" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="172" y="125" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">200</text>
  <rect x="155" y="130" width="35" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="143" text-anchor="middle" font-size="9" fill="#333">100</text>

  <rect x="30" y="158" width="155" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="107" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第二高 = 200 ✓</text>

  <!-- Case B: duplicates at top -->
  <rect x="205" y="42" width="175" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="292" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例 2：最高值重复</text>

  <rect x="220" y="74" width="80" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="9" fill="#333">salary</text>
  <rect x="220" y="94" width="80" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="9" fill="#333">200</text>
  <rect x="220" y="112" width="80" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="9" fill="#333">200</text>
  <rect x="220" y="130" width="80" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="9" fill="#333">100</text>

  <path d="M305 112 L335 112" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="8" fill="#888">去重</text>

  <rect x="340" y="94" width="35" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="357" y="107" text-anchor="middle" font-size="9" fill="#333">200</text>
  <rect x="340" y="112" width="35" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="357" y="125" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">100</text>

  <rect x="215" y="158" width="155" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="292" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第二高 = 100 ✓</text>

  <text x="292" y="198" text-anchor="middle" font-size="8.5" fill="#b85450">不 DISTINCT 会取到 200 ✗</text>

  <!-- Case C: single value -->
  <rect x="390" y="42" width="175" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="477" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例 3：仅一个值</text>

  <rect x="405" y="74" width="80" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="88" text-anchor="middle" font-size="9" fill="#333">salary</text>
  <rect x="405" y="94" width="80" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="107" text-anchor="middle" font-size="9" fill="#333">100</text>

  <path d="M490 100 L520 100" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="505" y="84" text-anchor="middle" font-size="8" fill="#888">去重</text>

  <rect x="525" y="94" width="35" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="542" y="107" text-anchor="middle" font-size="9" fill="#333">100</text>
  <text x="542" y="128" text-anchor="middle" font-size="8.5" fill="#888">仅 1 个</text>

  <rect x="400" y="158" width="155" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="477" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第二高 = NULL ✓</text>

  <text x="477" y="198" text-anchor="middle" font-size="8.5" fill="#b85450">空结果集须包装成 NULL 行</text>

  <!-- Bottom summary -->
  <rect x="40" y="220" width="500" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">💡 两个解法对三种情况的表现</text>
  <text x="60" y="260" font-size="10" fill="#333">• 解法 A（MAX 子查询）：① 取全表 MAX=M1；② WHERE salary &lt; M1；③ 再取 MAX</text>
  <text x="60" y="276" font-size="10" fill="#4a7a3a">  示例1 → M1=300, 子集{100,200}, MAX=200 ✓</text>
  <text x="60" y="292" font-size="10" fill="#4a7a3a">  示例2 → M1=200, 子集{100}, MAX=100 ✓（重复的 200 被 &lt; M1 全排除）</text>
  <text x="60" y="308" font-size="10" fill="#4a7a3a">  示例3 → M1=100, 子集∅, MAX(∅)=NULL ✓（MAX 自动返回 NULL）</text>
  <text x="60" y="326" font-size="10" fill="#b85450">  → 一套逻辑通吃三案，无需 DISTINCT、无需外包装，最简洁</text>
  <text x="60" y="344" font-size="10" fill="#333">• 解法 B 需 DISTINCT（示例2）+ 外包装（示例3）才能达到同样效果</text>
</svg>
