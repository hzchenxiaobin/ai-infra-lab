<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [12, 345, 2, 6, 7896]</text>

  <!-- Array boxes -->
  <text x="40" y="62" font-size="12" fill="#888">数组:</text>
  <rect x="80" y="46" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12</text>
  <rect x="146" y="46" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="176" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">345</text>
  <rect x="212" y="46" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="242" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="278" y="46" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="308" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="344" y="46" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="374" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7896</text>

  <!-- Table headers -->
  <rect x="40" y="104" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">元素</text>
  <rect x="136" y="104" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">值域归属</text>
  <rect x="252" y="104" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">位数</text>
  <rect x="328" y="104" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="363" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">偶?</text>
  <rect x="404" y="104" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="444" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count</text>

  <!-- Row 12 -->
  <rect x="40" y="136" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="157" text-anchor="middle" font-size="12" fill="#333">12</text>
  <rect x="136" y="136" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="157" text-anchor="middle" font-size="11" fill="#333">10–99</text>
  <rect x="252" y="136" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="157" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="328" y="136" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="363" y="157" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="404" y="136" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="444" y="157" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 345 -->
  <rect x="40" y="172" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="193" text-anchor="middle" font-size="12" fill="#333">345</text>
  <rect x="136" y="172" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="193" text-anchor="middle" font-size="11" fill="#333">100–999</text>
  <rect x="252" y="172" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="193" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="328" y="172" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="363" y="193" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <rect x="404" y="172" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="444" y="193" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Row 2 -->
  <rect x="40" y="208" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="229" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="136" y="208" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="229" text-anchor="middle" font-size="11" fill="#333">1–9</text>
  <rect x="252" y="208" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="229" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="328" y="208" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="363" y="229" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <rect x="404" y="208" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="444" y="229" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Row 6 -->
  <rect x="40" y="244" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="265" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="136" y="244" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="265" text-anchor="middle" font-size="11" fill="#333">1–9</text>
  <rect x="252" y="244" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="265" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="328" y="244" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="363" y="265" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <rect x="404" y="244" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="444" y="265" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Row 7896 -->
  <rect x="40" y="280" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="301" text-anchor="middle" font-size="12" fill="#333">7896</text>
  <rect x="136" y="280" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="301" text-anchor="middle" font-size="11" fill="#333">1000–9999</text>
  <rect x="252" y="280" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="301" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="328" y="280" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="363" y="301" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="404" y="280" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="444" y="301" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Final answer box -->
  <rect x="40" y="332" width="444" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="356" font-size="13" fill="#333" font-weight="bold">遍历结束：</text>
  <text x="60" y="376" font-size="12" fill="#555">12（2位✓）+ 7896（4位✓）= 2 个偶数位数字</text>
  <text x="60" y="392" font-size="14" fill="#b85450" font-weight="bold">答案 = 2 ✓</text>

  <!-- Arrow from table to answer -->
  <line x1="262" y1="316" x2="262" y2="328" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
