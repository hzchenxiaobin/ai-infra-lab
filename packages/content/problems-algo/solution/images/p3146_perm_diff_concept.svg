<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：字符不重复 ⇒「字符 → 下标」是一张完美哈希表</text>

  <!-- step labels -->
  <text x="14" y="68" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 扫 s 建表</text>
  <text x="14" y="204" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">② 扫 t 累加</text>

  <!-- s row indices -->
  <text x="132" y="72" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">0</text>
  <text x="180" y="72" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="228" y="72" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="276" y="72" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="324" y="72" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>

  <text x="96" y="104" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">s</text>

  <!-- s cells -->
  <rect x="110" y="78" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="103" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="158" y="78" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="103" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="206" y="78" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="103" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="254" y="78" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="103" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="302" y="78" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="103" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">e</text>

  <!-- pairing lines: same char in s and t -->
  <path d="M 132 118 L 276 190" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 180 118 L 228 190" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 228 118 L 324 190" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 276 118 L 180 190" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 324 118 L 132 190" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" filter="url(#rough2)"/>

  <!-- t cells -->
  <text x="96" y="216" text-anchor="middle" font-size="14" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">t</text>
  <rect x="110" y="190" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="215" text-anchor="middle" font-size="15" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="158" y="190" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="215" text-anchor="middle" font-size="15" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="206" y="190" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="215" text-anchor="middle" font-size="15" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="254" y="190" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="215" text-anchor="middle" font-size="15" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="302" y="190" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="215" text-anchor="middle" font-size="15" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- t row indices -->
  <text x="132" y="246" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">0</text>
  <text x="180" y="246" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="228" y="246" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="276" y="246" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="324" y="246" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>

  <!-- per-landing-cell diff tags -->
  <text x="132" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">|4−0|=4</text>
  <text x="180" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">|3−1|=2</text>
  <text x="228" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">|1−2|=1</text>
  <text x="276" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">|0−3|=3</text>
  <text x="324" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">|2−4|=2</text>

  <!-- pos table panel -->
  <path d="M 350 90 L 364 100" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="368" y="78" width="134" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="435" y="100" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">pos[] ← 扫 s 一趟</text>
  <text x="435" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a → 0</text>
  <text x="435" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">b → 1</text>
  <text x="435" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">c → 2</text>
  <text x="435" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d → 3</text>
  <text x="435" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">e → 4</text>
  <text x="435" y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">c − 'a' 即哈希函数</text>
  <text x="435" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">int[26]，零冲突</text>

  <!-- bottom note -->
  <rect x="12" y="288" width="496" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">答案 = 4 + 2 + 1 + 3 + 2 = 12 —— e 挪得最远（4 → 0），单独贡献 4</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">t 是 s 的排列 ⇒ 查表必命中；字符不重复 ⇒ 一键一值零冲突</text>
</svg>
