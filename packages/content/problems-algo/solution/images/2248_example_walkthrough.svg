<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算</text>

  <!-- ===== Example 1 ===== -->
  <text x="28" y="48" font-size="11" fill="#444" font-weight="bold">示例 1：nums = [[3,1,2,4,5],[1,2,3,4],[3,4,5,6]]，n = 3</text>

  <!-- nums[0] -->
  <text x="20" y="76" font-size="9.5" fill="#666">nums[0]</text>
  <rect x="60" y="58" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="90" y="58" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="58" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="58" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="180" y="58" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- nums[1] -->
  <text x="20" y="106" font-size="9.5" fill="#666">nums[1]</text>
  <rect x="60" y="88" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="90" y="88" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="120" y="88" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="150" y="88" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- nums[2] -->
  <text x="20" y="136" font-size="9.5" fill="#666">nums[2]</text>
  <rect x="60" y="118" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="90" y="118" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="120" y="118" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="150" y="118" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <!-- arrow down -->
  <path d="M 135 146 L 135 160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="156" font-size="9.5" fill="#888">逐元素 +1 计数</text>

  <!-- Count table: left column -->
  <rect x="40" y="168" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="184" font-size="10.5" fill="#333">值 1 → count 2</text>
  <text x="200" y="184" font-size="10" fill="#b85450" font-weight="bold">≠3 ✗</text>

  <rect x="40" y="194" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="210" font-size="10.5" fill="#333">值 2 → count 2</text>
  <text x="200" y="210" font-size="10" fill="#b85450" font-weight="bold">≠3 ✗</text>

  <rect x="40" y="220" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="54" y="236" font-size="10.5" fill="#333" font-weight="bold">值 3 → count 3</text>
  <text x="200" y="236" font-size="10" fill="#4a7a3a" font-weight="bold">==3 ✓</text>

  <!-- Count table: right column -->
  <rect x="300" y="168" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="184" font-size="10.5" fill="#333" font-weight="bold">值 4 → count 3</text>
  <text x="460" y="184" font-size="10" fill="#4a7a3a" font-weight="bold">==3 ✓</text>

  <rect x="300" y="194" width="180" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="210" font-size="10.5" fill="#333">值 5 → count 2</text>
  <text x="460" y="210" font-size="10" fill="#b85450" font-weight="bold">≠3 ✗</text>

  <rect x="300" y="220" width="180" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="236" font-size="10.5" fill="#333">值 6 → count 1</text>
  <text x="460" y="236" font-size="10" fill="#b85450" font-weight="bold">≠3 ✗</text>

  <!-- Result 1 -->
  <rect x="150" y="256" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">结果 = [3, 4] ✓（升序）</text>

  <!-- ===== Example 2 ===== -->
  <text x="28" y="312" font-size="11" fill="#444" font-weight="bold">示例 2：nums = [[1,2,3],[4,5,6]]，n = 2</text>

  <!-- nums[0] -->
  <text x="20" y="340" font-size="9.5" fill="#666">nums[0]</text>
  <rect x="60" y="322" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="90" y="322" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="120" y="322" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- nums[1] -->
  <text x="20" y="370" font-size="9.5" fill="#666">nums[1]</text>
  <rect x="60" y="352" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="370" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="90" y="352" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="370" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="120" y="352" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="370" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <!-- count note + result 2 -->
  <rect x="220" y="322" width="300" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="342" text-anchor="middle" font-size="10.5" fill="#333">每个值 count = 1（仅出现在 1 个数组）</text>
  <text x="370" y="358" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">全部 ≠ 2，无交集元素</text>
  <text x="370" y="372" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">结果 = [ ] ✗</text>

  <!-- ===== Key observation ===== -->
  <rect x="40" y="394" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="412" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：count[v] == n 才入结果；值域升序遍历保证结果天然升序</text>
  <text x="270" y="425" text-anchor="middle" font-size="9.5" fill="#888">n = 数组个数；每个子数组内元素互不相同 → 每个数组对每个值至多 +1</text>
</svg>
