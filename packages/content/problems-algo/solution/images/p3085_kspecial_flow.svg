<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 枚举 x → 三分支清算 → 取最小</text>

  <!-- box 1 -->
  <rect x="130" y="40" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">统计 26 字母频次</text>
  <path d="M 220 74 L 220 90" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- box 2 -->
  <rect x="130" y="94" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="115" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举下界 x = freq[i]</text>
  <path d="M 220 128 L 220 144" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- box 3 -->
  <rect x="118" y="148" width="204" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="169" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cost = 0，遍历每个频次 y</text>
  <path d="M 220 182 L 220 202" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="220,206 276,240 220,274 164,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="244" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">y &lt; x ?</text>
  <path d="M 276 240 L 324 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="298" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="328" y="223" width="158" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="407" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cost += y（整桶删光）</text>
  <path d="M 220 274 L 220 294" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="230" y="288" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- diamond 2 -->
  <polygon points="220,298 276,332 220,366 164,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="336" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">y &gt; x + k ?</text>
  <path d="M 276 332 L 324 332" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="298" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="328" y="315" width="158" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="407" y="336" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">cost += y − x − k（削顶）</text>
  <path d="M 220 366 L 220 382" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="230" y="378" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- keep box -->
  <rect x="160" y="386" width="120" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="404" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">不删，贡献 0</text>

  <!-- converge trunk -->
  <path d="M 486 240 L 505 240" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 486 332 L 505 332" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 505 240 L 505 439 L 318 439" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 220 414 L 220 422" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ans box -->
  <rect x="132" y="424" width="184" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="224" y="443" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = min(ans, cost)</text>

  <!-- loop back -->
  <path d="M 132 439 L 66 439 L 66 111 L 126 111" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="58" y="275" text-anchor="middle" font-size="10.5" fill="#888" transform="rotate(-90 58 275)" filter="url(#rough2)">枚举完所有 x</text>

  <!-- return -->
  <path d="M 224 454 L 224 472" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="170" y="476" width="108" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="494" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
