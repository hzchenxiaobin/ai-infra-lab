<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定终值 T，批发次数 p = min(⌊S/2⌋, S−d)</text>
  <text x="260" y="41" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 nums = [2,3,3,3,5]，T = 5：缺口 g = [3,2,2,2,0]，S = 9，d = 3</text>

  <!-- 缺口柱状图 -->
  <line x1="44" y1="212" x2="292" y2="212" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- col1 g=3 红色（最大缺口） -->
  <rect x="50" y="188" width="38" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="50" y="164" width="38" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="50" y="140" width="38" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="69" y="157" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- col2..col4 g=2 绿色 -->
  <rect x="100" y="188" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="100" y="164" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="188" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="164" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="200" y="188" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="200" y="164" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>

  <!-- col5 g=0 虚线空格 -->
  <rect x="250" y="188" width="38" height="24" fill="none" stroke="#aaa" stroke-width="1.3" stroke-dasharray="5 4" rx="3" filter="url(#rough2)"/>
  <text x="269" y="205" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>

  <!-- 4 条配对弧线 -->
  <path d="M 69 142 Q 94 112 119 166" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 69 142 Q 119 92 169 166" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 119 166 Q 169 62 219 166" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 169 166 Q 194 134 219 166" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="94" y="106" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">批发</text>
  <text x="119" y="84" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">批发</text>
  <text x="169" y="56" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">批发 ×4</text>

  <!-- 列标签 -->
  <text x="69" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 2</text>
  <text x="119" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 3</text>
  <text x="169" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 3</text>
  <text x="219" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 3</text>
  <text x="269" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 5</text>
  <text x="69" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">g=3</text>
  <text x="119" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">g=2</text>
  <text x="169" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">g=2</text>
  <text x="219" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">g=2</text>
  <text x="269" y="244" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">g=0</text>

  <text x="168" y="262" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 红顶格 = 配不出去的零头，只能零售（S − 2p = 1 格）</text>

  <!-- 右侧信息框 -->
  <rect x="318" y="58" width="186" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="411" y="77" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">S = 9（总缺口）</text>
  <text x="411" y="92" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">d = 3（最大缺口·红柱）</text>
  <text x="411" y="107" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">S − d = 6（其余缺口）</text>

  <rect x="318" y="130" width="186" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="411" y="150" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">瓶颈① p ≤ ⌊S/2⌋ = 4</text>
  <text x="411" y="167" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">每次批发吃掉 2 格总缺口</text>

  <rect x="318" y="192" width="186" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="411" y="212" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">瓶颈② p ≤ S − d = 6</text>
  <text x="411" y="229" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">最大缺口没法和自己配对！</text>

  <rect x="318" y="254" width="186" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="411" y="273" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p = min(4, 6) = 4，剩 1 格零售</text>
  <text x="411" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">C = 4·c₂ + 1·c₁ = 4 + 2 = 6</text>
  <text x="411" y="307" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">两个上界都可达：每次配缺口最大的两个</text>

  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">度序列视角：各元素参与批发次数 uᵢ ≤ gᵢ 看作多重图的度，全取 uᵢ = gᵢ 或压低 u_max 均可实现 → 上界即最优</text>
</svg>
