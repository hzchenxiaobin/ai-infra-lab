<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 二分答案 → 贪心计数判定</text>

  <!-- Step 1: sort -->
  <rect x="200" y="40" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1. 排序 nums（升序）</text>
  <path d="M 280 76 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init binary search bounds -->
  <rect x="170" y="100" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2. 初始化二分区间</text>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#666">lo = 0, hi = nums[n−1] − nums[0], ans = hi</text>
  <path d="M 280 146 L 280 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop condition (diamond) -->
  <polygon points="280,172 380,212 280,252 180,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">lo ≤ hi ?</text>
  <text x="280" y="224" text-anchor="middle" font-size="10" fill="#888">（二分未结束）</text>

  <!-- No branch -> return -->
  <path d="M 380 212 L 470 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="206" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="194" width="76" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="508" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ans</text>
  <text x="508" y="224" text-anchor="middle" font-size="9" fill="#888">最小可行阈值</text>

  <!-- Yes branch down -->
  <path d="M 280 252 L 280 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="266" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 4: mid -->
  <rect x="190" y="278" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="299" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3. mid = lo + (hi − lo) / 2</text>
  <path d="M 280 314 L 280 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: greedy count (the check) -->
  <rect x="120" y="340" width="320" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4. 贪心计数 count(mid)</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#555">i 从 0 扫：若 nums[i+1]−nums[i] ≤ mid，cnt++ 且 i+=2</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#555">否则 i+=1；得「差值 ≤ mid 的最大不相邻对数」</text>
  <path d="M 280 400 L 280 422" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: decision diamond -->
  <polygon points="280,426 360,458 280,490 200,458" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="462" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">count ≥ p ?</text>

  <!-- Yes (feasible) -> left: ans=mid, hi=mid-1, loop back up -->
  <path d="M 200 458 L 70 458 L 70 120 L 168 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="452" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="74" y="300" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="124" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = mid</text>
  <text x="124" y="332" text-anchor="middle" font-size="10" fill="#555">hi = mid − 1</text>
  <text x="124" y="346" text-anchor="middle" font-size="9" fill="#888">尝试更小阈值</text>

  <!-- No (infeasible) -> right: lo=mid+1, loop back up -->
  <path d="M 360 458 L 470 458 L 470 120 L 392 120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="452" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="486" y="300" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="536" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lo = mid + 1</text>
  <text x="536" y="334" text-anchor="middle" font-size="9" fill="#888">阈值不够，放大</text>
</svg>
