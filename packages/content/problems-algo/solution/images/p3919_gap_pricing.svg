<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：把代价摊到 gap 上，每个间隙一张「方向价目牌」</text>
  <text x="280" y="44" text-anchor="middle" font-size="11.5" fill="#888">示例 nums = [0, 2, 3, 9]，三个间隙 g1=2、g2=1、g3=6</text>

  <!-- index boxes -->
  <rect x="62" y="58" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="182" y="58" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="302" y="58" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="422" y="58" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="85" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="220" y="85" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="340" y="85" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <text x="460" y="85" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
  <text x="100" y="122" text-anchor="middle" font-size="10.5" fill="#8899aa">下标 0</text>
  <text x="220" y="122" text-anchor="middle" font-size="10.5" fill="#8899aa">下标 1</text>
  <text x="340" y="122" text-anchor="middle" font-size="10.5" fill="#8899aa">下标 2</text>
  <text x="460" y="122" text-anchor="middle" font-size="10.5" fill="#8899aa">下标 3</text>

  <!-- gap double arrows -->
  <text x="160" y="132" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">g1 = 2</text>
  <text x="280" y="132" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">g2 = 1</text>
  <text x="400" y="132" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">g3 = 6</text>
  <path d="M 146 140 L 174 140" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 147 136 L 139 140 L 147 144 Z" fill="#446688" filter="url(#rough2)"/>
  <path d="M 173 136 L 181 140 L 173 144 Z" fill="#446688" filter="url(#rough2)"/>
  <path d="M 266 140 L 294 140" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 267 136 L 259 140 L 267 144 Z" fill="#446688" filter="url(#rough2)"/>
  <path d="M 293 136 L 301 140 L 293 144 Z" fill="#446688" filter="url(#rough2)"/>
  <path d="M 386 140 L 414 140" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 387 136 L 379 140 L 387 144 Z" fill="#446688" filter="url(#rough2)"/>
  <path d="M 413 136 L 421 140 L 413 144 Z" fill="#446688" filter="url(#rough2)"/>

  <!-- rightward price row -->
  <text x="46" y="190" text-anchor="start" font-size="12" fill="#446688" font-weight="bold">→ 右行价</text>
  <rect x="132" y="168" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="252" y="168" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="372" y="168" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="190" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="280" y="190" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="400" y="190" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="160" y="221" text-anchor="middle" font-size="9.5" fill="#99a">k=1 恒可走</text>
  <text x="280" y="221" text-anchor="middle" font-size="9.5" fill="#99a">1 &lt; 2 ✓</text>
  <text x="400" y="221" text-anchor="middle" font-size="9.5" fill="#99a">6 &lt; 1 ×</text>

  <!-- leftward price row -->
  <text x="46" y="264" text-anchor="start" font-size="12" fill="#446688" font-weight="bold">← 左行价</text>
  <rect x="132" y="242" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="252" y="242" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="372" y="242" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="264" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="280" y="264" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="400" y="264" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="160" y="295" text-anchor="middle" font-size="9.5" fill="#99a">2 ≤ 1 ×</text>
  <text x="280" y="295" text-anchor="middle" font-size="9.5" fill="#99a">1 ≤ 6 ✓</text>
  <text x="400" y="295" text-anchor="middle" font-size="9.5" fill="#99a">k=n-1 恒可走</text>

  <!-- query walkthrough -->
  <text x="280" y="322" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">查询 [3, 0]：按左行价目付账 = 1 + 1 + 2 = 4</text>

  <rect x="68" y="340" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="198" y="340" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="328" y="340" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="458" y="340" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="362" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="230" y="362" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="360" y="362" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="490" y="362" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="100" y="390" text-anchor="middle" font-size="9.5" fill="#8899aa">起点</text>
  <text x="490" y="390" text-anchor="middle" font-size="9.5" fill="#8899aa">终点</text>

  <path d="M 194 357 L 140 357" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 324 357 L 270 357" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 454 357 L 400 357" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="167" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">贴链 1</text>
  <text x="297" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">贴链 1</text>
  <text x="427" y="334" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">跳 2</text>

  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#8899aa">该方向可走就贴链付 1；不可走（链条断）就跳过去，付 gap 宽度</text>
</svg>
