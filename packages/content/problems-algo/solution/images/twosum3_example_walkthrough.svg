<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="520" fill="#fafafa"/>
  <text x="460" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：add(1), add(3), add(5), find(4), find(7)</text>
  <path d="M 280 40 Q 460 48 640 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- add 阶段 -->
  <text x="60" y="72" font-size="13" font-weight="bold" fill="#2b6e9e">阶段一：逐个 add</text>

  <!-- add(1) -->
  <text x="60" y="100" font-size="11" font-weight="bold" fill="#444">add(1):</text>
  <g filter="url(#sk2)">
    <rect x="130" y="86" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="165" y="105" text-anchor="middle" font-size="11" fill="#333">1 → cnt=1</text>
  <text x="220" y="105" font-size="10" fill="#2e6e2e">map = {1:1}</text>

  <!-- add(3) -->
  <text x="60" y="136" font-size="11" font-weight="bold" fill="#444">add(3):</text>
  <g filter="url(#sk2)">
    <rect x="130" y="122" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="165" y="141" text-anchor="middle" font-size="11" fill="#333">3 → cnt=1</text>
  <text x="220" y="141" font-size="10" fill="#2e6e2e">map = {1:1, 3:1}</text>

  <!-- add(5) -->
  <text x="60" y="172" font-size="11" font-weight="bold" fill="#444">add(5):</text>
  <g filter="url(#sk2)">
    <rect x="130" y="158" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="165" y="177" text-anchor="middle" font-size="11" fill="#333">5 → cnt=1</text>
  <text x="220" y="177" font-size="10" fill="#2e6e2e">map = {1:1, 3:1, 5:1}</text>

  <path d="M 460 190 L 460 210" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- find(4) 阶段 -->
  <text x="60" y="232" font-size="13" font-weight="bold" fill="#7a5415">阶段二：find(4)</text>

  <g filter="url(#sk2)">
    <rect x="40" y="250" width="840" height="100" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>

  <text x="60" y="272" font-size="11" font-weight="bold" fill="#444">遍历 map:</text>

  <!-- key=1 -->
  <g filter="url(#sk2)">
    <rect x="60" y="282" width="80" height="24" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="100" y="298" text-anchor="middle" font-size="10" fill="#333">key=1</text>
  <text x="155" y="298" font-size="10" fill="#666">→ comp = 4-1 = 3</text>
  <g filter="url(#sk2)">
    <rect x="290" y="282" width="80" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a"/>
  </g>
  <text x="330" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">3 in map ✓</text>
  <text x="390" y="298" font-size="10" fill="#666">comp≠key, 无需查 count</text>
  <text x="560" y="298" font-size="11" font-weight="bold" fill="#2e6e2e">→ return true</text>

  <text x="60" y="326" font-size="10" fill="#999">（第一个 key 就命中，后续不再遍历）</text>
  <text x="60" y="342" font-size="10" fill="#444">结果：1 + 3 = 4 ✓ 存在两数之和为 4</text>

  <!-- find(7) 阶段 -->
  <text x="60" y="378" font-size="13" font-weight="bold" fill="#7a5415">阶段三：find(7)</text>

  <g filter="url(#sk2)">
    <rect x="40" y="394" width="840" height="110" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>

  <text x="60" y="416" font-size="11" font-weight="bold" fill="#444">遍历 map:</text>

  <!-- key=1 -->
  <g filter="url(#sk2)">
    <rect x="60" y="426" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="100" y="441" text-anchor="middle" font-size="10" fill="#333">key=1</text>
  <text x="155" y="441" font-size="10" fill="#666">→ comp = 6</text>
  <g filter="url(#sk2)">
    <rect x="230" y="426" width="80" height="22" rx="4" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="270" y="441" text-anchor="middle" font-size="10" fill="#b03a3a">6 not in map ✗</text>

  <!-- key=3 -->
  <g filter="url(#sk2)">
    <rect x="60" y="454" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="100" y="469" text-anchor="middle" font-size="10" fill="#333">key=3</text>
  <text x="155" y="469" font-size="10" fill="#666">→ comp = 4</text>
  <g filter="url(#sk2)">
    <rect x="230" y="454" width="80" height="22" rx="4" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="270" y="469" text-anchor="middle" font-size="10" fill="#b03a3a">4 not in map ✗</text>

  <!-- key=5 -->
  <g filter="url(#sk2)">
    <rect x="60" y="482" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="100" y="497" text-anchor="middle" font-size="10" fill="#333">key=5</text>
  <text x="155" y="497" font-size="10" fill="#666">→ comp = 2</text>
  <g filter="url(#sk2)">
    <rect x="230" y="482" width="80" height="22" rx="4" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="270" y="497" text-anchor="middle" font-size="10" fill="#b03a3a">2 not in map ✗</text>
  <text x="340" y="497" font-size="10" fill="#999">遍历完毕</text>
  <text x="430" y="497" font-size="11" font-weight="bold" fill="#b03a3a">→ return false</text>
</svg>
