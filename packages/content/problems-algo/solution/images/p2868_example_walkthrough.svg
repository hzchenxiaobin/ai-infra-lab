<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 446" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="446" fill="#fafafa"/>

  <!-- ===== Panel A: Example 1 ===== -->
  <text x="310" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1：a = [avokado, dabar]，b = [brazil] → false</text>

  <!-- header row -->
  <rect x="30" y="38" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="51" y="55" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步</text>
  <rect x="72" y="38" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="104" y="55" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">行动方</text>
  <rect x="136" y="38" width="132" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="202" y="55" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">查看词</text>
  <rect x="268" y="38" width="196" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="366" y="55" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="464" y="38" width="104" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="516" y="55" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">门槛 w</text>

  <!-- row 1 -->
  <rect x="30" y="64" width="42" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="51" y="81" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">开局</text>
  <rect x="72" y="64" width="64" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="81" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Alice</text>
  <rect x="136" y="64" width="132" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="81" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a[0] = avokado</text>
  <rect x="268" y="64" width="196" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="366" y="81" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">强制以最小词开局</text>
  <rect x="464" y="64" width="104" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="516" y="81" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">avokado</text>

  <!-- row 2 -->
  <rect x="30" y="91" width="42" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="51" y="108" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="72" y="91" width="64" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="108" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Bob</text>
  <rect x="136" y="91" width="132" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="108" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">b[0] = brazil</text>
  <rect x="268" y="91" width="196" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="366" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b − a = 1 → 出！</text>
  <rect x="464" y="91" width="104" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="516" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">brazil</text>

  <!-- row 3 -->
  <rect x="30" y="118" width="42" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="51" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="72" y="118" width="64" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Alice</text>
  <rect x="136" y="118" width="132" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a[1] = dabar</text>
  <rect x="268" y="118" width="196" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="366" y="135" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d − b = 2 → 跳过</text>
  <rect x="464" y="118" width="104" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="135" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">brazil</text>

  <!-- row 4 -->
  <rect x="30" y="145" width="42" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="51" y="162" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="72" y="145" width="64" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Alice</text>
  <rect x="136" y="145" width="132" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="162" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（指针到头）</text>
  <rect x="268" y="145" width="196" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="366" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Alice 判负 → 返回 false</text>
  <rect x="464" y="145" width="104" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="162" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- ===== Panel B: Example 2 ===== -->
  <text x="310" y="204" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2：a = [ananas, atlas, banana]，b = [albatros, cikla, nogomet] → true</text>

  <!-- header row -->
  <rect x="30" y="218" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="51" y="235" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步</text>
  <rect x="72" y="218" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="104" y="235" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">行动方</text>
  <rect x="136" y="218" width="132" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="202" y="235" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">查看词</text>
  <rect x="268" y="218" width="196" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="366" y="235" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="464" y="218" width="104" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="516" y="235" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">门槛 w</text>

  <!-- row 1 -->
  <rect x="30" y="244" width="42" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="51" y="261" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">开局</text>
  <rect x="72" y="244" width="64" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="261" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Alice</text>
  <rect x="136" y="244" width="132" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="261" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a[0] = ananas</text>
  <rect x="268" y="244" width="196" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="366" y="261" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">强制以最小词开局</text>
  <rect x="464" y="244" width="104" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="516" y="261" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">ananas</text>

  <!-- row 2 -->
  <rect x="30" y="271" width="42" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="51" y="288" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="72" y="271" width="64" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="288" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Bob</text>
  <rect x="136" y="271" width="132" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="288" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">b[0] = albatros</text>
  <rect x="268" y="271" width="196" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="366" y="288" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">同为 a，但更小 → 跳过</text>
  <rect x="464" y="271" width="104" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="288" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">ananas</text>

  <!-- row 3 -->
  <rect x="30" y="298" width="42" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="51" y="315" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="72" y="298" width="64" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="315" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Bob</text>
  <rect x="136" y="298" width="132" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="315" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">b[1] = cikla</text>
  <rect x="268" y="298" width="196" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="366" y="315" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">c − a = 2 → 跳过</text>
  <rect x="464" y="298" width="104" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="315" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">ananas</text>

  <!-- row 4 -->
  <rect x="30" y="325" width="42" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="51" y="342" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="72" y="325" width="64" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="342" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Bob</text>
  <rect x="136" y="325" width="132" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="342" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">b[2] = nogomet</text>
  <rect x="268" y="325" width="196" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="366" y="342" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">n − a = 13 → 跳过</text>
  <rect x="464" y="325" width="104" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="342" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">ananas</text>

  <!-- row 5 -->
  <rect x="30" y="352" width="42" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="51" y="369" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="72" y="352" width="64" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="369" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Bob</text>
  <rect x="136" y="352" width="132" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="369" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（指针到头）</text>
  <rect x="268" y="352" width="196" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="366" y="369" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Bob 判负 → 返回 true</text>
  <rect x="464" y="352" width="104" height="25" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="369" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- bottom note -->
  <text x="310" y="412" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">关键点：albatros 首字母与门槛相同，却因字典序更小接不住 —— 「首字母相同 ≠ 接得住」</text>
  <text x="310" y="432" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">门槛 w 只升不降：被跳过的词永久作废，两个指针各自一路向前，一趟线性扫描定胜负</text>
</svg>
