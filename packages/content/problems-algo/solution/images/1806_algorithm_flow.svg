<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：追踪位置 1，反复乘 2 模 (n−1) 直至归位</text>

  <!-- Start: special case n==2 -->
  <rect x="150" y="44" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">n == 2 ?</text>
  <text x="260" y="78" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">位置 1 = n−1 是不动点，需特判</text>

  <!-- Yes branch (left): return 1 -->
  <path d="M 150 66 L 86 66" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="60" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="14" y="46" width="72" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="50" y="64" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="50" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- No branch (down) -->
  <path d="M 260 90 L 260 110" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="106" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- init: step=0, pos=1 -->
  <rect x="170" y="114" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="260" y="146" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">step = 0, pos = 1</text>

  <path d="M 260 156 L 260 176" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="172" font-size="9" fill="#aaa" filter="url(#rough2)">← 循环回跳</text>

  <!-- step++ -->
  <rect x="190" y="180" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">step += 1</text>

  <path d="M 260 216 L 260 236" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pos = pos * 2 % (n-1) -->
  <rect x="130" y="240" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">pos = pos × 2 mod (n − 1)</text>
  <text x="260" y="278" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">等价于：pos&lt;n/2 → 2pos；否则 2pos−n+1</text>

  <path d="M 260 290 L 260 312" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: pos == 1 ? -->
  <polygon points="260,316 350,356 260,396 170,356" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pos == 1 ?</text>
  <text x="260" y="368" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">位置 1 是否归位</text>

  <!-- No branch (left): loop back to step++ -->
  <path d="M 170 356 L 60 356 L 60 198 L 190 198" stroke="#888" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="350" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否，继续</text>

  <!-- Yes branch (right): return step -->
  <path d="M 350 356 L 430 356" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="350" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="430" y="336" width="76" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="468" y="354" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="468" y="368" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">step</text>

  <!-- Footer -->
  <path d="M 40 420 L 480 420" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="260" y="440" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每步 O(1)，循环 O(答案) ≤ O(n) 次；do-while 保证至少走一步</text>
  <text x="260" y="456" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">位置 1 归位 ⇔ 2^step ≡ 1 (mod n−1) ⇔ 所有位置同时归位</text>
</svg>
