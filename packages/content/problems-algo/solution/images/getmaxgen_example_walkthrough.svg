<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 7</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#999">逐下标 j 填表，奇偶分流，边填边更新 ans</text>

  <!-- Table frame -->
  <rect x="40" y="58" width="480" height="340" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="40" y="58" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="70" y="76">j</text>
    <text x="120" y="76">奇偶</text>
    <text x="210" y="76">规则 / 计算</text>
    <text x="330" y="76">nums[j]</text>
    <text x="460" y="76">ans</text>
  </g>
  <!-- column separators -->
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="95" y1="58" x2="95" y2="398"/>
    <line x1="150" y1="58" x2="150" y2="398"/>
    <line x1="280" y1="58" x2="280" y2="398"/>
    <line x1="395" y1="58" x2="395" y2="398"/>
  </g>

  <!-- Rows -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- row j=0 base -->
    <text x="70" y="106">0</text>
    <text x="120" y="106" fill="#446688">基础</text>
    <text x="210" y="106">nums[0] = 0</text>
    <text x="330" y="106" fill="#446688" font-weight="bold">0</text>
    <text x="460" y="106" fill="#446688">0</text>

    <!-- row j=1 base -->
    <text x="70" y="130">1</text>
    <text x="120" y="130" fill="#446688">基础</text>
    <text x="210" y="130">nums[1] = 1</text>
    <text x="330" y="130" fill="#446688" font-weight="bold">1</text>
    <text x="460" y="130" fill="#b85450" font-weight="bold">1</text>

    <!-- row j=2 even -->
    <text x="70" y="154">2</text>
    <text x="120" y="154" fill="#4a7a3a">偶</text>
    <text x="210" y="154">nums[2] = nums[1]</text>
    <text x="330" y="154" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="460" y="154">1</text>

    <!-- row j=3 odd -->
    <text x="70" y="178">3</text>
    <text x="120" y="178" fill="#d6a040">奇</text>
    <text x="210" y="178">nums[3]=nums[1]+nums[2]=1+1</text>
    <text x="330" y="178" fill="#d6a040" font-weight="bold">2</text>
    <text x="460" y="178" fill="#b85450" font-weight="bold">2</text>

    <!-- row j=4 even -->
    <text x="70" y="202">4</text>
    <text x="120" y="202" fill="#4a7a3a">偶</text>
    <text x="210" y="202">nums[4] = nums[2]</text>
    <text x="330" y="202" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="460" y="202">2</text>

    <!-- row j=5 odd PEAK -->
    <rect x="42" y="184" width="476" height="24" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
    <text x="70" y="202" fill="#b85450" font-weight="bold">5</text>
    <text x="120" y="202" fill="#d6a040">奇</text>
    <text x="210" y="202">nums[5]=nums[2]+nums[3]=1+2</text>
    <text x="330" y="202" fill="#d6a040" font-weight="bold">3</text>
    <text x="460" y="202" fill="#b85450" font-weight="bold">3</text>

    <!-- row j=6 even -->
    <text x="70" y="230">6</text>
    <text x="120" y="230" fill="#4a7a3a">偶</text>
    <text x="210" y="230">nums[6] = nums[3]</text>
    <text x="330" y="230" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="460" y="230">3</text>

    <!-- row j=7 odd -->
    <text x="70" y="254">7</text>
    <text x="120" y="254" fill="#d6a040">奇</text>
    <text x="210" y="254">nums[7]=nums[3]+nums[4]=2+1</text>
    <text x="330" y="254" fill="#d6a040" font-weight="bold">3</text>
    <text x="460" y="254">3</text>
  </g>

  <!-- row separators -->
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="114" x2="520" y2="114"/>
    <line x1="40" y1="138" x2="520" y2="138"/>
    <line x1="40" y1="162" x2="520" y2="162"/>
    <line x1="40" y1="186" x2="520" y2="186"/>
    <line x1="40" y1="210" x2="520" y2="210"/>
    <line x1="40" y1="238" x2="520" y2="238"/>
    <line x1="40" y1="262" x2="520" y2="262"/>
  </g>

  <!-- End result row -->
  <rect x="40" y="264" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">扫描结束 → nums = [0,1,1,2,1,3,2,3]，返回 ans = 3 ✓</text>

  <!-- peak annotation -->
  <text x="510" y="202" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">← 峰值</text>

  <!-- dependency note -->
  <rect x="40" y="306" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="326" font-size="11" fill="#d6a040" font-weight="bold">依赖关系观察</text>
  <text x="56" y="344" font-size="11" fill="#555">• 偶下标 j=2i：只依赖 nums[i]，而 i = j/2 &lt; j，已填好。</text>
  <text x="56" y="362" font-size="11" fill="#555">• 奇下标 j=2i+1：依赖 nums[i] 与 nums[i+1]，二者均 &lt; j，已填好。</text>
  <text x="56" y="380" font-size="11" fill="#555">• 故「按 j 从小到大」的顺序天然满足依赖，无需排序/记忆化。</text>

  <!-- bottom compact formula -->
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#888">奇偶统一写法：nums[j] = nums[j &gt;&gt; 1] + (j &amp; 1 ? nums[(j &gt;&gt; 1) + 1] : 0)</text>
</svg>
