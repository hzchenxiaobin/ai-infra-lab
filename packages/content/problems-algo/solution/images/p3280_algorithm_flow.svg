<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：外层按 '-' 切三段，内层短除取余</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="50" rx="95" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 date = "yyyy-mm-dd"</text>

  <path d="M260,67 L260,82" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 切分 -->
  <rect x="155" y="84" width="210" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">按 '-' 切成 year / month / day</text>

  <path d="M260,114 L260,130" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- ×3 分组框 -->
  <rect x="85" y="132" width="400" height="212" rx="10" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="8 6" filter="url(#rough2)"/>
  <text x="285" y="150" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">对三段各执行一遍（×3）</text>

  <!-- num 初始化 -->
  <rect x="160" y="160" width="200" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num = 该段整数，bin = ""</text>

  <path d="M260,190 L260,206" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 菱形：num > 0 ? -->
  <polygon points="260,208 348,242 260,276 172,242" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">num &gt; 0 ?</text>

  <!-- 是：向下 -->
  <path d="M260,276 L260,292" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="268" y="288" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 短除一步 -->
  <rect x="135" y="294" width="250" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bin = ('0'+num%2) + bin；num ÷= 2</text>

  <!-- 内层回边 -->
  <path d="M135,312 L108,312 L108,242 L168,242" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 否：向右 -->
  <path d="M348,242 L378,242" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="354" y="234" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 段结束 -->
  <rect x="382" y="220" width="100" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="432" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">该段结束</text>
  <text x="432" y="256" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">段结果 = bin</text>

  <!-- 下一段虚线回边 -->
  <path d="M432,220 L432,175 L364,175" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="440" y="200" font-size="9" fill="#446688" filter="url(#rough2)">下一段</text>

  <!-- 无前导零注记 -->
  <rect x="378" y="284" width="107" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="431" y="302" text-anchor="middle" font-size="9" font-weight="bold" fill="#a06a10" filter="url(#rough2)">退出前 num=1</text>
  <text x="431" y="316" text-anchor="middle" font-size="9" fill="#a06a10" filter="url(#rough2)">最后余数必为 1</text>
  <text x="431" y="332" text-anchor="middle" font-size="9" fill="#a06a10" filter="url(#rough2)">→ 无前导零 ✓</text>

  <!-- 分组出口 -->
  <path d="M260,344 L260,362" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="268" y="356" font-size="9" fill="#446688" filter="url(#rough2)">三段全部完成</text>

  <!-- join -->
  <rect x="140" y="364" width="240" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">三段二进制串用 '-' 连接</text>

  <path d="M380,380 L398,380" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <ellipse cx="447" cy="380" rx="63" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="447" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回结果</text>
</svg>
