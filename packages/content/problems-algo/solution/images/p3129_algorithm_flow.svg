<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="15" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：前缀和版，O(zero · one)</text>

  <!-- 1. start -->
  <rect x="185" y="26" width="190" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">开始：dp / s0 / s1 清零</text>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">哨兵 dp[0][0][0] = dp[0][0][1] = 1</text>

  <line x1="280" y1="74" x2="280" y2="96" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 2. loop -->
  <rect x="185" y="98" width="190" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">取下一格 (i, j)</text>
  <text x="280" y="136" text-anchor="middle" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">i=0..zero, j=0..one，跳过 (0,0)</text>

  <line x1="280" y1="146" x2="280" y2="168" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 3. diamond i>0 -->
  <polygon points="185,212 280,170 375,212 280,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i &gt; 0 ?</text>

  <line x1="185" y1="212" x2="167" y2="212" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="175" y="203" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>

  <!-- boxA -->
  <rect x="25" y="186" width="140" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="95" y="204" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">dp[i][j][0] =</text>
  <text x="95" y="220" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">s1[i−1][j] −</text>
  <text x="95" y="236" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">s1[i−limit−1][j] (mod M)</text>

  <path d="M95,238 L95,294 L203,294" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <line x1="280" y1="254" x2="280" y2="270" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="291" y="266" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- 4. s0 update -->
  <rect x="205" y="272" width="150" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">s0[i][j] = s0[i][j−1]</text>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">+ dp[i][j][0]</text>

  <line x1="280" y1="316" x2="280" y2="328" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 5. diamond j>0 -->
  <polygon points="185,370 280,328 375,370 280,412" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &gt; 0 ?</text>

  <line x1="375" y1="370" x2="393" y2="370" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="385" y="361" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>

  <!-- boxB -->
  <rect x="395" y="344" width="140" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="465" y="362" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">dp[i][j][1] =</text>
  <text x="465" y="378" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">s0[i][j−1] −</text>
  <text x="465" y="394" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">s0[i][j−limit−1] (mod M)</text>

  <path d="M465,396 L465,414 L340,414 L340,430" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <line x1="280" y1="412" x2="280" y2="430" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="291" y="425" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- 6. s1 update -->
  <rect x="205" y="432" width="150" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">s1[i][j] = s1[i−1][j]</text>
  <text x="280" y="466" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">+ dp[i][j][1]</text>

  <!-- return -->
  <line x1="355" y1="454" x2="383" y2="454" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="369" y="445" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">遍历完</text>
  <rect x="385" y="432" width="155" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="462" y="452" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 (dp[zero][one][0]</text>
  <text x="462" y="470" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">+ dp[zero][one][1]) mod M</text>

  <!-- loop back -->
  <path d="M280,476 L280,502 L12,502 L12,122 L183,122" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="495" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是：还有格子</text>

  <!-- side annotation -->
  <rect x="25" y="330" width="150" height="96" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="100" y="350" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">朴素：枚举 L 逐项加</text>
  <text x="100" y="366" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">O(z·o·limit)</text>
  <text x="100" y="388" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">前缀和：窗口和 =</text>
  <text x="100" y="404" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">两前缀相减 → O(z·o)</text>
</svg>
