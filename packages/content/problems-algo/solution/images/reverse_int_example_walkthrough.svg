<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：正常翻转与溢出拦截</text>

  <!-- ===== Table A: x = 123 → 321 ===== -->
  <text x="30" y="52" font-size="12" fill="#446688" font-weight="bold">A. x = 123  →  321（正常）</text>

  <!-- header -->
  <rect x="24" y="60" width="512" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="77" font-size="11" fill="#333">步骤</text>
  <text x="120" y="77" font-size="11" fill="#333">d</text>
  <text x="215" y="77" font-size="11" fill="#333">x（弹出后）</text>
  <text x="340" y="77" font-size="11" fill="#333">rev（压入后）</text>
  <text x="468" y="77" font-size="11" fill="#333">说明</text>

  <rect x="24" y="86" width="512" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="103" font-size="11" fill="#333">1</text><text x="120" y="103" font-size="11" fill="#4a7a3a">3</text><text x="215" y="103" font-size="11" fill="#333">12</text><text x="340" y="103" font-size="11" fill="#333">3</text><text x="468" y="103" font-size="11" fill="#666">0×10+3</text>

  <rect x="24" y="112" width="512" height="26" fill="#f3f9f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="129" font-size="11" fill="#333">2</text><text x="120" y="129" font-size="11" fill="#4a7a3a">2</text><text x="215" y="129" font-size="11" fill="#333">1</text><text x="340" y="129" font-size="11" fill="#333">32</text><text x="468" y="129" font-size="11" fill="#666">3×10+2</text>

  <rect x="24" y="138" width="512" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="155" font-size="11" fill="#333">3</text><text x="120" y="155" font-size="11" fill="#4a7a3a">1</text><text x="215" y="155" font-size="11" fill="#333">0</text><text x="340" y="155" font-size="11" fill="#333">321</text><text x="468" y="155" font-size="11" fill="#666">32×10+1</text>

  <rect x="24" y="164" width="512" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="181" font-size="11" fill="#333">结束</text><text x="120" y="181" font-size="11" fill="#888">—</text><text x="215" y="181" font-size="11" fill="#333">0</text><text x="340" y="181" font-size="11" fill="#b85450">返回 321</text><text x="468" y="181" font-size="11" fill="#666">x==0 退出</text>

  <!-- ===== Table B: x = 1534236469 → 0 (overflow) ===== -->
  <text x="30" y="218" font-size="12" fill="#446688" font-weight="bold">B. x = 1534236469  →  0（反转后 9646324351 溢出，被预判拦截）</text>

  <rect x="24" y="226" width="512" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="243" font-size="11" fill="#333">步骤</text>
  <text x="120" y="243" font-size="11" fill="#333">d</text>
  <text x="215" y="243" font-size="11" fill="#333">x（弹出后）</text>
  <text x="340" y="243" font-size="11" fill="#333">rev（压入后）</text>
  <text x="468" y="243" font-size="11" fill="#333">说明</text>

  <rect x="24" y="252" width="512" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="269" font-size="11" fill="#333">1</text><text x="120" y="269" font-size="11" fill="#4a7a3a">9</text><text x="215" y="269" font-size="11" fill="#333">153423646</text><text x="340" y="269" font-size="11" fill="#333">9</text><text x="468" y="269" font-size="11" fill="#666">安全</text>

  <rect x="24" y="278" width="512" height="26" fill="#f3f9f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="295" font-size="11" fill="#333">2</text><text x="120" y="295" font-size="11" fill="#4a7a3a">6</text><text x="215" y="295" font-size="11" fill="#333">15342364</text><text x="340" y="295" font-size="11" fill="#333">96</text><text x="468" y="295" font-size="11" fill="#666">安全</text>

  <rect x="24" y="304" width="512" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="50" y="321" font-size="11" fill="#888">…</text><text x="120" y="321" font-size="11" fill="#888">…</text><text x="215" y="321" font-size="11" fill="#888">（step 3–7 省略）</text><text x="340" y="321" font-size="11" fill="#888">rev 持续增长</text><text x="468" y="321" font-size="11" fill="#888">均安全</text>

  <rect x="24" y="330" width="512" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="347" font-size="11" fill="#333">8</text><text x="120" y="347" font-size="11" fill="#4a7a3a">3</text><text x="215" y="347" font-size="11" fill="#333">15</text><text x="340" y="347" font-size="11" fill="#333">96463243</text><text x="468" y="347" font-size="11" fill="#666">仍安全</text>

  <!-- triggering row -->
  <rect x="24" y="356" width="512" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="376" font-size="11" fill="#b85450" font-weight="bold">9</text><text x="120" y="376" font-size="11" fill="#b85450">5</text><text x="215" y="376" font-size="11" fill="#333">1</text><text x="340" y="376" font-size="11" fill="#888">—（未压入）</text><text x="468" y="376" font-size="10" fill="#b85450">预判触发</text>

  <text x="30" y="400" font-size="11" fill="#b85450">预判：rev = 96463243 &gt; INT_MAX/10 = 214748364 ✓ → 立即返回 0，不执行越界的 rev×10+d</text>
</svg>
