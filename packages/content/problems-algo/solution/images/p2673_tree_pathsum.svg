<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">满二叉树：根到叶路径值之和需全部相等</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">操作 = 任意节点值 +1，求最少操作次数</text>

  <!-- ===== Tree (example 1, left) ===== -->
  <g font-size="12">
    <!-- L0 root node 1 cost=1 -->
    <circle cx="120" cy="92" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="120" y="97" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="120" y="82" text-anchor="middle" font-size="9" fill="#aaa">①</text>

    <!-- L1 node 2 cost=5, node 3 cost=2 -->
    <circle cx="70" cy="162" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="70" y="167" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="70" y="152" text-anchor="middle" font-size="9" fill="#aaa">②</text>

    <circle cx="170" cy="162" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="170" y="167" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="170" y="152" text-anchor="middle" font-size="9" fill="#aaa">③</text>

    <line x1="107" y1="106" x2="84" y2="148" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="133" y1="106" x2="156" y2="148" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- L2 leaves: node4=2, node5=3, node6=3, node7=1 -->
    <circle cx="42" cy="232" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="42" y="237" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="42" y="223" text-anchor="middle" font-size="9" fill="#aaa">④</text>

    <circle cx="98" cy="232" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="98" y="237" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="98" y="223" text-anchor="middle" font-size="9" fill="#aaa">⑤</text>

    <circle cx="142" cy="232" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="142" y="237" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="142" y="223" text-anchor="middle" font-size="9" fill="#aaa">⑥</text>

    <circle cx="198" cy="232" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="198" y="237" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="198" y="223" text-anchor="middle" font-size="9" fill="#aaa">⑦</text>

    <line x1="58" y1="176" x2="48" y2="220" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="82" y1="176" x2="92" y2="220" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="158" y1="176" x2="148" y2="220" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="182" y1="176" x2="192" y2="220" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  </g>

  <!-- path sum labels on leaves -->
  <text x="42" y="262" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">= 8</text>
  <text x="98" y="262" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">= 9</text>
  <text x="142" y="262" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">= 6</text>
  <text x="198" y="262" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">= 4</text>

  <!-- ===== Right side: path sums ===== -->
  <text x="290" y="80" font-size="11" fill="#444" font-weight="bold">4 条根→叶路径值</text>

  <g font-size="11">
    <text x="290" y="105" font-size="10" fill="#666">①→②→④:</text>
    <text x="370" y="105" font-size="10" fill="#333">1+5+2 =</text>
    <rect x="430" y="93" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="446" y="108" text-anchor="middle" fill="#446688" font-weight="bold">8</text>

    <text x="290" y="135" font-size="10" fill="#666">①→②→⑤:</text>
    <text x="370" y="135" font-size="10" fill="#333">1+5+3 =</text>
    <rect x="430" y="123" width="32" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="446" y="138" text-anchor="middle" fill="#d6a040" font-weight="bold">9</text>

    <text x="290" y="165" font-size="10" fill="#666">①→③→⑥:</text>
    <text x="370" y="165" font-size="10" fill="#333">1+2+3 =</text>
    <rect x="430" y="153" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="446" y="168" text-anchor="middle" fill="#446688" font-weight="bold">6</text>

    <text x="290" y="195" font-size="10" fill="#666">①→③→⑦:</text>
    <text x="370" y="195" font-size="10" fill="#333">1+2+1 =</text>
    <rect x="430" y="183" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="446" y="198" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
  </g>

  <!-- Target box -->
  <rect x="290" y="220" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="240" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">目标：所有路径值 = max = 9</text>
  <text x="410" y="258" text-anchor="middle" font-size="10" fill="#888">只能增加节点值，不能减少</text>

  <!-- increment hints -->
  <text x="290" y="296" font-size="10" fill="#b85450" font-weight="bold">最优增量：</text>
  <text x="290" y="314" font-size="10" fill="#666">④+1, ③+3, ⑦+2 → 共 1+3+2 = 6 次</text>
  <text x="290" y="332" font-size="10" fill="#888">增加共享祖先影响多条路径，需自底向上贪心</text>

  <!-- Legend -->
  <line x1="20" y1="352" x2="540" y2="352" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="372" font-size="10" fill="#888" font-weight="bold">图例</text>
  <circle cx="80" cy="368" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="372" font-size="10" fill="#666">内部节点</text>
  <circle cx="160" cy="368" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="176" y="372" font-size="10" fill="#666">叶子节点</text>
  <rect x="250" y="362" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="272" y="372" font-size="10" fill="#666">最大路径值</text>
</svg>
