<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：过滤偶数 → 哈希计数 → 双键取最(频次最大, 值最小)</text>

  <!-- Stage 1: nums array with filter -->
  <text x="70" y="72" font-size="12" fill="#888">nums =</text>
  <!-- 7 cells: 0,1,2,2,4,4,1 ; evens green, odds red-crossed -->
  <rect x="121" y="44" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="72" text-anchor="middle" font-size="16" fill="#333">0</text>
  <rect x="164" y="44" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="72" text-anchor="middle" font-size="16" fill="#b85450">1</text>
  <path d="M168 48 L200 84" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="207" y="44" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="72" text-anchor="middle" font-size="16" fill="#333">2</text>
  <rect x="250" y="44" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="16" fill="#333">2</text>
  <rect x="293" y="44" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="72" text-anchor="middle" font-size="16" fill="#333">4</text>
  <rect x="336" y="44" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="72" text-anchor="middle" font-size="16" fill="#333">4</text>
  <rect x="379" y="44" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="399" y="72" text-anchor="middle" font-size="16" fill="#b85450">1</text>
  <path d="M383 48 L415 84" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="440" y="72" font-size="10.5" fill="#888">绿=偶数 红=丢弃</text>

  <!-- Arrow 1 -->
  <path d="M 270 92 L 270 110" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="105" font-size="11" fill="#446688">① 过滤偶数 (x &amp; 1 == 0；0 是偶数)</text>

  <!-- Stage 2: even subsequence -->
  <text x="70" y="148" font-size="12" fill="#888">偶数 =</text>
  <rect x="164" y="120" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="148" text-anchor="middle" font-size="16" fill="#333">0</text>
  <rect x="207" y="120" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="148" text-anchor="middle" font-size="16" fill="#333">2</text>
  <rect x="250" y="120" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="148" text-anchor="middle" font-size="16" fill="#333">2</text>
  <rect x="293" y="120" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="148" text-anchor="middle" font-size="16" fill="#333">4</text>
  <rect x="336" y="120" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="148" text-anchor="middle" font-size="16" fill="#333">4</text>

  <!-- Arrow 2 -->
  <path d="M 270 168 L 270 186" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="181" font-size="11" fill="#446688">② 哈希计数 freq[x]++</text>

  <!-- Stage 3: freq cards -->
  <!-- Card 0 -> 1 (blue, not max) -->
  <rect x="85" y="194" width="110" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="214" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">值 v = 0</text>
  <text x="140" y="232" text-anchor="middle" font-size="10" fill="#888">频次</text>
  <text x="140" y="256" text-anchor="middle" font-size="20" fill="#333">1</text>

  <!-- Card 2 -> 2 (green, winner) -->
  <rect x="215" y="194" width="110" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="214" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">值 v = 2</text>
  <text x="270" y="232" text-anchor="middle" font-size="10" fill="#888">频次</text>
  <text x="270" y="256" text-anchor="middle" font-size="20" fill="#333">2</text>
  <rect x="300" y="178" width="44" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="322" y="191" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">★ 最小</text>

  <!-- Card 4 -> 2 (orange, tied max but larger) -->
  <rect x="345" y="194" width="110" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="214" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">值 v = 4</text>
  <text x="400" y="232" text-anchor="middle" font-size="10" fill="#888">频次</text>
  <text x="400" y="256" text-anchor="middle" font-size="20" fill="#333">2</text>
  <text x="400" y="278" text-anchor="middle" font-size="10" fill="#b85450">并列最多 但 4 &gt; 2</text>

  <!-- Arrow 3 -->
  <path d="M 270 282 L 270 300" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="295" font-size="11" fill="#4a7a3a">③ 取频次最大；并列取 min(v)</text>

  <!-- Result -->
  <rect x="190" y="304" width="160" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="331" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">ans = 2</text>
</svg>
