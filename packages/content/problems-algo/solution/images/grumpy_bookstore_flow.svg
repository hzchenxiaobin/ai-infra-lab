<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：定长滑动窗口维护「窗口内增益」</text>

  <!-- Box1: compute base -->
  <rect x="150" y="44" width="220" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">计算 base = Σ customers[i]·(1−grumpy[i])</text>
  <path d="M260,88 L260,108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: init window -->
  <rect x="120" y="110" width="280" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">gain = Σ customers[i]·grumpy[i]，i ∈ [0,X)；maxGain=gain</text>
  <path d="M260,154 L260,170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="260,172 340,210 260,248 180,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- Yes branch: down to box3 -->
  <path d="M260,248 L260,268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="262" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Box3: update gain -->
  <rect x="90" y="270" width="340" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">gain += customers[i]·grumpy[i]</text>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">− customers[i−X]·grumpy[i−X]</text>
  <path d="M260,314 L260,330" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box4: update maxGain, i++ -->
  <rect x="130" y="332" width="260" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="359" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">maxGain = max(maxGain, gain)；i++</text>

  <!-- loop back arrow: box4 right -> up -> diamond right -->
  <path d="M390,354 L440,354 L440,210 L340,210" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="285" font-size="11" fill="#888" filter="url(#rough2)">循环</text>

  <!-- No branch: diamond left -> left -> down -> return -->
  <path d="M180,210 L90,210 L90,372 L150,372" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="204" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Return box -->
  <rect x="150" y="350" width="220" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 base + maxGain</text>
</svg>
