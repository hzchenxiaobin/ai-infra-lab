<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">各赛事用户注册率：按赛事计数 ÷ 总用户数 = 注册率（%）</text>

  <!-- Register 表（左上） -->
  <text x="90" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Register 表</text>
  <rect x="20" y="64" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="45" y="80" text-anchor="middle" font-size="9" fill="#333">contest_id</text>
  <text x="110" y="80" text-anchor="middle" font-size="9" fill="#333">user_id</text>
  <line x1="70" y1="64" x2="70" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="88" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="103" text-anchor="middle" font-size="10" fill="#333">215</text>
  <text x="110" y="103" text-anchor="middle" font-size="10" fill="#333">6</text>
  <line x1="70" y1="88" x2="70" y2="110" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="110" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="125" text-anchor="middle" font-size="10" fill="#333">208</text>
  <text x="110" y="125" text-anchor="middle" font-size="10" fill="#333">2</text>
  <line x1="70" y1="110" x2="70" y2="132" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="132" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="147" text-anchor="middle" font-size="10" fill="#333">207</text>
  <text x="110" y="147" text-anchor="middle" font-size="10" fill="#333">2</text>
  <line x1="70" y1="132" x2="70" y2="154" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="90" y="172" text-anchor="middle" font-size="9" fill="#888">…（共 12 行注册）</text>

  <!-- GROUP BY 箭头 -->
  <path d="M165 120 L213 120" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="189" y="112" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="189" y="134" text-anchor="middle" font-size="9" fill="#446688">contest_id</text>

  <!-- 分组计数（中上） -->
  <rect x="215" y="64" width="150" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">按赛事分组计数</text>
  <text x="235" y="104" font-size="9.5" fill="#333">208 → 3 人</text>
  <text x="235" y="120" font-size="9.5" fill="#333">209 → 3 人</text>
  <text x="235" y="136" font-size="9.5" fill="#333">210 → 3 人</text>
  <text x="235" y="152" font-size="9.5" fill="#333">215 → 2 人</text>
  <text x="235" y="168" font-size="9.5" fill="#333">207 → 1 人</text>

  <!-- Users 表（左下，分母来源） -->
  <text x="90" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Users 表（分母来源）</text>
  <rect x="20" y="216" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="45" y="232" text-anchor="middle" font-size="9" fill="#333">user_id</text>
  <text x="110" y="232" text-anchor="middle" font-size="9" fill="#333">user_name</text>
  <line x1="70" y1="216" x2="70" y2="240" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="240" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="254" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="110" y="254" text-anchor="middle" font-size="10" fill="#333">Alice</text>
  <line x1="70" y1="240" x2="70" y2="260" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="260" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="274" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="110" y="274" text-anchor="middle" font-size="10" fill="#333">Bob</text>
  <line x1="70" y1="260" x2="70" y2="280" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="280" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="294" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="110" y="294" text-anchor="middle" font-size="10" fill="#333">Alex</text>
  <line x1="70" y1="280" x2="70" y2="300" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 标量子查询分母 -->
  <rect x="215" y="216" width="150" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="238" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">标量子查询（分母）</text>
  <text x="290" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">SELECT COUNT(*)</text>
  <text x="290" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">FROM Users</text>
  <text x="290" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 3</text>

  <path d="M165 258 L211 258" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="189" y="250" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">COUNT(*)</text>

  <!-- 除法 + ROUND -->
  <path d="M368 119 L416 200" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M368 258 L416 218" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="418" y="150" width="200" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="518" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">注册率公式</text>
  <text x="518" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">COUNT × 100.0</text>
  <text x="518" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">────────────</text>
  <text x="518" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold"> 总用户数(3)</text>
  <text x="518" y="256" text-anchor="middle" font-size="10" fill="#333">再 ROUND( , 2)</text>

  <!-- 结果 -->
  <path d="M620 210 L600 210" stroke="#b85450" stroke-width="0" fill="none"/>
  <text x="518" y="296" text-anchor="middle" font-size="9.5" fill="#888">如 215 → 2×100.0/3 = 66.67</text>

  <!-- 底部排序说明 -->
  <rect x="40" y="340" width="560" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="365" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键要点</text>
  <text x="60" y="388" font-size="10.5" fill="#333">① 分母用标量子查询 (SELECT COUNT(*) FROM Users)，对每组都是同一个常量</text>
  <text x="60" y="408" font-size="10.5" fill="#333">② × 100.0 强制浮点除法，避免整数除法截断（如 2/3→0）</text>
  <text x="60" y="428" font-size="10.5" fill="#333">③ ORDER BY percentage DESC, contest_id ASC：注册率先降序，并列按题号升序</text>
</svg>
