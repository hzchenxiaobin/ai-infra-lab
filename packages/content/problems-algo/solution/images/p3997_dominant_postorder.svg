<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：子树最大值自底向上传播（示例 1）</text>

  <!-- 图例 -->
  <circle cx="42" cy="48" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="52" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">支配节点 val == mx</text>
  <circle cx="42" cy="70" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="74" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">非支配 val &lt; mx</text>

  <!-- 边 -->
  <line x1="255" y1="75" x2="165" y2="155" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="255" y1="75" x2="348" y2="155" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="165" y1="155" x2="112" y2="240" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="165" y1="155" x2="205" y2="240" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="348" y1="155" x2="305" y2="240" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="348" y1="155" x2="398" y2="240" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 左侧上传大箭头 -->
  <path d="M 66 245 C 34 190, 52 120, 122 88" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="10" y="215" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">子树</text>
  <text x="10" y="231" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">max</text>
  <text x="10" y="247" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">上传</text>

  <!-- 节点：根 5（非支配） -->
  <circle cx="255" cy="75" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="255" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <!-- 节点 3（非支配） -->
  <circle cx="165" cy="155" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <!-- 节点 8（支配） -->
  <circle cx="348" cy="155" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="348" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">8</text>
  <!-- 叶子 -->
  <circle cx="112" cy="240" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="112" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">2</text>
  <circle cx="205" cy="240" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="205" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">4</text>
  <circle cx="305" cy="240" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="305" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">7</text>
  <circle cx="398" cy="240" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="398" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1</text>

  <!-- mx 标签 -->
  <rect x="283" y="64" width="80" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="323" y="77" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">mx=8 ≠ 5 ✗</text>

  <rect x="192" y="144" width="74" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="229" y="157" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">mx=4 ≠ 3 ✗</text>

  <rect x="378" y="144" width="56" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="406" y="157" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">mx=8 ✓</text>

  <rect x="85" y="266" width="54" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="112" y="278" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">mx=2 ✓</text>
  <rect x="178" y="266" width="54" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="278" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">mx=4 ✓</text>
  <rect x="278" y="266" width="54" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="305" y="278" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">mx=7 ✓</text>
  <rect x="371" y="266" width="54" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="398" y="278" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">mx=1 ✓</text>

  <!-- 公式框 -->
  <rect x="48" y="308" width="424" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">子树 max(x) = max( x.val , max(左子树) , max(右子树) )</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">孩子先算好 ⇒ 父亲 O(1) 合成；x.val == mx ⟺ 没有后代超过 x ⇒ 打 ✓</text>

  <text x="260" y="384" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">支配节点共 5 个：叶子 2、4、7、1 + 节点 8（3 和 5 被后代超过，不算）</text>
</svg>
