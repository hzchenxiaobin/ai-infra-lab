<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="20" y="26" font-size="13" fill="#333" filter="url(#rough2)">算法流程：逐元素维护值域 DP 表 f</text>

  <rect x="135" y="38" width="310" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 f[1..300][0..299] ← 0</text>

  <line x1="290" y1="70" x2="290" y2="83" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="135" y="84" width="310" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">按下标顺序取下一个元素 x</text>

  <line x1="290" y1="116" x2="290" y2="129" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="130" width="360" height="54" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 枚举 d = 0…299：前驱 v = x−d 或 x+d</text>
  <text x="290" y="172" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">g[d] = max(f[x−d][d], f[x+d][d]) + 1（末差恰为 d 的候选）</text>

  <line x1="290" y1="184" x2="290" y2="197" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="198" width="360" height="46" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 后缀最大：g[d] ← max(g[d], g[d+1])</text>
  <text x="290" y="236" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">把「末差 d′ ≥ d」的候选聚合到下标 d，一步可查</text>

  <line x1="290" y1="244" x2="290" y2="257" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="258" width="360" height="46" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ f[x][d] ← max(f[x][d], g[d], 1)</text>
  <text x="290" y="296" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1 代表单元素子序列 [x]，可接任意后继</text>

  <line x1="290" y1="304" x2="290" y2="317" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="290,318 370,352 290,386 210,352" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="356" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">还有元素？</text>

  <path d="M210,352 L70,352 L70,100 L133,100" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="345" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M370,352 L478,352 L478,410 L464,410" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="345" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="118" y="392" width="344" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="414" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">答案 = max f[v][0]　时间 O(n·V)　空间 O(V²)</text>
</svg>
