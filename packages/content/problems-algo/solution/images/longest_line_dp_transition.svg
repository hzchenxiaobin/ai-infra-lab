<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DP 状态转移：cell (i, j) 的四方向长度各由一个前驱决定</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">箭头从前驱指向当前格，颜色对应四方向</text>

  <!-- Grid: cell 70x70, origin x=80 y=60. Focus on cell (1,2) = current -->

  <!-- ===== Cells ===== -->
  <!-- (0,0) -->
  <rect x="80" y="60" width="70" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="100" text-anchor="middle" font-size="11" fill="#ccc">(0,0)</text>
  <!-- (0,1) - diagonal predecessor, orange -->
  <rect x="150" y="60" width="70" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="93" text-anchor="middle" font-size="11" fill="#d6a040">(0,1)</text>
  <text x="185" y="110" text-anchor="middle" font-size="9" fill="#d6a040">左上↖</text>
  <!-- (0,2) - vertical predecessor, blue -->
  <rect x="220" y="60" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="93" text-anchor="middle" font-size="11" fill="#446688">(0,2)</text>
  <text x="255" y="110" text-anchor="middle" font-size="9" fill="#446688">上↑</text>
  <!-- (0,3) - anti-diagonal predecessor, red -->
  <rect x="290" y="60" width="70" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="93" text-anchor="middle" font-size="11" fill="#b85450">(0,3)</text>
  <text x="325" y="110" text-anchor="middle" font-size="9" fill="#b85450">右上↗</text>

  <!-- (1,0) -->
  <rect x="80" y="130" width="70" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="170" text-anchor="middle" font-size="11" fill="#ccc">(1,0)</text>
  <!-- (1,1) - horizontal predecessor, green -->
  <rect x="150" y="130" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a">(1,1)</text>
  <text x="185" y="180" text-anchor="middle" font-size="9" fill="#4a7a3a">左←</text>
  <!-- (1,2) - current cell, highlighted -->
  <rect x="220" y="130" width="70" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">(i, j)</text>
  <text x="255" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">当前格</text>
  <!-- (1,3) -->
  <rect x="290" y="130" width="70" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="325" y="170" text-anchor="middle" font-size="11" fill="#ccc">(1,3)</text>

  <!-- (2,0)..(2,3) -->
  <rect x="80" y="200" width="70" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="240" text-anchor="middle" font-size="11" fill="#ccc">(2,0)</text>
  <rect x="150" y="200" width="70" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="240" text-anchor="middle" font-size="11" fill="#ccc">(2,1)</text>
  <rect x="220" y="200" width="70" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="255" y="240" text-anchor="middle" font-size="11" fill="#ccc">(2,2)</text>
  <rect x="290" y="200" width="70" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="325" y="240" text-anchor="middle" font-size="11" fill="#ccc">(2,3)</text>

  <!-- ===== Arrows from predecessors TO current cell (1,2) center=(255,165) ===== -->
  <!-- 1. Horizontal: (1,1) right edge (220,165) → (1,2) left edge (220,165) → pointing right -->
  <path d="M 192 165 L 216 165" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 2. Vertical: (0,2) bottom (255,130) → (1,2) top (255,130) → pointing down -->
  <path d="M 255 102 L 255 126" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 3. Diagonal: (0,1) bottom-right (220,130) → (1,2) top-left (220,130) → pointing down-right -->
  <path d="M 192 102 L 216 126" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 4. Anti-diagonal: (0,3) bottom-left (290,130) → (1,2) top-right (290,130) → pointing down-left -->
  <path d="M 322 102 L 298 126" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ====== Transition formulas on the right ====== -->
  <rect x="380" y="60" width="160" height="220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="460" y="84" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">转移方程</text>
  <text x="460" y="100" text-anchor="middle" font-size="9.5" fill="#888">mat[i][j] == 1 时：</text>

  <text x="392" y="124" font-size="10.5" fill="#4a7a3a" font-weight="bold">h[j] = h[j−1] + 1</text>
  <text x="392" y="138" font-size="9" fill="#888">← 同行左邻（已更新）</text>

  <text x="392" y="160" font-size="10.5" fill="#446688" font-weight="bold">v[j] = v[j] + 1</text>
  <text x="392" y="174" font-size="9" fill="#888">↑ 上行同列（旧值）</text>

  <text x="392" y="196" font-size="10.5" fill="#d6a040" font-weight="bold">d[j] = prev + 1</text>
  <text x="392" y="210" font-size="9" fill="#888">↖ 左上（prev 缓存旧值）</text>

  <text x="392" y="232" font-size="10.5" fill="#b85450" font-weight="bold">a[j] = a[j+1] + 1</text>
  <text x="392" y="246" font-size="9" fill="#888">↗ 右上（旧值未覆盖）</text>

  <rect x="390" y="258" width="140" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">mat[i][j]==0 → 全置 0</text>

  <!-- bottom note -->
  <rect x="30" y="300" width="510" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="324" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">滚动数组：4 个长度为 n 的一维数组即可</text>
  <text x="48" y="346" font-size="10.5" fill="#444">① h[j] 依赖 h[j−1]（本行已更新）→ 直接读</text>
  <text x="48" y="362" font-size="10.5" fill="#444">② v[j] 依赖 v[j]（上行旧值，未覆盖）→ 直接读</text>
  <text x="290" y="346" font-size="10.5" fill="#444">③ d[j] 依赖 d[j−1]（已被覆盖）→ 用 prev 缓存</text>
  <text x="290" y="362" font-size="10.5" fill="#444">④ a[j] 依赖 a[j+1]（未覆盖）→ 直接读</text>
</svg>
