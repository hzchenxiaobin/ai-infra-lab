<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：遍历 plants，按水量是否够分两支</text>

  <!-- 1. Init -->
  <rect x="170" y="46" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#333">① ans = 0, cur = capacity</text>

  <path d="M 260 84 L 260 102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. For loop -->
  <rect x="150" y="102" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="12" fill="#333">② for i = 0 to n−1</text>

  <path d="M 260 140 L 260 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. Decision diamond -->
  <polygon points="260,158 380,210 260,262 140,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11.5" fill="#333">cur ≥ plants[i] ?</text>
  <text x="260" y="222" text-anchor="middle" font-size="10" fill="#888">(水够浇灌?)</text>

  <!-- Yes → left -->
  <path d="M 140 210 L 80 210 L 80 272" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="200" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- No → right -->
  <path d="M 380 210 L 440 210 L 440 272" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="200" font-size="10.5" fill="#d6a040" font-weight="bold">否</text>

  <!-- Yes branch box -->
  <rect x="20" y="272" width="120" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += 1</text>
  <text x="80" y="310" text-anchor="middle" font-size="10.5" fill="#333">cur −= plants[i]</text>
  <text x="80" y="325" text-anchor="middle" font-size="9.5" fill="#888">直走 1 步</text>

  <!-- No branch box -->
  <rect x="380" y="272" width="120" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += 2i+1</text>
  <text x="440" y="310" text-anchor="middle" font-size="10.5" fill="#333">cur = cap − plants[i]</text>
  <text x="440" y="325" text-anchor="middle" font-size="9.5" fill="#888">折返取水</text>

  <!-- merge → back to loop (left side, dashed) -->
  <path d="M 80 332 L 80 370 L 40 370 L 40 121 L 148 121" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="46" y="250" font-size="10" fill="#888" font-weight="bold">下一个 i</text>

  <!-- merge from right branch -->
  <path d="M 440 332 L 440 370 L 260 370" stroke="#666" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 80 370 L 260 370" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- exit from for loop → return (right side) -->
  <path d="M 370 121 L 470 121 L 470 400 L 360 400" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="478" y="260" font-size="10" fill="#b85450" font-weight="bold">循</text>
  <text x="478" y="274" font-size="10" fill="#b85450" font-weight="bold">环</text>
  <text x="478" y="288" font-size="10" fill="#b85450" font-weight="bold">结</text>
  <text x="478" y="302" font-size="10" fill="#b85450" font-weight="bold">束</text>

  <!-- Return box -->
  <rect x="200" y="386" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>

  <!-- merge → return (dashed, from bottom center) -->
  <path d="M 260 370 L 260 386" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
</svg>
