<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="290" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">流程：建反图 → 预检 -1 → 二分答案（BFS 判可行）</text>

  <!-- 左列说明卡 -->
  <rect x="14" y="56" width="134" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="81" y="74" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">check(x)：判可行</text>
  <text x="81" y="90" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">反图上从 0 出发</text>
  <text x="81" y="102" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">只走权 ≤ x 的边</text>
  <text x="81" y="114" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">BFS 计数 cnt == n</text>

  <rect x="14" y="122" width="134" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="81" y="140" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">单调性 ⇒ 可二分</text>
  <text x="81" y="156" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">x ↑ ⇒ 可用边只增</text>
  <text x="81" y="168" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">可达点集不减</text>
  <text x="81" y="180" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">可行则永远可行</text>

  <rect x="14" y="188" width="134" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="81" y="206" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">threshold 烟雾弹</text>
  <text x="81" y="222" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">BFS 树每点 1 入边</text>
  <text x="81" y="234" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">原图出度 ≤1 ≤threshold</text>
  <text x="81" y="246" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">代码全程未用</text>

  <rect x="14" y="254" width="134" height="58" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="81" y="272" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="81" y="288" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">时间 O((n+m)·log W)</text>
  <text x="81" y="300" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">W ≤ 10^6，约 20 轮</text>
  <text x="81" y="312" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">空间 O(n+m)</text>

  <!-- 主干 -->
  <ellipse cx="310" cy="40" rx="62" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">输入 n, edges, threshold</text>

  <path d="M 310 55 L 310 62" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="215" y="66" width="190" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="80" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">建反图：rg[B].push((W, A))</text>
  <text x="310" y="93" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">顺便记录最大边权 maxW</text>

  <path d="M 310 102 L 310 110" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 310 112 L 400 146 L 310 180 L 220 146 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="141" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">check(maxW)</text>
  <text x="310" y="156" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">可行？</text>

  <path d="M 400 146 C 416 146, 424 146, 432 146" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="414" y="138" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="436" y="131" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="471" y="150" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">return -1</text>

  <path d="M 310 180 L 310 196" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="192" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="215" y="200" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="219" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">二分：lo = 1，hi = maxW</text>

  <path d="M 310 230 L 310 238" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 310 240 L 400 272 L 310 304 L 220 272 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="267" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">check(mid)</text>
  <text x="310" y="282" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">可行？</text>

  <path d="M 220 272 C 190 272, 190 218, 213 218" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="176" y="246" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是 hi=mid</text>

  <path d="M 400 272 C 430 272, 430 218, 407 218" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="452" y="246" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">否 lo=mid+1</text>

  <path d="M 310 304 L 310 316" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <ellipse cx="310" cy="332" rx="64" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="337" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return lo = 最小可行 x</text>

  <text x="290" y="358" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">连 maxW 都不可行 ⇒ 图根本无法让所有点到 0 ⇒ -1</text>
</svg>
