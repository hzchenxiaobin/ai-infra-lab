<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：nums1=[2,3,4,5,9]，nums2=[8,8,4,4,4]</text>

  <!-- Case A header -->
  <text x="141" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">方案 A：目标 (a,b) = (9,4)</text>
  <!-- Case B header -->
  <text x="381" y="50" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">方案 B：目标 (4,9)，末位先换 +1</text>

  <!-- Table A: x 22..260 -->
  <rect x="22" y="58" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="54" y="58" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="112" y="58" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="192" y="58" width="68" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="38" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="83" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(x,y)</text>
  <text x="152" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">判定</text>
  <text x="226" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作</text>

  <rect x="22" y="84" width="238" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="100" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="83" y="100" text-anchor="middle" font-size="10" fill="#333">(2,8)</text>
  <text x="152" y="100" text-anchor="middle" font-size="10" fill="#b85450">8≤4 ✗ → 须换</text>
  <text x="226" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">⇄ +1</text>

  <rect x="22" y="108" width="238" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="124" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="83" y="124" text-anchor="middle" font-size="10" fill="#333">(3,8)</text>
  <text x="152" y="124" text-anchor="middle" font-size="10" fill="#b85450">8≤4 ✗ → 须换</text>
  <text x="226" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">⇄ +1</text>

  <rect x="22" y="132" width="238" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="148" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="83" y="148" text-anchor="middle" font-size="10" fill="#333">(4,4)</text>
  <text x="152" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">原位合法</text>
  <text x="226" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">+0</text>

  <rect x="22" y="156" width="238" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="172" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="83" y="172" text-anchor="middle" font-size="10" fill="#333">(5,4)</text>
  <text x="152" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a">原位合法</text>
  <text x="226" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a">+0</text>

  <rect x="22" y="180" width="238" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">小计 cntA = 2</text>

  <!-- Table B: x 262..500 -->
  <rect x="262" y="58" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="294" y="58" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="352" y="58" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="432" y="58" width="68" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="278" y="75" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i</text>
  <text x="323" y="75" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(x,y)</text>
  <text x="392" y="75" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">判定</text>
  <text x="466" y="75" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">操作</text>

  <rect x="262" y="84" width="238" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="100" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="323" y="100" text-anchor="middle" font-size="10" fill="#333">(2,8)</text>
  <text x="392" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a">原位合法</text>
  <text x="466" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a">+0</text>

  <rect x="262" y="108" width="238" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="124" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="323" y="124" text-anchor="middle" font-size="10" fill="#333">(3,8)</text>
  <text x="392" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">原位合法</text>
  <text x="466" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">+0</text>

  <rect x="262" y="132" width="238" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="148" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="323" y="148" text-anchor="middle" font-size="10" fill="#333">(4,4)</text>
  <text x="392" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">原位合法</text>
  <text x="466" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">+0</text>

  <rect x="262" y="156" width="238" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="172" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="323" y="172" text-anchor="middle" font-size="10" fill="#333">(5,4)</text>
  <text x="392" y="172" text-anchor="middle" font-size="10" fill="#b85450">5≤4 ✗ → 须换</text>
  <text x="466" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">⇄ +1</text>

  <rect x="262" y="180" width="238" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="381" y="197" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">小计 cntB = 1 + 1 = 2</text>

  <!-- result -->
  <rect x="90" y="224" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ans = min(cntA, cntB) = min(2, 2) = 2 ✓</text>

  <!-- final state -->
  <text x="260" y="286" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">方案 B 的两次交换（i=4 先换末位，i=3 再换）后的终态：</text>

  <text x="22" y="312" font-size="12" fill="#446688" font-weight="bold">nums1</text>
  <rect x="90" y="292" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="292" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="292" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="222" y="292" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="266" y="292" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="311" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="154" y="311" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="198" y="311" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="242" y="311" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="286" y="311" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="318" y="311" font-size="11" fill="#4a7a3a" font-weight="bold">= max ✓</text>

  <text x="22" y="352" font-size="12" fill="#4a7a3a" font-weight="bold">nums2</text>
  <rect x="90" y="332" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="332" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="332" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="222" y="332" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="266" y="332" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="351" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="154" y="351" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="198" y="351" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="242" y="351" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="286" y="351" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">9</text>
  <text x="318" y="351" font-size="11" fill="#4a7a3a" font-weight="bold">= max ✓</text>

  <text x="242" y="329" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">⇄</text>
  <text x="286" y="329" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">⇄</text>

  <text x="260" y="392" text-anchor="middle" font-size="11" fill="#888">nums1 末位 4 = max(2,3,4,4,4)；nums2 末位 9 = max(8,8,4,5,9)</text>
  <text x="260" y="414" text-anchor="middle" font-size="11" fill="#888">两条件同时满足，答案 2 ✓</text>
</svg>
