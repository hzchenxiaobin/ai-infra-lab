<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：栈 = 从扫描位置向右的「可见建筑」，高度严格递增</text>

  <!-- 楼群 heights = [6,4,8,5,2,7]，基线 y=310，比例 16px/单位 -->
  <rect x="56" y="214" width="44" height="96" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <rect x="124" y="246" width="44" height="64" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <rect x="192" y="182" width="44" height="128" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="260" y="230" width="44" height="80" rx="3" fill="#eeeeee" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="328" y="278" width="44" height="32" rx="3" fill="#eeeeee" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="396" y="198" width="44" height="112" rx="3" fill="#eeeeee" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="78" y="208" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>
  <text x="146" y="240" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="214" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <text x="282" y="224" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <text x="350" y="272" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="418" y="192" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">7</text>

  <path d="M 46 310 L 456 310" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="146" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="214" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="282" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="350" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="418" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>

  <!-- 视线：8 挡住右边所有楼 -->
  <path d="M 238 182 L 456 182" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="247" y="170" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">8 挡住右边所有楼 → 3、4、5 都不在栈里</text>

  <!-- 查询阈值线 h=6 -->
  <path d="M 100 214 L 456 214" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="104" y="207" font-size="11" fill="#d6a040" filter="url(#rough2)">h = 6</text>

  <!-- 查询 [0,1]：从 1 跳到 2 -->
  <path d="M 152 238 Q 172 200 206 186" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="116" y="200" font-size="10.5" fill="#d6a040" filter="url(#rough2)">查询 [0,1]</text>

  <!-- 扫描位置标注 -->
  <text x="112" y="352" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（还没扫到，不是候选）</text>

  <!-- 栈芯片 -->
  <rect x="200" y="340" width="100" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="359" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">栈 = [2:8]</text>
  <text x="312" y="359" font-size="10.5" fill="#666" filter="url(#rough2)">扫到 i=1 时：下标 &gt; 1 的可见建筑，仅此一栋</text>

  <!-- 底部注释 -->
  <rect x="30" y="378" width="460" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="393" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">查询 [0,1]（y=1，h=6）：栈上二分第一个高度 &gt; 6 → 命中 2(8)</text>
  <text x="260" y="408" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">答案必在栈中：t 是最左答案 ⟹ t 左侧无楼高过 h、也无楼 ≥ heights[t] ⟹ t 是前缀最大值</text>
</svg>
