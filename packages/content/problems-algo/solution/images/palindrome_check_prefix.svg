<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">前缀奇偶掩码：pref[i] = s[0..i-1] 各字符奇偶性的 26 位掩码</text>

  <!-- string row -->
  <text x="40" y="58" font-size="11" fill="#888" font-weight="bold">s =</text>
  <rect x="75" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="111" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="147" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="183" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="219" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="92" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="128" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="164" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="200" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="236" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>

  <!-- prefix mask row -->
  <text x="40" y="118" font-size="11" fill="#888" font-weight="bold">pref:</text>
  <text x="40" y="140" font-size="10.5" fill="#888">pref[0]</text>
  <rect x="92" y="124" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <text x="40" y="170" font-size="10.5" fill="#888">pref[1]</text>
  <rect x="92" y="154" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="173" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="134" y="173" font-size="9.5" fill="#4a7a3a">^a</text>

  <text x="40" y="200" font-size="10.5" fill="#888">pref[2]</text>
  <rect x="92" y="184" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="203" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="134" y="203" font-size="9.5" fill="#4a7a3a">^b</text>

  <text x="40" y="230" font-size="10.5" fill="#888">pref[3]</text>
  <rect x="92" y="214" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="233" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="134" y="233" font-size="9.5" fill="#4a7a3a">^c</text>

  <text x="40" y="260" font-size="10.5" fill="#888">pref[4]</text>
  <rect x="92" y="244" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>
  <text x="138" y="263" font-size="9.5" fill="#4a7a3a">^d</text>

  <text x="40" y="290" font-size="10.5" fill="#888">pref[5]</text>
  <rect x="92" y="274" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">14</text>
  <text x="140" y="293" font-size="9.5" fill="#4a7a3a">^a</text>

  <text x="220" y="118" font-size="10.5" fill="#888" font-weight="bold">递推：pref[i+1] = pref[i] ^ (1 &lt;&lt; (s[i]−'a'))</text>
  <text x="220" y="138" font-size="10" fill="#888">同字符出现两次 → XOR 抵消 → 偶频位归 0</text>
  <text x="220" y="156" font-size="10" fill="#888">出现奇数次 → 对应位为 1</text>

  <!-- query demo -->
  <rect x="220" y="172" width="320" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="380" y="192" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">查询 [0, 3, k]：子串 "abcd"</text>
  <text x="240" y="212" font-size="10.5" fill="#444">mask = pref[4] ^ pref[0] = 15 ^ 0 = 15</text>
  <text x="240" y="230" font-size="10.5" fill="#444">odd = popcount(15) = 4</text>
  <text x="240" y="246" font-size="10.5" fill="#b85450" font-weight="bold">need = ⌊4/2⌋ = 2  →  2 &lt;= k ?</text>

  <!-- XOR cancel illustration -->
  <rect x="220" y="262" width="320" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">XOR 抵消：同字符两次出现互相抵消</text>
  <text x="240" y="304" font-size="10.5" fill="#444">查询 [0, 4, k]：子串 "abcda"</text>
  <text x="240" y="322" font-size="10.5" fill="#444">mask = pref[5] ^ pref[0] = 14 ^ 0 = 14</text>
  <text x="240" y="340" font-size="10.5" fill="#444">a 出现 2 次（偶）→ bit0 抵消归 0</text>
  <text x="240" y="356" font-size="10.5" fill="#4a7a3a" font-weight="bold">odd = popcount(14) = 3, need = ⌊3/2⌋ = 1</text>
</svg>
