<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：长度 5 回文 = a b c b a（外对同、内对同、中心任意）</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">固定中心下标 j → 左侧「ab」数 × 右侧「ba」数，左右独立可乘</text>

  <!-- 5 cells: values 1 0 3 0 1, centers x=144,202,260,318,376, y=70..114 -->
  <rect x="119" y="70" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="144" y="62" text-anchor="middle" font-size="10" fill="#446688">外 a</text>

  <rect x="177" y="70" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <text x="202" y="62" text-anchor="middle" font-size="10" fill="#4a7a3a">内 b</text>

  <rect x="235" y="70" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <text x="260" y="62" text-anchor="middle" font-size="10" fill="#d6a040">中 c</text>

  <rect x="293" y="70" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <text x="318" y="62" text-anchor="middle" font-size="10" fill="#4a7a3a">内 b</text>

  <rect x="351" y="70" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="376" y="62" text-anchor="middle" font-size="10" fill="#446688">外 a</text>

  <!-- Outer-pair arc (a==a): pos1 top -> pos5 top -->
  <path d="M 144 66 Q 260 18 376 66" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="260" y="30" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">外对相同 a = a</text>

  <!-- Inner-pair arc (b==b): pos2 bottom -> pos4 bottom -->
  <path d="M 202 118 Q 260 150 318 118" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">内对相同 b = b</text>

  <!-- Brackets under cells -->
  <text x="173" y="172" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">左侧「ab」</text>
  <path d="M 119 130 L 119 162 L 227 162 L 227 130" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="260" y="172" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">中心 c（任意）</text>

  <text x="347" y="172" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">右侧「ba」</text>
  <path d="M 293 130 L 293 162 L 401 162 L 401 130" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- Independence note -->
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">左侧选法 与 右侧选法 互相独立 → 可直接相乘</text>

  <!-- Formula box -->
  <rect x="36" y="214" width="448" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">固定中心下标 j 的贡献：</text>
  <text x="260" y="256" text-anchor="middle" font-size="12.5" fill="#333">贡献(j) = Σ_{a,b}  左侧「ab」数 × 右侧「ba」数</text>

  <!-- Footer -->
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#888">枚举每个下标 j 作中心，求和即得答案</text>
  <text x="260" y="306" text-anchor="middle" font-size="10" fill="#aaa">键值仅 0–9 共 10 种 → left2 / right2 只需 10×10 表</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#aaa">按位置计数：不同下标组合算不同子序列（示例 2「0000000」= C(7,5)=21）</text>
</svg>
