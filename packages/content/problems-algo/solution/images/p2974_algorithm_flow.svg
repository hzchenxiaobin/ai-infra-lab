<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 相邻两两交换</text>

  <!-- start -->
  <ellipse cx="55" cy="84" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="89" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 99 84 L 126 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="128" y="64" width="118" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="187" y="89" text-anchor="middle" font-size="12" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">排序 nums（升序）</text>

  <path d="M 246 84 L 274 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- i = 0 -->
  <rect x="276" y="66" width="66" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="309" y="89" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">i = 0</text>

  <path d="M 309 102 L 309 130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="309,134 379,170 309,206 239,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="309" y="175" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- no: return -->
  <path d="M 239 170 L 186 170" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="212" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="68" y="150" width="118" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="127" y="175" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 nums</text>

  <!-- yes: swap -->
  <path d="M 309 206 L 309 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="322" y="224" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="222" y="236" width="174" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="309" y="262" text-anchor="middle" font-size="12" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">swap(nums[i], nums[i+1])</text>

  <!-- loop back -->
  <path d="M 396 257 L 452 257 L 452 170 L 385 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="459" y="218" font-size="11" fill="#446688" filter="url(#rough2)">i += 2</text>

  <!-- notes -->
  <rect x="48" y="300" width="424" height="64" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">① n 为偶数 ⇒ i 按步长 2 推进，nums[i+1] 永不越界；</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">② 排序 O(n log n) 主导，交换共 n/2 次仅 O(n)；</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">③ 值域 ≤ 100 时可换计数排序，整体 O(n + C)。</text>
</svg>
