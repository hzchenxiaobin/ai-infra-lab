<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">位掩码编码缩写：1=保留该位字母，0=并入数字段</text>

  <!-- position index row -->
  <text x="70" y="68" font-size="11" fill="#888" font-weight="bold">位置 i:</text>
  <text x="150" y="68" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="210" y="68" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="270" y="68" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="330" y="68" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="390" y="68" text-anchor="middle" font-size="11" fill="#888">4</text>

  <!-- target row -->
  <text x="70" y="100" font-size="12" fill="#888" font-weight="bold">target:</text>
  <rect x="122" y="82" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="106" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="182" y="82" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="106" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">p</text>
  <rect x="242" y="82" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="106" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">p</text>
  <rect x="302" y="82" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="106" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">l</text>
  <rect x="362" y="82" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="106" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>

  <!-- mask row -->
  <text x="70" y="146" font-size="12" fill="#888" font-weight="bold">mask:</text>
  <rect x="122" y="128" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="152" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="182" y="128" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="152" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">0</text>
  <rect x="242" y="128" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="152" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">0</text>
  <rect x="302" y="128" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="152" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">0</text>
  <rect x="362" y="128" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="152" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- arrows from mask to abbreviation -->
  <path d="M 150 164 L 150 188" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 164 L 210 188" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 164 L 270 188" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 164 L 330 188" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 164 L 390 188" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- abbreviation result -->
  <text x="70" y="206" font-size="12" fill="#888" font-weight="bold">abbr:</text>
  <rect x="122" y="190" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="220" y="190" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">3</text>
  <rect x="362" y="190" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <text x="448" y="212" font-size="11" fill="#888">长度 = 3</text>

  <!-- length formula box -->
  <rect x="40" y="240" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="262" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">缩写长度 = popcount(mask) + 零段个数</text>
  <text x="290" y="282" text-anchor="middle" font-size="11" fill="#555">每个保留位贡献 1 个字母；每个连续 0 段合并成 1 个数字</text>

  <!-- conflict detection section -->
  <text x="290" y="324" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">冲突判定：mask &amp; diff == 0 则与该词冲突</text>

  <!-- diff row: blade -->
  <text x="70" y="350" font-size="12" fill="#888" font-weight="bold">diff(blade):</text>
  <rect x="180" y="334" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="354" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="222" y="334" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="354" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="264" y="334" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="354" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="306" y="334" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="354" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="348" y="334" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="354" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="410" y="354" font-size="11" fill="#888">(b≠a,l≠p,a≠p,d≠l,e=e)</text>

  <!-- AND result -->
  <text x="70" y="392" font-size="12" fill="#888" font-weight="bold">mask &amp; diff:</text>
  <rect x="180" y="376" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="396" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="222" y="376" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="242" y="396" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="264" y="376" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="284" y="396" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="306" y="376" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="326" y="396" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="348" y="376" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="368" y="396" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <text x="410" y="396" font-size="12" fill="#4a7a3a" font-weight="bold">≠ 0 → 不冲突 ✓</text>
</svg>
