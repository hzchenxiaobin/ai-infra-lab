<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：求和 → 降序排序 → 累减到非正</text>

  <rect x="110" y="45" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="200" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">total = sum(apple)</text>

  <path d="M 200 85 L 200 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="108" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="133" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">capacity 按容量降序排序</text>

  <path d="M 200 148 L 200 167" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="171" width="180" height="40" fill="#eef2f7" stroke="#8aa0b8" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="196" text-anchor="middle" font-size="12.5" fill="#556" font-weight="bold" filter="url(#rough2)">k = 0（已选箱数）</text>

  <path d="M 200 211 L 200 230" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="234" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="253" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">total −= capacity[k]</text>
  <text x="200" y="270" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">k++</text>

  <path d="M 200 278 L 200 290" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="200,292 272,322 200,352 128,322" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="327" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">total ≤ 0 ?</text>

  <path d="M 272 322 L 326 322" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="312" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="330" y="302" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="395" y="327" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return k</text>

  <path d="M 128 322 L 62 322 L 62 256 L 104 256" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="92" y="312" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否，继续拿</text>

  <rect x="352" y="108" width="152" height="112" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="428" y="130" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">贪心不变式</text>
  <text x="428" y="150" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">每一步都拿当前</text>
  <text x="428" y="166" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">剩余最大的箱子</text>
  <text x="428" y="188" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">前 k 大之和是任意</text>
  <text x="428" y="204" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">k 个箱子容量和的</text>
  <text x="428" y="212" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)"></text>
  <text x="428" y="214" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">上界</text>
  <path d="M 352 164 L 294 164" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
</svg>
