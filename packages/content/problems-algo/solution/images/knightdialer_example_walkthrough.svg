<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 2</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">dp[i][d] = 长度 i、末位为 d 的合法号码数</text>

  <!-- ===== DP Table ===== -->
  <!-- Header row: digit labels -->
  <rect x="40" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="71" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">d</text>
  <rect x="80" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="120" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="200" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="240" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="280" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="320" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <rect x="360" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="400" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="440" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <rect x="480" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="71" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">Σ</text>

  <!-- Row: dp[1] (all 1s) -->
  <rect x="40" y="84" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp[1]</text>
  <rect x="80" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="320" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="360" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="400" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="440" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="480" y="84" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="103" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">10</text>

  <!-- Row: dp[2] -->
  <rect x="40" y="116" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="135" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dp[2]</text>
  <rect x="80" y="116" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="120" y="116" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="116" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="200" y="116" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="240" y="116" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="280" y="116" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="135" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="320" y="116" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="135" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="360" y="116" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="400" y="116" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="440" y="116" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="480" y="116" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="135" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">20</text>

  <!-- ===== Computation details ===== -->
  <text x="30" y="172" font-size="11" fill="#446688" font-weight="bold">逐格计算（以 4、6、5 为例）：</text>

  <!-- dp[2][4] computation -->
  <rect x="30" y="182" width="160" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="198" font-size="10" fill="#333" font-weight="bold">dp[2][4]:</text>
  <text x="40" y="212" font-size="10" fill="#333">N(4)={0,3,9}</text>
  <text x="40" y="226" font-size="10" fill="#d6a040" font-weight="bold">= 1+1+1 = 3</text>

  <!-- dp[2][6] computation -->
  <rect x="200" y="182" width="160" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="210" y="198" font-size="10" fill="#333" font-weight="bold">dp[2][6]:</text>
  <text x="210" y="212" font-size="10" fill="#333">N(6)={0,1,7}</text>
  <text x="210" y="226" font-size="10" fill="#d6a040" font-weight="bold">= 1+1+1 = 3</text>

  <!-- dp[2][5] computation -->
  <rect x="370" y="182" width="160" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="198" font-size="10" fill="#333" font-weight="bold">dp[2][5]:</text>
  <text x="380" y="212" font-size="10" fill="#333">N(5)=∅（孤立）</text>
  <text x="380" y="226" font-size="10" fill="#b85450" font-weight="bold">= 0</text>

  <!-- ===== Summary ===== -->
  <rect x="30" y="248" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">求和：2+2+2+2+3+0+3+2+2+2 = 20</text>
  <text x="280" y="284" text-anchor="middle" font-size="10" fill="#888">4 和 6 各有 3 个骑士邻居 → 贡献最大；5 孤立 → 贡献 0</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="308" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="320" font-size="10" fill="#555">初始值 dp[1]</text>
  <rect x="150" y="308" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="170" y="320" font-size="10" fill="#555">3 个邻居（最大贡献）</text>
  <rect x="320" y="308" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="340" y="320" font-size="10" fill="#555">孤立（0 贡献）</text>
  <rect x="450" y="308" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <text x="470" y="320" font-size="10" fill="#555">最终答案</text>

  <!-- Note -->
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888">每步转移只依赖上一步 → 滚动数组压成 O(1) 空间</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">n=3131 时需矩阵快速幂优化到 O(log n)</text>
</svg>
