<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：转十六进制 → 逐字符校验映射</text>

  <!-- Step 1: input num (string) -->
  <rect x="30" y="54" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="72" text-anchor="middle" font-size="10.5" fill="#888">输入</text>
  <text x="70" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">num (str)</text>

  <path d="M 110 76 L 140 76" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: stoll -> long long -->
  <rect x="140" y="54" width="90" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="185" y="72" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">转数值</text>
  <text x="185" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">stoll / long long</text>

  <path d="M 230 76 L 260 76" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: to uppercase hex -->
  <rect x="260" y="54" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="72" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">转大写 hex</text>
  <text x="310" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"2 6 B"</text>

  <path d="M 360 76 L 390 76" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: loop char by char -->
  <rect x="390" y="54" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">逐字符处理</text>
  <text x="440" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">for ch in hex</text>

  <!-- arrow down from loop box -->
  <path d="M 440 98 L 440 120" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: ch in {2..9}? -->
  <polygon points="440,124 510,168 440,212 370,168" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ch ∈</text>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">{'2'..'9'}?</text>

  <!-- YES branch -> ERROR (right) -->
  <path d="M 510 168 L 540 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="525" y="162" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">是</text>

  <rect x="540" y="152" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="585" y="173" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">"ERROR"</text>

  <!-- NO branch -> map char (left/down) -->
  <path d="M 370 168 L 300 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="335" y="162" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- map char box -->
  <rect x="180" y="152" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="173" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0→O, 1→I, A-F→保留</text>

  <!-- arrow down: next char? -->
  <path d="M 240 184 L 240 206" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- next char decision -->
  <polygon points="240,210 300,238 240,266 180,238" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="242" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">还有字符?</text>

  <!-- yes -> back up to loop (right side) -->
  <path d="M 300 238 Q 440 238 440 120" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="232" text-anchor="middle" font-size="9.5" fill="#446688">是，取下一字符</text>

  <!-- no -> return result -->
  <path d="M 180 238 L 120 238" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="30" y="222" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="75" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回结果串</text>

  <!-- ===== Example walkthrough below ===== -->
  <text x="40" y="294" font-size="11" fill="#888" font-weight="bold">以 num = "257" 为例：</text>

  <rect x="40" y="306" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="68" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"257"</text>

  <path d="M 96 321 L 122 321" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="122" y="306" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"101"</text>

  <path d="M 178 321 L 204 321" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="204" y="306" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="249" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">I, O, I</text>

  <path d="M 294 321 L 320 321" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="320" y="306" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"IOI"</text>

  <text x="430" y="326" font-size="10.5" fill="#888">1→I, 0→O, 1→I，无 2-9</text>
</svg>
