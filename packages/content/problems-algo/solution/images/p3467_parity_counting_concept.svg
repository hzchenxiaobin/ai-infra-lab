<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">替换后值域只剩 {0,1}：数出个数 = 排好序</text>

  <text x="78" y="62" text-anchor="end" font-size="11" fill="#888">nums:</text>
  <rect x="90" y="44" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="62" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="150" y="44" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="62" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="210" y="44" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="62" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="270" y="44" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="62" text-anchor="middle" font-size="11" fill="#333">1</text>

  <text x="117" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">偶</text>
  <text x="177" y="84" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">奇</text>
  <text x="237" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">偶</text>
  <text x="297" y="84" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">奇</text>

  <path d="M 200 92 L 200 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="106" font-size="10" fill="#666">偶 → 0，奇 → 1</text>

  <text x="78" y="134" text-anchor="end" font-size="11" fill="#888">替换后:</text>
  <rect x="90" y="116" width="54" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="134" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="150" y="116" width="54" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="210" y="116" width="54" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="134" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="270" y="116" width="54" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>

  <text x="340" y="128" font-size="11" fill="#b85450" font-weight="bold">值域坍缩为 {0,1}</text>
  <text x="340" y="144" font-size="9.5" fill="#888">非递减序唯一确定</text>

  <path d="M 200 148 L 200 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="162" font-size="10" fill="#666">非递减排序</text>

  <rect x="90" y="172" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="150" y="172" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="210" y="172" width="54" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="270" y="172" width="54" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <text x="144" y="218" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">evenCnt = 2 个 0</text>
  <text x="297" y="218" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">oddCnt = 2 个 1</text>

  <rect x="40" y="232" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">01 数组的非递减序是唯一的：0 全在前、1 全在后</text>
  <text x="260" y="274" text-anchor="middle" font-size="10" fill="#b85450">频次 → 位置，比较失去意义（计数排序思想）</text>

  <rect x="40" y="294" width="440" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">一趟数出 evenCnt，直接拼 [0]×evenCnt + [1]×(n − evenCnt)</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#555">排序 O(n log n) 退化为计数 O(n) ⭐</text>
</svg>
