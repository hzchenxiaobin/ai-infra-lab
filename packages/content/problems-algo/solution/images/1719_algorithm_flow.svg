<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：建邻接表 → 按度排序 → 逐节点找父 + 验证嵌套</text>

  <!-- Step 1: build adj -->
  <rect x="60" y="48" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 构建 adj 邻接表</text>
  <text x="160" y="84" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">每个 pair 双向加入</text>

  <!-- Step 2: sort -->
  <rect x="300" y="48" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 按度降序排序</text>
  <text x="400" y="84" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">nodes[0] = 度最大节点</text>

  <!-- arrows -->
  <path d="M 260 72 L 300 72" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 98 L 400 118" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: check root (decision diamond) -->
  <polygon points="400,122 490,162 400,202 310,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="156" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">deg[nodes[0]]</text>
  <text x="400" y="170" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">== n−1 ?</text>
  <text x="400" y="184" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(根与所有节点配对)</text>

  <!-- No → return 0 -->
  <path d="M 490 162 L 520 162" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="498" y="156" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">No</text>
  <rect x="500" y="148" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="526" y="167" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- Yes → loop -->
  <path d="M 400 202 L 400 222" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="216" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Yes</text>

  <!-- Step 4: loop header -->
  <rect x="120" y="226" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 遍历每个非根节点 x = nodes[i]</text>
  <text x="280" y="260" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(i = 1 .. n−1，跳过 nodes[0] = 根)</text>

  <path d="M 280 268 L 280 286" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: find parent (decision diamond) -->
  <polygon points="280,290 380,325 280,360 180,325" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">向左扫描找到</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">邻居 parent ?</text>
  <text x="280" y="346" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(最小度 ≥ deg(x))</text>

  <!-- No parent → return 0 -->
  <path d="M 180 325 L 120 325" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="319" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">No</text>
  <rect x="68" y="311" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="94" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- Yes → verify -->
  <path d="M 280 360 L 280 378" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="374" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Yes</text>

  <!-- Step 6: verify superset (decision) -->
  <polygon points="280,382 390,417 280,452 170,417" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">adj[x]\{p} ⊆ adj[p]</text>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">成立 ?</text>
  <text x="280" y="438" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(嵌套性质验证)</text>

  <!-- No → return 0 -->
  <path d="M 390 417 L 440 417" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="411" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">No</text>
  <rect x="442" y="403" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="468" y="422" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- Yes → check multiple -->
  <path d="M 280 452 L 280 462" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="460" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Yes</text>

  <!-- Step 7: check deg equality + loop back -->
  <rect x="120" y="466" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="200" y="484" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">deg(x)==deg(p)? → multiple</text>

  <!-- loop back arrow -->
  <path d="M 120 480 L 60 480 L 60 246 L 120 246" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="40" y="360" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下</text>
  <text x="40" y="372" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一</text>
  <text x="40" y="384" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">个</text>
  <text x="40" y="396" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x</text>

  <!-- return box -->
  <rect x="300" y="466" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="390" y="484" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return 2 if multiple else 1</text>
</svg>
