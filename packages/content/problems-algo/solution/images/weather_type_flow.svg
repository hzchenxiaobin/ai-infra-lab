<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 执行流程：WHERE 过滤 → JOIN → CASE WHEN 分类</text>

  <!-- Step 1: FROM + WHERE -->
  <rect x="60" y="44" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">① FROM Weather WHERE day = '2019-11-15'</text>
  <text x="290" y="82" text-anchor="middle" font-size="10.5" fill="#555">只保留 2019-11-15 当天的天气记录</text>
  <text x="290" y="94" text-anchor="middle" font-size="10" fill="#999">WHERE 在 JOIN 前逐行过滤，缩小参与关联的行集</text>

  <path d="M 290 102 L 290 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: JOIN -->
  <rect x="60" y="124" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② JOIN Countries ON Weather.country_id = Countries.country_id</text>
  <text x="290" y="162" text-anchor="middle" font-size="10.5" fill="#555">用 country_id 把天气记录关联到 country_name</text>
  <text x="290" y="174" text-anchor="middle" font-size="10" fill="#999">INNER JOIN：无对应国家的记录自动丢弃</text>

  <path d="M 290 182 L 290 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: CASE WHEN -->
  <rect x="60" y="204" width="460" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="224" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ CASE WHEN weather_state 分类</text>
  <text x="80" y="244" font-size="11" fill="#555">WHEN weather_state &le; 15 THEN 'Cold'</text>
  <text x="80" y="262" font-size="11" fill="#555">WHEN weather_state &ge; 30 THEN 'Hot'</text>
  <text x="80" y="280" font-size="11" fill="#555">ELSE 'Warm'</text>

  <path d="M 290 290 L 290 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 输出 -->
  <rect x="60" y="312" width="460" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="332" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">④ 输出：country_name, weather_type</text>
  <text x="290" y="350" text-anchor="middle" font-size="10.5" fill="#555">每个在 2019-11-15 有记录的国家一行</text>

  <!-- Footer note -->
  <rect x="60" y="372" width="460" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="390" text-anchor="middle" font-size="10.5" fill="#888">💡 执行顺序：FROM/WHERE → JOIN → SELECT(CASE WHEN) → 输出</text>
  <text x="290" y="406" text-anchor="middle" font-size="10.5" fill="#888">先过滤再关联，减少 JOIN 的行数开销</text>
</svg>
