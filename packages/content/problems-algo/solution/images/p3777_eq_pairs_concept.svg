<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：最少删除数 = 区间内相邻相等对的个数</text>

  <!-- 查询子串 -->
  <text x="52" y="70" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">s[l..r]</text>
  <rect x="70" y="46" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="124" y="46" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="178" y="46" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="232" y="46" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="286" y="46" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="340" y="46" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">A</text>
  <text x="147" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">A</text>
  <text x="201" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <text x="255" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <text x="309" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">A</text>
  <text x="363" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">A</text>
  <text x="93" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="147" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="201" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="255" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="309" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="363" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>

  <!-- 游程括线 -->
  <path d="M 70 112 L 70 122 L 170 122 L 170 112" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 178 112 L 178 122 L 278 122 L 278 112" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 286 112 L 286 122 L 386 122 L 386 112" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="140" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">游程 AA（长2）</text>
  <text x="228" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">游程 BB（长2）</text>
  <text x="336" y="140" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">游程 AA（长2）</text>

  <!-- eq 数组 -->
  <text x="52" y="176" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">eq[i]</text>
  <rect x="124" y="152" width="46" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="232" y="152" width="46" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="340" y="152" width="46" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="147" y="173" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="255" y="173" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="363" y="173" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="201" y="173" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="309" y="173" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="420" y="173" font-size="11" fill="#888" filter="url(#rough2)">← 只在 i≥1 定义</text>

  <!-- 每游程删 k-1 -->
  <text x="280" y="212" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">答案 = (2−1) + (2−1) + (2−1) = 3 = Σ eq[i]</text>

  <!-- 保留策略 -->
  <path d="M 93 88 C 80 230, 70 240, 60 252" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="30" y="254" width="236" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">上界：删每个游程除首字符外的全部</text>
  <text x="148" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">留下 A · B · A —— 相邻游程字符必不同</text>
  <text x="148" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">天然交替 ✓，删了 (k−1)×3 = 3 个</text>
  <text x="148" y="334" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（极大游程相邻 ⟹ 字符互异）</text>

  <!-- 下界 -->
  <path d="M 363 88 C 400 230, 430 240, 452 252" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="288" y="254" width="244" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="276" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">下界：同一游程至多保留 1 个</text>
  <text x="410" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">游程内留两个 ⇒ 中间夹不进保留字符</text>
  <text x="410" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">（连续且全等）⇒ 子序列中相邻相等，矛盾</text>
  <text x="410" y="334" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">故至少删 Σ(k−1) 个</text>

  <!-- 底部备注 -->
  <rect x="52" y="362" width="456" height="30" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">翻转 s[j] 只牵动 eq[j] 与 eq[j+1] 两格 ⇒ 单点修改 + 区间和 = 树状数组</text>
</svg>
