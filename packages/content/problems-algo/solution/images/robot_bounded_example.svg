<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">示例 "GL"：4 轮后回到原点</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#666">每轮 G 走一步 + L 左转 90°，方向旋转形成正方形</text>

  <!-- Square path: (0,0)=(340,260), (0,1)=(340,170), (-1,1)=(250,170), (-1,0)=(250,260) -->

  <!-- Edge 1: (0,0)→(0,1) north -->
  <path d="M 340 260 L 340 175" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="215" font-size="11" fill="#446688" font-weight="bold">① G↑</text>

  <!-- Edge 2: (0,1)→(-1,1) west -->
  <path d="M 340 170 L 255 170" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="297" y="160" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② G←</text>

  <!-- Edge 3: (-1,1)→(-1,0) south -->
  <path d="M 250 170 L 250 255" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="215" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ G↓</text>

  <!-- Edge 4: (-1,0)→(0,0) east (return!) -->
  <path d="M 250 260 L 335 260" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ G→</text>

  <!-- Vertices -->
  <circle cx="340" cy="260" r="7" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="355" y="258" font-size="12" fill="#333" font-weight="bold">(0,0)</text>
  <text x="355" y="272" font-size="10" fill="#4a7a3a">起点≡终点</text>

  <circle cx="340" cy="170" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="355" y="167" font-size="11" fill="#333">(0,1)</text>

  <circle cx="250" cy="170" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="232" y="162" text-anchor="middle" font-size="11" fill="#333">(-1,1)</text>

  <circle cx="250" cy="260" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="232" y="275" text-anchor="middle" font-size="11" fill="#333">(-1,0)</text>

  <!-- Result -->
  <rect x="130" y="310" width="260" height="32" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 4 轮后回到 (0,0) 面朝北 → 有界</text>
</svg>
