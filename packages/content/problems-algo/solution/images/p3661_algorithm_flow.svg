<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 逐间隙 DP → 二分计数</text>

  <rect x="215" y="28" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="45" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M 260 52 L 260 64" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="66" width="310" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">机器人按位置排序（distance 跟着走），墙壁排序</text>

  <path d="M 260 92 L 260 104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="106" width="310" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">双指针数出与机器人同位的墙数 base（白送）</text>

  <path d="M 260 132 L 260 144" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="85" y="146" width="350" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dpL ← [r₀−d₀, r₀) 内墙数；dpR ← 0</text>

  <path d="M 260 172 L 260 184" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,186 352,222 260,258 168,222" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有间隙 (rᵢ₋₁, rᵢ)？</text>

  <path d="M 260 258 L 260 272" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="273" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="50" y="274" width="390" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">二分：total = 间隙墙数；A = rᵢ₋₁+dᵢ₋₁；B = rᵢ−dᵢ</text>
  <text x="245" y="311" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">R→L: total−(A,B)内墙数　L→L: ≥B　R→R: ≤A　L→R: 0</text>
  <text x="245" y="329" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dpL ← max(dpL+L→L, dpR+R→L)；dpR ← max(dpL, dpR+R→R)</text>

  <path d="M 50 308 L 28 308 L 28 222 L 164 222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 352 222 L 478 222 L 478 366 L 472 366" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="250" y="352" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dpR += 最右机器人右侧射程内墙数</text>

  <path d="M 360 380 L 360 392" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="235" y="394" width="250" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="412" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans ← max(dpL, dpR) + base</text>

  <path d="M 360 422 L 360 434" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="315" y="436" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="360" y="453" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
