<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="350" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">自连接锚点计数：p1 行定窗口起点，p2 行数窗内帖数</text>
  <text x="290" y="38" text-anchor="middle" font-size="9" fill="#888">JOIN 条件：同 user_id 且 p2.post_date ∈ [p1.post_date, p1.post_date + 6 天]（闭区间恰 7 天）</text>

  <!-- Left: Posts table (user 3) -->
  <text x="40" y="60" font-size="10" fill="#555" font-weight="bold">Posts（user_id = 3）</text>
  <rect x="40" y="68" width="145" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="82" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">post_id</text>
  <text x="125" y="82" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">post_date</text>

  <rect x="40" y="88" width="145" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="62" y="102" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">5（p1）</text>
  <text x="125" y="102" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">02-06</text>

  <rect x="40" y="108" width="145" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="122" text-anchor="middle" font-size="9" fill="#555">4</text>
  <text x="125" y="122" text-anchor="middle" font-size="9" fill="#555">02-14</text>

  <rect x="40" y="128" width="145" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="142" text-anchor="middle" font-size="9" fill="#555">3</text>
  <text x="125" y="142" text-anchor="middle" font-size="9" fill="#555">02-25</text>

  <text x="112" y="162" text-anchor="middle" font-size="8" fill="#888">p1 取锚行 post_id = 5（02-06）</text>

  <!-- Middle: window -->
  <path d="M 188 98 L 218 90" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="222" y="70" width="196" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">锚窗 [02-06, 02-12]</text>
  <text x="320" y="96" text-anchor="middle" font-size="8" fill="#888">DATE_ADD(d, INTERVAL 6 DAY)</text>
  <rect x="222" y="116" width="196" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">该锚点 cnt = 1</text>

  <!-- Right: checks -->
  <rect x="442" y="68" width="128" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="506" y="82" text-anchor="middle" font-size="9" fill="#4a7a3a">p2=02-06 ✓ 自身</text>
  <rect x="442" y="94" width="128" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="506" y="108" text-anchor="middle" font-size="9" fill="#b85450">p2=02-14 ✗ 晚 2 天</text>
  <rect x="442" y="120" width="128" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="506" y="134" text-anchor="middle" font-size="9" fill="#b85450">p2=02-25 ✗ 晚 13 天</text>

  <!-- Bottom pipeline -->
  <path d="M 290 150 L 290 168" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="172" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="186" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">CTE P：每帖作锚 → 自连接配对 → GROUP BY (user_id, p1.post_id)</text>
  <text x="290" y="200" text-anchor="middle" font-size="8" fill="#888">每个锚点一行 cnt（≥1，含锚帖自身）——注意分组键必须带 post_id，不能直接按 user 汇总</text>

  <path d="M 290 206 L 290 220" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="224" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">CTE T：WHERE 02-01 ≤ post_date ≤ 02-28 → GROUP BY user_id</text>
  <text x="290" y="252" text-anchor="middle" font-size="8" fill="#888">COUNT(1) ÷ 4 AS avg_weekly_posts（分母固定 4 周，不是实际周数）</text>

  <path d="M 290 258 L 290 272" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="276" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="290" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">外层：P ⋈ T → GROUP BY user_id → MAX(cnt) AS max_7day_posts</text>
  <text x="290" y="304" text-anchor="middle" font-size="8" fill="#888">HAVING max_7day_posts ≥ avg_weekly_posts × 2 → ORDER BY user_id</text>

  <text x="290" y="332" text-anchor="middle" font-size="9" fill="#555">为什么锚窗就够？任意窗内帖子集的最小日期帖作锚，其锚窗 ⊇ 该集合 → max 必在锚窗取到</text>
</svg>
