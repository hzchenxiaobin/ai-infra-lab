<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：nums1=[4,3,1,4], nums2=[1,3,7,1], k=3</text>

  <!-- index row ; cells at x=160,232,304,376 w=56 centers 188,260,332,404 -->
  <text x="152" y="50" text-anchor="end" font-size="10" fill="#888">下标</text>
  <text x="188" y="50" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="260" y="50" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="332" y="50" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="404" y="50" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- 初始 diff row, cells centered y=84 (y=70..104) -->
  <text x="152" y="88" text-anchor="end" font-size="12" fill="#333" font-weight="bold">初始 diff</text>
  <rect x="160" y="70" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="188" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">+3</text>
  <rect x="232" y="70" width="56" height="34" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">0</text>
  <rect x="304" y="70" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="92" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−6</text>
  <rect x="376" y="70" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="404" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">+3</text>

  <!-- transition note 1 -->
  <path d="M 280 108 L 280 124" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="116" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">操作1：i=2 (+k)　j=0 (−k)</text>

  <!-- op1 diff row centered y=164 (y=150..184) ; idx0, idx2 changed -->
  <text x="152" y="168" text-anchor="end" font-size="12" fill="#333" font-weight="bold">操作1后</text>
  <rect x="160" y="150" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="172" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="232" y="150" width="56" height="34" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">0</text>
  <rect x="304" y="150" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="172" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">−3</text>
  <rect x="376" y="150" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="404" y="172" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">+3</text>

  <!-- transition note 2 -->
  <path d="M 280 188 L 280 204" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="196" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">操作2：i=2 (+k)　j=3 (−k)</text>

  <!-- op2 diff row centered y=244 (y=230..264) ; idx2, idx3 changed -->
  <text x="152" y="248" text-anchor="end" font-size="12" fill="#333" font-weight="bold">操作2后</text>
  <rect x="160" y="230" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="188" y="252" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="232" y="230" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="304" y="230" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="252" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="376" y="230" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="252" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>

  <!-- answer box -->
  <rect x="80" y="280" width="400" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">差分全 0 ⇒ nums1≡nums2 ✓　答案 = Σ正差分/k = (3+3)/3 = 2</text>
</svg>
