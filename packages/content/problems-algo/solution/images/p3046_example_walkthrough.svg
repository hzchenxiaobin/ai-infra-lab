<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：两个官方用例各走一遍</text>

  <!-- row 1: example 1 -->
  <rect x="18" y="40" width="484" height="140" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="30" y="62" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1</text>

  <text x="30" y="92" font-size="11" fill="#555" filter="url(#rough2)">nums =</text>
  <rect x="76" y="74" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="94" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="114" y="74" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="94" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="152" y="74" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="190" y="74" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="228" y="74" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="94" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="266" y="74" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="94" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 312 89 L 340 89" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="346" y="66" width="86" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="389" y="82" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">频次表</text>
  <text x="366" y="99" font-size="10.5" fill="#b85450" filter="url(#rough2)">1 → 2</text>
  <text x="412" y="99" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2 → 2</text>
  <text x="366" y="117" font-size="10.5" fill="#446688" filter="url(#rough2)">3 → 1</text>
  <text x="412" y="117" font-size="10.5" fill="#446688" filter="url(#rough2)">4 → 1</text>
  <text x="389" y="136" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">max = 2</text>

  <path d="M 436 104 L 458 104" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="462" y="86" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="109" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="30" y="134" font-size="10.5" fill="#555" filter="url(#rough2)">均 ≤ 2 → 可构造：成对的 1、2 一左一右，单个的 3、4 各归一侧补齐</text>
  <text x="30" y="152" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">nums1 = [1,2,3]，nums2 = [1,2,4] → true</text>

  <!-- row 2: example 2 -->
  <rect x="18" y="196" width="484" height="140" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="30" y="218" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2</text>

  <text x="30" y="248" font-size="11" fill="#555" filter="url(#rough2)">nums =</text>
  <rect x="76" y="230" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="114" y="230" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="152" y="230" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="190" y="230" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="207" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 236 245 L 264 245" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="270" y="222" width="86" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="313" y="238" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">频次表</text>
  <text x="313" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 → 4 &gt; 2 !</text>

  <path d="M 360 245 L 382 245" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="386" y="227" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="404" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="30" y="290" font-size="10.5" fill="#555" filter="url(#rough2)">4 个 1 挤 2 个巢：任一划分中必有一侧拿到 ≥ 2 个 1</text>
  <text x="30" y="308" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">唯一分法 nums1=[1,1]、nums2=[1,1] 都有重复 → false</text>
  <text x="30" y="326" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（提前剪枝：数到第 3 个 1 时即可 return false，后面的元素不用看）</text>
</svg>
