<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#446688"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：host_team / guest_team 的 ID → 名字
  </text>

  <!-- Input table: Matchs -->
  <rect x="15" y="55" width="325" height="130" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="30" y="73" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">Matchs（输入，ID）</text>
  <line x1="15" y1="80" x2="340" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="95" font-size="10" fill="#555" filter="url(#rough2)">match_id</text>
  <rect x="78" y="82" width="120" height="100" fill="#fff8e1" opacity="0.6" filter="url(#rough2)"/>
  <text x="92" y="95" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">host_team</text>
  <rect x="198" y="82" width="142" height="100" fill="#fce4ec" opacity="0.6" filter="url(#rough2)"/>
  <text x="212" y="95" font-size="10" fill="#7a3a3a" font-weight="bold" filter="url(#rough2)">guest_team</text>

  <text x="52" y="115" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="115" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="250" y="115" font-size="11" fill="#7a3a3a" font-weight="bold" filter="url(#rough2)">20</text>

  <text x="52" y="138" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="138" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="250" y="138" font-size="11" fill="#7a3a3a" font-weight="bold" filter="url(#rough2)">30</text>

  <text x="52" y="161" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="120" y="161" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">30</text>
  <text x="250" y="161" font-size="11" fill="#7a3a3a" font-weight="bold" filter="url(#rough2)">40</text>

  <!-- Teams mapping box -->
  <rect x="360" y="55" width="165" height="130" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="442" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Teams（ID → 名字）</text>
  <line x1="360" y1="80" x2="525" y2="80" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="372" y="98" font-size="11" fill="#333" filter="url(#rough2)">10 → Leetcode FC</text>
  <text x="372" y="118" font-size="11" fill="#333" filter="url(#rough2)">20 → New York</text>
  <text x="372" y="138" font-size="11" fill="#333" filter="url(#rough2)">30 → Boston</text>
  <text x="372" y="158" font-size="11" fill="#333" filter="url(#rough2)">40 → Los Angeles</text>

  <!-- dashed lookup arrows from row1 -->
  <path d="M198,110 C 280,96 320,92 358,96" stroke="#7a5a10" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M340,110 C 350,118 352,118 358,116" stroke="#7a3a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="278" y="86" text-anchor="middle" font-size="9" fill="#7a5a10" filter="url(#rough2)">查 h</text>
  <text x="330" y="128" text-anchor="middle" font-size="9" fill="#7a3a3a" filter="url(#rough2)">查 g</text>

  <!-- down arrow -->
  <path d="M177,185 L177,222" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="195" y="208" font-size="11" fill="#446688" filter="url(#rough2)">JOIN Teams：用 team_name 替换 ID</text>

  <!-- Output table: 结果 -->
  <rect x="15" y="225" width="325" height="130" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="30" y="243" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">结果（输出，名字）</text>
  <line x1="15" y1="250" x2="340" y2="250" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="265" font-size="10" fill="#555" filter="url(#rough2)">match_id</text>
  <rect x="78" y="252" width="120" height="98" fill="#fff8e1" opacity="0.7" filter="url(#rough2)"/>
  <text x="92" y="265" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">host_team</text>
  <rect x="198" y="252" width="142" height="98" fill="#fce4ec" opacity="0.7" filter="url(#rough2)"/>
  <text x="212" y="265" font-size="10" fill="#7a3a3a" font-weight="bold" filter="url(#rough2)">guest_team</text>

  <text x="52" y="285" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="92" y="285" font-size="11" fill="#333" filter="url(#rough2)">Leetcode FC</text>
  <text x="212" y="285" font-size="11" fill="#333" filter="url(#rough2)">New York</text>

  <text x="52" y="308" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="92" y="308" font-size="11" fill="#333" filter="url(#rough2)">New York</text>
  <text x="212" y="308" font-size="11" fill="#333" filter="url(#rough2)">Boston</text>

  <text x="52" y="331" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="92" y="331" font-size="11" fill="#333" filter="url(#rough2)">Boston</text>
  <text x="212" y="331" font-size="11" fill="#333" filter="url(#rough2)">Los Angeles</text>

  <!-- note -->
  <rect x="360" y="225" width="165" height="48" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="442" y="245" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">host_goals / guest_goals</text>
  <text x="442" y="261" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">原样透传，未画出</text>
</svg>
