<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 1234567（从右向左构建，最后翻转）</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">s = "1234567"，res 逆序追加，cnt 满 3 插点</text>

  <!-- Table grid: columns x boundaries -->
  <!-- col: 步骤(50) i(40) s[i](50) cnt(50) res(190) 动作(110) ; start x=35, total=490, end=525 -->
  <!-- Header row: y 64-92 -->
  <rect x="35" y="64" width="490" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="82" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步骤</text>
  <text x="105" y="82" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i</text>
  <text x="155" y="82" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">s[i]</text>
  <text x="205" y="82" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">cnt</text>
  <text x="320" y="82" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">res（逆序构建中）</text>
  <text x="470" y="82" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">动作</text>

  <!-- vertical grid lines (full height of table) -->
  <path d="M 85 64 L 85 288 M 125 64 L 125 288 M 175 64 L 175 288 M 225 64 L 225 288 M 415 64 L 415 288 M 525 64 L 525 288 M 35 64 L 35 288" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: step1 i=6 '7' cnt=1 res="7" 追加 -->
  <rect x="35" y="92" width="490" height="28" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="60"  y="110" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">1</text>
  <text x="105" y="110" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">6</text>
  <text x="155" y="110" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">7</text>
  <text x="205" y="110" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">1</text>
  <text x="320" y="110" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" font-weight="bold">"7"</text>
  <text x="470" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a">追加</text>

  <!-- Row 2: step2 i=5 '6' cnt=2 res="76" 追加 -->
  <rect x="35" y="120" width="490" height="28" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="60"  y="138" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">2</text>
  <text x="105" y="138" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">5</text>
  <text x="155" y="138" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">6</text>
  <text x="205" y="138" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">2</text>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" font-weight="bold">"76"</text>
  <text x="470" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a">追加</text>

  <!-- Row 3: step3 i=4 '5' cnt=3->0 res="576." 追加+插点 (HIGHLIGHT) -->
  <rect x="35" y="148" width="490" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60"  y="166" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">3</text>
  <text x="105" y="166" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">4</text>
  <text x="155" y="166" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">5</text>
  <text x="205" y="166" text-anchor="middle" font-size="10.5" fill="#d6a040" font-family="monospace" font-weight="bold">3→0</text>
  <text x="320" y="166" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" font-weight="bold">"576<tspan fill="#b85450">.</tspan>"</text>
  <text x="470" y="166" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">追加+插点 ⭐</text>

  <!-- Row 4: step4 i=3 '4' cnt=1 res="576.4" 追加 -->
  <rect x="35" y="176" width="490" height="28" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="60"  y="194" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">4</text>
  <text x="105" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">3</text>
  <text x="155" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">4</text>
  <text x="205" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">1</text>
  <text x="320" y="194" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" font-weight="bold">"576.4"</text>
  <text x="470" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a">追加</text>

  <!-- Row 5: step5 i=2 '3' cnt=2 res="576.43" 追加 -->
  <rect x="35" y="204" width="490" height="28" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="60"  y="222" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">5</text>
  <text x="105" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">2</text>
  <text x="155" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">3</text>
  <text x="205" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">2</text>
  <text x="320" y="222" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" font-weight="bold">"576.43"</text>
  <text x="470" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">追加</text>

  <!-- Row 6: step6 i=1 '2' cnt=3->0 res="576.432." 追加+插点 (HIGHLIGHT) -->
  <rect x="35" y="232" width="490" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60"  y="250" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">6</text>
  <text x="105" y="250" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">1</text>
  <text x="155" y="250" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">2</text>
  <text x="205" y="250" text-anchor="middle" font-size="10.5" fill="#d6a040" font-family="monospace" font-weight="bold">3→0</text>
  <text x="320" y="250" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" font-weight="bold">"576.432<tspan fill="#b85450">.</tspan>"</text>
  <text x="470" y="250" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">追加+插点 ⭐</text>

  <!-- Row 7: step7 i=0 '1' cnt=1 res="576.432.1" 追加(i=0不插点) -->
  <rect x="35" y="260" width="490" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60"  y="278" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">7</text>
  <text x="105" y="278" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">0</text>
  <text x="155" y="278" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">1</text>
  <text x="205" y="278" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">1</text>
  <text x="320" y="278" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" font-weight="bold">"576.432.1"</text>
  <text x="470" y="278" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=0 不插点</text>

  <!-- bottom border line -->
  <path d="M 35 288 L 525 288" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow down to final result -->
  <path d="M 280 300 L 280 318" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="330" y="314" text-anchor="start" font-size="10.5" fill="#888" font-weight="bold">reverse(res)</text>

  <!-- Final result -->
  <rect x="120" y="324" width="320" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="16" fill="#333" font-family="monospace" font-weight="bold">"576.432.1" → "1<tspan fill="#b85450" font-size="20">.</tspan>234<tspan fill="#b85450" font-size="20">.</tspan>567"</text>

  <!-- note -->
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">翻转后即得正确顺序的千位分隔结果</text>
</svg>
