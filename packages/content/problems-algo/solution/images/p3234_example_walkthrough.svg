<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = 101101（示例 2），逐 l 分段计数合计 16</text>

  <rect x="36" y="36" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="53" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="74" y="36" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="91" y="55" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="112" y="36" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="129" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="36" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="167" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="36" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205" y="55" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="226" y="36" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="243" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="53" y="80" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="91" y="80" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="129" y="80" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="167" y="80" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="205" y="80" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="243" y="80" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <text x="286" y="48" font-size="10" fill="#555" filter="url(#rough2)">0 位于 p₀=1、p₁=4，</text>
  <text x="286" y="64" font-size="10" fill="#555" filter="url(#rough2)">哨兵 p₂ = n = 6</text>

  <!-- 表头 -->
  <rect x="36" y="92" width="460" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="56" y="108" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="131" y="108" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">k=0 段 [l, p₀−1]</text>
  <text x="251" y="108" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">k=1 段 [max(p₀,l+1), p₁−1]</text>
  <text x="378" y="108" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">k=2 段 [max(p₁,l+5), p₂−1]</text>
  <text x="468" y="108" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">小计</text>

  <!-- 数据行 -->
  <rect x="36" y="116" width="460" height="27" fill="#fdfdfd" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="133" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="131" y="133" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[0,0] → 1</text>
  <text x="251" y="133" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[max(1,1),3] → 3</text>
  <text x="378" y="133" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">[max(4,5),5] → 1</text>
  <text x="468" y="133" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="36" y="143" width="460" height="27" fill="#fdfdfd" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="160" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="131" y="160" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">∅ → 0</text>
  <text x="251" y="160" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[max(1,2),3] → 2</text>
  <text x="378" y="160" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">[max(4,6),5] = ∅ → 0</text>
  <text x="468" y="160" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="36" y="170" width="460" height="27" fill="#fdfdfd" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="187" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="131" y="187" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[2,3] → 2</text>
  <text x="251" y="187" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[max(4,3),5] → 2</text>
  <text x="378" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">右侧仅 1 个 0，停</text>
  <text x="468" y="187" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="36" y="197" width="460" height="27" fill="#fdfdfd" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="214" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="131" y="214" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[3,3] → 1</text>
  <text x="251" y="214" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[max(4,4),5] → 2</text>
  <text x="378" y="214" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">停</text>
  <text x="468" y="214" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="36" y="224" width="460" height="27" fill="#fdfdfd" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="241" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="131" y="241" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">∅ → 0</text>
  <text x="251" y="241" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[max(4,5),5] → 1</text>
  <text x="378" y="241" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">停</text>
  <text x="468" y="241" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="36" y="251" width="460" height="27" fill="#fdfdfd" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="268" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="131" y="268" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[5,5] → 1</text>
  <text x="251" y="268" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">右侧无 0，停</text>
  <text x="378" y="268" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">—</text>
  <text x="468" y="268" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 合计行 -->
  <rect x="36" y="278" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="266" y="297" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 = 5 + 2 + 4 + 3 + 1 + 1 = 16 ✓</text>

  <!-- 看点① -->
  <rect x="36" y="322" width="460" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="340" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">看点①（l=0, k=2，平方阈值掐头）：段区间 [4,5]，但 2 个 0 要求 ones ≥ 4</text>
  <text x="46" y="356" font-size="9.5" fill="#446688" filter="url(#rough2)">⇒ r ≥ l+k²+k−1 = 0+4+2−1 = 5 → 掐头剩 [5,5]：整串恰 3 个 1 ≥ 2²，险胜</text>
  <text x="46" y="372" font-size="9.5" fill="#b85450" filter="url(#rough2)">对照 l=1 的 k=2 段：下界抬到 r ≥ 6，越过 hi = 5 → 整段为空</text>

  <!-- 看点② -->
  <rect x="36" y="392" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="46" y="408" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">看点②：k 每加 1，所需长度跳增 2k+1，很快够不着 → 单个 l 至多 O(√n) 段</text>
  <text x="46" y="424" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">k=0 段即「全 1 前缀」；l 恰好落在 0 上时该段为空，自然计 0（l=1、l=4 行）</text>
</svg>
