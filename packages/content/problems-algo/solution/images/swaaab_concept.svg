<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心策略：多数优先，逢二必换</text>

  <!-- Rule 1 box (left, blue) -->
  <rect x="36" y="50" width="230" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="151" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">规则 1：多数优先</text>
  <text x="151" y="96" text-anchor="middle" font-size="11" fill="#555">每步写剩余数量更多的字符</text>
  <text x="151" y="114" text-anchor="middle" font-size="11" fill="#888">a &gt; b → 写 'a'</text>
  <text x="151" y="130" text-anchor="middle" font-size="11" fill="#888">b &gt; a → 写 'b'</text>

  <!-- Rule 2 box (right, orange) -->
  <rect x="284" y="50" width="230" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="399" y="74" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">规则 2：逢二必换</text>
  <text x="399" y="96" text-anchor="middle" font-size="11" fill="#555">末尾已有 2 个相同字符</text>
  <text x="399" y="114" text-anchor="middle" font-size="11" fill="#888">→ 必须写另一个</text>
  <text x="399" y="130" text-anchor="middle" font-size="11" fill="#b85450">"...aa" → 强制写 'b'</text>

  <!-- Example section label -->
  <text x="270" y="172" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">示例：a = 4, b = 1</text>

  <!-- a pool -->
  <text x="60" y="200" font-size="11" fill="#888">a 池:</text>
  <rect x="100" y="186" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="134" y="186" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="168" y="186" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="202" y="186" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="248" y="205" font-size="11" fill="#446688" font-weight="bold">×4</text>

  <!-- b pool -->
  <text x="310" y="200" font-size="11" fill="#888">b 池:</text>
  <rect x="350" y="186" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="398" y="205" font-size="11" fill="#4a7a3a" font-weight="bold">×1</text>

  <!-- arrow: majority is a -->
  <path d="M 160 224 Q 270 240 380 224" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="10" fill="#888">多数方 = a，优先消耗</text>

  <!-- Result string -->
  <text x="60" y="272" font-size="11" fill="#888">结果:</text>
  <rect x="100" y="256" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="140" y="256" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="180" y="256" width="36" height="28" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="220" y="256" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="260" y="256" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <!-- annotation for forced switch -->
  <path d="M 198 248 L 198 236" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="198" y="230" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">逢二必换！</text>

  <!-- Insight box -->
  <rect x="36" y="300" width="478" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="275" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">多数优先 → 自然分散多数方，避免尾段堆积</text>
  <text x="275" y="340" text-anchor="middle" font-size="11" fill="#666">逢二必换 → 保证同一字符最多连续 2 次，杜绝 aaa / bbb</text>
  <text x="275" y="356" text-anchor="middle" font-size="11" fill="#666">两规则配合，在解存在的前提下永不卡死</text>
</svg>
