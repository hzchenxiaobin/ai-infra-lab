<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：一遍扫描收集 x 的下标表，第 k 次出现 = pos[k-1]</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">x 固定 → 整批查询共享一张「位置表」，查询 O(1) 直取</text>

  <!-- ===== nums grid ===== -->
  <text x="30" y="76" font-size="11" fill="#446688" font-weight="bold">nums（x = 1）</text>
  <g font-size="12">
    <rect x="90" y="60" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="113" y="82" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="136" y="60" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="159" y="82" text-anchor="middle" fill="#446688">3</text>
    <rect x="182" y="60" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="205" y="82" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="228" y="60" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="251" y="82" text-anchor="middle" fill="#446688">7</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="113" y="106" text-anchor="middle">i=0</text>
    <text x="159" y="106" text-anchor="middle">i=1</text>
    <text x="205" y="106" text-anchor="middle">i=2</text>
    <text x="251" y="106" text-anchor="middle">i=3</text>
  </g>

  <!-- ===== arrows nums -> pos ===== -->
  <path d="M 113 110 C 113 140, 130 150, 150 158" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 205 110 C 205 140, 200 150, 196 158" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="132" font-size="10" fill="#b85450" font-weight="bold">nums[i] == x 就把 i 收进 pos</text>

  <!-- ===== pos boxes ===== -->
  <text x="30" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">pos（下标表）</text>
  <g font-size="12">
    <rect x="128" y="164" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="151" y="186" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="174" y="164" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="197" y="186" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
  </g>
  <g font-size="9" fill="#4a7a3a">
    <text x="151" y="212" text-anchor="middle">pos[0] 第 1 次</text>
    <text x="197" y="226" text-anchor="middle">pos[1] 第 2 次</text>
  </g>

  <!-- ===== query mapping ===== -->
  <rect x="300" y="160" width="196" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="398" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">查询 q（第几次，1 起计）</text>
  <text x="398" y="200" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">q ≤ pos.size() ? pos[q-1] : -1</text>
  <text x="398" y="218" text-anchor="middle" font-size="10" fill="#555">q=1 → 0   q=2 → 2   q=3 → -1</text>

  <path d="M 274 181 L 296 181" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== bottom note ===== -->
  <rect x="40" y="252" width="440" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">空间换时间：O(n) 的 pos 表，把每次查询从 O(n) 扫描降到 O(1) 查表</text>
  <text x="260" y="292" text-anchor="middle" font-size="9" fill="#888">「第 k 次」是 1-based，pos 下标是 0-based → 取 pos[k-1]；k 超过表长即 -1</text>

  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#888">这张 pos 表就是倒排索引的最小形态：值 x → 出现下标序列，天然按出现顺序有序</text>
  <text x="260" y="354" text-anchor="middle" font-size="9" fill="#aaa">所有查询读的是同一份只读数据 → 预处理一次，全体受益</text>
</svg>
