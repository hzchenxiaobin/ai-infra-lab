<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：tasks=[5,9,8,5,9], workers=[1,6,4,2,6], pills=1, strength=5</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">排序后 tasks=[5,5,8,9,9]，workers=[1,2,4,6,6]，答案区间 [0, 5]</text>

  <!-- ===== Binary search table ===== -->
  <text x="30" y="70" font-size="12" fill="#446688" font-weight="bold">二分过程：</text>

  <rect x="20" y="78" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="96" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次</text>
  <text x="96" y="96" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">[lo,hi]</text>
  <text x="150" y="96" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">mid</text>
  <text x="208" y="96" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">check</text>
  <text x="330" y="96" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">操作</text>

  <!-- row1 mid=2 ✓ -->
  <rect x="20" y="104" width="540" height="26" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="46" y="122" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="96" y="122" text-anchor="middle" font-size="11" fill="#333">[0,5]</text>
  <text x="150" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="208" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ true</text>
  <text x="330" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">ans=2, lo=3</text>

  <!-- row2 mid=4 ✗ -->
  <rect x="20" y="130" width="540" height="26" fill="#fce4ec" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="46" y="148" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="96" y="148" text-anchor="middle" font-size="11" fill="#333">[3,5]</text>
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="208" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ false</text>
  <text x="330" y="148" text-anchor="middle" font-size="11" fill="#b85450">hi=3</text>

  <!-- row3 mid=3 ✓ -->
  <rect x="20" y="156" width="540" height="26" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="46" y="174" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="96" y="174" text-anchor="middle" font-size="11" fill="#333">[3,3]</text>
  <text x="150" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="208" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ true</text>
  <text x="330" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a">ans=3, lo=4</text>

  <!-- final -->
  <rect x="20" y="182" width="540" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">lo=4 &gt; hi=3 → 结束，返回 ans = 3</text>

  <!-- ===== check(3) detail ===== -->
  <text x="30" y="232" font-size="12" fill="#4a7a3a" font-weight="bold">check(3) 贪心匹配详解：3 最易任务 [5,5,8] × 3 最强工人 {4,6,6}，pills=1, s=5</text>

  <!-- Step 1 -->
  <rect x="20" y="244" width="540" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="264" font-size="11" fill="#b85450" font-weight="bold">步骤 1：任务 t=8（最难）</text>
  <text x="34" y="282" font-size="10.5" fill="#555">lower_bound(8) 在 {4,6,6} 中 → 无（最大才 6）</text>
  <text x="34" y="298" font-size="10.5" fill="#d6a040" font-weight="bold">用药丸：lower_bound(8−5=3) → 工人 4（4+5=9 ≥ 8 ✓）→ erase 4, pills=0</text>
  <text x="34" y="312" font-size="10.5" fill="#888">剩余工人 {6,6}，剩余任务 [5,5]</text>

  <!-- arrow -->
  <path d="M 290 318 L 290 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="20" y="334" width="540" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="354" font-size="11" fill="#4a7a3a" font-weight="bold">步骤 2：任务 t=5</text>
  <text x="34" y="372" font-size="10.5" fill="#555">lower_bound(5) 在 {6,6} 中 → 工人 6（无需药丸）→ erase 6</text>
  <text x="34" y="388" font-size="10.5" fill="#888">剩余工人 {6}，剩余任务 [5]</text>

  <!-- arrow -->
  <path d="M 290 396 L 290 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="20" y="412" width="540" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="432" font-size="11" fill="#4a7a3a" font-weight="bold">步骤 3：任务 t=5</text>
  <text x="34" y="450" font-size="10.5" fill="#555">lower_bound(5) 在 {6} 中 → 工人 6（无需药丸）→ erase 6</text>
  <text x="34" y="466" font-size="10.5" fill="#888">剩余工人 {}，全部匹配 → check(3) = true ✓</text>

  <!-- Bottom note -->
  <rect x="30" y="486" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="504" text-anchor="middle" font-size="11" fill="#444">关键：药丸只喂给「恰好够」的弱工人（4+5=9 刚好完成 t=8），</text>
  <text x="290" y="520" text-anchor="middle" font-size="11" fill="#446688">把强工人 6、6 留给后面无需药丸的易任务 → 交换论证保证最优</text>
</svg>
