<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    边际增益递减：每次都加给“增益最大”的班
  </text>

  <!-- three classes row -->
  <text x="40" y="74" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">班级</text>

  <!-- class A: 1/2 -->
  <rect x="70" y="56" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1/2</text>
  <text x="105" y="89" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">=0.500</text>
  <text x="105" y="48" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">A</text>

  <!-- class B: 3/5 -->
  <rect x="170" y="56" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="205" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3/5</text>
  <text x="205" y="89" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">=0.600</text>
  <text x="205" y="48" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">B</text>

  <!-- class C: 2/2 -->
  <rect x="270" y="56" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2/2</text>
  <text x="305" y="89" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">=1.000</text>
  <text x="305" y="48" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">C</text>

  <!-- gain arrows downward -->
  <text x="40" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">加 1 的增益</text>

  <path d="M105,100 L105,120" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M205,100 L205,120" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M305,100 L305,120" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- gain values -->
  <rect x="68" y="124" width="74" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="139" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">+1/6 ≈0.167</text>

  <rect x="168" y="124" width="74" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="205" y="139" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">+1/15 ≈0.067</text>

  <rect x="268" y="124" width="74" height="22" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="8" filter="url(#rough2)"/>
  <text x="305" y="139" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">+0（已满）</text>

  <!-- max-heap picks A -->
  <path d="M105,150 L240,182" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="172" font-size="10" fill="#4a7a3a" filter="url(#rough2)">选最大 ↓</text>

  <!-- heap visualization -->
  <text x="280" y="186" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">大顶堆（按增益排序）</text>
  <rect x="245" y="192" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">A: 0.167</text>
  <rect x="200" y="232" width="62" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="231" y="247" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">B:0.067</text>
  <rect x="298" y="232" width="62" height="22" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="329" y="247" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">C:0</text>
  <line x1="265" y1="216" x2="231" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="295" y1="216" x2="329" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

  <!-- diminishing returns curve on right -->
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一班反复加</text>
  <text x="430" y="72" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">增益越来越小</text>
  <!-- axes -->
  <line x1="395" y1="190" x2="395" y2="92" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="96" text-anchor="end" font-size="9" fill="#666" filter="url(#rough2)">增益</text>
  <line x1="395" y1="190" x2="495" y2="190" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="194" font-size="9" fill="#666" filter="url(#rough2)">加的人数</text>
  <!-- concave decreasing curve -->
  <path d="M395,104 Q430,120 460,165 L490,184" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- points on curve -->
  <circle cx="410" cy="112" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="435" cy="132" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="460" cy="165" r="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="412" y="108" font-size="9" fill="#b85450" filter="url(#rough2)">高</text>
  <text x="462" y="161" font-size="9" fill="#b85450" filter="url(#rough2)">低</text>

  <!-- gain formula box -->
  <rect x="50" y="280" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    边际增益 = (pass+1)/(total+1) − pass/total
  </text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    化简 = (total − pass) / [ total × (total+1) ]
  </text>

  <!-- insight box -->
  <rect x="50" y="340" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    凹函数求和的增量分配：每次给当前边际增益最大的班加一人
  </text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">
    （已满的班 total==pass 时增益为 0，堆顶天然不会选它）
  </text>
</svg>
