<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3, 0, 1]，n = 3</text>
  <path d="M 320 46 Q 460 54 600 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组可视化 -->
  <text x="120" y="84" font-size="13" fill="#666">数组（下标 / 值）</text>
  <g filter="url(#sk)">
    <rect x="180" y="92" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="244" y="92" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="308" y="92" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="212" y="109" text-anchor="middle" font-size="11" fill="#4a7a3a">i=0</text>
  <text x="212" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">3</text>
  <text x="276" y="109" text-anchor="middle" font-size="11" fill="#4a7a3a">i=1</text>
  <text x="276" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">0</text>
  <text x="340" y="109" text-anchor="middle" font-size="11" fill="#4a7a3a">i=2</text>
  <text x="340" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">1</text>
  <text x="392" y="116" font-size="12" fill="#999">完整集 = {0,1,2,3}，缺 2</text>

  <!-- 表头 -->
  <text x="230" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">逐步异或过程</text>
  <g filter="url(#sk)">
    <rect x="120" y="182" width="680" height="32" rx="4" fill="#446688"/>
  </g>
  <text x="170" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">步骤</text>
  <text x="270" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">i</text>
  <text x="370" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">nums[i]</text>
  <text x="500" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">i ⊕ nums[i]</text>
  <text x="660" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">ans 更新</text>
  <text x="770" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">说明</text>

  <!-- 初始行 -->
  <g filter="url(#sk)">
    <rect x="120" y="214" width="680" height="32" fill="#fff8e1" stroke="#bbb"/>
  </g>
  <text x="170" y="235" text-anchor="middle" font-size="12" fill="#5a4530">初始</text>
  <text x="270" y="235" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="370" y="235" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="500" y="235" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="660" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">ans = n = 3</text>
  <text x="770" y="235" text-anchor="middle" font-size="11" fill="#666">补完整集的 n</text>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="120" y="246" width="680" height="32" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="170" y="267" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="270" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
  <text x="370" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <text x="500" y="267" text-anchor="middle" font-size="12" fill="#446688">0 ⊕ 3 = 3</text>
  <text x="660" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3 ⊕ 3 = 0</text>
  <text x="770" y="267" text-anchor="middle" font-size="11" fill="#666">0、3 配对消去</text>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="120" y="278" width="680" height="32" fill="#f7faff" stroke="#bbb"/>
  </g>
  <text x="170" y="299" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="270" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1</text>
  <text x="370" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
  <text x="500" y="299" text-anchor="middle" font-size="12" fill="#446688">1 ⊕ 0 = 1</text>
  <text x="660" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0 ⊕ 1 = 1</text>
  <text x="770" y="299" text-anchor="middle" font-size="11" fill="#666">1、0 配对消去</text>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="120" y="310" width="680" height="32" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="170" y="331" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="270" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <text x="370" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1</text>
  <text x="500" y="331" text-anchor="middle" font-size="12" fill="#446688">2 ⊕ 1 = 3</text>
  <text x="660" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1 ⊕ 3 = 2</text>
  <text x="770" y="331" text-anchor="middle" font-size="11" fill="#666">2 暂入，1 待消</text>

  <!-- 结束行 -->
  <g filter="url(#sk)">
    <rect x="120" y="342" width="680" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="170" y="363" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">结束</text>
  <text x="270" y="363" text-anchor="middle" font-size="12" fill="#999">i=3</text>
  <text x="370" y="363" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="500" y="363" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="660" y="363" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">return 2</text>
  <text x="770" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">缺失数 = 2 ✓</text>

  <!-- 配对消去示意 -->
  <text x="120" y="412" font-size="14" font-weight="bold" fill="#446688">配对相消全景：</text>
  <g filter="url(#sk)">
    <rect x="120" y="424" width="680" height="76" rx="8" fill="#f7faff" stroke="#446688"/>
  </g>
  <text x="460" y="448" text-anchor="middle" font-size="13" fill="#333">完整集 ⊕ 数组 = (3⊕0⊕1⊕2⊕3) ⊕ (3⊕0⊕1)</text>
  <text x="460" y="470" text-anchor="middle" font-size="13" fill="#333">= (3⊕3) ⊕ (0⊕0) ⊕ (1⊕1) ⊕ 2 = 0 ⊕ 0 ⊕ 0 ⊕ 2</text>
  <text x="460" y="490" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">= 2</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="200" y="516" width="520" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="460" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">成对的全消为 0，落单的 2 浮出 → 返回 2</text>
</svg>
