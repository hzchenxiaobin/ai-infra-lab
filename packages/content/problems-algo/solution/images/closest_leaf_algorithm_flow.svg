<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：父指针 + 从 target 出发的逐层 BFS</text>

  <!-- Start -->
  <ellipse cx="280" cy="54" rx="92" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#333">DFS 建父指针 parent[] 并定位 target(k)</text>

  <path d="M 280 72 L 280 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init BFS -->
  <rect x="150" y="90" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BFS 初始化</text>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#333">queue = [target], visited = {target}</text>

  <path d="M 280 134 L 280 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Level loop -->
  <rect x="130" y="152" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">逐层处理（按距离分层）</text>
  <text x="280" y="188" text-anchor="middle" font-size="11" fill="#333">取出当前层全部节点 levelNodes</text>

  <path d="M 280 196 L 280 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: leaf in level? -->
  <polygon points="280,214 410,256 280,298 150,256" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#333">levelNodes 中</text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#333">有叶节点？</text>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#888">(无左且无右子)</text>

  <!-- Yes -> return min leaf -->
  <path d="M 410 256 L 470 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="248" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="408" y="284" width="148" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="482" y="302" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回该层叶子中</text>
  <text x="482" y="318" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">的最小值 ⭐</text>

  <!-- No -> expand neighbors -->
  <path d="M 280 298 L 280 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="308" font-size="10" fill="#b85450">否</text>

  <rect x="120" y="316" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">扩展邻居入下一层</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#333">对每个 node：左子 / 右子 / parent</text>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#888">未访问则标记 visited 并入队</text>

  <!-- loop back to level loop -->
  <path d="M 120 344 L 60 344 L 60 174 L 130 174" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="262" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 48 262)">继续下一层</text>

  <!-- summary -->
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#888">BFS 按距离递增扩散；首个"含叶子的层"即最近距离，层内取最小值处理并列</text>
  <text x="280" y="436" text-anchor="middle" font-size="10" fill="#aaa">若 target 自身是叶 → 层 0 命中，直接返回 target.val</text>
</svg>
