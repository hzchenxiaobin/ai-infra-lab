<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：逐格扫描，双状态同步更新
  </text>

  <rect x="170" y="45" width="180" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">初始化 dp[0][0]=0, cnt[0][0]=1</text>

  <path d="M 260 80 L 260 95" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="95" width="200" height="35" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">遍历每个格子 (i, j)</text>

  <path d="M 260 130 L 260 145" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,145 340,180 260,215 180,180" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="185" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">board[i][j]=='X'?</text>

  <path d="M 180 180 L 110 180" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="125" y="172" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="35" y="163" width="75" height="35" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="72" y="185" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过</text>

  <path d="M 260 215 L 260 230" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="228" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="100" y="230" width="320" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">查 3 个前驱的 dp，找最大值 maxPred</text>

  <path d="M 260 265 L 260 280" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,280 360,315 260,350 160,315" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">maxPred &lt; 0?</text>

  <path d="M 160 315 L 90 315" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="307" font-size="11" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="20" y="298" width="75" height="35" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="57" y="320" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">不可达</text>

  <path d="M 260 350 L 260 365" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="363" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="60" y="365" width="400" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="385" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">dp[i][j] = maxPred + val</text>
  <text x="260" y="403" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cnt[i][j] = Σ cnt[前驱] (仅 dp==maxPred) % MOD</text>
</svg>
