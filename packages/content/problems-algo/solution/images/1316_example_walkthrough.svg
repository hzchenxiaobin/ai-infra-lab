<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：text = "abcabcabc"（n=9）</text>

  <!-- Table header -->
  <rect x="20" y="40" width="520" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="45" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">i</text>
  <text x="85" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">L</text>
  <text x="155" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">左半 text[i:i+L]</text>
  <text x="255" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">右半 text[i+L:i+2L]</text>
  <text x="345" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">哈希相等?</text>
  <text x="435" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">循环子串</text>
  <text x="508" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">动作</text>

  <!-- Column dividers -->
  <path d="M 65 40 L 65 400" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 105 40 L 105 400" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 205 40 L 205 400" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 305 40 L 305 400" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 385 40 L 385 400" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 465 40 L 465 400" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: i=0, L=1 → "a" vs "b" → no -->
  <rect x="20" y="70" width="520" height="28" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="45" y="88" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="85" y="88" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="155" y="88" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">"a"</text>
  <text x="255" y="88" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">"b"</text>
  <text x="345" y="88" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="435" y="88" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="508" y="88" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 2: i=0, L=2 → "ab" vs "ca" → no -->
  <rect x="20" y="100" width="520" height="28" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="45" y="118" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="85" y="118" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="155" y="118" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">"ab"</text>
  <text x="255" y="118" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">"ca"</text>
  <text x="345" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="435" y="118" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="508" y="118" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 3: i=0, L=3 → "abc" vs "abc" → yes ★ -->
  <rect x="20" y="130" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="45" y="148" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="85" y="148" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="155" y="148" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">"abc"</text>
  <text x="255" y="148" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">"abc"</text>
  <text x="345" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="435" y="148" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">"abcabc"</text>
  <text x="508" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">★ 新增</text>

  <!-- Row 4: i=0, L=4 → "abca" vs "bcab" → no -->
  <rect x="20" y="160" width="520" height="28" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="45" y="178" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="85" y="178" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="155" y="178" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">"abca"</text>
  <text x="255" y="178" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">"bcab"</text>
  <text x="345" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="435" y="178" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="508" y="178" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 5: i=1, L=3 → "bca" vs "bca" → yes ★ -->
  <rect x="20" y="190" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="45" y="208" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="85" y="208" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="155" y="208" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">"bca"</text>
  <text x="255" y="208" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">"bca"</text>
  <text x="345" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="435" y="208" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">"bcabca"</text>
  <text x="508" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">★ 新增</text>

  <!-- Row 6: i=2, L=3 → "cab" vs "cab" → yes ★ -->
  <rect x="20" y="220" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="45" y="238" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="85" y="238" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="155" y="238" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">"cab"</text>
  <text x="255" y="238" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">"cab"</text>
  <text x="345" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="435" y="238" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">"cabcab"</text>
  <text x="508" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">★ 新增</text>

  <!-- Row 7: i=3, L=3 → "abc" vs "abc" → yes but dup -->
  <rect x="20" y="250" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="45" y="268" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="85" y="268" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="155" y="268" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">"abc"</text>
  <text x="255" y="268" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">"abc"</text>
  <text x="345" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="435" y="268" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">"abcabc"</text>
  <text x="508" y="268" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">重复，跳过</text>

  <!-- separator row (other pairs omitted) -->
  <rect x="20" y="280" width="520" height="24" fill="#f8f8f8" stroke="#ddd" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="10.5" fill="#aaa" font-style="italic">⋯ 其余 (i, L) 对的哈希均不相等，省略 ⋯</text>

  <!-- divider -->
  <path d="M 20 314 L 540 314" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="60" y="326" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">结果：set = {"abcabc", "bcabca", "cabcab"}</text>
  <text x="280" y="363" text-anchor="middle" font-size="12" fill="#3a5a2a">返回 3</text>

  <!-- Note -->
  <rect x="60" y="380" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#666">i=3 处的 "abcabc" 与 i=0 处相同 → 哈希集合自动去重</text>
</svg>
