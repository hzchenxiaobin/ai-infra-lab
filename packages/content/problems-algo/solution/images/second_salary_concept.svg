<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">第二高的薪水 = 去重后按降序排列的第 2 个值</text>

  <!-- Employee table (left) -->
  <text x="90" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Employee 表</text>
  <rect x="30" y="64" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="82" font-size="10" fill="#333">id</text>
  <text x="100" y="82" font-size="10" fill="#333">salary</text>
  <line x1="70" y1="64" x2="70" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="92" width="120" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="108" font-size="10" fill="#333">1</text>
  <text x="100" y="108" font-size="10" fill="#333">100</text>
  <line x1="70" y1="92" x2="70" y2="116" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="116" width="120" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="132" font-size="10" fill="#333">2</text>
  <text x="100" y="132" font-size="10" fill="#333">200</text>
  <line x1="70" y1="116" x2="70" y2="140" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="140" width="120" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="156" font-size="10" fill="#333">3</text>
  <text x="100" y="156" font-size="10" fill="#333">300</text>
  <line x1="70" y1="140" x2="70" y2="164" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Transformation arrow -->
  <path d="M155 128 L335 128" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="245" y="120" text-anchor="middle" font-size="10" fill="#446688">DISTINCT + ORDER BY DESC</text>
  <text x="245" y="142" text-anchor="middle" font-size="9" fill="#888">去重 + 降序</text>

  <!-- Distinct sorted list (right) -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">不同薪水（降序）</text>
  <rect x="370" y="64" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="10" fill="#333">salary</text>

  <rect x="370" y="92" width="120" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="430" y="108" text-anchor="middle" font-size="10" fill="#333">300</text>
  <text x="392" y="108" font-size="9" fill="#888">第1高</text>

  <rect x="370" y="116" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">200</text>
  <text x="392" y="132" font-size="9" fill="#d6a040">第2高 ★</text>

  <rect x="370" y="140" width="120" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="430" y="156" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="392" y="156" font-size="9" fill="#888">第3高</text>

  <!-- Answer callout -->
  <path d="M430 168 L430 192" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="250" y="196" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="214" text-anchor="middle" font-size="11" fill="#333">取降序排列后的第 2 个值</text>
  <text x="380" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = 200</text>

  <!-- Pitfall hint bottom -->
  <rect x="40" y="262" width="480" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 两个易错点</text>
  <text x="60" y="302" font-size="10" fill="#333">① 必须先 DISTINCT：最高薪若有重复，不去重会取到「另一个最高」</text>
  <text x="60" y="318" font-size="10" fill="#333">② 必须处理「无第二高」：只有 1 个薪水值时要返回 NULL 而非空结果集</text>
</svg>
