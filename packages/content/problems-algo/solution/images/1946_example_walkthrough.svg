<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：从左到右逐位判定</text>

  <!-- example 1 -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">例 1：num = "132"，change = [9,8,5,0,3,6,4,2,6,8]</text>

  <!-- header row -->
  <g font-size="11" fill="#888">
    <text x="60" y="92">i</text>
    <text x="120" y="92">d</text>
    <text x="180" y="92">change[d]</text>
    <text x="280" y="92">判定</text>
    <text x="430" y="92">res</text>
  </g>

  <!-- i=0 -->
  <g font-size="12">
    <rect x="50" y="100" width="40" height="28" rx="4" fill="#fff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="119" text-anchor="middle" fill="#333">0</text>
    <rect x="110" y="100" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="130" y="119" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="170" y="100" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="200" y="119" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="270" y="100" width="150" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="345" y="119" text-anchor="middle" fill="#4a7a3a">8&gt;1 开突 ✓</text>
    <rect x="420" y="100" width="160" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="500" y="119" text-anchor="middle" fill="#333" font-weight="bold">8 _ _</text>
  </g>

  <!-- i=1 -->
  <g font-size="12">
    <rect x="50" y="134" width="40" height="28" rx="4" fill="#fff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="153" text-anchor="middle" fill="#333">1</text>
    <rect x="110" y="134" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="130" y="153" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="170" y="134" width="60" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="200" y="153" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="270" y="134" width="150" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="345" y="153" text-anchor="middle" fill="#b85450">0&lt;3 停 ✗</text>
    <rect x="420" y="134" width="160" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="500" y="153" text-anchor="middle" fill="#333" font-weight="bold">8 3 2</text>
  </g>

  <text x="40" y="184" font-size="12" fill="#4a7a3a" font-weight="bold">→ 结果 "832"</text>
  <path d="M 130 178 L 130 198" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- example 2 -->
  <text x="40" y="228" font-size="12" fill="#446688" font-weight="bold">例 2：num = "021"，change = [9,4,3,5,7,2,1,9,0,6]</text>

  <g font-size="11" fill="#888">
    <text x="60" y="256">i</text>
    <text x="120" y="256">d</text>
    <text x="180" y="256">change[d]</text>
    <text x="280" y="256">判定</text>
    <text x="430" y="256">res</text>
  </g>

  <g font-size="12">
    <rect x="50" y="264" width="40" height="28" rx="4" fill="#fff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="283" text-anchor="middle" fill="#333">0</text>
    <rect x="110" y="264" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="130" y="283" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <rect x="170" y="264" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="200" y="283" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="270" y="264" width="150" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="345" y="283" text-anchor="middle" fill="#4a7a3a">9&gt;0 开突 ✓</text>
    <rect x="420" y="264" width="160" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="500" y="283" text-anchor="middle" fill="#333" font-weight="bold">9 _ _</text>
  </g>

  <g font-size="12">
    <rect x="50" y="298" width="40" height="28" rx="4" fill="#fff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="317" text-anchor="middle" fill="#333">1</text>
    <rect x="110" y="298" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="130" y="317" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="170" y="298" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="200" y="317" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="270" y="298" width="150" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="345" y="317" text-anchor="middle" fill="#4a7a3a">3&gt;2 续突 ✓</text>
    <rect x="420" y="298" width="160" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="500" y="317" text-anchor="middle" fill="#333" font-weight="bold">9 3 _</text>
  </g>

  <g font-size="12">
    <rect x="50" y="332" width="40" height="28" rx="4" fill="#fff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="351" text-anchor="middle" fill="#333">2</text>
    <rect x="110" y="332" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="130" y="351" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="170" y="332" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="200" y="351" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="270" y="332" width="150" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="345" y="351" text-anchor="middle" fill="#4a7a3a">4&gt;1 续突 ✓</text>
    <rect x="420" y="332" width="160" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="500" y="351" text-anchor="middle" fill="#333" font-weight="bold">9 3 4</text>
  </g>

  <text x="40" y="392" font-size="12" fill="#4a7a3a" font-weight="bold">→ 结果 "934"（开突后全程变大，一直续突到末尾）</text>

  <!-- note -->
  <rect x="40" y="408" width="560" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="428" font-size="11" fill="#555">对照：例 1 开突后立刻遇 "变小" 停；例 2 开突后一路 "变大" 续到尾。</text>
  <text x="60" y="443" font-size="10" fill="#888">若全程没有 change[d] &gt; d 的位置 → 不开突，原样返回 num。</text>
</svg>
