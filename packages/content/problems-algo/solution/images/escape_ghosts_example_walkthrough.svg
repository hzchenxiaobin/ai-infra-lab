<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个示例的距离比较与判定</text>

  <!-- ===== 示例 1 ===== -->
  <rect x="24" y="44" width="520" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">示例1：ghosts=[[1,0],[0,3]], target=[0,1] → true</text>

  <!-- 表头 -->
  <text x="40" y="86" font-size="10" fill="#888" font-weight="bold">主体</text>
  <text x="120" y="86" font-size="10" fill="#888" font-weight="bold">坐标</text>
  <text x="230" y="86" font-size="10" fill="#888" font-weight="bold">到目的地距离</text>
  <text x="380" y="86" font-size="10" fill="#888" font-weight="bold">与 D 比较</text>
  <text x="490" y="86" font-size="10" fill="#888" font-weight="bold">判定</text>

  <line x1="36" y1="92" x2="528" y2="92" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <!-- 你 -->
  <ellipse cx="56" cy="110" rx="9" ry="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="114" font-size="10" fill="#446688" font-weight="bold">(0,0)</text>
  <text x="230" y="114" font-size="10" fill="#333">D = |0| + |1| = 1</text>
  <text x="380" y="114" font-size="10" fill="#888">—（基准）</text>
  <text x="490" y="114" font-size="10" fill="#888">—</text>

  <!-- 鬼1 -->
  <ellipse cx="56" cy="132" rx="9" ry="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="136" font-size="10" fill="#b85450" font-weight="bold">(1,0)</text>
  <text x="230" y="136" font-size="10" fill="#333">G₁ = |1-0| + |0-1| = 2</text>
  <text x="380" y="136" font-size="10" fill="#4a7a3a" font-weight="bold">G₁=2 &gt; D=1 ✓</text>
  <text x="490" y="136" font-size="10" fill="#888">继续</text>

  <!-- 鬼2 -->
  <ellipse cx="56" cy="152" rx="9" ry="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="156" font-size="10" fill="#b85450" font-weight="bold">(0,3)</text>
  <text x="230" y="156" font-size="10" fill="#333">G₂ = |0-0| + |3-1| = 2</text>
  <text x="380" y="156" font-size="10" fill="#4a7a3a" font-weight="bold">G₂=2 &gt; D=1 ✓</text>
  <text x="490" y="156" font-size="10" fill="#4a7a3a" font-weight="bold">→ true</text>

  <!-- ===== 示例 2 ===== -->
  <rect x="24" y="172" width="520" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="192" font-size="12" fill="#b85450" font-weight="bold">示例2：ghosts=[[1,0]], target=[2,0] → false</text>

  <text x="40" y="214" font-size="10" fill="#888" font-weight="bold">主体</text>
  <text x="120" y="214" font-size="10" fill="#888" font-weight="bold">坐标</text>
  <text x="230" y="214" font-size="10" fill="#888" font-weight="bold">到目的地距离</text>
  <text x="380" y="214" font-size="10" fill="#888" font-weight="bold">与 D 比较</text>
  <text x="490" y="214" font-size="10" fill="#888" font-weight="bold">判定</text>
  <line x1="36" y1="220" x2="528" y2="220" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <ellipse cx="56" cy="238" rx="9" ry="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="242" font-size="10" fill="#446688" font-weight="bold">(0,0)</text>
  <text x="230" y="242" font-size="10" fill="#333">D = |2| + |0| = 2</text>
  <text x="380" y="242" font-size="10" fill="#888">—（基准）</text>
  <text x="490" y="242" font-size="10" fill="#888">—</text>

  <ellipse cx="56" cy="256" rx="9" ry="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="260" font-size="10" fill="#b85450" font-weight="bold">(1,0)</text>
  <text x="230" y="260" font-size="10" fill="#333">G₁ = |1-2| + |0-0| = 1</text>
  <text x="380" y="260" font-size="10" fill="#b85450" font-weight="bold">G₁=1 ≤ D=2 ✗</text>
  <text x="490" y="260" font-size="10" fill="#b85450" font-weight="bold">→ false</text>

  <!-- ===== 示例 3 ===== -->
  <rect x="24" y="276" width="520" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="296" font-size="12" fill="#b85450" font-weight="bold">示例3：ghosts=[[2,0]], target=[1,0] → false</text>

  <text x="40" y="318" font-size="10" fill="#888" font-weight="bold">主体</text>
  <text x="120" y="318" font-size="10" fill="#888" font-weight="bold">坐标</text>
  <text x="230" y="318" font-size="10" fill="#888" font-weight="bold">到目的地距离</text>
  <text x="380" y="318" font-size="10" fill="#888" font-weight="bold">与 D 比较</text>
  <text x="490" y="318" font-size="10" fill="#888" font-weight="bold">判定</text>
  <line x1="36" y1="324" x2="528" y2="324" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <ellipse cx="56" cy="342" rx="9" ry="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="346" font-size="10" fill="#446688" font-weight="bold">(0,0)</text>
  <text x="230" y="346" font-size="10" fill="#333">D = |1| + |0| = 1</text>
  <text x="380" y="346" font-size="10" fill="#888">—（基准）</text>
  <text x="490" y="346" font-size="10" fill="#888">—</text>

  <ellipse cx="56" cy="360" rx="9" ry="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="364" font-size="10" fill="#b85450" font-weight="bold">(2,0)</text>
  <text x="230" y="364" font-size="10" fill="#333">G₁ = |2-1| + |0-0| = 1</text>
  <text x="380" y="364" font-size="10" fill="#b85450" font-weight="bold">G₁=1 ≤ D=1 ✗</text>
  <text x="490" y="364" font-size="10" fill="#b85450" font-weight="bold">→ false</text>

  <!-- ===== 关键提示 ===== -->
  <rect x="24" y="384" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="284" y="404" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⚠️ 「同时到达也不算逃脱」→ 判定用 G ≤ D（含等号），而非 G &lt; D</text>
  <text x="284" y="420" text-anchor="middle" font-size="10" fill="#888">示例3 正是 G==D 的「同时到达」情形：鬼与你都在第 1 步到达目的地，故 false</text>
</svg>
