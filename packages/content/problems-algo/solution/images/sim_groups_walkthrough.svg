<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：strs = ["tars","rats","arts","star"]</text>

  <!-- table header -->
  <rect x="20" y="44" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤 (i,j)</text>
  <rect x="100" y="44" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">差异位数</text>
  <rect x="230" y="44" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">parent 数组</text>
  <rect x="380" y="44" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count</text>
  <rect x="428" y="44" width="112" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="484" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作说明</text>

  <!-- row init -->
  <rect x="20" y="70" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">init</text>
  <rect x="100" y="70" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="165" y="89" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="230" y="70" width="150" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="305" y="89" text-anchor="middle" font-size="11.5" fill="#333">[0, 1, 2, 3]</text>
  <rect x="380" y="70" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="404" y="89" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <rect x="428" y="70" width="112" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="484" y="89" text-anchor="middle" font-size="10.5" fill="#666">各自为根</text>

  <!-- row (0,1) -->
  <rect x="20" y="98" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(0,1)</text>
  <rect x="100" y="98" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="117" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 → 相似</text>
  <rect x="230" y="98" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="305" y="117" text-anchor="middle" font-size="11.5" fill="#333">[0, <tspan fill="#b85450" font-weight="bold">0</tspan>, 2, 3]</text>
  <rect x="380" y="98" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="404" y="117" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="428" y="98" width="112" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="484" y="117" text-anchor="middle" font-size="10.5" fill="#4a7a3a">union(0,1)</text>

  <!-- row (0,2) -->
  <rect x="20" y="126" width="80" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="145" text-anchor="middle" font-size="11" fill="#888">(0,2)</text>
  <rect x="100" y="126" width="130" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="165" y="145" text-anchor="middle" font-size="11" fill="#b85450">3 → 不相似</text>
  <rect x="230" y="126" width="150" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="305" y="145" text-anchor="middle" font-size="11.5" fill="#888">[0, 0, 2, 3]</text>
  <rect x="380" y="126" width="48" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="404" y="145" text-anchor="middle" font-size="11.5" fill="#888">3</text>
  <rect x="428" y="126" width="112" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="484" y="145" text-anchor="middle" font-size="10.5" fill="#aaa">跳过</text>

  <!-- row (0,3) -->
  <rect x="20" y="154" width="80" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="173" text-anchor="middle" font-size="11" fill="#888">(0,3)</text>
  <rect x="100" y="154" width="130" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="165" y="173" text-anchor="middle" font-size="11" fill="#b85450">4 → 不相似</text>
  <rect x="230" y="154" width="150" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="305" y="173" text-anchor="middle" font-size="11.5" fill="#888">[0, 0, 2, 3]</text>
  <rect x="380" y="154" width="48" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="404" y="173" text-anchor="middle" font-size="11.5" fill="#888">3</text>
  <rect x="428" y="154" width="112" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="484" y="173" text-anchor="middle" font-size="10.5" fill="#aaa">跳过</text>

  <!-- row (1,2) -->
  <rect x="20" y="182" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="201" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(1,2)</text>
  <rect x="100" y="182" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 → 相似</text>
  <rect x="230" y="182" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="305" y="201" text-anchor="middle" font-size="11.5" fill="#333">[0, 0, <tspan fill="#b85450" font-weight="bold">0</tspan>, 3]</text>
  <rect x="380" y="182" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="404" y="201" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <rect x="428" y="182" width="112" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="484" y="201" text-anchor="middle" font-size="10.5" fill="#4a7a3a">union(1,2)→0</text>

  <!-- row (1,3) -->
  <rect x="20" y="210" width="80" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="229" text-anchor="middle" font-size="11" fill="#888">(1,3)</text>
  <rect x="100" y="210" width="130" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="165" y="229" text-anchor="middle" font-size="11" fill="#b85450">4 → 不相似</text>
  <rect x="230" y="210" width="150" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="305" y="229" text-anchor="middle" font-size="11.5" fill="#888">[0, 0, 0, 3]</text>
  <rect x="380" y="210" width="48" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="404" y="229" text-anchor="middle" font-size="11.5" fill="#888">2</text>
  <rect x="428" y="210" width="112" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="484" y="229" text-anchor="middle" font-size="10.5" fill="#aaa">跳过</text>

  <!-- row (2,3) -->
  <rect x="20" y="238" width="80" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="257" text-anchor="middle" font-size="11" fill="#888">(2,3)</text>
  <rect x="100" y="238" width="130" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="165" y="257" text-anchor="middle" font-size="11" fill="#b85450">4 → 不相似</text>
  <rect x="230" y="238" width="150" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="305" y="257" text-anchor="middle" font-size="11.5" fill="#888">[0, 0, 0, 3]</text>
  <rect x="380" y="238" width="48" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="404" y="257" text-anchor="middle" font-size="11.5" fill="#888">2</text>
  <rect x="428" y="238" width="112" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="484" y="257" text-anchor="middle" font-size="10.5" fill="#aaa">跳过</text>

  <!-- result -->
  <rect x="20" y="276" width="520" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终 count = 2 → 相似字符串组数 = 2</text>

  <!-- groups viz -->
  <text x="280" y="334" text-anchor="middle" font-size="11.5" fill="#888">组 1：{tars, rats, arts}（根 0）　|　组 2：{star}（根 3）</text>

  <rect x="60" y="350" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="100" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">tars</text>
  <rect x="160" y="350" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="200" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">rats</text>
  <rect x="260" y="350" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">arts</text>
  <line x1="140" y1="363" x2="160" y2="363" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="240" y1="363" x2="260" y2="363" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="380" y="350" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="420" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">star</text>

  <rect x="40" y="392" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="10.5" fill="#444">tars∼rats、rats∼arts 直接相似；tars 与 arts 差 3 不直接相似，但传递连通同组</text>
</svg>
