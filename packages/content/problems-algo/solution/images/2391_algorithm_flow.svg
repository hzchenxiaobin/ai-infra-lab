<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍扫描记录「最远房子」，再累加行驶前缀</text>

  <!-- Start oval -->
  <ellipse cx="300" cy="58" rx="130" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = 0；last[M]=last[P]=last[G]=0</text>

  <!-- arrow down -->
  <path d="M 300 80 L 300 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop rect -->
  <rect x="170" y="108" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">遍历 (i, s) in enumerate(garbage)</text>

  <!-- arrow down -->
  <path d="M 300 146 L 300 172" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- collect box -->
  <rect x="150" y="176" width="300" height="34" fill="#eef6ef" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="198" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">ans += len(s)　　（收集时间，每单位 1 分钟）</text>

  <!-- arrow down -->
  <path d="M 300 212 L 300 238" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update last box -->
  <rect x="120" y="242" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="264" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for c in s: last[c] = i　　（刷新该类垃圾的最远房子）</text>

  <!-- dashed back to loop -->
  <path d="M 120 259 L 70 259 L 70 126 L 168 126" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="190" font-size="10" fill="#888">回到循环</text>

  <!-- exit arrow (from loop right) to travel box -->
  <path d="M 430 126 L 540 126 L 540 312 L 482 312" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="220" text-anchor="middle" font-size="10" fill="#888">遍历完</text>

  <!-- travel accumulation box -->
  <rect x="110" y="296" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="318" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for c in MPG: ans += Σ travel[:last[c]]　（各车行驶到终点）</text>

  <!-- arrow down -->
  <path d="M 300 332 L 300 358" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="300" cy="382" rx="100" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="387" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return ans</text>

  <!-- bottom note -->
  <rect x="60" y="420" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="436" text-anchor="middle" font-size="11" fill="#666">单遍 O(n) 扫描；last 仅 3 个变量，额外空间 O(1)</text>
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#888">行驶前缀可用滚动 ts 累加，避免重复切片</text>
</svg>
