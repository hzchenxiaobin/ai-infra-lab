<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：双指针 + 最短前后匹配</text>

  <!-- init -->
  <rect x="200" y="46" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i=0, j=n-1, ans=0</text>
  <path d="M 270 80 L 270 96" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: i <= j ? -->
  <polygon points="270,100 360,140 270,180 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i ≤ j ?</text>
  <text x="270" y="154" text-anchor="middle" font-size="10" fill="#888">还有字符待处理</text>
  <!-- no -> return -->
  <path d="M 360 140 L 430 140" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="134" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="430" y="124" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <!-- yes down -->
  <path d="M 270 180 L 270 198" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="194" font-size="10" fill="#888">是</text>

  <!-- enumerate l -->
  <rect x="160" y="200" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="219" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">枚举 l = 1 .. ⌊(j-i+1)/2⌋</text>
  <text x="270" y="234" text-anchor="middle" font-size="10" fill="#555">比较 text[i:i+l] 与 text[j-l+1:j+1]</text>
  <path d="M 270 242 L 270 258" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: found match ? -->
  <polygon points="270,260 360,298 270,336 180,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">存在 l 匹配?</text>
  <!-- yes left: ans+=2, advance -->
  <path d="M 180 298 L 110 298" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a">是（取最短 l）</text>
  <rect x="20" y="280" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="65" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans += 2</text>
  <text x="65" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a">i+=l, j-=l</text>
  <!-- loop back to i<=j -->
  <path d="M 65 280 L 65 64 L 200 64" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="180" font-size="10" fill="#4a7a3a">回到判断 i≤j</text>

  <!-- no right: ans += 1, break -->
  <path d="M 360 298 L 430 298" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="292" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="430" y="280" width="95" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="477" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ans += 1</text>
  <text x="477" y="312" text-anchor="middle" font-size="10" fill="#b85450">中间剩一段，break</text>
  <path d="M 477 320 L 477 156 L 475 156" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- footer note -->
  <rect x="30" y="356" width="480" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="376" font-size="10" fill="#555">每轮在剩余区间 [i, j] 内找最短的「前缀 == 后缀」，找到就成对剥掉（ans += 2），</text>
  <text x="50" y="392" font-size="10" fill="#555">找不到说明剩余整段是回文中心（ans += 1）。总段数奇偶由是否有中心决定。</text>
</svg>
