<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两个按 id 升序的 (id,val) 数组 → 双指针归并，同 id 求和</text>

  <!-- nums1 label -->
  <text x="58" y="80" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">nums1</text>
  <!-- nums1 cells: [[1,2],[2,3],[4,5]] -->
  <!-- cell1: id=1 val=2 (highlight, equal) -->
  <rect x="104" y="58" width="72" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="74" text-anchor="middle" font-size="10" fill="#b85450">id=1</text>
  <text x="140" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">2</text>
  <!-- cell2: id=2 val=3 -->
  <rect x="180" y="58" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="216" y="74" text-anchor="middle" font-size="10" fill="#446688">id=2</text>
  <text x="216" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <!-- cell3: id=4 val=5 -->
  <rect x="256" y="58" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="74" text-anchor="middle" font-size="10" fill="#446688">id=4</text>
  <text x="292" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">5</text>

  <!-- i pointer on nums1[0] -->
  <path d="M 140 108 L 140 122" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="136" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i</text>

  <!-- nums2 label -->
  <text x="58" y="180" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">nums2</text>
  <!-- nums2 cells: [[1,4],[3,2],[4,1]] -->
  <!-- cell1: id=1 val=4 (highlight, equal) -->
  <rect x="104" y="158" width="72" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="174" text-anchor="middle" font-size="10" fill="#b85450">id=1</text>
  <text x="140" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">4</text>
  <!-- cell2: id=3 val=2 -->
  <rect x="180" y="158" width="72" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="216" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">id=3</text>
  <text x="216" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
  <!-- cell3: id=4 val=1 -->
  <rect x="256" y="158" width="72" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">id=4</text>
  <text x="292" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>

  <!-- j pointer on nums2[0] -->
  <path d="M 140 208 L 140 222" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="236" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">j</text>

  <!-- match / sum annotation -->
  <path d="M 140 150 L 140 156" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="360" y="120" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="145" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">id 相同 → 合并 [1, 2+4=6]</text>

  <!-- three-branch rule box -->
  <rect x="36" y="262" width="500" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="286" y="282" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">三分支决策（按 id 比较，每步只前进一侧）</text>
  <text x="56" y="306" font-size="11.5" fill="#446688" font-weight="bold">id1 &lt; id2 → 取 nums1[i]，i++</text>
  <text x="56" y="326" font-size="11.5" fill="#4a7a3a" font-weight="bold">id1 &gt; id2 → 取 nums2[j]，j++</text>
  <text x="56" y="346" font-size="11.5" fill="#b85450" font-weight="bold">id1 == id2 → 合并 [id, v1+v2]，i++, j++</text>
  <text x="348" y="326" font-size="11" fill="#888">某侧耗尽 → 扫尾拷贝</text>
</svg>
