<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="560" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：三道判定关</text>

  <!-- Start oval -->
  <ellipse cx="250" cy="60" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">输入 n</text>

  <line x1="250" y1="80" x2="250" y2="98" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: n > 0 ? -->
  <polygon points="250,102 338,148 250,194 162,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="144" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">n &gt; 0 ?</text>
  <text x="250" y="160" text-anchor="middle" font-size="10" fill="#888">排除 0 和负数</text>

  <text x="262" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="250" y1="194" x2="250" y2="212" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: (n & (n-1)) == 0 ? -->
  <polygon points="250,216 360,262 250,308 140,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="258" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(n &amp; (n−1)) == 0 ?</text>
  <text x="250" y="274" text-anchor="middle" font-size="10" fill="#888">是 2 的幂（恰一个 1）</text>

  <text x="262" y="328" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="250" y1="308" x2="250" y2="326" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 3: (n & 0x55555555) != 0 ? -->
  <polygon points="250,330 370,376 250,422 130,376" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="372" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(n &amp; 0x55555555) != 0 ?</text>
  <text x="250" y="388" text-anchor="middle" font-size="10" fill="#888">1 在偶数位</text>

  <!-- Yes branch (right) to true -->
  <text x="382" y="370" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 370 376 Q 430 376 430 434" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return true -->
  <rect x="360" y="438" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="460" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <line x1="430" y1="472" x2="430" y2="494" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="430" cy="512" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="517" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">是 4 的幂</text>

  <!-- No branches merge to false on left -->
  <text x="118" y="370" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 130 376 Q 70 376 70 438" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="126" y="256" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 140 262 Q 55 262 55 376 Q 55 438 70 438" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="146" y="142" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 162 148 Q 40 148 40 300 Q 40 438 70 438" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return false -->
  <rect x="10" y="438" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="70" y="460" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return false ✗</text>

  <line x1="70" y1="472" x2="70" y2="494" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="70" cy="512" rx="44" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="517" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">非 4 的幂</text>

  <!-- bottom note -->
  <rect x="120" y="536" width="260" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="550" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">时间 O(1)，空间 O(1)，无循环</text>
</svg>