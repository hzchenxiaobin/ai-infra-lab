<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：分组 → 排序 → 相邻三元组判窗</text>

  <rect x="250" y="30" width="100" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="46" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M 300 54 L 300 62" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="64" width="250" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">哈希分组：姓名 → 分钟值列表</text>
  <text x="433" y="82" font-size="9.5" fill="#888" filter="url(#rough2)">HHMM→HH×60+MM</text>

  <path d="M 300 92 L 300 100" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="102" width="250" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取一位员工，其时间排序</text>

  <path d="M 300 130 L 300 140" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="195,170 300,142 405,170 300,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="164" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">存在 i 使</text>
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">ts[i+2] − ts[i] &lt; 60 ?</text>

  <text x="460" y="132" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">严格小于（恰好 60 不算）</text>

  <path d="M 405 170 L 420 170" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="424" y="152" width="84" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="466" y="174" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">加入答案</text>

  <path d="M 300 198 L 300 210" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="208" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="218,252 300,228 382,252 300,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="256" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">还有员工？</text>

  <path d="M 466 188 L 466 212 L 140 212 L 140 116 L 173 116" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 252 L 140 252 L 140 116" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="132" y="186" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">下一位</text>
  <text x="180" y="246" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 300 276 L 300 288" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="286" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="205" y="288" width="190" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="306" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">答案按字典序排序</text>

  <path d="M 300 316 L 300 324" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="252" y="326" width="96" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="343" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">返回 ans</text>
</svg>
