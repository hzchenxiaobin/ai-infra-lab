<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#fdfcf7"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">扫雷游戏：三种点击规则</text>
  <path d="M 290 42 Q 440 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Rule 1: click M -> X -->
  <g filter="url(#sk)"><rect x="40" y="68" width="250" height="150" rx="10" fill="#fdeef0" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="165" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">规则① 点到地雷 M</text>
  <g filter="url(#sk)"><rect x="70" y="108" width="46" height="46" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="93" y="138" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">E</text>
  <g filter="url(#sk)"><rect x="116" y="108" width="46" height="46" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="139" y="138" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">M</text>
  <path d="M 175 131 L 205 131" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="190" y="123" text-anchor="middle" font-size="10" fill="#5a5a5a">点击</text>
  <g filter="url(#sk)"><rect x="216" y="108" width="46" height="46" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="239" y="138" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">X</text>
  <text x="165" y="178" text-anchor="middle" font-size="11" fill="#7a3030">M → X，游戏结束，立即返回</text>
  <text x="165" y="196" text-anchor="middle" font-size="10" fill="#888">不递归，不扩散</text>

  <!-- Rule 2: click E with adjacent mines -> digit -->
  <g filter="url(#sk)"><rect x="315" y="68" width="250" height="150" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="440" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#c98a2b">规则② E 周围有雷</text>
  <!-- mini grid 3x1 with M neighbor -->
  <g filter="url(#sk)"><rect x="345" y="108" width="46" height="46" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="368" y="138" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">M</text>
  <g filter="url(#sk)"><rect x="391" y="108" width="46" height="46" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="414" y="138" text-anchor="middle" font-size="16" fill="#7a5415" font-weight="bold">E</text>
  <g filter="url(#sk)"><rect x="437" y="108" width="46" height="46" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="460" y="138" text-anchor="middle" font-size="16" fill="#bbb">E</text>
  <path d="M 495 131 L 525 131" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="510" y="123" text-anchor="middle" font-size="10" fill="#5a5a5a">数雷</text>
  <g filter="url(#sk)"><rect x="536" y="108" width="46" height="46" rx="3" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.4"/></g>
  <text x="559" y="138" text-anchor="middle" font-size="16" fill="#7a5415" font-weight="bold">1</text>
  <text x="440" y="178" text-anchor="middle" font-size="11" fill="#7a5415">E → 数字（相邻雷数），停止</text>
  <text x="440" y="196" text-anchor="middle" font-size="10" fill="#888">边界格，不再递归</text>

  <!-- Rule 3: click E no adjacent mines -> B + expand 8 dirs -->
  <g filter="url(#sk)"><rect x="590" y="68" width="250" height="150" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="715" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a8e4a">规则③ E 周围无雷</text>
  <g filter="url(#sk)"><rect x="620" y="108" width="46" height="46" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="643" y="138" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold">E</text>
  <path d="M 675 131 L 705 131" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="690" y="123" text-anchor="middle" font-size="10" fill="#5a5a5a">变B</text>
  <g filter="url(#sk)"><rect x="716" y="108" width="46" height="46" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="739" y="138" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold">B</text>
  <text x="715" y="178" text-anchor="middle" font-size="11" fill="#2e6e2e">E → B，递归揭露 8 邻居</text>
  <text x="715" y="196" text-anchor="middle" font-size="10" fill="#888">空白扩散（flood fill）</text>

  <!-- 8-direction expansion illustration -->
  <text x="440" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">空白扩散：B 的 8 个方向邻居都被递归揭露</text>

  <!-- center B -->
  <g filter="url(#sk)"><rect x="394" y="278" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="420" y="312" text-anchor="middle" font-size="17" fill="#2e6e2e" font-weight="bold">B</text>
  <text x="420" y="348" text-anchor="middle" font-size="10" fill="#888">起点（无相邻雷）</text>

  <!-- 8 neighbors -->
  <g filter="url(#sk)"><rect x="338" y="262" width="44" height="44" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="360" y="290" text-anchor="middle" font-size="13" fill="#2e6e2e">E</text>
  <g filter="url(#sk)"><rect x="398" y="262" width="44" height="44" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="420" y="290" text-anchor="middle" font-size="13" fill="#2e6e2e">E</text>
  <g filter="url(#sk)"><rect x="458" y="262" width="44" height="44" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="480" y="290" text-anchor="middle" font-size="13" fill="#2e6e2e">E</text>

  <g filter="url(#sk)"><rect x="338" y="302" width="44" height="44" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="360" y="330" text-anchor="middle" font-size="13" fill="#2e6e2e">E</text>
  <g filter="url(#sk)"><rect x="458" y="302" width="44" height="44" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="480" y="330" text-anchor="middle" font-size="13" fill="#2e6e2e">E</text>

  <g filter="url(#sk)"><rect x="338" y="342" width="44" height="44" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="360" y="370" text-anchor="middle" font-size="13" fill="#2e6e2e">E</text>
  <g filter="url(#sk)"><rect x="398" y="342" width="44" height="44" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="420" y="370" text-anchor="middle" font-size="13" fill="#2e6e2e">E</text>
  <g filter="url(#sk)"><rect x="458" y="342" width="44" height="44" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="480" y="370" text-anchor="middle" font-size="13" fill="#2e6e2e">E</text>

  <!-- arrows from center to 8 neighbors -->
  <g filter="url(#sk)" stroke="#4a8e4a" stroke-width="1.2" fill="none">
    <path d="M 394 304 L 384 296" marker-end="url(#ar)"/>
    <path d="M 420 278 L 420 268" marker-end="url(#ar)"/>
    <path d="M 446 304 L 456 296" marker-end="url(#ar)"/>
    <path d="M 394 320 L 384 328" marker-end="url(#ar)"/>
    <path d="M 446 320 L 456 328" marker-end="url(#ar)"/>
    <path d="M 394 336 L 384 356" marker-end="url(#ar)"/>
    <path d="M 420 348 L 420 362" marker-end="url(#ar)"/>
    <path d="M 446 336 L 456 356" marker-end="url(#ar)"/>
  </g>

  <!-- side note -->
  <g filter="url(#sk)"><rect x="570" y="262" width="270" height="120" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="585" y="286" font-size="12" font-weight="bold" fill="#444">关键洞察：</text>
  <text x="585" y="308" font-size="11" fill="#2e6e2e">· 只有"无相邻雷的 E"才触发扩散</text>
  <text x="585" y="328" font-size="11" fill="#7a5415">· 扩散到"有雷邻居的 E"变数字即停</text>
  <text x="585" y="348" font-size="11" fill="#b85450">· 扩散到 M 不动（题目保证点 E/M）</text>
  <text x="585" y="368" font-size="10" fill="#888">本质：8 方向 flood fill + 边界停止</text>

  <text x="440" y="430" text-anchor="middle" font-size="11" fill="#666">数字格 = flood fill 的"天然堤坝"，B 区连片扩散到数字格为止</text>
</svg>
