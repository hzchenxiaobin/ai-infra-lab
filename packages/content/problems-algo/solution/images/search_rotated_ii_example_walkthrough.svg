<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,0,1,1,1], target = 0</text>

  <!-- ===== Round 1: ambiguous case ===== -->
  <rect x="20" y="42" width="520" height="120" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="42" width="520" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第 1 轮：left=0, right=4, mid=2 → 歧义分支</text>

  <rect x="80" y="72" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="128" y="72" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="90" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="176" y="72" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="224" y="72" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="90" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="272" y="72" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="90" text-anchor="middle" font-size="11" fill="#333">1</text>

  <text x="102" y="112" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">left=0</text>
  <text x="198" y="112" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mid=2</text>
  <text x="294" y="112" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">right=4</text>

  <rect x="40" y="120" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">nums[mid]=1 ≠ 0；nums[left]=1 == nums[mid]=1 → 歧义 → left++ → left=1</text>

  <path d="M 280 162 L 280 174" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- ===== Round 2: left half ordered ===== -->
  <rect x="20" y="178" width="520" height="120" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="178" width="520" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第 2 轮：left=1, right=4, mid=2 → 左半有序，target 在左半</text>

  <rect x="80" y="208" width="44" height="26" fill="#eeeeee" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="102" y="226" text-anchor="middle" font-size="11" fill="#aaa" text-decoration="line-through">1</text>
  <rect x="128" y="208" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="176" y="208" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="224" y="208" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="226" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="272" y="208" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="226" text-anchor="middle" font-size="11" fill="#333">1</text>

  <text x="150" y="248" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">left=1</text>
  <text x="198" y="248" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mid=2</text>
  <text x="294" y="248" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">right=4</text>

  <path d="M 132 200 L 132 194 L 216 194 L 216 200" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="174" y="190" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">左半有序</text>

  <rect x="40" y="256" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">nums[left]=0 ≤ 0 &lt; nums[mid]=1 → target 在左半 → right = mid−1 = 1</text>

  <path d="M 280 298 L 280 310" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- ===== Round 3: hit ===== -->
  <rect x="20" y="314" width="520" height="100" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="314" width="520" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第 3 轮：left=1, right=1, mid=1 → 命中！</text>

  <rect x="128" y="344" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="362" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <text x="150" y="384" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">left=right=mid=1</text>

  <rect x="40" y="392" width="480" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">nums[mid]=0 == target=0 → return true ✓</text>

  <text x="280" y="438" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">第 1 轮遇歧义 left++ 跳过，第 2 轮恢复正常二分，第 3 轮命中</text>
</svg>
