<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="580" height="340" fill="#fdfcf7"/>

  <text x="290" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">两种解法对比：全部串行 vs 同向并发</text>
  <path d="M 150 34 Q 290 42 430 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Method 1: serialized ===== -->
  <text x="30" y="68" font-size="12" fill="#444" font-weight="bold">方法一：互斥锁（全部串行，crossCar 在锁内）</text>
  <path d="M 40 90 L 540 90" stroke="#888" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 5 sequential blocks -->
  <g filter="url(#sk)"><rect x="60" y="78" width="68" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="94" y="94" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">车1</text>

  <g filter="url(#sk)"><rect x="132" y="78" width="68" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="166" y="94" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">车3</text>

  <g filter="url(#sk)"><rect x="204" y="78" width="68" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="238" y="94" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">车5</text>

  <!-- switch gap -->
  <path d="M 276 90 L 286 90" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3 2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="281" y="74" text-anchor="middle" font-size="8" fill="#b85450">切灯</text>

  <g filter="url(#sk)"><rect x="290" y="78" width="68" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="324" y="94" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">车2</text>

  <g filter="url(#sk)"><rect x="362" y="78" width="68" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="396" y="94" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">车4</text>

  <text x="446" y="94" font-size="10" fill="#888">总时长 = 5 × 单车</text>

  <!-- ===== Method 2: concurrent within road ===== -->
  <text x="30" y="148" font-size="12" fill="#444" font-weight="bold">方法二：条件变量（同向并发，crossCar 在锁外）</text>
  <path d="M 40 170 L 540 170" stroke="#888" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row A: cars 1,3,5 overlap -->
  <g filter="url(#sk)"><rect x="60" y="158" width="150" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="135" y="174" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">车1 + 车3 + 车5 并发</text>

  <!-- switch gap -->
  <path d="M 214 170 L 226 170" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3 2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="154" text-anchor="middle" font-size="8" fill="#b85450">切灯</text>

  <!-- Row B: cars 2,4 overlap -->
  <g filter="url(#sk)"><rect x="230" y="158" width="110" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="285" y="174" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">车2 + 车4 并发</text>

  <text x="356" y="174" font-size="10" fill="#888">总时长 ≈ 2 × 单车</text>

  <!-- overlap illustration arrows -->
  <path d="M 60 196 L 210 196" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <text x="135" y="210" text-anchor="middle" font-size="9" fill="#446688">同路多车时间重叠</text>
  <path d="M 230 196 L 340 196" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <text x="285" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a">同路多车时间重叠</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="40" y="232" width="500" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="56" y="254" font-size="11" fill="#2e6e2e" font-weight="bold">关键差异</text>
  <text x="56" y="272" font-size="10" fill="#444">· 方法一：crossCar() 在锁内调用 → 同路车辆也只能一辆辆过（串行），但实现极简、一定正确</text>
  <text x="56" y="288" font-size="10" fill="#444">· 方法二：crossCar() 在锁外调用 → 同路车辆可同时通过（并发），不同路仍互斥</text>
  <text x="56" y="304" font-size="10" fill="#444">· 判题只要求「无死锁 + 不重复开绿灯」，方法一即通过；方法二吞吐更高，贴近真实路口</text>
  <text x="56" y="318" font-size="10" fill="#b85450">· 方法二需引入计数器 passing + 条件变量，复杂度上升，须防虚假唤醒</text>
</svg>
