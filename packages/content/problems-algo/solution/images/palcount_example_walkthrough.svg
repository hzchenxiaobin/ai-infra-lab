<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">dp 填表演算：S = “bcbcb”（上三角，按长度递增）</text>
  <path d="M 130 40 Q 290 48 450 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- corner label -->
  <text x="58" y="68" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">S[i]\\S[j]</text>
  <!-- column headers j=0..4 -->
  <g filter="url(#rough2)">
    <rect x="92" y="50" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="144" y="50" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="196" y="50" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="248" y="50" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="300" y="50" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="118" y="67">b</text>
    <text x="170" y="67">c</text>
    <text x="222" y="67">b</text>
    <text x="274" y="67">c</text>
    <text x="326" y="67">b</text>
  </g>
  <text x="362" y="67" font-size="10" fill="#888">j→</text>

  <!-- row headers i=0..4 -->
  <g filter="url(#rough2)">
    <rect x="40" y="78" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="40" y="108" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="40" y="138" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="40" y="168" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="40" y="198" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="66" y="97">b</text>
    <text x="66" y="127">c</text>
    <text x="66" y="157">b</text>
    <text x="66" y="187">c</text>
    <text x="66" y="217">b</text>
  </g>
  <text x="22" y="148" font-size="10" fill="#888" font-weight="bold">i↓</text>

  <!-- data cells: 5x5, w=52 h=28, origin x=92 y=78 -->
  <!-- Row i=0 -->
  <g filter="url(#rough2)">
    <rect x="92" y="78" width="52" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="144" y="78" width="52" height="28" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="196" y="78" width="52" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="3"/>
    <rect x="248" y="78" width="52" height="28" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="300" y="78" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" rx="3"/>
  </g>
  <text x="118" y="97" text-anchor="middle" font-size="12.5" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="170" y="97" text-anchor="middle" font-size="12" fill="#888">2</text>
  <text x="222" y="97" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">4</text>
  <text x="274" y="97" text-anchor="middle" font-size="12" fill="#888">6</text>
  <text x="326" y="97" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">9 ⭐</text>

  <!-- Row i=1 -->
  <g filter="url(#rough2)">
    <rect x="92" y="108" width="52" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="144" y="108" width="52" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="196" y="108" width="52" height="28" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="248" y="108" width="52" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="3"/>
    <rect x="300" y="108" width="52" height="28" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>
  <text x="170" y="127" text-anchor="middle" font-size="12.5" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="222" y="127" text-anchor="middle" font-size="12" fill="#888">2</text>
  <text x="274" y="127" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">4</text>
  <text x="326" y="127" text-anchor="middle" font-size="12" fill="#888">6</text>

  <!-- Row i=2 -->
  <g filter="url(#rough2)">
    <rect x="92" y="138" width="52" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="144" y="138" width="52" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="196" y="138" width="52" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="248" y="138" width="52" height="28" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="300" y="138" width="52" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="3"/>
  </g>
  <text x="222" y="157" text-anchor="middle" font-size="12.5" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="274" y="157" text-anchor="middle" font-size="12" fill="#888">2</text>
  <text x="326" y="157" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">4</text>

  <!-- Row i=3 -->
  <g filter="url(#rough2)">
    <rect x="92" y="168" width="52" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="144" y="168" width="52" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="196" y="168" width="52" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="248" y="168" width="52" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="300" y="168" width="52" height="28" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>
  <text x="274" y="187" text-anchor="middle" font-size="12.5" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="326" y="187" text-anchor="middle" font-size="12" fill="#888">2</text>

  <!-- Row i=4 -->
  <g filter="url(#rough2)">
    <rect x="92" y="198" width="52" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="144" y="198" width="52" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="196" y="198" width="52" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="248" y="198" width="52" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="300" y="198" width="52" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
  </g>
  <text x="326" y="217" text-anchor="middle" font-size="12.5" fill="#4a8e4a" font-weight="bold">1</text>

  <!-- arrow from dp[1][3]=4 to dp[0][4]=9 -->
  <path d="M 274 122 Q 296 96 300 96" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- annotation panel -->
  <g filter="url(#rough2)">
    <rect x="380" y="78" width="186" height="148" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <text x="473" y="98" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">关键递推</text>
  <text x="390" y="120" font-size="11" fill="#888">主对角线 i==j ⇒ 1</text>
  <text x="390" y="138" font-size="11" fill="#888">dp[0][2]=2·dp[1][1]+2=4</text>
  <text x="390" y="156" font-size="11" fill="#888">　(b==b，内部无 b)</text>
  <text x="390" y="174" font-size="11" fill="#888">dp[1][3]=2·dp[2][2]+2=4</text>
  <text x="390" y="192" font-size="11" fill="#888">dp[0][4]: b==b，内部</text>
  <text x="390" y="208" font-size="11" fill="#b85450" font-weight="bold">恰 1 个 b(idx2) ⇒ +1</text>
  <text x="390" y="222" font-size="11.5" fill="#b85450" font-weight="bold">=2·dp[1][3]+1 = 9</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="380" y="236" width="186" height="56" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  </g>
  <text x="473" y="252" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">图例</text>
  <rect x="390" y="260" width="14" height="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="410" y="270" font-size="10" fill="#666">有效值</text>
  <rect x="452" y="260" width="14" height="11" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="472" y="270" font-size="10" fill="#666">i&gt;j（空 0）</text>
  <rect x="390" y="278" width="14" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="410" y="288" font-size="10" fill="#b85450">答案 dp[0][n−1]</text>

  <text x="290" y="330" text-anchor="middle" font-size="12" fill="#444">最终答案 = dp[0][4] = 9，对应 9 个不同回文子序列：</text>
  <text x="290" y="350" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">“b” “c” “bb” “cc” “bcb” “cbc” “bbb” “bccb” “bcbcb”</text>
  <text x="290" y="372" text-anchor="middle" font-size="11" fill="#888" font-style="italic">注意 dp[0][4] 不是 dp[i+1][j−1] 翻倍那么简单 —— 内部 b 恰好 1 个，需 +1 而非 +2</text>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#888" font-style="italic">时间 O(n²)，空间 O(n²)（可滚动到 O(n)）；全程对 10⁹+7 取模，减法后补 +MOD</text>
</svg>
