<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">函数图：出度≤1 → 单链行走 → 双距离取最大</text>

  <!-- node1 start: 0 -->
  <circle cx="95" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="95" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">node1</text>

  <!-- node2 start: 1 -->
  <circle cx="95" cy="250" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="95" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">node2</text>

  <!-- meeting node: 2 -->
  <circle cx="250" cy="185" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="250" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- node 3 -->
  <circle cx="390" cy="185" r="17" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- end -1 -->
  <text x="470" y="190" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">-1</text>
  <text x="470" y="206" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(终点)</text>

  <!-- edge 0 -> 2 (blue, dist1=1) -->
  <path d="M110,126 Q175,150 232,180" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arrB)"/>
  <text x="155" y="140" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">d1=1</text>

  <!-- edge 1 -> 2 (green, dist2=1) -->
  <path d="M110,244 Q175,220 232,192" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <text x="155" y="238" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d2=1</text>

  <!-- edge 2 -> 3 (grey, both continue) -->
  <line x1="269" y1="185" x2="372" y2="185" stroke="#666" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="178" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">d1=2,d2=2</text>

  <!-- edge 3 -> -1 -->
  <line x1="408" y1="185" x2="452" y2="185" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- highlight box on node 2 -->
  <rect x="222" y="160" width="56" height="52" rx="8" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="250" y="158" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 答案</text>

  <!-- distance comparison table -->
  <text x="40" y="324" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">双距离取最大：</text>

  <!-- table header -->
  <rect x="120" y="312" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="327" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">节点</text>
  <rect x="176" y="312" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="327" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">dist1</text>
  <rect x="232" y="312" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">dist2</text>
  <rect x="288" y="312" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="327" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">max</text>

  <!-- row node 0 -->
  <rect x="120" y="334" width="56" height="20" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="148" y="348" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="176" y="334" width="56" height="20" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="204" y="348" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="232" y="334" width="56" height="20" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">∅</text>
  <rect x="288" y="334" width="56" height="20" fill="#fafafa" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="316" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">-</text>

  <!-- row node 2 (best, highlighted) -->
  <rect x="120" y="354" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="368" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="176" y="354" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="368" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="232" y="354" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="288" y="354" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="316" y="368" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ✓</text>

  <!-- row node 3 -->
  <rect x="120" y="374" width="56" height="20" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="148" y="388" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="176" y="374" width="56" height="20" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="204" y="388" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="232" y="374" width="56" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="288" y="374" width="56" height="20" fill="#fff" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="316" y="388" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>

  <!-- formula -->
  <rect x="360" y="334" width="160" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="356" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最小化最大距离</text>
  <text x="440" y="376" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = argminᵢ</text>
  <text x="440" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">max(dist1[i], dist2[i])</text>
</svg>
