<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：外层二分 k，内层 check(k) 贪心验证</text>

  <!-- ===== Outer loop: binary search ===== -->
  <ellipse cx="280" cy="60" rx="168" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333">外层：lo=0, hi=min(n,m), ans=0</text>

  <path d="M 280 80 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision lo<=hi -->
  <polygon points="280,100 384,144 280,188 176,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#333">lo &lt;= hi ?</text>
  <text x="280" y="156" text-anchor="middle" font-size="11" fill="#666">(继续二分)</text>

  <!-- no -> end -->
  <path d="M 384 144 L 470 144" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="136" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="502" cy="144" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="502" y="148" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- yes down -->
  <path d="M 280 188 L 280 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="202" font-size="11" fill="#82b366">是</text>

  <!-- mid -->
  <rect x="150" y="210" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="231" text-anchor="middle" font-size="12" fill="#333">mid = (lo + hi) / 2  （尝试完成 mid 个任务）</text>

  <path d="M 280 242 L 280 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== check(k) block ===== -->
  <rect x="40" y="262" width="480" height="206" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="284" font-size="12" fill="#446688" font-weight="bold">check(mid)：能否完成 mid 个任务？</text>

  <!-- step 1: prepare -->
  <rect x="58" y="294" width="444" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="68" y="313" font-size="11" fill="#333">排序后取 mid 个最易任务 tasks[0..mid−1]、mid 个最强工人 workers[m−mid..m−1]</text>

  <path d="M 280 324 L 280 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: loop hardest to easiest -->
  <rect x="58" y="342" width="444" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="68" y="361" font-size="11" fill="#333">工人放入 multiset；i 从 mid−1 → 0（最难 → 最易任务）循环</text>

  <path d="M 280 372 L 280 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: lower_bound(t) exists? -->
  <polygon points="280,390 372,420 280,450 188,420" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#333">lower_bound(t) 存在?</text>
  <text x="280" y="430" text-anchor="middle" font-size="10" fill="#666">(无需药丸)</text>

  <!-- yes: erase, no pill -->
  <path d="M 188 420 L 96 420" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="412" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="58" y="406" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="420" text-anchor="middle" font-size="9.5" fill="#333">erase</text>
  <text x="78" y="432" text-anchor="middle" font-size="9.5" fill="#4a7a3a">不耗药丸</text>

  <!-- no -> pill branch -->
  <path d="M 372 420 L 412 420" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="412" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="414" y="406" width="88" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="458" y="420" text-anchor="middle" font-size="9.5" fill="#333">pills&gt;0 且</text>
  <text x="458" y="432" text-anchor="middle" font-size="9.5" fill="#333">lower_bound(t−s) 存在?</text>

  <!-- pill success vs fail -->
  <path d="M 458 436 L 458 452" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="476" y="448" font-size="9.5" fill="#4a7a3a">是→erase,pills−−</text>
  <path d="M 414 436 L 360 452" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="376" y="448" font-size="9.5" fill="#b85450">否→return false</text>

  <!-- loop back note -->
  <path d="M 78 406 L 78 342" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="376" text-anchor="middle" font-size="9.5" fill="#888" transform="rotate(-90 64 376)">下一任务</text>

  <!-- check end -->
  <path d="M 280 468 L 280 484" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision check result -->
  <polygon points="280,474 360,500 200,500 200,500" fill="none" stroke="none"/>
  <rect x="120" y="478" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="195" y="498" text-anchor="middle" font-size="10.5" fill="#333">全部匹配 → true</text>
  <rect x="290" y="478" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="365" y="498" text-anchor="middle" font-size="10.5" fill="#333">中途失败 → false</text>

  <!-- summary -->
  <text x="280" y="514" text-anchor="middle" font-size="10.5" fill="#888">check=true ⇒ ans=mid, lo=mid+1；false ⇒ hi=mid−1。单次 check O(k log k)</text>
</svg>
