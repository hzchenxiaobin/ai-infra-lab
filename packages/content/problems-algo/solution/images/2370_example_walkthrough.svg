<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "acfgbd"，k = 2，逐字符更新 dp 表</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">绿框 = 邻域 argmax 来源；橙底 = 本步被更新的格子（新值红字）</text>

  <!-- ===== Grid columns =====
       step 89..133 | char 133..169 | a 169..211 | b 211..253 | c 253..295 | d 295..337 | e 337..379 | f 379..421 | g 421..463 | ans 463..511 -->

  <!-- Header row background -->
  <rect x="89" y="56" width="422" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="111" y="78" text-anchor="middle">步</text>
    <text x="151" y="78" text-anchor="middle">字符</text>
    <text x="190" y="78" text-anchor="middle">a</text>
    <text x="232" y="78" text-anchor="middle">b</text>
    <text x="274" y="78" text-anchor="middle">c</text>
    <text x="316" y="78" text-anchor="middle">d</text>
    <text x="358" y="78" text-anchor="middle">e</text>
    <text x="400" y="78" text-anchor="middle">f</text>
    <text x="442" y="78" text-anchor="middle">g</text>
    <text x="487" y="78" text-anchor="middle">ans</text>
  </g>
  <!-- column separators (light) -->
  <g stroke="#cdd6e0" stroke-width="0.8" filter="url(#rough2)">
    <line x1="133" y1="56" x2="133" y2="304"/>
    <line x1="169" y1="56" x2="169" y2="304"/>
    <line x1="211" y1="56" x2="211" y2="304"/>
    <line x1="253" y1="56" x2="253" y2="304"/>
    <line x1="295" y1="56" x2="295" y2="304"/>
    <line x1="337" y1="56" x2="337" y2="304"/>
    <line x1="379" y1="56" x2="379" y2="304"/>
    <line x1="421" y1="56" x2="421" y2="304"/>
    <line x1="463" y1="56" x2="463" y2="304"/>
  </g>
  <!-- row separators -->
  <g stroke="#cdd6e0" stroke-width="0.8" filter="url(#rough2)">
    <line x1="89" y1="100" x2="511" y2="100"/>
    <line x1="89" y1="134" x2="511" y2="134"/>
    <line x1="89" y1="168" x2="511" y2="168"/>
    <line x1="89" y1="202" x2="511" y2="202"/>
    <line x1="89" y1="236" x2="511" y2="236"/>
    <line x1="89" y1="270" x2="511" y2="270"/>
    <line x1="89" y1="304" x2="511" y2="304"/>
  </g>
  <!-- outer border -->
  <rect x="89" y="56" width="422" height="248" fill="none" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <!-- ===== Row 1 : step1, char a, ci=0, win a,b,c, best=0, dp[a]=1, ans=1 ===== -->
  <g filter="url(#rough2)">
    <text x="111" y="121" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="151" y="121" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <!-- a updated -->
    <rect x="170" y="103" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="190" y="122" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
    <text x="232" y="121" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="274" y="121" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="316" y="121" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="358" y="121" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="400" y="121" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="442" y="121" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="487" y="121" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  </g>

  <!-- ===== Row 2 : step2, char c, ci=2, win a,b,c,d,e, best=dp[a]=1, dp[c]=2, ans=2 ===== -->
  <g filter="url(#rough2)">
    <text x="111" y="155" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="151" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
    <!-- a = source(argmax) green -->
    <rect x="170" y="137" width="40" height="28" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="190" y="156" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="232" y="155" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <!-- c updated -->
    <rect x="254" y="137" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="274" y="156" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
    <text x="316" y="155" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="358" y="155" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="400" y="155" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="442" y="155" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="487" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <!-- arrow a -> c (within row) -->
    <path d="M 210 151 L 254 151" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- ===== Row 3 : step3, char f, ci=5, win d..h, best=0, dp[f]=1, ans=2 ===== -->
  <g filter="url(#rough2)">
    <text x="111" y="189" text-anchor="middle" font-size="12" fill="#666">3</text>
    <text x="151" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">f</text>
    <text x="190" y="189" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="232" y="189" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="274" y="189" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="316" y="189" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="358" y="189" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <!-- f updated -->
    <rect x="380" y="171" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="400" y="190" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
    <text x="442" y="189" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="487" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- ===== Row 4 : step4, char g, ci=6, win e..i, best=dp[f]=1, dp[g]=2, ans=2 ===== -->
  <g filter="url(#rough2)">
    <text x="111" y="223" text-anchor="middle" font-size="12" fill="#666">4</text>
    <text x="151" y="223" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">g</text>
    <text x="190" y="223" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="232" y="223" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="274" y="223" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="316" y="223" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="358" y="223" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <!-- f = source green -->
    <rect x="380" y="205" width="40" height="28" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="400" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- g updated -->
    <rect x="422" y="205" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="442" y="224" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
    <text x="487" y="223" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <!-- arrow f -> g -->
    <path d="M 420 219 L 422 219" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- ===== Row 5 : step5, char b, ci=1, win a..d, best=dp[c]=2, dp[b]=3, ans=3 ===== -->
  <g filter="url(#rough2)">
    <text x="111" y="257" text-anchor="middle" font-size="12" fill="#666">5</text>
    <text x="151" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
    <text x="190" y="257" text-anchor="middle" font-size="12" fill="#666">1</text>
    <!-- b updated -->
    <rect x="212" y="239" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="232" y="258" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
    <!-- c = source green -->
    <rect x="254" y="239" width="40" height="28" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="274" y="258" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="316" y="257" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="358" y="257" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="400" y="257" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="442" y="257" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="487" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <!-- arrow c -> b (reverse direction, drawn curving up) -->
    <path d="M 254 253 L 252 253 L 252 248 L 212 248" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- ===== Row 6 : step6, char d, ci=3, win b..f, best=dp[b]=3, dp[d]=4, ans=4 ===== -->
  <g filter="url(#rough2)">
    <text x="111" y="291" text-anchor="middle" font-size="12" fill="#666">6</text>
    <text x="151" y="291" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
    <text x="190" y="291" text-anchor="middle" font-size="12" fill="#666">1</text>
    <!-- b = source green -->
    <rect x="212" y="273" width="40" height="28" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="232" y="292" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="274" y="291" text-anchor="middle" font-size="12" fill="#666">2</text>
    <!-- d updated (★) -->
    <rect x="296" y="273" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="316" y="292" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
    <text x="358" y="291" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="400" y="291" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="442" y="291" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="487" y="291" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
    <!-- arrow b -> d -->
    <path d="M 252 287 L 296 287" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- ===== footnote ===== -->
  <rect x="60" y="316" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="334" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">★ 第6步：邻域 b,c,d,e,f 取最大 = dp[b]=3 → dp[d] = 3+1 = 4</text>
  <text x="300" y="350" text-anchor="middle" font-size="11" fill="#666">答案 = max(dp) = 4，对应理想子序列 "acbd"（位置 0,2,1,3，相邻差 2,1,2 ≤ 2）</text>
</svg>
