<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">max-Fenwick 机制：c[x] 盖住 (x − lowbit(x), x]，插上行、查下行</text>

  <text x="88" y="54" text-anchor="end" font-size="10" fill="#999">值 v</text>
  <rect x="96" y="40" width="44" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="40" width="44" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="184" y="40" width="44" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="40" width="44" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="40" width="44" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="40" width="44" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="40" width="44" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="404" y="40" width="44" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="54" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="162" y="54" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="206" y="54" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="250" y="54" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="294" y="54" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="338" y="54" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="382" y="54" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="426" y="54" text-anchor="middle" font-size="10" fill="#333">8</text>

  <text x="88" y="98" text-anchor="end" font-size="10" fill="#999">c 数组</text>
  <rect x="96" y="80" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="80" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="184" y="80" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="80" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="80" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="80" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="80" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="404" y="80" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="98" text-anchor="middle" font-size="10.5" fill="#333">c1</text>
  <text x="162" y="98" text-anchor="middle" font-size="10.5" fill="#333">c2</text>
  <text x="206" y="98" text-anchor="middle" font-size="10.5" fill="#333">c3</text>
  <text x="250" y="98" text-anchor="middle" font-size="10.5" fill="#333">c4</text>
  <text x="294" y="98" text-anchor="middle" font-size="10.5" fill="#333">c5</text>
  <text x="338" y="98" text-anchor="middle" font-size="10.5" fill="#333">c6</text>
  <text x="382" y="98" text-anchor="middle" font-size="10.5" fill="#333">c7</text>
  <text x="426" y="98" text-anchor="middle" font-size="10.5" fill="#333">c8</text>
  <text x="118" y="126" text-anchor="middle" font-size="8" fill="#999">[1,1]</text>
  <text x="162" y="126" text-anchor="middle" font-size="8" fill="#999">[1,2]</text>
  <text x="206" y="126" text-anchor="middle" font-size="8" fill="#999">[3,3]</text>
  <text x="250" y="126" text-anchor="middle" font-size="8" fill="#999">[1,4]</text>
  <text x="294" y="126" text-anchor="middle" font-size="8" fill="#999">[5,5]</text>
  <text x="338" y="126" text-anchor="middle" font-size="8" fill="#999">[5,6]</text>
  <text x="382" y="126" text-anchor="middle" font-size="8" fill="#999">[7,7]</text>
  <text x="426" y="126" text-anchor="middle" font-size="8" fill="#999">[1,8]</text>

  <text x="280" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">update(6, v)：沿 x += lowbit(x) 上行，沿途 c[x] = max(c[x], v)</text>
  <circle cx="118" cy="172" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="162" cy="172" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="206" cy="172" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="250" cy="172" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="294" cy="172" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="338" cy="172" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="382" cy="172" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="426" cy="172" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="176" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="162" y="176" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="206" y="176" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="250" y="176" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="294" y="176" text-anchor="middle" font-size="9" fill="#999">5</text>
  <text x="338" y="176" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">6</text>
  <text x="382" y="176" text-anchor="middle" font-size="9" fill="#999">7</text>
  <text x="426" y="176" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">8</text>
  <path d="M 342 160 C 368 148, 400 148, 422 160" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="9.5" fill="#555">6 → 8 → 16（越界即停）：两步完成一次插入</text>

  <text x="280" y="224" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">query(5)：沿 x −= lowbit(x) 下行，合并沿途 c[x]</text>
  <circle cx="118" cy="246" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="162" cy="246" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="206" cy="246" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="250" cy="246" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="294" cy="246" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="338" cy="246" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="382" cy="246" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="426" cy="246" r="9" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="118" y="250" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="162" y="250" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="206" y="250" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="250" y="250" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="294" y="250" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="338" y="250" text-anchor="middle" font-size="9" fill="#999">6</text>
  <text x="382" y="250" text-anchor="middle" font-size="9" fill="#999">7</text>
  <text x="426" y="250" text-anchor="middle" font-size="9" fill="#999">8</text>
  <path d="M 288 234 C 276 224, 262 224, 254 234" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="9.5" fill="#555">5 → 4 → 0（停）：c5 盖 [5,5]，c4 盖 [1,4]，两块拼出前缀 [1,5]，不重不漏</text>

  <rect x="130" y="288" width="300" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="10" fill="#d6a040">lowbit(x) = x &amp; (−x)：lowbit(6)=2、lowbit(4)=4、lowbit(8)=8</text>

  <rect x="30" y="330" width="500" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">插入 / 查询每步跨 lowbit(x) 格，均 ≤ ⌈log₂ M⌉ 步——M = 5000 时约 13 步</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#555">max 不可逆：max-Fenwick 只能插、不能删——本题每个元素只进一次 BIT，天然满足</text>
</svg>
