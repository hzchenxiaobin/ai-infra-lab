<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：y 坐标无关紧要，压扁成一维做区间覆盖（示例 1，w = 1）</text>

  <!-- left panel: 2D -->
  <rect x="16" y="38" width="252" height="232" fill="#ffffff" stroke="#ccc" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="142" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">二维：矩形高度白送</text>

  <!-- axes -->
  <line x1="40" y1="236" x2="40" y2="70" stroke="#888" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="40" y1="236" x2="252" y2="236" stroke="#888" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- rectangle A: x in [1,2], tall enough -->
  <rect x="88" y="64" width="48" height="172" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="112" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">矩形①</text>
  <text x="112" y="252" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">[1, 2]，宽 = w</text>

  <!-- rectangle B: x in [3,4] -->
  <rect x="184" y="104" width="48" height="132" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="208" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">矩形②</text>
  <text x="208" y="252" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">[3, 4]，宽 = w</text>

  <!-- points -->
  <circle cx="88" cy="236" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="88" cy="151" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="88" cy="67" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="136" cy="215" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="184" cy="131" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="232" cy="110" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="80" y="62" font-size="9" fill="#b85450" filter="url(#rough2)">(1,8)</text>
  <text x="144" y="212" font-size="9" fill="#b85450" filter="url(#rough2)">(2,1)</text>
  <text x="240" y="107" font-size="9" fill="#b85450" filter="url(#rough2)">(4,6)</text>

  <text x="142" y="266" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">y2 ≥ 0 无上界 ⇒ 高度想拉多高拉多高</text>

  <!-- middle arrow -->
  <path d="M 270 154 L 292 154" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="281" y="142" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">丢掉 y</text>

  <!-- right panel: 1D -->
  <rect x="296" y="38" width="248" height="232" fill="#ffffff" stroke="#ccc" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">一维：长度 ≤ w 的区间盖点</text>

  <!-- number line -->
  <line x1="316" y1="150" x2="530" y2="150" stroke="#888" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- interval A -->
  <rect x="382" y="134" width="48" height="32" fill="#e8f0fe" fill-opacity="0.75" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="406" y="155" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">[1,2]</text>
  <!-- interval B -->
  <rect x="478" y="134" width="48" height="32" fill="#e6f4ea" fill-opacity="0.75" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="502" y="155" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[3,4]</text>

  <!-- points on line -->
  <circle cx="382" cy="150" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="430" cy="150" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="478" cy="150" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="526" cy="150" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="382" y="176" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="430" y="176" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="478" y="176" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="526" y="176" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>

  <text x="454" y="200" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（重复的 x 只留一个，y 彻底消失）</text>

  <text x="420" y="228" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">最少矩形数 = 盖住全部 x 的最少区间数</text>
  <text x="420" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">贪心：从最左未覆盖点 x 开区间 [x, x+w]</text>

  <!-- rules box -->
  <rect x="16" y="284" width="528" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">矩形 ⇔ x 轴上长度 ≤ w 的区间：点被盖住只看 x 是否落在 [x1, x2]</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">贪心开区间 [x0, x0+w]：右端取到上界 x0+w，盖住的点只多不少</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">答案 = 排序后从左到右「开新矩形」的次数</text>
</svg>
