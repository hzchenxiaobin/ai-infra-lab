<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[3,1,6,8] → 排序 [1,3,6,8]，n=4，total=18</text>

  <!-- prefix sum row -->
  <text x="40" y="58" font-size="11" fill="#888" font-weight="bold">prefix</text>
  <text x="110" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="170" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="230" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="290" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="350" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">18</text>

  <text x="40" y="86" font-size="11" fill="#888" font-weight="bold">nums[i]</text>
  <text x="110" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="170" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="230" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="290" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <text x="40" y="106" font-size="10" fill="#888">下标 i</text>
  <text x="110" y="106" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="170" y="106" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="230" y="106" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="290" y="106" text-anchor="middle" font-size="10" fill="#888">3</text>

  <path d="M 40 118 L 560 118" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Query q=1 block -->
  <text x="40" y="146" font-size="12.5" fill="#446688" font-weight="bold">查询 q=1：</text>
  <text x="150" y="146" font-size="11.5" fill="#333">pos=lower_bound(1)=0（首个 ≥1 在 i=0）</text>

  <!-- show split: pos=0 means everything is "right" -->
  <rect x="60" y="160" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">pos=0：左侧空，全部属右侧（都要减到 1）</text>

  <text x="40" y="210" font-size="11.5" fill="#333">左 = 1·0 − prefix[0] = 0 − 0 = 0</text>
  <text x="40" y="230" font-size="11.5" fill="#333">右 = (total − prefix[0]) − 1·(n−0) = (18−0) − 4 = 14</text>
  <text x="40" y="250" font-size="12" fill="#b85450" font-weight="bold">answer[0] = 0 + 14 = 14 ✓</text>

  <path d="M 40 262 L 560 262" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Query q=5 block -->
  <text x="40" y="290" font-size="12.5" fill="#446688" font-weight="bold">查询 q=5：</text>
  <text x="150" y="290" font-size="11.5" fill="#333">pos=lower_bound(5)=2（首个 ≥5 是 nums[2]=6）</text>

  <!-- show split: pos=2 -->
  <rect x="60" y="300" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="120" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左侧 [1,3] &lt; 5</text>
  <rect x="184" y="300" width="316" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="342" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">右侧 [6,8] ≥ 5</text>

  <text x="40" y="350" font-size="11.5" fill="#333">左 = 5·pos − prefix[pos] = 5·2 − prefix[2] = 10 − 4 = 6</text>
  <text x="40" y="370" font-size="11.5" fill="#333">右 = (total − prefix[pos]) − 5·(n−pos) = (18−4) − 5·2 = 14 − 10 = 4</text>
  <text x="40" y="390" font-size="12" fill="#b85450" font-weight="bold">answer[1] = 6 + 4 = 10 ✓</text>

  <!-- verification box -->
  <rect x="40" y="406" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="425" text-anchor="middle" font-size="11.5" fill="#444">验证 q=5：(5−1)+(5−3)=4+2=6（左）；(6−5)+(8−5)=1+3=4（右）</text>
  <text x="300" y="443" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">合计 6+4=10，与公式结果一致</text>
</svg>
