<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：配对方式唯一，首对分数锁定全局</text>

  <!-- ===== Example 1: [3,2,1,4,5] ===== -->
  <text x="42" y="50" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">示例 1</text>

  <!-- cells -->
  <g filter="url(#rough2)">
    <rect x="90" y="56" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="142" y="56" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="194" y="56" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="246" y="56" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="298" y="56" width="50" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" rx="4"/>
    <text x="115" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
    <text x="167" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <text x="219" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="271" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
    <text x="323" y="84" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">5</text>
    <text x="115" y="114" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="167" y="114" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="219" y="114" text-anchor="middle" font-size="10" fill="#999">2</text>
    <text x="271" y="114" text-anchor="middle" font-size="10" fill="#999">3</text>
    <text x="323" y="114" text-anchor="middle" font-size="10" fill="#999">4</text>
  </g>

  <!-- pair labels -->
  <text x="141" y="134" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① s = 3+2 = 5（锚点）</text>
  <text x="245" y="134" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 1+4 = 5 ✓</text>
  <text x="323" y="134" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">③ 落单 ✗</text>

  <!-- side note -->
  <rect x="368" y="52" width="140" height="88" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="438" y="74" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">配对 (0,1)(2,3)…</text>
  <text x="438" y="90" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">从输入那刻定死，</text>
  <text x="438" y="106" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">所有操作分数必须 = s，</text>
  <text x="438" y="122" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">删除只是假动作。</text>

  <!-- ===== Example 2: [3,2,6,1,4] ===== -->
  <text x="42" y="178" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">示例 2</text>

  <g filter="url(#rough2)">
    <rect x="90" y="184" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="142" y="184" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="194" y="184" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="246" y="184" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="298" y="184" width="50" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="115" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
    <text x="167" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <text x="219" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
    <text x="271" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="323" y="212" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">4</text>
    <text x="115" y="242" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="167" y="242" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="219" y="242" text-anchor="middle" font-size="10" fill="#999">2</text>
    <text x="271" y="242" text-anchor="middle" font-size="10" fill="#999">3</text>
    <text x="323" y="242" text-anchor="middle" font-size="10" fill="#999">4</text>
  </g>

  <text x="141" y="262" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① s = 5</text>
  <text x="240" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 6+1 = 7 ≠ 5 ✗ 即停</text>
  <path d="M 262 268 L 258 288" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- warning strip -->
  <rect x="48" y="292" width="424" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⚠️ 遇到不匹配的一对：跳过它？不行——操作只认当前前两个；</text>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">换个分数？也不行——所有操作分数必须相同。第一个 ✗ 就是终点。</text>

  <!-- bottom note -->
  <rect x="48" y="360" width="424" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="379" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每步动作唯一 ⇒ 路径唯一 ⇒ 不存在决策 —— 一条道扫到底，O(n) 完成。</text>
</svg>
