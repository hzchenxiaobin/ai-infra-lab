<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：逐行滚动列前缀和 + 提前 break</text>

  <!-- 主流程（左列） -->
  <rect x="36" y="52" width="232" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">col[0..n−1] = 0，ans = 0</text>

  <path d="M152,88 L152,106" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="108" width="232" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">for 每一行 i：s = 0</text>

  <path d="M152,144 L152,162" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="164" width="232" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">for j = 0..n−1：</text>
  <text x="152" y="203" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">col[j] += grid[i][j]</text>

  <path d="M152,214 L152,232" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="234" width="232" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="259" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s += col[j]（此时 s = P[i][j]）</text>

  <path d="M152,274 L152,290" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="152,294 218,320 152,346 86,320" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="325" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s ≤ k ?</text>

  <!-- 是 → ans++ -->
  <path d="M218,320 L240,320" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="226" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="242" y="302" width="84" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="325" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans++</text>
  <!-- 回到内层循环 -->
  <path d="M284,302 L284,189 L272,189" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="250" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j+1</text>

  <!-- 否 → break -->
  <path d="M152,346 L152,354" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="358" font-size="11.5" fill="#b85450" filter="url(#rough2)">否：break（同行更右必然 &gt; k）</text>

  <!-- 右侧注解 -->
  <rect x="344" y="52" width="144" height="128" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="74" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">break 为何正确？</text>
  <text x="356" y="94" font-size="11.5" fill="#333" filter="url(#rough2)">grid[i][j] ≥ 0</text>
  <text x="356" y="112" font-size="11.5" fill="#333" filter="url(#rough2)">⇒ s 随 j 只增不减</text>
  <text x="356" y="130" font-size="11.5" fill="#333" filter="url(#rough2)">⇒ 一旦 s &gt; k，后面</text>
  <text x="356" y="148" font-size="11.5" fill="#333" filter="url(#rough2)">  的 j 全部超标，</text>
  <text x="356" y="166" font-size="11.5" fill="#333" filter="url(#rough2)">  直接跳出本行</text>

  <rect x="344" y="196" width="144" height="142" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="218" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">为什么这样滚？</text>
  <text x="356" y="238" font-size="11.5" fill="#333" filter="url(#rough2)">col[j]：第 j 列的</text>
  <text x="356" y="256" font-size="11.5" fill="#333" filter="url(#rough2)">  纵向累计和</text>
  <text x="356" y="274" font-size="11.5" fill="#333" filter="url(#rough2)">s：本行横向累计</text>
  <text x="356" y="292" font-size="11.5" fill="#333" filter="url(#rough2)">  = P[i][j]</text>
  <text x="356" y="310" font-size="11.5" fill="#333" filter="url(#rough2)">空间 O(n)，无需</text>
  <text x="356" y="328" font-size="11.5" fill="#333" filter="url(#rough2)">  完整二维 P 矩阵</text>
</svg>
