<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算 n=4：逐分母枚举分子 + gcd 判定</text>

  <!-- ===== Table: 5 cols, header + 6 data rows ===== -->
  <!-- cols: b(70), a(70), gcd(90), 最简?(90), 分数(140), start x=40 -->

  <!-- Header -->
  <rect x="40" y="46" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="75" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b</text>
  <rect x="110" y="46" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="145" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>
  <rect x="180" y="46" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="225" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">gcd(a,b)</text>
  <rect x="270" y="46" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="315" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最简?</text>
  <rect x="360" y="46" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">分数</text>

  <!-- Row 1: b=2, a=1, gcd=1, ✓, 1/2 -->
  <rect x="40" y="74" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="75" y="93" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">2</text>
  <rect x="110" y="74" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="145" y="93" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="180" y="74" width="90" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="225" y="93" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">1</text>
  <rect x="270" y="74" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="93" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="360" y="74" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="93" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"1/2"</text>

  <!-- Row 2: b=3, a=1, gcd=1, ✓, 1/3 -->
  <rect x="40" y="102" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="75" y="121" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">3</text>
  <rect x="110" y="102" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="145" y="121" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="180" y="102" width="90" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="225" y="121" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">1</text>
  <rect x="270" y="102" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="360" y="102" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="121" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"1/3"</text>

  <!-- Row 3: b=3, a=2, gcd=1, ✓, 2/3 -->
  <rect x="40" y="130" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="75" y="149" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">3</text>
  <rect x="110" y="130" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="145" y="149" text-anchor="middle" font-size="11" fill="#555">2</text>
  <rect x="180" y="130" width="90" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="225" y="149" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">1</text>
  <rect x="270" y="130" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="149" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="360" y="130" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="149" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"2/3"</text>

  <!-- Row 4: b=4, a=1, gcd=1, ✓, 1/4 -->
  <rect x="40" y="158" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="75" y="177" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">4</text>
  <rect x="110" y="158" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="145" y="177" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="180" y="158" width="90" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="225" y="177" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">1</text>
  <rect x="270" y="158" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="360" y="158" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="177" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"1/4"</text>

  <!-- Row 5: b=4, a=2, gcd=2, ✗, skip -->
  <rect x="40" y="186" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="75" y="205" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">4</text>
  <rect x="110" y="186" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="145" y="205" text-anchor="middle" font-size="11" fill="#555">2</text>
  <rect x="180" y="186" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">2</text>
  <rect x="270" y="186" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 跳过</text>
  <rect x="360" y="186" width="160" height="28" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="440" y="205" text-anchor="middle" font-size="11" fill="#999" font-family="monospace">2/4 = 1/2 (重复)</text>

  <!-- Row 6: b=4, a=3, gcd=1, ✓, 3/4 -->
  <rect x="40" y="214" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="75" y="233" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">4</text>
  <rect x="110" y="214" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="145" y="233" text-anchor="middle" font-size="11" fill="#555">3</text>
  <rect x="180" y="214" width="90" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="225" y="233" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">1</text>
  <rect x="270" y="214" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="360" y="214" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="233" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"3/4"</text>

  <!-- Result box -->
  <rect x="40" y="260" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="55" y="280" font-size="11" fill="#d6a040" font-weight="bold">最终结果</text>
  <text x="55" y="299" font-size="12" fill="#333" font-family="monospace">["1/2", "1/3", "1/4", "2/3", "3/4"]</text>
  <text x="55" y="314" font-size="10.5" fill="#888">共 5 个 = φ(2)+φ(3)+φ(4) = 1+2+2</text>
</svg>
