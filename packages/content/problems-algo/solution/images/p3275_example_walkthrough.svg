<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：queries = [[1,2],[3,4],[2,3],[-3,0]]，k = 2</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#7a6a50" filter="url(#rough2)">d = |x| + |y|；大顶堆只装最近的 2 个，红格 = 堆顶（第 2 近）</text>

  <!-- 表头 -->
  <rect x="40" y="56" width="78" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="79" y="72" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">查询</text>
  <rect x="118" y="56" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="139" y="72" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="160" y="56" width="132" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="226" y="72" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">堆（最近 2 个）</text>
  <rect x="292" y="56" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="342" y="72" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="392" y="56" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="437" y="72" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">results[i]</text>

  <!-- 行 0：(1,2) -->
  <rect x="40" y="84" width="78" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="79" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,2)</text>
  <rect x="118" y="84" width="42" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="160" y="84" width="132" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="89" width="34" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="103" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="228" y="89" width="34" height="20" rx="4" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="245" y="103" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">空</text>
  <rect x="292" y="84" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="103" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">堆未满 → 入堆</text>
  <rect x="392" y="84" width="90" height="30" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="437" y="103" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- 行 1：(3,4) -->
  <rect x="40" y="118" width="78" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="79" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(3,4)</text>
  <rect x="118" y="118" width="42" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="160" y="118" width="132" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="123" width="34" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="207" y="137" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="228" y="123" width="34" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="137" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="292" y="118" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="137" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">入堆 · 恰好堆满</text>
  <rect x="392" y="118" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="437" y="137" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- 行 2：(2,3) -->
  <rect x="40" y="152" width="78" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="79" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,3)</text>
  <rect x="118" y="152" width="42" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="160" y="152" width="132" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="157" width="34" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="207" y="171" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="228" y="157" width="34" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="171" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="292" y="152" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="171" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5 &lt; 顶 7 → 换人</text>
  <rect x="392" y="152" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="437" y="171" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 行 3：(-3,0) -->
  <rect x="40" y="186" width="78" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="79" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(-3,0)</text>
  <rect x="118" y="186" width="42" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="160" y="186" width="132" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="191" width="34" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="207" y="205" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="228" y="191" width="34" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="205" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="292" y="186" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="205" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3 &lt; 顶 5 → 换人</text>
  <rect x="392" y="186" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="437" y="205" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 结果行 -->
  <rect x="40" y="228" width="442" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="261" y="248" text-anchor="middle" font-size="11.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">results = [−1, 7, 5, 3] ✓ —— 堆满后 7 → 5 → 3 单调不增</text>

  <!-- 说明框 -->
  <rect x="40" y="272" width="442" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="261" y="291" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">被换出的 7 与 5 从此永久退场：障碍物只增不删，第 k 近只会被顶得越来越近</text>
  <text x="261" y="308" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">每条查询至多一次「弹顶 + 入堆」，即 O(log k)；全程 O(n log k)</text>
  <text x="261" y="325" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">示例 2（k = 1）：堆只装最近 1 个，同一套流程 → [10, 8, 6]</text>

  <!-- 底部提示 -->
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">调试断言：前 k−1 项必为 −1，其后单调不增</text>
</svg>
