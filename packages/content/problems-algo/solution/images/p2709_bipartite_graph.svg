<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：下标 ↔ 质因子 二分图，共享质因子即同分量</text>

  <!-- column headers -->
  <text x="130" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">下标节点 nums[i]</text>
  <text x="500" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">质因子节点</text>

  <!-- index nodes (blue) -->
  <rect x="70" y="82" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">下标 0</text>
  <text x="130" y="116" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums[0]=2</text>

  <rect x="70" y="178" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">下标 1</text>
  <text x="130" y="212" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums[1]=3</text>

  <rect x="70" y="274" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">下标 2</text>
  <text x="130" y="308" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums[2]=6</text>

  <!-- prime nodes (green) -->
  <rect x="440" y="126" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="500" y="151" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">质因子 2</text>

  <rect x="440" y="222" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="500" y="247" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">质因子 3</text>

  <!-- edges: index right edge x=190 ; prime left edge x=440 -->
  <!-- 0 -> prime2 -->
  <path d="M 190 102 C 300 102, 330 146, 440 146" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 1 -> prime3 -->
  <path d="M 190 198 C 300 198, 330 242, 440 242" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 2 -> prime2 -->
  <path d="M 190 294 C 300 294, 330 146, 440 146" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 2 -> prime3 -->
  <path d="M 190 294 C 300 294, 330 242, 440 242" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- highlight badges on shared primes -->
  <rect x="356" y="108" width="92" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="402" y="122" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0 与 2 共享</text>

  <rect x="356" y="256" width="92" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="402" y="270" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1 与 2 共享</text>

  <!-- bottom note -->
  <rect x="40" y="336" width="560" height="50" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="356" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">不变式：i 与 j 共享某质因子 p ⟺ 存在 i—p—j 路径 ⟺ 同一连通分量</text>
  <text x="320" y="374" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">实现：seen[p]=首次出现下标，后续遇到 p 即 union(i, seen[p])，无需建 n² 条边</text>
</svg>
