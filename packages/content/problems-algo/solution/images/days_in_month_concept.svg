<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：12 个月天数表 —— 仅二月受闰年影响</text>

  <!-- ===== Row 1: months 1-6 ===== -->
  <!-- cell width 76, gap 8, start x=40 -->

  <!-- 1月: 31 -->
  <rect x="40" y="52" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="78" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1 月</text>
  <text x="78" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">31</text>

  <!-- 2月: 28/29 (highlighted) -->
  <rect x="124" y="52" width="76" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="162" y="74" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2 月</text>
  <text x="162" y="96" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">28/29</text>

  <!-- 3月: 31 -->
  <rect x="208" y="52" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="246" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3 月</text>
  <text x="246" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">31</text>

  <!-- 4月: 30 -->
  <rect x="292" y="52" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="330" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4 月</text>
  <text x="330" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">30</text>

  <!-- 5月: 31 -->
  <rect x="376" y="52" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="414" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5 月</text>
  <text x="414" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">31</text>

  <!-- 6月: 30 -->
  <rect x="460" y="52" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="498" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6 月</text>
  <text x="498" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">30</text>

  <!-- ===== Row 2: months 7-12 ===== -->

  <!-- 7月: 31 -->
  <rect x="40" y="124" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="78" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">7 月</text>
  <text x="78" y="168" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">31</text>

  <!-- 8月: 31 -->
  <rect x="124" y="124" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="162" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8 月</text>
  <text x="162" y="168" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">31</text>

  <!-- 9月: 30 -->
  <rect x="208" y="124" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="246" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">9 月</text>
  <text x="246" y="168" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">30</text>

  <!-- 10月: 31 -->
  <rect x="292" y="124" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="330" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">10 月</text>
  <text x="330" y="168" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">31</text>

  <!-- 11月: 30 -->
  <rect x="376" y="124" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="414" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">11 月</text>
  <text x="414" y="168" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">30</text>

  <!-- 12月: 31 -->
  <rect x="460" y="124" width="76" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="498" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">12 月</text>
  <text x="498" y="168" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">31</text>

  <!-- arrow from 2月 box down to leap year note -->
  <path d="M 162 112 Q 162 196 162 214" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== February leap year note ===== -->
  <rect x="60" y="218" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">二月 = 闰年 ? 29 : 28</text>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#d6a040">闰年规则：(Y%4==0 且 Y%100≠0) 或 (Y%400==0)</text>

  <!-- ===== Bottom insight box ===== -->
  <rect x="60" y="284" width="440" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">其余 11 个月天数为常数，与年份无关</text>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#555">→ 非二月直接查表 O(1)；二月才需判定闰年</text>
</svg>
