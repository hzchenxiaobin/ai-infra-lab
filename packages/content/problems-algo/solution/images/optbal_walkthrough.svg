<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#666" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 人一组 vs 2 人一组</text>

  <!-- divider -->
  <line x1="320" y1="42" x2="320" y2="455" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- LEFT: Example 1 -->
  <rect x="24" y="44" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="164" y="62" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">示例 1：[[0,1,10],[2,0,5]]</text>
  <text x="164" y="78" text-anchor="middle" font-size="10.5" fill="#666">3 人非零，无法再拆 → 2 笔</text>

  <!-- transactions table -->
  <rect x="30" y="92" width="268" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="50" y="110" font-size="10.5" fill="#333" font-weight="bold">交易</text>
  <text x="170" y="110" font-size="10.5" fill="#333" font-weight="bold">P0 净额</text>
  <text x="260" y="110" font-size="10.5" fill="#333" font-weight="bold">P1 / P2</text>

  <rect x="30" y="120" width="268" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="50" y="136" font-size="10.5" fill="#333">0→1, 10</text>
  <text x="170" y="136" font-size="10.5" fill="#b85450">−10</text>
  <text x="260" y="136" font-size="10.5" fill="#333">+10 / 0</text>

  <rect x="30" y="144" width="268" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="50" y="160" font-size="10.5" fill="#333">2→0, 5</text>
  <text x="170" y="160" font-size="10.5" fill="#4a7a3a">+5</text>
  <text x="260" y="160" font-size="10.5" fill="#333">0 / −5</text>

  <!-- net balance -->
  <rect x="30" y="172" width="268" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="164" y="189" text-anchor="middle" font-size="10.8" fill="#444" font-weight="bold">净额：P0=−5, P1=+10, P2=−5</text>

  <!-- debts + grouping -->
  <rect x="30" y="204" width="268" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="164" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">debts = [−5, +10, −5]</text>
  <text x="164" y="241" text-anchor="middle" font-size="10.5" fill="#4a7a3a">真子集无零和 → 1 组, k=3</text>

  <!-- DP result -->
  <rect x="30" y="262" width="268" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="164" y="279" text-anchor="middle" font-size="10.8" fill="#555">dp[111] = popcount−1 = 3−1 = 2</text>

  <!-- settlement illustration -->
  <rect x="30" y="294" width="268" height="70" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="164" y="312" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">结算方案（链式 2 笔）</text>
  <text x="164" y="332" text-anchor="middle" font-size="10.5" fill="#333">P1 → P0 : 5</text>
  <text x="164" y="350" text-anchor="middle" font-size="10.5" fill="#333">P1 → P2 : 5</text>

  <!-- verdict -->
  <rect x="60" y="374" width="208" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="164" y="398" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">输出 = 2</text>

  <!-- RIGHT: Example 2 -->
  <rect x="336" y="44" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="476" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例 2：[[0,1,10],[1,0,1],</text>
  <text x="476" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[1,2,5],[2,0,5]]</text>

  <!-- transactions table -->
  <rect x="342" y="92" width="270" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="362" y="110" font-size="10.5" fill="#333" font-weight="bold">交易</text>
  <text x="470" y="110" font-size="10.5" fill="#333" font-weight="bold">P0 / P1</text>
  <text x="560" y="110" font-size="10.5" fill="#333" font-weight="bold">P2</text>

  <rect x="342" y="120" width="270" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="362" y="136" font-size="10.5" fill="#333">0→1, 10</text>
  <text x="470" y="136" font-size="10.5" fill="#b85450">−10 / +10</text>
  <text x="560" y="136" font-size="10.5" fill="#333">0</text>

  <rect x="342" y="144" width="270" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="362" y="160" font-size="10.5" fill="#333">1→0, 1</text>
  <text x="470" y="160" font-size="10.5" fill="#4a7a3a">+1 / −1</text>
  <text x="560" y="160" font-size="10.5" fill="#333">0</text>

  <rect x="342" y="168" width="270" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="362" y="184" font-size="10.5" fill="#333">1→2, 5</text>
  <text x="470" y="184" font-size="10.5" fill="#333">0 / −5</text>
  <text x="560" y="184" font-size="10.5" fill="#4a7a3a">+5</text>

  <rect x="342" y="192" width="270" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="362" y="208" font-size="10.5" fill="#333">2→0, 5</text>
  <text x="470" y="208" font-size="10.5" fill="#4a7a3a">+5 / 0</text>
  <text x="560" y="208" font-size="10.5" fill="#b85450">−5</text>

  <!-- net balance -->
  <rect x="342" y="220" width="270" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="477" y="237" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">净额：P0=−4, P1=+4, P2=0</text>

  <!-- debts + grouping -->
  <rect x="342" y="250" width="270" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="477" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">debts = [−4, +4]（P2=0 删）</text>
  <text x="477" y="287" text-anchor="middle" font-size="10.5" fill="#4a7a3a">1 组, k = 2</text>

  <!-- DP result -->
  <rect x="342" y="308" width="270" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="477" y="325" text-anchor="middle" font-size="10.8" fill="#555">dp[11] = popcount−1 = 2−1 = 1</text>

  <!-- settlement illustration -->
  <rect x="342" y="340" width="270" height="50" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="477" y="358" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">结算方案（1 笔）</text>
  <text x="477" y="378" text-anchor="middle" font-size="10.5" fill="#333">P1 → P0 : 4</text>

  <!-- verdict -->
  <rect x="372" y="398" width="208" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="476" y="422" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">输出 = 1</text>

  <!-- bottom takeaway -->
  <rect x="40" y="430" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="450" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：n 个非零净额 → 最多拆 ⌊n/2⌋ 组 → 最少 n−⌊n/2⌋ 笔；DP 枚举最优拆法</text>
</svg>
