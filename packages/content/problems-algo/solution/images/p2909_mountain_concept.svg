<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定山峰 j，左右两侧各自取最小</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">示例：nums = [5,4,8,7,10,2]，试山峰 j = 3（nums[j] = 7）</text>

  <text x="169" y="62" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">左侧候选 i ∈ [0, j)</text>
  <text x="394" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">右侧候选 k ∈ (j, n)</text>

  <rect x="55" y="70" width="228" height="60" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <rect x="351" y="70" width="86" height="60" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>

  <rect x="63" y="78" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <rect x="137" y="78" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="169" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <rect x="211" y="78" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="243" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <rect x="285" y="78" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="317" y="105" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="359" y="78" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="391" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>

  <rect x="433" y="78" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="465" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <text x="95" y="146" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="169" y="146" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="243" y="146" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="317" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3（j）</text>
  <text x="391" y="146" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="465" y="146" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>

  <path d="M 150 134 C 150 152, 152 160, 154 172" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 400 134 C 400 152, 404 160, 406 172" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="40" y="176" width="232" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="156" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">pre_min = 4（下标 1）</text>
  <text x="156" y="216" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4 &lt; 7 ✓ 左侧全体最小</text>
  <text x="156" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→ 它就是最优左腿</text>

  <rect x="288" y="176" width="232" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="404" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">suf_min = 2（下标 5）</text>
  <text x="404" y="216" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2 &lt; 7 ✓ 右侧全体最小</text>
  <text x="404" y="234" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">→ 它就是最优右腿</text>

  <rect x="40" y="262" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">候选和 = pre_min + nums[j] + suf_min = 4 + 7 + 2 = 13</text>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">枚举 j = 1 … n−2 取最小候选 → 本例答案 13</text>

  <rect x="40" y="332" width="480" height="80" fill="#ffffff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">为什么敢无脑取两侧最小值？</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">山形约束只比「值」：位置只要在 j 的同一侧，某侧最小值 &lt; nums[j] 时它就是该侧最优选择</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">若某侧最小值 ≥ nums[j]，说明该侧全员 ≥ nums[j]，j 这个山峰直接报废</text>
  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">—— 一个 min 同时干两件事：选最优 + 判合法</text>

  <rect x="40" y="426" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">两个不等式 nums[i] &lt; nums[j]、nums[k] &lt; nums[j] 都锚定 nums[j]</text>
  <text x="280" y="461" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 固定 j 后左右彻底解耦，各 O(1) 取最值，不再逐个比较</text>
</svg>
