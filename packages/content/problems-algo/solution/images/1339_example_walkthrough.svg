<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1：[1,2,3,4,5,6]，total = 21，枚举每条边</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">括号内为该节点子树和 S；红边为最优切分（节点 2，S=11）</text>

  <!-- ===== Left: tree with subtree sums ===== -->
  <g font-size="12">
    <!-- edges; cut edge 1-2 red dashed -->
    <line x1="150" y1="92" x2="110" y2="156" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
    <line x1="150" y1="92" x2="190" y2="156" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="110" y1="168" x2="85" y2="232" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="110" y1="168" x2="135" y2="232" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="190" y1="168" x2="190" y2="232" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

    <!-- nodes; root blue, node 2 orange (best), others light -->
    <circle cx="150" cy="84" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="150" y="89" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="150" y="72" text-anchor="middle" font-size="9" fill="#446688">(21)</text>

    <circle cx="110" cy="162" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="110" y="167" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="84" y="150" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">(11)</text>

    <circle cx="190" cy="162" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="167" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="216" y="150" text-anchor="middle" font-size="9" fill="#446688">(9)</text>

    <circle cx="85" cy="238" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="85" y="243" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="62" y="232" text-anchor="middle" font-size="9" fill="#446688">(4)</text>

    <circle cx="135" cy="238" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="135" y="243" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="158" y="232" text-anchor="middle" font-size="9" fill="#446688">(5)</text>

    <circle cx="190" cy="238" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="243" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <text x="214" y="232" text-anchor="middle" font-size="9" fill="#446688">(6)</text>
  </g>

  <text x="118" y="120" font-size="13" fill="#b85450" font-weight="bold">✂</text>

  <text x="150" y="288" text-anchor="middle" font-size="11" fill="#888">每条非根边 → 一棵子树和 S</text>
  <text x="150" y="304" text-anchor="middle" font-size="11" fill="#888">乘积 = S × (21 − S)</text>

  <!-- ===== Right: product table ===== -->
  <text x="470" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">各子树和对应的乘积</text>

  <!-- header row -->
  <rect x="330" y="84" width="280" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="362" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">节点</text>
  <text x="418" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">S</text>
  <text x="478" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">total−S</text>
  <text x="556" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">S×(total−S)</text>

  <!-- rows -->
  <g font-size="10" fill="#555">
    <rect x="330" y="110" width="280" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="362" y="125" text-anchor="middle">4</text><text x="418" y="125" text-anchor="middle">4</text><text x="478" y="125" text-anchor="middle">17</text><text x="556" y="125" text-anchor="middle">68</text>

    <rect x="330" y="134" width="280" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="362" y="149" text-anchor="middle">5</text><text x="418" y="149" text-anchor="middle">5</text><text x="478" y="149" text-anchor="middle">16</text><text x="556" y="149" text-anchor="middle">80</text>

    <rect x="330" y="158" width="280" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="362" y="173" text-anchor="middle">6</text><text x="418" y="173" text-anchor="middle">6</text><text x="478" y="173" text-anchor="middle">15</text><text x="556" y="173" text-anchor="middle">90</text>

    <rect x="330" y="182" width="280" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="362" y="197" text-anchor="middle">3</text><text x="418" y="197" text-anchor="middle">9</text><text x="478" y="197" text-anchor="middle">12</text><text x="556" y="197" text-anchor="middle">108</text>

    <!-- best row highlighted -->
    <rect x="330" y="206" width="280" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="362" y="222" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="418" y="222" text-anchor="middle" fill="#d6a040" font-weight="bold">11</text>
    <text x="478" y="222" text-anchor="middle" fill="#d6a040" font-weight="bold">10</text>
    <text x="556" y="222" text-anchor="middle" fill="#b85450" font-weight="bold">110 ←</text>
  </g>

  <!-- note: closest to total/2 -->
  <rect x="330" y="248" width="280" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">total/2 = 10.5</text>
  <text x="470" y="288" text-anchor="middle" font-size="10" fill="#666">S=11 最接近 10.5 → 乘积最大</text>
  <text x="470" y="304" text-anchor="middle" font-size="10" fill="#666">答案 = 110 % (10^9+7) = 110</text>

  <!-- bottom note -->
  <rect x="30" y="330" width="560" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">根节点 S=21（=total）不参与：21×0=0，自动落选</text>
  <text x="310" y="370" text-anchor="middle" font-size="10" fill="#666">只需枚举所有非根子树和，O(n) 一趟后序即可拿到全部候选</text>
</svg>
