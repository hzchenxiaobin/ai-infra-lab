<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：归并排序中「先计数 · 后合并」</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">计数条件 nums[i] &gt; 2·nums[j] ≠ 合并条件 nums[i] ≤ nums[j] → 必须分两趟</text>

  <!-- ===== Original array ===== -->
  <text x="40" y="74" font-size="11" fill="#446688" font-weight="bold">原数组 nums（以 [1,3,2,3,1] 为例，求翻转对总数）</text>

  <text x="92" y="92" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">0</text>
  <text x="148" y="92" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">1</text>
  <text x="204" y="92" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">2</text>
  <text x="260" y="92" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">3</text>
  <text x="316" y="92" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">4</text>

  <rect x="72" y="98" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="128" y="98" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="116" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="184" y="98" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="116" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="240" y="98" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="296" y="98" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- split line -->
  <path d="M 232 96 L 232 134" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="232" y="146" text-anchor="middle" font-size="9" fill="#d6a040">mid</text>

  <!-- Arrow down -->
  <path d="M 196 136 L 196 152" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="148" font-size="10" fill="#888">递归排序后，两半各自升序有序</text>

  <!-- ===== Two sorted halves ===== -->
  <text x="40" y="168" font-size="11" fill="#446688" font-weight="bold">左半（已有序）</text>
  <rect x="60" y="174" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="192" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="104" y="174" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="192" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="148" y="174" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="192" text-anchor="middle" font-size="11" fill="#333">3</text>

  <text x="300" y="168" font-size="11" fill="#b85450" font-weight="bold">右半（已有序）</text>
  <rect x="320" y="174" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="192" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="364" y="174" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="192" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- ===== Phase 1: Count ===== -->
  <rect x="30" y="216" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">阶段①计数：双指针扫两半，统计 nums[i] &gt; 2·nums[j] 的跨段对数</text>

  <!-- count rows -->
  <!-- i=0, val 1 -->
  <text x="40" y="270" font-size="10" fill="#446688" font-weight="bold">i=0,值1</text>
  <text x="110" y="270" font-size="10" fill="#333">1 &gt; 2×1=2 ?</text>
  <text x="220" y="270" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="270" y="270" font-size="10" fill="#888">j 不动，本 i 计 0 个</text>

  <!-- i=1, val 2 -->
  <text x="40" y="290" font-size="10" fill="#446688" font-weight="bold">i=1,值2</text>
  <text x="110" y="290" font-size="10" fill="#333">2 &gt; 2×1=2 ?</text>
  <text x="220" y="290" font-size="10" fill="#b85450" font-weight="bold">否（不严格大于）</text>
  <text x="330" y="290" font-size="10" fill="#888">j 不动，本 i 计 0 个</text>

  <!-- i=2, val 3 -->
  <text x="40" y="310" font-size="10" fill="#446688" font-weight="bold">i=2,值3</text>
  <text x="110" y="310" font-size="10" fill="#333">3 &gt; 2×1=2 ?</text>
  <text x="220" y="310" font-size="10" fill="#4a7a3a" font-weight="bold">是 → j++</text>
  <text x="290" y="310" font-size="10" fill="#333">3 &gt; 2×3=6 ?</text>
  <text x="380" y="310" font-size="10" fill="#b85450" font-weight="bold">否，停</text>
  <text x="440" y="310" font-size="10" fill="#4a7a3a" font-weight="bold">本 i 计 1</text>

  <!-- j pointer movement indicator -->
  <path d="M 340 198 L 340 214 L 384 214 L 384 198" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="362" y="210" text-anchor="middle" font-size="8" fill="#b85450">j 右移</text>

  <!-- count total -->
  <text x="40" y="332" font-size="11" fill="#4a7a3a" font-weight="bold">本层跨段计数 = j − (mid+1) 累加 = 0 + 0 + 1 = 1（即 (值3, 值1) 这一对）</text>

  <!-- ===== Phase 2: Merge ===== -->
  <rect x="30" y="346" width="500" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段②合并：按 nums[i] ≤ nums[j] 常规归并，写回有序段（不再计数）</text>

  <!-- arrow from phase1 to phase2 -->
  <path d="M 280 384 L 280 396" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="394" font-size="9" fill="#888">先计数再合并，互不干扰</text>

  <!-- ===== Bottom notes ===== -->
  <text x="20" y="416" font-size="10" fill="#888">💡 为什么分两趟？计数用「&gt; 2·nums[j]」、合并用「≤ nums[j]」，阈值不同，若边合并边计数会丢失有序性，无法 O(n) 双指针</text>
  <text x="20" y="434" font-size="10" fill="#888">⚠️ 溢出：nums[j] 可达 2³¹−1，2·nums[j] 溢出 int32 → 比较须用 (long long)nums[i] &gt; 2LL*nums[j]</text>
  <text x="20" y="452" font-size="10" fill="#888">💡 两半已有序 → 对每个 i，j 只前进不回退，双指针 O(n) 完成跨段计数；段内对数由递归子调用统计</text>
  <text x="20" y="470" font-size="10" fill="#888">⚠️ 「严格大于」：nums[i] = 2·nums[j] 不算翻转对（如 2 与 1：2 = 2×1，不计）</text>
</svg>
