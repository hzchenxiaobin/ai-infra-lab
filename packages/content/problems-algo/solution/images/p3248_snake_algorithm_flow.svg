<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：起点 0，查表取增量，逐条累加 pos</text>

  <!-- 开始 -->
  <rect x="228" y="34" width="64" height="24" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 260 58 L 260 70" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="120" y="72" width="280" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">pos = 0，Δ表 {UP:−n, DOWN:+n, LEFT:−1, RIGHT:+1}</text>
  <path d="M 260 100 L 260 112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 菱形：还有指令？ -->
  <polygon points="260,114 334,144 260,174 186,144" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">还有指令？</text>

  <!-- 否 → return pos -->
  <path d="M 186 144 L 150 144" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="168" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="24" y="127" width="124" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="86" y="148" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return pos</text>

  <!-- 是 → 查表取增量 -->
  <path d="M 334 144 L 366 144" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="350" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="368" y="129" width="120" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="428" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Δ ← Δ表[c]</text>
  <path d="M 428 159 L 428 186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- pos += Δ -->
  <rect x="368" y="188" width="120" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="428" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pos += Δ</text>

  <!-- 回到菱形 -->
  <path d="M 368 203 L 260 203 L 260 178" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 注释框 -->
  <rect x="56" y="232" width="408" height="80" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">状态机视角：状态 = 编号 pos，转移 = 查表加增量，m 步走完</text>
  <text x="260" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">全程不出界 ⇒ 无需边界检查；矩阵从未被读写，无需建格子</text>

  <!-- 脚注 -->
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">O(m) 时间 / O(1) 空间（m = 指令条数 ≤ 100）</text>
</svg>
