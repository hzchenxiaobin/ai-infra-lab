<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：异或配对相消，孤立者即缺失</text>
  <path d="M 300 46 Q 460 54 620 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 性质条 -->
  <g filter="url(#sk)">
    <rect x="90" y="68" width="740" height="46" rx="8" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="460" y="89" text-anchor="middle" font-size="14" fill="#7a5415">异或两条铁律：</text>
  <text x="460" y="106" text-anchor="middle" font-size="13" fill="#7a5415">a ⊕ a = 0 （自消）   ·   0 ⊕ x = x （零幺元）   →   配成对的全部消成 0，只剩落单的那个</text>

  <!-- 完整集 [0..n] -->
  <text x="120" y="150" font-size="14" font-weight="bold" fill="#446688">完整集 [0, 1, 2, ..., n]　(共 n+1 个)</text>
  <g filter="url(#sk)">
    <rect x="120" y="158" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="176" y="158" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="232" y="158" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="288" y="158" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="344" y="158" width="56" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="400" y="158" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="456" y="158" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="148" y="183" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">0</text>
  <text x="204" y="183" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <text x="260" y="183" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
  <text x="316" y="183" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <text x="372" y="183" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">2</text>
  <text x="428" y="183" text-anchor="middle" font-size="14" fill="#666">…</text>
  <text x="484" y="183" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">n</text>
  <text x="372" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">落单（缺失）</text>

  <!-- 数组 nums -->
  <text x="120" y="248" font-size="14" font-weight="bold" fill="#4a7a3a">数组 nums　(共 n 个，缺一个)</text>
  <g filter="url(#sk)">
    <rect x="120" y="256" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="176" y="256" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="232" y="256" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="288" y="256" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="344" y="256" width="56" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="400" y="256" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="456" y="256" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="148" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <text x="204" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">0</text>
  <text x="260" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <text x="316" y="281" text-anchor="middle" font-size="14" fill="#666">…</text>
  <text x="372" y="281" text-anchor="middle" font-size="15" fill="#bbb">×</text>
  <text x="428" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">n</text>
  <text x="484" y="281" text-anchor="middle" font-size="14" fill="#666">…</text>
  <text x="372" y="310" text-anchor="middle" font-size="12" fill="#999">此处无值</text>

  <!-- 配对消去连线 -->
  <path d="M 148 196 L 148 256" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 204 196 L 204 256" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 260 196 L 260 256" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 316 196 L 316 256" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 428 196 L 428 256" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 484 196 L 484 256" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- 中部公式 -->
  <g filter="url(#sk)">
    <rect x="540" y="232" width="320" height="86" rx="10" fill="#f7faff" stroke="#446688"/>
  </g>
  <text x="700" y="254" text-anchor="middle" font-size="13" fill="#446688">把「完整集」与「数组」全部异或：</text>
  <text x="700" y="276" text-anchor="middle" font-size="14" fill="#333">(3⊕0⊕1⊕2⊕…⊕n)</text>
  <text x="700" y="296" text-anchor="middle" font-size="14" fill="#333">⊕ (3⊕0⊕1⊕…⊕n)</text>
  <text x="700" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">= 缺失的 2</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="120" y="348" width="680" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="460" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">两集合同时出现的数各出现两次 → 自消为 0</text>
  <text x="460" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">只有缺失数在完整集里出现一次 → 0 ⊕ 缺失 = 缺失</text>

  <!-- 实现要点 -->
  <g filter="url(#sk)">
    <rect x="120" y="424" width="680" height="120" rx="8" fill="#fffdf3" stroke="#d6a040"/>
  </g>
  <text x="140" y="448" font-size="14" font-weight="bold" fill="#7a5415">代码上的巧写：一次遍历同时异或「下标」与「值」</text>
  <text x="140" y="472" font-size="13" fill="#5a4530">·  下标 i ∈ [0, n-1] 恰好覆盖完整集前 n 个数</text>
  <text x="140" y="494" font-size="13" fill="#5a4530">·  nums[i] 覆盖数组全部 n 个值</text>
  <text x="140" y="516" font-size="13" fill="#5a4530">·  完整集还差一个 n，用 ans 初始化为 n 一并带入</text>
  <text x="140" y="536" font-size="13" font-weight="bold" fill="#7a5415">→  ans = n;  for i: ans ^= i ^ nums[i];  return ans;</text>
</svg>
