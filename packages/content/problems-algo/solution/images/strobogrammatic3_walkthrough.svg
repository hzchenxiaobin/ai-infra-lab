<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：low="50", high="100" → 3</text>

  <!-- 步骤 1：长度范围 -->
  <rect x="40" y="44" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① len(low)=2, len(high)=3 → L ∈ {2, 3}，无中间长度</text>

  <!-- ===== 左面板：L=2 下界 ===== -->
  <rect x="40" y="92" width="230" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="155" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② L=2：保留 s ≥ "50"</text>

  <!-- 表头 -->
  <rect x="50" y="126" width="100" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="143" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">s</text>
  <rect x="160" y="126" width="100" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="143" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">s ≥ "50"?</text>

  <rect x="50" y="152" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="100" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"11"</text>
  <rect x="160" y="152" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="210" y="169" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ (11&lt;50)</text>

  <rect x="50" y="178" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="100" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"69"</text>
  <rect x="160" y="178" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="210" y="195" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="50" y="204" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="100" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"88"</text>
  <rect x="160" y="204" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="210" y="221" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="50" y="230" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="100" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"96"</text>
  <rect x="160" y="230" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="210" y="247" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="50" y="262" width="210" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="155" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">小计 3</text>

  <!-- ===== 右面板：L=3 上界 ===== -->
  <rect x="290" y="92" width="230" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="405" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ L=3：保留 s ≤ "100"</text>

  <rect x="300" y="126" width="100" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="143" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">s（最小几个）</text>
  <rect x="410" y="126" width="100" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="143" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">s ≤ "100"?</text>

  <rect x="300" y="152" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"101"</text>
  <rect x="410" y="152" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="460" y="169" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ (101&gt;100)</text>

  <rect x="300" y="178" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"111"</text>
  <rect x="410" y="178" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="460" y="195" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="300" y="204" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"181"</text>
  <rect x="410" y="204" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="460" y="221" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="300" y="230" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">... (共 12)</text>
  <rect x="410" y="230" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="460" y="247" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">全部 ✗</text>

  <rect x="300" y="262" width="210" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="405" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">小计 0（最小 101 已超上界）</text>

  <!-- 汇总 -->
  <path d="M 155 288 Q 280 304 280 312" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 405 288 Q 280 304 280 312" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="40" y="314" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">④ 合计 = 3 + 0 = 3</text>

  <rect x="40" y="356" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">洞察：L=3 最小中心对称数 "101" &gt; "100"，该长度整段贡献 0</text>
</svg>
