<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：位置只由 (x, y) 决定 —— 向上排序列，向下插空档</text>

  <text x="32" y="52" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 两种操作（起点台阶 1，jump = 0）</text>

  <rect x="36" y="216" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="74" y="234" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="70" y="190" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="104" y="164" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="182" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="138" y="138" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="156" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>

  <circle cx="92" cy="183" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="172" text-anchor="end" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">Alice</text>

  <path d="M 82 196 L 60 214" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="46" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <path d="M 138 184 Q 158 168 148 162" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="188" y="192" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+2^jump</text>

  <rect x="30" y="252" width="212" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="136" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 向下走 1 级：不能连续使用，</text>
  <text x="136" y="286" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">在第 0 级也不能用</text>

  <rect x="30" y="304" width="212" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="136" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 向上跳 2^jump 级（第 1 次跳 1、第 2 次</text>
  <text x="136" y="338" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">跳 2、第 3 次跳 4…），之后 jump+1</text>

  <text x="262" y="52" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 槽位模型：x 次向上 ⇒ x+1 个空档</text>

  <rect x="262" y="66" width="26" height="28" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <rect x="291" y="66" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <rect x="320" y="66" width="26" height="28" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <rect x="349" y="66" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <rect x="378" y="66" width="26" height="28" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <rect x="407" y="66" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <rect x="436" y="66" width="26" height="28" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>

  <text x="304" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2⁰</text>
  <text x="362" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2¹</text>
  <text x="420" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2²</text>
  <text x="262" y="126" font-size="10.5" fill="#888" filter="url(#rough2)">虚线空格 = 空档，各至多插 1 次「向下」</text>

  <rect x="262" y="140" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="159" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <rect x="291" y="140" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="159" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <rect x="320" y="140" width="26" height="28" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <rect x="349" y="140" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="159" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <rect x="378" y="140" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="159" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <rect x="407" y="140" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="159" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <rect x="436" y="140" width="26" height="28" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>

  <text x="262" y="190" font-size="10.5" fill="#888" filter="url(#rough2)">一种插法：D 放空档 0 和空档 2（y = 2）</text>

  <rect x="262" y="202" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="382" y="220" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">插法共 C(x+1, y) 种</text>
  <text x="382" y="236" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—— 从 x+1 个空档里选 y 个放 D</text>

  <rect x="30" y="360" width="460" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">最终位置 = 1 + (2⁰+2¹+⋯+2ˣ⁻¹) − y = 2ˣ − y</text>
  <text x="260" y="404" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">令 2ˣ − y = k ⇒ y = 2ˣ − k（x 次向上、y 次向下）</text>
  <text x="260" y="424" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = Σₓ C(x+1, 2ˣ − k)，仅当 0 ≤ 2ˣ − k ≤ x+1 时非零</text>
</svg>
