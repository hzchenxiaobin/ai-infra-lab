<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="20" y="26" font-size="13" fill="#333" filter="url(#rough2)">核心观察：答案 = 最大后缀，截到 K 位</text>
  <text x="20" y="44" font-size="12" fill="#666" filter="url(#rough2)">word = "dbca"，numFriends = 2 → K = 4 − 2 + 1 = 3</text>

  <!-- 高亮带：最大后缀保留的部分 -->
  <rect x="66" y="61" width="120" height="40" rx="6" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="87" y="60" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">★</text>

  <!-- 行 0：起点 0 的后缀 = 整串，最大后缀 -->
  <text x="62" y="86" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">起点0</text>
  <rect x="70" y="66" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="87" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="110" y="66" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="127" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="150" y="66" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="167" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <!-- 被截掉的部分 -->
  <rect x="190" y="66" width="34" height="30" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="207" y="86" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">a</text>

  <!-- 截断线 -->
  <path d="M187,64 L187,100" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="196" y="62" font-size="10.5" fill="#b85450" filter="url(#rough2)">截到 K=3 位</text>

  <!-- 行 1：起点 1 -->
  <text x="62" y="126" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">起点1</text>
  <rect x="110" y="106" width="34" height="30" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="127" y="126" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">b</text>
  <rect x="150" y="106" width="34" height="30" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="167" y="126" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">c</text>
  <rect x="190" y="106" width="34" height="30" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="207" y="126" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">a</text>

  <!-- 行 2：起点 2 -->
  <text x="62" y="166" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">起点2</text>
  <rect x="150" y="146" width="34" height="30" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="167" y="166" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">c</text>
  <rect x="190" y="146" width="34" height="30" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="207" y="166" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">a</text>

  <!-- 行 3：起点 3 -->
  <text x="62" y="206" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">起点3</text>
  <rect x="190" y="186" width="34" height="30" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="207" y="206" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">a</text>

  <!-- 右侧注释 -->
  <text x="250" y="88" font-size="12" fill="#b85450" filter="url(#rough2)">最大后缀 S = "dbca"</text>
  <text x="250" y="104" font-size="10.5" fill="#666" filter="url(#rough2)">（全部后缀里的字典序冠军）</text>
  <text x="250" y="132" font-size="11" fill="#666" filter="url(#rough2)">任何子串都是某个后缀的前缀</text>
  <text x="250" y="152" font-size="11" fill="#666" filter="url(#rough2)">逐位比较，谁也赢不了 S 的前 K 位</text>
  <text x="250" y="188" font-size="11" fill="#666" filter="url(#rough2)">若最大后缀本身比 K 短（起点靠后），</text>
  <text x="250" y="204" font-size="11" fill="#666" filter="url(#rough2)">答案就是 S 整串：如 "abza" → "za"</text>

  <!-- 结论框 -->
  <rect x="40" y="240" width="440" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 = S 的前 min(K, |S|) 个字符，本题 = "dbc"</text>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">盒子里的字符串恰好是所有长度 ≤ K 的子串</text>

  <!-- 特判警告框 -->
  <rect x="40" y="304" width="440" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#rough2)">⚠ numFriends = 1 必须特判：直接返回 word</text>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">此时唯一分割就是整个 word，「盒子 = 长度 ≤ K 的子串」不再成立</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#8c3a34" filter="url(#rough2)">反例 word = "ab"：不特判会返回 "b"，正确答案是 "ab"</text>
</svg>
