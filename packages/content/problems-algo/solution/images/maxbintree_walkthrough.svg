<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [3,2,1,6,0,5]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">逐步分治：每个区间找最大值 → 建根 → 切分左右</text>

  <!-- 步骤表格 -->
  <!-- 表头 -->
  <rect x="30" y="56" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="71" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <rect x="74" y="56" width="180" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="164" y="71" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">当前区间</text>
  <rect x="258" y="56" width="60" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="288" y="71" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">max</text>
  <rect x="322" y="56" width="228" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="436" y="71" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">动作</text>

  <!-- 步骤 1: [3,2,1,6,0,5] max=6 -->
  <text x="50" y="98" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="78" y="84" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="99" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="104" y="84" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="99" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="130" y="84" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="99" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="156" y="84" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="168" y="99" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>
  <rect x="182" y="84" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="194" y="99" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="208" y="84" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="99" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="288" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="328" y="99" font-size="10" fill="#555">根=6；左=[3,2,1]，右=[0,5]</text>

  <!-- 步骤 2: [3,2,1] max=3 -->
  <text x="50" y="126" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <rect x="88" y="112" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="127" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <rect x="114" y="112" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="126" y="127" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="140" y="112" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="127" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="288" y="127" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="328" y="127" font-size="10" fill="#555">6 的左子=3；左=[]，右=[2,1]</text>

  <!-- 步骤 3: [2,1] max=2 -->
  <text x="50" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <rect x="108" y="140" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="155" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <rect x="134" y="140" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="155" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="288" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="328" y="155" font-size="10" fill="#555">3 的右子=2；左=[]，右=[1]</text>

  <!-- 步骤 4: [1] max=1 -->
  <text x="50" y="182" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <rect x="118" y="168" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="183" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="288" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="328" y="183" font-size="10" fill="#555">2 的右子=1；叶子（无子节点）</text>

  <!-- 步骤 5: [0,5] max=5 -->
  <text x="50" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <rect x="108" y="196" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="211" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="134" y="196" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="211" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="288" y="211" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="328" y="211" font-size="10" fill="#555">6 的右子=5；左=[0]，右=[]</text>

  <!-- 步骤 6: [0] max=0 -->
  <text x="50" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>
  <rect x="118" y="224" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="239" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="288" y="239" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="328" y="239" font-size="10" fill="#555">5 的左子=0；叶子（无子节点）</text>

  <!-- 分隔线 -->
  <line x1="30" y1="262" x2="550" y2="262" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 最终树 -->
  <text x="290" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终最大二叉树：[6,3,5,null,2,0,null,null,1]</text>

  <!-- 树节点 -->
  <!-- 6 根 -->
  <circle cx="290" cy="320" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="290" y="326" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>

  <!-- 连线 -->
  <line x1="276" y1="336" x2="210" y2="372" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="304" y1="336" x2="370" y2="372" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 3 -->
  <circle cx="210" cy="382" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="387" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <!-- 5 -->
  <circle cx="370" cy="382" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="387" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- 3 的右子 2 -->
  <line x1="224" y1="397" x2="248" y2="424" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="254" cy="434" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="439" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <!-- 5 的左子 0 -->
  <line x1="356" y1="397" x2="332" y2="424" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="326" cy="434" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="439" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- 2 的右子 1 -->
  <line x1="268" y1="448" x2="282" y2="470" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <circle cx="288" cy="478" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="288" y="482" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>

  <!-- 标注 -->
  <text x="100" y="330" font-size="10" fill="#b85450" font-weight="bold">根</text>
  <text x="100" y="387" font-size="10" fill="#446688">左子树</text>
  <text x="420" y="387" font-size="10" fill="#4a7a3a">右子树</text>
  <text x="160" y="439" font-size="9" fill="#888">3 无左子</text>
  <text x="380" y="439" font-size="9" fill="#888">5 无右子</text>
</svg>
