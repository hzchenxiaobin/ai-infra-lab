<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">add 流程：定位首个重叠/相邻段 → 合并 → 维护 cnt</text>

  <!-- add panel -->
  <rect x="36" y="38" width="488" height="158" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="58" font-size="12.5" fill="#446688" font-weight="bold">add(left, right) — 闭区间并集，相邻段也合并（r+1==l 视为相邻）</text>

  <rect x="70" y="68" width="420" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="10.5" fill="#333">① it = upper_bound(left)  // 首个键 l &gt; left</text>
  <path d="M 280 92 L 280 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="102" width="420" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="117" text-anchor="middle" font-size="10.5" fill="#333">② prev(it).r ≥ left−1 ? it ← prev(it) : 不动  // 左邻/重叠才回退</text>
  <path d="M 280 126 L 280 134" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="136" width="420" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="10.5" fill="#333">③ 扫描 it.l ≤ right+1：newL=min, newR=max, cnt −= (r−l+1), 收集待删</text>
  <path d="M 280 160 L 280 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="170" width="420" height="22" fill="#fff8e1" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">④ 删旧键；ranges[newL]=newR；cnt += newR−newL+1</text>

  <!-- count panel -->
  <rect x="36" y="208" width="488" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="228" font-size="12.5" fill="#4a7a3a" font-weight="bold">count() — 直接返回累计值</text>
  <rect x="70" y="238" width="420" height="22" fill="#fff8e1" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="253" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">return cnt  // 无需遍历区间集合，O(1)</text>

  <!-- footer note -->
  <rect x="36" y="292" width="488" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="312" font-size="11" fill="#b85450" font-weight="bold">关键技巧</text>
  <text x="52" y="330" font-size="10.5" fill="#333">• 闭区间相邻判定 = 半开区间 left−1 / right+1 平移：相邻 [a,b] 与 [b+1,c] 合并成 [a,c]</text>
  <text x="52" y="346" font-size="10.5" fill="#333">• 摊还 O(log n)：每段至多被删一次，定位用 upper_bound，全程 O(Q log Q)</text>
</svg>
