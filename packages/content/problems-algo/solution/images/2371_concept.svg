<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：同行同列的严格大小关系构成偏序 DAG，每格取值＝以它结尾的最长链长</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">绿边＝行内约束（同行小→大）　蓝边＝列内约束（同列小→大）　数字＝原始值</text>

  <!-- ===== Left : original grid ===== -->
  <text x="112" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原始矩阵 grid</text>
  <g filter="url(#rough2)">
    <!-- (0,0)=3 -->
    <rect x="60" y="92" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="86" y="110" text-anchor="middle" font-size="10" fill="#999">(0,0)</text>
    <text x="86" y="128" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
    <!-- (0,1)=1 -->
    <rect x="112" y="92" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="138" y="110" text-anchor="middle" font-size="10" fill="#999">(0,1)</text>
    <text x="138" y="128" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
    <!-- (1,0)=2 -->
    <rect x="60" y="136" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="86" y="154" text-anchor="middle" font-size="10" fill="#999">(1,0)</text>
    <text x="86" y="172" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
    <!-- (1,1)=5 -->
    <rect x="112" y="136" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="138" y="154" text-anchor="middle" font-size="10" fill="#999">(1,1)</text>
    <text x="138" y="172" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  </g>

  <!-- arrow grid -> DAG -->
  <path d="M 168 158 L 250 158" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="209" y="150" text-anchor="middle" font-size="10" fill="#666">建偏序图</text>

  <!-- ===== Right : DAG ===== -->
  <!-- edges first (under nodes) -->
  <g filter="url(#rough2)">
    <!-- 1 -> 3 : row0, green, vertical -->
    <path d="M 340 122 L 340 198" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
    <text x="300" y="164" text-anchor="end" font-size="10" fill="#4a7a3a">行0</text>
    <!-- 2 -> 5 : row1, green, vertical -->
    <path d="M 500 122 L 500 198" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
    <text x="540" y="164" font-size="10" fill="#4a7a3a">行1</text>
    <!-- 1 -> 5 : col1, blue, diagonal -->
    <path d="M 368 118 L 474 202" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>
    <text x="448" y="150" font-size="10" fill="#446688">列1</text>
    <!-- 2 -> 3 : col0, blue, diagonal -->
    <path d="M 472 118 L 366 202" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>
    <text x="372" y="150" text-anchor="end" font-size="10" fill="#446688">列0</text>
  </g>

  <!-- nodes -->
  <g filter="url(#rough2)">
    <!-- node (0,1)=1  source -->
    <ellipse cx="340" cy="96" rx="34" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="340" y="88" text-anchor="middle" font-size="9" fill="#888">(0,1)</text>
    <text x="340" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
    <!-- node (1,0)=2  source -->
    <ellipse cx="500" cy="96" rx="34" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="500" y="88" text-anchor="middle" font-size="9" fill="#888">(1,0)</text>
    <text x="500" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
    <!-- node (0,0)=3  sink -->
    <ellipse cx="340" cy="224" rx="34" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="340" y="216" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>
    <text x="340" y="234" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
    <!-- node (1,1)=5  sink -->
    <ellipse cx="500" cy="224" rx="34" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="500" y="216" text-anchor="middle" font-size="9" fill="#888">(1,1)</text>
    <text x="500" y="234" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  </g>

  <!-- ans badges -->
  <g filter="url(#rough2)">
    <rect x="312" y="256" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="340" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 1</text>
    <rect x="472" y="256" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="500" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 1</text>
    <rect x="312" y="60" width="56" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="340" y="74" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ans = 2</text>
    <rect x="472" y="60" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6"/>
    <text x="500" y="74" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = 2</text>
  </g>

  <!-- ===== Bottom insight ===== -->
  <rect x="40" y="300" width="540" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每格 ans = 1 + max{ 前驱 ans } ＝ 以它结尾的最长链长</text>
  <text x="310" y="342" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案（全局最大值）＝ 偏序最长链长 L ＝ 2，链如 (0,1)→(0,0)，天然最优</text>
  <text x="310" y="358" text-anchor="middle" font-size="10" fill="#888">所有原始值互不相同 ⇒ 同行同列只有严格大小 ⇒ 无「等值同秩」传染 ⇒ 不需并查集</text>
</svg>
