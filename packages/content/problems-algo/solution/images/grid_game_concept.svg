<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：第一个机器人在列 c 转下，剩两块「互斥」区域</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下机器人只能二选一：左下块(绿) 或 右上块(蓝)</text>

  <!-- Column index labels -->
  <g filter="url(#rough2)" font-size="10" fill="#aaa" text-anchor="middle">
    <text x="110" y="78">c=0</text>
    <text x="160" y="78">1</text>
    <text x="210" y="78">2</text>
    <text x="260" y="78">3</text>
    <text x="310" y="78">4</text>
  </g>

  <!-- Row labels -->
  <text x="70" y="108" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">row0</text>
  <text x="70" y="158" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">row1</text>

  <!-- Row 0 cells -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- row0[0..2] cleared by first robot (orange-ish, struck) -->
    <rect x="90" y="88" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="110" y="109" fill="#b85450" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="140" y="88" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="160" y="109" fill="#b85450" font-weight="bold" text-decoration="line-through">5</text>
    <rect x="190" y="88" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="210" y="109" fill="#b85450" font-weight="bold" text-decoration="line-through">4</text>
    <!-- row0[3..4] upper-right block (blue) -->
    <rect x="240" y="88" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="260" y="109" fill="#446688" font-weight="bold">3</text>
    <rect x="290" y="88" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="310" y="109" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- Row 1 cells -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- row1[0..1] lower-left block (green) -->
    <rect x="90" y="138" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="110" y="159" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="140" y="138" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="160" y="159" fill="#4a7a3a" font-weight="bold">5</text>
    <!-- row1[2..4] cleared by first robot (orange-ish, struck) -->
    <rect x="190" y="138" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="210" y="159" fill="#b85450" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="240" y="138" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="260" y="159" fill="#b85450" font-weight="bold" text-decoration="line-through">6</text>
    <rect x="290" y="138" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="310" y="159" fill="#b85450" font-weight="bold" text-decoration="line-through">1</text>
  </g>

  <!-- First robot path arrow (turn at c=2): (0,0)->(0,2)->(1,2)->(1,4) -->
  <path d="M 110 84 L 110 76 L 210 76 L 210 134" stroke="#b85450" stroke-width="2" fill="none"
        stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="200" y="68" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">机器人1 路径(c=2)</text>

  <!-- Brace: lower-left block -->
  <path d="M 88 176 L 88 182 L 162 182 L 162 176" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="125" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左下块 = row1[0..c-1]</text>

  <!-- Brace: upper-right block -->
  <path d="M 238 84 L 238 78 L 312 78 L 312 84" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="275" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">右上块 = row0[c+1..n-1]</text>

  <!-- Divider -->
  <line x1="40" y1="216" x2="540" y2="216" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Second robot: two choices -->
  <text x="290" y="236" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">下机器人二选一（取较大者）</text>

  <!-- Choice A: turn early, take lower-left -->
  <g filter="url(#rough2)">
    <text x="56" y="276" font-size="10.5" fill="#4a7a3a" font-weight="bold">选 A：早转弯</text>
    <rect x="120" y="260" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="140" y="280" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle">8</text>
    <rect x="162" y="260" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="182" y="280" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle">5</text>
    <text x="216" y="280" font-size="10.5" fill="#4a7a3a">和 = 13</text>
    <path d="M 140 296 L 140 306 L 320 306" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)"/>
    <text x="230" y="302" font-size="9.5" fill="#4a7a3a">走 row1 全程</text>
  </g>

  <!-- Choice B: turn late, take upper-right -->
  <g filter="url(#rough2)">
    <text x="56" y="332" font-size="10.5" fill="#446688" font-weight="bold">选 B：晚转弯</text>
    <rect x="120" y="316" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="140" y="336" font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">3</text>
    <rect x="162" y="316" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="182" y="336" font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">1</text>
    <text x="216" y="336" font-size="10.5" fill="#446688">和 = 4</text>
    <path d="M 320 312 L 320 322 L 140 322" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)"/>
    <text x="218" y="318" font-size="9.5" fill="#446688">走 row0 全程再下</text>
  </g>

  <!-- Formula box -->
  <rect x="360" y="252" width="200" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="460" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">给定 c，下机器人得分：</text>
  <text x="460" y="296" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">max(左下块和, 右上块和)</text>
  <text x="460" y="316" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">机器人1 选 c 使上式最小</text>
  <text x="460" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">min max( prefix, suffix )</text>

  <!-- Note -->
  <rect x="40" y="360" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">为何只能二选一？单次转弯的路径无法同时跨过 c 到达两块</text>
</svg>
