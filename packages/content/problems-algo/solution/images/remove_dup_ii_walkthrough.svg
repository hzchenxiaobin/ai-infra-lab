<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "deeedbbcccbdaa", k = 3</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">蓝=字符框（附计数），红=凑满 k 弹出，绿=续接已有计数</text>

  <!-- Header -->
  <text x="30" y="72" font-size="12" fill="#444" font-weight="bold">读入</text>
  <text x="120" y="72" font-size="12" fill="#444" font-weight="bold">栈状态（底→顶）</text>
  <text x="500" y="72" font-size="12" fill="#444" font-weight="bold">说明</text>
  <line x1="20" y1="80" x2="600" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: d -->
  <text x="30" y="108" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="120" y="94" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <line x1="158" y1="98" x2="158" y2="116" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="112" font-size="10" fill="#446688">1</text>
  <text x="500" y="112" font-size="11" fill="#888">栈空 → push (d,1)</text>

  <!-- Row 2: e -->
  <text x="30" y="146" font-size="12" fill="#333" font-weight="bold">e</text>
  <rect x="120" y="132" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <line x1="158" y1="136" x2="158" y2="154" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="150" font-size="10" fill="#446688">1</text>
  <rect x="180" y="132" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <line x1="218" y1="136" x2="218" y2="154" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="232" y="150" font-size="10" fill="#446688">1</text>
  <text x="500" y="150" font-size="11" fill="#888">不同字符 → push (e,1)</text>

  <!-- Row 3: e (cnt=2) -->
  <text x="30" y="184" font-size="12" fill="#333" font-weight="bold">e</text>
  <rect x="120" y="170" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <text x="172" y="188" font-size="10" fill="#446688">1</text>
  <rect x="180" y="170" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="232" y="188" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="500" y="188" font-size="11" fill="#4a7a3a">同字符 → cnt 1→2</text>

  <!-- Row 4: e (cnt=3 pop) -->
  <text x="30" y="222" font-size="12" fill="#b85450" font-weight="bold">e</text>
  <rect x="120" y="208" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <text x="172" y="226" font-size="10" fill="#446688">1</text>
  <rect x="180" y="208" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="232" y="226" font-size="10" fill="#b85450" font-weight="bold">3=k</text>
  <text x="260" y="226" font-size="14" fill="#b85450" font-weight="bold">→ pop!</text>
  <text x="500" y="222" font-size="11" fill="#b85450" font-weight="bold">cnt=3=k → 弹出 (e,3)</text>
  <text x="500" y="238" font-size="10" fill="#888">栈变回 [(d,1)]</text>

  <!-- Row 5: d (cnt=2, continues) -->
  <text x="30" y="262" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="120" y="248" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <text x="172" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="260" y="266" font-size="11" fill="#4a7a3a">⬅ 续接左侧 d，无需重扫</text>
  <text x="500" y="266" font-size="11" fill="#4a7a3a">弹出后栈顶又=d → cnt 1→2</text>

  <!-- Row 6: bb -->
  <text x="30" y="300" font-size="12" fill="#333" font-weight="bold">b b</text>
  <rect x="120" y="286" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <text x="172" y="304" font-size="10" fill="#446688">2</text>
  <rect x="180" y="286" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="232" y="304" font-size="10" fill="#446688">2</text>
  <text x="500" y="304" font-size="11" fill="#888">push (b,1) → cnt 升到 2</text>

  <!-- Row 7: ccc pop -->
  <text x="30" y="338" font-size="12" fill="#b85450" font-weight="bold">c c c</text>
  <rect x="120" y="324" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <text x="172" y="342" font-size="10" fill="#446688">2</text>
  <rect x="180" y="324" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="232" y="342" font-size="10" fill="#446688">2</text>
  <rect x="240" y="324" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <text x="292" y="342" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="320" y="342" font-size="14" fill="#b85450" font-weight="bold">→ pop!</text>
  <text x="500" y="338" font-size="11" fill="#b85450" font-weight="bold">弹出 (c,3) → [(d,2)(b,2)]</text>

  <!-- Row 8: b pop -->
  <text x="30" y="376" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <rect x="120" y="362" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="380" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <text x="172" y="380" font-size="10" fill="#446688">2</text>
  <rect x="180" y="362" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="380" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="232" y="380" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="260" y="380" font-size="14" fill="#b85450" font-weight="bold">→ pop!</text>
  <text x="500" y="376" font-size="11" fill="#b85450" font-weight="bold">续接 b：cnt 2→3 → 弹出</text>

  <!-- Row 9: d pop -->
  <text x="30" y="414" font-size="12" fill="#b85450" font-weight="bold">d</text>
  <rect x="120" y="400" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="418" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <text x="172" y="418" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="200" y="418" font-size="14" fill="#b85450" font-weight="bold">→ pop!</text>
  <text x="500" y="414" font-size="11" fill="#b85450" font-weight="bold">续接 d：cnt 2→3 → 弹出 → 栈空</text>

  <!-- Result -->
  <line x1="20" y1="436" x2="600" y2="436" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="448" width="540" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="466" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最后 "aa" 入栈 → 栈中只剩 (a,2) → 结果 "aa" ✓</text>
</svg>
