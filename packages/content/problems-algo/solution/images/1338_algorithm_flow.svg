<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希计数 → 降序排序 → 贪心累加 → 判停</text>

  <!-- ① 哈希计数 -->
  <rect x="70" y="46" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="240" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 哈希计数：遍历 arr，freq[v]++</text>

  <path d="M240 90 L240 118" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- ② 降序排序 -->
  <rect x="70" y="120" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="240" y="147" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 提取所有频率值，按降序排序</text>

  <path d="M240 164 L240 192" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- ③ 贪心累加 -->
  <rect x="70" y="194" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="240" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 贪心累加：sum += freq[i]，cnt++</text>

  <path d="M240 238 L240 264" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- ④ 判断菱形 -->
  <polygon points="240,266 330,304 240,342 150,304" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">sum ≥ n/2 ?</text>
  <text x="240" y="316" text-anchor="middle" font-size="10" fill="#888">(n 为偶数)</text>

  <!-- 否：回到 ③ (左侧回路) -->
  <path d="M150 304 L40 304 L40 216 L70 216" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="32" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 32 260)">否，取下一个</text>

  <!-- 是：到 ⑤ 返回 -->
  <path d="M330 304 L420 304 L420 216 L460 216" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="430" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" transform="rotate(-90 430 260)">是</text>

  <!-- ⑤ 返回 cnt -->
  <rect x="460" y="194" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="495" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回</text>
  <text x="495" y="230" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">cnt</text>

  <!-- 底部说明 -->
  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">关键不变式：每次选当前最大频率，用最少种数凑够 n/2</text>
  <text x="270" y="400" text-anchor="middle" font-size="11" fill="#888">排序保证「大的先选」→ 交换论证可证贪心最优</text>
  <text x="270" y="420" text-anchor="middle" font-size="10" fill="#aaa">时间 O(n log n)（排序）/ 空间 O(n)（哈希表）</text>
</svg>
