<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：paths = [[0,1,2,3,4],[2,3,4],[4,0,1,2,3]]</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">minLen = 3，二分 [0, 3]，最终答案 = 2</text>

  <!-- L=3 check -->
  <rect x="30" y="56" width="580" height="190" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="78" font-size="13" fill="#b85450" font-weight="bold">check(L=3)?</text>

  <!-- Path 0 windows L=3 -->
  <text x="50" y="100" font-size="10" fill="#888">路径0 窗口：</text>
  <g font-size="10">
    <rect x="120" y="88" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="160" y="103" text-anchor="middle" fill="#446688">[0,1,2]</text>
    <rect x="206" y="88" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="246" y="103" text-anchor="middle" fill="#446688">[1,2,3]</text>
    <rect x="292" y="88" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="332" y="103" text-anchor="middle" fill="#446688">[2,3,4]</text>
  </g>
  <text x="386" y="103" font-size="10" fill="#888">→ S = {h(012), h(123), h(234)}</text>

  <!-- Path 1 windows L=3 -->
  <text x="50" y="128" font-size="10" fill="#888">路径1 窗口：</text>
  <g font-size="10">
    <rect x="120" y="116" width="80" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="160" y="131" text-anchor="middle" fill="#d6a040">[2,3,4]</text>
  </g>
  <text x="216" y="131" font-size="10" fill="#888">→ S ∩ {h(234)} = {h(234)}</text>

  <!-- Path 2 windows L=3 -->
  <text x="50" y="156" font-size="10" fill="#888">路径2 窗口：</text>
  <g font-size="10">
    <rect x="120" y="144" width="80" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="160" y="159" text-anchor="middle" fill="#d6a040">[4,0,1]</text>
    <rect x="206" y="144" width="80" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="246" y="159" text-anchor="middle" fill="#d6a040">[0,1,2]</text>
    <rect x="292" y="144" width="80" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="332" y="159" text-anchor="middle" fill="#d6a040">[1,2,3]</text>
  </g>
  <text x="386" y="159" font-size="10" fill="#888">→ {h(234)} ∩ {h(401),h(012),h(123)}</text>

  <rect x="50" y="176" width="250" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="195" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">S = ∅ → return false ✗</text>
  <text x="320" y="195" font-size="10" fill="#888">hi = 3−1 = 2</text>

  <!-- L=2 check -->
  <rect x="30" y="260" width="580" height="200" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="282" font-size="13" fill="#4a7a3a" font-weight="bold">check(L=2)?</text>

  <!-- Path 0 windows L=2 -->
  <text x="50" y="304" font-size="10" fill="#888">路径0 窗口：</text>
  <g font-size="10">
    <rect x="120" y="292" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155" y="307" text-anchor="middle" fill="#446688">[0,1]</text>
    <rect x="196" y="292" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="231" y="307" text-anchor="middle" fill="#446688">[1,2]</text>
    <rect x="272" y="292" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="307" y="307" text-anchor="middle" fill="#446688">[2,3]</text>
    <rect x="348" y="292" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="383" y="307" text-anchor="middle" fill="#446688">[3,4]</text>
  </g>
  <text x="434" y="307" font-size="10" fill="#888">→ S = {h(01),h(12),h(23),h(34)}</text>

  <!-- Path 1 windows L=2 -->
  <text x="50" y="332" font-size="10" fill="#888">路径1 窗口：</text>
  <g font-size="10">
    <rect x="120" y="320" width="70" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155" y="335" text-anchor="middle" fill="#d6a040">[2,3]</text>
    <rect x="196" y="320" width="70" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="231" y="335" text-anchor="middle" fill="#d6a040">[3,4]</text>
  </g>
  <text x="282" y="335" font-size="10" fill="#888">→ S ∩ {h(23),h(34)} = {h(23),h(34)}</text>

  <!-- Path 2 windows L=2 -->
  <text x="50" y="360" font-size="10" fill="#888">路径2 窗口：</text>
  <g font-size="10">
    <rect x="120" y="348" width="70" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155" y="363" text-anchor="middle" fill="#d6a040">[4,0]</text>
    <rect x="196" y="348" width="70" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="231" y="363" text-anchor="middle" fill="#d6a040">[0,1]</text>
    <rect x="272" y="348" width="70" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="307" y="363" text-anchor="middle" fill="#d6a040">[1,2]</text>
    <rect x="348" y="348" width="70" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="383" y="363" text-anchor="middle" fill="#d6a040">[2,3]</text>
  </g>
  <text x="434" y="363" font-size="10" fill="#888">→ {h(23),h(34)} ∩ {h(40),h(01),h(12),h(23)}</text>

  <rect x="50" y="380" width="250" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="399" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">S = {h(23)} ≠ ∅ → return true ✓</text>
  <text x="320" y="399" font-size="10" fill="#888">lo = 2</text>

  <text x="50" y="428" font-size="10" fill="#888">lo=2, hi=2 → 二分结束</text>
  <rect x="200" y="416" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="437" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">答案 = 2，公共子路径 [2,3]</text>

  <!-- Summary -->
  <rect x="30" y="466" width="580" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="486" font-size="11" fill="#d6a040" font-weight="bold">每轮 check 的时间 = O(S)，二分 O(log minLen) 轮</text>
  <text x="50" y="502" font-size="10" fill="#888">总复杂度 O(S · log minLen)，S ≤ 10⁵，log minLen ≤ 17 → 约 1.7×10⁶ 次操作</text>
</svg>
