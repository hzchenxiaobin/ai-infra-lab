<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：给每个节点编号，宽度 = 末编号 − 首编号 + 1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">节点 i 的左孩子 = 2i+1，右孩子 = 2i+2（0-indexed，空位也占编号）</text>

  <!-- ===== Tree [1,3,2,5,3,null,9] ===== -->
  <g font-size="12">
    <!-- root L0 id=0 -->
    <circle cx="280" cy="84" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="280" y="89" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="306" y="78" font-size="10" fill="#b85450">id=0</text>

    <!-- L1 id=1 (3), id=2 (2) -->
    <circle cx="200" cy="152" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="200" y="157" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="222" y="146" font-size="10" fill="#446688">id=1</text>

    <circle cx="360" cy="152" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="360" y="157" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="382" y="146" font-size="10" fill="#446688">id=2</text>

    <line x1="266" y1="98" x2="214" y2="138" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="294" y1="98" x2="346" y2="138" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- L2 id=3 (5), id=4 (3), id=5 (null 虚位), id=6 (9) -->
    <circle cx="160" cy="228" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="160" y="233" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="180" y="223" font-size="9" fill="#4a7a3a">id=3</text>

    <circle cx="232" cy="228" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="232" y="233" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="252" y="223" font-size="9" fill="#4a7a3a">id=4</text>

    <!-- null 占位 id=5 -->
    <rect x="289" y="213" width="34" height="30" rx="4" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="306" y="232" text-anchor="middle" font-size="10" fill="#aaa">null</text>
    <text x="306" y="248" text-anchor="middle" font-size="9" fill="#aaa">id=5</text>

    <circle cx="378" cy="228" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="378" y="233" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="398" y="223" font-size="9" fill="#4a7a3a">id=6</text>

    <line x1="186" y1="166" x2="168" y2="214" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <line x1="214" y1="166" x2="226" y2="214" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <line x1="378" y1="168" x2="378" y2="214" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  </g>

  <!-- ===== Width bracket for L2 ===== -->
  <path d="M 160 270 L 160 278 L 378 278 L 378 270" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="269" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L2 宽度 = 6 − 3 + 1 = 4</text>
  <text x="269" y="310" text-anchor="middle" font-size="10" fill="#b85450">含一个 null 空位（id=5）</text>

  <!-- ===== Per-level width summary ===== -->
  <line x1="20" y1="328" x2="540" y2="328" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="348" font-size="11" fill="#444" font-weight="bold">逐层宽度（首编号 → 末编号）</text>

  <g font-size="11">
    <text x="30" y="372" fill="#b85450" font-weight="bold">L0</text>
    <text x="60" y="372" fill="#555">首 0 → 末 0 ⇒ 宽 1</text>

    <text x="220" y="372" fill="#446688" font-weight="bold">L1</text>
    <text x="250" y="372" fill="#555">首 1 → 末 2 ⇒ 宽 2</text>

    <text x="390" y="372" fill="#4a7a3a" font-weight="bold">L2</text>
    <text x="420" y="372" fill="#555">首 3 → 末 6 ⇒ 宽 4 ⭐</text>
  </g>

  <rect x="30" y="388" width="500" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#7a5a20">编号天然保留空位：null 不入队，但它的「位置编号」被兄弟节点撑住</text>
</svg>
