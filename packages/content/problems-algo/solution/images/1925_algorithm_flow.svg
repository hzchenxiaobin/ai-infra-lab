<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举 (a, b) → 开方判整</text>

  <!-- Step 1: 开始 -->
  <rect x="205" y="44" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="240" y="63" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 240 72 L 240 88" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: for a -->
  <rect x="165" y="88" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="107" text-anchor="middle" font-size="12" fill="#333">for a = 1 to n</text>

  <path d="M 240 116 L 240 132" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: for b -->
  <rect x="165" y="132" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="151" text-anchor="middle" font-size="12" fill="#333">for b = 1 to n</text>

  <path d="M 240 160 L 240 176" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: s = a²+b² -->
  <rect x="175" y="176" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="195" text-anchor="middle" font-size="12" fill="#333">s = a² + b²</text>

  <path d="M 240 204 L 240 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: c = isqrt(s) -->
  <rect x="175" y="220" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="239" text-anchor="middle" font-size="12" fill="#333">c = ⌊√s⌋ (整数开方)</text>

  <path d="M 240 248 L 240 266" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: c²==s 且 c≤n? -->
  <path d="M 240 266 L 340 302 L 240 338 L 140 302 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="298" text-anchor="middle" font-size="11.5" fill="#333">c² == s</text>
  <text x="240" y="314" text-anchor="middle" font-size="11.5" fill="#333">且 c ≤ n ?</text>

  <!-- Yes branch → right -->
  <path d="M 340 302 L 372 302" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="356" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="372" y="288" width="86" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="415" y="307" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <!-- No branch → down -->
  <path d="M 240 338 L 240 356" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="254" y="350" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Continue box -->
  <rect x="155" y="356" width="170" height="28" fill="#f5f5f5" stroke="#aaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="375" text-anchor="middle" font-size="11.5" fill="#666">继续下一组 (a, b)</text>

  <!-- Loop-back arrow (dashed) from continue box up to for-b -->
  <path d="M 155 370 Q 100 370 100 146 L 165 146" stroke="#aaa" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="76" y="260" font-size="10.5" fill="#888" transform="rotate(-90 76 260)">循环至遍历完毕</text>

  <path d="M 240 384 L 240 400" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="190" y="400" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="240" y="419" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>
</svg>
