<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1794f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两趟扫描 + 一次遍历 26 字符</text>

  <!-- ====== Step 1 ====== -->
  <rect x="50" y="48" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <circle cx="74" cy="76" r="14" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <text x="74" y="81" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="98" y="70" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">扫描 firstString → first[26]</text>
  <text x="98" y="88" font-size="11" fill="#555" filter="url(#rough2)">对每个字符 c，记录其<tspan fill="#446688" font-weight="bold">首次出现</tspan>位置 first[c]；已记录的不覆盖</text>

  <!-- Arrow 1→2 -->
  <path d="M 280 108 L 280 128" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr1794f)" filter="url(#rough2)"/>

  <!-- ====== Step 2 ====== -->
  <rect x="50" y="132" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <circle cx="74" cy="160" r="14" fill="#4a7a3a" stroke="none" filter="url(#rough2)"/>
  <text x="74" y="165" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="98" y="154" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">扫描 secondString → last[26]</text>
  <text x="98" y="172" font-size="11" fill="#555" filter="url(#rough2)">对每个字符 c，记录其<tspan fill="#4a7a3a" font-weight="bold">末次出现</tspan>位置 last[c]；每次出现都覆盖</text>

  <!-- Arrow 2→3 -->
  <path d="M 280 192 L 280 212" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr1794f)" filter="url(#rough2)"/>

  <!-- ====== Step 3 ====== -->
  <rect x="50" y="216" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <circle cx="74" cy="244" r="14" fill="#d6a040" stroke="none" filter="url(#rough2)"/>
  <text x="74" y="249" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="98" y="238" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">遍历 26 个字符，计算 diff</text>
  <text x="98" y="256" font-size="11" fill="#555" filter="url(#rough2)">对同时在两串出现的 c：<tspan fill="#d6a040" font-weight="bold">diff = first[c] − last[c]</tspan>，追踪最小值</text>

  <!-- Arrow 3→4 -->
  <path d="M 280 276 L 280 296" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr1794f)" filter="url(#rough2)"/>

  <!-- ====== Step 4 ====== -->
  <rect x="50" y="300" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <circle cx="74" cy="328" r="14" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <text x="74" y="333" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="98" y="322" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">统计达到最小 diff 的字符数 → 返回</text>
  <text x="98" y="340" font-size="11" fill="#555" filter="url(#rough2)">若无共同字符，最小值未更新，返回 <tspan fill="#b85450" font-weight="bold">0</tspan></text>
</svg>
