<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">殊途同归：长度为 3 的环 = 三角形 = 混乱分数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">n=5, corridors=[[1,2],[5,2],[4,1],[2,4],[3,1],[3,4]] → 两个 3 环</text>

  <!-- ===== Edges (drawn before nodes) ===== -->
  <!-- shared edge 1-4 (belongs to BOTH triangles) -> purple, thick -->
  <path d="M 162 212 L 358 212" stroke="#884488" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <!-- triangle {1,2,4} : edges 1-2 and 2-4 in blue -->
  <path d="M 148 196 L 232 110" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 268 110 L 372 196" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <!-- triangle {1,3,4} : edges 1-3 and 3-4 in red -->
  <path d="M 148 228 L 232 314" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 268 314 L 372 228" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <!-- 2-5 : gray, not in any triangle -->
  <path d="M 272 96 L 448 96" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- ===== Nodes ===== -->
  <!-- 1 (shared by both triangles) -->
  <circle cx="140" cy="212" r="24" fill="#f3e8fb" stroke="#884488" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="217" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- 4 (shared by both triangles) -->
  <circle cx="380" cy="212" r="24" fill="#f3e8fb" stroke="#884488" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="217" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <!-- 2 (only blue triangle) -->
  <circle cx="250" cy="92" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <!-- 3 (only red triangle) -->
  <circle cx="250" cy="332" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="337" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <!-- 5 (no triangle) -->
  <circle cx="470" cy="92" r="20" fill="#f2f2f2" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="97" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">5</text>

  <!-- triangle labels -->
  <text x="250" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">蓝环 1→2→4→1</text>
  <text x="250" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">红环 1→3→4→1</text>
  <text x="500" y="92" font-size="10" fill="#999">不在环里</text>

  <!-- shared-edge callout -->
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#884488">边 1-4 被两个环共享</text>

  <!-- Bottom note box -->
  <rect x="36" y="352" width="488" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#444">3 环 = 三点两两相连 = 从 a 到 c 既有直连 a-c 又可绕行 a-b-c（殊途同归）</text>
  <text x="280" y="387" text-anchor="middle" font-size="11" fill="#666">每发现一个三角形 = 一个不同的 3 环 = 混乱分数 +1</text>
</svg>
