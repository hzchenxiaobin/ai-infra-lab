<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：前缀和 + 单调栈（递增）+ 哨兵，一次遍历</text>

  <!-- Step 1: prefix sum -->
  <rect x="30" y="44" width="520" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="64" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 预处理前缀和</text>
  <text x="50" y="82" font-size="10.5" fill="#555" filter="url(#rough2)">prefix[0]=0, prefix[k]=nums[0]+…+nums[k−1]</text>
  <text x="50" y="96" font-size="10.5" fill="#888" filter="url(#rough2)">子数组 [l,r] 的和 = prefix[r+1] − prefix[l]，O(1) 查询</text>

  <!-- Step 2: append sentinel -->
  <rect x="30" y="110" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="128" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 末尾追加哨兵 nums.append(0)</text>
  <text x="50" y="142" font-size="10.5" fill="#888" filter="url(#rough2)">0 比所有正数都小，强制遍历结束时清空栈，避免遗漏</text>

  <path d="M 290 150 L 290 164" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Start loop -->
  <ellipse cx="290" cy="182" rx="90" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历 i = 0 … n（含哨兵）</text>

  <path d="M 290 200 L 290 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="290,218 420,258 290,298 160,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">栈非空 且</text>
  <text x="290" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[栈顶] &gt; nums[i] ?</text>
  <text x="290" y="284" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(遇到更小，触发结算)</text>

  <!-- No: push -->
  <path d="M 160 258 L 80 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="250" text-anchor="middle" font-size="10" fill="#82b366" filter="url(#rough2)">否(更大或等)</text>
  <rect x="10" y="240" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="45" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">push(i)</text>
  <text x="45" y="270" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">入栈</text>
  <path d="M 45 276 L 45 292 L 290 292 L 290 298" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes: pop and compute -->
  <path d="M 290 298 L 290 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="308" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="140" y="316" width="300" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① top = stack.pop()  （以 nums[top] 为最小值）</text>

  <path d="M 290 346 L 290 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute sum -->
  <polygon points="290,364 410,400 290,436 170,400" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">栈空 ?</text>
  <text x="290" y="408" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(top 左边无更小)</text>

  <!-- yes empty: sum = prefix[i] -->
  <path d="M 410 400 L 470 400" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="392" text-anchor="middle" font-size="10" fill="#82b366" filter="url(#rough2)">是</text>
  <rect x="470" y="382" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="520" y="400" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sum=prefix[i]</text>
  <text x="520" y="412" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(左边界=0)</text>

  <!-- no: sum = prefix[i] - prefix[栈顶+1] -->
  <path d="M 290 436 L 290 446" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="442" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- update max product -->
  <rect x="110" y="450" width="360" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="466" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">product = nums[top] × sum；更新 maxProduct</text>

  <!-- loop back -->
  <path d="M 110 462 L 40 462 L 40 258 L 80 258" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="28" y="360" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 28 360)" filter="url(#rough2)">继续弹出直到栈顶更小</text>
</svg>
