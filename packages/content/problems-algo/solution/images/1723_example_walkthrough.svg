<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：limit=11 的 DFS 分配过程</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">jobs 降序=[8,7,4,2,1], k=2 工人, 每人上限 11</text>

  <!-- Worker state headers -->
  <text x="140" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">W1</text>
  <text x="420" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">W2</text>

  <!-- Step 1: assign 8 to W1 -->
  <text x="30" y="92" font-size="10" fill="#666" font-weight="bold">① 8</text>
  <rect x="90" y="80" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="99" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8</text>
  <rect x="370" y="80" width="100" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="420" y="99" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="240" y="95" font-size="9" fill="#888">8→W1</text>

  <!-- Step 2: assign 7 to W2 -->
  <text x="30" y="132" font-size="10" fill="#666" font-weight="bold">② 7</text>
  <rect x="90" y="120" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="139" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8</text>
  <rect x="370" y="120" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="240" y="135" font-size="9" fill="#888">7→W2 (W1: 8+7=15&gt;11 ✗)</text>

  <!-- Step 3: assign 4 to W2 -->
  <text x="30" y="172" font-size="10" fill="#666" font-weight="bold">③ 4</text>
  <rect x="90" y="160" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="179" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8</text>
  <rect x="370" y="160" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7+4=11</text>
  <text x="240" y="175" font-size="9" fill="#888">4→W2 (W1: 12&gt;11 ✗, W2: 11✓)</text>

  <!-- Step 4: assign 2 to W1 -->
  <text x="30" y="212" font-size="10" fill="#666" font-weight="bold">④ 2</text>
  <rect x="90" y="200" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="219" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8+2=10</text>
  <rect x="370" y="200" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">11</text>
  <text x="240" y="215" font-size="9" fill="#888">2→W1 (W2: 13&gt;11 ✗)</text>

  <!-- Step 5: assign 1 to W1 -->
  <text x="30" y="252" font-size="10" fill="#666" font-weight="bold">⑤ 1</text>
  <rect x="90" y="240" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="259" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">10+1=11</text>
  <rect x="370" y="240" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="259" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">11</text>
  <text x="240" y="255" font-size="9" fill="#888">1→W1 (10+1=11✓)</text>

  <!-- Success box -->
  <path d="M 280 278 L 280 300" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="305" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 全部分配！max(W1,W2)=11 ≤ 11</text>

  <!-- limit=10 fails -->
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">对照：limit=10 时</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#666">8→W1, 7→W2, 4→? W1: 12&gt;10 ✗ W2: 11&gt;10 ✗ → 回溯</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#666">8→W2, 7→W1, 4→? 同样无处可放 → 彻底失败</text>

  <rect x="120" y="412" width="320" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ limit=10 不可行 → 答案 = 11</text>

  <!-- Summary -->
  <text x="280" y="462" text-anchor="middle" font-size="10" fill="#888">最终方案: W1={8,2,1}=11, W2={7,4}=11</text>
</svg>
