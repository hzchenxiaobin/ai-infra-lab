<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：有序集合定位首末峰，BIT 求区间和 W</text>

  <!-- 主干 -->
  <rect x="140" y="28" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">①② 初始化：扫描建峰集合 S + BIT(value)</text>

  <path d="M 260 58 L 260 70" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="72" width="180" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">③ 取下一条查询</text>

  <path d="M 260 98 L 260 108" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,110 330,136 260,162 190,136" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">类型 1 / 2 ?</text>

  <!-- 左分支：类型 2 更新 -->
  <text x="163" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">类型 2（更新）</text>
  <path d="M 190 136 H 136 V 160" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="162" width="184" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="136" y="179" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">nums[index] = val</text>

  <path d="M 136 188 L 136 198" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="200" width="184" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="136" y="214" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">重判 index−1、index、index+1</text>
  <text x="136" y="228" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">三处峰性（翻转才动手）</text>

  <path d="M 136 236 L 136 244" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="246" width="184" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="136" y="262" text-anchor="middle" font-size="9.5" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">④ 增/删峰 k：同步改</text>
  <text x="136" y="276" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">后继 value + 自身 value</text>
  <text x="136" y="290" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">⚠️ 两处都要改（prev 变了），S 增删 k</text>

  <!-- 右分支：类型 1 查询 -->
  <text x="354" y="126" text-anchor="middle" font-size="9" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">类型 1（统计）</text>
  <path d="M 330 136 H 378 V 160" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="286" y="162" width="184" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="378" y="176" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">⑤ 找 (l,r) 内首峰 a、末峰 b</text>
  <text x="378" y="190" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">（无峰 → answer = 0）</text>

  <path d="M 378 198 L 378 208" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="286" y="210" width="184" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="378" y="224" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">⑥ q = prev(a)（无则 0）</text>
  <text x="378" y="238" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">W = BIT 区间和 [a, b]</text>

  <path d="M 378 246 L 378 254" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="286" y="256" width="184" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="378" y="275" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⑦ answer = r(b−l) − W + a(l−q)</text>

  <!-- 回环 -->
  <path d="M 136 296 V 336 H 14 V 85 H 166" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="75" y="352" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">回到 ③</text>

  <path d="M 378 286 V 336 H 506 V 85 H 354" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="442" y="352" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">回到 ③</text>

  <!-- 底部备注 -->
  <text x="260" y="358" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">峰只出现在 k ∈ [1, n−2]；BIT 把 value[p] = p·(p−prev) 存在下标 p+1；全程 long long</text>
  <text x="260" y="372" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">查询处理完 → 返回 answer；时间 O((n+q) log n)、空间 O(n)</text>
</svg>
