<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察二：四状态数位 DP —— 逐位填数 + 累计和</text>

  <!-- Four state badges row -->
  <text x="40" y="54" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">状态：</text>

  <rect x="80" y="40" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#446688">pos</tspan> 第几位</text>

  <rect x="180" y="40" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#d6a040">tight</tspan> 贴上界?</text>

  <rect x="290" y="40" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#4a7a3a">started</tspan> 填过非零?</text>

  <rect x="400" y="40" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#b85450">sum</tspan> 数位和≤max</text>

  <!-- Root node -->
  <rect x="230" y="100" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pos=0, tight=T</text>
  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">started=F, sum=0</text>

  <!-- Branch: d=0 leading zero (left) -->
  <line x1="250" y1="134" x2="120" y2="200" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="170" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d=0 前导零</text>

  <rect x="50" y="200" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">started=F, sum 不变</text>
  <text x="125" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">tight 降为 F（位数变短）</text>

  <!-- Branch: normal digit d>0 (right) -->
  <line x1="310" y1="134" x2="440" y2="200" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="370" y="170" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d>0 正常位</text>

  <rect x="365" y="200" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">started=T, sum += d</text>
  <text x="440" y="232" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">tight 传递 d==up?</text>

  <!-- Prune box (sum > max_sum) -->
  <line x1="515" y1="216" x2="490" y2="270" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="478" y="262" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">sum&gt;max?</text>

  <rect x="370" y="262" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="445" y="281" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 剪枝 continue</text>

  <!-- Base case -->
  <line x1="125" y1="240" x2="200" y2="290" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="440" y1="240" x2="365" y2="290" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="150" y="288" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">终止：pos==L  →  started 且 sum≥min_sum ? 1 : 0</text>

  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">started 统一管前导零（无需拆「短位数」段）；sum 超 max_sum 即剪枝；末位判下界 min_sum</text>
</svg>
