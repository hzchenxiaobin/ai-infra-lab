<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：标记 → 扫描插标签</text>

  <!-- Example 1 header -->
  <text x="20" y="52" font-size="12" fill="#446688" font-weight="bold">示例 1：s = "aaabbcc"，dict = ["aaa","aab","bc"]</text>

  <!-- s cells: 7 chars width 40 -->
  <text x="40" y="86" font-size="11" fill="#888">s：</text>
  <rect x="100" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="140" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="180" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="220" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="240" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="260" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="300" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="340" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="360" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>

  <!-- index labels -->
  <text x="120" y="110" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="160" y="110" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="200" y="110" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="240" y="110" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="280" y="110" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="320" y="110" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="360" y="110" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <!-- bold array -->
  <text x="40" y="140" font-size="11" fill="#888">bold：</text>
  <rect x="100" y="122" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="120" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="140" y="122" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="160" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="180" y="122" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="200" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="220" y="122" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="240" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="260" y="122" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="300" y="122" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="320" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="340" y="122" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="141" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">F</text>

  <!-- transition table headers -->
  <text x="20" y="174" font-size="10.5" fill="#888" font-weight="bold">i</text>
  <text x="80" y="174" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">s[i]</text>
  <text x="170" y="174" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">bold[i]</text>
  <text x="260" y="174" font-size="10.5" fill="#888" font-weight="bold">状态变化</text>
  <text x="470" y="174" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">动作</text>
  <line x1="10" y1="180" x2="590" y2="180" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=0 -->
  <text x="20" y="196" font-size="10.5" fill="#333">0</text>
  <text x="80" y="196" text-anchor="middle" font-size="10.5" fill="#333">a</text>
  <text x="170" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="260" y="196" font-size="10.5" fill="#b85450" font-weight="bold">F → T</text>
  <text x="470" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">+&lt;b&gt;, +'a'</text>

  <!-- i=1 -->
  <text x="20" y="214" font-size="10.5" fill="#333">1</text>
  <text x="80" y="214" text-anchor="middle" font-size="10.5" fill="#333">a</text>
  <text x="170" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="260" y="214" font-size="10.5" fill="#888">T → T</text>
  <text x="470" y="214" text-anchor="middle" font-size="10.5" fill="#446688">+'a'</text>

  <!-- i=2 -->
  <text x="20" y="232" font-size="10.5" fill="#333">2</text>
  <text x="80" y="232" text-anchor="middle" font-size="10.5" fill="#333">a</text>
  <text x="170" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="260" y="232" font-size="10.5" fill="#888">T → T</text>
  <text x="470" y="232" text-anchor="middle" font-size="10.5" fill="#446688">+'a'</text>

  <!-- i=3 -->
  <text x="20" y="250" font-size="10.5" fill="#333">3</text>
  <text x="80" y="250" text-anchor="middle" font-size="10.5" fill="#333">b</text>
  <text x="170" y="250" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="260" y="250" font-size="10.5" fill="#888">T → T</text>
  <text x="470" y="250" text-anchor="middle" font-size="10.5" fill="#446688">+'b'</text>

  <!-- i=4 -->
  <text x="20" y="268" font-size="10.5" fill="#333">4</text>
  <text x="80" y="268" text-anchor="middle" font-size="10.5" fill="#333">b</text>
  <text x="170" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="260" y="268" font-size="10.5" fill="#888">T → T</text>
  <text x="470" y="268" text-anchor="middle" font-size="10.5" fill="#446688">+'b'</text>

  <!-- i=5 -->
  <text x="20" y="286" font-size="10.5" fill="#333">5</text>
  <text x="80" y="286" text-anchor="middle" font-size="10.5" fill="#333">c</text>
  <text x="170" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="260" y="286" font-size="10.5" fill="#d6a040" font-weight="bold">T → F</text>
  <text x="470" y="286" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">+'c', +&lt;/b&gt;</text>

  <!-- i=6 -->
  <text x="20" y="304" font-size="10.5" fill="#333">6</text>
  <text x="80" y="304" text-anchor="middle" font-size="10.5" fill="#333">c</text>
  <text x="170" y="304" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">F</text>
  <text x="260" y="304" font-size="10.5" fill="#888">F → F</text>
  <text x="470" y="304" text-anchor="middle" font-size="10.5" fill="#446688">+'c'</text>

  <line x1="10" y1="314" x2="590" y2="314" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result 1 -->
  <rect x="40" y="324" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="344" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">输出：&lt;b&gt;aaabbc&lt;/b&gt;c  ✓</text>

  <!-- Example 2 -->
  <text x="20" y="384" font-size="12" fill="#446688" font-weight="bold">示例 2：s = "abcxyz123"，dict = ["abc","123"]</text>

  <!-- Example 2 cells: 9 chars width 32, T=green F=blue -->
  <text x="40" y="414" font-size="11" fill="#888">s：</text>
  <rect x="100" y="396" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="116" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="132" y="396" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="148" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="164" y="396" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="180" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <rect x="196" y="396" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="212" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x</text>
  <rect x="228" y="396" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="244" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">y</text>
  <rect x="260" y="396" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="276" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">z</text>
  <rect x="292" y="396" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="308" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="324" y="396" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="340" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="356" y="396" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="372" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- result 2 -->
  <rect x="40" y="436" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="456" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">输出：&lt;b&gt;abc&lt;/b&gt;xyz&lt;b&gt;123&lt;/b&gt;  ✓（两段不连续 → 两对标签）</text>
</svg>
