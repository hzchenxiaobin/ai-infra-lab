<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心：cnt = 末尾连续等于 value 的个数（value=4, k=3）</text>

  <!-- bracket + label over the hit cell (cell 3) -->
  <path d="M 289 60 L 289 50 L 367 50 L 367 60" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="328" y="44" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">cnt≥k ⇒ 命中</text>

  <!-- 4 stream cells: [4,4,4,3]; matches green, mismatch red -->
  <!-- cell1 -->
  <rect x="109" y="64" width="78" height="52" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="97" text-anchor="middle" font-size="18" fill="#2c4a22" filter="url(#rough2)">4</text>
  <!-- cell2 -->
  <rect x="199" y="64" width="78" height="52" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="97" text-anchor="middle" font-size="18" fill="#2c4a22" filter="url(#rough2)">4</text>
  <!-- cell3 (the hit) -->
  <rect x="289" y="64" width="78" height="52" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="97" text-anchor="middle" font-size="18" fill="#2c4a22" filter="url(#rough2)">4</text>
  <!-- cell4 (mismatch) -->
  <rect x="379" y="64" width="78" height="52" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="97" text-anchor="middle" font-size="18" fill="#7a2230" filter="url(#rough2)">3</text>

  <!-- highlight hit cell 3 -->
  <rect x="287" y="62" width="82" height="56" rx="7" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- step labels under cells -->
  <text x="148" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">命中</text>
  <text x="238" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">命中</text>
  <text x="328" y="132" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">命中</text>
  <text x="418" y="132" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">失配</text>

  <!-- cnt value row -->
  <text x="86" y="170" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">cnt</text>
  <text x="148" y="170" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="238" y="170" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="328" y="170" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="418" y="170" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- +1 arrows above between matches -->
  <text x="194" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="284" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <!-- reset curved arrow: cnt 3 -> 0 between cell3 and cell4 -->
  <path d="M 336 176 C 370 196, 408 196, 414 178" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="378" y="196" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">失配→归零</text>

  <!-- callout -->
  <rect x="40" y="214" width="480" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">num == value ⇒ cnt++；num != value ⇒ cnt = 0；</text>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">cnt >= k 即返回 true（末尾连续命中长度 ≥ k）</text>

  <!-- note -->
  <rect x="40" y="270" width="480" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="295" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">cnt 把「末尾连续命中长度」压缩成一个标量——无需回看历史，单次 O(1)</text>

  <!-- legend -->
  <rect x="60" y="322" width="22" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="333" font-size="11" fill="#555" filter="url(#rough2)">绿=命中(==value)</text>
  <rect x="230" y="322" width="22" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="262" y="333" font-size="11" fill="#555" filter="url(#rough2)">红=失配</text>
  <text x="350" y="333" font-size="11" fill="#b85450" filter="url(#rough2)">红框=命中块(cnt≥k)</text>
</svg>
