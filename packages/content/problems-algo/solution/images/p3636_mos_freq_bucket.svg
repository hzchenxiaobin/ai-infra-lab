<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：窗口滑动 ⇒ 值在「频率桶」间上下迁移</text>

  <!-- Array cells -->
  <rect x="40" y="48" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="71" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="96" y="48" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="71" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="152" y="48" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="71" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="208" y="48" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="71" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="264" y="48" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="71" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="320" y="48" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="71" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="376" y="48" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="71" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- index labels -->
  <text x="68" y="98" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="124" y="98" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="180" y="98" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="236" y="98" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="292" y="98" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="348" y="98" text-anchor="middle" font-size="9" fill="#999">5</text>
  <text x="404" y="98" text-anchor="middle" font-size="9" fill="#999">6</text>

  <!-- window highlight over cells 1..5 -->
  <rect x="90" y="42" width="292" height="48" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="112" y="118" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L</text>
  <path d="M 118 112 L 118 102" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="356" y="118" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">R</text>
  <path d="M 352 112 L 352 102" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="264" y="136" text-anchor="middle" font-size="11" fill="#666">当前窗口 [1, 5] = 子数组 [2, 3, 2, 3, 2]</text>

  <!-- cnt panel -->
  <rect x="36" y="152" width="160" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="116" y="174" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">窗口内计数 cnt</text>
  <text x="116" y="198" text-anchor="middle" font-size="12" fill="#333">cnt[2] = 3</text>
  <text x="116" y="220" text-anchor="middle" font-size="12" fill="#333">cnt[3] = 2</text>
  <text x="116" y="244" text-anchor="middle" font-size="9.5" fill="#8899aa">每挪一格只改一个值</text>

  <!-- dashed link cnt[2]=3 -> bucket[3] -->
  <path d="M 198 200 C 260 186 320 176 404 172" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="166" text-anchor="middle" font-size="9.5" fill="#8899aa">cnt[2]=3 ⇒ 2 在第 3 层</text>

  <!-- frequency bucket ladder -->
  <text x="430" y="140" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">maxfreq = 3（最高非空层）</text>
  <rect x="270" y="150" width="190" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="286" y="175" text-anchor="start" font-size="12" fill="#a87020" font-weight="bold">bucket[3]</text>
  <rect x="414" y="156" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="427" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <rect x="270" y="200" width="190" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="286" y="225" text-anchor="start" font-size="12" fill="#a87020" font-weight="bold">bucket[2]</text>
  <rect x="414" y="206" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <rect x="270" y="250" width="190" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="286" y="275" text-anchor="start" font-size="12" fill="#a87020" font-weight="bold">bucket[1]</text>
  <text x="427" y="276" text-anchor="middle" font-size="12" fill="#bbb">∅</text>

  <!-- up / down arrows -->
  <path d="M 252 286 L 252 160" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="221" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 240 221)">加入元素 ⇒ 上移一层</text>
  <path d="M 470 160 L 470 286" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="484" y="221" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" transform="rotate(90 484 221)">移出元素 ⇒ 下移一层</text>

  <!-- answer box -->
  <rect x="36" y="312" width="488" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">查询 [1, 5, threshold] 的回答：</text>
  <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#3a5a2a">maxfreq = 3 ≥ threshold ⇒ 答案 = bucket[3] 中最小值 = 2</text>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#3a5a2a">maxfreq = 3 &lt; threshold ⇒ 答案 = −1</text>

  <!-- footer note -->
  <rect x="36" y="404" width="488" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="427" text-anchor="middle" font-size="11" fill="#666">离散化按值排序 ⇒ 最小 id 即最小值，桶内取最小 id 就是「并列取最小」</text>
  <text x="280" y="448" text-anchor="middle" font-size="11" fill="#666">桶用位图实现：C++ bitset（_Find_first），Python 大整数（b &amp; −b 取 lowbit）</text>
</svg>
