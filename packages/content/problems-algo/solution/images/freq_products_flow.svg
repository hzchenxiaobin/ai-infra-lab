<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：聚合 → RANK → 过滤 → JOIN 取名</text>

  <!-- ===== Step 1: FROM Orders ===== -->
  <rect x="24" y="56" width="120" height="56" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="84" y="76" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① FROM Orders</text>
  <text x="84" y="92" text-anchor="middle" font-size="9" fill="#666">读取全部订单行</text>
  <text x="84" y="106" text-anchor="middle" font-size="8" fill="#888">cid, pid, oid, date</text>

  <path d="M 148 84 L 180 84" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: GROUP BY + COUNT ===== -->
  <rect x="184" y="48" width="140" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="254" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">② GROUP BY</text>
  <text x="254" y="82" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">customer_id, product_id</text>
  <text x="254" y="98" text-anchor="middle" font-size="9" fill="#446688">COUNT(*) AS cnt</text>
  <text x="254" y="112" text-anchor="middle" font-size="8" fill="#888">每个(cust,prod)对一行</text>

  <path d="M 328 84 L 360 84" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: RANK ===== -->
  <rect x="364" y="48" width="160" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="444" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">③ RANK() OVER (</text>
  <text x="444" y="82" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">PARTITION BY customer_id</text>
  <text x="444" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ORDER BY cnt DESC) AS rk</text>
  <text x="444" y="112" text-anchor="middle" font-size="8" fill="#888">每顾客内按频次降序打号</text>

  <!-- down arrow from step 3 -->
  <path d="M 444 124 L 444 156" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: WHERE rk = 1 (CTE wrap) ===== -->
  <rect x="324" y="160" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="444" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">④ CTE 包裹 rk → 外层 WHERE rk = 1</text>
  <text x="444" y="196" text-anchor="middle" font-size="9" fill="#666">并列同号全保留（禁 ROW_NUMBER）</text>
  <text x="444" y="208" text-anchor="middle" font-size="8" fill="#888">窗口函数晚于 WHERE，故需 CTE/子查询</text>

  <!-- left arrow from step 4 -->
  <path d="M 324 186 L 292 186" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: JOIN Products ===== -->
  <rect x="148" y="160" width="140" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="218" y="180" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">⑤ JOIN Products</text>
  <text x="218" y="196" text-anchor="middle" font-size="9" fill="#666">ON product_id 匹配</text>
  <text x="218" y="208" text-anchor="middle" font-size="8" fill="#888">取 product_name 列</text>

  <!-- down arrow from step 5 -->
  <path d="M 218 216 L 218 248" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output ===== -->
  <rect x="84" y="252" width="268" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="218" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">SELECT customer_id, product_id, product_name</text>
  <text x="218" y="284" text-anchor="middle" font-size="9" fill="#888">无订单顾客由 GROUP BY 天然排除</text>

  <!-- ===== SQL clause order note ===== -->
  <rect x="24" y="312" width="552" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">SQL 执行顺序：FROM → WHERE → GROUP BY → HAVING → SELECT(窗口函数) → ORDER BY</text>
  <text x="300" y="348" text-anchor="middle" font-size="10" fill="#666">RANK 在 SELECT 阶段算（晚于 WHERE），故 rk 必须放进 CTE，外层再 WHERE rk = 1</text>
</svg>
