<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：排序 + 双指针贪心配对</text>

  <!-- 开始 -->
  <ellipse cx="270" cy="62" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="13" fill="#333">开始</text>

  <path d="M270,80 L270,100" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 升序排序 -->
  <rect x="180" y="102" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="13" fill="#333">对 nums 升序排序</text>

  <path d="M270,140 L270,160" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="170" y="162" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="13" fill="#333">i = 0（=已配对数），j = 0</text>

  <path d="M270,200 L270,220" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 取下一个 j -->
  <rect x="160" y="222" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="13" fill="#333">j = 0 … n−1 逐个考察 nums[j]</text>

  <path d="M270,260 L270,280" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="270,282 382,332 270,382 158,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="328" text-anchor="middle" font-size="13" fill="#333">nums[j] &gt; nums[i] ?</text>
  <text x="270" y="346" text-anchor="middle" font-size="11" fill="#999">(已排升序，否即相等)</text>

  <!-- Yes 分支：左 -->
  <path d="M158,332 L90,332 L90,242" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="92" y="258" width="50" height="22" fill="#fafafa" stroke="none"/>
  <text x="100" y="274" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Yes</text>
  <rect x="56" y="296" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="116" y="313" text-anchor="middle" font-size="12" fill="#4a7a3a">匹配成功</text>
  <text x="116" y="329" text-anchor="middle" font-size="12" fill="#4a7a3a">i++（回取下一）</text>

  <!-- No 分支：右 -->
  <path d="M382,332 L452,332" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="398" y="326" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">No</text>

  <rect x="392" y="318" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="442" y="340" text-anchor="middle" font-size="12" fill="#b85450">跳过 j++</text>

  <path d="M442,352 L442,410 L270,410" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 返回 -->
  <ellipse cx="270" cy="430" rx="62" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="434" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">返回 i</text>

  <text x="270" y="462" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i 即「被满足的位置数」= 最大伟大值</text>
</svg>
