<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">执行流程：两路去重计数 → 相除 → IFNULL → ROUND</text>

  <!-- Stage 1: Two parallel DISTINCT subqueries -->
  <rect x="40" y="56" width="250" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="76" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① 子查询 A：去重已通过申请</text>
  <text x="165" y="96" text-anchor="middle" font-size="9" fill="#333">SELECT DISTINCT requester_id, accepter_id</text>
  <text x="165" y="110" text-anchor="middle" font-size="9" fill="#333">FROM RequestAccepted</text>
  <text x="165" y="128" text-anchor="middle" font-size="9" fill="#d6a040">→ 得去重后的申请对集合</text>

  <rect x="350" y="56" width="250" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475" y="76" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">① 子查询 B：去重已发送申请</text>
  <text x="475" y="96" text-anchor="middle" font-size="9" fill="#333">SELECT DISTINCT sender_id, send_to_id</text>
  <text x="475" y="110" text-anchor="middle" font-size="9" fill="#333">FROM FriendRequest</text>
  <text x="475" y="128" text-anchor="middle" font-size="9" fill="#d6a040">→ 得去重后的申请对集合</text>

  <!-- Arrows down -->
  <path d="M165 140 L165 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M475 140 L475 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Stage 2: COUNT(*) on each -->
  <rect x="65" y="172" width="200" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="190" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">② COUNT(*) 套外层</text>
  <text x="165" y="206" text-anchor="middle" font-size="9" fill="#333">SELECT COUNT(*) FROM (A)</text>
  <text x="165" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ 4</text>

  <rect x="375" y="172" width="200" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="190" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">② COUNT(*) 套外层</text>
  <text x="475" y="206" text-anchor="middle" font-size="9" fill="#333">SELECT COUNT(*) FROM (B)</text>
  <text x="475" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ 5</text>

  <!-- Arrows converging to division -->
  <path d="M165 224 L290 260" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M475 224 L350 260" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Stage 3: Division -->
  <rect x="250" y="264" width="140" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="284" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">③ 相除</text>
  <text x="320" y="300" text-anchor="middle" font-size="9" fill="#333">accepted / sent</text>
  <text x="320" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4 / 5 = 0.8</text>

  <path d="M320 322 L320 348" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Stage 4: IFNULL -->
  <rect x="210" y="352" width="220" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="370" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">④ IFNULL(..., 0)</text>
  <text x="320" y="386" text-anchor="middle" font-size="9" fill="#333">sent=0 时除法得 NULL</text>
  <text x="320" y="398" text-anchor="middle" font-size="9" fill="#b85450">→ 兜底为 0，题目要求「无申请时 0.00」</text>

  <path d="M320 404 L320 428" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Stage 5: ROUND + output -->
  <rect x="210" y="432" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="450" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⑤ ROUND(..., 2) AS accept_rate</text>
  <text x="320" y="466" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 0.80</text>
</svg>
