<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察①：约简链的长度只由「置位数」决定</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">一次操作：x ← popcount(x)，即 x 的二进制里 1 的个数</text>

  <!-- 链 A：6 → 2 → 1 -->
  <text x="36" y="66" font-size="10.5" fill="#666" filter="url(#rough2)">例：x = 6</text>
  <g filter="url(#rough2)">
    <rect x="36" y="74" width="96" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <text x="84" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#33506b">6</text>
    <text x="84" y="110" text-anchor="middle" font-size="10" fill="#6a86a3">110（2 个 1）</text>
  </g>
  <path d="M 138 96 L 186 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="162" y="86" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">→ 2</text>
  <g filter="url(#rough2)">
    <rect x="192" y="74" width="96" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <text x="240" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#33506b">2</text>
    <text x="240" y="110" text-anchor="middle" font-size="10" fill="#6a86a3">10（1 个 1）</text>
  </g>
  <path d="M 294 96 L 342 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="318" y="86" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">→ 1</text>
  <g filter="url(#rough2)">
    <rect x="348" y="74" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6"/>
    <text x="396" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d24">1</text>
    <text x="396" y="110" text-anchor="middle" font-size="10" fill="#5c7f52">终点，2 步 ✓</text>
  </g>

  <!-- 链 B：7 → 3 → 2 → 1 -->
  <text x="36" y="142" font-size="10.5" fill="#666" filter="url(#rough2)">例：x = 7</text>
  <g filter="url(#rough2)">
    <rect x="36" y="150" width="76" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="74" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3b37">7 = 111</text>
  </g>
  <path d="M 118 168 L 152 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="135" y="160" text-anchor="middle" font-size="9.5" fill="#8f3b37" filter="url(#rough2)">→ 3</text>
  <g filter="url(#rough2)">
    <rect x="158" y="150" width="76" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="196" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3b37">3 = 11</text>
  </g>
  <path d="M 240 168 L 274 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="257" y="160" text-anchor="middle" font-size="9.5" fill="#8f3b37" filter="url(#rough2)">→ 2</text>
  <g filter="url(#rough2)">
    <rect x="280" y="150" width="76" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="318" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3b37">2 = 10</text>
  </g>
  <path d="M 362 168 L 396 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="379" y="160" text-anchor="middle" font-size="9.5" fill="#8f3b37" filter="url(#rough2)">→ 1</text>
  <g filter="url(#rough2)">
    <rect x="402" y="150" width="76" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6"/>
    <text x="440" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24">1 ✓ 3 步</text>
  </g>
  <text x="478" y="173" font-size="10" fill="#8f3b37" font-weight="bold" filter="url(#rough2)">k=2 时 6 ✓ / 7 ✗</text>

  <!-- f 表定义 -->
  <rect x="20" y="204" width="480" height="64" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">预处理小表 f：f(1) = 0；　f(c) = 1 + f( popcount(c) )，c ≤ 800</text>
  <text x="260" y="246" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">f(1)=0　f(2)=1　f(3)=2　f(4)=1　f(5)=2　f(6)=2　f(7)=3　…</text>
  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">自变量最大 800，递推时 popcount(c) &lt; c，一遍扫过即可</text>

  <!-- 判定折叠框 -->
  <rect x="20" y="280" width="480" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12.5" fill="#8f3b37" font-weight="bold" filter="url(#rough2)">x（≥2）是 k-可约简 ⟺ 1 + f( popcount(x) ) ≤ k</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">合法性只压在 popcount(x) = c 这一个数上 —— 问题折叠成「数 popcount=c 的 x」</text>
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">x = 1 本身 0 步即 1，而 k ≥ 1，按上式（1+0≤k）也恒成立，无需特判</text>
</svg>
