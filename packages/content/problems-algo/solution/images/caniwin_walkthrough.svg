<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#666" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：必输局面 vs 必赢局面</text>

  <!-- divider -->
  <line x1="320" y1="44" x2="320" y2="455" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- LEFT: losing case M=10 T=11 -->
  <rect x="24" y="46" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="164" y="64" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">必输：M=10, T=11</text>
  <text x="164" y="79" text-anchor="middle" font-size="10.5" fill="#666">我选 i，对手就选 11−i 凑满</text>

  <!-- rows -->
  <rect x="30" y="98" width="268" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="44" y="116" font-size="11" fill="#333" font-weight="bold">我选</text>
  <text x="120" y="116" font-size="11" fill="#333" font-weight="bold">对手选</text>
  <text x="220" y="116" font-size="11" fill="#333" font-weight="bold">累计</text>
  <text x="282" y="116" font-size="11" fill="#b85450" font-weight="bold">结果</text>

  <rect x="30" y="128" width="268" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="44" y="145" font-size="11" fill="#333">1</text>
  <text x="120" y="145" font-size="11" fill="#333">10</text>
  <text x="220" y="145" font-size="11" fill="#333">11</text>
  <text x="282" y="145" font-size="11" fill="#b85450">输</text>

  <rect x="30" y="154" width="268" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="44" y="171" font-size="11" fill="#333">2</text>
  <text x="120" y="171" font-size="11" fill="#333">9</text>
  <text x="220" y="171" font-size="11" fill="#333">11</text>
  <text x="282" y="171" font-size="11" fill="#b85450">输</text>

  <rect x="30" y="180" width="268" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="44" y="197" font-size="11" fill="#333">…</text>
  <text x="120" y="197" font-size="11" fill="#333">…</text>
  <text x="220" y="197" font-size="11" fill="#333">11</text>
  <text x="282" y="197" font-size="11" fill="#b85450">输</text>

  <rect x="30" y="206" width="268" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="44" y="223" font-size="11" fill="#333">10</text>
  <text x="120" y="223" font-size="11" fill="#333">1</text>
  <text x="220" y="223" font-size="11" fill="#333">11</text>
  <text x="282" y="223" font-size="11" fill="#b85450">输</text>

  <!-- key insight -->
  <rect x="30" y="240" width="268" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="164" y="258" text-anchor="middle" font-size="10.8" fill="#555">11 为奇数 ⇒ i 与 11−i 恒不同</text>
  <text x="164" y="273" text-anchor="middle" font-size="10.8" fill="#555">每轮对手都能立即凑满 11</text>

  <!-- verdict left -->
  <rect x="60" y="292" width="208" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="164" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">dfs(0,0) = false</text>

  <!-- RIGHT: winning case M=4 T=6 -->
  <rect x="336" y="46" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="476" y="64" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">必赢：M=4, T=6</text>
  <text x="476" y="79" text-anchor="middle" font-size="10.5" fill="#666">我先选 1，对手怎么接都输</text>

  <!-- branch rows: opponent picks j, I respond -->
  <rect x="342" y="98" width="270" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="356" y="116" font-size="11" fill="#333" font-weight="bold">对手选</text>
  <text x="430" y="116" font-size="11" fill="#333" font-weight="bold">我回应</text>
  <text x="510" y="116" font-size="11" fill="#333" font-weight="bold">累计</text>
  <text x="590" y="116" font-size="11" fill="#4a7a3a" font-weight="bold">结果</text>

  <rect x="342" y="128" width="270" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="356" y="145" font-size="11" fill="#333">2</text>
  <text x="430" y="145" font-size="11" fill="#333">3</text>
  <text x="510" y="145" font-size="11" fill="#333">1+2+3=6</text>
  <text x="590" y="145" font-size="11" fill="#4a7a3a">赢</text>

  <rect x="342" y="154" width="270" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="356" y="171" font-size="11" fill="#333">3</text>
  <text x="430" y="171" font-size="11" fill="#333">2</text>
  <text x="510" y="171" font-size="11" fill="#333">1+3+2=6</text>
  <text x="590" y="171" font-size="11" fill="#4a7a3a">赢</text>

  <rect x="342" y="180" width="270" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="356" y="197" font-size="11" fill="#333">4</text>
  <text x="430" y="197" font-size="11" fill="#333">2</text>
  <text x="510" y="197" font-size="11" fill="#333">1+4+2=7</text>
  <text x="590" y="197" font-size="11" fill="#4a7a3a">赢</text>

  <!-- (1 already used, pick any ≥) note -->
  <rect x="342" y="206" width="270" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="476" y="223" text-anchor="middle" font-size="10.6" fill="#666">1 已用，选 2 即超 T 也算赢</text>

  <!-- key insight -->
  <rect x="342" y="240" width="270" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="476" y="258" text-anchor="middle" font-size="10.8" fill="#555">先手取 1 后剩目标 5</text>
  <text x="476" y="273" text-anchor="middle" font-size="10.8" fill="#555">我总能在第 3 手凑到 ≥ 6</text>

  <!-- verdict right -->
  <rect x="372" y="292" width="208" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="476" y="316" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">dfs(0,0) = true</text>

  <!-- bottom takeaway -->
  <rect x="40" y="350" width="560" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：局面由「已用数集合」唯一决定 → 用 mask 作记忆化键</text>
  <text x="320" y="392" text-anchor="middle" font-size="11" fill="#555">左例：每个 i 都让对手立即达标 ⇒ 全输 ⇒ false</text>
  <text x="320" y="409" text-anchor="middle" font-size="11" fill="#555">右例：存在 i=1 使对手任一应对都败 ⇒ true（OR 语义）</text>

  <text x="320" y="445" text-anchor="middle" font-size="10.5" fill="#888">两例验证「我赢 ⟺ ∃ 一手使对手必输」的极小化极大递推</text>
</svg>
