<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按（值,下标）排序后，指针 j 只进不退</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">图示为示例 1 查询②进行中的状态：nums = [1,2,2,1,2,3,1]</text>

  <!-- nums row -->
  <rect x="108" y="54" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="131" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="156" y="54" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="77" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="204" y="54" width="46" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="252" y="54" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="300" y="54" width="46" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="348" y="54" width="46" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="371" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="396" y="54" width="46" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="419" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="98" y="106" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">下标</text>
  <text x="131" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="179" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="227" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="275" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="323" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="371" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="419" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>

  <!-- sort arrow -->
  <path d="M 275 114 L 275 146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="287" y="134" font-size="10.5" fill="#446688" filter="url(#rough2)">按（值,下标）排序</text>

  <!-- sorted row -->
  <rect x="108" y="150" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="131" y="174" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1,0 ✓</text>
  <rect x="156" y="150" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="179" y="174" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1,3 ✓</text>
  <rect x="204" y="150" width="46" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1,6</text>
  <rect x="252" y="150" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="275" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2,1 ✕</text>
  <rect x="300" y="150" width="46" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2,2</text>
  <rect x="348" y="150" width="46" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="371" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2,4</text>
  <rect x="396" y="150" width="46" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="419" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3,5</text>

  <!-- pointer j -->
  <path d="M 275 216 L 275 194" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="256" y="212" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>
  <path d="M 283 226 L 316 226" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="242" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">滑过·不耗 k</text>

  <!-- legend -->
  <rect x="90" y="254" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="265" font-size="10" fill="#555" filter="url(#rough2)">顺序标记（耗 k）</text>
  <rect x="232" y="254" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="252" y="265" font-size="10" fill="#555" filter="url(#rough2)">点名插队（不耗 k）</text>
  <rect x="390" y="254" width="14" height="14" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="265" font-size="10" fill="#555" filter="url(#rough2)">未标记</text>

  <!-- insight box -->
  <rect x="30" y="284" width="500" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">💡 标记不可逆 +「每次取 k 个最小」⇒ 被消费元素在排序序列上是一段</text>
  <text x="280" y="321" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">不断伸长的前缀；点名标记会「插队」到前缀之后，留下待滑过的洞</text>
  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">sum 增量维护：标记一次减一次，answer[i] 随时 O(1) 读出</text>

  <!-- warn box -->
  <rect x="30" y="374" width="500" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⚠️ 跳过插队者绝不消耗 k；j 到头（j = n）说明剩余不足 k 个，全标完即止</text>
</svg>
