<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：模拟 4 步停机，剩余 1 次按轮转分配</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">nums = [2,1,3,5,6]，k = 5，multiplier = 2，mx = 6</text>

  <!-- 模拟阶段表 -->
  <text x="36" y="72" font-size="10.5" fill="#333" filter="url(#rough2)">初始</text>
  <rect x="110" y="58" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="74" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="58" width="26" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="153" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="170" y="58" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="74" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="200" y="58" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="74" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="230" y="58" width="26" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="243" y="74" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="280" y="72" font-size="9.5" fill="#888" filter="url(#rough2)">堆顶 (1,1)——全局最小</text>

  <text x="36" y="97" font-size="10.5" fill="#333" filter="url(#rough2)">① 次</text>
  <rect x="110" y="83" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="99" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="83" width="26" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="153" y="99" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="170" y="83" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="99" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="200" y="83" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="99" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="230" y="83" width="26" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="243" y="99" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="280" y="97" font-size="9.5" fill="#888" filter="url(#rough2)">1×2=2 ≤ 6 ✓ 继续</text>

  <text x="36" y="122" font-size="10.5" fill="#333" filter="url(#rough2)">② 次</text>
  <rect x="110" y="108" width="26" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="123" y="124" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="140" y="108" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="170" y="108" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="200" y="108" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="230" y="108" width="26" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="243" y="124" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="280" y="122" font-size="9.5" fill="#888" filter="url(#rough2)">(2,0)：两 个 2 并列，取最前</text>

  <text x="36" y="147" font-size="10.5" fill="#333" filter="url(#rough2)">③ 次</text>
  <rect x="110" y="133" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="140" y="133" width="26" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="153" y="149" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="170" y="133" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="200" y="133" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="230" y="133" width="26" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="243" y="149" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="280" y="147" font-size="9.5" fill="#888" filter="url(#rough2)">2×2=4 ≤ 6 ✓</text>

  <text x="36" y="172" font-size="10.5" fill="#333" filter="url(#rough2)">④ 次</text>
  <rect x="110" y="158" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="140" y="158" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="170" y="158" width="26" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="183" y="174" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">6</text>
  <rect x="200" y="158" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="230" y="158" width="26" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="243" y="174" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="280" y="172" font-size="9.5" fill="#888" filter="url(#rough2)">3×2=6 ≤ 6 ✓（取等也执行）</text>

  <!-- 停机横幅 -->
  <path d="M120,182 L120,196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="36" y="198" width="348" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="215" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">第⑤步前：堆顶 4，4×2 = 8 &gt; mx = 6 ⇒ 停机！剩余 k = 1</text>

  <!-- 轮转分配 -->
  <path d="M120,224 L120,236" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="36" y="248" font-size="10.5" fill="#333" filter="url(#rough2)">停机时堆升序（rank 0→4），q = 0，r = 1 ⇒ 前 1 名多乘一次：</text>

  <rect x="36" y="256" width="84" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="78" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">(4,0) ×2^1</text>
  <rect x="132" y="256" width="84" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174" y="272" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(4,1) ×2^0</text>
  <rect x="228" y="256" width="84" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(5,3) ×2^0</text>
  <rect x="324" y="256" width="84" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="272" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(6,2) ×2^0</text>
  <rect x="420" y="256" width="84" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="272" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(6,4) ×2^0</text>

  <path d="M120,280 L120,292" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <rect x="36" y="294" width="180" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="126" y="311" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">ans = [8, 4, 6, 5, 6] ✓</text>

  <!-- 示例 2 对照 -->
  <rect x="236" y="294" width="268" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="312" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">示例 2：[100000,2000]，k=2，m=10^6 —— 0 步模拟直接停机</text>
  <text x="370" y="330" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">q=1, r=0：10^11 与 2×10^9 各 mod (10^9+7) 得答案</text>

  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">红格 = 本步被乘的元素；绿格 = mx；真值全程 ≤ 6，从未溢出</text>
</svg>
