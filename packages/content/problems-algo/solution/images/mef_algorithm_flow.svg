<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程</text>

  <!-- Start -->
  <rect x="190" y="42" width="180" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 ans=0, maxF=0, freq/cnt 空</text>
  <path d="M280,76 L280,94" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process -->
  <rect x="140" y="94" width="280" height="50" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">处理 nums[i]：freq[v]++、cnt[freq[v]]++</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">maxF = max(maxF, freq[v])</text>
  <path d="M280,144 L280,164" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Main diamond -->
  <polygon points="280,164 420,225 280,286 140,225" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">当前前缀合法？</text>
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">(满足三种情形之一)</text>
  <text x="440" y="218" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="294" y="302" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Yes branch to ans box -->
  <path d="M420,225 L458,225" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="458" y="207" width="86" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="501" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans ← i+1</text>
  <path d="M501,243 L501,335 L362,335" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch -->
  <path d="M280,286 L280,300" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 还有元素 diamond -->
  <polygon points="280,300 360,335 280,370 200,335" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有元素?</text>
  <text x="188" y="328" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="294" y="386" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Loop back -->
  <path d="M200,335 L116,335 L116,119 L140,119" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="230" font-size="11" fill="#446688" filter="url(#rough2)">下一个 i</text>

  <!-- End -->
  <path d="M280,370 L280,388" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="388" width="120" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
