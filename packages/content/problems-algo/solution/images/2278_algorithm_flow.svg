<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="460" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数 → 先乘 100 后整数除法 → 返回</text>

  <!-- Start -->
  <ellipse cx="240" cy="62" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="67" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="240" y1="82" x2="240" y2="98" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count step -->
  <rect x="70" y="102" width="340" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="124" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">cnt = s 中等于 letter 的字符数</text>
  <text x="240" y="144" text-anchor="middle" font-size="11" fill="#888">遍历 s 一次（或 s.count(letter)）</text>

  <line x1="240" y1="158" x2="240" y2="174" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute step -->
  <rect x="60" y="178" width="360" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="202" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">ans = cnt × 100 // n</text>
  <text x="240" y="222" text-anchor="middle" font-size="11" fill="#b85450">先乘 100 放大，再整数除法（n = len(s)）</text>

  <line x1="240" y1="236" x2="240" y2="252" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="130" y="256" width="220" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="282" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return ans</text>

  <line x1="240" y1="298" x2="240" y2="314" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="240" cy="334" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="339" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- footer notes -->
  <rect x="60" y="366" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="240" y="388" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">关键：先乘后除，避免过早取整丢精度</text>

  <rect x="60" y="408" width="360" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="240" y="430" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">时间 O(n)，空间 O(1)</text>
</svg>
