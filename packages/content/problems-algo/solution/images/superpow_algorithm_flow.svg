<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐位递推 + 快速幂</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="60" rx="56" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="260" y1="80" x2="260" y2="96" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init: res = 1 -->
  <rect x="160" y="100" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">res = 1</text>

  <line x1="260" y1="134" x2="260" y2="150" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: b 还有未处理位? -->
  <polygon points="260,154 360,200 260,246 160,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">b 还有下一位 d ?</text>
  <text x="260" y="214" text-anchor="middle" font-size="10.5" fill="#888">遍历数组</text>

  <!-- Yes branch: down -->
  <text x="272" y="262" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="260" y1="246" x2="260" y2="266" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step box: res = pow(res,10,m) * pow(a,d,m) % m -->
  <rect x="50" y="270" width="420" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">res = pow(res, 10, 1337)</text>
  <text x="260" y="312" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">res = res × pow(a, d, 1337)</text>
  <text x="260" y="330" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">res = res % 1337</text>

  <!-- loop back to decision -->
  <line x1="470" y1="304" x2="492" y2="304" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="424" y="182" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取下一位</text>
  <path d="M 492 304 Q 492 200 360 200" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch: left -->
  <text x="138" y="194" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <path d="M 160 200 Q 80 200 80 280" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return res -->
  <rect x="20" y="284" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="80" y="306" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return res</text>

  <line x1="80" y1="318" x2="80" y2="344" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="80" cy="364" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="369" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- bottom note 1 -->
  <rect x="160" y="352" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="330" y="371" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">循环不变量：处理完 d₀..dᵢ 后 res ≡ a^bᵢ (mod 1337)</text>
  <text x="330" y="387" text-anchor="middle" font-size="11" fill="#446688">pow(x, n, m) 用快速幂 O(log n)</text>

  <!-- complexity tag -->
  <rect x="160" y="404" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="426" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">时间 O(n · log 10) = O(n)，空间 O(1)</text>

  <!-- language caveat -->
  <rect x="40" y="448" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="463" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠ a 可能远大于 1337，每步都需先 mod 1337</text>
</svg>
