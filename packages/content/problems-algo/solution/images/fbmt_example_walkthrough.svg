  <text x="195" y="327" text-anchor="middle" font-size="10" fill="#333">11</text>
  <rect x="220" y="310" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
