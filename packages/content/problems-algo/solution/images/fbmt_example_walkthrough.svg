  <rect x="170" y="284" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="195" y="301" text-anchor="middle" font-size="10" fill="#333">10</text>
  <rect x="220" y="284" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="265" y="301" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Buzz</text>
  <rect x="310" y="284" width="240" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="301" text-anchor="middle" font-size="10" fill="#333">... Buzz</text>

  <!-- row 11-12: number(11), fizz(12) -->
  <rect x="30" y="310" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
