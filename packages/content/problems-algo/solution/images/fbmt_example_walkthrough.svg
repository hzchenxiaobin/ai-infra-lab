  <rect x="220" y="128" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="265" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Fizz</text>
  <rect x="310" y="128" width="240" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="145" text-anchor="middle" font-size="10" fill="#333">1 2 Fizz</text>

  <!-- row 4: number, cur=4, print 4 -->
  <rect x="30" y="154" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
