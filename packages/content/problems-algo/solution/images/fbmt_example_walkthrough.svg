  <rect x="30" y="388" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="52" y="406" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">15</text>
