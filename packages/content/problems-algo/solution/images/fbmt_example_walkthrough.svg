  <rect x="310" y="154" width="240" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="171" text-anchor="middle" font-size="10" fill="#333">1 2 Fizz 4</text>

  <!-- row 5: buzz, cur=5, print Buzz -->
  <rect x="30" y="180" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
