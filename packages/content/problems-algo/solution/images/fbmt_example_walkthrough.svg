  <!-- row 9-10: fizz(9), buzz(10) -->
  <rect x="30" y="258" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="275" text-anchor="middle" font-size="10" fill="#333">9</text>
