<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 15 的执行轨迹</text>

  <!-- table header -->
  <rect x="30" y="46" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="52" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步</text>

  <rect x="74" y="46" width="96" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="122" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">线程</text>

  <rect x="170" y="46" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">cur</text>

  <rect x="220" y="46" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="265" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">打印</text>

  <rect x="310" y="46" width="240" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">输出累计</text>

  <!-- rows: step, thread, cur, print, output -->
  <!-- row 1: number, cur=1, print 1 -->
  <rect x="30" y="76" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="93" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="74" y="76" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="122" y="93" text-anchor="middle" font-size="10" fill="#446688">A: number</text>
  <rect x="170" y="76" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="195" y="93" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="220" y="76" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
