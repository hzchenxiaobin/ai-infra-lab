  <!-- summary note -->
  <rect x="30" y="426" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="446" text-anchor="middle" font-size="11" fill="#333">每步：恰一个线程的谓词被 current 满足 → 打印 → current++ → notify_all → 下一轮</text>
</svg>
