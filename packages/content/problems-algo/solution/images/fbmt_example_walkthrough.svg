  <!-- row 13-14: number(13,14) -->
  <rect x="30" y="362" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="379" text-anchor="middle" font-size="10" fill="#333">13</text>
  <rect x="74" y="362" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
