  <rect x="310" y="76" width="240" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="93" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- row 2: number, cur=2, print 2 -->
  <rect x="30" y="102" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
