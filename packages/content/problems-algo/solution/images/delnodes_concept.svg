<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">删点成林：被删节点的孩子升为新森林的根</text>

  <!-- 左侧：原树 -->
  <text x="150" y="52" text-anchor="middle" font-size="11" fill="#888">原树（to_delete = [3, 5]）</text>

  <!-- 连线 -->
  <line x1="140" y1="94" x2="116" y2="123" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="160" y1="94" x2="184" y2="123" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="100" y1="147" x2="88" y2="179" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="116" y1="147" x2="128" y2="179" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="184" y1="147" x2="172" y2="179" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="200" y1="147" x2="212" y2="179" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 根 1 -->
  <circle cx="150" cy="80" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- 节点 2 -->
  <circle cx="108" cy="135" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="139" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- 节点 3 [删除] -->
  <circle cx="192" cy="135" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="192" y="139" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="210" y="128" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <!-- 叶 4 -->
  <circle cx="82" cy="190" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="194" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 叶 5 [删除] -->
  <circle cx="134" cy="190" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="134" y="194" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="150" y="185" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <!-- 叶 6 -->
  <circle cx="166" cy="190" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="194" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- 叶 7 -->
  <circle cx="218" cy="190" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="194" text-anchor="middle" font-size="11" fill="#333">7</text>

  <!-- 箭头 -->
  <path d="M 248 135 L 300 135" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="125" text-anchor="middle" font-size="10" fill="#888">删除 3, 5</text>

  <!-- 右侧：结果森林 -->
  <text x="430" y="52" text-anchor="middle" font-size="11" fill="#888">结果森林 = [1, 6, 7]</text>

  <!-- 树 1 -->
  <line x1="355" y1="94" x2="335" y2="123" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="331" y1="147" x2="323" y2="179" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="355" cy="80" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="355" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
  <circle cx="333" cy="135" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="333" y="139" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="321" cy="190" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="194" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 树 6 -->
  <circle cx="425" cy="110" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="425" y="114" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- 树 7 -->
  <circle cx="495" cy="110" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="495" y="114" text-anchor="middle" font-size="11" fill="#333">7</text>

  <!-- 新根虚线圈 -->
  <ellipse cx="340" cy="135" rx="45" ry="65" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <ellipse cx="425" cy="110" rx="24" ry="24" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <ellipse cx="495" cy="110" rx="24" ry="24" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="340" y="218" text-anchor="middle" font-size="9" fill="#4a7a3a">新根</text>
  <text x="425" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a">新根</text>
  <text x="495" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a">新根</text>

  <!-- 说明框 -->
  <rect x="40" y="250" width="520" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心观察：删点 = 断边 + 升子为根</text>
  <text x="60" y="298" font-size="11" fill="#555">① 删除节点 3 → 断开 3 与父 1 的边；3 的孩子 6、7 无父 → 升为新森林根</text>
  <text x="60" y="318" font-size="11" fill="#555">② 删除节点 5 → 断开 5 与父 2 的边；5 无孩子 → 无新树产生</text>
  <text x="60" y="338" font-size="11" fill="#555">③ 节点 1 原为整棵树的根，未被删 → 仍是森林中的一棵树根</text>
  <text x="60" y="362" font-size="11" fill="#4a7a3a">绿色圈 = 新森林根；红色 ✗ = 待删节点；红色边 = 即将断开的父子边</text>
</svg>
