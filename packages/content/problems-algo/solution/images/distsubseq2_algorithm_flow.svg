<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程</text>

  <!-- Start -->
  <rect x="240" y="38" width="80" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 280 66 L 280 78" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="190" y="78" width="180" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="98" text-anchor="middle" font-size="11" fill="#333">f = 1,  last = {} （空字典）</text>

  <path d="M 280 110 L 280 122" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop -->
  <rect x="225" y="122" width="110" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i = 1 → n</text>

  <path d="M 280 150 L 280 162" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- c = s[i-1] -->
  <rect x="225" y="162" width="110" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#333">c = s[i−1]</text>

  <path d="M 280 190 L 280 202" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: c in last? -->
  <polygon points="280,202 345,220 280,238 215,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="10" fill="#333">c ∈ last</text>
  <text x="280" y="230" text-anchor="middle" font-size="10" fill="#333">?</text>

  <!-- Left branch: Yes -->
  <path d="M 215 220 L 140 220" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="177" y="214" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">是</text>
  <path d="M 140 220 L 140 248" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="248" width="220" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f = 2f − f[last[c]−1]</text>
  <text x="140" y="280" text-anchor="middle" font-size="9" fill="#888">扣减重复</text>

  <!-- Right branch: No -->
  <path d="M 345 220 L 420 220" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 420 220 L 420 248" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="248" width="220" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">f = 2f</text>
  <text x="420" y="280" text-anchor="middle" font-size="9" fill="#888">首次出现，不扣</text>

  <!-- Merge arrows -->
  <path d="M 140 288 L 140 312 L 245 312" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 288 L 420 312 L 315 312" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Update last[c] = i -->
  <rect x="225" y="306" width="110" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#333">last[c] = i</text>

  <!-- Loop back arrow -->
  <path d="M 335 320 L 535 320 L 535 136 L 335 136" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="535" y="228" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 535 228)">i &lt; n 时回到循环</text>

  <!-- Arrow to return -->
  <path d="M 280 334 L 280 348" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="170" y="348" width="220" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 (f − 1 + M) % M</text>
</svg>
