<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="200" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 × 8 矩形 → 5 块正方形</text>

  <!-- Panel 0: 5×5 at (0,0), grid origin (16, 40), cell=12 -->
  <g>
    <path d="M16,40 L112,40 M16,52 L112,52 M16,64 L112,64 M16,76 L112,76 M16,88 L112,88 M16,100 L112,100 M16,40 L16,100 M28,40 L28,100 M40,40 L40,100 M52,40 L52,100 M64,40 L64,100 M76,40 L76,100 M88,40 L88,100 M100,40 L100,100 M112,40 L112,100" stroke="#ccc" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
    <rect x="16" y="40" width="96" height="60" fill="none" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="16" y="40" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="46" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5×5</text>
    <text x="64" y="120" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① 5×5</text>
  </g>

  <!-- Panel 1: +3×3 at (0,5), grid origin (124, 40) -->
  <g>
    <path d="M124,40 L220,40 M124,52 L220,52 M124,64 L220,64 M124,76 L220,76 M124,88 L220,88 M124,100 L220,100 M124,40 L124,100 M136,40 L136,100 M148,40 L148,100 M160,40 L160,100 M172,40 L172,100 M184,40 L184,100 M196,40 L196,100 M208,40 L208,100 M220,40 L220,100" stroke="#ccc" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
    <rect x="124" y="40" width="96" height="60" fill="none" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="124" y="40" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="184" y="40" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="202" y="60" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3×3</text>
    <text x="172" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">② +3×3</text>
  </g>

  <!-- Panel 2: +2×2 at (3,5), grid origin (232, 40) -->
  <g>
    <path d="M232,40 L328,40 M232,52 L328,52 M232,64 L328,64 M232,76 L328,76 M232,88 L328,88 M232,100 L328,100 M232,40 L232,100 M244,40 L244,100 M256,40 L256,100 M268,40 L268,100 M280,40 L280,100 M292,40 L292,100 M304,40 L304,100 M316,40 L316,100 M328,40 L328,100" stroke="#ccc" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
    <rect x="232" y="40" width="96" height="60" fill="none" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="232" y="40" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="292" y="40" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="292" y="76" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="304" y="90" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">2×2</text>
    <text x="280" y="120" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">③ +2×2</text>
  </g>

  <!-- Panel 3: +1×1 at (3,7), grid origin (340, 40) -->
  <g>
    <path d="M340,40 L436,40 M340,52 L436,52 M340,64 L436,64 M340,76 L436,76 M340,88 L436,88 M340,100 L436,100 M340,40 L340,100 M352,40 L352,100 M364,40 L364,100 M376,40 L376,100 M388,40 L388,100 M400,40 L400,100 M412,40 L412,100 M424,40 L424,100 M436,40 L436,100" stroke="#ccc" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
    <rect x="340" y="40" width="96" height="60" fill="none" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="340" y="40" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="400" y="40" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="400" y="76" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="424" y="76" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="388" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">④ +1×1</text>
  </g>

  <!-- Panel 4: +1×1 at (4,7), grid origin (448, 40) -->
  <g>
    <path d="M448,40 L544,40 M448,52 L544,52 M448,64 L544,64 M448,76 L544,76 M448,88 L544,88 M448,100 L544,100 M448,40 L448,100 M460,40 L460,100 M472,40 L472,100 M484,40 L484,100 M496,40 L496,100 M508,40 L508,100 M520,40 L520,100 M532,40 L532,100 M544,40 L544,100" stroke="#ccc" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
    <rect x="448" y="40" width="96" height="60" fill="none" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="448" y="40" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="508" y="40" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="508" y="76" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="532" y="76" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <rect x="532" y="88" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="496" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⑤ +1×1 = 5 ✓</text>
  </g>

  <!-- Summary -->
  <text x="280" y="155" text-anchor="middle" font-size="11.5" fill="#555">5×5 + 3×3 + 2×2 + 1×1 + 1×1 = <tspan fill="#b85450" font-weight="bold">5 块</tspan></text>

  <rect x="80" y="168" width="400" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#444">⚠ 5×8 贪心即最优；但 11×13 贪心 = 7，回溯才得最优 6</text>
</svg>
