<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：n = 5，质数 = {2, 3, 5}，后序处理 4 → 5 → 2 → 3 → 1</text>

  <!-- table header -->
  <rect x="30" y="44" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="75" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">节点 u</text>
  <rect x="120" y="44" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">质数?</text>
  <rect x="190" y="44" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">初始 (s₀,s₁)</text>
  <rect x="300" y="44" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="385" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">合并子树的 ans 增量</text>
  <rect x="470" y="44" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="520" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[u]</text>

  <!-- row: node 4 -->
  <rect x="30" y="86" width="90" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="120" y="86" width="70" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="109" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">✗</text>
  <rect x="190" y="86" width="110" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 0)</text>
  <rect x="300" y="86" width="170" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="385" y="109" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">无子树 +0</text>
  <rect x="470" y="86" width="100" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="520" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 0)</text>

  <!-- row: node 5 -->
  <rect x="30" y="130" width="90" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="120" y="130" width="70" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="153" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✓</text>
  <rect x="190" y="130" width="110" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <rect x="300" y="130" width="170" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="385" y="153" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">无子树 +0</text>
  <rect x="470" y="130" width="100" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="520" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 1)</text>

  <!-- row: node 2 -->
  <rect x="30" y="174" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="197" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="120" y="174" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="197" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✓</text>
  <rect x="190" y="174" width="110" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <rect x="300" y="174" width="170" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="385" y="191" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">子树4: 0×0+1×1 = +1</text>
  <text x="385" y="205" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">子树5: 0×1+2×0 = +0</text>
  <rect x="470" y="174" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="520" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 2)</text>

  <!-- row: node 3 -->
  <rect x="30" y="218" width="90" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="120" y="218" width="70" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="241" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✓</text>
  <rect x="190" y="218" width="110" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <rect x="300" y="218" width="170" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="385" y="241" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">无子树 +0</text>
  <rect x="470" y="218" width="100" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="520" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 1)</text>

  <!-- row: node 1 -->
  <rect x="30" y="262" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="120" y="262" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="285" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">✗</text>
  <rect x="190" y="262" width="110" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 0)</text>
  <rect x="300" y="262" width="170" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="385" y="279" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">子树2: 1×2+0×0 = +2</text>
  <text x="385" y="293" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">子树3: 1×1+0×0 = +1</text>
  <rect x="470" y="262" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="520" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 3)</text>

  <!-- annotation -->
  <rect x="36" y="316" width="528" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 0 + 0 + 1 + 0 + 3 = 4</text>
  <text x="300" y="362" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">节点 2 处贡献路径 (2,4)；节点 1 处贡献 (1,2)、(1,4)、(1,3) —— 与示例一致</text>

  <text x="300" y="404" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">增量即「s₁×c₀ 型」：u 侧含 1 个质数的向下路径 × 新子树不含质数的向下路径</text>
  <text x="300" y="424" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">节点 2 合并子树 5 时 s₁ 已含 (2,4) 与单点 (2)，均 × c₀=0 —— 两个质数的路径被自然排除</text>
</svg>
