<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两阶段：二着色判二分图 + 逐分量求直径</text>

  <!-- ===== Phase 1 strip ===== -->
  <rect x="20" y="42" width="580" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="60" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">阶段一：2 着色 —— 判定二分图 + 收集连通分量</text>

  <!-- B1: build graph -->
  <rect x="60" y="80" width="300" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="100" text-anchor="middle" font-size="12" fill="#333">建邻接表 g[]（编号转 0-indexed），color[] ← −1</text>
  <path d="M 210 110 L 210 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: 还有未染色节点? -->
  <polygon points="210,120 286,146 210,172 134,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="150" text-anchor="middle" font-size="12" fill="#333">还有未染色节点?</text>
  <!-- D1 否(右) -> 阶段二 strip -->
  <path d="M 286 146 L 380 146 L 380 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="138" text-anchor="middle" font-size="10" fill="#888">否（遍历完）</text>
  <!-- D1 是(下) -->
  <path d="M 210 172 L 210 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="180" font-size="11" fill="#4a7a3a">是</text>

  <!-- B2: BFS coloring -->
  <rect x="60" y="180" width="300" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="200" text-anchor="middle" font-size="12" fill="#333">源 i 起 BFS：color 交替 0/1，收集 comp</text>
  <path d="M 210 210 L 210 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: 同色相邻? -->
  <polygon points="210,220 296,246 210,272 124,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="250" text-anchor="middle" font-size="12" fill="#333">遇同色相邻?</text>
  <!-- D2 是(右) -> 返回 -1 -->
  <path d="M 296 246 L 368 246" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="238" text-anchor="middle" font-size="10" fill="#b03a3a">是（奇环）</text>
  <rect x="368" y="230" width="232" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="484" y="250" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">返回 -1（非二分图）✗</text>
  <!-- D2 否(左) -> loop back to D1 -->
  <path d="M 124 246 L 40 246 L 40 146 L 134 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="240" text-anchor="end" font-size="10" fill="#888">否 → 下一 i</text>

  <!-- ===== Phase 2 strip ===== -->
  <rect x="20" y="300" width="580" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="318" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">阶段二：每个分量最大组数 = 直径 + 1</text>

  <!-- B3: per component BFS -->
  <rect x="60" y="336" width="300" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="356" text-anchor="middle" font-size="12" fill="#333">对每个分量 comp，枚举源点 s 跑 BFS 求 dist</text>
  <path d="M 210 366 L 210 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4: accumulate -->
  <rect x="60" y="376" width="300" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="396" text-anchor="middle" font-size="12" fill="#333">best = 分量内最大深度；ans += best + 1</text>
  <path d="M 210 406 L 210 414" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- terminal: return ans -->
  <rect x="60" y="414" width="300" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="434" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 ans（各分量组数之和）✓</text>

  <!-- bottom note -->
  <text x="310" y="460" text-anchor="middle" font-size="11" fill="#666">不连通图：分量间无边，组数可分别累加（组号整体平移拼接）</text>
</svg>
