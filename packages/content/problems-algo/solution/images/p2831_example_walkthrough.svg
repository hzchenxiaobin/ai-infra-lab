<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="490" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,3,2,3,1,3]，k = 3</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">pos[3] = [1, 3, 5]，pos[1] = [0, 4]，pos[2] = [2]</text>
  <text x="300" y="62" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最优窗口 [1, 5]：3 个 3 全保留，删除 2 个异值</text>

  <!-- array cells -->
  <rect x="130" y="70" width="50" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="94" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="180" y="70" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="230" y="70" width="50" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="280" y="70" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="330" y="70" width="50" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="70" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- delete crosses on idx 2 and 4 -->
  <path d="M 239 74 L 271 104" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 271 74 L 239 104" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 339 74 L 371 104" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 371 74 L 339 104" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- index labels -->
  <text x="155" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="205" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="255" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="305" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="355" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="405" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <!-- window rect -->
  <rect x="176" y="66" width="259" height="46" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" rx="6" filter="url(#rough2)"/>

  <!-- pos[3] with pointers -->
  <text x="130" y="148" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">pos[3]：</text>
  <rect x="210" y="136" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p₀ = 1</text>
  <rect x="310" y="136" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p₁ = 3</text>
  <rect x="410" y="136" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p₂ = 5</text>

  <path d="M 240 204 L 240 192" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="240" y="218" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M 440 204 L 440 192" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="440" y="218" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j</text>

  <text x="310" y="242" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">代价 = p₂ − p₀ − (2 − 0) = 5 − 1 − 2 = 2 ≤ k = 3，长度 = 3</text>

  <!-- step table -->
  <rect x="105" y="258" width="470" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">值 x</text>
  <text x="185" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="275" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口 [pᵢ, pⱼ]</text>
  <text x="385" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">代价</text>
  <text x="465" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">长度 j−i+1</text>
  <text x="535" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="105" y="280" width="470" height="25" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="105" y="305" width="470" height="25" fill="#f5f8fb" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="105" y="330" width="470" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="105" y="355" width="470" height="25" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="105" y="380" width="470" height="25" fill="#f5f8fb" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="105" y="405" width="470" height="25" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="130" y="297" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="185" y="297" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="275" y="297" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1, 1]</text>
  <text x="385" y="297" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="465" y="297" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="535" y="297" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <text x="130" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="185" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="275" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1, 3]</text>
  <text x="385" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="465" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="535" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>

  <text x="130" y="347" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="185" y="347" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="275" y="347" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">[1, 5]</text>
  <text x="385" y="347" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2 ✓</text>
  <text x="465" y="347" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="535" y="347" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3 ★</text>

  <text x="130" y="372" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="185" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="275" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[0, 0]</text>
  <text x="385" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="465" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="535" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>

  <text x="130" y="397" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="185" y="397" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="275" y="397" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[0, 4]</text>
  <text x="385" y="397" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="465" y="397" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="535" y="397" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>

  <text x="130" y="422" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="185" y="422" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="275" y="422" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[2, 2]</text>
  <text x="385" y="422" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="465" y="422" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="535" y="422" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>

  <!-- conclusion -->
  <rect x="90" y="444" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="467" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = 3：删除下标 2、4 → [1, 3, 3, 3]，等值段 [3, 3, 3]</text>
</svg>
