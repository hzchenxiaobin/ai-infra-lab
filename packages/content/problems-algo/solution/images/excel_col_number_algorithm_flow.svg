<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单遍累乘加，无分支、无反转</text>

  <!-- 1. 初始化 -->
  <rect x="40" y="56" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化</text>
  <text x="100" y="89" text-anchor="middle" font-size="11" fill="#333">res = 0</text>

  <!-- arrow to loop -->
  <path d="M 160 76 L 196 76" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 循环判定 -->
  <polygon points="270,52 360,76 270,100 180,76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="73" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">还有字符?</text>
  <text x="270" y="87" text-anchor="middle" font-size="10" fill="#888">for ch in s</text>

  <!-- loop yes arrow down to body -->
  <path d="M 270 100 L 270 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="120" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 3. 累乘加体 -->
  <rect x="80" y="134" width="380" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="154" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">累乘加（每字符一步）</text>
  <text x="270" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">res = res × 26 + (ord(ch) − ord('A') + 1)</text>

  <!-- 取下一个字符：箭头回到循环判定 -->
  <path d="M 470 159 Q 510 159 510 76 L 360 76" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="120" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">取下一字符</text>

  <!-- loop no arrow to return -->
  <path d="M 360 76 L 460 76" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="68" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 4. 返回 -->
  <rect x="460" y="56" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">返回</text>
  <text x="500" y="89" text-anchor="middle" font-size="11" fill="#333">res</text>

  <!-- ===== 对照条：168 vs 171 ===== -->
  <text x="280" y="218" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">与 168 对照</text>

  <rect x="40" y="232" width="240" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="160" y="252" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">168 分解方向</text>
  <text x="160" y="272" text-anchor="middle" font-size="10.5" fill="#555">每轮三步：减 1 → 取余定字母 → 整除缩小</text>
  <text x="160" y="290" text-anchor="middle" font-size="10.5" fill="#555">产出顺序：低位 → 高位</text>
  <text x="160" y="308" text-anchor="middle" font-size="10.5" fill="#555">末尾：需反转字符串</text>
  <text x="160" y="325" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">难度：中等（off-by-one 坑）</text>

  <rect x="290" y="232" width="240" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="410" y="252" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">171 合成方向</text>
  <text x="410" y="272" text-anchor="middle" font-size="10.5" fill="#555">每字符一步：res = res×26 + digit</text>
  <text x="410" y="290" text-anchor="middle" font-size="10.5" fill="#555">产出顺序：高位 → 低位</text>
  <text x="410" y="308" text-anchor="middle" font-size="10.5" fill="#555">末尾：无须反转</text>
  <text x="410" y="325" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">难度：简单</text>
</svg>
