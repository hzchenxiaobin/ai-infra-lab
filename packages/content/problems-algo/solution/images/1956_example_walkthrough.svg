<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：points = [[1,1],[6,1]], k = 2</text>

  <!-- ===== TOP: (x,y) plane ===== -->
  <text x="150" y="46" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">(x, y) 平面：菱形相遇</text>

  <!-- x axis -->
  <path d="M 30 150 L 280 150" stroke="#ccc" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="284" y="154" font-size="10.5" fill="#999">x</text>
  <!-- tick labels -->
  <text x="100" y="166" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="140" y="166" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="160" y="166" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="200" y="166" text-anchor="middle" font-size="10" fill="#999">6</text>

  <!-- t=2 dashed diamonds (gap) -->
  <path d="M 100 110 L 140 150 L 100 190 L 60 150 Z" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 200 110 L 240 150 L 200 190 L 160 150 Z" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- t=3 solid diamonds (overlap) -->
  <path d="M 100 90 L 160 150 L 100 210 L 40 150 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" opacity="0.85"/>
  <path d="M 200 90 L 260 150 L 200 210 L 140 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" opacity="0.85"/>

  <!-- virus points -->
  <circle cx="100" cy="150" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="92" y="142" font-size="11" fill="#b85450" font-weight="bold">V1(1,1)</text>
  <circle cx="200" cy="150" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="206" y="142" font-size="11" fill="#b85450" font-weight="bold">V2(6,1)</text>

  <!-- meeting points at t=3 -->
  <circle cx="140" cy="150" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="160" cy="150" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="132" y="178" font-size="10.5" fill="#4a7a3a" font-weight="bold">(3,1)</text>
  <text x="152" y="178" font-size="10.5" fill="#4a7a3a" font-weight="bold">(4,1)</text>

  <!-- gap annotation for t=2 -->
  <path d="M 140 96 L 160 96" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrD)" marker-start="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="88" text-anchor="middle" font-size="10" fill="#b85450">t=2 间隙</text>

  <!-- legend -->
  <rect x="300" y="70" width="12" height="12" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="318" y="80" font-size="11" fill="#555">t=2：无公共点 ✗</text>
  <rect x="300" y="92" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="318" y="102" font-size="11" fill="#555">t=3：相遇于 (3,1),(4,1) ✓</text>
  <text x="300" y="124" font-size="10.5" fill="#888">两菱形间距 5，ceil(5/2)=3</text>

  <!-- divider -->
  <path d="M 30 200 L 540 200" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== BOTTOM: (u,v) plane at t=3 ===== -->
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">(u, v) 平面 @ t=3：两正方形重叠，角点即相遇点</text>

  <!-- u axis -->
  <path d="M 40 360 L 470 360" stroke="#ccc" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="474" y="364" font-size="10.5" fill="#999">u</text>
  <!-- v axis -->
  <path d="M 120 470 L 120 240" stroke="#ccc" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="112" y="236" font-size="10.5" fill="#999">v</text>

  <!-- Square1: V1 (u=2,v=0), t=3 -> u[-1,5], v[-3,3]. pixel: x[70,210], y[300,440] (scale ~23.3) -->
  <rect x="70" y="300" width="140" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="2" filter="url(#rough2)" opacity="0.8"/>
  <text x="140" y="376" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">V1</text>
  <text x="140" y="392" text-anchor="middle" font-size="10.5" fill="#446688">(u=2,v=0)</text>
  <!-- square1 edge labels -->
  <text x="66" y="304" text-anchor="end" font-size="9.5" fill="#999">v=3</text>
  <text x="66" y="444" text-anchor="end" font-size="9.5" fill="#999">v=−3</text>
  <text x="70" y="456" text-anchor="middle" font-size="9.5" fill="#999">u=−1</text>
  <text x="210" y="456" text-anchor="middle" font-size="9.5" fill="#999">u=5</text>

  <!-- Square2: V2 (u=7,v=5), t=3 -> u[4,10], v[2,8]. pixel: x[180,320], y[220,360] -->
  <rect x="180" y="220" width="140" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)" opacity="0.8"/>
  <text x="250" y="296" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">V2</text>
  <text x="250" y="312" text-anchor="middle" font-size="10.5" fill="#d6a040">(u=7,v=5)</text>
  <text x="176" y="224" text-anchor="end" font-size="9.5" fill="#999">v=8</text>
  <text x="176" y="364" text-anchor="end" font-size="9.5" fill="#999">v=2</text>
  <text x="180" y="376" text-anchor="middle" font-size="9.5" fill="#999">u=4</text>
  <text x="320" y="376" text-anchor="middle" font-size="9.5" fill="#999">u=10</text>

  <!-- overlap region u[4,5] v[2,3] -> pixel x[180,210] y[300,330] -->
  <rect x="180" y="300" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="1" filter="url(#rough2)"/>

  <!-- corner (u=4, v=2) -> pixel (180, 330) bottom-left of overlap -->
  <circle cx="180" cy="330" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="188" y="346" font-size="11" fill="#b85450" font-weight="bold">角点 (4,2)</text>

  <!-- arrow: corner maps back to (3,1) -->
  <path d="M 180 330 Q 380 410 440 360" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="392" y="338" width="146" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="465" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">映回 (x,y)</text>
  <text x="465" y="372" text-anchor="middle" font-size="10.5" fill="#b85450">x=(4+2)/2=3, y=(4−2)/2=1</text>

  <!-- note bottom -->
  <text x="280" y="488" text-anchor="middle" font-size="10.5" fill="#888">答案 t=3：左下角 (u_2−t, v_2−t)=(4,2) 被 2 个正方形覆盖 ⟹ 命中</text>
</svg>
