<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 484"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="484" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">H / V 两条对称流水线：KMP → 差分 → 前缀和，终点一次映射取交集</text>

  <!-- ① 展平 -->
  <rect x="170" y="40" width="220" height="40" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">① 展平：H = 逐行拼接</text>
  <text x="280" y="73" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">V = 逐列拼接（zip(*grid)）</text>

  <!-- 分叉到两条流水线 -->
  <path d="M 250 80 C 230 94, 170 94, 152 104" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 80 C 330 94, 390 94, 408 104" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrp)" filter="url(#rough2)"/>

  <!-- ══════════ 左：H 流水线 ══════════ -->
  <rect x="45" y="106" width="210" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">② KMP：s = pattern+'#'+H</text>
  <text x="150" y="140" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">一趟求前缀函数 π</text>

  <path d="M 150 150 L 150 166" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="45" y="168" width="210" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="187" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">③ π[i] = L ⇒ 终点 e = i−L−1</text>
  <text x="150" y="204" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">diff[e−L+1]++，diff[e+1]−−</text>

  <path d="M 150 216 L 150 232" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="45" y="234" width="210" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">④ 前缀和 &gt; 0</text>
  <text x="150" y="268" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">⇒ hcov[k] = true</text>

  <!-- ══════════ 右：V 流水线 ══════════ -->
  <rect x="305" y="106" width="210" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">② KMP：s = pattern+'#'+V</text>
  <text x="410" y="140" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">一趟求前缀函数 π</text>

  <path d="M 410 150 L 410 166" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrp)" filter="url(#rough2)"/>

  <rect x="305" y="168" width="210" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="187" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 每个匹配同样差分打标</text>
  <text x="410" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（重叠匹配累加仍 &gt; 0）</text>

  <path d="M 410 216 L 410 232" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrp)" filter="url(#rough2)"/>

  <rect x="305" y="234" width="210" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">④ 前缀和 &gt; 0</text>
  <text x="410" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⇒ vcov[p] = true</text>

  <!-- 汇合到判断菱形 -->
  <path d="M 150 274 C 150 288, 220 292, 272 296" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 274 C 410 288, 340 292, 288 296" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrp)" filter="url(#rough2)"/>

  <!-- ⑤ 判断：交集？ -->
  <polygon points="280,298 438,338 280,378 122,338" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">cell = (p mod m)·n + p div m</text>
  <text x="280" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">⑤ vcov[p] 且 hcov[cell] ？</text>

  <!-- 是 → ans++ -->
  <path d="M 280 378 L 280 396" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="292" y="392" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">是</text>
  <rect x="210" y="398" width="140" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">ans ← ans + 1</text>

  <!-- 否 → 绕行；ans++ 底部并入回边 -->
  <path d="M 438 338 L 480 338 L 480 452 L 60 452 L 60 338 L 118 338" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <text x="455" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 280 432 L 280 452" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="447" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">p ← p + 1</text>

  <text x="280" y="474" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">遍历完 [0, mn) 返回 ans —— 时间 O(mn + L)，空间 O(mn)</text>
</svg>
