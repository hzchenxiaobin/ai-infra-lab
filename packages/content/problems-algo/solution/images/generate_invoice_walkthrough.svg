<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：JOIN 取单价 → 逐行金额 → 按发票汇总</text>

  <!-- column headers -->
  <rect x="30" y="50" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55"  y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">invoice_id</text>
  <text x="145" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">product_id</text>
  <text x="230" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">quantity</text>
  <text x="325" y="69" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">price(单价)</text>
  <text x="445" y="69" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">行金额=q×price</text>

  <!-- rows -->
  <g font-size="11" fill="#333">
    <text x="55"  y="96" text-anchor="middle">1</text>
    <text x="145" y="96" text-anchor="middle">1</text>
    <text x="230" y="96" text-anchor="middle">2</text>
    <text x="325" y="96" text-anchor="middle">100</text>
    <text x="445" y="96" text-anchor="middle">2×100 = 200</text>

    <text x="55"  y="116" text-anchor="middle">3</text>
    <text x="145" y="116" text-anchor="middle">2</text>
    <text x="230" y="116" text-anchor="middle">1</text>
    <text x="325" y="116" text-anchor="middle">200</text>
    <text x="445" y="116" text-anchor="middle">1×200 = 200</text>

    <text x="55"  y="136" text-anchor="middle">2</text>
    <text x="145" y="136" text-anchor="middle">2</text>
    <text x="230" y="136" text-anchor="middle">3</text>
    <text x="325" y="136" text-anchor="middle">200</text>
    <text x="445" y="136" text-anchor="middle">3×200 = 600</text>

    <text x="55"  y="156" text-anchor="middle">2</text>
    <text x="145" y="156" text-anchor="middle">1</text>
    <text x="230" y="156" text-anchor="middle">4</text>
    <text x="325" y="156" text-anchor="middle">100</text>
    <text x="445" y="156" text-anchor="middle">4×100 = 400</text>

    <text x="55"  y="176" text-anchor="middle">4</text>
    <text x="145" y="176" text-anchor="middle">1</text>
    <text x="230" y="176" text-anchor="middle">10</text>
    <text x="325" y="176" text-anchor="middle">100</text>
    <text x="445" y="176" text-anchor="middle">10×100 = 1000</text>
  </g>

  <!-- row separators -->
  <line x1="30" y1="78"  x2="570" y2="78"  stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="104" x2="570" y2="104" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="124" x2="570" y2="124" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="144" x2="570" y2="144" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="164" x2="570" y2="164" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="184" x2="570" y2="184" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- arrow down to grouped result -->
  <path d="M 300 192 L 300 214" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="380" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">GROUP BY invoice_id + SUM</text>

  <!-- result table -->
  <rect x="150" y="220" width="300" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">输出</text>
  <line x1="160" y1="248" x2="440" y2="248" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="220" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">invoice_id</text>
  <text x="370" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">price</text>
  <line x1="295" y1="252" x2="295" y2="372" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>

  <g font-size="11" fill="#333">
    <text x="220" y="288" text-anchor="middle">1</text>
    <text x="370" y="288" text-anchor="middle">200</text>

    <text x="220" y="310" text-anchor="middle">2</text>
    <text x="370" y="310" text-anchor="middle">1000</text>

    <text x="220" y="332" text-anchor="middle">3</text>
    <text x="370" y="332" text-anchor="middle">200</text>

    <text x="220" y="354" text-anchor="middle">4</text>
    <text x="370" y="354" text-anchor="middle">1000</text>
  </g>

  <text x="300" y="402" text-anchor="middle" font-size="10" fill="#888">发票2：600 + 400 = 1000（多行折叠成一组）</text>
</svg>
