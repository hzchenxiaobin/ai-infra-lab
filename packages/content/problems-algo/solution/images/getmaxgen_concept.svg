<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：按下标奇偶分两种规则生成 nums[j]</text>

  <!-- ===== Top: array row for n=7 ===== -->
  <text x="30" y="58" font-size="11" fill="#888">nums (n=7) =</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <!-- index labels -->
    <g font-size="9" fill="#999">
      <text x="44" y="74">j=0</text>
      <text x="84" y="74">1</text>
      <text x="124" y="74">2</text>
      <text x="164" y="74">3</text>
      <text x="204" y="74">4</text>
      <text x="244" y="74">5</text>
      <text x="284" y="74">6</text>
      <text x="324" y="74">7</text>
    </g>
    <!-- cells -->
    <g filter="url(#rough2)">
      <rect x="28" y="80" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
      <rect x="68" y="80" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
      <rect x="108" y="80" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
      <rect x="148" y="80" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
      <rect x="188" y="80" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
      <rect x="228" y="80" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
      <rect x="268" y="80" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
      <rect x="308" y="80" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    </g>
    <!-- values -->
    <text x="44" y="99" fill="#446688" font-weight="bold">0</text>
    <text x="84" y="99" fill="#446688" font-weight="bold">1</text>
    <text x="124" y="99" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="164" y="99" fill="#d6a040" font-weight="bold">2</text>
    <text x="204" y="99" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="244" y="99" fill="#d6a040" font-weight="bold">3</text>
    <text x="284" y="99" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="324" y="99" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- base legend -->
  <text x="380" y="92" font-size="10" fill="#446688">■ 蓝=基础值 (j=0,1)</text>
  <text x="380" y="106" font-size="10" fill="#4a7a3a">■ 绿=偶下标 (复制)</text>
  <text x="380" y="120" font-size="10" fill="#d6a040">■ 橙=奇下标 (求和)</text>

  <!-- ===== Even rule block ===== -->
  <rect x="30" y="140" width="240" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">偶下标 j = 2i ：复制</text>
  <text x="44" y="180" font-size="12" fill="#333">nums[2i] = nums[i]</text>
  <!-- mini diagram: nums[i] -> nums[2i] -->
  <g filter="url(#rough2)">
    <rect x="56" y="196" width="40" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="176" y="196" width="40" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="76" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">nums[i]</text>
  <text x="196" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">nums[2i]</text>
  <path d="M 100 209 L 172 209" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="234" text-anchor="middle" font-size="9" fill="#888">例：nums[4]=nums[2]=1</text>

  <!-- ===== Odd rule block ===== -->
  <rect x="290" y="140" width="240" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="160" font-size="12" fill="#d6a040" font-weight="bold">奇下标 j = 2i+1 ：求和</text>
  <text x="304" y="180" font-size="12" fill="#333">nums[2i+1] = nums[i] + nums[i+1]</text>
  <!-- mini diagram: nums[i]+nums[i+1] -> nums[2i+1] -->
  <g filter="url(#rough2)">
    <rect x="304" y="196" width="34" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="344" y="196" width="34" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="452" y="196" width="44" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <text x="321" y="213" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[i]</text>
  <text x="361" y="213" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[i+1]</text>
  <text x="474" y="213" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[2i+1]</text>
  <text x="386" y="206" font-size="13" fill="#d6a040" font-weight="bold">+</text>
  <path d="M 384 209 L 448 209" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="234" text-anchor="middle" font-size="9" fill="#888">例：nums[5]=nums[2]+nums[3]=1+2=3</text>

  <!-- ===== Dependency arrows from array to rules ===== -->
  <path d="M 124 110 L 124 138" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 244 110 L 360 138" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Insight box ===== -->
  <rect x="30" y="262" width="500" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="282" font-size="12" fill="#b85450" font-weight="bold">关键洞察</text>
  <text x="48" y="302" font-size="11" fill="#555">• 递推式只依赖更小下标（j/2、j/2+1 都 &lt; j），</text>
  <text x="58" y="318" font-size="11" fill="#555">  故从 j=2 起一趟正向扫描即可填满整表。</text>
  <text x="48" y="338" font-size="11" fill="#555">• 不必按题面「枚举 i 再写 2i、2i+1」两路分支，</text>
  <text x="58" y="354" font-size="11" fill="#555">  直接按目标下标 j 走、用奇偶分流更简洁。</text>
  <text x="48" y="372" font-size="11" fill="#b85450" font-weight="bold">• 边填边维护 max，省去第二趟扫描。</text>
</svg>
