<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：初始化 + n−k 次平移</text>

  <!-- start -->
  <ellipse cx="310" cy="62" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="67" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 310 80 L 310 94" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- init window -->
  <rect x="190" y="96" width="240" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">建立首个窗口 [0, k−1]</text>
  <text x="310" y="137" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">入窗 k 个元素，维护 freq / distinct / sum</text>
  <path d="M 310 148 L 310 158" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- diamond 1: distinct >= m ? -->
  <polygon points="310,160 408,192 310,224 212,192" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="197" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">distinct ≥ m ?</text>

  <!-- yes -> update ans -->
  <path d="M 408 192 L 440 192" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="424" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="442" y="170" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="517" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = max(ans, sum)</text>
  <!-- ans box back to diamond 2 -->
  <path d="M 517 214 L 517 274 L 410 274" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- no -> down -->
  <path d="M 310 224 L 310 238" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="320" y="236" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">否</text>

  <!-- diamond 2: i < n ? -->
  <polygon points="310,240 404,274 310,308 216,274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="272" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">还有元素未入窗</text>
  <text x="310" y="288" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">（i &lt; n）？</text>

  <!-- yes -> slide update box (left) -->
  <path d="M 216 274 L 184 274" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="202" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="26" y="248" width="156" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="104" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i] 入窗</text>
  <text x="104" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i−k] 出窗</text>
  <text x="104" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">更新三份状态，i++</text>

  <!-- loop back to diamond 1 -->
  <path d="M 104 248 L 104 192 L 204 192" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="108" y="184" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">平移完毕，重新判定</text>

  <!-- no -> return -->
  <path d="M 310 308 L 310 324" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">否</text>
  <rect x="222" y="326" width="176" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="345" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="310" y="363" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（从未合法时 ans = 0）</text>

  <!-- bottom note -->
  <text x="310" y="398" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每步一出一进共 O(1)，出窗位置恒为 i − k，总时间 O(n)</text>
</svg>
