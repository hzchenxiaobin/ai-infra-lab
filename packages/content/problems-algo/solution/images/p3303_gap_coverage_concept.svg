<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">双向覆盖：前缀从左盖，后缀从右盖，空隙 ≤ 1 ⟹ 一刀可修</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">以 s = "abcdefg"、pattern = "bcdffg"、窗口起点 i = 1 为例</text>

  <!-- 覆盖括号（s 行上方） -->
  <path d="M 114 68 L 114 62 L 244 62 L 244 68" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="179" y="56" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">pre[1] = 3</text>
  <path d="M 290 68 L 290 62 L 376 62 L 376 68" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="333" y="56" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">suf[6] = 2</text>

  <!-- 空隙标注 -->
  <ellipse cx="267" cy="89" rx="28" ry="23" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="390" y="46" width="122" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="451" y="60" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">s[4]='e' ≠ pattern[3]='f'</text>
  <text x="451" y="75" text-anchor="middle" font-size="9.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">空隙恰 1 格，改它！</text>
  <path d="M 390 70 C 355 78, 320 82, 298 85" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- s 行 -->
  <text x="58" y="93" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="70" y="72" width="42" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="114" y="72" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="72" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="202" y="72" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="72" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="290" y="72" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="334" y="72" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="91" y="93" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">a</text>
  <text x="135" y="93" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="179" y="93" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="223" y="93" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="267" y="93" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="311" y="93" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">f</text>
  <text x="355" y="93" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">g</text>

  <!-- 匹配标记行 -->
  <text x="135" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="179" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="223" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="267" y="125" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="311" y="124" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">✓</text>
  <text x="355" y="124" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">✓</text>

  <!-- pattern 行（与窗口对齐） -->
  <text x="58" y="153" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">pattern</text>
  <rect x="114" y="132" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="132" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="202" y="132" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="132" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="290" y="132" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="334" y="132" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="153" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="179" y="153" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="223" y="153" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="267" y="153" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">f</text>
  <text x="311" y="153" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">f</text>
  <text x="355" y="153" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">g</text>

  <!-- 下标行 -->
  <text x="91" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="135" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="179" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="223" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="267" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="311" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="355" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>

  <!-- 窗口括号 -->
  <path d="M 114 192 L 114 186 L 376 186 L 376 192" fill="none" stroke="#a07830" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="245" y="205" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">窗口 s[1..6]：长度必须恰为 m = 6 —— 修改字符不改变长度</text>

  <!-- 判定公式条 -->
  <rect x="70" y="212" width="380" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="229" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">覆盖区逐位精确相等 ⟹ 失配必落空隙；g = m−L1−L2 = 6−3−2 = 1 ≤ 1</text>

  <!-- 三张说明卡 -->
  <rect x="36" y="250" width="146" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="109" y="268" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">pre[i]：前缀覆盖</text>
  <text x="109" y="284" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">s[i:] 配 pattern 前缀</text>
  <text x="109" y="297" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">的最长长度（≤ m）</text>
  <text x="109" y="314" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">t1 = pattern#s 跑 Z</text>
  <text x="109" y="327" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">pre[i] = z1[m+1+i]</text>

  <rect x="192" y="250" width="146" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="268" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">suf[i]：后缀覆盖</text>
  <text x="265" y="284" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">以 s[i] 结尾配 pattern</text>
  <text x="265" y="297" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">后缀的最长长度（≤ m）</text>
  <text x="265" y="314" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">双翻转后同招：</text>
  <text x="265" y="327" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">t2 = rev(p)#rev(s) 跑 Z</text>

  <rect x="348" y="250" width="136" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="268" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">窗口判定</text>
  <text x="416" y="286" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">L1 + L2 ≥ m − 1</text>
  <text x="416" y="301" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">⟺ 空隙 ≤ 1</text>
  <text x="416" y="316" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">⟺ 至多一个错配</text>
  <text x="416" y="329" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">（含全配与 m=1 的情形）</text>

  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">Z 函数 z[i]：t[i:] 与 t 自身前缀的最长公共前缀长度，一趟 O(|t|) 全求出</text>
</svg>
