<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：tops=[2,1,2,4,2,2], bottoms=[5,2,6,2,3,2]</text>

  <!-- ===== Panel A: candidate x = 2 ===== -->
  <text x="40" y="52" font-size="12" fill="#b85450" font-weight="bold">候选 x = 2 (= tops[0])：</text>
  <text x="220" y="52" font-size="10" fill="#888">绿色=该位已是 2，橙色“转”=需旋转</text>

  <!-- column headers -->
  <text x="44" y="74" text-anchor="middle" font-size="10" fill="#888">i</text>
  <text x="100" y="74" text-anchor="middle" font-size="10" fill="#888">top / bot</text>
  <text x="220" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">上排全=2 需转?</text>
  <text x="360" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">下排全=2 需转?</text>

  <line x1="24" y1="80" x2="516" y2="80" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row i=0 : top=2, bot=5 -->
  <text x="44" y="100" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="84" y="88" width="32" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="84" y="104" width="32" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="220" y="106" text-anchor="middle" font-size="11" fill="#999">— (已是2)</text>
  <text x="360" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">转</text>

  <!-- row i=1 : top=1, bot=2 -->
  <text x="44" y="132" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="84" y="120" width="32" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="84" y="136" width="32" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="220" y="138" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">转</text>
  <text x="360" y="138" text-anchor="middle" font-size="11" fill="#999">— (已是2)</text>

  <!-- row i=2 : top=2, bot=6 -->
  <text x="44" y="164" text-anchor="middle" font-size="11" fill="#999">2</text>
  <rect x="84" y="152" width="32" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="84" y="168" width="32" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="220" y="170" text-anchor="middle" font-size="11" fill="#999">— (已是2)</text>
  <text x="360" y="170" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">转</text>

  <!-- row i=3 : top=4, bot=2 -->
  <text x="44" y="196" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="84" y="184" width="32" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="84" y="200" width="32" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="220" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">转</text>
  <text x="360" y="202" text-anchor="middle" font-size="11" fill="#999">— (已是2)</text>

  <!-- row i=4 : top=2, bot=3 -->
  <text x="44" y="228" text-anchor="middle" font-size="11" fill="#999">4</text>
  <rect x="84" y="216" width="32" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="84" y="232" width="32" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="220" y="234" text-anchor="middle" font-size="11" fill="#999">— (已是2)</text>
  <text x="360" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">转</text>

  <!-- row i=5 : top=2, bot=2 -->
  <text x="44" y="260" text-anchor="middle" font-size="11" fill="#999">5</text>
  <rect x="84" y="248" width="32" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="260" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="84" y="264" width="32" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="220" y="266" text-anchor="middle" font-size="11" fill="#999">— (已是2)</text>
  <text x="360" y="266" text-anchor="middle" font-size="11" fill="#999">— (已是2)</text>

  <line x1="24" y1="284" x2="516" y2="284" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- tally -->
  <text x="44" y="304" font-size="11" fill="#444" font-weight="bold">统计</text>
  <text x="220" y="304" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">topRot = 2</text>
  <text x="360" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">botRot = 3</text>
  <rect x="440" y="290" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="478" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">min = 2 ✓</text>

  <!-- ===== Panel B: candidate x = 5 ===== -->
  <text x="40" y="340" font-size="12" fill="#b85450" font-weight="bold">候选 x = 5 (= bottoms[0])：</text>

  <text x="44" y="368" text-anchor="middle" font-size="11" fill="#999">i=0</text>
  <rect x="84" y="356" width="32" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="84" y="372" width="32" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="384" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="220" y="374" font-size="11" fill="#888">含 5 ✓</text>

  <text x="44" y="400" text-anchor="middle" font-size="11" fill="#999">i=1</text>
  <rect x="84" y="388" width="32" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="400" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="84" y="404" width="32" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="220" y="406" font-size="11" fill="#b85450" font-weight="bold">都不含 5 ✗ → 不可行，跳过</text>

  <!-- final answer -->
  <rect x="320" y="388" width="196" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="418" y="408" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">答案 = min(2, 不可行) = 2</text>
</svg>
