<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后相邻配对，取偶数下标</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">绿格 = 取（每对的 min），橙格 = 弃（每对较大者）</text>

  <!-- legend -->
  <rect x="372" y="34" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="390" y="45" font-size="10" fill="#555">取</text>
  <rect x="420" y="34" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="438" y="45" font-size="10" fill="#555">弃</text>

  <!-- sorted label -->
  <text x="40" y="92" font-size="11.5" fill="#446688" font-weight="bold">排序后</text>
  <text x="40" y="108" font-size="10" fill="#888">升序</text>

  <!-- 6 cells: [1, 2, 2, 5, 6, 6] -->
  <!-- index 0 (val 1) kept -->
  <rect x="138" y="72" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- index 1 (val 2) discarded -->
  <rect x="186" y="72" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- index 2 (val 2) kept -->
  <rect x="234" y="72" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="256" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- index 3 (val 5) discarded -->
  <rect x="282" y="72" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="304" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <!-- index 4 (val 6) kept -->
  <rect x="330" y="72" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  <!-- index 5 (val 6) discarded -->
  <rect x="378" y="72" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>

  <!-- index ticks -->
  <text x="160" y="120" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="208" y="120" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="256" y="120" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="304" y="120" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="352" y="120" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="400" y="120" text-anchor="middle" font-size="9" fill="#999">5</text>

  <!-- pair brackets (below cells, opening downward) -->
  <path d="M 140 128 L 140 134 L 228 134 L 228 128" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="184" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min = 1</text>

  <path d="M 236 128 L 236 134 L 324 134 L 324 128" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min = 2</text>

  <path d="M 332 128 L 332 134 L 420 134 L 420 128" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="376" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min = 6</text>

  <!-- sum formula -->
  <rect x="138" y="168" width="284" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">sum = nums[0] + nums[2] + nums[4] = 9</text>

  <!-- insight box -->
  <rect x="30" y="218" width="500" height="142" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">为什么「相邻配对」最优？—— 逆向看「丢弃」</text>
  <text x="48" y="270" font-size="11.5" fill="#444">① 每对 (a, b) 只保留较小者 a，较大者 b 被丢弃。</text>
  <text x="48" y="290" font-size="11.5" fill="#444">② sum(min) = 总和 − sum(丢弃) ⟹ 最大化 sum(min) 即最小化 sum(丢弃)。</text>
  <text x="48" y="310" font-size="11.5" fill="#444">③ 最大值 a₂ₙ 不可能成为 min ⟹ 必在丢弃集中。</text>
  <text x="48" y="330" font-size="11.5" fill="#444">④ 把它与次大 a₂ₙ₋₁ 配对，保住次大；对剩余递归 → 相邻配对。</text>
  <text x="48" y="350" font-size="11.5" fill="#b85450" font-weight="bold">结论：丢弃奇数下标，保留偶数下标 {a₁, a₃, …, a₂ₙ₋₁}。</text>
</svg>
