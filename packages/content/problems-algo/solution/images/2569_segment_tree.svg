<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">线段树 + 懒标记：区间翻转维护 cnt1</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">每个节点存 cnt1（1 的个数）与 len（区间长度）；翻转即 cnt1 ← len − cnt1</text>

  <!-- tree for nums1 = [1,0,1,1] (n=4 full tree) -->
  <!-- root -->
  <rect x="270" y="78" width="100" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt1=3  len=4</text>
  <text x="320" y="113" text-anchor="middle" font-size="9" fill="#888">[0,3]</text>

  <!-- level 2 left -->
  <rect x="150" y="158" width="100" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt1=1  len=2</text>
  <text x="200" y="193" text-anchor="middle" font-size="9" fill="#888">[0,1]</text>

  <!-- level 2 right -->
  <rect x="390" y="158" width="100" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt1=2  len=2</text>
  <text x="440" y="193" text-anchor="middle" font-size="9" fill="#888">[2,3]</text>

  <path d="M 300 118 L 220 156" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 340 118 L 420 156" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- leaves -->
  <rect x="80" y="238" width="80" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="261" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="120" y="287" text-anchor="middle" font-size="9" fill="#888">i=0</text>

  <rect x="200" y="238" width="80" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="261" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="240" y="287" text-anchor="middle" font-size="9" fill="#888">i=1</text>

  <rect x="320" y="238" width="80" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="261" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="360" y="287" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <rect x="440" y="238" width="80" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="261" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="480" y="287" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <path d="M 180 198 L 140 236" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 220 198 L 260 236" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 420 198 L 360 236" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 460 198 L 480 236" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- flip demo arrow -->
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">↓ 翻转区间 [0,1]：cnt1 = len − cnt1</text>

  <!-- after flip -->
  <rect x="150" y="330" width="100" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt1=1  len=2</text>
  <text x="200" y="365" text-anchor="middle" font-size="9" fill="#b85450">rev=1（懒标记）</text>

  <rect x="270" y="330" width="100" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt1=3  len=4</text>
  <text x="320" y="365" text-anchor="middle" font-size="9" fill="#888">根（pushup 汇总）</text>

  <!-- leaves after flip -->
  <rect x="80" y="400" width="80" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="120" y="421" text-anchor="middle" font-size="12" fill="#888">1→0</text>

  <rect x="200" y="400" width="80" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="240" y="421" text-anchor="middle" font-size="12" fill="#888">0→1</text>

  <text x="320" y="421" text-anchor="middle" font-size="10" fill="#888">（叶子尚未更新，lazy 待 pushdown 时再翻）</text>
  <path d="M 200 370 Q 160 386 120 398" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 370 Q 220 386 240 398" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
