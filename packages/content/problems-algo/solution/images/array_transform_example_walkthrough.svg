<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#d6a040" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1, 6, 3, 4, 3, 5]</text>

  <!-- ==================== Day 0 ==================== -->
  <text x="30" y="48" font-size="11" fill="#888" font-weight="bold">Day 0</text>

  <!-- Day 0 cells: [1, 6, 3, 4, 3, 5] -->
  <rect x="111" y="54" width="48" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="75" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" font-family="monospace">1</text>

  <rect x="165" y="54" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">6</text>

  <rect x="219" y="54" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="243" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">3</text>

  <rect x="273" y="54" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">4</text>

  <rect x="327" y="54" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">3</text>

  <rect x="381" y="54" width="48" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="75" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" font-family="monospace">5</text>

  <!-- Day 0 change annotations -->
  <text x="135" y="98" text-anchor="middle" font-size="9" fill="#aaa">—</text>
  <text x="189" y="98" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↓1</text>
  <text x="243" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑1</text>
  <text x="297" y="98" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↓1</text>
  <text x="351" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑1</text>
  <text x="405" y="98" text-anchor="middle" font-size="9" fill="#aaa">—</text>

  <!-- Arrow Day 0 → Day 1 -->
  <path d="M 270 104 L 270 126" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="284" y="118" font-size="9" fill="#d6a040">4 处变化</text>

  <!-- ==================== Day 1 ==================== -->
  <text x="30" y="142" font-size="11" fill="#888" font-weight="bold">Day 1</text>

  <!-- Day 1 cells: [1, 5, 4, 3, 4, 5] -->
  <rect x="111" y="148" width="48" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="169" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" font-family="monospace">1</text>

  <rect x="165" y="148" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="169" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">5</text>

  <rect x="219" y="148" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="169" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">4</text>

  <rect x="273" y="148" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="169" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">3</text>

  <rect x="327" y="148" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="169" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">4</text>

  <rect x="381" y="148" width="48" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="169" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" font-family="monospace">5</text>

  <!-- Day 1 change annotations -->
  <text x="135" y="192" text-anchor="middle" font-size="9" fill="#aaa">—</text>
  <text x="189" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↓1</text>
  <text x="243" y="192" text-anchor="middle" font-size="9" fill="#aaa">—</text>
  <text x="297" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑1</text>
  <text x="351" y="192" text-anchor="middle" font-size="9" fill="#aaa">—</text>
  <text x="405" y="192" text-anchor="middle" font-size="9" fill="#aaa">—</text>

  <!-- Arrow Day 1 → Day 2 -->
  <path d="M 270 198 L 270 220" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="284" y="212" font-size="9" fill="#d6a040">2 处变化</text>

  <!-- ==================== Day 2 ==================== -->
  <text x="30" y="236" font-size="11" fill="#888" font-weight="bold">Day 2</text>

  <!-- Day 2 cells: [1, 4, 4, 4, 4, 5] — all stable -->
  <rect x="111" y="242" width="48" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="263" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" font-family="monospace">1</text>

  <rect x="165" y="242" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="263" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">4</text>

  <rect x="219" y="242" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="263" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">4</text>

  <rect x="273" y="242" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="263" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">4</text>

  <rect x="327" y="242" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="263" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">4</text>

  <rect x="381" y="242" width="48" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="263" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" font-family="monospace">5</text>

  <!-- Day 2: no changes -->
  <text x="135" y="286" text-anchor="middle" font-size="9" fill="#aaa">—</text>
  <text x="189" y="286" text-anchor="middle" font-size="9" fill="#aaa">—</text>
  <text x="243" y="286" text-anchor="middle" font-size="9" fill="#aaa">—</text>
  <text x="297" y="286" text-anchor="middle" font-size="9" fill="#aaa">—</text>
  <text x="351" y="286" text-anchor="middle" font-size="9" fill="#aaa">—</text>
  <text x="405" y="286" text-anchor="middle" font-size="9" fill="#aaa">—</text>

  <!-- Stable marker -->
  <rect x="180" y="294" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 处变化 → 收敛！返回</text>

  <!-- Legend -->
  <rect x="30" y="332" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="343" font-size="9.5" fill="#666">局部极大 ↓1</text>
  <rect x="130" y="332" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="150" y="343" font-size="9.5" fill="#666">局部极小 ↑1</text>
  <rect x="230" y="332" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="250" y="343" font-size="9.5" fill="#666">无变化</text>
  <rect x="310" y="332" width="14" height="14" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="330" y="343" font-size="9.5" fill="#666">边界固定</text>

  <!-- Insight box -->
  <rect x="30" y="354" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="371" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">Day 0: 4 变 → Day 1: 2 变 → Day 2: 0 变（共 2 天收敛）</text>
  <text x="270" y="385" text-anchor="middle" font-size="10" fill="#666">变化数单调递减 → 每天局部极值「磨平」至少一处 → 必然收敛</text>
</svg>
