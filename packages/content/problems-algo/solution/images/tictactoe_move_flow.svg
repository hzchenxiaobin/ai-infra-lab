<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.3"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">move(row, col, player) 算法流程</text>
  <path d="M 250 44 Q 430 52 610 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: determine delta -->
  <g filter="url(#sk)"><rect x="300" y="66" width="260" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="430" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">step 1：定方向</text>
  <text x="430" y="106" text-anchor="middle" font-size="11" fill="#555">delta = (player == 1) ? +1 : −1</text>

  <!-- arrow down -->
  <path d="M 430 120 L 430 138" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: update rows[row] -->
  <g filter="url(#sk)"><rect x="280" y="146" width="300" height="56" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="430" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">step 2：行计数器 rows[row] += delta</text>
  <text x="430" y="188" text-anchor="middle" font-size="11" fill="#555">若 |rows[row]| == n → 返回 player 胜</text>

  <path d="M 430 206 L 430 224" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3: update cols[col] -->
  <g filter="url(#sk)"><rect x="280" y="232" width="300" height="56" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="430" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">step 3：列计数器 cols[col] += delta</text>
  <text x="430" y="274" text-anchor="middle" font-size="11" fill="#555">若 |cols[col]| == n → 返回 player 胜</text>

  <path d="M 430 292 L 430 310" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 4: diagonal decision (diamond) -->
  <g filter="url(#sk)"><polygon points="430,316 560,366 430,416 300,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="430" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">row == col ?</text>
  <text x="430" y="376" text-anchor="middle" font-size="10.5" fill="#7a5415">（在主对角线上）</text>

  <!-- Yes branch: update diag -->
  <path d="M 300 366 L 200 366 L 200 410" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="358" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="100" y="416" width="200" height="56" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="200" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">diag += delta</text>
  <text x="200" y="458" text-anchor="middle" font-size="10.5" fill="#555">|diag| == n → 胜</text>

  <!-- Step 5: anti-diagonal decision (diamond) -->
  <path d="M 430 416 L 430 440" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><polygon points="430,446 560,492 430,538 300,492" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="430" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">row+col == n−1 ?</text>
  <text x="430" y="502" text-anchor="middle" font-size="10.5" fill="#7a5415">（在副对角线上）</text>

  <!-- No branch skips to end -->
  <path d="M 560 492 L 660 492 L 660 366 L 560 366" stroke="#5a5a5a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="610" y="484" text-anchor="middle" font-size="10.5" fill="#888">否</text>

  <!-- Yes branch: update antiDiag -->
  <path d="M 300 492 L 200 492 L 200 488" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="484" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- antiDiag box (positioned below diag box) -->
  <g filter="url(#sk)"><rect x="100" y="488" width="200" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="200" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">antiDiag += delta</text>
  <text x="200" y="530" text-anchor="middle" font-size="10.5" fill="#555">|antiDiag| == n → 胜</text>

  <!-- ===== Right side: legend / return logic ===== -->
  <g filter="url(#sk)"><rect x="600" y="146" width="240" height="220" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="720" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">返回规则</text>
  <text x="616" y="196" font-size="11" fill="#555">● 任一计数器 |值| 达到 n</text>
  <text x="624" y="214" font-size="11" fill="#555">→ 返回 player（获胜）</text>
  <text x="616" y="240" font-size="11" fill="#555">● 四步都未触发</text>
  <text x="624" y="258" font-size="11" fill="#555">→ 返回 0（无人获胜）</text>
  <text x="616" y="284" font-size="11" fill="#555">● |值| == n 的含义：</text>
  <text x="624" y="302" font-size="10.5" fill="#888">该方向上全为同一玩家</text>
  <text x="624" y="318" font-size="10.5" fill="#888">的 n 个棋子（连成线）</text>
  <text x="616" y="344" font-size="10.5" fill="#b03a3a" font-weight="bold">最多 4 次加法 + 4 次比较</text>
  <text x="616" y="358" font-size="10.5" fill="#888">每次 move 都是 O(1)</text>

  <!-- foot note -->
  <text x="430" y="552" text-anchor="middle" font-size="10.5" fill="#888">注：题目保证落子合法（空格才落），故无需查重；一旦有人获胜后续不再调用 move</text>
</svg>
