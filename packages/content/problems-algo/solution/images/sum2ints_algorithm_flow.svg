<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：位运算模拟加法</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="60" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="260" y1="80" x2="260" y2="96" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: b != 0 ? -->
  <polygon points="260,100 348,150 260,200 172,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">b ≠ 0 ?</text>
  <text x="260" y="163" text-anchor="middle" font-size="10.5" fill="#888">还有进位未处理</text>

  <!-- Yes branch: down -->
  <text x="272" y="216" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="260" y1="200" x2="260" y2="220" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- carry = (a & b) << 1 ; a = a ^ b ; b = carry -->
  <rect x="80" y="224" width="360" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">carry = (a &amp; b) &lt;&lt; 1   // 算新进位</text>
  <text x="260" y="264" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">a = a ⊕ b            // 更新本位和</text>
  <text x="260" y="276" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">b = carry             // 进位交给下一轮</text>

  <!-- loop back to decision -->
  <line x1="440" y1="252" x2="470" y2="252" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="412" y="132" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="454" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">回判</text>
  <path d="M 470 252 Q 470 150 348 150" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch: left to return -->
  <text x="150" y="144" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <path d="M 172 150 Q 90 150 90 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return a -->
  <rect x="20" y="242" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="264" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return a</text>

  <line x1="90" y1="276" x2="90" y2="302" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="90" cy="322" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="327" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- bottom note 1 -->
  <rect x="160" y="306" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="330" y="325" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">循环不变量：每轮 (a,b) 之和 = 原 a + b</text>
  <text x="330" y="341" text-anchor="middle" font-size="11" fill="#446688">进位每轮左移一位，32 轮内必归零</text>

  <!-- complexity tag -->
  <rect x="160" y="360" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="382" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">时间 O(32) = O(1)，空间 O(1)</text>

  <!-- language caveat -->
  <rect x="40" y="406" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="425" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">⚠ Python 需 &amp; 0xFFFFFFFF 截 32 位防死循环</text>
  <text x="270" y="440" text-anchor="middle" font-size="11" fill="#d6a040">C++ 进位转 unsigned int 避免左移 UB</text>
</svg>
