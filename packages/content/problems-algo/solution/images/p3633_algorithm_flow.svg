<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：两个方向对称各扫一遍</text>

  <rect x="210" y="38" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 240 68 L 140 96" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 280 68 L 380 96" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="140" y="90" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">方向一：先陆后水</text>
  <text x="380" y="90" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">方向二：先水后陆</text>

  <!-- 左列 -->
  <rect x="40" y="98" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 扫陆地：E* = min(lStart[i] + lDur[i])</text>
  <text x="140" y="134" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">第一段贪心取最早结束</text>

  <path d="M 140 144 L 140 162" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="164" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="183" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 扫水上：best1 = min over j</text>
  <text x="140" y="200" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">max(E*, wStart[j]) + wDur[j]</text>

  <!-- 右列 -->
  <rect x="280" y="98" width="200" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="380" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 扫水上：W* = min(wStart[j] + wDur[j])</text>
  <text x="380" y="134" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">第一段贪心取最早结束</text>

  <path d="M 380 144 L 380 162" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="280" y="164" width="200" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="380" y="183" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">④ 扫陆地：best2 = min over i</text>
  <text x="380" y="200" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">max(W*, lStart[i]) + lDur[i]</text>

  <path d="M 140 210 C 140 236 200 244 248 250" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 380 210 C 380 236 320 244 272 250" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="150" y="252" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = min(best1, best2)</text>

  <path d="M 260 292 L 260 308" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="210" y="310" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回</text>

  <text x="40" y="340" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n+m)，空间 O(1)</text>
</svg>
