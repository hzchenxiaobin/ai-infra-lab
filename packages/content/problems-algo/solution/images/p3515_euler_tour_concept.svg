<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="384" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">欧拉序拍平：改一条边 = 子树区间整体加 Δ</text>
  <text x="260" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">树路径唯一 ⇒ 最短路 = 根到 x 的边权和</text>

  <!-- 更新注释 -->
  <text x="245" y="62" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">改边 (2,3)：Δ = +2</text>
  <path d="M 243 70 Q 238 92 231 112" fill="none" stroke="#b85450" stroke-width="1.5"
        marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 树的边 -->
  <line x1="110" y1="88" x2="170" y2="101" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="200" y1="113" x2="260" y2="126" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="290" y1="138" x2="350" y2="151" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="82" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">w=2</text>
  <text x="226" y="138" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">w: 1→3</text>
  <text x="322" y="133" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">w=5</text>

  <!-- 子树虚线框 -->
  <rect x="244" y="96" width="148" height="88" rx="12" fill="none" stroke="#d6a040"
        stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="452" y="148" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">child=3 的子树</text>
  <path d="M 412 146 L 396 148" fill="none" stroke="#d6a040" stroke-width="1.2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- tin 徽章 -->
  <rect x="68" y="50" width="54" height="17" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="62" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">tin=1</text>
  <rect x="158" y="75" width="54" height="17" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="87" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">tin=2</text>
  <rect x="248" y="100" width="54" height="17" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="275" y="112" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">tin=3</text>
  <rect x="338" y="125" width="54" height="17" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="365" y="137" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">tin=4</text>

  <!-- 树的节点 -->
  <circle cx="95" cy="82" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="87" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="185" cy="107" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="275" cy="132" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="275" y="137" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="365" cy="157" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="365" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- 节点 → 欧拉序数组 的映射箭头 -->
  <path d="M 95 97 L 160 242" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="4 3"
        opacity="0.55" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 185 122 L 224 242" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="4 3"
        opacity="0.55" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 275 147 L 288 242" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="4 3"
        opacity="0.55" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 365 172 L 352 242" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="4 3"
        opacity="0.55" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 欧拉序数组（累计偏移 Δ） -->
  <text x="112" y="270" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">Δ</text>
  <rect x="136" y="246" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="270" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">0</text>
  <rect x="200" y="246" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="270" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">0</text>
  <rect x="264" y="246" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="270" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">+2</text>
  <rect x="328" y="246" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="356" y="270" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">+2</text>
  <text x="164" y="299" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">tin=1</text>
  <text x="228" y="299" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">tin=2</text>
  <text x="292" y="299" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">tin=3</text>
  <text x="356" y="299" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">tin=4</text>

  <!-- 子树区间花括号 -->
  <path d="M 264 303 L 264 308 L 384 308 L 384 303" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="324" y="324" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">子树(3) = 连续区间 [tin, tin+size−1]</text>

  <!-- 公式 -->
  <rect x="70" y="336" width="380" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">answer(x) = dist₀[x] + Δ[tin[x]]</text>
</svg>
