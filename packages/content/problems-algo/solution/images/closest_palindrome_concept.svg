<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：最近回文数必出自 5 个候选</text>

  <!-- Row 1: n = 12345, prefix highlighted -->
  <text x="44" y="78" font-size="12" fill="#888">n =</text>
  <rect x="80" y="58" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="118" y="58" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="156" y="58" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="194" y="58" width="38" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="213" y="79" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">4</text>
  <rect x="232" y="58" width="38" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="251" y="79" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">5</text>

  <text x="137" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">前缀 prefix（镜像源）</text>
  <text x="222" y="108" text-anchor="middle" font-size="10" fill="#999">待覆盖</text>
  <line x1="194" y1="50" x2="194" y2="98" stroke="#888" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- Mirror label -->
  <text x="330" y="74" font-size="11" fill="#4a7a3a" font-weight="bold">镜像 ↓</text>
  <text x="330" y="88" font-size="9" fill="#888">p + reverse(p[:k//2])</text>

  <!-- Row 2: prefix-1 = 122 -> 12221 (orange) -->
  <text x="44" y="155" font-size="11" fill="#d6a040">prefix−1</text>
  <rect x="90" y="135" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="135" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="135" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="135" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="210" y="135" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="255" y="154" font-size="11" fill="#d6a040">= 12221</text>

  <!-- Row 3: prefix = 123 -> 12321 (green) -->
  <text x="44" y="200" font-size="11" fill="#4a7a3a">prefix</text>
  <rect x="90" y="180" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="180" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="180" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="180" y="180" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="210" y="180" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="255" y="199" font-size="11" fill="#4a7a3a">= 12321（自身镜像）</text>

  <!-- Row 4: prefix+1 = 124 -> 12421 (blue) -->
  <text x="44" y="245" font-size="11" fill="#446688">prefix+1</text>
  <rect x="90" y="225" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="225" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="225" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="180" y="225" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="210" y="225" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="255" y="244" font-size="11" fill="#446688">= 12421</text>

  <!-- Divider -->
  <line x1="60" y1="275" x2="500" y2="275" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="10" fill="#999">— 不同位数的边界候选 —</text>

  <!-- Row 5: boundary 10^(k-1)-1 = 9999 (red) -->
  <text x="44" y="307" font-size="10" fill="#b85450">10^(k−1)−1</text>
  <rect x="110" y="288" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="140" y="288" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="170" y="288" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="200" y="288" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="245" y="307" font-size="10" fill="#b85450">短一位全 9</text>

  <!-- Row 6: boundary 10^k+1 = 100001 (red) -->
  <text x="44" y="352" font-size="10" fill="#b85450">10^k+1</text>
  <rect x="90" y="333" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="352" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="333" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="352" text-anchor="middle" font-size="10" fill="#999">0</text>
  <rect x="150" y="333" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="352" text-anchor="middle" font-size="10" fill="#999">0</text>
  <rect x="180" y="333" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="352" text-anchor="middle" font-size="10" fill="#999">0</text>
  <rect x="210" y="333" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="225" y="352" text-anchor="middle" font-size="10" fill="#999">0</text>
  <rect x="240" y="333" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="352" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="285" y="352" font-size="10" fill="#b85450">长一位 10…01</text>

  <!-- Summary box -->
  <rect x="60" y="380" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">5 候选 → 排除自身 → |差| 最小 → 平手取较小</text>
</svg>
