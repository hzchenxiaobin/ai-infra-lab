<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按空格切段，每个单词原地反转</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">空格位置不变，仅词内字符顺序翻转</text>

  <!-- 原始串：Let's take LeetCode contest -->
  <text x="40" y="78" font-size="12" fill="#888">原始:</text>

  <!-- Let's -->
  <rect x="90" y="62" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">L</text>
  <rect x="132" y="62" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <rect x="174" y="62" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t</text>
  <rect x="216" y="62" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">'</text>
  <rect x="258" y="62" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s</text>

  <!-- space -->
  <rect x="300" y="62" width="18" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="82" text-anchor="middle" font-size="10" fill="#999">␣</text>

  <!-- take -->
  <rect x="318" y="62" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t</text>
  <rect x="360" y="62" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="381" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="402" y="62" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="423" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k</text>
  <rect x="444" y="62" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>

  <!-- word brace 1 -->
  <path d="M 90 100 Q 90 108 96 108 L 294 108 Q 300 108 300 100" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="195" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">单词 1：Let's</text>

  <!-- word brace 2 -->
  <path d="M 318 100 Q 318 108 324 108 L 480 108 Q 486 108 486 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="402" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">单词 2：take</text>

  <!-- 反转箭头 -->
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#b85450">↓ 每个单词内部对撞双指针反转</text>

  <!-- 结果串 -->
  <text x="40" y="184" font-size="12" fill="#888">结果:</text>

  <!-- s'teL -->
  <rect x="90" y="168" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="111" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s</text>
  <rect x="132" y="168" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="153" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">'</text>
  <rect x="174" y="168" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t</text>
  <rect x="216" y="168" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="237" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <rect x="258" y="168" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="279" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">L</text>

  <!-- space -->
  <rect x="300" y="168" width="18" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="188" text-anchor="middle" font-size="10" fill="#999">␣</text>

  <!-- ekat -->
  <rect x="318" y="168" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="339" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <rect x="360" y="168" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="381" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k</text>
  <rect x="402" y="168" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="423" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="444" y="168" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="465" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t</text>

  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">输出："s'teL ekat edoCteeL tsetnoc"</text>

  <!-- 关键点说明 -->
  <rect x="30" y="246" width="500" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="42" y="266" font-size="11" fill="#8a6a20" font-weight="bold">关键：空格是「分隔符」也是「终止信号」</text>
  <text x="42" y="284" font-size="10" fill="#666">• 每个单词 = 一段以空格结尾的连续非空格字符</text>
  <text x="42" y="300" font-size="10" fill="#666">• 词内反转套用 344 的对撞双指针：left 指词首，right 指词尾</text>
  <text x="42" y="316" font-size="10" fill="#666">• 空格本身不参与反转，位置完全保持原样</text>
  <text x="42" y="332" font-size="10" fill="#666">• 题目保证无前导/尾随空格、词间单空格 → 无需清理</text>
</svg>
