<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "abacb"，k = 2（外层 left，坏则扩窗）</text>

  <!-- 表格 -->
  <rect x="20" y="50" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="45" y="69" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">left</text>
  <rect x="70" y="50" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="69" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">扩张动作（直到恰好合法）</text>
  <rect x="230" y="50" width="105" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="69" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">收敛窗口</text>
  <rect x="335" y="50" width="45" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="357" y="69" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">over</text>
  <rect x="380" y="50" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="69" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">贡献 n−need</text>
  <rect x="460" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="69" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="20" y="80" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="70" y="80" width="160" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="99" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">入 a、b、a（a 频次达 2）</text>
  <rect x="230" y="80" width="105" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="282" y="99" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">[0,2]「aba」</text>
  <rect x="335" y="80" width="45" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="357" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="80" width="80" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="99" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5 − 2 = 3</text>
  <rect x="460" y="80" width="40" height="30" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="480" y="99" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">3</text>

  <rect x="20" y="110" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="110" width="160" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">入 c、b（b 频次达 2）</text>
  <rect x="230" y="110" width="105" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="282" y="129" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">[1,4]「bacb」</text>
  <rect x="335" y="110" width="45" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="357" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="110" width="80" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="129" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5 − 4 = 1</text>
  <rect x="460" y="110" width="40" height="30" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="480" y="129" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">4</text>

  <rect x="20" y="140" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="70" y="140" width="160" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">right = 5 = n，仍无达标</text>
  <rect x="230" y="140" width="105" height="30" fill="#fce4ec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="282" y="159" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">—（无）</text>
  <rect x="335" y="140" width="45" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="357" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="380" y="140" width="80" height="30" fill="#fce4ec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="159" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">break</text>
  <rect x="460" y="140" width="40" height="30" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="480" y="159" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 合法子串清单 -->
  <text x="30" y="196" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">4 个合法子串 =</text>
  <rect x="130" y="182" width="66" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="163" y="199" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">aba</text>
  <rect x="202" y="182" width="66" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="235" y="199" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">abac</text>
  <rect x="274" y="182" width="72" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="199" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">abacb</text>
  <rect x="352" y="182" width="66" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="385" y="199" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">bacb</text>
  <text x="218" y="228" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">↑ 起点 0、终点 ∈ {2, 3, 4}：一揽子 3 个</text>
  <text x="415" y="228" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">↑ 起点 1、终点 4</text>

  <!-- 底部备注 -->
  <rect x="20" y="244" width="480" height="98" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="264" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">💡 看点</text>
  <text x="34" y="282" font-size="10" fill="#555" filter="url(#rough2)">· need 依次为 2 → 4 → ∞（单调不降），right 指针 5 步走完全程、从不回退</text>
  <text x="34" y="299" font-size="10" fill="#555" filter="url(#rough2)">· 对照：全部子串 15 个 − 合法 4 个 = 11 个「每字符 ≤ 1 次」的子串（方法二的 atMost(1)）</text>
  <text x="34" y="316" font-size="10" fill="#555" filter="url(#rough2)">· k = 1 的 sanity check：单字符窗口即达标，逐轮贡献 5+4+3+2+1 = 15 = 全部子串数</text>
  <text x="34" y="333" font-size="10" fill="#555" filter="url(#rough2)">· 起点 2 出发剩余「acb」攒不够 2 次 → break 提前退出，不影响答案</text>
</svg>
