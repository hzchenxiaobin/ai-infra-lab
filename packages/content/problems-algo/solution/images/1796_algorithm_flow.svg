<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：遍历字符 → 判数字 → 两阈值分派</text>

  <!-- Start: init -->
  <rect x="170" y="46" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">max1 = max2 = −1, i = 0</text>

  <path d="M 260 88 L 260 106" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="372" y="112" font-size="9" fill="#aaa" filter="url(#rough2)">← 循环回跳</text>

  <!-- Decision: i < n ? -->
  <polygon points="260,110 340,150 260,190 180,150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="162" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">是否未遍历完</text>

  <!-- No branch: return -->
  <path d="M 340 150 L 430 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="430" y="130" width="76" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="468" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="468" y="162" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">max2</text>

  <!-- Yes branch: down -->
  <path d="M 260 190 L 260 208" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="204" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: s[i] 是数字? -->
  <polygon points="260,212 340,252 260,292 180,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">isdigit(s[i])?</text>
  <text x="260" y="264" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">d = s[i] − '0'</text>

  <!-- No branch: skip to i++ -->
  <path d="M 340 252 L 400 252 L 400 360" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="246" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Yes branch: down -->
  <path d="M 260 292 L 260 308" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="304" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: d > max1 ? -->
  <polygon points="260,312 340,344 260,376 180,344" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">d &gt; max1 ?</text>
  <text x="260" y="356" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">刷新最大值</text>

  <!-- Yes (left): max2 = max1, max1 = d -->
  <path d="M 180 344 L 120 344" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="338" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="40" y="322" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="80" y="340" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">max2 ← max1</text>
  <text x="80" y="356" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">max1 ← d</text>

  <!-- No (right): down to d > max2 ? -->
  <path d="M 340 344 L 400 344" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Decision: d < max1 and d > max2 ? -->
  <polygon points="440,324 510,344 440,364 410,344" fill="none" stroke="none" filter="url(#rough2)"/>
  <rect x="408" y="322" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="458" y="340" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d &lt; max1</text>
  <text x="458" y="356" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">且 d &gt; max2 ?</text>

  <!-- Yes (down-left): max2 = d -->
  <path d="M 440 366 L 400 380" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="376" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- No (skip, already merged) -->
  <path d="M 470 366 L 470 380" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="376" font-size="9" fill="#888" filter="url(#rough2)">否</text>

  <rect x="350" y="382" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="382" y="402" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">max2 ← d</text>

  <!-- merge to i++ -->
  <path d="M 80 366 L 80 412 L 200 412" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 382 412 L 320 412" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 360 L 260 412" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="200" y="396" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="418" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i += 1</text>

  <!-- loop back arrow: from i++ up to i<n? decision -->
  <path d="M 200 414 L 50 414 L 50 150 L 180 150" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="284" font-size="9" fill="#aaa" filter="url(#rough2)">循环</text>

  <!-- Footer -->
  <text x="260" y="456" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">单遍 O(n) / 哨兵 −1 免去"是否已填"的额外标记</text>
</svg>
