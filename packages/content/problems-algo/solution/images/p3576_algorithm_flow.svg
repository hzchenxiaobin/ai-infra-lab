<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：两个目标各跑一趟贪心，再判预算 k</text>

  <!-- 开始 -->
  <ellipse cx="150" cy="52" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="57" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M150,70 L150,84" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- P1 target=1 -->
  <rect x="48" y="84" width="204" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">target = 1：一趟从左到右贪心</text>
  <text x="150" y="124" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">失配 → 强制操作并右推，得 ops₁</text>

  <path d="M150,136 L150,150" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- P2 target=-1 -->
  <rect x="48" y="150" width="204" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="171" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">target = −1：同一套贪心再跑一次</text>
  <text x="150" y="190" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">得 ops₂（不可达记作 ∞）</text>

  <path d="M150,202 L150,216" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D 判断 -->
  <polygon points="150,216 258,252 150,288 42,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">min(ops₁, ops₂)</text>
  <text x="150" y="266" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">≤ k ?</text>

  <!-- 是：return true -->
  <path d="M258,252 L294,252" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="298" y="230" width="212" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="257" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return true</text>

  <!-- 否：return false -->
  <path d="M150,288 L150,302" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="162" y="300" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="48" y="302" width="204" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="329" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">return false</text>

  <!-- 侧栏：单趟贪心内部 -->
  <rect x="298" y="296" width="212" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="316" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">单趟贪心内部（见左图）</text>
  <text x="404" y="335" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">v == target → 不操作，flipped=False</text>
  <text x="404" y="352" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">失配且非末位 → ops++，右推</text>
  <text x="404" y="369" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">失配且是末位 → 失配数奇，无解</text>
  <text x="404" y="384" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">返回 bool：任一目标达标即可</text>
</svg>
