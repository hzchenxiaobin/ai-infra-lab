<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：正/负长度双状态，遇负数互换</text>

  <!-- 上排：以 i-1 结尾的两个状态 -->
  <text x="60" y="64" font-size="12" fill="#888">以 i-1 结尾（处理 nums[i] 之前）：</text>

  <rect x="70" y="78" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">pos</text>
  <text x="160" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a">正乘积的最长长度</text>

  <rect x="310" y="78" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">neg</text>
  <text x="400" y="114" text-anchor="middle" font-size="10" fill="#b85450">负乘积的最长长度</text>

  <!-- 中间：乘上一个负数 -->
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#444">乘上 nums[i] &lt; 0（负数）→ 正负互换</text>

  <!-- 交叉箭头：pos -> new_neg, neg -> new_pos -->
  <path d="M 160 124 Q 280 160 400 196" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 400 124 Q 280 160 160 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 下排：以 i 结尾（互换后） -->
  <text x="60" y="186" font-size="12" fill="#888">以 i 结尾（处理后）：</text>

  <rect x="70" y="200" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">new pos = neg + 1</text>
  <text x="160" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a">（若 neg &gt; 0，否则 0）</text>

  <rect x="310" y="200" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">new neg = pos + 1</text>
  <text x="400" y="236" text-anchor="middle" font-size="10" fill="#b85450">（正段接负数变负）</text>

  <!-- 另两种情况小注 -->
  <rect x="40" y="270" width="480" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#5a4a20" font-weight="bold">另外两种情况：</text>
  <text x="60" y="312" font-size="11" fill="#5a4a20">• nums[i] &gt; 0：pos = pos + 1，neg = (neg &gt; 0 ? neg + 1 : 0)   （正乘正仍正，负乘正仍负）</text>
  <text x="60" y="332" font-size="11" fill="#5a4a20">• nums[i] = 0：pos = neg = 0   （乘积归零，子数组必须断开重开）</text>

  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#888">只记 pos 会丢掉 neg，再来一个负数就翻不回正——与 152 维护 maxP/minP 同理</text>
</svg>
