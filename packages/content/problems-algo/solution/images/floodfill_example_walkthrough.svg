<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：DFS 染色顺序（sr=1, sc=1, color=2）</text>

  <!-- step 1 grid -->
  <text x="90" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">step 0 · 起点</text>
  <rect x="46" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="68" y="96" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="90" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="112" y="96" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="134" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="156" y="96" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="46" y="112" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="68" y="140" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="90" y="112" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" rx="2" filter="url(#rough2)"/>
  <text x="112" y="140" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="134" y="112" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="156" y="140" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <rect x="46" y="156" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="68" y="184" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="90" y="156" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="112" y="184" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <rect x="134" y="156" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="156" y="184" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="90" y="216" text-anchor="middle" font-size="10" fill="#b85450">orig=1, color=2</text>

  <!-- arrow -->
  <text x="200" y="140" font-size="20" fill="#d6a040" font-weight="bold">→</text>

  <!-- step 1 grid: dye start -->
  <text x="290" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">step 1 · 染起点</text>
  <rect x="246" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="268" y="96" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="290" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="312" y="96" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="334" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="356" y="96" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="246" y="112" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="268" y="140" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="290" y="112" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="2" filter="url(#rough2)"/>
  <text x="312" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="334" y="112" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="356" y="140" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <rect x="246" y="156" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="268" y="184" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="290" y="156" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="312" y="184" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <rect x="334" y="156" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="356" y="184" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="290" y="216" text-anchor="middle" font-size="10" fill="#b85450">grid[1][1]=2，递归 4 邻</text>

  <!-- arrow -->
  <text x="400" y="140" font-size="20" fill="#d6a040" font-weight="bold">→</text>

  <!-- step final grid -->
  <text x="490" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">step 2 · 漫灌完成</text>
  <rect x="446" y="68" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="468" y="96" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="490" y="68" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="512" y="96" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="534" y="68" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="2" filter="url(#rough2)"/>
  <text x="556" y="96" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="446" y="112" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="468" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="490" y="112" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="2" filter="url(#rough2)"/>
  <text x="512" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="534" y="112" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="556" y="140" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <rect x="446" y="156" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="468" y="184" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="490" y="156" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="512" y="184" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <rect x="534" y="156" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="556" y="184" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="490" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">5 个同色格全染成 2</text>

  <!-- legend -->
  <rect x="40" y="240" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">DFS 递归链：(1,1)→(0,1)→(0,0)→(1,0)→(2,0)→(0,2)</text>
  <text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#555">每染一格立刻改色（=visited），邻居递归时本格已是新色 != orig，自然不再回头</text>
  <text x="280" y="296" text-anchor="middle" font-size="10.5" fill="#b85450">(2,2)=1 虽同值但不与起点连通（被 0 隔断），保持不变</text>

  <!-- recursion order table -->
  <rect x="40" y="308" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="328" font-size="11" fill="#d6a040" font-weight="bold">染色顺序</text>
  <text x="60" y="346" font-size="11" fill="#555">①(1,1) ②(0,1) ③(0,0) ④(1,0) ⑤(2,0) ⑥(0,2) — 共 6 格同色连通</text>
  <text x="60" y="362" font-size="10.5" fill="#555">改色在递归前完成，故无需额外 visited 数组（改色即标记）</text>
</svg>
