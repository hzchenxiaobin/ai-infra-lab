<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：t 秒后 word = w[tk:] + 任意字符（tk &lt; n 时）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以例 1 为例：w = "abacaba"，k = 3，t = 2 ⟹ tk = 6 &lt; n = 7</text>

  <!-- row 1: original word -->
  <text x="52" y="80" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">原始 w</text>
  <rect x="62" y="58" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="80" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">a</text>
  <line x1="68" y1="86" x2="102" y2="64" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="108" y="58" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="131" y="80" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">b</text>
  <line x1="114" y1="86" x2="148" y2="64" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="58" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="177" y="80" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">a</text>
  <line x1="160" y1="86" x2="194" y2="64" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="200" y="58" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="223" y="80" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">c</text>
  <line x1="206" y1="86" x2="240" y2="64" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="246" y="58" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="269" y="80" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">a</text>
  <line x1="252" y1="86" x2="286" y2="64" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="292" y="58" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="315" y="80" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">b</text>
  <line x1="298" y1="86" x2="332" y2="64" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="338" y="58" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="80" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="361" y="50" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">w[6:]</text>

  <text x="200" y="110" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">↑ 前 tk = 6 个：每秒移除 k 个，逐秒被删掉</text>

  <!-- survivor arrow -->
  <path d="M 361 96 C 430 132, 170 130, 88 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="252" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">幸存的后缀 w[6:] = "a" 顶到最前面</text>

  <!-- row 2: after t seconds -->
  <text x="52" y="204" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">t=2 秒后</text>
  <rect x="62" y="182" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="204" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="108" y="182" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="131" y="204" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">?</text>
  <rect x="154" y="182" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="177" y="204" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">?</text>
  <rect x="200" y="182" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="223" y="204" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">?</text>
  <rect x="246" y="182" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="269" y="204" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">?</text>
  <rect x="292" y="182" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="315" y="204" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">?</text>
  <rect x="338" y="182" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="361" y="204" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">?</text>

  <path d="M 200 230 C 260 244, 330 244, 378 232" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="288" y="248" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">尾部 tk = 6 个：自己随便填的任意字符</text>

  <!-- condition box -->
  <rect x="30" y="262" width="500" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">恢复初始 ⟺ 前 n−tk = 1 格 "a" == w[0] = "a" ⟺ w[tk:] 是 w 的前缀</text>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">一般化：z[tk] ≥ n − tk（Z 函数一查便知）→ 例 1 答案 t = 2 ✓</text>

  <!-- tip box -->
  <rect x="30" y="330" width="500" height="52" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡 当 tk ≥ n（即 t ≥ ⌈n/k⌉）时原字符已全部移空，整串随便填 → 必可恢复，</text>
  <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">所以答案有上界 ⌈n/k⌉，枚举 t 一定会在循环内停下</text>
</svg>
