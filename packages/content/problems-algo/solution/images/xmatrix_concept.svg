<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：对角线元素必非零，其余必为零 → 染色后呈 X 形</text>

  <!-- Faint diagonal guide lines through grid centers -->
  <path d="M 176 64 L 384 272" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="2,4" opacity="0.45" fill="none" filter="url(#rough2)"/>
  <path d="M 384 64 L 176 272" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="2,4" opacity="0.45" fill="none" filter="url(#rough2)"/>

  <!-- 4x4 grid, cell=52, x0=176, y0=64. Values = example1 -->
  <!-- Row 0 -->
  <rect x="176" y="64" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="202" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="228" y="64" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="98" text-anchor="middle" font-size="14" fill="#888">0</text>
  <rect x="280" y="64" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="98" text-anchor="middle" font-size="14" fill="#888">0</text>
  <rect x="332" y="64" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="358" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <!-- Row 1 -->
  <rect x="176" y="116" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="150" text-anchor="middle" font-size="14" fill="#888">0</text>
  <rect x="228" y="116" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="150" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="280" y="116" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="306" y="150" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="332" y="116" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="150" text-anchor="middle" font-size="14" fill="#888">0</text>

  <!-- Row 2 -->
  <rect x="176" y="168" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="202" text-anchor="middle" font-size="14" fill="#888">0</text>
  <rect x="228" y="168" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="202" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  <rect x="280" y="168" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="306" y="202" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="332" y="168" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="202" text-anchor="middle" font-size="14" fill="#888">0</text>

  <!-- Row 3 -->
  <rect x="176" y="220" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="202" y="254" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <rect x="228" y="220" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="254" text-anchor="middle" font-size="14" fill="#888">0</text>
  <rect x="280" y="220" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="254" text-anchor="middle" font-size="14" fill="#888">0</text>
  <rect x="332" y="220" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="358" y="254" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>

  <!-- Column/row index hints -->
  <text x="166" y="98" text-anchor="end" font-size="10" fill="#aaa">i=0</text>
  <text x="166" y="150" text-anchor="end" font-size="10" fill="#aaa">i=1</text>
  <text x="166" y="202" text-anchor="end" font-size="10" fill="#aaa">i=2</text>
  <text x="166" y="254" text-anchor="end" font-size="10" fill="#aaa">i=3</text>
  <text x="202" y="58" text-anchor="middle" font-size="10" fill="#aaa">j=0</text>
  <text x="358" y="58" text-anchor="middle" font-size="10" fill="#aaa">j=3</text>

  <!-- Legend -->
  <rect x="60" y="296" width="22" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="90" y="308" font-size="11.5" fill="#4a7a3a" font-weight="bold">对角线元素 · 必须 ≠ 0</text>
  <rect x="290" y="296" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="320" y="308" font-size="11.5" fill="#b85450" font-weight="bold">非对角线 · 必须 = 0</text>

  <!-- Condition formulas -->
  <path d="M 40 324 L 520 324" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="60" y="346" font-size="12" fill="#555">判定 (i,j) 是否在对角线上：</text>
  <text x="280" y="346" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">onDiag = (i == j) 或 (i + j == n − 1)</text>
  <text x="60" y="366" font-size="11.5" fill="#888">主对角线 i==j；副（反对角线）i+j==n−1。两者染同色，共同勾勒出 X 形。</text>
</svg>
