<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：pref = [5,2,0,3,1] → arr = [5,7,2,3,2]</text>

  <!-- ===== table outer frame ===== -->
  <rect x="20" y="44" width="520" height="232" fill="none" stroke="#aaa" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <!-- column dividers -->
  <line x1="90" y1="44" x2="90" y2="276" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="44" x2="210" y2="276" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="44" x2="330" y2="276" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="20" y="44" width="520" height="34" fill="#f0eee6" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="66" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">i</text>
  <text x="150" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">pref[i]</text>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">pref[i−1]</text>
  <text x="425" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">arr[i] = pref[i] ⊕ pref[i−1]</text>

  <!-- row dividers -->
  <line x1="20" y1="112" x2="540" y2="112" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="150" x2="540" y2="150" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="188" x2="540" y2="188" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="226" x2="540" y2="226" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0: i=0 -->
  <text x="55" y="96" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">0</text>
  <text x="150" y="96" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>
  <text x="270" y="96" text-anchor="middle" font-size="12" fill="#999" font-style="italic">—（首元素）</text>
  <text x="425" y="96" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">arr[0] = pref[0] = 5</text>

  <!-- row 1: i=1 -->
  <text x="55" y="134" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">1</text>
  <text x="150" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <text x="270" y="134" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>
  <text x="425" y="134" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2 ⊕ 5 = 7</text>

  <!-- row 2: i=2 -->
  <text x="55" y="172" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">2</text>
  <text x="150" y="172" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <text x="270" y="172" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="425" y="172" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">0 ⊕ 2 = 2</text>

  <!-- row 3: i=3 -->
  <text x="55" y="210" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">3</text>
  <text x="150" y="210" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <text x="270" y="210" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <text x="425" y="210" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">3 ⊕ 0 = 3</text>

  <!-- row 4: i=4 -->
  <text x="55" y="248" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">4</text>
  <text x="150" y="248" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="270" y="248" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
  <text x="425" y="248" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1 ⊕ 3 = 2</text>

  <!-- ===== answer banner ===== -->
  <rect x="60" y="292" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">arr = [5, 7, 2, 3, 2]   ✓</text>

  <!-- verification -->
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a">验证：5 → 5⊕7=2 → 5⊕7⊕2=0 → …⊕3=3 → …⊕2=1 = pref[4] ✓</text>
</svg>
