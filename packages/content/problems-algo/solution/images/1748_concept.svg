<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#aaa"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：值域计数桶——一次扫描填桶，累加 cnt==1 的桶值</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下标即值，内容即频次；cnt[v]==1 的 v 求和</text>

  <!-- nums row -->
  <text x="40" y="95" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="116" y="74" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="144" y="95" fill="#333" font-weight="bold">1</text>
    <rect x="184" y="74" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="212" y="95" fill="#333" font-weight="bold">2</text>
    <rect x="252" y="74" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="280" y="95" fill="#333" font-weight="bold">3</text>
    <rect x="320" y="74" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="348" y="95" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- arrows nums -> buckets -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.2" fill="none">
    <path d="M 144 106 L 144 138" marker-end="url(#arr)"/>
    <path d="M 212 106 L 212 138" marker-end="url(#arr)"/>
    <path d="M 280 106 L 280 138" marker-end="url(#arr)"/>
    <path d="M 348 106 L 348 138" marker-end="url(#arr)"/>
  </g>
  <text x="430" y="124" font-size="10" fill="#888" filter="url(#rough2)">cnt[v]++</text>

  <!-- bucket row: value buckets with counts -->
  <text x="40" y="173" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">cnt</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- v=1 cnt=1 UNIQUE -->
    <rect x="82" y="150" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="110" y="173" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- v=2 cnt=2 dup -->
    <rect x="150" y="150" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="178" y="173" fill="#b85450" font-weight="bold">2</text>
    <!-- v=3 cnt=1 UNIQUE -->
    <rect x="218" y="150" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="246" y="173" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- v=4 cnt=0 -->
    <rect x="286" y="150" width="56" height="36" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="314" y="173" fill="#999" font-weight="bold">0</text>
    <!-- v=5 cnt=0 -->
    <rect x="354" y="150" width="56" height="36" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="382" y="173" fill="#999" font-weight="bold">0</text>
  </g>

  <!-- value index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="110" y="200">v=1</text>
    <text x="178" y="200">v=2</text>
    <text x="246" y="200">v=3</text>
    <text x="314" y="200">v=4</text>
    <text x="382" y="200">v=5</text>
  </g>

  <!-- unique check labels -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="110" y="220" fill="#4a7a3a" font-weight="bold">✓ 唯一</text>
    <text x="178" y="220" fill="#b85450">✗ 重复</text>
    <text x="246" y="220" fill="#4a7a3a" font-weight="bold">✓ 唯一</text>
    <text x="314" y="220" fill="#aaa">空</text>
    <text x="382" y="220" fill="#aaa">空</text>
  </g>

  <!-- arrows from unique buckets down to sum -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.8" fill="none">
    <path d="M 110 232 L 110 262" marker-end="url(#arrG)"/>
    <path d="M 246 232 L 246 262" marker-end="url(#arrG)"/>
  </g>

  <!-- sum box -->
  <rect x="80" y="266" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="220" y="288" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 1 + 3 = 4（累加 cnt==1 的 v）</text>

  <!-- bottom note -->
  <rect x="50" y="312" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">第一趟 cnt[v]++ 统计频次，第二趟累加 cnt[v]==1 的 v</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">值域 1..100 → 长度 101 的数组即可，下标即值无需哈希</text>
</svg>
