<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,1,2,2,1]，二分 (lo, hi) 轨迹与频次表</text>

  <!-- binary search table -->
  <rect x="50" y="36" width="545" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="50" y="62" width="545" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="50" y="88" width="545" height="26" fill="#f6f6f2" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="50" y="114" width="545" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="50" y="140" width="545" height="26" fill="#f6f6f2" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="115" y1="36" x2="115" y2="166" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="235" y1="36" x2="235" y2="166" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="460" y1="36" x2="460" y2="166" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <text x="82" y="53" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">轮次</text>
  <text x="175" y="53" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">(lo, hi) → mid</text>
  <text x="347" y="53" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">check 的频次表</text>
  <text x="527" y="53" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">判定 / 动作</text>

  <text x="82" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="175" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 5) → 3</text>
  <text x="347" y="79" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,1,2] [1,2,2] [2,2,1] 频次全 1</text>
  <text x="527" y="79" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ → hi = 3</text>

  <text x="82" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="175" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 3) → 2</text>
  <text x="347" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,1] [1,2] [2,2] [2,1] 频次全 1</text>
  <text x="527" y="105" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ → hi = 2</text>

  <text x="82" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="175" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 2) → 1</text>
  <text x="347" y="131" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{1: 3 次, 2: 2 次}，无频次 1</text>
  <text x="527" y="131" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ → lo = 2</text>

  <text x="82" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">—</text>
  <text x="175" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2, 2) 收敛</text>
  <text x="347" y="157" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="527" y="157" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">返回 2</text>

  <!-- panel: check(1) -->
  <rect x="40" y="182" width="272" height="142" fill="#fff" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="176" y="204" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">check(L=1)：长度 1 的窗口</text>

  <rect x="80" y="216" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="118" y="216" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="156" y="216" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="194" y="216" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="232" y="216" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="176" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">内容 1 → 3 次，内容 2 → 2 次</text>
  <text x="176" y="303" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">没有频次恰为 1 的键 ⇒ ✗</text>

  <!-- panel: check(2) -->
  <rect x="328" y="182" width="272" height="142" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="464" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">check(L=2)：长度 2 的窗口</text>

  <rect x="344" y="216" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="370" y="216" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="414" y="216" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="440" y="216" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="484" y="216" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="496" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="510" y="216" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="522" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="554" y="216" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="566" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="580" y="216" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="592" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="464" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 种内容各出现 1 次，互不相同</text>
  <text x="464" y="303" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">存在频次恰为 1 的键 ⇒ ✓</text>

  <!-- answer -->
  <path d="M 250 324 L 250 336" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="170" y="340" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="367" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">答案 = 2（如 [1,1] 只出现一次）</text>

  <text x="320" y="416" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">二分 3 轮收敛；每轮只是一次线性滑窗 + 哈希计数</text>
</svg>
