<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：s = "010101"，n = 6</text>

  <!-- String display -->
  <text x="30" y="60" font-size="12" fill="#888">s =</text>
  <rect x="70" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="66" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="110" y="46" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="66" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="150" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="66" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="190" y="46" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="66" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="230" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="66" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="270" y="46" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- index labels -->
  <text x="90" y="90" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="130" y="90" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="170" y="90" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="210" y="90" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="250" y="90" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="290" y="90" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- Table header -->
  <rect x="20" y="110" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">边界 i</text>
  <text x="115" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">差异?</text>
  <text x="195" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">前缀成本 i+1</text>
  <text x="305" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">后缀成本 n-i-1</text>
  <text x="415" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取最小</text>

  <!-- Row i=0 -->
  <text x="55" y="155" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="115" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <text x="195" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <text x="305" y="155" text-anchor="middle" font-size="11" fill="#d6a040">5</text>
  <rect x="390" y="142" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="157" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- Row i=1 -->
  <text x="55" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="115" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <text x="195" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <text x="305" y="180" text-anchor="middle" font-size="11" fill="#d6a040">4</text>
  <rect x="390" y="167" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- Row i=2 -->
  <text x="55" y="205" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="115" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <text x="195" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <text x="305" y="205" text-anchor="middle" font-size="11" fill="#d6a040">3</text>
  <rect x="390" y="192" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="207" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <!-- Row i=3 -->
  <text x="55" y="230" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="115" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <text x="195" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a">4</text>
  <text x="305" y="230" text-anchor="middle" font-size="11" fill="#d6a040">2</text>
  <rect x="390" y="217" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- Row i=4 -->
  <text x="55" y="255" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="115" y="255" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <text x="195" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a">5</text>
  <text x="305" y="255" text-anchor="middle" font-size="11" fill="#d6a040">1</text>
  <rect x="390" y="242" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="257" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- Sum -->
  <line x1="20" y1="275" x2="500" y2="275" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="285" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">ans = 1+2+3+2+1 = 9 ✓</text>

  <!-- Symmetry note -->
  <rect x="20" y="340" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">成本对称分布</text>
  <text x="260" y="378" text-anchor="middle" font-size="10" fill="#555">靠左用前缀翻转（便宜），靠右用后缀翻转（便宜），中间两者相等</text>
</svg>
