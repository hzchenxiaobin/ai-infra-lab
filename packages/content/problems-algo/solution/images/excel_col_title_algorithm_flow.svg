<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：除 26 取余 + 每轮先减 1</text>

  <!-- Start node -->
  <ellipse cx="260" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">开始: ans = [], n = columnNumber</text>

  <!-- arrow down -->
  <path d="M 260 82 L 260 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: n > 0 ? -->
  <polygon points="260,104 390,150 260,196 130,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#333">n &gt; 0 ?</text>
  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#666">(还有位未处理)</text>

  <!-- No branch -> end -->
  <path d="M 390 150 L 444 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="430" y="178" width="78" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="469" y="194" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">反转 ans</text>
  <text x="469" y="208" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">return ans</text>
  <path d="M 469 150 L 469 178" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Yes branch down -->
  <path d="M 260 196 L 260 214" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="210" font-size="11" fill="#82b366">是</text>

  <!-- n-- -->
  <rect x="180" y="218" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">n--  （1-indexed → 0-indexed）</text>

  <path d="M 260 252 L 260 270" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- d = n % 26 ; append letter -->
  <rect x="150" y="274" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11.5" fill="#333">d = n % 26</text>
  <text x="260" y="309" text-anchor="middle" font-size="11.5" fill="#333">ans.append( chr(d + 'A') )</text>

  <path d="M 260 318 L 260 336" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- n = n / 26 -->
  <rect x="180" y="340" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">n = n / 26</text>

  <!-- loop back arrow to decision top -->
  <path d="M 180 357 L 80 357 L 80 150 L 130 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="68" y="250" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 68 250)">回到循环判断</text>

  <!-- summary note -->
  <text x="260" y="410" text-anchor="middle" font-size="11" fill="#888">关键：先减 1 再取余，字母从低位产出，最后反转</text>
  <text x="260" y="428" text-anchor="middle" font-size="10.5" fill="#888">循环次数 = 结果位数 ≈ log₂₆ n，上界 2³¹−1 时仅 7 次</text>
</svg>
