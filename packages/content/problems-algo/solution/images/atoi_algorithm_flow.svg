<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">atoi 算法流程（顺序解析 + 溢出钳位）</text>

  <!-- Start -->
  <ellipse cx="200" cy="56" rx="78" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="60" text-anchor="middle" font-size="12" fill="#333">开始: i=0, sign=1, ans=0</text>

  <path d="M 200 76 L 200 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Skip spaces -->
  <rect x="110" y="94" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="112" text-anchor="middle" font-size="11" fill="#333">跳过前导空格：</text>
  <text x="200" y="126" text-anchor="middle" font-size="11" fill="#333">while s[i]==' ' 则 i++</text>

  <path d="M 200 132 L 200 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sign -->
  <rect x="110" y="150" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="168" text-anchor="middle" font-size="11" fill="#333">若 s[i] 为 +/−：</text>
  <text x="200" y="182" text-anchor="middle" font-size="11" fill="#333">记 sign，i++</text>

  <path d="M 200 188 L 200 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: is digit? -->
  <polygon points="200,210 300,252 200,294 100,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="248" text-anchor="middle" font-size="12" fill="#333">s[i] 是数字?</text>
  <text x="200" y="264" text-anchor="middle" font-size="10" fill="#666">(isdigit)</text>

  <!-- No -> return -->
  <path d="M 300 252 L 372 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="244" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="440" cy="252" rx="62" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="256" text-anchor="middle" font-size="11" fill="#333">返回 sign×ans</text>

  <!-- Yes down -->
  <path d="M 200 294 L 200 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="308" font-size="11" fill="#82b366">是</text>

  <!-- Decision: overflow? -->
  <polygon points="200,316 310,356 200,396 90,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="352" text-anchor="middle" font-size="11" fill="#333">ans &gt; (INT_MAX−d)/10 ?</text>
  <text x="200" y="368" text-anchor="middle" font-size="10" fill="#666">(d = s[i]−'0')</text>

  <!-- Yes -> clamp -->
  <path d="M 310 356 L 372 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="341" y="348" text-anchor="middle" font-size="11" fill="#b85450">是(溢出)</text>
  <rect x="372" y="336" width="136" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="354" text-anchor="middle" font-size="11" fill="#333">返回 INT_MAX</text>
  <text x="440" y="368" text-anchor="middle" font-size="11" fill="#333">或 INT_MIN（钳位）</text>

  <!-- No -> accumulate -->
  <path d="M 200 396 L 200 414" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="410" font-size="11" fill="#82b366">否</text>

  <rect x="110" y="416" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="434" text-anchor="middle" font-size="11" fill="#333">ans = ans×10 + d；</text>
  <text x="200" y="448" text-anchor="middle" font-size="11" fill="#333">i++</text>

  <!-- loop back -->
  <path d="M 290 435 L 330 435 L 330 252 L 300 252" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="350" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 330 350)">继续下一字符</text>
</svg>
