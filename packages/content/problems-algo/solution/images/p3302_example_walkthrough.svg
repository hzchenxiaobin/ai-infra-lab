<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：word1 = "bacdc"，word2 = "abc"</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">suf = [2,1,1,1,1,0]（阶段一成果）；j = word2 已收位数，used = 免死金牌</text>

  <!-- 表头 -->
  <rect x="30" y="56" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="56" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="56" width="156" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="56" width="86" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="56" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="56" width="62" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="76" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="92" y="76" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">字符对</text>
  <text x="202" y="76" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="323" y="76" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="402" y="76" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans</text>
  <text x="469" y="76" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">状态</text>

  <!-- 行 0：跳过 -->
  <rect x="30" y="88" width="30" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="88" width="64" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="88" width="156" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="88" width="86" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="88" width="72" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="88" width="62" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="45" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="92" y="110" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">b ≠ a</text>
  <text x="202" y="110" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">suf[1]=1 ≥ 2？✗</text>
  <text x="323" y="110" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">跳过</text>
  <text x="402" y="110" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">[]</text>
  <text x="469" y="110" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">j=0</text>

  <!-- 行 1：精确收下 -->
  <rect x="30" y="124" width="30" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="124" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="124" width="156" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="124" width="86" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="124" width="72" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="124" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="146" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="92" y="146" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a = a</text>
  <text x="202" y="146" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">相等 → 直接收 ✓</text>
  <text x="323" y="146" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">精确收下</text>
  <text x="402" y="146" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">[1]</text>
  <text x="469" y="146" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">j=1</text>

  <!-- 行 2：动刀 -->
  <rect x="30" y="160" width="30" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="160" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="160" width="156" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="160" width="86" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="160" width="72" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="160" width="62" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="45" y="182" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="92" y="182" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">c ≠ b</text>
  <text x="202" y="182" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">!used 且 suf[3]=1 ≥ 1 ✓</text>
  <text x="323" y="182" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">动刀 c→b</text>
  <text x="402" y="182" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">[1,2]</text>
  <text x="469" y="182" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">j=2 used</text>

  <!-- 行 3：跳过 -->
  <rect x="30" y="196" width="30" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="196" width="64" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="196" width="156" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="196" width="86" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="196" width="72" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="196" width="62" height="36" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="45" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="92" y="218" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">d ≠ c</text>
  <text x="202" y="218" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">不等，预算已花 ✗</text>
  <text x="323" y="218" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">跳过</text>
  <text x="402" y="218" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">[1,2]</text>
  <text x="469" y="218" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">j=2 used</text>

  <!-- 行 4：精确收下，完成 -->
  <rect x="30" y="232" width="30" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="232" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="232" width="156" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="232" width="86" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="232" width="72" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="232" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="92" y="254" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c = c</text>
  <text x="202" y="254" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">相等 → 直接收 ✓</text>
  <text x="323" y="254" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">精确收下</text>
  <text x="402" y="254" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">[1,2,4]</text>
  <text x="469" y="254" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">j=3=m ✓</text>

  <!-- 结论框 -->
  <rect x="56" y="284" width="408" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">j = 3 = m → 返回 [1,2,4] ✓（word1[2] 的 'c' 改成 'b'）</text>
  <text x="260" y="317" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">i=0 的跳过是明智的：硬改 'b'→'a' 后剩余 "bc" 要在 "acdc" 里零失配匹配，'b' 缺席——suf[1]=1&lt;2 拦下</text>

  <!-- 对照注释 -->
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对照示例 1 "vbcca"：i=0 处 suf[1]=2 ≥ 2 放行 → 一刀改 'v'→'a' 得 [0,1,2]</text>
  <text x="260" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对照示例 3 "aaaaaa"/"aaabc"：i=3 起动刀条件全被 suf 拦下（'c' 缺席）→ 返回 []</text>
  <text x="260" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对照坑例 "ba"/"a"：纯匹配给 [1]，但 i=0 动刀 suf[1]=1 ≥ 0 放行 → [0] 才是正解</text>
</svg>
