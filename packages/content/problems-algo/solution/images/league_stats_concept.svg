<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    UNION ALL 逆透视：一场拆两行
  </text>

  <!-- ===== Top: Matches table (wide) ===== -->
  <text x="100" y="58" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    Matches（宽表，一行 = 一场）
  </text>

  <!-- Column headers for Matches -->
  <rect x="30" y="65" width="70" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="79" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">home_id</text>

  <rect x="100" y="65" width="70" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="79" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">away_id</text>

  <rect x="170" y="65" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210" y="79" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">home_goals</text>

  <rect x="250" y="65" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="79" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">away_goals</text>

  <!-- Data row -->
  <rect x="30" y="85" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="65" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="100" y="85" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="170" y="85" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="210" y="101" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="250" y="85" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="290" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- Splitting arrows -->
  <!-- Left arrow: home team perspective -->
  <path d="M 100,115 Q 80,140 60,165" fill="none" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right arrow: away team perspective -->
  <path d="M 250,115 Q 270,140 290,165" fill="none" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- UNION ALL label -->
  <rect x="155" y="120" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="195" y="135" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    UNION ALL
  </text>

  <!-- ===== Bottom left: Home team perspective ===== -->
  <text x="75" y="155" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    主队视角 SELECT
  </text>

  <!-- Headers -->
  <rect x="20" y="165" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="178" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">team_id</text>

  <rect x="75" y="165" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="178" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">goal_for</text>

  <rect x="125" y="165" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="178" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">goal_against</text>

  <!-- Data: home team = 1, gf=0, ga=1 -->
  <rect x="20" y="183" width="55" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="47" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <rect x="75" y="183" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="197" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="125" y="183" width="55" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="197" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- Home points -->
  <rect x="20" y="208" width="160" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="222" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">
    points = 0（负：gf &lt; ga）
  </text>

  <!-- ===== Bottom right: Away team perspective ===== -->
  <text x="345" y="155" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    客队视角 SELECT
  </text>

  <!-- Headers -->
  <rect x="290" y="165" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="317" y="178" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">team_id</text>

  <rect x="345" y="165" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="178" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">goal_for</text>

  <rect x="395" y="165" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="422" y="178" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">goal_against</text>

  <!-- Data: away team = 4, gf=1, ga=0 (swapped!) -->
  <rect x="290" y="183" width="55" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="317" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>

  <rect x="345" y="183" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="197" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="395" y="183" width="55" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="422" y="197" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- Away points -->
  <rect x="290" y="208" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="370" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">
    points = 3（胜：gf &gt; ga）
  </text>

  <!-- ===== Bottom note: swap annotation ===== -->
  <rect x="60" y="248" width="400" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">
    关键：客队视角的 goal_for / goal_against 互换！
  </text>
  <text x="260" y="285" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">
    away_goals → goal_for，home_goals → goal_against
  </text>

  <!-- ===== Bottom: resulting long table ===== -->
  <text x="260" y="320" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    逆透视后：TeamStats 长表（每行 = 一队一场）
  </text>

  <rect x="100" y="328" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="343" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">team=1, 0:1, pts=0</text>

  <rect x="260" y="328" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="343" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">team=4, 1:0, pts=3</text>

  <path d="M 180,339 L 258,339" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Decorative arrows from note to long table -->
  <path d="M 100,230 Q 110,280 140,326" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" opacity="0.5" filter="url(#rough2)"/>
  <path d="M 370,230 Q 360,280 300,326" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" opacity="0.5" filter="url(#rough2)"/>
</svg>
