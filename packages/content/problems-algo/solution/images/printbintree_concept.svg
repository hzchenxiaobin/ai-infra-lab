<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">满二叉树布局：节点 = 列区间正中，孩子平分</text>

  <!-- 树：节点 x 与下方矩阵列中心对齐，直观体现「位置即列号」 -->
  <!-- 列中心：col c -> x = 90 + c*60 -->
  <!-- 1@(col3,270)  2@(col1,150)  3@(col5,390)  4@(col2,210) -->
  <line x1="270" y1="76" x2="150" y2="124" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="270" y1="76" x2="390" y2="124" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="150" y1="146" x2="210" y2="194" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 节点 + 区间标签 -->
  <circle cx="270" cy="60" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="305" y="55" font-size="11" fill="#b85450" filter="url(#rough2)">[0,6]→3</text>

  <circle cx="150" cy="130" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="172" y="124" font-size="11" fill="#b85450" filter="url(#rough2)">[0,2]→1</text>

  <circle cx="390" cy="130" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="412" y="124" font-size="11" fill="#b85450" filter="url(#rough2)">[4,6]→5</text>

  <circle cx="210" cy="200" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="232" y="222" font-size="11" fill="#b85450" filter="url(#rough2)">[2,2]→2</text>

  <!-- 矩阵 3 行 x 7 列，cell 60x40，左上 (60,250) -->
  <!-- 行框 -->
  <rect x="60" y="250" width="420" height="40" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="290" width="420" height="40" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="330" width="420" height="40" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 列分隔 -->
  <line x1="120" y1="250" x2="120" y2="370" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="250" x2="180" y2="370" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="250" x2="240" y2="370" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="250" x2="300" y2="370" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="250" x2="360" y2="370" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="250" x2="420" y2="370" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 填值（列中心 x = 90 + c*60） -->
  <text x="270" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="150" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="390" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="210" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>

  <!-- 列编号轴 -->
  <text x="90"  y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="150" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="210" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="270" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="330" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="390" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="450" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>

  <!-- 根到单元格的对齐提示 -->
  <line x1="270" y1="78" x2="270" y2="248" stroke="#b85450" stroke-width="1.2"
        stroke-dasharray="4 4" opacity="0.7" filter="url(#rough2)"/>
  <text x="278" y="240" font-size="10" fill="#b85450" filter="url(#rough2)">mid=(0+6)/2=3</text>

  <text x="60" y="410" font-size="11" fill="#555" filter="url(#rough2)">h=2 ⇒ m=h+1=3 行, n=2^(h+1)-1=7 列；根坐 [0,6] 正中 col 3</text>
</svg>
