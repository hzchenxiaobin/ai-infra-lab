<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：个位为 K 的数都形如 10a + K</text>

  <!-- Row of candidate numbers, units digit highlighted -->
  <text x="36" y="60" font-size="11.5" fill="#888">候选数(k=9):</text>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="70" y="46" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="100" y="68"><tspan fill="#b85450" font-weight="bold">9</tspan></text>
    <rect x="138" y="46" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="68">1<tspan fill="#b85450" font-weight="bold">9</tspan></text>
    <rect x="206" y="46" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="236" y="68">2<tspan fill="#b85450" font-weight="bold">9</tspan></text>
    <rect x="274" y="46" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="304" y="68">3<tspan fill="#b85450" font-weight="bold">9</tspan></text>
    <text x="350" y="68" font-size="14" fill="#888">...</text>
  </g>
  <text x="372" y="68" font-size="11.5" fill="#888">个位恒为</text>
  <text x="440" y="68" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">K</text>

  <!-- Formula box -->
  <rect x="60" y="96" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">每个数 = 10·a + K   (a ≥ 0)</text>
  <text x="280" y="140" text-anchor="middle" font-size="11.5" fill="#555">选 count 个数求和：sum = 10·(Σa) + count·K</text>

  <!-- arrow down -->
  <path d="M 280 156 L 280 180" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="174" font-size="11" fill="#888">模 10</text>

  <!-- Congruence box -->
  <rect x="60" y="186" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">sum ≡ count·K (mod 10)</text>
  <text x="280" y="230" text-anchor="middle" font-size="11.5" fill="#555">令 sum = num ⟹ 必要条件：count·K ≡ num (mod 10)</text>

  <!-- Divider -->
  <path d="M 40 258 L 520 258" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Two conditions -->
  <text x="280" y="280" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">两个充要条件（最小化 count）</text>

  <rect x="60" y="292" width="210" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 个位对齐</text>
  <text x="165" y="336" text-anchor="middle" font-size="11" fill="#446688">(count·K) % 10 == num % 10</text>

  <rect x="290" y="292" width="210" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="395" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 不透支</text>
  <text x="395" y="336" text-anchor="middle" font-size="11" fill="#b85450">count·K ≤ num</text>

  <!-- note -->
  <text x="60" y="372" font-size="11.5" fill="#555">• 个位数字 (count·K)%10 随 count 以周期 ≤10 循环</text>
  <text x="60" y="392" font-size="11.5" fill="#555">• 故只枚举 count = 1..10，首个同时满足 ①② 者即最小解</text>
  <text x="60" y="412" font-size="11.5" fill="#555">• 若最小匹配 count 已有 count·K &gt; num，更大的同位 count 更大 → 无解</text>
</svg>
