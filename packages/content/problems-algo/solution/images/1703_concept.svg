<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：提取 1 的位置 → q 变换 → 中位数聚集</text>

  <!-- ===== Row 1: nums ===== -->
  <text x="44" y="68" font-size="11" fill="#888" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="86" y="52" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="101" y="71" fill="#4a7a3a">1</text>
    <rect x="116" y="52" width="30" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="131" y="71" fill="#aaa">0</text>
    <rect x="146" y="52" width="30" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="161" y="71" fill="#aaa">0</text>
    <rect x="176" y="52" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="191" y="71" fill="#4a7a3a">1</text>
    <rect x="206" y="52" width="30" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="221" y="71" fill="#aaa">0</text>
    <rect x="236" y="52" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="251" y="71" fill="#4a7a3a">1</text>
  </g>
  <!-- index ticks -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="101" y="92">0</text>
    <text x="131" y="92">1</text>
    <text x="161" y="92">2</text>
    <text x="191" y="92">3</text>
    <text x="221" y="92">4</text>
    <text x="251" y="92">5</text>
  </g>

  <!-- Arrow: extract pos -->
  <path d="M 161 100 L 161 118" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="114" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">提取 1 的下标</text>

  <!-- ===== Row 2: pos ===== -->
  <text x="44" y="148" font-size="11" fill="#888" filter="url(#rough2)">pos</text>
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="116" y="130" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="136" y="149" fill="#446688">0</text>
    <rect x="156" y="130" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="176" y="149" fill="#446688">3</text>
    <rect x="196" y="130" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="216" y="149" fill="#446688">5</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="136" y="170">i=0</text>
    <text x="176" y="170">i=1</text>
    <text x="216" y="170">i=2</text>
  </g>

  <!-- Arrow: q transform -->
  <path d="M 176 178 L 176 196" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="192" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">q[i] = pos[i] − i</text>

  <!-- ===== Row 3: q ===== -->
  <text x="44" y="226" font-size="11" fill="#888" filter="url(#rough2)">q</text>
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="116" y="208" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="136" y="227" fill="#446688">0</text>
    <rect x="156" y="208" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="176" y="227" fill="#d6a040">2</text>
    <rect x="196" y="208" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="227" fill="#446688">3</text>
  </g>
  <text x="176" y="252" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↑ 中位数 q[m]</text>

  <!-- ===== Right side: formula box ===== -->
  <rect x="310" y="52" width="250" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="322" y="72" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键公式</text>
  <text x="322" y="92" font-size="10" fill="#555" filter="url(#rough2)">把 k 个 1 聚到连续位置，</text>
  <text x="322" y="106" font-size="10" fill="#555" filter="url(#rough2)">等价于最小化：</text>
  <rect x="322" y="114" width="226" height="24" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="131" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">Σ | q[i] − c | ，c = median(q)</text>
  <text x="322" y="154" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">中位数最小化绝对偏差之和</text>

  <!-- ===== Right side: cost computation ===== -->
  <rect x="310" y="178" width="250" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="322" y="198" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">本例 cost（k=3）</text>
  <text x="322" y="218" font-size="11" fill="#555" filter="url(#rough2)">= |0−2| + |2−2| + |3−2|</text>
  <text x="322" y="236" font-size="11" fill="#555" filter="url(#rough2)">= 2 + 0 + 1</text>
  <rect x="322" y="244" width="80" height="22" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="260" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 3 次</text>

  <!-- ===== Bottom: gathering visualization ===== -->
  <text x="290" y="296" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">聚集可视化：1 从位置 {0, 3, 5} → 连续 {2, 3, 4}</text>

  <!-- original positions -->
  <text x="44" y="324" font-size="10" fill="#888" filter="url(#rough2)">交换前</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="86" y="308" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="101" y="327" fill="#4a7a3a">1</text>
    <rect x="116" y="308" width="30" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="131" y="327" fill="#aaa">0</text>
    <rect x="146" y="308" width="30" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="161" y="327" fill="#aaa">0</text>
    <rect x="176" y="308" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="191" y="327" fill="#4a7a3a">1</text>
    <rect x="206" y="308" width="30" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="221" y="327" fill="#aaa">0</text>
    <rect x="236" y="308" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="251" y="327" fill="#4a7a3a">1</text>
  </g>

  <!-- movement arrows -->
  <path d="M 101 340 C 101 358, 161 358, 161 372" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="358" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">右移 2</text>

  <path d="M 251 340 C 251 358, 221 358, 221 372" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="244" y="358" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">左移 1</text>

  <!-- target positions -->
  <text x="44" y="392" font-size="10" fill="#888" filter="url(#rough2)">交换后</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="86" y="376" width="30" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="101" y="395" fill="#aaa">0</text>
    <rect x="116" y="376" width="30" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="131" y="395" fill="#aaa">0</text>
    <rect x="146" y="376" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="161" y="395" fill="#4a7a3a">1</text>
    <rect x="176" y="376" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="191" y="395" fill="#4a7a3a">1</text>
    <rect x="206" y="376" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="221" y="395" fill="#4a7a3a">1</text>
    <rect x="236" y="376" width="30" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="251" y="395" fill="#aaa">0</text>
  </g>
  <!-- target bracket -->
  <path d="M 148 412 L 148 418 L 224 418 L 224 412" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="186" y="432" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">连续 3 个 1（位置 2,3,4）</text>

  <!-- ===== Bottom right: why median works ===== -->
  <rect x="310" y="308" width="250" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="322" y="328" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">为什么中位数最优？</text>
  <text x="322" y="348" font-size="10" fill="#555" filter="url(#rough2)">把 pos[i] 移到目标 c+i，</text>
  <text x="322" y="362" font-size="10" fill="#555" filter="url(#rough2)">代价 Σ|pos[i]−(c+i)|</text>
  <text x="322" y="376" font-size="10" fill="#555" filter="url(#rough2)">= Σ|(pos[i]−i) − c|</text>
  <text x="322" y="390" font-size="10" fill="#555" filter="url(#rough2)">= Σ|q[i] − c|</text>
  <text x="322" y="408" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 经典结论：c 取 q 的</text>
  <text x="322" y="422" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">  中位数时该和最小</text>

  <!-- Footer -->
  <text x="290" y="450" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">q[i]=pos[i]−i 把"凑连续"化为"绝对偏差和"，中位数一步定位最优中心</text>
</svg>
