<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：镜像 + 除以 2 逐层上溯</text>

  <!-- Box 1: init -->
  <rect x="110" y="44" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="13" fill="#333">① result = [label]</text>

  <path d="M 260 86 L 260 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: check label > 1 -->
  <polygon points="260,104 380,134 260,164 140,134" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="139" text-anchor="middle" font-size="13" fill="#333">label &gt; 1 ?</text>

  <!-- No -> exit -->
  <path d="M 380 134 L 440 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="128" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Yes -> down -->
  <path d="M 260 164 L 260 180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="178" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- Box 3: find level -->
  <rect x="110" y="182" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="207" text-anchor="middle" font-size="13" fill="#333">② h = label 的二进制位数</text>

  <path d="M 260 222 L 260 238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4: mirror + divide (core) -->
  <rect x="100" y="240" width="320" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">③ mirror = 2^(h−1) + 2^h − 1 − label</text>
  <text x="260" y="282" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">label = mirror / 2</text>

  <!-- Box 5: append -->
  <path d="M 260 296 L 260 312" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="314" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="339" text-anchor="middle" font-size="13" fill="#333">④ result.append(label)</text>

  <!-- loop back to Box 2 -->
  <path d="M 410 334 L 460 334 L 460 134 L 380 134" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="468" y="234" font-size="10" fill="#b85450" font-weight="bold" transform="rotate(90 468 234)">循环上溯</text>

  <!-- exit box -->
  <rect x="110" y="362" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="13" fill="#333">⑤ 反转 result 并返回</text>
  <text x="260" y="399" text-anchor="middle" font-size="11" fill="#888">从根到目标节点的路径</text>

  <!-- arrow from exit -->
  <path d="M 440 134 L 440 362" stroke="none"/>
  <path d="M 440 134 Q 470 134 470 250 Q 470 362 440 362" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
