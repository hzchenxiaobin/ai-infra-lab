<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：m=2, n=3, ic=1, ec=2 → 240</text>

  <!-- ===== 最优放置网格 ===== -->
  <text x="60" y="60" font-size="12" fill="#446688" font-weight="bold">最优放置</text>

  <!-- row 0 -->
  <g font-size="16" fill="#333">
    <rect x="80" y="72" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="108" y="100" text-anchor="middle">■</text>
    <rect x="140" y="72" width="56" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="168" y="100" text-anchor="middle" fill="#aaa">·</text>
    <rect x="200" y="72" width="56" height="44" fill="#f3e8f5" stroke="#884488" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="228" y="100" text-anchor="middle">◆</text>
    <text x="72" y="100" text-anchor="end" font-size="10" fill="#888">r=0</text>
  </g>
  <!-- row 1 -->
  <g font-size="16" fill="#333">
    <rect x="80" y="120" width="56" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="108" y="148" text-anchor="middle" fill="#aaa">·</text>
    <rect x="140" y="120" width="56" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="168" y="148" text-anchor="middle" fill="#aaa">·</text>
    <rect x="200" y="120" width="56" height="44" fill="#f3e8f5" stroke="#884488" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="228" y="148" text-anchor="middle">◆</text>
    <text x="72" y="148" text-anchor="end" font-size="10" fill="#888">r=1</text>
  </g>
  <text x="108" y="66" text-anchor="middle" font-size="9" fill="#888">c=0</text>
  <text x="168" y="66" text-anchor="middle" font-size="9" fill="#888">c=1</text>
  <text x="228" y="66" text-anchor="middle" font-size="9" fill="#888">c=2</text>

  <!-- 幸福值标注 -->
  <text x="108" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">120</text>
  <text x="228" y="182" text-anchor="middle" font-size="10" fill="#884488" font-weight="bold">60</text>
  <text x="228" y="196" text-anchor="middle" font-size="10" fill="#884488" font-weight="bold">60</text>

  <!-- 总和 -->
  <rect x="290" y="100" width="140" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">总和</text>
  <text x="360" y="138" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">= 240</text>

  <!-- 图例 -->
  <g font-size="10" fill="#555">
    <rect x="290" y="72" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="310" y="84">■ 内向 (base 120)</text>
    <rect x="290" y="88" width="14" height="14" fill="#f3e8f5" stroke="#884488" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="310" y="100">◆ 外向 (base 40)</text>
  </g>

  <!-- ===== 逐格增量表 ===== -->
  <text x="60" y="220" font-size="12" fill="#446688" font-weight="bold">逐格增量</text>

  <!-- 表头 -->
  <g font-size="10" fill="#444" font-weight="bold">
    <rect x="40" y="232" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="58" y="248" text-anchor="middle">步</text>
    <rect x="78" y="232" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="106" y="248" text-anchor="middle">格</text>
    <rect x="136" y="232" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="164" y="248" text-anchor="middle">选择</text>
    <rect x="194" y="232" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="218" y="248" text-anchor="middle">top</text>
    <rect x="244" y="232" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="268" y="248" text-anchor="middle">left</text>
    <rect x="294" y="232" width="86" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="337" y="248" text-anchor="middle">增量</text>
    <rect x="382" y="232" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="410" y="248" text-anchor="middle">累计</text>
  </g>

  <!-- 行 ① -->
  <g font-size="10" fill="#333">
    <rect x="40" y="258" width="36" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="58" y="273" text-anchor="middle">①</text>
    <rect x="78" y="258" width="56" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="106" y="273" text-anchor="middle">(0,0)</text>
    <rect x="136" y="258" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="164" y="273" text-anchor="middle" fill="#4a7a3a">内向</text>
    <rect x="194" y="258" width="48" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="218" y="273" text-anchor="middle" fill="#aaa">空</text>
    <rect x="244" y="258" width="48" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="268" y="273" text-anchor="middle" fill="#aaa">—</text>
    <rect x="294" y="258" width="86" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="337" y="273" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+120</text>
    <rect x="382" y="258" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="410" y="273" text-anchor="middle" fill="#d6a040" font-weight="bold">120</text>
  </g>

  <!-- 行 ② -->
  <g font-size="10" fill="#333">
    <rect x="40" y="282" width="36" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="58" y="297" text-anchor="middle">②</text>
    <rect x="78" y="282" width="56" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="106" y="297" text-anchor="middle">(0,1)</text>
    <rect x="136" y="282" width="56" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="164" y="297" text-anchor="middle" fill="#888">空</text>
    <rect x="194" y="282" width="48" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="218" y="297" text-anchor="middle" fill="#aaa">空</text>
    <rect x="244" y="282" width="48" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="268" y="297" text-anchor="middle" fill="#aaa">空</text>
    <rect x="294" y="282" width="86" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="337" y="297" text-anchor="middle" fill="#888">0</text>
    <rect x="382" y="282" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="410" y="297" text-anchor="middle" fill="#d6a040" font-weight="bold">120</text>
  </g>

  <!-- 行 ③ -->
  <g font-size="10" fill="#333">
    <rect x="40" y="306" width="36" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="58" y="321" text-anchor="middle">③</text>
    <rect x="78" y="306" width="56" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="106" y="321" text-anchor="middle">(0,2)</text>
    <rect x="136" y="306" width="56" height="22" fill="#f3e8f5" stroke="#884488" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="164" y="321" text-anchor="middle" fill="#884488">外向</text>
    <rect x="194" y="306" width="48" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="218" y="321" text-anchor="middle" fill="#aaa">空</text>
    <rect x="244" y="306" width="48" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="268" y="321" text-anchor="middle" fill="#aaa">空</text>
    <rect x="294" y="306" width="86" height="22" fill="#f3e8f5" stroke="#884488" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="337" y="321" text-anchor="middle" fill="#884488" font-weight="bold">+40</text>
    <rect x="382" y="306" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="410" y="321" text-anchor="middle" fill="#d6a040" font-weight="bold">160</text>
  </g>

  <!-- 行 ④⑤ -->
  <g font-size="10" fill="#333">
    <rect x="40" y="330" width="36" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="58" y="345" text-anchor="middle">④⑤</text>
    <rect x="78" y="330" width="56" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="106" y="345" text-anchor="middle">(1,0~1)</text>
    <rect x="136" y="330" width="56" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="164" y="345" text-anchor="middle" fill="#888">空,空</text>
    <rect x="194" y="330" width="48" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="218" y="345" text-anchor="middle" fill="#aaa">空</text>
    <rect x="244" y="330" width="48" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="268" y="345" text-anchor="middle" fill="#aaa">空</text>
    <rect x="294" y="330" width="86" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="337" y="345" text-anchor="middle" fill="#888">0</text>
    <rect x="382" y="330" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="410" y="345" text-anchor="middle" fill="#d6a040" font-weight="bold">160</text>
  </g>

  <!-- 行 ⑥ 高亮 -->
  <g font-size="10" fill="#333">
    <rect x="40" y="354" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="58" y="369" text-anchor="middle" fill="#d6a040" font-weight="bold">⑥</text>
    <rect x="78" y="354" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="106" y="369" text-anchor="middle" fill="#d6a040" font-weight="bold">(1,2)</text>
    <rect x="136" y="354" width="56" height="22" fill="#f3e8f5" stroke="#884488" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="164" y="369" text-anchor="middle" fill="#884488" font-weight="bold">外向</text>
    <rect x="194" y="354" width="48" height="22" fill="#f3e8f5" stroke="#884488" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="218" y="369" text-anchor="middle" fill="#884488">外</text>
    <rect x="244" y="354" width="48" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="268" y="369" text-anchor="middle" fill="#aaa">空</text>
    <rect x="294" y="354" width="86" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="337" y="369" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+80</text>
    <rect x="382" y="354" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="410" y="369" text-anchor="middle" fill="#4a7a3a" font-weight="bold">240</text>
  </g>

  <!-- 注释 -->
  <rect x="40" y="392" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="412" font-size="11" fill="#446688" font-weight="bold">步⑥关键：top = 外向者，交互 = +40</text>
  <text x="54" y="428" font-size="10" fill="#333">增量 = base[外向] + score[2][外向] = 40 + 40 = 80</text>
  <text x="54" y="442" font-size="10" fill="#888">两个外向者相邻：各 +20，合计 +40；加上基础 40，单步增量 80</text>
</svg>
