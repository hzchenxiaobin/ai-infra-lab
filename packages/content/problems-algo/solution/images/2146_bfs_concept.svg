<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：BFS 层序 = 距离排序 + 收集够 k 件即停</text>

  <!-- ====== Left: 4x3 grid with BFS layers ====== -->
  <text x="155" y="54" text-anchor="middle" font-size="12" fill="#888">grid 示例 1, start=(0,0), pricing=[2,5], k=3</text>

  <!-- column indices -->
  <text x="75" y="84" text-anchor="middle" font-size="10" fill="#999">c=0</text>
  <text x="125" y="84" text-anchor="middle" font-size="10" fill="#999">c=1</text>
  <text x="175" y="84" text-anchor="middle" font-size="10" fill="#999">c=2</text>
  <text x="225" y="84" text-anchor="middle" font-size="10" fill="#999">c=3</text>
  <!-- row indices -->
  <text x="42" y="114" text-anchor="end" font-size="10" fill="#999">r=0</text>
  <text x="42" y="164" text-anchor="end" font-size="10" fill="#999">r=1</text>
  <text x="42" y="214" text-anchor="end" font-size="10" fill="#999">r=2</text>

  <!-- row 0: d=0, d=1, wall, d=2 -->
  <rect x="50" y="90" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="120" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="100" y="90" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="120" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="150" y="90" width="50" height="50" fill="#ccc" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="175" y="120" text-anchor="middle" font-size="13" fill="#666">0</text>
  <rect x="200" y="90" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="225" y="120" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- row 1: d=1, d=2, wall, d=3 -->
  <rect x="50" y="140" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="170" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="100" y="140" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="170" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="150" y="140" width="50" height="50" fill="#ccc" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="175" y="170" text-anchor="middle" font-size="13" fill="#666">0</text>
  <rect x="200" y="140" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="225" y="170" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- row 2: wall, d=3(collected), d=4(unreached), d=4(unreached) -->
  <rect x="50" y="190" width="50" height="50" fill="#ccc" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="220" text-anchor="middle" font-size="13" fill="#666">0</text>
  <rect x="100" y="190" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="220" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="150" y="190" width="50" height="50" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="220" text-anchor="middle" font-size="13" fill="#aaa">5</text>
  <rect x="200" y="190" width="50" height="50" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="220" text-anchor="middle" font-size="13" fill="#aaa">1</text>

  <!-- Start marker on (0,0) -->
  <circle cx="75" cy="108" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="75" y="112" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">S</text>

  <!-- Collected item markers (✓) -->
  <text x="140" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">✓d=1</text>
  <text x="140" y="150" font-size="11" fill="#d6a040" font-weight="bold">✓d=2</text>
  <text x="140" y="200" font-size="11" fill="#b85450" font-weight="bold">✓d=3</text>

  <!-- Stop marker at d=3 -->
  <rect x="100" y="190" width="50" height="50" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4,2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 累计 3 ≥ k, 停止</text>

  <!-- d=4 unreached note -->
  <text x="190" y="258" text-anchor="middle" font-size="9" fill="#aaa">虚线=未访问</text>

  <!-- Legend -->
  <rect x="50" y="275" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="72" y="287" font-size="10" fill="#555">d=0 起点</text>
  <rect x="130" y="275" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="152" y="287" font-size="10" fill="#555">d=1</text>
  <rect x="190" y="275" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="212" y="287" font-size="10" fill="#555">d=2</text>
  <rect x="250" y="275" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="272" y="287" font-size="10" fill="#555">d=3 停</text>

  <!-- ====== Right: Two key observations ====== -->
  <rect x="300" y="62" width="260" height="280" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>

  <text x="430" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">两个关键观察</text>

  <!-- observation 1 -->
  <circle cx="320" cy="118" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="338" y="116" font-size="12" fill="#333" font-weight="bold">BFS 层序 = 距离排序</text>
  <text x="320" y="140" font-size="11" fill="#555">第 0 层 = 起点距离 0</text>
  <text x="320" y="156" font-size="11" fill="#555">第 1 层 = 距离 1 的格子</text>
  <text x="320" y="172" font-size="11" fill="#555">第 d 层 = 距离 d 的格子</text>
  <text x="320" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">→ 距离维度天然有序</text>

  <!-- observation 2 -->
  <circle cx="320" cy="222" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="338" y="220" font-size="12" fill="#333" font-weight="bold">收集够 k 件即停</text>
  <text x="320" y="244" font-size="11" fill="#555">前 d 层已收 ≥ k 件</text>
  <text x="320" y="260" font-size="11" fill="#555">→ 第 d+1 层距离更大</text>
  <text x="320" y="276" font-size="11" fill="#555">→ 排名必然更低</text>
  <text x="320" y="296" font-size="11" fill="#b85450" font-weight="bold">→ 不可能进前 k, 可停止</text>

  <!-- bottom note -->
  <text x="430" y="322" text-anchor="middle" font-size="10" fill="#888">同层内按 (价格, 行, 列) 排序</text>

  <!-- arrow from grid to observation 2 -->
  <path d="M 260 215 Q 285 215 300 222" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
</svg>
