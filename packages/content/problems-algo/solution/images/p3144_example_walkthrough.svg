<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：s = fabccddg，逐行填 dp</text>

  <!-- 表头 -->
  <rect x="60" y="40" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="40" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="270" y="40" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="40" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">i</text>
  <text x="185" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">最优平衡末段</text>
  <text x="325" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">转移 dp[j]+1</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">dp[i]</text>

  <!-- 行 1 -->
  <rect x="60" y="66" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="66" width="170" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="66" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="66" width="80" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="185" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f（j=0）</text>
  <text x="325" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 + 1</text>
  <text x="420" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="60" y="92" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="92" width="170" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="92" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="92" width="80" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="185" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">fa（j=0）</text>
  <text x="325" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 + 1</text>
  <text x="420" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 3（最优路径，绿） -->
  <rect x="60" y="118" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="118" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="270" y="118" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="118" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="185" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">fab（j=0）</text>
  <text x="325" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 + 1</text>
  <text x="420" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 行 4 -->
  <rect x="60" y="144" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="144" width="170" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="144" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="144" width="80" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="185" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">fabc（j=0）</text>
  <text x="325" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 + 1</text>
  <text x="420" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 5 -->
  <rect x="60" y="170" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="170" width="170" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="170" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="170" width="80" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="185" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c / cc（j=4 / 3）</text>
  <text x="325" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + 1</text>
  <text x="420" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 6 -->
  <rect x="60" y="196" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="196" width="170" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="196" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="196" width="80" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="185" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cd（j=4）</text>
  <text x="325" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + 1</text>
  <text x="420" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 7（最优路径，绿） -->
  <rect x="60" y="222" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="222" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="270" y="222" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="222" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="185" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ccdd（j=3）</text>
  <text x="325" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + 1</text>
  <text x="420" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 行 8（最优路径，绿） -->
  <rect x="60" y="248" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="248" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="270" y="248" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="248" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="185" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">g（j=7）</text>
  <text x="325" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 + 1</text>
  <text x="420" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <text x="260" y="296" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">每一行都取最小的 dp[j] + 1；单字符必平衡 ⇒ dp[i] ≤ dp[i−1] + 1 永远有值</text>

  <text x="260" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">回溯绿色行：dp[8] → dp[7] → dp[3] → dp[0]，切分如下</text>

  <rect x="150" y="336" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="183" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">fab</text>
  <rect x="222" y="336" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ccdd</text>
  <rect x="316" y="336" width="26" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="329" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">g</text>
  <text x="360" y="359" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">= 3 段 ✓</text>

  <text x="260" y="390" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">另一组合法切分 fabc | cd | dg 同样是 3 段</text>
</svg>
