<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="150" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：预处理后缀最小 + 一趟扫描</text>

  <!-- 右上：要点说明框 -->
  <g filter="url(#rough2)">
    <rect x="335" y="16" width="172" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="421" y="34" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">为什么是 O(n)</text>
    <text x="421" y="50" text-anchor="middle" font-size="10.5" fill="#8a6d1f">pre 增量更新 O(1)</text>
    <text x="421" y="66" text-anchor="middle" font-size="10.5" fill="#8a6d1f">sufMin 查表 O(1)</text>
  </g>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="100" y="16" width="100" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="34" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">开始</text>
  </g>
  <path d="M 150 42 L 150 52" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 预处理 sufMin -->
  <g filter="url(#rough2)">
    <rect x="30" y="54" width="240" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="150" y="74" text-anchor="middle" font-size="10.5" fill="#2f5d24">j 从 n−1 往左：sufMin[j] ← min(nums[j], sufMin[j+1])</text>
  </g>
  <path d="M 150 86 L 150 96" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="68" y="98" width="164" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="117" text-anchor="middle" font-size="11.5" fill="#33506b">pre ← 0，ans ← −∞，i ← 0</text>
  </g>
  <path d="M 150 128 L 150 138" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 i ≤ n−2 -->
  <g filter="url(#rough2)">
    <polygon points="150,138 220,166 150,194 80,166" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="150" y="170" text-anchor="middle" font-size="12" fill="#2f5d24">i ≤ n−2 ?</text>
  </g>
  <text x="230" y="160" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 220 166 L 320 166" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回与结束 -->
  <g filter="url(#rough2)">
    <rect x="322" y="150" width="110" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="377" y="170" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold">返回 ans</text>
  </g>
  <path d="M 377 182 L 377 194" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="347" y="196" width="60" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="377" y="213" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">结束</text>
  </g>

  <text x="158" y="206" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 150 194 L 150 206" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pre 增量更新 -->
  <g filter="url(#rough2)">
    <rect x="58" y="208" width="184" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="227" text-anchor="middle" font-size="11.5" fill="#33506b">pre ← pre + nums[i]</text>
  </g>
  <path d="M 150 238 L 150 248" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取 max -->
  <g filter="url(#rough2)">
    <rect x="42" y="250" width="216" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="150" y="270" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">ans ← max(ans, pre − sufMin[i+1])</text>
  </g>
  <path d="M 150 282 L 150 292" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i 自增 -->
  <g filter="url(#rough2)">
    <rect x="78" y="294" width="144" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="312" text-anchor="middle" font-size="11.5" fill="#33506b">i ← i + 1</text>
  </g>

  <!-- 循环回边 -->
  <path d="M 78 308 L 40 308 L 40 166 L 76 166" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text transform="rotate(-90 30 240)" x="30" y="240" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">循环</text>

  <!-- 底部提示 -->
  <g filter="url(#rough2)">
    <rect x="286" y="238" width="221" height="98" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="396" y="258" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold">易错点</text>
    <text x="396" y="276" text-anchor="middle" font-size="10" fill="#8a3a34">① i 只取到 n−2（右边非空）</text>
    <text x="396" y="294" text-anchor="middle" font-size="10" fill="#8a3a34">② ans 初值 −∞，不能取 0</text>
    <text x="396" y="312" text-anchor="middle" font-size="10" fill="#8a3a34">（全负数组得分为负）</text>
    <text x="396" y="330" text-anchor="middle" font-size="10" fill="#8a3a34">③ C++ 用 long long 存 pre/ans</text>
  </g>
</svg>
