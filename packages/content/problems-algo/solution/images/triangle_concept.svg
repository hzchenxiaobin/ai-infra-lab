<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三角形最小路径和：每步走到「正下方」或「右下方」相邻格子</text>

  <!-- Row 0: [2]  center 260 -->
  <rect x="238" y="50" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- Row 1: [3,4]  centers 235, 285 -->
  <rect x="213" y="100" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="123" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="263" y="100" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="123" text-anchor="middle" font-size="14" fill="#333">4</text>

  <!-- Row 2: [6,5,7]  centers 210, 260, 310 -->
  <rect x="188" y="150" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="173" text-anchor="middle" font-size="14" fill="#333">6</text>
  <rect x="238" y="150" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="173" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="288" y="150" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="173" text-anchor="middle" font-size="14" fill="#333">7</text>

  <!-- Row 3: [4,1,8,3]  centers 185, 235, 285, 335 -->
  <rect x="163" y="200" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="223" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="213" y="200" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="223" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="263" y="200" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="223" text-anchor="middle" font-size="14" fill="#333">8</text>
  <rect x="313" y="200" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="223" text-anchor="middle" font-size="14" fill="#333">3</text>

  <!-- Optimal path arrows (solid orange) 2->3->5->1 -->
  <path d="M 260 88 L 235 98" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 235 138 L 260 148" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 260 188 L 235 198" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Adjacent-move illustration from cell (1,1)=4 to (2,1)=5 and (2,2)=7 -->
  <path d="M 285 138 L 260 148" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 285 138 L 310 148" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="118" font-size="10" fill="#446688">正下方 j</text>
  <text x="345" y="158" font-size="10" fill="#446688">右下方 j+1</text>

  <!-- Row index labels -->
  <text x="120" y="73" font-size="11" fill="#888">row 0</text>
  <text x="120" y="123" font-size="11" fill="#888">row 1</text>
  <text x="120" y="173" font-size="11" fill="#888">row 2</text>
  <text x="120" y="223" font-size="11" fill="#888">row 3</text>

  <!-- Legend -->
  <rect x="40" y="265" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="287" text-anchor="middle" font-size="11" fill="#444">橙色 = 最优路径 2→3→5→1 = 11</text>

  <rect x="270" y="265" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="287" text-anchor="middle" font-size="11" fill="#444">虚线 = (r,j) 可走到 (r+1,j) 或 (r+1,j+1)</text>

  <!-- Summary -->
  <rect x="40" y="312" width="440" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#444">每步只能走到相邻下方格 → 天然的「无后效性」结构，适合 DP</text>
</svg>
