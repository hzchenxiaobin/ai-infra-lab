<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算（示例 2）：signalSpeed = 3</text>
  <text x="260" y="40" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">edges = [[0,6,3],[6,5,3],[0,3,1],[3,2,7],[3,1,6],[3,4,2]]，以 0 为根，节点标注 = 到 0 的距离</text>

  <!-- root 0 -->
  <circle cx="250" cy="70" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="75" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- branch boxes -->
  <rect x="24" y="134" width="160" height="166" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <rect x="226" y="134" width="276" height="166" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="104" y="155" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">分支①（经 6）cnt=2</text>
  <text x="364" y="155" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">分支②（经 3）cnt=1</text>

  <!-- edges -->
  <path d="M 239 82 L 114 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 261 82 L 354 172" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="168" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">w=3</text>
  <text x="312" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">w=1</text>

  <path d="M 95 200 L 66 244" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="88" y="222" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <path d="M 352 200 L 293 245" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 364 202 L 364 244" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 376 200 L 444 245" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="316" y="216" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="374" y="226" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="412" y="216" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>

  <!-- nodes -->
  <circle cx="104" cy="186" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="104" y="191" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="130" y="190" text-anchor="start" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d=3 ✓</text>

  <circle cx="58" cy="262" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="58" y="267" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="58" y="296" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d=6 ✓</text>

  <circle cx="364" cy="186" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="364" y="191" text-anchor="middle" font-size="11" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="390" y="190" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">d=1 ✗</text>

  <circle cx="286" cy="262" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="286" y="267" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">2</text>
  <text x="286" y="296" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">d=8 ✗</text>

  <circle cx="364" cy="262" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="364" y="267" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">1</text>
  <text x="364" y="296" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">d=7 ✗</text>

  <circle cx="452" cy="262" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="452" y="267" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="452" y="296" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d=3 ✓</text>

  <!-- summary box -->
  <rect x="20" y="308" width="480" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c = 0：分支① 中 6（d=3）、5（d=6）→ cnt=2；分支② 仅 4（d=3）→ cnt=1</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">对数 = 2×1 = 2，合格对 (4,5) 与 (4,6) —— 两端分属不同分支 ✓</text>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">c = 6：分支 {0,3,2,1,4} 中 0（d=3）、4（d=6）→ cnt=2；分支 {5}（d=3）→ cnt=1 → 2</text>
  <text x="260" y="388" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">其余节点作根：合格节点全落在同一分支内 → 无法跨分支组合 → 0</text>
  <text x="260" y="410" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案：[2, 0, 0, 0, 0, 0, 2] ✓</text>
</svg>
