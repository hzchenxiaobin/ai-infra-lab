<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：多源 BFS → check → 二分搜索</text>

  <!-- Step 1: Multi-source BFS -->
  <rect x="120" y="48" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 多源 BFS：所有火源入队，计算 fire[i][j]</text>

  <path d="M 260 92 L 260 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Decision - check(0) -->
  <polygon points="260,112 380,158 260,204 140,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">② check(0)?</text>
  <text x="260" y="170" text-anchor="middle" font-size="9.5" fill="#666">wait=0 能否到达安全屋？</text>

  <!-- No branch: return -1 -->
  <path d="M 380 158 L 420 158" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="152" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">No</text>
  <rect x="420" y="142" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return -1</text>

  <!-- Yes branch -->
  <path d="M 260 204 L 260 220" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="216" font-size="9" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- Step 3: Decision - all-INF path -->
  <polygon points="260,224 380,270 260,316 140,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">③ 存在火势不可达</text>
  <text x="260" y="280" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">的路径？</text>
  <text x="260" y="296" text-anchor="middle" font-size="9" fill="#666">fire[0][0]==INF 且</text>
  <text x="260" y="308" text-anchor="middle" font-size="9" fill="#666">全 INF 路径可达安全屋</text>

  <!-- Yes branch: return 1e9 -->
  <path d="M 380 270 L 420 270" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="420" y="254" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="460" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">10⁹</text>

  <!-- No branch -->
  <path d="M 260 316 L 260 332" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="328" font-size="9" fill="#666" font-weight="bold">No</text>

  <!-- Step 4: Binary search -->
  <rect x="100" y="336" width="320" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 二分搜索 [0, m·n]：找最大 wait 使 check 通过</text>

  <path d="M 260 380 L 260 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Return -->
  <rect x="160" y="400" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="420" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ return max_wait</text>

  <!-- check function detail box -->
  <rect x="370" y="336" width="140" height="74" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="440" y="352" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">check(wait) 判定：</text>
  <text x="378" y="368" font-size="8.5" fill="#555">中间格：人时 &lt; fire</text>
  <text x="378" y="382" font-size="8.5" fill="#555">安全屋：人时 ≤ fire</text>
  <text x="378" y="396" font-size="8.5" fill="#555">起点：wait &lt; fire[0][0]</text>
</svg>
