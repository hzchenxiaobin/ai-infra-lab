<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：DFS 搜索树关键分支</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">values=[0,32,10,43], maxTime=49 · 邻居按价值降序：先 3 后 1</text>

  <!-- ============ DFS Tree ============ -->

  <!-- Level 0: node 0 -->
  <rect x="235" y="56" width="90" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">node=0, t=0</text>
  <text x="280" y="86" text-anchor="middle" font-size="9.5" fill="#666">val=0, ans=0</text>

  <!-- Branch to 3 (green, explored first) -->
  <path d="M 265 94 L 155 130" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="195" y="108" font-size="9" fill="#4a7a3a">→3, +10s</text>

  <!-- Branch to 1 (blue, explored later) -->
  <path d="M 295 94 L 405 130" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="108" font-size="9" fill="#446688">→1, +10s</text>

  <!-- Level 1: node 3 (left) -->
  <rect x="100" y="132" width="95" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="147" y="148" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">node=3, t=10</text>
  <text x="147" y="162" text-anchor="middle" font-size="9.5" fill="#4a7a3a">val=43 ↑</text>

  <!-- Level 1: node 1 (right, deferred) -->
  <rect x="360" y="132" width="95" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="407" y="148" text-anchor="middle" font-size="10.5" fill="#999">node=1, t=10</text>
  <text x="407" y="162" text-anchor="middle" font-size="9.5" fill="#999">(后探)</text>

  <!-- 3 -> 0 -->
  <path d="M 130 170 L 130 200" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="148" y="188" font-size="9" fill="#4a7a3a">→0, +10s</text>

  <!-- Level 2: node 0 (t=20) -->
  <rect x="85" y="202" width="95" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="132" y="218" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">node=0, t=20</text>
  <text x="132" y="232" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">ans=43 ✓</text>

  <!-- 0(t=20) -> 3 (explored) -->
  <path d="M 110 240 L 70 270" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="72" y="258" font-size="8.5" fill="#4a7a3a">→3</text>

  <!-- 0(t=20) -> 1 (key branch!) -->
  <path d="M 155 240 L 195 270" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="185" y="258" font-size="8.5" fill="#b85450" font-weight="bold">→1 ★</text>

  <!-- Level 3a: 0→3→0→3 (dead end) -->
  <rect x="30" y="272" width="80" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="287" text-anchor="middle" font-size="9.5" fill="#999">node=3,t=30</text>
  <text x="70" y="299" text-anchor="middle" font-size="9" fill="#999">→0: ans=43</text>
  <path d="M 70 306 L 70 316" stroke="#ccc" stroke-width="1" stroke-dasharray="2,2" fill="none" filter="url(#rough2)"/>
  <text x="70" y="328" text-anchor="middle" font-size="8.5" fill="#aaa">无提升,回溯</text>

  <!-- Level 3b: 0→3→0→1 (KEY!) -->
  <rect x="150" y="272" width="100" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="288" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">node=1, t=30</text>
  <text x="200" y="302" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">val=75 ↑↑</text>

  <!-- 1(t=30) -> 0 -->
  <path d="M 180 310 L 160 340" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="145" y="328" font-size="8.5" fill="#b85450">→0, +10s</text>

  <!-- 1(t=30) -> 2 (dead, can't return) -->
  <path d="M 220 310 L 250 340" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="328" font-size="8.5" fill="#999">→2, +11s</text>

  <!-- Level 4a: 0→3→0→1→0 (ANSWER!) -->
  <rect x="105" y="342" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="358" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">node=0, t=40</text>
  <text x="155" y="372" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">ans=75 ★★★</text>

  <!-- Level 4b: node 2 (can't return) -->
  <rect x="230" y="342" width="90" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="275" y="358" text-anchor="middle" font-size="9.5" fill="#b85450">node=2, t=41</text>
  <text x="275" y="372" text-anchor="middle" font-size="9" fill="#b85450">val=85</text>
  <text x="275" y="392" text-anchor="middle" font-size="8.5" fill="#b85450">→1: 41+11=52>49</text>
  <text x="275" y="404" text-anchor="middle" font-size="8.5" fill="#b85450">✗ 无法回 0！</text>

  <!-- ============ Summary box ============ -->
  <rect x="350" y="200" width="195" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="447" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最优路径</text>
  <text x="447" y="238" text-anchor="middle" font-size="10.5" fill="#333">0 → 3 → 0 → 1 → 0</text>
  <text x="447" y="254" text-anchor="middle" font-size="10" fill="#555">时间 = 10+10+10+10 = 40</text>
  <text x="447" y="270" text-anchor="middle" font-size="10" fill="#555">不同节点 {0,1,3}</text>

  <!-- Key insight -->
  <rect x="350" y="292" width="195" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="310" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键教训</text>
  <text x="447" y="326" text-anchor="middle" font-size="9.5" fill="#555">到节点 2 时 val=85 > 75</text>
  <text x="447" y="340" text-anchor="middle" font-size="9.5" fill="#555">但无法在 49s 内返回 0</text>
  <text x="447" y="354" text-anchor="middle" font-size="9.5" fill="#b85450">→ 只有回到 0 才算合法！</text>

  <!-- Legend -->
  <rect x="350" y="370" width="195" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="360" y="378" width="10" height="8" fill="#e6f4ea" stroke="#4a7a3a" rx="2"/>
  <text x="378" y="385" font-size="9" fill="#555">加值/答案</text>
  <rect x="430" y="378" width="10" height="8" fill="#fce4ec" stroke="#b85450" rx="2"/>
  <text x="448" y="385" font-size="9" fill="#555">关键分支</text>
  <rect x="360" y="394" width="10" height="8" fill="#e8f0fe" stroke="#446688" rx="2"/>
  <text x="378" y="401" font-size="9" fill="#555">回到 0</text>
  <rect x="430" y="394" width="10" height="8" fill="#f5f5f5" stroke="#bbb" stroke-dasharray="2,2" rx="2"/>
  <text x="448" y="401" font-size="9" fill="#555">无提升/后探</text>
  <text x="447" y="418" text-anchor="middle" font-size="9" fill="#888">★ = 最优解路径</text>
</svg>
