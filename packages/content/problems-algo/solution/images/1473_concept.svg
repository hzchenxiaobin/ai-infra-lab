<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    状态 dp[i][j][k]：房子 i 涂颜色 j，已形成 k 个街区
  </text>

  <!-- 房子一排 [1,2,2,1,1] -->
  <!-- house 0 颜色1 蓝 -->
  <rect x="70" y="62" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="96" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">1</text>
  <text x="98" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>

  <!-- house 1 颜色2 绿 -->
  <rect x="134" y="62" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="96" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="162" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>

  <!-- house 2 颜色2 绿 -->
  <rect x="198" y="62" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="226" y="96" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="226" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>

  <!-- house 3 颜色1 蓝 (强调：当前考察的房子) -->
  <rect x="262" y="62" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="96" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="290" y="124" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">i=3</text>

  <!-- house 4 颜色1 蓝 -->
  <rect x="326" y="62" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="354" y="96" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">1</text>
  <text x="354" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=4</text>

  <!-- 街区括号 -->
  <!-- 街区1 {1} -->
  <path d="M72,128 L72,138 L96,138 L96,128" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="154" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">街区1</text>

  <!-- 街区2 {2,2} -->
  <path d="M136,128 L136,138 L222,138 L222,128" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="179" y="154" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">街区2</text>

  <!-- 街区3 {1,1} -->
  <path d="M264,128 L264,138 L380,138 L380,128" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="154" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">街区3</text>

  <!-- 从 house 3 引箭头到下方三维度 -->
  <path d="M290,128 Q290,175 300,195" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 三个维度框 -->
  <!-- i 维度 -->
  <rect x="70" y="210" width="130" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="135" y="234" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">i = 3</text>
  <text x="135" y="254" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">房子编号 [0,m-1]</text>

  <!-- j 维度 (强调) -->
  <rect x="215" y="210" width="130" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">j = 1</text>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">颜色 [1,n]</text>

  <!-- k 维度 (强调) -->
  <rect x="360" y="210" width="130" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="425" y="234" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">k = 3</text>
  <text x="425" y="254" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">街区数 [1,target]</text>

  <!-- 转移说明 -->
  <rect x="70" y="296" width="420" height="64" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    看前一个房子颜色 p：
  </text>
  <text x="280" y="338" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    p = j → 同色并入旧街区，k 不变 ｜ p ≠ j → 另起新街区，k 由 k-1 转来
  </text>

  <!-- 图例：颜色 -->
  <rect x="412" y="62" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="432" y="74" font-size="10.5" fill="#555" filter="url(#rough2)">颜色1</text>
  <rect x="412" y="84" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="432" y="96" font-size="10.5" fill="#555" filter="url(#rough2)">颜色2</text>
</svg>
