<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：JOIN + 三条件过滤 → DISTINCT 标题</text>
  <text x="350" y="46" text-anchor="middle" font-size="10.5" fill="#888">TVProgram ⋈ Content (ON content_id) → WHERE 月份='2020-06' AND Kids='Y' AND type='Movies'</text>

  <!-- ===== TVProgram table (left) ===== -->
  <text x="110" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">TVProgram</text>
  <rect x="20" y="80" width="220" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="96" text-anchor="middle" font-size="9.5" fill="#333">program_date</text>
  <text x="150" y="96" text-anchor="middle" font-size="9.5" fill="#333">content_id</text>
  <text x="212" y="96" text-anchor="middle" font-size="9.5" fill="#333">channel</text>

  <!-- row: 06-10, 1 -->
  <rect x="20" y="104" width="220" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="119" text-anchor="middle" font-size="9.5" fill="#333">2020-06-10</text>
  <text x="150" y="119" text-anchor="middle" font-size="9.5" fill="#446688">1</text>
  <text x="212" y="119" text-anchor="middle" font-size="9.5" fill="#333">LC-Channel</text>

  <!-- row: 05-11, 2 -->
  <rect x="20" y="126" width="220" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="141" text-anchor="middle" font-size="9.5" fill="#333">2020-05-11</text>
  <text x="150" y="141" text-anchor="middle" font-size="9.5" fill="#446688">2</text>
  <text x="212" y="141" text-anchor="middle" font-size="9.5" fill="#333">LC-Channel</text>

  <!-- row: 05-13, 4 -->
  <rect x="20" y="148" width="220" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="163" text-anchor="middle" font-size="9.5" fill="#333">2020-05-13</text>
  <text x="150" y="163" text-anchor="middle" font-size="9.5" fill="#446688">4</text>
  <text x="212" y="163" text-anchor="middle" font-size="9.5" fill="#333">Disney Ch</text>

  <!-- row: 06-18, 4  (命中) -->
  <rect x="20" y="170" width="220" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="185" text-anchor="middle" font-size="9.5" fill="#333">2020-06-18</text>
  <text x="150" y="185" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="212" y="185" text-anchor="middle" font-size="9.5" fill="#333">Disney Ch</text>
  <text x="244" y="183" font-size="8.5" fill="#4a7a3a">←命中</text>

  <!-- row: 07-15, 5 -->
  <rect x="20" y="192" width="220" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="207" text-anchor="middle" font-size="9.5" fill="#333">2020-07-15</text>
  <text x="150" y="207" text-anchor="middle" font-size="9.5" fill="#446688">5</text>
  <text x="212" y="207" text-anchor="middle" font-size="9.5" fill="#333">Disney Ch</text>
  <text x="244" y="205" font-size="8.5" fill="#b85450">←本月</text>

  <!-- ===== Content table (right) ===== -->
  <text x="490" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">Content</text>
  <rect x="320" y="80" width="340" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="96" text-anchor="middle" font-size="9" fill="#333">content_id</text>
  <text x="438" y="96" text-anchor="middle" font-size="9" fill="#333">title</text>
  <text x="545" y="96" text-anchor="middle" font-size="9" fill="#333">Kids_content</text>
  <text x="628" y="96" text-anchor="middle" font-size="9" fill="#333">content_type</text>

  <!-- content 1 -->
  <rect x="320" y="104" width="340" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="352" y="119" text-anchor="middle" font-size="9" fill="#446688">1</text>
  <text x="438" y="119" text-anchor="middle" font-size="9" fill="#333">Leetcode Movie</text>
  <text x="545" y="119" text-anchor="middle" font-size="9" fill="#b85450">N</text>
  <text x="628" y="119" text-anchor="middle" font-size="9" fill="#333">Movies</text>

  <!-- content 4 (Aladdin) 命中 -->
  <rect x="320" y="126" width="340" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="141" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="438" y="141" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Aladdin</text>
  <text x="545" y="141" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="628" y="141" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Movies</text>
  <text x="664" y="139" font-size="8.5" fill="#4a7a3a">✓</text>

  <!-- content 5 (Cinderella) 本月干扰 -->
  <rect x="320" y="148" width="340" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="352" y="163" text-anchor="middle" font-size="9" fill="#446688">5</text>
  <text x="438" y="163" text-anchor="middle" font-size="9" fill="#333">Cinderella</text>
  <text x="545" y="163" text-anchor="middle" font-size="9" fill="#4a7a3a">Y</text>
  <text x="628" y="163" text-anchor="middle" font-size="9" fill="#333">Movies</text>
  <text x="664" y="161" font-size="8.5" fill="#b85450">✗本月</text>

  <!-- content 2 (Alg for Kids) Series干扰 -->
  <rect x="320" y="170" width="340" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="352" y="185" text-anchor="middle" font-size="9" fill="#446688">2</text>
  <text x="438" y="185" text-anchor="middle" font-size="9" fill="#333">Alg. for Kids</text>
  <text x="545" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a">Y</text>
  <text x="628" y="185" text-anchor="middle" font-size="9" fill="#333">Series</text>
  <text x="664" y="183" font-size="8.5" fill="#d6a040">✗非电影</text>

  <!-- JOIN label + arrow -->
  <text x="280" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">JOIN ON</text>
  <text x="280" y="86" text-anchor="middle" font-size="9.5" fill="#446688">content_id</text>
  <path d="M 240 181 C 268 181, 292 137, 318 137" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" stroke-dasharray="4 3"/>

  <!-- ===== Three filter pills (bottom) ===== -->
  <text x="350" y="250" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">WHERE 三条件 AND</text>

  <!-- filter 1: month -->
  <rect x="40" y="262" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="280" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">① 上月 = 2020-06</text>
  <text x="140" y="295" text-anchor="middle" font-size="9" fill="#555" font-family="'Comic Sans MS', monospace">DATE_FORMAT(date,'%Y-%m')='2020-06'</text>

  <!-- filter 2: kids -->
  <rect x="250" y="262" width="200" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="280" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">② 儿童适宜 Kids='Y'</text>
  <text x="350" y="295" text-anchor="middle" font-size="9" fill="#555" font-family="'Comic Sans MS', monospace">Kids_content = 'Y'</text>

  <!-- filter 3: movies -->
  <rect x="460" y="262" width="200" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="560" y="280" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">③ 电影 type='Movies'</text>
  <text x="560" y="295" text-anchor="middle" font-size="9" fill="#555" font-family="'Comic Sans MS', monospace">content_type = 'Movies'</text>

  <!-- arrow down to result -->
  <path d="M 350 304 L 350 332" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="362" y="324" font-size="9.5" fill="#4a7a3a">SELECT DISTINCT</text>

  <!-- Result box -->
  <rect x="230" y="338" width="240" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="357" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">结果 title</text>
  <text x="350" y="375" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Aladdin</text>

  <!-- footer note -->
  <text x="350" y="406" text-anchor="middle" font-size="10" fill="#888">06-18 的 content_id=4 经 JOIN 取到 Aladdin（Y + Movies），7 月 Cinderella 虽满足②③但落在本月被①排除</text>
  <text x="350" y="424" text-anchor="middle" font-size="9.5" fill="#aaa">三条件全部 AND：缺一不可；DISTINCT 去重同标题（同一 content 多次播放只取一次）</text>
</svg>
