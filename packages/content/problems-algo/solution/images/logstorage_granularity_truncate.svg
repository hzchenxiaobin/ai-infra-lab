<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">粒度截断：只比较指定层级及以上的前缀</text>

  <!-- timestamp label -->
  <text x="100" y="78" text-anchor="end" font-size="10" fill="#888">timestamp</text>

  <!-- field boxes: 2017 : 01 : 01 : 23 : 59 : 59 -->
  <rect x="112" y="58" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2017</text>

  <text x="162" y="79" text-anchor="middle" font-size="12" fill="#888">:</text>

  <rect x="166" y="58" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">01</text>

  <text x="216" y="79" text-anchor="middle" font-size="12" fill="#888">:</text>

  <rect x="220" y="58" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">01</text>

  <text x="270" y="79" text-anchor="middle" font-size="12" fill="#888">:</text>

  <rect x="274" y="58" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">23</text>

  <text x="324" y="79" text-anchor="middle" font-size="12" fill="#888">:</text>

  <rect x="328" y="58" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">59</text>

  <text x="378" y="79" text-anchor="middle" font-size="12" fill="#888">:</text>

  <rect x="382" y="58" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">59</text>

  <!-- field domain labels -->
  <text x="135" y="104" text-anchor="middle" font-size="9.5" fill="#888">Year</text>
  <text x="189" y="104" text-anchor="middle" font-size="9.5" fill="#888">Mon</text>
  <text x="243" y="104" text-anchor="middle" font-size="9.5" fill="#888">Day</text>
  <text x="297" y="104" text-anchor="middle" font-size="9.5" fill="#888">Hour</text>
  <text x="351" y="104" text-anchor="middle" font-size="9.5" fill="#888">Min</text>
  <text x="405" y="104" text-anchor="middle" font-size="9.5" fill="#888">Sec</text>

  <!-- granularity bars (nested, each wider) -->
  <!-- Year: 112 -> 158 -->
  <rect x="112" y="134" width="46" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="143" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">Year</text>
  <text x="166" y="143" font-size="10" fill="#666">→ "2017" · len=4</text>

  <!-- Month: 112 -> 212 -->
  <rect x="112" y="162" width="100" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="171" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">Month</text>
  <text x="220" y="171" font-size="10" fill="#666">→ "2017:01" · len=7</text>

  <!-- Day: 112 -> 266 -->
  <rect x="112" y="190" width="154" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="199" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">Day</text>
  <text x="274" y="199" font-size="10" fill="#666">→ "2017:01:01" · len=10</text>

  <!-- Hour: 112 -> 320 -->
  <rect x="112" y="218" width="208" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="227" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">Hour</text>
  <text x="328" y="227" font-size="10" fill="#666">→ "2017:01:01:23" · len=13</text>

  <!-- Minute: 112 -> 374 -->
  <rect x="112" y="246" width="262" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="255" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">Minute</text>
  <text x="382" y="255" font-size="10" fill="#666">→ len=16</text>

  <!-- Second: 112 -> 428 -->
  <rect x="112" y="274" width="316" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="283" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">Second</text>
  <text x="436" y="283" font-size="10" fill="#666">→ len=19</text>

  <!-- takeaway -->
  <rect x="60" y="304" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#444">字段均零填充 → 等长字符串字典序 = 时间顺序</text>
  <text x="270" y="338" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">截断后直接字符串比较即可，无需转数字</text>
</svg>
