<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：判自身 → 逐位向上取整找首个合法候选</text>

  <!-- Start -->
  <rect x="200" y="40" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="59" text-anchor="middle" font-size="12" fill="#333">开始：输入 n, target</text>
  <path d="M 270 68 L 270 86" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: n beautiful? -->
  <path d="M 270 88 L 372 124 L 270 160 L 168 124 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="11" fill="#333">digitSum(n)</text>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#333">≤ target ?</text>

  <!-- 是 → return 0 -->
  <path d="M 372 124 L 420 124" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="386" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="420" y="108" width="96" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="468" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return 0</text>

  <!-- 否 → init -->
  <path d="M 270 160 L 270 178" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="174" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- init box -->
  <rect x="170" y="180" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="12" fill="#333">base = 1   ( 即 p = 0 )</text>
  <path d="M 270 214 L 270 234" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: prefix+1 beautiful? -->
  <path d="M 270 236 L 388 272 L 270 308 L 152 272 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="268" text-anchor="middle" font-size="11" fill="#333">digitSum( n//base</text>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#333">+ 1 ) ≤ target ?</text>

  <!-- 是 → return x -->
  <path d="M 388 272 L 414 272" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="398" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="414" y="250" width="118" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="473" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return</text>
  <text x="473" y="288" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(n//base+1)·base − n</text>

  <!-- 否 → update box → loop back -->
  <path d="M 152 272 L 96 272" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="266" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="18" y="256" width="78" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="57" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">base *= 10</text>

  <!-- loop back: up then right to diamond2 top -->
  <path d="M 57 256 L 57 234" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 57 234 L 270 234" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="228" font-size="10" fill="#888">p += 1，回到判定</text>

  <!-- termination note -->
  <rect x="40" y="326" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.55"/>
  <text x="270" y="348" text-anchor="middle" font-size="10" fill="#4a7a3a">终止性：当 base &gt; n 时 n//base = 0，digitSum(0+1)=1 ≤ target，循环必在 p ≤ 13 步内结束</text>
</svg>
