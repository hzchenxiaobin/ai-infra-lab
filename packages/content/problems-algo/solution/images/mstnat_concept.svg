<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三种情况：p 与 q 的子树包含关系</text>

  <!-- ===== Panel 1: Case 1 — q in p's subtree ===== -->
  <text x="95" y="56" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">Case 1: q ∈ p 的子树</text>

  <!-- edges -->
  <path d="M 88 82 Q 70 100 65 116" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 102 82 Q 120 100 125 116" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 59 142 Q 56 158 55 172" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- p node -->
  <circle cx="95" cy="72" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="95" y="77" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">p</text>

  <!-- children -->
  <circle cx="65" cy="130" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="134" text-anchor="middle" font-size="11" fill="#333">·</text>

  <circle cx="125" cy="130" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="134" text-anchor="middle" font-size="11" fill="#333">·</text>

  <!-- q node (descendant of p) -->
  <circle cx="55" cy="186" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">q</text>

  <!-- result -->
  <text x="95" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠ 需重连（防环）</text>
  <text x="95" y="240" text-anchor="middle" font-size="10" fill="#888">p→q 会成环</text>

  <!-- ===== Panel 2: Case 2 — p in q's subtree ===== -->
  <text x="275" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">Case 2: p ∈ q 的子树</text>

  <!-- edges -->
  <path d="M 275 82 L 275 116" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 275 142 L 275 172" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- q node (ancestor) -->
  <circle cx="275" cy="72" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="275" y="77" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">q</text>

  <!-- middle node -->
  <circle cx="275" cy="130" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="134" text-anchor="middle" font-size="11" fill="#333">·</text>

  <!-- p node (descendant of q) -->
  <circle cx="275" cy="186" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="275" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">p</text>

  <!-- result -->
  <text x="275" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 直接移动 p</text>
  <text x="275" y="240" text-anchor="middle" font-size="10" fill="#888">无环风险</text>

  <!-- ===== Panel 3: Case 3 — neither ===== -->
  <text x="455" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">Case 3: 互不包含</text>

  <!-- edges -->
  <path d="M 448 82 Q 430 100 425 116" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 462 82 Q 480 100 485 116" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 485 142 L 485 172" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- root -->
  <circle cx="455" cy="72" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="76" text-anchor="middle" font-size="11" fill="#333">·</text>

  <!-- p (separate branch) -->
  <circle cx="425" cy="130" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="425" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">p</text>

  <!-- middle node -->
  <circle cx="485" cy="130" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="134" text-anchor="middle" font-size="11" fill="#333">·</text>

  <!-- q (separate branch) -->
  <circle cx="485" cy="186" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="485" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">q</text>

  <!-- result -->
  <text x="455" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 直接移动 p</text>
  <text x="455" y="240" text-anchor="middle" font-size="10" fill="#888">无环风险</text>

  <!-- ===== Bottom summary ===== -->
  <path d="M 30 262 L 530 262" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#555">核心判断：<tspan fill="#b85450" font-weight="bold">q 是否在 p 的子树中？</tspan></text>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#555">是 → Case 1（四步重连）     否 → Case 2/3（两步直接移）</text>
</svg>
