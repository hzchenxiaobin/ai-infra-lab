<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
    <marker id="arrU" markerWidth="9" markerHeight="9" refX="4.5" refY="1" orient="auto">
      <path d="M0,8 L9,8 L4.5,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">插入位置 = 第一个 ≥ target 的下标（lower_bound）</text>

  <!-- ===== Case 1: target exists ===== -->
  <text x="20" y="64" font-size="12" fill="#446688" font-weight="bold">① target=5：已存在 → 返回其下标</text>
  <rect x="70" y="74" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="94" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="135" y="74" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="94" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="200" y="74" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="265" y="74" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="94" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="100" y="120" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="165" y="120" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="230" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="295" y="120" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <rect x="360" y="80" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">nums[2]==5 → 返回 2</text>

  <!-- ===== Case 2: insert in middle ===== -->
  <text x="20" y="168" font-size="12" fill="#446688" font-weight="bold">② target=2：不存在 → 插入到中间空位</text>
  <rect x="70" y="178" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="198" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="135" y="178" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="198" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="200" y="178" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="198" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="265" y="178" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="198" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="100" y="224" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="165" y="224" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="230" y="224" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="295" y="224" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <!-- insert marker between index 0 and 1 (x≈132) -->
  <path d="M 132 174 L 132 154" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="132" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">插入↓</text>
  <rect x="360" y="184" width="170" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="202" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">首个 ≥2 的位置 → 返回 1</text>

  <!-- ===== Case 3: insert at end ===== -->
  <text x="20" y="272" font-size="12" fill="#446688" font-weight="bold">③ target=7：比所有都大 → 插入到末尾</text>
  <rect x="70" y="282" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="302" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="135" y="282" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="302" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="200" y="282" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="302" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="265" y="282" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="302" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="100" y="328" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="165" y="328" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="230" y="328" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="295" y="328" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <!-- insert marker after last cell (x≈330) -->
  <path d="M 330 278 L 330 258" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="330" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">插入↓</text>
  <text x="345" y="332" font-size="9" fill="#aaa">n=4</text>
  <rect x="360" y="288" width="170" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="306" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">无 ≥7 者 → 返回 n=4</text>

  <!-- ===== key takeaway ===== -->
  <rect x="40" y="352" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">统一答案：ans = 第一个满足 nums[i] ≥ target 的下标 i</text>
  <text x="270" y="388" text-anchor="middle" font-size="10.5" fill="#555">存在则 i 即其下标；不存在则 i 即插入点（含 0 与 n 两种边界）</text>
</svg>
