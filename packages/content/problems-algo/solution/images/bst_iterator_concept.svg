<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">受控中序：栈里只留左链，按需推进</text>

  <!-- BST 树 -->
  <text x="40" y="58" font-size="12" fill="#888">BST：</text>
  <circle cx="150" cy="92" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <circle cx="95" cy="158" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <line x1="138" y1="104" x2="103" y2="146" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="215" cy="158" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="162" text-anchor="middle" font-size="11" fill="#333">15</text>
  <line x1="162" y1="104" x2="207" y2="146" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="170" cy="222" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="226" text-anchor="middle" font-size="10" fill="#333">9</text>
  <line x1="205" y1="170" x2="176" y2="212" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="260" cy="222" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="10" fill="#333">20</text>
  <line x1="225" y1="170" x2="254" y2="212" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 左链标注 -->
  <path d="M 60 150 Q 40 120 50 92" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="30" y="180" font-size="11" fill="#b85450" font-weight="bold">左链</text>
  <text x="30" y="196" font-size="10" fill="#b85450">(待访问)</text>

  <!-- 中间箭头 -->
  <text x="150" y="282" text-anchor="middle" font-size="11" fill="#666">构造时压入</text>
  <path d="M 150 268 L 150 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 栈：只存左链 -->
  <text x="320" y="58" font-size="12" fill="#446688" font-weight="bold">栈（受控中序）</text>
  <rect x="318" y="98" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="353" y="117" text-anchor="middle" font-size="11" fill="#888">栈底</text>
  <rect x="318" y="128" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="353" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="318" y="158" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="177" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3 ← 顶</text>
  <rect x="318" y="188" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="353" y="205" text-anchor="middle" font-size="11" fill="#888">栈顶</text>
  <text x="400" y="160" font-size="12" fill="#82b366" font-weight="bold">O(h) ✓</text>

  <!-- 全量数组对比 -->
  <text x="320" y="248" font-size="12" fill="#888">暴力：预存全量中序</text>
  <rect x="318" y="256" width="34" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="273" text-anchor="middle" font-size="10" fill="#999">3</text>
  <rect x="354" y="256" width="34" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="371" y="273" text-anchor="middle" font-size="10" fill="#999">7</text>
  <rect x="390" y="256" width="34" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="273" text-anchor="middle" font-size="10" fill="#999">9</text>
  <rect x="426" y="256" width="34" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="443" y="273" text-anchor="middle" font-size="10" fill="#999">15</text>
  <rect x="462" y="256" width="34" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="479" y="273" text-anchor="middle" font-size="10" fill="#999">20</text>
  <path d="M 318 252 L 496 284" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 318 284 L 496 252" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">O(n) ✗</text>

  <!-- 说明框 -->
  <rect x="40" y="328" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="350" font-size="12" fill="#333" font-weight="bold">栈只保留「左链祖先」，用到哪算到哪</text>
  <text x="60" y="368" font-size="11" fill="#555">弹栈顶 = 访问当前最小；补右子树左链 = 为右分支重建同样的不变量</text>
</svg>
