<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：S = "bbbcccdddaaa"</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">逐字符累积 cur，第 12 个字符 'a' 触发换行</text>

  <!-- ===== 12 个字符格子：每格 cur 处理后的值 ===== -->
  <text x="30" y="74" font-size="10" fill="#888">字符 →</text>
  <text x="30" y="96" font-size="10" fill="#888">cur →</text>

  <!-- char row labels + cur values; cell_w=42 starting x=58 -->
  <!-- 1 b -> 10 -->
  <rect x="58" y="60" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="74" text-anchor="middle" font-size="10" fill="#333">b</text>
  <text x="78" y="96" text-anchor="middle" font-size="10" fill="#333">10</text>
  <!-- 2 b -> 20 -->
  <rect x="100" y="60" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="74" text-anchor="middle" font-size="10" fill="#333">b</text>
  <text x="120" y="96" text-anchor="middle" font-size="10" fill="#333">20</text>
  <!-- 3 b -> 30 -->
  <rect x="142" y="60" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="162" y="74" text-anchor="middle" font-size="10" fill="#333">b</text>
  <text x="162" y="96" text-anchor="middle" font-size="10" fill="#333">30</text>
  <!-- 4 c -> 40 -->
  <rect x="184" y="60" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="74" text-anchor="middle" font-size="10" fill="#333">c</text>
  <text x="204" y="96" text-anchor="middle" font-size="10" fill="#333">40</text>
  <!-- 5 c -> 50 -->
  <rect x="226" y="60" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="246" y="74" text-anchor="middle" font-size="10" fill="#333">c</text>
  <text x="246" y="96" text-anchor="middle" font-size="10" fill="#333">50</text>
  <!-- 6 c -> 60 -->
  <rect x="268" y="60" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="288" y="74" text-anchor="middle" font-size="10" fill="#333">c</text>
  <text x="288" y="96" text-anchor="middle" font-size="10" fill="#333">60</text>
  <!-- 7 d -> 70 -->
  <rect x="310" y="60" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="74" text-anchor="middle" font-size="10" fill="#333">d</text>
  <text x="330" y="96" text-anchor="middle" font-size="10" fill="#333">70</text>
  <!-- 8 d -> 80 -->
  <rect x="352" y="60" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="372" y="74" text-anchor="middle" font-size="10" fill="#333">d</text>
  <text x="372" y="96" text-anchor="middle" font-size="10" fill="#333">80</text>
  <!-- 9 d -> 90 -->
  <rect x="394" y="60" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="414" y="74" text-anchor="middle" font-size="10" fill="#333">d</text>
  <text x="414" y="96" text-anchor="middle" font-size="10" fill="#333">90</text>
  <!-- 10 a -> 94 -->
  <rect x="436" y="60" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="456" y="74" text-anchor="middle" font-size="10" fill="#333">a</text>
  <text x="456" y="96" text-anchor="middle" font-size="10" fill="#333">94</text>
  <!-- 11 a -> 98 -->
  <rect x="478" y="60" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="498" y="74" text-anchor="middle" font-size="10" fill="#333">a</text>
  <text x="498" y="96" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">98</text>
  <!-- 12 a -> wrap! cur=4 -->
  <rect x="520" y="60" width="34" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="537" y="74" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a</text>
  <text x="537" y="96" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>

  <!-- wrap annotation -->
  <path d="M 498 104 L 498 116 L 537 116 L 537 124" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="128" font-size="10" fill="#b85450" font-weight="bold">98 + 4 = 102 &gt; 100 → 换行，cur 重置为 4</text>

  <!-- ===== 行宽可视化 ===== -->
  <text x="30" y="170" font-size="10" fill="#446688" font-weight="bold">第 1 行</text>
  <rect x="78" y="158" width="392" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="78" y="158" width="8" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="282" y="173" text-anchor="middle" font-size="10" fill="#333">bbbcccdddaa · 98 单位</text>
  <line x1="470" y1="154" x2="470" y2="186" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="470" y="150" text-anchor="middle" font-size="9" fill="#888">100</text>

  <text x="30" y="210" font-size="10" fill="#4a7a3a" font-weight="bold">第 2 行</text>
  <rect x="78" y="198" width="392" height="22" fill="none" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="78" y="198" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="96" y="213" font-size="10" fill="#b85450" font-weight="bold">a · 4</text>

  <!-- ===== 结果 ===== -->
  <rect x="30" y="240" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="262" font-size="11" fill="#4a7a3a" font-weight="bold">结果：lines = 2，cur = 4 → 返回 [2, 4]</text>
  <text x="44" y="280" font-size="10" fill="#555">前 11 个字符塞满第 1 行（98/100），第 12 个 'a' 放不下 → 落到第 2 行</text>
  <text x="44" y="296" font-size="10" fill="#888">关键：换行不是清零，而是把当前字符算到新行（cur = w）</text>
</svg>
