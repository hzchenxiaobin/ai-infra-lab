<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：nums = [5, 2, 5, 1, 5, 3], k = 2
  </text>

  <!-- Array cells [5, 2, 5, 1, 5, 3] -->
  <rect x="90" y="46" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="148" y="46" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="206" y="46" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="264" y="46" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="291" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="322" y="46" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="349" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="380" y="46" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- Index labels -->
  <text x="117" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="175" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="233" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="291" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="349" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="407" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>

  <text x="460" y="66" font-size="10" fill="#d6a040" filter="url(#rough2)">n=6, k=2, n−k=4</text>

  <!-- Table header -->
  <rect x="30" y="108" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="48" y="124" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">步</text>
  <rect x="66" y="108" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="124" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">i</text>
  <rect x="94" y="108" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="124" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">best</text>
  <rect x="130" y="108" width="400" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="330" y="124" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">比较与动作</text>

  <!-- Step 1: i=1, best=0, nums[1]=2 < nums[0]=5, i++ -->
  <rect x="30" y="134" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="48" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="66" y="134" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="94" y="134" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="130" y="134" width="400" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="153" font-size="10" fill="#333" filter="url(#rough2)">nums[1]=2 &lt; nums[0]=5 → 跳过, i++ → i=2</text>

  <!-- Step 2: i=2, best=0, nums[2]=5==nums[0]=5, compare j=1: nums[3]=1 < nums[1]=2, skip i+=2 -->
  <rect x="30" y="164" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="48" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="66" y="164" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="94" y="164" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="183" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="130" y="164" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="183" font-size="10" fill="#5a4a1a" filter="url(#rough2)">5==5 → 比较j=1: nums[3]=1 &lt; nums[1]=2 → </text>
  <text x="430" y="183" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">跳跃 i+=2 → i=4</text>

  <!-- Step 3: i=4, best=0, nums[4]=5==nums[0]=5, compare j=1: nums[5]=3 > nums[1]=2, best=4 -->
  <rect x="30" y="194" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="48" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="66" y="194" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="94" y="194" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="130" y="194" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="213" font-size="10" fill="#333" filter="url(#rough2)">5==5 → 比较j=1: nums[5]=3 &gt; nums[1]=2 → </text>
  <text x="410" y="213" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">best=4, i++ → i=5</text>

  <!-- Step 4: i=5 > n-k=4, done -->
  <rect x="30" y="224" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="48" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="66" y="224" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="94" y="224" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <rect x="130" y="224" width="400" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="243" font-size="10" fill="#b85450" filter="url(#rough2)">i=5 &gt; n−k=4 → 循环结束</text>

  <!-- Arrow down to answer -->
  <path d="M280,256 L280,268" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Answer box -->
  <rect x="150" y="272" width="260" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    答案 = nums[4:6] = [5, 3] ✓
  </text>
</svg>
