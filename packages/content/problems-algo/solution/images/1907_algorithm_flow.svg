<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：三个 COUNT 子查询 UNION ALL</text>

  <!-- Input -->
  <rect x="190" y="42" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入：Accounts 表（n 行）</text>

  <!-- Three subqueries -->
  <!-- Subquery 1: Low -->
  <path d="M 200 76 L 100 96" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="20" y="98" width="180" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">子查询① Low</text>
  <text x="30" y="136" font-size="9" fill="#555">SELECT 'Low Salary',</text>
  <text x="30" y="150" font-size="9" fill="#555">  COUNT(*)</text>
  <text x="30" y="164" font-size="9" fill="#555">FROM Accounts</text>
  <text x="30" y="176" font-size="9" fill="#4a7a3a">WHERE income &lt; 20000</text>

  <!-- Subquery 2: Average -->
  <path d="M 290 76 L 290 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="190" y="98" width="200" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">子查询② Average</text>
  <text x="200" y="136" font-size="9" fill="#555">SELECT 'Average Salary',</text>
  <text x="200" y="150" font-size="9" fill="#555">  COUNT(*)</text>
  <text x="200" y="164" font-size="9" fill="#555">FROM Accounts</text>
  <text x="200" y="176" font-size="9" fill="#446688">WHERE income ≥ 20000</text>

  <!-- Subquery 3: High -->
  <path d="M 380 76 L 480 96" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="380" y="98" width="180" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="118" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">子查询③ High</text>
  <text x="390" y="136" font-size="9" fill="#555">SELECT 'High Salary',</text>
  <text x="390" y="150" font-size="9" fill="#555">  COUNT(*)</text>
  <text x="390" y="164" font-size="9" fill="#555">FROM Accounts</text>
  <text x="390" y="176" font-size="9" fill="#d6a040">WHERE income &gt; 50000</text>

  <!-- Key property note -->
  <rect x="20" y="192" width="540" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="210" font-size="10" fill="#b85450" font-weight="bold">⚠️ 关键性质：无 GROUP BY 的聚合恒返回 1 行</text>
  <text x="40" y="224" font-size="9.5" fill="#666">即使 WHERE 过滤掉所有行，COUNT(*) 仍返回 0 → 每个子查询恒定输出 1 行 (类别名, 计数)</text>

  <!-- UNION ALL -->
  <path d="M 110 182 L 110 240" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 290 182 L 290 240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 470 182 L 470 240" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="190" y="242" width="200" height="34" fill="#f5f5f5" stroke="#888" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="263" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">UNION ALL（不去重）</text>

  <path d="M 290 276 L 290 298" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="120" y="300" width="340" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出：恒定 3 行</text>
  <text x="145" y="340" font-size="10" fill="#555" font-weight="bold">category</text>
  <text x="320" y="340" font-size="10" fill="#555" font-weight="bold">accounts_count</text>
  <line x1="140" y1="346" x2="440" y2="346" stroke="#bbb" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="145" y="360" font-size="9.5" fill="#4a7a3a">Low Salary</text>
  <text x="320" y="360" font-size="9.5" fill="#555">count 或 0</text>
  <text x="145" y="374" font-size="9.5" fill="#446688">Average Salary</text>
  <text x="320" y="374" font-size="9.5" fill="#555">count 或 0</text>

  <!-- Bottom note -->
  <rect x="20" y="396" width="540" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="416" font-size="10.5" fill="#4a7a3a" font-weight="bold">💡 为什么 UNION ALL 而非 UNION？</text>
  <text x="40" y="432" font-size="9.5" fill="#666">UNION 会去重——三个子查询的 COUNT 结果可能相同（如都是 0），去重后只剩 1 行</text>
  <text x="40" y="448" font-size="9.5" fill="#666">UNION ALL 不去重，保留全部 3 行——三个类别名不同，天然无重复行</text>
  <text x="40" y="462" font-size="9" fill="#888">即使 COUNT 值相同，类别名不同，行也不会重复（但 UNION ALL 更明确语义）</text>
</svg>
