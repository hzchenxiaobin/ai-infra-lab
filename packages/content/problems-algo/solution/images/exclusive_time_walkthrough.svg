<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
  </defs>
  <rect width="820" height="430" fill="#fafafa"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n=2，逐条日志推进</text>
  <path d="M 260 42 Q 410 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="410" y="66" text-anchor="middle" font-size="12" fill="#666">logs = ["0:start:0","1:start:2","1:end:5","0:end:6"] → 输出 [3, 4]</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="40" y="84" width="740" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#7a5415" text-anchor="middle">
    <text x="130" y="104">日志</text>
    <text x="290" y="104">动作</text>
    <text x="450" y="104">栈</text>
    <text x="560" y="104">prev</text>
    <text x="690" y="104">res[0], res[1]</text>
  </g>

  <!-- 行 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="118" width="740" height="56" rx="4" fill="#fff" stroke="#cfcfcf" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="130" y="142" fill="#b85450" font-weight="bold">0:start:0</text>
    <text x="130" y="160" font-size="10" fill="#888">空栈</text>
    <text x="290" y="142">无栈顶可结算</text>
    <text x="290" y="160" font-size="10" fill="#666">push(0)</text>
    <text x="450" y="148" fill="#2b4a77" font-weight="bold">[0]</text>
    <text x="560" y="148" font-family="monospace">0</text>
    <text x="690" y="148" font-family="monospace" fill="#444">0, 0</text>
  </g>

  <!-- 行 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="178" width="740" height="56" rx="4" fill="#fff" stroke="#cfcfcf" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="130" y="202" fill="#b85450" font-weight="bold">1:start:2</text>
    <text x="130" y="220" font-size="10" fill="#888">t=2</text>
    <text x="290" y="202" fill="#b03a3a">res[0] += 2−0 = 2</text>
    <text x="290" y="220" font-size="10" fill="#666">push(1)</text>
    <text x="450" y="208" fill="#2b4a77" font-weight="bold">[0, 1]</text>
    <text x="560" y="208" font-family="monospace">2</text>
    <text x="690" y="208" font-family="monospace" fill="#2e6e2e" font-weight="bold">2, 0</text>
  </g>

  <!-- 行 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="238" width="740" height="56" rx="4" fill="#fff" stroke="#cfcfcf" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="130" y="262" fill="#b85450" font-weight="bold">1:end:5</text>
    <text x="130" y="280" font-size="10" fill="#888">t=5</text>
    <text x="290" y="262" fill="#b03a3a">res[1] += 5−2+1 = 4</text>
    <text x="290" y="280" font-size="10" fill="#666">pop()</text>
    <text x="450" y="268" fill="#2b4a77" font-weight="bold">[0]</text>
    <text x="560" y="268" font-family="monospace">6</text>
    <text x="690" y="268" font-family="monospace" fill="#2e6e2e" font-weight="bold">2, 4</text>
  </g>

  <!-- 行 4 -->
  <g filter="url(#sk)">
    <rect x="40" y="298" width="740" height="56" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="130" y="322" fill="#b85450" font-weight="bold">0:end:6</text>
    <text x="130" y="340" font-size="10" fill="#888">t=6</text>
    <text x="290" y="322" fill="#b03a3a">res[0] += 6−6+1 = 1</text>
    <text x="290" y="340" font-size="10" fill="#666">pop()</text>
    <text x="450" y="328" fill="#2b4a77" font-weight="bold">[]</text>
    <text x="560" y="328" font-family="monospace">7</text>
    <text x="690" y="328" font-family="monospace" fill="#b03a3a" font-weight="bold">3, 4</text>
  </g>

  <!-- 结果 -->
  <g filter="url(#sk)">
    <rect x="40" y="372" width="740" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="410" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">最终结果 res = [3, 4]   （函数 0 独占 3 单位，函数 1 独占 4 单位）</text>
</svg>
