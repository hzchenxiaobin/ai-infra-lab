<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预处理 O(n) → 每次查询 O(1)</text>

  <!-- ===== Step 1: pre ===== -->
  <rect x="60" y="44" width="440" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 1：预处理盘子前缀和 pre</text>
  <text x="78" y="88" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">pre[0] = 0</text>
  <text x="78" y="106" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">pre[i+1] = pre[i] + (s[i] == '*')</text>

  <!-- Arrow down -->
  <path d="M 280 120 L 280 144" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 2: left / right ===== -->
  <rect x="60" y="150" width="440" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 2：预处理蜡烛边界 left / right</text>
  <text x="78" y="194" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">正扫：遇 '|' 更新 last → left[i] = last（≤ i 最近蜡烛）</text>
  <text x="78" y="212" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">反扫：遇 '|' 更新 last → right[i] = last（≥ i 最近蜡烛）</text>
  <text x="78" y="230" font-size="11" fill="#4a7a3a">无蜡烛记 -1；两次扫描各 O(n)</text>

  <!-- Arrow down -->
  <path d="M 280 244 L 280 268" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 3: per query ===== -->
  <rect x="60" y="274" width="440" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 3：逐查询 O(1) 回答</text>
  <text x="78" y="318" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">p1 = right[l]   （子串最左蜡烛）</text>
  <text x="78" y="336" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">p2 = left[r]    （子串最右蜡烛）</text>
  <text x="78" y="358" font-size="11.5" fill="#b85450" font-family="'Comic Sans MS', monospace">若 p1 == -1 或 p2 == -1 或 p1 &gt;= p2 → 0</text>
  <text x="78" y="378" font-size="11.5" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">否则 → pre[p2+1] − pre[p1]</text>

  <!-- Arrow down -->
  <path d="M 280 396 L 280 420" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="140" y="424" width="280" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="442" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 answer 数组</text>
</svg>
