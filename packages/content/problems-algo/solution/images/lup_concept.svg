<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最长同值路径：dfs 返回向下箭头，节点处拼接左右两条</text>

  <!-- 树结构  root=5 (280,70)  left=4 (185,150)  right=5 (380,150)  4->1,1 (130,235)(240,235)  right5->5 (435,235) -->
  <!-- 普通边 -->
  <line x1="268" y1="82" x2="195" y2="140" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="195" y1="162" x2="138" y2="222" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="210" y1="162" x2="232" y2="222" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 同值高亮边：root5 -> right5 -> leaf5 -->
  <line x1="292" y1="82" x2="370" y2="140" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="385" y1="162" x2="425" y2="222" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>

  <!-- root 5 -->
  <circle cx="280" cy="70" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#333">5</text>
  <!-- right 5 -->
  <circle cx="380" cy="150" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#333">5</text>
  <!-- leaf 5 -->
  <circle cx="435" cy="235" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="435" y="239" text-anchor="middle" font-size="11" fill="#333">5</text>
  <!-- 4 -->
  <circle cx="185" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="154" text-anchor="middle" font-size="11" fill="#333">4</text>
  <!-- 1 1 -->
  <circle cx="130" cy="235" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="239" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="240" cy="235" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="239" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- 箭头返回值标注（绿色）-->
  <text x="470" y="239" font-size="11" fill="#4a7a3a" font-weight="bold">→0</text>
  <text x="410" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">→1</text>
  <text x="300" y="64" font-size="11" fill="#4a7a3a" font-weight="bold">→2</text>
  <text x="208" y="150" font-size="11" fill="#4a7a3a">→0</text>
  <text x="148" y="235" font-size="11" fill="#4a7a3a">→0</text>
  <text x="258" y="235" font-size="11" fill="#4a7a3a">→0</text>

  <!-- 最长路径圈 -->
  <ellipse cx="365" cy="150" rx="86" ry="92" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="365" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最长同值路径 5—5—5（2 条边）</text>

  <!-- 说明框 -->
  <rect x="40" y="280" width="480" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">「箭头」定义：dfs(node) 返回从 node 向下（只走一个孩子）的同值路径边数</text>
  <text x="60" y="326" font-size="11" fill="#555">leftArrow  = (左孩子值==node值) ? dfs(left)+1  : 0</text>
  <text x="60" y="346" font-size="11" fill="#555">rightArrow = (右孩子值==node值) ? dfs(right)+1 : 0</text>
  <text x="60" y="366" font-size="11" fill="#4a7a3a">节点处拼接：ans = max(ans, leftArrow + rightArrow)  ← 路径可在此「拐弯」</text>
  <text x="60" y="380" font-size="11" fill="#b85450">向上只传一支：return max(leftArrow, rightArrow)  ← 父节点只能接一条</text>
</svg>
