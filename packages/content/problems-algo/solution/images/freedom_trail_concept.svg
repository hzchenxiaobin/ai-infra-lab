<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="175" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">转盘结构：12 点方向有固定指针，旋转使目标字符对齐</text>

  <!-- Ring (two concentric circles for a band look) -->
  <circle cx="175" cy="185" r="94" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="175" cy="185" r="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="175" cy="185" r="58" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- Pointer at 12 o'clock pointing down to position 0 -->
  <path d="M 175 60 L 165 44 L 185 44 Z" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="50" font-size="11" fill="#b85450" font-weight="bold">指针（固定）</text>

  <!-- Characters around ring: ring = "godding", n = 7 -->
  <!-- pos 0: g (top, aligned -> green) -->
  <circle cx="175" cy="100" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="175" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">g</text>
  <text x="175" y="135" text-anchor="middle" font-size="9" fill="#4a7a3a">pos0</text>

  <!-- pos 1: o -->
  <circle cx="241" cy="132" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="137" text-anchor="middle" font-size="14" fill="#333">o</text>
  <text x="252" y="124" font-size="9" fill="#888">1</text>

  <!-- pos 2: d -->
  <circle cx="257" cy="204" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="257" y="209" text-anchor="middle" font-size="14" fill="#333">d</text>
  <text x="272" y="208" font-size="9" fill="#888">2</text>

  <!-- pos 3: d -->
  <circle cx="211" cy="261" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="211" y="266" text-anchor="middle" font-size="14" fill="#333">d</text>
  <text x="222" y="280" font-size="9" fill="#888">3</text>

  <!-- pos 4: i -->
  <circle cx="139" cy="261" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="266" text-anchor="middle" font-size="14" fill="#333">i</text>
  <text x="128" y="280" font-size="9" fill="#888">4</text>

  <!-- pos 5: n -->
  <circle cx="93" cy="204" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="209" text-anchor="middle" font-size="14" fill="#333">n</text>
  <text x="78" y="208" font-size="9" fill="#888">5</text>

  <!-- pos 6: g (same char as pos 0) -->
  <circle cx="109" cy="132" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="109" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">g</text>
  <text x="98" y="124" font-size="9" fill="#b85450">6</text>

  <!-- Clockwise rotation arrow (outer arc, bottom-right) -->
  <path d="M 268 230 A 100 100 0 0 1 200 285" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="252" font-size="11" fill="#446688">顺时针</text>

  <!-- Counter-clockwise rotation arrow (outer arc, bottom-left) -->
  <path d="M 82 230 A 100 100 0 0 0 150 285" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="40" y="252" font-size="11" fill="#b85450">逆时针</text>

  <!-- Right-side explanation panel -->
  <rect x="318" y="60" width="190" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="413" y="80" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">ring = "godding"（环形）</text>
  <text x="413" y="98" text-anchor="middle" font-size="10" fill="#666">同一字符可出现多次（如 g 在 0、6）</text>

  <rect x="318" y="118" width="190" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="413" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">旋转 1 格 = 1 步</text>
  <text x="413" y="156" text-anchor="middle" font-size="10" fill="#555">顺/逆时针均可，取较短方向</text>

  <rect x="318" y="176" width="190" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="413" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对齐后按按钮 = 1 步</text>
  <text x="413" y="214" text-anchor="middle" font-size="10" fill="#555">每拼一个字符必须按一次</text>

  <rect x="318" y="234" width="190" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="413" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">目标：拼出 key</text>
  <text x="413" y="272" text-anchor="middle" font-size="10" fill="#555">求「旋转 + 按按钮」总步数</text>
  <text x="413" y="286" text-anchor="middle" font-size="10" fill="#b85450">的最小值</text>

  <!-- Distance hint at bottom -->
  <rect x="40" y="318" width="280" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="180" y="338" text-anchor="middle" font-size="11" fill="#444">环上 j→k 最短旋转 = min(|j−k|, n−|j−k|)</text>
</svg>
