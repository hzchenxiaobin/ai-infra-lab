<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：按符号分两种贪心策略</text>
  <text x="290" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">最左差异位定胜负 → 一趟扫描找首个"增益点"</text>

  <!-- ============ Positive panel ============ -->
  <rect x="30" y="54" width="520" height="158" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">正数 n = "73", x = 6  →  找首个 &lt; x 的位</text>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="202" y="94">i=0</text>
    <text x="262" y="94">i=1</text>
  </g>

  <!-- original digit boxes -->
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="180" y="98" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="202" y="124" fill="#446688" font-weight="bold">7</text>
    <rect x="240" y="98" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="262" y="124" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- insertion caret above the '3' -->
  <path d="M 262 92 L 262 80" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="74" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">插入 x=6</text>

  <!-- comparison labels -->
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="202" y="158" fill="#888">7 ≥ 6</text>
    <text x="202" y="172" fill="#888">跳过</text>
    <text x="262" y="158" fill="#d6a040" font-weight="bold">3 &lt; 6</text>
    <text x="262" y="172" fill="#d6a040" font-weight="bold">在此插入</text>
  </g>

  <!-- arrow to result -->
  <path d="M 300 118 L 360 118" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">结果</text>

  <!-- result boxes 7 6 3 -->
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="368" y="98" width="36" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="386" y="124" fill="#446688" font-weight="bold">7</text>
    <rect x="404" y="98" width="36" height="40" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="422" y="124" fill="#d6a040" font-weight="bold">6</text>
    <rect x="440" y="98" width="36" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="458" y="124" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="422" y="166" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= "763"</text>
  <text x="422" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6 顶替 3 的高位 → 增大</text>

  <!-- ============ Negative panel ============ -->
  <rect x="30" y="226" width="520" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">负数 n = "-13", x = 2  →  找首个 &gt; x 的位（降低绝对值）</text>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="156" y="266">'-'</text>
    <text x="216" y="266">i=1</text>
    <text x="276" y="266">i=2</text>
  </g>

  <!-- original digit boxes: - 1 3 -->
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="134" y="270" width="44" height="40" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="156" y="296" fill="#888" font-weight="bold">-</text>
    <rect x="194" y="270" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="296" fill="#446688" font-weight="bold">1</text>
    <rect x="254" y="270" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="276" y="296" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- insertion caret above the '3' -->
  <path d="M 276 264 L 276 252" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="276" y="246" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">插入 x=2</text>

  <!-- comparison labels -->
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="156" y="330" fill="#888">负号</text>
    <text x="156" y="344" fill="#888">跳过</text>
    <text x="216" y="330" fill="#888">1 ≤ 2</text>
    <text x="216" y="344" fill="#888">跳过</text>
    <text x="276" y="330" fill="#d6a040" font-weight="bold">3 &gt; 2</text>
    <text x="276" y="344" fill="#d6a040" font-weight="bold">在此插入</text>
  </g>

  <!-- arrow to result -->
  <path d="M 314 290 L 360 290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="338" y="282" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">结果</text>

  <!-- result boxes - 1 2 3 -->
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="368" y="270" width="32" height="40" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="384" y="296" fill="#888" font-weight="bold">-</text>
    <rect x="400" y="270" width="32" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="416" y="296" fill="#446688" font-weight="bold">1</text>
    <rect x="432" y="270" width="32" height="40" fill="#fce4ec" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="448" y="296" fill="#d6a040" font-weight="bold">2</text>
    <rect x="464" y="270" width="32" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="480" y="296" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="448" y="338" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= "-123"</text>
  <text x="448" y="354" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2 顶替 3 的高位 → 绝对值↓</text>

  <!-- bottom note -->
  <rect x="30" y="392" width="520" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="402" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">找不到增益点 → 追加到末尾（最低位损失最小）</text>
</svg>
