<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态 = (已用 A 数, 末尾连续 L 数)：共 2 × 3 = 6 个</text>

  <!-- column headers -->
  <text x="60" y="78" font-size="12" fill="#888">A 个数\尾L</text>
  <rect x="170" y="62" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="82" text-anchor="middle" font-size="12" fill="#555">末尾 0 个 L</text>
  <rect x="290" y="62" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="82" text-anchor="middle" font-size="12" fill="#555">末尾 1 个 L</text>
  <rect x="410" y="62" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="82" text-anchor="middle" font-size="12" fill="#555">末尾 2 个 L</text>

  <!-- row labels -->
  <rect x="60" y="110" width="100" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0 个 A</text>
  <text x="110" y="154" text-anchor="middle" font-size="10" fill="#666">还能放 A</text>

  <rect x="60" y="190" width="100" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1 个 A</text>
  <text x="110" y="234" text-anchor="middle" font-size="10" fill="#b85450">不能再放 A</text>

  <!-- State S0: (0,0) -->
  <rect x="170" y="110" width="100" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="220" y="134" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">S0</text>
  <text x="220" y="154" text-anchor="middle" font-size="10" fill="#666">(0, 0)</text>

  <!-- State S1: (0,1) -->
  <rect x="290" y="110" width="100" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="134" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">S1</text>
  <text x="340" y="154" text-anchor="middle" font-size="10" fill="#666">(0, 1)</text>

  <!-- State S2: (0,2) -->
  <rect x="410" y="110" width="100" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="134" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">S2</text>
  <text x="460" y="154" text-anchor="middle" font-size="10" fill="#666">(0, 2)</text>

  <!-- State S3: (1,0) -->
  <rect x="170" y="190" width="100" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">S3</text>
  <text x="220" y="234" text-anchor="middle" font-size="10" fill="#666">(1, 0)</text>

  <!-- State S4: (1,1) -->
  <rect x="290" y="190" width="100" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">S4</text>
  <text x="340" y="234" text-anchor="middle" font-size="10" fill="#666">(1, 1)</text>

  <!-- State S5: (1,2) -->
  <rect x="410" y="190" width="100" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">S5</text>
  <text x="460" y="234" text-anchor="middle" font-size="10" fill="#666">(1, 2)</text>

  <!-- constraints annotation -->
  <rect x="40" y="270" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="160" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">A 的维度只到 1（严格少于 2）</text>
  <text x="160" y="306" text-anchor="middle" font-size="10" fill="#999">放第 2 个 A 即非法，剪枝</text>

  <rect x="300" y="270" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="420" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">L 的维度只到 2（无 3 连 L）</text>
  <text x="420" y="306" text-anchor="middle" font-size="10" fill="#999">末尾 2 个 L 再放 L 即非法</text>

  <!-- answer note -->
  <rect x="40" y="328" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="352" text-anchor="middle" font-size="11" fill="#555">长度 n 的答案 = 6 个状态的计数之和（每个状态都代表一种合法的「奖励」结尾）</text>
</svg>
