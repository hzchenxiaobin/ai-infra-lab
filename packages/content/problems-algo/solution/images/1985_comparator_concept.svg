<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">大数字符串比较规则：长度优先</text>

  <!-- ===== Section 1: 长度不同 ===== -->
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 长度不同 → 长者更大</text>

  <!-- "123" box (3 digits, blue) -->
  <rect x="120" y="76" width="90" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="165" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">123</text>
  <text x="165" y="132" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">3 位</text>

  <!-- ">" -->
  <text x="265" y="104" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">&gt;</text>

  <!-- "45" box (2 digits, orange) -->
  <rect x="310" y="76" width="70" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="345" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">45</text>
  <text x="345" y="132" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2 位</text>

  <!-- explanation -->
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">100 位数也远大于 99 位数 → 长度直接定大小</text>

  <!-- divider -->
  <path d="M 60 178 L 480 178" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 2: 长度相同 ===== -->
  <text x="270" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 长度相同 → 字典序 = 数值序</text>

  <!-- "21" box (2 digits, blue) -->
  <rect x="145" y="220" width="70" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="246" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">21</text>
  <text x="180" y="276" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">2 位</text>

  <!-- ">" -->
  <text x="265" y="248" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">&gt;</text>

  <!-- "12" box (2 digits, orange) -->
  <rect x="325" y="220" width="70" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="360" y="246" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="360" y="276" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2 位</text>

  <!-- explanation -->
  <text x="270" y="300" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">逐字符比较：'2' &gt; '1' → 21 &gt; 12</text>

  <!-- insight box -->
  <rect x="50" y="320" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">无前导零 → 长度即量级，字典序即数值序</text>
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">cmp(a, b) = (len(a), a) &lt; (len(b), b)</text>
  <text x="270" y="378" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">无需转整数，直接字符串排序即可</text>
</svg>
