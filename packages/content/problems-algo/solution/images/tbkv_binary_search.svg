<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分找右界：最后一个 timestamp ≤ target</text>

  <!-- timestamp array -->
  <text x="60" y="74" font-size="12" fill="#888">timestamps:</text>
  <rect x="150" y="58" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="58" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="270" y="58" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="330" y="58" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>

  <text x="180" y="110" text-anchor="middle" font-size="9" fill="#aaa">idx 0</text>
  <text x="240" y="110" text-anchor="middle" font-size="9" fill="#aaa">idx 1</text>
  <text x="300" y="110" text-anchor="middle" font-size="9" fill="#aaa">idx 2</text>
  <text x="360" y="110" text-anchor="middle" font-size="9" fill="#aaa">idx 3</text>

  <!-- target -->
  <rect x="150" y="128" width="240" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">target = 6   （找 ≤ 6 的最大元素）</text>

  <!-- step 1: mid = 1, value 4 <= 6 -> ans=1, lo=2 -->
  <text x="60" y="186" font-size="11" fill="#555" font-weight="bold">轮 1</text>
  <rect x="100" y="170" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#444">mid = 1 → ts[1] = 4 ≤ 6 ✓  记 ans = 1，lo = 2</text>

  <!-- step 2: mid = 2, value 7 > 6 -> hi=1 -->
  <text x="60" y="222" font-size="11" fill="#555" font-weight="bold">轮 2</text>
  <rect x="100" y="206" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#444">mid = 2 → ts[2] = 7 &gt; 6 ✗  hi = 1</text>

  <!-- terminate -->
  <text x="60" y="258" font-size="11" fill="#555" font-weight="bold">终止</text>
  <rect x="100" y="242" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#333">lo = 2 &gt; hi = 1 → 退出，ans = 1</text>

  <!-- highlight chosen cell: idx1 -->
  <rect x="210" y="58" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="82" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>

  <path d="M 240 96 L 240 120 L 240 242" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="80" y="290" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">等价于 upper_bound(target) − 1</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#444">ans &lt; 0 表示没有 ≤ target 的版本 → 返回 ""</text>
</svg>
