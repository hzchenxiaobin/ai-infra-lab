<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：以「第 k 列」为关键字，对行降序排序即得答案</text>

  <!-- matrix score -->
  <text x="128" y="58" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">score（k = 2，红列即关键字）</text>

  <!-- Row 0: 10,6,9,1 -->
  <rect x="44" y="66" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="86" y="66" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="107" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="128" y="66" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">9</text>
  <rect x="170" y="66" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="191" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- Row 1: 7,5,11,2 -->
  <rect x="44" y="100" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="122" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="86" y="100" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="107" y="122" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="128" y="100" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="122" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">11</text>
  <rect x="170" y="100" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="191" y="122" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- Row 2: 4,8,3,15 -->
  <rect x="44" y="134" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="156" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="86" y="134" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="107" y="156" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="128" y="134" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="156" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="170" y="134" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="191" y="156" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>

  <!-- k-th column label -->
  <text x="149" y="184" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">↑ 第 k 列（关键字）</text>

  <!-- extract arrow -->
  <path d="M 212 117 L 246 117" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="229" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">抽键</text>

  <!-- key box -->
  <rect x="250" y="78" width="130" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="315" y="98" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">key[i] = score[i][k]</text>
  <text x="315" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">[9, 11, 3]</text>
  <text x="315" y="146" text-anchor="middle" font-size="11" fill="#888">行 ↔ 第 k 列值</text>

  <!-- down arrow -->
  <path d="M 315 158 L 315 184" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="332" y="174" font-size="12" fill="#b85450" font-weight="bold">降序</text>

  <!-- sorted box -->
  <rect x="250" y="188" width="130" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="315" y="214" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">[11, 9, 3]</text>

  <!-- bottom note -->
  <rect x="44" y="250" width="452" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">把每行视作整体，按第 k 列值降序</text>
  <text x="270" y="294" text-anchor="middle" font-size="11.5" fill="#446688">分数互不相同 → 关键字无并列 → 行序唯一确定</text>
  <text x="270" y="314" text-anchor="middle" font-size="11" fill="#888">（若允许并列，需指定次关键字保证稳定）</text>
</svg>
