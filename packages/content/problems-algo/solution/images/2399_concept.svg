<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：first[26] 记首次下标，遇第二次算 q−p−1</text>

  <!-- ===== ① string s with indices ===== -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">① 字符串 s = "abaccb"，标出每个字母的下标</text>

  <g filter="url(#rough2)">
    <rect x="60" y="70" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <text x="83" y="102" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">a</text>
    <text x="83" y="132" text-anchor="middle" font-size="11" fill="#446688">下标 0</text>

    <rect x="106" y="70" width="46" height="46" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="129" y="102" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">b</text>
    <text x="129" y="132" text-anchor="middle" font-size="11" fill="#888">下标 1</text>

    <rect x="152" y="70" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="175" y="102" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">a</text>
    <text x="175" y="132" text-anchor="middle" font-size="11" fill="#b85450">下标 2</text>

    <rect x="198" y="70" width="46" height="46" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="221" y="102" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">c</text>
    <text x="221" y="132" text-anchor="middle" font-size="11" fill="#888">下标 3</text>

    <rect x="244" y="70" width="46" height="46" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="267" y="102" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">c</text>
    <text x="267" y="132" text-anchor="middle" font-size="11" fill="#888">下标 4</text>

    <rect x="290" y="70" width="46" height="46" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="313" y="102" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">b</text>
    <text x="313" y="132" text-anchor="middle" font-size="11" fill="#888">下标 5</text>
  </g>

  <!-- arc showing the gap between the two 'a's -->
  <path d="M 83 140 Q 129 168 175 140" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="129" y="166" text-anchor="middle" font-size="11" fill="#b85450">间隔 = 中间字母数 = 1（只有 b）</text>

  <line x1="40" y1="186" x2="520" y2="186" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== ② first[26] array ===== -->
  <text x="40" y="208" font-size="12" fill="#d6a040" font-weight="bold">② first[26]：存每个字母的首次下标，−1 表示「尚未见过」</text>

  <g filter="url(#rough2)">
    <rect x="60" y="220" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="89" y="238" text-anchor="middle" font-size="10" fill="#446688">first[0]</text>
    <text x="89" y="258" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
    <text x="89" y="280" text-anchor="middle" font-size="10" fill="#888">'a' 首</text>

    <rect x="118" y="220" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="147" y="238" text-anchor="middle" font-size="10" fill="#446688">first[1]</text>
    <text x="147" y="258" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
    <text x="147" y="280" text-anchor="middle" font-size="10" fill="#888">'b' 首</text>

    <rect x="176" y="220" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="205" y="238" text-anchor="middle" font-size="10" fill="#446688">first[2]</text>
    <text x="205" y="258" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
    <text x="205" y="280" text-anchor="middle" font-size="10" fill="#888">'c' 首</text>

    <rect x="234" y="220" width="58" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <text x="263" y="238" text-anchor="middle" font-size="10" fill="#d6a040">first[3]</text>
    <text x="263" y="258" text-anchor="middle" font-size="16" fill="#999" font-weight="bold">−1</text>
    <text x="263" y="280" text-anchor="middle" font-size="10" fill="#888">'d' 未现</text>

    <text x="312" y="248" font-size="14" fill="#888">…</text>

    <rect x="330" y="220" width="58" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <text x="359" y="238" text-anchor="middle" font-size="10" fill="#d6a040">first[25]</text>
    <text x="359" y="258" text-anchor="middle" font-size="16" fill="#999" font-weight="bold">−1</text>
    <text x="359" y="280" text-anchor="middle" font-size="10" fill="#888">'z' 未现</text>
  </g>

  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#666">哨兵 −1 与下标 0 区分「未见过」与「首次在 0」</text>

  <line x1="40" y1="314" x2="520" y2="314" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== ③ gap formula ===== -->
  <text x="40" y="336" font-size="12" fill="#b85450" font-weight="bold">③ 第二次出现即定判：间隔 = q − p − 1，比对 distance[idx]</text>

  <rect x="40" y="348" width="480" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">gap = i − first[idx] − 1</text>
  <text x="280" y="398" text-anchor="middle" font-size="12" fill="#666">'a'：i = 2、first[0] = 0 → gap = 2 − 0 − 1 = 1 = distance[0] ✓</text>
  <text x="280" y="418" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">每字母恰好两次 → 第二次比完即定论，无需第三态</text>
</svg>
