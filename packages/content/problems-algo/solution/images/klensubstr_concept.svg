<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">定长滑动窗口：窗口大小恒为 K，逐位右移，统计无重复窗口数</text>

  <!-- ===== Top row: valid window "havef" [0-4] ===== -->
  <text x="20" y="68" font-size="11" fill="#4a7a3a" font-weight="bold">合法窗口:</text>
  <!-- char cells (full string, highlight [0-4] green) -->
  <rect x="100" y="52" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="114" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">h</text>
  <rect x="128" y="52" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="156" y="52" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">v</text>
  <rect x="184" y="52" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="212" y="52" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="240" y="52" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="72" text-anchor="middle" font-size="13" fill="#999">u</text>
  <rect x="268" y="52" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="72" text-anchor="middle" font-size="13" fill="#999">n</text>
  <rect x="296" y="52" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="72" text-anchor="middle" font-size="13" fill="#999">o</text>
  <rect x="324" y="52" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="72" text-anchor="middle" font-size="13" fill="#999">n</text>
  <rect x="352" y="52" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="72" text-anchor="middle" font-size="13" fill="#999">l</text>
  <rect x="380" y="52" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="72" text-anchor="middle" font-size="13" fill="#999">e</text>
  <rect x="408" y="52" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="72" text-anchor="middle" font-size="13" fill="#999">e</text>
  <rect x="436" y="52" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="72" text-anchor="middle" font-size="13" fill="#999">t</text>
  <rect x="464" y="52" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="478" y="72" text-anchor="middle" font-size="13" fill="#999">c</text>
  <rect x="492" y="52" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="506" y="72" text-anchor="middle" font-size="13" fill="#999">o</text>

  <!-- window bracket step1 -->
  <path d="M 100 96 Q 100 104 106 104 L 234 Q 240 104 240 96" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="170" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 = "havef"，5 个字符全不同 → distinct = 5 = K ✓</text>

  <!-- divider arrow -->
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#d6a040">↓ 窗口整体右移 1 格（右扩 1 + 左缩 1），大小恒为 K</text>

  <!-- ===== Bottom row: invalid window "funon" [4-8] ===== -->
  <text x="20" y="188" font-size="11" fill="#b85450" font-weight="bold">非法窗口:</text>
  <rect x="100" y="172" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="192" text-anchor="middle" font-size="13" fill="#999">h</text>
  <rect x="128" y="172" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="192" text-anchor="middle" font-size="13" fill="#999">a</text>
  <rect x="156" y="172" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="192" text-anchor="middle" font-size="13" fill="#999">v</text>
  <rect x="184" y="172" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="192" text-anchor="middle" font-size="13" fill="#999">e</text>
  <!-- window [4-8]: f u n o n -->
  <rect x="212" y="172" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="240" y="172" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">u</text>
  <rect x="268" y="172" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">n</text>
  <rect x="296" y="172" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
  <rect x="324" y="172" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">n</text>
  <rect x="352" y="172" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="192" text-anchor="middle" font-size="13" fill="#999">l</text>
  <rect x="380" y="172" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="192" text-anchor="middle" font-size="13" fill="#999">e</text>
  <rect x="408" y="172" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="192" text-anchor="middle" font-size="13" fill="#999">e</text>
  <rect x="436" y="172" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="192" text-anchor="middle" font-size="13" fill="#999">t</text>
  <rect x="464" y="172" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="478" y="192" text-anchor="middle" font-size="13" fill="#999">c</text>
  <rect x="492" y="172" width="28" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="506" y="192" text-anchor="middle" font-size="13" fill="#999">o</text>

  <!-- window bracket step2 -->
  <path d="M 212 216 Q 212 224 218 224 L 346 Q 352 224 352 216" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="282" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口 = "funon"，'n' 出现两次 → distinct = 4 &lt; K ✗</text>

  <!-- repeat marker between the two n's -->
  <path d="M 282 162 Q 310 156 338 162" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="310" y="154" text-anchor="middle" font-size="10" fill="#b85450">重复!</text>

  <!-- Core idea box -->
  <rect x="40" y="258" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">判定准则：窗口内不同字符数 distinct == K ⟺ 无重复</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#666">右端进 1 字符 / 左端出 1 字符，distinct 增量维护为 O(1)</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#888">每次窗口满（大小 = K）时检查 distinct == K 即计数</text>
</svg>
