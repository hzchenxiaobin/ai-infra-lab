<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：预处理距离 → 枚举子集 → 连通性 → 直径 → 计数</text>

  <!-- 1. Precompute distances -->
  <rect x="160" y="44" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333">① 从每个点 BFS，预处理 dist[i][j]</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. Enumerate all subsets -->
  <rect x="150" y="104" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#333">② for mask = 1 … (1&lt;&lt;n)−1</text>

  <path d="M 270 142 L 270 160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. Count edges in induced subgraph -->
  <rect x="120" y="164" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="188" text-anchor="middle" font-size="11.5" fill="#333">③ 数诱导子图边数 edges_in（两端都在 mask 中）</text>

  <path d="M 270 202 L 270 220" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. Decision: edges_in == nodes_in - 1 ? -->
  <polygon points="270,222 390,260 270,298 150,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="11" fill="#333">edges_in ==</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#333">popcount(mask) − 1 ?</text>

  <!-- 否 → 跳过 -->
  <path d="M 390 260 L 470 260" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="246" width="74" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="497" y="265" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过 ✗</text>

  <!-- 是 ↓ -->
  <path d="M 270 298 L 270 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="312" font-size="10.5" fill="#4a7a3a" font-weight="bold">是 ↓</text>

  <!-- 5. Compute diameter -->
  <rect x="120" y="320" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="11.5" fill="#333">⑤ 直径 d = max dist[i][j]，i,j ∈ mask</text>

  <path d="M 270 358 L 270 376" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. Bucket count -->
  <rect x="150" y="380" width="240" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="404" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑥ if d &gt; 0：ans[d − 1] += 1</text>

  <!-- loop back arrow -->
  <path d="M 150 123 L 80 123 L 80 260 L 148 260" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="195" font-size="10" fill="#4a7a3a" font-weight="bold">下一个</text>
  <text x="56" y="208" font-size="10" fill="#4a7a3a">mask</text>

  <!-- left note: why edges == nodes - 1 works -->
  <rect x="20" y="320" width="90" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="65" y="340" text-anchor="middle" font-size="9.5" fill="#a87020" font-weight="bold">为何数边即可？</text>
  <text x="65" y="356" text-anchor="middle" font-size="9" fill="#555">树无环</text>
  <text x="65" y="370" text-anchor="middle" font-size="9" fill="#555">诱导子图 = 森林</text>
  <text x="65" y="384" text-anchor="middle" font-size="9" fill="#555">连通森林 = 树</text>
  <text x="65" y="398" text-anchor="middle" font-size="9" fill="#555">树 ⟺ 边=点−1</text>
  <text x="65" y="412" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">免并查集</text>
</svg>
