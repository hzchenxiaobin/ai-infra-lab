<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [3,5,1,7,9]</text>

  <!-- Step 1: original -->
  <text x="40" y="52" font-size="11" fill="#888">原始数组</text>
  <rect x="76" y="58" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="124" y="58" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="172" y="58" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="220" y="58" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="268" y="58" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- sort arrow -->
  <path d="M 340 73 L 380 73" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="65" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">排序</text>

  <!-- Step 2: sorted -->
  <text x="40" y="112" font-size="11" fill="#888">排序后</text>
  <rect x="76" y="118" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="118" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="172" y="118" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="220" y="118" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="268" y="118" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- index labels -->
  <text x="100" y="166" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="148" y="166" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="196" y="166" text-anchor="middle" font-size="9" fill="#888">i=2</text>
  <text x="244" y="166" text-anchor="middle" font-size="9" fill="#888">i=3</text>
  <text x="292" y="166" text-anchor="middle" font-size="9" fill="#888">i=4</text>

  <!-- compute d -->
  <text x="40" y="188" font-size="11" fill="#888">求公差</text>
  <rect x="76" y="172" width="96" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)" opacity="0.6"/>
  <path d="M 76 200 L 76 206 L 172 206 L 172 200" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="190" font-size="11" fill="#d6a040" font-weight="bold">d = arr[1] − arr[0] = 3 − 1 = 2</text>

  <!-- check pairs -->
  <text x="40" y="236" font-size="11" fill="#888">逐对验证</text>

  <!-- check i=2 -->
  <path d="M 148 214 L 148 222 L 196 222 L 196 214" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">i=2: 5−3 = 2 == d ✓</text>

  <!-- check i=3 -->
  <path d="M 196 244 L 196 252 L 244 252 L 244 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="250" font-size="11" fill="#4a7a3a" font-weight="bold">i=3: 7−5 = 2 == d ✓</text>

  <!-- check i=4 -->
  <path d="M 244 274 L 244 282 L 292 282 L 292 274" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">i=4: 9−7 = 2 == d ✓</text>

  <!-- result -->
  <rect x="76" y="312" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="266" y="340" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">全部通过 → return true</text>
</svg>
