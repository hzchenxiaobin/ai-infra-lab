<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：拿到的引用未必是表头 —— 先「归位」再「采集」</text>

  <!-- 阶段二绿色弧线（next 采集） -->
  <path d="M 90,148 C 130,52 390,52 450,148" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">阶段二：从 head 沿 next 一路采集</text>

  <!-- head / tail 标签 -->
  <text x="90" y="128" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">head（prev=null）</text>
  <path d="M 90,133 L 90,152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="450" y="128" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">tail（next=null）</text>
  <path d="M 450,133 L 450,152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 链表节点 -->
  <rect x="58" y="156" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="156" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="238" y="156" width="64" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="270" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="328" y="156" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="418" y="156" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- next 指针（上层，向右） -->
  <path d="M 122,168 L 146,168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 212,168 L 236,168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 302,168 L 326,168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 392,168 L 416,168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="134" y="163" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">next</text>

  <!-- prev 指针（下层，向左） -->
  <path d="M 146,190 L 122,190" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 236,190 L 212,190" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 326,190 L 302,190" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 416,190 L 392,190" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="134" y="205" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">prev</text>

  <!-- 拿到的节点标记 -->
  <path d="M 262,218 L 270,208 L 278,218 Z" fill="#d6a040" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">你拿到的引用 cur（任意节点，不一定是头！）</text>

  <!-- 阶段一红色虚线弧（prev 归位） -->
  <path d="M 256,210 C 210,278 130,278 92,212" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="174" y="288" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">阶段一：沿 prev 一路归位（至多 n−1 步）</text>

  <!-- 底部要点 -->
  <rect x="46" y="312" width="428" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">头节点是「结构信息」而非「数值信息」：prev == nullptr 的节点才是表头；</text>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">归位之后，问题退化为 I 版（3263）：从 head 沿 next 顺序采集即可。</text>
  <text x="260" y="378" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">橙框 = 拿到的节点；红虚线 = 阶段一（prev 方向）；绿实线 = 阶段二（next 方向）</text>
</svg>
