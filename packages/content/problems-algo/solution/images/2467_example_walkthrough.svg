<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：最优路径 0→1→3→4 得 6 分</text>

  <!-- Bob path table (right side) -->
  <text x="430" y="54" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Bob 路径 bob=3</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="330" y="64" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="370" y="83" text-anchor="middle" fill="#7a4a10">节点</text>
    <rect x="410" y="64" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="445" y="83" text-anchor="middle" fill="#7a4a10">bobTime</text>

    <rect x="330" y="92" width="80" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="370" y="110" text-anchor="middle" fill="#333">3</text>
    <rect x="410" y="92" width="70" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="445" y="110" text-anchor="middle" fill="#333">0</text>

    <rect x="330" y="118" width="80" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="370" y="136" text-anchor="middle" fill="#333">1</text>
    <rect x="410" y="118" width="70" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="445" y="136" text-anchor="middle" fill="#333">1</text>

    <rect x="330" y="144" width="80" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="370" y="162" text-anchor="middle" fill="#333">0</text>
    <rect x="410" y="144" width="70" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="445" y="162" text-anchor="middle" fill="#333">2</text>
  </g>

  <!-- Tree (left) -->
  <g stroke="#aaa" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <line x1="120" y1="96" x2="180" y2="150"/>
    <line x1="180" y1="174" x2="120" y2="226"/>
    <line x1="180" y1="174" x2="240" y2="226"/>
    <line x1="240" y1="250" x2="240" y2="304"/>
  </g>
  <!-- highlight alice path -->
  <g stroke="#446688" stroke-width="3" fill="none" filter="url(#rough2)">
    <line x1="120" y1="96" x2="180" y2="150"/>
    <line x1="180" y1="174" x2="240" y2="226"/>
    <line x1="240" y1="250" x2="240" y2="304"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="120" cy="84" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="120" y="89" text-anchor="middle" font-size="13" fill="#333">0</text>
    <circle cx="180" cy="162" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="180" y="167" text-anchor="middle" font-size="13" fill="#7a4a10">1</text>
    <circle cx="120" cy="238" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="120" y="243" text-anchor="middle" font-size="12" fill="#333">2</text>
    <circle cx="240" cy="238" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="240" y="243" text-anchor="middle" font-size="13" fill="#333">3</text>
    <circle cx="240" cy="316" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="240" y="321" text-anchor="middle" font-size="13" fill="#333">4</text>
  </g>

  <!-- contribution table -->
  <text x="120" y="360" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Alice 逐节点得分</text>
  <g filter="url(#rough2)" font-size="12">
    <!-- header -->
    <rect x="30" y="372" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="55" y="389" text-anchor="middle" fill="#446688">节点</text>
    <rect x="80" y="372" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="108" y="389" text-anchor="middle" fill="#446688">depth</text>
    <rect x="136" y="372" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="166" y="389" text-anchor="middle" fill="#446688">判定</text>
    <rect x="196" y="372" width="54" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="223" y="389" text-anchor="middle" fill="#446688">得分</text>

    <!-- row 0 -->
    <rect x="30" y="396" width="50" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="55" y="411" text-anchor="middle" fill="#333">0</text>
    <rect x="80" y="396" width="56" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="108" y="411" text-anchor="middle" fill="#333">0</text>
    <rect x="136" y="396" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="166" y="411" text-anchor="middle" fill="#4a7a3a">0&lt;2</text>
    <rect x="196" y="396" width="54" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="223" y="411" text-anchor="middle" fill="#333">−2</text>
  </g>

  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−2 + (4/2) + 0 + 6 = 6  ✓（路径 0→1→3→4）</text>
</svg>
