<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：展开全部子任务对，再做反连接</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">绿 = 已执行    红 = 未执行（即答案）</text>

  <!-- Column headers -->
  <text x="110" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">task_id</text>
  <text x="232" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">subtask_id  →</text>

  <!-- Row 1: task_id=1, n=3 ; executed={2} -->
  <rect x="86" y="84" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="110" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">1</text>
  <rect x="156" y="84" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="180" y="110" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="208" y="84" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="110" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="260" y="84" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="284" y="110" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">3</text>
  <text x="320" y="110" font-size="10" fill="#888">n = 3</text>

  <!-- Row 2: task_id=2, n=2 ; executed={} -->
  <rect x="86" y="132" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="158" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">2</text>
  <rect x="156" y="132" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="180" y="158" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="208" y="132" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="232" y="158" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2</text>
  <text x="320" y="158" font-size="10" fill="#888">n = 2</text>

  <!-- Row 3: task_id=3, n=4 ; executed={1,2,3,4} -->
  <rect x="86" y="180" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="206" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">3</text>
  <rect x="156" y="180" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="206" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="208" y="180" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="206" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="260" y="180" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="206" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="312" y="180" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="206" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="372" y="206" font-size="10" fill="#888">n = 4</text>

  <!-- Callout -->
  <rect x="60" y="236" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">全部子任务对（9）− 已执行（5）= 未执行（4）</text>
  <text x="280" y="274" text-anchor="middle" font-size="10" fill="#666">subtasks_count 是「个数」不是「行」→ 必须先用递归 CTE 展开成行</text>

  <!-- Arrow to result -->
  <path d="M 280 286 L 280 302" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result chips -->
  <text x="120" y="330" text-anchor="end" font-size="12" fill="#555" font-weight="bold">结果 →</text>
  <rect x="132" y="314" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="164" y="335" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1, 1</text>
  <rect x="204" y="314" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="236" y="335" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1, 3</text>
  <rect x="276" y="314" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="308" y="335" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2, 1</text>
  <rect x="348" y="314" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="335" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2, 2</text>
</svg>
