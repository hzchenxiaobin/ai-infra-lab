<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：右端扩展法 — f(i) = f(i−1) + (i − last[s[i]])</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">把 s[i] 追加到所有以 i−1 结尾的子串后，引力增量 = “未含 s[i] 的子串数 + 1”</text>

  <!-- ===== String s = "abbca", highlight i=4 ===== -->
  <text x="32" y="74" font-size="10.5" fill="#666">s</text>
  <text x="100" y="66" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="160" y="66" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="220" y="66" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="280" y="66" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="340" y="66" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4</text>

  <rect x="80" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="140" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="200" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="260" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <!-- i=4 highlighted (red), this is the char being appended -->
  <rect x="320" y="70" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="90" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <!-- mark previous 'a' at position 0 = last[s[i]] -->
  <path d="M 100 102 L 100 116" stroke="#446688" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="100" y="128" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">last['a']=0</text>
  <text x="100" y="140" text-anchor="middle" font-size="9" fill="#888">上次出现</text>

  <!-- ===== Row: substrings ending at i=3 ===== -->
  <text x="32" y="180" font-size="10.5" fill="#666" font-weight="bold">以 3 结尾</text>
  <rect x="60" y="160" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">abbc</text>
  <rect x="150" y="160" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bbc</text>
  <rect x="240" y="160" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bc</text>
  <rect x="330" y="160" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <text x="420" y="180" font-size="10" fill="#888">f(3)=8</text>

  <!-- append 'a' arrow -->
  <text x="270" y="208" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">↓ 追加 s[4]='a'（每个子串 +1 个引力 iff 原本不含 'a'）</text>

  <!-- ===== Row: substrings ending at i=4 ===== -->
  <text x="32" y="250" font-size="10.5" fill="#666" font-weight="bold">以 4 结尾</text>
  <!-- abbc -> abbca : already had 'a', appeal 3->3, +0 (gray) -->
  <rect x="60" y="230" width="80" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="250" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">abbca</text>
  <text x="100" y="272" text-anchor="middle" font-size="9" fill="#999">+0 含a</text>
  <!-- bbc -> bbca : no 'a', 2->3, +1 (green) -->
  <rect x="150" y="230" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bbca</text>
  <text x="190" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">+1 新a</text>
  <!-- bc -> bca : +1 (green) -->
  <rect x="240" y="230" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bca</text>
  <text x="280" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">+1 新a</text>
  <!-- c -> ca : +1 (green) -->
  <rect x="330" y="230" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ca</text>
  <text x="370" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">+1 新a</text>
  <!-- new single char "a" : +1 (orange, 新增) -->
  <rect x="420" y="230" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="250" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">a</text>
  <text x="460" y="272" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">+1 新增</text>

  <!-- count delta -->
  <path d="M 190 286 Q 190 296 200 296 L 460 296 Q 470 296 470 286" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 个“原本不含 a” + 1 个新增 = 4 个引力增量</text>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="326" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Δ = i − last[s[i]] = 4 − 0 = 4  →  f(4) = f(3) + 4 = 8 + 4 = 12</text>

  <!-- ===== Footer note ===== -->
  <rect x="40" y="370" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="390" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">“原本不含 s[i] 的子串”= 起点在 (last[s[i]], i−1] 的子串 = (i−1)−last[s[i]] 个</text>
  <text x="270" y="406" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">再加单字符新子串 s[i..i] 共 +1，故 Δ = (i−1)−last+1 = i − last[s[i]]</text>
  <text x="270" y="421" text-anchor="middle" font-size="9.5" fill="#888">每步 O(1) 滚动 f(i)，累加得总引力，整体 O(n)</text>
</svg>
