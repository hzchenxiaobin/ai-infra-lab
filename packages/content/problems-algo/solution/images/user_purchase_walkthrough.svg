<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：分组分类 → 补零网格 → 最终输出</text>

  <!-- 原始数据 -->
  <text x="30" y="54" font-size="11.5" fill="#888">① 原始表 Spending</text>
  <rect x="30" y="62" width="300" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">user_id</text>
  <text x="135" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">spend_date</text>
  <text x="220" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">platform</text>
  <text x="285" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">amount</text>
  <text x="60" y="98" text-anchor="middle" font-size="10" fill="#333">1</text><text x="135" y="98" text-anchor="middle" font-size="10" fill="#333">07-01</text><text x="220" y="98" text-anchor="middle" font-size="10" fill="#b85450">mobile</text><text x="285" y="98" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="60" y="114" text-anchor="middle" font-size="10" fill="#333">1</text><text x="135" y="114" text-anchor="middle" font-size="10" fill="#333">07-01</text><text x="220" y="114" text-anchor="middle" font-size="10" fill="#d6a040">desktop</text><text x="285" y="114" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="60" y="130" text-anchor="middle" font-size="10" fill="#333">2</text><text x="135" y="130" text-anchor="middle" font-size="10" fill="#333">07-01</text><text x="220" y="130" text-anchor="middle" font-size="10" fill="#b85450">mobile</text><text x="285" y="130" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="60" y="146" text-anchor="middle" font-size="10" fill="#333">2</text><text x="135" y="146" text-anchor="middle" font-size="10" fill="#333">07-02</text><text x="220" y="146" text-anchor="middle" font-size="10" fill="#b85450">mobile</text><text x="285" y="146" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="60" y="162" text-anchor="middle" font-size="10" fill="#333">3</text><text x="135" y="162" text-anchor="middle" font-size="10" fill="#333">07-01</text><text x="220" y="162" text-anchor="middle" font-size="10" fill="#d6a040">desktop</text><text x="285" y="162" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="60" y="178" text-anchor="middle" font-size="10" fill="#333">3</text><text x="135" y="178" text-anchor="middle" font-size="10" fill="#333">07-02</text><text x="220" y="178" text-anchor="middle" font-size="10" fill="#d6a040">desktop</text><text x="285" y="178" text-anchor="middle" font-size="10" fill="#333">100</text>

  <!-- CTE T 结果 -->
  <path d="M 180 184 L 180 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="54" font-size="11.5" fill="#888">② CTE T：分组分类后</text>
  <rect x="340" y="62" width="280" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">user_id</text>
  <text x="455" y="80" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">date</text>
  <text x="525" y="80" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">plat</text>
  <text x="585" y="80" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">amount</text>
  <text x="380" y="100" text-anchor="middle" font-size="10" fill="#333">1</text><text x="455" y="100" text-anchor="middle" font-size="10" fill="#333">07-01</text><text x="525" y="100" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">both</text><text x="585" y="100" text-anchor="middle" font-size="10" fill="#333">200</text>
  <text x="380" y="118" text-anchor="middle" font-size="10" fill="#333">2</text><text x="455" y="118" text-anchor="middle" font-size="10" fill="#333">07-01</text><text x="525" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">mobile</text><text x="585" y="118" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="380" y="136" text-anchor="middle" font-size="10" fill="#333">3</text><text x="455" y="136" text-anchor="middle" font-size="10" fill="#333">07-01</text><text x="525" y="136" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">desktop</text><text x="585" y="136" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="380" y="154" text-anchor="middle" font-size="10" fill="#333">2</text><text x="455" y="154" text-anchor="middle" font-size="10" fill="#333">07-02</text><text x="525" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">mobile</text><text x="585" y="154" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="380" y="172" text-anchor="middle" font-size="10" fill="#333">3</text><text x="455" y="172" text-anchor="middle" font-size="10" fill="#333">07-02</text><text x="525" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">desktop</text><text x="585" y="172" text-anchor="middle" font-size="10" fill="#333">100</text>

  <!-- 补零网格说明 -->
  <path d="M 320 184 L 320 216 L 320 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="210" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠️ 07-02 无 "both" 用户 → 网格补出 both,0,0 行</text>

  <!-- 最终输出 -->
  <path d="M 320 252 L 320 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="280" font-size="11.5" fill="#888">③ 最终输出（每日期 3 行，LEFT JOIN 聚合）</text>
  <rect x="30" y="288" width="580" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="308" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">spend_date</text>
  <text x="240" y="308" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">platform</text>
  <text x="400" y="308" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">total_amount</text>
  <text x="540" y="308" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">total_users</text>

  <text x="100" y="328" text-anchor="middle" font-size="10" fill="#333">07-01</text><text x="240" y="328" text-anchor="middle" font-size="10" fill="#d6a040">desktop</text><text x="400" y="328" text-anchor="middle" font-size="10" fill="#333">100</text><text x="540" y="328" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="100" y="346" text-anchor="middle" font-size="10" fill="#333">07-01</text><text x="240" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a">mobile</text><text x="400" y="346" text-anchor="middle" font-size="10" fill="#333">100</text><text x="540" y="346" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="100" y="364" text-anchor="middle" font-size="10" fill="#333">07-01</text><text x="240" y="364" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">both</text><text x="400" y="364" text-anchor="middle" font-size="10" fill="#333">200</text><text x="540" y="364" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="100" y="386" text-anchor="middle" font-size="10" fill="#333">07-02</text><text x="240" y="386" text-anchor="middle" font-size="10" fill="#d6a040">desktop</text><text x="400" y="386" text-anchor="middle" font-size="10" fill="#333">100</text><text x="540" y="386" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="100" y="404" text-anchor="middle" font-size="10" fill="#333">07-02</text><text x="240" y="404" text-anchor="middle" font-size="10" fill="#4a7a3a">mobile</text><text x="400" y="404" text-anchor="middle" font-size="10" fill="#333">100</text><text x="540" y="404" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="40" y="412" width="560" height="24" fill="#fff3cd" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="428" text-anchor="middle" font-size="10" fill="#333">07-02</text><text x="240" y="428" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">both</text><text x="400" y="428" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text><text x="540" y="428" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <!-- 说明 -->
  <rect x="30" y="450" width="580" height="94" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="472" font-size="11" fill="#555" font-weight="bold">💡 关键对照：</text>
  <text x="50" y="490" font-size="10.5" fill="#888">07-01：user1=both(200) + user2=mobile(100) + user3=desktop(100) → 三个分类各 1 人</text>
  <text x="50" y="508" font-size="10.5" fill="#888">07-02：user2=mobile(100) + user3=desktop(100) → both 行无匹配，LEFT JOIN 补 0,0</text>
  <text x="50" y="526" font-size="10.5" fill="#b85450">COUNT(t.user_id) 忽略 NULL → 无匹配时自动为 0；IFNULL(SUM,0) 补金额零</text>
</svg>
