<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排序取 Top-K + 至多一次交换修正奇偶</text>

  <!-- Sorted array row -->
  <text x="48" y="56" font-size="11" fill="#888" filter="url(#rough2)">降序排序后：</text>

  <rect x="48" y="64" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="73" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="102" y="64" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="156" y="64" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="181" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="210" y="64" width="50" height="38" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="89" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">5</text>

  <rect x="264" y="64" width="50" height="38" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="89" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">4</text>

  <rect x="318" y="64" width="50" height="38" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="343" y="89" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">3</text>

  <!-- Labels for Top-K and Rest -->
  <rect x="44" y="48" width="170" height="20" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="42" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Top-K（k=3）</text>

  <rect x="206" y="48" width="166" height="20" fill="none" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="42" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">剩余 n−k 个</text>

  <!-- Sum computation -->
  <rect x="48" y="116" width="320" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="208" y="135" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">S = 8+7+6 = 21（奇数）→ 需修正奇偶</text>

  <!-- Two swap options -->
  <text x="48" y="168" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">和为奇数时，交换一个元素即可翻转奇偶（奇−奇=偶 / 奇−偶=奇→偶）</text>

  <!-- Option A -->
  <rect x="30" y="180" width="250" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="48" y="200" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">方案 A：换出最小奇数，换入最大偶数</text>

  <rect x="48" y="210" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="230" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="68" y="250" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">最小奇数</text>

  <path d="M 92 225 L 130 225" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="111" y="219" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">换出</text>

  <rect x="134" y="210" width="40" height="30" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="230" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">4</text>
  <text x="154" y="250" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">最大偶数</text>

  <text x="190" y="222" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">S′ = 21−7+4</text>
  <text x="190" y="238" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 18 ✓</text>

  <!-- Option B -->
  <rect x="290" y="180" width="250" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="308" y="200" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">方案 B：换出最小偶数，换入最大奇数</text>

  <rect x="308" y="210" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="230" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="328" y="250" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">最小偶数</text>

  <path d="M 352 225 L 390 225" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="371" y="219" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">换出</text>

  <rect x="394" y="210" width="40" height="30" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="230" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">5</text>
  <text x="414" y="250" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">最大奇数</text>

  <text x="450" y="222" font-size="10.5" fill="#d6a040" filter="url(#rough2)">S′ = 21−6+5</text>
  <text x="450" y="238" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 20 ✓</text>

  <!-- Result -->
  <rect x="30" y="290" width="510" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="285" y="312" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">取 max(18, 20) = 20 → 选 {8, 7, 5}，和为 20</text>

  <!-- Key insight -->
  <text x="48" y="348" font-size="10.5" fill="#b85450" font-style="italic" filter="url(#rough2)">关键：所有元素为正 → 贪心取最大的 K 个；和为奇时仅需一次「奇↔偶」交换翻转奇偶性</text>
  <text x="48" y="368" font-size="10.5" fill="#b85450" font-style="italic" filter="url(#rough2)">两种交换方案中取损失最小（收益最大）者；若两方案均不可行（无偶数可换等）则返回 −1</text>
  <text x="48" y="388" font-size="10" fill="#888" filter="url(#rough2)">注：图中以 nums=[8,7,6,5,4,3], k=3 为例</text>
</svg>
