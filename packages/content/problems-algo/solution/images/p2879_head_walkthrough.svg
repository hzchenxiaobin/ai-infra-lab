<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：位置前缀 vs 排序陷阱</text>

  <!-- Top: input table -->
  <rect x="175" y="42" width="210" height="212" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">employees（输入，6 行）</text>

  <rect x="180" y="68" width="36" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="218" y="68" width="76" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="68" width="82" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="198" y="82" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">行索引</text>
  <text x="256" y="82" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">employee_id</text>
  <text x="337" y="82" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>

  <rect x="180" y="90" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="218" y="90" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="90" width="82" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="198" y="105" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="256" y="105" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="337" y="105" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Bob</text>

  <rect x="180" y="114" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="218" y="114" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="114" width="82" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="198" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="256" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">90</text>
  <text x="337" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Alice</text>

  <rect x="180" y="138" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="218" y="138" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="138" width="82" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="198" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="256" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>
  <text x="337" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Tatiana</text>

  <rect x="180" y="162" width="36" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="218" y="162" width="76" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="162" width="82" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="198" y="177" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="256" y="177" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">60</text>
  <text x="337" y="177" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Annabelle</text>

  <rect x="180" y="186" width="36" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="218" y="186" width="76" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="186" width="82" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="198" y="201" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="256" y="201" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">49</text>
  <text x="337" y="201" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Jonathan</text>

  <rect x="180" y="210" width="36" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="218" y="210" width="76" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="210" width="82" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="198" y="225" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="256" y="225" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">43</text>
  <text x="337" y="225" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Khaled</text>

  <text x="280" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">绿色 = 前 3 行（位置 0~2）</text>

  <!-- Arrows to both results -->
  <path d="M 220 260 L 160 292" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 340 260 L 400 292" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Bottom-left: correct -->
  <rect x="25" y="296" width="245" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 按位置取前 3（正解）</text>
  <text x="147" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 Bob / 90 Alice / 9 Tatiana</text>
  <text x="147" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= 期望输出 3, 90, 9</text>
  <text x="147" y="374" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">employees.head(3)</text>

  <!-- Bottom-right: wrong -->
  <rect x="290" y="296" width="245" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="316" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 先排序再取前 3（判错）</text>
  <text x="412" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 Bob / 9 Tatiana / 43 Khaled</text>
  <text x="412" y="356" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">≠ 期望的 3, 90, 9</text>
  <text x="412" y="374" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">sort_values 后顺序被破坏</text>
</svg>
