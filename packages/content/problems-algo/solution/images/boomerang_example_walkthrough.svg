<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两组点叉积一非零一零的对照</text>

  <!-- ===== 示例 1 (左)：有效 ===== -->
  <text x="116" y="56" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例1  [[1,1],[2,3],[3,2]]</text>

  <!-- 左网格 4x4, origin (48,256), unit 34 -->
  <path d="M48,120 L48,256 M82,120 L82,256 M116,120 L116,256 M150,120 L150,256 M184,120 L184,256 M48,256 L184,256 M48,222 L184,222 M48,188 L184,188 M48,154 L184,154 M48,120 L184,120" fill="none" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <!-- 坐标轴加粗 -->
  <path d="M48,256 L184,256 M48,256 L48,120" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="268" font-size="10" fill="#888" filter="url(#rough2)">0</text>

  <!-- 三角形 P1(1,1)->(82,222) P2(2,3)->(116,154) P3(3,2)->(150,188) -->
  <polygon points="82,222 116,154 150,188" fill="#e6f4ea" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="82" cy="222" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="116" cy="154" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="150" cy="188" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="62" y="236" font-size="10.5" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="104" y="148" font-size="10.5" fill="#333" filter="url(#rough2)">(2,3)</text>
  <text x="156" y="196" font-size="10.5" fill="#333" filter="url(#rough2)">(3,2)</text>

  <!-- 计算 -->
  <text x="116" y="288" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">cross = (2−1)(2−1) − (3−1)(3−1)</text>
  <text x="116" y="306" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">= 1·1 − 2·2 = −3 ≠ 0</text>
  <rect x="76" y="318" width="80" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 分隔虚线 -->
  <path d="M 280 50 L 280 360" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,5" filter="url(#rough2)"/>

  <!-- ===== 示例 2 (右)：无效 ===== -->
  <text x="412" y="56" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例2  [[1,1],[2,2],[3,3]]</text>

  <!-- 右网格 4x4, origin (344,256), unit 34 -->
  <path d="M344,120 L344,256 M378,120 L378,256 M412,120 L412,256 M446,120 L446,256 M480,120 L480,256 M344,256 L480,256 M344,222 L480,222 M344,188 L480,188 M344,154 L480,154 M344,120 L480,120" fill="none" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <path d="M344,256 L480,256 M344,256 L344,120" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="336" y="268" font-size="10" fill="#888" filter="url(#rough2)">0</text>

  <!-- 共线直线穿过三点 P1(1,1)->(378,222) P2(2,2)->(412,188) P3(3,3)->(446,154) -->
  <!-- 直线 y=-x+564: at x=360 -> y=204? recalc with screen coords: screen_y = 256 - 34*val.
       P1 val(1,1): (378,222); P2(2,2): (412,188); P3(3,3): (446,154). slope screen = -34/34 = -1
       line through (378,222): screen_y = -screen_x + 600. at x=360 -> 240; at x=464 -> 136 -->
  <line x1="360" y1="240" x2="464" y2="136" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="378" cy="222" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="412" cy="188" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="446" cy="154" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="356" y="236" font-size="10.5" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="396" y="182" font-size="10.5" fill="#333" filter="url(#rough2)">(2,2)</text>
  <text x="452" y="150" font-size="10.5" fill="#333" filter="url(#rough2)">(3,3)</text>

  <!-- 计算 -->
  <text x="412" y="288" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">cross = (2−1)(3−1) − (3−1)(2−1)</text>
  <text x="412" y="306" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">= 1·2 − 2·1 = 0</text>
  <rect x="372" y="318" width="80" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="336" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 底部结论 -->
  <rect x="40" y="372" width="480" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">叉积 = 三角形 P₁P₂P₃ 有向面积的 2 倍</text>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">面积为 0 ⇔ 三点退化成线段/点 → 共线；面积非 0 ⇔ 真三角形 → 有效回旋镖</text>
</svg>
