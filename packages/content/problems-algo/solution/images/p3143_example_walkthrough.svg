<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">三个示例：t 卡在哪一层？</text>

  <!-- 面板 1 -->
  <rect x="20" y="36" width="480" height="94" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="38" y="60" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1　s = "abdca"</text>
  <text x="38" y="90" font-size="10" fill="#888" filter="url(#rough2)">点的（标签, d）：</text>
  <circle cx="175" cy="90" r="12" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="95" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a</text>
  <circle cx="215" cy="90" r="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <circle cx="255" cy="90" r="12" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="255" y="95" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">d</text>
  <circle cx="295" cy="90" r="12" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="295" y="95" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c</text>
  <circle cx="335" cy="90" r="12" fill="#ffffff" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="335" y="95" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="175" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=2</text>
  <text x="215" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=2</text>
  <text x="255" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=4</text>
  <text x="295" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=3</text>
  <text x="335" y="122" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">d=3</text>
  <text x="386" y="60" font-size="11" fill="#b85450" filter="url(#rough2)">撞车：a 的 2→3</text>
  <text x="386" y="90" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">t = 3</text>
  <text x="386" y="120" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = #{d&lt;3} = 2</text>

  <!-- 面板 2 -->
  <rect x="20" y="140" width="480" height="94" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="38" y="164" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2　s = "abb"</text>
  <text x="38" y="194" font-size="10" fill="#888" filter="url(#rough2)">点的（标签, d）：</text>
  <circle cx="175" cy="194" r="12" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="199" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a</text>
  <circle cx="215" cy="194" r="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="199" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <circle cx="255" cy="194" r="12" fill="#ffffff" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="255" y="199" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">b</text>
  <text x="175" y="226" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=1</text>
  <text x="215" y="226" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=2</text>
  <text x="255" y="226" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">d=2</text>
  <text x="386" y="164" font-size="11" fill="#b85450" filter="url(#rough2)">撞车：b 的 2→2</text>
  <text x="386" y="194" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">t = 2</text>
  <text x="386" y="224" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = #{d&lt;2} = 1</text>

  <!-- 面板 3 -->
  <rect x="20" y="244" width="480" height="94" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="38" y="268" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">示例 3　s = "ccd"</text>
  <text x="38" y="298" font-size="10" fill="#888" filter="url(#rough2)">点的（标签, d）：</text>
  <circle cx="175" cy="298" r="12" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="303" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c</text>
  <circle cx="215" cy="298" r="12" fill="#ffffff" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="215" y="303" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">c</text>
  <circle cx="255" cy="298" r="12" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="255" y="303" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">d</text>
  <text x="175" y="330" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=1</text>
  <text x="215" y="330" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">d=1</text>
  <text x="255" y="330" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=2</text>
  <text x="386" y="268" font-size="11" fill="#b85450" filter="url(#rough2)">撞车：c 的 1→1</text>
  <text x="386" y="298" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">t = 1</text>
  <text x="386" y="328" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = #{d&lt;1} = 0</text>

  <text x="260" y="354" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">t = 某标签第二次出现的最小 d；d = t 的整层报废</text>
</svg>
