<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：s = "fool3e7bar"，sub = "leet"，逐位移位相与</text>

  <!-- ===== s char ruler 0..9 (window 3..6 highlighted) ===== -->
  <!-- non-window cells -->
  <rect x="110" y="48" width="32" height="26" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="126" y="66" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">f</text>
  <rect x="142" y="48" width="32" height="26" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="158" y="66" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">o</text>
  <rect x="174" y="48" width="32" height="26" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="66" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">o</text>
  <!-- window cells 3,4,5,6 -->
  <rect x="206" y="48" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">l</text>
  <rect x="238" y="48" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="254" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="270" y="48" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="286" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">e</text>
  <rect x="302" y="48" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">7</text>
  <!-- non-window cells 7,8,9 -->
  <rect x="334" y="48" width="32" height="26" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="66" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">b</text>
  <rect x="366" y="48" width="32" height="26" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="66" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">a</text>
  <rect x="398" y="48" width="32" height="26" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="414" y="66" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">r</text>

  <!-- index numbers -->
  <text x="126" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="158" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="190" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="222" y="88" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="254" y="88" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="286" y="88" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="318" y="88" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="350" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">7</text>
  <text x="382" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">8</text>
  <text x="414" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">9</text>

  <text x="270" y="106" text-anchor="middle" font-size="11" fill="#555">每位 i 的 B_i = acc[sub[i]]，右移 i 位后逐位相与（cand 初值 {0..9}）</text>

  <!-- column-3 surviving band -->
  <rect x="206" y="116" width="32" height="178" fill="#4a7a3a" fill-opacity="0.07"/>

  <!-- B0 (i=0, l): {3} -->
  <rect x="110" y="118" width="320" height="24" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="206" y="118" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="104" y="134" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">i=0 l {3}&gt;&gt;0</text>

  <!-- B1 (i=1, e): {3,4} -->
  <rect x="110" y="146" width="320" height="24" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="206" y="146" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="104" y="162" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">i=1 e {4,5}&gt;&gt;1</text>

  <!-- B2 (i=2, e): {2,3} -->
  <rect x="110" y="174" width="320" height="24" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="174" y="174" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="104" y="190" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">i=2 e {4,5}&gt;&gt;2</text>

  <!-- B3 (i=3, t): {3} -->
  <rect x="110" y="202" width="320" height="24" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="206" y="202" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="104" y="218" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">i=3 t {6}&gt;&gt;3</text>

  <!-- AND arrow -->
  <line x1="270" y1="230" x2="270" y2="262" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="250" font-size="11" fill="#888" font-weight="bold">按位与</text>

  <!-- cand {3} -->
  <rect x="110" y="266" width="320" height="26" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="206" y="266" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="104" y="283" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">cand = {3}</text>

  <!-- result -->
  <rect x="60" y="306" width="420" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="329" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">起点 j=3：s[3:7]="l3e7" 匹配 "leet"（l=l, e-&gt;3, e=e, t-&gt;7）→ true</text>

  <!-- examples 2 & 3 -->
  <rect x="40" y="352" width="460" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="374" font-size="11" fill="#b85450" font-weight="bold">示例 2 sub="f00l"：acc[0]=∅（s 无 '0' 且无 0-&gt;o 映射），第 i=1 步 cand 即 0 → false</text>
  <text x="56" y="396" font-size="11" fill="#b85450" font-weight="bold">示例 3 sub="leetd"：acc[d]={7}(d-&gt;b)，相与后 cand={3} → s[3:8]="l33tb" → true</text>
</svg>
