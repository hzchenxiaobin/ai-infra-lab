<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：位次计数矩阵 + 向量字典序降序排序</text>

  <!-- 5 张选票 -->
  <text x="30" y="54" font-size="12" fill="#666" font-weight="bold">5 张选票（示例 1）</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold">
    <rect x="30" y="62" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="60" y="79" text-anchor="middle" fill="#333">ABC</text>
    <rect x="96" y="62" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="126" y="79" text-anchor="middle" fill="#333">ACB</text>
    <rect x="162" y="62" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="192" y="79" text-anchor="middle" fill="#333">ABC</text>
    <rect x="228" y="62" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="258" y="79" text-anchor="middle" fill="#333">ACB</text>
    <rect x="294" y="62" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="324" y="79" text-anchor="middle" fill="#333">ACB</text>
  </g>

  <!-- arrow 投票 → 矩阵 -->
  <path d="M180 92 L180 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="110" font-size="11" fill="#446688" font-weight="bold">① 遍历选票，统计每位次票数</text>

  <!-- 位次计数矩阵 -->
  <text x="30" y="134" font-size="12" fill="#666" font-weight="bold">位次计数矩阵 cnt[团队][位次]</text>
  <g filter="url(#rough2)">
    <!-- 列头 -->
    <rect x="80" y="142" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="105" y="159" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">团队</text>
    <rect x="130" y="142" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="155" y="159" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">位0</text>
    <rect x="180" y="142" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="205" y="159" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">位1</text>
    <rect x="230" y="142" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="255" y="159" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">位2</text>
    <!-- 行 A -->
    <rect x="80" y="166" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="105" y="183" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
    <rect x="130" y="166" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="155" y="183" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
    <rect x="180" y="166" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="205" y="183" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="230" y="166" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="255" y="183" text-anchor="middle" font-size="12" fill="#888">0</text>
    <!-- 行 B -->
    <rect x="80" y="190" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="207" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">B</text>
    <rect x="130" y="190" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="155" y="207" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="180" y="190" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="205" y="207" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="230" y="190" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="255" y="207" text-anchor="middle" font-size="12" fill="#333">3</text>
    <!-- 行 C -->
    <rect x="80" y="214" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="105" y="231" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">C</text>
    <rect x="130" y="214" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="155" y="231" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="180" y="214" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="205" y="231" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
    <rect x="230" y="214" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="255" y="231" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>

  <!-- arrow 矩阵 → 排序 -->
  <path d="M290 227 L350 227" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="320" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② 降序</text>

  <!-- 排序后的团队向量 -->
  <text x="370" y="134" font-size="12" fill="#666" font-weight="bold">按向量字典序降序</text>
  <g filter="url(#rough2)" font-size="12">
    <!-- A 排第1 -->
    <rect x="370" y="142" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="384" y="160" font-size="12" fill="#333" font-weight="bold">A</text>
    <text x="470" y="160" text-anchor="middle" fill="#446688" font-weight="bold">[5, 0, 0]</text>
    <text x="538" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第1</text>
    <!-- C 排第2 -->
    <rect x="370" y="172" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="384" y="190" font-size="12" fill="#333" font-weight="bold">C</text>
    <text x="470" y="190" text-anchor="middle" fill="#d6a040" font-weight="bold">[0, 3, 2]</text>
    <text x="538" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第2</text>
    <!-- B 排第3 -->
    <rect x="370" y="202" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="384" y="220" font-size="12" fill="#333" font-weight="bold">B</text>
    <text x="470" y="220" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[0, 2, 3]</text>
    <text x="538" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第3</text>
  </g>

  <!-- B vs C 比较说明 -->
  <path d="M205 244 L205 268" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="290" y="262" font-size="11" fill="#b85450" font-weight="bold">B vs C：位0 并列 0=0 → 位1：C 的 3 &gt; B 的 2 → C 在前</text>

  <!-- 答案框 -->
  <path d="M460 234 L460 282" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <rect x="390" y="288" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="465" y="314" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">结果 = "ACB"</text>

  <!-- 底部说明 -->
  <text x="290" y="360" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">关键：把「跨选票比较两团队」压缩为「比较预计算的位次计数向量」</text>
  <text x="290" y="380" text-anchor="middle" font-size="11" fill="#888">向量字典序降序 = 先比位0票，并列再比位1… 全并列则字母升序</text>
  <text x="290" y="400" text-anchor="middle" font-size="10" fill="#aaa">预处理 O(n·m) + 排序 O(m² log m)，m 为团队数（≤26）</text>
</svg>
