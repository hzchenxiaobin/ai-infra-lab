<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：正数相加与负数相加（补码统一）</text>

  <!-- ===== Example 1: 12 + 5 = 17 ===== -->
  <rect x="40" y="44" width="460" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="12.5" fill="#446688" font-weight="bold">示例 1：两个正数</text>

  <!-- num1 = 12 -->
  <text x="60" y="96" font-size="12" fill="#333" font-weight="bold">num1 = 12</text>
  <rect x="150" y="80" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">12</text>

  <text x="248" y="102" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">+</text>

  <text x="270" y="96" font-size="12" fill="#333" font-weight="bold">num2 = 5</text>
  <rect x="312" y="80" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>

  <!-- equals -->
  <line x1="150" y1="120" x2="392" y2="120" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="146" font-size="12" fill="#4a7a3a" font-weight="bold">结果</text>
  <rect x="150" y="130" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="152" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">17</text>
  <text x="248" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">12 + 5 = 17 ✓</text>
  <text x="410" y="152" font-size="10.5" fill="#888">直接相加</text>

  <!-- ===== Example 2: -10 + 4 = -6, complement ===== -->
  <rect x="40" y="208" width="460" height="232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="230" font-size="12.5" fill="#d6a040" font-weight="bold">示例 2：一负一正（补码同电路）</text>

  <!-- num1 = -10, 8-bit complement -->
  <text x="60" y="258" font-size="12" fill="#333" font-weight="bold">num1 = -10</text>
  <text x="60" y="274" font-size="10" fill="#888">8 位补码</text>
  <rect x="150" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="164" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="180" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="194" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="210" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="224" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="240" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="254" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="270" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="284" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="300" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="314" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="330" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="344" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="360" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="374" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="404" y="271" font-size="10.5" fill="#b85450" font-weight="bold">11110110</text>

  <text x="164" y="298" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">+</text>

  <!-- num2 = 4, 8-bit -->
  <text x="60" y="326" font-size="12" fill="#333" font-weight="bold">num2 = 4</text>
  <text x="60" y="342" font-size="10" fill="#888">8 位补码</text>
  <rect x="150" y="320" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="164" y="339" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="180" y="320" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="194" y="339" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="210" y="320" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="224" y="339" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="240" y="320" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="254" y="339" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="270" y="320" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="284" y="339" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="300" y="320" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="314" y="339" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="330" y="320" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="344" y="339" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="360" y="320" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="374" y="339" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="404" y="339" font-size="10.5" fill="#446688" font-weight="bold">00000100</text>

  <!-- equals line -->
  <line x1="150" y1="356" x2="388" y2="356" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- result = -6, complement 11111010 -->
  <text x="60" y="384" font-size="12" fill="#4a7a3a" font-weight="bold">结果 = -6</text>
  <rect x="150" y="366" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="180" y="366" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="210" y="366" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="224" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="240" y="366" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="254" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="270" y="366" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="300" y="366" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="330" y="366" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="344" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="360" y="366" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="374" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="404" y="385" font-size="10.5" fill="#4a7a3a" font-weight="bold">11111010</text>

  <!-- note -->
  <rect x="40" y="406" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="425" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">同一套 ADD 指令，补码通吃正负 → -10 + 4 = -6 ✓</text>
</svg>
