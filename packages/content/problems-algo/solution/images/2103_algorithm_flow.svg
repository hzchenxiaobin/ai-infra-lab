<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：解析颜色对 → 累积位掩码 → 统计 mask==7</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">单层循环步长 2，循环结束后线性扫描 10 个杆子计数</text>

  <!-- ===== Start node ===== -->
  <ellipse cx="100" cy="74" rx="46" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="78" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始</text>

  <!-- arrow start -> init -->
  <path d="M 100 96 L 100 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init: mask[10]={0}, i=0 ===== -->
  <rect x="48" y="122" width="104" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="140" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">初始化</text>
  <text x="100" y="156" text-anchor="middle" font-size="10" fill="#555">mask[10]={0}, i=0</text>

  <!-- arrow init -> loop cond -->
  <path d="M 100 168 L 100 192" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop condition diamond ===== -->
  <polygon points="100,194 168,228 100,262 32,228" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="224" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i+1 &lt; len?</text>
  <text x="100" y="240" text-anchor="middle" font-size="10" fill="#555">(步长 2)</text>

  <!-- ===== YES branch: go right to parse ===== -->
  <path d="M 168 228 L 210 228" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Parse box ===== -->
  <rect x="210" y="206" width="160" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="224" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">解析 (rings[i], rings[i+1])</text>
  <text x="290" y="240" text-anchor="middle" font-size="10" fill="#555">color→bit, rod=rings[i+1]-'0'</text>

  <!-- arrow parse -> OR -->
  <path d="M 290 252 L 290 276" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== OR operation box (green highlight) ===== -->
  <rect x="210" y="278" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">mask[rod] |= bit</text>
  <text x="290" y="312" text-anchor="middle" font-size="10" fill="#555">按位或天然去重</text>

  <!-- arrow OR -> back to loop cond (i+=2) -->
  <path d="M 290 322 L 290 336 L 100 336 L 100 262" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="330" text-anchor="middle" font-size="10" fill="#555">i += 2，回到判定</text>

  <!-- ===== NO branch: go down to count ===== -->
  <path d="M 100 262 L 100 282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="276" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Count box ===== -->
  <rect x="48" y="284" width="104" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">统计</text>
  <text x="100" y="318" text-anchor="middle" font-size="10" fill="#555">mask[i]==7 的个数</text>

  <!-- arrow count -> return -->
  <path d="M 100 284 L 100 268 L 40 268 L 40 80 L 52 80" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Return node (right side) ===== -->
  <ellipse cx="430" cy="120" rx="56" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <text x="430" y="132" text-anchor="middle" font-size="10" fill="#555">(三色齐全杆数)</text>

  <!-- arrow count -> return (direct) -->
  <path d="M 152 306 L 430 306 L 430 144" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Legend / footer ===== -->
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#aaa">遍历 n 对 (O(n)) + 扫 10 杆 (O(1)) · 总 O(n) 时间 / O(1) 空间</text>
</svg>
