<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：CTE 三阶段管道 → JOIN → ORDER BY</text>

  <!-- ===== Step 1: GROUP BY + HAVING ===== -->
  <rect x="140" y="44" width="280" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">阶段 ① CTE: S</text>
  <text x="280" y="76" text-anchor="middle" font-size="8.5" fill="#446688" font-family="monospace">SELECT salary FROM Employees</text>
  <text x="280" y="88" text-anchor="middle" font-size="8.5" fill="#446688" font-family="monospace">GROUP BY salary HAVING COUNT(1) &gt; 1</text>

  <path d="M280 100 L280 118" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Intermediate: S result ===== -->
  <rect x="170" y="120" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">S = { 3000, 7400 }</text>
  <text x="280" y="148" text-anchor="middle" font-size="8" fill="#888">（6100 被 HAVING 淘汰）</text>

  <path d="M280 156 L280 174" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Step 2: ROW_NUMBER ===== -->
  <rect x="120" y="176" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">阶段 ② CTE: T</text>
  <text x="280" y="208" text-anchor="middle" font-size="8.5" fill="#d6a040" font-family="monospace">SELECT salary,</text>
  <text x="280" y="220" text-anchor="middle" font-size="8.5" fill="#d6a040" font-family="monospace">ROW_NUMBER() OVER (ORDER BY salary) AS team_id FROM S</text>

  <path d="M280 232 L280 250" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Intermediate: T result ===== -->
  <rect x="150" y="252" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">T = { (3000,1), (7400,2) }</text>
  <text x="280" y="282" text-anchor="middle" font-size="8" fill="#888">（工资升序排名 → team_id 连续）</text>

  <path d="M280 292 L280 310" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Step 3: JOIN ===== -->
  <rect x="100" y="312" width="360" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">阶段 ③ JOIN + ORDER BY</text>
  <text x="280" y="342" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-family="monospace">SELECT e.*, t.team_id FROM Employees e JOIN T ON e.salary = t.salary</text>
  <text x="280" y="354" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-family="monospace">ORDER BY team_id, employee_id</text>

  <path d="M280 360 L280 378" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Output ===== -->
  <rect x="130" y="380" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">输出（4 行，Juan 被排除）</text>
  <text x="280" y="412" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-family="monospace">(2,Meir,3000,1) (3,Michael,3000,1) (7,Addilyn,7400,2) (9,Kannon,7400,2)</text>

  <!-- ===== Side annotation: HAVING filter ===== -->
  <path d="M420 138 L470 138" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="470" y="120" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="510" y="136" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">淘汰</text>
  <text x="510" y="150" text-anchor="middle" font-size="8" fill="#b85450">salary=6100</text>
  <text x="510" y="160" text-anchor="middle" font-size="8" fill="#b85450">count=1</text>

  <!-- ===== Side annotation: JOIN excludes ===== -->
  <path d="M460 336 L470 336" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="470" y="320" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="510" y="334" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">INNER JOIN</text>
  <text x="510" y="348" text-anchor="middle" font-size="8" fill="#b85450">Juan 不匹配</text>
</svg>
