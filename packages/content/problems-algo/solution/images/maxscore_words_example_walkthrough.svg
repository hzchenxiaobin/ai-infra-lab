<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：words=["dog","cat","dad","good"]，答案 23</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">available: a2,c1,d3,g1,o2（无 t → cat 始终被剪）</text>

  <!-- ===== Word table ===== -->
  <g filter="url(#rough2)" font-size="10">
    <text x="30" y="64" font-size="10" fill="#446688" font-weight="bold">单词表：</text>

    <!-- header -->
    <rect x="30" y="68" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="75" y="82" text-anchor="middle" fill="#446688" font-weight="bold">word</text>
    <rect x="120" y="68" width="130" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="185" y="82" text-anchor="middle" fill="#446688" font-weight="bold">需要字母</text>
    <rect x="250" y="68" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="275" y="82" text-anchor="middle" fill="#446688" font-weight="bold">得分</text>
    <rect x="300" y="68" width="70" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="335" y="82" text-anchor="middle" fill="#446688" font-weight="bold">可拼写?</text>

    <!-- dog -->
    <rect x="30" y="88" width="90" height="20" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="3"/>
    <text x="75" y="102" text-anchor="middle" fill="#555" font-family="monospace">dog</text>
    <rect x="120" y="88" width="130" height="20" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="3"/>
    <text x="185" y="102" text-anchor="middle" fill="#555" font-family="monospace">d1 o1 g1</text>
    <rect x="250" y="88" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="3"/>
    <text x="275" y="102" text-anchor="middle" fill="#555">10</text>
    <rect x="300" y="88" width="70" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <text x="335" y="102" text-anchor="middle" fill="#4a7a3a">✓</text>

    <!-- cat (pruned) -->
    <rect x="30" y="108" width="90" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3"/>
    <text x="75" y="122" text-anchor="middle" fill="#b85450" font-family="monospace">cat</text>
    <rect x="120" y="108" width="130" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3"/>
    <text x="185" y="122" text-anchor="middle" fill="#b85450" font-family="monospace">c1 a1 t1</text>
    <rect x="250" y="108" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3"/>
    <text x="275" y="122" text-anchor="middle" fill="#b85450">10</text>
    <rect x="300" y="108" width="70" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3"/>
    <text x="335" y="122" text-anchor="middle" fill="#b85450">✗ 无t</text>

    <!-- dad -->
    <rect x="30" y="128" width="90" height="20" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="3"/>
    <text x="75" y="142" text-anchor="middle" fill="#555" font-family="monospace">dad</text>
    <rect x="120" y="128" width="130" height="20" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="3"/>
    <text x="185" y="142" text-anchor="middle" fill="#555" font-family="monospace">d2 a1</text>
    <rect x="250" y="128" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="3"/>
    <text x="275" y="142" text-anchor="middle" fill="#555">11</text>
    <rect x="300" y="128" width="70" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <text x="335" y="142" text-anchor="middle" fill="#4a7a3a">✓</text>

    <!-- good -->
    <rect x="30" y="148" width="90" height="20" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="3"/>
    <text x="75" y="162" text-anchor="middle" fill="#555" font-family="monospace">good</text>
    <rect x="120" y="148" width="130" height="20" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="3"/>
    <text x="185" y="162" text-anchor="middle" fill="#555" font-family="monospace">g1 o2 d1</text>
    <rect x="250" y="148" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="3"/>
    <text x="275" y="162" text-anchor="middle" fill="#555">12</text>
    <rect x="300" y="148" width="70" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <text x="335" y="162" text-anchor="middle" fill="#4a7a3a">✓</text>
  </g>

  <!-- ===== DFS tree ===== -->
  <g filter="url(#rough2)" font-size="10">
    <!-- Root -->
    <rect x="195" y="184" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="280" y="200" text-anchor="middle" fill="#446688" font-weight="bold">dfs(0, avail, 0)</text>
    <text x="280" y="213" text-anchor="middle" fill="#555" font-size="9">ans = 0</text>

    <!-- Layer 1: dog / cat(pruned) / dad / good -->
    <!-- dog -->
    <rect x="30" y="252" width="120" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="90" y="268" text-anchor="middle" fill="#4a7a3a" font-weight="bold">选 dog(10) ✓</text>
    <text x="90" y="282" text-anchor="middle" fill="#555" font-size="9">avail: d2,g0,o1</text>

    <!-- cat pruned -->
    <rect x="162" y="252" width="100" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <text x="212" y="268" text-anchor="middle" fill="#b85450" font-weight="bold">cat ✗</text>
    <text x="212" y="282" text-anchor="middle" fill="#b85450" font-size="9">t1 &gt; 0 剪枝</text>

    <!-- dad -->
    <rect x="274" y="252" width="120" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="334" y="268" text-anchor="middle" fill="#4a7a3a" font-weight="bold">选 dad(11) ✓</text>
    <text x="334" y="282" text-anchor="middle" fill="#555" font-size="9">avail: d1,g1,o2</text>

    <!-- good -->
    <rect x="406" y="252" width="120" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="466" y="268" text-anchor="middle" fill="#4a7a3a" font-weight="bold">选 good(12) ✓</text>
    <text x="466" y="282" text-anchor="middle" fill="#555" font-size="9">avail: d2,g0,o0</text>

    <!-- edges root -> L1 -->
    <path d="M 245 218 L 90 252" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <path d="M 265 218 L 212 252" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)"/>
    <path d="M 295 218 L 334 252" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <path d="M 315 218 L 466 252" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>

    <!-- Layer 2: under dog -> dad(21) / good(pruned g0) -->
    <rect x="30" y="324" width="120" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="90" y="340" text-anchor="middle" fill="#4a7a3a" font-weight="bold">dad(11) ✓</text>
    <text x="90" y="354" text-anchor="middle" fill="#555" font-size="9">ans=21, d0,g0</text>
    <path d="M 90 294 L 90 324" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>

    <rect x="162" y="324" width="100" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <text x="212" y="340" text-anchor="middle" fill="#b85450" font-weight="bold">good ✗</text>
    <text x="212" y="354" text-anchor="middle" fill="#b85450" font-size="9">g1 &gt; 0 剪枝</text>
    <path d="M 110 294 L 180 324" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)"/>

    <!-- under dad -> good(23 star) -->
    <rect x="274" y="324" width="120" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="334" y="340" text-anchor="middle" fill="#d6a040" font-weight="bold">good(12) ✓</text>
    <text x="334" y="354" text-anchor="middle" fill="#d6a040" font-size="9" font-weight="bold">ans=23 ⭐</text>
    <path d="M 334 294 L 334 324" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <!-- under good -> no more (leaf) -->
    <rect x="406" y="324" width="120" height="42" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="6"/>
    <text x="466" y="340" text-anchor="middle" fill="#888" font-weight="bold">(叶节点)</text>
    <text x="466" y="354" text-anchor="middle" fill="#555" font-size="9">ans=23</text>
    <path d="M 466 294 L 466 324" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

    <!-- Layer 3: under (dog,dad) -> good pruned -->
    <rect x="30" y="390" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6"/>
    <text x="90" y="406" text-anchor="middle" fill="#b85450" font-weight="bold">good ✗</text>
    <text x="90" y="420" text-anchor="middle" fill="#b85450" font-size="9">g1 &gt; 0 剪枝</text>
    <path d="M 90 366 L 90 390" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)"/>
  </g>

  <!-- ===== Result box ===== -->
  <rect x="160" y="390" width="370" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="345" y="408" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最优解：dad + good = 11 + 12 = 23 ⭐</text>
  <text x="345" y="421" text-anchor="middle" font-size="9" fill="#555">用 d3,a1,g1,o2，恰好用尽 d 和 g</text>

  <!-- ===== Insight box ===== -->
  <rect x="30" y="440" width="510" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠️ dog 耗尽 g → 后续 good 被剪；dad 留住 g 和 o → good 可拼 → 得 23</text>
  <text x="280" y="467" text-anchor="middle" font-size="9" fill="#555">选词顺序影响剪枝效果，但回溯保证全局最优</text>
</svg>
