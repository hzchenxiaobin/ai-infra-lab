<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "010101"，k = 1 → 输出 [15, 9, 3]</text>

  <!-- 表 1：L 与 cnt -->
  <text x="44" y="52" font-size="10.5" fill="#666" filter="url(#rough2)">滑窗副产品：</text>
  <rect x="44" y="58" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="75" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="116" y="58" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="58" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="58" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="284" y="58" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="58" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="58" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="75" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="198" y="75" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="254" y="75" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="310" y="75" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="366" y="75" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="422" y="75" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">5</text>

  <rect x="44" y="84" width="64" height="26" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="101" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">L[b]</text>
  <rect x="116" y="84" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="84" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="84" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="284" y="84" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="84" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="84" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="198" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="254" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="310" y="101" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="366" y="101" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="422" y="101" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="44" y="110" width="64" height="26" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="127" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">cnt</text>
  <rect x="116" y="110" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="110" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="110" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="284" y="110" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="110" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="110" width="52" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="198" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="254" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="310" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="366" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="422" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- 表 2：pre -->
  <rect x="44" y="152" width="64" height="26" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="169" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">pre[i]</text>
  <text x="139" y="148" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="189" y="148" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="239" y="148" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="289" y="148" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3</text>
  <text x="339" y="148" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">4</text>
  <text x="389" y="148" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">5</text>
  <text x="439" y="148" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">6</text>
  <rect x="116" y="152" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="166" y="152" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="152" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="266" y="152" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="152" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="152" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="416" y="152" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="189" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="239" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="289" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="339" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="389" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <text x="439" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>

  <!-- 表 3：三个查询 -->
  <text x="44" y="200" font-size="10.5" fill="#666" filter="url(#rough2)">逐查询拆段：</text>
  <rect x="40" y="206" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="206" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="206" width="118" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="298" y="206" width="122" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="420" y="206" width="58" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="222" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">查询</text>
  <text x="148" y="222" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">pos</text>
  <text x="239" y="222" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">Part 1（等差）</text>
  <text x="359" y="222" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">Part 2（前缀和）</text>
  <text x="449" y="222" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="40" y="230" width="76" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="230" width="64" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="230" width="118" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="298" y="230" width="122" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="420" y="230" width="58" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="246" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0, 5]</text>
  <text x="148" y="246" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="239" y="246" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">m=0 → 0</text>
  <text x="359" y="246" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">pre[6]−pre[0]=15</text>
  <text x="449" y="246" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">15</text>

  <rect x="40" y="254" width="76" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="254" width="64" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="254" width="118" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="298" y="254" width="122" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="420" y="254" width="58" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="270" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1, 4]</text>
  <text x="148" y="270" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="239" y="270" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">m=2 → 1+2=3</text>
  <text x="359" y="270" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">pre[5]−pre[3]=6</text>
  <text x="449" y="270" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="40" y="278" width="76" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="278" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="278" width="118" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="298" y="278" width="122" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="420" y="278" width="58" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="294" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2, 3]</text>
  <text x="148" y="294" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">4=r+1</text>
  <text x="239" y="294" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">m=2 → 1+2=3</text>
  <text x="359" y="294" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">0（右段空）</text>
  <text x="449" y="294" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">与官方输出 [15, 9, 3] 完全一致 ✓</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（pos = 4 &gt; r = 3 → 截断为 r+1，走纯等差段）</text>
</svg>
