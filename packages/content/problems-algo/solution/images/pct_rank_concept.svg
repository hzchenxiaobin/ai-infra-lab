<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：窗口函数给每行「贴上」分区排名 rk 与分区人数 cnt</text>

  <!-- Left: Students table -->
  <text x="86" y="58" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">Students（原始）</text>
  <rect x="20" y="64" width="132" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="33" y="79" font-size="10" fill="#446688" font-weight="bold">sid</text>
  <text x="70" y="79" font-size="10" fill="#446688" font-weight="bold">dept</text>
  <text x="112" y="79" font-size="10" fill="#446688" font-weight="bold">mark</text>
  <!-- rows: (7,1,920)(1,1,610)(3,1,530)(2,2,650)(8,2,650) -->
  <rect x="20" y="86" width="132" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="33" y="100" font-size="10" fill="#333">7</text><text x="70" y="100" font-size="10" fill="#4a7a3a">1</text><text x="112" y="100" font-size="10" fill="#333">920</text>
  <rect x="20" y="106" width="132" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="33" y="120" font-size="10" fill="#333">1</text><text x="70" y="120" font-size="10" fill="#4a7a3a">1</text><text x="112" y="120" font-size="10" fill="#333">610</text>
  <rect x="20" y="126" width="132" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="33" y="140" font-size="10" fill="#333">3</text><text x="70" y="140" font-size="10" fill="#4a7a3a">1</text><text x="112" y="140" font-size="10" fill="#333">530</text>
  <rect x="20" y="146" width="132" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="33" y="160" font-size="10" fill="#333">2</text><text x="70" y="160" font-size="10" fill="#b85450">2</text><text x="112" y="160" font-size="10" fill="#333">650</text>
  <rect x="20" y="166" width="132" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="33" y="180" font-size="10" fill="#333">8</text><text x="70" y="180" font-size="10" fill="#b85450">2</text><text x="112" y="180" font-size="10" fill="#333">650</text>

  <!-- arrow + OVER clause -->
  <path d="M 156 126 L 196 126" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="156" y="200" width="160" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="236" y="218" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">OVER (PARTITION BY dept</text>
  <text x="236" y="232" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">ORDER BY mark DESC)</text>
  <text x="236" y="244" text-anchor="middle" font-size="9.5" fill="#888">每行不聚合、保留原行数</text>

  <!-- Right: result with rk + cnt appended -->
  <text x="430" y="58" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">每行多出 rk / cnt 两列</text>
  <rect x="356" y="64" width="184" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="79" font-size="9.5" fill="#4a7a3a" font-weight="bold">sid</text>
  <text x="398" y="79" font-size="9.5" fill="#4a7a3a" font-weight="bold">dept</text>
  <text x="434" y="79" font-size="9.5" fill="#4a7a3a" font-weight="bold">mark</text>
  <text x="478" y="79" font-size="9.5" fill="#b85450" font-weight="bold">rk</text>
  <text x="520" y="79" font-size="9.5" fill="#d6a040" font-weight="bold">cnt</text>
  <!-- dept1 rows -->
  <rect x="356" y="86" width="184" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="368" y="100" font-size="9.5" fill="#333">7</text><text x="398" y="100" font-size="9.5" fill="#4a7a3a">1</text><text x="434" y="100" font-size="9.5" fill="#333">920</text><text x="478" y="100" font-size="9.5" fill="#b85450" font-weight="bold">1</text><text x="520" y="100" font-size="9.5" fill="#d6a040">3</text>
  <rect x="356" y="106" width="184" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="368" y="120" font-size="9.5" fill="#333">1</text><text x="398" y="120" font-size="9.5" fill="#4a7a3a">1</text><text x="434" y="120" font-size="9.5" fill="#333">610</text><text x="478" y="120" font-size="9.5" fill="#b85450" font-weight="bold">2</text><text x="520" y="120" font-size="9.5" fill="#d6a040">3</text>
  <rect x="356" y="126" width="184" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="368" y="140" font-size="9.5" fill="#333">3</text><text x="398" y="140" font-size="9.5" fill="#4a7a3a">1</text><text x="434" y="140" font-size="9.5" fill="#333">530</text><text x="478" y="140" font-size="9.5" fill="#b85450" font-weight="bold">3</text><text x="520" y="140" font-size="9.5" fill="#d6a040">3</text>
  <!-- dept2 rows -->
  <rect x="356" y="146" width="184" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="368" y="160" font-size="9.5" fill="#333">2</text><text x="398" y="160" font-size="9.5" fill="#b85450">2</text><text x="434" y="160" font-size="9.5" fill="#333">650</text><text x="478" y="160" font-size="9.5" fill="#b85450" font-weight="bold">1</text><text x="520" y="160" font-size="9.5" fill="#d6a040">2</text>
  <rect x="356" y="166" width="184" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="368" y="180" font-size="9.5" fill="#333">8</text><text x="398" y="180" font-size="9.5" fill="#b85450">2</text><text x="434" y="180" font-size="9.5" fill="#333">650</text><text x="478" y="180" font-size="9.5" fill="#b85450" font-weight="bold">1</text><text x="520" y="180" font-size="9.5" fill="#d6a040">2</text>

  <!-- arrows from arrow box up to right table -->
  <path d="M 236 200 L 236 150 L 354 150" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Divider -->
  <path d="M 30 268 L 530 268" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula box -->
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">排名百分比公式</text>
  <rect x="60" y="300" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">percentage = (rk − 1) × 100 / (cnt − 1)，ROUND 到 2 位</text>

  <!-- Notes -->
  <text x="30" y="360" font-size="10.5" fill="#555">• rk 由 mark 降序定，最高分 rk=1；同分同 rk（RANK 语义，跳号）</text>
  <text x="30" y="378" font-size="10.5" fill="#555">• cnt = 该部门人数；cnt=1 时分母为 0，用 IFNULL 归 0</text>
  <text x="30" y="396" font-size="10.5" fill="#888">注：窗口函数「聚合不塌缩」，每行都带上其分区的统计量，免去自连接</text>
</svg>
