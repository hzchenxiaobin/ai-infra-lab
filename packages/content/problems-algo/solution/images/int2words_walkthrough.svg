<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：num = 1,234,567（从低到高取块）</text>

  <!-- Table headers -->
  <text x="30" y="54" font-size="10" fill="#444" font-weight="bold">i</text>
  <text x="62" y="54" font-size="10" fill="#444" font-weight="bold">num</text>
  <text x="140" y="54" font-size="10" fill="#444" font-weight="bold">chunk = num%1000</text>
  <text x="270" y="54" font-size="10" fill="#444" font-weight="bold">helper(chunk)</text>
  <text x="410" y="54" font-size="10" fill="#444" font-weight="bold">量级</text>
  <text x="470" y="54" font-size="10" fill="#444" font-weight="bold">res（拼接后）</text>
  <line x1="20" y1="60" x2="600" y2="60" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row i=0 -->
  <text x="30" y="80" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="62" y="80" font-size="10" fill="#333">1234567</text>
  <text x="140" y="80" font-size="10" fill="#333" font-weight="bold">567</text>
  <text x="270" y="80" font-size="9" fill="#4a7a3a" font-weight="bold">Five Hundred Sixty Seven</text>
  <text x="410" y="80" font-size="10" fill="#888">""</text>
  <text x="470" y="80" font-size="9" fill="#e6f4ea" font-weight="bold">Five Hundred Sixty Seven</text>
  <rect x="466" y="68" width="120" height="16" fill="none" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>

  <!-- Row i=1 -->
  <text x="30" y="106" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="62" y="106" font-size="10" fill="#333">1234</text>
  <text x="140" y="106" font-size="10" fill="#333" font-weight="bold">234</text>
  <text x="270" y="106" font-size="9" fill="#446688" font-weight="bold">Two Hundred Thirty Four</text>
  <text x="410" y="106" font-size="10" fill="#446688" font-weight="bold">Thousand</text>
  <text x="470" y="106" font-size="8" fill="#446688" font-weight="bold">Two Hundred Thirty Four Thousand</text>
  <text x="470" y="116" font-size="8" fill="#999">Five Hundred Sixty Seven</text>
  <rect x="466" y="94" width="120" height="28" fill="none" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>

  <!-- Row i=2 -->
  <text x="30" y="140" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="62" y="140" font-size="10" fill="#333">1</text>
  <text x="140" y="140" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="270" y="140" font-size="9" fill="#d6a040" font-weight="bold">One</text>
  <text x="410" y="140" font-size="10" fill="#d6a040" font-weight="bold">Million</text>
  <text x="470" y="136" font-size="8" fill="#d6a040" font-weight="bold">One Million Two Hundred Thirty</text>
  <text x="470" y="146" font-size="8" fill="#999">Four Thousand Five Hundred Sixty Seven</text>
  <rect x="466" y="124" width="120" height="28" fill="none" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>

  <!-- Row i=3: loop ends -->
  <text x="30" y="170" font-size="10" fill="#888">3</text>
  <text x="62" y="170" font-size="10" fill="#888">0</text>
  <text x="140" y="170" font-size="10" fill="#b85450" font-weight="bold">num == 0 → 退出</text>
  <text x="470" y="170" font-size="8" fill="#b85450" font-weight="bold">返回 res ✓</text>

  <line x1="20" y1="182" x2="600" y2="182" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="40" y="192" width="540" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="210" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">结果："One Million Two Hundred Thirty Four Thousand</text>
  <text x="310" y="224" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Five Hundred Sixty Seven"</text>

  <!-- secondary example: 1000000 skip-zero -->
  <text x="310" y="252" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">对照：num = 1,000,000（千位为 0 → 跳过）</text>

  <!-- mini table -->
  <text x="30" y="276" font-size="9" fill="#444" font-weight="bold">i</text>
  <text x="62" y="276" font-size="9" fill="#444" font-weight="bold">num</text>
  <text x="140" y="276" font-size="9" fill="#444" font-weight="bold">chunk</text>
  <text x="230" y="276" font-size="9" fill="#444" font-weight="bold">helper</text>
  <text x="350" y="276" font-size="9" fill="#444" font-weight="bold">量级</text>
  <text x="420" y="276" font-size="9" fill="#444" font-weight="bold">操作</text>
  <line x1="20" y1="282" x2="600" y2="282" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=0: chunk=0 skip -->
  <text x="30" y="300" font-size="9" fill="#333" font-weight="bold">0</text>
  <text x="62" y="300" font-size="9" fill="#333">1000000</text>
  <text x="140" y="300" font-size="9" fill="#b85450" font-weight="bold">000</text>
  <text x="230" y="300" font-size="9" fill="#888">—</text>
  <text x="350" y="300" font-size="9" fill="#888">（Thousand）</text>
  <text x="420" y="300" font-size="9" fill="#b85450" font-weight="bold">chunk==0，跳过</text>

  <!-- i=1: chunk=0 skip -->
  <text x="30" y="320" font-size="9" fill="#333" font-weight="bold">1</text>
  <text x="62" y="320" font-size="9" fill="#333">1000</text>
  <text x="140" y="320" font-size="9" fill="#b85450" font-weight="bold">000</text>
  <text x="230" y="320" font-size="9" fill="#888">—</text>
  <text x="350" y="320" font-size="9" fill="#888">（Thousand）</text>
  <text x="420" y="320" font-size="9" fill="#b85450" font-weight="bold">chunk==0，跳过</text>

  <!-- i=2: chunk=1 Million -->
  <text x="30" y="340" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="62" y="340" font-size="9" fill="#333">1</text>
  <text x="140" y="340" font-size="9" fill="#d6a040" font-weight="bold">001</text>
  <text x="230" y="340" font-size="9" fill="#d6a040" font-weight="bold">One</text>
  <text x="350" y="340" font-size="9" fill="#d6a040" font-weight="bold">Million</text>
  <text x="420" y="340" font-size="9" fill="#4a7a3a" font-weight="bold">res = "One Million"</text>

  <line x1="20" y1="352" x2="600" y2="352" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- mini result -->
  <rect x="40" y="362" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="384" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结果："One Million"（无 "Zero Thousand" 残留）</text>

  <!-- bottom note -->
  <rect x="40" y="406" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="424" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">要点：从低位取块、高块前插；chunk==0 直接跳过不加量级</text>
  <text x="310" y="440" text-anchor="middle" font-size="9" fill="#666">避免 "One Million Zero Thousand" 这类多余输出</text>
</svg>
