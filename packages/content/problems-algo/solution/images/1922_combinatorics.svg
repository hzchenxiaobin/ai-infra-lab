<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">配对化简：相邻(偶位,奇位)合成一对 → 每对 5×4 = 20</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">把逐位相乘重组为「成对相乘」，得到 20 的幂</text>

  <!-- top row: per-position factors for n=4 -->
  <text x="60" y="86" font-size="11" fill="#888">n=4 逐位：</text>
  <g font-size="13">
    <rect x="120" y="70" width="50" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="145" y="92" text-anchor="middle" fill="#446688" font-weight="bold">5</text>

    <rect x="178" y="70" width="50" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="203" y="92" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>

    <rect x="236" y="70" width="50" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="261" y="92" text-anchor="middle" fill="#446688" font-weight="bold">5</text>

    <rect x="294" y="70" width="50" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="319" y="92" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>

    <text x="356" y="92" font-size="13" fill="#444">= 400</text>
  </g>

  <!-- pairing brackets -->
  <text x="60" y="138" font-size="11" fill="#888">配对：</text>
  <path d="M 145 112 L 145 122 L 203 122 L 203 112" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 261 112 L 261 122 L 319 122 L 319 112" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- pair products -->
  <g font-size="13">
    <rect x="120" y="138" width="108" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="174" y="160" text-anchor="middle" fill="#b85450" font-weight="bold">5×4 = 20</text>

    <rect x="236" y="138" width="108" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="290" y="160" text-anchor="middle" fill="#b85450" font-weight="bold">5×4 = 20</text>

    <text x="356" y="160" font-size="13" fill="#444">= 20² = 400</text>
  </g>

  <!-- arrow down to generalization -->
  <path d="M 300 184 L 300 206" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- generalization box -->
  <rect x="40" y="214" width="520" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="240" font-size="13" fill="#444" font-weight="bold">一般化（n 为长度）</text>
  <text x="60" y="262" font-size="12" fill="#4a7a3a">n 为偶数：n/2 对 → 20^(n/2)</text>
  <text x="60" y="282" font-size="12" fill="#4a7a3a">n 为奇数：(n−1)/2 对 + 末尾多 1 个偶位 → 5 × 20^((n−1)/2)</text>
  <text x="60" y="300" font-size="10" fill="#888">注：下标从 0 起，偶位比奇位多 1 个（当 n 奇时最末位 i=n−1 是偶位）</text>

  <!-- unified formula -->
  <rect x="40" y="320" width="520" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="346" font-size="13" fill="#444" font-weight="bold">统一公式（无需分奇偶讨论）</text>
  <text x="60" y="370" font-size="14" fill="#b85450" font-weight="bold">#偶位 = ⌈n/2⌉ = (n+1)/2，#奇位 = ⌊n/2⌋ = n/2</text>
  <text x="60" y="392" font-size="14" fill="#b85450" font-weight="bold">答案 = 5^((n+1)/2) × 4^(n/2)   mod  10⁹+7</text>
</svg>
