<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">count(x) 单调不减 ⇒ 答案 = 第 k 小的逆序对差</text>

  <!-- 数组 -->
  <text x="56" y="66" text-anchor="end" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">nums</text>

  <rect x="66" y="42" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="56" text-anchor="middle" font-size="9" fill="#8a6d3a" filter="url(#rough2)">#0</text>
  <text x="88" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">10</text>

  <rect x="116" y="42" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="56" text-anchor="middle" font-size="9" fill="#8a6d3a" filter="url(#rough2)">#1</text>
  <text x="138" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">9</text>

  <rect x="166" y="42" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="56" text-anchor="middle" font-size="9" fill="#8a6d3a" filter="url(#rough2)">#2</text>
  <text x="188" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">9</text>

  <rect x="216" y="42" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="56" text-anchor="middle" font-size="9" fill="#8a6d3a" filter="url(#rough2)">#3</text>
  <text x="238" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">9</text>

  <rect x="266" y="42" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="288" y="56" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">#4</text>
  <text x="288" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="330" y="58" font-size="10.5" fill="#666" filter="url(#rough2)">逆序对：i&lt;j 且 nums[i]&gt;nums[j]</text>
  <text x="330" y="76" font-size="10.5" fill="#666" filter="url(#rough2)">差 d = nums[i] − nums[j] ≥ 1</text>

  <!-- 差的来源 -->
  <text x="322" y="112" font-size="9.5" fill="#888" filter="url(#rough2)">(0,1) (0,2) (0,3)：差 1</text>
  <text x="322" y="128" font-size="9.5" fill="#888" filter="url(#rough2)">(1,4) (2,4) (3,4)：差 8</text>
  <text x="322" y="144" font-size="9.5" fill="#888" filter="url(#rough2)">(0,4)：差 9</text>

  <!-- 排序后的差 -->
  <text x="66" y="110" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">全部逆序对的差，从小到大排：</text>

  <rect x="66" y="118" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="100" y="118" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="134" y="118" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="168" y="118" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="183" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">8</text>

  <rect x="202" y="118" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="236" y="118" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="251" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="270" y="118" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">9</text>

  <text x="183" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">↑ 第 k=4 小 = 8</text>

  <!-- 阶梯图 -->
  <text x="66" y="180" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">count(x) = 差 ≤ x 的逆序对个数 —— 单调不减 ⇒ 可二分</text>

  <path d="M 65 316 L 65 192" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 65 316 L 485 316" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="52" y="320" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="52" y="252" text-anchor="end" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="52" y="201" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">7</text>
  <text x="46" y="188" font-size="10" fill="#666" filter="url(#rough2)">count</text>
  <text x="490" y="322" font-size="10" fill="#666" filter="url(#rough2)">x</text>

  <!-- x 轴刻度 -->
  <text x="70" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="113" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="157" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="200" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="244" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="287" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="331" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>
  <text x="374" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7</text>
  <text x="418" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="461" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">9</text>

  <!-- 阶梯曲线 -->
  <path d="M 70 316 L 113.5 316 L 113.5 265 L 418 265 L 418 214 L 461.5 214 L 461.5 197 L 478 197"
        fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="240" y="259" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">count=3</text>
  <text x="444" y="208" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">count=6</text>

  <!-- k 线 -->
  <path d="M 65 248 L 428 248" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="98" y="243" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">k = 4</text>

  <!-- 答案标记 -->
  <circle cx="418" cy="214" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 424 208 C 436 200, 446 200, 452 206" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="418" y="346" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">answer = 8</text>

  <text x="150" y="346" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">阶梯首次越过 k 线的 x 即答案</text>
</svg>
