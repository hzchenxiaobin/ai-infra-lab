<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：二分答案 + 反向贪心 check(x)</text>

  <!-- 左列：二分外壳 -->
  <polygon points="102,56 168,80 102,104 36,80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="102" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">check(m) 可行？</text>

  <path d="M168,80 L196,80" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="72" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="200" y="64" width="76" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="84" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">返回 −1</text>

  <path d="M102,104 C102,110 102,114 102,118" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="114" y="116" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="36" y="120" width="132" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">二分 x：lo = 1，hi = m</text>

  <path d="M102,150 C102,154 102,158 102,162" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="164" width="132" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">调用 check(x) ⟶</text>

  <path d="M102,194 C102,198 102,202 102,206" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="102,208 168,232 102,256 36,232" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="102" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">total ≤ x？</text>

  <path d="M66,256 C60,266 58,270 56,276" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="272" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是→hi=mid</text>

  <path d="M138,256 C144,266 146,270 148,276" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="272" font-size="11" fill="#b85450" filter="url(#rough2)">否→lo=mid+1</text>

  <rect x="36" y="280" width="132" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">收敛后 lo 即答案</text>

  <!-- 右侧：check(x) 内部 -->
  <rect x="186" y="120" width="300" height="212" rx="10" fill="#e8f0fe" fill-opacity="0.45" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="336" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">check(x) 内部（反向贪心）</text>

  <rect x="200" y="130" width="272" height="26" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="147" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 求 first[v]：各下标在前 x 秒的最早出现秒</text>

  <path d="M336,156 C336,160 336,162 336,166" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="168" width="272" height="26" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="185" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② total = Σnums + n；cnt = 0；堆空</text>

  <path d="M336,194 C336,198 336,200 336,204" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="206" width="272" height="100" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="225" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ s 从 x 递减到 1，逐秒处理：</text>
  <text x="212" y="244" font-size="11.5" fill="#333" filter="url(#rough2)">· 非首次秒（或 nums[v] = 0）→ cnt + 1</text>
  <text x="212" y="262" font-size="11.5" fill="#333" filter="url(#rough2)">· 首次且 nums[v] &gt; 0 → 入堆，total −= nums[v] − 1</text>
  <text x="212" y="280" font-size="11.5" fill="#333" filter="url(#rough2)">· 堆大小 &gt; cnt → 弹最小 w：</text>
  <text x="226" y="298" font-size="11.5" fill="#333" filter="url(#rough2)">total += w − 1，cnt + 1</text>

  <path d="M336,306 C336,310 336,312 336,316" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="304" width="272" height="26" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="321" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 扫完返回 total ≤ x</text>
</svg>
