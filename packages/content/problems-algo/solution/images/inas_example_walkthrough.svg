<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "1 box has 3 blue 4 red 6 green 12 marbles"</text>

  <!-- Header row -->
  <text x="22" y="58" font-size="10.5" fill="#888" font-weight="bold">step</text>
  <text x="74" y="58" font-size="10.5" fill="#888" font-weight="bold">token</text>
  <text x="166" y="58" font-size="10.5" fill="#888" font-weight="bold">类型</text>
  <text x="258" y="58" font-size="10.5" fill="#888" font-weight="bold">cur</text>
  <text x="334" y="58" font-size="10.5" fill="#888" font-weight="bold">prev</text>
  <text x="424" y="58" font-size="10.5" fill="#888" font-weight="bold">cur&gt;prev?</text>
  <text x="524" y="58" font-size="10.5" fill="#888" font-weight="bold">动作</text>

  <!-- separator -->
  <path d="M 16 66 L 568 66" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: 1 -->
  <text x="34" y="92" font-size="10.5" fill="#666">1</text>
  <rect x="60" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="186" y="98" font-size="10.5" fill="#446688">数字</text>
  <text x="276" y="98" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="344" y="98" font-size="11" fill="#888">−∞</text>
  <text x="448" y="98" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="520" y="98" font-size="10" fill="#666">prev=1</text>

  <!-- Row 2: box -->
  <text x="34" y="124" font-size="10.5" fill="#666">2</text>
  <rect x="60" y="110" width="44" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="130" text-anchor="middle" font-size="10" fill="#888">box</text>
  <text x="186" y="130" font-size="10.5" fill="#888">单词</text>
  <text x="276" y="130" font-size="10.5" fill="#ccc">—</text>
  <text x="344" y="130" font-size="11" fill="#888">1</text>
  <text x="448" y="130" font-size="10.5" fill="#ccc">—</text>
  <text x="520" y="130" font-size="10" fill="#888">跳过</text>

  <!-- Row 3: has -->
  <text x="34" y="156" font-size="10.5" fill="#666">3</text>
  <rect x="60" y="142" width="44" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="162" text-anchor="middle" font-size="10" fill="#888">has</text>
  <text x="186" y="162" font-size="10.5" fill="#888">单词</text>
  <text x="276" y="162" font-size="10.5" fill="#ccc">—</text>
  <text x="344" y="162" font-size="11" fill="#888">1</text>
  <text x="448" y="162" font-size="10.5" fill="#ccc">—</text>
  <text x="520" y="162" font-size="10" fill="#888">跳过</text>

  <!-- Row 4: 3 -->
  <text x="34" y="188" font-size="10.5" fill="#666">4</text>
  <rect x="60" y="174" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="186" y="194" font-size="10.5" fill="#446688">数字</text>
  <text x="276" y="194" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="344" y="194" font-size="11" fill="#888">1</text>
  <text x="448" y="194" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 3&gt;1</text>
  <text x="520" y="194" font-size="10" fill="#666">prev=3</text>

  <!-- Row 5: blue -->
  <text x="34" y="220" font-size="10.5" fill="#666">5</text>
  <rect x="60" y="206" width="44" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="226" text-anchor="middle" font-size="10" fill="#888">blue</text>
  <text x="186" y="226" font-size="10.5" fill="#888">单词</text>
  <text x="276" y="226" font-size="10.5" fill="#ccc">—</text>
  <text x="344" y="226" font-size="11" fill="#888">3</text>
  <text x="448" y="226" font-size="10.5" fill="#ccc">—</text>
  <text x="520" y="226" font-size="10" fill="#888">跳过</text>

  <!-- Row 6: 4 -->
  <text x="34" y="252" font-size="10.5" fill="#666">6</text>
  <rect x="60" y="238" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="258" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="186" y="258" font-size="10.5" fill="#446688">数字</text>
  <text x="276" y="258" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="344" y="258" font-size="11" fill="#888">3</text>
  <text x="448" y="258" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 4&gt;3</text>
  <text x="520" y="258" font-size="10" fill="#666">prev=4</text>

  <!-- Row 7: red -->
  <text x="34" y="284" font-size="10.5" fill="#666">7</text>
  <rect x="60" y="270" width="44" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="290" text-anchor="middle" font-size="10" fill="#888">red</text>
  <text x="186" y="290" font-size="10.5" fill="#888">单词</text>
  <text x="276" y="290" font-size="10.5" fill="#ccc">—</text>
  <text x="344" y="290" font-size="11" fill="#888">4</text>
  <text x="448" y="290" font-size="10.5" fill="#ccc">—</text>
  <text x="520" y="290" font-size="10" fill="#888">跳过</text>

  <!-- Row 8: 6 -->
  <text x="34" y="316" font-size="10.5" fill="#666">8</text>
  <rect x="60" y="302" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
  <text x="186" y="322" font-size="10.5" fill="#446688">数字</text>
  <text x="276" y="322" font-size="11" fill="#d6a040" font-weight="bold">6</text>
  <text x="344" y="322" font-size="11" fill="#888">4</text>
  <text x="448" y="322" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 6&gt;4</text>
  <text x="520" y="322" font-size="10" fill="#666">prev=6</text>

  <!-- Row 9: green -->
  <text x="34" y="348" font-size="10.5" fill="#666">9</text>
  <rect x="60" y="334" width="44" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="354" text-anchor="middle" font-size="9.5" fill="#888">green</text>
  <text x="186" y="354" font-size="10.5" fill="#888">单词</text>
  <text x="276" y="354" font-size="10.5" fill="#ccc">—</text>
  <text x="344" y="354" font-size="11" fill="#888">6</text>
  <text x="448" y="354" font-size="10.5" fill="#ccc">—</text>
  <text x="520" y="354" font-size="10" fill="#888">跳过</text>

  <!-- Row 10: 12 -->
  <text x="34" y="380" font-size="10.5" fill="#666">10</text>
  <rect x="60" y="366" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="386" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">12</text>
  <text x="186" y="386" font-size="10.5" fill="#446688">数字</text>
  <text x="276" y="386" font-size="11" fill="#d6a040" font-weight="bold">12</text>
  <text x="344" y="386" font-size="11" fill="#888">6</text>
  <text x="448" y="386" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 12&gt;6</text>
  <text x="520" y="386" font-size="10" fill="#666">prev=12</text>

  <!-- Result -->
  <rect x="160" y="396" width="280" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="411" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">数字序列 [1,3,4,6,12] 严格递增 → true</text>
</svg>
