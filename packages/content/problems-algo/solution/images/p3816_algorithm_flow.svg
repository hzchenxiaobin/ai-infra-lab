<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：预处理位置表 + 逐位贪心构造</text>
  <text x="280" y="41" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">cur = 已构造前缀的右边界；ptr[c] 惰性推进（位置指针只前进，均摊 O(n)）</text>

  <!-- 预处理 -->
  <g filter="url(#rough2)">
    <rect x="150" y="54" width="260" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="73" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">① 预处理：pos[c] 各字母位置表</text>
    <text x="280" y="90" text-anchor="middle" font-size="11" fill="#33506b">last[c] 最后出现位置；need = 出现过的字母集</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 280 100 L 280 116" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)"/>
  </g>

  <!-- 循环头 -->
  <g filter="url(#rough2)">
    <rect x="180" y="118" width="200" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="280" y="140" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">② while need 非空：</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 280 152 L 280 168" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)"/>
  </g>

  <!-- for c 循环 -->
  <g filter="url(#rough2)">
    <rect x="150" y="170" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="188" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">for c = 'a' … 'z'（字典序从小到大）</text>
    <text x="280" y="202" text-anchor="middle" font-size="10" fill="#33506b">a 已满足也能再选（重复保留正是本题考点）</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 280 208 L 280 224" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)"/>
  </g>

  <!-- 找 p -->
  <g filter="url(#rough2)">
    <rect x="120" y="226" width="320" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="244" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">③ 惰性推进 ptr[c]，取 c 最早 ≥ cur 的出现 p</text>
    <text x="280" y="258" text-anchor="middle" font-size="10" fill="#8a6d1a">pos[c] 用尽 → c 不可选，continue 试下一字母</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 280 264 L 280 280" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)"/>
  </g>

  <!-- safe 菱形 -->
  <g filter="url(#rough2)">
    <polygon points="280,282 380,318 280,354 180,318" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="313" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">④ safe？need 中除 c 外</text>
    <text x="280" y="329" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">每个 x 都有 last[x] &gt; p</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 380 318 L 448 318" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr2)"/>
    <text x="414" y="310" text-anchor="middle" font-size="10.5" fill="#b85450">否</text>
    <text x="456" y="322" text-anchor="middle" font-size="10" fill="#8a3030">continue</text>
    <text x="456" y="336" text-anchor="middle" font-size="10" fill="#8a3030">下一字母</text>
    <path d="M 448 332 C 500 355 500 150 366 150 C 356 150 350 158 350 166" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr2)"/>
    <path d="M 280 354 L 280 374" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr2)"/>
    <text x="292" y="368" font-size="10.5" fill="#2f5d24">是</text>
  </g>

  <!-- 选中动作 -->
  <g filter="url(#rough2)">
    <rect x="88" y="376" width="240" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="208" y="396" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">⑤ t += c；cur = p+1；need 去掉 c</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 328 391 L 400 391 C 430 391 430 136 396 136 C 388 136 382 136 382 136" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr2)"/>
    <text x="404" y="382" font-size="10" fill="#2f5d24">need 空？</text>
    <text x="452" y="396" font-size="10" fill="#2f5d24">空 → 输出 t（立即停）</text>
  </g>

  <!-- 右侧要点 -->
  <g filter="url(#rough2)">
    <rect x="408" y="54" width="136" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="476" y="74" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">不变式</text>
    <text x="476" y="92" text-anchor="middle" font-size="10" fill="#8a6d1a">need 中每个字母</text>
    <text x="476" y="107" text-anchor="middle" font-size="10" fill="#8a6d1a">在 ≥ cur 都还有出现</text>
    <text x="476" y="125" text-anchor="middle" font-size="10" fill="#8a6d1a">⟹ for 必能选中一个</text>
    <text x="476" y="143" text-anchor="middle" font-size="10" fill="#8a6d1a">（last 最小的字母必 safe）</text>
  </g>
</svg>
