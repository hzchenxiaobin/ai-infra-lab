<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：最长「1 — 0…0 — −1」段中 0 的个数即答案</text>

  <text x="30" y="52" font-size="11" fill="#888">forts = [1, 0, 0, −1, 0, 0, 0, 0, 1]（示例 1）</text>
  <text x="438" y="50" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">移动 pos8 → pos3</text>
  <path d="M 438 56 Q 316 38 198 56" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 数组格子 -->
  <rect x="30" y="64" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="54" y="89" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="78" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="102" y="89" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="126" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="89" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="174" y="64" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="89" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−1</text>
  <rect x="222" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="246" y="89" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="270" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="294" y="89" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="318" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="342" y="89" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="366" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="390" y="89" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="414" y="64" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="438" y="89" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- 下标 -->
  <text x="54" y="60" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="102" y="60" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="150" y="60" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="198" y="60" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="246" y="60" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="294" y="60" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="342" y="60" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="390" y="60" text-anchor="middle" font-size="9" fill="#aaa">7</text>
  <text x="438" y="60" text-anchor="middle" font-size="9" fill="#aaa">8</text>

  <!-- 花括号 A：pos0(1) 与 pos3(−1) 之间的 0 -->
  <path d="M 102 106 L 102 116 L 150 116 L 150 106" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 126 116 L 126 124" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="126" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2 个 0</text>

  <!-- 花括号 B：pos3(−1) 与 pos8(1) 之间的 0（最大） -->
  <path d="M 246 106 L 246 116 L 390 116 L 390 106" stroke="#b85450" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 318 116 L 318 124" stroke="#b85450" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <text x="318" y="138" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4 个 0 ← 最大</text>

  <text x="30" y="158" font-size="10.5" fill="#888">绿=己方城堡(1)　蓝=敌人城堡(0)　红=空位(−1)</text>

  <!-- 规则框 -->
  <rect x="30" y="170" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="192" font-size="12" fill="#d6a040" font-weight="bold">移动规则</text>
  <text x="48" y="212" font-size="11.5" fill="#333">军队从某个 1 出发、移动到某个 −1，途中所有位置必须全是 0；</text>
  <text x="48" y="230" font-size="11.5" fill="#333">摧毁数 = 两端之间 0 的个数，两端必须「一为 1、一为 −1」。</text>
  <text x="48" y="250" font-size="11" fill="#b85450" font-weight="bold">→ 等价于：找最长的「被 1 与 −1 夹住的连续 0 段」</text>

  <!-- 非法示例 -->
  <text x="30" y="288" font-size="11" fill="#555" font-weight="bold">非法（不产生移动）：</text>
  <rect x="196" y="276" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="224" y="276" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="238" y="294" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="252" y="276" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="266" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="290" y="294" font-size="10.5" fill="#888">两端同为己方 ✘</text>

  <rect x="196" y="312" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="224" y="312" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="238" y="330" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="252" y="312" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="266" y="330" text-anchor="middle" font-size="11" fill="#333">0</text>
  <path d="M 284 325 L 300 325" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="330" font-size="10.5" fill="#888">右端越界 / 非 −1 ✘</text>

  <text x="270" y="362" text-anchor="middle" font-size="10.5" fill="#888">只统计「两端异号（1 与 −1）」的连续 0 段长度，取最大</text>
</svg>
