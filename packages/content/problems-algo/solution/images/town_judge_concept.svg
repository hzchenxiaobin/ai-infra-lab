<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">法官：入度 = n−1，出度 = 0，净得分 = n−1</text>

  <!-- ===== Left: trust graph (n=4, judge=3) ===== -->
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">信任图（n=4，法官=3）</text>

  <!-- edges: 1->3, 2->3, 4->3 -->
  <line x1="100" y1="108" x2="138" y2="190" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="200" y1="108" x2="162" y2="190" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="96" y1="258" x2="138" y2="220" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- node 1 -->
  <circle cx="100" cy="92" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- node 2 -->
  <circle cx="200" cy="92" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- node 4 -->
  <circle cx="90" cy="276" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="281" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- node 3 (judge, highlighted) -->
  <circle cx="150" cy="206" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="150" y="212" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="150" y="248" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">法官</text>

  <!-- trust edge label -->
  <text x="60" y="160" font-size="10" fill="#b85450">信任 →</text>

  <!-- ===== Right: score table ===== -->
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">度数统计表</text>

  <!-- header -->
  <rect x="320" y="72" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="350" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">人</text>
  <text x="410" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">入度</text>
  <text x="470" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">出度</text>
  <text x="525" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">score</text>

  <!-- row 1 -->
  <rect x="320" y="100" width="220" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="118" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="410" y="118" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="470" y="118" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="525" y="118" text-anchor="middle" font-size="11" fill="#888">−1</text>

  <!-- row 2 -->
  <rect x="320" y="126" width="220" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="410" y="144" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="470" y="144" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="525" y="144" text-anchor="middle" font-size="11" fill="#888">−1</text>

  <!-- row 3 (judge, highlighted) -->
  <rect x="320" y="152" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="410" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="470" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="525" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- row 4 -->
  <rect x="320" y="182" width="220" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="200" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="410" y="200" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="470" y="200" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="525" y="200" text-anchor="middle" font-size="11" fill="#888">−1</text>

  <!-- formula box -->
  <rect x="320" y="230" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="252" text-anchor="middle" font-size="11.5" fill="#333">score = 入度 − 出度</text>
  <text x="430" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">法官: (n−1) − 0 = n−1</text>

  <!-- bottom note -->
  <rect x="30" y="310" width="510" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11.5" fill="#333">每条边 [a,b]: score[a]−−（出度+1），score[b]++（入度+1）</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">只需找 score[i] == n−1 的人，即为法官</text>
</svg>
