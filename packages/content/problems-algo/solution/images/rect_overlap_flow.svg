<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="480" height="380" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">判定流程图</text>

  <!-- Start -->
  <rect x="170" y="50" width="140" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 rec1, rec2</text>

  <!-- Arrow down to diamond 1 -->
  <line x1="240" y1="84" x2="240" y2="106" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: x check -->
  <polygon points="240,110 360,160 240,210 120,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x 投影相交?</text>
  <text x="240" y="170" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">rec1[0]&lt;rec2[2] ∧ rec2[0]&lt;rec1[2]</text>

  <!-- No branch: right -->
  <line x1="360" y1="160" x2="378" y2="160" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="153" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="378" y="146" width="86" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="421" y="165" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">返回 false</text>

  <!-- Yes branch: down -->
  <line x1="240" y1="210" x2="240" y2="232" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="226" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Diamond 2: y check -->
  <polygon points="240,236 360,286 240,336 120,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y 投影相交?</text>
  <text x="240" y="296" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">rec1[1]&lt;rec2[3] ∧ rec2[1]&lt;rec1[3]</text>

  <!-- No branch: right -->
  <line x1="360" y1="286" x2="378" y2="286" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="279" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="378" y="272" width="86" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="421" y="291" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">返回 false</text>

  <!-- Yes branch: down -->
  <line x1="240" y1="336" x2="240" y2="350" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="346" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="180" y="350" width="120" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">返回 true</text>
</svg>
