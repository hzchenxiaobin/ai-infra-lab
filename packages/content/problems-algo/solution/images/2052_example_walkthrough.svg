<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：sentence = "i love leetcode", k = 12</text>

  <!-- Arrangement A -->
  <text x="40" y="62" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">方案 A：每词一行</text>
  <rect x="80" y="70" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="88" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">i</text>
  <text x="155" y="88" font-size="9" fill="#888" filter="url(#rough2)">n=1 → (12−1)²=121</text>
  <rect x="80" y="100" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="118" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">love</text>
  <text x="155" y="118" font-size="9" fill="#888" filter="url(#rough2)">n=4 → (12−4)²=64</text>
  <rect x="80" y="130" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="148" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">leetcode</text>
  <text x="155" y="148" font-size="9" fill="#4a7a3a" filter="url(#rough2)">末行 → 0</text>
  <rect x="80" y="164" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">合计 = 121 + 64 = 185</text>

  <!-- Arrangement B -->
  <text x="300" y="62" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">方案 B：合并前两词 ✓</text>
  <rect x="320" y="70" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="88" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">i love</text>
  <text x="415" y="88" font-size="9" fill="#888" filter="url(#rough2)">n=6 → (12−6)²=36</text>
  <rect x="320" y="100" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="118" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">leetcode</text>
  <text x="415" y="118" font-size="9" fill="#4a7a3a" filter="url(#rough2)">末行 → 0</text>
  <rect x="320" y="134" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 = 36 ✓ 最优</text>

  <!-- Arrangement C: impossible -->
  <text x="40" y="220" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">方案 C：合并后两词 ✗</text>
  <rect x="80" y="228" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="246" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">i</text>
  <text x="155" y="246" font-size="9" fill="#888" filter="url(#rough2)">n=1</text>
  <rect x="80" y="258" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">love leetcode</text>
  <text x="225" y="276" font-size="9" fill="#b85450" filter="url(#rough2)">n=13 &gt; 12 ✗</text>
  <text x="80" y="302" font-size="10" fill="#b85450" filter="url(#rough2)">超出行宽 k，方案不合法</text>

  <!-- DP trace -->
  <rect x="30" y="324" width="460" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">DP 求解过程</text>
  <text x="50" y="368" font-size="10" fill="#444" filter="url(#rough2)">dfs(0): 余下 "i love leetcode" 全长 = 1+1+4+1+8 = 15 &gt; 12，须分行</text>
  <text x="50" y="386" font-size="10" fill="#444" filter="url(#rough2)">  j=1: 行={i}, m=1   → (12−1)² + dfs(1) = 121 + 64 = 185</text>
  <text x="50" y="404" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">  j=2: 行={i,love}, m=6 → (12−6)² + dfs(2) = 36 + 0 = 36  ← min</text>
  <text x="50" y="424" font-size="10" fill="#888" filter="url(#rough2)">dfs(2): 余下 "leetcode" 全长 8 ≤ 12 → 末行，返回 0</text>
  <text x="260" y="440" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = min(185, 36) = 36</text>
</svg>
