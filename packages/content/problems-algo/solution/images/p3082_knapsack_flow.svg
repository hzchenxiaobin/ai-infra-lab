<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：长度 + 和的二维计数背包</text>

  <!-- 初始化 -->
  <rect x="90" y="46" width="230" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="69" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">初始化：dp[0][0] = 1，其余全 0</text>

  <path d="M205,82 C205,92 205,94 205,102" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="90" y="104" width="230" height="36" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="127" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取出下一个元素 num</text>

  <path d="M205,140 C205,150 205,152 205,160" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 双重倒序 -->
  <rect x="90" y="162" width="230" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="179" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">双重倒序枚举状态</text>
  <text x="205" y="194" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j 从 n 降到 1，s 从 k 降到 num</text>

  <path d="M205,198 C205,206 205,208 205,216" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转移 -->
  <rect x="90" y="218" width="230" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="205" y="243" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[j][s] += dp[j−1][s−num]</text>

  <!-- 判断：还有元素吗 -->
  <path d="M205,258 C205,266 205,268 205,274" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="205,276 265,302 205,328 145,302" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="299" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">还有元素？</text>
  <text x="205" y="314" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">（i &lt; n）</text>

  <!-- 是：回到取元素 -->
  <path d="M145,302 C110,302 96,302 88,302 C70,302 66,160 84,122 C88,114 88,114 90,122" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="72" y="212" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 否：聚合答案 -->
  <path d="M205,328 C205,338 205,340 205,344" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="352" y="318" width="150" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="334" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = Σ dp[j][k]·2^(n−j)</text>
  <text x="427" y="349" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2 的幂预处理 O(n)</text>

  <!-- 右侧注解框 -->
  <rect x="352" y="46" width="150" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="68" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">为什么倒序？</text>
  <text x="362" y="88" font-size="10.5" fill="#333" filter="url(#rough2)">j 倒序：dp[j−1][·]</text>
  <text x="362" y="103" font-size="10.5" fill="#333" filter="url(#rough2)">还是不含 num 的旧值</text>
  <text x="362" y="121" font-size="10.5" fill="#333" filter="url(#rough2)">s 倒序：dp[·][s−num]</text>
  <text x="362" y="136" font-size="10.5" fill="#333" filter="url(#rough2)">未被本轮污染</text>

  <rect x="352" y="152" width="150" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="172" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">状态含义</text>
  <text x="362" y="190" font-size="10.5" fill="#333" filter="url(#rough2)">dp[j][s]：已处理元素中</text>
  <text x="362" y="205" font-size="10.5" fill="#333" filter="url(#rough2)">长度 j、和恰为 s 的</text>
  <text x="362" y="220" font-size="10.5" fill="#333" filter="url(#rough2)">子序列个数</text>

  <text x="427" y="252" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">时间 O(n²k)</text>
  <text x="427" y="270" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">空间 O(nk)</text>
</svg>
