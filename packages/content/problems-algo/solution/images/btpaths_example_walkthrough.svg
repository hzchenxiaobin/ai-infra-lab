<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [1,2,3,null,5]</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">DFS 顺序：①1 ②2 ③5(叶) ④3(叶)，回溯箭头为撤销</text>

  <!-- ===== 树 + DFS 序号 ===== -->
  <circle cx="300" cy="78" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="324" y="74" font-size="10" fill="#b85450" font-weight="bold">①</text>

  <circle cx="210" cy="130" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="232" y="126" font-size="10" fill="#b85450" font-weight="bold">②</text>
  <line x1="286" y1="90" x2="222" y2="120" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <circle cx="390" cy="130" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="412" y="126" font-size="10" fill="#b85450" font-weight="bold">④</text>
  <line x1="314" y1="90" x2="378" y2="120" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>

  <circle cx="210" cy="186" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="232" y="182" font-size="10" fill="#b85450" font-weight="bold">③</text>
  <line x1="210" y1="145" x2="210" y2="171" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- ===== 演算表 ===== -->
  <!-- 表头 -->
  <rect x="24" y="220" width="552" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="54" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <text x="150" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">节点</text>
  <text x="430" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">path 状态</text>
  <text x="540" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">收集</text>
  <line x1="84" y1="220" x2="84" y2="246" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="216" y1="220" x2="216" y2="246" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="344" y1="220" x2="344" y2="246" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="516" y1="220" x2="516" y2="246" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 1 进入1 -->
  <rect x="24" y="246" width="552" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="263" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">①</text>
  <text x="150" y="263" text-anchor="middle" font-size="11" fill="#333">进入 append</text>
  <text x="280" y="263" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="430" y="263" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1]</text>
  <text x="540" y="263" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- 行 2 进入2 -->
  <rect x="24" y="270" width="552" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="287" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">②</text>
  <text x="150" y="287" text-anchor="middle" font-size="11" fill="#333">进入 append</text>
  <text x="280" y="287" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="430" y="287" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1, 2]</text>
  <text x="540" y="287" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- 行 3 进入5 叶子 收集 -->
  <rect x="24" y="294" width="552" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="54" y="311" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③</text>
  <text x="150" y="311" text-anchor="middle" font-size="11" fill="#333">进入=叶子</text>
  <text x="280" y="311" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="430" y="311" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1, 2, 5]</text>
  <text x="540" y="311" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"1-&gt;2-&gt;5"</text>

  <!-- 行 4 撤销5 -->
  <rect x="24" y="318" width="552" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="335" text-anchor="middle" font-size="11" fill="#888">↩</text>
  <text x="150" y="335" text-anchor="middle" font-size="11" fill="#888">撤销 pop</text>
  <text x="280" y="335" text-anchor="middle" font-size="11" fill="#888">5</text>
  <text x="430" y="335" text-anchor="middle" font-size="11" fill="#888">[1, 2]</text>
  <text x="540" y="335" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- 行 5 撤销2 -->
  <rect x="24" y="342" width="552" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="359" text-anchor="middle" font-size="11" fill="#888">↩</text>
  <text x="150" y="359" text-anchor="middle" font-size="11" fill="#888">撤销 pop</text>
  <text x="280" y="359" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="430" y="359" text-anchor="middle" font-size="11" fill="#888">[1]</text>
  <text x="540" y="359" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- 行 6 进入3 叶子 收集 -->
  <rect x="24" y="366" width="552" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="54" y="383" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④</text>
  <text x="150" y="383" text-anchor="middle" font-size="11" fill="#333">进入=叶子</text>
  <text x="280" y="383" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="430" y="383" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1, 3]</text>
  <text x="540" y="383" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"1-&gt;3"</text>

  <!-- 行 7 撤销3 -->
  <rect x="24" y="390" width="552" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="407" text-anchor="middle" font-size="11" fill="#888">↩</text>
  <text x="150" y="407" text-anchor="middle" font-size="11" fill="#888">撤销 pop</text>
  <text x="280" y="407" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="430" y="407" text-anchor="middle" font-size="11" fill="#888">[1]</text>
  <text x="540" y="407" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- 行 8 撤销1 -->
  <rect x="24" y="414" width="552" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="431" text-anchor="middle" font-size="11" fill="#888">↩</text>
  <text x="150" y="431" text-anchor="middle" font-size="11" fill="#888">撤销 pop</text>
  <text x="280" y="431" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="430" y="431" text-anchor="middle" font-size="11" fill="#888">[]</text>
  <text x="540" y="431" text-anchor="middle" font-size="11" fill="#888">—</text>

  <text x="300" y="458" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果：["1-&gt;2-&gt;5", "1-&gt;3"] ✓</text>
</svg>
