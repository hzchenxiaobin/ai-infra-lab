<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 2 演算：nums=[9,4,1,7], k=2</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">排序后 [1,4,7,9]，考察 n−k+1 = 3 个长度 2 窗口</text>

  <!-- Column headers -->
  <text x="28" y="64" font-size="10.5" fill="#666" font-weight="bold">步骤</text>
  <text x="141" y="64" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">窗口 [i, i+k−1]</text>
  <text x="281" y="64" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">差值</text>
  <text x="375" y="64" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">ans</text>

  <path d="M 20 72 L 460 72" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: i=0, window [1,4], diff=3, ans=3 -->
  <text x="28" y="98" font-size="11" fill="#666" font-weight="bold">i=0</text>
  <rect x="64" y="80" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="81" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="104" y="80" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="144" y="80" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="102" text-anchor="middle" font-size="12" fill="#999">7</text>
  <rect x="184" y="80" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="102" text-anchor="middle" font-size="12" fill="#999">9</text>
  <text x="281" y="102" text-anchor="middle" font-size="11.5" fill="#333">4 − 1 = 3</text>
  <rect x="345" y="86" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="375" y="102" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Row 2: i=1, window [4,7], diff=3, ans=3 -->
  <text x="28" y="144" font-size="11" fill="#666" font-weight="bold">i=1</text>
  <rect x="64" y="126" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="148" text-anchor="middle" font-size="12" fill="#999">1</text>
  <rect x="104" y="126" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="144" y="126" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="184" y="126" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="148" text-anchor="middle" font-size="12" fill="#999">9</text>
  <text x="281" y="148" text-anchor="middle" font-size="11.5" fill="#333">7 − 4 = 3</text>
  <rect x="345" y="132" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="375" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Row 3: i=2, window [7,9], diff=2, ans=2 (best) -->
  <text x="28" y="190" font-size="11" fill="#666" font-weight="bold">i=2</text>
  <rect x="64" y="172" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="194" text-anchor="middle" font-size="12" fill="#999">1</text>
  <rect x="104" y="172" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="121" y="194" text-anchor="middle" font-size="12" fill="#999">4</text>
  <rect x="144" y="172" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="184" y="172" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="281" y="194" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">9 − 7 = 2</text>
  <rect x="345" y="178" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="375" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2 ✓</text>

  <path d="M 20 218 L 460 218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Summary box -->
  <rect x="60" y="234" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">候选数：C(4,2)=6 子集 → n−k+1=3 窗口</text>
  <text x="260" y="273" text-anchor="middle" font-size="10.5" fill="#555">最小差值 2，对应窗口 [7, 9]，与暴力枚举结果一致</text>

  <!-- Footer -->
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#888">排序把候选从「任意子集」压成「连续窗口」，每个窗口 O(1) 算差值</text>
  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#aaa">k=1 时窗口 [i,i] 差值恒 0；k=n 时唯一窗口差值 = nums[n−1] − nums[0]</text>
</svg>
