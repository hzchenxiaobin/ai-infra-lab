<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：按序分发，每次比上次多 1，循环轮转到每个人</text>

  <!-- People header -->
  <text x="70" y="66" font-size="12" fill="#888">人 →</text>
  <rect x="120" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">P0</text>
  <rect x="200" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">P1</text>
  <rect x="280" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">P2</text>
  <rect x="360" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">P3</text>
  <text x="448" y="68" font-size="11" fill="#888">(n=4)</text>

  <!-- Round 1 -->
  <text x="70" y="108" font-size="11" fill="#d6a040" font-weight="bold">第 1 轮</text>
  <rect x="120" y="90" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="110" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="90" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="110" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="280" y="90" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="110" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="360" y="90" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="110" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- Round 2 -->
  <text x="70" y="148" font-size="11" fill="#d6a040" font-weight="bold">第 2 轮</text>
  <rect x="120" y="130" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="200" y="130" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="280" y="130" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="360" y="130" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- Round 3 partial -->
  <text x="70" y="188" font-size="11" fill="#d6a040" font-weight="bold">第 3 轮</text>
  <rect x="120" y="170" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="200" y="170" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="190" text-anchor="middle" font-size="13" fill="#bbb">10</text>
  <text x="300" y="190" font-size="14" fill="#bbb">. . .</text>
  <text x="390" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">糖果不够→停</text>

  <!-- wrap-around arrow -->
  <path d="M 390 90 Q 440 100 440 130 Q 440 150 420 150" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="120" font-size="9" fill="#888">循环</text>
  <text x="448" y="132" font-size="9" fill="#888">轮转</text>

  <!-- Key insight box -->
  <rect x="40" y="220" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">关键观察：第 m 次发 m 颗糖，累计 = 1 + 2 + … + m = m(m+1)/2</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#666">发糖总次数 m ≈ √(2 × candies)，模拟 O(√candies) 即可（10⁹ → 约 44721 次）</text>

  <!-- Remainder box -->
  <rect x="40" y="290" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最后一次糖果不够 → 剩余全部给当前人，分发结束</text>

  <!-- Summary -->
  <rect x="40" y="346" width="480" height="20" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#888">本质：等差数列 1,2,3,… 循环分配，求和定终止，余数给末人</text>

  <!-- amount arrows pointing down to people -->
  <path d="M 150 78 L 150 88" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 230 78 L 230 88" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 310 78 L 310 88" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 390 78 L 390 88" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- between rounds arrows -->
  <path d="M 150 118 L 150 128" stroke="#888" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 118 L 230 128" stroke="#888" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 118 L 310 128" stroke="#888" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 118 L 390 128" stroke="#888" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 158 L 150 168" stroke="#888" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
