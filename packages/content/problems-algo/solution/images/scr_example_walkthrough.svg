<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：Quebec vs New York</text>

  <!-- Step 1: parent map -->
  <rect x="20" y="48" width="520" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="35" y="70" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">Step 1 建立 parent 映射表：</text>
  <text x="35" y="90" font-size="11" fill="#555" filter="url(#rough2)">North America→Earth | United States→North America | South America→Earth</text>
  <text x="35" y="108" font-size="11" fill="#555" filter="url(#rough2)">New York→United States | Boston→United States | Canada→North America | Ontario→Canada | Quebec→Canada | Brazil→South America</text>

  <!-- Step 2: region1 path -->
  <rect x="20" y="130" width="250" height="130" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">Step 2: 收集 region1 路径</text>
  <text x="35" y="172" font-size="11" fill="#555" filter="url(#rough2)">region1 = "Quebec"</text>
  <text x="35" y="192" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cur=Quebec → 加入 ancestors</text>
  <text x="35" y="210" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cur=Canada → 加入 ancestors</text>
  <text x="35" y="228" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cur=North America → 加入</text>
  <text x="35" y="246" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cur=Earth → 加入, 结束</text>

  <!-- ancestors set box -->
  <rect x="290" y="130" width="250" height="130" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">ancestors 集合</text>
  <rect x="310" y="165" width="90" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Quebec</text>
  <rect x="310" y="195" width="90" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Canada</text>
  <rect x="410" y="165" width="110" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">North America</text>
  <rect x="420" y="195" width="80" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Earth</text>
  <text x="415" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">共 4 个节点</text>

  <!-- Step 3: region2 walk -->
  <rect x="20" y="275" width="520" height="135" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">Step 3: region2 向上走，查 ancestors</text>

  <text x="35" y="318" font-size="11" fill="#555" filter="url(#rough2)">region2 = "New York"</text>

  <text x="35" y="338" font-size="11" fill="#b85450" filter="url(#rough2)">① cur=New York → in ancestors? 否 → 继续上走</text>
  <text x="35" y="356" font-size="11" fill="#b85450" filter="url(#rough2)">② cur=United States → in ancestors? 否 → 继续上走</text>
  <text x="35" y="374" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ cur=North America → in ancestors? 是 ⭐ → 返回!</text>

  <rect x="200" y="385" width="200" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="401" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案: "North America"</text>
</svg>
