<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：(key) → 哈希查找 → value 或 "?"</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">扫描字符串，遇 ( 收集键直到 ) ，查哈希表替换</text>

  <!-- Input string row -->
  <text x="60" y="78" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">输入 s：</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- ( name ) is ( age ) yearsold -->
    <rect x="120" y="66" width="14" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <text x="127" y="84" fill="#d6a040" font-weight="bold">(</text>
    <rect x="134" y="66" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <text x="159" y="84" fill="#d6a040" font-weight="bold">name</text>
    <rect x="184" y="66" width="14" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <text x="191" y="84" fill="#d6a040" font-weight="bold">)</text>
    <text x="222" y="84" fill="#555">is</text>
    <rect x="246" y="66" width="14" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="253" y="84" fill="#4a7a3a" font-weight="bold">(</text>
    <rect x="260" y="66" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="279" y="84" fill="#4a7a3a" font-weight="bold">age</text>
    <rect x="298" y="66" width="14" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="305" y="84" fill="#4a7a3a" font-weight="bold">)</text>
    <text x="340" y="84" fill="#555">yearsold</text>
  </g>

  <!-- Knowledge hashmap box -->
  <text x="60" y="128" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">knowledge → 哈希表：</text>
  <rect x="200" y="112" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="240" y="132" fill="#446688" font-weight="bold">"name"</text>
    <text x="280" y="132" fill="#888">→</text>
    <text x="320" y="132" fill="#4a7a3a" font-weight="bold">"bob"</text>
    <text x="240" y="152" fill="#446688" font-weight="bold">"age"</text>
    <text x="280" y="152" fill="#888">→</text>
    <text x="320" y="152" fill="#4a7a3a" font-weight="bold">"two"</text>
  </g>

  <!-- Arrows from brackets to lookup -->
  <path d="M 159 92 Q 200 104 232 112" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <path d="M 279 92 Q 280 104 300 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="4 3"/>

  <!-- Lookup result chips -->
  <text x="60" y="200" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">查表替换：</text>
  <rect x="160" y="186" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="220" y="205" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(name) → "bob"</text>
  <rect x="340" y="186" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(age) → "two"</text>

  <path d="M 220 140 L 220 186" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <path d="M 400 158 L 400 186" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="3 3"/>

  <!-- Miss case -->
  <text x="60" y="248" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">键不在表中：</text>
  <rect x="160" y="234" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(xxx) → "?"（未知键）</text>

  <!-- Output string -->
  <path d="M 320 262 L 320 288" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="312" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">输出：</text>
  <rect x="140" y="296" width="380" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="317" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">"bobistwoyearsold"</text>

  <!-- Complexity footer -->
  <rect x="60" y="340" width="520" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="359" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">建表 O(k) + 单次扫描 O(n) = O(n+k) 时间，O(k) 额外空间</text>
</svg>
