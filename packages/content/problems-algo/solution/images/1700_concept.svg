<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：循环队列让顺序失效，只看类型计数</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">学生不吃就排到队尾 → 任一类型总会轮到队首；栈顶类型无人想要即停</text>

  <!-- ===== Student queue (circular) ===== -->
  <text x="28" y="74" font-size="10.5" fill="#666" filter="url(#rough2)">学生队列（循环）</text>

  <!-- 6 students: 1,1,1,0,0,1 ; w=34 gap=5 start=68 -->
  <!-- front marker -->
  <text x="68" y="74" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">队首↓</text>

  <rect x="68" y="80" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="107" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="146" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="185" y="80" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="224" y="80" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="263" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- cycle arrow: from right end back to front (curved above) -->
  <path d="M 297 86 C 320 50, 50 50, 68 78" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="180" y="52" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">不吃 → 排到队尾（循环）</text>

  <!-- ===== Counter box (right) ===== -->
  <rect x="340" y="70" width="170" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="90" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">类型计数（与顺序无关）</text>
  <line x1="352" y1="98" x2="498" y2="98" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="356" y="104" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="368" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="392" y="120" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">cnt0 = 2</text>
  <rect x="456" y="104" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="468" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="425" y="120" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">cnt1 = 4</text>

  <!-- ===== Sandwich stack (vertical, top accessible) ===== -->
  <text x="28" y="170" font-size="10.5" fill="#666" filter="url(#rough2)">三明治栈（只能取栈顶）</text>

  <!-- top sandwich (index 0) highlighted, type 1 -->
  <rect x="68" y="176" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1 ←栈顶</text>
  <rect x="68" y="210" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="68" y="240" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="68" y="270" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- arrow from stack top up to student front (match) -->
  <path d="M 98 176 C 98 158, 85 140, 85 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="108" y="150" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">类型匹配→拿走</text>

  <!-- ===== Termination illustration (right of stack) ===== -->
  <rect x="180" y="170" width="330" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="345" y="190" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">终止条件：栈顶类型 cnt[t] == 0</text>
  <line x1="192" y1="198" x2="498" y2="198" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>

  <!-- step illustration: top=0 but cnt0=0 -->
  <text x="196" y="218" font-size="10.5" fill="#333" filter="url(#rough2)">栈顶三明治 =</text>
  <rect x="288" y="206" width="22" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="299" y="221" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="324" y="218" font-size="10.5" fill="#333" filter="url(#rough2)">但 cnt0 = 0</text>
  <text x="402" y="218" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 无人能吃！</text>

  <text x="196" y="246" font-size="10.5" fill="#555" filter="url(#rough2)">剩余学生全是另一种喜好，栈顶永久卡住</text>
  <text x="196" y="264" font-size="10.5" fill="#555" filter="url(#rough2)">⇒ 进程在此终止</text>

  <rect x="196" y="274" width="298" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="345" y="292" text-anchor="middle" font-size="11" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">答案 = cnt0 + cnt1（剩余学生总数）</text>

  <!-- ===== Footer ===== -->
  <text x="270" y="328" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">循环队列 ⇔ 任一类型总会轮到队首；顺序只影响“谁先吃”，不影响“能否吃到”</text>
  <text x="270" y="346" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">→ 顺序扫描 sandwiches 消耗计数，遇 cnt[t]==0 即停</text>
</svg>
