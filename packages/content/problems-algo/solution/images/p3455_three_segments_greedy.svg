<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">两个 * 拆出三段，在 s 上「最早出现」贪心接力</text>

  <!-- p 分解行 -->
  <text x="45" y="61" font-size="13" fill="#555" filter="url(#rough2)">p =</text>
  <rect x="88" y="40" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="114" y="61" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">ba</text>
  <text x="160" y="62" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">*</text>
  <rect x="176" y="40" width="30" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="191" y="61" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="223" y="62" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">*</text>
  <rect x="239" y="40" width="52" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="61" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">ce</text>
  <text x="325" y="61" font-size="11" fill="#888" filter="url(#rough2)">三段 A / B / C 均可为空</text>

  <!-- A 出现标记条（格子上方） -->
  <rect x="78" y="86" width="68" height="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="214" y="86" width="68" height="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="30" y="94" font-size="10.5" fill="#446688" filter="url(#rough2)">A 出现</text>

  <!-- s 格子 -->
  <text x="26" y="122" font-size="12" fill="#555" filter="url(#rough2)">s =</text>
  <g font-size="13.5" fill="#333" text-anchor="middle">
    <rect x="44" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="78" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="112" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="146" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="180" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="214" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="248" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="282" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="316" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="350" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="384" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="418" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <rect x="452" y="100" width="34" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="61" y="122" filter="url(#rough2)">a</text>
    <text x="95" y="122" filter="url(#rough2)">b</text>
    <text x="129" y="122" filter="url(#rough2)">a</text>
    <text x="163" y="122" filter="url(#rough2)">a</text>
    <text x="197" y="122" filter="url(#rough2)">c</text>
    <text x="231" y="122" filter="url(#rough2)">b</text>
    <text x="265" y="122" filter="url(#rough2)">a</text>
    <text x="299" y="122" filter="url(#rough2)">e</text>
    <text x="333" y="122" filter="url(#rough2)">c</text>
    <text x="367" y="122" filter="url(#rough2)">e</text>
    <text x="401" y="122" filter="url(#rough2)">b</text>
    <text x="435" y="122" filter="url(#rough2)">c</text>
    <text x="469" y="122" filter="url(#rough2)">e</text>
  </g>
  <!-- 下标 -->
  <g font-size="9.5" fill="#999" text-anchor="middle">
    <text x="61" y="148" filter="url(#rough2)">0</text>
    <text x="95" y="148" filter="url(#rough2)">1</text>
    <text x="129" y="148" filter="url(#rough2)">2</text>
    <text x="163" y="148" filter="url(#rough2)">3</text>
    <text x="197" y="148" filter="url(#rough2)">4</text>
    <text x="231" y="148" filter="url(#rough2)">5</text>
    <text x="265" y="148" filter="url(#rough2)">6</text>
    <text x="299" y="148" filter="url(#rough2)">7</text>
    <text x="333" y="148" filter="url(#rough2)">8</text>
    <text x="367" y="148" filter="url(#rough2)">9</text>
    <text x="401" y="148" filter="url(#rough2)">10</text>
    <text x="435" y="148" filter="url(#rough2)">11</text>
    <text x="469" y="148" filter="url(#rough2)">12</text>
  </g>

  <!-- B 出现标记条 -->
  <rect x="180" y="154" width="34" height="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="316" y="154" width="34" height="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="418" y="154" width="34" height="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="20" y="162" font-size="10.5" fill="#d6a040" filter="url(#rough2)">B 出现</text>
  <!-- C 出现标记条 -->
  <rect x="316" y="168" width="68" height="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="418" y="168" width="68" height="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="20" y="176" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">C 出现</text>

  <!-- 贪心链：虚线连到节点 -->
  <path d="M 231 178 L 231 206" stroke="#888" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 331 178 L 331 206" stroke="#888" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 433 178 L 433 206" stroke="#888" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- 左侧对照（a=1 更差） -->
  <text x="20" y="208" font-size="11" fill="#999" filter="url(#rough2)">对照：a = 1 时</text>
  <text x="20" y="224" font-size="11" fill="#999" filter="url(#rough2)">b = 4, c = 8</text>
  <text x="20" y="240" font-size="11" fill="#999" filter="url(#rough2)">长度 9 ✗</text>

  <!-- 节点与箭头 -->
  <circle cx="231" cy="222" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="231" y="227" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <circle cx="331" cy="222" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="331" y="227" text-anchor="middle" font-size="13" fill="#a07020" font-weight="bold" filter="url(#rough2)">b</text>
  <circle cx="433" cy="222" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="433" y="227" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">c</text>

  <path d="M 246 222 L 315 222" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="213" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">最早 ≥ 7</text>
  <path d="M 346 222 L 417 222" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="213" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">最早 ≥ 9</text>

  <text x="231" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a = 5</text>
  <text x="331" y="252" text-anchor="middle" font-size="11" fill="#a07020" filter="url(#rough2)">b = nxtB[7] = 8</text>
  <text x="433" y="252" text-anchor="middle" font-size="11" fill="#2a5a3a" filter="url(#rough2)">c = nxtC[9] = 11</text>

  <!-- 答案子串 -->
  <g font-size="13.5" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="90" y="264" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="124" y="264" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="158" y="264" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="192" y="264" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="226" y="264" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="260" y="264" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="294" y="264" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="328" y="264" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="107" y="285" filter="url(#rough2)">b</text>
    <text x="141" y="285" filter="url(#rough2)">a</text>
    <text x="175" y="285" filter="url(#rough2)">e</text>
    <text x="209" y="285" filter="url(#rough2)">c</text>
    <text x="243" y="285" filter="url(#rough2)">e</text>
    <text x="277" y="285" filter="url(#rough2)">b</text>
    <text x="311" y="285" filter="url(#rough2)">c</text>
    <text x="345" y="285" filter="url(#rough2)">e</text>
  </g>
  <text x="380" y="278" font-size="11.5" fill="#555" filter="url(#rough2)">长度 = c + |C| − a</text>
  <text x="380" y="296" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 11 + 2 − 5 = 8 ✓</text>
  <text x="226" y="312" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">最短匹配子串 s[5..13) = "baecebce"</text>

  <!-- 底部贪心正确性说明 -->
  <rect x="30" y="322" width="460" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">贪心：固定 a 后 B 取「最早出现」，C 只会跟着更早 —— 不会错过更优解</text>
</svg>
