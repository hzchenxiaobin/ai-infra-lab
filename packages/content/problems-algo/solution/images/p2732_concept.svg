<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2732a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2732g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">每行编码为 n 位掩码（n≤5），只需检查大小 1 或 2 的好子集</text>

  <!-- ===== top: row -> bitmask encoding ===== -->
  <text x="40" y="64" font-size="12" fill="#888" font-weight="bold">行 → 位掩码</text>

  <g font-size="16" font-weight="bold">
    <!-- row cells: 0 1 1 0 0 -->
    <rect x="70" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="87" y="99" text-anchor="middle" fill="#999">0</text>
    <rect x="104" y="76" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="121" y="99" text-anchor="middle" fill="#b85450">1</text>
    <rect x="138" y="76" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="155" y="99" text-anchor="middle" fill="#b85450">1</text>
    <rect x="172" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="189" y="99" text-anchor="middle" fill="#999">0</text>
    <rect x="206" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="223" y="99" text-anchor="middle" fill="#999">0</text>
  </g>

  <!-- bit labels under cells -->
  <g font-size="10" fill="#888">
    <text x="87" y="122" text-anchor="middle">b0</text>
    <text x="121" y="122" text-anchor="middle">b1</text>
    <text x="155" y="122" text-anchor="middle">b2</text>
    <text x="189" y="122" text-anchor="middle">b3</text>
    <text x="223" y="122" text-anchor="middle">b4</text>
  </g>

  <!-- arrow to mask -->
  <path d="M252,93 L296,93" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2732a)" filter="url(#rough2)"/>

  <!-- mask value box -->
  <rect x="300" y="76" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="375" y="99" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">mask = 01100 = 12</text>

  <!-- ===== middle: size 1 case ===== -->
  <text x="40" y="170" font-size="12" fill="#888" font-weight="bold">大小 1（k=1）</text>

  <g font-size="16" font-weight="bold">
    <rect x="100" y="182" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="117" y="205" text-anchor="middle" fill="#4a7a3a">0</text>
    <rect x="134" y="182" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="151" y="205" text-anchor="middle" fill="#4a7a3a">0</text>
    <rect x="168" y="182" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="185" y="205" text-anchor="middle" fill="#4a7a3a">0</text>
    <rect x="202" y="182" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="219" y="205" text-anchor="middle" fill="#4a7a3a">0</text>
  </g>
  <text x="258" y="204" font-size="12" fill="#4a7a3a" font-weight="bold">mask=0</text>
  <rect x="330" y="180" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每列和 = 0 ≤ floor(1/2)=0 ✓</text>
  <text x="420" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a">全零行即好子集</text>

  <!-- ===== bottom: size 2 case ===== -->
  <text x="40" y="266" font-size="12" fill="#888" font-weight="bold">大小 2（k=2）</text>

  <g font-size="16" font-weight="bold">
    <!-- row A: 1 0 0 1 0 -> mask bits -->
    <rect x="100" y="278" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="117" y="301" text-anchor="middle" fill="#b85450">1</text>
    <rect x="134" y="278" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="151" y="301" text-anchor="middle" fill="#999">0</text>
    <rect x="168" y="278" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="185" y="301" text-anchor="middle" fill="#999">0</text>
    <rect x="202" y="278" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="219" y="301" text-anchor="middle" fill="#b85450">1</text>
    <rect x="236" y="278" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="253" y="301" text-anchor="middle" fill="#999">0</text>
  </g>
  <text x="70" y="300" font-size="11" fill="#888" font-weight="bold">A:</text>

  <g font-size="16" font-weight="bold">
    <!-- row B: 0 1 1 0 0 -> disjoint 1s from A -->
    <rect x="100" y="316" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="117" y="339" text-anchor="middle" fill="#999">0</text>
    <rect x="134" y="316" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="151" y="339" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="168" y="316" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="185" y="339" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="202" y="316" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="219" y="339" text-anchor="middle" fill="#999">0</text>
    <rect x="236" y="316" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="253" y="339" text-anchor="middle" fill="#999">0</text>
  </g>
  <text x="70" y="338" font-size="11" fill="#888" font-weight="bold">B:</text>

  <!-- AND = 0 label -->
  <text x="290" y="328" font-size="13" fill="#b85450" font-weight="bold">A &amp; B = 0</text>
  <path d="M286,332 L326,332" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr2732a)" filter="url(#rough2)"/>

  <rect x="330" y="308" width="190" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="325" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">两行无公共 1 列</text>
  <text x="425" y="340" text-anchor="middle" font-size="10" fill="#d6a040">每列和 ≤ 1 = floor(2/2) ✓</text>

  <!-- bottom note -->
  <rect x="60" y="372" width="440" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n≤5 → 最多 2⁵=32 种掩码，枚举大小 1/2 的子集即可</text>
</svg>
