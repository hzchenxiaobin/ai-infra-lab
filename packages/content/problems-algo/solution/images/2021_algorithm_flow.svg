<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 376" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2021f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="376" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建差分 → 排序坐标 → 扫描维护最大</text>

  <!-- A: input -->
  <rect x="200" y="40" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 lights</text>
  <path d="M 280 70 L 280 82" stroke="#888" stroke-width="1.5" marker-end="url(#arr2021f)" filter="url(#rough2)"/>

  <!-- B: compute [l, r] -->
  <rect x="140" y="82" width="280" height="30" fill="#fff" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="12" fill="#333">对每盏灯：l = pos − range，r = pos + range</text>
  <path d="M 280 112 L 280 124" stroke="#888" stroke-width="1.5" marker-end="url(#arr2021f)" filter="url(#rough2)"/>

  <!-- C: diff hash -->
  <rect x="140" y="124" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">差分哈希：d[l] += 1；d[r+1] −= 1</text>
  <path d="M 280 154 L 280 166" stroke="#888" stroke-width="1.5" marker-end="url(#arr2021f)" filter="url(#rough2)"/>

  <!-- D: sort keys -->
  <rect x="140" y="166" width="280" height="30" fill="#fff" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#333">取出所有 key 排序；s = mx = 0</text>
  <path d="M 280 196 L 280 212" stroke="#888" stroke-width="1.5" marker-end="url(#arr2021f)" filter="url(#rough2)"/>

  <!-- E: decision diamond -->
  <polygon points="280,212 348,232 280,252 212,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">还有 key?</text>

  <!-- E (否分支) -> F: return ans -->
  <path d="M 348 232 L 388 232" stroke="#888" stroke-width="1.5" marker-end="url(#arr2021f)" filter="url(#rough2)"/>
  <text x="366" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="388" y="216" width="132" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="454" y="237" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- E (是分支) -> G -->
  <path d="M 280 252 L 280 270" stroke="#888" stroke-width="1.5" marker-end="url(#arr2021f)" filter="url(#rough2)"/>
  <text x="294" y="266" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- G: update -->
  <rect x="120" y="270" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s += d[k]；若 mx &lt; s：mx = s，ans = k</text>

  <!-- loop back to E -->
  <path d="M 120 288 L 78 288 L 78 232 L 212 232" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2021f)" filter="url(#rough2)"/>
  <text x="86" y="262" text-anchor="middle" font-size="10" fill="#666">下一 key</text>

  <!-- callout: tie-break -->
  <rect x="120" y="326" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">严格 mx &lt; s（非 ≤）：升序扫描首次达最大</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#666">→ 并列时自动保留坐标最小者</text>
</svg>
