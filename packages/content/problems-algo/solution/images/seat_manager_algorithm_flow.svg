<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：初始化 / reserve / unreserve</text>

  <!-- ===== 初始化 ===== -->
  <text x="36" y="56" font-size="12" fill="#446688" font-weight="bold">① SeatManager(n) 初始化</text>

  <rect x="60" y="66" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1..n</text>

  <path d="M 140 80 L 196 80" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="74" text-anchor="middle" font-size="9" fill="#888">heapify</text>

  <rect x="200" y="66" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="255" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最小堆 heap</text>

  <rect x="330" y="66" width="180" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="420" y="84" text-anchor="middle" font-size="10" fill="#555">O(n) 建堆（heapify）</text>

  <!-- ===== reserve 流程 ===== -->
  <text x="36" y="120" font-size="12" fill="#b85450" font-weight="bold">② reserve() 预约最小座位</text>

  <rect x="60" y="130" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="105" y="149" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">调用 reserve()</text>

  <path d="M 150 145 L 196 145" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 菱形判断：堆是否非空（题目保证） -->
  <polygon points="250,128 318,145 250,162 182,145" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="142" text-anchor="middle" font-size="9.5" fill="#555">堆非空？</text>
  <text x="250" y="155" text-anchor="middle" font-size="9" fill="#888">(题目保证)</text>

  <path d="M 318 145 L 354 145" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="336" y="139" text-anchor="middle" font-size="9" fill="#b85450">是</text>

  <rect x="358" y="130" width="92" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="404" y="149" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">heappop()</text>

  <path d="M 450 145 L 486 145" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="490" y="130" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="525" y="149" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">返回堆顶</text>

  <!-- 标注 -->
  <text x="404" y="174" text-anchor="middle" font-size="9" fill="#888">堆顶最小值弹出 + 下沉调整 O(log n)</text>

  <!-- ===== unreserve 流程 ===== -->
  <text x="36" y="206" font-size="12" fill="#4a7a3a" font-weight="bold">③ unreserve(seatNumber) 归还座位</text>

  <rect x="60" y="216" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="235" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">调用 unreserve(x)</text>

  <path d="M 180 231 L 216 231" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="220" y="216" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="266" y="235" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">合法？</text>
  <text x="266" y="246" text-anchor="middle" font-size="8.5" fill="#888">(题目保证)</text>

  <path d="M 312 231 L 348 231" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="225" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>

  <rect x="352" y="216" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="402" y="235" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">heappush(x)</text>

  <path d="M 452 231 L 486 231" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="490" y="216" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="525" y="235" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">x 回堆</text>

  <text x="402" y="260" text-anchor="middle" font-size="9" fill="#888">末尾插入 + 上浮调整 O(log n)</text>

  <!-- ===== 关键不变式 ===== -->
  <rect x="36" y="286" width="509" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="306" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">堆的不变式（Invariant）</text>
  <text x="290" y="322" text-anchor="middle" font-size="10" fill="#555">heap 中恰好存放「当前所有可用座位」</text>
  <text x="290" y="336" text-anchor="middle" font-size="10" fill="#555">reserve 弹出一个 → 可用集合 −1；unreserve 压入一个 → 可用集合 +1</text>

  <!-- ===== 复杂度小结 ===== -->
  <rect x="36" y="356" width="245" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="158" y="376" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">单次操作复杂度</text>
  <text x="158" y="392" text-anchor="middle" font-size="10" fill="#555">reserve / unreserve 均 O(log n)</text>

  <rect x="300" y="356" width="245" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="422" y="376" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">总复杂度</text>
  <text x="422" y="392" text-anchor="middle" font-size="10" fill="#555">初始化 O(n)，m 次操作 O(m log n)</text>

  <!-- 底部备注 -->
  <text x="290" y="430" text-anchor="middle" font-size="9.5" fill="#aaa">题目保证 reserve 时堆非空、unreserve 的座位处于已预约态，故无需额外校验</text>
</svg>
