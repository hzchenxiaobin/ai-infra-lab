<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">01 矩阵：多源 BFS 逐层扩散</text>
  <path d="M 240 40 Q 360 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Input matrix ===== -->
  <text x="120" y="70" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">输入 mat（0 = 源，1 = 待求）</text>
  <g font-size="16" filter="url(#rough2)">
    <rect x="60" y="85" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="85" y="118" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="110" y="85" width="50" height="50" fill="#fff" stroke="#bbb"/>
    <text x="135" y="118" text-anchor="middle" fill="#888">1</text>
    <rect x="160" y="85" width="50" height="50" fill="#fff" stroke="#bbb"/>
    <text x="185" y="118" text-anchor="middle" fill="#888">1</text>

    <rect x="60" y="135" width="50" height="50" fill="#fff" stroke="#bbb"/>
    <text x="85" y="168" text-anchor="middle" fill="#888">1</text>
    <rect x="110" y="135" width="50" height="50" fill="#fff" stroke="#bbb"/>
    <text x="135" y="168" text-anchor="middle" fill="#888">1</text>
    <rect x="160" y="135" width="50" height="50" fill="#fff" stroke="#bbb"/>
    <text x="185" y="168" text-anchor="middle" fill="#888">1</text>

    <rect x="60" y="185" width="50" height="50" fill="#fff" stroke="#bbb"/>
    <text x="85" y="218" text-anchor="middle" fill="#888">1</text>
    <rect x="110" y="185" width="50" height="50" fill="#fff" stroke="#bbb"/>
    <text x="135" y="218" text-anchor="middle" fill="#888">1</text>
    <rect x="160" y="185" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="185" y="218" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
  </g>
  <text x="120" y="258" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">两个 0 = 两个源</text>

  <!-- arrow -->
  <path d="M230 160 L300 160" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">多源</text>
  <text x="265" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">BFS</text>

  <!-- ===== Output matrix with layer colors ===== -->
  <text x="440" y="70" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">输出 dist（颜色 = BFS 层）</text>
  <g font-size="16" filter="url(#rough2)">
    <rect x="380" y="85" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="405" y="118" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="430" y="85" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="455" y="118" text-anchor="middle" fill="#2e5e2e" font-weight="bold">1</text>
    <rect x="480" y="85" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="505" y="118" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>

    <rect x="380" y="135" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="405" y="168" text-anchor="middle" fill="#2e5e2e" font-weight="bold">1</text>
    <rect x="430" y="135" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="455" y="168" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <rect x="480" y="135" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="505" y="168" text-anchor="middle" fill="#2e5e2e" font-weight="bold">1</text>

    <rect x="380" y="185" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="405" y="218" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <rect x="430" y="185" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="455" y="218" text-anchor="middle" fill="#2e5e2e" font-weight="bold">1</text>
    <rect x="480" y="185" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="505" y="218" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
  </g>
  <text x="440" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">层数 = 到最近 0 的距离</text>

  <!-- ===== Bottom: legend + super source ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="280" width="600" height="100" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="360" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">核心：所有 0 同时入队 = 虚拟超级源点</text>

  <g font-size="12" fill="#444" filter="url(#rough2)">
    <rect x="90" y="322" width="22" height="22" fill="#e8f0fe" stroke="#446688"/>
    <text x="122" y="338">第 0 层：所有 0（dist = 0，初始入队）</text>

    <rect x="90" y="350" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="122" y="366">第 1 层：0 的四邻居（dist = 1）</text>

    <rect x="400" y="322" width="22" height="22" fill="#fff8e1" stroke="#d6a040"/>
    <text x="432" y="338">第 2 层：第 1 层的四邻居（dist = 2）</text>

    <text x="400" y="366" fill="#b85450" font-weight="bold">BFS 层数 = 到最近 0 的距离</text>
  </g>
</svg>
