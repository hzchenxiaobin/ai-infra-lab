<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="820" height="460" fill="#fdfcf7"/>

  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：dict = ["hello","hallo","leetcode"] 的 5 次查询</text>
  <path d="M 240 40 Q 410 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="30" y="68" width="150" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="180" y="68" width="60" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="240" y="68" width="410" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="650" y="68" width="140" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="middle" fill="#2b6e9e">
    <text x="105" y="89">searchWord</text>
    <text x="210" y="89">len</text>
    <text x="445" y="89">Trie DFS 走法</text>
    <text x="720" y="89">结果</text>
  </g>

  <!-- row 1: hello -> true -->
  <g filter="url(#sk)">
    <rect x="30" y="106" width="150" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="180" y="106" width="60" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="240" y="106" width="410" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="650" y="106" width="140" height="44" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="105" y="133" fill="#333" font-weight="bold">hello</text>
    <text x="210" y="133" fill="#888">5</text>
  </g>
  <text x="250" y="124" font-size="9" fill="#2e8b57">① h→e→l→l→o★ (diff=0)</text>
  <text x="250" y="138" font-size="9" fill="#d6a040" font-weight="bold">② h→[e→a]→l→l→o★ (diff=1, "hallo") ✓</text>
  <text x="720" y="133" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- row 2: hallo -> true -->
  <g filter="url(#sk)">
    <rect x="30" y="154" width="150" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="180" y="154" width="60" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="240" y="154" width="410" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="650" y="154" width="140" height="44" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="105" y="181" fill="#333" font-weight="bold">hallo</text>
    <text x="210" y="181" fill="#888">5</text>
  </g>
  <text x="250" y="172" font-size="9" fill="#2e8b57">① h→a→l→l→o★ (diff=0)</text>
  <text x="250" y="186" font-size="9" fill="#d6a040" font-weight="bold">② h→[a→e]→l→l→o★ (diff=1, "hello") ✓</text>
  <text x="720" y="181" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- row 3: hell -> false (长度不符) -->
  <g filter="url(#sk)">
    <rect x="30" y="202" width="150" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="180" y="202" width="60" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="240" y="202" width="410" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="650" y="202" width="140" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="105" y="229" fill="#333" font-weight="bold">hell</text>
    <text x="210" y="229" fill="#888">4</text>
  </g>
  <text x="250" y="220" font-size="9" fill="#b85450">词典无长度为 4 的词</text>
  <text x="250" y="234" font-size="9" fill="#b85450">走到 i=4 时 node 无 is_end → false</text>
  <text x="720" y="229" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- row 4: leetcoda -> true -->
  <g filter="url(#sk)">
    <rect x="30" y="250" width="150" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="180" y="250" width="60" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="240" y="250" width="410" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="650" y="250" width="140" height="44" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="105" y="277" fill="#333" font-weight="bold">leetcoda</text>
    <text x="210" y="277" fill="#888">8</text>
  </g>
  <text x="250" y="268" font-size="9" fill="#2e8b57">① l→e→e→t→c→o→d→a：末位 'a' 不在子节点</text>
  <text x="250" y="282" font-size="9" fill="#d6a040" font-weight="bold">② 末位 [a→e]→e★ (diff=1, "leetcode") ✓</text>
  <text x="720" y="277" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- row 5: leetcode -> false (原词本身, diff=0) -->
  <g filter="url(#sk)">
    <rect x="30" y="298" width="150" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="180" y="298" width="60" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="240" y="298" width="410" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="650" y="298" width="140" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="105" y="325" fill="#333" font-weight="bold">leetcode</text>
    <text x="210" y="325" fill="#888">8</text>
  </g>
  <text x="250" y="316" font-size="9" fill="#2e8b57">① 全程精确 l→e→e→t→c→o→d→e★ (diff=0)</text>
  <text x="250" y="330" font-size="9" fill="#b85450" font-weight="bold">diff=0 ≠ 1 → 拒绝(改 0 处=原词本身)</text>
  <text x="720" y="325" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- key takeaways -->
  <g filter="url(#sk)">
    <rect x="30" y="360" width="760" height="86" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="50" y="382" font-size="11" fill="#2b6e9e" font-weight="bold">📌 三个易错点：</text>
  <text x="50" y="402" font-size="10" fill="#2b6e9e">1. 词尾必须检查 diff == 1 —— 排除「0 处替换 = 原词本身」(见第 5 行 leetcode → false)</text>
  <text x="50" y="420" font-size="10" fill="#2b6e9e">2. 长度天然由「Trie 路径深度」约束 —— 不同长度词走不到同一 is_end(见第 3 行 hell → false)</text>
  <text x="50" y="438" font-size="10" fill="#2b6e9e">3. 替换位必须换成「Trie 上真实存在的子节点」—— 枚举 26 个但仅命中的会继续深入，剪枝后常数很小</text>
</svg>
