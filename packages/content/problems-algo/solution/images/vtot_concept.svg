<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：BFS 配合列号天然满足「上→下、左→右」</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">给每个节点标列号 col，根=0，左孩子=col−1，右孩子=col+1</text>

  <!-- ===== Column bands ===== -->
  <g opacity="0.55">
    <rect x="78"  y="70" width="72" height="180" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
    <rect x="150" y="70" width="72" height="180" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
    <rect x="222" y="70" width="72" height="180" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
    <rect x="294" y="70" width="72" height="180" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
    <rect x="366" y="70" width="72" height="180" fill="#f3e5f5" stroke="none" filter="url(#rough2)"/>
  </g>
  <g font-size="11" fill="#666" font-weight="bold">
    <text x="114" y="84" text-anchor="middle">col=−2</text>
    <text x="186" y="84" text-anchor="middle">col=−1</text>
    <text x="258" y="84" text-anchor="middle">col=0</text>
    <text x="330" y="84" text-anchor="middle">col=1</text>
    <text x="402" y="84" text-anchor="middle">col=2</text>
  </g>

  <!-- ===== Tree (root=3 at col=0) ===== -->
  <g font-size="12">
    <!-- root: col=0 -->
    <circle cx="258" cy="118" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="258" y="124" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>

    <!-- L1: 9 at col=-1, 8 at col=1 -->
    <circle cx="186" cy="168" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="186" y="173" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <circle cx="330" cy="168" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="330" y="173" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
    <line x1="244" y1="132" x2="198" y2="154" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="272" y1="132" x2="318" y2="154" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- L2: 4 at col=-2, 0 at col=0, 1 at col=0, 7 at col=2 -->
    <circle cx="114" cy="222" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="114" y="227" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <circle cx="232" cy="222" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="232" y="227" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <circle cx="284" cy="222" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="284" y="227" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="402" cy="222" r="17" fill="#f3e5f5" stroke="#8a5a8a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="402" y="227" text-anchor="middle" fill="#8a5a8a" font-weight="bold">7</text>

    <line x1="172" y1="182" x2="126" y2="208" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="200" y1="182" x2="220" y2="208" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="316" y1="182" x2="296" y2="208" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="344" y1="182" x2="390" y2="208" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  </g>

  <!-- arrow down: 按列分桶 -->
  <path d="M 270 270 L 270 286" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="278" y="282" font-size="9" fill="#666">按 col 分桶（BFS 顺序追加）</text>

  <!-- ===== Buckets ===== -->
  <line x1="20" y1="296" x2="520" y2="296" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="316" font-size="11" fill="#444" font-weight="bold">col_to_nodes（每桶内顺序 = BFS 访问顺序，天然 上→下、左→右）</text>

  <g font-size="10">
    <!-- col=-2: [4] -->
    <rect x="78"  y="328" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="114" y="350" text-anchor="middle" fill="#b85450" font-weight="bold">[4]</text>

    <!-- col=-1: [9] -->
    <rect x="150" y="328" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="186" y="350" text-anchor="middle" fill="#446688" font-weight="bold">[9]</text>

    <!-- col=0: [3,0,1] -->
    <rect x="222" y="328" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="258" y="350" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[3,0,1]</text>

    <!-- col=1: [8] -->
    <rect x="294" y="328" width="72" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="330" y="350" text-anchor="middle" fill="#d6a040" font-weight="bold">[8]</text>

    <!-- col=2: [7] -->
    <rect x="366" y="328" width="72" height="34" fill="#f3e5f5" stroke="#8a5a8a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="402" y="350" text-anchor="middle" fill="#8a5a8a" font-weight="bold">[7]</text>
  </g>

  <!-- arrow down: 输出 -->
  <path d="M 270 368 L 270 380" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="78" y="384" width="360" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="258" y="402" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">按 col 升序输出 → [[4],[9],[3,0,1],[8],[7]]</text>
</svg>
