<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：降维 → 自连接配对 → 分组计数 → 过滤排序</text>

  <!-- Step 1 -->
  <rect x="90" y="40" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="10" fill="#333">① 连表：ProductPurchases ⋈ ProductInfo</text>
  <text x="270" y="74" text-anchor="middle" font-size="10" fill="#666">ON product_id → (user_id, category)</text>
  <path d="M 270 84 L 270 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="90" y="100" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="10" fill="#333">② 去重：DISTINCT (user_id, category)</text>
  <text x="270" y="134" text-anchor="middle" font-size="10" fill="#666">→ CTE user_category</text>
  <path d="M 270 144 L 270 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="90" y="160" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="179" text-anchor="middle" font-size="10" fill="#333">③ 自连接：user_category a JOIN user_category b</text>
  <text x="270" y="196" text-anchor="middle" font-size="10" fill="#b85450">ON a.user_id = b.user_id AND a.category &lt; b.category</text>
  <path d="M 270 210 L 270 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="90" y="226" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="244" text-anchor="middle" font-size="10" fill="#333">④ 分组计数：GROUP BY category1, category2</text>
  <text x="270" y="260" text-anchor="middle" font-size="10" fill="#666">COUNT(*) AS customer_count</text>
  <path d="M 270 270 L 270 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="270,286 392,322 270,358 148,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="10.5" fill="#333">customer_count ≥ 3 ?</text>

  <path d="M 392 322 L 448 322" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="314" text-anchor="middle" font-size="9" fill="#b85450">否</text>
  <rect x="452" y="307" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="484" y="326" text-anchor="middle" font-size="10" fill="#b85450">丢弃</text>

  <path d="M 270 358 L 270 370" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="368" font-size="9" fill="#4a7a3a">是</text>

  <!-- Step 5 -->
  <rect x="90" y="374" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="10" fill="#333">⑤ 排序：ORDER BY customer_count DESC,</text>
  <text x="270" y="408" text-anchor="middle" font-size="10" fill="#666">category1 ASC, category2 ASC</text>
  <path d="M 270 418 L 270 430" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="90" y="434" width="360" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="453" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">输出：category1 | category2 | customer_count</text>
  <text x="270" y="470" text-anchor="middle" font-size="9.5" fill="#4a7a3a">（可报告类别对）</text>

  <!-- Side annotation -->
  <rect x="16" y="160" width="60" height="50" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="46" y="178" text-anchor="middle" font-size="8" fill="#666">中间行</text>
  <text x="46" y="192" text-anchor="middle" font-size="8" fill="#666">P = Σ C(k,2)</text>
</svg>
