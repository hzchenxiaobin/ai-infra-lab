<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：分组取最大后，两数绝对差 = MAX − MIN</text>

  <!-- ===== Engineering group ===== -->
  <rect x="36" y="40" width="200" height="168" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="136" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Engineering（6 行）</text>
  <rect x="46" y="70" width="86" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="89" y="86" text-anchor="middle" font-size="9" fill="#333">50,000</text>
  <rect x="142" y="70" width="86" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="86" text-anchor="middle" font-size="9" fill="#333">45,000</text>
  <rect x="46" y="100" width="86" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="89" y="116" text-anchor="middle" font-size="9" fill="#333">85,000</text>
  <rect x="142" y="100" width="86" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102,000 ★</text>
  <rect x="46" y="130" width="86" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="89" y="146" text-anchor="middle" font-size="9" fill="#333">44,000</text>
  <rect x="142" y="130" width="86" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="146" text-anchor="middle" font-size="9" fill="#333">32,000</text>
  <text x="136" y="182" text-anchor="middle" font-size="9" fill="#446688">GROUP BY 后折叠为一行</text>

  <!-- ===== Marketing group ===== -->
  <rect x="344" y="40" width="200" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="444" y="60" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Marketing（4 行）</text>
  <rect x="354" y="70" width="86" height="24" fill="#fff" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="397" y="86" text-anchor="middle" font-size="9" fill="#333">30,000</text>
  <rect x="450" y="70" width="86" height="24" fill="#fff" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="493" y="86" text-anchor="middle" font-size="9" fill="#333">34,000</text>
  <rect x="354" y="100" width="86" height="24" fill="#fff" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="397" y="116" text-anchor="middle" font-size="9" fill="#333">42,000</text>
  <rect x="450" y="100" width="86" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="493" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">53,000 ★</text>
  <text x="444" y="182" text-anchor="middle" font-size="9" fill="#d6a040">GROUP BY 后折叠为一行</text>

  <!-- ===== Middle note ===== -->
  <rect x="252" y="56" width="80" height="130" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="292" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">技巧</text>
  <text x="292" y="94" text-anchor="middle" font-size="9" fill="#666">两个数的</text>
  <text x="292" y="110" text-anchor="middle" font-size="9" fill="#666">绝对差</text>
  <text x="292" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">= 大 − 小</text>
  <text x="292" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">= MAX−MIN</text>
  <text x="292" y="164" text-anchor="middle" font-size="9" fill="#666">天然非负</text>
  <text x="292" y="180" text-anchor="middle" font-size="9" fill="#666">免写 ABS</text>

  <!-- ===== Arrows down to MAX pills ===== -->
  <path d="M 136 208 L 136 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 208 L 444 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- MAX pills -->
  <rect x="86" y="228" width="100" height="28" fill="#fff" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="136" y="246" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">MAX(salary)</text>
  <rect x="394" y="228" width="100" height="28" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="444" y="246" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">MAX(salary)</text>

  <!-- Arrows down to value chips -->
  <path d="M 136 256 L 136 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 256 L 444 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Value chips -->
  <rect x="81" y="276" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="136" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">102,000</text>
  <rect x="389" y="276" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="444" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">53,000</text>

  <!-- Converge arrows to result -->
  <path d="M 136 306 C 136 336, 190 344, 238 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 306 C 444 336, 390 344, 342 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="180" y="326" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">|102,000 − 53,000|</text>
  <text x="290" y="362" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">= 49,000</text>

  <!-- Bottom-left note -->
  <rect x="36" y="330" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="101" y="348" text-anchor="middle" font-size="9" fill="#b85450">外层再聚合一次：</text>
  <text x="101" y="366" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">MAX(s) − MIN(s)</text>

  <!-- Bottom-right note -->
  <rect x="414" y="330" width="130" height="48" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="479" y="348" text-anchor="middle" font-size="9" fill="#666">输出单行单列</text>
  <text x="479" y="366" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">salary_difference</text>
</svg>
