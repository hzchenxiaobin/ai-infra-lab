<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：奇数层正序、偶数层逆序，镜像对求父节点</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">第 h 层范围 [2^(h−1), 2^h − 1]，镜像 mirror = 2^(h−1) + 2^h − 1 − label</text>

  <!-- ===== Level 1: [1] ===== -->
  <circle cx="310" cy="78" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="310" y="83" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="340" y="76" font-size="10" fill="#b85450">L1 正序</text>

  <!-- edges L1->L2 -->
  <line x1="296" y1="92" x2="240" y2="128" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="324" y1="92" x2="380" y2="128" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Level 2: [3, 2] (reversed) ===== -->
  <circle cx="240" cy="142" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="147" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <circle cx="380" cy="142" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="147" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <text x="410" y="140" font-size="10" fill="#446688">L2 逆序 ←</text>
  <text x="310" y="160" text-anchor="middle" font-size="9" fill="#aaa">正常顺序应为 2, 3</text>

  <!-- reverse arrow for L2 -->
  <path d="M 396 138 L 224 138" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- edges L2->L3 -->
  <line x1="226" y1="156" x2="170" y2="198" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="254" y1="156" x2="250" y2="198" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="366" y1="156" x2="370" y2="198" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="394" y1="156" x2="450" y2="198" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- ===== Level 3: [4,5,6,7] (normal) ===== -->
  <circle cx="170" cy="212" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="170" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <circle cx="250" cy="212" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="250" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>

  <circle cx="370" cy="212" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="370" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <circle cx="450" cy="212" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="450" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>

  <text x="490" y="210" font-size="10" fill="#4a7a3a">L3 正序 →</text>

  <!-- edges L3->L4 (partial: 4->8,9; 7->14,15) -->
  <line x1="158" y1="226" x2="135" y2="266" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="182" y1="226" x2="200" y2="266" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="226" x2="420" y2="266" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="462" y1="226" x2="485" y2="266" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Level 4: [15,14,...,8] (reversed) -- show 4 key nodes ===== -->
  <!-- 15 (leftmost in zigzag = rightmost in normal) -->
  <rect x="118" y="262" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="281" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">15</text>

  <!-- 14 highlighted -->
  <rect x="183" y="262" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="200" y="281" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">14</text>

  <!-- dots -->
  <text x="310" y="280" text-anchor="middle" font-size="14" fill="#aaa" letter-spacing="2">· · ·</text>

  <!-- 9 -->
  <rect x="403" y="262" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="281" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">9</text>

  <!-- 8 (rightmost in zigzag = leftmost in normal) -->
  <rect x="468" y="262" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="281" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8</text>

  <text x="510" y="280" font-size="10" fill="#446688">L4 逆序 ←</text>

  <!-- ===== Mirror illustration for L4 ===== -->
  <!-- Show mirror pair: 14 <-> 9 -->
  <path d="M 200 296 Q 310 330 420 296" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="310" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mirror: 8 + 15 − 14 = 9</text>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="350" width="540" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="374" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">第 h 层镜像公式</text>
  <text x="310" y="396" text-anchor="middle" font-size="13" fill="#333">mirror = 2^(h−1) + 2^h − 1 − label</text>
  <text x="310" y="416" text-anchor="middle" font-size="11" fill="#666">例：L4 中 label=14 → mirror = 8 + 15 − 1 − 14 = 8 + 15 − 1 − 14</text>
  <text x="310" y="432" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">关键：mirror / 2 即为父节点的 zigzag 标签</text>
</svg>
