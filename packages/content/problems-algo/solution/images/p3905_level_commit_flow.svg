<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：分层多源 BFS × 整层取 max 提交</text>

  <!-- 初始化 -->
  <rect x="105" y="34" width="220" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="54" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">初始化：grid 清零，源格赋色并入队</text>

  <path d="M 215 66 L 215 84" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断：队列空？ -->
  <polygon points="215,88 292,118 215,148 138,118" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="122" text-anchor="middle" font-size="11.5" fill="#8c3a35" font-weight="bold" filter="url(#rough2)">队列空？</text>

  <!-- 是 → 返回 -->
  <path d="M 292 118 L 384 118" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="312" y="111" font-size="10" fill="#555" filter="url(#rough2)">是</text>
  <rect x="390" y="102" width="98" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="439" y="122" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">返回 grid</text>

  <!-- 否 ↓ -->
  <path d="M 215 148 L 215 164" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="224" y="162" font-size="10" fill="#555" filter="url(#rough2)">否</text>

  <!-- 出队当前层 -->
  <rect x="105" y="168" width="220" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="187" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">当前层全部出队（frontier）</text>

  <path d="M 215 198 L 215 210" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 提案 -->
  <rect x="105" y="214" width="220" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="233" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">逐格向 4 方向未着色邻居提案</text>

  <path d="M 215 244 L 215 254" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 候选取 max（关键步） -->
  <rect x="105" y="258" width="220" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="277" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">同格多个提案 → 候选表取 max</text>

  <path d="M 215 288 L 215 300" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 整层提交 -->
  <rect x="90" y="304" width="250" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="324" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">整层提交：候选格赋色并入队 = 下一层</text>

  <!-- 循环回边 -->
  <path d="M 90 320 L 40 320 L 40 118 L 132 118" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="32" y="219" transform="rotate(-90 32 219)" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">下一时间步</text>

  <!-- 候选表说明 -->
  <rect x="372" y="168" width="136" height="96" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="440" y="188" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">候选表 nxt</text>
  <text x="382" y="206" font-size="9.5" fill="#666" filter="url(#rough2)">key = 格子坐标 (r,c)</text>
  <text x="382" y="222" font-size="9.5" fill="#666" filter="url(#rough2)">value = 本层收到提案</text>
  <text x="382" y="238" font-size="9.5" fill="#666" filter="url(#rough2)">中的最大颜色</text>
  <text x="382" y="254" font-size="9.5" fill="#666" filter="url(#rough2)">（整层提交后清空）</text>
  <path d="M 372 240 L 328 268" fill="none" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
</svg>
