<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGry" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#aaa"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 3, 6]，答案 = 2</text>

  <!-- nums index legend -->
  <text x="30" y="50" font-size="11" fill="#888" filter="url(#rough2)">下标 →</text>
  <rect x="86" y="36" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0 : 2</text>
  <rect x="148" y="36" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1 : 3</text>
  <rect x="210" y="36" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2 : 6</text>

  <!-- ================= layer 1: 起点 ================= -->
  <text x="30" y="92" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点</text>
  <text x="30" y="106" font-size="9" fill="#888" filter="url(#rough2)">mask=单元素</text>
  <!-- three start nodes -->
  <rect x="86" y="86" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="116" y="103" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">mask=001</text>
  <text x="116" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">[2]</text>

  <rect x="148" y="86" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="178" y="103" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">mask=010</text>
  <text x="178" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">[3]</text>

  <rect x="210" y="86" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="240" y="103" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">mask=100</text>
  <text x="240" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">[6]</text>

  <!-- ================= layer 2: 两个元素 ================= -->
  <text x="30" y="158" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第二位</text>
  <text x="30" y="172" font-size="9" fill="#888" filter="url(#rough2)">检查相邻整除</text>

  <rect x="86" y="150" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="116" y="167" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">mask=101</text>
  <text x="116" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">[2,6]</text>

  <rect x="148" y="150" width="60" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" rx="5" filter="url(#rough2)"/>
  <text x="178" y="167" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">不可达</text>
  <text x="178" y="182" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">2∤3</text>

  <rect x="210" y="150" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="240" y="167" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">mask=110</text>
  <text x="240" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">[3,6]</text>

  <!-- arrows layer1->layer2 -->
  <!-- [2] -> [2,6]: 6%2==0 ok -->
  <path d="M 116 126 L 116 148" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="124" y="140" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6%2=0</text>

  <!-- [2]->[2,3] blocked: 2∤3 -->
  <path d="M 130 126 Q 160 134 168 148" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrGry)" filter="url(#rough2)"/>
  <text x="150" y="138" font-size="9" fill="#aaa" filter="url(#rough2)">2∤3 ✗</text>

  <!-- [3]->[3,6]: 6%3==0 ok -->
  <path d="M 178 126 Q 210 134 222 148" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="206" y="140" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6%3=0</text>

  <!-- [6]->[2,6]: 6%2==0 ok (reverse, from right node to left-2 node) -->
  <path d="M 222 126 Q 190 140 130 148" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- [6]->[3,6]: 6%3==0 ok -->
  <path d="M 240 126 L 240 148" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ================= layer 3: 三个元素 ================= -->
  <text x="30" y="222" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">第三位</text>
  <text x="30" y="236" font-size="9" fill="#888" filter="url(#rough2)">mask=111</text>

  <rect x="86" y="214" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="116" y="231" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">mask=111</text>
  <text x="116" y="246" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">末位=2</text>

  <rect x="148" y="214" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="178" y="231" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">mask=111</text>
  <text x="178" y="246" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">末位=3</text>

  <rect x="210" y="214" width="60" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" rx="5" filter="url(#rough2)"/>
  <text x="240" y="231" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">不可达</text>
  <text x="240" y="246" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">6∤2✗反过来?</text>

  <!-- arrows layer2->layer3 -->
  <!-- [2,6] last=6 -> place 3: 6%3=0 -> 末位=3 -->
  <path d="M 116 190 Q 150 200 168 214" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="132" y="206" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">6%3=0</text>

  <!-- [2,6] last=6 -> place 3 only; [2,6] last=2 can't place 3 (2∤3) -->
  <!-- [3,6] last=6 -> place 2: 6%2=0 -> 末位=2 -->
  <path d="M 240 190 Q 200 200 130 214" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="208" y="206" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">6%2=0</text>

  <!-- result -->
  <rect x="60" y="276" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="160" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[111][末位=2] = 1</text>
  <text x="160" y="310" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">来自 [3,6] → 加 2</text>

  <rect x="300" y="276" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[111][末位=3] = 1</text>
  <text x="400" y="310" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">来自 [2,6] → 加 3</text>

  <!-- answer -->
  <rect x="140" y="332" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = 1 + 1 + 0 = 2 ⭐</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">两条路径：[2,6,3] 与 [3,6,2]</text>

  <!-- note -->
  <rect x="40" y="388" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">6 是 2、3 的公倍数，做「中转」才让两端能接上——这正是 last 维的作用</text>
</svg>
