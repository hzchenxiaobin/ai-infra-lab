<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">同源字符串检测：算法决策流程</text>

  <!-- ===== Start ===== -->
  <ellipse cx="320" cy="50" rx="60" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(i, j, k)</text>

  <line x1="320" y1="68" x2="320" y2="84" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Base case check ===== -->
  <polygon points="320,86 410,110 320,134 230,110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="108" text-anchor="middle" font-size="9" fill="#444">i==n1 且</text>
  <text x="320" y="120" text-anchor="middle" font-size="9" fill="#444">j==n2 ?</text>

  <!-- Yes -->
  <line x1="410" y1="110" x2="460" y2="110" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="420" y="104" font-size="9" fill="#4a7a3a">是</text>
  <rect x="460" y="96" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="505" y="114" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">return k==0</text>

  <!-- No -->
  <line x1="320" y1="134" x2="320" y2="150" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="146" font-size="9" fill="#888">否</text>

  <!-- ===== k check ===== -->
  <polygon points="320,152 410,178 320,204 230,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="174" text-anchor="middle" font-size="10" fill="#444">k ?</text>
  <text x="320" y="186" text-anchor="middle" font-size="8" fill="#888">(查 memo)</text>

  <!-- k == 0 -->
  <line x1="230" y1="178" x2="130" y2="178" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="172" font-size="9" fill="#446688" font-weight="bold">k = 0</text>

  <!-- k > 0 -->
  <line x1="320" y1="204" x2="320" y2="230" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="222" font-size="9" fill="#b85450" font-weight="bold">k &gt; 0</text>

  <!-- k < 0 -->
  <line x1="410" y1="178" x2="510" y2="178" stroke="#d6a040" stroke-width="1.3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="440" y="172" font-size="9" fill="#d6a040" font-weight="bold">k &lt; 0</text>

  <!-- ===== k=0 branch (left) ===== -->
  <rect x="30" y="200" width="200" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="220" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">k=0：双方同步消费</text>
  <text x="130" y="238" text-anchor="middle" font-size="9" fill="#555">字母+字母 → 须相等 → (i+1,j+1,0)</text>
  <text x="130" y="252" text-anchor="middle" font-size="9" fill="#555">字母+数字 → s2解析v → (i+1,j+l,1-v)</text>
  <text x="130" y="266" text-anchor="middle" font-size="9" fill="#555">数字+字母 → s1解析v → (i+l,j+1,v-1)</text>
  <text x="130" y="280" text-anchor="middle" font-size="9" fill="#555">数字+数字 → 枚举v1,v2 → (i+l1,j+l2,v1-v2)</text>
  <text x="130" y="296" text-anchor="middle" font-size="8" fill="#b85450">一方耗尽 → return false</text>

  <!-- ===== k>0 branch (center) ===== -->
  <rect x="210" y="232" width="220" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="252" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">k&gt;0：s2 追赶，s1 冻结</text>
  <text x="320" y="270" text-anchor="middle" font-size="9" fill="#555">j==n2 → return false（无法追赶）</text>
  <text x="320" y="284" text-anchor="middle" font-size="9" fill="#555">s2[j] 字母 → (i, j+1, k-1)</text>
  <text x="320" y="298" text-anchor="middle" font-size="9" fill="#555">s2[j] 数字 → 解析v → (i, j+l, k-v)</text>
  <text x="320" y="312" text-anchor="middle" font-size="8" fill="#4a7a3a">字母无约束（待匹配字符来自数字）</text>

  <!-- ===== k<0 branch (right) ===== -->
  <rect x="450" y="200" width="180" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="540" y="220" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">k&lt;0：s1 追赶，s2 冻结</text>
  <text x="540" y="238" text-anchor="middle" font-size="9" fill="#555">i==n1 → return false</text>
  <text x="540" y="252" text-anchor="middle" font-size="9" fill="#555">s1[i] 字母 → (i+1, j, k+1)</text>
  <text x="540" y="266" text-anchor="middle" font-size="9" fill="#555">s1[i] 数字 → 解析v → (i+l, j, k+v)</text>
  <text x="540" y="284" text-anchor="middle" font-size="8" fill="#888">（与 k&gt;0 对称）</text>

  <!-- ===== Merge: record memo ===== -->
  <line x1="130" y1="310" x2="280" y2="360" stroke="#666" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="320" y1="322" x2="320" y2="360" stroke="#666" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="540" y1="310" x2="360" y2="360" stroke="#666" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="220" y="362" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="382" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">memo[i][j][k] = 结果</text>
  <text x="320" y="394" text-anchor="middle" font-size="8" fill="#888">0=未访问 / 1=false / 2=true</text>

  <line x1="320" y1="398" x2="320" y2="420" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Return ===== -->
  <ellipse cx="320" cy="438" rx="50" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="442" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return 结果</text>

  <!-- ===== Bottom: number parsing note ===== -->
  <rect x="30" y="470" width="580" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="490" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">数字解析：从 pos 起枚举 1-3 位连续数字</text>
  <text x="320" y="508" text-anchor="middle" font-size="10" fill="#555">"123" → (len=1, v=1), (len=2, v=12), (len=3, v=123)</text>
  <text x="320" y="524" text-anchor="middle" font-size="9" fill="#888">每种解析 → 不同的 (len, value) → 不同的状态转移分支</text>
</svg>
