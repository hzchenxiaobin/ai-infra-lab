<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：桶 DP 处理 nums = [2,1,3,2,1]</text>

  <!-- table outline -->
  <rect x="20" y="56" width="520" height="208" fill="none" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="20" y="56" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="84" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="140" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f1</text>
  <text x="204" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">f2</text>
  <text x="268" y="74" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">f3</text>
  <text x="420" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">本步转移</text>

  <!-- column separators -->
  <path d="M60,56 L60,264" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M108,56 L108,264" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M172,56 L172,264" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M236,56 L236,264" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M300,56 L300,264" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- row separators -->
  <path d="M20,84 L540,84" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M20,114 L540,114" stroke="#999" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M20,144 L540,144" stroke="#999" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M20,174 L540,174" stroke="#999" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M20,204 L540,204" stroke="#999" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M20,234 L540,234" stroke="#999" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 0: init -->
  <text x="40" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="84" y="104" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">–</text>
  <text x="140" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="204" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="268" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="420" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">初始：三个桶都空</text>

  <!-- row 1: x=2 -->
  <text x="40" y="134" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="84" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="140" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="172" y="114" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="268" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="420" y="134" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">f2 = max(f1, f2) + 1 = 1</text>

  <!-- row 2: x=1 -->
  <text x="40" y="164" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="84" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="108" y="144" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="204" y="164" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="268" y="164" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="420" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">f1 += 1 → 1</text>

  <!-- row 3: x=3 -->
  <text x="40" y="194" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="84" y="194" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="140" y="194" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="204" y="194" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <rect x="236" y="174" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="420" y="194" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">f3 = max(1, 1, 0) + 1 = 2</text>

  <!-- row 4: x=2 -->
  <text x="40" y="224" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="84" y="224" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="140" y="224" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <rect x="172" y="204" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="268" y="224" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="420" y="224" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">f2 = max(1, 1) + 1 = 2</text>

  <!-- row 5: x=1 -->
  <text x="40" y="254" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="84" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="108" y="234" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="204" y="254" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="268" y="254" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="420" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">f1 += 1 → 2</text>

  <!-- conclusion -->
  <rect x="60" y="282" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max(f1, f2, f3) = 2 → ans = 5 − 2 = 3 ✓</text>

  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">黄底高亮 = 本步被更新的桶；旧值灰色、新值加粗</text>
</svg>
