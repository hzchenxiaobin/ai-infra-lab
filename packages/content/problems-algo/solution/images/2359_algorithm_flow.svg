<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">单链行走 + 取最大 算法流程</text>

  <!-- Step 1: walk from node1 -->
  <rect x="120" y="48" width="300" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 从 node1 单链行走，填 dist1[]</text>
  <text x="270" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cur=node1, d=0; 沿 edges[cur] 前进</text>
  <text x="270" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">未访问 &amp;&amp; cur≠-1 → 记 dist1[cur]=d, d++, cur=edges[cur]</text>
  <line x1="270" y1="110" x2="270" y2="132" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: walk from node2 -->
  <rect x="120" y="136" width="300" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">② 从 node2 单链行走，填 dist2[]</text>
  <text x="270" y="176" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cur=node2, d=0; 沿 edges[cur] 前进</text>
  <text x="270" y="190" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同上：遇已访问或 -1 即停（自动处理环）</text>
  <line x1="270" y1="198" x2="270" y2="220" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: scan & take max -->
  <rect x="100" y="224" width="340" height="62" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 逐点扫描，取两距离的最大值</text>
  <text x="270" y="264" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">对 i=0..n-1：若 dist1[i]≠-1 &amp;&amp; dist2[i]≠-1</text>
  <text x="270" y="278" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">算 m = max(dist1[i], dist2[i])</text>
  <line x1="270" y1="286" x2="270" y2="308" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: track min -->
  <rect x="100" y="312" width="340" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">④ 维护最小最大值，记录节点编号</text>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">m &lt; best → best=m, ans=i</text>
  <text x="270" y="365" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">严格 &lt; 保证多解取编号最小（升序遍历先到先得）</text>
  <line x1="270" y1="368" x2="270" y2="390" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <rect x="210" y="394" width="120" height="24" rx="12" fill="#b85450" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="410" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans / -1</text>

  <!-- Side notes -->
  <text x="436" y="78" font-size="11" fill="#446688" filter="url(#rough2)">O(n)</text>
  <text x="436" y="94" font-size="10" fill="#999" filter="url(#rough2)">至多 n 步</text>
  <text x="436" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">O(n)</text>
  <text x="436" y="182" font-size="10" fill="#999" filter="url(#rough2)">至多 n 步</text>
  <text x="436" y="254" font-size="11" fill="#d6a040" filter="url(#rough2)">O(n)</text>
  <text x="30" y="80" font-size="11" fill="#446688" filter="url(#rough2)">关键：</text>
  <text x="30" y="96" font-size="10" fill="#666" filter="url(#rough2)">出度≤1</text>
  <text x="30" y="110" font-size="10" fill="#666" filter="url(#rough2)">路径唯一</text>
  <text x="30" y="420" font-size="10" fill="#666" filter="url(#rough2)">无人队/入度数组，只需 while 沿唯一后继走</text>
</svg>
