<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">字母板：位置公式 r=(ch−'a')÷5, c=(ch−'a')%5；z 是唯一陷阱</text>

  <!-- ===== Board grid (left) ===== -->
  <text x="40" y="56" font-size="11" fill="#446688" font-weight="bold">字母板布局</text>

  <!-- column labels -->
  <text x="92" y="74" text-anchor="middle" font-size="9" fill="#bbb">c=0</text>
  <text x="134" y="74" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="176" y="74" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="218" y="74" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="260" y="74" text-anchor="middle" font-size="9" fill="#bbb">4</text>

  <!-- row labels -->
  <text x="64" y="100" text-anchor="middle" font-size="9" fill="#bbb">r=0</text>
  <text x="64" y="134" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="64" y="168" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="64" y="202" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="64" y="236" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="64" y="270" text-anchor="middle" font-size="9" fill="#bbb">5</text>

  <!-- Row 0: a b c d e -->
  <rect x="72" y="86" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="114" y="86" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="134" y="108" text-anchor="middle" font-size="12" fill="#888">b</text>
  <rect x="156" y="86" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="176" y="108" text-anchor="middle" font-size="12" fill="#888">c</text>
  <rect x="198" y="86" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="108" text-anchor="middle" font-size="12" fill="#888">d</text>
  <rect x="240" y="86" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="12" fill="#888">e</text>

  <!-- Row 1: f g h i j -->
  <rect x="72" y="120" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="92" y="142" text-anchor="middle" font-size="12" fill="#888">f</text>
  <rect x="114" y="120" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="134" y="142" text-anchor="middle" font-size="12" fill="#888">g</text>
  <rect x="156" y="120" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="176" y="142" text-anchor="middle" font-size="12" fill="#888">h</text>
  <rect x="198" y="120" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="142" text-anchor="middle" font-size="12" fill="#888">i</text>
  <rect x="240" y="120" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#888">j</text>

  <!-- Row 2: k l m n o -->
  <rect x="72" y="154" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="92" y="176" text-anchor="middle" font-size="12" fill="#888">k</text>
  <rect x="114" y="154" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="134" y="176" text-anchor="middle" font-size="12" fill="#888">l</text>
  <rect x="156" y="154" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="176" y="176" text-anchor="middle" font-size="12" fill="#888">m</text>
  <rect x="198" y="154" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="176" text-anchor="middle" font-size="12" fill="#888">n</text>
  <rect x="240" y="154" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#888">o</text>

  <!-- Row 3: p q r s t -->
  <rect x="72" y="188" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="92" y="210" text-anchor="middle" font-size="12" fill="#888">p</text>
  <rect x="114" y="188" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="134" y="210" text-anchor="middle" font-size="12" fill="#888">q</text>
  <rect x="156" y="188" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="176" y="210" text-anchor="middle" font-size="12" fill="#888">r</text>
  <rect x="198" y="188" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="210" text-anchor="middle" font-size="12" fill="#888">s</text>
  <rect x="240" y="188" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="12" fill="#888">t</text>

  <!-- Row 4: u v w x y -->
  <rect x="72" y="222" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="92" y="244" text-anchor="middle" font-size="12" fill="#888">u</text>
  <rect x="114" y="222" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="134" y="244" text-anchor="middle" font-size="12" fill="#888">v</text>
  <rect x="156" y="222" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="176" y="244" text-anchor="middle" font-size="12" fill="#888">w</text>
  <rect x="198" y="222" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="244" text-anchor="middle" font-size="12" fill="#888">x</text>
  <rect x="240" y="222" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="12" fill="#888">y</text>

  <!-- Row 5: z (only 1 cell) -->
  <rect x="72" y="256" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">z</text>
  <!-- ghost cells for row 5 (non-existent) -->
  <rect x="114" y="256" width="40" height="32" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="134" y="278" text-anchor="middle" font-size="10" fill="#ccc">✗</text>
  <rect x="156" y="256" width="40" height="32" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="176" y="278" text-anchor="middle" font-size="10" fill="#ccc">✗</text>
  <rect x="198" y="256" width="40" height="32" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="218" y="278" text-anchor="middle" font-size="10" fill="#ccc">✗</text>
  <rect x="240" y="256" width="40" height="32" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#ccc">✗</text>

  <text x="166" y="306" text-anchor="middle" font-size="10" fill="#b85450">第 5 行仅有 z 一格，其余位置不存在</text>

  <!-- ===== Formula box (right) ===== -->
  <rect x="310" y="86" width="210" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">字符 → 坐标</text>
  <text x="415" y="128" text-anchor="middle" font-size="11" fill="#333">r = (ch − 'a') ÷ 5</text>
  <text x="415" y="144" text-anchor="middle" font-size="11" fill="#333">c = (ch − 'a') % 5</text>
  <text x="415" y="166" text-anchor="middle" font-size="10" fill="#d6a040">例: 'l' → (11÷5, 11%5) = (2,1)</text>

  <!-- start box -->
  <rect x="310" y="190" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">起点恒为 (0,0) = 'a'</text>
  <text x="415" y="228" text-anchor="middle" font-size="10" fill="#555">逐字符移动，每到位追加 '!'</text>
  <text x="415" y="240" text-anchor="middle" font-size="10" fill="#555">曼哈顿路径即最优</text>

  <!-- ===== Z-trap (bottom) ===== -->
  <path d="M 40 322 L 500 322" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠ z 陷阱：移动顺序不能任意</text>

  <!-- Left: to z -->
  <text x="135" y="368" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">→ z（目标在 z）</text>
  <!-- mini grid 3x3 -->
  <rect x="80" y="378" width="24" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="104" y="378" width="24" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="128" y="378" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="392" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">n</text>
  <rect x="80" y="398" width="24" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="104" y="398" width="24" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="128" y="398" width="24" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="80" y="418" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="432" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">z</text>
  <!-- correct path: L L L D D D -->
  <path d="M 140 388 L 92 388 L 92 428" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="135" y="412" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 先 L 到 c=0，再 D</text>

  <!-- Right: from z -->
  <text x="380" y="368" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">z →（从 z 出发）</text>
  <rect x="325" y="378" width="24" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="349" y="378" width="24" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="373" y="378" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="385" y="392" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">n</text>
  <rect x="325" y="398" width="24" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="349" y="398" width="24" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="373" y="398" width="24" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="325" y="418" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="337" y="432" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">z</text>
  <!-- correct path: U U U R R R -->
  <path d="M 337 428 L 337 388 L 385 388" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="412" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 先 U 离开第5行，再 R</text>
</svg>
