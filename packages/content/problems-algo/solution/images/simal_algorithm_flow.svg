<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="480" height="460" fill="#fafafa"/>

  <text x="240" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程</text>

  <rect x="90" y="52" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 输入 nums、target（长度 n 相等）</text>

  <path d="M240,100 L240,126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="130" width="300" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 按 x mod 2 分奇偶组</text>
  <text x="240" y="176" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums → (no, ne)；target → (to, te)</text>

  <path d="M240,192 L240,218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="222" width="300" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 各组分别升序排序</text>

  <path d="M240,270 L240,296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="300" width="300" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="326" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ 同奇偶组按下标配对 a ↔ b</text>
  <text x="240" y="346" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">若 b &gt; a，累加 (b − a) / 2 到 ans</text>

  <path d="M240,362 L240,388" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="392" width="300" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⑤ 返回 ans（即最少操作次数）</text>
</svg>
