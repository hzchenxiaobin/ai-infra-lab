<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>

  <text x="130" y="24" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">DFS 探索路径</text>

  <!-- Grid: 3x2, cell 50x50 -->
  <!-- (0,0) = start, visit 1 -->
  <rect x="40" y="50" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="73" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">①</text>
  <text x="65" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a">S</text>

  <!-- (0,1) = visit 2 -->
  <rect x="115" y="50" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="73" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">②</text>

  <!-- (0,2) = target, visit 5 -->
  <rect x="190" y="50" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="73" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⑤</text>
  <text x="215" y="90" text-anchor="middle" font-size="10" fill="#b85450">T</text>

  <!-- (1,0) = wall -->
  <rect x="40" y="125" width="50" height="50" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="155" text-anchor="middle" font-size="16" fill="#bbb">#</text>

  <!-- (1,1) = visit 3 -->
  <rect x="115" y="125" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="148" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">③</text>

  <!-- (1,2) = visit 4 -->
  <rect x="190" y="125" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="148" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">④</text>

  <!-- Forward arrows (green, solid) -->
  <path d="M90 70 L115 70" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="102" y="64" text-anchor="middle" font-size="9" fill="#4a7a3a">R</text>

  <path d="M140 100 L140 125" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a">D</text>

  <path d="M165 150 L190 150" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="177" y="144" text-anchor="middle" font-size="9" fill="#4a7a3a">R</text>

  <path d="M215 125 L215 100" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="225" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a">U</text>

  <!-- Backtrack arrows (red, dashed, offset) -->
  <path d="M227 100 L227 125" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="237" y="116" text-anchor="middle" font-size="9" fill="#b85450">D</text>

  <path d="M190 162 L165 162" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="177" y="174" text-anchor="middle" font-size="9" fill="#b85450">L</text>

  <path d="M128 125 L128 100" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="118" y="116" text-anchor="middle" font-size="9" fill="#b85450">U</text>

  <path d="M115 82 L90 82" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="102" y="76" text-anchor="middle" font-size="9" fill="#b85450">L</text>

  <!-- Legend -->
  <path d="M40 210 L70 210" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="80" y="214" font-size="10.5" fill="#4a7a3a">前进 move(d)</text>
  <path d="M180 210 L210 210" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="220" y="214" font-size="10.5" fill="#b85450">回溯 move(oppo)</text>

  <!-- Movement log on right -->
  <rect x="290" y="44" width="210" height="276" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="395" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">前进序列</text>
  <text x="305" y="82" font-size="10.5" fill="#333">① R (0,0)→(0,1)</text>
  <text x="305" y="98" font-size="10.5" fill="#333">② D (0,1)→(1,1)</text>
  <text x="305" y="114" font-size="10.5" fill="#333">③ R (1,1)→(1,2)</text>
  <text x="305" y="130" font-size="10.5" fill="#b85450" font-weight="bold">④ U (1,2)→(0,2) ← 目标!</text>

  <line x1="305" y1="144" x2="485" y2="144" stroke="#ddd" stroke-width="1"/>

  <text x="395" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">回溯序列</text>
  <text x="305" y="182" font-size="10.5" fill="#333">⑤ D (0,2)→(1,2)</text>
  <text x="305" y="198" font-size="10.5" fill="#333">⑥ L (1,2)→(1,1)</text>
  <text x="305" y="214" font-size="10.5" fill="#333">⑦ U (1,1)→(0,1)</text>
  <text x="305" y="230" font-size="10.5" fill="#333">⑧ L (0,1)→(0,0)</text>

  <line x1="305" y1="244" x2="485" y2="244" stroke="#ddd" stroke-width="1"/>

  <text x="395" y="262" text-anchor="middle" font-size="10" fill="#888">每次 move(d) 后递归 DFS</text>
  <text x="395" y="278" text-anchor="middle" font-size="10" fill="#888">递归返回后 move(oppo)</text>
  <text x="395" y="298" text-anchor="middle" font-size="10" fill="#b85450">→ 机器人回到 (0,0)</text>
</svg>
