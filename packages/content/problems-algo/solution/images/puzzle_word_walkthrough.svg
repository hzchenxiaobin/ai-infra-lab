<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：puzzle = "actresz"</text>

  <!-- puzzle chips -->
  <text x="40" y="60" font-size="12" fill="#333" filter="url(#rough2)">puzzle: actresz</text>
  <rect x="120" y="44" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="134" y="62" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">a</text>
  <rect x="152" y="44" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="166" y="62" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#rough2)">c</text>
  <rect x="184" y="44" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="198" y="62" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#rough2)">t</text>
  <rect x="216" y="44" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="62" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#rough2)">r</text>
  <rect x="248" y="44" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="262" y="62" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#rough2)">e</text>
  <rect x="280" y="44" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="294" y="62" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#rough2)">s</text>
  <rect x="312" y="44" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="326" y="62" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#rough2)">z</text>
  <text x="360" y="60" font-size="11" fill="#8a6a20" filter="url(#rough2)">首字母 a，rest = {c,t,r,e,s,z}</text>

  <!-- arrow down -->
  <path d="M 280 78 L 280 94" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- enumerate 64 subsets, only 4 hit freq table -->
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">枚举 64 个「含 a」子集，查 freq 表：</text>

  <!-- hit rows -->
  <rect x="60" y="124" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="76" y="143" font-size="11" fill="#3a5a2a" filter="url(#rough2)">sub={ }</text>
  <text x="150" y="143" font-size="11" fill="#3a5a2a" filter="url(#rough2)">→ candidate={a}</text>
  <text x="290" y="143" font-size="11" fill="#3a5a2a" filter="url(#rough2)">命中 "aaaa"  freq=1</text>
  <text x="450" y="143" font-size="11" fill="#3a5a2a" filter="url(#rough2)">+1</text>

  <rect x="60" y="156" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="76" y="175" font-size="11" fill="#3a5a2a" filter="url(#rough2)">sub={s}</text>
  <text x="150" y="175" font-size="11" fill="#3a5a2a" filter="url(#rough2)">→ candidate={a,s}</text>
  <text x="290" y="175" font-size="11" fill="#3a5a2a" filter="url(#rough2)">命中 "asas"  freq=1</text>
  <text x="450" y="175" font-size="11" fill="#3a5a2a" filter="url(#rough2)">+1</text>

  <rect x="60" y="188" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="76" y="207" font-size="11" fill="#3a5a2a" filter="url(#rough2)">sub={c,t}</text>
  <text x="150" y="207" font-size="11" fill="#3a5a2a" filter="url(#rough2)">→ candidate={a,c,t}</text>
  <text x="290" y="207" font-size="11" fill="#3a5a2a" filter="url(#rough2)">命中 "actt"  freq=1</text>
  <text x="450" y="207" font-size="11" fill="#3a5a2a" filter="url(#rough2)">+1</text>

  <rect x="60" y="220" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="76" y="239" font-size="11" fill="#3a5a2a" filter="url(#rough2)">sub={c,e,s}</text>
  <text x="150" y="239" font-size="11" fill="#3a5a2a" filter="url(#rough2)">→ candidate={a,c,e,s}</text>
  <text x="290" y="239" font-size="11" fill="#3a5a2a" filter="url(#rough2)">命中 "access" freq=1</text>
  <text x="450" y="239" font-size="11" fill="#3a5a2a" filter="url(#rough2)">+1</text>

  <!-- miss rows (collapsed) -->
  <rect x="60" y="252" width="440" height="20" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">其余 60 个子集：freq = 0，累加 0</text>

  <!-- arrow down to total -->
  <path d="M 280 280 L 280 296" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- total -->
  <rect x="160" y="300" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="13" fill="#8a3a3a" filter="url(#rough2)">answer = 1+1+1+1 = 4</text>

  <!-- excluded words note -->
  <rect x="40" y="350" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">为何 "able" / "ability" / "actor" 不算？</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">"able"={a,b,e,l}：b、l 不在 puzzle → 非子集</text>
  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">"actor"={a,c,t,o,r}：o 不在 puzzle → 非子集</text>
  <text x="280" y="422" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">（枚举时它们的掩码不在 64 个候选中，freq 自然为 0）</text>
</svg>
