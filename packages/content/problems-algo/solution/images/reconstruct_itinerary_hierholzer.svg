<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">Hierholzer：后序入栈 + 整体逆序 = 欧拉路径</text>
  <path d="M 225 44 Q 380 52 535 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ① forward recursion chain -->
  <text x="40" y="84" font-size="12" font-weight="bold" fill="#446688">① DFS 深入：贪心选字典序最小的出边继续递归</text>

  <!-- frames centers 80,200,320,440,560,680 at y=108 -->
  <g filter="url(#rough2)"><rect x="40" y="108" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="80" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b">JFK</text>
  <g filter="url(#rough2)"><rect x="160" y="108" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="200" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b">ATL</text>
  <g filter="url(#rough2)"><rect x="280" y="108" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="320" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b">JFK</text>
  <g filter="url(#rough2)"><rect x="400" y="108" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="440" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b">SFO</text>
  <g filter="url(#rough2)"><rect x="520" y="108" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="560" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b">ATL</text>
  <g filter="url(#rough2)"><rect x="640" y="108" width="80" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="680" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a2b28">SFO</text>

  <path d="M 122 128 L 158 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 242 128 L 278 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 362 128 L 398 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 482 128 L 518 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 602 128 L 638 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="680" y="166" text-anchor="middle" font-size="10" fill="#b85450">无出边·死胡同</text>

  <!-- ② push on unwind -->
  <text x="40" y="200" font-size="12" font-weight="bold" fill="#4a7a3a">② 回退时入栈：耗尽出边的节点先入栈（= 路径末端段）</text>

  <!-- dashed down lines -->
  <path d="M 80 150 L 80 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 200 150 L 200 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 320 150 L 320 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 440 150 L 440 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 560 150 L 560 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 680 150 L 680 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- push badges ⑥⑤④③②① left→right -->
  <g filter="url(#rough2)"><circle cx="80" cy="226" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="80" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">⑥</text>
  <g filter="url(#rough2)"><circle cx="200" cy="226" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="200" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">⑤</text>
  <g filter="url(#rough2)"><circle cx="320" cy="226" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">④</text>
  <g filter="url(#rough2)"><circle cx="440" cy="226" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="440" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">③</text>
  <g filter="url(#rough2)"><circle cx="560" cy="226" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="560" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">②</text>
  <g filter="url(#rough2)"><circle cx="680" cy="226" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="680" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">①</text>

  <!-- ③ ans stack (build order ①→⑥ left→right) -->
  <text x="40" y="276" font-size="12" font-weight="bold" fill="#444">③ ans（按入栈顺序，① 最先）：</text>
  <g filter="url(#rough2)"><rect x="40" y="288" width="680" height="46" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/></g>

  <g filter="url(#rough2)"><rect x="50" y="296" width="88" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="94" y="316" text-anchor="middle" font-size="12" fill="#2e6e2e">SFO ①</text>
  <g filter="url(#rough2)"><rect x="158" y="296" width="88" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="202" y="316" text-anchor="middle" font-size="12" fill="#2e6e2e">ATL ②</text>
  <g filter="url(#rough2)"><rect x="266" y="296" width="88" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="310" y="316" text-anchor="middle" font-size="12" fill="#2e6e2e">SFO ③</text>
  <g filter="url(#rough2)"><rect x="374" y="296" width="88" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="418" y="316" text-anchor="middle" font-size="12" fill="#2e6e2e">JFK ④</text>
  <g filter="url(#rough2)"><rect x="482" y="296" width="88" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="526" y="316" text-anchor="middle" font-size="12" fill="#2e6e2e">ATL ⑤</text>
  <g filter="url(#rough2)"><rect x="590" y="296" width="88" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="634" y="316" text-anchor="middle" font-size="12" fill="#2e6e2e">JFK ⑥</text>

  <!-- ④ reverse arrow + final -->
  <text x="40" y="358" font-size="12" font-weight="bold" fill="#b85450">④ reverse(ans) → 最终行程：</text>
  <path d="M 380 338 L 380 354" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="50" y="368" width="88" height="30" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="94" y="388" text-anchor="middle" font-size="12" fill="#7a2b28">JFK</text>
  <g filter="url(#rough2)"><rect x="158" y="368" width="88" height="30" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="202" y="388" text-anchor="middle" font-size="12" fill="#7a2b28">ATL</text>
  <g filter="url(#rough2)"><rect x="266" y="368" width="88" height="30" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="310" y="388" text-anchor="middle" font-size="12" fill="#7a2b28">JFK</text>
  <g filter="url(#rough2)"><rect x="374" y="368" width="88" height="30" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="418" y="388" text-anchor="middle" font-size="12" fill="#7a2b28">SFO</text>
  <g filter="url(#rough2)"><rect x="482" y="368" width="88" height="30" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="526" y="388" text-anchor="middle" font-size="12" fill="#7a2b28">ATL</text>
  <g filter="url(#rough2)"><rect x="590" y="368" width="88" height="30" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="634" y="388" text-anchor="middle" font-size="12" fill="#7a2b28">SFO</text>
</svg>
