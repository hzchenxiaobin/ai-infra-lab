<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[5,3,6,2,4,null,8,1,null,null,null,7,9]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">中序访问 1→2→3→…→9，prev 尾插逐节点串接</text>

  <!-- ===== table ===== -->
  <g font-size="10" fill="#333">
    <!-- header -->
    <rect x="30" y="60" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="50" y="76" font-weight="bold">步骤</text>
    <text x="100" y="76" font-weight="bold">访问节点</text>
    <text x="180" y="76" font-weight="bold">操作 prev.right=node</text>
    <text x="360" y="76" font-weight="bold">prev</text>
    <text x="420" y="76" font-weight="bold">已构建链表</text>

    <!-- row 1: node 1 -->
    <rect x="30" y="84" width="520" height="26" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="102">1</text>
    <circle cx="120" cy="97" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="101" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
    <text x="180" y="102" font-family="monospace" font-size="9" fill="#555">dummy.right = 1</text>
    <text x="360" y="102" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="420" y="102" font-size="10" fill="#4a7a3a">1</text>

    <!-- row 2: node 2 -->
    <rect x="30" y="110" width="520" height="26" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="128">2</text>
    <circle cx="120" cy="123" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="127" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
    <text x="180" y="128" font-family="monospace" font-size="9" fill="#555">1.right = 2</text>
    <text x="360" y="128" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="420" y="128" font-size="10" fill="#4a7a3a">1 → 2</text>

    <!-- row 3: node 3 -->
    <rect x="30" y="136" width="520" height="26" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="154">3</text>
    <circle cx="120" cy="149" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="153" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
    <text x="180" y="154" font-family="monospace" font-size="9" fill="#555">2.right = 3</text>
    <text x="360" y="154" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="420" y="154" font-size="10" fill="#4a7a3a">1 → 2 → 3</text>

    <!-- row 4: node 4 -->
    <rect x="30" y="162" width="520" height="26" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="180">4</text>
    <circle cx="120" cy="175" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="179" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
    <text x="180" y="180" font-family="monospace" font-size="9" fill="#555">3.right = 4</text>
    <text x="360" y="180" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="420" y="180" font-size="10" fill="#4a7a3a">1 → 2 → 3 → 4</text>

    <!-- row 5: node 5 -->
    <rect x="30" y="188" width="520" height="26" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="206">5</text>
    <circle cx="120" cy="201" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="205" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
    <text x="180" y="206" font-family="monospace" font-size="9" fill="#555">4.right = 5</text>
    <text x="360" y="206" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="420" y="206" font-size="10" fill="#4a7a3a">… → 4 → 5</text>

    <!-- row 6: node 6 -->
    <rect x="30" y="214" width="520" height="26" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="232">6</text>
    <circle cx="120" cy="227" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="231" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>
    <text x="180" y="232" font-family="monospace" font-size="9" fill="#555">5.right = 6</text>
    <text x="360" y="232" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="420" y="232" font-size="10" fill="#4a7a3a">… → 5 → 6</text>

    <!-- row 7: node 7 -->
    <rect x="30" y="240" width="520" height="26" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="258">7</text>
    <circle cx="120" cy="253" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="257" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7</text>
    <text x="180" y="258" font-family="monospace" font-size="9" fill="#555">6.right = 7</text>
    <text x="360" y="258" fill="#4a7a3a" font-weight="bold">7</text>
    <text x="420" y="258" font-size="10" fill="#4a7a3a">… → 6 → 7</text>

    <!-- row 8: node 8 -->
    <rect x="30" y="266" width="520" height="26" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="284">8</text>
    <circle cx="120" cy="279" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="283" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">8</text>
    <text x="180" y="284" font-family="monospace" font-size="9" fill="#555">7.right = 8</text>
    <text x="360" y="284" fill="#4a7a3a" font-weight="bold">8</text>
    <text x="420" y="284" font-size="10" fill="#4a7a3a">… → 7 → 8</text>

    <!-- row 9: node 9 (final, highlighted) -->
    <rect x="30" y="292" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="50" y="311" font-weight="bold" fill="#4a7a3a">9</text>
    <circle cx="120" cy="306" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="120" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="180" y="311" font-family="monospace" font-size="9" fill="#555" font-weight="bold">8.right = 9</text>
    <text x="360" y="311" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="420" y="311" font-size="10" fill="#4a7a3a" font-weight="bold">1 → … → 8 → 9 ✓</text>
  </g>

  <!-- ===== key insight ===== -->
  <rect x="30" y="332" width="520" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="354" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">为什么有效？</text>
  <text x="50" y="376" font-size="11" fill="#555">• 中序遍历顺序 = BST 升序 = 目标右链顺序，天然对齐</text>
  <text x="50" y="394" font-size="11" fill="#555">• prev 始终指向「已构建链表的尾节点」，每步 prev.right = node 尾插</text>
  <text x="50" y="412" font-size="11" fill="#555">• 指针按值传递：inorder(root.right) 已拷贝原指针，重连不影响递归</text>
  <text x="50" y="430" font-size="11" fill="#555">• dummy 哨兵统一首节点的处理，收尾断开最后节点的左右指针</text>
  <text x="50" y="444" font-size="10" fill="#888">  最后 9.right/9.left 置 null，返回 dummy.right = 1（新根）</text>
</svg>
