<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：nums = [3,4,5,1,12,14,13] → 15</text>

  <!-- ① 扫描顺序前缀 -->
  <rect x="18" y="34" width="150" height="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="93" y="48" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">① 扫描顺序前缀</text>

  <rect x="28" y="60" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="82" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="82" y="60" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="82" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="136" y="60" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="82" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="190" y="60" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="82" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="244" y="60" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="298" y="60" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">14</text>
  <rect x="352" y="60" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">13</text>

  <text x="77" y="56" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1 ✓</text>
  <text x="131" y="56" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1 ✓</text>
  <text x="185" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="239" y="56" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">✗</text>
  <text x="293" y="56" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">✗</text>
  <text x="347" y="56" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">✗</text>

  <text x="418" y="74" font-size="10.5" fill="#555" filter="url(#rough2)">前缀 [3,4,5]</text>
  <text x="418" y="88" font-size="10.5" fill="#555" filter="url(#rough2)">在 1 处断裂</text>

  <line x1="260" y1="102" x2="260" y2="122" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="160" y="126" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sum = 3+4+5 = 12</text>

  <!-- ② 集合 -->
  <rect x="18" y="168" width="160" height="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="98" y="182" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">② 建集合 vis = set(nums)</text>

  <g filter="url(#rough2)">
    <rect x="30" y="192" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
    <text x="47" y="207" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
    <rect x="72" y="192" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
    <text x="89" y="207" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
    <rect x="114" y="192" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
    <text x="131" y="207" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>
    <rect x="156" y="192" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
    <text x="173" y="207" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
    <rect x="198" y="192" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
    <text x="215" y="207" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">12</text>
    <rect x="240" y="192" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
    <text x="257" y="207" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">13</text>
    <rect x="282" y="192" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
    <text x="299" y="207" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">14</text>
  </g>
  <text x="340" y="207" font-size="10.5" fill="#888" filter="url(#rough2)">（重复值自动去重）</text>

  <!-- ③ 探针 -->
  <rect x="18" y="228" width="196" height="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="116" y="242" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">③ 从 x = sum 起逐个探测缺失</text>

  <rect x="30" y="258" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="62" y="282" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="62" y="308" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">✓ 在数组中</text>
  <rect x="104" y="258" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="136" y="282" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="136" y="308" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">✓ 在数组中</text>
  <rect x="178" y="258" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="282" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">14</text>
  <text x="210" y="308" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">✓ 在数组中</text>
  <rect x="252" y="258" width="64" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="284" y="282" text-anchor="middle" font-size="14" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="284" y="308" text-anchor="middle" font-size="9.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗ 不在数组中！</text>

  <line x1="326" y1="277" x2="352" y2="277" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="356" y="258" width="150" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="431" y="282" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 15</text>

  <!-- 底部说明 -->
  <rect x="14" y="322" width="492" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">对照示例 1：[1,2,3,2,5] → sum=6，而 6 本身就缺失，第一步探测即命中，直接返回 6</text>
</svg>
