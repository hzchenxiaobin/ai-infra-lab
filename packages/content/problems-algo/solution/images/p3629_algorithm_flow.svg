<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 448"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="448" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：SPF 筛 → 建质数桶 → 桶式 BFS</text>

  <!-- 开始 -->
  <ellipse cx="150" cy="52" rx="38" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 150 66 L 150 78" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① SPF 筛 -->
  <rect x="48" y="80" width="204" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="95" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① SPF 最小质因子筛 spf[0..maxV]</text>
  <text x="150" y="109" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">maxV = max(nums)，复杂度 O(A log log A)</text>
  <path d="M 150 118 L 150 130" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 建桶 -->
  <rect x="48" y="132" width="204" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="147" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 分解每个 nums[j] → bucket[p]</text>
  <text x="150" y="161" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">p 整除 nums[j] ⇒ j 入桶（隐式建图）</text>
  <path d="M 150 170 L 150 182" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="155" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">隐式建图：桶即邻接表，不显式存边</text>

  <!-- ③ 初始化 -->
  <rect x="48" y="184" width="204" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="200" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ dist[0] = 0，队列 ← 0</text>
  <path d="M 150 208 L 150 220" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 出队 -->
  <rect x="48" y="222" width="204" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="238" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">④ 出队 i，d = dist[i] + 1</text>
  <path d="M 150 246 L 150 258" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 E：终点判定 -->
  <polygon points="150,260 232,288 150,316 68,288" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i == n−1 ?</text>

  <!-- 是 → 返回 -->
  <path d="M 232 288 L 280 288" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="256" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="284" y="275" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="359" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 dist[i]</text>

  <!-- 否 ↓ -->
  <path d="M 150 316 L 150 330" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="158" y="328" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- ⑤ 邻居 -->
  <rect x="48" y="334" width="204" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="350" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⑤ 邻居 i±1 未访问 → dist = d 入队</text>
  <path d="M 150 358 L 150 370" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 H：质数判定 -->
  <polygon points="150,372 238,404 150,436 62,404" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="400" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">nums[i] 是质数 ?</text>
  <text x="150" y="413" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">（spf[v] == v）</text>

  <!-- 是 → ⑥ 扫桶 -->
  <path d="M 238 404 L 282 404" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="258" y="396" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="286" y="391" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="381" y="408" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⑥ 扫描 bucket[v] 入队，扫完清空</text>
  <text x="381" y="432" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">clear() ⇒ 每个桶只整体扫一次</text>

  <!-- ⑥ → ④ 回边 -->
  <path d="M 476 404 C 512 400, 512 228, 256 234" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- H 否 → ④ 回边 -->
  <path d="M 62 404 C 18 404, 18 234, 44 234" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="54" y="396" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="34" y="320" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 34 320)" filter="url(#rough2)">回到 ④，下一轮</text>
</svg>
