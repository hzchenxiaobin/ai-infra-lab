<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="440" fill="#fdfcf7"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">方法一流程：互斥锁保护 carArrived</text>
  <path d="M 150 34 Q 280 42 410 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Critical section boundary -->
  <g filter="url(#sk)">
    <rect x="50" y="88" width="470" height="272" rx="10" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4"/>
  </g>
  <text x="66" y="80" font-size="11" fill="#d6a040" font-weight="bold">🔒 临界区（lock 持有期间，一次仅一辆车进入）</text>

  <!-- Start -->
  <g filter="url(#sk)">
    <ellipse cx="280" cy="56" rx="92" ry="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">carArrived(carId, roadId, …)</text>
  <path d="M 280 72 L 280 100" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- acquire -->
  <g filter="url(#sk)">
    <rect x="200" y="100" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">🔒 lock.acquire()</text>
  <path d="M 280 134 L 280 152" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision diamond -->
  <g filter="url(#sk)">
    <polygon points="280,152 350,192 280,232 210,192" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="280" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">road ==</text>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">roadId ?</text>

  <!-- No branch -->
  <path d="M 350 192 L 360 192" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="354" y="184" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="360" y="172" width="146" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="433" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">turnGreen()</text>
  <text x="433" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">road = roadId</text>
  <!-- turnGreen -> crossCar -->
  <path d="M 433 214 L 433 273 L 360 273" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Yes branch -->
  <path d="M 280 232 L 280 256" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="290" y="248" font-size="10" fill="#4a8e4a" font-weight="bold">是</text>

  <!-- crossCar -->
  <g filter="url(#sk)">
    <rect x="200" y="256" width="160" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">crossCar()</text>
  <path d="M 280 290 L 280 312" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- release -->
  <g filter="url(#sk)">
    <rect x="200" y="312" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">🔓 lock.release()</text>
  <path d="M 280 346 L 280 362" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Return -->
  <g filter="url(#sk)">
    <ellipse cx="280" cy="378" rx="46" ry="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回</text>

  <!-- side note -->
  <g filter="url(#sk)">
    <rect x="360" y="256" width="146" height="78" rx="8" fill="#f6f6f6" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="368" y="274" font-size="10" fill="#666" font-weight="bold">为何不会死锁？</text>
  <text x="368" y="290" font-size="9" fill="#666">· 单把锁，无嵌套</text>
  <text x="368" y="304" font-size="9" fill="#666">· 不在锁内等待</text>
  <text x="368" y="318" font-size="9" fill="#666">· 拿到即放行，必释放</text>
</svg>
