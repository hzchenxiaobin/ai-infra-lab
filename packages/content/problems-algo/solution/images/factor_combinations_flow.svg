<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">因子的组合：算法流程</text>

  <!-- Start: dfs(remain, start) -->
  <rect x="180" y="44" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(remain, start)</text>

  <path d="M 280 76 L 280 92" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop: i = start; i*i <= remain; i++ -->
  <rect x="150" y="94" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="11" fill="#333">for i = start; i*i &lt;= remain; i++</text>

  <path d="M 280 128 L 280 146" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: remain % i == 0 ? -->
  <polygon points="280,148 376,184 280,220 184,184" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#333">remain % i</text>
  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#333">== 0 ?</text>

  <!-- No -> continue loop (right) -->
  <path d="M 376 184 L 430 184" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="178" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="432" y="170" width="86" height="28" fill="#fafafa" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="475" y="188" text-anchor="middle" font-size="10" fill="#888">continue</text>
  <!-- loop back arrow -->
  <path d="M 475 170 L 475 111 L 410 111" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes -> two branches -->
  <path d="M 280 220 L 280 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="234" font-size="10" fill="#4a7a3a">是</text>

  <!-- Branch 1: record [i, remain/i] -->
  <rect x="60" y="244" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="262" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">① 收尾分支</text>
  <text x="150" y="278" text-anchor="middle" font-size="9" fill="#555">记录 [i, remain/i]</text>

  <!-- Branch 2: recurse dfs(remain/i, i) -->
  <rect x="320" y="244" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="262" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">② 续拆分支</text>
  <text x="410" y="278" text-anchor="middle" font-size="9" fill="#555">dfs(remain/i, i)</text>

  <!-- split arrows from decision -->
  <path d="M 250 240 L 150 244" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 240 L 410 244" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- undo after branch 1 -->
  <path d="M 150 288 L 150 306" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="308" width="120" height="28" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="326" text-anchor="middle" font-size="10" fill="#555">pop × 2 撤销</text>

  <!-- recurse then undo for branch 2 -->
  <path d="M 410 288 L 410 306" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="308" width="120" height="28" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="326" text-anchor="middle" font-size="10" fill="#555">递归返回后 pop</text>

  <!-- both merge back to loop -->
  <path d="M 150 336 L 150 360 L 280 360 L 280 111 L 410 111" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 336 L 410 360 L 280 360" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="250" y="376" text-anchor="middle" font-size="9" fill="#888">两分支都回到循环，继续下一个 i</text>

  <!-- loop end -->
  <path d="M 280 376 L 280 396" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="398" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="417" text-anchor="middle" font-size="10" fill="#333">循环结束（i*i &gt; remain）→ 返回</text>
</svg>
