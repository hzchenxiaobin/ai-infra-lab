<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个元素都落到「数组中整除它的最小值」上</text>
  <text x="280" y="44" text-anchor="middle" font-size="11.5" fill="#888">示例 nums = [4, 2, 8, 3]，去重值域 S = {2, 3, 4, 8}</text>

  <!-- original row -->
  <text x="30" y="88" font-size="12" fill="#446688" font-weight="bold">原数组</text>
  <rect x="85" y="64" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="205" y="64" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="325" y="64" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="445" y="64" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <text x="240" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="360" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>
  <text x="480" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <!-- arrows -->
  <path d="M 120 106 L 120 180" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 240 106 L 240 180" fill="none" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 360 106 L 360 180" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 480 106 L 480 180" fill="none" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4 % 2 = 0</text>
  <text x="240" y="140" text-anchor="middle" font-size="10.5" fill="#8899aa">自身即最小</text>
  <text x="360" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">8 % 2 = 0</text>
  <text x="480" y="140" text-anchor="middle" font-size="10.5" fill="#8899aa">自身即最小</text>

  <!-- final row -->
  <text x="36" y="210" font-size="12" fill="#446688" font-weight="bold">终态</text>
  <rect x="85" y="186" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="205" y="186" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="325" y="186" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="445" y="186" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="212" text-anchor="middle" font-size="15" fill="#2f5e23" font-weight="bold">2</text>
  <text x="240" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="360" y="212" text-anchor="middle" font-size="15" fill="#2f5e23" font-weight="bold">2</text>
  <text x="480" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <text x="280" y="252" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">最小元素和 = 2 + 2 + 2 + 3 = 9</text>

  <!-- insight boxes -->
  <rect x="28" y="268" width="504" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="44" y="290" font-size="12" fill="#2f5e23" font-weight="bold">① 整除可传递：z | y 且 y | x ⇒ z | x</text>
  <text x="44" y="310" font-size="10.5" fill="#444">操作只复制已有值、整除关系沿替换链传递 ⇒ 最终值必是 S 中 x 的约数，最小可能就是 f(x)</text>

  <rect x="28" y="340" width="504" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="44" y="362" font-size="12" fill="#a87020" font-weight="bold">② 被当作目标的值永不消失</text>
  <text x="44" y="382" font-size="10.5" fill="#444">若 y 会换成更小的 z，则想要 y 的元素直接要 z 更划算 ⇒ 没人需要会消失的值，各元素一步直达、互不干扰</text>
</svg>
