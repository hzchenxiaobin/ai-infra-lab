<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">API 机制：commonBits(num) 三步舞 + 副作用自消</text>

  <!-- Section A: three steps -->
  <text x="46" y="56" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">三步语义：数相同位 → XOR 改写隐藏数 → 返回统计值</text>

  <rect x="40" y="68" width="175" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="127" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">① 统计「相同位」</text>
  <text x="127" y="106" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">count = 30 − popcount(n⊕num)</text>

  <path d="M 221 96 L 245 96" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="68" width="175" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="337" y="88" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 副作用：n := n ⊕ num</text>
  <text x="337" y="106" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">隐藏数被改写！（考点所在）</text>

  <path d="M 431 96 L 455 96" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="460" y="68" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="520" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 返回 count</text>
  <text x="520" y="106" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">改写前的统计值</text>

  <!-- Section B: bit row demo -->
  <text x="46" y="152" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">bit 行演示：n = 10110，num = 00010（只示意 5 位，实际 30 位）</text>

  <text x="62" y="183" font-size="11" fill="#333" filter="url(#rough2)">n</text>
  <rect x="84" y="166" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="166" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="156" y="166" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="166" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="184" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="228" y="166" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="55" y="215" font-size="10.5" fill="#333" filter="url(#rough2)">num</text>
  <rect x="84" y="198" width="32" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="120" y="198" width="32" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="156" y="198" width="32" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="192" y="198" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="216" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="228" y="198" width="32" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="100" y="243" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="136" y="243" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="172" y="243" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="208" y="243" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="244" y="243" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="290" y="180" font-size="10.5" fill="#333" filter="url(#rough2)">相同位（同为 0 或同为 1）</text>
  <text x="290" y="198" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count = 3</text>
  <text x="290" y="222" font-size="10" fill="#b85450" filter="url(#rough2)">调用后 n := 10110 ⊕ 00010 = 10100</text>
  <text x="290" y="238" font-size="9.5" fill="#999" filter="url(#rough2)">只有第 4 位（1⊕1）翻成 0，其余位不动</text>

  <!-- Section C: self-cancel -->
  <text x="46" y="278" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">副作用自消：同一参数连问两次，n 完全复原</text>

  <rect x="90" y="294" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">n</text>

  <path d="M 156 311 L 216 311" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="302" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">⊕ num</text>

  <rect x="222" y="294" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="252" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">n′</text>

  <path d="M 288 311 L 348 311" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="302" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">⊕ num（同参）</text>

  <rect x="354" y="294" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="384" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">n ✓</text>

  <text x="450" y="310" font-size="10" fill="#333" filter="url(#rough2)">(n ⊕ num) ⊕ num = n</text>
  <text x="450" y="326" font-size="9.5" fill="#999" filter="url(#rough2)">官方 hints 的 revert</text>

  <rect x="40" y="348" width="540" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="372" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">本题返回值耦合全部 30 位（30 − popcount(n⊕num)），单次询问读不出单个位 → 必须想办法「差分」</text>
</svg>
