<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：偏移量计数 → 最大重叠 = 3</text>

  <!-- ===== img1 grid 3x3, cell 26x26, origin (45, 42) ===== -->
  <text x="84" y="38" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">img1</text>
  <rect x="45" y="42" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="58" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="71" y="42" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="84" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="97" y="42" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="60" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="45" y="68" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="86" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="71" y="68" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="84" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="97" y="68" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="86" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="45" y="94" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="112" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="71" y="94" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="84" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="97" y="94" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="112" text-anchor="middle" font-size="12" fill="#ccc">0</text>

  <!-- img1 1-positions -->
  <text x="45" y="138" font-size="10" fill="#446688" font-weight="bold">A (1 的位置):</text>
  <text x="130" y="138" font-size="10" fill="#555">(0,0) (0,1) (1,1) (2,1)</text>

  <!-- arrow between matrices -->
  <path d="M 130 78 L 360 78" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="70" text-anchor="middle" font-size="10" fill="#888">4 × 3 = 12 对</text>

  <!-- ===== img2 grid 3x3, cell 26x26, origin (388, 42) ===== -->
  <text x="427" y="38" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">img2</text>
  <rect x="388" y="42" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="401" y="60" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="414" y="42" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="427" y="60" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="440" y="42" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="453" y="60" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="388" y="68" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="401" y="86" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="414" y="68" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="427" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="440" y="68" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="453" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="388" y="94" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="401" y="112" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="414" y="94" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="427" y="112" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="440" y="94" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="453" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- img2 1-positions -->
  <text x="388" y="138" font-size="10" fill="#4a7a3a" font-weight="bold">B (1 的位置):</text>
  <text x="465" y="138" font-size="10" fill="#555">(1,1) (1,2) (2,2)</text>

  <!-- ===== Offset count grid ===== -->
  <line x1="20" y1="152" x2="540" y2="152" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">cnt[(dr, dc)] 网格：每个偏移的「对齐票数」</text>

  <!-- Column headers (dc) -->
  <text x="150" y="196" text-anchor="end" font-size="10" fill="#888" font-weight="bold">dc →</text>
  <text x="235" y="196" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="295" y="196" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="355" y="196" text-anchor="middle" font-size="10" fill="#888">2</text>

  <!-- Row header (dr) -->
  <text x="150" y="226" text-anchor="end" font-size="10" fill="#888" font-weight="bold">dr = -1</text>
  <text x="150" y="256" text-anchor="end" font-size="10" fill="#888" font-weight="bold">dr = 0</text>
  <text x="150" y="286" text-anchor="end" font-size="10" fill="#888" font-weight="bold">dr = 1</text>
  <text x="150" y="316" text-anchor="end" font-size="10" fill="#888" font-weight="bold">dr = 2</text>

  <!-- Row dr=-1 -->
  <rect x="210" y="212" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="231" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <rect x="270" y="212" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="231" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <rect x="330" y="212" width="50" height="28" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="355" y="231" text-anchor="middle" font-size="12" fill="#ddd">—</text>

  <!-- Row dr=0 -->
  <rect x="210" y="242" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="261" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <rect x="270" y="242" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="295" y="261" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="330" y="242" width="50" height="28" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="355" y="261" text-anchor="middle" font-size="12" fill="#ddd">—</text>

  <!-- Row dr=1 (contains winner) -->
  <rect x="210" y="272" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="291" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <rect x="270" y="272" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="295" y="291" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <rect x="330" y="272" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="355" y="291" text-anchor="middle" font-size="12" fill="#446688">1</text>

  <!-- Row dr=2 -->
  <rect x="210" y="302" width="50" height="28" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="321" text-anchor="middle" font-size="12" fill="#ddd">—</text>
  <rect x="270" y="302" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="321" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <rect x="330" y="302" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="355" y="321" text-anchor="middle" font-size="12" fill="#446688">1</text>

  <!-- winner annotation -->
  <path d="M 320 286 L 392 286" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最大！答案 = 3</text>

  <!-- ===== Result box ===== -->
  <rect x="40" y="348" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最优偏移 (dr=1, dc=1)：img1 下移 1 行 + 右移 1 列</text>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#555">(0,0)→(1,1)✓  (0,1)→(1,2)✓  (1,1)→(2,2)✓  → 3 个 1 对齐</text>
</svg>
