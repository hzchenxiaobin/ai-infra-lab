<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：dungeon = [[−2,−3,3],[−5,−10,1],[10,30,−5]]</text>

  <!-- left grid label -->
  <text x="116" y="52" text-anchor="middle" font-size="11" fill="#888">dungeon（HP 变化）</text>
  <!-- left grid 3x3: cell 48x36, origin x=40 y=60 -->
  <!-- row0: -2, -3, +3 -->
  <rect x="40" y="60" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="83" text-anchor="middle" font-size="12" fill="#333">−2</text>
  <rect x="92" y="60" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="83" text-anchor="middle" font-size="12" fill="#333">−3</text>
  <rect x="144" y="60" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="83" text-anchor="middle" font-size="12" fill="#333">+3</text>
  <!-- row1: -5, -10, +1 -->
  <rect x="40" y="100" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="123" text-anchor="middle" font-size="12" fill="#333">−5</text>
  <rect x="92" y="100" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="123" text-anchor="middle" font-size="12" fill="#333">−10</text>
  <rect x="144" y="100" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="123" text-anchor="middle" font-size="12" fill="#333">+1</text>
  <!-- row2: +10, +30, -5 -->
  <rect x="40" y="140" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="163" text-anchor="middle" font-size="12" fill="#333">+10</text>
  <rect x="92" y="140" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="163" text-anchor="middle" font-size="12" fill="#333">+30</text>
  <rect x="144" y="140" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="163" text-anchor="middle" font-size="12" fill="#333">−5</text>

  <!-- middle arrow -->
  <path d="M 198 118 L 278 118" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="238" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">倒推</text>
  <text x="238" y="132" text-anchor="middle" font-size="9" fill="#888">max(1, min − d)</text>

  <!-- right grid label -->
  <text x="366" y="52" text-anchor="middle" font-size="11" fill="#888">dp（进入该格前所需最小 HP）</text>
  <!-- right grid 3x3: cell 48x36, origin x=290 y=60. row2 green, row1 orange, row0 answer-red -->
  <!-- row0: 7, 5, 2 -->
  <rect x="290" y="60" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="342" y="60" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="83" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="394" y="60" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="83" text-anchor="middle" font-size="12" fill="#333">2</text>
  <!-- row1: 6, 11, 5 -->
  <rect x="290" y="100" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="123" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="342" y="100" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="123" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="394" y="100" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="123" text-anchor="middle" font-size="12" fill="#333">5</text>
  <!-- row2: 1, 1, 6 -->
  <rect x="290" y="140" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="163" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="342" y="140" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="163" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="394" y="140" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="163" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- fill order arrow on dp grid: from (2,2) to (0,0) -->
  <path d="M 418 158 Q 360 200 318 80" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="196" font-size="9" fill="#4a7a3a">先算 row2 → row1 → row0</text>

  <!-- legend for stage colors -->
  <rect x="40" y="196" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="205" font-size="10" fill="#444">第①步 row2</text>
  <rect x="130" y="196" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="150" y="205" font-size="10" fill="#444">第②步 row1</text>
  <rect x="220" y="196" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="240" y="205" font-size="10" fill="#444">第③步 row0（答案）</text>

  <!-- answer box -->
  <rect x="150" y="222" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案：最小初始 HP = dp[0][0] = 7</text>

  <!-- bottom computation note -->
  <rect x="40" y="268" width="440" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">逐行演算（哨兵 dp[2][3] = dp[3][2] = 1，图中略）</text>
  <text x="50" y="308" font-size="10" fill="#444">① row2：dp[2][2]=max(1,1−(−5))=6；dp[2][1]=max(1,6−30)=1；dp[2][0]=max(1,1−10)=1</text>
  <text x="50" y="326" font-size="10" fill="#444">② row1：dp[1][2]=max(1,6−1)=5；dp[1][1]=max(1,min(1,5)+10)=11；dp[1][0]=max(1,min(1,11)+5)=6</text>
  <text x="50" y="344" font-size="10" fill="#444">③ row0：dp[0][2]=max(1,5−3)=2；dp[0][1]=max(1,min(11,2)+3)=5；dp[0][0]=max(1,min(6,5)+2)=7</text>
  <text x="50" y="360" font-size="10" fill="#888">取 min=选「需要更少 HP」的下一步；− 负值(恶魔) 会把所需 HP 顶高</text>
</svg>
