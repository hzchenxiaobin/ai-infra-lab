<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    核心观察：每轮贪心匹配到极限，走不动就开新一轮
  </text>

  <!-- ===== source 行 ===== -->
  <text x="40" y="80" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">source</text>
  <text x="40" y="96" font-size="10" fill="#888" filter="url(#rough2)">每轮复用</text>

  <!-- source 三个格子 x y z -->
  <rect x="180" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="202" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="232" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">y</text>
  <rect x="284" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="306" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">z</text>

  <!-- source 索引 -->
  <text x="202" y="116" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="254" y="116" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="306" y="116" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>

  <!-- 循环复用提示 -->
  <text x="350" y="88" font-size="11" fill="#888" filter="url(#rough2)">↻ 每轮从左到右扫一次</text>

  <!-- 向下箭头 -->
  <path d="M 253 124 L 253 148" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="269" y="142" font-size="11" fill="#888" filter="url(#rough2)">贪心吃</text>

  <!-- ===== target 行：5 个格子，按轮次着色 ===== -->
  <text x="40" y="184" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">target</text>
  <text x="40" y="200" font-size="10" fill="#888" filter="url(#rough2)">按轮切块</text>

  <!-- 第1轮：x z（绿） -->
  <rect x="154" y="166" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="188" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="206" y="166" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="188" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">z</text>
  <!-- 第2轮：y（橙） -->
  <rect x="258" y="166" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">y</text>
  <!-- 第3轮：x z（蓝） -->
  <rect x="310" y="166" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="188" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="362" y="166" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="384" y="188" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">z</text>

  <!-- target 下标 -->
  <text x="176" y="218" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="228" y="218" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="280" y="218" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="332" y="218" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="384" y="218" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <!-- 三轮切块的分组花括号弧 -->
  <!-- 第1轮括号 -->
  <path d="M 154 226 Q 154 236 180 236 L 224 236 Q 250 236 250 226" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <!-- 第2轮括号 -->
  <path d="M 258 226 Q 258 236 280 236 Q 302 236 302 226" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <!-- 第3轮括号 -->
  <path d="M 310 226 Q 310 236 336 236 L 380 236 Q 406 236 406 226" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- ===== 三轮说明卡 ===== -->
  <!-- 第1轮 -->
  <rect x="40" y="258" width="150" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="115" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 轮：取 "xz"</text>
  <text x="115" y="296" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">x→命中, y→跳过,</text>
  <text x="115" y="310" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">z→命中, 后无 y 停</text>

  <!-- 第2轮 -->
  <rect x="205" y="258" width="150" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 2 轮：取 "y"</text>
  <text x="280" y="296" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">y→命中,</text>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">后无 x 停</text>

  <!-- 第3轮 -->
  <rect x="370" y="258" width="150" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="278" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第 3 轮：取 "xz"</text>
  <text x="445" y="296" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">x→命中, y→跳过,</text>
  <text x="445" y="310" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">z→命中, target 完</text>

  <!-- 从括号到说明卡的细箭头 -->
  <path d="M 180 238 L 115 256" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 280 238 L 280 256" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 380 238 L 445 256" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="30" y="338" width="500" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    答案 = 轮数 = 3 ： "xz" + "y" + "xz" = "xzyxz"
  </text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    每轮在 source 中贪心吃尽可能多的 target 字符，吃不动就开新一轮
  </text>
  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    ⚠️ 若某轮整轮零进展（字符不在 source）→ 返回 -1
  </text>
</svg>
