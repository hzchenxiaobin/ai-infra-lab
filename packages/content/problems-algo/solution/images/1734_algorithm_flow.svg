<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    算法流程：两阶段——求 arr[0] + 逐项递推
  </text>

  <!-- Phase 1 label -->
  <rect x="40" y="46" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="64" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">阶段一：求 arr[0]</text>

  <!-- Step 1: compute P -->
  <rect x="190" y="46" width="300" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="340" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">P = 1 ⊕ 2 ⊕ … ⊕ n（遍历 1..n）</text>

  <path d="M340,72 L340,84" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute S from odd-index encoded -->
  <rect x="190" y="88" width="300" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="340" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">S = encoded[1] ⊕ encoded[3] ⊕ …</text>

  <path d="M340,114 L340,126" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: arr[0] = P ^ S -->
  <rect x="190" y="130" width="300" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="150" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">arr[0] = P ⊕ S</text>

  <path d="M340,160 L340,176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 2 label -->
  <rect x="40" y="178" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">阶段二：逐项递推</text>

  <!-- i = 0 -->
  <rect x="190" y="182" width="300" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="340" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i = 0</text>

  <path d="M340,208 L340,222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n-1 ? -->
  <polygon points="340,226 412,264 340,302 268,264" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &lt; n-1 ?</text>
  <text x="340" y="276" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">还有未解码项</text>

  <!-- No branch: right -->
  <path d="M412,264 L460,264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="256" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="460" y="246" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="495" y="269" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">返回 arr</text>

  <!-- Yes branch: down -->
  <path d="M340,302 L340,316" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="354" y="312" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- compute box -->
  <rect x="220" y="320" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[i+1] = arr[i] ⊕ encoded[i]</text>
  <text x="340" y="354" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i = i + 1</text>

  <!-- loop back: left rail up to diamond left -->
  <path d="M220,342 L180,342 L180,264 L268,264" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="166" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">循环</text>

  <!-- Insight box -->
  <rect x="50" y="372" width="440" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">
    阶段一 O(n) + 阶段二 O(n) → 整体 O(n)，空间 O(1) 额外
  </text>
</svg>
