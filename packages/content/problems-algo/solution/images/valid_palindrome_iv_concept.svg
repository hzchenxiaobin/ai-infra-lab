<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：对称位置配对，统计不匹配对数 m</text>

  <!-- pointer labels i / j -->
  <text x="190" y="56" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">i↓</text>
  <text x="430" y="56" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">↓j</text>

  <!-- string cells: abcdba -->
  <g font-size="16" fill="#333" text-anchor="middle">
    <rect x="168" y="64" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="190" y="92" font-weight="bold">a</text>
    <rect x="216" y="64" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="238" y="92" font-weight="bold">b</text>
    <rect x="264" y="64" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="286" y="92" font-weight="bold" fill="#b85450">c</text>
    <rect x="312" y="64" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="334" y="92" font-weight="bold" fill="#b85450">d</text>
    <rect x="360" y="64" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="382" y="92" font-weight="bold">b</text>
    <rect x="408" y="64" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="430" y="92" font-weight="bold">a</text>
  </g>

  <!-- index labels -->
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="190" y="120">0</text>
    <text x="238" y="120">1</text>
    <text x="286" y="120">2</text>
    <text x="334" y="120">3</text>
    <text x="382" y="120">4</text>
    <text x="430" y="120">5</text>
  </g>

  <!-- arrow down to pair check -->
  <path d="M 310 126 L 310 150" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="324" y="142" font-size="11" fill="#888">逐对检查</text>

  <!-- pair rows: each row = label + two mini cells + sign + result -->
  <!-- row1: (0,5) a = a  match -->
  <text x="150" y="172" font-size="11.5" fill="#555">对 (0,5)</text>
  <rect x="232" y="156" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="282" y="176" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">=</text>
  <rect x="298" y="156" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="344" y="176" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 匹配</text>

  <!-- row2: (1,4) b = b  match -->
  <text x="150" y="210" font-size="11.5" fill="#555">对 (1,4)</text>
  <rect x="232" y="194" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <text x="282" y="214" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">=</text>
  <rect x="298" y="194" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <text x="344" y="214" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 匹配</text>

  <!-- row3: (2,3) c != d  mismatch -->
  <text x="150" y="248" font-size="11.5" fill="#555">对 (2,3)</text>
  <rect x="232" y="232" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="247" y="252" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">c</text>
  <text x="282" y="252" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">≠</text>
  <rect x="298" y="232" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="313" y="252" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">d</text>
  <text x="344" y="252" font-size="12" fill="#b85450" font-weight="bold">✗ 不匹配 (+1)</text>

  <!-- counter box -->
  <rect x="130" y="276" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="298" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">m = 不匹配对数 = 1</text>
  <text x="310" y="314" text-anchor="middle" font-size="11" fill="#555">每对不匹配至少需 1 次单字符操作修正</text>

  <!-- arrow down to decision -->
  <path d="M 310 320 L 310 344" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="310,348 430,388 310,428 190,388" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">m ≤ 2 ?</text>
  <text x="310" y="400" text-anchor="middle" font-size="10.5" fill="#555">恰 1~2 步可达成回文</text>

  <!-- false branch (left) -->
  <path d="M 190 388 L 140 388" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="156" y="382" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="372" width="116" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="78" y="393" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- true branch (right) -->
  <path d="M 430 388 L 480 388" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="446" y="382" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="484" y="372" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="542" y="393" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- note -->
  <text x="310" y="432" text-anchor="middle" font-size="10.5" fill="#888">注：n 为奇数时中间位不参与配对，不计数</text>
</svg>
