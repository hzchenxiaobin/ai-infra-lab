<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [5,6,2,7,4]</text>

  <!-- Step 1: original -->
  <text x="60" y="58" font-size="11.5" fill="#888">① 原数组</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="82" y="89">5</text>
    <rect x="108" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="89">6</text>
    <rect x="156" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="89">2</text>
    <rect x="204" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="226" y="89">7</text>
    <rect x="252" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="274" y="89">4</text>
  </g>

  <!-- Step 2: sorted -->
  <text x="60" y="124" font-size="11.5" fill="#888">② 排序后</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="132" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="82" y="155">2</text>
    <rect x="108" y="132" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="130" y="155">4</text>
    <rect x="156" y="132" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="155">5</text>
    <rect x="204" y="132" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="226" y="155">6</text>
    <rect x="252" y="132" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="274" y="155">7</text>
  </g>
  <text x="130" y="182" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">min1=2, min2=4</text>
  <text x="240" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">max2=6, max1=7</text>

  <!-- Divider -->
  <path d="M 40 196 L 320 196" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Step 3: compute products -->
  <text x="60" y="216" font-size="11.5" fill="#888">③ 计算两端乘积</text>

  <!-- min product -->
  <rect x="60" y="226" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="242" text-anchor="middle" font-size="11" fill="#333">减数（最小）</text>
  <text x="120" y="258" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2 × 4 = 8</text>

  <!-- max product -->
  <rect x="200" y="226" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#333">被减数（最大）</text>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7 × 6 = 42</text>

  <!-- Step 4: answer -->
  <text x="60" y="290" font-size="11.5" fill="#888">④ 作差得答案</text>
  <rect x="60" y="298" width="260" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="190" y="319" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">42 − 8 = 34</text>

  <!-- Right side: example 2 summary -->
  <path d="M 340 50 L 340 340" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="460" y="58" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">示例 2 验证</text>
  <text x="360" y="84" font-size="11.5" fill="#555">nums = [4,2,5,9,7,4,8]</text>
  <text x="360" y="104" font-size="11.5" fill="#555">排序 → [2,4,4,5,7,8,9]</text>
  <text x="360" y="128" font-size="11.5" fill="#d6a040">min1=2, min2=4 → 8</text>
  <text x="360" y="148" font-size="11.5" fill="#4a7a3a">max1=9, max2=8 → 72</text>
  <rect x="360" y="162" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="182" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">72 − 8 = 64 ✓</text>

  <text x="360" y="214" font-size="11" fill="#555">观察：min2 与 max2 可取同值</text>
  <text x="360" y="232" font-size="11" fill="#555">（此处都有 4），但下标不同，</text>
  <text x="360" y="250" font-size="11" fill="#555">满足「四个不同下标」约束。</text>

  <text x="360" y="282" font-size="11" fill="#555">结论：排序法对任意 n ≥ 4</text>
  <text x="360" y="300" font-size="11" fill="#555">的全正数组均正确。</text>
</svg>
