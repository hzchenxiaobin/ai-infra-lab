<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2765w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,3,4,3,4]</text>

  <text x="80" y="56" font-size="11" fill="#888" font-weight="bold">原数组：</text>
  <rect x="150" y="42" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="172" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="198" y="42" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="220" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="246" y="42" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="268" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="294" y="42" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="316" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="342" y="42" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="364" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <text x="172" y="92" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="220" y="92" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="268" y="92" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="316" y="92" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="364" y="92" text-anchor="middle" font-size="10" fill="#888">4</text>

  <text x="80" y="124" font-size="12" fill="#446688" font-weight="bold">① i=0，v=nums[0]=2</text>
  <rect x="150" y="132" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="172" y="153" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2 ✓</text>
  <rect x="198" y="132" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="220" y="153" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3 ✓</text>
  <rect x="246" y="132" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="268" y="153" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4 ✗</text>
  <text x="300" y="145" font-size="10" fill="#888">4≠2+0，断点 j=2</text>
  <text x="300" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">len=2, ans=2, i←1</text>

  <text x="80" y="190" font-size="12" fill="#446688" font-weight="bold">② i=1，v=nums[1]=3</text>
  <rect x="198" y="198" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="220" y="219" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3 ✓</text>
  <rect x="246" y="198" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="268" y="219" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4 ✓</text>
  <rect x="294" y="198" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="316" y="219" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3 ✓</text>
  <rect x="342" y="198" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="364" y="219" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4 ✓</text>
  <text x="394" y="211" font-size="10" fill="#888">全匹配，j 到 5</text>
  <text x="394" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">len=4, ans=4, i←4</text>

  <text x="80" y="256" font-size="12" fill="#446688" font-weight="bold">③ i=4，i+1=5 ≥ n，结束</text>
  <rect x="150" y="264" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="284" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">无更多起点可选，返回 ans = 4</text>

  <path d="M290,296 L290,320" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2765w)" filter="url(#rough2)"/>

  <rect x="120" y="324" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="344" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最长交替子数组 [3,4,3,4]</text>
  <text x="290" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">长度 = 4 ✓</text>

  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#888">断点后直接跳到 j−1，j 只前进不回退 → 总体 O(n)</text>
</svg>
