<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">修剪 BST：按 node.val 与 [low, high] 的关系分三种情况</text>

  <!-- 区间标尺 -->
  <rect x="60" y="44" width="500" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="59" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">low</text>
  <text x="540" y="59" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">high</text>
  <text x="300" y="59" text-anchor="middle" font-size="11" fill="#4a7a3a">保留区间 [low, high]</text>

  <!-- ===== 情况 ① node.val < low ===== -->
  <text x="110" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">① node.val &lt; low</text>
  <!-- 节点 + 左子树（红，丢弃） -->
  <circle cx="110" cy="128" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v</text>
  <circle cx="78" cy="170" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="78" y="174" text-anchor="middle" font-size="10" fill="#b85450">&lt;v</text>
  <line x1="98" y1="140" x2="86" y2="158" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <!-- 右子树（绿，递归修剪后返回） -->
  <circle cx="142" cy="170" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">&gt;v</text>
  <line x1="122" y1="140" x2="134" y2="158" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- 说明 -->
  <rect x="40" y="200" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="120" y="216" text-anchor="middle" font-size="10" fill="#555">node 与整个左子树都 &lt; low</text>
  <text x="120" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return trim(node.right)</text>

  <!-- ===== 情况 ② low <= node.val <= high ===== -->
  <text x="310" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② low ≤ node.val ≤ high</text>
  <circle cx="310" cy="128" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">v</text>
  <circle cx="278" cy="170" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">&lt;v</text>
  <line x1="298" y1="140" x2="286" y2="158" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="342" cy="170" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">&gt;v</text>
  <line x1="322" y1="140" x2="334" y2="158" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="240" y="200" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="216" text-anchor="middle" font-size="10" fill="#555">保留 node，两侧都需递归修剪</text>
  <text x="320" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">trim(left) + trim(right)</text>

  <!-- ===== 情况 ③ node.val > high ===== -->
  <text x="510" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ node.val &gt; high</text>
  <circle cx="510" cy="128" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v</text>
  <!-- 左子树（绿，递归修剪后返回） -->
  <circle cx="478" cy="170" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">&lt;v</text>
  <line x1="498" y1="140" x2="486" y2="158" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- 右子树（红，丢弃） -->
  <circle cx="542" cy="170" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="542" y="174" text-anchor="middle" font-size="10" fill="#b85450">&gt;v</text>
  <line x1="522" y1="140" x2="534" y2="158" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <rect x="440" y="200" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="520" y="216" text-anchor="middle" font-size="10" fill="#555">node 与整个右子树都 &gt; high</text>
  <text x="520" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return trim(node.left)</text>

  <!-- ===== BST 有序性说明 ===== -->
  <line x1="40" y1="268" x2="580" y2="268" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="310" y="290" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为何能整子树丢弃？—— BST 有序性</text>

  <!-- 有序性图示 -->
  <text x="120" y="316" text-anchor="middle" font-size="11" fill="#555">左子树值 &lt; node.val</text>
  <text x="120" y="332" text-anchor="middle" font-size="11" fill="#555">右子树值 &gt; node.val</text>

  <text x="310" y="324" text-anchor="middle" font-size="20" fill="#888" font-weight="bold">⇒</text>

  <rect x="380" y="304" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="500" y="320" text-anchor="middle" font-size="10" fill="#555">node.val &lt; low 时</text>
  <text x="500" y="335" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">左子树 &lt; node.val &lt; low，全丢</text>

  <rect x="380" y="356" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="500" y="372" text-anchor="middle" font-size="10" fill="#555">node.val &gt; high 时</text>
  <text x="500" y="387" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">右子树 &gt; node.val &gt; high，全丢</text>

  <!-- 底部要点 -->
  <rect x="40" y="416" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="435" text-anchor="middle" font-size="10" fill="#555">虚线红圈 = 整子树丢弃；绿圈 = 递归 trim 后接回。BST 有序性保证丢弃安全</text>
</svg>
