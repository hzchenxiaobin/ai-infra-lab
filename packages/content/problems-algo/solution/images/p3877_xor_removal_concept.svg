<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：子集空间 2⁴⁰ 爆炸，异或值域 2¹⁴ 收敛 ⇒ 值域 DP</text>

  <!-- Band 1: two spaces -->
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">① 同一件事的两个空间（n ≤ 40，nums[i] ≤ 10⁴）</text>

  <rect x="26" y="52" width="204" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="128" y="74" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">子集空间：每个元素选/不选</text>
  <text x="128" y="94" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">2⁴⁰ ≈ 1.1×10¹² ✗ 枚举爆炸</text>

  <path d="M 234 80 L 286 80" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">值域坍缩</text>

  <rect x="292" y="52" width="202" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="393" y="74" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">异或值域：⊕ 结果 &lt; 2¹⁴</text>
  <text x="393" y="94" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">仅 16384 种取值 ✓ 可当状态</text>

  <!-- Band 2: transition -->
  <text x="260" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">② dp[v] = 保留元素异或为 v 的最少删除数，处理元素 e 有两条出边</text>

  <rect x="58" y="162" width="78" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="97" y="181" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">dp[v]</text>

  <path d="M 136 172 Q 240 146 322 152" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="230" y="143" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保留 e：⊕ 翻转为 v⊕e，费用 +0</text>

  <rect x="326" y="138" width="122" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="387" y="157" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">dp[v ⊕ e]</text>

  <path d="M 136 182 Q 240 210 322 212" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="230" y="226" text-anchor="middle" font-size="9.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">删除 e：⊕ 不变仍是 v，费用 +1</text>

  <rect x="326" y="198" width="122" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="387" y="217" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">dp[v]</text>

  <text x="260" y="250" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">状态只记（异或值，最少删除），与 v 怎么拼出来的无关 ⇒ 无后效性</text>

  <!-- Band 3: example 1 -->
  <text x="260" y="270" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">③ 示例 1：nums = [1,2,3]，target = 2（dp 表逐轮演化）</text>

  <text x="70" y="290" font-size="10" fill="#333" filter="url(#rough2)">处理 1 后：{0:1, 1:0}</text>
  <text x="70" y="308" font-size="10" fill="#333" filter="url(#rough2)">处理 2 后：{0:2, 1:1, 2:1, 3:0}</text>
  <text x="70" y="326" font-size="10" fill="#333" filter="url(#rough2)">处理 3 后：{0:0, 1:1, 2:1, 3:1}</text>
  <text x="330" y="326" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">← dp[2] = 1 即答案</text>

  <rect x="90" y="336" width="340" height="22" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">删去 2，保留 [1,3]：1 ⊕ 3 = 2 ✓（顺带 dp[0]=0：全保留异或恰为 0）</text>
</svg>
