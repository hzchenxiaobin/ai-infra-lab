<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：按 n 的奇偶分支构造</text>

  <ellipse cx="100" cy="80" rx="50" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 n</text>

  <path d="M 100 106 L 100 138" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="100,140 180,180 100,220 20,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">n 为奇数?</text>
  <text x="100" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n % 2 == 1</text>

  <path d="M 20 180 L 30 180" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="42" y="170" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 180 180 L 300 180" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="172" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否（n 为偶）</text>

  <rect x="20" y="236" width="160" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 'a' × n</text>
  <text x="100" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">单字符出现 n 次（奇）</text>

  <path d="M 100 220 L 100 236" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="206" width="200" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="228" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 'a'×(n−1) + 'b'</text>
  <text x="400" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n−1（奇）+ 1（奇）= n</text>

  <path d="M 100 294 L 100 312" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 400 264 L 400 312" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <ellipse cx="260" cy="326" rx="70" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">输出合法字符串</text>

  <path d="M 100 312 L 230 326" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 312 L 290 326" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="140" width="200" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">为何有效？</text>
  <text x="400" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">奇+奇=偶，偶数 n 必可拆</text>
</svg>
