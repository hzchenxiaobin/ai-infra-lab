<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：原始网格 → 边界 DFS 沉岛 → 数剩余 1</text>

  <g filter="url(#rough2)" font-size="14" font-weight="bold">
    <!-- ===== Panel A: original ===== -->
    <text x="92" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 原始网格</text>
    <!-- row0: 0,0,0,0 -->
    <rect x="24" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="41" y="103" text-anchor="middle" fill="#446688">0</text>
    <rect x="58" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="75" y="103" text-anchor="middle" fill="#446688">0</text>
    <rect x="92" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="109" y="103" text-anchor="middle" fill="#446688">0</text>
    <rect x="126" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="143" y="103" text-anchor="middle" fill="#446688">0</text>
    <!-- row1: 1,0,1,0 -->
    <rect x="24" y="114" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="41" y="137" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="58" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="75" y="137" text-anchor="middle" fill="#446688">0</text>
    <rect x="92" y="114" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="109" y="137" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="126" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="143" y="137" text-anchor="middle" fill="#446688">0</text>
    <!-- row2: 0,1,1,0 -->
    <rect x="24" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="41" y="171" text-anchor="middle" fill="#446688">0</text>
    <rect x="58" y="148" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="75" y="171" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="92" y="148" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="109" y="171" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="126" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="143" y="171" text-anchor="middle" fill="#446688">0</text>
    <!-- row3: 0,0,0,0 -->
    <rect x="24" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="41" y="205" text-anchor="middle" fill="#446688">0</text>
    <rect x="58" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="75" y="205" text-anchor="middle" fill="#446688">0</text>
    <rect x="92" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="109" y="205" text-anchor="middle" fill="#446688">0</text>
    <rect x="126" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="143" y="205" text-anchor="middle" fill="#446688">0</text>

    <!-- arrow A->B -->
    <path d="M 168 165 L 196 165" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="182" y="156" text-anchor="middle" font-size="9" fill="#666">边界DFS</text>

    <!-- ===== Panel B: sunk ===== -->
    <text x="270" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 沉掉边界连通的 1</text>
    <!-- row0 -->
    <rect x="202" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="219" y="103" text-anchor="middle" fill="#446688">0</text>
    <rect x="236" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="253" y="103" text-anchor="middle" fill="#446688">0</text>
    <rect x="270" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="287" y="103" text-anchor="middle" fill="#446688">0</text>
    <rect x="304" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="321" y="103" text-anchor="middle" fill="#446688">0</text>
    <!-- row1: (1,0) sunk -> 0 (green) -->
    <rect x="202" y="114" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/><text x="219" y="137" text-anchor="middle" fill="#4a7a3a">0</text>
    <rect x="236" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="253" y="137" text-anchor="middle" fill="#446688">0</text>
    <rect x="270" y="114" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="287" y="137" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="304" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="321" y="137" text-anchor="middle" fill="#446688">0</text>
    <!-- row2 -->
    <rect x="202" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="219" y="171" text-anchor="middle" fill="#446688">0</text>
    <rect x="236" y="148" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="253" y="171" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="270" y="148" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="287" y="171" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="304" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="321" y="171" text-anchor="middle" fill="#446688">0</text>
    <!-- row3 -->
    <rect x="202" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="219" y="205" text-anchor="middle" fill="#446688">0</text>
    <rect x="236" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="253" y="205" text-anchor="middle" fill="#446688">0</text>
    <rect x="270" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="287" y="205" text-anchor="middle" fill="#446688">0</text>
    <rect x="304" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="321" y="205" text-anchor="middle" fill="#446688">0</text>

    <!-- arrow B->C -->
    <path d="M 346 165 L 374 165" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="360" y="156" text-anchor="middle" font-size="9" fill="#666">数 1</text>

    <!-- ===== Panel C: count ===== -->
    <text x="448" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ 数剩余 1 = 飞地</text>
    <!-- row0 -->
    <rect x="380" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="397" y="103" text-anchor="middle" fill="#446688">0</text>
    <rect x="414" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="431" y="103" text-anchor="middle" fill="#446688">0</text>
    <rect x="448" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="465" y="103" text-anchor="middle" fill="#446688">0</text>
    <rect x="482" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="499" y="103" text-anchor="middle" fill="#446688">0</text>
    <!-- row1: (1,2) enclave red -->
    <rect x="380" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="397" y="137" text-anchor="middle" fill="#446688">0</text>
    <rect x="414" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="431" y="137" text-anchor="middle" fill="#446688">0</text>
    <rect x="448" y="114" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/><text x="465" y="137" text-anchor="middle" fill="#b85450">1</text>
    <rect x="482" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="499" y="137" text-anchor="middle" fill="#446688">0</text>
    <!-- row2: (2,1)(2,2) enclave red -->
    <rect x="380" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="397" y="171" text-anchor="middle" fill="#446688">0</text>
    <rect x="414" y="148" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/><text x="431" y="171" text-anchor="middle" fill="#b85450">1</text>
    <rect x="448" y="148" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/><text x="465" y="171" text-anchor="middle" fill="#b85450">1</text>
    <rect x="482" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="499" y="171" text-anchor="middle" fill="#446688">0</text>
    <!-- row3 -->
    <rect x="380" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="397" y="205" text-anchor="middle" fill="#446688">0</text>
    <rect x="414" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="431" y="205" text-anchor="middle" fill="#446688">0</text>
    <rect x="448" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="465" y="205" text-anchor="middle" fill="#446688">0</text>
    <rect x="482" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="499" y="205" text-anchor="middle" fill="#446688">0</text>

    <!-- answer badge -->
    <rect x="406" y="226" width="84" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="448" y="246" text-anchor="middle" fill="#b85450" font-weight="bold">ans = 3</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="60" y="244" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2"/>
    <text x="84" y="255" fill="#666">原 1（陆地）</text>
    <rect x="190" y="244" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <text x="214" y="255" fill="#666">沉掉的 1（连边界）</text>
    <rect x="350" y="244" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="374" y="255" fill="#666">0 海</text>
  </g>
  <text x="270" y="284" text-anchor="middle" font-size="11" fill="#888">只有左边 (1,0) 连边界 → 沉为 0；剩余 3 个 1 不连边界 → 飞地，答案 3</text>
</svg>
