<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：中序遍历 + prev 游标互连</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">递归中序 DFS，访问节点时维护 prev 并双向互连，遍历完首尾成环</text>

  <!-- 初始化 -->
  <rect x="60" y="60" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化：head = null　|　prev = null</text>
  <text x="290" y="93" text-anchor="middle" font-size="10" fill="#555">两个全局游标，head 记最小节点，prev 记上一访问节点</text>

  <!-- 递归入口 -->
  <rect x="200" y="118" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="139" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">dfs(node)</text>
  <line x1="290" y1="152" x2="290" y2="174" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="290,176 380,214 290,252 200,214" fill="#f6f6f6" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">node == null?</text>
  <text x="392" y="218" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <text x="270" y="266" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <!-- 是 -> return -->
  <line x1="380" y1="214" x2="430" y2="214" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="436" y="198" width="100" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="486" y="218" text-anchor="middle" font-size="11" fill="#888">return（回溯）</text>
  <!-- 否 -> 递归左 -->
  <line x1="290" y1="252" x2="290" y2="274" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="276" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="296" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① dfs(node.left)</text>
  <line x1="290" y1="308" x2="290" y2="326" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 访问 node -->
  <rect x="160" y="328" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 访问 node（中序到达）</text>
  <text x="290" y="362" text-anchor="middle" font-size="10" fill="#555">if prev == null: head = node</text>
  <line x1="290" y1="372" x2="290" y2="384" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 互连 -->
  <rect x="120" y="386" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="404" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">③ prev ≠ null 时：prev.right = node; node.left = prev</text>
  <text x="290" y="420" text-anchor="middle" font-size="10" fill="#8a6a20">然后 prev = node（游标滑动）</text>
  <line x1="290" y1="430" x2="290" y2="442" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归右 -->
  <rect x="200" y="444" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="464" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ dfs(node.right)</text>

  <!-- 遍历完 -->
  <rect x="60" y="486" width="460" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="505" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤ 根遍历完：prev.right = head; head.left = prev; return head</text>
</svg>
