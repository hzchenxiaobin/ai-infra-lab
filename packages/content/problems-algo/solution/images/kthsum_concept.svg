<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：子序列和 = total − 子集和(|nums|)</text>

  <!-- ===== Row 1: 原数组 ===== -->
  <text x="40" y="62" font-size="13" fill="#446688" font-weight="bold">原数组 nums</text>
  <g filter="url(#rough2)">
    <rect x="120" y="48" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="142" y="71" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="166" y="48" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="188" y="71" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="212" y="48" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="234" y="71" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">−2</text>
  </g>
  <text x="278" y="60" font-size="11" fill="#888">绿=正数</text>
  <text x="278" y="75" font-size="11" fill="#888">橙=负数</text>

  <!-- total box -->
  <rect x="430" y="46" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="64" text-anchor="middle" font-size="11" fill="#4a7a3a">正数之和</text>
  <text x="505" y="80" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">total = 6</text>

  <!-- arrow down: 取绝对值 -->
  <path d="M 180 92 L 180 116" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="110" font-size="11" fill="#888">取绝对值并排序</text>

  <!-- ===== Row 2: |nums| ===== -->
  <text x="40" y="138" font-size="13" fill="#446688" font-weight="bold">绝对值数组</text>
  <g filter="url(#rough2)">
    <rect x="120" y="124" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="142" y="147" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
    <rect x="166" y="124" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="188" y="147" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
    <rect x="212" y="124" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="234" y="147" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">4</text>
  </g>
  <text x="278" y="147" font-size="11" fill="#888">|nums| = [2, 2, 4]</text>

  <!-- ===== Row 3: bijection rules ===== -->
  <text x="40" y="186" font-size="12" fill="#555" font-weight="bold">子序列 ⟺ |nums| 的子集（一一对应）</text>
  <rect x="40" y="194" width="260" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="52" y="214" font-size="11.5" fill="#4a7a3a" font-weight="bold">正数 p（如 2、4）</text>
  <text x="52" y="232" font-size="11" fill="#444">不选入子序列 ⟺ |p| 进子集</text>
  <text x="52" y="248" font-size="11" fill="#444">→ 从 total 扣掉 p（p 本在 total 中）</text>
  <text x="52" y="264" font-size="10.5" fill="#888">选入子序列 ⟺ 不进子集（贡献 +p）</text>

  <rect x="320" y="194" width="260" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="332" y="214" font-size="11.5" fill="#d6a040" font-weight="bold">负数 −x（如 −2）</text>
  <text x="332" y="232" font-size="11" fill="#444">选入子序列 ⟺ |x| 进子集</text>
  <text x="332" y="248" font-size="11" fill="#444">→ 从 total 再扣 x（贡献 −x）</text>
  <text x="332" y="264" font-size="10.5" fill="#888">不选入子序列 ⟺ 不进子集（贡献 0）</text>

  <!-- ===== Row 4: formula ===== -->
  <rect x="60" y="290" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">子序列和 = total − 子集和(|nums|)</text>
  <text x="300" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">第 k 大子序列和 = total − 第 k 小子集和</text>

  <!-- ===== Row 5: order reversal ===== -->
  <rect x="60" y="362" width="480" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300" y="384" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">大小关系恰好反转（一一对应保重数）</text>
  <g filter="url(#rough2)">
    <rect x="100" y="396" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="175" y="416" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最大子序列和</text>
    <rect x="350" y="396" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="425" y="416" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">最小子集和</text>
  </g>
  <text x="262" y="416" text-anchor="middle" font-size="11" fill="#888">空子集 = 0</text>
  <path d="M 258 411 L 342 411" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="446" text-anchor="middle" font-size="10.5" fill="#888">第 1 大 ⟷ 第 1 小　第 k 大 ⟷ 第 k 小</text>
</svg>
