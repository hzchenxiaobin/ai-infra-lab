<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：nums=[2,4,12], start=2, goal=12</text>
  <path d="M 310 40 Q 440 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Layer 0 ===== -->
  <text x="44" y="74" font-size="12" font-weight="bold" fill="#34506e">层 0</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="78" y="60" width="56" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
    <text x="106" y="80" fill="#34506e">2</text>
  </g>
  <text x="106" y="106" text-anchor="middle" font-size="10" fill="#6a8aa8">start</text>

  <!-- ===== Layer 1: expand from 2 ===== -->
  <text x="44" y="138" font-size="12" font-weight="bold" fill="#2e6e2e">层 1</text>
  <text x="78" y="138" font-size="10.5" fill="#5a5a5a">从 x=2 对每个 num 算 +/−/^：</text>

  <!-- ops table -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- num=2 -->
    <g filter="url(#sk)"><rect x="78" y="150" width="50" height="20" rx="4" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="103" y="164">+2→4</text>
    <g filter="url(#sk)"><rect x="132" y="150" width="50" height="20" rx="4" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="157" y="164">−2→0</text>
    <g filter="url(#sk)"><rect x="186" y="150" width="54" height="20" rx="4" fill="#fdecee" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2"/></g>
    <text x="213" y="164" fill="#b85450">^2→0</text>
    <!-- num=4 -->
    <g filter="url(#sk)"><rect x="250" y="150" width="50" height="20" rx="4" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="275" y="164">+4→6</text>
    <g filter="url(#sk)"><rect x="304" y="150" width="56" height="20" rx="4" fill="#fdecee" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2"/></g>
    <text x="332" y="164" fill="#b85450">−4→−2</text>
    <g filter="url(#sk)"><rect x="364" y="150" width="50" height="20" rx="4" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="389" y="164">^4→6</text>
    <!-- num=12 -->
    <g filter="url(#sk)"><rect x="428" y="150" width="58" height="20" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="457" y="164" fill="#2e6e2e" font-weight="bold">+12→14</text>
    <g filter="url(#sk)"><rect x="496" y="150" width="62" height="20" rx="4" fill="#fdecee" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2"/></g>
    <text x="527" y="164" fill="#b85450">−12→−10</text>
    <g filter="url(#sk)"><rect x="572" y="150" width="58" height="20" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="601" y="164" fill="#2e6e2e" font-weight="bold">^12→14</text>
  </g>
  <text x="690" y="164" font-size="10" fill="#b85450">✗ 越界 / 重复</text>

  <!-- collected layer 1 states -->
  <text x="78" y="192" font-size="10.5" fill="#5a5a5a">入队新状态：</text>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="158" y="180" width="44" height="24" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="180" y="196" fill="#2e6e2e">0</text>
    <g filter="url(#sk)"><rect x="208" y="180" width="44" height="24" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="230" y="196" fill="#2e6e2e">4</text>
    <g filter="url(#sk)"><rect x="258" y="180" width="44" height="24" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="280" y="196" fill="#2e6e2e">6</text>
    <g filter="url(#sk)"><rect x="308" y="180" width="44" height="24" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="330" y="196" fill="#2e6e2e">14</text>
  </g>
  <text x="372" y="196" font-size="10" fill="#6a9a6a">均 != goal(12)，继续扩展</text>

  <!-- arrow from layer 0 to layer 1 -->
  <path d="M 106 90 L 106 120 L 330 120 L 330 150" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3"/>

  <!-- ===== Layer 2: expand from 14, hit goal ===== -->
  <text x="44" y="234" font-size="12" font-weight="bold" fill="#b85450">层 2</text>
  <text x="78" y="234" font-size="10.5" fill="#5a5a5a">从 x=14 对每个 num 算 +/−/^：</text>

  <!-- highlight: expanding 14 -->
  <g filter="url(#sk)"><rect x="78" y="246" width="50" height="28" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="103" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">14</text>
  <text x="103" y="288" text-anchor="middle" font-size="9.5" fill="#6a9a6a">dist=1</text>

  <!-- ops from 14 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- +2=16 in range -->
    <g filter="url(#sk)"><rect x="150" y="250" width="54" height="22" rx="4" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="177" y="264">+2→16</text>
    <!-- -2=12 == GOAL! -->
    <g filter="url(#sk)"><rect x="212" y="248" width="78" height="26" rx="6" fill="#fff0f3" stroke="#b85450" stroke-width="2.4"/></g>
    <text x="251" y="265" fill="#b85450" font-weight="bold">−2→12 ⭐</text>
    <!-- ^2=12 == GOAL too -->
    <g filter="url(#sk)"><rect x="298" y="248" width="78" height="26" rx="6" fill="#fff0f3" stroke="#b85450" stroke-width="2"/></g>
    <text x="337" y="265" fill="#b85450" font-weight="bold">^2→12 ⭐</text>
  </g>
  <text x="392" y="265" font-size="11" font-weight="bold" fill="#b85450">命中 goal！</text>

  <!-- arrow from 14 to ops -->
  <path d="M 128 260 L 148 260" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- ===== The shortest path ===== -->
  <text x="44" y="324" font-size="13" font-weight="bold" fill="#2e6e2e">✓ 最短路径：2 → 14 → 12（2 步）</text>

  <!-- step numbers -->
  <g font-size="11" fill="#6a9a6a" text-anchor="middle">
    <text x="120" y="350">步 0</text>
    <text x="320" y="350">步 1</text>
    <text x="540" y="350" font-weight="bold" fill="#b85450">步 2</text>
  </g>

  <!-- path nodes -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="88" y="362" width="64" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="120" y="384" fill="#34506e">2</text>
    <g filter="url(#sk)"><rect x="288" y="362" width="64" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="320" y="384" fill="#2e6e2e">14</text>
    <g filter="url(#sk)"><rect x="508" y="362" width="64" height="34" rx="6" fill="#fff0f3" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="540" y="384" fill="#b85450">12</text>
  </g>
  <!-- arrows -->
  <g stroke="#4a8e4a" stroke-width="1.8" fill="none">
    <path d="M 152 379 L 288 379" marker-end="url(#arg)"/>
    <path d="M 352 379 L 508 379" marker-end="url(#arg)"/>
  </g>
  <!-- annotations -->
  <g font-size="10.5" fill="#5a5a5a" text-anchor="middle">
    <text x="220" y="372">2 + 12 = 14</text>
    <text x="430" y="372">14 − 2 = 12</text>
  </g>
  <text x="640" y="384" font-size="11" font-weight="bold" fill="#b85450">== goal ⭐</text>

  <!-- ===== explanation boxes ===== -->
  <g filter="url(#sk)">
    <rect x="34" y="418" width="812" height="58" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="440" y="440" text-anchor="middle" font-size="11.5" fill="#7a5415">层 1 时 2+12=14 在域内且 != goal → 入队继续扩展</text>
  <text x="440" y="460" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">层 2 时 14−2=12 == goal → 立即返回 dist[14]+1 = 2</text>

  <text x="440" y="500" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">BFS 按层扩展，首次命中 goal 的层数即最短运算数 —— 无需 DFS 回溯</text>
  <text x="440" y="522" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">答案 = 2</text>
</svg>
