<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：每列只剩一个「黑色高度」，贡献 = P[max(左,右)] − P[h]</text>
  <text x="122" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1 最优染色：h = (0, 4, 0, 0, 5)</text>

  <!-- 5x5 网格：x=32 起，每格 36x30 -->
  <!-- row 0 -->
  <rect x="32" y="56" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="75" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="68" y="56" width="36" height="30" fill="#446688" stroke="#33507a" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="86" y="75" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">0</text>
  <rect x="104" y="56" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="122" y="75" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="140" y="56" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="158" y="75" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="176" y="56" width="36" height="30" fill="#446688" stroke="#33507a" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="194" y="75" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">0</text>

  <!-- row 1 -->
  <rect x="32" y="86" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="105" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="68" y="86" width="36" height="30" fill="#446688" stroke="#33507a" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="86" y="105" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">0</text>
  <rect x="104" y="86" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <text x="122" y="105" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="140" y="86" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="158" y="105" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="176" y="86" width="36" height="30" fill="#446688" stroke="#33507a" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="194" y="105" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">0</text>

  <!-- row 2 -->
  <rect x="32" y="116" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="135" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="68" y="116" width="36" height="30" fill="#446688" stroke="#33507a" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="86" y="135" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">1</text>
  <rect x="104" y="116" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="122" y="135" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="140" y="116" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="158" y="135" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="176" y="116" width="36" height="30" fill="#446688" stroke="#33507a" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="194" y="135" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">0</text>

  <!-- row 3 -->
  <rect x="32" y="146" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="165" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="68" y="146" width="36" height="30" fill="#446688" stroke="#33507a" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="86" y="165" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">0</text>
  <rect x="104" y="146" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="122" y="165" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="140" y="146" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <text x="158" y="165" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="176" y="146" width="36" height="30" fill="#446688" stroke="#33507a" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="194" y="165" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">0</text>

  <!-- row 4 -->
  <rect x="32" y="176" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="195" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="68" y="176" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="86" y="195" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="104" y="176" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="122" y="195" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="140" y="176" width="36" height="30" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="158" y="195" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="176" y="176" width="36" height="30" fill="#446688" stroke="#33507a" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="194" y="195" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">2</text>

  <!-- 高度标签 -->
  <text x="50" y="222" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">h=0</text>
  <text x="86" y="222" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">h=4</text>
  <text x="122" y="222" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">h=0</text>
  <text x="158" y="222" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">h=0</text>
  <text x="194" y="222" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">h=5</text>

  <!-- 图例 -->
  <rect x="32" y="248" width="13" height="13" fill="#446688" stroke="#33507a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="52" y="259" font-size="10.5" fill="#555" filter="url(#rough2)">列顶部前缀染黑（高 h[j] 个格子）</text>
  <rect x="32" y="274" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="52" y="285" font-size="10.5" fill="#555" filter="url(#rough2)">白色 + 同行邻居黑 ⇒ 得分</text>
  <text x="32" y="314" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">得分格子：(3,0)=5、(1,2)=3、(3,3)=3，合计 11</text>
  <text x="32" y="334" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">第 1 列的染黑同时点亮左（列 0）</text>
  <text x="32" y="350" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">右（列 2、3）两侧的白格</text>

  <!-- 右侧卡片 -->
  <rect x="232" y="56" width="268" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="366" y="74" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">P[j][t] = 第 j 列前 t 行之和（列前缀和）</text>
  <text x="366" y="90" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">任意行区间的列和 O(1) 可得</text>

  <rect x="232" y="110" width="268" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="366" y="128" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">格子 (r,j) 得分 ⇔ 白色：r ≥ h[j]</text>
  <text x="366" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">且同行邻居黑：r &lt; max(h[j−1], h[j+1])</text>
  <text x="366" y="159" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（边界列只有单侧邻居）</text>

  <rect x="232" y="176" width="268" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="366" y="196" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">contrib(j) = max( 0,</text>
  <text x="366" y="212" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">P[j][max(h[j−1],h[j+1])] − P[j][h[j]] )</text>

  <rect x="232" y="232" width="268" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="366" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">• 左右邻居都黑只计一次（用 max 不用 +）</text>
  <text x="366" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">• 区间为空 ⇒ 贡献 0（clamp 防「高列」倒扣）</text>
  <text x="366" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">• 依赖 h[j−1] 与 h[j+1]——跨两列！</text>

  <rect x="232" y="314" width="268" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="366" y="335" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ DP 状态需携带最近两列的高度</text>
</svg>
