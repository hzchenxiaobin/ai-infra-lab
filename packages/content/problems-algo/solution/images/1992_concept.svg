<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：矩形保证 → 遇 1 即左上角，向右向下扩展找边界
  </text>
  <text x="300" y="50" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">
    农场组互不相邻 + 必为矩形 → 扫描中首个未清零的 1 必是某组左上角
  </text>

  <!-- Grid 4x4, cell=36, origin (90,90) -->
  <!-- column labels -->
  <text x="108" y="82" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="144" y="82" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="180" y="82" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="216" y="82" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <!-- row labels -->
  <text x="78" y="112" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="78" y="148" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="78" y="184" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="78" y="220" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <!-- row0: 1 1 0 0  (Group A green) -->
  <rect x="90"  y="90" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="126" y="90" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="90" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="198" y="90" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row1: 0 0 0 0 -->
  <rect x="90"  y="126" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="126" y="126" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="126" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="198" y="126" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row2: 0 1 1 1  (Group B blue) -->
  <rect x="90"  y="162" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="126" y="162" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="162" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="198" y="162" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <!-- row3: 0 1 1 1 -->
  <rect x="90"  y="198" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="126" y="198" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="198" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="198" y="198" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>

  <!-- top-left corner markers (red) -->
  <circle cx="108" cy="108" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="144" cy="180" r="5" fill="#b85450" filter="url(#rough2)"/>
  <!-- bottom-right corner markers (orange) -->
  <circle cx="144" cy="108" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="216" cy="216" r="5" fill="#d6a040" filter="url(#rough2)"/>

  <!-- extension arrows for Group B -->
  <!-- right scan: above row2, from (126,154) to (216,154) -->
  <path d="M 126 154 L 216 154" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="171" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ 扫首行找 c2</text>
  <!-- down scan: left of col1, from (116,162) to (116,216) -->
  <path d="M 116 162 L 116 216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="100" y="192" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">↓ 找</text>
  <text x="100" y="204" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">r2</text>

  <!-- result labels below grid -->
  <text x="117" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">A → [0,0,0,1]</text>
  <text x="180" y="252" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">B → [2,1,3,3]</text>

  <!-- right-side explanation box -->
  <rect x="280" y="90" width="300" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="114" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">
    为什么首个 1 = 左上角？
  </text>
  <text x="296" y="138" font-size="11" fill="#555" filter="url(#rough2)">1. 自上而下、自左而右扫描</text>
  <text x="296" y="156" font-size="11" fill="#555" filter="url(#rough2)">2. 已处理的矩形已被清零</text>
  <text x="296" y="174" font-size="11" fill="#555" filter="url(#rough2)">3. 故仍为 1 的格必无上邻/左邻 1</text>
  <text x="296" y="192" font-size="11" fill="#555" filter="url(#rough2)">4. 即矩形组的左上角 (r1, c1)</text>
  <text x="296" y="216" font-size="11" fill="#b85450" filter="url(#rough2)">找到 (r1,c1) 后：</text>
  <text x="306" y="234" font-size="11" fill="#4a7a3a" filter="url(#rough2)">向右扫到首个 0 → c2</text>
  <text x="306" y="250" font-size="11" fill="#446688" filter="url(#rough2)">向下扫到首个 0 → r2</text>

  <!-- legend -->
  <rect x="90" y="280" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="112" y="292" font-size="10.5" fill="#555" filter="url(#rough2)">农场</text>
  <rect x="150" y="280" width="14" height="14" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="172" y="292" font-size="10.5" fill="#555" filter="url(#rough2)">森林</text>
  <circle cx="220" cy="287" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="232" y="292" font-size="10.5" fill="#555" filter="url(#rough2)">左上角 (r1,c1)</text>
  <circle cx="330" cy="287" r="4.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="342" y="292" font-size="10.5" fill="#555" filter="url(#rough2)">右下角 (r2,c2)</text>

  <text x="300" y="332" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    无需 DFS/BFS：矩形 + 不相邻 ⟹ 直接定边界，O(1) 额外空间
  </text>
  <text x="300" y="350" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">
    对照 200/695 沉岛模板：那类岛屿形状任意需漫灌；本题矩形保证让扩展即可
  </text>
</svg>
