<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐行 CASE 求值，旧值 → 新值翻转</text>

  <!-- Column headers -->
  <g font-size="10" fill="#888" font-weight="bold">
    <text x="55" y="58" text-anchor="middle">行</text>
    <text x="110" y="58" text-anchor="middle">id</text>
    <text x="150" y="58" text-anchor="middle">name</text>
    <text x="210" y="58" text-anchor="middle">旧 sex</text>
    <text x="290" y="58" text-anchor="middle">CASE 求值</text>
    <text x="380" y="58" text-anchor="middle">新 sex</text>
    <text x="465" y="58" text-anchor="middle">结果</text>
  </g>

  <!-- Row 1: A, m -> f -->
  <rect x="30" y="70" width="470" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="110" y="104" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="150" y="104" text-anchor="middle" font-size="12" fill="#333">A</text>
  <rect x="190" y="88" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="108" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">m</text>
  <text x="290" y="98" text-anchor="middle" font-size="10" fill="#555">WHEN 'm' THEN</text>
  <text x="290" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">'f'</text>
  <path d="M 235 104 L 358 104" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="88" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="108" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="465" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 翻转</text>

  <!-- Row 2: B, f -> m -->
  <rect x="30" y="134" width="470" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="110" y="168" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="150" y="168" text-anchor="middle" font-size="12" fill="#333">B</text>
  <rect x="190" y="152" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="172" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="290" y="162" text-anchor="middle" font-size="10" fill="#555">WHEN 'f' THEN</text>
  <text x="290" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">'m'</text>
  <path d="M 235 168 L 358 168" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="152" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="172" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">m</text>
  <text x="465" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 翻转</text>

  <!-- Row 3: C, m -> f -->
  <rect x="30" y="198" width="470" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="232" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="110" y="232" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="150" y="232" text-anchor="middle" font-size="12" fill="#333">C</text>
  <rect x="190" y="216" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="236" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">m</text>
  <text x="290" y="226" text-anchor="middle" font-size="10" fill="#555">WHEN 'm' THEN</text>
  <text x="290" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">'f'</text>
  <path d="M 235 232 L 358 232" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="216" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="236" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="465" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 翻转</text>

  <!-- Row 4: D, f -> m -->
  <rect x="30" y="262" width="470" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="296" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="110" y="296" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="150" y="296" text-anchor="middle" font-size="12" fill="#333">D</text>
  <rect x="190" y="280" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="300" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="290" y="290" text-anchor="middle" font-size="10" fill="#555">WHEN 'f' THEN</text>
  <text x="290" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">'m'</text>
  <path d="M 235 296 L 358 296" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="280" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="300" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">m</text>
  <text x="465" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 翻转</text>

  <!-- Bottom: rule box -->
  <rect x="30" y="330" width="470" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="265" y="350" text-anchor="middle" font-size="11" fill="#444">每行读旧值 → CASE 命中对应分支 → 写新值，旧值不丢失</text>
  <text x="265" y="368" text-anchor="middle" font-size="10" fill="#888">XOR 捷径：'m'=109, 'f'=102, 109^102=11</text>
  <text x="265" y="382" text-anchor="middle" font-size="10" fill="#888">CHAR(ASCII(sex) ^ 11)：109^11=102='f'，102^11=109='m'</text>
</svg>
