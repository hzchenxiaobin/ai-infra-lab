<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：谷底日 = 左 time 步非递增 + 右 time 步非递减</text>

  <!-- Bars: security = [5,3,3,3,5,6,2], baseline y=250, scale 18/unit -->
  <!-- i=0 val=5 (left window, blue) -->
  <rect x="70" y="160" width="44" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="92" y="152" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="92" y="268" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>

  <!-- i=1 val=3 (left window, blue) -->
  <rect x="130" y="196" width="44" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="152" y="188" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="152" y="268" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>

  <!-- i=2 val=3 (valley, red) -->
  <rect x="190" y="196" width="44" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="212" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="212" y="268" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=2</text>

  <!-- i=3 val=3 (right window, green) -->
  <rect x="250" y="196" width="44" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="272" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="272" y="268" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>

  <!-- i=4 val=5 (right window, green) -->
  <rect x="310" y="160" width="44" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="332" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="332" y="268" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>

  <!-- i=5 val=6 (out of window, gray) -->
  <rect x="370" y="142" width="44" height="108" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="392" y="134" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">6</text>
  <text x="392" y="268" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>

  <!-- i=6 val=2 (out of window, gray) -->
  <rect x="430" y="214" width="44" height="36" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="452" y="206" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">2</text>
  <text x="452" y="268" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>

  <!-- Left window trend arrows (blue, non-increasing) -->
  <line x1="114" y1="165" x2="128" y2="193" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <line x1="174" y1="200" x2="188" y2="200" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- Right window trend arrows (green, non-decreasing) -->
  <line x1="234" y1="200" x2="248" y2="200" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <line x1="294" y1="193" x2="308" y2="165" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- Left bracket label -->
  <text x="130" y="300" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">左侧 time=2 步</text>
  <text x="130" y="316" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">非递增 (≥)</text>

  <!-- Right bracket label -->
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右侧 time=2 步</text>
  <text x="300" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">非递减 (≤)</text>

  <!-- Formula box -->
  <rect x="40" y="332" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 i 天合格 ⟺ left[i] ≥ time 且 right[i] ≥ time</text>
</svg>
