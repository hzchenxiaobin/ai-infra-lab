<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：最小堆维护「水位边界」，从外向内扩散</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">边界最低格的高度 = 当前水位；向内探索遇低洼则注水至水位</text>

  <!-- 4x4 grid: cell=54, x0=70, y0=80 -->
  <!-- border cells blue (in heap), interior white -->
  <g filter="url(#rough2)" font-size="15" font-weight="bold">
    <!-- row0: all border -->
    <rect x="70" y="80" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="97" y="113" text-anchor="middle" fill="#446688">3</text>
    <rect x="124" y="80" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="151" y="113" text-anchor="middle" fill="#446688">3</text>
    <rect x="178" y="80" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="205" y="113" text-anchor="middle" fill="#446688">3</text>
    <rect x="232" y="80" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="259" y="113" text-anchor="middle" fill="#446688">3</text>
    <!-- row1: border, interior 1 / 2, border -->
    <rect x="70" y="134" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="97" y="167" text-anchor="middle" fill="#446688">3</text>
    <rect x="124" y="134" width="54" height="54" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="151" y="167" text-anchor="middle" fill="#555">1</text>
    <rect x="178" y="134" width="54" height="54" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="205" y="167" text-anchor="middle" fill="#555">2</text>
    <rect x="232" y="134" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="259" y="167" text-anchor="middle" fill="#446688">3</text>
    <!-- row2: border, interior 3 / 1, border -->
    <rect x="70" y="188" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="97" y="221" text-anchor="middle" fill="#446688">3</text>
    <rect x="124" y="188" width="54" height="54" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="151" y="221" text-anchor="middle" fill="#555">3</text>
    <rect x="178" y="188" width="54" height="54" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="205" y="221" text-anchor="middle" fill="#555">1</text>
    <rect x="232" y="188" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="259" y="221" text-anchor="middle" fill="#446688">3</text>
    <!-- row3: all border -->
    <rect x="70" y="242" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="97" y="275" text-anchor="middle" fill="#446688">3</text>
    <rect x="124" y="242" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="151" y="275" text-anchor="middle" fill="#446688">3</text>
    <rect x="178" y="242" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="205" y="275" text-anchor="middle" fill="#446688">3</text>
    <rect x="232" y="242" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="259" y="275" text-anchor="middle" fill="#446688">3</text>
  </g>

  <!-- water overlay on interior cells (after fill): blue water portion -->
  <g filter="url(#rough2)" opacity="0.55">
    <!-- (1,1)=1 -> water 2 (level 3): water bar height = 2/3 * 54 = 36, sits at bottom -->
    <rect x="124" y="152" width="54" height="36" fill="#b8d4f0" stroke="none" rx="2"/>
    <!-- (1,2)=2 -> water 1: height 18 -->
    <rect x="178" y="170" width="54" height="18" fill="#b8d4f0" stroke="none" rx="2"/>
    <!-- (2,1)=3 -> water 0: none -->
    <!-- (2,2)=1 -> water 2: height 36 -->
    <rect x="178" y="206" width="54" height="36" fill="#b8d4f0" stroke="none" rx="2"/>
  </g>

  <!-- min-heap illustration on the right -->
  <g filter="url(#rough2)" font-size="12">
    <text x="430" y="74" text-anchor="middle" fill="#446688" font-weight="bold">最小堆（按高度）</text>
    <!-- heap boxes, min on top -->
    <rect x="386" y="84" width="88" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="430" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">3 ← 堆顶(最低)</text>
    <rect x="386" y="114" width="88" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="430" y="130" text-anchor="middle" fill="#555">3</text>
    <rect x="386" y="140" width="88" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="430" y="156" text-anchor="middle" fill="#555">3</text>
    <rect x="386" y="166" width="88" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="430" y="182" text-anchor="middle" fill="#555">3 …</text>
    <text x="430" y="206" text-anchor="middle" fill="#888" font-size="10">弹出最低边界格</text>
    <text x="430" y="220" text-anchor="middle" fill="#888" font-size="10">→ 其高度即「水位」</text>
  </g>

  <!-- arrow: popped border cell (0,1) -> interior (1,1), fill water -->
  <g filter="url(#rough2)">
    <path d="M 151 138 L 151 134" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrO)" transform="translate(0,-2)"/>
    <path d="M 178 102 L 220 102 L 220 150 L 178 150" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrO)"/>
    <text x="248" y="132" font-size="10" fill="#d6a040" font-weight="bold">水位 3</text>
    <text x="248" y="146" font-size="10" fill="#d6a040">注水 3−1=2</text>
  </g>

  <!-- invariant text box -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="330" y="246" width="210" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="435" y="266" text-anchor="middle" fill="#4a7a3a" font-weight="bold">不变式</text>
    <text x="340" y="284" fill="#555">• 堆中存「已确定水位的边界」</text>
    <text x="340" y="300" fill="#555">• 堆顶最低 = 当前水位</text>
    <text x="340" y="316" fill="#555">• 邻居更低 → 注水至水位</text>
    <text x="340" y="332" fill="#555">• 邻居更高 → 自己当新墙入堆</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="78" y="316" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2"/>
    <text x="100" y="326" fill="#666">边界格(入堆)</text>
    <rect x="178" y="316" width="16" height="12" fill="#b8d4f0" stroke="none" rx="2"/>
    <text x="200" y="326" fill="#666">注水(水位−高度)</text>
    <rect x="300" y="316" width="16" height="12" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="2"/>
    <text x="322" y="326" fill="#666">内陆格</text>
  </g>

  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#888">类比 42 题：1D 的 min(max_left, max_right) → 2D 的「最低边界扩散」</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#aaa">本图：4×4 全边界=3，水位=3；内陆 (1,1)(2,2) 各注水 2，(1,2) 注水 1，(2,1)=3 不注水，合计 5</text>
</svg>
