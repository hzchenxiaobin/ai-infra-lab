<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2740p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">下界证明：任意划分 v=|max(nums1)−min(nums2)| ≥ 最小相邻间隙 g</text>

  <!-- ===== Case 1: a <= b ===== -->
  <text x="40" y="64" font-size="13" fill="#4a7a3a" font-weight="bold">情形① a ≤ b</text>
  <text x="40" y="82" font-size="11" fill="#4a7a3a">a=max(nums1), b=min(nums2), v=b−a</text>

  <!-- sorted row with a ... b adjacent (no strict between) -->
  <g font-size="16" font-weight="bold">
    <rect x="80" y="96" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="104" y="124" text-anchor="middle" fill="#333">…</text>
    <rect x="128" y="96" width="48" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="152" y="124" text-anchor="middle" fill="#b85450">a</text>
    <rect x="176" y="96" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
    <text x="200" y="124" text-anchor="middle" fill="#d6a040">b</text>
    <rect x="224" y="96" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="248" y="124" text-anchor="middle" fill="#333">…</text>
  </g>

  <!-- arrow pointing the adjacent gap a->b -->
  <path d="M152,150 L200,150" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2740p)" filter="url(#rough2)"/>
  <text x="176" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a 与 b 严格相邻</text>

  <!-- reasoning -->
  <rect x="290" y="92" width="250" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="415" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">区间 (a,b) 内无任何元素</text>
  <text x="415" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">否则该元素放 nums1→max&gt;a</text>
  <text x="415" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a">放 nums2→min&lt;b，皆矛盾</text>

  <!-- conclusion case1 -->
  <text x="40" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">⇒ a,b 是排序后相邻值，v=b−a 恰为某个相邻间隙 ≥ g ✓</text>

  <!-- ===== Case 2: a > b ===== -->
  <text x="40" y="224" font-size="13" fill="#b85450" font-weight="bold">情形② a &gt; b</text>
  <text x="40" y="242" font-size="11" fill="#b85450">a=max(nums1), b=min(nums2), v=a−b</text>

  <!-- sorted row b ... a with several gaps summed -->
  <g font-size="16" font-weight="bold">
    <rect x="80" y="256" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="104" y="284" text-anchor="middle" fill="#d6a040">b</text>
    <rect x="128" y="256" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="152" y="284" text-anchor="middle" fill="#333">x</text>
    <rect x="176" y="256" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="200" y="284" text-anchor="middle" fill="#333">y</text>
    <rect x="224" y="256" width="48" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="248" y="284" text-anchor="middle" fill="#b85450">a</text>
    <rect x="272" y="256" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="296" y="284" text-anchor="middle" fill="#333">…</text>
  </g>

  <!-- bracket spanning b..a = sum of gaps -->
  <path d="M80,310 Q80,318 88,318 L248,318 Q256,318 256,310" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a−b = 区间内各相邻间隙之和</text>

  <!-- gap ticks -->
  <g font-size="10" fill="#888">
    <text x="128" y="306" text-anchor="middle">g₁</text>
    <text x="176" y="306" text-anchor="middle">g₂</text>
    <text x="224" y="306" text-anchor="middle">g₃</text>
  </g>

  <!-- conclusion case2 -->
  <rect x="320" y="252" width="220" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="430" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v = a−b = g₁+g₂+… ≥ min(gᵢ)</text>
  <text x="430" y="288" text-anchor="middle" font-size="10" fill="#b85450">和 ≥ 每一项 ≥ g（最小间隙）</text>
  <text x="430" y="304" text-anchor="middle" font-size="10" fill="#b85450">⇒ v ≥ g ✓</text>

  <!-- final -->
  <rect x="60" y="362" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">两种情形均有 v ≥ g；而「前缀切」构造可达 g</text>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#d6a040">上界 = 下界 = g，故答案恰为排序后最小相邻间隙</text>
  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#888">（标签可任选 nums1/nums2，故总取较小者；情形①即为最优形态）</text>
</svg>
