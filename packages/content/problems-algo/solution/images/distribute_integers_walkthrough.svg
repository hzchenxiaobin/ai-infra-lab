<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums=[1,1,2,2], quantity=[2,2]</text>

  <!-- setup line -->
  <rect x="40" y="44" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="12" fill="#333" filter="url(#rough2)">freq=[2,2]  m=2  full=11₂  sub_sum: 00→0, 01→2, 10→2, 11→4</text>

  <!-- root node -->
  <rect x="200" y="96" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dfs(0, 00)  remaining=11</text>

  <!-- three branches: sub=11, sub=10, sub=01, sub=00 -->
  <!-- sub=11 -->
  <path d="M250,132 L130,170" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="160" font-size="11" fill="#b85450" filter="url(#rough2)">sub=11</text>
  <rect x="60" y="174" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sum=4 &gt; freq[0]=2</text>
  <text x="135" y="210" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">剪枝 ✗</text>

  <!-- sub=10 -->
  <path d="M290,132 L290,170" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="158" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sub=10</text>
  <rect x="210" y="174" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="295" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sum=2 ≤ freq[0]=2 ✓</text>
  <text x="295" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ dfs(1, 10)</text>

  <!-- sub=01 -->
  <path d="M330,132 L450,170" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="160" font-size="11" fill="#888" filter="url(#rough2)">sub=01</text>
  <rect x="400" y="174" width="150" height="44" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="475" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sum=2 ≤ 2</text>
  <text x="475" y="210" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">(对称，略)</text>

  <!-- dfs(1, 10) node -->
  <rect x="210" y="232" width="170" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="295" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dfs(1, 10)  remaining=01</text>

  <path d="M295,268 L295,288" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="305" y="284" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sub=01</text>

  <!-- check node -->
  <rect x="200" y="292" width="190" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="295" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sum=2 ≤ freq[1]=2 ✓</text>
  <text x="295" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ dfs(2, 11)</text>

  <path d="M295,332 L295,352" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- success -->
  <rect x="195" y="356" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mask=11 == full</text>
  <text x="295" y="392" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回 True ⭐</text>

  <!-- summary box -->
  <rect x="40" y="232" width="150" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">降序排序 freq</text>
  <text x="115" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">使大需求优先匹配</text>
  <text x="115" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">剪枝更激进</text>
</svg>
