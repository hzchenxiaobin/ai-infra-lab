<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：maxSum(L=3, M=2)，L 在左、M 在右</text>

  <!-- nums mini -->
  <text x="40" y="50" font-size="11" fill="#888">nums:</text>
  <g font-size="11" fill="#333">
    <rect x="80" y="36" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="100" y="51" text-anchor="middle">3</text>
    <rect x="122" y="36" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="142" y="51" text-anchor="middle">8</text>
    <rect x="164" y="36" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="184" y="51" text-anchor="middle">1</text>
    <rect x="206" y="36" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="226" y="51" text-anchor="middle" fill="#aaa">3</text>
    <rect x="248" y="36" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="268" y="51" text-anchor="middle" fill="#aaa">2</text>
    <rect x="290" y="36" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="310" y="51" text-anchor="middle" fill="#aaa">1</text>
    <rect x="332" y="36" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="352" y="51" text-anchor="middle">8</text>
    <rect x="374" y="36" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="394" y="51" text-anchor="middle">9</text>
    <rect x="416" y="36" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="436" y="51" text-anchor="middle" fill="#aaa">0</text>
  </g>

  <!-- Table header -->
  <rect x="40" y="68" width="478" height="26" fill="#446688" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#fff" font-weight="bold">
    <text x="58" y="85" text-anchor="start">i</text>
    <text x="120" y="85" text-anchor="middle">L子数组</text>
    <text x="218" y="85" text-anchor="middle">L和</text>
    <text x="282" y="85" text-anchor="middle">maxL</text>
    <text x="350" y="85" text-anchor="middle">M子数组</text>
    <text x="448" y="85" text-anchor="middle">M和</text>
    <text x="498" y="85" text-anchor="middle">合计</text>
  </g>

  <!-- column x positions: i@58, Larr@120(c), Lsum@218(c), maxL@282(c), Marr@350(c), Msum@448(c), total@498(c) -->
  <!-- Row i=2 -->
  <rect x="40" y="94" width="478" height="28" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="58" y="112" text-anchor="start">2</text>
    <text x="120" y="112" text-anchor="middle">[3,8,1]</text>
    <text x="218" y="112" text-anchor="middle">12</text>
    <text x="282" y="112" text-anchor="middle" fill="#446688" font-weight="bold">12</text>
    <text x="350" y="112" text-anchor="middle">[3,2]</text>
    <text x="448" y="112" text-anchor="middle">5</text>
    <text x="498" y="112" text-anchor="middle">17</text>
  </g>

  <!-- Row i=3 -->
  <rect x="40" y="122" width="478" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="58" y="140" text-anchor="start">3</text>
    <text x="120" y="140" text-anchor="middle">[8,1,3]</text>
    <text x="218" y="140" text-anchor="middle">12</text>
    <text x="282" y="140" text-anchor="middle" fill="#446688" font-weight="bold">12</text>
    <text x="350" y="140" text-anchor="middle">[2,1]</text>
    <text x="448" y="140" text-anchor="middle">3</text>
    <text x="498" y="140" text-anchor="middle">15</text>
  </g>

  <!-- Row i=4 -->
  <rect x="40" y="150" width="478" height="28" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="58" y="168" text-anchor="start">4</text>
    <text x="120" y="168" text-anchor="middle">[1,3,2]</text>
    <text x="218" y="168" text-anchor="middle">6</text>
    <text x="282" y="168" text-anchor="middle" fill="#446688" font-weight="bold">12</text>
    <text x="350" y="168" text-anchor="middle">[1,8]</text>
    <text x="448" y="168" text-anchor="middle">9</text>
    <text x="498" y="168" text-anchor="middle">21</text>
  </g>

  <!-- Row i=5 highlight (answer) -->
  <rect x="40" y="178" width="478" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="58" y="196" text-anchor="start" font-weight="bold">5</text>
    <text x="120" y="196" text-anchor="middle">[3,2,1]</text>
    <text x="218" y="196" text-anchor="middle">6</text>
    <text x="282" y="196" text-anchor="middle" fill="#446688" font-weight="bold">12</text>
    <text x="350" y="196" text-anchor="middle" font-weight="bold">[8,9]</text>
    <text x="448" y="196" text-anchor="middle" font-weight="bold">17</text>
    <text x="498" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">29</text>
  </g>

  <!-- Row i=6 -->
  <rect x="40" y="206" width="478" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="58" y="224" text-anchor="start">6</text>
    <text x="120" y="224" text-anchor="middle">[2,1,8]</text>
    <text x="218" y="224" text-anchor="middle">11</text>
    <text x="282" y="224" text-anchor="middle" fill="#446688" font-weight="bold">12</text>
    <text x="350" y="224" text-anchor="middle">[9,0]</text>
    <text x="448" y="224" text-anchor="middle">9</text>
    <text x="498" y="224" text-anchor="middle">21</text>
  </g>

  <!-- annotation for maxL -->
  <text x="282" y="250" text-anchor="middle" font-size="10" fill="#446688">↑ maxL 在 i=2 达到 12 后不再被超越</text>

  <!-- result box -->
  <rect x="60" y="262" width="440" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">maxSum(3,2) = 29：L=[3,8,1]=12, M=[8,9]=17</text>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#888">换序 maxSum(2,3) 同样为 29 → 答案 = 29</text>
  <text x="280" y="318" text-anchor="middle" font-size="10.5" fill="#888">maxL 只增不减：每个分割点只关心「左侧最优 L」+「右侧当前 M」</text>
</svg>
