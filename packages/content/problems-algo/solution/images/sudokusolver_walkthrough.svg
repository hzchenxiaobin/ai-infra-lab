<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：从 (0,2) 起填空格，回溯一条路径</text>

  <!-- thin grid lines -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="80" y1="50" x2="80" y2="350"/>
    <line x1="110" y1="50" x2="110" y2="350"/>
    <line x1="170" y1="50" x2="170" y2="350"/>
    <line x1="200" y1="50" x2="200" y2="350"/>
    <line x1="260" y1="50" x2="260" y2="350"/>
    <line x1="290" y1="50" x2="290" y2="350"/>
    <line x1="50" y1="80" x2="320" y2="80"/>
    <line x1="50" y1="110" x2="320" y2="110"/>
    <line x1="50" y1="170" x2="320" y2="170"/>
    <line x1="50" y1="200" x2="320" y2="200"/>
    <line x1="50" y1="260" x2="320" y2="260"/>
    <line x1="50" y1="290" x2="320" y2="290"/>
  </g>
  <!-- thick box boundaries -->
  <g stroke="#888" stroke-width="2" filter="url(#rough2)">
    <rect x="50" y="50" width="270" height="300" fill="none"/>
    <line x1="140" y1="50" x2="140" y2="350"/>
    <line x1="230" y1="50" x2="230" y2="350"/>
    <line x1="50" y1="140" x2="320" y2="140"/>
    <line x1="50" y1="230" x2="320" y2="230"/>
  </g>

  <!-- board initial digits -->
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <!-- row 0: 5 3 . . 7 . . . . -->
    <text x="65" y="71" fill="#333">5</text>
    <text x="95" y="71" fill="#333">3</text>
    <text x="185" y="71" fill="#333">7</text>
    <!-- row 1 -->
    <text x="65" y="101" fill="#333">6</text>
    <text x="155" y="101" fill="#333">1</text>
    <text x="185" y="101" fill="#333">9</text>
    <text x="215" y="101" fill="#333">5</text>
    <!-- row 2 -->
    <text x="95" y="131" fill="#333">9</text>
    <text x="125" y="131" fill="#333">8</text>
    <text x="275" y="131" fill="#333">6</text>
    <!-- row 3 -->
    <text x="65" y="161" fill="#333">8</text>
    <text x="185" y="161" fill="#333">6</text>
    <text x="305" y="161" fill="#333">3</text>
    <!-- row 4 -->
    <text x="65" y="191" fill="#333">4</text>
    <text x="155" y="191" fill="#333">8</text>
    <text x="215" y="191" fill="#333">3</text>
    <text x="305" y="191" fill="#333">1</text>
    <!-- row 5 -->
    <text x="65" y="221" fill="#333">7</text>
    <text x="185" y="221" fill="#333">2</text>
    <text x="305" y="221" fill="#333">6</text>
    <!-- row 6 -->
    <text x="95" y="251" fill="#333">6</text>
    <text x="245" y="251" fill="#333">2</text>
    <text x="275" y="251" fill="#333">8</text>
    <!-- row 7 -->
    <text x="155" y="281" fill="#333">4</text>
    <text x="185" y="281" fill="#333">1</text>
    <text x="215" y="281" fill="#333">9</text>
    <text x="305" y="281" fill="#333">5</text>
    <!-- row 8 -->
    <text x="185" y="311" fill="#333">8</text>
    <text x="275" y="311" fill="#333">7</text>
    <text x="305" y="311" fill="#333">9</text>
  </g>

  <!-- step 1: fill (0,2)=1 (blue, tentative - will backtrack) -->
  <rect x="110" y="50" width="30" height="30" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="71" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <circle cx="125" cy="65" r="10" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="42" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">①试1</text>

  <!-- step 2: (0,3)=2 (blue) -->
  <rect x="170" y="50" width="30" height="30" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="185" y="71" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">6</text>
  <text x="185" y="42" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">②填6</text>

  <!-- step 3: continue, eventually hit dead end -> backtrack, erase ① -->
  <!-- show ① crossed out -->
  <path d="M 114 54 L 136 76" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="42" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">③回擦</text>

  <!-- step 4: fill (0,2)=4 (green, correct) -->
  <rect x="350" y="60" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="81" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- right side: mini timeline -->
  <rect x="350" y="110" width="200" height="220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="450" y="130" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">回溯时间线</text>
  <line x1="366" y1="140" x2="534" y2="140" stroke="#e0c878" stroke-width="1" filter="url(#rough2)"/>

  <text x="366" y="160" font-size="10.5" fill="#446688" font-weight="bold">① (0,2) 试 d=1</text>
  <text x="380" y="176" font-size="9.5" fill="#888">候选{1,2,4}，先试1</text>

  <text x="366" y="196" font-size="10.5" fill="#446688" font-weight="bold">② (0,3) 试 d=6</text>
  <text x="380" y="212" font-size="9.5" fill="#888">候选{2,4,6}，试6</text>

  <text x="366" y="232" font-size="10.5" fill="#b85450" font-weight="bold">③ 下游死路 → 回擦</text>
  <text x="380" y="248" font-size="9.5" fill="#b85450">(0,3)擦6，(0,2)擦1</text>
  <text x="380" y="262" font-size="9.5" fill="#888">回到 (0,2) 试 d=2</text>

  <text x="366" y="282" font-size="10.5" fill="#4a7a3a" font-weight="bold">④ 最终 (0,2)=4 ✓</text>
  <text x="380" y="298" font-size="9.5" fill="#4a7a3a">解唯一，下游全通</text>

  <text x="366" y="318" font-size="9" fill="#888">…直到所有空格填满</text>

  <!-- arrow from ④ to board (0,2) -->
  <path d="M 350 75 Q 330 70 140 65" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#888">蓝=试探中  红×=回擦  绿=确定填入</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#888">题目保证解唯一 → 第一个走通的分支即为答案</text>
</svg>
