<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2798" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">计数：数一数 hours[i] ≥ target 的元素个数</text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#888">单趟扫描，cnt 每命中一次自增</text>

  <!-- Array row of cells [0,1,2,3,4] -->
  <text x="40" y="100" font-size="11" fill="#666" font-weight="bold">hours 数组</text>
  <!-- cell 0 (no) -->
  <rect x="120" y="86" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <!-- cell 1 (no) -->
  <rect x="178" y="86" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- cell 2 (yes) -->
  <rect x="236" y="86" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <!-- cell 3 (yes) -->
  <rect x="294" y="86" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <!-- cell 4 (yes) -->
  <rect x="352" y="86" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- index labels -->
  <text x="146" y="134" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="204" y="134" text-anchor="middle" font-size="10" fill="#999">i=1</text>
  <text x="262" y="134" text-anchor="middle" font-size="10" fill="#999">i=2</text>
  <text x="320" y="134" text-anchor="middle" font-size="10" fill="#999">i=3</text>
  <text x="378" y="134" text-anchor="middle" font-size="10" fill="#999">i=4</text>

  <!-- target threshold marker below the bar 2 -->
  <path d="M 262 138 L 262 156" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="210" y="156" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="176" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">target = 2  （阈值线）</text>

  <!-- comparison hint per cell -->
  <text x="146" y="206" text-anchor="middle" font-size="10" fill="#b85450">0&lt;2 ✗</text>
  <text x="204" y="206" text-anchor="middle" font-size="10" fill="#b85450">1&lt;2 ✗</text>
  <text x="262" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2≥2 ✓</text>
  <text x="320" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3≥2 ✓</text>
  <text x="378" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4≥2 ✓</text>

  <!-- arrows pointing to cnt box -->
  <path d="M 262 214 L 262 234" stroke="#888" stroke-width="1.4" marker-end="url(#arr2798)" filter="url(#rough2)"/>
  <path d="M 320 214 L 320 234" stroke="#888" stroke-width="1.4" marker-end="url(#arr2798)" filter="url(#rough2)"/>
  <path d="M 378 214 L 378 234" stroke="#888" stroke-width="1.4" marker-end="url(#arr2798)" filter="url(#rough2)"/>

  <!-- cnt accumulator -->
  <rect x="200" y="240" width="160" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#888">计数器</text>
  <text x="280" y="280" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">cnt = 3</text>

  <!-- note about >= vs > -->
  <rect x="40" y="306" width="480" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="328" font-size="12" fill="#b85450" font-weight="bold">审题要点：「至少 target」= ≥，不是 &gt;</text>
  <text x="60" y="348" font-size="11" fill="#666">恰好等于 target（如 hours[2]=2）也算满足，必须取等号，否则会漏算</text>
</svg>
