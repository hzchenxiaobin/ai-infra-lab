<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：频次表 → SOS DP → 查表求和</text>

  <!-- Step 1 -->
  <rect x="40" y="48" width="480" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="68" font-size="12" fill="#446688" font-weight="bold">步骤 1：构建频次表 freq[0..2¹⁶)</text>
  <text x="54" y="86" font-family="monospace" font-size="10" fill="#555">freq = [0] * 65536</text>
  <text x="54" y="100" font-family="monospace" font-size="10" fill="#555">for a in nums:</text>
  <text x="54" y="114" font-family="monospace" font-size="10" fill="#555">    for b in nums: freq[a &amp; b] += 1</text>
  <text x="54" y="130" font-size="10" fill="#888">两重循环 O(n²)，记录每个「两两 AND 结果 x」出现的有序对 (i,j) 数量</text>

  <path d="M 280 140 L 280 156" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: SOS DP -->
  <rect x="40" y="162" width="480" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="182" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 2：SOS DP 预处理 g[s] = Σ(x⊆s) freq[x]</text>
  <text x="54" y="200" font-family="monospace" font-size="10" fill="#555">g = freq.copy()</text>
  <text x="54" y="214" font-family="monospace" font-size="10" fill="#555">for i in range(16):          # 逐位</text>
  <text x="54" y="228" font-family="monospace" font-size="10" fill="#555">    for s in range(65536):</text>
  <text x="54" y="242" font-family="monospace" font-size="10" fill="#555">        if s &amp; (1 &lt;&lt; i): g[s] += g[s ^ (1 &lt;&lt; i)]</text>
  <text x="54" y="260" font-size="10" fill="#888">每轮把「含第 i 位的 s」加上「去掉该位的子集」的值，16 轮后 g[s] = s 所有子集的 freq 之和</text>
  <text x="54" y="274" font-size="10" fill="#4a7a3a">复杂度 O(2¹⁶·16) ≈ 10⁶，一次预处理全局复用</text>

  <path d="M 280 282 L 280 298" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: query -->
  <rect x="40" y="304" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="324" font-size="12" fill="#d6a040" font-weight="bold">步骤 3：对每个 A[k] 查表，累加答案</text>
  <text x="54" y="342" font-family="monospace" font-size="10" fill="#555">FULL = 65535</text>
  <text x="54" y="356" font-family="monospace" font-size="10" fill="#555">ans = sum(g[FULL ^ a] for a in nums)</text>
  <text x="54" y="374" font-size="10" fill="#888">x &amp; a == 0 ⟺ x ⊆ (~a &amp; FULL) = FULL^a；g[FULL^a] 一次给出所有合法 x 的频次之和</text>
  <text x="54" y="388" font-size="10" fill="#888">O(n) 次查询，每次 O(1)</text>

  <path d="M 280 396 L 280 412" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="40" y="418" width="480" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="438" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>
  <text x="54" y="456" font-size="10" fill="#888">总复杂度：时间 O(n² + 2¹⁶·16)，空间 O(2¹⁶)</text>
  <text x="54" y="470" font-size="10" fill="#888">n=1000 时 ≈ 10⁶ + 10⁶，远优于暴力 O(n³)=10⁹ 与直接枚举 O(n·2¹⁶)=6.5×10⁷</text>
</svg>
