<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：初始化窗外频率表 → 滑窗增量更新 → 取最大
  </text>

  <!-- ===== Step 1: init cnt with suffix ===== -->
  <rect x="60" y="48" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    ① 初始化：cnt = candies[k .. n−1] 的频率
  </text>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    窗口初始在 [0, k)，窗外 = 后缀 [k, n)
  </text>
  <text x="280" y="103" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">
    ans = |cnt|（k = 0 时即全部口味的种类数）
  </text>

  <!-- arrow down -->
  <path d="M280,116 L280,134" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: loop i = k .. n-1 ===== -->
  <rect x="60" y="138" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    ② 遍历 i = k → n−1（窗口逐格右移）
  </text>
  <text x="280" y="174" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">
    共 n−k 次滑动，加上初始共 n−k+1 个窗口位置
  </text>

  <!-- arrow down -->
  <path d="M280,186 L280,204" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: update cnt ===== -->
  <rect x="60" y="208" width="440" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    ③ 增量更新窗外频率表 cnt（O(1)）
  </text>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    cnt[ candies[i−k] ] ++     （左端出窗 → 回到自己手里）
  </text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">
    cnt[ candies[i] ] −−       （右端入窗 → 送出）
  </text>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">
    若 cnt[ candies[i] ] == 0：删除该键
  </text>

  <!-- arrow down to decision -->
  <path d="M280,292 L280,310" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: decision diamond ===== -->
  <polygon points="280,312 410,360 280,408 150,360" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    |cnt| &gt; ans  ?
  </text>
  <text x="280" y="372" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">
    更新最大保留口味数
  </text>

  <!-- arrow right (yes) -->
  <path d="M410,360 L470,360" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="442" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="472" y="344" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="504" y="365" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">ans=|cnt|</text>

  <!-- arrow left (no) -->
  <path d="M150,360 L90,360" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="354" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="28" y="344" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="58" y="365" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">保持</text>

  <!-- loop back arrow from yes/no up to step 2 -->
  <path d="M504,344 Q 540,210 470,160" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)" opacity="0.7"/>
  <path d="M58,344 Q 20,210 90,160" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)" opacity="0.7"/>
  <text x="300" y="300" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">↻ 继续 i++</text>

  <!-- ===== Bottom note ===== -->
  <rect x="60" y="424" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="442" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    返回 ans
  </text>
  <text x="280" y="458" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">
    时间 O(n)  /  空间 O(n)
  </text>

</svg>
