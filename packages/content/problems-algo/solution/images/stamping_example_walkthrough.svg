<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 2：对角线占据，2×2 邮票无法盖满 → false</text>

  <!-- Grid 4x4, origin (40,64), cell 50 -->
  <!-- row/col labels -->
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="65" y="58">c0</text>
    <text x="115" y="58">c1</text>
    <text x="165" y="58">c2</text>
    <text x="215" y="58">c3</text>
    <text x="28" y="93">r0</text>
    <text x="28" y="143">r1</text>
    <text x="28" y="193">r2</text>
    <text x="28" y="243">r3</text>
  </g>

  <!-- occupied diagonal cells (red) -->
  <g filter="url(#rough2)">
    <rect x="40" y="64" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="90" y="114" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="140" y="164" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="190" y="214" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="65" y="94" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <text x="115" y="144" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <text x="165" y="194" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <text x="215" y="244" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>

    <!-- empty cells: covered (light green) with coverage=1 -->
    <rect x="140" y="64" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="190" y="64" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="140" y="114" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="190" y="114" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="40" y="164" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="90" y="164" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="40" y="214" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="90" y="214" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>

    <!-- uncovered empty cells (coverage=0): red thick border -->
    <rect x="90" y="64" width="50" height="50" fill="#fff0f0" stroke="#b85450" stroke-width="2.6" rx="3"/>
    <rect x="40" y="114" width="50" height="50" fill="#fff0f0" stroke="#b85450" stroke-width="2.6" rx="3"/>
    <rect x="190" y="164" width="50" height="50" fill="#fff0f0" stroke="#b85450" stroke-width="2.6" rx="3"/>
    <rect x="140" y="214" width="50" height="50" fill="#fff0f0" stroke="#b85450" stroke-width="2.6" rx="3"/>

    <!-- coverage numbers on empty cells -->
    <g font-size="13" text-anchor="middle">
      <text x="115" y="94" fill="#b85450" font-weight="bold">0</text>
      <text x="165" y="94" fill="#4a7a3a">1</text>
      <text x="215" y="94" fill="#4a7a3a">1</text>
      <text x="65" y="144" fill="#b85450" font-weight="bold">0</text>
      <text x="165" y="144" fill="#4a7a3a">1</text>
      <text x="215" y="144" fill="#4a7a3a">1</text>
      <text x="65" y="194" fill="#4a7a3a">1</text>
      <text x="115" y="194" fill="#4a7a3a">1</text>
      <text x="215" y="194" fill="#b85450" font-weight="bold">0</text>
      <text x="65" y="244" fill="#4a7a3a">1</text>
      <text x="115" y="244" fill="#4a7a3a">1</text>
      <text x="165" y="244" fill="#b85450" font-weight="bold">0</text>
    </g>
  </g>

  <!-- Stamp A at (0,2): rows0-1 cols2-3 -->
  <rect x="138" y="62" width="104" height="104" fill="none" stroke="#4a7a3a" stroke-width="2.4"
        stroke-dasharray="7 4" rx="5" filter="url(#rough2)"/>
  <text x="190" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">邮票A (0,2)</text>

  <!-- Stamp B at (2,0): rows2-3 cols0-1 -->
  <rect x="38" y="162" width="104" height="104" fill="none" stroke="#d6a040" stroke-width="2.4"
        stroke-dasharray="7 4" rx="5" filter="url(#rough2)"/>
  <text x="90" y="282" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">邮票B (2,0)</text>

  <!-- Right side: legend + conclusion -->
  <g filter="url(#rough2)">
    <rect x="280" y="70" width="260" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="292" y="94" font-size="13" fill="#2b2b2b">仅 2 个位置可放（矩形全空）：</text>
    <text x="292" y="116" font-size="12" fill="#4a7a3a">  (0,2) ✓  (2,0) ✓</text>
    <text x="292" y="138" font-size="12" fill="#b85450">  其余 7 个位置都压到对角线 1</text>
    <text x="292" y="164" font-size="13" fill="#2b2b2b">覆盖次数见图中数字</text>
    <text x="292" y="186" font-size="12" fill="#4a7a3a">绿格=被覆盖(≥1)</text>
    <text x="292" y="206" font-size="12" fill="#b85450">红框=空格却 coverage=0</text>

    <rect x="280" y="238" width="260" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="292" y="262" font-size="13" fill="#b85450" font-weight="bold">空格 (0,1) 未被任何邮票覆盖</text>
    <text x="292" y="282" font-size="12" fill="#2b2b2b">盖 (0,1) 的 2×2 邮票必在 (0,0)</text>
    <text x="300" y="298" font-size="12" fill="#2b2b2b">或 (0,1)，二者都压到占据格</text>

    <rect x="280" y="324" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="410" y="352" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">⟹ 返回 false</text>
  </g>
</svg>
