<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单遍扫描累加位移 → 终判是否归零</text>

  <!-- ===== Step 1: Init ===== -->
  <rect x="200" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化：x = 0, y = 0</text>

  <path d="M 280 84 L 280 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 2: Loop condition ===== -->
  <polygon points="280,108 390,160 280,212 170,160" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">还有字符?</text>
  <text x="280" y="174" text-anchor="middle" font-size="10" fill="#888">ch = moves[i]</text>

  <!-- No branch → check origin (right) -->
  <path d="M 390 160 L 450 160" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="404" y="152" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="450" y="140" width="92" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="496" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">判断</text>
  <text x="496" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x==0 &amp;&amp; y==0</text>

  <!-- Yes branch → switch (down) -->
  <path d="M 280 212 L 280 236" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="288" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Step 3: switch on ch ===== -->
  <rect x="180" y="236" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">按 ch 分支更新坐标</text>

  <path d="M 280 276 L 280 296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 4: 4-way switch (diamond) ===== -->
  <polygon points="280,296 410,358 280,420 150,358" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ch = ?</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">四分支</text>

  <!-- U (up-left) -->
  <path d="M 200 330 L 130 300" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="96" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">U</text>
  <rect x="56" y="272" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="99" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">++y</text>

  <!-- D (down-left) -->
  <path d="M 200 386 L 130 416" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="96" y="448" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">D</text>
  <rect x="56" y="418" width="86" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="99" y="438" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−−y</text>

  <!-- R (up-right) -->
  <path d="M 360 330 L 430 300" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="464" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">R</text>
  <rect x="418" y="272" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="461" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">++x</text>

  <!-- L (down-right) -->
  <path d="M 360 386 L 430 416" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="464" y="448" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">L</text>
  <rect x="418" y="418" width="86" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="461" y="438" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">−−x</text>

  <!-- Loop-back to loop condition -->
  <path d="M 99 272 L 99 160 L 170 160" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 461 272 L 461 160 L 390 160" stroke="#446688" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="468" text-anchor="middle" font-size="10" fill="#999">虚线表示取下一字符回到循环条件</text>
</svg>
