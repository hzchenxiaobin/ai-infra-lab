<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算</text>

  <!-- ===== Example 1: nums = [3,2,3,2,2,2] ===== -->
  <text x="28" y="50" font-size="11" fill="#444" font-weight="bold">示例 1：nums = [3,2,3,2,2,2]</text>

  <!-- array row -->
  <rect x="58" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="98" y="58" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="138" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="178" y="58" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="218" y="58" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="258" y="58" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- arrow down -->
  <path d="M 168 90 L 168 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="100" font-size="9.5" fill="#888">统计频次</text>

  <!-- frequency rows -->
  <rect x="60" y="110" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="128" font-size="11" fill="#333">值 2 → 频次 4</text>
  <text x="240" y="128" font-size="10.5" fill="#4a7a3a" font-weight="bold">4 % 2 = 0 ✓</text>

  <rect x="60" y="140" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="158" font-size="11" fill="#333">值 3 → 频次 2</text>
  <text x="240" y="158" font-size="10.5" fill="#4a7a3a" font-weight="bold">2 % 2 = 0 ✓</text>

  <!-- pairing result -->
  <rect x="300" y="110" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">配对：(2,2)(2,2)(3,3)</text>
  <text x="410" y="148" text-anchor="middle" font-size="10.5" fill="#555">全偶 → return true ✓</text>

  <!-- ===== Example 2: nums = [1,2,3,4] ===== -->
  <text x="28" y="198" font-size="11" fill="#444" font-weight="bold">示例 2：nums = [1,2,3,4]</text>

  <!-- array row -->
  <rect x="58" y="206" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="98" y="206" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="138" y="206" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="178" y="206" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- arrow down -->
  <path d="M 138 238 L 138 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="248" font-size="9.5" fill="#888">统计频次</text>

  <!-- frequency rows -->
  <rect x="60" y="258" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="276" font-size="11" fill="#333">值 1 → 频次 1</text>
  <text x="240" y="276" font-size="10.5" fill="#b85450" font-weight="bold">1 % 2 = 1 ✗</text>

  <rect x="60" y="288" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="306" font-size="11" fill="#333">值 2 → 频次 1</text>
  <text x="240" y="306" font-size="10.5" fill="#b85450" font-weight="bold">1 % 2 = 1 ✗</text>

  <rect x="60" y="318" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="336" font-size="11" fill="#333">值 3 → 频次 1</text>
  <text x="240" y="336" font-size="10.5" fill="#b85450" font-weight="bold">1 % 2 = 1 ✗</text>

  <!-- result -->
  <rect x="300" y="258" width="220" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">值 1 频次为 1（奇）</text>
  <text x="410" y="298" text-anchor="middle" font-size="10.5" fill="#b85450">→ 落单，无法配对</text>
  <text x="410" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">提前 return false ✗</text>
  <text x="410" y="334" text-anchor="middle" font-size="9.5" fill="#888">无需继续检查值 2/3/4</text>

  <!-- ===== Key observation ===== -->
  <rect x="40" y="358" width="460" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：遇到首个奇频次即 return false，无需统计全部</text>
  <text x="270" y="390" text-anchor="middle" font-size="9.5" fill="#888">n = len/2 = 3（示例1）/ 2（示例2），对数 = 频次和 / 2</text>
</svg>
