<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 11 → 第 11 位是 10 中的 0</text>

  <!-- ===== Row 1: 数字序列与位置 ===== -->
  <text x="34" y="56" font-size="11" fill="#446688" font-weight="bold">序列</text>

  <text x="74" y="72" font-size="10" fill="#888" text-anchor="middle">位置</text>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="120" y="72" filter="url(#rough2)">1</text>
    <text x="140" y="72" filter="url(#rough2)">2</text>
    <text x="160" y="72" filter="url(#rough2)">3</text>
    <text x="180" y="72" filter="url(#rough2)">4</text>
    <text x="200" y="72" filter="url(#rough2)">5</text>
    <text x="220" y="72" filter="url(#rough2)">6</text>
    <text x="240" y="72" filter="url(#rough2)">7</text>
    <text x="260" y="72" filter="url(#rough2)">8</text>
    <text x="280" y="72" filter="url(#rough2)">9</text>
    <text x="310" y="72" filter="url(#rough2)">10</text>
    <text x="340" y="72" fill="#b85450" font-weight="bold" filter="url(#rough2)">11</text>
  </g>

  <!-- digit cells -->
  <rect x="110" y="78" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="292" y="78" width="20" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="314" y="78" width="20" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>

  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="120" y="96" filter="url(#rough2)">1</text>
    <text x="140" y="96" filter="url(#rough2)">2</text>
    <text x="160" y="96" filter="url(#rough2)">3</text>
    <text x="180" y="96" filter="url(#rough2)">4</text>
    <text x="200" y="96" filter="url(#rough2)">5</text>
    <text x="220" y="96" filter="url(#rough2)">6</text>
    <text x="240" y="96" filter="url(#rough2)">7</text>
    <text x="260" y="96" filter="url(#rough2)">8</text>
    <text x="280" y="96" filter="url(#rough2)">9</text>
    <text x="302" y="96" filter="url(#rough2)">1</text>
    <text x="324" y="96" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  </g>

  <text x="74" y="120" font-size="10" fill="#888" text-anchor="middle">数字</text>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="120" y="120" filter="url(#rough2)">1</text>
    <text x="140" y="120" filter="url(#rough2)">2</text>
    <text x="160" y="120" filter="url(#rough2)">3</text>
    <text x="180" y="120" filter="url(#rough2)">4</text>
    <text x="200" y="120" filter="url(#rough2)">5</text>
    <text x="220" y="120" filter="url(#rough2)">6</text>
    <text x="240" y="120" filter="url(#rough2)">7</text>
    <text x="260" y="120" filter="url(#rough2)">8</text>
    <text x="280" y="120" filter="url(#rough2)">9</text>
    <text x="313" y="120" fill="#b85450" font-weight="bold" filter="url(#rough2)">10</text>
  </g>

  <!-- arrow: position 11 → digit 0 -->
  <path d="M 340 56 L 340 74" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Row 2: Step table (找位数) ===== -->
  <text x="34" y="152" font-size="11" fill="#446688" font-weight="bold">① 找位数 d</text>

  <rect x="40" y="162" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="80" y="180">轮次</text>
    <text x="160" y="180">n（进入）</text>
    <text x="240" y="180">len</text>
    <text x="300" y="180">start</text>
    <text x="390" y="180">9·start·len</text>
    <text x="500" y="180">判定</text>
  </g>

  <rect x="40" y="192" width="520" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="80" y="212" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="160" y="212" filter="url(#rough2)">11</text>
    <text x="240" y="212" filter="url(#rough2)">1</text>
    <text x="300" y="212" filter="url(#rough2)">1</text>
    <text x="390" y="212" filter="url(#rough2)">9</text>
    <text x="500" y="212" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11 &gt; 9 → 减</text>
  </g>

  <rect x="40" y="224" width="520" height="30" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="80" y="244" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="160" y="244" filter="url(#rough2)">2</text>
    <text x="240" y="244" filter="url(#rough2)">2</text>
    <text x="300" y="244" filter="url(#rough2)">10</text>
    <text x="390" y="244" filter="url(#rough2)">180</text>
    <text x="500" y="244" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 ≤ 180 → 停</text>
  </g>

  <!-- ===== Row 3: Step 2 & 3 ===== -->
  <text x="34" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">② 找数字 num</text>

  <rect x="40" y="290" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">num = 10 + (2−1)//2 = 10</text>

  <text x="34" y="346" font-size="11" fill="#d6a040" font-weight="bold">③ 找数位 digit</text>

  <rect x="40" y="356" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="378" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">index = (2−1) % 2 = 1</text>

  <!-- "10"[1] visualization -->
  <text x="380" y="346" font-size="11" fill="#333" font-weight="bold">"10"</text>
  <rect x="380" y="356" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="414" y="356" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="395" y="378" filter="url(#rough2)">1</text>
    <text x="429" y="378" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  </g>
  <text x="395" y="404" font-size="10" fill="#888" text-anchor="middle">idx 0</text>
  <text x="429" y="404" font-size="10" fill="#b85450" font-weight="bold" text-anchor="middle">idx 1 ←</text>

  <!-- arrow down -->
  <path d="M 180 390 L 180 410" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="100" y="412" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="180" y="434" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return 0  ✓</text>

  <!-- verification note -->
  <rect x="290" y="412" width="270" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="425" y="434" text-anchor="middle" font-size="10" fill="#4a7a3a">验证 n=3：3≤9, num=1+2=3, idx=0 → "3"[0]=3 ✓</text>
</svg>
