<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrUp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 9 0 L 0 4.5 L 9 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：递归调用与返回值</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">↓ 递归下探　↑ 返回结果　m = 2</text>

  <!-- ===== Example 1: [2,2,5,null,null,5,7] ===== -->
  <rect x="20" y="56" width="540" height="240" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="78" font-size="13" fill="#446688" font-weight="bold">示例 1：root = [2,2,5,null,null,5,7]　预期 5</text>

  <!-- root dfs(2) -->
  <circle cx="200" cy="110" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="115" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="150" y="114" font-size="10" fill="#b85450">dfs(root)</text>
  <text x="150" y="126" font-size="9" fill="#888">2==m, 非叶子</text>

  <!-- 下探箭头到左右 -->
  <line x1="184" y1="124" x2="120" y2="160" stroke="#888" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="216" y1="124" x2="280" y2="160" stroke="#888" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- left dfs(2) leaf -->
  <circle cx="104" cy="176" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="104" y="181" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="40" y="172" font-size="9" fill="#888">dfs(left)</text>
  <text x="40" y="184" font-size="9" fill="#888">叶子= m</text>
  <!-- 返回 -1 -->
  <rect x="64" y="208" width="80" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="104" y="223" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return −1</text>
  <line x1="104" y1="192" x2="104" y2="208" stroke="#888" stroke-width="1.2" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- right dfs(5) pruned -->
  <circle cx="296" cy="176" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="296" y="181" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">5</text>
  <text x="324" y="172" font-size="9" fill="#d6a040">dfs(right)</text>
  <text x="324" y="184" font-size="9" fill="#d6a040">5 &gt; m ✂</text>
  <!-- 返回 5 -->
  <rect x="256" y="208" width="80" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="296" y="223" text-anchor="middle" font-size="10" fill="#7a5a20" font-weight="bold">return 5</text>
  <line x1="296" y1="192" x2="296" y2="208" stroke="#888" stroke-width="1.2" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- 未访问子树标注 -->
  <text x="296" y="250" text-anchor="middle" font-size="9" fill="#aaa">（5 下面的 5、7 未访问）</text>

  <!-- 合并 -->
  <rect x="100" y="262" width="220" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="280" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">合并：a=−1, b=5 → return 5 ⭐</text>

  <!-- 结果 -->
  <text x="430" y="120" font-size="13" fill="#b85450" font-weight="bold">答案</text>
  <rect x="430" y="128" width="110" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="485" y="158" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">5</text>

  <!-- ===== Example 2: [2,2,2] ===== -->
  <rect x="20" y="312" width="540" height="200" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="334" font-size="13" fill="#b85450" font-weight="bold">示例 2（对照）：root = [2,2,2]　预期 −1（无第二小）</text>

  <!-- root -->
  <circle cx="200" cy="368" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="373" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="150" y="372" font-size="10" fill="#b85450">dfs(root)</text>
  <text x="150" y="384" font-size="9" fill="#888">2==m, 非叶子</text>

  <line x1="184" y1="382" x2="130" y2="416" stroke="#888" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="216" y1="382" x2="270" y2="416" stroke="#888" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- left leaf -->
  <circle cx="118" cy="430" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="118" y="435" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="60" y="426" font-size="9" fill="#888">叶子</text>
  <rect x="78" y="458" width="80" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="118" y="473" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return −1</text>
  <line x1="118" y1="445" x2="118" y2="458" stroke="#888" stroke-width="1.2" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- right leaf -->
  <circle cx="282" cy="430" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="282" y="435" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="312" y="426" font-size="9" fill="#888">叶子</text>
  <rect x="242" y="458" width="80" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="282" y="473" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return −1</text>
  <line x1="282" y1="445" x2="282" y2="458" stroke="#888" stroke-width="1.2" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- 合并 -->
  <rect x="90" y="488" width="240" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="502" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">合并：a=−1, b=−1 → return −1</text>

  <!-- 结果 -->
  <text x="430" y="378" font-size="13" fill="#b85450" font-weight="bold">答案</text>
  <rect x="430" y="386" width="110" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="485" y="416" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">−1</text>
</svg>
