<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一行公式直接生成循环码排列</text>

  <!-- Step 1: input -->
  <rect x="180" y="42" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333">输入 n, start</text>
  <path d="M 260 78 L 260 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: compute N -->
  <rect x="170" y="94" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="12" fill="#333">N = 1 &lt;&lt; n   （共 2ⁿ 个数）</text>
  <path d="M 260 130 L 260 144" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: loop (highlighted) -->
  <rect x="110" y="146" width="300" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">for i = 0 to N − 1:</text>
  <text x="260" y="186" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" font-family="monospace">p[i] = start ^ (i ^ (i &gt;&gt; 1))</text>
  <path d="M 260 204 L 260 218" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="180" y="220" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="12" fill="#333">return p</text>

  <!-- side note: loop-back arrow for iteration -->
  <path d="M 410 174 Q 440 174 440 174" stroke="none" fill="none"/>
  <path d="M 412 160 Q 450 160 450 185 Q 450 210 412 210" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="460" y="188" font-size="9.5" fill="#4a7a3a">迭代</text>

  <!-- Insight box -->
  <rect x="30" y="270" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">无需搜索 / 无需找下标旋转 / 无需额外空间</text>
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#666">每个元素 O(1) 计算：一次右移 + 两次异或，按 i 顺序天然生成</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#666">时间 O(2ⁿ)，空间 O(1)（不计答案数组）</text>
</svg>
