<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：构建掩码 → 双重循环判 AND → 取最大乘积</text>

  <!-- Step 1: Build masks -->
  <rect x="60" y="50" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 预处理：为每个单词构建 26 位掩码</text>
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">mask[i] = OR of (1 &lt;&lt; (c - 'a')) for c in words[i]</text>

  <!-- arrow -->
  <path d="M 260 106 L 260 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Double loop -->
  <rect x="60" y="128" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 枚举所有词对 (i, j)，i &lt; j</text>
  <text x="260" y="170" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">for i in range(n):  for j in range(i+1, n):</text>

  <!-- arrow -->
  <path d="M 260 184 L 260 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Decision diamond -->
  <polygon points="260,206 360,256 260,306 160,256" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">mask[i] &amp;</text>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">mask[j] == 0 ?</text>

  <!-- Yes branch -->
  <path d="M 360 256 L 400 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="238" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a">更新 ans =</text>
  <text x="450" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">max(ans, len*len)</text>

  <!-- No branch -->
  <path d="M 160 256 L 120 256" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="248" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="238" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="260" text-anchor="middle" font-size="10" fill="#b85450">跳过该词对</text>

  <!-- arrow down from yes -->
  <path d="M 450 274 L 450 292 L 260 292 L 260 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Return -->
  <rect x="100" y="312" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">③ 遍历完所有词对，返回 ans</text>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#888">（若无合法词对，ans 保持 0）</text>

  <!-- Complexity note -->
  <rect x="60" y="372" width="400" height="20" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="10" fill="#888">时间 O(n² + n·L)  |  空间 O(n)  |  n = 词数, L = 平均词长</text>
</svg>