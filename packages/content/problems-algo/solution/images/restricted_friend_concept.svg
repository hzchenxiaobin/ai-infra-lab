<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">合并两连通块前先查限制：x∈A 且 y∈B → 合并后间接连通 → 违反</text>

  <!-- ===== Top: before merge ===== -->
  <rect x="30" y="44" width="480" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">合并前：两个独立连通块 A、B</text>

  <!-- Component A ellipse -->
  <ellipse cx="130" cy="120" rx="78" ry="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="130" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">连通块 A</text>
  <!-- nodes u, x in A -->
  <circle cx="95" cy="120" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">u</text>
  <circle cx="165" cy="120" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x</text>
  <line x1="111" y1="120" x2="149" y2="120" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- Component B ellipse -->
  <ellipse cx="410" cy="120" rx="78" ry="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="410" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">连通块 B</text>
  <!-- nodes v, y in B -->
  <circle cx="375" cy="120" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="375" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">v</text>
  <circle cx="445" cy="120" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="445" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">y</text>
  <line x1="391" y1="120" x2="429" y2="120" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- request edge (u,v) green dashed want-to-add -->
  <path d="M 111 120 Q 270 70 359 120" stroke="#4a7a3a" stroke-width="2.2" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="270" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">请求 (u, v) 想合并</text>

  <!-- restriction (x,y) red dashed -->
  <path d="M 181 120 Q 270 175 429 120" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">限制 (x, y)：禁止间接连通</text>

  <!-- arrow down -->
  <line x1="270" y1="198" x2="270" y2="226" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="216" font-size="11" fill="#b85450" font-weight="bold">若 union(u,v)</text>

  <!-- ===== Bottom: after merge ===== -->
  <rect x="30" y="228" width="480" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">合并后：A∪B 成一个连通块，x 与 y 经 u—v 间接连通 → 违反限制</text>

  <!-- merged component ellipse -->
  <ellipse cx="270" cy="310" rx="170" ry="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="270" y="276" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">连通块 A ∪ B</text>

  <!-- nodes u x v y -->
  <circle cx="150" cy="310" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="315" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">u</text>
  <circle cx="220" cy="310" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="315" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x</text>
  <circle cx="320" cy="310" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="315" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">v</text>
  <circle cx="390" cy="310" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="315" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">y</text>

  <!-- solid edges: u-x, u-v (new), v-y -->
  <line x1="166" y1="310" x2="204" y2="310" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="236" y1="310" x2="304" y2="310" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">新边</text>
  <line x1="336" y1="310" x2="374" y2="310" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- red indirect path x-u-v-y arc -->
  <path d="M 220 326 Q 270 360 390 326" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="305" y="358" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">x — u — v — y 已间接连通</text>

  <!-- summary -->
  <rect x="40" y="374" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="390" text-anchor="middle" font-size="10.5" fill="#444">判定：find(x)==find(u)&amp;&amp;find(y)==find(v) 或 find(x)==find(v)&amp;&amp;find(y)==find(u) → 拒绝</text>
</svg>
