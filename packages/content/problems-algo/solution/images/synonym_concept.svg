<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：近义词可传递 → 并查集建连通分量</text>

  <!-- ===== Left: synonym pairs as graph edges ===== -->
  <text x="130" y="54" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">近义词对（图的边）</text>

  <!-- pair 1: happy -- joy -->
  <rect x="30" y="70" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="65" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">happy</text>
  <rect x="150" y="70" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="175" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">joy</text>
  <path d="M 100 85 L 150 85" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- pair 2: sad -- sorrow -->
  <rect x="30" y="115" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">sad</text>
  <rect x="150" y="115" width="65" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="182" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">sorrow</text>
  <path d="M 80 130 L 150 130" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- pair 3: joy -- cheerful (transitive link!) -->
  <rect x="30" y="160" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">joy</text>
  <rect x="150" y="160" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="185" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cheerful</text>
  <path d="M 80 175 L 150 175" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- transitive note -->
  <rect x="20" y="205" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="120" y="223" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">happy ~ joy ~ cheerful</text>
  <text x="120" y="238" text-anchor="middle" font-size="10" fill="#888">传递性：happy 与 cheerful 也是近义词</text>

  <!-- ===== Arrow to right ===== -->
  <path d="M 250 130 Q 280 130 300 130" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="275" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">union</text>

  <!-- ===== Right: connected components ===== -->
  <text x="430" y="54" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">连通分量（按字典序排序）</text>

  <!-- Group 1: cheerful, happy, joy -->
  <rect x="320" y="68" width="220" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="340" y="88" font-size="10" fill="#446688" font-weight="bold">Group 1 (root=cheerful)</text>
  <rect x="335" y="96" width="70" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="370" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cheerful</text>
  <rect x="412" y="96" width="56" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="440" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">happy</text>
  <rect x="474" y="96" width="48" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="498" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">joy</text>
  <text x="430" y="140" text-anchor="middle" font-size="9.5" fill="#888">sorted: cheerful &lt; happy &lt; joy</text>

  <!-- Group 2: sad, sorrow -->
  <rect x="320" y="165" width="220" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="340" y="185" font-size="10" fill="#d6a040" font-weight="bold">Group 2 (root=sad)</text>
  <rect x="350" y="193" width="48" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="374" y="211" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sad</text>
  <rect x="410" y="193" width="64" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="442" y="211" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sorrow</text>
  <text x="430" y="230" text-anchor="middle" font-size="9.5" fill="#888">sorted: sad &lt; sorrow</text>

  <!-- ===== Bottom: key insight ===== -->
  <rect x="30" y="270" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">并查集 union(a,b) 合并近义词对 → find(root) 定位所属同义组</text>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#555">每组内按字典序排序 → DFS 枚举时天然产出字典序结果</text>

  <!-- bottom note -->
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#888">同义组 = 并查集连通分量；排序保证 DFS 产出顺序即字典序，无需最后再排</text>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#bbb">synonyms ≤ 10 对，单词数 ≤ 10 → 组数和分支数都很小，DFS 完全可行</text>
</svg>
