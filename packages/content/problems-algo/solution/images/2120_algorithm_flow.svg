<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：外层遍历起点 i，内层从 startPos 模拟 s[i:]</text>

  <!-- ====== Outer loop column (left) ====== -->
  <!-- start: i = 0 -->
  <rect x="60" y="48" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = 0</text>

  <!-- arrow down -->
  <path d="M 120 82 L 120 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: i < m ? -->
  <polygon points="120,100 180,132 120,164 60,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i &lt; m ?</text>
  <text x="120" y="142" text-anchor="middle" font-size="10" fill="#888">外层循环</text>

  <!-- No: go right to end -->
  <path d="M 180 132 L 460 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="126" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="116" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="500" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 answer</text>

  <!-- Yes: go down -->
  <path d="M 120 164 L 120 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- reset box: r=startRow, c=startCol, cnt=0 -->
  <rect x="40" y="180" width="160" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">重置起点</text>
  <text x="120" y="216" text-anchor="middle" font-size="10.5" fill="#444">r,c ← startPos ; cnt ← 0</text>

  <!-- arrow down to inner loop -->
  <path d="M 120 226 L 120 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- j = i -->
  <rect x="60" y="242" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j = i</text>

  <!-- arrow down -->
  <path d="M 120 272 L 120 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: j < m ? -->
  <polygon points="120,290 180,322 120,354 60,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j &lt; m ?</text>
  <text x="120" y="334" text-anchor="middle" font-size="10" fill="#888">内层循环</text>

  <!-- No: go to answer[i] = cnt -->
  <path d="M 60 322 L 30 322 L 30 410 L 60 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="316" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Yes: go right to compute (nr,nc) -->
  <path d="M 180 322 L 220 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="316" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ====== Inner loop column (right) ====== -->
  <!-- compute (nr, nc) -->
  <rect x="220" y="304" width="150" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="295" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">按 s[j] 算 (nr, nc)</text>
  <text x="295" y="335" text-anchor="middle" font-size="9.5" fill="#888">L/R 改列 · U/D 改行</text>

  <!-- arrow down -->
  <path d="M 295 342 L 295 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: in grid ? -->
  <polygon points="295,360 365,392 295,424 225,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="295" y="389" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0≤nr&lt;n 且</text>
  <text x="295" y="402" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0≤nc&lt;n ?</text>

  <!-- No: break (red) -> answer[i] -->
  <path d="M 365 392 L 410 392 L 410 410 L 440 410" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="375" y="386" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="395" y="406" font-size="10.5" fill="#b85450" font-weight="bold">break</text>

  <!-- Yes: update r,c ; cnt++ ; j++ (green) -->
  <path d="M 295 424 L 295 432" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="305" y="430" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="220" y="432" width="150" height="0" fill="none"/>

  <!-- update box (place at bottom, loop back up) -->
  <rect x="200" y="222" width="190" height="0" fill="none"/>
  <!-- actually re-route Yes to a side box -->

  <!-- Yes branch: r=nr,c=nc,cnt++,j++ -->
  <path d="M 225 392 L 200 392 L 200 268 L 220 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="155" y="262" width="50" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="280" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">接受</text>
  <text x="180" y="294" text-anchor="middle" font-size="9" fill="#444">r=nr</text>
  <text x="180" y="306" text-anchor="middle" font-size="9" fill="#444">c=nc</text>
  <text x="180" y="316" text-anchor="middle" font-size="9" fill="#444">cnt++</text>

  <!-- from update box back up to j < m diamond via j++ -->
  <path d="M 155 290 L 120 290 L 120 285" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="128" y="282" font-size="9.5" fill="#4a7a3a">j++</text>

  <!-- answer[i] = cnt box at bottom -->
  <rect x="60" y="394" width="160" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="414" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">answer[i] = cnt ; i++</text>

  <!-- loop back from answer[i] to outer i<m check -->
  <path d="M 60 410 L 18 410 L 18 132 L 60 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="26" y="270" font-size="10" fill="#888" transform="rotate(-90 26 270)">回外层循环</text>

  <!-- legend -->
  <rect x="430" y="180" width="120" height="120" fill="#fff" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">图例</text>
  <rect x="442" y="212" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="464" y="222" font-size="10" fill="#555">动作</text>
  <polygon points="450,234 460,240 450,246 440,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="464" y="244" font-size="10" fill="#555">判定</text>
  <rect x="442" y="256" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="464" y="266" font-size="10" fill="#555">成功/接受</text>
  <rect x="442" y="276" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="464" y="286" font-size="10" fill="#555">越界/break</text>
</svg>
