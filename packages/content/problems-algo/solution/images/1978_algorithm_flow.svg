<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：salary 过滤 → 反连接 → ORDER BY</text>

  <!-- ===== Step 1: WHERE salary < 30000 ===== -->
  <rect x="40" y="50" width="200" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① WHERE salary &lt; 30000</text>
  <line x1="50" y1="76" x2="230" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="92" font-size="9" fill="#333">筛出薪水严格 &lt; 30000</text>
  <text x="50" y="106" font-size="8" fill="#888">示例：emp 1 (21241), 11 (28485)</text>
  <text x="50" y="120" font-size="8" fill="#888">null 薪水自动排除（UNKNOWN）</text>

  <!-- Arrow down -->
  <path d="M 140 130 L 140 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: AND manager_id NOT IN ===== -->
  <rect x="40" y="156" width="200" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② AND manager_id NOT IN</text>
  <line x1="50" y1="182" x2="230" y2="182" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="198" font-size="9" fill="#333">  (SELECT employee_id</text>
  <text x="50" y="212" font-size="9" fill="#333">   FROM Employees)</text>
  <text x="50" y="228" font-size="8" fill="#b85450">经理不在当前员工表 → 已离职</text>
  <text x="50" y="240" font-size="8" fill="#888">null mgr_id → UNKNOWN → 自动排除</text>

  <!-- Arrow down -->
  <path d="M 140 252 L 140 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: ORDER BY ===== -->
  <rect x="40" y="278" width="200" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="298" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ ORDER BY employee_id</text>
  <text x="140" y="316" text-anchor="middle" font-size="9" fill="#666">从小到大排序输出</text>
  <text x="140" y="328" text-anchor="middle" font-size="8" fill="#888">题目要求排序</text>

  <!-- ===== Right side: data flow ===== -->
  <!-- Full table -->
  <text x="370" y="50" font-size="10" fill="#888" font-weight="bold">Employees 全表（6 行）</text>
  <rect x="310" y="56" width="240" height="116" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="72" font-size="8" fill="#446688" font-weight="bold">eid  name      mgr   salary</text>
  <line x1="310" y1="78" x2="550" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="92" font-size="8" fill="#888">3    Mila      9     60301</text>
  <text x="320" y="106" font-size="8" fill="#888">12   Antonella null  31000</text>
  <text x="320" y="120" font-size="8" fill="#888">13   Emery     null  67084</text>
  <rect x="312" y="124" width="236" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="320" y="134" font-size="8" fill="#d6a040" font-weight="bold">1    Kalel     11    21241</text>
  <text x="320" y="148" font-size="8" fill="#888">9    Mikaela   null  50937</text>
  <rect x="312" y="152" width="236" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="320" y="162" font-size="8" fill="#d6a040" font-weight="bold">11   Joziah    6     28485</text>

  <!-- Arrow -->
  <path d="M 240 114 L 305 114" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" opacity="0.7"/>

  <!-- After salary filter -->
  <text x="370" y="184" font-size="10" fill="#888" font-weight="bold">① salary &lt; 30000 后</text>
  <rect x="310" y="190" width="240" height="50" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="206" font-size="8" fill="#d6a040" font-weight="bold">eid  name   mgr   salary</text>
  <line x1="310" y1="212" x2="550" y2="212" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="226" font-size="8" fill="#888">1    Kalel  11    21241</text>
  <rect x="312" y="229" width="236" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="320" y="236" font-size="8" fill="#b85450" font-weight="bold">11   Joziah 6     28485</text>

  <!-- Arrow down -->
  <path d="M 430 240 L 430 258" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- After NOT IN filter -->
  <text x="370" y="274" font-size="10" fill="#888" font-weight="bold">② mgr_id NOT IN emp_id 后</text>
  <rect x="310" y="280" width="240" height="60" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="296" font-size="8" fill="#b85450" font-weight="bold">eid  name   mgr   判定</text>
  <line x1="310" y1="302" x2="550" y2="302" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="316" font-size="8" fill="#888">1    Kalel  11    11∈集合 ✗</text>
  <rect x="312" y="319" width="236" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="320" y="326" font-size="8" fill="#b85450" font-weight="bold">11   Joziah 6     6∉集合 ✓</text>
  <text x="320" y="336" font-size="7" fill="#888">emp_id 集合 = {1,3,9,11,12,13}</text>

  <!-- Arrow to result -->
  <path d="M 430 340 L 430 358" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="370" y="374" font-size="10" fill="#888" font-weight="bold">③ ORDER BY 后（最终）</text>
  <rect x="310" y="380" width="240" height="48" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="396" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">employee_id</text>
  <line x1="310" y1="402" x2="550" y2="402" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="420" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">11</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="346" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="365" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">两条件 AND：薪资低 + 经理离职</text>
</svg>
