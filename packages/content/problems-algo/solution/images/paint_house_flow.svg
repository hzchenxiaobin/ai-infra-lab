<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：滚动数组逐行递推</text>

  <!-- Start -->
  <ellipse cx="260" cy="56" rx="70" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 260 76 L 260 92" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init prev = cost[0] -->
  <rect x="140" y="94" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="12" fill="#333">初始化 prev = cost[0]</text>
  <text x="260" y="129" text-anchor="middle" font-size="11" fill="#666">prev[0..2] = 第 0 号房子的三种颜色花费</text>
  <path d="M 260 138 L 260 154" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop i = 1 to n-1 -->
  <polygon points="260,156 360,196 260,236 160,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="12" fill="#333">i ≤ n−1 ?</text>
  <text x="260" y="210" text-anchor="middle" font-size="10" fill="#888">从 1 遍历到 n−1</text>

  <!-- Yes branch -->
  <text x="370" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 360 196 L 410 196 L 410 250" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute cur for each color -->
  <rect x="290" y="252" width="210" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="395" y="272" text-anchor="middle" font-size="12" fill="#333">对每个颜色 c ∈ {0,1,2}：</text>
  <text x="395" y="290" text-anchor="middle" font-size="11" fill="#444">cur[c] = cost[i][c]</text>
  <text x="395" y="306" text-anchor="middle" font-size="11" fill="#444">     + min(prev[c′], c′≠c)</text>

  <path d="M 395 320 L 395 346" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- prev = cur -->
  <rect x="320" y="348" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="395" y="370" text-anchor="middle" font-size="12" fill="#333">prev ← cur</text>

  <!-- Loop back -->
  <path d="M 395 382 L 395 408 L 260 408 L 260 230" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="402" font-size="10" fill="#888">i++，回到判断</text>

  <!-- No branch -->
  <text x="148" y="196" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 160 196 L 100 196 L 100 250" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return min(prev) -->
  <rect x="30" y="252" width="140" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="272" text-anchor="middle" font-size="12" fill="#333">返回</text>
  <text x="100" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">min(prev[0..2])</text>

  <!-- End -->
  <path d="M 100 300 L 100 326" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="100" cy="346" rx="50" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="351" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- Complexity note -->
  <rect x="30" y="400" width="200" height="44" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="418" text-anchor="middle" font-size="11" fill="#444">时间 O(n·K) = O(n)</text>
  <text x="130" y="434" text-anchor="middle" font-size="11" fill="#444">空间 O(K) = O(1)（K=3）</text>
</svg>
