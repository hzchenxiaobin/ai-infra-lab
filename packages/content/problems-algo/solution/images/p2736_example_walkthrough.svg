<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="120" y="30" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例1 演算：每步加入点后前沿与查询命中</text>
  <text x="220" y="50" font-size="13" fill="#666" filter="url(#rough2)">点 A(4,2,6) B(3,4,7) D(2,5,7) C(1,9,10)；查询按 x 降序：Q1,Q3,Q2</text>

  <!-- 三个阶段卡片 -->
  <!-- Stage Q1 -->
  <rect x="20" y="70" width="185" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="112" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#335" filter="url(#rough2)">Q1 : (x=4, y=1)</text>
  <line x1="35" y1="100" x2="190" y2="100" stroke="#88a0c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="35" y="120" font-size="12" fill="#335" filter="url(#rough2)">入 A(2,6)</text>
  <text x="35" y="140" font-size="12" fill="#335" filter="url(#rough2)">前沿：{(2,6)}</text>
  <circle cx="120" cy="170" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="174" font-size="12" fill="#244" filter="url(#rough2)">(2,6)</text>
  <text x="35" y="200" font-size="12" fill="#b85450" filter="url(#rough2)">查 y≥1</text>
  <path d="M55 208 L110 178" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="35" y="225" font-size="12" fill="#244" filter="url(#rough2)">命中 (2,6)</text>
  <rect x="35" y="234" width="140" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="105" y="251" text-anchor="middle" font-size="13" fill="#622" filter="url(#rough2)">ans[0] = 6</text>

  <!-- Stage Q3 -->
  <rect x="218" y="70" width="185" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#244" filter="url(#rough2)">Q3 : (x=2, y=5)</text>
  <line x1="233" y1="100" x2="388" y2="100" stroke="#6a9a5a" stroke-width="1" filter="url(#rough2)"/>
  <text x="233" y="120" font-size="12" fill="#244" filter="url(#rough2)">入 B(4,7)：删 A(被支配)</text>
  <text x="233" y="138" font-size="12" fill="#244" filter="url(#rough2)">入 D(5,7)：删 B(同s大y)</text>
  <text x="233" y="156" font-size="12" fill="#244" filter="url(#rough2)">前沿：{(5,7)}</text>
  <circle cx="280" cy="180" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="184" font-size="12" fill="#244" filter="url(#rough2)">(5,7)</text>
  <text x="233" y="210" font-size="12" fill="#b85450" filter="url(#rough2)">查 y≥5</text>
  <path d="M253 215 L273 186" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="233" y="232" font-size="12" fill="#244" filter="url(#rough2)">命中 (5,7)</text>
  <rect x="233" y="240" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="308" y="257" text-anchor="middle" font-size="13" fill="#622" filter="url(#rough2)">ans[2] = 7</text>

  <!-- Stage Q2 -->
  <rect x="416" y="70" width="185" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="508" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#642" filter="url(#rough2)">Q2 : (x=1, y=3)</text>
  <line x1="431" y1="100" x2="586" y2="100" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="431" y="120" font-size="12" fill="#642" filter="url(#rough2)">入 C(9,10)：删 D(被支配)</text>
  <text x="431" y="140" font-size="12" fill="#642" filter="url(#rough2)">前沿：{(9,10)}</text>
  <circle cx="475" cy="178" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="485" y="182" font-size="12" fill="#244" filter="url(#rough2)">(9,10)</text>
  <text x="431" y="208" font-size="12" fill="#b85450" filter="url(#rough2)">查 y≥3</text>
  <path d="M451 214 L468 188" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="431" y="232" font-size="12" fill="#244" filter="url(#rough2)">命中 (9,10)</text>
  <rect x="431" y="240" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="506" y="257" text-anchor="middle" font-size="13" fill="#622" filter="url(#rough2)">ans[1] = 10</text>

  <!-- 箭头连接阶段 -->
  <path d="M205 170 L218 170" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M403 170 L416 170" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 最终结果 -->
  <rect x="160" y="300" width="300" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="325" text-anchor="middle" font-size="14" fill="#622" filter="url(#rough2)">写回原始下标顺序</text>
  <text x="310" y="350" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450" filter="url(#rough2)">answer = [6, 10, 7] ✓</text>
  <path d="M310 270 L310 300" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 关键提示 -->
  <text x="310" y="400" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">本例每次插入都支配掉前一个，前沿恒为 1；</text>
  <text x="310" y="418" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">关键看 B(4,7) 与 D(5,7)：同 s 时大 y 支配小 y</text>
</svg>
