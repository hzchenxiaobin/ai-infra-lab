<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：整数二分找「最小可行 T」+ O(n) 贪心验证</text>

  <!-- ① 初始化 -->
  <rect x="130" y="28" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">① lo = 1，hi = w_min·H(H+1)/2</text>
  <text x="260" y="57" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">（hi = 最快工人独自挖完全部的耗时 ⇒ 必可行）</text>
  <path d="M 260 62 L 260 76" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② lo < hi ? -->
  <polygon points="260,78 352,104 260,130 168,104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">lo &lt; hi？</text>
  <text x="260" y="114" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">（区间未锁死）</text>

  <path d="M 168 104 L 120 104" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="144" y="97" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="14" y="90" width="104" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="66" y="103" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">返回 lo ✓</text>
  <text x="66" y="115" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">= 最小可行 T</text>

  <path d="M 260 130 L 260 144" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="142" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- ③ mid -->
  <rect x="170" y="146" width="180" height="26" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">③ mid = (lo + hi) / 2</text>
  <path d="M 260 172 L 260 186" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ④ 验证 -->
  <rect x="88" y="188" width="344" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">④ 验证 mid —— 逐个工人求时限内最大米数：</text>
  <text x="260" y="219" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">q = ⌊2·mid / w⌋；x = ⌊(√(4q+1) − 1) / 2⌋；Σ += x</text>
  <text x="260" y="234" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">（isqrt / sqrtl+回修，全程整数）</text>
  <path d="M 260 244 L 260 258" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ⑤ Σ >= H ? -->
  <polygon points="260,260 352,286 260,312 168,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">Σ ≥ H？</text>
  <text x="260" y="296" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">（山挖得完？）</text>

  <path d="M 168 286 L 126 286" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="147" y="279" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="20" y="272" width="104" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="72" y="285" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">hi = mid</text>
  <text x="72" y="297" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">可行·留作候选</text>

  <path d="M 352 286 L 394 286" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="373" y="279" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="398" y="272" width="104" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="285" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">lo = mid + 1</text>
  <text x="450" y="297" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">不够·弃掉 mid</text>

  <!-- 回边 -->
  <path d="M 72 302 L 72 332 L 450 332" stroke="#999" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 450 302 L 450 332" stroke="#999" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 450 332 L 506 332 L 506 104 L 354 104" stroke="#999" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="255" y="348" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">两界收紧后回到 ② 继续二分</text>
</svg>
