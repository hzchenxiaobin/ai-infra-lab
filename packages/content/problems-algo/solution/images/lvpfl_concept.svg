<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    核心观察：按值降序 + 标签名额贪心选取
  </text>

  <!-- ===== Step 1: 配对 ===== -->
  <rect x="60" y="44" width="440" height="48" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ① 配对 (value, label)，按 value 降序排序
  </text>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">
    值大的优先考虑 → 局部最优即全局最优
  </text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="104" font-size="10.5" fill="#888" filter="url(#rough2)">降序扫描</text>

  <!-- ===== Step 2: 标签名额 ===== -->
  <rect x="60" y="110" width="440" height="48" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ② 哈希表 cnt[label] 记录每标签已选次数
  </text>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">
    cnt[label] &lt; useLimit ? 选入 : 跳过
  </text>

  <path d="M 280 158 L 280 174" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="170" font-size="10.5" fill="#888" filter="url(#rough2)">直到 picked = numWanted</text>

  <!-- ===== Step 3 label ===== -->
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">
    ③ 示例：values=[9,8,8,7], labels=[0,0,0,1], useLimit=1
  </text>

  <!-- ===== Row 1: 排序后 4 张卡片 ===== -->
  <!-- card w=120 h=78 ; x=30,160,290,420 ; y=196 -->
  <g filter="url(#rough2)">
    <!-- (9,0) 选中 绿 -->
    <rect x="30"  y="196" width="120" height="78" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <!-- (8,0) 跳过 红 -->
    <rect x="160" y="196" width="120" height="78" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
    <!-- (8,0) 跳过 红 -->
    <rect x="290" y="196" width="120" height="78" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
    <!-- (7,1) 选中 绿 -->
    <rect x="420" y="196" width="120" height="78" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="11.5" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="90"  y="214">值 9</text>
    <text x="220" y="214">值 8</text>
    <text x="350" y="214">值 8</text>
    <text x="480" y="214">值 7</text>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="90"  y="234">标签 0</text>
    <text x="220" y="234">标签 0</text>
    <text x="350" y="234">标签 0</text>
    <text x="480" y="234">标签 1</text>
  </g>
  <g font-size="12.5" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="90"  y="258" fill="#4a7a3a">✅ 选入</text>
    <text x="220" y="258" fill="#b85450">❌ 跳过</text>
    <text x="350" y="258" fill="#b85450">❌ 跳过</text>
    <text x="480" y="258" fill="#4a7a3a">✅ 选入</text>
  </g>

  <!-- 标签名额说明箭头 -->
  <path d="M 220 280 L 220 296" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="292" font-size="10.5" fill="#b85450" filter="url(#rough2)">cnt[0]=1 已满</text>

  <!-- ===== 关键洞察框 ===== -->
  <rect x="60" y="310" width="440" height="58" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    贡献独立 + 约束全为上限 → 降序贪心成立
  </text>
  <text x="280" y="352" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">
    交换论证：换入大值仍合法且和不减
  </text>

  <!-- ===== Result box ===== -->
  <rect x="60" y="380" width="440" height="58" rx="10" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">
    ans = 9 + 7 = 16
  </text>
  <text x="280" y="422" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    大值优先，标签挡住就跳，名额满即停
  </text>
</svg>
