<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：逐元素判 x%6==0 → 累加 sum/cnt → 取整得答案</text>

  <!-- ===== Example 1: nums = [1,3,6,10,12,15] ===== -->
  <text x="40" y="46" font-size="12" fill="#446688" font-weight="bold">示例 1：nums = [1,3,6,10,12,15] → 命中 6、12 → (6+12)/2 = 9</text>

  <!-- header -->
  <rect x="60" y="52" width="380" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">x</text>
  <text x="170" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">x % 6</text>
  <text x="250" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">命中</text>
  <text x="340" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">sum</text>
  <text x="415" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cnt</text>

  <line x1="130" y1="52" x2="130" y2="206" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="52" x2="210" y2="206" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="290" y1="52" x2="290" y2="206" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="52" x2="390" y2="206" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- row x=1 (miss) -->
  <rect x="60" y="74" width="380" height="22" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="89" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">1</text>
  <text x="170" y="89" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="250" y="89" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="340" y="89" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="415" y="89" text-anchor="middle" font-size="11" fill="#888">0</text>

  <!-- row x=3 (miss) -->
  <rect x="60" y="96" width="380" height="22" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="111" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">3</text>
  <text x="170" y="111" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="250" y="111" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="340" y="111" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="415" y="111" text-anchor="middle" font-size="11" fill="#888">0</text>

  <!-- row x=6 (hit, green) -->
  <rect x="60" y="118" width="380" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="170" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="250" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="340" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="415" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row x=10 (miss) -->
  <rect x="60" y="140" width="380" height="22" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="155" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">10</text>
  <text x="170" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="250" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="340" y="155" text-anchor="middle" font-size="11" fill="#888">6</text>
  <text x="415" y="155" text-anchor="middle" font-size="11" fill="#888">1</text>

  <!-- row x=12 (hit, green) -->
  <rect x="60" y="162" width="380" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">12</text>
  <text x="170" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="250" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="340" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">18</text>
  <text x="415" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row x=15 (miss) -->
  <rect x="60" y="184" width="380" height="22" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="199" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">15</text>
  <text x="170" y="199" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="250" y="199" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="340" y="199" text-anchor="middle" font-size="11" fill="#888">18</text>
  <text x="415" y="199" text-anchor="middle" font-size="11" fill="#888">2</text>

  <!-- outer border ex1 -->
  <rect x="60" y="52" width="380" height="154" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result ex1 -->
  <rect x="460" y="109" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="127" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案</text>
  <text x="505" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">18//2 = 9 ✓</text>

  <!-- ===== Example 2: nums = [1,2,4,7,10] ===== -->
  <text x="40" y="232" font-size="12" fill="#d6a040" font-weight="bold">示例 2：nums = [1,2,4,7,10] → 无 6 的倍数 → cnt=0 → 返回 0</text>

  <rect x="60" y="238" width="380" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="254" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">x</text>
  <text x="170" y="254" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">x % 6</text>
  <text x="250" y="254" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">命中</text>
  <text x="340" y="254" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">sum</text>
  <text x="415" y="254" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cnt</text>

  <line x1="130" y1="238" x2="130" y2="370" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="238" x2="210" y2="370" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="290" y1="238" x2="290" y2="370" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="238" x2="390" y2="370" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- row x=1 -->
  <rect x="60" y="260" width="380" height="22" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="275" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">1</text>
  <text x="170" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="250" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="340" y="275" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="415" y="275" text-anchor="middle" font-size="11" fill="#888">0</text>

  <!-- row x=2 -->
  <rect x="60" y="282" width="380" height="22" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="297" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">2</text>
  <text x="170" y="297" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="250" y="297" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="340" y="297" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="415" y="297" text-anchor="middle" font-size="11" fill="#888">0</text>

  <!-- row x=4 -->
  <rect x="60" y="304" width="380" height="22" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="319" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">4</text>
  <text x="170" y="319" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="250" y="319" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="340" y="319" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="415" y="319" text-anchor="middle" font-size="11" fill="#888">0</text>

  <!-- row x=7 -->
  <rect x="60" y="326" width="380" height="22" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="341" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">7</text>
  <text x="170" y="341" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="250" y="341" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="340" y="341" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="415" y="341" text-anchor="middle" font-size="11" fill="#888">0</text>

  <!-- row x=10 -->
  <rect x="60" y="348" width="380" height="22" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="363" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">10</text>
  <text x="170" y="363" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="250" y="363" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="340" y="363" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="415" y="363" text-anchor="middle" font-size="11" fill="#888">0</text>

  <rect x="60" y="238" width="380" height="132" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result ex2 -->
  <rect x="460" y="295" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="313" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案</text>
  <text x="505" y="329" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt=0 → 0 ✓</text>

  <!-- footer: key insight -->
  <rect x="30" y="388" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">关键：偶数 ∩ 整除3 = 整除 lcm(2,3)=6；一次遍历 x%6==0 累加 sum/cnt</text>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#888">cnt=0 兜底返 0（避免除零）；否则 sum//cnt 向下取整（正数域）</text>
</svg>
