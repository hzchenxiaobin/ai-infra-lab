<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：哑节点 + prev/curr 双指针</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">一遍遍历 O(n)，O(1) 空间，原地修改 next</text>

  <!-- Start: dummy + prev + curr -->
  <rect x="170" y="58" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dummy.next=head; prev=dummy; curr=head</text>

  <path d="M 280 92 L 280 110" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: curr == null? -->
  <polygon points="280,112 380,150 280,188 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">curr == null?</text>
  <text x="280" y="162" text-anchor="middle" font-size="9" fill="#8a6a20">（遍历结束）</text>

  <!-- Yes: return dummy.next -->
  <text x="160" y="144" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <path d="M 180 150 L 100 150" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="134" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="60" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="60" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dummy.next</text>

  <!-- No -->
  <text x="296" y="204" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 280 188 L 280 208" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: curr.next != null && curr.val == curr.next.val? -->
  <polygon points="280,210 400,252 280,294 160,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">curr.next ≠ null 且</text>
  <text x="280" y="260" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">curr.val == curr.next.val?</text>
  <text x="280" y="274" text-anchor="middle" font-size="8" fill="#8a6a20">（发现重复组）</text>

  <!-- Yes: skip all duplicates -->
  <text x="160" y="242" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 160 252 L 100 252" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="226" width="80" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="244" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">val=curr.val</text>
  <text x="60" y="258" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">while curr 且</text>
  <text x="60" y="270" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr.val==val:</text>
  <text x="60" y="282" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr=curr.next</text>

  <path d="M 60 282 L 60 300 L 120 300" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="286" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="180" y="304" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">prev.next = curr</text>

  <!-- loop back from skip branch -->
  <path d="M 120 300 L 60 300 L 60 210 L 180 150" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="232" font-size="8" fill="#888">prev 不动</text>
  <text x="44" y="244" font-size="8" fill="#888">回到判断</text>

  <!-- No: keep curr, advance both -->
  <text x="296" y="310" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 280 294 L 280 312" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="314" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">prev = curr; curr = curr.next</text>
  <text x="280" y="348" text-anchor="middle" font-size="8" fill="#888">保留 curr，双指针前进</text>

  <!-- loop back from keep branch -->
  <path d="M 380 331 L 460 331 L 460 150 L 380 150" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="238" font-size="8" fill="#888">回到</text>
  <text x="466" y="250" font-size="8" fill="#888">curr==null?</text>

  <!-- ===== 底部说明 ===== -->
  <rect x="20" y="380" width="520" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="402" font-size="11" fill="#446688" font-weight="bold">两条分支的关键区别：</text>
  <text x="34" y="422" font-size="11" fill="#555">重复 → prev 不动，curr 跳过整组相同值，prev.next 指向下一个不同值</text>
  <text x="34" y="442" font-size="11" fill="#555">不重复 → prev 前进到 curr（保留该节点），curr 前进一格</text>
  <text x="34" y="458" font-size="10" fill="#888">prev 始终指向"已确认保留的最后一个节点"，它的 next 是下一个待判断的节点</text>
</svg>
