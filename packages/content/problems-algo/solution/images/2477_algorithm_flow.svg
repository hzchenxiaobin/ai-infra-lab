<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次后序 DFS，全部 O(n)</text>

  <!-- Step 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="50" width="440" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="56" y="74" font-size="13" fill="#446688" font-weight="bold">① 建图</text>
    <text x="56" y="95" font-size="12" fill="#333">由 roads 构邻接表 g[][]（双向边）；首都 0 作根</text>
  </g>
  <path d="M260,110 L260,130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="130" width="440" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="56" y="154" font-size="13" fill="#d6a040" font-weight="bold">② 后序 DFS 累计代表数</text>
    <text x="56" y="175" font-size="12" fill="#333">dfs(u, fa)：先递归各子 v 累加 P_v，P_u = 1 + Σ P_v</text>
    <text x="56" y="189" font-size="11" fill="#666">传 fa 防止沿无向边回走</text>
  </g>
  <path d="M260,194 L260,214" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <g filter="url(#rough2)">
    <rect x="40" y="214" width="440" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="56" y="238" font-size="13" fill="#4a7a3a" font-weight="bold">③ 非根节点计油耗</text>
    <text x="56" y="259" font-size="12" fill="#333">若 u ≠ 0：ans += ⌈P_u / seats⌉ = (P_u + seats − 1) / seats</text>
    <text x="56" y="273" font-size="11" fill="#666">根 0 无父不产生边，跳过</text>
  </g>
  <path d="M260,278 L260,298" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <g filter="url(#rough2)">
    <rect x="40" y="298" width="440" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="56" y="322" font-size="13" fill="#b85450" font-weight="bold">④ 返回 ans</text>
    <text x="56" y="340" font-size="12" fill="#333">所有非根边油耗之和（用 long long，防 seats=1 链状树溢出）</text>
  </g>

  <!-- decision diamond: u == 0? -->
  <g filter="url(#rough2)">
    <path d="M486,333 L516,318 L546,333 L516,348 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="516" y="337" text-anchor="middle" font-size="10" fill="#7a4a10">u=0?</text>
  </g>
  <text x="474" y="370" font-size="10" fill="#b85450" filter="url(#rough2)">否→累加油耗</text>

  <!-- note -->
  <g filter="url(#rough2)">
    <rect x="40" y="362" width="440" height="44" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="56" y="384" font-size="12" fill="#555">关键：树路径唯一 → 每条边人数 = 子树代表数，</text>
    <text x="56" y="400" font-size="12" fill="#555">逐边取 ⌈P/seats⌉ 即最少车数；局部最优合成全局最优</text>
  </g>
</svg>
