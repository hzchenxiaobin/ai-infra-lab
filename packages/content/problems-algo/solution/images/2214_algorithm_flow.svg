<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="300" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：一次遍历求和 + 找最大
  </text>

  <!-- Step 1: sum -->
  <rect x="30" y="70" width="120" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历求和</text>
  <text x="90" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">s = Σdamage</text>

  <!-- arrow -->
  <path d="M150,97 L172,97" stroke="#446688" stroke-width="2" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: max -->
  <rect x="174" y="70" width="120" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="234" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">同步找最大</text>
  <text x="234" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">mx = max(damage)</text>

  <!-- arrow -->
  <path d="M294,97 L316,97" stroke="#446688" stroke-width="2" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: savings -->
  <rect x="318" y="70" width="120" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="378" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">算节省值</text>
  <text x="378" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">save = min(mx, armor)</text>

  <!-- arrow -->
  <path d="M438,97 L460,97" stroke="#446688" stroke-width="2" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 4: answer -->
  <rect x="462" y="68" width="100" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="512" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回答案</text>
  <text x="512" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">s − save + 1</text>

  <!-- note: single pass -->
  <rect x="80" y="175" width="420" height="92" fill="#fafafa" stroke="#446688" stroke-width="1.2" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    关键：求和、找最大在同一趟遍历内完成
  </text>
  <text x="290" y="223" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    save = min(mx, armor) —— 护甲收益随伤害递增、封顶 armor
  </text>
  <text x="290" y="245" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    +1 —— 生命须严格大于 0（末步恰好剩 1）
  </text>
</svg>
