<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">158 核心：buf4 升格为成员变量，跨 read 调用暂存多读字符</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">file = "leetcode"，连续两次 read(buf, 5)</text>

  <!-- ===== 成员变量区（右侧，贯穿两次调用） ===== -->
  <rect x="470" y="60" width="118" height="380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="529" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">成员变量（持久）</text>
  <text x="529" y="96" text-anchor="middle" font-size="9" fill="#888">跨 read 调用保留</text>

  <!-- buf4[4] 格子 -->
  <text x="529" y="118" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">buf4[4]</text>
  <g font-size="11">
    <rect x="480" y="126" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="493" y="145" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" id="b0">?</text>
    <rect x="506" y="126" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="519" y="145" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" id="b1">?</text>
    <rect x="532" y="126" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="545" y="145" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" id="b2">?</text>
    <rect x="558" y="126" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="571" y="145" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" id="b3">?</text>
  </g>
  <!-- ptr/cnt 标注 -->
  <text x="529" y="172" text-anchor="middle" font-size="10" fill="#444">buf4Ptr = <tspan fill="#b85450" font-weight="bold">0</tspan></text>
  <text x="529" y="186" text-anchor="middle" font-size="10" fill="#444">buf4Cnt = <tspan fill="#446688" font-weight="bold">0</tspan></text>
  <text x="529" y="204" text-anchor="middle" font-size="9" fill="#888">初始：缓存空</text>

  <!-- 成员变量跨调用保留说明 -->
  <rect x="478" y="220" width="102" height="208" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="529" y="238" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">关键性质</text>
  <text x="484" y="256" font-size="9" fill="#444">• 跨 read 调用</text>
  <text x="484" y="270" font-size="9" fill="#444">　 持久保留</text>
  <text x="484" y="288" font-size="9" fill="#444">• buf4Ptr==Cnt</text>
  <text x="484" y="300" font-size="9" fill="#444">　 ⇒ 缓存空</text>
  <text x="484" y="312" font-size="9" fill="#444">　 ⇒ 调 read4</text>
  <text x="484" y="330" font-size="9" fill="#444">• buf4Ptr&lt;Cnt</text>
  <text x="484" y="342" font-size="9" fill="#444">　 ⇒ 有剩</text>
  <text x="484" y="354" font-size="9" fill="#444">　 ⇒ 不调 read4</text>
  <text x="484" y="372" font-size="9" fill="#b85450" font-weight="bold">⚠️ read4 后</text>
  <text x="484" y="384" font-size="9" fill="#b85450" font-weight="bold">　 必须重置</text>
  <text x="484" y="396" font-size="9" fill="#b85450" font-weight="bold">　 buf4Ptr=0</text>
  <text x="484" y="416" font-size="8" fill="#888">157 无此区（局部）</text>

  <!-- ===== 调用 #1 区域 ===== -->
  <rect x="20" y="60" width="440" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="240" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">调用 #1：read(buf, 5)</text>
  <text x="240" y="96" text-anchor="middle" font-size="10" fill="#888">read4 读了 8 字符（leet + code），但只交付 5 个，剩 "ode" 暂存</text>

  <!-- 文件流 -->
  <text x="100" y="120" text-anchor="middle" font-size="9" fill="#888">文件流 "leetcode"</text>
  <g font-size="9">
    <rect x="36" y="128" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="47" y="143" text-anchor="middle" fill="#446688" font-weight="bold">l</text>
    <rect x="58" y="128" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="69" y="143" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="80" y="128" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="91" y="143" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="102" y="128" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="113" y="143" text-anchor="middle" fill="#446688" font-weight="bold">t</text>
    <rect x="124" y="128" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="135" y="143" text-anchor="middle" fill="#d6a040" font-weight="bold">c</text>
    <rect x="146" y="128" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="157" y="143" text-anchor="middle" fill="#d6a040" font-weight="bold">o</text>
    <rect x="168" y="128" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="179" y="143" text-anchor="middle" fill="#d6a040" font-weight="bold">d</text>
    <rect x="190" y="128" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="201" y="143" text-anchor="middle" fill="#d6a040" font-weight="bold">e</text>
  </g>
  <text x="113" y="162" font-size="8" fill="#446688" font-weight="bold">↑read4×1</text>
  <text x="157" y="162" font-size="8" fill="#d6a040" font-weight="bold">↑read4×2</text>

  <!-- buf4 成员（指向右侧） -->
  <text x="240" y="120" text-anchor="middle" font-size="9" fill="#888">→ 写入成员 buf4（见右）</text>

  <!-- buf 输出 -->
  <text x="330" y="120" text-anchor="middle" font-size="9" fill="#888">buf（交付 5 个）</text>
  <g font-size="9">
    <rect x="294" y="128" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="305" y="143" text-anchor="middle" fill="#4a7a3a" font-weight="bold">l</text>
    <rect x="316" y="128" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="327" y="143" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="338" y="128" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="349" y="143" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="360" y="128" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="371" y="143" text-anchor="middle" fill="#4a7a3a" font-weight="bold">t</text>
    <rect x="382" y="128" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="393" y="143" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
  </g>
  <text x="330" y="162" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">total=5==n，返回</text>

  <!-- 调用 #1 结束状态 -->
  <rect x="36" y="180" width="408" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="46" y="198" font-size="10" fill="#444" font-weight="bold">调用 #1 结束状态：</text>
  <text x="46" y="214" font-size="10" fill="#444">成员 buf4 = [c,o,d,e,?]，buf4Ptr=<tspan fill="#b85450" font-weight="bold">1</tspan>，buf4Cnt=<tspan fill="#446688" font-weight="bold">4</tspan></text>
  <text x="290" y="214" font-size="10" fill="#b85450" font-weight="bold">→ "ode" 暂存，不丢弃！</text>

  <!-- ===== 跨调用箭头 ===== -->
  <path d="M 240 230 L 240 252" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="250" y="246" font-size="10" fill="#b85450" font-weight="bold">成员状态保留</text>
  <text x="250" y="258" font-size="9" fill="#888">buf4/Ptr/Cnt 不变</text>

  <!-- ===== 调用 #2 区域 ===== -->
  <rect x="20" y="260" width="440" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="240" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">调用 #2：read(buf, 5)</text>
  <text x="240" y="296" text-anchor="middle" font-size="10" fill="#888">先消费缓存 "ode"（不调 read4），再调 read4 返回 0（EOF）</text>

  <!-- 步骤 1：消费缓存 -->
  <text x="46" y="318" font-size="10" fill="#444" font-weight="bold">步骤 1：buf4Ptr=1 &lt; buf4Cnt=4 ⇒ 缓存有剩，<tspan fill="#4a7a3a">不调 read4</tspan></text>
  <g font-size="9">
    <rect x="36" y="328" width="22" height="22" fill="#eee" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
    <text x="47" y="343" text-anchor="middle" fill="#bbb" font-weight="bold">c</text>
    <rect x="58" y="328" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="69" y="343" text-anchor="middle" fill="#4a7a3a" font-weight="bold">o</text>
    <rect x="80" y="328" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="91" y="343" text-anchor="middle" fill="#4a7a3a" font-weight="bold">d</text>
    <rect x="102" y="328" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="113" y="343" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
  </g>
  <text x="69" y="362" font-size="8" fill="#888">已消费</text>
  <text x="91" y="362" font-size="8" fill="#4a7a3a" font-weight="bold">↑取这 3 个</text>
  <text x="200" y="343" font-size="10" fill="#444">need = min(4−1, 5−0) = <tspan fill="#4a7a3a" font-weight="bold">3</tspan></text>
  <text x="200" y="358" font-size="9" fill="#888">拷 "ode" → buf，total=3，ptr→4</text>

  <!-- 步骤 2：read4 EOF -->
  <text x="46" y="388" font-size="10" fill="#444" font-weight="bold">步骤 2：buf4Ptr==buf4Cnt ⇒ 缓存空，调 read4 → 返回 <tspan fill="#b85450" font-weight="bold">0</tspan>（EOF）</text>
  <text x="46" y="404" font-size="10" fill="#b85450" font-weight="bold">⇒ break，返回 total=3</text>
  <text x="46" y="424" font-size="9" fill="#888">buf="ode"，全程只调 1 次 read4（且返回 0），完整复用上次暂存</text>
</svg>
