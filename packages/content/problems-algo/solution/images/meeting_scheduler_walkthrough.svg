<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：duration 决定能否安排</text>

  <!-- Column headers -->
  <text x="40" y="52" font-size="10" fill="#888">步骤</text>
  <text x="86" y="52" font-size="10" fill="#888">s1[i]</text>
  <text x="150" y="52" font-size="10" fill="#888">s2[j]</text>
  <text x="214" y="52" font-size="10" fill="#888">lo, hi</text>
  <text x="282" y="52" font-size="10" fill="#888">长度</text>
  <text x="330" y="52" font-size="10" fill="#888">d=8</text>
  <text x="392" y="52" font-size="10" fill="#888">d=12</text>
  <text x="450" y="52" font-size="10" fill="#888">谁先结束</text>

  <!-- Divider line -->
  <path d="M 30 58 L 530 58" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: [10,50] ∩ [0,15] = [10,15], len=5, j++ -->
  <text x="44" y="78" font-size="11" fill="#555">1</text>
  <rect x="78" y="66" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="80" text-anchor="middle" font-size="10" fill="#333">[10,50]</text>
  <rect x="142" y="66" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="80" text-anchor="middle" font-size="10" fill="#333">[0,15]</text>
  <text x="232" y="80" font-size="10" fill="#555">10, 15</text>
  <text x="288" y="80" font-size="10" fill="#999">5</text>
  <text x="330" y="80" font-size="10" fill="#999">5&lt;8 继续</text>
  <text x="392" y="80" font-size="10" fill="#999">5&lt;12 继续</text>
  <text x="450" y="80" font-size="10" fill="#4a7a3a">15&lt;50→j++</text>

  <!-- Row 2: [10,50] ∩ [60,70] = 空(60>50), i++ -->
  <text x="44" y="108" font-size="11" fill="#555">2</text>
  <rect x="78" y="96" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="110" text-anchor="middle" font-size="10" fill="#333">[10,50]</text>
  <rect x="142" y="96" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="110" text-anchor="middle" font-size="10" fill="#333">[60,70]</text>
  <text x="232" y="110" font-size="10" fill="#999">60, 50</text>
  <text x="288" y="110" font-size="10" fill="#999">空</text>
  <text x="330" y="110" font-size="10" fill="#999">继续</text>
  <text x="392" y="110" font-size="10" fill="#999">继续</text>
  <text x="450" y="110" font-size="10" fill="#446688">50&lt;70→i++</text>

  <!-- Row 3: [60,120] ∩ [60,70] = [60,70], len=10 -->
  <text x="44" y="138" font-size="11" fill="#555">3</text>
  <rect x="78" y="126" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="140" text-anchor="middle" font-size="10" fill="#333">[60,120]</text>
  <rect x="142" y="126" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="140" text-anchor="middle" font-size="10" fill="#333">[60,70]</text>
  <text x="232" y="140" font-size="10" fill="#555">60, 70</text>
  <text x="288" y="140" font-size="10" fill="#555">10</text>
  <rect x="318" y="126" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="346" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">10≥8 返回</text>
  <rect x="378" y="126" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="406" y="140" text-anchor="middle" font-size="10" fill="#b85450">10&lt;12 继续</text>
  <text x="450" y="140" font-size="10" fill="#4a7a3a">70&lt;120→j++</text>

  <!-- Row 4: j 越界 -->
  <text x="44" y="168" font-size="11" fill="#555">4</text>
  <rect x="78" y="156" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="170" text-anchor="middle" font-size="10" fill="#333">[60,120]</text>
  <text x="172" y="170" text-anchor="middle" font-size="10" fill="#999">越界</text>
  <text x="232" y="170" font-size="10" fill="#999">—</text>
  <text x="288" y="170" font-size="10" fill="#999">—</text>
  <text x="330" y="170" font-size="10" fill="#999">—</text>
  <rect x="378" y="156" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="406" y="170" text-anchor="middle" font-size="10" fill="#b85450">结束→[]</text>
  <text x="450" y="170" font-size="10" fill="#999">—</text>

  <!-- End divider -->
  <path d="M 30 188 L 530 188" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result boxes -->
  <rect x="40" y="206" width="235" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="228" font-size="11" fill="#888">duration=8:</text>
  <text x="200" y="229" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[60, 68] ✓</text>

  <rect x="285" y="206" width="235" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="305" y="228" font-size="11" fill="#888">duration=12:</text>
  <text x="445" y="229" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">[] ✓</text>

  <!-- Visual timeline -->
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">时间轴视图</text>

  <!-- slots1 timeline -->
  <text x="36" y="300" font-size="10" fill="#446688" font-weight="bold">人1:</text>
  <rect x="70" y="288" width="70" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="301" text-anchor="middle" font-size="8" fill="#333">[10,50]</text>
  <rect x="160" y="288" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="301" text-anchor="middle" font-size="8" fill="#333">[60,120]</text>
  <rect x="300" y="288" width="150" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="301" text-anchor="middle" font-size="8" fill="#333">[140,210]</text>

  <!-- slots2 timeline -->
  <text x="36" y="326" font-size="10" fill="#4a7a3a" font-weight="bold">人2:</text>
  <rect x="60" y="314" width="30" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="327" text-anchor="middle" font-size="8" fill="#333">[0,15]</text>
  <rect x="160" y="314" width="25" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="327" text-anchor="middle" font-size="8" fill="#333">[60,70]</text>

  <!-- Intersection [60,70] -->
  <rect x="160" y="314" width="25" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)" opacity="0.75"/>

  <!-- duration=8 window -->
  <text x="36" y="362" font-size="10" fill="#d6a040" font-weight="bold">d=8:</text>
  <rect x="160" y="350" width="20" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="170" y="376" text-anchor="middle" font-size="8" fill="#d6a040">[60,68]</text>

  <!-- duration=12 window (dashed, no fit) -->
  <text x="36" y="402" font-size="10" fill="#b85450" font-weight="bold">d=12:</text>
  <rect x="160" y="390" width="30" height="18" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="175" y="403" text-anchor="middle" font-size="8" fill="#999">需12</text>
  <text x="205" y="403" font-size="8" fill="#b85450">仅 10 可用 ✗</text>

  <!-- Legend -->
  <rect x="40" y="420" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="58" y="429" font-size="9" fill="#666">人1</text>
  <rect x="90" y="420" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="108" y="429" font-size="9" fill="#666">人2</text>
  <rect x="140" y="420" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="158" y="429" font-size="9" fill="#666">交集</text>
  <rect x="190" y="420" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="208" y="429" font-size="9" fill="#666">会议窗口</text>
</svg>
