<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：移除数 k 越多 → p 越难保持子序列（单调性）</text>

  <!-- ===== s string with indices ===== -->
  <text x="40" y="58" font-size="12" fill="#888">s = "abcacb"，p = "ab"，removable = [3,1,0]</text>

  <!-- index labels -->
  <text x="96" y="86" text-anchor="middle" font-size="10" fill="#999">idx0</text>
  <text x="132" y="86" text-anchor="middle" font-size="10" fill="#999">idx1</text>
  <text x="168" y="86" text-anchor="middle" font-size="10" fill="#999">idx2</text>
  <text x="204" y="86" text-anchor="middle" font-size="10" fill="#999">idx3</text>
  <text x="240" y="86" text-anchor="middle" font-size="10" fill="#999">idx4</text>
  <text x="276" y="86" text-anchor="middle" font-size="10" fill="#999">idx5</text>

  <!-- s boxes baseline k=0 row (none removed) -->
  <rect x="80" y="92" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="116" y="92" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="152" y="92" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="188" y="92" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="224" y="92" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="260" y="92" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <!-- removable order annotation -->
  <text x="204" y="138" text-anchor="middle" font-size="9" fill="#d6a040">第1个移除</text>
  <text x="132" y="138" text-anchor="middle" font-size="9" fill="#b85450">第2个移除</text>
  <text x="96" y="138" text-anchor="middle" font-size="9" fill="#b85450">第3个移除</text>

  <!-- ===== k rows: 0,1,2,3 ===== -->
  <!-- column headers -->
  <text x="44" y="170" font-size="11" fill="#888" font-weight="bold">k</text>
  <text x="96" y="170" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">移除后剩余串</text>
  <text x="300" y="170" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">"ab" 是子序列?</text>

  <!-- k=0 row -->
  <rect x="36" y="180" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="47" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="96" y="198" font-size="13" fill="#333" font-weight="bold">a b c a c b</text>
  <text x="300" y="198" font-size="13" fill="#4a7a3a" font-weight="bold">✓ (a@0, b@1)</text>

  <!-- k=1 row: remove idx3 -->
  <rect x="36" y="212" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="47" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="96" y="230" font-size="13" fill="#333" font-weight="bold">a b c</text>
  <text x="160" y="230" font-size="11" fill="#d6a040">[a移除]</text>
  <text x="210" y="230" font-size="13" fill="#333" font-weight="bold">c b</text>
  <text x="300" y="230" font-size="13" fill="#4a7a3a" font-weight="bold">✓ (a@0, b@1)</text>

  <!-- k=2 row: remove idx3,idx1 -->
  <rect x="36" y="244" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="47" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="96" y="262" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="120" y="262" font-size="11" fill="#b85450">[b移除]</text>
  <text x="162" y="262" font-size="13" fill="#333" font-weight="bold">c</text>
  <text x="186" y="262" font-size="11" fill="#d6a040">[a移除]</text>
  <text x="228" y="262" font-size="13" fill="#333" font-weight="bold">c b</text>
  <text x="300" y="262" font-size="13" fill="#4a7a3a" font-weight="bold">✓ (a@0, b@5)</text>

  <!-- k=3 row: remove idx3,idx1,idx0 -->
  <rect x="36" y="276" width="22" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="47" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="96" y="294" font-size="11" fill="#b85450">[a移除]</text>
  <text x="138" y="294" font-size="11" fill="#b85450">[b移除]</text>
  <text x="180" y="294" font-size="13" fill="#333" font-weight="bold">c</text>
  <text x="206" y="294" font-size="11" fill="#b85450">[a移除]</text>
  <text x="248" y="294" font-size="13" fill="#333" font-weight="bold">c b</text>
  <text x="300" y="294" font-size="13" fill="#b85450" font-weight="bold">✗ (无 a)</text>

  <!-- divider -->
  <line x1="36" y1="312" x2="380" y2="312" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Monotonicity curve ===== -->
  <text x="40" y="334" font-size="12" fill="#555" font-weight="bold">单调性：k 小 → 字符多 → p 易为子序列</text>

  <!-- axes -->
  <line x1="70" y1="350" x2="70" y2="420" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="420" x2="300" y2="420" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="356" text-anchor="end" font-size="10" fill="#888">check</text>
  <text x="304" y="424" font-size="10" fill="#888">k →</text>
  <text x="64" y="424" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- step curve: k=0,1,2 -> true (high); k=3 -> false (low) -->
  <path d="M 70 365 L 130 365 L 130 365 L 190 365 L 190 365 L 250 365 L 250 410 L 290 410" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="150" y="358" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 可行</text>
  <text x="270" y="404" font-size="10" fill="#b85450" font-weight="bold">✗ 不可行</text>

  <!-- answer point at k=2 -->
  <circle cx="250" cy="365" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="250" y1="365" x2="250" y2="420" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="250" y="436" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = 2</text>

  <!-- right summary note -->
  <rect x="396" y="180" width="150" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="471" y="206" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="471" y="228" text-anchor="middle" font-size="11" fill="#666">k ∈ [0, m]</text>
  <text x="471" y="248" text-anchor="middle" font-size="11" fill="#666">m = removable 长度</text>
  <text x="471" y="270" text-anchor="middle" font-size="11" fill="#666">求最大的 k</text>
  <text x="471" y="288" text-anchor="middle" font-size="11" fill="#666">使 p 仍为子序列</text>
  <text x="471" y="308" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分!</text>
</svg>
