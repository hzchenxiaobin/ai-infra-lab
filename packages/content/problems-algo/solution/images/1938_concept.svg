<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：树上离线查询 + DFS 回溯增删 Trie
  </text>

  <!-- ===== Left: Tree ===== -->
  <text x="130" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">树（基因值 = 节点编号）</text>

  <!-- Node 0 (root) -->
  <ellipse cx="130" cy="76" rx="18" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="100" y="64" font-size="9" fill="#888" filter="url(#rough2)">root</text>

  <!-- Edge 0-1 -->
  <line x1="130" y1="90" x2="130" y2="116" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Node 1 -->
  <ellipse cx="130" cy="130" rx="18" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- Edges 1-2, 1-3 -->
  <line x1="124" y1="144" x2="86" y2="178" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="136" y1="144" x2="174" y2="178" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Node 2 -->
  <ellipse cx="80" cy="192" rx="18" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- Node 3 -->
  <ellipse cx="180" cy="192" rx="18" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- Queries attached (pink) -->
  <!-- q0 on node 0 -->
  <rect x="168" y="64" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="80" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">q0: val=2</text>
  <path d="M167,76 L150,76" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- q2 on node 2 -->
  <rect x="8" y="180" width="62" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="39" y="196" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">q2: val=5</text>
  <path d="M70,192 L62,192" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- q1 on node 3 -->
  <rect x="210" y="180" width="62" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="241" y="196" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">q1: val=2</text>
  <path d="M209,192 L198,192" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Divider -->
  <line x1="280" y1="44" x2="280" y2="300" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== Right: DFS steps ===== -->
  <text x="415" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">DFS 回溯增删 Trie</text>

  <!-- Column headers -->
  <text x="300" y="72" font-size="9" fill="#888" filter="url(#rough2)">步骤</text>
  <text x="375" y="72" font-size="9" fill="#888" filter="url(#rough2)">操作</text>
  <text x="455" y="72" font-size="9" fill="#888" filter="url(#rough2)">Trie 内容</text>
  <text x="525" y="72" font-size="9" fill="#888" filter="url(#rough2)">查询</text>

  <!-- Step rows -->
  <text x="300" y="94" font-size="10" fill="#333" filter="url(#rough2)">enter 0</text>
  <text x="375" y="94" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+0</text>
  <text x="455" y="94" font-size="10" fill="#446688" filter="url(#rough2)">{0}</text>
  <text x="525" y="94" font-size="9" fill="#b85450" filter="url(#rough2)">q0→2</text>

  <text x="300" y="114" font-size="10" fill="#333" filter="url(#rough2)">enter 1</text>
  <text x="375" y="114" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="455" y="114" font-size="10" fill="#446688" filter="url(#rough2)">{0,1}</text>
  <text x="525" y="114" font-size="9" fill="#888" filter="url(#rough2)">—</text>

  <text x="300" y="134" font-size="10" fill="#333" filter="url(#rough2)">enter 2</text>
  <text x="375" y="134" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <text x="455" y="134" font-size="10" fill="#446688" filter="url(#rough2)">{0,1,2}</text>
  <text x="525" y="134" font-size="9" fill="#b85450" filter="url(#rough2)">q2→7</text>

  <text x="300" y="154" font-size="10" fill="#333" filter="url(#rough2)">exit 2</text>
  <text x="375" y="154" font-size="10" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="455" y="154" font-size="10" fill="#446688" filter="url(#rough2)">{0,1}</text>
  <text x="525" y="154" font-size="9" fill="#888" filter="url(#rough2)">—</text>

  <text x="300" y="174" font-size="10" fill="#333" filter="url(#rough2)">enter 3</text>
  <text x="375" y="174" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+3</text>
  <text x="455" y="174" font-size="10" fill="#446688" filter="url(#rough2)">{0,1,3}</text>
  <text x="525" y="174" font-size="9" fill="#b85450" filter="url(#rough2)">q1→3</text>

  <text x="300" y="194" font-size="10" fill="#333" filter="url(#rough2)">exit 3</text>
  <text x="375" y="194" font-size="10" fill="#b85450" filter="url(#rough2)">−3</text>
  <text x="455" y="194" font-size="10" fill="#446688" filter="url(#rough2)">{0,1}</text>
  <text x="525" y="194" font-size="9" fill="#888" filter="url(#rough2)">—</text>

  <text x="300" y="214" font-size="10" fill="#333" filter="url(#rough2)">exit 1</text>
  <text x="375" y="214" font-size="10" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="455" y="214" font-size="10" fill="#446688" filter="url(#rough2)">{0}</text>
  <text x="525" y="214" font-size="9" fill="#888" filter="url(#rough2)">—</text>

  <text x="300" y="234" font-size="10" fill="#333" filter="url(#rough2)">exit 0</text>
  <text x="375" y="234" font-size="10" fill="#b85450" filter="url(#rough2)">−0</text>
  <text x="455" y="234" font-size="10" fill="#446688" filter="url(#rough2)">{ }</text>
  <text x="525" y="234" font-size="9" fill="#888" filter="url(#rough2)">—</text>

  <!-- Legend -->
  <text x="300" y="262" font-size="9" fill="#4a7a3a" filter="url(#rough2)">绿色 + = 进入插入</text>
  <text x="430" y="262" font-size="9" fill="#b85450" filter="url(#rough2)">红色 − = 退出删除</text>

  <!-- ===== Bottom: insight ===== -->
  <rect x="40" y="282" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    查询挂到树节点上 → DFS 路径上的 Trie 恰好含「根到当前节点」全部基因值
  </text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    进入 insert / 退出 remove → 回溯天然维护「路径集合」
  </text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    每查询 O(log max) 逐位贪心 → 总 O((n+q)·log max)
  </text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    蓝色 = 节点基因值；粉红 = 查询；绿 + = 插入；红 − = 删除
  </text>
</svg>
