<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">实效单价：能配对的先配对，剩余单补（示例 1：need1=3, need2=2）</text>

  <!-- 行标签与需求格子 -->
  <text x="96" y="68" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">类型1需求</text>
  <text x="96" y="138" text-anchor="end" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">类型2需求</text>
  <g filter="url(#rough2)">
    <rect x="108" y="50" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="164" y="50" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="220" y="50" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="108" y="120" width="50" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="164" y="120" width="50" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="133" y="70" text-anchor="middle" font-size="11" fill="#33506b">1</text>
    <text x="189" y="70" text-anchor="middle" font-size="11" fill="#33506b">1</text>
    <text x="245" y="70" text-anchor="middle" font-size="11" fill="#8a6d1f">1</text>
    <text x="133" y="140" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <text x="189" y="140" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
  </g>

  <!-- 配对虚线框 -->
  <rect x="100" y="42" width="124" height="116" rx="10" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="162" y="176" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">k = min(need1, need2) = 2 对</text>
  <text x="162" y="191" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">每对按 cPair 单价采购</text>

  <!-- 剩余标注 -->
  <path d="M 276 65 L 300 65" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="61" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">剩余 need1−k = 1 个</text>
  <text x="306" y="75" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">按 only1 单价单补</text>

  <!-- 三个实效单价说明框 -->
  <g filter="url(#rough2)">
    <rect x="26" y="204" width="152" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="102" y="223" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">cPair：成对单价</text>
    <text x="102" y="239" text-anchor="middle" font-size="10" fill="#33506b">min(costBoth, cost1+cost2)</text>
    <text x="102" y="254" text-anchor="middle" font-size="9.5" fill="#33506b">买组合，或买俩拆开</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="188" y="204" width="152" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="264" y="223" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">only1：单补类型 1</text>
    <text x="264" y="239" text-anchor="middle" font-size="10" fill="#8a6d1f">min(cost1, costBoth)</text>
    <text x="264" y="254" text-anchor="middle" font-size="9.5" fill="#8a6d1f">组合太便宜就浪费类型 2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="350" y="204" width="152" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="426" y="223" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">only2：单补类型 2</text>
    <text x="426" y="239" text-anchor="middle" font-size="10" fill="#2f5d24">min(cost2, costBoth)</text>
    <text x="426" y="254" text-anchor="middle" font-size="9.5" fill="#2f5d24">与 only1 对称</text>
  </g>

  <!-- 底部公式框 -->
  <g filter="url(#rough2)">
    <rect x="26" y="282" width="476" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="264" y="302" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold">ans = k·cPair + (need1−k)·only1 + (need2−k)·only2</text>
    <text x="264" y="320" text-anchor="middle" font-size="10.5" fill="#8a3a34">示例 1：k=2, cPair=1, only1=1 ⇒ 2×1 + 1×1 + 0×1 = 3 ✓</text>
    <text x="264" y="338" text-anchor="middle" font-size="10.5" fill="#8a3a34">关键不等式 cPair ≤ only1 + only2 ⇒ 配对永远不亏</text>
  </g>
</svg>
