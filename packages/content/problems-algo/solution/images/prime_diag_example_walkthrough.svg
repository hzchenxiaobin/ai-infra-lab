<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：候选 {1, 3, 6, 9, 11}，逐个判质数</text>

  <!-- Table header -->
  <rect x="40" y="50" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">候选 v</text>
  <rect x="120" y="50" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">试除过程（枚举 d ≤ √v）</text>
  <rect x="400" y="50" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">质数?</text>
  <rect x="480" y="50" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans</text>

  <!-- Row 1: v=1 -->
  <rect x="40" y="88" width="80" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="88" width="280" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12" fill="#888">v ≤ 1 → 直接判否</text>
  <rect x="400" y="88" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="110" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">否</text>
  <rect x="480" y="88" width="80" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="520" y="110" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- Row 2: v=3 -->
  <rect x="40" y="124" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="120" y="124" width="280" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#555">d=2: 2×2=4 &gt; 3 停，无因子</text>
  <rect x="400" y="124" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="480" y="124" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="520" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- Row 3: v=6 -->
  <rect x="40" y="160" width="80" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="120" y="160" width="280" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#555">d=2: 6 % 2 == 0 → 有因子 2</text>
  <rect x="400" y="160" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="182" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">否</text>
  <rect x="480" y="160" width="80" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="520" y="182" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- Row 4: v=9 -->
  <rect x="40" y="196" width="80" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="218" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="120" y="196" width="280" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#555">d=2 不整除；d=3: 9 % 3 == 0 → 有因子 3</text>
  <rect x="400" y="196" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="218" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">否</text>
  <rect x="480" y="196" width="80" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="520" y="218" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- Row 5: v=11 -->
  <rect x="40" y="232" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">11</text>
  <rect x="120" y="232" width="280" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#555">d=2,3 均不整除；3×3=9&lt;11 但 d=4&gt;√11 停</text>
  <rect x="400" y="232" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="254" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="480" y="232" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="254" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>

  <!-- Result box -->
  <rect x="40" y="286" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="312" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">对角线上的质数：{3, 11}，最大值为 11 → 返回 11 ⭐</text>

  <!-- Note -->
  <rect x="40" y="338" width="520" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="360" font-size="12" fill="#333"><tspan font-weight="bold" fill="#d6a040">细节：</tspan>① 候选集自动去重，中心 6 只测一次；② √11 ≈ 3.31，故 d 只枚举到 3；</text>
  <text x="50" y="378" font-size="12" fill="#333">   ③ 偶优化：先特判 v==2，再把其余偶数一次性判否，只对奇 d 试除，可省一半工作量。</text>
  <text x="50" y="396" font-size="12" fill="#333">   ④ ans 初值 0 兜底：若无任何质数（如全 1 / 全合数），自然返回 0。</text>
</svg>
