<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：[1,1,1,3,9,9,9,2,10,10] → 5 块</text>

  <!-- 表头 -->
  <rect x="30" y="40" width="448" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="47"  y="56" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">轮</text>
  <text x="91"  y="56" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">块首 i</text>
  <text x="138" y="56" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="263" y="56" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">二分探测序列（域 [i, 9]）</text>
  <text x="394" y="56" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">块尾 last</text>
  <text x="450" y="56" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">blocks</text>

  <!-- 行 1 -->
  <rect x="30" y="66" width="448" height="26" fill="#f5f8ff" stroke="#c3d2e8" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="47"  y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="91"  y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="138" y="84" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="263" y="84" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">at(5)=9 ✗ → at(2)=1 ✓ → at(3)=3 ✗</text>
  <text x="394" y="84" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="450" y="84" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="30" y="94" width="448" height="26" fill="#f3faf4" stroke="#c8e0c8" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="47"  y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="91"  y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="138" y="112" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="263" y="112" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">at(6)=9 ✗ → at(4)=9 ✗</text>
  <text x="394" y="112" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="450" y="112" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 行 3 -->
  <rect x="30" y="122" width="448" height="26" fill="#fffcf2" stroke="#ecd9a8" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="47"  y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="91"  y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="138" y="140" text-anchor="middle" font-size="10.5" fill="#8a6414" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="263" y="140" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">at(7)=2 ✗ → at(5)=9 ✓ → at(6)=9 ✓</text>
  <text x="394" y="140" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="450" y="140" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 行 4 -->
  <rect x="30" y="150" width="448" height="26" fill="#fdf6f7" stroke="#eccdd0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="47"  y="168" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="91"  y="168" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="138" y="168" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="263" y="168" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">at(8)=10 ✗</text>
  <text x="394" y="168" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="450" y="168" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 行 5 -->
  <rect x="30" y="178" width="448" height="26" fill="#f5f8ff" stroke="#c3d2e8" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="47"  y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="91"  y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="138" y="196" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="263" y="196" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">at(9)=10 ✓</text>
  <text x="394" y="196" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="450" y="196" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 汇总 -->
  <rect x="55" y="216" width="410" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">5 轮循环 = 5 块；at() 共调用 5 次读值 + 10 次探测 = 15 次</text>

  <!-- 渐进对比 -->
  <rect x="55" y="256" width="410" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11.5" fill="#8a6414" font-weight="bold" filter="url(#rough2)">反直觉：n=10 时线性扫描只要 10 次，反而更少！</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#8a6414" filter="url(#rough2)">二分赢在渐进——n=10^15 时：线性 10^15 次 vs 二分 ≤ 50B 次</text>

  <rect x="90" y="320" width="340" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="260" y="339" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">答案 = 循环轮数；块长为 1 时（第 4 轮前半）探测最少</text>
</svg>
