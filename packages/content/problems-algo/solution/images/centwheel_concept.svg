<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">摩天轮运营：每次轮转登舱 ≤ 4 人，净收益 = 登舱收入 − 运行成本</text>

  <!-- ===== Left: Ferris wheel ===== -->
  <text x="150" y="54" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">4 个座舱 × 每舱 4 人</text>

  <!-- wheel circle -->
  <circle cx="150" cy="170" r="68" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- spokes -->
  <line x1="150" y1="170" x2="150" y2="110" stroke="#88aacc" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="170" x2="210" y2="170" stroke="#88aacc" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="170" x2="150" y2="230" stroke="#88aacc" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="170" x2="90" y2="170" stroke="#88aacc" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- center hub -->
  <circle cx="150" cy="170" r="5" fill="#446688" filter="url(#rough2)"/>

  <!-- top cabin -->
  <rect x="128" y="100" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="119" text-anchor="middle" font-size="10" fill="#333">座舱</text>

  <!-- right cabin -->
  <rect x="208" y="156" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="175" text-anchor="middle" font-size="10" fill="#333">座舱</text>

  <!-- bottom cabin (boarding, highlighted) -->
  <rect x="128" y="212" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="231" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">登舱位</text>

  <!-- left cabin -->
  <rect x="48" y="156" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="175" text-anchor="middle" font-size="10" fill="#333">座舱</text>

  <!-- counterclockwise rotation arrow -->
  <path d="M 200 122 A 60 60 0 0 0 200 218" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="215" y="135" font-size="9" fill="#4a7a3a">逆时针</text>

  <!-- ground line -->
  <line x1="30" y1="252" x2="270" y2="252" stroke="#888" stroke-width="2" filter="url(#rough2)"/>

  <!-- queue of waiting people -->
  <text x="150" y="270" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">等待队列</text>
  <circle cx="110" cy="288" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="124" cy="288" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="138" cy="288" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="152" cy="288" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="166" cy="288" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="180" cy="288" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="194" cy="288" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="215" y="292" font-size="9" fill="#b85450">…</text>

  <!-- arrow from queue up to boarding cabin -->
  <path d="M 150 280 L 150 244" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="162" y="266" font-size="9" fill="#b85450">登 ≤4</text>

  <!-- arrow to right panel -->
  <path d="M 275 170 L 300 170" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right: profit model ===== -->
  <rect x="300" y="52" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">每次轮转</text>
  <text x="420" y="90" text-anchor="middle" font-size="11" fill="#333">登舱 board = min(4, 等待人数)</text>

  <path d="M 420 104 L 420 114" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="116" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">收入</text>
  <text x="420" y="154" text-anchor="middle" font-size="11" fill="#333">+ boardingCost × board</text>

  <rect x="300" y="172" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">成本</text>
  <text x="420" y="207" text-anchor="middle" font-size="11" fill="#333">− runningCost（每轮固定）</text>

  <rect x="300" y="222" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="242" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">本轮净收益</text>
  <text x="420" y="260" text-anchor="middle" font-size="10" fill="#555">boardingCost × board − runningCost</text>

  <!-- ===== Bottom: strategy note ===== -->
  <rect x="40" y="292" width="500" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="313" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">策略：逐轮转模拟，累计净收益，取最大值对应的最小轮次</text>
  <text x="290" y="331" text-anchor="middle" font-size="10" fill="#555">4 × boardingCost ≤ runningCost 时每轮必亏 → 直接返回 −1</text>
</svg>
