<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：边走边查哈希集合，命中即返回</text>

  <!-- 1. 起始（圆角框）-->
  <rect x="120" y="46" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="220" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">初始化 visited={(0,0)}, x=y=0</text>

  <!-- 箭头 1→2 -->
  <path d="M220,88 L220,110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 取下一字符 -->
  <rect x="140" y="112" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取 path 下一字符 c</text>

  <!-- 箭头 2→3 -->
  <path d="M220,148 L220,168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 菱形：遍历结束？ -->
  <polygon points="220,168 280,200 220,232 160,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历</text>
  <text x="220" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">结束?</text>

  <!-- 是 → return false -->
  <path d="M280,200 L340,200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="344" y="184" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="399" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- 否 ↓ -->
  <path d="M220,232 L220,252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="246" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- 4. 按方向更新坐标 -->
  <rect x="120" y="254" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">按 c 更新坐标</text>
  <text x="220" y="287" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">N:y+1  S:y−1  E:x+1  W:x−1</text>

  <!-- 箭头 4→5 -->
  <path d="M220,296 L220,316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 菱形：(x,y) ∈ visited? -->
  <polygon points="220,316 290,350 220,384 150,350" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="346" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(x,y) ∈</text>
  <text x="220" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">visited?</text>

  <!-- 是 → return true -->
  <path d="M290,350 L350,350" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="320" y="344" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="354" y="334" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="14" filter="url(#rough2)"/>
  <text x="414" y="354" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- 否 → add → 回到步骤 2 -->
  <path d="M150,350 L70,350" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="110" y="344" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="14" y="334" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="42" y="354" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">add</text>

  <!-- 回环箭头：add → 取下一字符 -->
  <path d="M42,334 L42,129 L138,129" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="50" y="232" font-size="9" fill="#4a7a3a" filter="url(#rough2)">继续</text>
  <text x="50" y="244" font-size="9" fill="#4a7a3a" filter="url(#rough2)">下一字符</text>
</svg>
