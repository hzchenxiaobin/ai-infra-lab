<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,0,1,0,1],  atMost(2)</text>

  <!-- ===== Panel 0: right=0, left=0, window=[0,0], sum=1, +=1, total=1 ===== -->
  <rect x="12" y="40" width="104" height="290" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="12" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=0</text>
  <!-- cells: cell0=1(in,red), cell1..4 grey -->
  <rect x="19" y="80" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="28" y="95" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="37" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="95" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <rect x="55" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="95" text-anchor="middle" font-size="10" fill="#bbb">1</text>
  <rect x="73" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="82" y="95" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <rect x="91" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="95" text-anchor="middle" font-size="10" fill="#bbb">1</text>
  <text x="64" y="128" text-anchor="middle" font-size="10" fill="#888">sum：</text>
  <text x="64" y="144" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="64" y="168" text-anchor="middle" font-size="10" fill="#888">≤2？</text>
  <text x="64" y="184" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="64" y="210" text-anchor="middle" font-size="9.5" fill="#888">+1</text>
  <rect x="22" y="220" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="64" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=1</text>
  <text x="64" y="268" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1]</text>
  <text x="64" y="282" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- ===== Panel 1: right=1, left=0, window=[0,1], sum=1, +=2, total=3 ===== -->
  <rect x="123" y="40" width="104" height="290" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="123" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="175" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=1</text>
  <rect x="130" y="80" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="139" y="95" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="148" y="80" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="157" y="95" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="166" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="95" text-anchor="middle" font-size="10" fill="#bbb">1</text>
  <rect x="184" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="193" y="95" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <rect x="202" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="211" y="95" text-anchor="middle" font-size="10" fill="#bbb">1</text>
  <text x="175" y="128" text-anchor="middle" font-size="10" fill="#888">sum：</text>
  <text x="175" y="144" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="175" y="168" text-anchor="middle" font-size="10" fill="#888">≤2？</text>
  <text x="175" y="184" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="175" y="210" text-anchor="middle" font-size="9.5" fill="#888">+2</text>
  <rect x="133" y="220" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=3</text>
  <text x="175" y="268" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1,0]</text>
  <text x="175" y="282" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- ===== Panel 2: right=2, left=0, window=[0,2], sum=2, +=3, total=6 ===== -->
  <rect x="234" y="40" width="104" height="290" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="234" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="286" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=2</text>
  <rect x="241" y="80" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="250" y="95" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="259" y="80" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="268" y="95" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="277" y="80" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="286" y="95" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="295" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="304" y="95" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <rect x="313" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="322" y="95" text-anchor="middle" font-size="10" fill="#bbb">1</text>
  <text x="286" y="128" text-anchor="middle" font-size="10" fill="#888">sum：</text>
  <text x="286" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="286" y="168" text-anchor="middle" font-size="10" fill="#888">≤2？</text>
  <text x="286" y="184" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="286" y="210" text-anchor="middle" font-size="9.5" fill="#888">+3</text>
  <rect x="244" y="220" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="286" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=6</text>
  <text x="286" y="268" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1,0,1]</text>
  <text x="286" y="282" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- ===== Panel 3: right=3, left=0, window=[0,3], sum=2, +=4, total=10 ===== -->
  <rect x="345" y="40" width="104" height="290" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="345" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="397" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=3</text>
  <rect x="352" y="80" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="361" y="95" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="370" y="80" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="379" y="95" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="388" y="80" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="397" y="95" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="406" y="80" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="415" y="95" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="424" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="433" y="95" text-anchor="middle" font-size="10" fill="#bbb">1</text>
  <text x="397" y="128" text-anchor="middle" font-size="10" fill="#888">sum：</text>
  <text x="397" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="397" y="168" text-anchor="middle" font-size="10" fill="#888">≤2？</text>
  <text x="397" y="184" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="397" y="210" text-anchor="middle" font-size="9.5" fill="#888">+4</text>
  <rect x="355" y="220" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="397" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=10</text>
  <text x="397" y="268" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1,0,1,0]</text>
  <text x="397" y="282" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- ===== Panel 4: right=4, left=0→1, window=[1,4], sum=3→2, +=4, total=14 (shrink!) ===== -->
  <rect x="456" y="40" width="104" height="290" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="456" y="40" width="104" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="508" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=4 ★</text>
  <!-- cell0=1 (outside, grey), cell1=0(in,green), cell2=1(in,red), cell3=0(in,green), cell4=1(in,red) -->
  <rect x="463" y="80" width="18" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="472" y="95" text-anchor="middle" font-size="10" fill="#bbb">1</text>
  <rect x="481" y="80" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="490" y="95" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="499" y="80" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="508" y="95" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="517" y="80" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="526" y="95" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="535" y="80" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="544" y="95" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="508" y="128" text-anchor="middle" font-size="10" fill="#888">sum：</text>
  <text x="508" y="144" text-anchor="middle" font-size="11" fill="#b85450">3→</text>
  <text x="508" y="160" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="508" y="180" text-anchor="middle" font-size="9" fill="#b85450">缩left!</text>
  <text x="508" y="206" text-anchor="middle" font-size="9.5" fill="#888">+4</text>
  <rect x="466" y="216" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="508" y="235" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">total=14</text>
  <text x="508" y="262" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口[0,1,0,1]</text>
  <text x="508" y="276" text-anchor="middle" font-size="9" fill="#d6a040" font-style="italic">left=0→1</text>

  <!-- Bottom summary -->
  <rect x="12" y="346" width="548" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="286" y="368" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">atMost(2) = 14，同理 atMost(1) = 10</text>
  <text x="286" y="388" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = atMost(2) − atMost(1) = 14 − 10 = 4 ✓</text>
  <text x="286" y="408" text-anchor="middle" font-size="10.5" fill="#888">每次 right 固定后，以 right 结尾的合法子数组有 right−left+1 个</text>
</svg>
