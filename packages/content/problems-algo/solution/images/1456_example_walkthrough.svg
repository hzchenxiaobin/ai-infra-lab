<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "abciiidef"，k = 3 → 最大元音数 = 3</text>
  <text x="320" y="42" text-anchor="middle" font-size="10.5" fill="#888">下标：0:a 1:b 2:c 3:i 4:i 5:i 6:d 7:e 8:f　元音 = a/e/i/o/u</text>

  <!-- ===== String strip with current best window highlighted ===== -->
  <text x="40" y="68" font-size="11" fill="#333" font-weight="bold">字符串（绿色=元音，灰=辅音；红框为最优窗口 [3..5]="iii"）</text>
  <!-- 9 chars, width 48, start x=70 -->
  <rect x="70" y="78" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="94" y="103" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="118" y="78" width="48" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="142" y="103" text-anchor="middle" font-size="15" fill="#777" font-weight="bold">b</text>
  <rect x="166" y="78" width="48" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190" y="103" text-anchor="middle" font-size="15" fill="#777" font-weight="bold">c</text>
  <!-- highlight window [3,5] -->
  <rect x="214" y="78" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="238" y="103" text-anchor="middle" font-size="15" fill="#2a5a1a" font-weight="bold">i</text>
  <rect x="262" y="78" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="286" y="103" text-anchor="middle" font-size="15" fill="#2a5a1a" font-weight="bold">i</text>
  <rect x="310" y="78" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="334" y="103" text-anchor="middle" font-size="15" fill="#2a5a1a" font-weight="bold">i</text>
  <rect x="358" y="78" width="48" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="382" y="103" text-anchor="middle" font-size="15" fill="#777" font-weight="bold">d</text>
  <rect x="406" y="78" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="103" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <rect x="454" y="78" width="48" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="478" y="103" text-anchor="middle" font-size="15" fill="#777" font-weight="bold">f</text>

  <!-- ===== Step table ===== -->
  <text x="40" y="138" font-size="11" fill="#333" font-weight="bold">逐步执行（首窗初始化 + 6 次右移）</text>

  <!-- Table header -->
  <!-- columns: step(60) | 窗口(70) | 子串(70) | 入s[right](80) | 出s[right-k](86) | count(60) | maxV(60) -->
  <!-- x starts: 50, 110, 180, 250, 330, 416, 476 ; widths below -->
  <rect x="50" y="146" width="60" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="162" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤</text>
  <rect x="110" y="146" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="145" y="162" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">窗口</text>
  <rect x="180" y="146" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="215" y="162" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">子串</text>
  <rect x="250" y="146" width="80" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="162" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">入 s[right]</text>
  <rect x="330" y="146" width="86" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="373" y="162" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">出 s[right−k]</text>
  <rect x="416" y="146" width="60" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="446" y="162" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">count</text>
  <rect x="476" y="146" width="64" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="508" y="162" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">maxV</text>

  <!-- Row 0: init [0,2]="abc", count=1, maxV=1 -->
  <rect x="50" y="170" width="60" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="187" text-anchor="middle" font-size="10" fill="#333">初始化</text>
  <rect x="110" y="170" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="187" text-anchor="middle" font-size="10" fill="#333">[0, 2]</text>
  <rect x="180" y="170" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="215" y="187" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">abc</text>
  <rect x="250" y="170" width="80" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="187" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <rect x="330" y="170" width="86" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="373" y="187" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <rect x="416" y="170" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="446" y="187" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <rect x="476" y="170" width="64" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="508" y="187" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>

  <!-- Row 1: right=3, [1,3]="bci", in=i(+1), out=a(-1), count=1, maxV=1 -->
  <rect x="50" y="196" width="60" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="213" text-anchor="middle" font-size="10" fill="#333">right=3</text>
  <rect x="110" y="196" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="213" text-anchor="middle" font-size="10" fill="#333">[1, 3]</text>
  <rect x="180" y="196" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="215" y="213" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">bci</text>
  <rect x="250" y="196" width="80" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="213" text-anchor="middle" font-size="9.5" fill="#2a5a1a" font-weight="bold">i ✓ +1</text>
  <rect x="330" y="196" width="86" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="373" y="213" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">a ✓ −1</text>
  <rect x="416" y="196" width="60" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="446" y="213" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <rect x="476" y="196" width="64" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="508" y="213" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>

  <!-- Row 2: right=4, [2,4]="cii", in=i(+1), out=b(—), count=2, maxV=2 -->
  <rect x="50" y="222" width="60" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="239" text-anchor="middle" font-size="10" fill="#333">right=4</text>
  <rect x="110" y="222" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="239" text-anchor="middle" font-size="10" fill="#333">[2, 4]</text>
  <rect x="180" y="222" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="215" y="239" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">cii</text>
  <rect x="250" y="222" width="80" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="239" text-anchor="middle" font-size="9.5" fill="#2a5a1a" font-weight="bold">i ✓ +1</text>
  <rect x="330" y="222" width="86" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="373" y="239" text-anchor="middle" font-size="9.5" fill="#888">b ✗ 0</text>
  <rect x="416" y="222" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="446" y="239" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <rect x="476" y="222" width="64" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="508" y="239" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>

  <!-- Row 3: right=5, [3,5]="iii", in=i(+1), out=c(—), count=3, maxV=3  HIGHLIGHT -->
  <rect x="50" y="248" width="60" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="265" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">right=5</text>
  <rect x="110" y="248" width="70" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="145" y="265" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[3, 5]</text>
  <rect x="180" y="248" width="70" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="215" y="265" text-anchor="middle" font-size="10" fill="#2a5a1a" font-weight="bold">iii ★</text>
  <rect x="250" y="248" width="80" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="265" text-anchor="middle" font-size="9.5" fill="#2a5a1a" font-weight="bold">i ✓ +1</text>
  <rect x="330" y="248" width="86" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="373" y="265" text-anchor="middle" font-size="9.5" fill="#888">c ✗ 0</text>
  <rect x="416" y="248" width="60" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="446" y="265" text-anchor="middle" font-size="10.5" fill="#2a5a1a" font-weight="bold">3</text>
  <rect x="476" y="248" width="64" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="508" y="265" text-anchor="middle" font-size="10.5" fill="#2a5a1a" font-weight="bold">3</text>

  <!-- Row 4: right=6, [4,6]="iid", in=d(—), out=i(-1), count=2, maxV=3 -->
  <rect x="50" y="274" width="60" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="291" text-anchor="middle" font-size="10" fill="#333">right=6</text>
  <rect x="110" y="274" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="291" text-anchor="middle" font-size="10" fill="#333">[4, 6]</text>
  <rect x="180" y="274" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="215" y="291" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">iid</text>
  <rect x="250" y="274" width="80" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="291" text-anchor="middle" font-size="9.5" fill="#888">d ✗ 0</text>
  <rect x="330" y="274" width="86" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="373" y="291" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">i ✓ −1</text>
  <rect x="416" y="274" width="60" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="446" y="291" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <rect x="476" y="274" width="64" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="508" y="291" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>

  <!-- Row 5: right=7, [5,7]="ide", in=e(+1), out=i(-1), count=2, maxV=3 -->
  <rect x="50" y="300" width="60" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="317" text-anchor="middle" font-size="10" fill="#333">right=7</text>
  <rect x="110" y="300" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="317" text-anchor="middle" font-size="10" fill="#333">[5, 7]</text>
  <rect x="180" y="300" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="215" y="317" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ide</text>
  <rect x="250" y="300" width="80" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="317" text-anchor="middle" font-size="9.5" fill="#2a5a1a" font-weight="bold">e ✓ +1</text>
  <rect x="330" y="300" width="86" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="373" y="317" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">i ✓ −1</text>
  <rect x="416" y="300" width="60" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="446" y="317" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <rect x="476" y="300" width="64" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="508" y="317" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>

  <!-- Row 6: right=8, [6,8]="def", in=f(—), out=i(-1), count=1, maxV=3 -->
  <rect x="50" y="326" width="60" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="343" text-anchor="middle" font-size="10" fill="#333">right=8</text>
  <rect x="110" y="326" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="343" text-anchor="middle" font-size="10" fill="#333">[6, 8]</text>
  <rect x="180" y="326" width="70" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="215" y="343" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">def</text>
  <rect x="250" y="326" width="80" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="343" text-anchor="middle" font-size="9.5" fill="#888">f ✗ 0</text>
  <rect x="330" y="326" width="86" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="373" y="343" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">i ✓ −1</text>
  <rect x="416" y="326" width="60" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="446" y="343" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <rect x="476" y="326" width="64" height="26" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="508" y="343" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>

  <!-- Result line -->
  <path d="M 50 362 L 540 362" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="5,5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="384" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最优窗口 [3..5] = "iii"，元音数 = 3 ⟹ 返回 3</text>

  <!-- legend -->
  <rect x="50" y="404" width="540" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="64" y="424" font-size="10.5" fill="#555" font-weight="bold">图例</text>
  <rect x="110" y="414" width="16" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="425" font-size="10" fill="#333">元音 ✓（+1）</text>
  <rect x="230" y="414" width="16" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="252" y="425" font-size="10" fill="#333">元音出窗 ✓（−1）</text>
  <rect x="370" y="414" width="16" height="14" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="425" font-size="10" fill="#333">辅音 ✗（不变）</text>
  <rect x="470" y="414" width="16" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="492" y="425" font-size="10" fill="#333">最优行 ★</text>
  <text x="64" y="450" font-size="10.5" fill="#888">每步「入端 +1 / 出端 −1」增量更新，无需重扫窗口 → 全程 O(n)</text>
</svg>
