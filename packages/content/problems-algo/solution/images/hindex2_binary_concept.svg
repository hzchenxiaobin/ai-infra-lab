<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">升序数组：citations[i] ↑ 与 n−i ↓ 相交处定 h</text>

  <!-- top-left note -->
  <text x="56" y="56" font-size="11" fill="#888">citations = [0,1,3,5,6]  (n=5)</text>
  <text x="56" y="72" font-size="11" fill="#888">已升序，无需排序</text>

  <!-- baseline -->
  <path d="M 50 300 L 500 300" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- n-i descending line: points (108,220)(188,236)(268,252)(348,268)(428,284) -->
  <path d="M 108 220 L 188 236 L 268 252 L 348 268 L 428 284"
        stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7 4" fill="none" filter="url(#rough2)"/>
  <text x="478" y="284" font-size="11" fill="#d6a040" font-weight="bold">n−i ↓</text>

  <!-- bars: 16px per unit, baseline 300, width 56, centers 108/188/268/348/428 -->
  <!-- bar 0: value 0 (条件不满足) -->
  <rect x="80" y="296" width="56" height="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="108" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="108" y="320" text-anchor="middle" font-size="10.5" fill="#888">i=0</text>

  <!-- bar 1: value 1 (条件不满足) -->
  <rect x="160" y="284" width="56" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="188" y="278" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="188" y="320" text-anchor="middle" font-size="10.5" fill="#888">i=1</text>

  <!-- bar 2: value 3 (首个成立 = 答案) -->
  <rect x="240" y="252" width="56" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="268" y="244" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="268" y="320" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">i=2 ✓</text>

  <!-- bar 3: value 5 (成立但 h 更小) -->
  <rect x="320" y="220" width="56" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="348" y="212" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="348" y="320" text-anchor="middle" font-size="10.5" fill="#888">i=3</text>

  <!-- bar 4: value 6 (成立但 h 更小) -->
  <rect x="400" y="204" width="56" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="428" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
  <text x="428" y="320" text-anchor="middle" font-size="10.5" fill="#888">i=4</text>

  <!-- crossing marker at (268,252) -->
  <circle cx="268" cy="252" r="5" fill="#d6a040" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 268 252 L 268 160" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- answer box -->
  <rect x="200" y="132" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="275" y="154" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">h = n − i = 5 − 2 = 3</text>

  <!-- left region label: 条件假 -->
  <rect x="60" y="336" width="170" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="145" y="356" text-anchor="middle" font-size="10.5" fill="#b85450">citations[i] &lt; n−i  条件假</text>

  <!-- right region label: 条件真 -->
  <rect x="320" y="336" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="356" text-anchor="middle" font-size="10.5" fill="#446688">citations[i] ≥ n−i  条件真</text>

  <!-- arrow between regions -->
  <path d="M 232 351 L 318 351" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="344" text-anchor="middle" font-size="10" fill="#d6a040">单调切换</text>
</svg>
