<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="840" height="560" fill="#fdfcf7"/>

  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">put / get / remove 算法流程</text>
  <path d="M 270 42 Q 420 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== put column ===== -->
  <text x="150" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">put(key, value)</text>
  <!-- start -->
  <g filter="url(#sk)"><rect x="70" y="86" width="160" height="34" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="150" y="108" text-anchor="middle" font-size="12" fill="#2e6e2e">开始 put</text>
  <path d="M 150 120 L 150 140" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- hash -->
  <g filter="url(#sk)"><rect x="70" y="142" width="160" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="150" y="164" text-anchor="middle" font-size="11" fill="#444">b = key mod BASE</text>
  <path d="M 150 176 L 150 196" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- scan -->
  <g filter="url(#sk)"><rect x="70" y="198" width="160" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="150" y="220" text-anchor="middle" font-size="11" fill="#444">扫描 buckets[b] 找 key</text>
  <path d="M 150 232 L 150 250" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- decision -->
  <g filter="url(#sk)"><path d="M 150 256 L 230 286 L 150 316 L 70 286 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="150" y="290" text-anchor="middle" font-size="11" fill="#7a5415">找到 key?</text>
  <!-- yes -->
  <path d="M 70 286 L 30 286 L 30 336" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="38" y="280" font-size="10" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="0" y="340" width="60" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="30" y="358" text-anchor="middle" font-size="10" fill="#2e6e2e">更新</text>
  <text x="30" y="372" text-anchor="middle" font-size="10" fill="#2e6e2e">value</text>
  <!-- no -->
  <path d="M 230 286 L 270 286 L 270 336" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="244" y="280" font-size="10" fill="#b85450">否</text>
  <g filter="url(#sk)"><rect x="240" y="340" width="60" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="270" y="358" text-anchor="middle" font-size="10" fill="#2e6e2e">尾插</text>
  <text x="270" y="372" text-anchor="middle" font-size="10" fill="#2e6e2e">(key,val)</text>
  <path d="M 30 380 L 30 402 L 150 402" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 270 380 L 270 402 L 150 402" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="70" y="406" width="160" height="32" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="150" y="426" text-anchor="middle" font-size="11" fill="#2e6e2e">返回</text>

  <!-- ===== get column ===== -->
  <text x="420" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">get(key)</text>
  <g filter="url(#sk)"><rect x="340" y="86" width="160" height="34" rx="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="420" y="108" text-anchor="middle" font-size="12" fill="#2b6e9e">开始 get</text>
  <path d="M 420 120 L 420 140" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="340" y="142" width="160" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="420" y="164" text-anchor="middle" font-size="11" fill="#444">b = key mod BASE</text>
  <path d="M 420 176 L 420 196" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="340" y="198" width="160" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="420" y="220" text-anchor="middle" font-size="11" fill="#444">扫描 buckets[b] 找 key</text>
  <path d="M 420 232 L 420 250" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><path d="M 420 256 L 500 286 L 420 316 L 340 286 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="420" y="290" text-anchor="middle" font-size="11" fill="#7a5415">找到 key?</text>
  <path d="M 340 286 L 300 286 L 300 336" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="308" y="280" font-size="10" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="270" y="340" width="60" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="300" y="362" text-anchor="middle" font-size="10" fill="#2e6e2e">返回 value</text>
  <path d="M 500 286 L 540 286 L 540 336" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="514" y="280" font-size="10" fill="#b85450">否</text>
  <g filter="url(#sk)"><rect x="510" y="340" width="60" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="540" y="362" text-anchor="middle" font-size="10" fill="#b85450">返回 -1</text>

  <!-- ===== remove column ===== -->
  <text x="690" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">remove(key)</text>
  <g filter="url(#sk)"><rect x="610" y="86" width="160" height="34" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="690" y="108" text-anchor="middle" font-size="12" fill="#b85450">开始 remove</text>
  <path d="M 690 120 L 690 140" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="610" y="142" width="160" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="690" y="164" text-anchor="middle" font-size="11" fill="#444">b = key mod BASE</text>
  <path d="M 690 176 L 690 196" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="610" y="198" width="160" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="690" y="220" text-anchor="middle" font-size="11" fill="#444">扫描 buckets[b] 找 key</text>
  <path d="M 690 232 L 690 250" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><path d="M 690 256 L 770 286 L 690 316 L 610 286 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="690" y="290" text-anchor="middle" font-size="11" fill="#7a5415">找到 key?</text>
  <path d="M 610 286 L 570 286 L 570 336" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="578" y="280" font-size="10" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="540" y="340" width="60" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="570" y="362" text-anchor="middle" font-size="10" fill="#b85450">删除该节点</text>
  <path d="M 770 286 L 810 286 L 810 336" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="784" y="280" font-size="10" fill="#888">否</text>
  <g filter="url(#sk)"><rect x="780" y="340" width="54" height="34" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="807" y="362" text-anchor="middle" font-size="10" fill="#888">什么都不做</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="470" width="760" height="70" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="494" font-size="12" font-weight="bold" fill="#444">三步走：① h(key) 定桶  →  ② 桶内扫描 key  →  ③ 命中改/删，未命中插(put)</text>
  <text x="60" y="516" font-size="11" fill="#888">单桶链表长度受负载因子控制；BASE 取质数、链表/数组实现均可。命中即提前返回，省去后续扫描。</text>
</svg>
