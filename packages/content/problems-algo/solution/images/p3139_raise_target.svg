<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">抬升终值 T：稀释最大缺口，解锁批发配对</text>
  <text x="260" y="41" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums = [1,3,3,3,3]，c₁ = 100，c₂ = 1（n = 5，mx = 3，mn = 1，枚举上界 2mx − mn = 5）</text>

  <!-- 面板 1：T=3 -->
  <rect x="24" y="52" width="148" height="196" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="98" y="70" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">T = 3（= mx）</text>
  <rect x="36" y="122" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="36" y="100" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="60" y="122" width="18" height="22" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="2" filter="url(#rough2)"/>
  <rect x="84" y="122" width="18" height="22" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="2" filter="url(#rough2)"/>
  <rect x="108" y="122" width="18" height="22" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="2" filter="url(#rough2)"/>
  <rect x="132" y="122" width="18" height="22" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="2" filter="url(#rough2)"/>
  <line x1="30" y1="144" x2="158" y2="144" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="98" y="160" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">S=2, d=2, S−d=0</text>
  <text x="98" y="176" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">p = min(1, 0) = 0</text>
  <text x="98" y="192" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">一次批发都配不了！</text>
  <text x="98" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">C = 2×100 = 200</text>
  <text x="98" y="230" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">瓶颈 = S−d = 0</text>

  <!-- 面板 2：T=4 -->
  <rect x="186" y="52" width="148" height="196" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">T = 4</text>
  <rect x="198" y="122" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="198" y="100" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="198" y="78" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="222" y="122" width="18" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="246" y="122" width="18" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="270" y="122" width="18" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="294" y="122" width="18" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <line x1="192" y1="144" x2="320" y2="144" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">S=7, d=3, S−d=4</text>
  <text x="260" y="176" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">p = min(3, 4) = 3</text>
  <text x="260" y="192" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">批发 3 次 + 零售 1 格</text>
  <text x="260" y="212" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">C = 3 + 100 = 103</text>
  <text x="260" y="230" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">瓶颈 = d（还没切换）</text>

  <!-- 面板 3：T=5 -->
  <rect x="348" y="52" width="148" height="196" fill="#f7fcf5" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="422" y="70" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T = 5（= 上界）</text>
  <rect x="360" y="122" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="360" y="100" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="360" y="78" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="360" y="56" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="384" y="122" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="384" y="100" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="408" y="122" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="408" y="100" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="432" y="122" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="432" y="100" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="456" y="122" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="456" y="100" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <line x1="354" y1="144" x2="482" y2="144" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="422" y="160" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">S=12, d=4, S−d=8</text>
  <text x="422" y="176" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">p = min(6, 8) = 6</text>
  <text x="422" y="192" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">12 格全部批发，零零售！</text>
  <text x="422" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C = 6 ← 最优</text>
  <text x="422" y="230" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">瓶颈切到 ⌊S/2⌋</text>

  <!-- 底部：稀释公式 + V 形曲线 -->
  <rect x="30" y="266" width="252" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="286" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">每抬 1 格：S += n = 5，d += 1</text>
  <text x="156" y="303" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">S − d += n − 1 = 4：其余缺口 4 倍速追赶</text>
  <text x="156" y="320" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">最大缺口的「独占」被稀释 → 批发解禁</text>

  <text x="392" y="280" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">开销 C(T)：V 形（抬过头又变贵）</text>
  <polyline points="316,292 352,306 388,338 424,302 460,334" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="316" cy="292" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="352" cy="306" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="388" cy="338" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="424" cy="302" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="460" cy="334" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="310" y="288" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">200</text>
  <text x="352" y="298" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">103</text>
  <text x="388" y="352" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="428" y="296" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">108</text>
  <text x="460" y="330" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">11</text>
  <text x="316" y="306" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">T=3</text>
  <text x="352" y="320" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="388" y="344" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="424" y="316" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="460" y="348" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">7</text>
</svg>
