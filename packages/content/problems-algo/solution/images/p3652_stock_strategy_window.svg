<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：总利润 = base − old + cur</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">一次修改只改写窗口内的策略，窗外贡献不变</text>

  <text x="70" y="76" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">策略 s</text>
  <text x="70" y="112" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">价格 p</text>

  <rect x="78" y="56" width="42" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="56" width="42" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="56" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="56" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="262" y="56" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="308" y="56" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="354" y="56" width="42" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="56" width="42" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <text x="99" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="145" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="191" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="237" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="283" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="329" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="375" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="421" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="78" y="92" width="42" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="92" width="42" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="92" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="92" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="262" y="92" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="308" y="92" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="354" y="92" width="42" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="92" width="42" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <text x="99" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="145" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="191" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="237" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="283" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="329" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="375" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="421" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <rect x="164" y="50" width="192" height="80" fill="none" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>

  <path d="M 214 134 L 214 142" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 306 134 L 306 142" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="214" y="154" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">→ 全改 0（持有）</text>
  <text x="306" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 全改 1（卖出）</text>
  <text x="415" y="148" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">k = 4</text>

  <rect x="45" y="160" width="430" height="50" fill="#ffffff" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">总利润 = base − old + cur（窗外贡献恒等于 base）</text>
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">old = 窗口内 Σ s·p     cur = 窗口后一半 Σ p（与原策略无关！）</text>

  <path d="M 147 210 L 147 224" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 372 210 L 372 224" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="40" y="226" width="215" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="248" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">A[i] = Σ s·p 前缀和</text>
  <text x="147" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">old = A[l+k] − A[l]</text>
  <text x="147" y="286" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">一次查询 O(1)</text>

  <rect x="265" y="226" width="215" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="372" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B[i] = Σ p 前缀和</text>
  <text x="372" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cur = B[l+k] − B[l+k/2]</text>
  <text x="372" y="286" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">一次查询 O(1)</text>

  <rect x="55" y="308" width="410" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举全部 n−k+1 个窗口取最大，再与 base 比较</text>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">「最多一次」修改 ⇒ 不改也是候选 ✓</text>
</svg>
