<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 1 → 5，外观数列的迭代生成</text>

  <!-- Table header -->
  <text x="40" y="58" font-size="12" fill="#444" font-weight="bold">n</text>
  <text x="100" y="58" font-size="12" fill="#444" font-weight="bold">上一项</text>
  <text x="300" y="58" font-size="12" fill="#444" font-weight="bold">分组读法</text>
  <text x="490" y="58" font-size="12" fill="#444" font-weight="bold">下一项</text>

  <line x1="30" y1="64" x2="560" y2="64" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row n=1 (base case) -->
  <text x="40" y="90" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="100" y="90" font-size="11" fill="#888">(基准)</text>
  <text x="300" y="90" font-size="11" fill="#888">— 初始值 —</text>
  <rect x="470" y="76" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Row n=2: "1" -> 1个1 -> "11" -->
  <text x="40" y="130" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="116" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="300" y="130" font-size="11" fill="#446688">1 个 '1'</text>
  <rect x="470" y="116" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">11</text>

  <!-- Row n=3: "11" -> 2个1 -> "21" -->
  <text x="40" y="170" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="100" y="156" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">11</text>
  <text x="300" y="170" font-size="11" fill="#4a7a3a">2 个 '1'</text>
  <rect x="470" y="156" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">21</text>

  <!-- Row n=4: "21" -> 1个2,1个1 -> "1211" -->
  <text x="40" y="210" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="196" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">21</text>
  <text x="300" y="210" font-size="11" fill="#d6a040">1 个 '2' + 1 个 '1'</text>
  <rect x="450" y="196" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1211</text>

  <!-- Row n=5: "1211" -> 1个1,1个2,2个1 -> "111221" -->
  <text x="40" y="250" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="100" y="236" width="100" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1211</text>
  <text x="300" y="250" font-size="11" fill="#b85450">1 个 '1' + 1 个 '2' + 2 个 '1'</text>
  <rect x="440" y="236" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="500" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">111221</text>

  <!-- Group coloring for n=5 row (show runs of 1211) -->
  <text x="40" y="292" font-size="11" fill="#888">n=5 分组:</text>
  <rect x="100" y="278" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="135" y="293" font-size="10" fill="#446688">×1</text>

  <rect x="158" y="278" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="193" y="293" font-size="10" fill="#4a7a3a">×1</text>

  <rect x="216" y="278" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="255" y="293" font-size="10" fill="#d6a040">×2</text>

  <text x="285" y="293" font-size="11" fill="#888">→</text>
  <text x="305" y="293" font-size="12" fill="#333" font-weight="bold">11</text>
  <text x="335" y="293" font-size="12" fill="#333" font-weight="bold">12</text>
  <text x="365" y="293" font-size="12" fill="#333" font-weight="bold">21</text>
  <text x="400" y="293" font-size="11" fill="#888">拼接 =</text>
  <text x="450" y="293" font-size="13" fill="#b85450" font-weight="bold">111221</text>

  <!-- Result box -->
  <rect x="60" y="320" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="342" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">输入 n = 4 → 输出 "1211"</text>
  <text x="290" y="362" text-anchor="middle" font-size="11" fill="#888">每步只依赖上一步结果，迭代 n−1 轮即可</text>

  <!-- Complexity note -->
  <rect x="60" y="392" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="410" text-anchor="middle" font-size="11" fill="#444">规模增长近似康威常数 λ ≈ 1.3035，长度每轮约 ×1.3</text>
  <text x="290" y="426" text-anchor="middle" font-size="11" fill="#888">n ≤ 30 时字符串最长约 4600，暴力迭代完全可行</text>

  <!-- legend -->
  <rect x="60" y="448" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="78" y="457" font-size="10" fill="#555">第1组</text>
  <rect x="130" y="448" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="148" y="457" font-size="10" fill="#555">第2组</text>
  <rect x="200" y="448" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="218" y="457" font-size="10" fill="#555">第3组</text>
</svg>
