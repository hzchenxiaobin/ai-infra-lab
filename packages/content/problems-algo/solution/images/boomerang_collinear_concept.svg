<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">共线（退化） vs 非共线（有效回旋镖）：叉积一锤定音</text>

  <!-- ===== 左：共线（无效） ===== -->
  <text x="140" y="58" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">三点共线 → false</text>

  <!-- 经过三点的直线 -->
  <line x1="40" y1="310" x2="240" y2="110" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- 三个点（在直线上） -->
  <circle cx="60" cy="290" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="140" cy="210" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="220" cy="130" r="6" fill="#b85450" filter="url(#rough2)"/>

  <!-- 点标签 -->
  <text x="34" y="306" font-size="12" fill="#333" filter="url(#rough2)">P₁</text>
  <text x="126" y="204" font-size="12" fill="#333" filter="url(#rough2)">P₂</text>
  <text x="228" y="124" font-size="12" fill="#333" filter="url(#rough2)">P₃</text>

  <!-- 向量 P1->P2（橙虚线）与 P1->P3（蓝实线），共线时重合 -->
  <path d="M 66 286 L 132 214" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 63 289 L 213 133" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 叉积结果 -->
  <rect x="96" y="324" width="88" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="342" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">叉积 = 0</text>

  <!-- 分隔虚线 -->
  <path d="M 290 50 L 290 360" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,5" filter="url(#rough2)"/>

  <!-- ===== 右：非共线（有效） ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">三点不共线 → true</text>

  <!-- 三角形 -->
  <polygon points="350,290 510,290 430,130" fill="#e6f4ea" fill-opacity="0.65" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- 三个点 -->
  <circle cx="350" cy="290" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="510" cy="290" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="430" cy="130" r="6" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- 点标签 -->
  <text x="332" y="306" font-size="12" fill="#333" filter="url(#rough2)">P₁</text>
  <text x="516" y="306" font-size="12" fill="#333" filter="url(#rough2)">P₂</text>
  <text x="422" y="122" font-size="12" fill="#333" filter="url(#rough2)">P₃</text>

  <!-- 向量 P1->P2（橙虚线）与 P1->P3（蓝实线），不共线时不重合 -->
  <path d="M 356 288 L 502 288" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 352 286 L 426 136" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 叉积结果 -->
  <rect x="386" y="324" width="88" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="342" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">叉积 ≠ 0</text>

  <!-- 底部公式 -->
  <rect x="24" y="362" width="532" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="383" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#rough2)">cross = (x₂−x₁)(y₃−y₁) − (x₃−x₁)(y₂−y₁)　＝0 ⇔ 共线(含重合)，≠0 ⇔ 有效回旋镖</text>
</svg>
