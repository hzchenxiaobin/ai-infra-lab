<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：cur 逐层 ×2+val，叶子处累加</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">例1　root = [1,0,1,0,1,0,1]</text>

  <!-- root 1, cur=1 -->
  <circle cx="290" cy="76" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="290" y="81" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="316" y="64" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="79" text-anchor="middle" font-size="10" fill="#333">cur=1</text>

  <!-- node 0, cur=2 -->
  <circle cx="180" cy="132" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="137" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="206" y="120" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="135" text-anchor="middle" font-size="10" fill="#333">cur=2</text>

  <!-- node 1, cur=3 -->
  <circle cx="400" cy="132" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="137" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="426" y="120" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="135" text-anchor="middle" font-size="10" fill="#333">cur=3</text>

  <path d="M 276 90 L 196 114" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 304 90 L 384 114" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- leaf 0, cur=4 -->
  <circle cx="110" cy="196" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.8" filter="url(#rough2)"/>
  <text x="110" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="136" y="184" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="199" text-anchor="middle" font-size="10" fill="#333">cur=4</text>
  <rect x="136" y="210" width="48" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="224" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">叶 → 4</text>

  <!-- leaf 1, cur=5 -->
  <circle cx="250" cy="196" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="250" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="276" y="184" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="300" y="199" text-anchor="middle" font-size="10" fill="#333">cur=5</text>
  <rect x="276" y="210" width="48" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="224" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">叶 → 5</text>

  <!-- leaf 0, cur=6 -->
  <circle cx="330" cy="196" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="330" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="356" y="184" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="380" y="199" text-anchor="middle" font-size="10" fill="#333">cur=6</text>
  <rect x="356" y="210" width="48" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="224" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">叶 → 6</text>

  <!-- leaf 1, cur=7 -->
  <circle cx="470" cy="196" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.8" filter="url(#rough2)"/>
  <text x="470" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="496" y="184" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="520" y="199" text-anchor="middle" font-size="10" fill="#333">cur=7</text>
  <rect x="496" y="210" width="48" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="520" y="224" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">叶 → 7</text>

  <path d="M 167 148 L 125 178" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 193 148 L 237 178" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 387 148 L 345 178" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 413 148 L 457 178" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- sum row -->
  <path d="M 30 270 L 570 270" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>
  <text x="300" y="292" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">叶子累加</text>

  <rect x="40" y="306" width="120" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="324" text-anchor="middle" font-size="10" fill="#333">1 → 0 → 0</text>
  <text x="100" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">100(2) = 4</text>

  <rect x="180" y="306" width="120" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="324" text-anchor="middle" font-size="10" fill="#333">1 → 0 → 1</text>
  <text x="240" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">101(2) = 5</text>

  <rect x="320" y="306" width="120" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="380" y="324" text-anchor="middle" font-size="10" fill="#333">1 → 1 → 0</text>
  <text x="380" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">110(2) = 6</text>

  <rect x="460" y="306" width="120" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="520" y="324" text-anchor="middle" font-size="10" fill="#333">1 → 1 → 1</text>
  <text x="520" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">111(2) = 7</text>

  <!-- total -->
  <rect x="160" y="372" width="280" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="396" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">4 + 5 + 6 + 7 = 22</text>
</svg>
