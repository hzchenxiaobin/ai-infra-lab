<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：切分 → 预处理 fact/invFact → 逐词连乘</text>

  <!-- 步骤 1 -->
  <rect x="180" y="44" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 切分</text>
  <text x="280" y="78" text-anchor="middle" font-size="10.5" fill="#333">按空格切 s → words，N = |s|</text>
  <path d="M 280 88 L 280 104" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="120" y="106" width="320" height="42" fill="#f6fff7" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 预处理阶乘表 fact[0..N]</text>
  <text x="280" y="140" text-anchor="middle" font-size="10.5" fill="#333">fact[0]=1；fact[i] = fact[i−1] · i mod p</text>
  <path d="M 280 150 L 280 166" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="90" y="168" width="380" height="54" fill="#f6fff7" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 预处理逆阶乘表 invFact[0..N]</text>
  <text x="280" y="202" text-anchor="middle" font-size="10.5" fill="#333">invFact[N] = fact[N]^(p−2)  （费马小定理，一次快速幂）</text>
  <text x="280" y="216" text-anchor="middle" font-size="10.5" fill="#333">invFact[i−1] = invFact[i] · i mod p  （线性回推 O(N)）</text>
  <path d="M 280 224 L 280 240" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4：循环 -->
  <rect x="60" y="242" width="440" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">④ 对每个 word 循环</text>
  <text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#333">统计频次 cnt[c]：遍历 word 字符</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#333">term = fact[L] · ∏ invFact[cnt[c]]  mod p</text>
  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#333">ans = ans · term mod p</text>
  <!-- 循环回边 -->
  <path d="M 500 290 Q 540 290 540 360 Q 540 388 500 388" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="546" y="338" text-anchor="middle" font-size="9.5" fill="#888" transform="rotate(90 546 338)">下一词</text>

  <path d="M 280 340 L 280 360" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="200" y="362" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="385" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return ans</text>
</svg>
