<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2732p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2732r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">归约证明：若存在好子集（大小 k≥3），则可化到大小 ≤ 2</text>

  <!-- ===== left panel: odd k reduction ===== -->
  <rect x="24" y="48" width="252" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① k 为奇数 k=2t+1</text>

  <!-- S box -->
  <rect x="44" y="86" width="80" height="46" fill="#fff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="84" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S</text>
  <text x="84" y="124" text-anchor="middle" font-size="10" fill="#888">大小 2t+1</text>
  <text x="84" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a">每列 ≤ t</text>

  <!-- arrow: remove a row -->
  <path d="M128,109 L172,109" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2732p)" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="9" fill="#888">删任意一行</text>

  <!-- S' box -->
  <rect x="178" y="86" width="80" height="46" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="218" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">S'</text>
  <text x="218" y="124" text-anchor="middle" font-size="10" fill="#888">大小 2t</text>
  <text x="218" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a">每列 ≤ t = floor(2t/2)</text>

  <text x="150" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">删行后列和只减不增</text>
  <text x="150" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">floor(2t/2)=t ≥ 原上界 t</text>
  <text x="150" y="204" text-anchor="middle" font-size="10" fill="#888">⇒ S' 仍是好子集，递归到偶数</text>

  <!-- ===== right panel: even k contradiction ===== -->
  <rect x="296" y="48" width="264" height="240" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="428" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② k 为偶数 k=2t（t≥2）</text>

  <text x="428" y="92" text-anchor="middle" font-size="10" fill="#888">反证：无全零行 &amp; 无 AND=0 对</text>

  <!-- vertex clique cover diagram -->
  <text x="316" y="118" font-size="10" fill="#555" font-weight="bold">每列是一组行上的「团」</text>

  <!-- 4 vertices representing rows -->
  <circle cx="346" cy="148" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="346" y="152" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">v</text>
  <circle cx="388" cy="148" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="388" y="152" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">v</text>
  <circle cx="430" cy="148" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="152" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">v</text>
  <circle cx="472" cy="148" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="472" y="152" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">v</text>

  <!-- edges (pairs) that must be covered -->
  <line x1="358" y1="148" x2="376" y2="148" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="400" y1="148" x2="418" y2="148" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="442" y1="148" x2="460" y2="148" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="428" y="170" text-anchor="middle" font-size="9" fill="#b85450">每对行须共享某列</text>

  <!-- degree argument -->
  <rect x="310" y="182" width="240" height="92" fill="#fff" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="200" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">点度论证（n≤5 列）</text>
  <text x="318" y="218" font-size="10" fill="#555">· 每行需覆盖 2t−1 个配对</text>
  <text x="318" y="234" font-size="10" fill="#555">· 2 列最多盖 2(t−1)=2t−2 &lt; 2t−1</text>
  <text x="318" y="250" font-size="10" fill="#b85450" font-weight="bold">  ⇒ 每行至少在 3 列中出现</text>
  <text x="318" y="266" font-size="10" fill="#555">· 总关联 ≥ 2t×3 = 6t</text>

  <!-- contradiction -->
  <text x="428" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">但 n≤5 列 × 每列 ≤t ⇒ 总关联 ≤ 5t</text>
  <text x="428" y="312" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6t ≤ 5t  ✗ 矛盾！</text>

  <!-- bottom conclusion -->
  <rect x="60" y="306" width="240" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="180" y="332" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结论</text>
  <text x="76" y="354" font-size="11" fill="#555">奇数 k → 删行化为偶数</text>
  <text x="76" y="372" font-size="11" fill="#555">偶数 k → 反证推出矛盾</text>
  <text x="76" y="392" font-size="11" fill="#555">⇒ 好子集存在时</text>
  <text x="76" y="408" font-size="11" fill="#4a7a3a" font-weight="bold">  必有大小 1 或 2 的好子集</text>

  <!-- arrow from even panel to conclusion -->
  <path d="M296,340 L304,360" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2732p)" filter="url(#rough2)"/>
</svg>
