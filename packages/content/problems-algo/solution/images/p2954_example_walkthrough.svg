<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 456" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="456" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：两个示例直接套公式</text>

  <!-- example 1 -->
  <rect x="26" y="40" width="468" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="62" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例 1：n = 5，sick = [0,4] → 输出 4</text>

  <rect x="42" y="72" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="59" y="92" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">病</text>
  <rect x="80" y="72" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="97" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="118" y="72" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="135" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="156" y="72" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="173" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="194" y="72" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="92" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">病</text>

  <text x="250" y="88" font-size="11" fill="#2f5d24" filter="url(#rough2)">唯一的段：内部段 [1,3]，L = 3</text>

  <text x="42" y="132" font-size="11" fill="#333" filter="url(#rough2)">S = 5 − 2 = 3；交错数 = 3! / 3! = 1（只有一个段）</text>
  <text x="42" y="152" font-size="11" fill="#333" filter="url(#rough2)">内部段贡献 = 2^(3−1) = 4</text>
  <text x="42" y="176" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">4 个序列：[1,2,3]、[1,3,2]、[3,1,2]、[3,2,1]</text>

  <!-- example 2 -->
  <rect x="26" y="222" width="468" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="244" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：n = 4，sick = [1] → 输出 3</text>

  <rect x="42" y="254" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="59" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="80" y="254" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="274" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">病</text>
  <rect x="118" y="254" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="135" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="156" y="254" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="173" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="250" y="270" font-size="11" fill="#446688" filter="url(#rough2)">首段 [0] L=1、末段 [2,3] L=2，</text>
  <text x="250" y="288" font-size="11" fill="#446688" filter="url(#rough2)">都是边界段</text>

  <text x="42" y="314" font-size="11" fill="#333" filter="url(#rough2)">S = 3；交错数 = 3! / (1!·2!) = 3（C(3,1) 种穿插）</text>
  <text x="42" y="334" font-size="11" fill="#333" filter="url(#rough2)">无内部段 → 2^0 = 1</text>
  <text x="42" y="358" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">3 个序列：[0,2,3]、[2,0,3]、[2,3,0]</text>

  <!-- bottom strip -->
  <rect x="60" y="404" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="420" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">小规模可用位掩码 DFS 对拍：n ≤ 10 穷举 2000+ 组全部一致</text>
  <text x="260" y="436" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">边界段绝不贡献 2 的幂 —— 只有内部段才写进 k</text>
</svg>
