<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=9 → 10，n=81 → 100</text>

  <!-- ===== Case 1: n = 9 ===== -->
  <text x="40" y="62" font-size="12.5" fill="#446688" font-weight="bold">用例一：n = 9</text>

  <!-- n boxes: 9 -> 1 -> 0 -->
  <rect x="70" y="72" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="91" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">9</text>
  <rect x="200" y="72" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="91" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">1</text>
  <rect x="330" y="72" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="358" y="91" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold">0</text>

  <!-- /9 arrows -->
  <path d="M 126 86 L 200 86" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="80" text-anchor="middle" font-size="9.5" fill="#888">/9</text>
  <path d="M 256 86 L 330 86" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="80" text-anchor="middle" font-size="9.5" fill="#888">/9</text>

  <!-- %9 remainder boxes -->
  <rect x="70" y="110" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="129" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="200" y="110" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="129" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="98" y="108" text-anchor="middle" font-size="9" fill="#d6a040">%9</text>
  <text x="228" y="108" text-anchor="middle" font-size="9" fill="#d6a040">%9</text>

  <!-- accumulate -->
  <path d="M 228 142 L 228 156" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="158" width="320" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="220" y="176" text-anchor="middle" font-size="11" fill="#555">数码 [0,1] → 反转 "10" → 十进制读 10 ✓（跳过9）</text>

  <!-- ===== divider ===== -->
  <path d="M 40 200 L 560 200" stroke="#ddd" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ===== Case 2: n = 81 ===== -->
  <text x="40" y="226" font-size="12.5" fill="#b85450" font-weight="bold">用例二：n = 81</text>

  <!-- n boxes: 81 -> 9 -> 1 -> 0 -->
  <rect x="70" y="236" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="255" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">81</text>
  <rect x="200" y="236" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="255" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">9</text>
  <rect x="330" y="236" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="358" y="255" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">1</text>
  <rect x="460" y="236" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="488" y="255" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold">0</text>

  <path d="M 126 250 L 200 250" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="244" text-anchor="middle" font-size="9.5" fill="#888">/9</text>
  <path d="M 256 250 L 330 250" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="244" text-anchor="middle" font-size="9.5" fill="#888">/9</text>
  <path d="M 386 250 L 460 250" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="423" y="244" text-anchor="middle" font-size="9.5" fill="#888">/9</text>

  <!-- remainders -->
  <rect x="70" y="274" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="293" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="200" y="274" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="293" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="330" y="274" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="293" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="98" y="272" text-anchor="middle" font-size="9" fill="#d6a040">%9</text>
  <text x="228" y="272" text-anchor="middle" font-size="9" fill="#d6a040">%9</text>
  <text x="358" y="272" text-anchor="middle" font-size="9" fill="#d6a040">%9</text>

  <path d="M 358 306 L 358 320" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="322" width="380" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250" y="340" text-anchor="middle" font-size="11" fill="#555">数码 [0,0,1] → 反转 "100" → 十进制读 100 ✓（跳过89-99）</text>

  <!-- ===== verification note ===== -->
  <rect x="40" y="366" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="384" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">验证 n=81：1~99 中含 9 的数共 19 个（9,19..99 个位+90..99 十位-重复99）</text>
  <text x="300" y="400" text-anchor="middle" font-size="11" fill="#555">故 1~99 有 80 个非9数，第 81 项 = 100 ✓  ｜  九进制 "100" 值 = 1×9² = 81 = 序号 ✓</text>

  <!-- ===== insight ===== -->
  <rect x="40" y="418" width="520" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="440" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">双射本质：序号 n = 九进制数码串的数值；答案 = 数码串的十进制字面值</text>

  <text x="300" y="464" text-anchor="middle" font-size="10.5" fill="#888">数码 0~8 原样映射（删末尾数码 9，剩余数码连续 → 映射恒等）</text>
</svg>
