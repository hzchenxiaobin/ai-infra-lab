<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算</text>
  <text x="260" y="36" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">veganFriendly=1, maxPrice=50, maxDistance=10</text>

  <!-- Table header background -->
  <rect x="82" y="52" width="336" height="24" fill="#f4f4f4" filter="url(#rough2)"/>

  <!-- Highlighted cells: vegan=0 (pink) -->
  <rect x="176" y="98" width="38" height="22" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="176" y="142" width="38" height="22" fill="#fce4ec" filter="url(#rough2)"/>

  <!-- Highlighted cells: result column -->
  <rect x="308" y="76" width="110" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="308" y="98" width="110" height="22" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="308" y="120" width="110" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="308" y="142" width="110" height="22" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="308" y="164" width="110" height="22" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- Table border -->
  <rect x="82" y="52" width="336" height="134" fill="none" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Grid lines: vertical -->
  <path d="M 124 52 L 124 186" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 176 52 L 176 186" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 214 52 L 214 186" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 266 52 L 266 186" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 308 52 L 308 186" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- Grid lines: horizontal -->
  <path d="M 82 76 L 418 76" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 82 98 L 418 98" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 82 120 L 418 120" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 82 142 L 418 142" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 82 164 L 418 164" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="103" y="68" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">id</text>
  <text x="150" y="68" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">rating</text>
  <text x="195" y="68" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="240" y="68" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">price</text>
  <text x="287" y="68" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">dist</text>
  <text x="363" y="68" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">结果</text>

  <!-- Row 1: id=1 pass -->
  <text x="103" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="195" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">40</text>
  <text x="287" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="363" y="91" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">✓ 通过</text>

  <!-- Row 2: id=2 fail (vegan=0) -->
  <text x="103" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="150" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="195" y="113" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="240" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">50</text>
  <text x="287" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="363" y="113" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold" filter="url(#rough2)">✗ vegan=0</text>

  <!-- Row 3: id=3 pass -->
  <text x="103" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="195" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">30</text>
  <text x="287" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="363" y="135" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">✓ 通过</text>

  <!-- Row 4: id=4 fail (vegan=0) -->
  <text x="103" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="195" y="157" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="240" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="287" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="363" y="157" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold" filter="url(#rough2)">✗ vegan=0</text>

  <!-- Row 5: id=5 pass -->
  <text x="103" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="150" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="195" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="287" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="363" y="179" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">✓ 通过</text>

  <!-- Survivors section -->
  <text x="30" y="214" font-size="10.5" fill="#666" filter="url(#rough2)">通过</text>
  <rect x="140" y="196" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1|4</text>
  <rect x="214" y="196" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3|8</text>
  <rect x="288" y="196" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5|1</text>

  <path d="M 260 228 L 260 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort section -->
  <text x="30" y="260" font-size="10.5" fill="#666" filter="url(#rough2)">排序</text>
  <rect x="140" y="244" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3|8</text>
  <rect x="214" y="244" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1|4</text>
  <rect x="288" y="244" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5|1</text>

  <path d="M 260 274 L 260 286" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output section -->
  <text x="30" y="304" font-size="10.5" fill="#666" filter="url(#rough2)">输出</text>
  <rect x="170" y="288" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="191" y="307" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="224" y="288" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="307" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="278" y="288" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="299" y="307" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Note -->
  <rect x="50" y="330" width="420" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">注：rating 相同时按 id 降序（示例 2 中 id=3,2 同 rating=8，id=3 排前）</text>
</svg>
