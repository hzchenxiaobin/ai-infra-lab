<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：nums=[2,3,5,8], k=5</text>

  <!-- Step 1: sort -->
  <text x="30" y="58" font-size="12" fill="#888">① 排序:</text>
  <rect x="100" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="63" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="144" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="63" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="188" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="63" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="232" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="63" text-anchor="middle" font-size="12" fill="#333">8</text>

  <!-- Step 2: group table header -->
  <text x="30" y="100" font-size="12" fill="#888">② 分组 & DP:</text>
  <!-- table frame -->
  <rect x="30" y="108" width="460" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="124" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">组 (mod 5)</text>
  <text x="240" y="124" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">元素</text>
  <text x="370" y="124" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">子集数 f</text>

  <!-- row A -->
  <rect x="30" y="130" width="460" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="148" text-anchor="middle" font-size="11" fill="#333">mod=0</text>
  <text x="240" y="148" text-anchor="middle" font-size="11" fill="#333">{5}</text>
  <text x="370" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row B -->
  <rect x="30" y="156" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="174" text-anchor="middle" font-size="11" fill="#333">mod=2</text>
  <text x="240" y="174" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <text x="370" y="174" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <!-- row C -->
  <rect x="30" y="182" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="200" text-anchor="middle" font-size="11" fill="#333">mod=3</text>
  <text x="240" y="200" text-anchor="middle" font-size="11" fill="#333">{3, 8} (diff=5=k)</text>
  <text x="370" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1+2=3</text>

  <!-- row C detail -->
  <text x="240" y="224" text-anchor="middle" font-size="10" fill="#888">f[0]=1, f[1]=2, f[2]=f[1]+f[0]=3</text>

  <!-- Step 3: multiply -->
  <text x="30" y="256" font-size="12" fill="#888">③ 乘积:</text>
  <rect x="100" y="242" width="320" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2 × 2 × 3 = 12 ⭐</text>

  <!-- Summary -->
  <rect x="30" y="290" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#444">排序→按 mod k 分组→组内打家劫舍 DP→乘积</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#888">时间 O(n log n) · 空间 O(n)</text>
</svg>
