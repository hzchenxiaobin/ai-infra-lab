<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：时间转分钟 → 对齐刻钟 → 计数
  </text>

  <rect x="195" y="50" width="150" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">解析 startTime / finishTime 为分钟数 s, f</text>
  <line x1="270" y1="88" x2="270" y2="108" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <polygon points="270,110 360,150 270,190 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">finish ≤ start ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">(跨过午夜)</text>

  <line x1="360" y1="150" x2="410" y2="150" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="384" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="410" y="131" width="110" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="155" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">finish += 24×60</text>

  <line x1="270" y1="190" x2="270" y2="210" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="282" y="204" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="170" y="212" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">startCeil = ⌈s / 15⌉ × 15</text>
  <text x="270" y="248" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">finishFloor = ⌊f / 15⌋ × 15</text>
  <line x1="270" y1="256" x2="270" y2="276" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <polygon points="270,278 360,318 270,358 180,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">finishFloor &gt; startCeil ?</text>

  <line x1="180" y1="318" x2="130" y2="318" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="156" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="20" y="299" width="110" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="323" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(floor−ceil)/15</text>

  <line x1="360" y1="318" x2="410" y2="318" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="384" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="410" y="299" width="110" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="323" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">返回 0</text>

  <rect x="130" y="392" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="416" text-anchor="middle" font-size="13" fill="#3a5a2a" filter="url(#rough2)">答案 = max(0, (finishFloor − startCeil) / 15)</text>
  <text x="270" y="432" text-anchor="middle" font-size="10" fill="#5a7a4a" filter="url(#rough2)">每 15 分钟一个对局，整除即得对局数</text>
  <line x1="75" y1="337" x2="75" y2="392" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <line x1="270" y1="358" x2="270" y2="392" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
</svg>
