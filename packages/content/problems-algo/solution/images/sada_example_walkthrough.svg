<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,4,6,8,10]，n=5，total=29</text>

  <!-- Column headers -->
  <text x="60" y="62" font-size="11" fill="#888" font-weight="bold">i</text>
  <text x="110" y="62" font-size="11" fill="#888" font-weight="bold">nums[i]</text>
  <text x="180" y="62" font-size="11" fill="#888" font-weight="bold">prefix[i]</text>
  <text x="270" y="62" font-size="11" fill="#888" font-weight="bold">2i−n</text>
  <text x="350" y="62" font-size="11" fill="#888" font-weight="bold">total−2·prefix</text>
  <text x="470" y="62" font-size="11" fill="#888" font-weight="bold">result[i]</text>

  <!-- Header underline -->
  <path d="M 40 70 L 560 70" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0 -->
  <text x="60" y="94" font-size="13" fill="#446688" font-weight="bold">0</text>
  <text x="110" y="94" font-size="13" fill="#333">1</text>
  <text x="180" y="94" font-size="13" fill="#333">0</text>
  <text x="270" y="94" font-size="13" fill="#333">−5</text>
  <text x="350" y="94" font-size="13" fill="#333">29</text>
  <text x="470" y="94" font-size="14" fill="#b85450" font-weight="bold">24</text>
  <rect x="460" y="80" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <text x="60" y="124" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="110" y="124" font-size="13" fill="#333">4</text>
  <text x="180" y="124" font-size="13" fill="#333">1</text>
  <text x="270" y="124" font-size="13" fill="#333">−3</text>
  <text x="350" y="124" font-size="13" fill="#333">27</text>
  <text x="470" y="124" font-size="14" fill="#b85450" font-weight="bold">15</text>
  <rect x="460" y="110" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Row 2 (highlighted) -->
  <rect x="40" y="134" width="470" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="154" font-size="13" fill="#a87020" font-weight="bold">2</text>
  <text x="110" y="154" font-size="13" fill="#a87020" font-weight="bold">6</text>
  <text x="180" y="154" font-size="13" fill="#a87020">5</text>
  <text x="270" y="154" font-size="13" fill="#a87020">−1</text>
  <text x="350" y="154" font-size="13" fill="#a87020">19</text>
  <text x="470" y="154" font-size="14" fill="#b85450" font-weight="bold">13</text>
  <rect x="460" y="140" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Row 3 -->
  <text x="60" y="184" font-size="13" fill="#446688" font-weight="bold">3</text>
  <text x="110" y="184" font-size="13" fill="#333">8</text>
  <text x="180" y="184" font-size="13" fill="#333">11</text>
  <text x="270" y="184" font-size="13" fill="#333">1</text>
  <text x="350" y="184" font-size="13" fill="#333">7</text>
  <text x="470" y="184" font-size="14" fill="#b85450" font-weight="bold">15</text>
  <rect x="460" y="170" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Row 4 -->
  <text x="60" y="214" font-size="13" fill="#446688" font-weight="bold">4</text>
  <text x="110" y="214" font-size="13" fill="#333">10</text>
  <text x="180" y="214" font-size="13" fill="#333">19</text>
  <text x="270" y="214" font-size="13" fill="#333">3</text>
  <text x="350" y="214" font-size="13" fill="#333">−9</text>
  <text x="470" y="214" font-size="14" fill="#b85450" font-weight="bold">21</text>
  <rect x="460" y="200" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- divider -->
  <path d="M 40 245 L 560 245" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Verification for i=2 -->
  <rect x="50" y="260" width="500" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="284" font-size="12" fill="#4a7a3a" font-weight="bold">验证 i=2 (nums[2]=6)：</text>
  <text x="70" y="306" font-size="12" fill="#333">左 = |6−1|+|6−4| = 5+2 = 7</text>
  <text x="70" y="326" font-size="12" fill="#333">右 = |8−6|+|10−6| = 2+4 = 6</text>
  <text x="70" y="346" font-size="12.5" fill="#a87020" font-weight="bold">result[2] = 7 + 6 = 13 ✓</text>

  <!-- Note -->
  <rect x="50" y="375" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="398" text-anchor="middle" font-size="11.5" fill="#444">公式 result[i] = total − 2·prefix[i] + (2i−n)·nums[i]</text>
  <text x="300" y="416" text-anchor="middle" font-size="11" fill="#888">左侧贡献随 i 增大由负转正，右侧反之，结果呈「V 形」对称</text>
</svg>
