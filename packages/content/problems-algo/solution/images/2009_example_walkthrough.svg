<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3,5,6]，n = 5</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">去重后 a = [1,2,3,5,6]；逐 left 滑动窗口，绿=窗口内，灰=窗口外</text>

  <!-- Column headers -->
  <g filter="url(#rough2)" font-size="10.5" fill="#888" font-weight="bold" text-anchor="middle">
    <text x="50" y="74">left</text>
    <text x="110" y="74">窗口</text>
    <text x="300" y="74">a 中元素归属</text>
    <text x="470" y="74">c</text>
    <text x="530" y="74">maxKeep</text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="82" x2="570" y2="82" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Row 0: left=0, window [1,5] -->
  <text x="50" y="112" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="110" y="112" font-size="10" fill="#d6a040" font-weight="bold" text-anchor="middle" filter="url(#rough2)">[1,5]</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="160" y="96" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="180" y="116" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="204" y="96" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="224" y="116" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="248" y="96" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="268" y="116" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="292" y="96" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="312" y="116" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="336" y="96" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="356" y="116" fill="#888" font-weight="bold">6</text>
  </g>
  <text x="470" y="116" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="530" y="116" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>

  <!-- Row 1: left=1, window [2,6] -->
  <text x="50" y="160" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="110" y="160" font-size="10" fill="#d6a040" font-weight="bold" text-anchor="middle" filter="url(#rough2)">[2,6]</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="160" y="144" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="180" y="164" fill="#888" font-weight="bold">1</text>
    <rect x="204" y="144" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="224" y="164" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="248" y="144" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="268" y="164" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="292" y="144" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="312" y="164" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="336" y="144" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="356" y="164" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
  <text x="470" y="164" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="530" y="164" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>

  <!-- Row 2: left=2, window [3,7] -->
  <text x="50" y="208" font-size="11" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="110" y="208" font-size="10" fill="#d6a040" font-weight="bold" text-anchor="middle" filter="url(#rough2)">[3,7]</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="160" y="192" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="180" y="212" fill="#888" font-weight="bold">1</text>
    <rect x="204" y="192" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="224" y="212" fill="#888" font-weight="bold">2</text>
    <rect x="248" y="192" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="268" y="212" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="292" y="192" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="312" y="212" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="336" y="192" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="356" y="212" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
  <text x="470" y="212" font-size="12" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="530" y="212" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>

  <!-- Row 3: left=3, window [5,9] -->
  <text x="50" y="256" font-size="11" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="110" y="256" font-size="10" fill="#d6a040" font-weight="bold" text-anchor="middle" filter="url(#rough2)">[5,9]</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="160" y="240" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="180" y="260" fill="#888" font-weight="bold">1</text>
    <rect x="204" y="240" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="224" y="260" fill="#888" font-weight="bold">2</text>
    <rect x="248" y="240" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="268" y="260" fill="#888" font-weight="bold">3</text>
    <rect x="292" y="240" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="312" y="260" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="336" y="240" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="356" y="260" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
  <text x="470" y="260" font-size="12" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="530" y="260" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>

  <!-- Row 4: left=4, window [6,10] -->
  <text x="50" y="304" font-size="11" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="110" y="304" font-size="10" fill="#d6a040" font-weight="bold" text-anchor="middle" filter="url(#rough2)">[6,10]</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="160" y="288" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="180" y="308" fill="#888" font-weight="bold">1</text>
    <rect x="204" y="288" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="224" y="308" fill="#888" font-weight="bold">2</text>
    <rect x="248" y="288" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="268" y="308" fill="#888" font-weight="bold">3</text>
    <rect x="292" y="288" width="40" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="312" y="308" fill="#888" font-weight="bold">5</text>
    <rect x="336" y="288" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="356" y="308" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
  <text x="470" y="308" font-size="12" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="530" y="308" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>

  <!-- Divider -->
  <line x1="30" y1="330" x2="570" y2="330" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="80" y="346" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="366" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">maxKeep = 4 → 答案 = n − maxKeep = 5 − 4 = 1</text>
  <text x="300" y="382" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">把 1 个窗口外元素改写成窗口内缺失值（如 6→4）</text>

  <!-- right pointer trajectory note -->
  <text x="300" y="412" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">right 轨迹：0→4→5→5→5→5（只前进不回退，总步数 ≤ m）</text>

  <!-- Note -->
  <rect x="40" y="424" width="520" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="442" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">观察要点：</text>
  <text x="56" y="458" font-size="10" fill="#333" filter="url(#rough2)">① 窗口上界 a[left]+n−1 随 left 单调递增 → right 不回退；② 答案只关心 max c，与具体替换值无关</text>
  <text x="56" y="470" font-size="10" fill="#333" filter="url(#rough2)">③ 窗口大小恒为 n（原数组长度），不是去重后长度 m</text>
</svg>
