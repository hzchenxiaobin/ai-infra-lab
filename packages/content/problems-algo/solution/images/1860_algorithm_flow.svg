<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐秒贪心模拟</text>

  <!-- 1. Start -->
  <rect x="220" y="38" width="100" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="56" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 270 64 L 270 76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. i = 1 -->
  <rect x="190" y="78" width="160" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i = 1</text>
  <path d="M 270 106 L 270 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. target box (ternary pick larger) -->
  <rect x="110" y="122" width="320" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">target ← mem1 ≥ mem2 ? mem1 : mem2</text>
  <text x="392" y="144" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">(平手取 1)</text>
  <path d="M 270 156 L 270 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. Diamond: target >= i? -->
  <polygon points="270,172 380,212 270,252 160,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">target ≥ i ?</text>
  <text x="270" y="226" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">(够分吗)</text>

  <!-- No branch -> crash -->
  <path d="M 380 212 L 414 212" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="206" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="416" y="198" width="92" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="217" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">崩溃</text>
  <path d="M 462 226 L 462 240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="242" width="140" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 [i, mem1, mem2]</text>

  <!-- Yes branch down -->
  <path d="M 270 252 L 270 266" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="248" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 5. target -= i -->
  <rect x="180" y="268" width="180" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">target −= i</text>
  <path d="M 270 298 L 270 310" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. i++ -->
  <rect x="220" y="312" width="100" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="330" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i++</text>

  <!-- loop back: from i++ left, up the far left, into target box left -->
  <path d="M 220 325 L 30 325 L 30 139 L 110 139" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="232" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 20 232)" filter="url(#rough2)">下一秒</text>

  <!-- footer summary -->
  <text x="270" y="372" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每轮 O(1)；总轮数 ≈ √(2·(mem1+mem2))，上限约 9.3×10⁴</text>
  <text x="270" y="390" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">target 即较大者：max(mem1, mem2) &lt; i 等价于两根都 &lt; i → 必崩溃</text>
</svg>
