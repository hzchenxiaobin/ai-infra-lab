<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGrn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：三道关卡串联——除法（全称）、计数、加权平均</text>

  <!-- students row -->
  <rect x="24" y="34" width="104" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="51" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Alice 1 · CS</text>
  <rect x="146" y="34" width="104" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="51" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Bob 2 · CS</text>
  <rect x="268" y="34" width="104" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="51" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Charlie 3 · Math</text>
  <rect x="390" y="34" width="104" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="51" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">David 4 · Math</text>

  <!-- arrows students -> gate1 -->
  <path d="M 76 62 L 76 78" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 198 62 L 198 78" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 320 62 L 320 78" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 442 62 L 442 78" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- gate 1 -->
  <rect x="60" y="82" width="400" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">关卡 ① 必修关（全称量词 → 关系除法）</text>
  <text x="260" y="118" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">本专业每门必修课（mandatory='Yes'）都拿到 A</text>
  <text x="260" y="133" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">C_mand(s) ⊆ E_A(s)：SUM(grade='A') = COUNT(*)</text>

  <!-- Bob / David exit -->
  <path d="M 198 112 L 24 112" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 442 112 L 498 112" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="22" y="104" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Bob 出局</text>
  <text x="22" y="128" font-size="8" fill="#b85450" filter="url(#rough2)">102 = B ✗</text>
  <text x="498" y="104" text-anchor="end" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">David 出局</text>
  <text x="498" y="128" text-anchor="end" font-size="8" fill="#b85450" filter="url(#rough2)">103/104 = B ✗</text>

  <!-- gate1 -> gate2 -->
  <path d="M 200 140 L 200 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGrn)" filter="url(#rough2)"/>
  <path d="M 320 140 L 320 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGrn)" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Alice、Charlie 过关</text>

  <!-- gate 2 -->
  <rect x="60" y="162" width="400" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关卡 ② 选修关（存在 + 全称 → 计数）</text>
  <text x="260" y="198" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">至少 2 门本专业选修课，且每门成绩 ∈ {A, B}</text>
  <text x="260" y="213" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">COUNT(DISTINCT cid) ≥ 2 且 SUM(grade∈{A,B}) = COUNT(*)</text>

  <!-- gate2 -> gate3 -->
  <path d="M 200 220 L 200 238" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGrn)" filter="url(#rough2)"/>
  <path d="M 320 220 L 320 238" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGrn)" filter="url(#rough2)"/>

  <!-- gate 3 -->
  <rect x="60" y="242" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">关卡 ③ GPA 关（聚合比较 → HAVING）</text>
  <text x="260" y="278" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">全部已修课程的学分加权平均：Σ(credits × GPA) / Σcredits ≥ 2.5</text>
  <text x="260" y="293" text-anchor="middle" font-size="9" fill="#a08430" filter="url(#rough2)">credits 在前作 3182 是干扰列，这里成为权重</text>

  <!-- gate3 -> output -->
  <path d="M 260 300 L 260 316" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGrn)" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="110" y="320" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">三关全过 → 输出 {1, 3}</text>
  <text x="260" y="355" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">Alice（3.875）、Charlie（≈3.89）</text>
</svg>
