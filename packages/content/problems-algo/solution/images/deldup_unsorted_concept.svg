<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两趟扫描：先哈希计数，再哑节点过滤</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">无序链表重复值不相邻 → 必须先全局计数，不能相邻比较</text>

  <!-- ===== 原始链表（无序，重复值不相邻）===== -->
  <text x="20" y="74" font-size="11" fill="#444" font-weight="bold">原始链表（无序）：3 和 2 的重复值不相邻！</text>
  <g font-size="13">
    <rect x="86" y="82" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="108" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="136" y="82" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="158" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="186" y="82" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="208" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="236" y="82" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="258" y="102" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="286" y="82" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="308" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="336" y="82" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="358" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="130" y1="97" x2="136" y2="97" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="180" y1="97" x2="186" y2="97" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="230" y1="97" x2="236" y2="97" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="280" y1="97" x2="286" y2="97" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="330" y1="97" x2="336" y2="97" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <!-- 重复值跨距标注 -->
  <path d="M 108 78 Q 208 60 308 78" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="208" y="58" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">两个 3 不相邻</text>
  <text x="400" y="102" font-size="10" fill="#888">红=重复值，绿=唯一值</text>

  <!-- ===== 第一趟：哈希计数 ===== -->
  <text x="20" y="138" font-size="11" fill="#446688" font-weight="bold">第一趟：遍历建 freq 频率表</text>
  <rect x="86" y="146" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="246" y="167" text-anchor="middle" font-size="11" fill="#333" font-family="'Bradley Hand', 'Comic Sans MS', cursive">freq = { 3: 2,  2: 3,  1: 1 }</text>
  <path d="M 246 112 L 246 146" stroke="#446688" stroke-width="1.1" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="167" font-size="10" fill="#888">值 → 出现次数</text>

  <!-- ===== 第二趟：哑节点 + prev 过滤 ===== -->
  <text x="20" y="206" font-size="11" fill="#b85450" font-weight="bold">第二趟：dummy + prev，跳过 freq[v] &gt; 1 的节点</text>
  <g font-size="12">
    <rect x="20" y="214" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="44" y="234" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="76" y="214" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="96" y="234" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="122" y="214" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="142" y="234" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="168" y="214" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="188" y="234" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="214" y="214" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="234" y="234" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="260" y="214" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="280" y="234" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="306" y="214" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="326" y="234" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">2</text>
  </g>
  <text x="44" y="202" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <!-- prev 跨过所有红到 1 -->
  <path d="M 68 230 Q 142 196 214 230" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="141" y="190" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">prev.next 跨过 freq&gt;1</text>
  <text x="360" y="234" font-size="10" fill="#888">灰框删除线=被移除</text>

  <!-- ===== 结果 ===== -->
  <text x="20" y="266" font-size="11" fill="#4a7a3a" font-weight="bold">结果：dummy.next → 1</text>
  <g font-size="13">
    <rect x="86" y="274" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="110" y="294" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="142" y="274" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="164" y="294" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="134" y1="289" x2="142" y2="289" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="196" y="294" font-size="11" fill="#888">→∅</text>
  </g>

  <!-- ===== 对比 82 题 ===== -->
  <rect x="20" y="320" width="540" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="342" font-size="11" fill="#8a6a20" font-weight="bold">与 82 题（删除排序链表中的重复元素 II）的对照：</text>
  <text x="34" y="364" font-size="11" fill="#555">82（有序）：重复值相邻 → 单趟相邻比较，prev/curr 整段跳过，O(n) 时间 O(1) 空间</text>
  <text x="34" y="384" font-size="11" fill="#555">1836（无序）：重复值不相邻 → 无法相邻比较，必须先哈希计数，再过滤，O(n) 时间 O(n) 空间</text>
  <text x="34" y="408" font-size="11" fill="#b85450" font-weight="bold">为什么无序必须两趟？</text>
  <text x="34" y="428" font-size="11" fill="#555">单趟扫描时遇到第一个 3 时还不知道后面有没有第二个 3（不相邻）</text>
  <text x="34" y="444" font-size="11" fill="#555">→ 必须先全局统计频率，才能判定每个节点该不该删</text>
</svg>
