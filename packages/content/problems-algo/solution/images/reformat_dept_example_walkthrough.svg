<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 行 → 3 行透视</text>

  <!-- ===== Step 1: Original data ===== -->
  <text x="290" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① 原始数据（5 行）</text>

  <rect x="190" y="56" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="72" font-size="8.5" fill="#446688" font-weight="bold">id</text>
  <text x="265" y="72" font-size="8.5" fill="#446688" font-weight="bold">revenue</text>
  <text x="335" y="72" font-size="8.5" fill="#446688" font-weight="bold">month</text>
  <line x1="235" y1="56" x2="235" y2="80" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="300" y1="56" x2="300" y2="80" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="190" y="80" width="200" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="215" y="93" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="265" y="93" text-anchor="middle" font-size="8.5" fill="#333">8000</text>
  <text x="335" y="93" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">Jan</text>
  <line x1="235" y1="80" x2="235" y2="98" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="300" y1="80" x2="300" y2="98" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="190" y="98" width="200" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="215" y="111" text-anchor="middle" font-size="8.5" fill="#333">2</text>
  <text x="265" y="111" text-anchor="middle" font-size="8.5" fill="#333">9000</text>
  <text x="335" y="111" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">Jan</text>
  <line x1="235" y1="98" x2="235" y2="116" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="300" y1="98" x2="300" y2="116" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="190" y="116" width="200" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="215" y="129" text-anchor="middle" font-size="8.5" fill="#333">3</text>
  <text x="265" y="129" text-anchor="middle" font-size="8.5" fill="#333">10000</text>
  <text x="335" y="129" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">Feb</text>
  <line x1="235" y1="116" x2="235" y2="134" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="300" y1="116" x2="300" y2="134" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="190" y="134" width="200" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="215" y="147" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="265" y="147" text-anchor="middle" font-size="8.5" fill="#333">7000</text>
  <text x="335" y="147" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">Feb</text>
  <line x1="235" y1="134" x2="235" y2="152" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="300" y1="134" x2="300" y2="152" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="190" y="152" width="200" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="215" y="165" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="265" y="165" text-anchor="middle" font-size="8.5" fill="#333">6000</text>
  <text x="335" y="165" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">Mar</text>
  <line x1="235" y1="152" x2="235" y2="170" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="300" y1="152" x2="300" y2="170" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <!-- arrow down -->
  <path d="M290 175 L290 195" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="305" y="188" font-size="8" fill="#d6a040" font-weight="bold">GROUP BY id</text>

  <!-- ===== Step 2: Three groups ===== -->
  <text x="290" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">② 按 id 分组（3 组）</text>

  <!-- Group id=1 -->
  <rect x="30" y="218" width="160" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="234" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">id=1（3 行）</text>
  <text x="50" y="250" font-size="8" fill="#d6a040">Jan → 8000</text>
  <text x="50" y="262" font-size="8" fill="#4a7a3a">Feb → 7000</text>
  <text x="50" y="274" font-size="8" fill="#b85450">Mar → 6000</text>
  <text x="50" y="282" font-size="7" fill="#888">Apr~Dec → 无</text>

  <!-- Group id=2 -->
  <rect x="210" y="218" width="160" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="234" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">id=2（1 行）</text>
  <text x="230" y="250" font-size="8" fill="#d6a040">Jan → 9000</text>
  <text x="230" y="262" font-size="8" fill="#888">Feb~Dec → 无</text>

  <!-- Group id=3 -->
  <rect x="390" y="218" width="160" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="234" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">id=3（1 行）</text>
  <text x="410" y="250" font-size="8" fill="#4a7a3a">Feb → 10000</text>
  <text x="410" y="262" font-size="8" fill="#888">其余月 → 无</text>

  <!-- arrow down -->
  <path d="M290 290 L290 310" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="305" y="303" font-size="8" fill="#d6a040" font-weight="bold">12 列条件聚合</text>

  <!-- ===== Step 3: Final result ===== -->
  <text x="290" y="325" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③ 透视结果（3 行 × 13 列）</text>

  <!-- Result table header -->
  <rect x="30" y="332" width="520" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="347" font-size="8" fill="#b85450" font-weight="bold">id</text>
  <text x="90" y="347" font-size="7" fill="#b85450" font-weight="bold">Jan</text>
  <text x="135" y="347" font-size="7" fill="#b85450" font-weight="bold">Feb</text>
  <text x="180" y="347" font-size="7" fill="#b85450" font-weight="bold">Mar</text>
  <text x="225" y="347" font-size="7" fill="#b85450" font-weight="bold">Apr</text>
  <text x="270" y="347" font-size="7" fill="#b85450" font-weight="bold">May</text>
  <text x="315" y="347" font-size="6.5" fill="#888">...</text>
  <text x="370" y="347" font-size="7" fill="#b85450" font-weight="bold">Sep</text>
  <text x="415" y="347" font-size="7" fill="#b85450" font-weight="bold">Oct</text>
  <text x="460" y="347" font-size="7" fill="#b85450" font-weight="bold">Nov</text>
  <text x="510" y="347" font-size="7" fill="#b85450" font-weight="bold">Dec</text>

  <!-- Row id=1 -->
  <rect x="30" y="354" width="520" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="368" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">1</text>
  <text x="90" y="368" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">8000</text>
  <text x="135" y="368" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">7000</text>
  <text x="180" y="368" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">6000</text>
  <text x="225" y="368" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="270" y="368" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="315" y="368" text-anchor="middle" font-size="6.5" fill="#888">...</text>
  <text x="370" y="368" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="415" y="368" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="460" y="368" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="510" y="368" text-anchor="middle" font-size="7" fill="#888">null</text>

  <!-- Row id=2 -->
  <rect x="30" y="374" width="520" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="388" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">2</text>
  <text x="90" y="388" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">9000</text>
  <text x="135" y="388" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="180" y="388" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="225" y="388" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="270" y="388" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="315" y="388" text-anchor="middle" font-size="6.5" fill="#888">...</text>
  <text x="370" y="388" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="415" y="388" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="460" y="388" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="510" y="388" text-anchor="middle" font-size="7" fill="#888">null</text>

  <!-- Row id=3 -->
  <rect x="30" y="394" width="520" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="408" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">3</text>
  <text x="90" y="408" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="135" y="408" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">10000</text>
  <text x="180" y="408" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="225" y="408" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="270" y="408" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="315" y="408" text-anchor="middle" font-size="6.5" fill="#888">...</text>
  <text x="370" y="408" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="415" y="408" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="460" y="408" text-anchor="middle" font-size="7" fill="#888">null</text>
  <text x="510" y="408" text-anchor="middle" font-size="7" fill="#888">null</text>

  <!-- Summary box -->
  <rect x="30" y="424" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="442" font-size="9" fill="#333">5 行 → <tspan fill="#d6a040" font-weight="bold">GROUP BY id</tspan> 折叠为 3 行 → <tspan fill="#4a7a3a" font-weight="bold">条件聚合</tspan> 展开 12 列 → <tspan fill="#b85450" font-weight="bold">3×13 透视表</tspan>，无数据处自动填 NULL</text>
</svg>
