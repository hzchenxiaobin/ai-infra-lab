<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ribbons = [7,5,9], k = 4, max = 9</text>

  <!-- Table header -->
  <rect x="30" y="40" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="58" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">轮次</text>
  <text x="120" y="58" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">[lo, hi]</text>
  <text x="190" y="58" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">mid</text>
  <text x="290" y="58" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">cnt = Σ÷mid</text>
  <text x="385" y="58" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">判定</text>
  <text x="475" y="58" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">操作</text>

  <!-- Row 1: lo=1, hi=9, mid=5, cnt=3 < 4, hi=4 -->
  <rect x="30" y="70" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="88" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="88" text-anchor="middle" font-size="11" fill="#333">[1, 9]</text>
  <text x="190" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="290" y="88" text-anchor="middle" font-size="11" fill="#333">1+1+1 = 3</text>
  <text x="385" y="88" text-anchor="middle" font-size="11" fill="#b85450">3 &lt; 4 ✗</text>
  <text x="475" y="88" text-anchor="middle" font-size="11" fill="#b85450">hi = 4</text>

  <!-- Row 2: lo=1, hi=4, mid=2, cnt=9 >= 4, ans=2, lo=3 -->
  <rect x="30" y="100" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="118" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="118" text-anchor="middle" font-size="11" fill="#333">[1, 4]</text>
  <text x="190" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="290" y="118" text-anchor="middle" font-size="11" fill="#333">3+2+4 = 9</text>
  <text x="385" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a">9 ≥ 4 ✓</text>
  <text x="475" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a">ans=2, lo=3</text>

  <!-- Row 3: lo=3, hi=4, mid=3, cnt=6 >= 4, ans=3, lo=4 -->
  <rect x="30" y="130" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="148" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="148" text-anchor="middle" font-size="11" fill="#333">[3, 4]</text>
  <text x="190" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="290" y="148" text-anchor="middle" font-size="11" fill="#333">2+1+3 = 6</text>
  <text x="385" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a">6 ≥ 4 ✓</text>
  <text x="475" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a">ans=3, lo=4</text>

  <!-- Row 4: lo=4, hi=4, mid=4, cnt=4 >= 4, ans=4, lo=5 -->
  <rect x="30" y="160" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="178" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="120" y="178" text-anchor="middle" font-size="11" fill="#333">[4, 4]</text>
  <text x="190" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="290" y="178" text-anchor="middle" font-size="11" fill="#333">1+1+2 = 4</text>
  <text x="385" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a">4 ≥ 4 ✓</text>
  <text x="475" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a">ans=4, lo=5</text>

  <!-- Row 5: lo=5 > hi=4, end -->
  <rect x="30" y="190" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="208" text-anchor="middle" font-size="11" fill="#333">—</text>
  <text x="290" y="208" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">lo=5 &gt; hi=4，循环结束，返回 ans = 4</text>

  <!-- Separator -->
  <line x1="30" y1="232" x2="530" y2="232" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Final cutting visualization at L=4 -->
  <text x="30" y="252" font-size="12" fill="#888">L=4 时的切法（ribbons = [7,5,9]）:</text>

  <!-- Ribbon 7: cut at 4 -> [4, 3] -->
  <text x="68" y="280" text-anchor="end" font-size="10" fill="#666">r=7</text>
  <rect x="80" y="268" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="283" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="160" y="268" width="60" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="283" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <line x1="160" y1="264" x2="160" y2="294" stroke="#b85450" stroke-width="1.5" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="228" y="280" font-size="10" fill="#4a7a3a">→ 1 条</text>

  <!-- Ribbon 5: cut at 4 -> [4, 1] -->
  <text x="68" y="310" text-anchor="end" font-size="10" fill="#666">r=5</text>
  <rect x="80" y="298" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="313" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="160" y="298" width="20" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="313" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <line x1="160" y1="294" x2="160" y2="324" stroke="#b85450" stroke-width="1.5" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="188" y="310" font-size="10" fill="#4a7a3a">→ 1 条</text>

  <!-- Ribbon 9: cut at 4 -> [4, 4, 1] -->
  <text x="68" y="340" text-anchor="end" font-size="10" fill="#666">r=9</text>
  <rect x="80" y="328" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="343" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="160" y="328" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="343" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="240" y="328" width="20" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="343" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <line x1="160" y1="324" x2="160" y2="354" stroke="#b85450" stroke-width="1.5" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <line x1="240" y1="324" x2="240" y2="354" stroke="#b85450" stroke-width="1.5" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="268" y="340" font-size="10" fill="#4a7a3a">→ 2 条</text>

  <!-- Result -->
  <rect x="80" y="372" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">count = 1 + 1 + 2 = 4 ≥ k = 4 ✓</text>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#666">L=5 时 count=3 &lt; 4 ✗，故 4 是最大可行长度</text>

  <text x="280" y="448" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">ans = 4 ✓</text>
</svg>
