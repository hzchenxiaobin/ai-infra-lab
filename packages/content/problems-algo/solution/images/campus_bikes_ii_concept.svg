<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心 vs 最优：最小化总距离需要 DP</text>

  <!-- ===== Left panel: Greedy ===== -->
  <rect x="20" y="44" width="250" height="230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="64" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">贪心（1057 规则）</text>

  <!-- Grid -->
  <g filter="url(#rough2)" opacity="0.3">
    <line x1="50" y1="80" x2="50" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="90" y1="80" x2="90" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="130" y1="80" x2="130" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="170" y1="80" x2="170" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="210" y1="80" x2="210" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="50" y1="80" x2="210" y2="80" stroke="#ccc" stroke-width="1"/>
    <line x1="50" y1="120" x2="210" y2="120" stroke="#ccc" stroke-width="1"/>
    <line x1="50" y1="160" x2="210" y2="160" stroke="#ccc" stroke-width="1"/>
    <line x1="50" y1="200" x2="210" y2="200" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- W0 at [0,0] -> pixel (90, 160) -->
  <circle cx="90" cy="160" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="164" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">W0</text>

  <!-- W1 at [2,1] -> pixel (130, 120) -->
  <circle cx="130" cy="120" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="124" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">W1</text>

  <!-- B0 at [1,2] -> pixel (90, 80)... wait B0 is [1,2]: x=1->130, y=2->80... no, [1,2] means x=1,y=2. pixel x=50+1*40=90, y=200-2*40=120... hmm -->

  <!-- B0 at [1,2] -> pixel x=50+1*40=90, y=200-2*40=120... that overlaps W1. Let me use [1,2]: grid (1,2), pixel (90, 120)? No. -->

  <!-- Let me recalculate: grid origin at (50,200), 40px per unit, y goes up -->
  <!-- [0,0] -> (90, 200), [2,1] -> (130, 160), [1,2] -> (90, 120), [3,3] -> (170, 80) -->

  <!-- Greedy: W1→B0 (dist=2, shortest), then W0→B1 (dist=6). Total=8 -->
  <!-- Greedy arrows: W1→B0 -->
  <path d="M 130 160 L 90 120" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="136" font-size="9" fill="#b85450">d=2</text>

  <!-- Greedy: W0→B1 -->
  <path d="M 90 200 L 170 80" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="150" font-size="9" fill="#b85450">d=6</text>

  <!-- B0 at [1,2] -> pixel (90, 120) -->
  <rect x="78" y="108" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="124" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">B0</text>

  <!-- B1 at [3,3] -> pixel (170, 80) -->
  <rect x="158" y="68" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="84" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">B1</text>

  <rect x="40" y="230" width="210" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="250" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">总距离 = 2 + 6 = 8</text>

  <!-- ===== Right panel: Optimal ===== -->
  <rect x="290" y="44" width="250" height="230" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="64" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">最优分配（DP）</text>

  <!-- Grid -->
  <g filter="url(#rough2)" opacity="0.3">
    <line x1="320" y1="80" x2="320" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="360" y1="80" x2="360" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="400" y1="80" x2="400" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="440" y1="80" x2="440" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="480" y1="80" x2="480" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="320" y1="80" x2="480" y2="80" stroke="#ccc" stroke-width="1"/>
    <line x1="320" y1="120" x2="480" y2="120" stroke="#ccc" stroke-width="1"/>
    <line x1="320" y1="160" x2="480" y2="160" stroke="#ccc" stroke-width="1"/>
    <line x1="320" y1="200" x2="480" y2="200" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- W0 at [0,0] -> pixel (360, 200) -->
  <circle cx="360" cy="200" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="204" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">W0</text>

  <!-- W1 at [2,1] -> pixel (400, 160) -->
  <circle cx="400" cy="160" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="164" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">W1</text>

  <!-- B0 at [1,2] -> pixel (360, 120) -->
  <rect x="348" y="108" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="124" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">B0</text>

  <!-- B1 at [3,3] -> pixel (440, 80) -->
  <rect x="428" y="68" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="84" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">B1</text>

  <!-- Optimal: W0→B0 (dist=3), W1→B1 (dist=3). Total=6 -->
  <path d="M 360 200 L 360 120" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="370" y="165" font-size="9" fill="#4a7a3a">d=3</text>

  <path d="M 400 160 L 440 80" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="428" y="115" font-size="9" fill="#4a7a3a">d=3</text>

  <rect x="310" y="230" width="210" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="250" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">总距离 = 3 + 3 = 6 ✓</text>

  <!-- ===== Bottom insight ===== -->
  <rect x="20" y="296" width="520" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="318" font-size="11.5" fill="#446688" font-weight="bold">💡 核心观察：为什么贪心失效？</text>
  <text x="40" y="338" font-size="10.5" fill="#555">贪心先选最近对 (W1, B0)=2，却让 W0 只能选远处的 B1=6。</text>
  <text x="40" y="354" font-size="10.5" fill="#555">而最优方案"牺牲"局部最优（W1→B1=3），换取整体更优（W0→B0=3）。</text>
  <text x="40" y="374" font-size="10.5" fill="#b85450" font-weight="bold">这是经典的指派问题 → 需要状压 DP 或匈牙利算法求全局最优。</text>
</svg>
