<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：words = ["gin","zen","gig","msg"]</text>

  <!-- Word 1: gin -->
  <text x="20" y="64" font-size="12" fill="#888">①</text>
  <rect x="40" y="48" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">gin</text>

  <text x="100" y="68" font-size="11" fill="#666">g=</text>
  <rect x="120" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="68" text-anchor="middle" font-size="11" fill="#333">--.</text>
  <text x="170" y="68" font-size="11" fill="#666">i=</text>
  <rect x="186" y="48" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="68" text-anchor="middle" font-size="11" fill="#333">..</text>
  <text x="228" y="68" font-size="11" fill="#666">n=</text>
  <rect x="244" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="68" text-anchor="middle" font-size="11" fill="#333">-.</text>

  <path d="M 294 62 L 326 62" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="48" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">--...-.</text>
  <text x="462" y="68" font-size="11" fill="#4a7a3a" font-weight="bold">→ 存入 set</text>

  <!-- Word 2: zen -->
  <text x="20" y="110" font-size="12" fill="#888">②</text>
  <rect x="40" y="94" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">zen</text>

  <text x="100" y="114" font-size="11" fill="#666">z=</text>
  <rect x="120" y="94" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="114" text-anchor="middle" font-size="11" fill="#333">--..</text>
  <text x="174" y="114" font-size="11" fill="#666">e=</text>
  <rect x="190" y="94" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="114" text-anchor="middle" font-size="11" fill="#333">.</text>
  <text x="228" y="114" font-size="11" fill="#666">n=</text>
  <rect x="244" y="94" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="114" text-anchor="middle" font-size="11" fill="#333">-.</text>

  <path d="M 294 108 L 326 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="94" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">--...-.</text>
  <text x="462" y="114" font-size="11" fill="#b85450" font-weight="bold">→ 重复，跳过</text>

  <!-- Word 3: gig -->
  <text x="20" y="156" font-size="12" fill="#888">③</text>
  <rect x="40" y="140" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">gig</text>

  <text x="100" y="160" font-size="11" fill="#666">g=</text>
  <rect x="120" y="140" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="160" text-anchor="middle" font-size="11" fill="#333">--.</text>
  <text x="170" y="160" font-size="11" fill="#666">i=</text>
  <rect x="186" y="140" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="160" text-anchor="middle" font-size="11" fill="#333">..</text>
  <text x="228" y="160" font-size="11" fill="#666">g=</text>
  <rect x="244" y="140" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="160" text-anchor="middle" font-size="11" fill="#333">--.</text>

  <path d="M 294 154 L 326 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="140" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">--...--.</text>
  <text x="462" y="160" font-size="11" fill="#4a7a3a" font-weight="bold">→ 存入 set</text>

  <!-- Word 4: msg -->
  <text x="20" y="202" font-size="12" fill="#888">④</text>
  <rect x="40" y="186" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">msg</text>

  <text x="100" y="206" font-size="11" fill="#666">m=</text>
  <rect x="120" y="186" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="206" text-anchor="middle" font-size="11" fill="#333">--</text>
  <text x="168" y="206" font-size="11" fill="#666">s=</text>
  <rect x="184" y="186" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="206" text-anchor="middle" font-size="11" fill="#333">...</text>
  <text x="238" y="206" font-size="11" fill="#666">g=</text>
  <rect x="254" y="186" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="206" text-anchor="middle" font-size="11" fill="#333">--.</text>

  <path d="M 304 200 L 326 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="186" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">--...--.</text>
  <text x="462" y="206" font-size="11" fill="#b85450" font-weight="bold">→ 重复，跳过</text>

  <!-- Divider -->
  <line x1="20" y1="240" x2="620" y2="240" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Set final state -->
  <text x="20" y="270" font-size="12" fill="#888">遍历结束，集合内容：</text>
  <rect x="40" y="284" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">--...-.</text>
  <text x="130" y="318" text-anchor="middle" font-size="10" fill="#888">来自 gin / zen</text>

  <rect x="240" y="284" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">--...--.</text>
  <text x="330" y="318" text-anchor="middle" font-size="10" fill="#888">来自 gig / msg</text>

  <rect x="440" y="284" width="170" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="525" y="310" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">size = 2 ⭐</text>

  <!-- Insight -->
  <text x="20" y="356" font-size="12" fill="#444" font-weight="bold">关键观察：</text>
  <text x="20" y="378" font-size="11" fill="#333">• 不同单词（gin/zen）可能映射到相同摩斯串——摩斯码本身不唯一解码</text>
  <text x="20" y="396" font-size="11" fill="#333">• 只关心"拼接串"是否相等，不关心原单词，所以集合去重天然适用</text>
  <text x="20" y="414" font-size="11" fill="#4a7a3a" font-weight="bold">→ 答案 = 集合大小 = 2</text>
</svg>
