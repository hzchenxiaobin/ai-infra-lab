<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：四组参数的分档选取与求和</text>

  <!-- ===== 表头 ===== -->
  <rect x="20" y="40" width="560" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">numOnes</text>
  <line x1="100" y1="44" x2="100" y2="68" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="135" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">numZeros</text>
  <line x1="175" y1="44" x2="175" y2="68" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="215" y="60" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">numNegOnes</text>
  <line x1="255" y1="44" x2="255" y2="68" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k</text>
  <line x1="305" y1="44" x2="305" y2="68" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">x₁(取1)</text>
  <line x1="395" y1="44" x2="395" y2="68" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="60" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">x₀(取0)</text>
  <line x1="475" y1="44" x2="475" y2="68" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="510" y="60" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">r(取−1)</text>
  <line x1="545" y1="44" x2="545" y2="68" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="572" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">和</text>

  <!-- ===== 第 1 行：示例 1 ===== -->
  <rect x="20" y="74" width="560" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="135" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="215" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="280" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="350" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="430" y="96" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <text x="510" y="96" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="552" y="78" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="572" y="96" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== 第 2 行：示例 2 ===== -->
  <rect x="20" y="110" width="560" height="34" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="135" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="215" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="350" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="430" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="510" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="552" y="114" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="572" y="132" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- ===== 第 3 行：被迫取 -1 ===== -->
  <rect x="20" y="146" width="560" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="135" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="215" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="280" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="350" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="430" y="168" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="510" y="168" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="552" y="150" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="572" y="168" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== 第 4 行：全取边界 ===== -->
  <rect x="20" y="182" width="560" height="34" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="135" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="215" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="280" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="350" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="430" y="204" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="510" y="204" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="552" y="186" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="572" y="204" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- ===== 注解框 ===== -->
  <rect x="20" y="232" width="560" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="36" y="254" font-size="12" fill="#b85450" font-weight="bold">⚠ 关键观察：x₁ + x₀ + r ≡ k（恰好取满），r 只在 1 和 0 用尽后才会 &gt; 0</text>

  <text x="36" y="276" font-size="11.5" fill="#333">• 第 1 行：k=2 ≤ numOnes=3，全取 <tspan font-weight="bold" fill="#4a7a3a">+1</tspan>，无需 0 / −1 → 和 = 2</text>
  <text x="36" y="294" font-size="11.5" fill="#333">• 第 2 行：k=4 &gt; 3，取尽 3 件 1 后用 1 件 <tspan font-weight="bold" fill="#d6a040">0</tspan> 凑数 → 和 = 3</text>
  <text x="36" y="312" font-size="11.5" fill="#333">• 第 3 行：k=6 &gt; numOnes+numZeros=5，被迫取 1 件 <tspan font-weight="bold" fill="#b85450">−1</tspan> → 和 = 3 − 1 = 2</text>
</svg>
