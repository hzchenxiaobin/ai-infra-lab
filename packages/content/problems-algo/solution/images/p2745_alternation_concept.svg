<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2745c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：AA/BB 必须交替，AB 永远可全用</text>

  <!-- Section 1: adjacency rules -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">相邻合法性</text>

  <!-- AA + AA -->
  <rect x="40" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">AA</text>
  <text x="80" y="83" font-size="14" fill="#888">+</text>
  <rect x="92" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">AA</text>
  <text x="136" y="83" font-size="12" fill="#b85450" font-weight="bold">→ AAAA 含 AAA ✗</text>

  <!-- BB + BB -->
  <rect x="40" y="100" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="119" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BB</text>
  <text x="80" y="119" font-size="14" fill="#888">+</text>
  <rect x="92" y="100" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="119" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BB</text>
  <text x="136" y="119" font-size="12" fill="#b85450" font-weight="bold">→ BBBB 含 BBB ✗</text>

  <!-- AA + BB -->
  <rect x="300" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">AA</text>
  <text x="340" y="83" font-size="14" fill="#888">+</text>
  <rect x="352" y="64" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BB</text>
  <text x="396" y="83" font-size="12" fill="#4a7a3a" font-weight="bold">→ AABB ✓</text>

  <!-- BB + AA -->
  <rect x="300" y="100" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="119" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BB</text>
  <text x="340" y="119" font-size="14" fill="#888">+</text>
  <rect x="352" y="100" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="119" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">AA</text>
  <text x="396" y="119" font-size="12" fill="#4a7a3a" font-weight="bold">→ BBAA ✓</text>

  <!-- Section 2: alternating chain -->
  <text x="40" y="158" font-size="12" fill="#446688" font-weight="bold">最优交替排列（x &gt; y 时以 AA 开头）</text>

  <rect x="40" y="168" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="60" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">AA</text>
  <text x="86" y="188" font-size="14" fill="#888">|</text>
  <rect x="92" y="168" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="112" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">BB</text>
  <text x="138" y="188" font-size="14" fill="#888">|</text>
  <rect x="144" y="168" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="164" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">AA</text>
  <text x="190" y="188" font-size="14" fill="#888">|</text>
  <rect x="196" y="168" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="216" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">BB</text>
  <text x="242" y="188" font-size="14" fill="#888">|</text>
  <rect x="248" y="168" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="268" y="188" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">AA</text>

  <text x="300" y="178" font-size="11" fill="#d6a040" font-weight="bold">用 (y+1) 个 AA</text>
  <text x="300" y="194" font-size="11" fill="#d6a040" font-weight="bold">和 y 个 BB</text>

  <rect x="40" y="206" width="470" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="275" y="223" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">交替块数 = 2·min(x,y) + (x≠y ? 1 : 0)</text>

  <!-- Section 3: AB insertion -->
  <text x="40" y="258" font-size="12" fill="#446688" font-weight="bold">AB 的插入位置（全部 z 个永远可用）</text>

  <!-- case 1: ends with BB, append AB -->
  <rect x="40" y="268" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="285" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">AA</text>
  <text x="86" y="285" font-size="13" fill="#888">|</text>
  <rect x="92" y="268" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="285" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BB</text>
  <path d="M140,281 L160,281" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2745c)" filter="url(#rough2)"/>
  <rect x="168" y="268" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="285" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">AB</text>
  <text x="214" y="285" font-size="11" fill="#4a7a3a" font-weight="bold">BB+AB=BBAB ✓（末尾是 BB）</text>

  <!-- case 2: ends with AA, prepend AB -->
  <rect x="40" y="306" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="57" y="323" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">AB</text>
  <path d="M80,319 L100,319" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2745c)" filter="url(#rough2)"/>
  <rect x="108" y="306" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="323" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">AA</text>
  <text x="154" y="323" font-size="13" fill="#888">|</text>
  <rect x="160" y="306" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="323" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BB</text>
  <text x="214" y="323" font-size="11" fill="#4a7a3a" font-weight="bold">AB+AA=ABAA ✓（末尾是 AA）</text>

  <!-- formula -->
  <rect x="40" y="346" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">answer = 2 × (2·min(x,y) + (x≠y ? 1 : 0)) + 2·z</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#446688">AB 不消耗 AA/BB 配额，只贡献 2z 长度</text>
</svg>
