<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">求和游戏：前半 vs 后半</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">Alice 想让两半和不等，Bob 想让两半和相等</text>

  <!-- example string "?3295???" -->
  <text x="50" y="86" font-size="11" fill="#888">示例 num = "?3295???"</text>

  <!-- left half boxes -->
  <g font-size="14">
    <rect x="50" y="96" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="74" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">?</text>

    <rect x="100" y="96" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="124" y="126" text-anchor="middle" fill="#446688">3</text>

    <rect x="150" y="96" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="174" y="126" text-anchor="middle" fill="#446688">2</text>

    <rect x="200" y="96" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="224" y="126" text-anchor="middle" fill="#446688">9</text>

    <!-- divider -->
    <path d="M 256 92 L 256 148" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

    <!-- right half boxes -->
    <rect x="262" y="96" width="48" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="286" y="126" text-anchor="middle" fill="#d6a040">5</text>

    <rect x="312" y="96" width="48" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="336" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">?</text>

    <rect x="362" y="96" width="48" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="386" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">?</text>

    <rect x="412" y="96" width="48" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="436" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">?</text>
  </g>

  <!-- labels -->
  <text x="149" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">前半 (left)</text>
  <text x="336" y="164" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">后半 (right)</text>

  <!-- stats boxes -->
  <g font-size="12">
    <rect x="40" y="178" width="220" height="76" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="56" y="200" fill="#446688">sumL = 3+2+9 = 14</text>
    <text x="56" y="220" fill="#b85450" font-weight="bold">qL = 1 个 '?'</text>
    <text x="56" y="240" fill="#888" font-size="10">左半数字和 / 左半问号数</text>

    <rect x="270" y="178" width="220" height="76" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="286" y="200" fill="#d6a040">sumR = 5</text>
    <text x="286" y="220" fill="#b85450" font-weight="bold">qR = 3 个 '?'</text>
    <text x="286" y="240" fill="#888" font-size="10">右半数字和 / 右半问号数</text>
  </g>

  <!-- diff calculation -->
  <rect x="120" y="268" width="360" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="292" font-size="13" fill="#b85450" font-weight="bold">diff = sumL − sumR = 14 − 5 = 9</text>
  <text x="140" y="312" font-size="11" fill="#888">Bob 需要 '?' 贡献 S = −diff = −9</text>

  <!-- winning conditions -->
  <rect x="40" y="338" width="250" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="360" font-size="12" fill="#4a7a3a" font-weight="bold">Alice 胜 ⇐ 末态 diff ≠ 0</text>
  <text x="56" y="378" font-size="11" fill="#4a7a3a">想方设法让 S ≠ −diff</text>
  <text x="56" y="394" font-size="10" fill="#888">每轮可填 0–9，极端值制造偏差</text>

  <rect x="310" y="338" width="250" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="326" y="360" font-size="12" fill="#b85450" font-weight="bold">Bob 胜 ⇐ 末态 diff = 0</text>
  <text x="326" y="378" font-size="11" fill="#b85450">需要 S 恰好 = −diff</text>
  <text x="326" y="394" font-size="10" fill="#888">互补策略锁定 S = 平衡值</text>
</svg>
