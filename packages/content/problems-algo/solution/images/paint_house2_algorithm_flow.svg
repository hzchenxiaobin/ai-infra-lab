<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：滚动 + 每行一遍扫描求「最小 / 次小」</text>

  <!-- 1. Init -->
  <rect x="160" y="40" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">初始化（空行哨兵）</text>
  <text x="270" y="73" text-anchor="middle" font-size="11" fill="#4a7a3a">min1 = 0, min2 = 0, idx = −1</text>
  <path d="M 270 80 L 270 92" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. Outer loop -->
  <rect x="150" y="94" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">外层循环 for row in costs</text>
  <text x="270" y="129" text-anchor="middle" font-size="10" fill="#888">逐幢房子推进，prev 三量滚动复用</text>
  <path d="M 270 138 L 270 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. Reset new min -->
  <rect x="170" y="152" width="200" height="38" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="270" y="170" text-anchor="middle" font-size="11" fill="#333">重置当行候选</text>
  <text x="270" y="184" text-anchor="middle" font-size="11" fill="#444">n0 = n1 = +∞, nidx = −1</text>
  <path d="M 270 190 L 270 202" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. Inner loop -->
  <rect x="150" y="204" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="223" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">内层循环 for c, v in row</text>
  <text x="270" y="239" text-anchor="middle" font-size="10" fill="#888">遍历 K 种颜色，O(K) 计算当行 dp</text>
  <path d="M 270 248 L 270 260" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. Compute cur -->
  <rect x="140" y="262" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取值（跳过同色）</text>
  <text x="270" y="298" text-anchor="middle" font-size="11" fill="#d6a040">cur = v + ( c == idx ? min2 : min1 )</text>
  <path d="M 270 306 L 270 318" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. Decision: update new min (diamond) -->
  <polygon points="270,320 360,352 270,384 180,352" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur &lt; n0 ?</text>
  <text x="270" y="366" text-anchor="middle" font-size="9" fill="#888">一遍扫描同步维护最小/次小</text>

  <!-- Yes branch -->
  <text x="408" y="346" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 360 352 L 470 352 L 470 300" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="408" y="266" width="124" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="281" text-anchor="middle" font-size="10" fill="#333">n1←n0; n0←cur</text>
  <text x="470" y="296" text-anchor="middle" font-size="10" fill="#333">nidx←c</text>

  <!-- No branch -->
  <text x="92" y="346" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 180 352 L 70 352 L 70 300" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="266" width="112" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="281" text-anchor="middle" font-size="10" fill="#333">elif cur &lt; n1</text>
  <text x="70" y="296" text-anchor="middle" font-size="10" fill="#333">n1←cur</text>

  <!-- inner loop back arrow: from after decision back up to inner loop -->
  <path d="M 470 266 L 470 224 L 390 224" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="478" y="246" font-size="9" fill="#446688">下一色 c</text>

  <!-- 7. Scroll prev -->
  <rect x="150" y="392" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="410" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">滚动（行末）</text>
  <text x="270" y="425" text-anchor="middle" font-size="11" fill="#d6a040">min1, min2, idx ← n0, n1, nidx</text>
  <path d="M 270 384 L 270 392" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer loop back arrow -->
  <path d="M 150 412 L 60 412 L 60 116 L 150 116" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="66" y="262" font-size="9" fill="#446688" transform="rotate(-90 66 262)">下一幢房子</text>

  <!-- 8. Return -->
  <rect x="170" y="432" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="453" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return min1</text>
  <path d="M 390 412 L 430 412 L 430 448 L 370 448" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="432" font-size="9" fill="#888">循环结束</text>
</svg>
