<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三种同步方案对比</text>

  <rect x="20" y="42" width="540" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">方案</text>
  <text x="215" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">核心原语</text>
  <text x="370" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">优点</text>
  <text x="510" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">缺点</text>

  <line x1="150" y1="42" x2="150" y2="295" stroke="#ddd" stroke-width="1"/>
  <line x1="285" y1="42" x2="285" y2="295" stroke="#ddd" stroke-width="1"/>
  <line x1="445" y1="42" x2="445" y2="295" stroke="#ddd" stroke-width="1"/>

  <rect x="28" y="80" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="90" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">互斥锁+条件变量</text>
  <text x="215" y="98" text-anchor="middle" font-size="10" fill="#444">mutex + condition_variable</text>
  <text x="370" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a">通用 · 可移植</text>
  <text x="370" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a">不忙等 · 唤醒精准</text>
  <text x="510" y="93" text-anchor="middle" font-size="10" fill="#b85450">代码略长</text>
  <text x="510" y="106" text-anchor="middle" font-size="10" fill="#b85450">需手动管 turn</text>

  <rect x="28" y="160" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="90" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">信号量</text>
  <text x="215" y="178" text-anchor="middle" font-size="10" fill="#444">semaphore × 2</text>
  <text x="370" y="173" text-anchor="middle" font-size="10" fill="#4a7a3a">直观 · 对称</text>
  <text x="370" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a">无显式 turn 变量</text>
  <text x="510" y="173" text-anchor="middle" font-size="10" fill="#b85450">C++ 需 C++20</text>
  <text x="510" y="186" text-anchor="middle" font-size="10" fill="#b85450">(counting_semaphore)</text>

  <rect x="28" y="240" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="90" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">原子自旋</text>
  <text x="215" y="258" text-anchor="middle" font-size="10" fill="#444">atomic&lt;bool&gt; + yield</text>
  <text x="370" y="253" text-anchor="middle" font-size="10" fill="#4a7a3a">无锁 · 极简</text>
  <text x="370" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a">无头文件依赖</text>
  <text x="510" y="253" text-anchor="middle" font-size="10" fill="#b85450">忙等浪费 CPU</text>
  <text x="510" y="266" text-anchor="middle" font-size="10" fill="#b85450">高并发下低效</text>

  <rect x="60" y="300" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="320" text-anchor="middle" font-size="11" fill="#444">面试推荐：mutex+condvar（通用）或 semaphore（简洁），自旋仅作对比</text>
</svg>
