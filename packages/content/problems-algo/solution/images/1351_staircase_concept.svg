<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：双单调矩阵 → 负数集中在右下角 → 从右上角走阶梯</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">行非递增 + 列非递增 ⇒ 非负数(蓝)在左上、负数(红)在右下，分界呈阶梯形</text>

  <!-- column index labels -->
  <g font-size="10" fill="#888">
    <text x="160" y="80" text-anchor="middle">col 0</text>
    <text x="220" y="80" text-anchor="middle">col 1</text>
    <text x="280" y="80" text-anchor="middle">col 2</text>
    <text x="340" y="80" text-anchor="middle">col 3</text>
  </g>

  <!-- row index labels -->
  <g font-size="10" fill="#888">
    <text x="118" y="119" text-anchor="end">row 0</text>
    <text x="118" y="165" text-anchor="end">row 1</text>
    <text x="118" y="211" text-anchor="end">row 2</text>
    <text x="118" y="257" text-anchor="end">row 3</text>
  </g>

  <!-- matrix cells: 4x4 -->
  <!-- row 0: 4, 3, 2, -1 -->
  <g font-size="17">
    <rect x="130" y="96" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="160" y="126" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="190" y="96" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="220" y="126" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="250" y="96" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="280" y="126" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="310" y="96" width="60" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="340" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
  </g>
  <!-- row 1: 3, 2, 1, -1 -->
  <g font-size="17">
    <rect x="130" y="142" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="160" y="172" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="190" y="142" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="220" y="172" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="250" y="142" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="280" y="172" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="310" y="142" width="60" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="340" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
  </g>
  <!-- row 2: 1, 1, -1, -2 -->
  <g font-size="17">
    <rect x="130" y="188" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="160" y="218" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="190" y="188" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="220" y="218" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="250" y="188" width="60" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="280" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
    <rect x="310" y="188" width="60" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="340" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">-2</text>
  </g>
  <!-- row 3: -1, -1, -2, -3 -->
  <g font-size="17">
    <rect x="130" y="234" width="60" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="160" y="264" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
    <rect x="190" y="234" width="60" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="220" y="264" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
    <rect x="250" y="234" width="60" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="280" y="264" text-anchor="middle" fill="#b85450" font-weight="bold">-2</text>
    <rect x="310" y="234" width="60" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="340" y="264" text-anchor="middle" fill="#b85450" font-weight="bold">-3</text>
  </g>

  <!-- staircase boundary (dashed) -->
  <path d="M 310 96 L 310 188 L 250 188 L 250 234 L 190 234 L 190 280 L 130 280 L 130 280"
        stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>

  <!-- start point marker at top-right (0,3) -->
  <circle cx="340" cy="96" r="7" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">起点 (0,3)</text>
  <path d="M 376 96 L 352 96" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- direction arrows: negative → left, non-negative → down -->
  <!-- left arrow from (0,3) -->
  <path d="M 335 88 L 295 88" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="400" y="88" font-size="10" fill="#b85450" font-weight="bold">&lt; 0 → 左移(吃整列)</text>

  <!-- down arrow from (0,2) -->
  <path d="M 280 132 L 280 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="390" y="142" font-size="10" fill="#446688" font-weight="bold">≥ 0 → 下移</text>

  <!-- right side explanation boxes -->
  <rect x="410" y="180" width="170" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="495" y="200" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">列非递增 ⇒</text>
  <text x="495" y="216" text-anchor="middle" font-size="11" fill="#666">grid[r][c]&lt;0 时</text>
  <text x="495" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">该列 row↓ 全是负数</text>

  <!-- bottom note -->
  <rect x="40" y="300" width="520" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">从右上角出发：负数则吃掉整列左移，非负则下移</text>
  <text x="300" y="342" text-anchor="middle" font-size="11" fill="#666">每步排除一行或一列 → 总步数 ≤ m+n → O(m+n)</text>
  <text x="300" y="358" text-anchor="middle" font-size="10" fill="#888">与 240.搜索二维矩阵II 的阶梯法同构</text>
</svg>
