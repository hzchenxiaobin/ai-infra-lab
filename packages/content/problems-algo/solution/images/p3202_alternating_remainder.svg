<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：相邻和同余 ⟺ 隔项同余 ⟺ 余数交替</text>

  <rect x="55" y="42" width="410" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(sub[0]+sub[1])%k == (sub[1]+sub[2])%k == ⋯</text>
  <text x="260" y="82" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">所有相邻对的和 mod k 都等于同一个值</text>

  <text x="260" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">取相邻两个等式，两边同减去 sub[i+1]：</text>

  <path d="M 260 116 L 260 130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="134" width="320" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="157" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">sub[i] ≡ sub[i+2] (mod k) —— 隔项同余！</text>

  <text x="96" y="212" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">余数</text>
  <text x="140" y="188" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">下标 0</text>
  <text x="188" y="188" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="236" y="188" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="284" y="188" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="332" y="188" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="380" y="188" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>

  <rect x="118" y="194" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="216" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="166" y="194" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="216" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="214" y="194" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="236" y="216" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="262" y="194" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="284" y="216" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="310" y="194" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="332" y="216" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="358" y="194" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="216" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>

  <text x="260" y="258" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">偶数位余数全为 a，奇数位全为 b（a 可以等于 b）</text>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">反向亦成立：a,b,a,b,… 交替时相邻和恒为 (a+b) % k</text>

  <rect x="90" y="292" width="340" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">有效子序列 ⇔ 余数按周期 2 交替的子序列</text>

  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">例：[1,2,3,4,5] mod 2 → 1,0,1,0,1（a=1,b=0 交替）✓</text>
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">　　[1,4,1,4] mod 3 → 1,1,1,1（a=b=1 的退化交替）✓</text>
</svg>
