<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口：维护「至多 K 种字符」的区间 [left, right]（K = 3）</text>

  <!-- Step 1: window = "abacc", right moves to 'd' (4th distinct char) -->
  <text x="40" y="68" font-size="12" fill="#888">扩张:</text>
  <rect x="90" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="136" y="52" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="182" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="228" y="52" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="274" y="52" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="320" y="52" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="366" y="52" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="73" text-anchor="middle" font-size="13" fill="#999">c</text>

  <!-- window bracket step1: [0,4] = "abacc" -->
  <path d="M 90 96 Q 90 104 96 104 L 312 104 Q 318 104 318 96" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="204" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 = "abacc"（3 种字符：a, b, c ≤ K）</text>

  <!-- right pointer hits 'd' = 4th distinct char -->
  <text x="342" y="44" text-anchor="middle" font-size="10" fill="#b85450">right → 第 4 种!</text>
  <path d="M 342 46 L 342 50" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Arrow: left must shrink until distinct ≤ 3 -->
  <text x="280" y="148" text-anchor="middle" font-size="11" fill="#d6a040">↓ 种类数 4 &gt; K = 3，left 右移收缩直到踢掉一种字符</text>

  <!-- Step 2: window = "accd" after shrinking left past index 0,1 -->
  <text x="40" y="184" font-size="12" fill="#888">收缩后:</text>
  <rect x="90" y="168" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="189" text-anchor="middle" font-size="13" fill="#999">a</text>
  <rect x="136" y="168" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="189" text-anchor="middle" font-size="13" fill="#999">b</text>
  <rect x="182" y="168" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="228" y="168" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="274" y="168" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="320" y="168" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="366" y="168" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="189" text-anchor="middle" font-size="13" fill="#999">c</text>

  <path d="M 182 212 Q 182 220 188 220 L 354 220 Q 360 220 360 212" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="271" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 = "accd"（left 跳到 2，踢掉了 b，恢复 3 种）</text>

  <!-- freq map illustration during shrink -->
  <text x="440" y="172" font-size="11" fill="#888">收缩时 freq:</text>
  <rect x="430" y="180" width="116" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="438" y="196" font-size="10" fill="#555">a:2  b:1  c:2  d:1</text>
  <text x="438" y="212" font-size="10" fill="#b85450">→ 种类 4 &gt; 3</text>
  <text x="438" y="226" font-size="10" fill="#b85450">移 a→1，仍 4 种</text>
  <text x="438" y="240" font-size="10" fill="#82b366">移 b→0，3 种 ✓</text>

  <!-- Core idea box -->
  <rect x="50" y="262" width="460" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心直觉：用 freq 哈希表维护窗口内每种字符的计数</text>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#666">right 不断右扩；种类数 &gt; K 时 left 逐个收缩，</text>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#666">直到某字符 freq 归 0（踢出该种类），恢复 ≤ K 种</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#888">答案 = 窗口最大宽度 max(right − left + 1)</text>
</svg>
