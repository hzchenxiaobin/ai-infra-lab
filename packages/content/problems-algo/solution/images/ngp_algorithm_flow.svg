<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历，边累加边计数</text>

  <!-- Start -->
  <ellipse cx="280" cy="56" rx="100" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#333">ans = 0，count = {}，i = 0</text>

  <path d="M 280 74 L 280 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision -->
  <polygon points="280,92 400,136 280,180 160,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#888">(还有元素)</text>

  <!-- No -> return ans -->
  <path d="M 400 136 L 470 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="128" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="470" y="118" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回</text>
  <text x="510" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans ⭐</text>

  <!-- Yes -->
  <path d="M 280 180 L 280 194" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="190" font-size="10" fill="#82b366">是</text>

  <!-- Step 1: ans += count[nums[i]] -->
  <rect x="110" y="198" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#333">① ans += count[nums[i]]   （新增 count 对）</text>

  <path d="M 280 232 L 280 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: count[nums[i]]++ -->
  <rect x="110" y="250" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#333">② count[nums[i]]++   （记录当前元素）</text>

  <path d="M 280 284 L 280 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: i++ -->
  <rect x="180" y="302" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#333">i++，回到循环开头</text>

  <!-- loop back arrow -->
  <path d="M 180 317 L 70 317 L 70 136 L 160 136" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="225" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 62 225)">继续下一个</text>

  <!-- Note -->
  <rect x="110" y="356" width="340" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">⚠️ 顺序：先累加后自增</text>
  <text x="280" y="394" text-anchor="middle" font-size="10" fill="#888">保证 count 里只有"之前"的同值元素，不含当前</text>
</svg>
