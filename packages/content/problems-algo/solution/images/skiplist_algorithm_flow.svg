<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="420" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">跳表三操作流程</text>
  <path d="M 300 40 Q 430 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: search ===== -->
  <g filter="url(#sk)">
    <rect x="20" y="55" width="260" height="345" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <text x="150" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">search(target)</text>
  <line x1="40" y1="88" x2="260" y2="88" stroke="#4a8e4a" stroke-width="1" filter="url(#sk)"/>

  <g filter="url(#sk)"><circle cx="45" cy="110" r="10" fill="#4a8e4a"/></g>
  <text x="45" y="114" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">1</text>
  <text x="62" y="114" font-size="11" fill="#333">从 head 最高层出发</text>

  <g filter="url(#sk)"><circle cx="45" cy="145" r="10" fill="#4a8e4a"/></g>
  <text x="45" y="149" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">2</text>
  <text x="62" y="149" font-size="11" fill="#333">向右走，直到 next ≥ target</text>

  <g filter="url(#sk)"><circle cx="45" cy="180" r="10" fill="#4a8e4a"/></g>
  <text x="45" y="184" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>
  <text x="62" y="184" font-size="11" fill="#2e6e2e" font-weight="bold">next == target → true</text>

  <g filter="url(#sk)"><circle cx="45" cy="215" r="10" fill="#4a8e4a"/></g>
  <text x="45" y="219" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">4</text>
  <text x="62" y="219" font-size="11" fill="#333">next &gt; target → 下降一层</text>

  <g filter="url(#sk)"><circle cx="45" cy="250" r="10" fill="#4a8e4a"/></g>
  <text x="45" y="254" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">5</text>
  <text x="62" y="254" font-size="11" fill="#b85450" font-weight="bold">到 L0 仍无 → false</text>

  <path d="M 45 122 L 45 133" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 45 157 L 45 168" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 45 192 L 45 203" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 45 227 L 45 238" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="62" y="290" font-size="10" fill="#888">回退箭头：步骤4后回到步骤2</text>
  <path d="M 30 250 Q 20 180 30 110" stroke="#bbb" stroke-width="1" fill="none" stroke-dasharray="3 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="62" y="310" font-size="10" fill="#7a5415">★ 每层最多走几步就降层</text>
  <text x="62" y="330" font-size="10" fill="#7a5415">  总步数 O(log n)</text>

  <!-- ===== Panel 2: add ===== -->
  <g filter="url(#sk)">
    <rect x="300" y="55" width="260" height="345" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">add(num)</text>
  <line x1="320" y1="88" x2="540" y2="88" stroke="#4a8edb" stroke-width="1" filter="url(#sk)"/>

  <g filter="url(#sk)"><circle cx="325" cy="110" r="10" fill="#4a8edb"/></g>
  <text x="325" y="114" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">1</text>
  <text x="342" y="114" font-size="11" fill="#333">查找各层前驱 prevs[]</text>

  <g filter="url(#sk)"><circle cx="325" cy="150" r="10" fill="#4a8edb"/></g>
  <text x="325" y="154" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">2</text>
  <text x="342" y="154" font-size="11" fill="#333">随机掷币生成层数 lv</text>
  <text x="342" y="168" font-size="9" fill="#888">while rand()&amp;1 &amp;&amp; lv&lt;32: lv++</text>

  <g filter="url(#sk)"><circle cx="325" cy="195" r="10" fill="#4a8edb"/></g>
  <text x="325" y="199" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>
  <text x="342" y="199" font-size="11" fill="#333">lv &gt; maxLevel → 扩展</text>

  <g filter="url(#sk)"><circle cx="325" cy="235" r="10" fill="#4a8edb"/></g>
  <text x="325" y="239" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">4</text>
  <text x="342" y="239" font-size="11" fill="#333">新建 node(lv 层)</text>

  <g filter="url(#sk)"><circle cx="325" cy="275" r="10" fill="#4a8edb"/></g>
  <text x="325" y="279" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">5</text>
  <text x="342" y="279" font-size="11" fill="#2e6e2e" font-weight="bold">逐层插入：prev→node→next</text>

  <path d="M 325 122 L 325 138" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 325 162 L 325 183" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 325 207 L 325 223" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 325 247 L 325 263" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="342" y="315" font-size="10" fill="#7a5415">★ node 出现在 0 ~ lv-1 层</text>
  <text x="342" y="335" font-size="10" fill="#7a5415">  每层前驱已由步骤1找到</text>
  <text x="342" y="355" font-size="10" fill="#7a5415">  插入 = 改两个指针</text>

  <!-- ===== Panel 3: erase ===== -->
  <g filter="url(#sk)">
    <rect x="580" y="55" width="260" height="345" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <text x="710" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">erase(num)</text>
  <line x1="600" y1="88" x2="820" y2="88" stroke="#b85450" stroke-width="1" filter="url(#sk)"/>

  <g filter="url(#sk)"><circle cx="605" cy="110" r="10" fill="#b85450"/></g>
  <text x="605" y="114" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">1</text>
  <text x="622" y="114" font-size="11" fill="#333">查找各层前驱 prevs[]</text>

  <g filter="url(#sk)"><circle cx="605" cy="150" r="10" fill="#b85450"/></g>
  <text x="605" y="154" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">2</text>
  <text x="622" y="154" font-size="11" fill="#b85450" font-weight="bold">L0 无此值 → false</text>

  <g filter="url(#sk)"><circle cx="605" cy="195" r="10" fill="#b85450"/></g>
  <text x="605" y="199" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>
  <text x="622" y="199" font-size="11" fill="#333">逐层摘除 prev→next</text>
  <text x="622" y="213" font-size="9" fill="#888">跳过被删节点的所有层</text>

  <g filter="url(#sk)"><circle cx="605" cy="245" r="10" fill="#b85450"/></g>
  <text x="605" y="249" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">4</text>
  <text x="622" y="249" font-size="11" fill="#333">delete node</text>

  <g filter="url(#sk)"><circle cx="605" cy="285" r="10" fill="#b85450"/></g>
  <text x="605" y="289" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">5</text>
  <text x="622" y="289" font-size="11" fill="#333">清理空顶层 maxLevel--</text>

  <path d="M 605 122 L 605 138" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 605 162 L 605 183" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 605 207 L 605 233" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 605 257 L 605 273" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="622" y="325" font-size="10" fill="#7a5415">★ 节点可能在多层出现</text>
  <text x="622" y="345" font-size="10" fill="#7a5415">  每层都要断开前驱指针</text>
  <text x="622" y="365" font-size="10" fill="#7a5415">  顶层空了就 maxLevel--</text>
</svg>
