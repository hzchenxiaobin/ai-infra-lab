<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">从相邻词对提取字母偏序：找首个不同字符 → 建有向边</text>

  <!-- ====== Pair 1: wrt vs wrf → t→f (y=50) ====== -->
  <rect x="45" y="46" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="54" y="62" text-anchor="middle" font-size="11" fill="#333">w</text>
  <rect x="65" y="46" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="74" y="62" text-anchor="middle" font-size="11" fill="#333">r</text>
  <rect x="85" y="46" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="94" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t</text>
  <text x="122" y="62" font-size="11" fill="#888">vs</text>
  <rect x="145" y="46" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="154" y="62" text-anchor="middle" font-size="11" fill="#333">w</text>
  <rect x="165" y="46" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="174" y="62" text-anchor="middle" font-size="11" fill="#333">r</text>
  <rect x="185" y="46" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f</text>
  <path d="M 215 57 L 245 57" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="62" font-size="12" fill="#d6a040" font-weight="bold">t → f</text>

  <!-- ====== Pair 2: wrf vs er → w→e (y=88) ====== -->
  <rect x="45" y="84" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="54" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">w</text>
  <rect x="65" y="84" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="74" y="100" text-anchor="middle" font-size="11" fill="#333">r</text>
  <rect x="85" y="84" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="94" y="100" text-anchor="middle" font-size="11" fill="#333">f</text>
  <text x="122" y="100" font-size="11" fill="#888">vs</text>
  <rect x="145" y="84" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="154" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <rect x="165" y="84" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="174" y="100" text-anchor="middle" font-size="11" fill="#333">r</text>
  <path d="M 195 95 L 245 95" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="100" font-size="12" fill="#d6a040" font-weight="bold">w → e</text>

  <!-- ====== Pair 3: er vs ett → r→t (y=126) ====== -->
  <rect x="45" y="122" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="54" y="138" text-anchor="middle" font-size="11" fill="#333">e</text>
  <rect x="65" y="122" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="74" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r</text>
  <text x="100" y="138" font-size="11" fill="#888">vs</text>
  <rect x="125" y="122" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="134" y="138" text-anchor="middle" font-size="11" fill="#333">e</text>
  <rect x="145" y="122" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="154" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t</text>
  <rect x="165" y="122" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="174" y="138" text-anchor="middle" font-size="11" fill="#333">t</text>
  <path d="M 195 133 L 245 133" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="138" font-size="12" fill="#d6a040" font-weight="bold">r → t</text>

  <!-- ====== Pair 4: ett vs rftt → e→r (y=164) ====== -->
  <rect x="45" y="160" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="54" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <rect x="65" y="160" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="74" y="176" text-anchor="middle" font-size="11" fill="#333">t</text>
  <rect x="85" y="160" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="94" y="176" text-anchor="middle" font-size="11" fill="#333">t</text>
  <text x="122" y="176" font-size="11" fill="#888">vs</text>
  <rect x="145" y="160" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="154" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r</text>
  <rect x="165" y="160" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="174" y="176" text-anchor="middle" font-size="11" fill="#333">f</text>
  <rect x="185" y="160" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="194" y="176" text-anchor="middle" font-size="11" fill="#333">t</text>
  <rect x="205" y="160" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="214" y="176" text-anchor="middle" font-size="11" fill="#333">t</text>
  <path d="M 235 171 L 245 171" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="176" font-size="12" fill="#d6a040" font-weight="bold">e → r</text>

  <!-- separator -->
  <line x1="40" y1="200" x2="520" y2="200" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#888">合并 4 条偏序边 → 有向图（DAG）</text>

  <!-- ====== DAG: w→e→r→t→f (y=260) ====== -->
  <!-- Edges -->
  <path d="M 114 285 L 176 285" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 214 285 L 276 285" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 314 285 L 376 285" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 414 285 L 476 285" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Nodes -->
  <circle cx="90" cy="285" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">w</text>

  <circle cx="200" cy="285" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>

  <circle cx="310" cy="285" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">r</text>

  <circle cx="390" cy="285" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">t</text>

  <circle cx="500" cy="285" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>

  <!-- Indegree badges -->
  <circle cx="108" cy="268" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="108" y="272" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">0</text>

  <circle cx="218" cy="268" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="218" y="272" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">1</text>

  <circle cx="328" cy="268" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="328" y="272" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">1</text>

  <circle cx="408" cy="268" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="408" y="272" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">1</text>

  <circle cx="518" cy="268" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="518" y="272" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">1</text>

  <!-- callout for w -->
  <text x="90" y="335" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">入度=0 起点</text>

  <!-- legend -->
  <rect x="40" y="355" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="367" font-size="11" fill="#555">橙框 = 首个不同字符</text>
  <rect x="200" y="355" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="367" font-size="11" fill="#555">角标 = 入度</text>

  <!-- Bottom note -->
  <rect x="40" y="382" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="403" text-anchor="middle" font-size="11" fill="#444">每对相邻词只贡献「首个不同字符」的偏序；前面的相同前缀不提供任何顺序信息</text>
</svg>
