<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例 1 演算：n=3，logs 排序后=[[1,3],[1,5],[2,6]]，x=5</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">查询排序后 = [(10, 0), (11, 1)]；j=k=0；cnt={}</text>

  <!-- ============ Table grid ============
       columns: 查询 | 窗口[l,r] | k 添加(time≤r) | j 删除(time<l) | cnt(有请求) | ans
       x boundaries: 10,100,190,320,450,540,580  (widths 90,90,130,130,90,40 = 570 -> 10..580) -->
  <!-- header row y=58..88 -->
  <rect x="10" y="58" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">查询(r,i)</text>

  <rect x="100" y="58" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">窗口[l,r]</text>

  <rect x="190" y="58" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="255" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">k 添加(time≤r)</text>

  <rect x="320" y="58" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="385" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">j 删除(time&lt;l)</text>

  <rect x="450" y="58" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="495" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">cnt(有请求)</text>

  <rect x="540" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="560" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">ans</text>

  <!-- ===== Row Q0: y=88..158 ===== -->
  <rect x="10" y="88" width="90" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Q0</text>
  <text x="55" y="134" text-anchor="middle" font-size="10" fill="#888">r=10,i=0</text>

  <rect x="100" y="88" width="90" height="70" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[5, 10]</text>

  <rect x="190" y="88" width="130" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="255" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a">+(1, t=3)</text>
  <text x="255" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a">+(1, t=5)</text>
  <text x="255" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a">+(2, t=6)</text>

  <rect x="320" y="88" width="130" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="385" y="128" text-anchor="middle" font-size="10" fill="#b85450">−(1, t=3)</text>

  <rect x="450" y="88" width="90" height="70" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="120" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">{1:1, 2:1}</text>
  <text x="495" y="138" text-anchor="middle" font-size="9" fill="#888">size=2</text>

  <rect x="540" y="88" width="40" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="560" y="128" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>

  <!-- ===== Row Q1: y=158..228 ===== -->
  <rect x="10" y="158" width="90" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Q1</text>
  <text x="55" y="204" text-anchor="middle" font-size="10" fill="#888">r=11,i=1</text>

  <rect x="100" y="158" width="90" height="70" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[6, 11]</text>

  <rect x="190" y="158" width="130" height="70" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="198" text-anchor="middle" font-size="10" fill="#888">（无，k 已到尾）</text>

  <rect x="320" y="158" width="130" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="385" y="198" text-anchor="middle" font-size="10" fill="#b85450">−(1, t=5)</text>

  <rect x="450" y="158" width="90" height="70" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="190" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">{2:1}</text>
  <text x="495" y="208" text-anchor="middle" font-size="9" fill="#888">size=1</text>

  <rect x="540" y="158" width="40" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="560" y="198" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <!-- between rows hint: pointer movement -->
  <path d="M 555 158 L 555 158" stroke="none"/>
  <text x="300" y="250" text-anchor="middle" font-size="10" fill="#446688">Q0 → Q1：r 10→11、l 5→6；k 不动（已到尾），j 右移删去 (1,t=5)</text>

  <!-- result box -->
  <rect x="150" y="268" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果 ans = [1, 2] ✓</text>
  <text x="300" y="304" text-anchor="middle" font-size="10" fill="#555">每条日志最多被加 1 次、删 1 次，j/k 跨查询复用只右移</text>

  <!-- legend -->
  <rect x="30" y="326" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="338" font-size="9" fill="#4a7a3a">k 添加</text>
  <rect x="110" y="326" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="130" y="338" font-size="9" fill="#b85450">j 删除</text>
  <text x="180" y="338" font-size="9" fill="#888">ans = n − cnt.size() = 总服务器数 − 窗口内有请求的服务器数</text>
</svg>
