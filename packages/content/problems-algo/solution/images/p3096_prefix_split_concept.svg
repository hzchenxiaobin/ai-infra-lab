<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：0 记 −1，唯一的自由度是「在哪切」</text>

  <!-- possible row -->
  <text x="62" y="67" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">possible =</text>
  <rect x="115" y="46" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="141" y="67" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="171" y="46" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="197" y="67" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="227" y="46" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="67" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="283" y="46" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="309" y="67" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- conversion arrow -->
  <path d="M 225 84 L 225 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="242" y="101" font-size="11" fill="#555" filter="url(#rough2)">分数化：1 → +1，0 → −1</text>

  <!-- converted row -->
  <text x="66" y="137" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">a =</text>
  <rect x="115" y="116" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="141" y="137" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="171" y="116" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="197" y="137" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="227" y="116" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="137" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="283" y="116" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="309" y="137" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- cut line -->
  <path d="M 169 108 L 169 154" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="169" y="104" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">切点 i = 1</text>

  <!-- ownership -->
  <rect x="108" y="158" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="138" y="177" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Alice</text>
  <rect x="176" y="158" width="164" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="258" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Bob（被迫拿剩余全部）</text>

  <!-- scores -->
  <text x="138" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">得分 +1</text>
  <text x="258" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">得分 = −1+1−1 = −1</text>
  <text x="260" y="234" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1 &gt; −1：切在这里，Alice 赢</text>

  <!-- formula panel -->
  <rect x="30" y="248" width="460" height="136" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">代数化：胜负只与前缀和有关</text>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">P(i) = a[0] + ⋯ + a[i−1]（Alice 打前 i 关的得分），T = 全部之和</text>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">Bob 没有选择权，得分 = T − P(i)</text>
  <rect x="80" y="334" width="360" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">Alice 赢 ⟺ P(i) &gt; T − P(i) ⟺ 2·P(i) &gt; T</text>
</svg>
