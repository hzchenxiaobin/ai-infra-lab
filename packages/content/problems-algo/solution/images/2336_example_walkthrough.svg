<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：8 次操作的 cur 与 added 变化（输出 [1,2,3,1,4,5]）</text>

  <!-- Header row -->
  <rect x="20" y="38" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <text x="150" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作</text>
  <text x="280" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur（前→后）</text>
  <text x="410" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">added（前→后）</text>
  <text x="540" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回</text>

  <!-- Row 1: addBack(2), cur 1->1, added {} -> {}, null (no-op) -->
  <rect x="20" y="70" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="89" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="150" y="89" text-anchor="middle" font-size="11" fill="#666">addBack(2)</text>
  <text x="280" y="89" text-anchor="middle" font-size="11" fill="#888">1 → 1</text>
  <text x="410" y="89" text-anchor="middle" font-size="11" fill="#888">{} → {}</text>
  <text x="540" y="89" text-anchor="middle" font-size="11" fill="#999">null</text>

  <!-- Row 2: popSmallest, cur 1->2, {}->{}, return 1 -->
  <rect x="20" y="102" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="121" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="121" text-anchor="middle" font-size="11" fill="#333">popSmallest</text>
  <text x="280" y="121" text-anchor="middle" font-size="11" fill="#446688">1 → 2</text>
  <text x="410" y="121" text-anchor="middle" font-size="11" fill="#888">{} → {}</text>
  <text x="540" y="121" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Row 3: popSmallest, cur 2->3, return 2 -->
  <rect x="20" y="134" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="153" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="150" y="153" text-anchor="middle" font-size="11" fill="#333">popSmallest</text>
  <text x="280" y="153" text-anchor="middle" font-size="11" fill="#446688">2 → 3</text>
  <text x="410" y="153" text-anchor="middle" font-size="11" fill="#888">{} → {}</text>
  <text x="540" y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- Row 4: popSmallest, cur 3->4, return 3 -->
  <rect x="20" y="166" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="185" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="150" y="185" text-anchor="middle" font-size="11" fill="#333">popSmallest</text>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#446688">3 → 4</text>
  <text x="410" y="185" text-anchor="middle" font-size="11" fill="#888">{} → {}</text>
  <text x="540" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- Row 5: addBack(1), cur 4->4, {}->{1}, null (highlight: push into heap) -->
  <rect x="20" y="198" width="560" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="217" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="150" y="217" text-anchor="middle" font-size="11" fill="#333">addBack(1)</text>
  <text x="280" y="217" text-anchor="middle" font-size="11" fill="#888">4 → 4</text>
  <text x="410" y="217" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">{} → {1}</text>
  <text x="540" y="217" text-anchor="middle" font-size="11" fill="#999">null</text>

  <!-- Row 6: popSmallest, cur 4->4, {1}->{}, return 1 (highlight: take from heap) -->
  <rect x="20" y="230" width="560" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="249" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="150" y="249" text-anchor="middle" font-size="11" fill="#333">popSmallest</text>
  <text x="280" y="249" text-anchor="middle" font-size="11" fill="#888">4 → 4</text>
  <text x="410" y="249" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{1} → {}</text>
  <text x="540" y="249" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 7: popSmallest, cur 4->5, {}->{}, return 4 -->
  <rect x="20" y="262" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="281" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="150" y="281" text-anchor="middle" font-size="11" fill="#333">popSmallest</text>
  <text x="280" y="281" text-anchor="middle" font-size="11" fill="#446688">4 → 5</text>
  <text x="410" y="281" text-anchor="middle" font-size="11" fill="#888">{} → {}</text>
  <text x="540" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- Row 8: popSmallest, cur 5->6, {}->{}, return 5 -->
  <rect x="20" y="294" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="313" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="150" y="313" text-anchor="middle" font-size="11" fill="#333">popSmallest</text>
  <text x="280" y="313" text-anchor="middle" font-size="11" fill="#446688">5 → 6</text>
  <text x="410" y="313" text-anchor="middle" font-size="11" fill="#888">{} → {}</text>
  <text x="540" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- bottom note -->
  <rect x="20" y="330" width="560" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="345" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">步骤 5 入回收堆；步骤 6 从堆顶取 1（cur 不动）；步骤 7 才轮到 cur 自增取 4</text>
</svg>
