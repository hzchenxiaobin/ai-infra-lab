<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：四步纯算术，无循环无递归</text>

  <!-- Step 1: minute angle -->
  <rect x="40" y="48" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="68" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 1：算分针角度（每分钟 6°）</text>
  <text x="60" y="88" font-size="11" fill="#444" font-family="monospace">minuteAngle = minutes × 6.0</text>
  <text x="60" y="100" font-size="10" fill="#888">60 分钟转一圈 360°，故每分钟 360°/60 = 6°</text>

  <path d="M 260 108 L 260 128" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: hour angle -->
  <rect x="40" y="132" width="440" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="152" font-size="12" fill="#446688" font-weight="bold">步骤 2：算时针角度（每小时 30° + 每分钟漂移 0.5°）</text>
  <text x="60" y="172" font-size="11" fill="#444" font-family="monospace">hourAngle = (hour % 12) × 30.0 + minutes × 0.5</text>
  <text x="60" y="188" font-size="10" fill="#888">12 小时转一圈 360° → 每小时 30°；分针走 60 分钟时针走 30° → 每分钟 0.5°</text>
  <text x="60" y="198" font-size="10" fill="#b85450">⚠️ hour % 12 把 12 点归零；切勿漏掉 minutes × 0.5 这一项</text>

  <path d="M 260 204 L 260 224" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: diff -->
  <rect x="40" y="228" width="440" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="248" font-size="12" fill="#b85450" font-weight="bold">步骤 3：求两针绝对差</text>
  <text x="60" y="268" font-size="11" fill="#444" font-family="monospace">diff = |hourAngle − minuteAngle|</text>

  <path d="M 260 282 L 260 302" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: min -->
  <rect x="40" y="306" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="326" font-size="12" fill="#d6a040" font-weight="bold">步骤 4：取较小角并返回</text>
  <text x="60" y="346" font-size="11" fill="#444" font-family="monospace">return min(diff, 360.0 − diff)</text>
  <text x="60" y="358" font-size="10" fill="#888">两针把圆周分成互补两角（和 360°），题目要较小者</text>
</svg>
