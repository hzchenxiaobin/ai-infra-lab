<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">fillna(0)：缺失位填 0，其余原样</text>

  <!-- Left: original Series -->
  <rect x="20" y="58" width="155" height="212" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="97" y="80" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">quantity（原 Series）</text>

  <rect x="45" y="92" width="105" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">32</text>

  <rect x="45" y="124" width="105" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="143" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">NaN</text>

  <rect x="45" y="156" width="105" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="175" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">NaN</text>

  <rect x="45" y="188" width="105" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">849</text>

  <text x="97" y="242" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">缺失位被规范为 NaN</text>
  <text x="97" y="258" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">（整列 dtype 变 float64）</text>

  <!-- Middle: fillna -->
  <text x="226" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">NaN 的位置 → 0</text>
  <path d="M 182 132 L 242 132" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="146" width="112" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="226" y="168" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">fillna(0)</text>
  <text x="226" y="188" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">单趟向量化扫描</text>
  <text x="226" y="204" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">返回新 Series</text>
  <text x="226" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">其余值原样拷贝</text>

  <!-- Right: new Series -->
  <rect x="275" y="58" width="200" height="212" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">quantity（新 Series）</text>

  <rect x="325" y="92" width="100" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">32</text>

  <rect x="325" y="124" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="143" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="325" y="156" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="175" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="325" y="188" width="100" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">849</text>

  <text x="432" y="110" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">← 原样</text>
  <text x="432" y="142" text-anchor="start" font-size="9" fill="#4a7a3a" filter="url(#rough2)">← 替换</text>
  <text x="432" y="174" text-anchor="start" font-size="9" fill="#4a7a3a" filter="url(#rough2)">← 替换</text>
  <text x="432" y="206" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">← 原样</text>

  <text x="375" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">仅 NaN 位被替换</text>
  <text x="375" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">行数 · 行序不变</text>

  <!-- Bottom warning -->
  <rect x="55" y="290" width="450" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ NaN ≠ NaN：比较运算全失效</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">quantity == None / == np.nan → 永远筛不出（NaN 与谁都不等）</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">检测缺失唯一正道：isna() / notna()</text>
</svg>
