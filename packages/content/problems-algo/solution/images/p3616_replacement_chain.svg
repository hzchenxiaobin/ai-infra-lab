<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：替换 ⇔ 严格刷新历史最优 cur</text>
  <text x="26" y="46" font-size="11" fill="#666" filter="url(#rough2)">示例 ranks = [5, 2, 3, 1, 4]</text>
  <text x="494" y="46" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">蓝=初始选中　橙=触发替换　灰=不动</text>

  <!-- 到达顺序 -->
  <text x="260" y="64" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">到达顺序 →</text>

  <!-- 到达流：五个学生 -->
  <circle cx="62" cy="88" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="93" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="152" cy="88" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="152" y="93" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="242" cy="88" r="20" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="242" y="93" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">3</text>
  <circle cx="332" cy="88" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="332" y="93" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="422" cy="88" r="20" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="422" y="93" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">4</text>

  <!-- 到达箭头 -->
  <path d="M 86 88 L 126 88" stroke="#999" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 176 88 L 216 88" stroke="#999" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 266 88 L 306 88" stroke="#999" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 356 88 L 396 88" stroke="#999" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 触发者：虚线下行到选中链 -->
  <path d="M 62 110 L 62 162" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 110 L 152 162" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 332 110 L 332 162" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 不触发者：打叉 -->
  <path d="M 242 110 L 242 138" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="242" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="252" y="152" font-size="9" fill="#999" filter="url(#rough2)">不优于 cur</text>
  <path d="M 422 110 L 422 138" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="422" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 选中链 -->
  <circle cx="62" cy="188" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="62" y="194" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="152" cy="188" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="152" y="194" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="332" cy="188" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="332" y="194" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <!-- 链上替换箭头 -->
  <path d="M 88 188 L 124 188" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="106" y="178" text-anchor="middle" font-size="10" fill="#b07818" filter="url(#rough2)">替换①</text>
  <path d="M 178 188 L 302 188" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="240" y="178" text-anchor="middle" font-size="10" fill="#b07818" filter="url(#rough2)">替换②</text>
  <text x="430" y="192" font-size="10" fill="#666" filter="url(#rough2)">选中链</text>
  <text x="430" y="205" font-size="10" fill="#666" filter="url(#rough2)">严格递减</text>

  <!-- cur 序列 -->
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cur 序列（前缀最小值）</text>
  <rect x="39" y="242" width="46" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="129" y="242" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="219" y="242" width="46" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="263" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">2</text>
  <rect x="309" y="242" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="399" y="242" width="46" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="263" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">1</text>

  <!-- 结论框 -->
  <rect x="36" y="292" width="448" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">ans = cur 严格下降的次数 = 2（选中链 5 → 2 → 1，终点是全局最小）</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">不变量：cur ≡ min(ranks[0..i−1]) —— 比较对象是历史最优，不是前一个学生</text>
</svg>
