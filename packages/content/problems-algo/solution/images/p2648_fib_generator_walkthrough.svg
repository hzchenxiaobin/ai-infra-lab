<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：callCount = 5，连调 5 次 next()</text>

  <!-- Table header -->
  <rect x="20" y="48" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第几次 next</text>

  <rect x="100" y="48" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="68" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">yield 前  prev / curr</text>

  <rect x="280" y="48" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">产出值</text>

  <rect x="380" y="48" width="200" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="68" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">滚动后  prev / curr</text>

  <!-- Row 1 -->
  <rect x="20" y="84" width="80" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="107" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="100" y="84" width="180" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="107" text-anchor="middle" font-size="12" fill="#333">0  /  1</text>
  <rect x="280" y="84" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="107" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="380" y="84" width="200" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="107" text-anchor="middle" font-size="12" fill="#333">1  /  1</text>

  <!-- Row 2 -->
  <rect x="20" y="124" width="80" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="147" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="124" width="180" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="147" text-anchor="middle" font-size="12" fill="#333">1  /  1</text>
  <rect x="280" y="124" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="147" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="380" y="124" width="200" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="147" text-anchor="middle" font-size="12" fill="#333">1  /  2</text>

  <!-- Row 3 -->
  <rect x="20" y="164" width="80" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="100" y="164" width="180" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="187" text-anchor="middle" font-size="12" fill="#333">1  /  2</text>
  <rect x="280" y="164" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="187" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="380" y="164" width="200" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="187" text-anchor="middle" font-size="12" fill="#333">2  /  3</text>

  <!-- Row 4 -->
  <rect x="20" y="204" width="80" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="204" width="180" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="227" text-anchor="middle" font-size="12" fill="#333">2  /  3</text>
  <rect x="280" y="204" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="227" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="380" y="204" width="200" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="227" text-anchor="middle" font-size="12" fill="#333">3  /  5</text>

  <!-- Row 5 -->
  <rect x="20" y="244" width="80" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="267" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="100" y="244" width="180" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="267" text-anchor="middle" font-size="12" fill="#333">3  /  5</text>
  <rect x="280" y="244" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="267" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="380" y="244" width="200" height="36" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="267" text-anchor="middle" font-size="12" fill="#333">5  /  8</text>

  <!-- output box -->
  <rect x="20" y="300" width="560" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="324" font-size="12" fill="#333" font-weight="bold">输出：</text>
  <text x="100" y="324" font-size="14" fill="#4a7a3a" font-weight="bold">[0, 1, 1, 2, 3]</text>

  <!-- note -->
  <rect x="20" y="352" width="560" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">每次 next() = 一次 yield + 一次滚动，共 O(1)；5 次总计 O(n)</text>
</svg>
