<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 0 820 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="820" height="580" fill="#fdfcf7"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">地图分析：算法流程图</text>
  <path d="M 240 38 Q 410 46 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: scan grid -->
  <g filter="url(#sk)">
    <rect x="300" y="56" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="410" y="80" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">① 扫描网格：统计陆地数，收集陆地坐标</text>
  <path d="M 410 96 L 410 112" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision: has land and ocean? -->
  <g filter="url(#sk)">
    <path d="M 410 112 L 510 152 L 410 192 L 310 152 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="410" y="148" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">同时有陆地</text>
  <text x="410" y="164" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">和海洋？</text>

  <!-- No branch: return -1 -->
  <path d="M 310 152 L 200 152" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="255" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="80" y="134" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="140" y="157" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">返回 -1</text>

  <!-- Yes branch -->
  <path d="M 410 192 L 410 208" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="422" y="204" font-size="10" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- Step 2: all land into queue -->
  <g filter="url(#sk)">
    <rect x="290" y="208" width="240" height="40" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="410" y="232" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">② 所有陆地坐标入队，dist = 0</text>
  <path d="M 410 248 L 410 264" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- BFS loop header -->
  <g filter="url(#sk)">
    <rect x="280" y="264" width="260" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="410" y="287" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">③ while 队列不空：</text>
  <path d="M 410 300 L 410 316" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- size = q.size() -->
  <g filter="url(#sk)">
    <rect x="320" y="316" width="180" height="32" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="410" y="337" text-anchor="middle" font-size="11" fill="#444">size = q.size()（当前层）</text>
  <path d="M 410 348 L 410 364" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- for loop -->
  <g filter="url(#sk)">
    <rect x="300" y="364" width="220" height="32" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="410" y="385" text-anchor="middle" font-size="11" fill="#444">for i in range(size): pop (r,c)</text>
  <path d="M 410 396 L 410 412" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- expand neighbors -->
  <g filter="url(#sk)">
    <rect x="270" y="412" width="280" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="410" y="430" text-anchor="middle" font-size="11" fill="#444">遍历四邻居 (nr,nc)</text>
  <text x="410" y="446" text-anchor="middle" font-size="11" fill="#444">若是海洋且未访问 → dist=cur+1，入队</text>
  <path d="M 410 456 L 410 472" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- after layer: dist++ -->
  <g filter="url(#sk)">
    <rect x="320" y="472" width="180" height="32" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="410" y="493" text-anchor="middle" font-size="11" fill="#444">本层结束 → ans = dist</text>

  <!-- loop back arrow -->
  <path d="M 540 488 Q 580 488 580 282 L 540 282" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="588" y="386" font-size="9" fill="#888" transform="rotate(90 588 386)">队列还有元素</text>

  <!-- return -->
  <path d="M 410 504 L 410 520" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="330" y="520" width="160" height="36" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="410" y="543" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 ans（最大距离）</text>

  <!-- Side notes -->
  <g filter="url(#sk)">
    <rect x="620" y="208" width="180" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="710" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">边界判断</text>
  <g font-size="10" fill="#444">
    <text x="636" y="250">无陆地 → 返回 -1</text>
    <text x="636" y="268">无海洋 → 返回 -1</text>
    <text x="636" y="286">全为陆地 → -1</text>
    <text x="636" y="304">全为海洋 → -1</text>
    <text x="636" y="322" fill="#888">landCount==0 or</text>
    <text x="636" y="336" fill="#888">landCount==n*n</text>
  </g>

  <g filter="url(#sk)">
    <rect x="620" y="360" width="180" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="710" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">关键技巧</text>
  <g font-size="10" fill="#444">
    <text x="636" y="402">· 多源 = 超级源点</text>
    <text x="636" y="420">· 用 grid 原地标记</text>
    <text x="636" y="438">  访问后改 1 防重</text>
    <text x="636" y="456">· 最后一个被访问</text>
    <text x="636" y="470">  的海洋格即答案</text>
  </g>
</svg>
