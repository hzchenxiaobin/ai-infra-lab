<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：频次表 + 值域枚举验证</text>

  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">统计 digits 频次 freq[10]</text>

  <path d="M 280 80 L 280 100" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="200" y="104" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x = 100（起始偶数）</text>

  <path d="M 280 140 L 280 158" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <polygon points="280,162 392,210 280,258 168,210" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">x ≤ 998 ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（三位偶数上界）</text>

  <path d="M 168 210 L 90 210 L 90 410" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="92" y="200" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="30" y="414" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="436" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 392 210 L 470 210 L 470 240" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="430" y="200" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="388" y="244" width="164" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="264" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">拆 x 为 d0 d1 d2</text>
  <text x="470" y="280" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">百位 d0=x/100</text>
  <text x="470" y="292" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">十 d1=x/10%10 个 d2=x%10</text>

  <path d="M 470 296 L 470 314" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <polygon points="470,318 542,348 470,378 398,348" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="352" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">freq 够?</text>

  <path d="M 398 348 L 320 348 L 320 372" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="360" y="340" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">够</text>

  <rect x="258" y="376" width="124" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="320" y="397" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans.append(x)</text>

  <path d="M 542 348 L 542 348" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 470 378 L 470 396" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <text x="500" y="392" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">不够→跳过</text>

  <path d="M 470 396 L 470 414 L 280 414 L 280 258" stroke="#666" stroke-width="1.4" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <path d="M 320 408 L 280 258" stroke="#666" stroke-width="1.4" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>

  <rect x="178" y="414" width="178" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="267" y="434" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x += 2（下一偶数）</text>

  <path d="M 356 429 L 392 429 L 392 318" stroke="#666" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="20" y="160" font-size="9.5" fill="#888" filter="url(#rough2)">循环</text>
</svg>
