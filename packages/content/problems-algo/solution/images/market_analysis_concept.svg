<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心思路：LEFT JOIN 保留全部用户 → ON 里过滤 2019 → COUNT(order_id) 把 NULL 计为 0</text>

  <!-- ===== Panel 1: Users table (preserved side) ===== -->
  <text x="100" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Users 表（左表，保留侧）</text>
  <rect x="20" y="60" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="75" font-size="8" fill="#446688" font-weight="bold">user_id</text>
  <text x="120" y="75" font-size="8" fill="#446688" font-weight="bold">join_date</text>
  <line x1="75" y1="60" x2="75" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="82" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="94" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="120" y="94" text-anchor="middle" font-size="8" fill="#333">2018-01-01</text>
  <line x1="75" y1="82" x2="75" y2="98" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="20" y="98" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="110" text-anchor="middle" font-size="8.5" fill="#333">2</text>
  <text x="120" y="110" text-anchor="middle" font-size="8" fill="#333">2018-02-09</text>
  <line x1="75" y1="98" x2="75" y2="114" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="20" y="114" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="126" text-anchor="middle" font-size="8.5" fill="#333">3</text>
  <text x="120" y="126" text-anchor="middle" font-size="8" fill="#333">2018-01-19</text>
  <line x1="75" y1="114" x2="75" y2="130" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="20" y="130" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="142" text-anchor="middle" font-size="8.5" fill="#333">4</text>
  <text x="120" y="142" text-anchor="middle" font-size="8" fill="#333">2018-05-21</text>
  <line x1="75" y1="130" x2="75" y2="146" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- annotation: 4 users, all preserved -->
  <path d="M14 86 L14 144" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="9" y="118" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 9 118)">全保留</text>

  <!-- arrow ① -->
  <path d="M182 112 L222 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="202" y="100" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">① LEFT JOIN</text>
  <text x="202" y="110" text-anchor="middle" font-size="6.5" fill="#d6a040">ON buyer_id=user_id</text>
  <text x="202" y="124" text-anchor="middle" font-size="6.5" fill="#b85450" font-weight="bold">AND YEAR=2019</text>

  <!-- ===== Panel 2: LEFT JOIN result (with NULLs) ===== -->
  <text x="320" y="54" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">LEFT JOIN 结果（含 NULL 行）</text>
  <rect x="225" y="60" width="190" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="75" font-size="8" fill="#b85450" font-weight="bold">user_id</text>
  <text x="345" y="75" font-size="8" fill="#b85450" font-weight="bold">order_id (2019)</text>
  <line x1="290" y1="60" x2="290" y2="82" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="225" y="82" width="190" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="258" y="94" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="345" y="94" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="290" y1="82" x2="290" y2="98" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="225" y="98" width="190" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="258" y="110" text-anchor="middle" font-size="8.5" fill="#333">2</text>
  <text x="345" y="110" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="290" y1="98" x2="290" y2="114" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="225" y="114" width="190" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="258" y="126" text-anchor="middle" font-size="8.5" fill="#333">2</text>
  <text x="345" y="126" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">6</text>
  <line x1="290" y1="114" x2="290" y2="130" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="225" y="130" width="190" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="258" y="142" text-anchor="middle" font-size="8.5" fill="#333">3</text>
  <text x="345" y="142" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">NULL</text>
  <line x1="290" y1="130" x2="290" y2="146" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="225" y="146" width="190" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="258" y="158" text-anchor="middle" font-size="8.5" fill="#333">4</text>
  <text x="345" y="158" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">NULL</text>
  <line x1="290" y1="146" x2="290" y2="162" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- annotation on NULL rows -->
  <path d="M420 134 L420 158" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="432" y="150" font-size="7" fill="#b85450" font-weight="bold">2019 无单</text>

  <!-- arrow ② -->
  <path d="M417 112 L452 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="434" y="100" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">②</text>
  <text x="434" y="110" text-anchor="middle" font-size="6.5" fill="#d6a040">GROUP BY</text>
  <text x="434" y="124" text-anchor="middle" font-size="6.5" fill="#d6a040">COUNT(order_id)</text>

  <!-- ===== Panel 3: Final result ===== -->
  <text x="535" y="54" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果</text>
  <rect x="455" y="60" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="485" y="75" font-size="8" fill="#4a7a3a" font-weight="bold">buyer_id</text>
  <text x="555" y="75" font-size="7" fill="#4a7a3a" font-weight="bold">orders_in_2019</text>
  <line x1="515" y1="60" x2="515" y2="82" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="455" y="82" width="150" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="485" y="94" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">1</text>
  <text x="555" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="515" y1="82" x2="515" y2="98" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="455" y="98" width="150" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="485" y="110" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">2</text>
  <text x="555" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="515" y1="98" x2="515" y2="114" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="455" y="114" width="150" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="485" y="126" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">3</text>
  <text x="555" y="126" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0</text>
  <line x1="515" y1="114" x2="515" y2="130" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="455" y="130" width="150" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="485" y="142" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">4</text>
  <text x="555" y="142" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0</text>
  <line x1="515" y1="130" x2="515" y2="146" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="535" y="158" text-anchor="middle" font-size="7" fill="#b85450">NULL → 0 ✓</text>

  <!-- ===== Bottom pipeline summary ===== -->
  <rect x="20" y="172" width="585" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="190" font-size="10" fill="#333">① <tspan fill="#d6a040" font-weight="bold">FROM Users u LEFT JOIN Orders o ON u.user_id=o.buyer_id AND YEAR(o.order_date)=2019</tspan> → 保留全部用户，2019 无单者 order_id 为 NULL</text>
  <text x="40" y="204" font-size="10" fill="#333">② <tspan fill="#4a7a3a" font-weight="bold">GROUP BY u.user_id, u.join_date</tspan> + <tspan fill="#b85450" font-weight="bold">COUNT(o.order_id)</tspan> → NULL 不计入，自然得 0</text>

  <!-- ===== Key insight box ===== -->
  <rect x="20" y="220" width="585" height="240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="312" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键陷阱：年份过滤必须放 ON 子句，不能放 WHERE</text>

  <text x="40" y="262" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">ON 里写 YEAR(order_date)=2019</tspan>：连接前先过滤右表，未匹配用户保留为 NULL 行 → 用户 3、4 仍在</text>
  <text x="40" y="282" font-size="9.5" fill="#333">• ⚠️ <tspan fill="#b85450" font-weight="bold">放 WHERE YEAR(order_date)=2019</tspan>：连接后逐行过滤，NULL 行的 YEAR(NULL)≠2019 被丢弃</text>
  <text x="40" y="300" font-size="9.5" fill="#b85450">　　→ LEFT JOIN 退化成 INNER JOIN → 用户 3、4 直接消失 ✗（漏了 0 单的用户）</text>

  <text x="40" y="322" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">COUNT(o.order_id)</tspan>：只数非 NULL 值，NULL 行计为 0 ✓</text>
  <text x="40" y="340" font-size="9.5" fill="#333">• ⚠️ <tspan fill="#b85450" font-weight="bold">COUNT(*)</tspan>：连 NULL 填充行也数成 1，用户 3、4 错算成 1 单 ✗</text>

  <text x="40" y="362" font-size="9.5" fill="#333">• <tspan fill="#446688" font-weight="bold">GROUP BY u.user_id, u.join_date</tspan>：SELECT 中的非聚合列（join_date）必须出现在 GROUP BY（标准 SQL）</text>
  <text x="40" y="380" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">u.user_id AS buyer_id</tspan>：题目要求输出列名为 buyer_id，需重命名（值仍是用户 id）</text>
  <text x="40" y="398" font-size="9.5" fill="#333">• <tspan fill="#888">Items 表本题用不到</tspan>：题目只问"订单总数"，不涉及商品品牌（品牌在市场分析 II 才用）</text>
  <text x="40" y="416" font-size="9.5" fill="#333">• 返回顺序<tspan fill="#888"> 任意</tspan>，无需 ORDER BY（若要稳定输出可加 ORDER BY buyer_id）</text>
  <text x="40" y="436" font-size="9.5" fill="#333">• 一句话：<tspan fill="#d6a040" font-weight="bold">LEFT JOIN + 条件放 ON + COUNT(右表主键)</tspan> 是"分组统计且保留零值主体"的通用模板</text>
</svg>
