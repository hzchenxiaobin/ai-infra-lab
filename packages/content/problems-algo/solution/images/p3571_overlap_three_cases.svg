<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：最短超级串只可能是三种形态</text>

  <!-- 形态①：包含 -->
  <text x="30" y="52" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">① 包含：短串整体躺在长串里（哪怕嵌在正中间）</text>
  <text x="56" y="80" font-size="10.5" fill="#777" filter="url(#rough2)">s1</text>
  <rect x="80" y="60" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="114" y="60" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="129" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <rect x="148" y="60" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="163" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <rect x="182" y="60" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="197" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <rect x="216" y="60" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="231" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <path d="M114,96 L114,101 L212,101 L212,96" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="116" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">s2 = "bcb" 藏在正中间</text>
  <text x="270" y="68" font-size="11" fill="#333" filter="url(#rough2)">s2 ⊆ s1 ⇒ 答案就是 s1</text>
  <text x="270" y="90" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">"abcba"（长度 5）</text>
  <text x="270" y="108" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 两个方向的重叠都是 0，纯拼接得 8！</text>

  <!-- 形态②：s1 在前 -->
  <text x="30" y="136" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">② s1 在前：s1 的后缀 = s2 的前缀（示例 1）</text>
  <text x="52" y="162" font-size="10.5" fill="#777" filter="url(#rough2)">s1</text>
  <rect x="80" y="144" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="114" y="144" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="148" y="144" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="52" y="196" font-size="10.5" fill="#777" filter="url(#rough2)">s2</text>
  <rect x="114" y="178" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="198" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="148" y="178" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="198" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="182" y="178" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="198" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="109" y="140" width="79" height="72" rx="6" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="270" y="160" font-size="11" fill="#333" filter="url(#rough2)">最大重叠 k₁ = 2：尾 "ba" = 头 "ba"</text>
  <text x="270" y="182" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">拼接 s1 + s2[k₁:] = "abab"（4）</text>

  <!-- 形态③：s2 在前 -->
  <text x="30" y="234" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">③ s2 在前：s2 的后缀 = s1 的前缀（对称）</text>
  <text x="52" y="260" font-size="10.5" fill="#777" filter="url(#rough2)">s2</text>
  <rect x="80" y="242" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="114" y="242" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="148" y="242" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="52" y="294" font-size="10.5" fill="#777" filter="url(#rough2)">s1</text>
  <rect x="114" y="276" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="148" y="276" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="182" y="276" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="109" y="238" width="79" height="72" rx="6" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="270" y="258" font-size="11" fill="#333" filter="url(#rough2)">最大重叠 k₂ = 2：尾 "ab" = 头 "ab"</text>
  <text x="270" y="280" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">拼接 s2 + s1[k₂:] = "baba"（4）</text>

  <!-- 底部结论 -->
  <rect x="30" y="322" width="478" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="269" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">四种候选取最短，等长时任取（示例 1 里 "abab" / "baba" 都对）</text>
  <text x="269" y="358" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">无重叠时 k = 0，退化为直接拼接 s1 + s2</text>
</svg>
