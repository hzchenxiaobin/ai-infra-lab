<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums=["777","7","77","77"], target="7777"</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">cnt = {"777":1, "7":1, "77":2}，遍历三个唯一前缀</text>

  <!-- Table header -->
  <rect x="30" y="62" width="500" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">
    <text x="80" y="83">前缀 s</text>
    <text x="160" y="83">cnt[s]</text>
    <text x="245" y="83">后缀 suffix</text>
    <text x="325" y="83">cnt[suffix]</text>
    <text x="400" y="83">s==suffix?</text>
    <text x="485" y="83">配对数</text>
  </g>

  <!-- Row 1: s="777" -->
  <rect x="30" y="96" width="500" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="80" y="119" fill="#446688" font-weight="bold">"777"</text>
    <text x="160" y="119" fill="#333">1</text>
    <text x="245" y="119" fill="#4a7a3a" font-weight="bold">"7"</text>
    <text x="325" y="119" fill="#333">1</text>
    <text x="400" y="119" fill="#b85450">否</text>
    <text x="485" y="119" fill="#333" font-weight="bold">1×1 = 1</text>
  </g>

  <!-- Row 2: s="7" -->
  <rect x="30" y="134" width="500" height="36" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="80" y="157" fill="#446688" font-weight="bold">"7"</text>
    <text x="160" y="157" fill="#333">1</text>
    <text x="245" y="157" fill="#4a7a3a" font-weight="bold">"777"</text>
    <text x="325" y="157" fill="#333">1</text>
    <text x="400" y="157" fill="#b85450">否</text>
    <text x="485" y="157" fill="#333" font-weight="bold">1×1 = 1</text>
  </g>

  <!-- Row 3: s="77" -->
  <rect x="30" y="172" width="500" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="80" y="195" fill="#446688" font-weight="bold">"77"</text>
    <text x="160" y="195" fill="#333">2</text>
    <text x="245" y="195" fill="#4a7a3a" font-weight="bold">"77"</text>
    <text x="325" y="195" fill="#333">2</text>
    <text x="400" y="195" fill="#4a7a3a" font-weight="bold">是</text>
    <text x="485" y="195" fill="#333" font-weight="bold">2×1 = 2</text>
  </g>

  <!-- Total row -->
  <rect x="30" y="216" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 = 1 + 1 + 2 = 4 ✓</text>

  <!-- Explanation for s=="77" case -->
  <rect x="30" y="270" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">s == suffix 时为何用 c×(c−1)？</text>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"77" 有 2 个实例（下标 2、3），需 i ≠ j → (2,3) 和 (3,2) 共 2 = 2×1 对</text>

  <!-- Note: order matters -->
  <rect x="30" y="330" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(i,j) 有序对：(0,1) 与 (1,0) 是不同下标对</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">遍历前缀时 "777" 与 "7" 两个方向各覆盖一次，天然不遗漏</text>
</svg>
