<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：t 秒后 = 存活后缀 word[t·k:] + 任意填充 × t·k</text>

  <!-- ① original word, t=2, k=3 demo -->
  <text x="36" y="56" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">① 原串（以 t = 2、k = 3 为例）</text>
  <text x="40" y="90" font-size="11.5" fill="#888" filter="url(#rough2)">word =</text>

  <rect x="100" y="68" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="144" y="68" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="188" y="68" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="232" y="68" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="276" y="68" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="320" y="68" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="364" y="68" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <path d="M 103 84 L 361 84" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="122" y="114" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="166" y="114" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="210" y="114" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="254" y="114" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="298" y="114" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="342" y="114" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="386" y="114" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>

  <text x="232" y="136" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✂ 前 t·k = 6 个被删（每秒删 3 个 × 2 秒）</text>
  <text x="404" y="136" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">存活</text>

  <path d="M 280 148 L 280 166" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ② after t seconds -->
  <text x="36" y="182" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">② t = 2 秒后的串（长度仍为 n = 7）</text>
  <text x="26" y="214" font-size="11.5" fill="#888" filter="url(#rough2)">t 秒后 =</text>

  <rect x="100" y="192" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="213" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="144" y="192" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="166" y="213" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="188" y="192" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="213" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="232" y="192" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="254" y="213" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="276" y="192" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="213" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="320" y="192" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="213" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="364" y="192" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="386" y="213" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>

  <text x="280" y="244" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">绿 = 存活的原字符（原顺序顶在前面）；虚线 = 任意填充 × t·k（填什么我们说了算）</text>

  <path d="M 280 254 L 280 270" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ③ condition -->
  <rect x="60" y="274" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 恢复 ⇔ 存活后缀 word[t·k:] 恰是 word 的前缀</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（此时把任意填充改成 word 的尾部，即可还原原串）</text>

  <!-- fallback note -->
  <rect x="60" y="348" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">若 t·k ≥ n：原字符全部删光，整串任意重建 → t = ⌈n/k⌉ 必可行</text>
</svg>
