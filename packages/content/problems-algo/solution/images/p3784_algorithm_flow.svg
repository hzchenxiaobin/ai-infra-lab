<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="255" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">一趟扫描攒两个聚合量，收尾做一次减法</text>

  <!-- 开始框 -->
  <rect x="160" y="34" width="190" height="34" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="56" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">total = 0；sum[26] = 0</text>

  <path d="M 255 68 L 255 86" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环体 -->
  <rect x="135" y="90" width="240" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="111" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">for i = 0 … n−1:</text>
  <text x="255" y="131" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">total += cost[i];  sum[s[i]] += cost[i]</text>

  <path d="M 255 144 L 255 162" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="255,166 335,196 255,226 175,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 是：回环 -->
  <path d="M 175 196 L 105 196 L 105 117 L 131 117" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="188" font-size="12" fill="#666" filter="url(#rough2)">是</text>

  <!-- 否：下行 -->
  <path d="M 255 226 L 255 250" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="244" font-size="12" fill="#666" filter="url(#rough2)">否</text>

  <!-- best 框 -->
  <rect x="160" y="254" width="190" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">best = max(sum[a..z])</text>

  <path d="M 255 290 L 255 304" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回框 -->
  <rect x="160" y="308" width="190" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="255" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">return total − best</text>

  <!-- 右侧提示框 1 -->
  <rect x="390" y="88" width="112" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="446" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">一趟 O(n)</text>
  <text x="446" y="128" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">只攒两个聚合量：</text>
  <text x="446" y="145" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">总和 &amp; 各字母组和</text>

  <!-- 右侧提示框 2 -->
  <rect x="390" y="180" width="112" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="446" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠️ 溢出</text>
  <text x="446" y="221" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">total ≤ 10⁵×10⁹</text>
  <text x="446" y="238" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">= 10¹⁴ &gt; 2³¹</text>
  <text x="446" y="256" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">C++ 用 long long</text>
</svg>
