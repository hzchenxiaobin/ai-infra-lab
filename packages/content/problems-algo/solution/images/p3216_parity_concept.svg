<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：值得换的相邻对 = 同奇偶 且 前面更大</text>

  <!-- 顶部字符串 45320，按奇偶着色：蓝=偶，橙=奇 -->
  <rect x="80" y="44" width="44" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="71" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <rect x="132" y="44" width="44" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="71" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <rect x="184" y="44" width="44" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="206" y="71" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="236" y="44" width="44" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="71" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="288" y="44" width="44" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="71" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>

  <!-- 奇偶标注 -->
  <text x="102" y="102" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="154" y="102" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">奇</text>
  <text x="206" y="102" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">奇</text>
  <text x="258" y="102" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="310" y="102" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶</text>

  <!-- 相邻对序号 -->
  <text x="128" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="180" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="232" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="284" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- 行1：i=0 的 (4,5) -->
  <rect x="64" y="136" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="96" y="136" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="140" y="154" font-size="12" fill="#b85450" filter="url(#rough2)">奇偶不同 → 不能换 ✗</text>

  <!-- 行2：i=1 的 (5,3)，最左命中 -->
  <rect x="56" y="172" width="430" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="64" y="176" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="96" y="176" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="194" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">同为奇数 且 5 &gt; 3 → 一换就变小 ✓（最左命中）</text>

  <!-- 行3：i=2 的 (3,2) -->
  <rect x="64" y="216" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="234" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="96" y="216" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="234" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="234" font-size="12" fill="#b85450" filter="url(#rough2)">奇偶不同 → 不能换 ✗</text>

  <!-- 行4：i=3 的 (2,0) -->
  <rect x="64" y="256" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="96" y="256" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="140" y="274" font-size="12" fill="#a06a10" filter="url(#rough2)">同为偶数 且 2 &gt; 0 → 也能变小，但更靠右（备胎）</text>

  <!-- 底部总结 -->
  <rect x="56" y="300" width="408" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">贪心：最左的命中对，一换即得答案</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">同奇偶 = 换了合法；前面更大 = 换了才变小</text>
</svg>
