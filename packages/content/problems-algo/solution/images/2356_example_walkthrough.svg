<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="780" height="320" fill="#fafafa"/>

  <text x="390" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：教师1 科目2 跨系重复 → 去重 {2,3}=2；教师2 无重复 → {1,2,3,4}=4</text>

  <!-- header row -->
  <rect x="24" y="50" width="732" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="66" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">teacher_id</text>
  <text x="280" y="66" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">subject_id 原始序列</text>
  <text x="520" y="66" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">去重后集合</text>
  <text x="688" y="66" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">cnt</text>
  <line x1="140" y1="50" x2="140" y2="74" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="420" y1="50" x2="420" y2="74" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="620" y1="50" x2="620" y2="74" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1 teacher 1 green -->
  <rect x="24" y="74" width="732" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="82" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="200" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="220" y="100" text-anchor="middle" font-size="11" fill="#666">,</text>
  <text x="250" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="270" y="100" text-anchor="middle" font-size="11" fill="#666">,</text>
  <text x="300" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <path d="M190 108 L190 116 L262 116 L262 108" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="226" y="126" text-anchor="middle" font-size="8" fill="#b85450">合并</text>
  <text x="520" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{ 2 , 3 }</text>
  <text x="688" y="106" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 2 teacher 2 orange -->
  <rect x="24" y="130" width="732" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="82" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="170" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="195" y="160" text-anchor="middle" font-size="11" fill="#666">,</text>
  <text x="225" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="250" y="160" text-anchor="middle" font-size="11" fill="#666">,</text>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="305" y="160" text-anchor="middle" font-size="11" fill="#666">,</text>
  <text x="335" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="520" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">{ 1, 2, 3, 4 }</text>
  <text x="688" y="162" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>

  <line x1="140" y1="74" x2="140" y2="186" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="420" y1="74" x2="420" y2="186" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="620" y1="74" x2="620" y2="186" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrows sequence -> set -->
  <path d="M372 102 L412 102" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M382 158 L412 158" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="24" y="202" width="732" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="224" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠️ 教师1：3系教科目2、4系也教科目2、3系教科目3 → 科目2跨系重复，去重后仅 {2,3}</text>
  <text x="390" y="244" text-anchor="middle" font-size="10" fill="#666">COUNT(*) 得 3（错，把两个「科目2」各算一次）；COUNT(DISTINCT subject_id) 得 2（对）</text>
  <text x="390" y="264" text-anchor="middle" font-size="10" fill="#666">教师2：四门科目各只在1系出现一次，无重复 → 去重不变，cnt = 4</text>
  <text x="390" y="284" text-anchor="middle" font-size="10" fill="#666">关键：分组键 teacher_id 与计数列 subject_id 是否「可能重复」——可能重复即须 DISTINCT</text>
</svg>
