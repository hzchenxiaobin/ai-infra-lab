<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="660" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [1,3,2,3,1] → 2</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">每个合并节点先做「计数」再做「合并」；仅展示有计数贡献的节点细节</text>

  <!-- ===== Initial ===== -->
  <text x="20" y="72" font-size="11" fill="#446688" font-weight="bold">初始 nums</text>
  <rect x="60" y="78" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="94" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="104" y="78" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="124" y="94" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="148" y="78" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="168" y="94" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="192" y="78" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="212" y="94" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="236" y="78" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="256" y="94" text-anchor="middle" font-size="10" fill="#333">1</text>

  <text x="320" y="92" font-size="9" fill="#888">下标 0 1 2 3 4</text>

  <path d="M 300 106 L 300 120" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Recursion tree: 4 merges ===== -->
  <rect x="20" y="124" width="560" height="108" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="30" y="142" font-size="11" fill="#446688" font-weight="bold">递归树（4 个合并节点，先计数后合并）</text>

  <!-- merge 1 -->
  <text x="30" y="162" font-size="10" fill="#333">①(0,0,1)</text>
  <text x="90" y="162" font-size="10" fill="#446688">左[1] · 右[3]</text>
  <text x="190" y="162" font-size="10" fill="#333">1 &gt; 2×3=6 ? 否</text>
  <text x="300" y="162" font-size="10" fill="#888">计数 0</text>
  <text x="380" y="162" font-size="10" fill="#4a7a3a">合并→[1,3]</text>

  <!-- merge 2 -->
  <text x="30" y="180" font-size="10" fill="#333">②(0,1,2)</text>
  <text x="90" y="180" font-size="10" fill="#446688">左[1,3] · 右[2]</text>
  <text x="190" y="180" font-size="10" fill="#333">1&gt;4?否 3&gt;4?否</text>
  <text x="300" y="180" font-size="10" fill="#888">计数 0</text>
  <text x="380" y="180" font-size="10" fill="#4a7a3a">合并→[1,2,3]</text>

  <!-- merge 3 (contributes) -->
  <rect x="24" y="186" width="552" height="20" fill="#fff8e1" stroke="none" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="30" y="200" font-size="10" fill="#333" font-weight="bold">③(3,3,4)</text>
  <text x="90" y="200" font-size="10" fill="#b85450" font-weight="bold">左[3] · 右[1]</text>
  <text x="190" y="200" font-size="10" fill="#333">3 &gt; 2×1=2 ? 是</text>
  <text x="300" y="200" font-size="10" fill="#b85450" font-weight="bold">计数 1 ★</text>
  <text x="380" y="200" font-size="10" fill="#4a7a3a">合并→[1,3]</text>

  <!-- merge 4 (contributes) -->
  <rect x="24" y="208" width="552" height="20" fill="#fff8e1" stroke="none" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="30" y="222" font-size="10" fill="#333" font-weight="bold">④(0,2,4)</text>
  <text x="90" y="222" font-size="10" fill="#b85450" font-weight="bold">左[1,2,3] · 右[1,3]</text>
  <text x="190" y="222" font-size="10" fill="#333">3&gt;2×1=2 是</text>
  <text x="300" y="222" font-size="10" fill="#b85450" font-weight="bold">计数 1 ★</text>
  <text x="380" y="222" font-size="10" fill="#4a7a3a">合并→[1,1,2,3,3]</text>

  <path d="M 300 234 L 300 248" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Detail: merge 3 ===== -->
  <text x="20" y="262" font-size="12" fill="#b85450" font-weight="bold">合并③ 计数细节：左半 [3] · 右半 [1]（lo=3, mid=3, hi=4）</text>

  <rect x="20" y="270" width="560" height="50" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="8" filter="url(#rough2)"/>

  <text x="30" y="290" font-size="10" fill="#888" font-weight="bold">i</text>
  <text x="60" y="290" font-size="10" fill="#888" font-weight="bold">左值</text>
  <text x="120" y="290" font-size="10" fill="#888" font-weight="bold">比较</text>
  <text x="240" y="290" font-size="10" fill="#888" font-weight="bold">j 动作</text>
  <text x="350" y="290" font-size="10" fill="#888" font-weight="bold">计数</text>

  <rect x="24" y="296" width="552" height="22" fill="#fff8e1" stroke="none" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="30" y="312" font-size="10" fill="#333">0</text>
  <text x="60" y="312" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="120" y="312" font-size="10" fill="#333">3 &gt; 2×1=2 ? 是</text>
  <text x="240" y="312" font-size="10" fill="#b85450">j: 4 → 5（越过 hi）</text>
  <text x="350" y="312" font-size="10" fill="#b85450" font-weight="bold">ans += 5−4 = 1</text>

  <path d="M 300 322 L 300 336" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Detail: merge 4 ===== -->
  <text x="20" y="352" font-size="12" fill="#b85450" font-weight="bold">合并④ 计数细节：左半 [1,2,3] · 右半 [1,3]（lo=0, mid=2, hi=4）</text>

  <rect x="20" y="360" width="560" height="110" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="8" filter="url(#rough2)"/>

  <text x="30" y="380" font-size="10" fill="#888" font-weight="bold">i</text>
  <text x="60" y="380" font-size="10" fill="#888" font-weight="bold">左值</text>
  <text x="120" y="380" font-size="10" fill="#888" font-weight="bold">比较</text>
  <text x="280" y="380" font-size="10" fill="#888" font-weight="bold">j 动作</text>
  <text x="430" y="380" font-size="10" fill="#888" font-weight="bold">计数</text>

  <!-- i=0 -->
  <rect x="24" y="386" width="552" height="22" fill="#fce4ec" stroke="none" rx="3" filter="url(#rough2)" opacity="0.4"/>
  <text x="30" y="402" font-size="10" fill="#333">0</text>
  <text x="60" y="402" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="120" y="402" font-size="10" fill="#333">1 &gt; 2×1=2 ? 否</text>
  <text x="280" y="402" font-size="10" fill="#888">j 不动（=3）</text>
  <text x="430" y="402" font-size="10" fill="#888">ans += 3−3 = 0</text>

  <!-- i=1 -->
  <rect x="24" y="408" width="552" height="22" fill="#fce4ec" stroke="none" rx="3" filter="url(#rough2)" opacity="0.4"/>
  <text x="30" y="424" font-size="10" fill="#333">1</text>
  <text x="60" y="424" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="120" y="424" font-size="10" fill="#333">2 &gt; 2×1=2 ? 否（不严格）</text>
  <text x="280" y="424" font-size="10" fill="#888">j 不动（=3）</text>
  <text x="430" y="424" font-size="10" fill="#888">ans += 3−3 = 0</text>

  <!-- i=2 -->
  <rect x="24" y="430" width="552" height="22" fill="#fff8e1" stroke="none" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="30" y="446" font-size="10" fill="#333">2</text>
  <text x="60" y="446" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="120" y="446" font-size="10" fill="#333">3 &gt; 2×1=2 ? 是</text>
  <text x="280" y="446" font-size="10" fill="#b85450">j: 3 → 4</text>
  <text x="430" y="446" font-size="10" fill="#333">3 &gt; 2×3=6 ? 否，停</text>

  <text x="30" y="464" font-size="10" fill="#b85450" font-weight="bold">本 i 计数 = j − (mid+1) = 4 − 3 = 1</text>

  <!-- ===== Final result ===== -->
  <rect x="80" y="486" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="508" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">总数 ans = 0 + 0 + 1 + 1 = 2</text>
  <text x="300" y="528" text-anchor="middle" font-size="10" fill="#888">翻转对：①(3,4)即 3&gt;2×1 ②(值3在下标2, 值1在下标4)即 3&gt;2×1</text>

  <!-- ===== Notes ===== -->
  <text x="20" y="560" font-size="10" fill="#888">💡 计数在「合并之前」：此时两半仍各自有序，j 对每个 i 只前进不回退，双指针 O(n) 完成跨段统计</text>
  <text x="20" y="578" font-size="10" fill="#888">⚠️ 「严格大于」：i=1 时 2 = 2×1，相等不计入（与 315 逆序对的「严格小于」对称）</text>
  <text x="20" y="596" font-size="10" fill="#888">💡 跨段对数 + 段内对数 = 总翻转对；段内对由递归子调用统计，本层只管跨段</text>
  <text x="20" y="614" font-size="10" fill="#888">⚠️ 合并阶段不再计数：合并条件 nums[i] ≤ nums[j] 与计数条件无关，照常归并即可</text>
  <text x="20" y="632" font-size="10" fill="#888">⚠️ nums[j] 可达 2³¹−1，2·nums[j] 溢出 int32 → C++ 用 (long long) 比较</text>
</svg>
