<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：Manacher + 惰性传播 + 前后缀最大值</text>

  <!-- Step 1: Manacher -->
  <rect x="160" y="55" width="320" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">Step 1：Manacher 求奇回文半径</text>
  <text x="320" y="98" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d[i] = 以 i 为中心的最大奇回文半径，长度 = 2d[i]+1</text>

  <!-- arrow -->
  <line x1="320" y1="118" x2="320" y2="138" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2a: maxEndAt + backward propagation -->
  <rect x="50" y="145" width="270" height="85" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Step 2a：maxEndAt + 反向传播</text>
  <text x="65" y="188" font-size="10" fill="#555" filter="url(#rough2)">① maxEndAt[i+d[i]] = max(·, 2d[i]+1)</text>
  <text x="65" y="204" font-size="10" fill="#555" filter="url(#rough2)">② for i ← n-2 to 0:</text>
  <text x="75" y="218" font-size="10" fill="#555" filter="url(#rough2)">maxEndAt[i] = max(·, maxEndAt[i+1]-2)</text>

  <!-- Step 2b: maxStartAt + forward propagation -->
  <rect x="370" y="145" width="270" height="85" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="168" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">Step 2b：maxStartAt + 正向传播</text>
  <text x="385" y="188" font-size="10" fill="#555" filter="url(#rough2)">① maxStartAt[i-d[i]] = max(·, 2d[i]+1)</text>
  <text x="385" y="204" font-size="10" fill="#555" filter="url(#rough2)">② for i → 1 to n-1:</text>
  <text x="395" y="218" font-size="10" fill="#555" filter="url(#rough2)">maxStartAt[i] = max(·, maxStartAt[i-1]-2)</text>

  <!-- arrows down -->
  <line x1="185" y1="233" x2="185" y2="253" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="505" y1="233" x2="505" y2="253" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3a: prefixMax -->
  <rect x="50" y="260" width="270" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="283" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Step 3a：前缀最大值 prefixMax</text>
  <text x="185" y="303" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">prefixMax[i] = max(prefixMax[i-1], maxEndAt[i])</text>

  <!-- Step 3b: suffixMax -->
  <rect x="370" y="260" width="270" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="283" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">Step 3b：后缀最大值 suffixMax</text>
  <text x="505" y="303" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">suffixMax[i] = max(suffixMax[i+1], maxStartAt[i])</text>

  <!-- arrows converging -->
  <line x1="185" y1="323" x2="280" y2="358" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="505" y1="323" x2="360" y2="358" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: enumerate split -->
  <rect x="160" y="365" width="320" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="389" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Step 4：枚举分割点取最大乘积</text>
  <text x="320" y="409" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">for i = 0 to n-2:</text>
  <text x="320" y="425" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">ans = max(ans, prefixMax[i] × suffixMax[i+1])</text>

  <!-- arrow down -->
  <line x1="320" y1="438" x2="320" y2="458" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="220" y="465" width="200" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="492" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans，O(n) 时间</text>

  <!-- side note -->
  <text x="590" y="200" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">← 只存奇回文（题面要求）</text>
</svg>
