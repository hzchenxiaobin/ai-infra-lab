<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：grid = [[4,3,2,1],[8,7,6,1]]，k = 3</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">两行都严格递减 → 只有宽度 1 的行段才有序</text>

  <!-- 面板 ①：grid -->
  <rect x="36" y="46" width="448" height="84" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="64" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 原矩阵（红格 &gt; k = 3）</text>

  <rect x="110" y="70" width="42" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="131" y="86" text-anchor="middle" font-size="11.5" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="156" y="70" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="177" y="86" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="202" y="70" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="223" y="86" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="248" y="70" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="269" y="86" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="110" y="98" width="42" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="131" y="114" text-anchor="middle" font-size="11.5" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="156" y="98" width="42" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="177" y="114" text-anchor="middle" font-size="11.5" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="202" y="98" width="42" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="223" y="114" text-anchor="middle" font-size="11.5" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="248" y="98" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="269" y="114" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="310" y="84" font-size="9.5" fill="#b85450" filter="url(#rough2)">· 红格 &gt; 3，不能进任何子矩阵</text>
  <text x="310" y="102" font-size="9.5" fill="#555" filter="url(#rough2)">· 4&gt;3、8/7/6&gt;3 → 各自 h 记 0</text>
  <text x="310" y="120" font-size="9.5" fill="#555" filter="url(#rough2)">· 相邻左大右小 → run 全部断成 1</text>

  <!-- 面板 ②：h -->
  <rect x="36" y="138" width="448" height="84" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="156" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② h 矩阵（向左非递减延伸，&gt;k 记 0）</text>

  <rect x="110" y="162" width="42" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="131" y="177" text-anchor="middle" font-size="11" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="156" y="162" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="177" y="177" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="202" y="162" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="223" y="177" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="248" y="162" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="269" y="177" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="110" y="188" width="42" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="131" y="203" text-anchor="middle" font-size="11" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="156" y="188" width="42" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="177" y="203" text-anchor="middle" font-size="11" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="202" y="188" width="42" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="223" y="203" text-anchor="middle" font-size="11" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="248" y="188" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="269" y="203" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="310" y="176" font-size="9.5" fill="#555" filter="url(#rough2)">· 全是 0 或 1：宽度只能取 1</text>
  <text x="310" y="194" font-size="9.5" fill="#555" filter="url(#rough2)">· h=0 的行：以该行为右端</text>
  <text x="310" y="210" font-size="9.5" fill="#555" filter="url(#rough2)">  且含该行的区间贡献为 0</text>

  <!-- 面板 ③：按列求和 -->
  <rect x="36" y="230" width="448" height="112" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="248" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 按右端点列 c₂ 求「子数组最小值之和」（列向量只有 2 个元素 → 3 个子数组）</text>

  <text x="70" y="266" font-size="9.5" fill="#888" font-weight="bold" filter="url(#rough2)">c₂</text>
  <text x="160" y="266" font-size="9.5" fill="#888" font-weight="bold" filter="url(#rough2)">列向量</text>
  <text x="270" y="266" font-size="9.5" fill="#888" font-weight="bold" filter="url(#rough2)">min([上]) + min([下]) + min([整列])</text>
  <text x="446" y="266" font-size="9.5" fill="#888" font-weight="bold" filter="url(#rough2)">贡献</text>

  <text x="70" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="160" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">[0, 0]</text>
  <text x="270" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">0 + 0 + 0</text>
  <text x="446" y="286" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="70" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="160" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">[1, 0]</text>
  <text x="270" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">1 + 0 + 0</text>
  <text x="446" y="304" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="70" y="322" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="160" y="322" font-size="10.5" fill="#555" filter="url(#rough2)">[1, 0]</text>
  <text x="270" y="322" font-size="10.5" fill="#555" filter="url(#rough2)">1 + 0 + 0</text>
  <text x="446" y="322" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="70" y="340" font-size="10.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="160" y="340" font-size="10.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">[1, 1]</text>
  <text x="270" y="340" font-size="10.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">1 + 1 + 1</text>
  <text x="446" y="340" font-size="10.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">3 ★</text>

  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 0+1+1+3 = 5：子矩阵 [3]、[2]、[1]、[1]、第 3 列 2×1 竖块</text>
</svg>
