<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [3, 2, 4, 6]</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">逐位 OR → 7 = 111₂，即最大异或和</text>

  <!-- header: bit2 bit1 bit0 -->
  <text x="120" y="78" text-anchor="end" font-size="10" fill="#888">下标</text>
  <text x="120" y="94" text-anchor="end" font-size="10" fill="#888">数值</text>
  <text x="200" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bit2</text>
  <text x="240" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bit1</text>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bit0</text>

  <!-- column highlight bands for "winner" of each bit -->
  <rect x="182" y="86" width="36" height="120" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <rect x="222" y="86" width="36" height="120" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <rect x="262" y="86" width="36" height="120" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <!-- row 0: nums[0]=3 = 0 1 1 -->
  <text x="160" y="110" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="120" y="110" text-anchor="end" font-size="12" fill="#333">3</text>
  <rect x="182" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="110" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="222" y="92" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="262" y="92" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 1: nums[1]=2 = 0 1 0 -->
  <text x="160" y="142" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="120" y="142" text-anchor="end" font-size="12" fill="#333">2</text>
  <rect x="182" y="124" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="142" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="222" y="124" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="262" y="124" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- row 2: nums[2]=4 = 1 0 0 -->
  <text x="160" y="174" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="120" y="174" text-anchor="end" font-size="12" fill="#333">4</text>
  <rect x="182" y="156" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="222" y="156" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="174" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="262" y="156" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- row 3: nums[3]=6 = 1 1 0 -->
  <text x="160" y="206" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="120" y="206" text-anchor="end" font-size="12" fill="#333">6</text>
  <rect x="182" y="188" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="206" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="222" y="188" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="206" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="262" y="188" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- separator -->
  <line x1="178" y1="218" x2="302" y2="218" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- OR row: 1 1 1 = 7 -->
  <text x="160" y="240" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">OR</text>
  <rect x="182" y="222" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="222" y="222" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="262" y="222" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="310" y="240" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">= 7 ✓</text>

  <!-- arrow down to constructive assignment -->
  <path d="M240 250 L240 268" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- constructive XOR assignment box -->
  <rect x="40" y="272" width="460" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">构造：取 v = [3, 2, 4, 2]（每个 v_i ⊆ nums[i]）</text>
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a">v_i XOR：3 ⊕ 2 ⊕ 4 ⊕ 2 = 7 = OR ✓</text>
  <text x="270" y="328" text-anchor="middle" font-size="10" fill="#888">注：6 → 6 AND (6 XOR 4) = 6 AND 2 = 2（清 bit2，仍是 6 的 submask）</text>

  <!-- footer -->
  <text x="270" y="362" text-anchor="middle" font-size="10.5" fill="#888">每位选一个「该位为 1」的代表凑奇 → OR 的每个 1 位都被点亮</text>
</svg>
