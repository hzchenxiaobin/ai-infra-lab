<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：前缀和 DP（O(n) 时间 / O(n) 空间）</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">用 prefix[] 把「区间求和」压成 O(1)，逐天递推 dp[i]</text>

  <!-- init -->
  <ellipse cx="160" cy="84" rx="66" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="89" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[1]=1, prefix[1]=1</text>

  <path d="M160 108 L160 126" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="84" y="130" width="152" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="152" text-anchor="middle" font-size="11" fill="#333">for i = 2 … n</text>

  <path d="M160 168 L160 186" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1: window bounds -->
  <rect x="60" y="190" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="160" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lo = max(1, i−forget+1)</text>
  <text x="160" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">hi = i − delay</text>

  <path d="M160 232 L160 250" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: range sum via prefix -->
  <rect x="48" y="254" width="224" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="273" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">dp[i] = prefix[hi] − prefix[lo−1]</text>
  <text x="160" y="289" text-anchor="middle" font-size="9.5" fill="#888">hi &lt; 1 时 dp[i] = 0（窗口空）</text>

  <path d="M160 300 L160 318" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: extend prefix -->
  <rect x="60" y="322" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="160" y="345" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">prefix[i] = prefix[i−1] + dp[i]</text>

  <!-- loop back arrow -->
  <path d="M60 340 L24 340 L24 148 L84 148" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="24" y="244" text-anchor="middle" font-size="9.5" fill="#888" transform="rotate(-90 24 244)">下一天 i</text>

  <!-- after loop arrow to answer -->
  <path d="M260 340 L300 340 L300 376 L300 376" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="362" text-anchor="middle" font-size="9.5" fill="#888">i 用完</text>

  <!-- return answer -->
  <ellipse cx="300" cy="396" rx="92" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="401" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return prefix[n] − prefix[n−forget]</text>

  <!-- side note box -->
  <rect x="360" y="120" width="184" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="452" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">为什么是「区间和」？</text>
  <text x="452" y="162" text-anchor="middle" font-size="10" fill="#333">① 每个 j 向 [j+delay, j+forget−1]</text>
  <text x="452" y="176" text-anchor="middle" font-size="10" fill="#333">　 每天各贡献 1 人</text>
  <text x="452" y="194" text-anchor="middle" font-size="10" fill="#333">② 反看第 i 天：贡献者正是</text>
  <text x="452" y="208" text-anchor="middle" font-size="10" fill="#333">　 j ∈ [i−forget+1, i−delay]</text>
  <text x="452" y="226" text-anchor="middle" font-size="10" fill="#333">③ 连续区间 → 前缀和减一下</text>
  <text x="452" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">把 O(n²) 压成 O(n)</text>
  <text x="452" y="260" text-anchor="middle" font-size="9.5" fill="#888">答案 = 还记得的人 = 末段窗口和</text>
</svg>
