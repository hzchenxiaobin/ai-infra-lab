<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：str1 = "zc", str2 = "ad" → true</text>

  <!-- ===== Step 1 ===== -->
  <rect x="20" y="44" width="520" height="120" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="64" font-size="11" fill="#888" font-weight="bold">步骤 1：i=0, j=0</text>

  <!-- str1 cells -->
  <text x="34" y="92" font-size="11" fill="#888">str1:</text>
  <rect x="74" y="78" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="96" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">z</text>
  <rect x="124" y="78" width="44" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="146" y="98" text-anchor="middle" font-size="14" fill="#999">c</text>
  <text x="96" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ i</text>

  <!-- transform z -> a via +1 -->
  <text x="180" y="98" font-size="11" fill="#b85450" font-weight="bold">z +1 → a</text>
  <path d="M232,92 L268,92" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- str2 cells -->
  <text x="284" y="92" font-size="11" fill="#888">str2:</text>
  <rect x="324" y="78" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="98" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>
  <rect x="374" y="78" width="44" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="396" y="98" text-anchor="middle" font-size="14" fill="#999">d</text>
  <text x="346" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ j</text>
  <text x="440" y="98" font-size="10" fill="#4a7a3a">匹配 ✓ → i=1, j=1</text>

  <!-- ===== Step 2 ===== -->
  <rect x="20" y="176" width="520" height="120" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="196" font-size="11" fill="#888" font-weight="bold">步骤 2：i=1, j=1</text>

  <!-- str1 cells -->
  <text x="34" y="224" font-size="11" fill="#888">str1:</text>
  <rect x="74" y="210" width="44" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="96" y="230" text-anchor="middle" font-size="14" fill="#999">z</text>
  <rect x="124" y="210" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="230" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <text x="146" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ i</text>

  <!-- transform c -> d via +1 -->
  <text x="180" y="224" font-size="11" fill="#b85450" font-weight="bold">c +1 → d</text>
  <path d="M232,218 L268,218" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- str2 cells -->
  <text x="284" y="224" font-size="11" fill="#888">str2:</text>
  <rect x="324" y="210" width="44" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="346" y="230" text-anchor="middle" font-size="14" fill="#999">a</text>
  <rect x="374" y="210" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="230" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">d</text>
  <text x="396" y="256" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ j</text>
  <text x="440" y="224" font-size="10" fill="#4a7a3a">匹配 ✓ → i=2, j=2</text>

  <!-- result -->
  <rect x="120" y="306" width="320" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">j = 2 = |str2| → return true</text>
</svg>
