<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：状态机逐字符推进</text>

  <!-- ===== Table A: "   -42" → -42 ===== -->
  <text x="30" y="52" font-size="12" fill="#446688" font-weight="bold">A. s = "   -42"  →  −42</text>

  <!-- header -->
  <rect x="24" y="60" width="512" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="44" y="77" font-size="11" fill="#333">步骤</text>
  <text x="110" y="77" font-size="11" fill="#333">字符</text>
  <text x="180" y="77" font-size="11" fill="#333">状态转移</text>
  <text x="340" y="77" font-size="11" fill="#333">sign</text>
  <text x="420" y="77" font-size="11" fill="#333">ans</text>

  <!-- rows -->
  <rect x="24" y="86" width="512" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="103" font-size="11" fill="#333">1</text><text x="110" y="103" font-size="11" fill="#888">' '</text><text x="180" y="103" font-size="11" fill="#333">起始 → 起始</text><text x="340" y="103" font-size="11" fill="#333">+1</text><text x="420" y="103" font-size="11" fill="#333">0</text>

  <rect x="24" y="112" width="512" height="26" fill="#f6f8fc" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="129" font-size="11" fill="#333">2</text><text x="110" y="129" font-size="11" fill="#888">' '</text><text x="180" y="129" font-size="11" fill="#333">起始 → 起始</text><text x="340" y="129" font-size="11" fill="#333">+1</text><text x="420" y="129" font-size="11" fill="#333">0</text>

  <rect x="24" y="138" width="512" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="155" font-size="11" fill="#333">3</text><text x="110" y="155" font-size="11" fill="#888">' '</text><text x="180" y="155" font-size="11" fill="#333">起始 → 起始</text><text x="340" y="155" font-size="11" fill="#333">+1</text><text x="420" y="155" font-size="11" fill="#333">0</text>

  <rect x="24" y="164" width="512" height="26" fill="#fff8e1" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="181" font-size="11" fill="#333">4</text><text x="110" y="181" font-size="11" fill="#d6a040">'−'</text><text x="180" y="181" font-size="11" fill="#333">起始 → 符号</text><text x="340" y="181" font-size="11" fill="#b85450">−1</text><text x="420" y="181" font-size="11" fill="#333">0</text>

  <rect x="24" y="190" width="512" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="207" font-size="11" fill="#333">5</text><text x="110" y="207" font-size="11" fill="#4a7a3a">'4'</text><text x="180" y="207" font-size="11" fill="#333">符号 → 数字</text><text x="340" y="207" font-size="11" fill="#b85450">−1</text><text x="420" y="207" font-size="11" fill="#333">4</text>

  <rect x="24" y="216" width="512" height="26" fill="#f3f9f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="233" font-size="11" fill="#333">6</text><text x="110" y="233" font-size="11" fill="#4a7a3a">'2'</text><text x="180" y="233" font-size="11" fill="#333">数字 → 数字</text><text x="340" y="233" font-size="11" fill="#b85450">−1</text><text x="420" y="233" font-size="11" fill="#333">42</text>

  <rect x="24" y="242" width="512" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="44" y="259" font-size="11" fill="#333">结束</text><text x="180" y="259" font-size="11" fill="#333">字符串扫完 → 结束</text><text x="420" y="259" font-size="11" fill="#b85450">返回 −42</text>

  <!-- ===== Table B: "4193 with words" → 4193 ===== -->
  <text x="30" y="298" font-size="12" fill="#446688" font-weight="bold">B. s = "4193 with words"  →  4193</text>

  <rect x="24" y="306" width="512" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="44" y="323" font-size="11" fill="#333">步骤</text>
  <text x="110" y="323" font-size="11" fill="#333">字符</text>
  <text x="180" y="323" font-size="11" fill="#333">状态转移</text>
  <text x="340" y="323" font-size="11" fill="#333">ans</text>
  <text x="440" y="323" font-size="11" fill="#333">说明</text>

  <rect x="24" y="332" width="512" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="349" font-size="11" fill="#333">1</text><text x="110" y="349" font-size="11" fill="#4a7a3a">'4'</text><text x="180" y="349" font-size="11" fill="#333">起始 → 数字</text><text x="340" y="349" font-size="11" fill="#333">4</text><text x="440" y="349" font-size="11" fill="#666">首位即数字</text>

  <rect x="24" y="358" width="512" height="26" fill="#f3f9f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="375" font-size="11" fill="#333">2</text><text x="110" y="375" font-size="11" fill="#4a7a3a">'1'</text><text x="180" y="375" font-size="11" fill="#333">数字 → 数字</text><text x="340" y="375" font-size="11" fill="#333">41</text><text x="440" y="375" font-size="11" fill="#666">ans×10+d</text>

  <rect x="24" y="384" width="512" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="401" font-size="11" fill="#333">3</text><text x="110" y="401" font-size="11" fill="#4a7a3a">'9'</text><text x="180" y="401" font-size="11" fill="#333">数字 → 数字</text><text x="340" y="401" font-size="11" fill="#333">419</text><text x="440" y="401" font-size="11" fill="#666">ans×10+d</text>

  <rect x="24" y="410" width="512" height="26" fill="#f3f9f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="427" font-size="11" fill="#333">4</text><text x="110" y="427" font-size="11" fill="#4a7a3a">'3'</text><text x="180" y="427" font-size="11" fill="#333">数字 → 数字</text><text x="340" y="427" font-size="11" fill="#333">4193</text><text x="440" y="427" font-size="11" fill="#666">ans×10+d</text>

  <rect x="24" y="436" width="512" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="44" y="453" font-size="11" fill="#333">5</text><text x="110" y="453" font-size="11" fill="#888">' '</text><text x="180" y="453" font-size="11" fill="#333">数字 → 结束</text><text x="340" y="453" font-size="11" fill="#333">4193</text><text x="440" y="453" font-size="11" fill="#b85450">遇非数字即停</text>
</svg>
