<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">换视角：数字排成一条递增链，逐个决定「下一个数给谁」</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：nums1 = [0,1,0,0,1]，nums2 = [0,0,0,1]（0 → 正偶数，1 → 正奇数）</text>

  <!-- nums1 行：骨架 + 填好的数 -->
  <text x="32" y="74" font-size="12" fill="#333" filter="url(#rough2)">nums1</text>
  <rect x="88" y="56" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="117" y="56" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="146" y="56" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="175" y="56" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="204" y="56" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="101" y="75" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="130" y="75" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">1</text>
  <text x="159" y="75" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="188" y="75" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="217" y="75" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">1</text>
  <path d="M 238 70 Q 252 64 264 70" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="270" y="56" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="309" y="56" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="348" y="56" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="387" y="56" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="426" y="56" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="288" y="75" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="327" y="75" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="366" y="75" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="405" y="75" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="444" y="75" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">7</text>

  <!-- nums2 行 -->
  <text x="32" y="116" font-size="12" fill="#333" filter="url(#rough2)">nums2</text>
  <rect x="88" y="98" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="117" y="98" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="146" y="98" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="175" y="98" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="101" y="117" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="130" y="117" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="159" y="117" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="188" y="117" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">1</text>
  <path d="M 238 112 Q 252 106 264 112" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="270" y="98" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="309" y="98" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="348" y="98" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="387" y="98" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="288" y="117" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">8</text>
  <text x="327" y="117" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">10</text>
  <text x="366" y="117" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">12</text>
  <text x="405" y="117" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">13</text>

  <!-- 合并序列 -->
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">合并视角：用到的所有数字 → 一条严格递增链</text>
  <rect x="54" y="164" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="164" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="164" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="164" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="222" y="164" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="264" y="164" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="306" y="164" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="348" y="164" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="164" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="73" y="185" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="115" y="185" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="157" y="185" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="199" y="185" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="241" y="185" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">7</text>
  <text x="283" y="185" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">8</text>
  <text x="325" y="185" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">10</text>
  <text x="367" y="185" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">12</text>
  <text x="409" y="185" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">13</text>
  <text x="73" y="212" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="115" y="212" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="157" y="212" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="199" y="212" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="241" y="212" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="283" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="325" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="367" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="409" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="460" y="176" font-size="9.5" fill="#446688" filter="url(#rough2)">A = nums1</text>
  <text x="460" y="192" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">B = nums2</text>
  <text x="260" y="234" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">归属模式 P = A A A A A B B B B（链上第 t 个数字给谁）</text>

  <!-- 说明框 1 -->
  <rect x="36" y="246" width="448" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">等价性：各自递增 + 全局互不相同 ⟺ 合并序列严格递增</text>
  <text x="260" y="277" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">（每个数组按位置顺序认领链上自己的数字，认领出的子序列天然递增）</text>

  <!-- 说明框 2 -->
  <rect x="36" y="294" width="448" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">固定模式 P 后贪心填数：d1 = 该奇偶性最小正整数，dt = nxt(d(t−1), 第 t 位奇偶)</text>
  <text x="260" y="325" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">nxt 关于前值单调不减 ⇒ 前面越小后面越好，贪心链逐位贴着下界走</text>
  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">「跳过一个数给后面留位」无收益——数字只认「更大 + 奇偶对」，不认位置</text>
</svg>
