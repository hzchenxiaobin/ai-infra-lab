<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：后序 DFS 按节点 val 分情况合成</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">dfs(node) 返回 [f0, f1]；记左子 l=[l0,l1]、右子 r=[r0,r1]</text>

  <!-- start -->
  <rect x="190" y="56" width="180" height="32" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">调用 dfs(node)</text>
  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- null check -->
  <polygon points="280,110 392,148 280,186 168,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#333">node == null ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#333">（含 NOT 的空孩子）</text>
  <path d="M 168 148 L 80 148 L 80 168" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="84" y="138" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="168" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return [∞, ∞]</text>
  <path d="M 280 186 L 280 204" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="294" y="200" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- leaf check -->
  <polygon points="280,206 388,242 280,278 172,242" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#333">val ∈ {0,1} ?（叶）</text>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#333">翻叶 0↔1</text>
  <path d="M 172 242 L 110 242 L 110 262" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="114" y="234" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="262" width="140" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return [val, val⊕1]</text>
  <path d="M 280 278 L 280 296" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="294" y="292" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- recurse -->
  <rect x="160" y="298" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#333">l=dfs(left), r=dfs(right)</text>
  <path d="M 280 330 L 280 348" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- dispatch -->
  <rect x="20" y="350" width="520" height="118" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">按 val 选合成规则（在 l=[l0,l1] / r=[r0,r1] 上算 [f0, f1]）</text>

  <rect x="34" y="376" width="118" height="82" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="93" y="394" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2 · OR</text>
  <text x="93" y="412" text-anchor="middle" font-size="9" fill="#333">f0 = l0+r0</text>
  <text x="93" y="426" text-anchor="middle" font-size="9" fill="#333">f1 = min(</text>
  <text x="93" y="438" text-anchor="middle" font-size="9" fill="#333">l0+r1,l1+r0,</text>
  <text x="93" y="450" text-anchor="middle" font-size="9" fill="#333">l1+r1)</text>

  <rect x="160" y="376" width="118" height="82" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="219" y="394" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3 · AND</text>
  <text x="219" y="412" text-anchor="middle" font-size="9" fill="#333">f0 = min(</text>
  <text x="219" y="424" text-anchor="middle" font-size="9" fill="#333">l0+r0,l0+r1,</text>
  <text x="219" y="436" text-anchor="middle" font-size="9" fill="#333">l1+r0)</text>
  <text x="219" y="452" text-anchor="middle" font-size="9" fill="#333">f1 = l1+r1</text>

  <rect x="286" y="376" width="118" height="82" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="345" y="394" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4 · XOR</text>
  <text x="345" y="412" text-anchor="middle" font-size="9" fill="#333">f0 = min(</text>
  <text x="345" y="424" text-anchor="middle" font-size="9" fill="#333">l0+r0, l1+r1)</text>
  <text x="345" y="440" text-anchor="middle" font-size="9" fill="#333">f1 = min(</text>
  <text x="345" y="452" text-anchor="middle" font-size="9" fill="#333">l0+r1, l1+r0)</text>

  <rect x="412" y="376" width="118" height="82" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="471" y="394" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5 · NOT（单孩）</text>
  <text x="471" y="414" text-anchor="middle" font-size="9" fill="#333">f0 = min(l1, r1)</text>
  <text x="471" y="432" text-anchor="middle" font-size="9" fill="#333">f1 = min(l0, r0)</text>
  <text x="471" y="450" text-anchor="middle" font-size="8" fill="#888">空孩 ∞ 自动失效</text>

  <path d="M 280 470 L 280 488" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="170" y="490" width="220" height="32" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="511" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return [f0, f1]；答案=dfs(root)[result]</text>
</svg>
