<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程</text>

  <!-- init -->
  <rect x="150" y="42" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#333">预计算 pow5 集合，dp[0]=0</text>
  <path d="M 260 82 L 260 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond i<=n -->
  <polygon points="260,104 340,140 260,176 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i ≤ n ?</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#888">遍历前缀终点 i</text>

  <path d="M 340 140 L 416 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="378" y="134" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="408" y="122" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="458" y="140" text-anchor="middle" font-size="10" fill="#333">返回 dp[n]</text>
  <text x="458" y="153" text-anchor="middle" font-size="9" fill="#888">INF→-1</text>

  <path d="M 260 176 L 260 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="190" font-size="10" fill="#4a7a3a">是</text>

  <!-- dp[i]=INF -->
  <rect x="150" y="200" width="220" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[i] = INF（暂不可达）</text>
  <path d="M 260 236 L 260 256" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond j<i -->
  <polygon points="260,260 340,296 260,332 180,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">j &lt; i ?</text>
  <text x="260" y="308" text-anchor="middle" font-size="10" fill="#888">枚举段起点 j</text>

  <path d="M 180 296 L 130 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="156" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>

  <!-- check+update box -->
  <rect x="14" y="270" width="116" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="72" y="289" text-anchor="middle" font-size="10" fill="#333">s[j:i] 美丽?</text>
  <text x="72" y="303" text-anchor="middle" font-size="9" fill="#888">无前导0 且 ∈pow5</text>
  <text x="72" y="318" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">→dp[i]=min(dp[j]+1)</text>

  <!-- dashed return to j loop -->
  <path d="M 72 270 L 72 244 L 260 244 L 260 260" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="238" font-size="9" fill="#999">下一个 j</text>

  <!-- No B: i++ -->
  <path d="M 340 296 L 400 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="370" y="290" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="400" y="278" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="302" text-anchor="middle" font-size="11" fill="#333">i++</text>
  <path d="M 450 278 L 450 140 L 342 140" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="458" y="210" font-size="9" fill="#999">回到 i</text>

  <!-- note -->
  <rect x="150" y="352" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="10" fill="#555">INF 兜底不可达；命中美丽段才压低</text>
</svg>
