<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold">算法流程：双指针 + 分段贪心</text>

  <!-- Start -->
  <rect x="210" y="46" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="17" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">i=j=0, sum1=sum2=0, ans=0</text>

  <path d="M 280 80 L 280 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop condition -->
  <path d="M 200 130 L 280 104 L 360 130 L 280 156 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i&lt;n 且 j&lt;m ?</text>
  <text x="280" y="142" text-anchor="middle" font-size="10.5" fill="#555">（都还有元素）</text>

  <!-- No branch: drain remaining -->
  <path d="M 360 130 L 430 130" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="384" y="124" font-size="10.5" fill="#888" font-weight="bold">否</text>

  <rect x="430" y="112" width="118" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="489" y="128" text-anchor="middle" font-size="10.5" fill="#333">把剩余元素累加</text>
  <text x="489" y="142" text-anchor="middle" font-size="10.5" fill="#333">到 sum1 / sum2</text>

  <path d="M 489 148 L 489 230" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Yes branch down -->
  <path d="M 280 156 L 280 176" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="170" font-size="10.5" fill="#888" font-weight="bold">是</text>

  <!-- Compare decision -->
  <path d="M 180 230 L 280 178 L 380 230 L 280 282 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">比较 nums1[i]</text>
  <text x="280" y="228" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">与 nums2[j]</text>
  <text x="280" y="248" text-anchor="middle" font-size="10" fill="#888">三路分支</text>

  <!-- Branch 1: nums1[i] < nums2[j] -->
  <path d="M 180 230 L 110 230 L 110 300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="84" y="222" font-size="10" fill="#446688" font-weight="bold">&lt;</text>
  <rect x="50" y="300" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="110" y="320" text-anchor="middle" font-size="10.5" fill="#333">sum1 += nums1[i]</text>
  <text x="110" y="336" text-anchor="middle" font-size="10.5" fill="#333">i++</text>
  <text x="110" y="350" text-anchor="middle" font-size="9.5" fill="#888">(nums1 较小，吃掉它)</text>

  <!-- Branch 2: nums1[i] > nums2[j] -->
  <path d="M 380 230 L 450 230 L 450 300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="458" y="222" font-size="10" fill="#446688" font-weight="bold">&gt;</text>
  <rect x="390" y="300" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="320" text-anchor="middle" font-size="10.5" fill="#333">sum2 += nums2[j]</text>
  <text x="450" y="336" text-anchor="middle" font-size="10.5" fill="#333">j++</text>
  <text x="450" y="350" text-anchor="middle" font-size="9.5" fill="#888">(nums2 较小，吃掉它)</text>

  <!-- Branch 3: equal -->
  <path d="M 280 282 L 280 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="288" y="294" font-size="10" fill="#b85450" font-weight="bold">==</text>
  <rect x="210" y="300" width="140" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">公共值 v：切换点</text>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#333">ans += max(sum1,sum2)</text>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#333">ans += v</text>
  <text x="280" y="366" text-anchor="middle" font-size="10.5" fill="#333">sum1=sum2=0; i++; j++</text>

  <!-- Loop back arrows from branches -->
  <path d="M 110 356 L 110 400 L 30 400 L 30 130 L 200 130" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 450 356 L 450 410 L 540 410 L 540 130 L 360 130" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 280 370 L 280 420 L 280 420" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <path d="M 280 370 L 230 370 L 230 400 L 30 400 L 30 130 L 200 130" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="60" y="394" font-size="9.5" fill="#888">回循环判断</text>

  <!-- Final step -->
  <rect x="380" y="212" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans += max(sum1,sum2)</text>

  <path d="M 489 246 L 489 260" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="400" y="260" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="17" filter="url(#rough2)"/>
  <text x="460" y="282" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans % MOD</text>

  <!-- Note -->
  <rect x="50" y="430" width="330" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="215" y="446" text-anchor="middle" font-size="10.5" fill="#555">公共值只算一次：先加段和 max，再加 v 本身</text>
</svg>
