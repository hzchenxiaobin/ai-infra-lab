<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：染色区 = 曼哈顿距离 ≤ n−1 的菱形</text>

  <!-- ===== 左侧：n=4 大菱形（半径 3），按环染色 ===== -->
  <text x="170" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n = 4（半径 r = n−1 = 3）</text>

  <!-- 行 gy=-3：1 格，d=3 红 -->
  <rect x="163" y="154" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <!-- 行 gy=-2：3 格 -->
  <rect x="150" y="167" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="163" y="167" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="176" y="167" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <!-- 行 gy=-1：5 格 -->
  <rect x="137" y="180" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="150" y="180" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="163" y="180" width="13" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="176" y="180" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="189" y="180" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <!-- 行 gy=0：7 格 -->
  <rect x="124" y="193" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="137" y="193" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="150" y="193" width="13" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="163" y="193" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <rect x="176" y="193" width="13" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="189" y="193" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="202" y="193" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <!-- 行 gy=1：5 格 -->
  <rect x="137" y="206" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="150" y="206" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="163" y="206" width="13" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="176" y="206" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="189" y="206" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <!-- 行 gy=2：3 格 -->
  <rect x="150" y="219" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="163" y="219" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <rect x="176" y="219" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <!-- 行 gy=3：1 格 -->
  <rect x="163" y="232" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>

  <text x="170" y="266" text-anchor="middle" font-size="10" fill="#888">每分钟向外扩一环</text>

  <!-- 从中心向右上 d=3 红格的虚线，标注距离 -->
  <path d="M 170 199 L 208 160" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <text x="214" y="158" font-size="10" fill="#b85450">d=|Δx|+|Δy|=3</text>

  <!-- ===== 右侧：环计数图例 + 公式 ===== -->
  <text x="300" y="92" font-size="11" fill="#555" font-weight="bold">按距离分层：环 d 恰好 4d 格</text>

  <rect x="300" y="104" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="324" y="116" font-size="11" fill="#333">中心 d=0：1 格</text>

  <rect x="300" y="130" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="324" y="142" font-size="11" fill="#333">环 d=1：4×1 = 4 格</text>

  <rect x="300" y="156" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="324" y="168" font-size="11" fill="#333">环 d=2：4×2 = 8 格</text>

  <rect x="300" y="182" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="324" y="194" font-size="11" fill="#333">环 d=3：4×3 = 12 格</text>

  <!-- 公式框 -->
  <rect x="296" y="214" width="250" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="421" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">总计 = 1 + Σ(d=1..n−1) 4d</text>
  <text x="421" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 1 + 2n(n−1) = 2n²−2n+1</text>

  <!-- 验证 -->
  <rect x="296" y="276" width="250" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="421" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">n=4 验证</text>
  <text x="421" y="309" text-anchor="middle" font-size="10" fill="#333">1 + 4 + 8 + 12 = 25 = 2·4·3+1 ✓</text>

  <!-- 底部一句话 -->
  <rect x="40" y="330" width="500" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="290" y="352" text-anchor="middle" font-size="10" fill="#446688">扩散 = 按曼哈顿距离的 BFS：第 k 分钟恰好染满距离 ≤ k−1 的菱形</text>
</svg>
