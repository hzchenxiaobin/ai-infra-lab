<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,3,6,5,2,3]，k = 2</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">逐位读出 left / right 的「严格 &lt; v」计数，两侧都 ≥ 2 即为 k-big</text>

  <!-- 表格外框 -->
  <rect x="40" y="60" width="480" height="328" fill="none" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="60" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i</text>
  <text x="170" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">v = nums[i]</text>
  <text x="270" y="85" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">左侧 &lt; v (left)</text>
  <text x="390" y="85" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">右侧 &lt; v (right)</text>
  <text x="485" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">k-big?</text>

  <!-- 列分隔线 -->
  <path d="M 130 60 L 130 388" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 210 60 L 210 388" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 330 60 L 330 388" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 450 60 L 450 388" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 i=0 (y 100-148) -->
  <text x="85" y="128" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="170" y="128" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#b85450">0</text>
  <text x="390" y="128" text-anchor="middle" font-size="12" fill="#b85450">0</text>
  <text x="485" y="128" text-anchor="middle" font-size="12" fill="#888">✘</text>
  <path d="M 40 148 L 520 148" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 i=1 -->
  <text x="85" y="176" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="170" y="176" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="270" y="176" text-anchor="middle" font-size="12" fill="#b85450">1</text>
  <text x="390" y="176" text-anchor="middle" font-size="12" fill="#b85450">1</text>
  <text x="485" y="176" text-anchor="middle" font-size="12" fill="#888">✘</text>
  <path d="M 40 196 L 520 196" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 i=2 高亮 -->
  <rect x="40" y="196" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="170" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="270" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="390" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="485" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <path d="M 40 244 L 520 244" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 i=3 高亮 -->
  <rect x="40" y="244" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="170" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="270" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="390" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="485" y="272" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <path d="M 40 292 L 520 292" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 i=4 -->
  <text x="85" y="320" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="170" y="320" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="270" y="320" text-anchor="middle" font-size="12" fill="#b85450">0</text>
  <text x="390" y="320" text-anchor="middle" font-size="12" fill="#b85450">0</text>
  <text x="485" y="320" text-anchor="middle" font-size="12" fill="#888">✘</text>
  <path d="M 40 340 L 520 340" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 i=5 -->
  <text x="85" y="368" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="170" y="368" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="270" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a">2</text>
  <text x="390" y="368" text-anchor="middle" font-size="12" fill="#b85450">0</text>
  <text x="485" y="368" text-anchor="middle" font-size="12" fill="#888">✘</text>

  <!-- 结果 -->
  <rect x="40" y="400" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">仅 i = 2 与 i = 3 双侧都 ≥ 2 → ans = 2</text>
</svg>
