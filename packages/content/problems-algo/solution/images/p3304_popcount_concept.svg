<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：长度每步翻倍，第 i 位字符 = 'a' + popcount(i)</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Sₜ₊₁ = Sₜ · inc(Sₜ)：后半段 = 前半段逐字符 +1，|Sₜ| = 2ᵗ</text>

  <!-- S0 -->
  <text x="88" y="68" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">S₀</text>
  <rect x="100" y="52" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="69" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="352" y="68" font-size="10" fill="#888" filter="url(#rough2)">长度 1</text>
  <path d="M 115 78 L 115 86" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- S1 -->
  <text x="88" y="104" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">S₁</text>
  <rect x="100" y="88" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="105" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="130" y="88" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="105" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">b</text>
  <line x1="130" y1="86" x2="130" y2="114" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="352" y="104" font-size="10" fill="#888" filter="url(#rough2)">长度 2</text>
  <path d="M 115 114 L 115 122" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- S2 -->
  <text x="88" y="140" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">S₂</text>
  <rect x="100" y="124" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="141" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="130" y="124" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="141" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="160" y="124" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="141" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="190" y="124" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="141" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">c</text>
  <line x1="160" y1="122" x2="160" y2="150" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 145 121 Q 175 100 205 121" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="187" y="101" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="352" y="140" font-size="10" fill="#888" filter="url(#rough2)">长度 4</text>
  <path d="M 115 150 L 115 158" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- S3 -->
  <text x="88" y="176" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">S₃</text>
  <rect x="100" y="160" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="177" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="130" y="160" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="177" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="160" y="160" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="177" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="190" y="160" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="177" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="220" y="160" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="177" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="250" y="160" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="177" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="280" y="160" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="177" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="310" y="160" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="177" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">d</text>
  <line x1="220" y1="158" x2="220" y2="186" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="352" y="176" font-size="10" fill="#888" filter="url(#rough2)">长度 8</text>

  <!-- 下标二进制 / popcount 对照 -->
  <text x="95" y="199" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">下标 i（二进制）</text>
  <text x="115" y="199" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">000</text>
  <text x="145" y="199" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">001</text>
  <text x="175" y="199" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">010</text>
  <text x="205" y="199" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">011</text>
  <text x="235" y="199" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">100</text>
  <text x="265" y="199" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">101</text>
  <text x="295" y="199" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">110</text>
  <text x="325" y="199" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">111</text>
  <text x="95" y="215" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">popcount(i)</text>
  <text x="115" y="215" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="145" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="175" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="205" y="215" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="235" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="265" y="215" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="295" y="215" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="325" y="215" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 底部要点框 -->
  <rect x="40" y="228" width="440" height="118" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">引理：Sₜ[i] = 'a' + popcount(i)（i 从 0 数起）</text>
  <text x="260" y="270" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">直观：下标 i 的每个二进制 1 ⇔ 在该层落入后半段 ⇔ 字符多 +1 一次</text>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">答案：ans = chr('a' + popcount(k−1))，例：k = 5 ⇒ popcount(4) = 1 ⇒ 'b'</text>
  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠ 先把 k 减一：k = 4 时 popcount(3) = 2 ⇒ 'c'，直接数 k 会错成 'b'</text>
  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">k ≤ 500 ⇒ popcount ≤ 8 &lt; 26，位移碰不到 'z'，无需取模</text>
</svg>
