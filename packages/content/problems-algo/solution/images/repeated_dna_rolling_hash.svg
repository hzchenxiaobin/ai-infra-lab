<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：滚动哈希 + 哈希表计数</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">窗口右移 1 位 → 哈希 O(1) 更新 → 哈希表记频 → 首次重复时收答案</text>

  <!-- ===== 第一步：构建初始窗口 ===== -->
  <rect x="20" y="58" width="540" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="80" font-size="12" fill="#2a4a66" font-weight="bold">① 构建初始窗口 s[0..9]</text>
  <text x="36" y="98" font-size="11" fill="#444" font-family="monospace">hash = 0;  for i in 0..9:  hash = (hash &lt;&lt; 2) | code(s[i])</text>
  <text x="36" y="116" font-size="10" fill="#888">得到第一个 10-mer 的 20 位哈希，存入哈希表 cnt[hash] = 1</text>
  <rect x="430" y="88" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="485" y="108" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">cnt[341] = 1</text>

  <!-- 箭头 -->
  <line x1="290" y1="130" x2="290" y2="146" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 第二步：滑动窗口循环 ===== -->
  <rect x="20" y="150" width="540" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="172" font-size="12" fill="#3a5a2a" font-weight="bold">② 滑动窗口：i 从 10 到 n−1，每步 O(1) 更新哈希</text>

  <!-- 滑动示意 -->
  <text x="36" y="196" font-size="10" fill="#666">旧窗口 [i−10 .. i−1]：</text>
  <g font-size="10">
    <rect x="150" y="184" width="28" height="24" fill="#eee" stroke="#bbb" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
    <text x="164" y="201" text-anchor="middle" fill="#bbb" font-weight="bold">A</text>
    <rect x="178" y="184" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
    <text x="192" y="201" text-anchor="middle" fill="#446688" font-weight="bold">A</text>
    <rect x="206" y="184" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
    <text x="220" y="201" text-anchor="middle" fill="#446688" font-weight="bold">A</text>
    <rect x="234" y="184" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
    <text x="248" y="201" text-anchor="middle" fill="#446688" font-weight="bold">A</text>
    <rect x="262" y="184" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
    <text x="276" y="201" text-anchor="middle" fill="#446688" font-weight="bold">C</text>
    <rect x="290" y="184" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
    <text x="304" y="201" text-anchor="middle" fill="#446688" font-weight="bold">C</text>
    <rect x="318" y="184" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
    <text x="332" y="201" text-anchor="middle" fill="#446688" font-weight="bold">C</text>
    <rect x="346" y="184" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
    <text x="360" y="201" text-anchor="middle" fill="#446688" font-weight="bold">C</text>
    <rect x="374" y="184" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
    <text x="388" y="201" text-anchor="middle" fill="#446688" font-weight="bold">C</text>
  </g>
  <text x="150" y="222" font-size="9" fill="#b85450">↑丢弃</text>
  <line x1="164" y1="210" x2="192" y2="226" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <text x="36" y="246" font-size="11" fill="#3a5a2a" font-family="monospace" font-weight="bold">hash = ((hash &lt;&lt; 2) | code(s[i])) &amp; 0xFFFFF</text>
  <text x="36" y="266" font-size="10" fill="#666">左移 2 位 → 最老的 A 被「挤」出 20 位范围；新碱基的 2 位编码 OR 进最低位</text>
  <text x="36" y="284" font-size="10" fill="#666">→ 新窗口 [i−9 .. i] 的哈希，与旧窗口共享前 9 个碱基的 18 位，无需重算</text>
  <text x="36" y="302" font-size="10" fill="#4a7a3a" font-weight="bold">整个滑动过程仅 O(n)，每步 3 条位运算，无字符串操作</text>

  <!-- 箭头 -->
  <line x1="290" y1="310" x2="290" y2="326" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 第三步：哈希表计数 + 收答案 ===== -->
  <rect x="20" y="330" width="540" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="352" font-size="12" fill="#7a5a20" font-weight="bold">③ 哈希表记频：cnt[hash]++ ，首次变 2 时收答案</text>

  <text x="36" y="374" font-size="11" fill="#444" font-family="monospace">if (++cnt[hash] == 2)  ans.push_back(s.substr(i−9, 10));</text>

  <text x="36" y="396" font-size="10" fill="#888">• cnt[hash] == 1：首次出现，只记入，不收答案</text>
  <text x="36" y="412" font-size="10" fill="#888">• cnt[hash] == 2：<tspan fill="#b85450" font-weight="bold">第二次出现 → 重复！</tspan>把对应子串加入答案</text>
  <text x="36" y="428" font-size="10" fill="#888">• cnt[hash] ≥ 3：已收过，跳过（去重，每个重复序列只输出一次）</text>

  <rect x="380" y="360" width="160" height="78" fill="#fff" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="460" y="378" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">哈希表（int→int）</text>
  <text x="392" y="396" font-size="9" fill="#446688" font-family="monospace">341 → 2  ★</text>
  <text x="392" y="410" font-size="9" fill="#4a7a3a" font-family="monospace">1364 → 1</text>
  <text x="392" y="424" font-size="9" fill="#d6a040" font-family="monospace">349184 → 2  ★</text>
</svg>
