<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[4,5,2,1], queries=[3,10,21]</text>

  <!-- ===== Reference row 1: sorted nums ===== -->
  <text x="40" y="58" font-size="11" fill="#888">排序 nums =</text>
  <g filter="url(#rough2)">
    <rect x="170" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="190" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
    <rect x="210" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="230" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
    <rect x="250" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="270" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
    <rect x="290" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="310" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>
  </g>

  <!-- ===== Reference row 2: prefix sums ===== -->
  <text x="40" y="94" font-size="11" fill="#888">前缀和 S =</text>
  <g filter="url(#rough2)">
    <rect x="170" y="80" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="190" y="99" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="210" y="80" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="230" y="99" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="250" y="80" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="270" y="99" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="290" y="80" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="310" y="99" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">12</text>
  </g>
  <!-- index labels under prefix cells -->
  <text x="190" y="122" text-anchor="middle" font-size="10" fill="#999">下标0</text>
  <text x="230" y="122" text-anchor="middle" font-size="10" fill="#999">下标1</text>
  <text x="270" y="122" text-anchor="middle" font-size="10" fill="#999">下标2</text>
  <text x="310" y="122" text-anchor="middle" font-size="10" fill="#999">下标3</text>

  <!-- ===== Table ===== -->
  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="40" y="134" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="90"  y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">query q</text>
    <text x="220" y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">首个 &gt; q 的位置</text>
    <text x="340" y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 k</text>
    <text x="480" y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取最小 k 个（和）</text>
    <line x1="140" y1="134" x2="140" y2="164" stroke="#446688" stroke-width="1"/>
    <line x1="300" y1="134" x2="300" y2="164" stroke="#446688" stroke-width="1"/>
    <line x1="380" y1="134" x2="380" y2="164" stroke="#446688" stroke-width="1"/>
  </g>

  <!-- rows -->
  <g filter="url(#rough2)">
    <!-- row 1: q=3 -->
    <rect x="40" y="164" width="540" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="90"  y="186" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
    <text x="220" y="186" text-anchor="middle" font-size="12" fill="#333">下标 2（值 <tspan fill="#b85450" font-weight="bold">7</tspan>）</text>
    <text x="340" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="480" y="186" text-anchor="middle" font-size="12" fill="#888">[1, 2] = 3 ✓</text>

    <!-- row 2: q=10 -->
    <rect x="40" y="198" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="90"  y="220" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">10</text>
    <text x="220" y="220" text-anchor="middle" font-size="12" fill="#333">下标 3（值 <tspan fill="#b85450" font-weight="bold">12</tspan>）</text>
    <text x="340" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="480" y="220" text-anchor="middle" font-size="12" fill="#888">[1, 2, 4] = 7 ✓</text>

    <!-- row 3: q=21 -->
    <rect x="40" y="232" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="90"  y="254" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">21</text>
    <text x="220" y="254" text-anchor="middle" font-size="12" fill="#333">末尾（全 ≤ 21）</text>
    <text x="340" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="480" y="254" text-anchor="middle" font-size="12" fill="#888">[1, 2, 4, 5] = 12 ✓</text>
  </g>

  <!-- note on indexing -->
  <text x="310" y="286" text-anchor="middle" font-size="11" fill="#666">下标 j = 前缀和中首个 &gt; q 的位置 = 满足"和 ≤ q"的元素个数（即答案 k）</text>

  <!-- result box -->
  <rect x="130" y="300" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="325" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">答案 = [2, 3, 4] ✓</text>

  <!-- Example 2 mini note -->
  <rect x="60" y="352" width="500" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">示例 2：nums=[2,3,4,5], queries=[1]</text>
  <text x="310" y="390" text-anchor="middle" font-size="11" fill="#444">排序后 S=[2,5,9,14]，首个 &gt; 1 是下标 0（值 2）⇒ 答案 0</text>
  <text x="310" y="406" text-anchor="middle" font-size="11" fill="#888">（最小元素 2 已 &gt; 1，只能取空子序列）</text>
</svg>
