<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：贪心从右向左</text>

  <!-- 1. 初始化 -->
  <rect x="160" y="48" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化</text>
  <text x="260" y="84" text-anchor="middle" font-size="10" fill="#555">digits = N 各位,  mark = n</text>

  <path d="M 260 92 L 260 112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 外层循环 i -->
  <polygon points="260,114 380,150 260,186 140,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i = n−1 ↓ 1</text>
  <text x="260" y="166" text-anchor="middle" font-size="10" fill="#888">从右向左逐位</text>

  <path d="M 260 186 L 260 206" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 判断 -->
  <polygon points="260,208 372,246 260,284 148,246" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">digits[i−1] &gt; digits[i] ?</text>
  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#888">是否违例（破坏单调递增）</text>

  <!-- Yes branch -->
  <path d="M 148 246 L 96 246 L 96 296" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="240" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- action box -->
  <rect x="16" y="298" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="96" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">digits[i−1] −= 1</text>
  <text x="96" y="338" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mark = i</text>
  <text x="96" y="350" text-anchor="middle" font-size="9" fill="#888">记录置9起点</text>

  <!-- No branch (skip) -->
  <path d="M 372 246 L 424 246 L 424 296" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="240" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="344" y="298" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="424" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">跳过（保持单调）</text>
  <text x="424" y="340" text-anchor="middle" font-size="9" fill="#888">不动 mark</text>

  <!-- merge to loop back -->
  <path d="M 96 354 L 96 380 L 260 380" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 424 354 L 424 380 L 260 380" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 260 380 L 260 150" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="374" font-size="9" fill="#d6a040">i−−</text>

  <!-- loop exit -->
  <path d="M 140 150 Q 70 150 70 400 L 70 412" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="180" font-size="9" fill="#888">i &lt; 1 出循环</text>

  <!-- 4. set to 9 -->
  <rect x="120" y="414" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="434" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">digits[mark … n−1] = 9</text>
  <text x="260" y="450" text-anchor="middle" font-size="9" fill="#888">mark=n 时无操作（N 本身已单调）</text>

  <path d="M 260 458 L 260 462" stroke="none"/>

  <!-- return -->
  <rect x="180" y="466" width="160" height="0" fill="none"/>
</svg>
