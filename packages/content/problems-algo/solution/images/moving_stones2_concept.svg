<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：端点石子 · 间隙 · 滑动窗口</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 [3, 4, 5, 6, 10] 为例，n = 5</text>

  <!-- ===== Section 1: Sorted stones on number line ===== -->
  <text x="30" y="76" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">① 排序后，端点石子（红圈）在两端</text>

  <!-- Number line -->
  <line x1="50" y1="112" x2="340" y2="112" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Empty positions 7,8,9 -->
  <g filter="url(#rough2)" font-size="9" fill="#bbb">
    <circle cx="210" cy="112" r="5" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="2,1"/>
    <circle cx="245" cy="112" r="5" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="2,1"/>
    <circle cx="280" cy="112" r="5" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="2,1"/>
    <text x="210" y="130" text-anchor="middle">7</text>
    <text x="245" y="130" text-anchor="middle">8</text>
    <text x="280" y="130" text-anchor="middle">9</text>
  </g>

  <!-- Stones: 3(end), 4, 5, 6, 10(end) -->
  <g filter="url(#rough2)" font-size="11" font-weight="bold">
    <circle cx="70" cy="112" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <text x="70" y="116" text-anchor="middle" fill="#b85450">3</text>
    <text x="70" y="92" text-anchor="middle" font-size="9" fill="#b85450">端点</text>

    <circle cx="105" cy="112" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="105" y="116" text-anchor="middle" fill="#446688">4</text>

    <circle cx="140" cy="112" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="140" y="116" text-anchor="middle" fill="#446688">5</text>

    <circle cx="175" cy="112" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="175" y="116" text-anchor="middle" fill="#446688">6</text>

    <circle cx="315" cy="112" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <text x="315" y="116" text-anchor="middle" fill="#b85450">10</text>
    <text x="315" y="92" text-anchor="middle" font-size="9" fill="#b85450">端点</text>
  </g>

  <!-- Gap annotation between 6 and 10 -->
  <g filter="url(#rough2)" font-size="10">
    <path d="M 188 102 L 302 102" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,2"/>
    <text x="245" y="98" text-anchor="middle" fill="#d6a040" font-weight="bold">间隙 = 3（空位 7,8,9）</text>
  </g>

  <!-- ===== Section 2: Min — Sliding window ===== -->
  <text x="30" y="160" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">② 最小移动：窗口大小 n，找最多石子聚集</text>

  <!-- Window [3,7] box -->
  <g filter="url(#rough2)">
    <rect x="52" y="170" width="183" height="38" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" rx="6"/>
    <text x="143" y="165" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">窗口 [3, 7]，大小 = n = 5</text>
  </g>

  <!-- Mini stones in window -->
  <g filter="url(#rough2)" font-size="10" font-weight="bold">
    <circle cx="72" cy="189" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="72" y="192" text-anchor="middle" fill="#4a7a3a">3</text>
    <circle cx="102" cy="189" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="102" y="192" text-anchor="middle" fill="#4a7a3a">4</text>
    <circle cx="132" cy="189" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="132" y="192" text-anchor="middle" fill="#4a7a3a">5</text>
    <circle cx="162" cy="189" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="162" y="192" text-anchor="middle" fill="#4a7a3a">6</text>
    <circle cx="222" cy="189" r="10" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="2,1"/>
    <text x="222" y="192" text-anchor="middle" fill="#ccc">_</text>
  </g>

  <!-- Min result box -->
  <g filter="url(#rough2)">
    <rect x="255" y="172" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="395" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4 颗在窗内 → min = 5 − 4 = 1</text>
    <text x="395" y="205" text-anchor="middle" font-size="10" fill="#b85450">⚠ 特判：前 4 颗连续 + 末间隙 &gt; 2 → min = 2</text>
  </g>

  <!-- ===== Section 3: Max — Two sacrifice strategies ===== -->
  <text x="30" y="240" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">③ 最大移动：牺牲一端，在剩余范围内逐个填空</text>

  <!-- Sacrifice left -->
  <g filter="url(#rough2)">
    <rect x="40" y="252" width="235" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="157" y="272" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">牺牲左端（移走 3）</text>
    <text x="157" y="289" text-anchor="middle" font-size="10" fill="#666">范围 [4, 10]，7 位，已有 4 颗</text>
    <text x="157" y="306" text-anchor="middle" font-size="10" fill="#666">空位 7−5=2，+ 首步 1 = 3 步</text>
  </g>

  <!-- Sacrifice right -->
  <g filter="url(#rough2)">
    <rect x="290" y="252" width="235" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="407" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">牺牲右端（移走 10）</text>
    <text x="407" y="289" text-anchor="middle" font-size="10" fill="#666">范围 [3, 6]，4 位，已有 4 颗</text>
    <text x="407" y="306" text-anchor="middle" font-size="10" fill="#666">4 &lt; n=5，放不下 → 0 步</text>
  </g>

  <!-- Max result -->
  <g filter="url(#rough2)">
    <rect x="155" y="334" width="250" height="40" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="8"/>
    <text x="280" y="352" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">max = max(3, 0) = 3</text>
    <text x="280" y="367" text-anchor="middle" font-size="10" fill="#888">取两种牺牲策略的较大值</text>
  </g>

  <!-- Bottom note -->
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">红圈 = 端点石子 | 绿框 = 滑动窗口 | 橙框 = 牺牲左端 | 蓝框 = 牺牲右端</text>
</svg>
