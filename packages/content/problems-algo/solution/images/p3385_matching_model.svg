<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：总时间 = Σ⌈sᵢ/jᵢ⌉ → 最小权完美匹配</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 j 个被破的锁面对的 X 恒为 j，耗时 ⌈s/j⌉ 只由「锁 × 次序」决定，锁与锁互不干扰</text>

  <!-- ===== 左列：锁 ===== -->
  <text x="82" y="68" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">锁（强度 s）</text>
  <rect x="25" y="75" width="115" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="82" y="98" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">锁 1 · s=3</text>
  <rect x="25" y="145" width="115" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="82" y="168" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">锁 2 · s=4</text>
  <rect x="25" y="215" width="115" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="82" y="238" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">锁 3 · s=1</text>

  <!-- ===== 右列：次序 ===== -->
  <text x="437" y="68" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">次序位置（X）</text>
  <rect x="380" y="75" width="115" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="437" y="98" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">第 1 个 · X=1</text>
  <rect x="380" y="145" width="115" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="437" y="168" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">第 2 个 · X=2</text>
  <rect x="380" y="215" width="115" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="437" y="238" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">第 3 个 · X=3</text>

  <!-- ===== 灰色虚线：其余候选边 ===== -->
  <path d="M 140 86 L 376 86" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 140 156 L 376 100" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 140 226 L 376 170" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="8.5" fill="#8a929c" filter="url(#rough2)">…… 其余 n² 条候选边（省略）……</text>

  <!-- ===== 最优匹配（红色粗线，示例 1） ===== -->
  <path d="M 140 226 L 376 100" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="216" y="188" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⌈1/1⌉=1</text>
  <path d="M 140 163 L 376 163" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="262" y="152" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⌈4/2⌉=2</text>
  <path d="M 140 100 L 376 226" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="306" y="188" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⌈3/3⌉=1</text>

  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">最优匹配总耗时 = 1 + 2 + 1 = 4（示例 1）</text>

  <!-- ===== 贪心反例 ===== -->
  <rect x="25" y="278" width="232" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="141" y="297" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">⚠️ 贪心「大 s 配大 X」不成立</text>
  <text x="141" y="313" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">[1,3,4]：排序贪心 1+2+2 = 5</text>
  <text x="141" y="329" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">最优 1+2+1 = 4，强度 4 反而要提前</text>

  <!-- ===== 结论 ===== -->
  <rect x="272" y="278" width="223" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="383" y="297" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">锁 × 次序 一对一配对 = 指派问题</text>
  <text x="383" y="313" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">最小权完美匹配</text>
  <text x="383" y="329" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">n ≤ 80 → 最小费用最大流 / KM</text>
</svg>
