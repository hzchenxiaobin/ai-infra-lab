<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：同层去重 —— 同一位置相同值只试一次</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">每层 dfs 新建 used 集合；跨层（不同位置）允许相同值</text>

  <!-- nums array -->
  <text x="30" y="74" font-size="12" fill="#446688" font-weight="bold">nums = [4, 6, 7, 7]</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="60"  y="82" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="80"  y="102" fill="#446688">4</text>
    <rect x="104" y="82" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="124" y="102" fill="#446688">6</text>
    <rect x="148" y="82" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="168" y="102" fill="#4a7a3a">7</text>
    <rect x="192" y="82" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="212" y="102" fill="#b85450">7</text>
  </g>
  <text x="244" y="102" font-size="10" fill="#888">idx2 绿 / idx3 红（同值不同位）</text>

  <!-- ===== Layer 0 ===== -->
  <rect x="20" y="126" width="500" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="146" font-size="11.5" fill="#d6a040" font-weight="bold">Layer 0（path=[]，选第 1 个元素，start=0）used = {}</text>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="60"  y="156" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="80"  y="172" fill="#4a7a3a">4 ✓</text>
    <rect x="104" y="156" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="124" y="172" fill="#4a7a3a">6 ✓</text>
    <rect x="148" y="156" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="168" y="172" fill="#4a7a3a">7 ✓</text>
    <rect x="192" y="156" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="212" y="172" fill="#b85450">7 ✗</text>
  </g>
  <text x="250" y="172" font-size="10.5" fill="#b85450">← 7 已在 used，跳过（避免重复 [7,...]）</text>
  <text x="34" y="194" font-size="10" fill="#888">used 累积为 {4, 6, 7}；本层试完后 path 回溯，used 随函数栈销毁</text>

  <!-- ===== Layer 1 ===== -->
  <rect x="20" y="210" width="500" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="230" font-size="11.5" fill="#446688" font-weight="bold">Layer 1（path=[4]，选第 2 个元素，start=1）used = {}（重置！）</text>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="60"  y="240" width="40" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="80"  y="256" fill="#aaa">4 ·</text>
    <rect x="104" y="240" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="124" y="256" fill="#4a7a3a">6 ✓</text>
    <rect x="148" y="240" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="168" y="256" fill="#4a7a3a">7 ✓</text>
    <rect x="192" y="240" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="212" y="256" fill="#b85450">7 ✗</text>
  </g>
  <text x="250" y="256" font-size="10.5" fill="#b85450">← 同层已试 7，跳过（避免重复 [4,7]）</text>
  <text x="34" y="278" font-size="10" fill="#888">start=1：idx0 的 4 在本层不可选（虚线灰格）；used 累积 {6, 7}</text>

  <!-- ===== Layer 2 ===== -->
  <rect x="20" y="294" width="500" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="314" font-size="11.5" fill="#4a7a3a" font-weight="bold">Layer 2（path=[4, 7(idx2)]，选第 3 个元素，start=2）used = {}（再重置）</text>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="60"  y="324" width="40" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="80"  y="340" fill="#aaa">·</text>
    <rect x="104" y="324" width="40" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="124" y="340" fill="#aaa">·</text>
    <rect x="148" y="324" width="40" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="168" y="340" fill="#aaa">·</text>
    <rect x="192" y="324" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="212" y="340" fill="#4a7a3a">7 ✓</text>
  </g>
  <text x="250" y="340" font-size="10.5" fill="#4a7a3a">← 跨层允许！这是新位置的第 3 个元素 → [4,7,7]</text>
  <text x="34" y="362" font-size="10" fill="#4a7a3a">同层去重不误伤跨层：第二层的 7 与第一层的 7 处于不同 path 位置，互不冲突</text>
</svg>
