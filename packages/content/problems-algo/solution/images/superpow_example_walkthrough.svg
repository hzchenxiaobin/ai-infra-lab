<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：a = 2, b = [1, 0]，结果 1024</text>

  <!-- column headers -->
  <text x="36" y="56" font-size="11" fill="#888">阶段</text>
  <text x="150" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">当前位 d</text>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">res^10 mod 1337</text>
  <text x="410" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a^d mod 1337</text>
  <text x="510" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">新 res</text>

  <!-- ===== Row 0: 初始 res=1 ===== -->
  <rect x="20" y="68" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="60" y="91" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">初始</text>
  <rect x="120" y="68" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="91" text-anchor="middle" font-size="12" fill="#bbb" font-weight="bold">—</text>
  <rect x="240" y="68" width="80" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="91" text-anchor="middle" font-size="12" fill="#bbb" font-weight="bold">—</text>
  <rect x="370" y="68" width="80" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="91" text-anchor="middle" font-size="12" fill="#bbb" font-weight="bold">—</text>
  <rect x="470" y="68" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="510" y="91" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- arrow 0 -->
  <path d="M 280 108 Q 280 118 280 126" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="120" font-size="10.5" fill="#888">取 d=1</text>

  <!-- ===== Row 1: d=1 ===== -->
  <rect x="20" y="130" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="60" y="153" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">第 1 轮</text>
  <rect x="120" y="130" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="153" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <rect x="240" y="130" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="153" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="130" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="153" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>
  <rect x="470" y="130" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="510" y="153" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <!-- annotation row 1 -->
  <text x="280" y="180" text-anchor="middle" font-size="10.5" fill="#888">1^10 = 1   ·   2^1 = 2   →   (1 × 2) mod 1337 = 2</text>

  <!-- arrow 1 -->
  <path d="M 280 188 Q 280 198 280 206" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="200" font-size="10.5" fill="#888">取 d=0</text>

  <!-- ===== Row 2: d=0 ===== -->
  <rect x="20" y="210" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="60" y="233" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">第 2 轮</text>
  <rect x="120" y="210" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="233" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="240" y="210" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1024</text>
  <rect x="370" y="210" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="233" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <rect x="470" y="210" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="510" y="233" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1024</text>

  <!-- annotation row 2 -->
  <text x="280" y="260" text-anchor="middle" font-size="10.5" fill="#888">2^10 = 1024   ·   2^0 = 1   →   (1024 × 1) mod 1337 = 1024</text>

  <!-- arrow to result -->
  <path d="M 510 250 Q 510 268 510 276" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- invariant explanation -->
  <rect x="40" y="284" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">处理完 d=1：res = 2 = 2^1   ✓</text>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">处理完 d=0：res = 1024 = 2^10 = 2^[1,0]   ✓</text>

  <!-- result box -->
  <rect x="100" y="340" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">数组遍历完，返回 res = 1024 ✓</text>

  <!-- bottom note -->
  <rect x="40" y="392" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">每轮把 res 升 10 次幂再补 a^d，恰好模拟「左移一位 + 加新数字」</text>
</svg>
