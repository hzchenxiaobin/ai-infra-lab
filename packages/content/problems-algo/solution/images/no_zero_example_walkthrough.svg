<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 1010 逐步枚举</text>

  <rect x="40" y="44" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <rect x="110" y="44" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">b = n − a</text>
  <rect x="200" y="44" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">b 的各位</text>
  <rect x="370" y="44" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">判定</text>

  <text x="75" y="98" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="155" y="98" text-anchor="middle" font-size="12" fill="#333">1009</text>
  <rect x="206" y="84" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="228" y="84" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="238" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="250" y="84" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="272" y="84" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="282" y="100" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="382" y="84" width="106" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ b 含 0</text>

  <text x="75" y="130" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="155" y="130" text-anchor="middle" font-size="12" fill="#333">1008</text>
  <rect x="206" y="116" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="132" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="228" y="116" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="238" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="250" y="116" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="272" y="116" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="282" y="132" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="382" y="116" width="106" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ b 含 0</text>

  <text x="270" y="166" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">⋮  a = 3 … 10：b 形如 1007 … 1000，均含 0</text>

  <text x="75" y="198" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="155" y="198" text-anchor="middle" font-size="12" fill="#333">1000</text>
  <rect x="206" y="184" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="200" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="228" y="184" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="238" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="250" y="184" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="272" y="184" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="282" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="382" y="184" width="106" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ b 含 0</text>

  <rect x="40" y="216" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="75" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">11</text>
  <text x="155" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">999</text>
  <rect x="214" y="220" width="20" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="224" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <rect x="236" y="220" width="20" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="246" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <rect x="258" y="220" width="20" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="268" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <rect x="382" y="220" width="106" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 均无零</text>

  <path d="M 435 244 L 435 268" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="320" y="270" width="230" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="435" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 [11, 999]</text>

  <rect x="40" y="318" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="340" font-size="12" fill="#d6a040" font-weight="bold">观察：n = 1010 含 0，故 a = 1…10 时 b = 1009…1000 必含 0</text>
  <text x="60" y="358" font-size="12" fill="#555">需 a ≥ 11 才能把 b 拉到三位数 999，绕开 b 的零位 —— 这正是枚举的代价上限很小</text>
</svg>
