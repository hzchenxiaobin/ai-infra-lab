<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：解法 A（JOIN + MIN）与 解法 B（ROW_NUMBER）殊途同归</text>

  <!-- ===== Left column: Approach A ===== -->
  <text x="180" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">解法 A：JOIN 子查询 + GROUP BY MIN</text>

  <rect x="30" y="62" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="45" y="80" font-size="10" fill="#446688" font-weight="bold">① 子查询 m：每城 MAX(degree)</text>
  <text x="45" y="96" font-size="9" fill="#333">SELECT city_id, MAX(degree) AS max_degree</text>
  <text x="45" y="108" font-size="9" fill="#333">FROM Weather GROUP BY city_id</text>

  <path d="M180 112 L180 134" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="30" y="134" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="45" y="152" font-size="10" fill="#d6a040" font-weight="bold">② JOIN 原表，只留 degree=max 的行</text>
  <text x="45" y="166" font-size="9" fill="#333">FROM Weather w JOIN m ON city_id 同且 degree=max_degree</text>
  <text x="45" y="176" font-size="9" fill="#888">→ 得"每城最高气温行"（含并列的若干天）</text>

  <path d="M180 178 L180 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="30" y="200" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="45" y="218" font-size="10" fill="#4a7a3a" font-weight="bold">③ GROUP BY city_id，MIN(day)</text>
  <text x="45" y="232" font-size="9" fill="#333">SELECT w.city_id, MIN(w.day) AS day</text>
  <text x="45" y="242" font-size="9" fill="#333">GROUP BY w.city_id</text>

  <path d="M180 244 L180 266" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="30" y="266" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ 结果 (city_id, day)，每城一行</text>

  <!-- ===== Right column: Approach B ===== -->
  <text x="540" y="54" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">解法 B：ROW_NUMBER 窗口函数</text>

  <rect x="390" y="62" width="300" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="80" font-size="10" fill="#b85450" font-weight="bold">① 窗口给每行打序号 rn</text>
  <text x="405" y="95" font-size="9" fill="#333">SELECT city_id, day,</text>
  <text x="405" y="107" font-size="9" fill="#333">  ROW_NUMBER() OVER (</text>
  <text x="405" y="119" font-size="9" fill="#b85450">    PARTITION BY city_id</text>
  <text x="405" y="131" font-size="9" fill="#b85450">    ORDER BY degree DESC, day ASC) AS rn</text>

  <path d="M540 136 L540 158" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="390" y="158" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="176" font-size="10" fill="#d6a040" font-weight="bold">② 取 rn = 1（最高温 + 最早）</text>
  <text x="405" y="190" font-size="9" fill="#333">FROM (上面子查询) t WHERE rn = 1</text>
  <text x="405" y="200" font-size="9" fill="#888">degree DESC 先定最高；day ASC 再取最早</text>

  <path d="M540 202 L540 224" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="390" y="224" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="540" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ 结果 (city_id, day)，每城一行</text>

  <!-- merge arrow: both -> same result -->
  <path d="M180 296 Q180 330 360 332" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M540 254 Q540 330 360 332" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Bottom contrast callout ===== -->
  <rect x="30" y="312" width="660" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="360" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 本题要"某一天"（单值）而非"所有最高行"，故用 ROW_NUMBER（每城恰好一行）</text>
  <text x="360" y="350" text-anchor="middle" font-size="10" fill="#666">对比 1831/1549 要"所有最高行/并列全保留"用 RANK；这里 RANK 会在同日同度重复读数时产出多行</text>
  <text x="360" y="364" text-anchor="middle" font-size="10" fill="#666">A 用"组级 MAX 筛行 + 再组级 MIN 取最早"两步聚合；B 用"复合排序 + 取首行"一步到位</text>
</svg>
