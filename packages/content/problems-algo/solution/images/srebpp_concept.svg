<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">连通性保证投影连续 → 可二分定位边界</text>
  <text x="270" y="44" text-anchor="middle" font-size="10" fill="#888">黑色区域四连通，故含黑的列/行各成一段连续区间</text>

  <!-- ===== 列投影条（网格上方） ===== -->
  <text x="80" y="66" text-anchor="end" font-size="10" fill="#888">列投影</text>
  <!-- 4 段，对齐网格 4 列 -->
  <rect x="130" y="74" width="40" height="14" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="170" y="74" width="40" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="210" y="74" width="40" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="250" y="74" width="40" height="14" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="71" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">[L, R] 连续</text>

  <!-- ===== 行投影条（网格左侧） ===== -->
  <text x="74" y="142" text-anchor="end" font-size="10" fill="#888">行</text>
  <text x="74" y="156" text-anchor="end" font-size="10" fill="#888">投</text>
  <text x="74" y="170" text-anchor="end" font-size="10" fill="#888">影</text>
  <rect x="84" y="100" width="14" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="84" y="140" width="14" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="84" y="180" width="14" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="165" font-size="9" fill="#d6a040" font-weight="bold" transform="rotate(-90 100 165)">[T, B] 连续</text>

  <!-- ===== 网格（3 行 4 列） ===== -->
  <!-- 列标号 -->
  <text x="150" y="236" text-anchor="middle" font-size="9" fill="#999">c0</text>
  <text x="190" y="236" text-anchor="middle" font-size="9" fill="#999">c1</text>
  <text x="230" y="236" text-anchor="middle" font-size="9" fill="#999">c2</text>
  <text x="270" y="236" text-anchor="middle" font-size="9" fill="#999">c3</text>
  <!-- 行标号 -->
  <text x="120" y="124" text-anchor="end" font-size="9" fill="#999">r0</text>
  <text x="120" y="164" text-anchor="end" font-size="9" fill="#999">r1</text>
  <text x="120" y="204" text-anchor="end" font-size="9" fill="#999">r2</text>

  <!-- 白格 -->
  <rect x="130" y="100" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="170" y="100" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="250" y="100" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="140" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="250" y="140" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="180" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="210" y="180" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="250" y="180" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 黑格（连通区域） -->
  <rect x="210" y="100" width="40" height="40" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="170" y="140" width="40" height="40" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="210" y="140" width="40" height="40" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="170" y="180" width="40" height="40" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 包围矩形（橙色虚边） -->
  <rect x="170" y="100" width="80" height="120" fill="none" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- 锚点 (x=0,y=2) -->
  <circle cx="230" cy="120" r="6" fill="#b85450" stroke="#fff" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="296" y="118" font-size="10" fill="#b85450" font-weight="bold">锚点 (x,y)</text>
  <text x="296" y="131" font-size="9" fill="#b85450">已知黑像素</text>

  <!-- 连通示意（黑格之间的虚连线） -->
  <path d="M230 140 L210 160 M210 160 L190 160 M190 160 L190 180" stroke="#2f5526" stroke-width="1" stroke-dasharray="2,2" fill="none" opacity="0.6" filter="url(#rough2)"/>

  <!-- ===== 右侧：核心引理 ===== -->
  <text x="430" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">关键引理</text>
  <rect x="330" y="100" width="220" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="440" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">四连通 ⇒ 投影连续</text>
  <text x="440" y="138" text-anchor="middle" font-size="9" fill="#555">若列 c 在 [L,R] 间却无黑像素</text>
  <text x="440" y="150" text-anchor="middle" font-size="9" fill="#555">左右黑像素无法连通 → 矛盾</text>

  <rect x="330" y="170" width="220" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="440" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">连续 ⇒ 谓词单调</text>
  <text x="440" y="208" text-anchor="middle" font-size="9" fill="#555">从锚点向左：“有黑”在某处</text>
  <text x="440" y="220" text-anchor="middle" font-size="9" fill="#555">由真变假 → 可二分</text>

  <rect x="330" y="240" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="440" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">结论：四方向二分</text>
  <text x="440" y="278" text-anchor="middle" font-size="9" fill="#555">各找一条边界，互不依赖</text>

  <path d="M440 158 L440 168 M440 228 L440 238" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部复杂度 -->
  <rect x="40" y="300" width="510" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="295" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">面积 = (R−L+1) × (B−T+1)，时间 O(m log n + n log m)，空间 O(1)</text>
</svg>
