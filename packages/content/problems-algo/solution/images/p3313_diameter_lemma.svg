<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：离谁最远，都逃不出直径两端 (a, b)</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">标记过程 = 从 i 出发的 BFS：时刻(v) = dist(i,v) ⟹ 「最后标记」⇔「离 i 最远」</text>

  <!-- ===== 主干（直径路径） ===== -->
  <line x1="95" y1="160" x2="425" y2="160" stroke="#446688" stroke-width="3.5" filter="url(#rough2)"/>
  <!-- v→b 主干段（绿色高亮） -->
  <line x1="330" y1="160" x2="425" y2="160" stroke="#4a7a3a" stroke-width="5" filter="url(#rough2)"/>

  <!-- 端点 a -->
  <circle cx="95" cy="160" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="95" y="165" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="95" y="190" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">直径端点</text>

  <!-- 端点 b -->
  <circle cx="425" cy="160" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="425" y="165" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="425" y="190" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">直径端点</text>

  <!-- 投影点 u、v -->
  <circle cx="185" cy="160" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="182" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">u</text>
  <circle cx="330" cy="160" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="182" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">v</text>

  <!-- 段标注 -->
  <text x="257" y="150" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d(u,v)</text>
  <text x="378" y="147" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d(v,b)</text>

  <!-- x 挂在 u 上方 -->
  <line x1="185" y1="152" x2="185" y2="92" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="172" y="125" text-anchor="end" font-size="10" fill="#a07830" filter="url(#rough2)">d(x,u)</text>
  <circle cx="185" cy="80" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="85" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="205" y="76" font-size="9.5" fill="#a07830" filter="url(#rough2)">x 的投影 = u（任取的查询点）</text>
  <text x="205" y="90" font-size="9.5" fill="#a07830" filter="url(#rough2)">最远点是谁？往下看 ↓</text>

  <!-- y 挂在 v 下方 -->
  <line x1="330" y1="168" x2="330" y2="228" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="330" cy="240" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="245" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">y</text>
  <text x="312" y="205" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">尾巴 d(v,y)</text>

  <!-- 换尾反证标注框 -->
  <rect x="368" y="212" width="142" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="439" y="230" text-anchor="middle" font-size="9.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">挂尾引理：d(v,y) ≤ min(d(v,a), d(v,b))</text>
  <text x="439" y="246" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">否则 a→v→y 比直径 a→b 还长 ✗</text>
  <text x="439" y="260" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">「换尾」必更长，矛盾！</text>

  <!-- 不等式链 -->
  <rect x="26" y="278" width="468" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">主引理：任意 x, y 有 d(x,y) ≤ d(x,u)+d(u,v)+d(v,y) ≤ d(x,u)+d(u,v)+d(v,b) = d(x,b)</text>
  <text x="260" y="316" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">（三角不等式 ×2 ＋ 挂尾引理 ＋ 沿主干可加；v 在 u 靠 b 侧，另一侧对称）</text>
  <text x="260" y="330" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">把 x→y 的路「抬」到主干上走，再用挂尾引理收口</text>

  <!-- 结论 -->
  <rect x="26" y="344" width="468" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⇒ ecc(x) = max(d(x,a), d(x,b))，故 nodes[i] = (d(i,a) > d(i,b)) ? a : b</text>
</svg>
