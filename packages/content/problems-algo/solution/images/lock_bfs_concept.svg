<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">把「拨锁」建模成「无权图最短路」</text>
  <path d="M 300 42 Q 430 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT: 每个状态有 8 个邻居 ===== -->
  <g filter="url(#sk)">
    <rect x="24" y="74" width="404" height="446" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="226" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#34506e">① 每个状态 = 节点，有 8 条出边</text>

  <!-- lock wheels 0000 -->
  <g filter="url(#sk)">
    <rect x="178" y="120" width="96" height="34" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#34506e" text-anchor="middle">
    <text x="198" y="143">0</text><text x="222" y="143">0</text><text x="246" y="143">0</text><text x="270" y="143">0</text>
  </g>
  <text x="226" y="172" text-anchor="middle" font-size="10.5" fill="#7a7a7a">每次拨一个转盘 ±1 → 8 种走法</text>

  <!-- edges from center to 8 neighbors -->
  <g stroke="#9aa6b8" stroke-width="1.3" fill="none" filter="url(#sk)">
    <line x1="226" y1="292" x2="226" y2="214"/>
    <line x1="226" y1="292" x2="288" y2="230"/>
    <line x1="226" y1="292" x2="312" y2="292"/>
    <line x1="226" y1="292" x2="288" y2="354"/>
    <line x1="226" y1="292" x2="226" y2="370"/>
    <line x1="226" y1="292" x2="164" y2="354"/>
    <line x1="226" y1="292" x2="140" y2="292"/>
    <line x1="226" y1="292" x2="164" y2="230"/>
  </g>

  <!-- center node 0000 -->
  <g filter="url(#sk)">
    <ellipse cx="226" cy="292" rx="34" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="226" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#34506e">0000</text>

  <!-- 8 neighbor nodes -->
  <g font-size="11.5" fill="#34506e" text-anchor="middle">
    <g filter="url(#sk)"><rect x="206" y="196" width="40" height="20" rx="5" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="226" y="210">1000</text>
    <g filter="url(#sk)"><rect x="268" y="220" width="40" height="20" rx="5" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="288" y="234">0100</text>
    <g filter="url(#sk)"><rect x="292" y="282" width="40" height="20" rx="5" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="312" y="296">0010</text>
    <g filter="url(#sk)"><rect x="268" y="344" width="40" height="20" rx="5" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="288" y="358">0001</text>
    <g filter="url(#sk)"><rect x="206" y="360" width="40" height="20" rx="5" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="226" y="374">9000</text>
    <g filter="url(#sk)"><rect x="144" y="344" width="40" height="20" rx="5" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="164" y="358">0900</text>
    <g filter="url(#sk)"><rect x="120" y="282" width="40" height="20" rx="5" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="140" y="296">0090</text>
    <g filter="url(#sk)"><rect x="144" y="220" width="40" height="20" rx="5" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="164" y="234">0009</text>
  </g>
  <text x="226" y="406" text-anchor="middle" font-size="10.5" fill="#5a5a5a">4 个转盘 × (上拨 / 下拨) = 8 个邻居</text>
  <g filter="url(#sk)">
    <rect x="44" y="424" width="364" height="78" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="226" y="446" text-anchor="middle" font-size="11" fill="#7a5415">把每个 4 位串看成「节点」</text>
  <text x="226" y="466" text-anchor="middle" font-size="11" fill="#7a5415">两串只差「一个转盘拨一格」就连一条边</text>
  <text x="226" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">→ 最少拨动次数 = 无权图最短路径</text>

  <!-- ===== RIGHT: BFS 按层扩展 ===== -->
  <g filter="url(#sk)">
    <rect x="444" y="74" width="392" height="446" rx="10" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="640" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">② BFS 按层扩展：层 = 步数</text>

  <!-- concentric layers -->
  <g filter="url(#sk)">
    <rect x="470" y="150" width="340" height="280" rx="18" fill="none" stroke="#bcd8bc" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="492" y="168" font-size="10.5" fill="#6a9a6a">层 2 · 2 步</text>
  <g filter="url(#sk)">
    <rect x="500" y="186" width="280" height="208" rx="16" fill="none" stroke="#9ec9a0" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="522" y="204" font-size="10.5" fill="#6a9a6a">层 1 · 1 步</text>
  <g filter="url(#sk)">
    <rect x="528" y="220" width="224" height="140" rx="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="552" y="240" font-size="10.5" fill="#2e6e2e">层 0 · 0 步</text>

  <!-- center start node -->
  <g filter="url(#sk)">
    <ellipse cx="640" cy="292" rx="34" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="640" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#34506e">0000</text>
  <text x="640" y="372" text-anchor="middle" font-size="10" fill="#5a5a5a">起点</text>

  <!-- expansion arrow -->
  <path d="M 640 270 Q 700 210 760 168" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="718" y="214" font-size="10.5" fill="#2e6e2e">一圈圈</text>
  <text x="718" y="228" font-size="10.5" fill="#2e6e2e">向外扩</text>

  <!-- target node on outer layer -->
  <g filter="url(#sk)">
    <ellipse cx="760" cy="168" rx="38" ry="20" fill="#fff0f3" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="760" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">0202</text>
  <text x="760" y="146" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">⭐ target · 层 6</text>

  <!-- deadends as red X on the way -->
  <g filter="url(#sk)">
    <ellipse cx="560" cy="168" rx="30" ry="16" fill="#fdecee" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
  </g>
  <text x="560" y="172" text-anchor="middle" font-size="10" fill="#b85450">0201</text>
  <text x="560" y="150" text-anchor="middle" font-size="9.5" fill="#b85450">✗ 死亡组合</text>

  <g filter="url(#sk)">
    <rect x="464" y="446" width="352" height="58" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="640" y="468" text-anchor="middle" font-size="11" fill="#7a5415">每条边权 = 1 → 无权图</text>
  <text x="640" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">BFS 首次到达 target 的层数 = 最少拨动次数</text>

  <!-- bottom legend -->
  <text x="430" y="528" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">死亡组合 = 禁点（不踏入）；状态总数 ≤ 10⁴，BFS 必然在有限步内终止</text>
</svg>
