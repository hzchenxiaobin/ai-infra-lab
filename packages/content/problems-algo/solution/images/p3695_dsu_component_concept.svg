<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：swap 对 = 无向边 → 连通分量 → 分量内任意重排 → 最大 E 个值放上偶下标</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1：nums = [1,2,3]，swaps = [[0,2],[1,2]] → 下标 0,1,2 连成一个分量，E = 2 个偶下标</text>

  <!-- left panel: swap graph -->
  <rect x="30" y="56" width="200" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="76" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">① swap 对建图（并查集）</text>

  <!-- swap arcs above cells -->
  <path d="M 71,96 Q 110,60 149,96" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 115,96 Q 134,74 153,96" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="58" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">swap×2</text>

  <!-- cells 0 1 2 -->
  <rect x="52" y="98" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="96" y="98" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="98" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="71" y="142" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下标0(偶)</text>
  <text x="115" y="142" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">下标1(奇)</text>
  <text x="159" y="142" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下标2(偶)</text>

  <text x="42" y="168" font-size="10" fill="#333" filter="url(#rough2)">对换可复合 ⇒ 生成整个置换群</text>
  <text x="42" y="186" font-size="10" fill="#333" filter="url(#rough2)">⇒ 分量内 3 个值可排成任意顺序</text>
  <text x="42" y="208" font-size="9.5" fill="#888" filter="url(#rough2)">跨分量：值永远过不去</text>

  <!-- middle arrow -->
  <path d="M 236,140 L 276,140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="130" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">重排</text>

  <!-- right panel: greedy placement -->
  <rect x="282" y="56" width="248" height="168" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="294" y="76" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 贪心放置（值降序 [3,2,1]）</text>

  <rect x="304" y="98" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="352" y="98" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="400" y="98" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="419" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="323" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">偶位+3</text>
  <text x="371" y="142" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">奇位−1</text>
  <text x="419" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">偶位+2</text>

  <text x="456" y="112" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">← topE</text>
  <text x="456" y="124" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(3+2)</text>

  <text x="294" y="168" font-size="10" fill="#333" filter="url(#rough2)">E = 2 个偶下标 ⇒ 挑分量内</text>
  <text x="294" y="186" font-size="10" fill="#333" filter="url(#rough2)">最大的 2 个值（3、2）放偶位，</text>
  <text x="294" y="204" font-size="10" fill="#333" filter="url(#rough2)">最小的 1 放奇位吃减号</text>

  <!-- formula panel -->
  <rect x="30" y="238" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="260" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">分量贡献 = 2 × topE − sumAll = 2×(3+2) − (1+2+3) = 10 − 6 = 4 ✓</text>
  <text x="42" y="284" font-size="10.5" fill="#333" filter="url(#rough2)">E 由分量的下标奇偶性决定，与怎么交换无关；答案 = Σ 各分量贡献</text>

  <!-- bottom note -->
  <rect x="30" y="312" width="500" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="42" y="332" font-size="10.5" fill="#333" filter="url(#rough2)">不能全局排序！值只能留在自己分量里（示例 2：3 困在分量 {1,2}，够不着下标 0）</text>
  <text x="42" y="350" font-size="10.5" fill="#333" filter="url(#rough2)">「取最大 E 个」与正负无关——对任意整数数组结论都成立</text>
</svg>
