<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三例带符号求值与位数奇偶</text>

  <!-- ===== Header ===== -->
  <rect x="28" y="40" width="504" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="64" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">n</text>
  <line x1="100" y1="44" x2="100" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">带符号的数位展开</text>
  <line x1="320" y1="44" x2="320" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="356" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">位数 L</text>
  <line x1="396" y1="44" x2="396" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="450" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">个位符号</text>
  <line x1="506" y1="44" x2="506" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="530" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">结果</text>

  <!-- ===== Row 1: 521 ===== -->
  <rect x="28" y="72" width="504" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="64" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">521</text>
  <text x="210" y="94" text-anchor="middle" font-size="12" fill="#555"><tspan fill="#4a7a3a" font-weight="bold">+5</tspan>  <tspan fill="#b85450" font-weight="bold">−2</tspan>  <tspan fill="#4a7a3a" font-weight="bold">+1</tspan></text>
  <text x="356" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="450" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+</text>
  <rect x="512" y="76" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="529" y="94" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- ===== Row 2: 111 ===== -->
  <rect x="28" y="108" width="504" height="34" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="64" y="130" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">111</text>
  <text x="210" y="130" text-anchor="middle" font-size="12" fill="#555"><tspan fill="#4a7a3a" font-weight="bold">+1</tspan>  <tspan fill="#b85450" font-weight="bold">−1</tspan>  <tspan fill="#4a7a3a" font-weight="bold">+1</tspan></text>
  <text x="356" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="450" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+</text>
  <rect x="512" y="112" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="529" y="130" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ===== Row 3: 886996 ===== -->
  <rect x="28" y="144" width="504" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="64" y="166" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">886996</text>
  <text x="210" y="166" text-anchor="middle" font-size="11.5" fill="#555"><tspan fill="#4a7a3a" font-weight="bold">+8</tspan> <tspan fill="#b85450" font-weight="bold">−8</tspan> <tspan fill="#4a7a3a" font-weight="bold">+6</tspan> <tspan fill="#b85450" font-weight="bold">−9</tspan> <tspan fill="#4a7a3a" font-weight="bold">+9</tspan> <tspan fill="#b85450" font-weight="bold">−6</tspan></text>
  <text x="356" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="450" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>
  <rect x="512" y="148" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="529" y="166" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- ===== Annotation box ===== -->
  <rect x="28" y="196" width="504" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="44" y="218" font-size="12" fill="#b85450" font-weight="bold">⚠ 位数奇偶决定个位符号（从右取位的基准）</text>

  <text x="44" y="242" font-size="11.5" fill="#333">• <tspan font-weight="bold">L 为奇</tspan>（如 521、111）：最高位 + 是第 0 位，个位落在第 <tspan font-weight="bold">L−1</tspan> 个偶数下标 → 个位取 <tspan font-weight="bold" fill="#4a7a3a">+</tspan></text>
  <text x="44" y="262" font-size="11.5" fill="#333">• <tspan font-weight="bold">L 为偶</tspan>（如 886996）：个位下标 L−1 为奇 → 个位取 <tspan font-weight="bold" fill="#b85450">−</tspan>，其余逐位翻转</text>

  <text x="44" y="288" font-size="11.5" fill="#333">验证 886996：个位 6 取 −，往左依次 +9、−9、+6、−8、+8：</text>
  <text x="44" y="306" font-size="11.5" fill="#555">　(−6) + (+9) + (−9) + (+6) + (−8) + (+8) = 0 ✓（与从左展开完全一致）</text>

  <text x="44" y="328" font-size="11" fill="#888">→ 从右取位无需先把数字转成字符串，仅靠 n%10 / n//=10 即可逐位处理。</text>
</svg>
