<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">洪水时间表 vs 人的逃生路径（示例 1）</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每格右下角小字 = 洪水到达秒数 flood[]，红箭头 = 人走的路径</text>

  <!-- ===== Grid 3x3, cell 60, origin (40,70) ===== -->
  <!-- row0: D . * -->
  <rect x="40" y="70" width="60" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="70" y="106" text-anchor="middle" font-size="20" fill="#a06a20" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="92" y="124" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=2</text>

  <rect x="100" y="70" width="60" height="60" fill="#fff" stroke="#bbb" rx="5" filter="url(#rough2)"/>
  <text x="130" y="106" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="152" y="124" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=1</text>

  <rect x="160" y="70" width="60" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="190" y="106" text-anchor="middle" font-size="20" fill="#b03a3a" font-weight="bold" filter="url(#rough2)">*</text>
  <text x="212" y="124" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=0</text>

  <!-- row1: . . . -->
  <rect x="40" y="130" width="60" height="60" fill="#fff" stroke="#bbb" rx="5" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="92" y="184" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=3</text>

  <rect x="100" y="130" width="60" height="60" fill="#fff" stroke="#bbb" rx="5" filter="url(#rough2)"/>
  <text x="130" y="166" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="152" y="184" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=2</text>

  <rect x="160" y="130" width="60" height="60" fill="#fff" stroke="#bbb" rx="5" filter="url(#rough2)"/>
  <text x="190" y="166" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="212" y="184" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=1</text>

  <!-- row2: . S . -->
  <rect x="40" y="190" width="60" height="60" fill="#fff" stroke="#bbb" rx="5" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="92" y="244" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=4</text>

  <rect x="100" y="190" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="130" y="226" text-anchor="middle" font-size="20" fill="#2b5d8a" font-weight="bold" filter="url(#rough2)">S</text>
  <text x="152" y="244" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=3</text>

  <rect x="160" y="190" width="60" height="60" fill="#fff" stroke="#bbb" rx="5" filter="url(#rough2)"/>
  <text x="190" y="226" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="212" y="244" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=2</text>

  <!-- person path arrows: S(2,1)->(2,0)->(1,0)->(0,0)D ; centers (130,220)(70,220)(70,160)(70,100) -->
  <path d="M 104 220 L 96 220" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 70 214 L 70 206" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 70 154 L 70 146" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <!-- arrival time labels along path -->
  <text x="130" y="258" text-anchor="middle" font-size="9" fill="#2b5d8a" font-weight="bold" filter="url(#rough2)">arr=0</text>
  <text x="36" y="222" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">arr=1</text>
  <text x="36" y="162" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">arr=2</text>
  <text x="36" y="102" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">arr=3</text>

  <!-- legend under grid -->
  <text x="130" y="280" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">洪水时间表 flood[][]（多源 BFS 从 * 出发）</text>

  <!-- ===== Right panel: the race ===== -->
  <rect x="270" y="70" width="270" height="230" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="405" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">谁先到 D？</text>

  <!-- flood bar -->
  <text x="288" y="124" font-size="11" fill="#b03a3a" font-weight="bold" filter="url(#rough2)">洪水到 D</text>
  <rect x="288" y="132" width="200" height="16" fill="#fce4ec" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <rect x="288" y="132" width="80" height="16" fill="#b85450" rx="3" filter="url(#rough2)"/>
  <text x="368" y="144" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">第 2 秒</text>
  <text x="492" y="144" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">flood[D]=2</text>

  <!-- person bar -->
  <text x="288" y="178" font-size="11" fill="#2b5d8a" font-weight="bold" filter="url(#rough2)">你到 D</text>
  <rect x="288" y="186" width="200" height="16" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <rect x="288" y="186" width="120" height="16" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="348" y="198" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">第 3 秒</text>
  <text x="492" y="198" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">arr[D]=3</text>

  <!-- verdict -->
  <rect x="288" y="224" width="234" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="248" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold" filter="url(#rough2)">2 &lt; 3：洪水严格先到</text>
  <text x="405" y="266" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">踏入 D 时已被淹没 → 淹死</text>
  <text x="405" y="280" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold" filter="url(#rough2)">返回 -1</text>

  <!-- bottom note -->
  <rect x="40" y="312" width="500" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="334" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">核心：先把洪水到达时刻算成静态表 flood[][]，再让人在 arr ≤ flood 的约束下走最短路</text>
  <text x="56" y="352" font-size="10" fill="#555" filter="url(#rough2)">平手（arr = flood）算人逃生成功；洪水严格先到（flood &lt; arr）则淹死——对 D 也一视同仁</text>
</svg>
