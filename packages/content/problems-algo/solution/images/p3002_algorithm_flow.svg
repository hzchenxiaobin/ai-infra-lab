<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：集合三分 + 独占优先 + 剩余名额填公共值</text>

  <!-- step 1 -->
  <rect x="170" y="46" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 去重建集合</text>
  <text x="280" y="80" text-anchor="middle" font-size="10" fill="#666">s₁ = set(nums1)，s₂ = set(nums2)</text>

  <path d="M 280 88 L 280 106" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="150" y="110" width="260" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 值域三分</text>
  <text x="280" y="147" text-anchor="middle" font-size="10" fill="#666">a = |s₁−s₂|，b = |s₂−s₁|，c = |s₁∩s₂|</text>

  <path d="M 280 162 L 280 180" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="120" y="184" width="320" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 独占优先保留（各自最多 n/2 个）</text>
  <text x="280" y="221" text-anchor="middle" font-size="10" fill="#666">k₁ = min(a, n/2)，k₂ = min(b, n/2)</text>

  <path d="M 280 236 L 280 254" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="120" y="258" width="320" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 剩余名额填公共值（每个只赚 1 个）</text>
  <text x="280" y="295" text-anchor="middle" font-size="10" fill="#666">c₁ = n/2−k₁，c₂ = n/2−k₂ → 补 min(c, c₁+c₂) 个</text>

  <path d="M 280 310 L 280 328" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="150" y="332" width="260" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤ 返回 k₁ + k₂ + min(c, c₁+c₂)</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#888">全程只做集合运算，无需真的模拟删除</text>

  <!-- side note -->
  <rect x="430" y="184" width="110" height="126" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="485" y="212" text-anchor="middle" font-size="10" fill="#777">注意：</text>
  <text x="485" y="232" text-anchor="middle" font-size="9" fill="#777">重复元素不占</text>
  <text x="485" y="246" text-anchor="middle" font-size="9" fill="#777">「不同值」名额，</text>
  <text x="485" y="260" text-anchor="middle" font-size="9" fill="#777">先去重再计数</text>
  <text x="485" y="282" text-anchor="middle" font-size="9" fill="#777">公共值塞进</text>
  <text x="485" y="296" text-anchor="middle" font-size="9" fill="#777">任一边都行，</text>
  <text x="485" y="304" text-anchor="middle" font-size="9" fill="#777">只需算总名额</text>
</svg>
