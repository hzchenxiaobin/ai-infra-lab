<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：O(n) 预处理 + 闭式相减</text>
  <text x="470" y="26" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">MOD = 10⁹+7</text>

  <!-- start -->
  <ellipse cx="260" cy="50" rx="62" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 n, k</text>

  <path d="M 260 68 L 260 78" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- precompute -->
  <rect x="150" y="80" width="220" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">预处理 fact[0..n] / invFact[0..n]</text>
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">费马小定理 + 倒序递推，O(n)</text>

  <path d="M 260 124 L 260 134" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- total -->
  <rect x="150" y="136" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">total = C(n−1, k−1)</text>

  <path d="M 260 170 L 260 180" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="260,180 350,212 260,244 170,212" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n − k</text>
  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">是偶数？</text>

  <!-- yes branch -->
  <path d="M 350 212 L 388 212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="390" y="188" width="122" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="451" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bad =</text>
  <text x="451" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C((n+k)/2−1, k−1)</text>

  <!-- no branch -->
  <path d="M 170 212 L 132 212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="204" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="22" y="194" width="108" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">bad = 0</text>

  <!-- merge -->
  <path d="M 451 236 L 451 268 L 372 268" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 76 230 L 76 268 L 148 268" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="150" y="250" width="220" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">ans = (total − bad + MOD) % MOD</text>

  <path d="M 260 286 L 260 300" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <ellipse cx="260" cy="324" rx="62" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
