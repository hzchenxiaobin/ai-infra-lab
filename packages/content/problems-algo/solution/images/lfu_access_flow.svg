<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="540" fill="#fafafa"/>

  <text x="310" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">LFU 算法流程</text>
  <path d="M 200 40 Q 310 48 420 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- get(key) branch -->
  <g filter="url(#sk)">
    <rect x="180" y="58" width="260" height="36" rx="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="310" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">get(key) / put 命中</text>

  <path d="M 310 94 L 310 112" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="310,114 410,150 310,186 210,150" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4"/>
  </g>
  <text x="310" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">key 在哈希表？</text>
  <text x="310" y="162" text-anchor="middle" font-size="10" fill="#999">(mp.count(key))</text>

  <!-- no -->
  <path d="M 210 150 L 130 150 L 130 210" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="138" y="142" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="70" y="212" width="120" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="130" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 -1</text>

  <!-- yes -->
  <path d="M 410 150 L 490 150 L 490 210" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="452" y="142" font-size="11" fill="#4a8e4a" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="420" y="212" width="140" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="490" y="234" text-anchor="middle" font-size="11" fill="#2e6e2e">node = mp[key]</text>

  <path d="M 490 246 L 490 268" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="410" y="270" width="160" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="490" y="292" text-anchor="middle" font-size="11" fill="#2e6e2e">从 freq 桶摘除 node</text>

  <path d="M 490 304 L 490 326" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="410" y="328" width="160" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="490" y="350" text-anchor="middle" font-size="11" fill="#2e6e2e">node.freq++</text>

  <path d="M 490 362 L 490 384" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="410" y="386" width="160" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="490" y="408" text-anchor="middle" font-size="11" fill="#2e6e2e">插入 freq+1 桶 head</text>

  <path d="M 490 420 L 490 442" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="490,444 560,470 490,496 420,470" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="490" y="468" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">旧桶空 且</text>
  <text x="490" y="482" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">freq==min?</text>
  <path d="M 420 470 L 360 470" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="462" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="230" y="453" width="130" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="295" y="475" text-anchor="middle" font-size="11" fill="#7a5415">min_freq++</text>

  <path d="M 490 496 L 490 514" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="490" y="528" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">返回 value</text>

  <!-- put new branch (left side) -->
  <g filter="url(#sk)">
    <rect x="40" y="270" width="160" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="120" y="287" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">put 新 key：</text>
  <text x="120" y="299" text-anchor="middle" font-size="10" fill="#b85450">(走到这里说明未命中)</text>

  <path d="M 120 304 L 120 326" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="120,328 200,358 120,388 40,358" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="120" y="354" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">size==cap?</text>
  <text x="120" y="368" text-anchor="middle" font-size="9" fill="#999">(已满需淘汰)</text>

  <path d="M 200 358 L 250 358" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="206" y="350" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="252" y="341" width="150" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="327" y="358" text-anchor="middle" font-size="10" fill="#b85450">淘汰 min_freq 桶</text>
  <text x="327" y="370" text-anchor="middle" font-size="10" fill="#b85450">tail 前节点(同频最久)</text>

  <path d="M 120 388 L 120 410" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="412" width="160" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="120" y="434" text-anchor="middle" font-size="11" fill="#2e6e2e">入 freq=1 桶 head</text>

  <path d="M 120 446 L 120 468" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="470" width="160" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="120" y="492" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">min_freq = 1</text>
</svg>
