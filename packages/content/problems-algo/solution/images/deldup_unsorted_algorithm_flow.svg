<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：两趟扫描（计数 + 过滤）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">第一趟建 freq，第二趟哑节点过滤，O(n) 时间 O(n) 空间</text>

  <!-- ===== 第一趟：计数 ===== -->
  <rect x="40" y="58" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="120" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第一趟：计数</text>

  <path d="M 120 92 L 120 110" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="112" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">p = head</text>
  <text x="120" y="146" text-anchor="middle" font-size="9" fill="#555">while p: freq[p.val]++</text>
  <text x="120" y="160" text-anchor="middle" font-size="9" fill="#555">p = p.next</text>

  <path d="M 120 168 L 120 186" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="120,188 200,214 120,240 40,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="212" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">p == null?</text>
  <text x="120" y="226" text-anchor="middle" font-size="8" fill="#8a6a20">（计数完毕）</text>

  <text x="206" y="210" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 200 214 L 250 214" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 第二趟：过滤 ===== -->
  <rect x="250" y="58" width="270" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="385" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第二趟：过滤（dummy + prev）</text>

  <path d="M 250 214 L 300 214 L 300 96 L 385 96" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="208" font-size="8" fill="#888">进入第二趟</text>

  <rect x="290" y="108" width="190" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="385" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">dummy.next=head; prev=dummy; curr=head</text>

  <path d="M 385 142 L 385 160" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: curr == null? -->
  <polygon points="385,162 475,198 385,234 295,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="196" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">curr == null?</text>
  <text x="385" y="210" text-anchor="middle" font-size="8" fill="#8a6a20">（过滤完毕）</text>

  <text x="289" y="192" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <path d="M 295 198 L 232 198" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="152" y="182" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="192" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="192" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dummy.next</text>

  <!-- No -->
  <text x="396" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 385 234 L 385 254" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: freq[curr.val] > 1? -->
  <polygon points="385,256 485,296 385,336 285,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="290" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">freq[curr.val]</text>
  <text x="385" y="304" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">&gt; 1 ?</text>
  <text x="385" y="318" text-anchor="middle" font-size="8" fill="#8a6a20">（重复值，删除）</text>

  <!-- Yes: skip -->
  <text x="279" y="286" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <path d="M 285 296 L 222 296" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="270" width="102" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="171" y="288" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">prev.next = curr.next</text>
  <text x="171" y="302" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr = curr.next</text>
  <text x="171" y="316" text-anchor="middle" font-size="8" fill="#888">prev 不动</text>

  <path d="M 171 326 L 171 356 L 230 356 L 230 198 L 295 198" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="278" font-size="8" fill="#888">回到</text>
  <text x="236" y="290" font-size="8" fill="#888">curr==null?</text>

  <!-- No: keep -->
  <text x="396" y="352" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 385 336 L 385 356" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="358" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="385" y="378" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">prev = curr</text>
  <text x="385" y="392" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">curr = curr.next</text>

  <path d="M 470 380 L 510 380 L 510 198 L 475 198" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="514" y="290" font-size="8" fill="#888">回到</text>
  <text x="514" y="302" font-size="8" fill="#888">curr==null?</text>

  <!-- ===== 底部说明 ===== -->
  <rect x="20" y="420" width="520" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="442" font-size="11" fill="#446688" font-weight="bold">两条分支的关键区别：</text>
  <text x="34" y="462" font-size="11" fill="#555">freq&gt;1（重复）→ prev.next 跨过 curr，prev 不动，curr 前进</text>
  <text x="34" y="480" font-size="11" fill="#555">freq==1（唯一）→ prev 前进到 curr（保留），curr 前进一格</text>
  <text x="34" y="498" font-size="10" fill="#888">prev 始终指向"已确认保留的最后一个节点"；freq 表是两趟的桥梁</text>
</svg>
