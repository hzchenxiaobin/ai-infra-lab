<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：中间元素守不住，答案 = max(首, 尾)</text>
  <text x="260" y="35" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">一次只能删一段连续区间 → 剩余 = 前缀段 + 后缀段，端点永生</text>

  <!-- Row A: original array [7,3,9,2,4] -->
  <text x="30" y="80" font-size="10.5" fill="#666" filter="url(#rough2)">原数组</text>
  <text x="110" y="57" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">首</text>
  <rect x="90" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="140" y="62" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="190" y="62" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="81" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="240" y="62" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="310" y="57" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">尾</text>
  <rect x="290" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>

  <text x="110" y="103" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="160" y="103" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="210" y="103" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="260" y="103" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="310" y="103" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">4</text>

  <!-- annotation for the middle 9 -->
  <text x="352" y="72" font-size="9" fill="#b85450" filter="url(#rough2)">9 是全局最大值，</text>
  <text x="352" y="86" font-size="9" fill="#b85450" filter="url(#rough2)">却藏在中间，保不住</text>
  <path d="M 350 78 L 236 78" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Row B: Alice clears in one cut -->
  <text x="30" y="141" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Alice 一刀清场</text>
  <text x="118" y="141" font-size="9.5" fill="#555" filter="url(#rough2)">删[1..4]→</text>
  <rect x="178" y="124" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="194" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="222" y="141" font-size="9.5" fill="#555" filter="url(#rough2)">或 删[0..3]→</text>
  <rect x="298" y="124" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="342" y="141" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 取 max = 7 ✓</text>
  <text x="118" y="158" font-size="8" fill="#999" filter="url(#rough2)">删长度 n−1 的一段完全合法（n−1 &lt; n），游戏当场结束</text>

  <path d="M 110 110 L 186 121" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 310 110 L 312 121" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Row C: Alice tries to keep 9 -->
  <text x="30" y="199" font-size="10" fill="#666" filter="url(#rough2)">Alice 想养 9：</text>
  <text x="120" y="199" font-size="9.5" fill="#555" filter="url(#rough2)">删[3] →</text>
  <rect x="170" y="182" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="187" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="208" y="182" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="246" y="182" width="34" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="284" y="182" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="301" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="342" y="199" font-size="9.5" fill="#b85450" filter="url(#rough2)">轮到 Bob（最小化）</text>

  <path d="M 245 212 L 210 240" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="230" font-size="8.5" fill="#b85450" filter="url(#rough2)">Bob 出刀</text>

  <!-- Row D: Bob cuts away -->
  <text x="30" y="259" font-size="10" fill="#b85450" filter="url(#rough2)">Bob 一刀删 [7,9,2]</text>
  <text x="150" y="259" font-size="9.5" fill="#555" filter="url(#rough2)">→</text>
  <rect x="168" y="242" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="216" y="259" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">9 被带走 ✗</text>
  <text x="300" y="259" font-size="8.5" fill="#999" filter="url(#rough2)">（Bob 拿到 min(7,4) = 4，比 7 更糟）</text>

  <!-- Lemma box -->
  <rect x="60" y="296" width="400" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">两端点引理：轮到 Alice → max(首,尾)；轮到 Bob → min(首,尾)</text>
  <text x="260" y="338" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">答案 = max(nums[0], nums[n−1])（n = 1 时即 nums[0]）</text>
</svg>
