<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：O(n²·L) 平方 DP + 前驱回溯</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="60" rx="46" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 260 78 L 260 92" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="145" y="94" width="230" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 dp[i] = 1，from[i] = −1</text>
  <path d="M 260 133 L 260 147" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 双重循环 -->
  <rect x="145" y="149" width="230" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举 i 与 j &lt; i</text>
  <path d="M 260 188 L 260 202" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,204 350,240 260,276 170,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">组不同 ∧ 等长</text>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">∧ 汉明 = 1 ？</text>
  <path d="M 260 277 L 260 291" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="288" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 否分支绕回循环 -->
  <path d="M 350 240 C 420 240 430 168 377 168" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="205" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否，</text>
  <text x="438" y="220" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过 j</text>

  <!-- 更新 -->
  <rect x="120" y="293" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">若 dp[j]+1 &gt; dp[i]：更新 dp[i]，from[i] = j</text>
  <path d="M 260 332 L 260 346" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 找终点 -->
  <rect x="145" y="348" width="230" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">end = dp 最大值的下标</text>
  <path d="M 260 387 L 260 398" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回溯 -->
  <rect x="105" y="399" width="310" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="416" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">沿 from 回溯收集 words，反转后返回</text>
  <text x="260" y="431" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（收集顺序是终点 → 起点，故需反转）</text>
</svg>
