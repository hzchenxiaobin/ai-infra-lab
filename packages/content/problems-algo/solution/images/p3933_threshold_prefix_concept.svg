  <!-- 左下图例 -->
  <rect x="40" y="276" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="288" font-size="11" fill="#333" filter="url(#rough2)">被考虑的格子（行距、列距均 ≤ x）</text>
  <rect x="40" y="298" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="310" font-size="11" fill="#333" filter="url(#rough2)">四角 (i±x, j±x)：行距 = 列距 = x，忽略</text>
  <rect x="40" y="320" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="332" font-size="11" fill="#333" filter="url(#rough2)">中心 (i,j)：x = matrix[i][j]（非零才查）</text>
  <text x="40" y="356" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">判定：区域内 值 &gt; x 的格子数 = 0</text>
  <text x="40" y="373" font-size="10.5" fill="#555" filter="url(#rough2)">⟺ 局部最大值（自身值恰为 x，不添乱）</text>

  <!-- 右：按阈值建的前缀计数表 -->
  <text x="410" y="52" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">值域 0…200 ⟹ 按阈值 v 建前缀计数表</text>
  <rect x="300" y="62" width="200" height="30" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="400" y="81" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pre[0]：矩形内 值 &gt; 0 的格子数</text>
  <text x="400" y="107" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">⋮</text>
  <rect x="300" y="112" width="200" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="400" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">pre[x] ← 查这张</text>
  <text x="400" y="150" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">矩形 [0,0)~[i,j) 内 值 &gt; x 的格子数</text>
  <text x="400" y="177" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">⋮</text>
  <rect x="300" y="182" width="200" height="30" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="400" y="201" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pre[200]：矩形内 值 &gt; 200 的格子数</text>
  <text x="410" y="230" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">共 201 张，每张 O(n·m)，建表 O(201·n·m)</text>

  <path d="M 234 164 C 262 164, 270 140, 296 138" fill="none" stroke="#8899aa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="264" y="152" text-anchor="middle" font-size="10.5" fill="#8899aa" filter="url(#rough2)">阈值 = x</text>

  <rect x="285" y="246" width="250" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#a87020" filter="url(#rough2)">O(1) 容斥查询（P = pre[x]）</text>
  <text x="410" y="286" text-anchor="middle" font-size="11" fill="#a87020" filter="url(#rough2)">cnt = P[r2+1][c2+1] − P[r1][c2+1]</text>
  <text x="410" y="303" text-anchor="middle" font-size="11" fill="#a87020" filter="url(#rough2)">− P[r2+1][c1] + P[r1][c1]</text>

  <rect x="285" y="322" width="250" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="344" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">界内角 (i±x, j±x) 值 &gt; x 再各减 1</text>
  <text x="410" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">cnt == 0 ⟹ 局部最大值 ✓</text>
