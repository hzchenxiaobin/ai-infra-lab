<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="520" fill="#fafafa"/>
  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">负数标记法流程：找 dup → 找 miss</text>

  <!-- Phase 1 label -->
  <rect x="30" y="40" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第一趟：标记 + 找 dup</text>

  <!-- init -->
  <rect x="120" y="72" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dup = 0; i = 0</text>

  <path d="M 240 112 L 240 128" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- loop check -->
  <polygon points="240,132 350,172 240,212 130,172" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- No -> phase 2 -->
  <path d="M 350 172 L 420 172 L 420 360" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="368" y="164" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Yes down -->
  <path d="M 240 212 L 240 232" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="256" y="226" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- v = abs(nums[i]) -->
  <rect x="80" y="236" width="320" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="259" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">v = |nums[i]|</text>

  <path d="M 240 272 L 240 290" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- check nums[v-1] sign -->
  <polygon points="240,294 360,330 240,366 120,330" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[v−1] &lt; 0 ?</text>
  <text x="240" y="344" text-anchor="middle" font-size="10" fill="#777">已被标记过？</text>

  <!-- Yes -> dup found -->
  <path d="M 120 330 L 60 330 L 60 396" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="74" y="322" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="24" y="398" width="120" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="84" y="416" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">dup = v</text>
  <text x="84" y="430" text-anchor="middle" font-size="9.5" fill="#888">重复数已定</text>

  <!-- No -> negate -->
  <path d="M 360 330 L 420 330 L 420 396" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="378" y="322" font-size="11" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="360" y="398" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="416" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">nums[v−1]</text>
  <text x="420" y="430" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= −nums[v−1]</text>

  <!-- i += 1 -->
  <path d="M 84 436 L 84 458 L 240 458 L 240 172" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 420 436 L 420 458 L 240 458" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="180" y="472" font-size="9.5" fill="#888">i += 1 后回到循环顶</text>

  <!-- Phase 2 label -->
  <rect x="300" y="356" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <!-- Phase 2 scan -->
  <rect x="250" y="478" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="360" y="496" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第二趟：扫 nums[i] &gt; 0</text>
  <text x="360" y="510" text-anchor="middle" font-size="10" fill="#555">miss = i+1；返回 [dup, miss]</text>

  <path d="M 420 360 L 420 478" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
</svg>
