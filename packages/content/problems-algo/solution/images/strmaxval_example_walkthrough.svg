<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：strs = ["alic3","bob","3","4","00000"]</text>

  <!-- ====== Table header ====== -->
  <rect x="50" y="44" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">字符串 s</text>
  <text x="280" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">全为数字？</text>
  <text x="420" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">值 v</text>

  <!-- column separators -->
  <path d="M 210 44 L 210 226" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 360 44 L 360 226" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ====== Row 1: alic3 ====== -->
  <rect x="50" y="74" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="92" text-anchor="middle" font-size="12" fill="#333">"alic3"</text>
  <text x="280" y="92" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">否（含字母）</text>
  <text x="420" y="92" text-anchor="middle" font-size="12" fill="#333">len = 5</text>

  <!-- ====== Row 2: bob ====== -->
  <rect x="50" y="104" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="122" text-anchor="middle" font-size="12" fill="#333">"bob"</text>
  <text x="280" y="122" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">否（含字母）</text>
  <text x="420" y="122" text-anchor="middle" font-size="12" fill="#333">len = 3</text>

  <!-- ====== Row 3: 3 ====== -->
  <rect x="50" y="134" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="152" text-anchor="middle" font-size="12" fill="#333">"3"</text>
  <text x="280" y="152" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="420" y="152" text-anchor="middle" font-size="12" fill="#333">int = 3</text>

  <!-- ====== Row 4: 4 ====== -->
  <rect x="50" y="164" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="182" text-anchor="middle" font-size="12" fill="#333">"4"</text>
  <text x="280" y="182" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="420" y="182" text-anchor="middle" font-size="12" fill="#333">int = 4</text>

  <!-- ====== Row 5: 00000 (trap, highlighted) ====== -->
  <rect x="50" y="194" width="400" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"00000"</text>
  <text x="280" y="214" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="420" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">int = 0 ⚠️</text>

  <!-- ====== Max row ====== -->
  <path d="M 270 226 L 270 240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="242" width="420" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="264" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最大值 ans = max(5,3,3,4,0) = 5（来自 "alic3"）</text>

  <!-- ====== bottom note ====== -->
  <rect x="30" y="290" width="480" height="60" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">⚠ 前导零陷阱：字符串 "00000" 全为数字，但其数值 = 0，并非长度 5</text>
  <text x="270" y="324" text-anchor="middle" font-size="10.5" fill="#888">「全数字」分支必须走 int 解析，绝不能复用 len —— 这是与 2114「值恒为长度」的本质区别</text>
  <text x="270" y="340" text-anchor="middle" font-size="10.5" fill="#888">全数字串中：长串未必大（"00000"=0 &lt; "9"=9），故数值大小与串长无单调关系</text>
</svg>
