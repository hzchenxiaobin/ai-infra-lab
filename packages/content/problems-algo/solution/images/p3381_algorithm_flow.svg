<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="452" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描，每条余数通道只记一个「最低买点」</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">先查询后入库：配对下标 l &lt; i ⇒ 子数组非空、长度 ≥ k</text>

  <!-- 开始 -->
  <rect x="215" y="50" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 76 L 260 88" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B1 初始化 -->
  <rect x="115" y="90" width="290" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">best[0..k−1] ← +∞；best[0] ← 0（空前缀 P[0] = 0）</text>
  <text x="260" y="123" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">cur ← 0；ans ← −∞</text>
  <path d="M 260 134 L 260 146" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B2 循环头 -->
  <rect x="115" y="148" width="290" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">for i = 0 … n−1</text>
  <text x="260" y="180" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">cur ← cur + nums[i]（滚动前缀和 P[i+1]）</text>
  <path d="M 260 188 L 260 200" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B3 通道号 -->
  <rect x="115" y="202" width="290" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">r ← (i + 1) mod k（当前下标归属的通道）</text>
  <path d="M 260 234 L 260 246" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 判断 -->
  <polygon points="260,248 338,286 260,324 182,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">best[r] &lt; +∞ ?</text>

  <path d="M 338 286 L 386 286" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="360" y="278" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <rect x="390" y="266" width="112" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="446" y="281" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">ans ← max(ans,</text>
  <text x="446" y="295" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">cur − best[r])</text>

  <path d="M 260 324 L 260 344" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="338" font-size="9.5" fill="#a07830" filter="url(#rough2)">否</text>

  <!-- B4 入库 -->
  <rect x="115" y="346" width="290" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">best[r] ← min(best[r], cur)</text>
  <text x="260" y="379" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">（查询之后才入库：自己不和自己配对）</text>

  <!-- 是分支汇入 B4 -->
  <path d="M 446 306 L 446 368 L 409 368" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- i 循环回边 -->
  <path d="M 115 368 L 60 368 L 60 168 L 111 168" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="52" y="268" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 52 268)" filter="url(#rough2)">i 未扫完：i ← i+1，继续</text>

  <path d="M 260 390 L 260 402" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="400" font-size="9" fill="#a07830" filter="url(#rough2)">扫完（i = n）</text>

  <!-- 返回 -->
  <rect x="215" y="404" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="424" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="330" y="404" width="172" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="416" y="417" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">k ≤ n ⇒ 必有长度 k 的窗口，</text>
  <text x="416" y="429" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">ans 不会停留在 −∞，无需判空</text>
</svg>
