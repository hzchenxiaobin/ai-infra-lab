<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两桶计数 + 一次线性扫描 X ∈ [0, k]，O(n + k)</text>

  <!-- ① 配对 -->
  <rect x="60" y="46" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 配对：i 与 n−1−i 配成 n/2 对</text>
  <text x="260" y="88" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">逐对算 d = |a−b| 与 M = max(a, b, k−a, k−b)</text>

  <path d="M 260 102 L 260 118" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 入桶 -->
  <rect x="60" y="122" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 入桶：按 (d, M) 两个数分类计数</text>
  <text x="260" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">diff[d] += 1（零改桶）　　cnt[M] += 1（单改上限桶）</text>

  <path d="M 260 178 L 260 194" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 扫描 -->
  <rect x="60" y="198" width="400" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ 扫描 X = 0..k：cost(X) = n/2 − diff[X] + less</text>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">先用后加：算完 cost(X) 才执行 less += cnt[X]</text>
  <text x="260" y="260" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">⇒ 扫到 X 时 less 恰好 = #{M &lt; X} 的对数（前缀和）</text>

  <path d="M 260 274 L 260 290" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 答案 -->
  <rect x="60" y="294" width="400" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 答案 = min X∈[0,k] cost(X)</text>
</svg>
