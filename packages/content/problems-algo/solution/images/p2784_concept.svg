<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">base[n] 的结构：谁是 n？</text>

  <!-- base[n] 公式 -->
  <rect x="60" y="46" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">base[n] = [1, 2, …, n−1, n, n]（长度 n+1）</text>

  <!-- base[3] 示例 -->
  <text x="40" y="114" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">base[3] =</text>

  <rect x="110" y="98" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="122" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <rect x="158" y="98" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="122" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <rect x="206" y="98" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="122" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="254" y="98" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="122" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="312" y="122" font-size="11" fill="#888" filter="url(#rough2)">长度 = 4 = n+1</text>

  <!-- 标注：n 出现两次 -->
  <path d="M230,138 L230,152" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">n 出现两次，其余各一次</text>

  <!-- 核心观察 -->
  <line x1="40" y1="172" x2="480" y2="172" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="260" y="196" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">核心观察：n = max(nums) 唯一确定 base[n]</text>

  <!-- nums → max → n -->
  <text x="40" y="232" font-size="12" fill="#333" filter="url(#rough2)">nums = [1, 3, 3, 2]</text>
  <path d="M180,228 L210,228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="232" font-size="12" fill="#446688" filter="url(#rough2)">取最大值</text>

  <rect x="290" y="216" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="236" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = 3</text>

  <path d="M354,231 L384,231" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="232" font-size="12" fill="#b85450" filter="url(#rough2)">唯一</text>

  <!-- 两个判定条件 -->
  <rect x="40" y="262" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">条件 1</text>
  <text x="145" y="304" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">len(nums) == n + 1</text>

  <rect x="270" y="262" width="210" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="286" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">条件 2</text>
  <text x="375" y="304" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1..n−1 各一次，n 两次</text>

  <!-- 判定流程箭头 -->
  <path d="M250,290 L270,290" stroke="#888" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">且</text>

  <!-- 结论 -->
  <rect x="100" y="338" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">排序后逐位比对 → sorted(nums) == base[n]</text>
</svg>
