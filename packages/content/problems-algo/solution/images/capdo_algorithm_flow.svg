<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="argreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">迭代乘法：算法流程</text>
  <path d="M 150 36 Q 280 44 410 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="190" y="56" width="180" height="30" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">f = 1，MOD = 10⁹+7，i = 1</text>
  <path d="M 280 88 L 280 110" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: i <= n ? -->
  <g filter="url(#sk)">
    <polygon points="280,114 380,154 280,194 180,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">i ≤ n ?</text>
  <text x="280" y="166" text-anchor="middle" font-size="10" fill="#7a5415">（还有未放的对）</text>

  <!-- no -> return -->
  <path d="M 380 154 L 460 154" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#argreen)" filter="url(#sk)"/>
  <text x="420" y="148" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="462" y="140" width="82" height="28" rx="14" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="503" y="159" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return f</text>

  <!-- yes -> multiply -->
  <path d="M 280 194 L 280 216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="294" y="210" font-size="11" fill="#666">是</text>
  <g filter="url(#sk)">
    <rect x="170" y="220" width="220" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="280" y="242" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">f = f × i × (2i−1) % MOD</text>
  <path d="M 280 256 L 280 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- i++ -->
  <g filter="url(#sk)">
    <rect x="230" y="278" width="100" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">i = i + 1</text>

  <!-- loop back arrow -->
  <path d="M 230 293 Q 100 293 100 154 Q 100 134 180 154" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="78" y="226" font-size="10.5" fill="#888" font-weight="bold">回到判断</text>

  <!-- formula explanation box -->
  <g filter="url(#sk)">
    <rect x="34" y="330" width="492" height="58" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="50" y="352" font-size="11.5" fill="#444">每轮把第 i 对的放置方案数 i×(2i−1) 累乘进 f，共 n 轮。</text>
  <text x="50" y="370" font-size="11.5" fill="#7a5415" font-weight="bold">f(n) = ∏_{i=1}^{n} i × (2i−1) = (2n)! / 2ⁿ （mod 10⁹+7）</text>
  <text x="50" y="384" font-size="10.5" fill="#888">时间 O(n)，空间 O(1)；n ≤ 500 远在安全范围</text>
</svg>
