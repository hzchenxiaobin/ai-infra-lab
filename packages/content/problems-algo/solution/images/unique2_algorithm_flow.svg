<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：特判起点 → 初始化首行首列(遇障碍截断) → 双层循环填表</text>

  <!-- Start: check origin -->
  <rect x="180" y="44" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">起点 obstacleGrid[0][0]==1 ?</text>
  <path d="M 280 80 L 280 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- yes branch -> return 0 -->
  <text x="300" y="94" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <path d="M 380 61 L 470 61" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="470" y="44" width="76" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="508" y="66" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return 0</text>

  <!-- dp[0][0]=1 -->
  <text x="300" y="114" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="200" y="104" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">dp[0][0] = 1</text>
  <path d="M 280 136 L 280 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init first row -->
  <rect x="150" y="160" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11" fill="#333">首行：dp[0][j] = 障碍? 0 : dp[0][j−1]</text>
  <path d="M 280 196 L 280 216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init first col -->
  <rect x="150" y="220" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#333">首列：dp[i][0] = 障碍? 0 : dp[i−1][0]</text>
  <path d="M 280 256 L 280 278" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="170" y="282" width="220" height="30" fill="#f6f6f6" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="11.5" fill="#333">for i = 1..m−1,  j = 1..n−1</text>
  <path d="M 280 314 L 280 336" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: obstacle? -->
  <path d="M 280 340 L 376 376 L 280 412 L 184 376 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">obstacleGrid[i][j]</text>
  <text x="280" y="388" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">== 1 ?</text>

  <!-- yes: dp=0 -->
  <text x="148" y="372" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <path d="M 184 376 L 120 376" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="40" y="360" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="80" y="382" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">dp=0</text>

  <!-- no: dp = up + left -->
  <text x="392" y="372" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 376 376 L 432 376" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="432" y="356" width="116" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="374" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">dp[i][j] =</text>
  <text x="490" y="390" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">dp[i−1][j]+dp[i][j−1]</text>

  <!-- loop back from both branches -->
  <path d="M 80 394 L 80 448 L 100 448 L 100 297 L 168 297" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 490 398 L 490 448 L 470 448 L 470 297 L 392 297" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="442" font-size="10" fill="#4a7a3a">下一格</text>

  <!-- after loop -> return -->
  <path d="M 280 412 L 280 460" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="436" font-size="10.5" fill="#888">循环结束</text>
  <rect x="190" y="464" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="488" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return dp[m−1][n−1]</text>
</svg>
