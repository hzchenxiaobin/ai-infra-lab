<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">把「数字转化」建模成「有界状态空间 BFS」</text>
  <path d="M 300 42 Q 430 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT: 有界状态空间 ===== -->
  <g filter="url(#sk)">
    <rect x="24" y="74" width="404" height="446" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="226" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#34506e">① 状态空间有界：仅 [0, 1000] 可继续扩展</text>

  <!-- range bracket -->
  <g filter="url(#sk)">
    <rect x="60" y="130" width="332" height="250" rx="8" fill="#fff" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="76" y="150" font-size="11" font-weight="bold" fill="#34506e">0</text>
  <text x="372" y="150" font-size="11" font-weight="bold" fill="#34506e">1000</text>
  <text x="226" y="150" text-anchor="middle" font-size="10.5" fill="#6a8aa8">合法状态域（可继续运算）</text>

  <!-- start node -->
  <g filter="url(#sk)">
    <ellipse cx="150" cy="210" rx="34" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="150" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#34506e">start</text>
  <text x="150" y="186" text-anchor="middle" font-size="10" fill="#5a5a5a">x = start</text>

  <!-- 3 operation branches from start -->
  <g font-size="11" fill="#34506e" text-anchor="middle">
    <g filter="url(#sk)"><rect x="250" y="170" width="56" height="22" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="278" y="185">x + n</text>
    <g filter="url(#sk)"><rect x="250" y="200" width="56" height="22" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="278" y="215">x - n</text>
    <g filter="url(#sk)"><rect x="250" y="230" width="56" height="22" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="278" y="245">x ^ n</text>
  </g>
  <!-- arrows from start to ops -->
  <g stroke="#9aa6b8" stroke-width="1.3" fill="none" filter="url(#sk)">
    <line x1="184" y1="206" x2="248" y2="181"/>
    <line x1="184" y1="212" x2="248" y2="211"/>
    <line x1="184" y1="218" x2="248" y2="241"/>
  </g>
  <text x="226" y="280" text-anchor="middle" font-size="10.5" fill="#5a5a5a">每个 nums[i] 产生 3 种运算</text>
  <text x="226" y="296" text-anchor="middle" font-size="10.5" fill="#5a5a5a">→ 最多 3×n 条出边</text>

  <!-- in-range neighbor: expand further -->
  <g filter="url(#sk)">
    <ellipse cx="150" cy="330" rx="30" ry="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="150" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">在域内</text>
  <text x="150" y="362" text-anchor="middle" font-size="10" fill="#4a8e4a">→ 入队继续扩展</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="44" y="404" width="364" height="96" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="226" y="426" text-anchor="middle" font-size="11" fill="#7a5415">状态域仅 1001 个整数</text>
  <text x="226" y="446" text-anchor="middle" font-size="11" fill="#7a5415">每个状态只访问一次 → BFS 必终止</text>
  <text x="226" y="470" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">运算次数 = BFS 层数 = 最短步数</text>

  <!-- ===== RIGHT: 越界即终判 ===== -->
  <g filter="url(#sk)">
    <rect x="444" y="74" width="392" height="446" rx="10" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="640" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">② 越界运算仍生效，但「一锤定音」</text>

  <!-- in-range zone -->
  <g filter="url(#sk)">
    <rect x="480" y="140" width="320" height="120" rx="10" fill="#fff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="640" y="160" text-anchor="middle" font-size="11" fill="#6a8aa8">0 ≤ x ≤ 1000（合法域）</text>

  <!-- current state x -->
  <g filter="url(#sk)">
    <ellipse cx="560" cy="200" rx="30" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="560" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#34506e">x</text>

  <!-- 3 arrows leaving: two out of range, one in range -->
  <!-- arrow 1: out of range → check goal -->
  <path d="M 590 192 L 720 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="700" y="150" width="86" height="26" rx="6" fill="#fff0f3" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="743" y="167" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">越界值</text>

  <!-- arrow 2: in range → enqueue -->
  <path d="M 590 206 L 700 206" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="700" y="194" width="86" height="26" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="743" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">在域内</text>

  <!-- arrow 3: out of range below -->
  <path d="M 590 216 L 720 244" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="700" y="234" width="86" height="26" rx="6" fill="#fff0f3" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="743" y="251" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">越界值</text>

  <!-- decision diamond: == goal ? -->
  <g filter="url(#sk)">
    <path d="M 560,300 L 640,270 L 720,300 L 640,330 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="640" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">越界值</text>
  <text x="640" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">== goal ?</text>

  <!-- yes → return -->
  <path d="M 720 300 L 770 300" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="745" y="294" text-anchor="middle" font-size="10.5" fill="#4a8e4a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="770" y="286" width="60" height="28" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="800" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">返回</text>

  <!-- no → discard -->
  <path d="M 560 300 L 510 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="535" y="294" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="460" y="286" width="50" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="485" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">丢弃</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="464" y="360" width="352" height="140" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="640" y="382" text-anchor="middle" font-size="11" fill="#7a5415">越界 = 终态：只能判等，不能再扩展</text>
  <text x="640" y="402" text-anchor="middle" font-size="11" fill="#7a5415">→ 每次算出邻居先查 == goal</text>
  <text x="640" y="422" text-anchor="middle" font-size="11" fill="#7a5415">  再查是否在 [0,1000] 入队</text>
  <text x="640" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">goal 可在 ±10⁹，远超状态域</text>
  <text x="640" y="468" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">→ 越界终判是命中 goal 的唯一通道</text>

  <text x="430" y="528" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">状态域 1001 · 每状态 3n 条边 · BFS 首次命中 goal 即最短</text>
</svg>
