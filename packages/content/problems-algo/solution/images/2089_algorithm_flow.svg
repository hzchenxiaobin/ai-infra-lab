<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次遍历计数 + 区间生成</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="52" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- Arrow down -->
  <path d="M 260 67 L 260 80" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init rect: less=0, equal=0, i=0 -->
  <rect x="200" y="80" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">less ← 0, equal ← 0</text>

  <!-- Arrow down to diamond1 -->
  <path d="M 260 112 L 260 124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: i < n ? -->
  <path d="M 204,146 L 260,124 L 316,146 L 260,168 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- Arrow No (right) to generate result -->
  <path d="M 316 146 L 388 146" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="346" y="140" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- generate result rect -->
  <rect x="388" y="132" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="151" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">生成区间</text>

  <!-- Arrow Yes (down) to diamond2 -->
  <path d="M 260 168 L 260 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="178" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond 2: nums[i] < target ? -->
  <path d="M 180,212 L 260,184 L 340,212 L 260,240 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">nums[i]</text>
  <text x="260" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">&lt; target ?</text>

  <!-- Arrow Yes (left) to less++ -->
  <path d="M 180 212 L 130 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="206" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">是</text>

  <!-- less++ rect -->
  <rect x="62" y="198" width="68" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="216" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">less++</text>

  <!-- Arrow No (down) to diamond3 -->
  <path d="M 260 240 L 260 254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="250" font-size="10.5" fill="#888" font-weight="bold">否</text>

  <!-- Diamond 3: nums[i] == target ? -->
  <path d="M 180,282 L 260,254 L 340,282 L 260,310 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">nums[i]</text>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">== target ?</text>

  <!-- Arrow Yes (left) to equal++ -->
  <path d="M 180 282 L 130 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="156" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- equal++ rect -->
  <rect x="62" y="268" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">equal++</text>

  <!-- Arrow No (right) to skip -->
  <path d="M 340 282 L 388 282" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="276" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">否</text>

  <!-- skip rect -->
  <rect x="388" y="268" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="286" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">跳过</text>

  <!-- Merge: all three branches -> i++ -->
  <!-- from less++ down to i++ -->
  <path d="M 96 226 L 96 336 L 200 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- from equal++ down to i++ -->
  <path d="M 96 296 L 96 336 L 200 336" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- from skip down to i++ -->
  <path d="M 428 296 L 428 336 L 320 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ rect -->
  <rect x="200" y="322" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i++，回循环</text>

  <!-- Loop back arrow from i++ up to diamond1 (right side) -->
  <path d="M 320 336 L 460 336 L 460 146 L 392 146" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Arrow from generate result down to return -->
  <path d="M 448 162 L 448 196" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Return box -->
  <rect x="378" y="196" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="448" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回</text>
  <text x="448" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a">[less .. less+equal−1]</text>

  <!-- Bottom note -->
  <rect x="40" y="352" width="300" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="190" y="367" text-anchor="middle" font-size="10" fill="#555">单趟计数 · 三分类 · 无需排序</text>
</svg>
