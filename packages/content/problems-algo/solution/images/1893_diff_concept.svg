<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：差分数组 —— 区间加 1 变为两端 +1/−1，前缀和还原覆盖次数</text>
  <text x="270" y="40" text-anchor="middle" font-size="10.5" fill="#888">ranges = [[1,2],[3,4],[5,6]], left = 2, right = 5</text>

  <!-- Row 1: Ranges on number line -->
  <text x="36" y="74" font-size="10.5" fill="#666">区间</text>

  <!-- Range [1,2] blue bar -->
  <rect x="110" y="56" width="92" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="156" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[1,2]</text>

  <!-- Range [3,4] green bar -->
  <rect x="206" y="56" width="92" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="252" y="72" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[3,4]</text>

  <!-- Range [5,6] orange bar -->
  <rect x="302" y="56" width="92" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="348" y="72" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">[5,6]</text>

  <!-- Number line cells 1-7 (cell_w=44, gap=4, start_x=110) -->
  <!-- v=1 -->
  <rect x="110" y="86" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="104" text-anchor="middle" font-size="11" fill="#888">1</text>
  <!-- v=2 -->
  <rect x="158" y="86" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="104" text-anchor="middle" font-size="11" fill="#888">2</text>
  <!-- v=3 -->
  <rect x="206" y="86" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="104" text-anchor="middle" font-size="11" fill="#888">3</text>
  <!-- v=4 -->
  <rect x="254" y="86" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="104" text-anchor="middle" font-size="11" fill="#888">4</text>
  <!-- v=5 -->
  <rect x="302" y="86" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="104" text-anchor="middle" font-size="11" fill="#888">5</text>
  <!-- v=6 -->
  <rect x="350" y="86" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="104" text-anchor="middle" font-size="11" fill="#888">6</text>
  <!-- v=7 -->
  <rect x="398" y="86" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="104" text-anchor="middle" font-size="11" fill="#aaa">7</text>

  <!-- Arrow down -->
  <path d="M 270 116 L 270 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="126" font-size="9.5" fill="#888">每个区间: diff[start]++, diff[end+1]−−</text>

  <!-- Row 2: Diff array -->
  <text x="36" y="148" font-size="10.5" fill="#666">差分</text>

  <!-- diff cells -->
  <!-- v=1: +1 -->
  <rect x="110" y="134" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="132" y="152" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+1</text>
  <!-- v=2: 0 -->
  <rect x="158" y="134" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="152" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <!-- v=3: 0 (−1+1) -->
  <rect x="206" y="134" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="152" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">0</text>
  <!-- v=4: 0 -->
  <rect x="254" y="134" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="152" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <!-- v=5: 0 (−1+1) -->
  <rect x="302" y="134" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="324" y="152" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">0</text>
  <!-- v=6: 0 -->
  <rect x="350" y="134" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="152" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <!-- v=7: −1 -->
  <rect x="398" y="134" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>

  <!-- Cancellation annotations -->
  <text x="228" y="174" text-anchor="middle" font-size="8.5" fill="#a87020">−1+1=0</text>
  <text x="324" y="174" text-anchor="middle" font-size="8.5" fill="#a87020">−1+1=0</text>

  <!-- Arrow down -->
  <path d="M 270 180 L 270 192" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="190" font-size="9.5" fill="#888">前缀和: cover[i] = Σ diff[1..i]</text>

  <!-- Row 3: Coverage count (prefix sum) -->
  <text x="22" y="214" font-size="10.5" fill="#666">覆盖次数</text>

  <!-- cover cells: 1,1,1,1,1,1,0 -->
  <!-- v=1: 1 -->
  <rect x="110" y="198" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- v=2: 1 (query highlight) -->
  <rect x="158" y="198" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- v=3: 1 (query highlight) -->
  <rect x="206" y="198" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- v=4: 1 (query highlight) -->
  <rect x="254" y="198" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- v=5: 1 (query highlight) -->
  <rect x="302" y="198" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- v=6: 1 -->
  <rect x="350" y="198" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- v=7: 0 -->
  <rect x="398" y="198" width="44" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="216" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <!-- Query bracket [2,5] -->
  <path d="M 158 230 L 158 236 L 346 236 L 346 230" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="252" y="250" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">查询 [left, right] = [2, 5]</text>

  <!-- Arrow down to result -->
  <path d="M 270 256 L 270 268" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="120" y="270" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cover[2..5] 全 ≥ 1 → return true ✓</text>

  <!-- Bottom note -->
  <rect x="40" y="316" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">为什么差分高效？</text>
  <text x="270" y="352" text-anchor="middle" font-size="10.5" fill="#555">区间加 1 只改两端两个点 O(1)，而非逐点加 O(len)</text>
  <text x="270" y="366" text-anchor="middle" font-size="10" fill="#888">值域 ≤ 50 → 数组大小 52，前缀和扫描一遍即可判定全覆盖</text>
</svg>
