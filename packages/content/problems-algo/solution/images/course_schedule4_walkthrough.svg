<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：链 0→1→2→3，看间接先修如何被「松弛」出来</text>

  <!-- Graph chain -->
  <circle cx="70" cy="62" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="170" cy="62" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="270" cy="62" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="370" cy="62" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <path d="M 88 62 L 152 62" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 188 62 L 252 62" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 288 62 L 352 62" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="67" font-size="11" fill="#888">初始：仅 3 条直接边</text>

  <!-- Matrix header -->
  <text x="40" y="110" font-size="12" fill="#555" font-weight="bold">reach 矩阵演进（行=起点 i，列=终点 j；T=可达）</text>

  <!-- column labels -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="120" y="128">0</text><text x="150" y="128">1</text><text x="180" y="128">2</text><text x="210" y="128">3</text>
    <text x="280" y="128">0</text><text x="310" y="128">1</text><text x="340" y="128">2</text><text x="370" y="128">3</text>
    <text x="440" y="128">0</text><text x="470" y="128">1</text><text x="500" y="128">2</text><text x="530" y="128">3</text>
  </g>
  <!-- row labels -->
  <g font-size="10" fill="#888" text-anchor="end">
    <text x="102" y="146">0</text><text x="102" y="162">1</text><text x="102" y="178">2</text><text x="102" y="194">3</text>
    <text x="262" y="146">0</text><text x="262" y="162">1</text><text x="262" y="178">2</text><text x="262" y="194">3</text>
    <text x="422" y="146">0</text><text x="422" y="162">1</text><text x="422" y="178">2</text><text x="422" y="194">3</text>
  </g>

  <!-- Matrix 1: after init (k=-) -->
  <text x="165" y="208" text-anchor="middle" font-size="10" fill="#888">初始化（直接边）</text>
  <!-- row 0: . T . . -->
  <g filter="url(#rough2)">
    <rect x="106" y="132" width="28" height="16" fill="#eee" stroke="#aaa"/><rect x="134" y="132" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a"/><rect x="162" y="132" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="190" y="132" width="28" height="16" fill="#fff" stroke="#aaa"/>
    <rect x="106" y="148" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="134" y="148" width="28" height="16" fill="#eee" stroke="#aaa"/><rect x="162" y="148" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a"/><rect x="190" y="148" width="28" height="16" fill="#fff" stroke="#aaa"/>
    <rect x="106" y="164" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="134" y="164" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="162" y="164" width="28" height="16" fill="#eee" stroke="#aaa"/><rect x="190" y="164" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="106" y="180" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="134" y="180" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="162" y="180" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="190" y="180" width="28" height="16" fill="#eee" stroke="#aaa"/>
  </g>
  <g font-size="9" fill="#333" text-anchor="middle">
    <text x="148" y="144">T</text><text x="176" y="160">T</text><text x="204" y="176">T</text>
  </g>

  <!-- Matrix 2: after k=1 -->
  <text x="325" y="208" text-anchor="middle" font-size="10" fill="#888">k=1 后：0→2 新增</text>
  <g filter="url(#rough2)">
    <rect x="266" y="132" width="28" height="16" fill="#eee" stroke="#aaa"/><rect x="294" y="132" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a"/><rect x="322" y="132" width="28" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><rect x="350" y="132" width="28" height="16" fill="#fff" stroke="#aaa"/>
    <rect x="266" y="148" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="294" y="148" width="28" height="16" fill="#eee" stroke="#aaa"/><rect x="322" y="148" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a"/><rect x="350" y="148" width="28" height="16" fill="#fff" stroke="#aaa"/>
    <rect x="266" y="164" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="294" y="164" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="322" y="164" width="28" height="16" fill="#eee" stroke="#aaa"/><rect x="350" y="164" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="266" y="180" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="294" y="180" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="322" y="180" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="350" y="180" width="28" height="16" fill="#eee" stroke="#aaa"/>
  </g>
  <g font-size="9" fill="#333" text-anchor="middle">
    <text x="308" y="144">T</text>
    <text x="336" y="144" fill="#b85450" font-weight="bold">T★</text>
    <text x="336" y="160">T</text><text x="364" y="176">T</text>
  </g>
  <!-- arrow between matrices -->
  <path d="M 224 156 L 260 156" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="242" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">k=1</text>

  <!-- Matrix 3: after k=2 -->
  <text x="485" y="208" text-anchor="middle" font-size="10" fill="#888">k=2 后：0→3 新增</text>
  <g filter="url(#rough2)">
    <rect x="426" y="132" width="28" height="16" fill="#eee" stroke="#aaa"/><rect x="454" y="132" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a"/><rect x="482" y="132" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a"/><rect x="510" y="132" width="28" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="426" y="148" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="454" y="148" width="28" height="16" fill="#eee" stroke="#aaa"/><rect x="482" y="148" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a"/><rect x="510" y="148" width="28" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="426" y="164" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="454" y="164" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="482" y="164" width="28" height="16" fill="#eee" stroke="#aaa"/><rect x="510" y="164" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="426" y="180" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="454" y="180" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="482" y="180" width="28" height="16" fill="#fff" stroke="#aaa"/><rect x="510" y="180" width="28" height="16" fill="#eee" stroke="#aaa"/>
  </g>
  <g font-size="9" fill="#333" text-anchor="middle">
    <text x="468" y="144">T</text><text x="496" y="144">T</text>
    <text x="524" y="144" fill="#b85450" font-weight="bold">T★</text>
    <text x="496" y="160">T</text><text x="524" y="160" fill="#b85450" font-weight="bold">T★</text>
    <text x="524" y="176">T</text>
  </g>
  <path d="M 384 156 L 420 156" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="402" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">k=2</text>

  <!-- legend -->
  <rect x="40" y="226" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="237" font-size="10" fill="#555">直接边 / 已确认可达</text>
  <rect x="190" y="226" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="237" font-size="10" fill="#555">本轮新增 (松弛得到)</text>
  <rect x="360" y="226" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="237" font-size="10" fill="#555">★ 间接先修 (查询答案)</text>

  <!-- Bottom note -->
  <rect x="40" y="262" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">松弛链：reach[0][2] 借 k=1 诞生 → reach[0][3] 借 k=2 诞生</text>
  <text x="60" y="306" font-size="11" fill="#444">• k=1：reach[0][1]=T 且 reach[1][2]=T ⟹ reach[0][2]=T ★（0→1→2 间接可达）</text>
  <text x="60" y="324" font-size="11" fill="#444">• k=2：reach[0][2]=T 且 reach[2][3]=T ⟹ reach[0][3]=T ★（0→1→2→3 间接可达）</text>
  <text x="60" y="346" font-size="11" fill="#444">• k=3：reach[?][3] 与 reach[3][?]，3 无出边，无新增</text>
  <text x="60" y="368" font-size="11" fill="#b85450" font-weight="bold">查询 [0,3] → reach[0][3] = true ✓（虽无直接边 0→3，但间接先修成立）</text>
</svg>
