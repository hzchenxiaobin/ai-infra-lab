<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：沿原型链逐层上溯</text>

  <!-- START -->
  <rect x="130" y="36" width="140" height="28" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始：(obj, classFunction)</text>
  <path d="M200,64 L200,76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- d1: obj == null? -->
  <polygon points="200,78 286,104 200,130 114,104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">obj == null ?</text>
  <text x="305" y="100" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M286,104 L356,104" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="356" y="91" width="170" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="108" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">return false</text>
  <text x="210" y="148" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M200,130 L200,142" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- d2: typeof classFunction === 'function'? -->
  <polygon points="200,144 286,170 200,196 114,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="166" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">typeof classFunction</text>
  <text x="200" y="180" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">=== 'function' ?</text>
  <text x="305" y="166" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M286,170 L356,170" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="356" y="157" width="170" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="174" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">return false</text>
  <text x="210" y="214" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M200,196 L200,208" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- a1: proto = getPrototypeOf(obj) -->
  <rect x="100" y="210" width="200" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="229" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">proto = getPrototypeOf(obj)</text>
  <path d="M200,238 L200,250" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- d3: proto === classFunction.prototype? -->
  <polygon points="200,252 300,284 200,316 100,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="280" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">proto ===</text>
  <text x="200" y="294" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">classFunction.prototype ?</text>
  <text x="320" y="280" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M300,284 L356,284" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="356" y="271" width="170" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="441" y="288" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">return true ✓</text>
  <text x="210" y="338" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M200,316 L200,328" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- d4: proto !== null? -->
  <polygon points="200,330 286,356 200,382 114,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="360" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">proto !== null ?</text>
  <text x="305" y="352" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M286,356 L356,356" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="356" y="343" width="170" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="360" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">return false</text>
  <text x="210" y="402" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M200,382 L200,394" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- a2: proto = getPrototypeOf(proto) -->
  <rect x="100" y="396" width="200" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="415" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">proto = getPrototypeOf(proto)</text>

  <!-- loop back to d3 -->
  <path d="M100,410 L54,410 L54,284 L100,284" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="40" y="350" text-anchor="middle" font-size="10.5" fill="#5a7a8a" filter="url(#rough2)">继续</text>
  <text x="40" y="364" text-anchor="middle" font-size="10.5" fill="#5a7a8a" filter="url(#rough2)">上溯</text>
</svg>
