<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：有限状态空间 → 必然循环</text>

  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">转换规则：cell[i] = 1 ⟺ 左右邻居相同（同 0 或同 1）</text>

  <rect x="178" y="62" width="154" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5" filter="url(#rough2)"/>

  <rect x="83" y="68" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="90" text-anchor="middle" font-size="13" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="105" y="120" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">恒0</text>

  <rect x="133" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="183" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="233" y="68" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="255" y="90" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="283" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="333" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="383" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="433" y="68" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="90" text-anchor="middle" font-size="13" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="455" y="120" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">恒0</text>

  <text x="155" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="205" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="255" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="305" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="355" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="405" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>

  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cell[3]：左邻=0，右邻=1 → 不同 → 新值 0</text>

  <line x1="280" y1="152" x2="280" y2="168" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="172" width="340" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">首尾两格恒为 0（无两个邻居）</text>
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">有效状态仅中间 6 格 → 最多 $2^6 = 64$ 种</text>

  <line x1="280" y1="232" x2="280" y2="248" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">鸽巢原理：超过 64 天必重复 → 形成周期循环</text>

  <ellipse cx="280" cy="350" rx="130" ry="55" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <rect x="240" y="300" width="80" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">Day 1</text>

  <rect x="360" y="338" width="80" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="354" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">Day 2</text>

  <text x="380" y="392" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">⋯</text>

  <rect x="240" y="380" width="80" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">Day 14</text>

  <rect x="120" y="338" width="80" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="354" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">Day 15</text>

  <path d="M 320 312 Q 380 318 360 338" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 360 362 Q 340 380 320 386" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 240 386 Q 180 380 160 362" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 160 338 Q 180 320 240 312" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="280" y="332" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">= Day 1（循环闭合）</text>

  <text x="475" y="330" font-size="9" fill="#888" filter="url(#rough2)">周期 = 14</text>
</svg>
