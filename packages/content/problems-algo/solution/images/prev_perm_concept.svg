<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">
    核心观察：从右找首个下降位，交换为尽可能大的较小值
  </text>

  <text x="40" y="76" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">arr</text>

  <rect x="100" y="60" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="82" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="155" y="60" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="82" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="210" y="60" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="82" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="265" y="60" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="320" y="60" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="82" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>

  <text x="125" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="180" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="235" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="290" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="345" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <text x="180" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i=1 下降点</text>
  <text x="180" y="138" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">9 &gt; 4</text>
  <text x="290" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后缀非递减</text>
  <text x="345" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j=4</text>

  <path d="M 360 154 Q 320 168 240 156" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="300" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">从右往左找 &lt; 9 的最大值 → 7</text>

  <path d="M 180 100 Q 265 205 345 100" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="265" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">swap(arr[i], arr[j])</text>

  <text x="40" y="258" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">结果</text>

  <rect x="100" y="242" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="264" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="155" y="242" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="264" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="210" y="242" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="264" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="265" y="242" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="264" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="320" y="242" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="264" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="125" y="290" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="180" y="290" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="235" y="290" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="290" y="290" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="345" y="290" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <text x="180" y="304" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7 换入</text>
  <text x="345" y="304" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">9 换出</text>

  <rect x="30" y="316" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">
    先前排列 = 下一个排列的镜像
  </text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    ① 从右找首个 arr[i] &gt; arr[i+1]（下降点），后缀非递减
  </text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    ② 后缀中找 &lt; arr[i] 的最大值，重复取最左位置
  </text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    ⚠️ 仅一次交换，不反转后缀（与 31 题的关键区别）
  </text>
</svg>
