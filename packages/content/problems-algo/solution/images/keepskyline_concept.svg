<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：天际线 = 每行最大值 & 每列最大值</text>

  <!-- column header -->
  <text x="100" y="52" text-anchor="middle" font-size="10" fill="#aaa">col0</text>
  <text x="148" y="52" text-anchor="middle" font-size="10" fill="#aaa">col1</text>
  <text x="196" y="52" text-anchor="middle" font-size="10" fill="#aaa">col2</text>
  <text x="244" y="52" text-anchor="middle" font-size="10" fill="#aaa">col3</text>

  <!-- row labels -->
  <text x="62" y="77" text-anchor="end" font-size="10" fill="#aaa">row0</text>
  <text x="62" y="111" text-anchor="end" font-size="10" fill="#aaa">row1</text>
  <text x="62" y="145" text-anchor="end" font-size="10" fill="#aaa">row2</text>
  <text x="62" y="179" text-anchor="end" font-size="10" fill="#aaa">row3</text>

  <!-- row 0: 3, [0], 8, 4 -->
  <rect x="76" y="60" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="82" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="124" y="60" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="82" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="172" y="60" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="82" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="220" y="60" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="82" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- row 1: 2, 4, 5, 7 -->
  <rect x="76" y="94" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="116" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="124" y="94" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="116" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="172" y="94" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="116" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="220" y="94" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="116" text-anchor="middle" font-size="13" fill="#333">7</text>

  <!-- row 2: 9, 2, 6, 3 -->
  <rect x="76" y="128" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="150" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="124" y="128" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="150" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="172" y="128" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="150" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="220" y="128" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="150" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- row 3: 0, 3, 1, 0 -->
  <rect x="76" y="162" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="184" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="124" y="162" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="184" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="172" y="162" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="184" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="220" y="162" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="184" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- row max boxes (right side, green) -->
  <text x="292" y="52" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">行 max</text>
  <rect x="274" y="64" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">8</text>
  <rect x="274" y="98" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="274" y="132" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">9</text>
  <rect x="274" y="166" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- col max boxes (bottom, blue) -->
  <text x="40" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">列 max</text>
  <rect x="76" y="206" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">9</text>
  <rect x="124" y="206" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <rect x="172" y="206" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8</text>
  <rect x="220" y="206" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="244" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">7</text>

  <!-- arrows: rowMax[0]=8 pointing to highlighted cell (0,1) -->
  <path d="M 274 77 Q 240 72 180 72" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- arrow: colMax[1]=4 pointing up to highlighted cell (0,1) -->
  <path d="M 148 206 L 148 100" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- explanation box -->
  <rect x="350" y="60" width="160" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cell(0,1) 分析</text>
  <text x="430" y="104" text-anchor="middle" font-size="10" fill="#555">当前高度 = 0</text>
  <text x="430" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">行约束 ≤ rowMax = 8</text>
  <text x="430" y="144" text-anchor="middle" font-size="10" fill="#446688">列约束 ≤ colMax = 4</text>
  <line x1="370" y1="156" x2="490" y2="156" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="430" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">上限 = min(8, 4) = 4</text>
  <text x="430" y="192" text-anchor="middle" font-size="10" fill="#b85450">增量 = 4 − 0 = 4</text>

  <!-- bottom formula -->
  <rect x="40" y="250" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每栋楼 (i, j) 可增高至 min(rowMax[i], colMax[j])</text>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#555">超过行最大 → 左右天际线变化；超过列最大 → 上下天际线变化</text>

  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#888">增高不会降低任何行/列最大值，故天际线保持不变</text>
</svg>
