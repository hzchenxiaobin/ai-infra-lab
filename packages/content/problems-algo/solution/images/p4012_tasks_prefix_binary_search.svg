<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="17" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">核心观察：把进度压缩成一个数 done，在前缀和上二分定位</text>

  <!-- 图例 -->
  <rect x="36" y="27" width="11" height="11" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="51" y="36" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">已完整完成</text>
  <rect x="126" y="27" width="11" height="11" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="141" y="36" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">未完成（含正在做的）</text>

  <!-- 任务标签 -->
  <text x="75" y="50" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">任务0</text>
  <text x="150" y="50" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">任务1</text>
  <text x="270" y="50" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">任务2</text>
  <text x="52" y="82" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">tasks =</text>

  <!-- 一轮进度条：30px = 1 单位时间 -->
  <rect x="60" y="58" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="75" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="90" y="58" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="150" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="210" y="58" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="270" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>

  <!-- 刻度 -->
  <line x1="60" y1="98" x2="60" y2="106" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="98" x2="90" y2="106" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="210" y1="98" x2="210" y2="106" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="330" y1="98" x2="330" y2="106" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="118" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="95" y="118" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="215" y="118" font-size="9.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="330" y="118" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">9</text>
  <text x="95" y="131" font-size="8.5" fill="#446688" filter="url(#rough2)">prefix[0]</text>
  <text x="215" y="131" font-size="8.5" fill="#446688" filter="url(#rough2)">prefix[1]</text>
  <text x="330" y="131" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">prefix[2]</text>
  <text x="330" y="142" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">= total</text>

  <!-- done 标记 -->
  <path d="M 90 152 L 90 102" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="164" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">班次1后 done=1 → c=1，剩 2</text>
  <path d="M 210 180 L 210 102" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="224" y="192" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">班次2后 done=5 → c=2，剩 1</text>

  <!-- 班次0 重启示例 -->
  <rect x="36" y="214" width="280" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="232" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">班次0：done = 9 ≥ total = 9</text>
  <text x="176" y="248" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">→ 全部完成：ans[0] = 0，剩余时间作废，done 归零</text>

  <!-- 结论框 -->
  <rect x="36" y="272" width="280" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="292" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">不逐任务模拟：把进度压缩成一个数，</text>
  <text x="176" y="308" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">每个班次 = 一次加法 + 至多一次二分</text>

  <!-- 右侧规则框：定位 -->
  <rect x="354" y="56" width="150" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="429" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">定位（二分）</text>
  <text x="429" y="92" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">c = bisect_right(prefix, done)</text>
  <text x="429" y="107" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">prefix[i] ≤ done ⇔ 完整完成</text>
  <text x="429" y="122" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">正在做的任务不计入 c</text>
  <text x="429" y="137" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans[j] = n − c</text>

  <!-- 右侧规则框：重启 -->
  <rect x="354" y="150" width="150" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="429" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">重启判定（O(1)）</text>
  <text x="429" y="186" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">done ≥ total ⇒ 全部完成</text>
  <text x="429" y="201" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">ans[j] = 0，done 归零</text>
  <text x="429" y="216" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">班次剩余时间作废</text>

  <!-- 右侧规则框：轮内推进 -->
  <rect x="354" y="236" width="150" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="429" y="254" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5527" filter="url(#rough2)">轮内推进（O(1)）</text>
  <text x="429" y="272" text-anchor="middle" font-size="8.5" fill="#2f5527" filter="url(#rough2)">done += shifts[j]</text>
  <text x="429" y="287" text-anchor="middle" font-size="8.5" fill="#2f5527" filter="url(#rough2)">轮内 done 单调不减</text>
  <text x="429" y="302" text-anchor="middle" font-size="8.5" fill="#2f5527" filter="url(#rough2)">进度跨班次自然保留</text>
</svg>
