<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：firstWord + secondWord =?= targetWord</text>

  <!-- Column headers -->
  <text x="70"  y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">单词</text>
  <text x="200" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">字母 → 数位</text>
  <text x="380" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">val 演化（Horner）</text>
  <text x="530" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">数值</text>

  <!-- ====== Row 1: firstWord = "acb" ====== -->
  <rect x="20" y="62" width="540" height="56" fill="#f7faff" stroke="#e0e0e0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="96" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">firstWord</text>

  <!-- letters a c b -->
  <rect x="150" y="74" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="186" y="74" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="222" y="74" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <!-- digits below -->
  <text x="167" y="116" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="203" y="116" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="239" y="116" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>

  <!-- val evolution: 0 → 0 → 2 → 21 -->
  <text x="300" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <path d="M 312 90 L 330 90" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <path d="M 354 90 L 372 90" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <path d="M 396 90 L 414 90" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">21</text>
  <!-- step labels -->
  <text x="321" y="114" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">×10+0</text>
  <text x="363" y="114" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">×10+2</text>
  <text x="405" y="114" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">×10+1</text>

  <!-- final value -->
  <rect x="500" y="78" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="528" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">21</text>

  <!-- ====== Row 2: secondWord = "cba" ====== -->
  <rect x="20" y="126" width="540" height="56" fill="#fffaf7" stroke="#e0e0e0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="160" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">secondWord</text>

  <rect x="150" y="138" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="186" y="138" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="222" y="138" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="167" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="203" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="239" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <text x="300" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <path d="M 312 154 L 330 154" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <path d="M 354 154 L 372 154" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">21</text>
  <path d="M 396 154 L 414 154" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">210</text>
  <text x="321" y="178" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">×10+2</text>
  <text x="363" y="178" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">×10+1</text>
  <text x="405" y="178" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">×10+0</text>

  <rect x="500" y="142" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="528" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">210</text>

  <!-- ====== Row 3: targetWord = "cdb" ====== -->
  <rect x="20" y="190" width="540" height="56" fill="#f7fff9" stroke="#e0e0e0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">targetWord</text>

  <rect x="150" y="202" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="186" y="202" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="222" y="202" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="167" y="244" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="203" y="244" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="239" y="244" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>

  <text x="300" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <path d="M 312 218 L 330 218" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <path d="M 354 218 L 372 218" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">23</text>
  <path d="M 396 218 L 414 218" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">231</text>
  <text x="321" y="242" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">×10+2</text>
  <text x="363" y="242" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">×10+3</text>
  <text x="405" y="242" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">×10+1</text>

  <rect x="500" y="206" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="528" y="226" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">231</text>

  <!-- ====== Bottom: comparison ====== -->
  <path d="M 40 264 L 540 264" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- v1 + v2 =?= vt -->
  <rect x="80" y="284" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">21  +  210  =  231    ⟹    231 == 231</text>

  <!-- result -->
  <rect x="190" y="344" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="370" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 true ✓</text>

  <!-- footnote -->
  <text x="290" y="410" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每步 val ← val×10 + digit：'a'=0 自然产生前导零，等价于 "021"→21</text>
</svg>
