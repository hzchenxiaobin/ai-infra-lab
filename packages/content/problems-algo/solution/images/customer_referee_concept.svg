<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">核心观察：NULL != 2 是 UNKNOWN，不是 TRUE</text>

  <!-- Customer table -->
  <text x="90" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Customer 表</text>
  <rect x="36" y="62" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="77" font-size="10" fill="#333">id</text>
  <text x="92" y="77" font-size="10" fill="#333">name</text>
  <text x="130" y="77" font-size="10" fill="#333">referee</text>
  <line x1="72" y1="62" x2="72" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="116" y1="62" x2="116" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Will (null) - keep -->
  <rect x="36" y="84" width="110" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="56" y="96" font-size="9" fill="#333">1</text>
  <text x="92" y="96" font-size="9" fill="#333">Will</text>
  <text x="130" y="96" font-size="9" fill="#b85450" font-weight="bold">null</text>
  <line x1="72" y1="84" x2="72" y2="100" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="116" y1="84" x2="116" y2="100" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Jane (null) - keep -->
  <rect x="36" y="100" width="110" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="56" y="112" font-size="9" fill="#333">2</text>
  <text x="92" y="112" font-size="9" fill="#333">Jane</text>
  <text x="130" y="112" font-size="9" fill="#b85450" font-weight="bold">null</text>
  <line x1="72" y1="100" x2="72" y2="116" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="116" y1="100" x2="116" y2="116" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Alex (2) - drop -->
  <rect x="36" y="116" width="110" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="56" y="128" font-size="9" fill="#333">3</text>
  <text x="92" y="128" font-size="9" fill="#b85450" font-weight="bold">Alex</text>
  <text x="130" y="128" font-size="9" fill="#333">2</text>
  <line x1="72" y1="116" x2="72" y2="132" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="116" y1="116" x2="116" y2="132" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Bill (null) - keep -->
  <rect x="36" y="132" width="110" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="56" y="144" font-size="9" fill="#333">4</text>
  <text x="92" y="144" font-size="9" fill="#333">Bill</text>
  <text x="130" y="144" font-size="9" fill="#b85450" font-weight="bold">null</text>
  <line x1="72" y1="132" x2="72" y2="148" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="116" y1="132" x2="116" y2="148" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Zack (1) - keep -->
  <rect x="36" y="148" width="110" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="56" y="160" font-size="9" fill="#333">5</text>
  <text x="92" y="160" font-size="9" fill="#333">Zack</text>
  <text x="130" y="160" font-size="9" fill="#333">1</text>
  <line x1="72" y1="148" x2="72" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="116" y1="148" x2="116" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Mark (2) - drop -->
  <rect x="36" y="164" width="110" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="56" y="176" font-size="9" fill="#333">6</text>
  <text x="92" y="176" font-size="9" fill="#b85450" font-weight="bold">Mark</text>
  <text x="130" y="176" font-size="9" fill="#333">2</text>
  <line x1="72" y1="164" x2="72" y2="180" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="116" y1="164" x2="116" y2="180" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Arrow to evaluation -->
  <path d="M160 122 L196 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Evaluation: referee_id != 2 -->
  <text x="270" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">referee_id != 2</text>
  <rect x="216" y="62" width="108" height="118" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">UNKNOWN</text>
  <text x="270" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">UNKNOWN</text>
  <text x="270" y="128" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="270" y="144" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">UNKNOWN</text>
  <text x="270" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="270" y="176" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>

  <!-- Arrow to OR -->
  <path d="M330 122 L366 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="348" y="116" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">OR</text>

  <!-- Evaluation: referee_id IS NULL -->
  <text x="430" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">IS NULL</text>
  <rect x="376" y="62" width="108" height="118" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="430" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="430" y="128" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="430" y="144" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="430" y="160" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="430" y="176" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>

  <!-- Arrow to result -->
  <path d="M490 122 L516 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Result column -->
  <text x="538" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">保留?</text>
  <text x="538" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="538" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="538" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="538" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="538" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="538" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- Callout: key insight -->
  <path d="M280 210 L280 226" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="56" y="232" width="448" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⚠ 陷阱：NULL 参与比较 = UNKNOWN</text>

  <text x="76" y="280" font-size="10" fill="#333">只写 referee_id != 2 ：</text>
  <text x="96" y="296" font-size="10" fill="#b85450" font-weight="bold">null != 2 → UNKNOWN（WHERE 当假）→ Will/Jane/Bill 全丢 ✗</text>
  <text x="96" y="312" font-size="10" fill="#b85450" font-weight="bold">2 != 2 → FALSE → Alex/Mark 丢（正确）</text>
  <text x="96" y="328" font-size="10" fill="#4a7a3a" font-weight="bold">1 != 2 → TRUE → Zack 留（正确）</text>

  <text x="76" y="350" font-size="10" fill="#333">补 OR referee_id IS NULL ：UNKNOWN OR TRUE = TRUE → 捞回 null 行 ✓</text>
</svg>
