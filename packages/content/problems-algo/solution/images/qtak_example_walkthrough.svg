<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L4.5,8 L9,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1：king=[0,0]，8 方向射线扫描结果</text>

  <!-- ===== Board (left) ===== -->
  <!-- col labels -->
  <text x="55" y="64" text-anchor="middle" font-size="8.5" fill="#bbb">y0</text>
  <text x="85" y="64" text-anchor="middle" font-size="8.5" fill="#bbb">1</text>
  <text x="115" y="64" text-anchor="middle" font-size="8.5" fill="#bbb">2</text>
  <text x="145" y="64" text-anchor="middle" font-size="8.5" fill="#bbb">3</text>
  <text x="175" y="64" text-anchor="middle" font-size="8.5" fill="#bbb">4</text>
  <text x="205" y="64" text-anchor="middle" font-size="8.5" fill="#bbb">5</text>
  <text x="235" y="64" text-anchor="middle" font-size="8.5" fill="#bbb">6</text>
  <text x="265" y="64" text-anchor="middle" font-size="8.5" fill="#bbb">7</text>
  <text x="28" y="90" text-anchor="middle" font-size="8.5" fill="#bbb">x0</text>
  <text x="28" y="120" text-anchor="middle" font-size="8.5" fill="#bbb">1</text>
  <text x="28" y="150" text-anchor="middle" font-size="8.5" fill="#bbb">2</text>
  <text x="28" y="180" text-anchor="middle" font-size="8.5" fill="#bbb">3</text>
  <text x="28" y="210" text-anchor="middle" font-size="8.5" fill="#bbb">4</text>
  <text x="28" y="240" text-anchor="middle" font-size="8.5" fill="#bbb">5</text>
  <text x="28" y="270" text-anchor="middle" font-size="8.5" fill="#bbb">6</text>
  <text x="28" y="300" text-anchor="middle" font-size="8.5" fill="#bbb">7</text>

  <!-- off-board direction stubs (5 directions immediately out) -->
  <path d="M 55 85 L 30 60" stroke="#ccc" stroke-width="1.2" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 55 85 L 55 60" stroke="#ccc" stroke-width="1.2" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 55 85 L 80 60" stroke="#ccc" stroke-width="1.2" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 55 85 L 30 85" stroke="#ccc" stroke-width="1.2" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 55 85 L 30 110" stroke="#ccc" stroke-width="1.2" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <text x="14" y="56" font-size="8" fill="#bbb">✗</text>
  <text x="49" y="56" font-size="8" fill="#bbb">✗</text>
  <text x="84" y="56" font-size="8" fill="#bbb">✗</text>
  <text x="14" y="89" font-size="8" fill="#bbb">✗</text>
  <text x="14" y="116" font-size="8" fill="#bbb">✗</text>

  <!-- board cells -->
  <g filter="url(#rough2)">
    <!-- row 0 -->
    <rect x="40" y="70" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3"/>
    <rect x="70" y="70" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <rect x="100" y="70" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="130" y="70" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="160" y="70" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="190" y="70" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="220" y="70" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="250" y="70" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 1 -->
    <rect x="40" y="100" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <rect x="70" y="100" width="30" height="30" fill="#eef5fb" stroke="#9bc0e0" stroke-width="1" rx="3"/>
    <rect x="100" y="100" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="130" y="100" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="160" y="100" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="190" y="100" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="220" y="100" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="250" y="100" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 2 -->
    <rect x="40" y="130" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="70" y="130" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="100" y="130" width="30" height="30" fill="#eef5fb" stroke="#9bc0e0" stroke-width="1" rx="3"/>
    <rect x="130" y="130" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="160" y="130" width="30" height="30" fill="#eeeeee" stroke="#999" stroke-width="1.5" stroke-dasharray="3,2" rx="3"/>
    <rect x="190" y="130" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="220" y="130" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="250" y="130" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 3 -->
    <rect x="40" y="160" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="70" y="160" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="100" y="160" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="130" y="160" width="30" height="30" fill="#eef5fb" stroke="#9bc0e0" stroke-width="1" rx="3"/>
    <rect x="160" y="160" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <rect x="190" y="160" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="220" y="160" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="250" y="160" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 4 -->
    <rect x="40" y="190" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="70" y="190" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="100" y="190" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="130" y="190" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="160" y="190" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="190" y="190" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="220" y="190" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="250" y="190" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- rows 5-7 (empty) -->
    <rect x="40" y="220" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="70" y="220" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="100" y="220" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="130" y="220" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="160" y="220" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="190" y="220" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="220" y="220" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="250" y="220" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="40" y="250" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="70" y="250" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="100" y="250" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="130" y="250" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="160" y="250" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="190" y="250" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="220" y="250" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="250" y="250" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="40" y="280" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="70" y="280" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="100" y="280" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="130" y="280" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="160" y="280" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="190" y="280" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="220" y="280" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="250" y="280" width="30" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>

  <!-- attacking rays -->
  <!-- right: king(55,85) -> (0,1)(85,85) -->
  <path d="M 55 85 L 82 85" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- down: king -> (1,0)(55,115) -->
  <path d="M 55 85 L 55 112" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- down-right: king -> (3,3)(145,175), path cells (1,1)(2,2) marked empty -->
  <path d="M 55 85 L 142 172" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- blocked extensions (red dashed) -->
  <!-- right beyond (0,1) -> (0,4): (85,85)->(160,85) -->
  <path d="M 88 85 L 157 85" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <!-- down beyond (1,0) -> (4,0): (55,115)->(55,190) -->
  <path d="M 55 118 L 55 187" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- pieces -->
  <g filter="url(#rough2)">
    <!-- King (0,0) -->
    <text x="55" y="93" text-anchor="middle" font-size="17" fill="#d6a040" font-weight="bold">♔</text>
    <!-- attacking queens -->
    <text x="85" y="93" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">♛</text>
    <text x="55" y="123" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">♛</text>
    <text x="145" y="183" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">♛</text>
    <!-- blocked queens -->
    <text x="175" y="93" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">♛</text>
    <text x="55" y="203" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">♛</text>
    <!-- not-on-ray (2,4) -->
    <text x="175" y="153" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">♛</text>
  </g>
  <!-- path-empty markers on down-right -->
  <text x="85" y="123" text-anchor="middle" font-size="8" fill="#9bc0e0">·</text>
  <text x="115" y="153" text-anchor="middle" font-size="8" fill="#9bc0e0">·</text>
  <text x="175" y="148" font-size="8" fill="#888">不在射线</text>

  <!-- ===== Result table (right) ===== -->
  <rect x="312" y="62" width="256" height="262" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8 方向扫描结果</text>
  <!-- header -->
  <rect x="320" y="92" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="107" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">方向 (dx,dy)</text>
  <text x="430" y="107" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">扫描格子</text>
  <text x="530" y="107" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">结果</text>

  <!-- rows -->
  <g font-size="9.5" fill="#333" filter="url(#rough2)">
    <text x="350" y="128" text-anchor="middle">左上(−1,−1)</text>
    <text x="430" y="128" text-anchor="middle">越界</text>
    <text x="535" y="128" text-anchor="middle" fill="#bbb">—</text>

    <text x="350" y="148" text-anchor="middle">上(−1,0)</text>
    <text x="430" y="148" text-anchor="middle">越界</text>
    <text x="535" y="148" text-anchor="middle" fill="#bbb">—</text>

    <text x="350" y="168" text-anchor="middle">右上(−1,+1)</text>
    <text x="430" y="168" text-anchor="middle">越界</text>
    <text x="535" y="168" text-anchor="middle" fill="#bbb">—</text>

    <text x="350" y="188" text-anchor="middle">左(0,−1)</text>
    <text x="430" y="188" text-anchor="middle">越界</text>
    <text x="535" y="188" text-anchor="middle" fill="#bbb">—</text>

    <text x="350" y="208" text-anchor="middle" fill="#4a7a3a" font-weight="bold">右(0,+1)</text>
    <text x="430" y="208" text-anchor="middle">(0,1)=♛</text>
    <text x="535" y="208" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✅[0,1]</text>

    <text x="350" y="228" text-anchor="middle" fill="#4a7a3a" font-weight="bold">下(+1,0)</text>
    <text x="430" y="228" text-anchor="middle">(1,0)=♛</text>
    <text x="535" y="228" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✅[1,0]</text>

    <text x="350" y="248" text-anchor="middle">左下(+1,−1)</text>
    <text x="430" y="248" text-anchor="middle">越界</text>
    <text x="535" y="248" text-anchor="middle" fill="#bbb">—</text>

    <text x="350" y="268" text-anchor="middle" fill="#4a7a3a" font-weight="bold">右下(+1,+1)</text>
    <text x="430" y="268" text-anchor="middle">(1,1)·(2,2)·(3,3)=♛</text>
    <text x="535" y="268" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✅[3,3]</text>
  </g>

  <!-- answer box -->
  <rect x="320" y="284" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="304" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">答案 = [[0,1],[1,0],[3,3]] ✓</text>

  <!-- bottom note -->
  <text x="290" y="356" text-anchor="middle" font-size="9.5" fill="#888">5 个方向越界自动终止；命中首个皇后即停，远端 (0,4)(4,0) 被阻挡不计</text>
</svg>
