<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：二分答案 k + 贪心匹配（药丸救最弱可行工人）</text>

  <!-- ===== Top: binary search on k ===== -->
  <rect x="30" y="40" width="520" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="62" font-size="12" fill="#446688" font-weight="bold">① 二分答案 k（完成多少个任务）</text>
  <text x="48" y="80" font-size="11" fill="#555">答案 k ∈ [0, min(n, m)]；P(k) = 「k 个任务可完成」单调</text>

  <!-- predicate strip: T T T T F F F -->
  <rect x="60"  y="96" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82"  y="113" text-anchor="middle" font-size="11" fill="#333">P(0)</text>
  <rect x="108" y="96" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="113" text-anchor="middle" font-size="11" fill="#333">P(1)</text>
  <rect x="156" y="96" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="113" text-anchor="middle" font-size="11" fill="#333">…</text>
  <rect x="204" y="96" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">P(k*)</text>
  <rect x="252" y="96" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="113" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">P(k*+1)</text>
  <rect x="300" y="96" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="113" text-anchor="middle" font-size="11" fill="#333">…</text>

  <!-- T / F labels -->
  <text x="82"  y="135" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
  <text x="226" y="135" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
  <text x="274" y="135" text-anchor="middle" font-size="10" fill="#b85450">✗</text>

  <!-- max k annotation -->
  <rect x="372" y="92" width="166" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="114" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">二分找最大 k 使 P(k)=✓</text>

  <!-- arrow down to WLOG -->
  <path d="M 290 136 L 290 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: WLOG reduction ===== -->
  <rect x="30" y="160" width="520" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="182" font-size="12" fill="#d6a040" font-weight="bold">② WLOG：排序后取 k 个最易任务 + k 个最强工人</text>
  <text x="48" y="202" font-size="11" fill="#555">任务升序取前 k（最易）；工人升序取后 k（最强）。更难任务/更弱工人不会更优，故此组合具代表性。</text>

  <!-- tasks row -->
  <text x="48" y="234" font-size="11" fill="#446688" font-weight="bold">任务(升序)：</text>
  <rect x="120" y="222" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="239" text-anchor="middle" font-size="11" fill="#333">t₀</text>
  <rect x="158" y="222" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="239" text-anchor="middle" font-size="11" fill="#333">t₁</text>
  <rect x="196" y="222" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="239" text-anchor="middle" font-size="11" fill="#333">…</text>
  <!-- k easiest highlighted -->
  <rect x="234" y="222" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="251" y="239" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">tₖ₋₂</text>
  <rect x="272" y="222" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="239" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">tₖ₋₁</text>
  <!-- not chosen -->
  <rect x="310" y="222" width="34" height="24" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="327" y="239" text-anchor="middle" font-size="11" fill="#999">…</text>
  <text x="360" y="238" font-size="10.5" fill="#4a7a3a">← 取前 k 个最易</text>

  <!-- workers row -->
  <text x="48" y="278" font-size="11" fill="#d6a040" font-weight="bold">工人(升序)：</text>
  <rect x="120" y="266" width="34" height="24" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="137" y="283" text-anchor="middle" font-size="11" fill="#999">…</text>
  <!-- k strongest highlighted -->
  <rect x="158" y="266" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="283" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">w₀</text>
  <rect x="196" y="266" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="213" y="283" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">w₁</text>
  <rect x="234" y="266" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="251" y="283" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">…</text>
  <rect x="272" y="266" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="283" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">wₖ₋₁</text>
  <text x="316" y="282" font-size="10.5" fill="#d6a040">← 取后 k 个最强</text>

  <!-- arrow down -->
  <path d="M 290 296 L 290 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: greedy matching ===== -->
  <rect x="30" y="320" width="520" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="342" font-size="12" fill="#4a7a3a" font-weight="bold">③ 贪心匹配：从最难任务 tₖ₋₁ → 最易 t₀，工人放入有序集合</text>

  <!-- task t (hardest) box -->
  <rect x="48" y="358" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="78" y="378" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">任务 t</text>

  <!-- arrow to decision -->
  <path d="M 108 373 L 138 373" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: 有工人 >= t ? -->
  <polygon points="160,356 238,373 160,390 82,373" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="377" text-anchor="middle" font-size="10.5" fill="#333">lower_bound(t)?</text>

  <!-- yes branch: no pill, take weakest sufficient -->
  <path d="M 238 373 L 268 373" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="367" text-anchor="middle" font-size="10" fill="#4a7a3a">有</text>
  <rect x="270" y="358" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="372" text-anchor="middle" font-size="10.5" fill="#333">直接派最弱可行工人</text>
  <text x="330" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a">不耗药丸 ✓</text>

  <!-- no branch down to pill decision -->
  <path d="M 160 390 L 160 408" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="172" y="402" font-size="10" fill="#b85450">无</text>

  <!-- pill decision -->
  <polygon points="160,412 250,432 160,452 70,432" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="430" text-anchor="middle" font-size="10" fill="#333">药丸&gt;0 且</text>
  <text x="160" y="442" text-anchor="middle" font-size="10" fill="#333">lower_bound(t−s)?</text>

  <!-- pill yes -->
  <path d="M 250 432 L 282 432" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="426" text-anchor="middle" font-size="10" fill="#4a7a3a">有</text>
  <rect x="284" y="418" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="349" y="436" text-anchor="middle" font-size="10.5" fill="#d6a040">喂药丸给最弱可行工人</text>

  <!-- pill no -->
  <path d="M 70 432 L 44 432" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="57" y="426" text-anchor="middle" font-size="10" fill="#b85450">无</text>
  <rect x="44" y="418" width="0" height="0" fill="none"/>
  <text x="40" y="436" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">→ 不可行 ✗</text>

  <!-- right note -->
  <rect x="430" y="358" width="106" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="483" y="378" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">为何救最弱？</text>
  <text x="483" y="394" text-anchor="middle" font-size="9.5" fill="#555">药丸只够</text>
  <text x="483" y="406" text-anchor="middle" font-size="9.5" fill="#555">「勉强够」的弱工人</text>
  <text x="483" y="418" text-anchor="middle" font-size="9.5" fill="#555">强工人留给难任务</text>
  <text x="483" y="430" text-anchor="middle" font-size="9.5" fill="#4a7a3a">交换论证 ⇒ 最优</text>
</svg>
