<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：maxHeights = [6,5,3,9,2,7]</text>

  <!-- 表头 -->
  <rect x="60" y="46" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="130" y="46" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">h[i]</text>
  <rect x="220" y="46" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">left[i]</text>
  <rect x="340" y="46" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">right[i]</text>
  <rect x="460" y="46" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="66" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">left+right−h</text>

  <!-- 行 0 -->
  <rect x="60" y="80" width="70" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="130" y="80" width="90" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="220" y="80" width="120" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="340" y="80" width="120" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">21</text>
  <rect x="460" y="80" width="140" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="530" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">21</text>

  <!-- 行 1 -->
  <rect x="60" y="112" width="70" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="112" width="90" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="220" y="112" width="120" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="340" y="112" width="120" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <rect x="460" y="112" width="140" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="530" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">20</text>

  <!-- 行 2 -->
  <rect x="60" y="144" width="70" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="144" width="90" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="220" y="144" width="120" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="340" y="144" width="120" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="460" y="144" width="140" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="530" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">16</text>

  <!-- 行 3（峰值，高亮） -->
  <rect x="60" y="176" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="130" y="176" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="220" y="176" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">18</text>
  <rect x="340" y="176" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">13</text>
  <rect x="460" y="176" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="196" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">22 ★</text>

  <!-- 行 4 -->
  <rect x="60" y="210" width="70" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="130" y="210" width="90" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="220" y="210" width="120" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="340" y="210" width="120" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="460" y="210" width="140" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="530" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>

  <!-- 行 5 -->
  <rect x="60" y="242" width="70" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="130" y="242" width="90" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="220" y="242" width="120" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17</text>
  <rect x="340" y="242" width="120" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="460" y="242" width="140" height="28" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="530" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17</text>

  <!-- 结论 -->
  <rect x="60" y="290" width="540" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="312" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">最大值在 i=3 取到：18 + 13 − 9 = 22</text>
  <text x="330" y="330" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">对应塔排列 [3,3,3,9,2,2]，峰值 9 保留原高度</text>
</svg>
