<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">Z 函数判定：z[i] = LCP(w, w[i:])，恢复条件 z[i] ≥ n − i</text>

  <!-- row 1: full word, prefix highlighted -->
  <text x="52" y="76" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">w</text>
  <rect x="62" y="54" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="75" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="108" y="54" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="131" y="75" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="154" y="54" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="75" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="200" y="54" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="223" y="75" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c</text>
  <rect x="246" y="54" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="269" y="75" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <rect x="292" y="54" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="315" y="75" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <rect x="338" y="54" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="361" y="75" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="177" y="44" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前缀 "aba"</text>
  <text x="269" y="44" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 4 起的后缀</text>

  <!-- match lines -->
  <path d="M 85 88 L 85 118" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 131 88 L 131 118" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 177 88 L 177 118" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逐位相等 ⟹ z[4] = 3</text>

  <!-- row 2: suffix w[4:] -->
  <text x="52" y="144" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">w[4:]</text>
  <rect x="62" y="120" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="141" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="108" y="120" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="131" y="141" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="154" y="120" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="141" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <text x="440" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">z[4] = 3 = n − 4 = 3 ⟹ 整段后缀就是前缀 ✓</text>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">例 2：k=4, t=1 → i=4 → 命中，答案 1</text>

  <!-- z table -->
  <text x="280" y="188" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">"abacaba" 的 Z 数组（z[0] 按约定记为 n）：</text>
  <text x="100" y="222" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i</text>
  <rect x="118" y="202" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="141" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="164" y="202" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="187" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="210" y="202" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="233" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="256" y="202" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="279" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="302" y="202" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="325" y="219" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="348" y="202" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="371" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="394" y="202" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="417" y="219" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="100" y="252" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">z[i]</text>
  <rect x="118" y="232" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="141" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="164" y="232" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="187" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="210" y="232" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="233" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="256" y="232" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="279" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="302" y="232" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="325" y="249" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="348" y="232" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="371" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="394" y="232" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="417" y="249" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 452 214 C 472 218, 478 238, 452 242" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="492" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=6：z=1</text>
  <text x="492" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= n−6=1 ✓</text>
  <text x="492" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">例 1 答案 2</text>

  <!-- conclusion box -->
  <rect x="30" y="278" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">z[i] ≥ n − i ⟺ 后缀 w[i:] 整段恰好是 w 的前缀 ⟺ tk = i 时一轮可恢复</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">又因 z[i] ≤ n − i 恒成立，判据等价于 z[i] == n − i（"abacaba" 中 i=4、i=6 恰好命中）</text>

  <!-- tip -->
  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡 Z 数组一遍 O(n) 求出后，每个候选 i = tk 的判定只需 O(1)</text>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">Z 函数模板见参考代码（Z-box 复用，均摊线性）</text>
</svg>
