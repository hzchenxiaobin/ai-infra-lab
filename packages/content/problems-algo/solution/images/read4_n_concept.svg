<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">用 Read4 读取 N 个字符：read4 产 4 字符块，按需拷贝到 buf</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">read4 一次最多 4 个 · 按需拷贝 min(got, need) · got&lt;4 即 EOF</text>

  <!-- ===== 文件流 (left) ===== -->
  <text x="80" y="78" text-anchor="middle" font-size="11" fill="#888">文件流（只读，read4 推进游标）</text>
  <g font-size="11">
    <rect x="32" y="92" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="46" y="111" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">l</text>
    <rect x="60" y="92" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="74" y="111" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <rect x="88" y="92" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="102" y="111" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <rect x="116" y="92" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="130" y="111" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">t</text>
    <rect x="144" y="92" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="158" y="111" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">c</text>
    <rect x="172" y="92" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="186" y="111" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">o</text>
    <rect x="200" y="92" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="214" y="111" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d</text>
    <rect x="228" y="92" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="242" y="111" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">e</text>
  </g>
  <text x="88" y="138" font-size="9" fill="#446688" font-weight="bold">↑ read4 第 1 次取这 4 个</text>
  <path d="M 88 134 L 88 122" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== buf4 中转 (middle) ===== -->
  <text x="312" y="78" text-anchor="middle" font-size="11" fill="#888">buf4（4 格中转区，read4 写入）</text>
  <g font-size="11">
    <rect x="266" y="92" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="281" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">l</text>
    <rect x="296" y="92" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="311" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <rect x="326" y="92" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="341" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <rect x="356" y="92" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="371" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">t</text>
  </g>
  <text x="312" y="142" text-anchor="middle" font-size="9" fill="#888">got = read4(buf4) = 4</text>

  <!-- 文件 → buf4 箭头 -->
  <path d="M 260 107 L 266 107" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="263" y="100" font-size="9" fill="#446688">read4</text>

  <!-- ===== buf 目标 (right) ===== -->
  <text x="490" y="78" text-anchor="middle" font-size="11" fill="#888">buf（n 格目标，调用方传入）</text>
  <g font-size="11">
    <rect x="420" y="92" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="433" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">l</text>
    <rect x="446" y="92" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="459" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="472" y="92" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="485" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="498" y="92" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="511" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">t</text>
    <rect x="524" y="92" width="26" height="30" fill="#fff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
    <text x="537" y="111" text-anchor="middle" font-size="9" fill="#aaa">?</text>
  </g>
  <text x="490" y="142" text-anchor="middle" font-size="9" fill="#888">n=5，已拷 total=4，还差 1</text>

  <!-- buf4 → buf 箭头（按需拷贝） -->
  <path d="M 392 107 L 418 107" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="405" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">拷 min(got, need)</text>

  <!-- ===== 底部规则说明 ===== -->
  <rect x="20" y="168" width="540" height="172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="40" y="190" font-size="12" fill="#444" font-weight="bold">核心规则（单次 read 调用）：</text>
  <text x="40" y="212" font-size="11" fill="#444">① 循环条件：total &lt; n（还没读满）且上一轮 read4 返回 4（还没 EOF）</text>
  <text x="40" y="232" font-size="11" fill="#444">② 每轮 got = read4(buf4)：从文件读最多 4 字符进 buf4，got 为实际数</text>
  <text x="40" y="252" font-size="11" fill="#444">③ need = min(got, n − total)：本次最多往 buf 拷 need 个（处理「读多了」）</text>
  <text x="40" y="272" font-size="11" fill="#444">④ 拷 buf4[0..need) → buf[total..total+need)，total += need</text>
  <text x="40" y="292" font-size="11" fill="#b85450" font-weight="bold">⑤ got &lt; 4 ⇒ EOF：文件已到尾，提前结束（即便 total &lt; n 也停）</text>
  <text x="40" y="314" font-size="10" fill="#888">⚠️ 单次调用中 buf4 是局部变量，多读的字符可丢弃；多次调用版（158）需跨调用缓存</text>
  <text x="40" y="332" font-size="10" fill="#888">⚠️ 调用方传入的 buf 直接按下标写入，无需返回指针</text>
</svg>
