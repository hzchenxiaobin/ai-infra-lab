<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">子树权和 + 不重叠配对 → 最大异或</text>

  <!-- ===== Tree edges ===== -->
  <path d="M 260 92 L 160 162" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 260 92 L 360 162" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 160 178 L 100 248" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 160 178 L 220 248" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 360 178 L 360 248" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- ===== Subtree bounding boxes (drawn behind nodes) ===== -->
  <!-- Green: subtree rooted at node1 = {1,3,4}, sum 16 -->
  <rect x="70" y="140" width="185" height="140" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.55" filter="url(#rough2)"/>
  <text x="162" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">子树1（权和 16）</text>
  <!-- Blue: subtree rooted at node2 = {2,5}, sum 8 -->
  <rect x="332" y="140" width="80" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.55" filter="url(#rough2)"/>
  <text x="372" y="300" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">子树2（权和 8）</text>

  <!-- ===== Nodes: value inside circle, s=sum label below ===== -->
  <!-- node 0 (root): neutral -->
  <circle cx="260" cy="78" r="17" fill="#fff" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="260" y="55" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="260" y="115" text-anchor="middle" font-size="9" fill="#999">s=26</text>

  <!-- node 1: green (subtree1 root) -->
  <circle cx="160" cy="170" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="175" text-anchor="middle" font-size="11" fill="#2c5e22" font-weight="bold">8</text>
  <text x="160" y="147" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="160" y="207" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">s=16</text>

  <!-- node 2: blue (subtree2 root) -->
  <circle cx="360" cy="170" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="175" text-anchor="middle" font-size="11" fill="#2b3f5e" font-weight="bold">3</text>
  <text x="360" y="147" text-anchor="middle" font-size="9" fill="#888">i=2</text>
  <text x="360" y="207" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">s=8</text>

  <!-- node 3: green -->
  <circle cx="100" cy="256" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="261" text-anchor="middle" font-size="10" fill="#2c5e22" font-weight="bold">6</text>
  <text x="100" y="237" text-anchor="middle" font-size="8" fill="#888">i=3</text>
  <text x="100" y="287" text-anchor="middle" font-size="8" fill="#4a7a3a">s=6</text>

  <!-- node 4: green -->
  <circle cx="220" cy="256" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="261" text-anchor="middle" font-size="10" fill="#2c5e22" font-weight="bold">2</text>
  <text x="220" y="237" text-anchor="middle" font-size="8" fill="#888">i=4</text>
  <text x="220" y="287" text-anchor="middle" font-size="8" fill="#4a7a3a">s=2</text>

  <!-- node 5: blue -->
  <circle cx="360" cy="256" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="261" text-anchor="middle" font-size="10" fill="#2b3f5e" font-weight="bold">5</text>
  <text x="360" y="237" text-anchor="middle" font-size="8" fill="#888">i=5</text>
  <text x="360" y="287" text-anchor="middle" font-size="8" fill="#446688">s=5</text>

  <!-- ===== XOR computation row ===== -->
  <text x="280" y="335" text-anchor="middle" font-size="11" fill="#666">两子树不共享任何节点 → 可配对，分数 = 权和异或</text>

  <!-- 16 (green) -->
  <rect x="120" y="350" width="60" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="372" text-anchor="middle" font-size="15" fill="#2c5e22" font-weight="bold">16</text>
  <text x="150" y="397" text-anchor="middle" font-size="8" fill="#4a7a3a">子树1权和</text>

  <text x="208" y="373" text-anchor="middle" font-size="18" fill="#444" font-weight="bold">⊕</text>

  <!-- 8 (blue) -->
  <rect x="232" y="350" width="60" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="372" text-anchor="middle" font-size="15" fill="#2b3f5e" font-weight="bold">8</text>
  <text x="262" y="397" text-anchor="middle" font-size="8" fill="#446688">子树2权和</text>

  <text x="320" y="373" text-anchor="middle" font-size="18" fill="#444" font-weight="bold">=</text>

  <!-- 24 (orange, answer) -->
  <rect x="345" y="346" width="100" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="395" y="375" text-anchor="middle" font-size="20" fill="#a8680a" font-weight="bold">24</text>
  <text x="465" y="372" font-size="10" fill="#a8680a" font-weight="bold">← 最大分数</text>

  <!-- binary hint -->
  <text x="475" y="345" text-anchor="end" font-size="8" fill="#999">10000 ⊕ 01000 = 11000</text>
</svg>
