<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：相邻两段各自递增，接缝处允许断裂</text>

  <!-- 示例 1 数组 -->
  <text x="20" y="46" font-size="11" fill="#666" filter="url(#rough2)">示例 1（k=3）：下标 a=2 与 b=5 各起一段，b = a + k</text>

  <rect x="50" y="58" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="92" y="58" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="134" y="58" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="80" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="176" y="58" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="80" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="218" y="58" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="80" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="260" y="58" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="80" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="302" y="58" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="80" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="344" y="58" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="80" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="386" y="58" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="428" y="58" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="449" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 下标行 -->
  <text x="71" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="113" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="155" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="197" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="239" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="281" y="106" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">5</text>
  <text x="323" y="106" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">6</text>
  <text x="365" y="106" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">7</text>
  <text x="407" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">8</text>
  <text x="449" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">9</text>

  <!-- 接缝虚线 -->
  <path d="M 260 54 L 260 96" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- 段标注 -->
  <text x="197" y="128" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">段1 [7,8,9] 递增 ✓</text>
  <text x="323" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">段2 [2,3,4] 递增 ✓</text>
  <path d="M 197 132 Q 197 140 240 140 L 252 140" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)" opacity="0"/>
  <text x="260" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">接缝：9 → 2 无约束，允许下降！</text>

  <!-- 陷阱框 -->
  <rect x="20" y="162" width="480" height="88" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="34" y="182" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⚠️ 陷阱：不能转化成「存在长度 2k 的递增段」</text>

  <rect x="40" y="192" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="212" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="76" y="192" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="94" y="212" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="112" y="192" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="212" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="148" y="192" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="212" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="188" y="206" font-size="10" fill="#333" filter="url(#rough2)">反例（k=2）：[1,2] 与 [1,2] 各自递增且相邻 → true</text>
  <text x="188" y="224" font-size="10" fill="#8f3a36" filter="url(#rough2)">但整段 [1,2,1,2] 不递增（2 → 1 下降）→ 按「2k 大段」判会漏解！</text>
  <text x="188" y="242" font-size="9.5" fill="#666" filter="url(#rough2)">方向：「2k 大段递增」⇒ true（充分），反方向不成立</text>

  <!-- f 工具框 -->
  <rect x="20" y="262" width="480" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <rect x="20" y="262" width="480" height="86" fill="none" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="284" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">f[i] = 以 i 结尾的最长严格递增段长度</text>
  <text x="34" y="304" font-size="10.5" fill="#333" filter="url(#rough2)">递推：nums[i] &gt; nums[i−1] ? f[i−1] + 1 : 1      区间 [l, r] 递增 ⟺ f[r] ≥ r − l + 1</text>
  <text x="34" y="330" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">判定：f[a+k−1] ≥ k 且 f[a+2k−1] ≥ k（两段相邻，b = a + k）</text>
</svg>
