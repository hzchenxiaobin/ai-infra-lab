<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：heroes = [1,4,2]，排序后战力 [1,1,2,3,5]</text>

  <!-- mini rows -->
  <text x="40" y="60" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">战力</text>
  <rect x="170" y="44" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="226" y="44" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="251" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="282" y="44" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="307" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="338" y="44" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="363" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="394" y="44" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="419" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="40" y="86" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">金币</text>
  <rect x="170" y="70" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="226" y="70" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="251" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="282" y="70" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="338" y="70" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="363" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="394" y="70" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="419" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <text x="40" y="112" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">前缀和</text>
  <rect x="170" y="96" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="226" y="96" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="251" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="282" y="96" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="307" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="338" y="96" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="363" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="394" y="96" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="419" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">20</text>

  <!-- Table header -->
  <rect x="60" y="134" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="88" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">英雄 j</text>
  <rect x="116" y="134" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="146" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">战力 h</text>
  <rect x="176" y="134" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="276" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">击败的怪物（战力 ≤ h）</text>
  <rect x="376" y="134" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="404" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">pos</text>
  <rect x="432" y="134" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="487" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = pre[pos]</text>

  <!-- Row 1 -->
  <rect x="60" y="160" width="56" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="88" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="116" y="160" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="176" y="160" width="200" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="276" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 1</text>
  <rect x="376" y="160" width="56" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="404" y="177" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="432" y="160" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="487" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Row 2 -->
  <rect x="60" y="184" width="56" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="88" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="116" y="184" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="176" y="184" width="200" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="276" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 1, 2, 3</text>
  <rect x="376" y="184" width="56" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="404" y="201" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="432" y="184" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="487" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">16</text>

  <!-- Row 3 -->
  <rect x="60" y="208" width="56" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="88" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="116" y="208" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="225" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="176" y="208" width="200" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="276" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 1, 2</text>
  <rect x="376" y="208" width="56" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="404" y="225" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="432" y="208" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="487" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- Result -->
  <rect x="120" y="250" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="272" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">输出 ans = [5, 16, 10]</text>

  <!-- Footnote -->
  <text x="40" y="304" font-size="11" fill="#999" filter="url(#rough2)">示例 2：排序后战力 [1,2,2,3]，h = 5 → pos = 4 → pre[4] = 23</text>
  <text x="40" y="322" font-size="11" fill="#999" filter="url(#rough2)">示例 3：h = 4 &lt; 最小战力 5 → pos = 0 → pre[0] = 0（一只都打不过）</text>
</svg>
