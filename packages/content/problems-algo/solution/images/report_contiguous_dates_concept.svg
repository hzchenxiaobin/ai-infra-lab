<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心思路：date − ROW_NUMBER() = 岛屿标识（Gaps &amp; Islands）</text>

  <!-- Failed table -->
  <text x="80" y="58" font-size="11" fill="#b85450" font-weight="bold">Failed 表</text>
  <g filter="url(#rough2)">
    <rect x="50" y="64" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
  </g>
  <text x="95" y="79" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">fail_date</text>
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="50" y="86" width="90" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="95" y="99" text-anchor="middle">2019-01-04</text>
    <rect x="50" y="104" width="90" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="95" y="117" text-anchor="middle">2019-01-05</text>
  </g>

  <!-- Succeeded table -->
  <text x="260" y="58" font-size="11" fill="#4a7a3a" font-weight="bold">Succeeded 表</text>
  <g filter="url(#rough2)">
    <rect x="225" y="64" width="95" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <text x="272" y="79" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">success_date</text>
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="225" y="86" width="95" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="272" y="99" text-anchor="middle">2019-01-01</text>
    <rect x="225" y="104" width="95" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="272" y="117" text-anchor="middle">2019-01-02</text>
    <rect x="225" y="122" width="95" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="272" y="135" text-anchor="middle">2019-01-03</text>
    <rect x="225" y="140" width="95" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="272" y="153" text-anchor="middle">2019-01-06</text>
  </g>

  <!-- UNION ALL box -->
  <rect x="390" y="70" width="190" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="485" y="92" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">UNION ALL + 标记状态</text>
  <text x="485" y="108" text-anchor="middle" font-size="9.5" fill="#555">SELECT fail_date, 'failed'</text>
  <text x="485" y="122" text-anchor="middle" font-size="9.5" fill="#555">UNION ALL …, 'succeeded'</text>

  <!-- arrows from tables to UNION -->
  <path d="M 140 95 L 200 95 L 200 88 L 386 88" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <path d="M 320 110 L 360 110 L 360 102 L 386 102" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <!-- arrow down to timeline -->
  <path d="M 485 130 L 485 155 L 310 155 L 310 175" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="395" y="152" font-size="9" fill="#446688">WHERE 2019 + ORDER BY dt</text>

  <!-- Timeline -->
  <text x="50" y="188" font-size="11" fill="#555" font-weight="bold">统一时间线（排序后）</text>

  <!-- 6 date boxes -->
  <g filter="url(#rough2)">
    <rect x="50" y="196" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="90" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">01-01</text>
  <text x="90" y="229" text-anchor="middle" font-size="9" fill="#4a7a3a">succeeded</text>

  <g filter="url(#rough2)">
    <rect x="135" y="196" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="175" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">01-02</text>
  <text x="175" y="229" text-anchor="middle" font-size="9" fill="#4a7a3a">succeeded</text>

  <g filter="url(#rough2)">
    <rect x="220" y="196" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="260" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">01-03</text>
  <text x="260" y="229" text-anchor="middle" font-size="9" fill="#4a7a3a">succeeded</text>

  <g filter="url(#rough2)">
    <rect x="305" y="196" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <text x="345" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">01-04</text>
  <text x="345" y="229" text-anchor="middle" font-size="9" fill="#b85450">failed</text>

  <g filter="url(#rough2)">
    <rect x="390" y="196" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <text x="430" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">01-05</text>
  <text x="430" y="229" text-anchor="middle" font-size="9" fill="#b85450">failed</text>

  <g filter="url(#rough2)">
    <rect x="475" y="196" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="515" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">01-06</text>
  <text x="515" y="229" text-anchor="middle" font-size="9" fill="#4a7a3a">succeeded</text>

  <!-- Island grouping brackets -->
  <path d="M 50 242 L 50 252 L 300 252 L 300 242" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="175" y="267" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">岛屿 1：succeeded</text>

  <path d="M 305 242 L 305 252 L 470 252 L 470 242" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="387" y="267" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">岛屿 2：failed</text>

  <path d="M 475 242 L 475 252 L 555 252 L 555 242" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="515" y="267" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">岛屿 3</text>

  <!-- Key formula explanation -->
  <rect x="40" y="284" width="540" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键公式：pt = DATE_SUB(dt, INTERVAL rn DAY)</text>
  <text x="310" y="322" text-anchor="middle" font-size="10" fill="#888">rn = ROW_NUMBER() OVER (PARTITION BY st ORDER BY dt)</text>

  <text x="58" y="346" font-size="10.5" fill="#555">• 连续日期：dt 和 rn 同步 +1 → dt − rn 不变 → 同一岛屿</text>
  <text x="58" y="364" font-size="10.5" fill="#555">  （01-01,01-02,01-03 的 pt 都是 2018-12-31）</text>
  <text x="58" y="382" font-size="10.5" fill="#555">• 出现断点：dt 跳跃但 rn 不跳 → dt − rn 改变 → 新岛屿</text>
  <text x="58" y="400" font-size="10.5" fill="#555">  （01-06 的 pt 变成 2019-01-02，与前面的 12-31 不同）</text>

  <!-- Summary -->
  <rect x="40" y="422" width="540" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="446" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">Gaps &amp; Islands：用「日期 − 行号」把连续日期归为同一组，断点处自然分裂</text>
</svg>
