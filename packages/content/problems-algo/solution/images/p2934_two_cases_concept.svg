<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：末位元素的归属只有两种终态</text>

  <!-- nums1 row -->
  <text x="20" y="80" font-size="12" fill="#446688" font-weight="bold">nums1</text>
  <rect x="68" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="114" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="252" y="58" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="89" y="79" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="135" y="79" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="181" y="79" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="227" y="79" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="273" y="79" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <!-- nums2 row -->
  <text x="20" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">nums2</text>
  <rect x="68" y="138" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="114" y="138" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="138" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="138" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="252" y="138" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="89" y="159" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="135" y="159" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="181" y="159" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="227" y="159" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="273" y="159" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>

  <!-- per-column swap arrows -->
  <line x1="89" y1="96" x2="89" y2="132" stroke="#446688" stroke-width="1.6" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="135" y1="96" x2="135" y2="132" stroke="#446688" stroke-width="1.6" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="181" y1="96" x2="181" y2="132" stroke="#446688" stroke-width="1.6" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="227" y1="96" x2="227" y2="132" stroke="#446688" stroke-width="1.6" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="273" y1="96" x2="273" y2="132" stroke="#b85450" stroke-width="2.2" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="300" y="82" font-size="12" fill="#b85450" font-weight="bold">a = 9</text>
  <text x="300" y="162" font-size="12" fill="#b85450" font-weight="bold">b = 4</text>
  <text x="292" y="120" font-size="11" fill="#b85450">换？</text>

  <!-- two case boxes -->
  <rect x="356" y="50" width="146" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="429" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">方案 A：末位不动</text>
  <text x="429" y="87" text-anchor="middle" font-size="11" fill="#333">目标 (a,b) = (9,4)</text>
  <text x="429" y="104" text-anchor="middle" font-size="11" fill="#333">cntA = count(9,4)</text>

  <rect x="356" y="124" width="146" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="429" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">方案 B：先换末位 +1</text>
  <text x="429" y="161" text-anchor="middle" font-size="11" fill="#333">目标 (b,a) = (4,9)</text>
  <text x="429" y="178" text-anchor="middle" font-size="11" fill="#333">cntB = 1+count(4,9)</text>

  <!-- per-position judgement -->
  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">目标确定后，每个 i &lt; n−1 独立判定（换 i 不影响 j ≠ i）</text>

  <rect x="30" y="224" width="460" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#333">① nums1[i] ≤ a 且 nums2[i] ≤ b（原位就合法）</text>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ 不换，+0 次操作</text>

  <rect x="30" y="286" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#333">② 否则若 nums2[i] ≤ a 且 nums1[i] ≤ b（换过去才合法）</text>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">→ 必须交换，+1 次操作</text>

  <rect x="30" y="348" width="460" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="12" fill="#333">③ 两个条件都不满足 → 换不换都会超过某个末位</text>
  <text x="260" y="390" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 该终态无解 ✗</text>

  <text x="260" y="420" text-anchor="middle" font-size="11" fill="#888">ans = min(cntA, cntB)；两个终态都无解才返回 −1</text>
</svg>
