<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="620" fill="#fdfcf7"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：循环有序链表插入</text>
  <path d="M 180 36 Q 310 42 440 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 1. head == null? -->
  <g filter="url(#sk)">
    <path d="M 310 60 L 380 95 L 310 130 L 240 95 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="310" y="100" text-anchor="middle" font-size="12" fill="#444">head == null?</text>

  <!-- yes -->
  <path d="M 240 95 L 130 95" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="185" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="40" y="80" width="90" height="30" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/><text x="85" y="100" text-anchor="middle" font-size="11" fill="#2e6e2e">建自环节点</text></g>
  <text x="85" y="125" text-anchor="middle" font-size="10" fill="#888">node.next=node</text>
  <path d="M 85 130 L 85 560" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 85 560 L 270 560" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- no -->
  <path d="M 310 130 L 310 158" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="324" y="148" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 2. prev=head, curr=head.next -->
  <g filter="url(#sk)"><rect x="220" y="160" width="180" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="310" y="180" text-anchor="middle" font-size="11" fill="#2b6e9e">prev = head, curr = head.next</text></g>
  <path d="M 310 190 L 310 214" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 3. loop condition diamond -->
  <g filter="url(#sk)">
    <path d="M 310 216 L 400 256 L 310 296 L 220 256 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="310" y="250" text-anchor="middle" font-size="11" fill="#444">prev.val ≤ insertVal</text>
  <text x="310" y="266" text-anchor="middle" font-size="11" fill="#444">≤ curr.val ?</text>

  <!-- yes: case 1 insert -->
  <path d="M 400 256 L 470 256" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="435" y="249" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="472" y="241" width="120" height="30" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/><text x="532" y="261" text-anchor="middle" font-size="10" fill="#2e6e2e">插 prev↔curr，break</text></g>
  <path d="M 532 271 L 532 560" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 532 560 L 360 560" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- no: go to case 2 check -->
  <path d="M 310 296 L 310 318" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="324" y="312" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 4. case 2 diamond: prev.val > curr.val ? -->
  <g filter="url(#sk)">
    <path d="M 310 320 L 400 360 L 310 400 L 220 360 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="310" y="356" text-anchor="middle" font-size="11" fill="#444">prev.val &gt; curr.val ?</text>
  <text x="310" y="372" text-anchor="middle" font-size="10" fill="#888">(拐点 max→min)</text>

  <!-- yes: check insertVal >= prev or <= curr -->
  <path d="M 400 360 L 440 360" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="420" y="353" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <path d="M 440 360 L 500 335 L 560 360 L 500 385 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="500" y="356" text-anchor="middle" font-size="9" fill="#444">insert≥prev</text>
  <text x="500" y="370" text-anchor="middle" font-size="9" fill="#444">或 ≤curr?</text>

  <!-- yes -->
  <path d="M 500 385 L 500 410" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="514" y="400" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="440" y="412" width="120" height="28" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/><text x="500" y="431" text-anchor="middle" font-size="10" fill="#2e6e2e">插 prev↔curr，break</text></g>
  <path d="M 500 440 L 500 560" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- no (both case2 sub and case2 itself no) -> advance -->
  <path d="M 310 400 L 310 430" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="324" y="418" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 5. advance prev=curr, curr=curr.next -->
  <g filter="url(#sk)"><rect x="220" y="432" width="180" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="310" y="451" text-anchor="middle" font-size="11" fill="#2b6e9e">prev = curr; curr = curr.next</text></g>
  <path d="M 310 460 L 310 478" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 6. prev == head? (full loop) -->
  <g filter="url(#sk)">
    <path d="M 310 480 L 380 510 L 310 540 L 240 510 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="310" y="514" text-anchor="middle" font-size="11" fill="#444">prev == head ?</text>

  <!-- yes: all equal, insert after head -->
  <path d="M 240 510 L 150 510" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="195" y="503" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="40" y="495" width="110" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="95" y="515" text-anchor="middle" font-size="10" fill="#b85450">全等→插head后</text></g>
  <path d="M 95 525 L 95 560" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 95 560 L 270 560" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- no: loop back -->
  <path d="M 380 510 Q 470 510 470 256 Q 470 256 412 256" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="490" y="385" font-size="10" fill="#888">否·回到循环</text>

  <!-- end -->
  <g filter="url(#sk)"><rect x="270" y="548" width="90" height="28" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="315" y="567" text-anchor="middle" font-size="11" fill="#2b6e9e">return head</text></g>

</svg>
