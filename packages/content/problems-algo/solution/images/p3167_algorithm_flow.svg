<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：外层切对、内层吃数字、桶累加、有序输出</text>

  <!-- start -->
  <ellipse cx="250" cy="52" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="57" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 250 70 L 250 86" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="160" y="88" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="108" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 0，cnt[26] 清零</text>
  <path d="M 250 120 L 250 134" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="250,136 322,166 250,196 178,166" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="170" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="330" y="160" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="256" y="216" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- no: output -->
  <path d="M 322 166 L 348 166" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="350" y="140" width="158" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="429" y="160" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">按 a..z 遍历桶</text>
  <text x="429" y="178" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">非零拼「字母 + 总数」</text>
  <path d="M 429 192 L 429 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <ellipse cx="429" cy="230" rx="42" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="429" y="235" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">返回</text>

  <!-- yes: read char -->
  <path d="M 250 196 L 250 226" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="148" y="228" width="204" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="248" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">c = s[i]，j = i+1，x = 0</text>
  <path d="M 250 260 L 250 274" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="250,276 340,306 250,336 160,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="302" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &lt; n 且</text>
  <text x="250" y="316" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">s[j] 是数字 ?</text>
  <text x="120" y="298" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="256" y="356" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- yes: accumulate digit -->
  <path d="M 160 306 L 146 306" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="8" y="286" width="138" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="77" y="303" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = x×10 + (s[j]−'0')</text>
  <text x="77" y="319" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j++</text>
  <path d="M 77 286 C 77 264, 150 258, 208 278" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- no: bucket add -->
  <path d="M 250 336 L 250 356" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="168" y="358" width="164" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="378" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt[c] += x，i = j</text>

  <!-- loop back to diamond 1 -->
  <path d="M 168 374 C 48 374, 30 200, 174 167" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="52" y="278" font-size="11" fill="#446688" filter="url(#rough2)">处理下一对</text>
</svg>
