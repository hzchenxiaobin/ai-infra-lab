<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 逐边演算（base MST = 7）</text>

  <!-- table header -->
  <rect x="30" y="44" width="50" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="63" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">边</text>
  <rect x="80" y="44" width="70" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="115" y="63" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">端点-权</text>
  <rect x="150" y="44" width="110" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="205" y="63" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">排除后权值</text>
  <rect x="260" y="44" width="110" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="315" y="63" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">纳入后权值</text>
  <rect x="370" y="44" width="160" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="450" y="63" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">分类</text>

  <!-- row 0: edge 0, 0-1 w=1, critical -->
  <rect x="30" y="72" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="91" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">0</text>
  <rect x="80" y="72" width="70" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="115" y="91" text-anchor="middle" font-size="10.5" fill="#555">0-1 (1)</text>
  <rect x="150" y="72" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="205" y="91" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">8 &gt; 7 ✗</text>
  <rect x="260" y="72" width="110" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="315" y="91" text-anchor="middle" font-size="10" fill="#888">—（已定性）</text>
  <rect x="370" y="72" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="450" y="91" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">关键边 ✓</text>

  <!-- row 1: edge 1, 1-2 w=1, critical -->
  <rect x="30" y="100" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="119" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="80" y="100" width="70" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="115" y="119" text-anchor="middle" font-size="10.5" fill="#555">1-2 (1)</text>
  <rect x="150" y="100" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="205" y="119" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">8 &gt; 7 ✗</text>
  <rect x="260" y="100" width="110" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="315" y="119" text-anchor="middle" font-size="10" fill="#888">—（已定性）</text>
  <rect x="370" y="100" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="450" y="119" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">关键边 ✓</text>

  <!-- row 2: edge 2, 2-3 w=2, pseudo -->
  <rect x="30" y="128" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="147" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>
  <rect x="80" y="128" width="70" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="115" y="147" text-anchor="middle" font-size="10.5" fill="#555">2-3 (2)</text>
  <rect x="150" y="128" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="205" y="147" text-anchor="middle" font-size="10.5" fill="#4a7a3a">7 == 7 ✓</text>
  <rect x="260" y="128" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="315" y="147" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">7 == 7 ✓</text>
  <rect x="370" y="128" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="450" y="147" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">伪关键边 ✓</text>

  <!-- row 3: edge 3, 0-3 w=2, pseudo -->
  <rect x="30" y="156" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="175" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">3</text>
  <rect x="80" y="156" width="70" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="115" y="175" text-anchor="middle" font-size="10.5" fill="#555">0-3 (2)</text>
  <rect x="150" y="156" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="205" y="175" text-anchor="middle" font-size="10.5" fill="#4a7a3a">7 == 7 ✓</text>
  <rect x="260" y="156" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="315" y="175" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">7 == 7 ✓</text>
  <rect x="370" y="156" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="450" y="175" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">伪关键边 ✓</text>

  <!-- row 4: edge 4, 0-4 w=3, pseudo -->
  <rect x="30" y="184" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="203" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">4</text>
  <rect x="80" y="184" width="70" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="115" y="203" text-anchor="middle" font-size="10.5" fill="#555">0-4 (3)</text>
  <rect x="150" y="184" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="205" y="203" text-anchor="middle" font-size="10.5" fill="#4a7a3a">7 == 7 ✓</text>
  <rect x="260" y="184" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="315" y="203" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">7 == 7 ✓</text>
  <rect x="370" y="184" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="450" y="203" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">伪关键边 ✓</text>

  <!-- row 5: edge 5, 3-4 w=3, pseudo -->
  <rect x="30" y="212" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="231" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">5</text>
  <rect x="80" y="212" width="70" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="115" y="231" text-anchor="middle" font-size="10.5" fill="#555">3-4 (3)</text>
  <rect x="150" y="212" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="205" y="231" text-anchor="middle" font-size="10.5" fill="#4a7a3a">7 == 7 ✓</text>
  <rect x="260" y="212" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="315" y="231" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">7 == 7 ✓</text>
  <rect x="370" y="212" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="450" y="231" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">伪关键边 ✓</text>

  <!-- row 6: edge 6, 1-4 w=6, neither -->
  <rect x="30" y="240" width="50" height="28" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="259" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">6</text>
  <rect x="80" y="240" width="70" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="115" y="259" text-anchor="middle" font-size="10.5" fill="#555">1-4 (6)</text>
  <rect x="150" y="240" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="205" y="259" text-anchor="middle" font-size="10.5" fill="#4a7a3a">7 == 7 ✓</text>
  <rect x="260" y="240" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="315" y="259" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">10 &gt; 7 ✗</text>
  <rect x="370" y="240" width="160" height="28" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="450" y="259" text-anchor="middle" font-size="10.5" fill="#888">都不是 ✗</text>

  <!-- result box -->
  <rect x="60" y="290" width="440" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="312" font-size="11.5" fill="#446688" font-weight="bold">输出结果</text>
  <text x="80" y="332" font-size="11" fill="#b85450" font-weight="bold">关键边 = [0, 1]</text>
  <text x="80" y="350" font-size="11" fill="#d6a040" font-weight="bold">伪关键边 = [2, 3, 4, 5]</text>
  <text x="80" y="368" font-size="10.5" fill="#555">边 6 权值过大，强制纳入会把 1-4(6) 塞进 MST，权值涨到 10 → 不是任何 MST 的成员</text>
</svg>
