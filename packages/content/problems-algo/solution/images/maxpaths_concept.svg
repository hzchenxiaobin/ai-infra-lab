<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    从 E(0,0) 到 S(n-1,n-1)：三方向移动 + 双重 DP
  </text>

  <text x="110" y="55" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">board 网格</text>

  <rect x="60" y="70" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="100" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">E</text>

  <rect x="110" y="70" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="100" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">1</text>

  <rect x="160" y="70" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="100" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">2</text>

  <rect x="60" y="120" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="150" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">1</text>

  <rect x="110" y="120" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="150" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">X</text>

  <rect x="160" y="120" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="150" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">1</text>

  <rect x="60" y="170" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="200" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">2</text>

  <rect x="110" y="170" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="200" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">1</text>

  <rect x="160" y="170" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="200" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">S</text>

  <path d="M 185 120 L 185 168" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 112 195 L 158 195" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 138 122 L 182 168" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <text x="110" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">↓ 向下  → 向右  ↘ 对角</text>
  <text x="110" y="263" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">虚线=被障碍阻挡</text>

  <text x="370" y="55" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">双状态同步追踪</text>

  <rect x="280" y="75" width="180" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="98" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i][j]</text>
  <text x="370" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">到 (i,j) 的最大得分</text>

  <rect x="280" y="145" width="180" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="168" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt[i][j]</text>
  <text x="370" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">达到该最大得分的路径数</text>

  <rect x="280" y="220" width="180" height="95" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="242" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">转移规则</text>
  <text x="290" y="260" font-size="10" fill="#333" filter="url(#rough2)">① 取前驱中 dp 的 max</text>
  <text x="290" y="275" font-size="10" fill="#333" filter="url(#rough2)">② 仅对 == max 的前驱</text>
  <text x="290" y="290" font-size="10" fill="#333" filter="url(#rough2)">   累加 cnt（取模）</text>
  <text x="290" y="307" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ 不是全加，只加最优!</text>
</svg>
