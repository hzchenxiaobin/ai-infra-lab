<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：迭代抬升可修改边</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">每轮只抬一条边，重跑 Dijkstra 复验，直到最短路 == target</text>

  <!-- 1. start -->
  <rect x="200" y="58" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">标记可改边，-1 全设为 1</text>

  <path d="M 280 96 L 280 110" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. dijkstra -->
  <rect x="180" y="114" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="135" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">d = Dijkstra(source)</text>

  <path d="M 280 152 L 280 166" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. diamond: d > target ? -->
  <polygon points="280,170 360,202 280,234 200,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d &gt; target ?</text>
  <text x="280" y="214" text-anchor="middle" font-size="9" fill="#888">(最小都超)</text>

  <!-- yes -> return [] -->
  <path d="M 360 202 L 440 202" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="384" y="196" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="442" y="186" width="104" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="494" y="207" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 []</text>

  <!-- no -->
  <path d="M 280 234 L 280 248" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="244" font-size="10" fill="#666">否</text>

  <!-- 4. diamond: d == target ? -->
  <polygon points="280,252 360,284 280,316 200,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d == target ?</text>

  <!-- yes -> return edges -->
  <path d="M 360 284 L 440 284" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="384" y="278" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="442" y="268" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="494" y="289" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 edges</text>

  <!-- no -> loop -->
  <path d="M 280 316 L 280 330" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="326" font-size="10" fill="#666">否(d&lt;target)</text>

  <!-- 5. loop body box -->
  <rect x="40" y="334" width="480" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="52" y="354" font-size="11" fill="#446688" font-weight="bold">循环体（d &lt; target 时）：</text>
  <text x="52" y="372" font-size="10" fill="#333">① dd = Dijkstra(destination)　② deficit = target − d　③ 遍历可改边 (a,b,w)</text>
  <text x="52" y="388" font-size="10" fill="#333">　 若 d[a]+w+dd[b]==d 或 d[b]+w+dd[a]==d → 该边在最短路上：w ← w + deficit，break</text>
  <text x="52" y="402" font-size="10" fill="#333">　 找不到任何可改边在最短路上 → 返回 []（最短路全是固定边却仍 &lt; target）</text>

  <!-- loop back arrow -->
  <path d="M 280 408 L 280 422 L 100 422 L 100 131 L 178 131" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="416" font-size="10" fill="#d6a040" font-weight="bold">重跑 Dijkstra 复验</text>

  <!-- 6. note -->
  <rect x="40" y="436" width="480" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="453" font-size="10" fill="#666">抬升只增不减：每轮 d 单调不减、每条可改边至多被抬一次，故必终止（≤ 可改边数轮）</text>
</svg>
