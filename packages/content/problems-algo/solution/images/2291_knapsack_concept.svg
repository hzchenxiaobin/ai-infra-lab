<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">股票交易 → 0-1 背包</text>

  <!-- Stock card (left) -->
  <rect x="28" y="70" width="160" height="135" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="96" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">第 i 支股票</text>
  <line x1="42" y1="106" x2="174" y2="106" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="132" font-size="13" fill="#333" filter="url(#rough2)">现价 present[i]</text>
  <text x="42" y="158" font-size="13" fill="#333" filter="url(#rough2)">未来价 future[i]</text>
  <text x="42" y="190" font-size="12" fill="#888" filter="url(#rough2)">每支最多买一次</text>

  <!-- Arrow 1 -->
  <path d="M192,137 L248,137" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="129" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">映射</text>

  <!-- Knapsack item (middle) -->
  <rect x="252" y="70" width="170" height="135" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="337" y="96" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">背包物品</text>
  <line x1="266" y1="106" x2="408" y2="106" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="266" y="132" font-size="13" fill="#333" filter="url(#rough2)">重量 w = present[i]</text>
  <text x="266" y="158" font-size="13" fill="#333" filter="url(#rough2)">价值 v = future − present</text>
  <text x="266" y="190" font-size="12" fill="#888" filter="url(#rough2)">选 / 不选（0-1）</text>

  <!-- Budget box (right) -->
  <rect x="438" y="85" width="105" height="105" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="112" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">预算 budget</text>
  <text x="490" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">= 背包容量</text>
  <text x="490" y="168" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">10</text>

  <!-- Down arrow from item to formula -->
  <path d="M337,210 L337,238" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <!-- DP formula box -->
  <rect x="50" y="246" width="460" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="273" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">状态转移（j 倒序，保证每支股票只买一次）</text>
  <text x="280" y="302" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">dp[j] = max( dp[j] , dp[j − w] + v )</text>
  <text x="280" y="325" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[j] = 预算 j 下的最大收益；答案 = dp[budget]</text>
</svg>
