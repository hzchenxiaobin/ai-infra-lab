<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：闭区间重叠 ⟺ 端点不严格相离</text>

  <!-- timeline -->
  <line x1="40" y1="78" x2="520" y2="78" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 520 78 L 512 74 L 512 82 Z" fill="#888" filter="url(#rough2)"/>
  <text x="528" y="82" font-size="11" fill="#888">时间</text>

  <!-- Case A: overlap (partial) -->
  <text x="40" y="112" font-size="11" fill="#446688">情形一（重叠 · 真子集）</text>
  <rect x="90" y="120" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="135" text-anchor="middle" font-size="10" fill="#446688">event1 [01:00–02:00]</text>
  <rect x="150" y="146" width="150" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a">event2 [01:20–03:00]</text>
  <rect x="150" y="120" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="135" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">交集</text>
  <text x="320" y="158" font-size="11" fill="#4a7a3a">e1≥s2 ∧ e2≥s1 → true</text>

  <!-- Case B: overlap (endpoint touch) -->
  <text x="40" y="196" font-size="11" fill="#446688">情形二（重叠 · 端点相接）</text>
  <rect x="90" y="204" width="110" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="219" text-anchor="middle" font-size="10" fill="#446688">event1 [01:15–02:00]</text>
  <rect x="200" y="204" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="10" fill="#4a7a3a">event2 [02:00–03:00]</text>
  <circle cx="200" cy="214" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="200" y="242" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">02:00 相接</text>
  <text x="340" y="219" font-size="11" fill="#4a7a3a">闭区间含端点 → true</text>

  <!-- Case C: no overlap -->
  <text x="40" y="276" font-size="11" fill="#b85450">情形三（不重叠 · 严格相离）</text>
  <rect x="90" y="284" width="110" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="299" text-anchor="middle" font-size="10" fill="#446688">event1 [10:00–11:00]</text>
  <rect x="270" y="284" width="110" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="299" text-anchor="middle" font-size="10" fill="#4a7a3a">event2 [14:00–15:00]</text>
  <text x="200" y="299" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">e1&lt;s2</text>
  <text x="400" y="299" font-size="11" fill="#b85450">→ false</text>

  <!-- formula box -->
  <rect x="40" y="324" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">冲突 ⟺ 不( e1 &lt; s2  ∨  e2 &lt; s1 )  ⟺  e1 ≥ s2 ∧ e2 ≥ s1</text>
</svg>
