<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">逐行判定流程：两道关隘筛掉“该删的类型1”</text>

  <!-- Start -->
  <rect x="200" y="48" width="160" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">读取一行订单 (cid, type)</text>

  <line x1="280" y1="84" x2="280" y2="106" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1 -->
  <polygon points="280,110 376,158 280,206 184,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">order_type</text>
  <text x="280" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">== 1 ?</text>

  <!-- No branch (left) -> keep -->
  <line x1="184" y1="158" x2="130" y2="158" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="30" y="140" width="100" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 保留</text>

  <!-- Yes branch (down) -->
  <line x1="280" y1="206" x2="280" y2="228" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="222" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- Diamond 2 -->
  <polygon points="280,232 396,288 280,344 164,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">该客户存在</text>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">type = 0 订单?</text>

  <!-- No branch (left) -> keep -->
  <line x1="164" y1="288" x2="130" y2="288" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="30" y="270" width="100" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="294" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 保留</text>

  <!-- Yes branch (down) -> drop -->
  <line x1="280" y1="344" x2="280" y2="368" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="362" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="210" y="370" width="140" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="395" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 删除（过滤掉）</text>

  <!-- side notes -->
  <rect x="410" y="140" width="130" height="78" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="475" y="162" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">关隘一</text>
  <text x="475" y="180" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">类型0订单</text>
  <text x="475" y="196" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">一律放行</text>

  <rect x="410" y="250" width="130" height="96" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="475" y="272" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">关隘二</text>
  <text x="475" y="290" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">只有“客户无</text>
  <text x="475" y="306" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">类型0”的类型1</text>
  <text x="475" y="322" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">订单才放行</text>
</svg>
