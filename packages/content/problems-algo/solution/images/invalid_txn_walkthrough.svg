<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：异城 vs 同城对比</text>

  <!-- Example 1 label -->
  <rect x="30" y="44" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">示例 1</text>

  <!-- Example 1: txn A -->
  <rect x="40" y="76" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">alice,20,800,mtv</text>
  <text x="140" y="108" text-anchor="middle" font-size="10" fill="#8a3a3a" filter="url(#rough2)">t=20 city=mtv</text>

  <!-- Example 1: txn B -->
  <rect x="320" y="76" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">alice,50,100,beijing</text>
  <text x="420" y="108" text-anchor="middle" font-size="10" fill="#8a3a3a" filter="url(#rough2)">t=50 city=beijing</text>

  <!-- time bar ex1 -->
  <path d="M 140 124 L 420 124" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 124 L 140 124" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="225" y="116" width="110" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">|Δt|=30≤60 ✓ 异城</text>

  <!-- ex1 result -->
  <rect x="120" y="142" width="320" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="159" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">两笔均无效（规则二触发）</text>

  <!-- divider -->
  <path d="M 40 184 L 520 184" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Example 2 label -->
  <rect x="30" y="196" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">示例 2</text>

  <!-- Example 2: txn A (valid) -->
  <rect x="40" y="228" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">alice,20,800,mtv</text>
  <text x="140" y="260" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">t=20 city=mtv ✓</text>

  <!-- Example 2: txn B (invalid by rule1) -->
  <rect x="320" y="228" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">alice,50,1200,mtv</text>
  <text x="420" y="260" text-anchor="middle" font-size="10" fill="#8a3a3a" filter="url(#rough2)">t=50 amount=1200&gt;1000</text>

  <!-- time bar ex2 -->
  <path d="M 140 276 L 420 276" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 276 L 140 276" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="268" width="140" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">|Δt|=30≤60 但同城 → 规则二不触发</text>

  <!-- ex2 result -->
  <rect x="60" y="296" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="313" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">有效（金额≤1000）</text>
  <rect x="300" y="296" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="313" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">无效（规则一）</text>

  <!-- key insight -->
  <rect x="40" y="338" width="480" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">关键对比：时间差都是 30 分钟，结果却不同</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">示例 1：mtv ≠ beijing（异城）→ 规则二触发，两笔无效</text>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">示例 2：mtv = mtv（同城）→ 规则二不触发</text>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">「异城」是规则二的必要条件，最易遗漏</text>
</svg>
