<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三表 LEFT JOIN 串销售链：销售员 ← 客户 ← 销售</text>

  <!-- ===== Salesperson table (left) ===== -->
  <rect x="15" y="54" width="150" height="186" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="90" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Salesperson</text>
  <line x1="25" y1="82" x2="155" y2="82" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="22" y="98"  font-size="11" fill="#4a7a3a" font-weight="bold">salesperson_id PK</text>
  <text x="22" y="114" font-size="11" fill="#333">name</text>
  <line x1="25" y1="122" x2="155" y2="122" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="140" font-size="11" fill="#333">1  Alice</text>
  <text x="40" y="158" font-size="11" fill="#333">2  Bob</text>
  <text x="40" y="176" font-size="11" fill="#b85450" font-weight="bold">3  Jerry  ←无客户</text>

  <!-- ===== Customer table (middle) ===== -->
  <rect x="215" y="54" width="170" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Customer</text>
  <line x1="225" y1="82" x2="375" y2="82" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="222" y="98"  font-size="11" fill="#446688" font-weight="bold">customer_id PK</text>
  <text x="222" y="114" font-size="11" fill="#b85450" font-weight="bold">salesperson_id FK</text>
  <line x1="225" y1="122" x2="375" y2="122" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="240" y="140" font-size="11" fill="#333">1 → sp 1</text>
  <text x="240" y="158" font-size="11" fill="#333">2 → sp 1</text>
  <text x="240" y="176" font-size="11" fill="#333">3 → sp 2</text>

  <!-- ===== Sales table (right) ===== -->
  <rect x="430" y="54" width="155" height="186" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="507" y="74" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Sales</text>
  <line x1="440" y1="82" x2="575" y2="82" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="437" y="98"  font-size="11" fill="#d6a040" font-weight="bold">sale_id PK</text>
  <text x="437" y="114" font-size="11" fill="#b85450" font-weight="bold">customer_id FK</text>
  <text x="437" y="130" font-size="11" fill="#d6a040" font-weight="bold">price</text>
  <line x1="440" y1="138" x2="575" y2="138" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="445" y="156" font-size="11" fill="#333">1  c2  892</text>
  <text x="445" y="174" font-size="11" fill="#333">2  c1  354</text>
  <text x="445" y="192" font-size="11" fill="#333">3  c3  988</text>
  <text x="445" y="210" font-size="11" fill="#333">4  c3  856</text>

  <!-- Join arrows -->
  <path d="M 165 110 L 215 110" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="190" y="103" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">LEFT JOIN</text>
  <text x="190" y="125" text-anchor="middle" font-size="8" fill="#4a7a3a">ON sp_id</text>

  <path d="M 385 110 L 430 110" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="407" y="103" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">LEFT JOIN</text>
  <text x="407" y="125" text-anchor="middle" font-size="8" fill="#b85450">ON cust_id</text>

  <!-- Jerry NULL path annotation -->
  <text x="190" y="178" text-anchor="middle" font-size="9" fill="#b85450">Jerry 无匹配</text>
  <text x="190" y="192" text-anchor="middle" font-size="9" fill="#b85450">→ c.* = NULL</text>

  <!-- ===== Formula box ===== -->
  <rect x="60" y="262" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="284" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">influence = COALESCE( SUM(Sales.price) , 0 )</text>
  <text x="300" y="304" text-anchor="middle" font-size="10" fill="#888">GROUP BY salesperson_id：组内累加 price；全 NULL 组归零</text>

  <!-- ===== Jerry zero-fill box ===== -->
  <rect x="60" y="336" width="480" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Jerry：SUM(NULL) = NULL → COALESCE(…, 0) = 0</text>
  <text x="300" y="378" text-anchor="middle" font-size="10" fill="#888">LEFT JOIN 保其一行（c.* = NULL），再被归零输出</text>

  <!-- arrow from formula to output note -->
  <path d="M 300 318 L 300 336" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
