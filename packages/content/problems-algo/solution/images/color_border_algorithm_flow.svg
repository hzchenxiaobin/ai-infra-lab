<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrX" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：标记分量 → 判边界 → 上色</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">三阶段解耦：取负标记不破坏原色，判边界基于原始信息，最后才涂色</text>

  <g filter="url(#rough2)" font-size="11">
    <!-- 1. start -->
    <rect x="180" y="56" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="270" y="74" text-anchor="middle" fill="#446688" font-weight="bold">orig = grid[row][col]</text>
    <text x="270" y="88" text-anchor="middle" fill="#555" font-size="10">记录分量原色</text>

    <path d="M 270 96 L 270 108" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 2. diamond: orig == color? -->
    <polygon points="270,110 365,128 270,146 175,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="270" y="126" text-anchor="middle" fill="#d6a040" font-weight="bold">orig == color?</text>
    <text x="270" y="140" text-anchor="middle" fill="#d6a040" font-size="10">涂同色=没涂</text>

    <!-- Yes -> right -->
    <path d="M 365 128 L 393 128" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="378" y="122" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">是</text>
    <rect x="395" y="110" width="120" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="6"/>
    <text x="455" y="132" text-anchor="middle" fill="#666" font-weight="bold">return grid（no-op）</text>

    <!-- No -> down -->
    <path d="M 270 146 L 270 166" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="284" y="160" font-size="10" fill="#666" font-weight="bold">否</text>

    <!-- 3. mark component -->
    <rect x="110" y="168" width="320" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="270" y="186" text-anchor="middle" fill="#4a7a3a" font-weight="bold">阶段一：DFS/BFS 标记分量</text>
    <text x="270" y="202" text-anchor="middle" fill="#555" font-size="10">grid==orig 则置 -orig（取负，兼做 visited）</text>

    <path d="M 270 214 L 270 230" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 4. count neighbors -->
    <rect x="110" y="232" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="270" y="250" text-anchor="middle" fill="#446688" font-weight="bold">阶段二：遍历分量格</text>
    <text x="270" y="264" text-anchor="middle" fill="#555" font-size="10">数四邻中值为 -orig 的个数 cnt</text>

    <path d="M 270 272 L 270 288" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 5. diamond cnt < 4? -->
    <polygon points="270,290 360,308 270,326 180,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="270" y="306" text-anchor="middle" fill="#d6a040" font-weight="bold">cnt &lt; 4 ?</text>
    <text x="270" y="320" text-anchor="middle" fill="#d6a040" font-size="10">有邻居不在分量</text>

    <!-- Yes -> left: border -->
    <path d="M 180 308 L 152 308" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
    <text x="166" y="302" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
    <rect x="40" y="290" width="112" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="96" y="312" text-anchor="middle" fill="#b85450" font-weight="bold">边界格 → 收集</text>

    <!-- No -> right: interior -->
    <path d="M 360 308 L 388 308" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arrX)"/>
    <text x="374" y="302" text-anchor="middle" font-size="10" fill="#999" font-weight="bold">否</text>
    <rect x="390" y="290" width="112" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="6"/>
    <text x="446" y="312" text-anchor="middle" fill="#666" font-weight="bold">内部格 → 跳过</text>

    <!-- converge down to phase 3 -->
    <path d="M 96 326 L 96 350 L 268 360" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)"/>
    <path d="M 446 326 L 446 350 L 272 360" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrX)"/>

    <!-- 6. phase three: color + restore -->
    <rect x="110" y="362" width="320" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="270" y="380" text-anchor="middle" fill="#4a7a3a" font-weight="bold">阶段三：上色 + 恢复</text>
    <text x="270" y="396" text-anchor="middle" fill="#555" font-size="10">边界格涂 color；剩余 -orig 恢复 orig → return grid</text>

    <text x="270" y="426" text-anchor="middle" font-size="10" fill="#aaa">绿=标记/收尾动作｜橙=判定｜红=边界收集｜灰=跳过/no-op</text>
  </g>
</svg>
