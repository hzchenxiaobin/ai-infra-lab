<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">均分链表：base = n / k，rem = n % k</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">前 rem 段各 base+1 个节点，其余各 base 个节点（n=10, k=3）</text>

  <!-- ===== 原链表：1..10 ===== -->
  <text x="20" y="82" font-size="11" fill="#555" font-weight="bold">原链表 (n = 10)：</text>
  <g font-size="12">
    <rect x="100" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="117" y="88" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="136" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="153" y="88" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="172" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="189" y="88" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="208" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="225" y="88" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <rect x="244" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="261" y="88" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <rect x="280" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="297" y="88" text-anchor="middle" fill="#333" font-weight="bold">6</text>
    <rect x="316" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="333" y="88" text-anchor="middle" fill="#333" font-weight="bold">7</text>
    <rect x="352" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="369" y="88" text-anchor="middle" fill="#333" font-weight="bold">8</text>
    <rect x="388" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="405" y="88" text-anchor="middle" fill="#333" font-weight="bold">9</text>
    <rect x="424" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="441" y="88" text-anchor="middle" fill="#333" font-weight="bold">10</text>
  </g>
  <g stroke="#446688" stroke-width="1" fill="none">
    <line x1="134" y1="83" x2="136" y2="83" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="170" y1="83" x2="172" y2="83" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="206" y1="83" x2="208" y2="83" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="242" y1="83" x2="244" y2="83" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="278" y1="83" x2="280" y2="83" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="314" y1="83" x2="316" y2="83" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="350" y1="83" x2="352" y2="83" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="386" y1="83" x2="388" y2="83" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="422" y1="83" x2="424" y2="83" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <!-- ===== 公式框 ===== -->
  <rect x="20" y="118" width="560" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="138" font-size="11" fill="#8a6a20" font-weight="bold">整除分配：</text>
  <text x="34" y="156" font-size="12" fill="#333">base = n / k = 10 / 3 = 3     rem = n % k = 10 % 3 = 1     →     前 rem=1 段各 base+1=4，其余各 base=3</text>

  <!-- ===== 三段分隔展示 ===== -->
  <text x="20" y="196" font-size="11" fill="#444" font-weight="bold">分隔结果（k = 3 段）：</text>

  <!-- 段 0：1,2,3,4 (base+1，绿色强调) -->
  <text x="20" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">段 0 (base+1=4)</text>
  <g font-size="12">
    <rect x="40" y="232" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="57" y="252" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="76" y="232" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="93" y="252" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="112" y="232" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="129" y="252" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="148" y="232" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="165" y="252" text-anchor="middle" fill="#333" font-weight="bold">4</text>
  </g>
  <g stroke="#4a7a3a" stroke-width="1.2" fill="none">
    <line x1="74" y1="247" x2="76" y2="247" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <line x1="110" y1="247" x2="112" y2="247" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <line x1="146" y1="247" x2="148" y2="247" marker-end="url(#arrG)" filter="url(#rough2)"/>
  </g>
  <!-- 切断标记 -->
  <path d="M 190 232 L 190 262" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="196" y="252" font-size="9" fill="#b85450" font-weight="bold">✂ 切断</text>

  <!-- 段 1：5,6,7 (base) -->
  <text x="240" y="226" font-size="10" fill="#446688" font-weight="bold">段 1 (base=3)</text>
  <g font-size="12">
    <rect x="260" y="232" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="277" y="252" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <rect x="296" y="232" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="313" y="252" text-anchor="middle" fill="#333" font-weight="bold">6</text>
    <rect x="332" y="232" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="349" y="252" text-anchor="middle" fill="#333" font-weight="bold">7</text>
  </g>
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="294" y1="247" x2="296" y2="247" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="330" y1="247" x2="332" y2="247" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <path d="M 374 232 L 374 262" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="380" y="252" font-size="9" fill="#b85450" font-weight="bold">✂ 切断</text>

  <!-- 段 2：8,9,10 (base) -->
  <text x="424" y="226" font-size="10" fill="#446688" font-weight="bold">段 2 (base=3)</text>
  <g font-size="12">
    <rect x="444" y="232" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="461" y="252" text-anchor="middle" fill="#333" font-weight="bold">8</text>
    <rect x="480" y="232" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="497" y="252" text-anchor="middle" fill="#333" font-weight="bold">9</text>
    <rect x="516" y="232" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="533" y="252" text-anchor="middle" fill="#333" font-weight="bold">10</text>
  </g>
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="478" y1="247" x2="480" y2="247" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="514" y1="247" x2="516" y2="247" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <!-- ===== 长度分布条 ===== -->
  <text x="20" y="296" font-size="11" fill="#444" font-weight="bold">长度分布：</text>
  <text x="20" y="316" font-size="10" fill="#888">段 0</text>
  <rect x="60" y="304" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4 = base + 1</text>

  <text x="20" y="342" font-size="10" fill="#888">段 1</text>
  <rect x="60" y="330" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="344" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3 = base</text>

  <text x="20" y="368" font-size="10" fill="#888">段 2</text>
  <rect x="60" y="356" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="370" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3 = base</text>

  <text x="190" y="346" font-size="10" fill="#888">↑ 前 rem=1 段比后段恰好多 1，</text>
  <text x="190" y="360" font-size="10" fill="#888">   差距 ≤ 1 且前段 ≥ 后段</text>

  <!-- 底部要点 -->
  <rect x="20" y="390" width="560" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="34" y="408" font-size="11" fill="#b85450" font-weight="bold">关键：</text>
  <text x="34" y="424" font-size="11" fill="#555">余数 rem 决定「前 rem 段 +1」；段长只取 base+1 / base 两种值，天然满足「差距≤1、前≥后」</text>
</svg>
