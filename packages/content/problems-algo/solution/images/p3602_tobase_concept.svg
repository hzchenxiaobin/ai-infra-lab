<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：同一套短除法（除 b 取余），16 进制与 36 进制同构</text>

  <text x="26" y="46" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左：n = 13 的 n²</text>
  <text x="281" y="46" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">右：n = 13 的 n³</text>

  <rect x="20" y="52" width="225" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">n² = 169 → 十六进制</text>

  <rect x="20" y="86" width="225" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="132" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">169 ÷ 16 = 10 …… 余 <tspan fill="#b85450" font-weight="bold">9</tspan></text>

  <rect x="20" y="122" width="225" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="132" y="142" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10 ÷ 16 = 0 …… 余 <tspan fill="#b85450" font-weight="bold">10</tspan><tspan fill="#999" font-size="10"> → 'A'</tspan></text>

  <text x="20" y="174" font-size="10.5" fill="#888" filter="url(#rough2)">余数序列（低位 → 高位）：</text>

  <rect x="30" y="180" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">9</text>
  <rect x="76" y="180" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="94" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">A</text>

  <path d="M 112 208 Q 124 220 78 224" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="128" y="222" font-size="10" fill="#4a7a3a" filter="url(#rough2)">倒序读出</text>

  <rect x="20" y="228" width="92" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">"A9"</text>

  <text x="124" y="288" font-size="10" fill="#b85450" filter="url(#rough2)">（忘了倒序 → "9A" ✗）</text>

  <rect x="275" y="52" width="225" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n³ = 2197 → 三十六进制</text>

  <rect x="275" y="86" width="225" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="387" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2197 ÷ 36 = 61 …… 余 <tspan fill="#b85450" font-weight="bold">1</tspan></text>

  <rect x="275" y="122" width="225" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="387" y="142" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">61 ÷ 36 = 1 …… 余 <tspan fill="#b85450" font-weight="bold">25</tspan><tspan fill="#999" font-size="10"> → 'P'</tspan></text>

  <rect x="275" y="158" width="225" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="387" y="178" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 ÷ 36 = 0 …… 余 <tspan fill="#b85450" font-weight="bold">1</tspan></text>

  <text x="275" y="210" font-size="10.5" fill="#888" filter="url(#rough2)">余数序列（低位 → 高位）：</text>

  <rect x="285" y="216" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="303" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="331" y="216" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="349" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">P</text>
  <rect x="377" y="216" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 413 244 Q 426 254 372 259" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="428" y="256" font-size="10" fill="#4a7a3a" filter="url(#rough2)">倒序</text>

  <rect x="275" y="262" width="92" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="321" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">"1P1"</text>

  <path d="M 24 316 L 496 316" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#rough2)"/>

  <rect x="20" y="328" width="480" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="350" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">一张字符表走天下：digits = "0123456789ABCDEF…XYZ"（36 个字符）</text>
  <text x="36" y="372" font-size="11" fill="#555" filter="url(#rough2)">余数 r ∈ [0, b) 直接查表 digits[r]：10→'A'、25→'P'、35→'Z'</text>
  <text x="36" y="394" font-size="11" fill="#555" filter="url(#rough2)">商变成 0 就停；先算出的余数是最低位 → 倒序拼接才是答案</text>

  <text x="260" y="436" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n = 13 时：toBase(n², 16) + toBase(n³, 36) = <tspan fill="#b85450" font-weight="bold">"A9" + "1P1" = "A91P1"</tspan></text>
</svg>
