<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [9, 12, 9, 11]，m = 4（mask = 15）</text>

  <!-- 左：BFS 分层 -->
  <text x="143" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">多源 BFS 分层</text>

  <rect x="30" y="56" width="226" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="143" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">层 0（源）：9 · 12 · 11</text>
  <text x="143" y="94" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">nums 去重后的全部元素，dist = 0</text>

  <path d="M 143 104 L 143 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="152" y="114" font-size="9.5" fill="#888" filter="url(#rough2)">翻转一位扩散</text>

  <rect x="30" y="118" width="226" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="143" y="138" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">层 1（8 个）：1 3 4 8 10 13 14 15</text>
  <text x="143" y="156" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">与某个源恰差一位的数</text>

  <path d="M 143 166 L 143 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="30" y="180" width="226" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="143" y="200" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">层 2（5 个）：0 2 5 6 7</text>
  <text x="143" y="218" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">与所有源都至少差两位的数</text>

  <text x="143" y="248" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3 + 8 + 5 = 16 = 2^4：全部状态标完，</text>
  <text x="143" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">最大层距离只有 2</text>

  <!-- 右：查询表 -->
  <text x="384" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">逐元素查询（answer = 4 − dist）</text>

  <rect x="272" y="56" width="224" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="289" y="73" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="334" y="73" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="390" y="73" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x⊕15</text>
  <text x="440" y="73" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dist</text>
  <text x="479" y="73" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="272" y="82" width="224" height="112" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="306" y1="56" x2="306" y2="194" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="362" y1="56" x2="362" y2="194" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="418" y1="56" x2="418" y2="194" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="462" y1="56" x2="462" y2="194" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="272" y1="110" x2="496" y2="110" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="272" y1="138" x2="496" y2="138" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="272" y1="166" x2="496" y2="166" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="289" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="334" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="390" y="100" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="440" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="479" y="100" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="289" y="128" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="334" y="128" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="390" y="128" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="440" y="128" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="479" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="289" y="156" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="334" y="156" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="390" y="156" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="440" y="156" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="479" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="289" y="184" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="334" y="184" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11</text>
  <text x="390" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="440" y="184" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="479" y="184" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="384" y="216" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">重复的 9 共享同一次查表结果</text>

  <!-- 底部结论 -->
  <rect x="30" y="272" width="460" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 answer = [2, 3, 2, 3]，与示例一致 ✓</text>
  <text x="260" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">验证 i=1：12 ⊕ 15 = 3（0011），与 11（1011）恰差一位 → 4 − 1 = 3</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">验证 i=0：9 ⊕ 15 = 6（0110），最近的是 12（1100），差 2 位 → 4 − 2 = 2</text>

  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一次 BFS 服务全部 n 个查询：先扫满状态空间，再逐个 O(1) 查表</text>
</svg>
