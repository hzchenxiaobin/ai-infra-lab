<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：两组日期做差验证</text>

  <text x="260" y="56" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">示例 1：date1 = 2019-06-29, date2 = 2019-06-30</text>

  <rect x="30" y="68" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="87" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">日期</text>
  <text x="200" y="87" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">完整年</text>
  <text x="300" y="87" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">当年第几天</text>
  <text x="410" y="87" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">elapsed</text>

  <rect x="30" y="98" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2019-06-29</text>
  <text x="200" y="116" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">48×365+12</text>
  <text x="300" y="116" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">151+29−1</text>
  <text x="410" y="116" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">17711</text>

  <rect x="30" y="126" width="460" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2019-06-30</text>
  <text x="200" y="144" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">48×365+12</text>
  <text x="300" y="144" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">151+30−1</text>
  <text x="410" y="144" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">17712</text>

  <rect x="120" y="160" width="280" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="179" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">|17712 − 17711| = 1 ✓</text>

  <text x="260" y="212" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">示例 2：date1 = 2020-01-15, date2 = 2019-12-31</text>

  <rect x="30" y="224" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="243" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">日期</text>
  <text x="200" y="243" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">完整年</text>
  <text x="300" y="243" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">当年第几天</text>
  <text x="410" y="243" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">elapsed</text>

  <rect x="30" y="254" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2020-01-15</text>
  <text x="200" y="272" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">49×365+12</text>
  <text x="300" y="272" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">0+15−1</text>
  <text x="410" y="272" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">17911</text>

  <rect x="30" y="282" width="460" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2019-12-31</text>
  <text x="200" y="300" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">48×365+12</text>
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">334+31−1</text>
  <text x="410" y="300" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">17896</text>

  <rect x="120" y="316" width="280" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">|17911 − 17896| = 15 ✓</text>

  <rect x="30" y="360" width="460" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="382" font-size="11" fill="#333" filter="url(#rough2)">闰年计数 leap(y) = ⌊y/4⌋ − ⌊y/100⌋ + ⌊y/400⌋</text>
  <text x="50" y="400" font-size="10" fill="#888" filter="url(#rough2)">• 示例1：leap(2018)−leap(1970) = (504−20+5)−(492−19+4) = 489−477 = 12</text>
  <text x="50" y="416" font-size="10" fill="#888" filter="url(#rough2)">• 示例2：2020 闰但 M=1 不修正；2019 平年无修正</text>
</svg>
