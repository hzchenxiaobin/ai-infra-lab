<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：嵌套 JSON 树 → 点分路径拍平</text>

  <!-- ===== Left: nested object tree ===== -->
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">嵌套对象</text>

  <!-- root object -->
  <rect x="60" y="70" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ "a": {…}, "b": 5 }</text>

  <!-- branch lines -->
  <path d="M 140 106 L 140 124" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 100 124 L 180 124" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 100 124 L 100 138" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 180 124 L 180 138" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- key a -> nested object -->
  <rect x="50" y="138" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a → { "b":1, "c":2 }</text>

  <!-- key b -> primitive -->
  <rect x="140" y="138" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b → 5</text>

  <!-- deeper branch from a -->
  <path d="M 100 168 L 100 182" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 70 182 L 130 182" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 70 182 L 70 196" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 130 182 L 130 196" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <rect x="46" y="196" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b → 1</text>

  <rect x="106" y="196" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="130" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c → 2</text>

  <!-- arrow to flat -->
  <path d="M 240 155 L 300 155" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="147" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">拍平</text>

  <!-- ===== Right: flattened paths ===== -->
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">点分路径 → 叶子值</text>

  <rect x="320" y="70" width="300" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>

  <!-- path rows -->
  <rect x="334" y="86" width="272" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="104" font-size="12" fill="#333" filter="url(#rough2)">"a.b" → 1</text>

  <rect x="334" y="120" width="272" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="138" font-size="12" fill="#333" filter="url(#rough2)">"a.c" → 2</text>

  <rect x="334" y="154" width="272" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="172" font-size="12" fill="#333" filter="url(#rough2)">"b" → 5</text>

  <text x="470" y="206" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">键序无关，最终统一排序</text>

  <!-- ===== Bottom: array case ===== -->
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">数组也按「下标当键」拍平</text>

  <rect x="40" y="286" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="140" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[ {"a": null} ]</text>

  <path d="M 240 304 L 290 304" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="296" y="286" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="396" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"0.a" → null</text>

  <!-- note -->
  <rect x="40" y="334" width="560" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="355" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">递归基：原始类型（number / string / boolean / null）= 叶子，路径到此终止</text>
</svg>
