<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：每次减半当前最大值 —— 贪心 + 大根堆</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">每次操作收益 = 所选数 / 2；最少操作 ⟹ 每步收益最大 ⟹ 选当前最大</text>

  <!-- ===== Left: greedy pick illustration ===== -->
  <text x="40" y="74" font-size="11.5" fill="#446688" font-weight="bold">① 贪心选择：总挑最大的开刀</text>

  <!-- row 1: [5, 19, 8, 1], 19 is max -->
  <text x="40" y="98" font-size="9.5" fill="#888">初始堆</text>
  <rect x="40" y="104" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="128" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="90" y="104" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="128" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">19</text>
  <rect x="140" y="104" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="128" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="190" y="104" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="244" y="120" font-size="10" fill="#d6a040" font-weight="bold">↑ 最大</text>

  <!-- arrow down: halve 19 -->
  <path d="M 112 142 L 112 158" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="156" font-size="9.5" fill="#666">减半 19 → 9.5，收益 +9.5</text>

  <!-- row 2: [5, 9.5, 8, 1], 9.5 is max -->
  <rect x="40" y="164" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="188" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="90" y="164" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9.5</text>
  <rect x="140" y="164" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="188" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="190" y="164" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="188" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="244" y="180" font-size="10" fill="#d6a040" font-weight="bold">↑ 仍是最大</text>

  <!-- arrow down: halve 9.5 -->
  <path d="M 112 202 L 112 218" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="216" font-size="9.5" fill="#666">减半 9.5 → 4.75，收益 +4.75</text>

  <!-- row 3: [5, 4.75, 8, 1], 8 is now max -->
  <rect x="40" y="224" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="248" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="90" y="224" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="248" text-anchor="middle" font-size="12" fill="#333">4.75</text>
  <rect x="140" y="224" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="248" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="190" y="224" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="248" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="244" y="240" font-size="10" fill="#d6a040" font-weight="bold">↑ 换最大</text>

  <!-- note -->
  <rect x="40" y="270" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="160" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">减半后的数要放回堆</text>
  <text x="160" y="302" text-anchor="middle" font-size="9.5" fill="#555">它可能仍是最大，可被再次减半</text>

  <!-- split line -->
  <line x1="300" y1="60" x2="300" y2="400" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: why greedy is optimal ===== -->
  <text x="430" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② 为什么贪心最优</text>

  <!-- box 1 -->
  <rect x="320" y="88" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">每次操作收益 = 所选数 / 2</text>
  <text x="430" y="124" text-anchor="middle" font-size="9.5" fill="#555">要达目标和，需累计收益 ≥ total/2</text>

  <path d="M 430 136 L 430 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box 2 -->
  <rect x="320" y="154" width="220" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最少操作 ⟺ 每步收益最大</text>
  <text x="430" y="190" text-anchor="middle" font-size="9.5" fill="#555">⟹ 每步选当前最大值减半</text>

  <path d="M 430 202 L 430 216" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- box 3: exchange argument -->
  <rect x="320" y="220" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">交换论证保最优</text>
  <text x="430" y="256" text-anchor="middle" font-size="9.5" fill="#555">不选最大的操作可替换为选最大</text>
  <text x="430" y="268" text-anchor="middle" font-size="9.5" fill="#555">收益只增不减，操作数不增</text>

  <!-- ===== Bottom: upper bound ===== -->
  <rect x="320" y="292" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">操作数上界 ≤ n</text>
  <text x="430" y="328" text-anchor="middle" font-size="9.5" fill="#555">每个数各减半一次：</text>
  <text x="430" y="340" text-anchor="middle" font-size="9.5" fill="#555">总削减 = Σ nums[i]/2 = total/2 = 目标</text>

  <!-- footer -->
  <text x="40" y="358" font-size="10.5" fill="#444" font-weight="bold">工具：大根堆 O(log n) 取最大 / 放回；总时间 O(n log n)</text>
  <text x="40" y="376" font-size="10" fill="#888">total/2 是目标线；累计收益 crossed 目标即停</text>
</svg>
