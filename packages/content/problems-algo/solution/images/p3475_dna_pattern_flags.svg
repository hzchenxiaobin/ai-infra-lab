<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">四个模式标志 = 前缀 / 后缀 / 子串 / 「至少型」子串</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例串 ATG·ATAT·GGG·TAA —— 四个标志全部命中</text>

  <!-- sequence cells: ATGATATGGGTAA -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="104" y="48" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="66" text-anchor="middle">A</text>
    <rect x="128" y="48" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="140" y="66" text-anchor="middle">T</text>
    <rect x="152" y="48" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="164" y="66" text-anchor="middle">G</text>
    <rect x="176" y="48" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="188" y="66" text-anchor="middle">A</text>
    <rect x="200" y="48" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="212" y="66" text-anchor="middle">T</text>
    <rect x="224" y="48" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="236" y="66" text-anchor="middle">A</text>
    <rect x="248" y="48" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="260" y="66" text-anchor="middle">T</text>
    <rect x="272" y="48" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="284" y="66" text-anchor="middle">G</text>
    <rect x="296" y="48" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="308" y="66" text-anchor="middle">G</text>
    <rect x="320" y="48" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="332" y="66" text-anchor="middle">G</text>
    <rect x="344" y="48" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="356" y="66" text-anchor="middle">T</text>
    <rect x="368" y="48" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="380" y="66" text-anchor="middle">A</text>
    <rect x="392" y="48" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="404" y="66" text-anchor="middle">A</text>
  </g>

  <!-- segment brackets -->
  <path d="M 104 78 L 104 86 L 174 86 L 174 78" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 178 78 L 178 86 L 270 86 L 270 78" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 274 78 L 274 86 L 342 86 L 342 78" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 346 78 L 346 86 L 414 86 L 414 78" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#666">
    <text x="139" y="100" text-anchor="middle" fill="#446688">前缀</text>
    <text x="224" y="100" text-anchor="middle" fill="#4a7a3a">子串</text>
    <text x="308" y="100" text-anchor="middle" fill="#b85450">≥3 连续</text>
    <text x="380" y="100" text-anchor="middle" fill="#7a4a2b">后缀</text>
  </g>

  <!-- 2x2 flag boxes -->
  <rect x="32" y="110" width="222" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="128" font-size="11.5" fill="#33506e" filter="url(#rough2)">has_start —— 前缀匹配</text>
  <text x="42" y="144" font-size="10" fill="#446688" filter="url(#rough2)">LIKE 'ATG%'（通配符在后，可走索引）</text>

  <rect x="266" y="110" width="222" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="128" font-size="11.5" fill="#7a4a2b" filter="url(#rough2)">has_stop —— 后缀匹配</text>
  <text x="276" y="144" font-size="10" fill="#7a4a2b" filter="url(#rough2)">RIGHT(col,3) IN ('TAA','TAG','TGA')</text>

  <rect x="32" y="160" width="222" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="178" font-size="11.5" fill="#2d5523" filter="url(#rough2)">has_atat —— 子串包含</text>
  <text x="42" y="194" font-size="10" fill="#4a7a3a" filter="url(#rough2)">LIKE '%ATAT%'（双侧通配，中缀扫描）</text>

  <rect x="266" y="160" width="222" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="178" font-size="11.5" fill="#7a2f2b" filter="url(#rough2)">has_ggg —— 「至少型」包含</text>
  <text x="276" y="194" font-size="10" fill="#b85450" filter="url(#rough2)">LIKE '%GGG%'：GGGG ⊇ GGG，无需断言</text>

  <!-- at-least vs exactly comparison -->
  <rect x="32" y="212" width="456" height="90" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="11" fill="#7a4a2b" filter="url(#rough2)">⚠ 「至少 3 个连续 G」 vs 「恰好 3 个连续 G」（3465 的镜像）</text>
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <rect x="64" y="240" width="20" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="74" y="256" text-anchor="middle">G</text>
    <rect x="84" y="240" width="20" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="94" y="256" text-anchor="middle">G</text>
    <rect x="104" y="240" width="20" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="114" y="256" text-anchor="middle">G</text>
    <rect x="124" y="240" width="20" height="22" rx="3" fill="#fafafa" stroke="#b85450" stroke-width="1.5"/>
    <text x="134" y="256" text-anchor="middle">G</text>
  </g>
  <rect x="62" y="238" width="64" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="160" y="250" font-size="10" fill="#2d5523" filter="url(#rough2)">GGGG 天然含子串 GGG → LIKE '%GGG%' 命中 ✓（「至少」）</text>
  <text x="160" y="262" font-size="9.5" fill="#888" filter="url(#rough2)">长度 4 的串必含长度 3 的子串，双侧边界都不用写</text>
  <text x="64" y="284" font-size="10" fill="#b85450" filter="url(#rough2)">恰好 3 个：左右都不能再是 G → (^|[^G])GGG([^G]|$)，GGGG ✗</text>
  <text x="64" y="296" font-size="10" fill="#7a4a2b" filter="url(#rough2)">一句话：量词/子串表达「至少」，边界断言才表达「恰好」</text>

  <!-- bottom note -->
  <rect x="32" y="310" width="456" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">MySQL：布尔表达式直接输出 1/0，SELECT 里无需 CASE WHEN</text>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">PostgreSQL 需 ::int、pandas 需 astype(int) —— 布尔的输出形态是三大环境的最大差异</text>
</svg>
