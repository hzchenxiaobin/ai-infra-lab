<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：找出得分最高的 3-序列</text>

  <!-- joe -->
  <text x="30" y="62" font-size="11" fill="#666" filter="url(#rough2)">joe</text>
  <rect x="70" y="48" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="64" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">home</text>
  <rect x="124" y="48" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="64" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">about</text>
  <rect x="178" y="48" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="64" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">career</text>
  <text x="240" y="64" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ (home,about,career)</text>

  <!-- james -->
  <text x="30" y="108" font-size="11" fill="#666" filter="url(#rough2)">james</text>
  <rect x="70" y="94" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">home</text>
  <rect x="124" y="94" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cart</text>
  <rect x="178" y="94" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">maps</text>
  <rect x="232" y="94" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">home</text>
  <rect x="286" y="94" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">career</text>
  <text x="346" y="110" font-size="10" fill="#666" filter="url(#rough2)">→ C(5,3)=10 组合</text>

  <!-- mary -->
  <text x="30" y="154" font-size="11" fill="#666" filter="url(#rough2)">mary</text>
  <rect x="70" y="140" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">home</text>
  <rect x="124" y="140" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">about</text>
  <rect x="178" y="140" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">career</text>
  <rect x="232" y="140" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">maps</text>
  <rect x="286" y="140" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">career</text>
  <text x="346" y="156" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ 含 (home,about,career)</text>

  <!-- separator -->
  <path d="M 40 180 L 540 180" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- counts table title -->
  <text x="290" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">patternCount 汇总（节选）</text>

  <!-- table header -->
  <rect x="60" y="216" width="280" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">模式</text>
  <text x="380" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">命中用户数</text>
  <line x1="340" y1="216" x2="340" y2="240" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- row: (home,about,career) = 2  highlight -->
  <rect x="60" y="242" width="280" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="260" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">(home, about, career)</text>
  <rect x="340" y="242" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="260" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">2 ★</text>

  <!-- row: (home,maps,career) = 2 -->
  <rect x="60" y="270" width="280" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="288" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(home, maps, career)</text>
  <rect x="340" y="270" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="288" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>

  <!-- row: (home,career,career) = 1 -->
  <rect x="60" y="298" width="280" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="316" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(home, career, career)</text>
  <rect x="340" y="298" width="120" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="316" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>

  <!-- tie-break note -->
  <rect x="60" y="340" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">并列 2 分：about &lt; maps → 取 (home,about,career)</text>

  <!-- result -->
  <rect x="120" y="384" width="340" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="406" text-anchor="middle" font-size="13" fill="#8a3a3a" filter="url(#rough2)">输出：["home","about","career"]</text>
</svg>
