<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三件套：used[] + 回收队列 + 游标</text>
  <path d="M 280 46 Q 430 54 580 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Top: 号码池 0..maxNumbers-1 ===== -->
  <g filter="url(#sk)"><rect x="60" y="74" width="740" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="430" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">号码池：0, 1, 2, ..., maxNumbers-1</text>
  <text x="430" y="118" text-anchor="middle" font-size="11" fill="#8a6a35">初始全部可用，靠三件套分工管理</text>

  <!-- ===== Left: used[] 数组 ===== -->
  <g filter="url(#sk)"><rect x="40" y="160" width="240" height="240" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="160" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">used[]  布尔数组</text>
  <text x="160" y="204" text-anchor="middle" font-size="10.5" fill="#5a7a9e">号码 → 是否已分配</text>
  <g font-size="11">
    <g filter="url(#sk)"><rect x="60" y="218" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="80" y="235" text-anchor="middle" fill="#b03a3a" font-weight="bold">T</text>
    <text x="80" y="258" text-anchor="middle" font-size="9.5" fill="#888">0</text>
    <g filter="url(#sk)"><rect x="100" y="218" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="120" y="235" text-anchor="middle" fill="#b03a3a" font-weight="bold">T</text>
    <text x="120" y="258" text-anchor="middle" font-size="9.5" fill="#888">1</text>
    <g filter="url(#sk)"><rect x="140" y="218" width="40" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="160" y="235" text-anchor="middle" fill="#2e6e2e" font-weight="bold">F</text>
    <text x="160" y="258" text-anchor="middle" font-size="9.5" fill="#888">2</text>
    <g filter="url(#sk)"><rect x="180" y="218" width="40" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="200" y="235" text-anchor="middle" fill="#2e6e2e" font-weight="bold">F</text>
    <text x="200" y="258" text-anchor="middle" font-size="9.5" fill="#888">3</text>
    <g filter="url(#sk)"><rect x="220" y="218" width="40" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="240" y="235" text-anchor="middle" fill="#2e6e2e" font-weight="bold">F</text>
    <text x="240" y="258" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  </g>
  <g filter="url(#sk)"><rect x="60" y="280" width="200" height="44" rx="6" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="160" y="300" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">支撑 check(n)</text>
  <text x="160" y="316" text-anchor="middle" font-size="10" fill="#555">返回 !used[n]   O(1)</text>
  <text x="160" y="358" text-anchor="middle" font-size="10.5" fill="#7a5415">T=已分配·不可取</text>
  <text x="160" y="374" text-anchor="middle" font-size="10.5" fill="#7a5415">F=可用（含未分配+回收）</text>

  <!-- ===== Middle: recycled 队列 ===== -->
  <g filter="url(#sk)"><rect x="310" y="160" width="240" height="240" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="430" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">recycled  回收队列</text>
  <text x="430" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a">release 推入 · get 弹出</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="330" y="226" width="46" height="32" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="353" y="247" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="353" y="272" text-anchor="middle" font-size="9.5" fill="#888">队首</text>
    <g filter="url(#sk)"><rect x="380" y="226" width="46" height="32" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.4" stroke-dasharray="3 2"/></g>
    <text x="403" y="247" text-anchor="middle" fill="#888">…</text>
    <text x="403" y="272" text-anchor="middle" font-size="9.5" fill="#888">后续</text>
  </g>
  <path d="M 460 242 L 490 242" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="475" y="232" text-anchor="middle" font-size="9.5" fill="#5a5a5a">pop</text>
  <g filter="url(#sk)"><rect x="330" y="296" width="200" height="44" rx="6" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="430" y="316" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">支撑 get() 优先复用</text>
  <text x="430" y="332" text-anchor="middle" font-size="10" fill="#555">队空才回退到游标</text>
  <text x="430" y="372" text-anchor="middle" font-size="10.5" fill="#7a5415">已分配后被 release 回收</text>
  <text x="430" y="388" text-anchor="middle" font-size="10.5" fill="#7a5415">的离散号码</text>

  <!-- ===== Right: next 游标 ===== -->
  <g filter="url(#sk)"><rect x="580" y="160" width="240" height="240" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="700" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">next  游标</text>
  <text x="700" y="204" text-anchor="middle" font-size="10.5" fill="#b85450">顺次扫未分配段</text>
  <g font-size="11">
    <g filter="url(#sk)"><rect x="610" y="220" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="630" y="237" text-anchor="middle" fill="#b03a3a" font-weight="bold">2</text>
    <text x="630" y="262" text-anchor="middle" font-size="9.5" fill="#888">next</text>
  </g>
  <path d="M 654 233 L 700 233" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="678" y="222" text-anchor="middle" font-size="9.5" fill="#b85450">自增</text>
  <g filter="url(#sk)"><rect x="600" y="296" width="200" height="44" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="700" y="316" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">支撑 get() 取新号</text>
  <text x="700" y="332" text-anchor="middle" font-size="10" fill="#555">next &lt; maxNumbers 即可</text>
  <text x="700" y="372" text-anchor="middle" font-size="10.5" fill="#7a5415">从未分配过的连续段</text>
  <text x="700" y="388" text-anchor="middle" font-size="10.5" fill="#7a5415">[next, maxNumbers)</text>

  <!-- ===== Bottom: 协同总结 ===== -->
  <g filter="url(#sk)"><rect x="60" y="430" width="740" height="86" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="430" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">协同：get 优先取 recycled，空则取 next；check 查 used；release 置 F 入队</text>
  <text x="430" y="478" text-anchor="middle" font-size="11.5" fill="#555">三操作均为 O(1)，初始化 O(maxNumbers) 仅用于 used[] 清零</text>
  <text x="430" y="498" text-anchor="middle" font-size="10.5" fill="#888">回收队列 + 游标 = 号码池分两段管理；used[] = 统一真相源</text>
</svg>
