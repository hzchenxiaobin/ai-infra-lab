<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：取两端共 k 张 ⇔ 留中间一段长 n−k 的窗口</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">最大化「取走」之和  ⟺  最小化「留下」的连续子数组和</text>

  <!-- ===== Row 1: cards layout ===== -->
  <text x="40" y="80" font-size="11" fill="#446688" font-weight="bold">卡片排成一行 (n = 7, k = 3):</text>
  <g font-size="12">
    <!-- left taken: 1 -->
    <rect x="40" y="88" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="62" y="109" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <!-- middle window: 2 3 4 5 -->
    <rect x="88" y="88" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="110" y="109" text-anchor="middle" fill="#333">2</text>
    <rect x="136" y="88" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="158" y="109" text-anchor="middle" fill="#333">3</text>
    <rect x="184" y="88" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="206" y="109" text-anchor="middle" fill="#333">4</text>
    <rect x="232" y="88" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="254" y="109" text-anchor="middle" fill="#333">5</text>
    <!-- right taken: 6 1 -->
    <rect x="280" y="88" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="302" y="109" text-anchor="middle" fill="#333" font-weight="bold">6</text>
    <rect x="328" y="88" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="350" y="109" text-anchor="middle" fill="#333" font-weight="bold">1</text>
  </g>

  <!-- brackets: left taken, middle window, right taken -->
  <path d="M 40 126 L 40 132 L 84 132 L 84 126" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="62" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">左取 a 张</text>
  <path d="M 88 126 L 88 132 L 276 132 L 276 126" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="182" y="146" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">中间窗口长 n−k = 4（留下不取）</text>
  <path d="M 280 126 L 280 132 L 372 132 L 372 126" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="326" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">右取 b 张</text>
  <text x="430" y="146" font-size="10" fill="#888">a + b = k = 3</text>

  <!-- ===== Transformation equation ===== -->
  <rect x="40" y="162" width="540" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="184" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">取走之和 = 总和 total − 留下窗口之和</text>
  <text x="310" y="204" text-anchor="middle" font-size="12" fill="#555">⇒ max(取走之和) = total − min(长为 n−k 的连续子数组和)</text>

  <!-- ===== Sliding window idea ===== -->
  <text x="40" y="244" font-size="11" fill="#446688" font-weight="bold">在长度为 n 的数组上滑动一个定长 n−k 的窗口，求最小窗口和:</text>
  <g font-size="11">
    <!-- window position 1: covers indices 0..3 -->
    <rect x="40" y="252" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="62" y="270" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="88" y="252" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="110" y="270" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="136" y="252" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="158" y="270" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="184" y="252" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="206" y="270" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="232" y="252" width="44" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="254" y="270" text-anchor="middle" fill="#999">5</text>
    <rect x="280" y="252" width="44" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="302" y="270" text-anchor="middle" fill="#999">6</text>
    <rect x="328" y="252" width="44" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="350" y="270" text-anchor="middle" fill="#999">1</text>
  </g>
  <text x="150" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">窗口① [1,2,3,4] = 10 ← 当前最小</text>

  <g font-size="11">
    <!-- window position 2: covers indices 1..4 -->
    <rect x="40" y="300" width="44" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="62" y="318" text-anchor="middle" fill="#999">1</text>
    <rect x="88" y="300" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="110" y="318" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="136" y="300" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="158" y="318" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="184" y="300" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="206" y="318" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="232" y="300" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="254" y="318" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="280" y="300" width="44" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="302" y="318" text-anchor="middle" fill="#999">6</text>
    <rect x="328" y="300" width="44" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="350" y="318" text-anchor="middle" fill="#999">1</text>
  </g>
  <text x="150" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">窗口② [2,3,4,5] = 14</text>

  <text x="372" y="318" font-size="11" fill="#888">… 窗口右移一格，O(1) 增量更新和 …</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="354" width="540" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="376" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键：把「从两端取 k 张」翻转成「留中间一段长 n−k」</text>
  <text x="56" y="394" font-size="11" fill="#555">• 取走的不连续（左 a 张 + 右 b 张），但「留下」的必为连续一段，长恰好 n−k</text>
  <text x="56" y="408" font-size="11" fill="#555">• 总和 total 固定 ⇒ 最大化取走和 = 最小化留下窗口和，定长滑动窗口 O(n) 解决</text>

  <!-- legend -->
  <g font-size="10" fill="#555">
    <rect x="40" y="424" width="14" height="12" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="60" y="434">取走（两端）</text>
    <rect x="150" y="424" width="14" height="12" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="170" y="434">当前窗口内</text>
    <rect x="260" y="424" width="14" height="12" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="280" y="434">窗口外（未取）</text>
  </g>

  <text x="310" y="452" text-anchor="middle" font-size="10" fill="#888">total=22, minWindow=10 ⇒ 答案 = 22 − 10 = 12</text>
</svg>
