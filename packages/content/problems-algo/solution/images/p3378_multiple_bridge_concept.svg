<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">两个观察：大值必孤点 · 公共倍数作桥</text>

  <!-- left panel: split by T -->
  <text x="100" y="56" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">第一步：按 T 分流（示例 T=10）</text>

  <rect x="30" y="66" width="140" height="118" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="86" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">值 ≤ T：参与并查集</text>
  <rect x="44" y="98" width="32" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="116" text-anchor="middle" font-size="13" fill="#2a4a1e" filter="url(#rough2)">2</text>
  <rect x="82" y="98" width="32" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="98" y="116" text-anchor="middle" font-size="13" fill="#2a4a1e" filter="url(#rough2)">3</text>
  <rect x="120" y="98" width="32" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136" y="116" text-anchor="middle" font-size="13" fill="#2a4a1e" filter="url(#rough2)">4</text>
  <rect x="44" y="132" width="32" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="150" text-anchor="middle" font-size="13" fill="#2a4a1e" filter="url(#rough2)">8</text>
  <rect x="82" y="132" width="32" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="98" y="150" text-anchor="middle" font-size="13" fill="#2a4a1e" filter="url(#rough2)">9</text>
  <text x="100" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">只有它们可能连边</text>

  <rect x="30" y="204" width="140" height="104" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="100" y="224" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">值 &gt; T：必为孤点</text>
  <rect x="82" y="236" width="32" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="98" y="254" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">12</text>
  <text x="100" y="284" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">lcm ≥ max(a,b) &gt; T</text>
  <text x="100" y="300" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">与谁都无边，直接计数</text>

  <!-- right panel: bridge -->
  <text x="350" y="56" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">第二步：公共倍数 m 当桥连因子</text>
  <text x="350" y="74" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">a|m 且 b|m 且 m ≤ T ⟺ lcm(a,b) ≤ T</text>

  <!-- node 2 -->
  <rect x="222" y="96" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="242" y="117" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">2</text>
  <text x="242" y="90" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">挂在两座桥上</text>

  <!-- node 3 -->
  <rect x="438" y="96" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="117" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>

  <!-- hub m=6 -->
  <circle cx="335" cy="130" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="335" y="128" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">桥</text>
  <text x="335" y="143" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">m=6</text>

  <!-- node 4 -->
  <rect x="222" y="252" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="242" y="273" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>

  <!-- hub m=8 -->
  <circle cx="335" cy="210" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="335" y="208" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">桥</text>
  <text x="335" y="223" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">m=8</text>

  <!-- node 8 -->
  <rect x="438" y="252" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="273" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">8</text>

  <!-- edges to hub 6 -->
  <path d="M262,108 Q296,112 314,120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="106" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2|6</text>
  <path d="M438,110 Q402,114 356,124" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="106" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3|6</text>

  <!-- edges to hub 8 -->
  <path d="M240,128 Q262,160 310,200" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="168" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2|8</text>
  <path d="M246,252 Q280,240 311,224" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="248" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">4|8</text>
  <path d="M438,268 Q400,252 360,226" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="248" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">8|8</text>

  <!-- transitivity note -->
  <text x="350" y="310" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 同时挂在 m=6 和 m=8 两座桥上</text>
  <text x="350" y="326" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">⟹ {2,3} 与 {2,4,8} 连成同一片</text>

  <!-- bottom note -->
  <rect x="105" y="338" width="310" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">桥 m 从哪来？外层枚举因子 d，内层枚举倍数 m</text>
</svg>
