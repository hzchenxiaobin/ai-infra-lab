<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">日期范围生成器：从 start 到 end，按 step 天步进 yield</text>

  <!-- Timeline base line -->
  <line x1="40" y1="160" x2="480" y2="160" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Start label -->
  <rect x="20" y="140" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="60" y="158" text-anchor="middle" font-size="10" fill="#888">start</text>
  <text x="60" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-10</text>

  <!-- End label -->
  <rect x="420" y="140" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="158" text-anchor="middle" font-size="10" fill="#888">end</text>
  <text x="460" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-20</text>

  <!-- Yielded date boxes (step=3: 04-10, 04-13, 04-16, 04-19) -->
  <rect x="20" y="220" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="243" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-10</text>
  <text x="60" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a">yield</text>

  <rect x="130" y="220" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="243" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-13</text>
  <text x="170" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a">yield</text>

  <rect x="240" y="220" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="243" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-16</text>
  <text x="280" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a">yield</text>

  <rect x="350" y="220" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="243" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-19</text>
  <text x="390" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a">yield</text>

  <!-- Step arrows between yielded dates -->
  <path d="M 100 238 L 128 238" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="114" y="230" text-anchor="middle" font-size="9" fill="#446688">+3</text>

  <path d="M 210 238 L 238 238" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="224" y="230" text-anchor="middle" font-size="9" fill="#446688">+3</text>

  <path d="M 320 238 L 348 238" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="334" y="230" text-anchor="middle" font-size="9" fill="#446688">+3</text>

  <!-- Next date past end (stop) -->
  <path d="M 430 238 L 460 238" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="445" y="230" text-anchor="middle" font-size="9" fill="#b85450">+3</text>
  <rect x="430" y="276" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="470" y="296" text-anchor="middle" font-size="10" fill="#b85450">04-22 &gt; end</text>
  <text x="470" y="270" text-anchor="middle" font-size="9" fill="#b85450">stop!</text>

  <!-- Generator symbol -->
  <rect x="200" y="60" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">function*</text>
  <text x="260" y="92" text-anchor="middle" font-size="10" fill="#888">generator</text>

  <!-- Arrow from generator to first yield -->
  <path d="M 260 100 Q 160 130 60 218" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Note box -->
  <rect x="40" y="310" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#555">每次 current += step，当 current &le; end 时 yield，超过则生成结束</text>
</svg>
