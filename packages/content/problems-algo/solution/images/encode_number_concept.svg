<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：encode(num) = bin(num+1) 去掉最高位的 1</text>

  <!-- ===== Section 1: Encoding table grouped by bit length ===== -->
  <text x="40" y="52" font-size="11" fill="#888">编码按位数分组：第 k 组有 2^k 个数，从 2^k−1 开始</text>

  <!-- Group 0 -->
  <rect x="30" y="60" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="79" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0位</text>
  <rect x="80" y="60" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="108" y="79" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0→""</text>
  <text x="148" y="79" font-size="10" fill="#bbb">(1个)</text>

  <!-- Group 1 -->
  <rect x="30" y="94" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="113" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1位</text>
  <rect x="80" y="94" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="108" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1→0</text>
  <rect x="140" y="94" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="168" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2→1</text>
  <text x="208" y="113" font-size="10" fill="#888">(2个)</text>

  <!-- Group 2 -->
  <rect x="30" y="128" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2位</text>
  <rect x="80" y="128" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="108" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3→00</text>
  <rect x="140" y="128" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="168" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4→01</text>
  <rect x="200" y="128" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5→10</text>
  <rect x="260" y="128" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="288" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6→11</text>
  <text x="328" y="147" font-size="10" fill="#888">(4个)</text>

  <!-- Group 3 -->
  <rect x="30" y="162" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="181" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3位</text>
  <rect x="80" y="162" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="108" y="181" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7→000</text>
  <rect x="140" y="162" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="168" y="181" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8→001</text>
  <text x="220" y="181" font-size="13" fill="#bbb" font-weight="bold">···</text>
  <rect x="260" y="162" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="288" y="181" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">14→111</text>
  <text x="328" y="181" font-size="10" fill="#888">(8个)</text>

  <!-- arrow down -->
  <path d="M 280 196 Q 280 208 280 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">关键洞察</text>

  <!-- ===== Section 2: Formula ===== -->
  <rect x="40" y="222" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">encode(num) = bin(num + 1) 去掉最高位的 '1'</text>
  <text x="280" y="256" text-anchor="middle" font-size="10.5" fill="#666">num+1 的二进制 = 1 后跟 k 个比特 → 去掉前导 1，剩下 k 位即组内偏移</text>

  <!-- ===== Section 3: Verification pipeline ===== -->
  <text x="40" y="286" font-size="11" fill="#888">验证：</text>

  <!-- column headers -->
  <text x="80" y="286" text-anchor="middle" font-size="10" fill="#888">num</text>
  <text x="160" y="286" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">num+1</text>
  <text x="260" y="286" text-anchor="middle" font-size="10" fill="#888">bin(num+1)</text>
  <text x="380" y="286" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">去掉最高位1</text>
  <text x="490" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">encode ✓</text>

  <!-- Row 1: num=0 -->
  <rect x="56" y="294" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="136" y="294" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="312" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="230" y="294" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"1"</text>
  <rect x="346" y="294" width="68" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">""</text>
  <rect x="460" y="294" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">""</text>

  <!-- Row 2: num=5 -->
  <rect x="56" y="326" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="136" y="326" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="344" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">6</text>
  <rect x="230" y="326" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"110"</text>
  <rect x="346" y="326" width="68" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"10"</text>
  <rect x="460" y="326" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="344" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"10"</text>

  <!-- Row 3: num=7 -->
  <rect x="56" y="358" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="376" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="136" y="358" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="376" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">8</text>
  <rect x="230" y="358" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"1000"</text>
  <rect x="346" y="358" width="68" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="376" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"000"</text>
  <rect x="460" y="358" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="376" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"000"</text>

  <!-- Row 4: num=14 -->
  <rect x="56" y="390" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="408" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">14</text>
  <rect x="136" y="390" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="408" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">15</text>
  <rect x="230" y="390" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="408" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"1111"</text>
  <rect x="346" y="390" width="68" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="408" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"111"</text>
  <rect x="460" y="390" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="408" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"111"</text>

  <!-- bottom note -->
  <text x="280" y="432" text-anchor="middle" font-size="10.5" fill="#888">每组的编码 = 组内偏移量的 k 位二进制；而 num+1 的二进制天然是 1 后跟 k 位偏移</text>
</svg>
