<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums1=[1,2,3,4,5,6], nums2=[1,1,2,2,2,2]</text>

  <!-- ============ Row 1: initial sums ============ -->
  <text x="40" y="56" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始</text>
  <g font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <rect x="80" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="95" y="60">1</text>
    <rect x="112" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="127" y="60">2</text>
    <rect x="144" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="159" y="60">3</text>
    <rect x="176" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="191" y="60">4</text>
    <rect x="208" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="223" y="60">5</text>
    <rect x="240" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="255" y="60">6</text>
  </g>
  <text x="290" y="60" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">S₁=21</text>

  <g font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <rect x="80" y="76" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="95" y="92">1</text>
    <rect x="112" y="76" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="127" y="92">1</text>
    <rect x="144" y="76" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="159" y="92">2</text>
    <rect x="176" y="76" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="191" y="92">2</text>
    <rect x="208" y="76" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="223" y="92">2</text>
    <rect x="240" y="76" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="255" y="92">2</text>
  </g>
  <text x="290" y="92" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">S₂=10</text>

  <!-- diff -->
  <rect x="360" y="60" width="170" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">diff = S₁ − S₂ = 11</text>
  <text x="445" y="94" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">需补满 11</text>

  <!-- divider -->
  <path d="M 40 116 L 520 116" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Row 2: gains pool ============ -->
  <text x="40" y="136" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">裕量池（降序）</text>

  <g font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <rect x="80" y="146" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="97" y="164">5</text>
    <rect x="116" y="146" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="133" y="164">5</text>
    <rect x="152" y="146" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="169" y="164">5</text>
    <rect x="188" y="146" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="205" y="164">4</text>
    <rect x="224" y="146" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="241" y="164">4</text>
    <rect x="260" y="146" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="277" y="164">4</text>
    <rect x="296" y="146" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="313" y="164">4</text>
    <rect x="332" y="146" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="349" y="164">3</text>
    <rect x="368" y="146" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="385" y="164">2</text>
    <rect x="404" y="146" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="421" y="164">1</text>
    <rect x="440" y="146" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="457" y="164">0</text>
  </g>
  <text x="490" y="164" font-size="10" fill="#888" filter="url(#rough2)">总和 34</text>

  <!-- divider -->
  <path d="M 40 188 L 520 188" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Row 3: greedy steps ============ -->
  <text x="40" y="208" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">贪心取</text>

  <!-- step 1 -->
  <rect x="80" y="218" width="34" height="26" fill="#b85450" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="97" y="236" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="130" y="236" font-size="10.5" fill="#b85450" filter="url(#rough2)">取 g=5 → diff=11−5=6</text>

  <!-- step 2 -->
  <rect x="80" y="254" width="34" height="26" fill="#b85450" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="97" y="272" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="130" y="272" font-size="10.5" fill="#b85450" filter="url(#rough2)">取 g=5 → diff=6−5=1</text>

  <!-- step 3 -->
  <rect x="80" y="290" width="34" height="26" fill="#b85450" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="97" y="308" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="130" y="308" font-size="10.5" fill="#b85450" filter="url(#rough2)">取 g=5 → diff=1−5=−4 ≤ 0 ✓</text>

  <!-- result box -->
  <rect x="80" y="334" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="358" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 次操作补满 diff=11 → 返回 3</text>

  <!-- ============ Right: bucket counting note ============ -->
  <rect x="400" y="218" width="140" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">桶计数法</text>
  <text x="470" y="256" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cnt[5]=3</text>
  <text x="470" y="272" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cnt[4]=4</text>
  <text x="470" y="288" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cnt[3]=1 …</text>
  <text x="470" y="308" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">g=5 时 need</text>
  <text x="470" y="322" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">=⌈11/5⌉=3</text>

  <!-- footer -->
  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">从最大裕量 g=5 开始，每次 ⌈diff/g⌉ 定该桶取多少，diff ≤ 0 即停</text>
</svg>
