<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：按工资分组 → 过滤独行侠 → 按工资排名编 team_id</text>

  <!-- ===== Left: Employees table ===== -->
  <text x="110" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Employees 表</text>
  <rect x="20" y="58" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="9" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="50" y="74">id</text>
    <text x="110" y="74">name</text>
    <text x="170" y="74">salary</text>
  </g>

  <rect x="20" y="82" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9" text-anchor="middle">
    <text x="50" y="97" fill="#333">2</text>
    <text x="110" y="97" fill="#333">Meir</text>
    <text x="170" y="97" fill="#4a7a3a" font-weight="bold">3000</text>
  </g>

  <rect x="20" y="104" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9" text-anchor="middle">
    <text x="50" y="119" fill="#333">3</text>
    <text x="110" y="119" fill="#333">Michael</text>
    <text x="170" y="119" fill="#4a7a3a" font-weight="bold">3000</text>
  </g>

  <rect x="20" y="126" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9" text-anchor="middle">
    <text x="50" y="141" fill="#333">7</text>
    <text x="110" y="141" fill="#333">Addilyn</text>
    <text x="170" y="141" fill="#4a7a3a" font-weight="bold">7400</text>
  </g>

  <rect x="20" y="148" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g font-size="9" text-anchor="middle">
    <text x="50" y="163" fill="#333">8</text>
    <text x="110" y="163" fill="#333">Juan</text>
    <text x="170" y="163" fill="#b85450" font-weight="bold">6100</text>
  </g>

  <rect x="20" y="170" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9" text-anchor="middle">
    <text x="50" y="185" fill="#333">9</text>
    <text x="110" y="185" fill="#333">Kannon</text>
    <text x="170" y="185" fill="#4a7a3a" font-weight="bold">7400</text>
  </g>

  <!-- ===== Arrow: GROUP BY salary ===== -->
  <path d="M200 126 L240 126" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="220" y="118" text-anchor="middle" font-size="8" fill="#446688">GROUP BY</text>
  <text x="220" y="138" text-anchor="middle" font-size="8" fill="#446688">salary</text>

  <!-- ===== Middle: Salary groups ===== -->
  <text x="340" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">按工资分组 + HAVING</text>

  <rect x="250" y="58" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="74" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">salary=3000, count=2</text>
  <text x="340" y="88" text-anchor="middle" font-size="8.5" fill="#4a7a3a">✓ ≥2 → 入选</text>

  <rect x="250" y="104" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="120" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">salary=6100, count=1</text>
  <text x="340" y="134" text-anchor="middle" font-size="8.5" fill="#b85450">✗ 独行 → 淘汰</text>

  <rect x="250" y="150" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="166" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">salary=7400, count=2</text>
  <text x="340" y="180" text-anchor="middle" font-size="8.5" fill="#4a7a3a">✓ ≥2 → 入选</text>

  <!-- ===== Arrow: ROW_NUMBER ===== -->
  <path d="M430 78 L470 78" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M430 170 L470 170" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="450" y="70" text-anchor="middle" font-size="8" fill="#d6a040">RANK</text>

  <!-- ===== Right: team_id assignment ===== -->
  <text x="560" y="52" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">team_id 编号</text>

  <rect x="470" y="58" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="545" y="74" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">team_id = 1</text>
  <text x="545" y="88" text-anchor="middle" font-size="8.5" fill="#333">工资 3000（最低）</text>

  <rect x="470" y="150" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="545" y="166" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">team_id = 2</text>
  <text x="545" y="180" text-anchor="middle" font-size="8.5" fill="#333">工资 7400（次低）</text>

  <!-- ===== Key insight box ===== -->
  <rect x="20" y="210" width="600" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="228" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键洞察</text>
  <text x="36" y="244" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">HAVING COUNT(1) &gt; 1</tspan> 一步淘汰独行侠（Juan 工资 6100 唯一，不参与分组也不参与排名）</text>
  <text x="36" y="258" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">ROW_NUMBER() OVER (ORDER BY salary)</tspan> 只对「入选工资」排名 → 最低工资得 team_id=1</text>
  <text x="36" y="272" font-size="9.5" fill="#333">• 排名时<tspan fill="#b85450" font-weight="bold">不考虑被淘汰的工资</tspan>：6100 被忽略，7400 直接得 team_id=2 而非 3</text>

  <!-- ===== SQL snippet ===== -->
  <rect x="20" y="296" width="600" height="44" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="34" y="314" font-size="8.5" fill="#446688" font-family="monospace">WITH S AS (SELECT salary FROM Employees GROUP BY salary HAVING COUNT(1)&gt;1),</text>
  <text x="34" y="328" font-size="8.5" fill="#446688" font-family="monospace">     T AS (SELECT salary, ROW_NUMBER() OVER (ORDER BY salary) AS team_id FROM S)</text>
  <text x="34" y="336" font-size="8.5" fill="#446688" font-family="monospace">SELECT e.*, t.team_id FROM Employees e JOIN T t ON e.salary=t.team_id ORDER BY team_id, employee_id;</text>

  <!-- ===== Footnote ===== -->
  <text x="320" y="356" text-anchor="middle" font-size="8.5" fill="#888">三阶段管道：① GROUP BY + HAVING 过滤 → ② ROW_NUMBER 排名 → ③ JOIN 回原表取详情</text>
  <text x="320" y="372" text-anchor="middle" font-size="8.5" fill="#888">Juan（salary=6100 唯一）被 HAVING 淘汰 → 不在 T 中 → JOIN 自然排除 → 不出现在输出里</text>
</svg>
