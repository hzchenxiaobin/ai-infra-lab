<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="580" fill="#fdfcf7"/>

  <text x="300" y="28" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">算法流程：单指针两段式跳步</text>
  <path d="M 160 38 Q 300 46 440 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- ===== Start ===== -->
  <g filter="url(#sk)">
    <rect x="150" y="56" width="180" height="38" rx="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="240" y="80" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">开始：curr = head</text>
  <path d="M 240 94 L 240 116" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Decision: curr == null ===== -->
  <g filter="url(#sk)">
    <path d="M 240 118 L 330 158 L 240 198 L 150 158 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="240" y="156" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold">curr == null ?</text>
  <text x="240" y="172" text-anchor="middle" font-size="11" fill="#888">(游标到尾)</text>

  <!-- Yes 分支 → return head -->
  <path d="M 330 158 L 410 158" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="356" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="410" y="139" width="150" height="38" rx="19" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="485" y="163" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return head</text>

  <!-- No 分支 ↓ -->
  <path d="M 240 198 L 240 222" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="252" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- ===== Process ① 保留段 ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="222" width="340" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="240" y="244" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold">① 保留段：for i = 1 → m−1</text>
  <text x="240" y="262" text-anchor="middle" font-size="11" fill="#444">curr.next == null ? return head : curr = curr.next</text>
  <text x="240" y="276" text-anchor="middle" font-size="10.5" fill="#888">curr 停在本段最后一个保留节点</text>
  <path d="M 240 284 L 240 306" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Process ② 删除段 ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="306" width="340" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="240" y="328" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold">② 删除段：temp = curr; for i = 1 → n</text>
  <text x="240" y="346" text-anchor="middle" font-size="11" fill="#444">temp.next == null ? break : temp = temp.next</text>
  <text x="240" y="360" text-anchor="middle" font-size="10.5" fill="#888">temp 停在本段最后一个删除节点</text>
  <path d="M 240 368 L 240 390" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Process ③ 重连 ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="390" width="340" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="240" y="412" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">③ 重连：curr.next = temp.next</text>
  <text x="240" y="428" text-anchor="middle" font-size="10.5" fill="#4a7a3a">一次跳过 n 个被删除节点</text>
  <path d="M 240 436 L 240 458" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Process ④ curr 前进 ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="458" width="340" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="240" y="485" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">④ curr = curr.next</text>

  <!-- ===== 回环箭头：从 ④ 回到 Decision ===== -->
  <path d="M 70 480 L 40 480 L 40 158 L 150 158" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="50" y="312" font-size="11" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 50 312)">下一周期</text>

  <!-- ===== 要点框 ===== -->
  <rect x="430" y="306" width="160" height="196" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" filter="url(#sk)"/>
  <text x="510" y="328" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">两段判空</text>
  <text x="442" y="350" font-size="10.5" fill="#444">保留段判</text>
  <text x="442" y="364" font-size="10.5" fill="#444">curr.next → 决定</text>
  <text x="442" y="378" font-size="10.5" fill="#444">curr 能否前进</text>
  <text x="442" y="402" font-size="10.5" fill="#444">删除段判</text>
  <text x="442" y="416" font-size="10.5" fill="#444">temp.next → 决定</text>
  <text x="442" y="430" font-size="10.5" fill="#444">temp 能否前进</text>
  <text x="442" y="454" font-size="10.5" fill="#d6a040" font-weight="bold">均在前进前</text>
  <text x="442" y="468" font-size="10.5" fill="#d6a040" font-weight="bold">判空，避免</text>
  <text x="442" y="482" font-size="10.5" fill="#d6a040" font-weight="bold">解引用 null</text>
</svg>
