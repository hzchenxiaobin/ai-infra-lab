<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例 3：嵌套数组逐位合并</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">b.c = [1,[2,7],5] ⊕ [6,[6],[9]]</text>

  <!-- Header row: idx -->
  <text x="40" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#rough2)">idx</text>
  <text x="130" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">obj1</text>
  <text x="250" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">obj2</text>
  <text x="380" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">判定</text>
  <text x="500" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">结果</text>
  <line x1="20" y1="100" x2="540" y2="100" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0 -->
  <text x="40" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">0</text>
  <rect x="100" y="110" width="60" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="110" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="380" y="127" text-anchor="middle" font-size="10" fill="#6a4a10" filter="url(#rough2)">原始∨原始</text>
  <rect x="470" y="110" width="60" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="500" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a3030" filter="url(#rough2)">6</text>

  <!-- Row 1 -->
  <text x="40" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">1</text>
  <rect x="90" y="158" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,7]</text>
  <rect x="220" y="158" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[6]</text>
  <text x="380" y="177" text-anchor="middle" font-size="10" fill="#6a4a10" filter="url(#rough2)">数组∨数组→递归</text>
  <rect x="455" y="158" width="90" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a3030" filter="url(#rough2)">[6,7]</text>

  <!-- Row 1 sub-detail -->
  <rect x="430" y="200" width="120" height="44" rx="5" fill="#fff" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="490" y="216" text-anchor="middle" font-size="9" fill="#7a3030" filter="url(#rough2)">内层: [2,7]⊕[6]</text>
  <text x="490" y="230" text-anchor="middle" font-size="9" fill="#7a3030" filter="url(#rough2)">i0:2∨6→6, i1:单7→7</text>
  <path d="M500 188 L500 200" stroke="#b85450" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2 -->
  <text x="40" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">2</text>
  <rect x="100" y="256" width="60" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="220" y="256" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[9]</text>
  <text x="380" y="273" text-anchor="middle" font-size="10" fill="#6a4a10" filter="url(#rough2)">原始∨数组→obj2</text>
  <rect x="470" y="256" width="60" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a3030" filter="url(#rough2)">[9]</text>

  <line x1="20" y1="298" x2="540" y2="298" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Result assembly -->
  <text x="40" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">b.c</text>
  <text x="170" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">=</text>
  <rect x="100" y="312" width="60" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a3030" filter="url(#rough2)">6</text>
  <text x="175" y="331" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">,</text>
  <rect x="190" y="312" width="90" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="235" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a3030" filter="url(#rough2)">[6,7]</text>
  <text x="290" y="331" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">,</text>
  <rect x="305" y="312" width="60" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="335" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a3030" filter="url(#rough2)">[9]</text>
  <path d="M230 348 L230 366" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="372" width="160" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a4a10" filter="url(#rough2)">[6, [6,7], [9]]</text>

  <text x="280" y="426" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">b = {c:[6,[6,7],[9]], d:2(obj1单), e:3(obj2单)}　a:1∨1→1</text>
</svg>
