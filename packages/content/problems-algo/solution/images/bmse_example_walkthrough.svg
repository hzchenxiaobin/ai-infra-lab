<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- ===== Example 1 ===== -->
  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例 1：s="1010" → target="0110" （双方都含 1 → true）</text>

  <!-- State A: 1010, boxes at x=35,68,101,134 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="35" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="50" y="83" text-anchor="middle" fill="#333">1</text>
    <rect x="68" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="83" y="83" text-anchor="middle" fill="#333">0</text>
    <rect x="101" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="116" y="83" text-anchor="middle" fill="#333">1</text>
    <rect x="134" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="149" y="83" text-anchor="middle" fill="#333">0</text>
    <text x="100" y="58" text-anchor="middle" font-size="11" fill="#888">s</text>
  </g>

  <!-- arrow A->B with label -->
  <line x1="172" y1="77" x2="208" y2="77" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="190" y="68" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i=2,j=0</text>
  <text x="190" y="93" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(1,1)→(1,0)</text>

  <!-- State B: 0010 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="210" y="62" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="225" y="83" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <rect x="243" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="258" y="83" text-anchor="middle" fill="#333">0</text>
    <rect x="276" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="291" y="83" text-anchor="middle" fill="#333">1</text>
    <rect x="309" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="324" y="83" text-anchor="middle" fill="#333">0</text>
  </g>

  <!-- arrow B->C -->
  <line x1="347" y1="77" x2="383" y2="77" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="365" y="68" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i=2,j=1</text>
  <text x="365" y="93" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(1,0)→(1,1)</text>

  <!-- State C: 0110 = target -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="385" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="400" y="83" text-anchor="middle" fill="#333">0</text>
    <rect x="418" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="433" y="83" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="451" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="466" y="83" text-anchor="middle" fill="#333">1</text>
    <rect x="484" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="499" y="83" text-anchor="middle" fill="#333">0</text>
    <text x="499" y="58" text-anchor="middle" font-size="11" fill="#888">= target</text>
  </g>
  <text x="499" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 相等</text>

  <text x="280" y="135" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">先传播 1（绿）把全串变 1，再用 (1,1)→(1,0) 选位置灭 1（红），即可拼出任意「含 1」的 target</text>

  <!-- divider -->
  <line x1="40" y1="160" x2="520" y2="160" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="280" y="192" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#rough2)">示例 2：s="11" → target="00" （s 含 1 而 target 全 0 → false）</text>

  <!-- s = 11 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="150" y="220" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="165" y="241" text-anchor="middle" fill="#333">1</text>
    <rect x="183" y="220" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="198" y="241" text-anchor="middle" fill="#333">1</text>
    <text x="181" y="216" text-anchor="middle" font-size="11" fill="#888">s（cnt=2）</text>
  </g>

  <!-- vs -->
  <text x="280" y="241" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- target = 00 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="320" y="220" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="335" y="241" text-anchor="middle" fill="#333">0</text>
    <rect x="353" y="220" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="368" y="241" text-anchor="middle" fill="#333">0</text>
    <text x="351" y="216" text-anchor="middle" font-size="11" fill="#888">target（cnt=0）</text>
  </g>

  <!-- count oscillation -->
  <text x="280" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">对 s 只能反复做 (1,1)→(1,0)：1 的个数在 1 与 2 之间来回跳</text>

  <!-- cycle: cnt 2 <-> 1 -->
  <g filter="url(#rough2)" font-size="14">
    <ellipse cx="150" cy="340" rx="46" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="150" y="346" text-anchor="middle" fill="#333">含 1 个数 = 2</text>
    <ellipse cx="410" cy="340" rx="46" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="410" y="346" text-anchor="middle" fill="#333">含 1 个数 = 1</text>
    <!-- forward arrow -->
    <path d="M196,332 Q280,300 364,332" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)"/>
    <text x="280" y="306" text-anchor="middle" font-size="11" fill="#446688">(1,1)→(1,0) 灭 1</text>
    <!-- back arrow -->
    <path d="M364,352 Q280,384 196,352" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)"/>
    <text x="280" y="386" text-anchor="middle" font-size="11" fill="#446688">(0,1)→(1,1) 生 1</text>
  </g>

  <!-- unreachable 0 -->
  <g filter="url(#rough2)" font-size="14">
    <ellipse cx="280" cy="440" rx="70" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="280" y="446" text-anchor="middle" fill="#333">含 1 个数 = 0</text>
    <line x1="220" y1="420" x2="340" y2="460" stroke="#b85450" stroke-width="2.5"/>
    <line x1="340" y1="420" x2="220" y2="460" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="280" y="482" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">永远到不了 0（灭 1 必须剩一个）→ false</text>
</svg>
