<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：键盘 = 3 行左对齐网格，总距离 = 相邻键曼哈顿距离累加</text>
  <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">26 个键的坐标 (r, c) 永远固定 —— 预处理成坐标表 pos，全程复用</text>

  <!-- row labels -->
  <text x="48" y="64" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=0</text>
  <text x="48" y="102" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=1</text>
  <text x="48" y="140" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=2</text>

  <!-- row 0: qwertyuiop -->
  <rect x="56" y="48" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="65" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">q</text>
  <rect x="96" y="48" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="65" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">w</text>
  <rect x="136" y="48" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="154" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="154" y="71" text-anchor="middle" font-size="7" fill="#d6a040" filter="url(#rough2)">(0,2)</text>
  <rect x="176" y="48" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="65" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">r</text>
  <rect x="216" y="48" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="234" y="65" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">t</text>
  <rect x="256" y="48" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="274" y="65" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">y</text>
  <rect x="296" y="48" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="314" y="65" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">u</text>
  <rect x="336" y="48" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="354" y="65" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">i</text>
  <rect x="376" y="48" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="394" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="394" y="71" text-anchor="middle" font-size="7" fill="#d6a040" filter="url(#rough2)">(0,8)</text>
  <rect x="416" y="48" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="434" y="65" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">p</text>

  <!-- row 1: asdfghjkl + blank -->
  <rect x="56" y="86" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="74" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="74" y="109" text-anchor="middle" font-size="7" fill="#b85450" filter="url(#rough2)">(1,0)</text>
  <rect x="96" y="86" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="102" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">s</text>
  <rect x="136" y="86" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="154" y="102" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">d</text>
  <rect x="176" y="86" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="102" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">f</text>
  <rect x="216" y="86" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="234" y="102" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">g</text>
  <rect x="256" y="86" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="274" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="274" y="109" text-anchor="middle" font-size="7" fill="#d6a040" filter="url(#rough2)">(1,5)</text>
  <rect x="296" y="86" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="314" y="102" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">j</text>
  <rect x="336" y="86" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="354" y="102" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">k</text>
  <rect x="376" y="86" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="394" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="394" y="109" text-anchor="middle" font-size="7" fill="#d6a040" filter="url(#rough2)">(1,8)</text>
  <rect x="416" y="86" width="36" height="26" rx="4" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- row 2: zxcvbnm + blanks -->
  <rect x="56" y="124" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="140" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">z</text>
  <rect x="96" y="124" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="140" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">x</text>
  <rect x="136" y="124" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="154" y="140" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">c</text>
  <rect x="176" y="124" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="140" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">v</text>
  <rect x="216" y="124" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="234" y="140" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">b</text>
  <rect x="256" y="124" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="274" y="140" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">n</text>
  <rect x="296" y="124" width="36" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="314" y="140" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">m</text>
  <rect x="336" y="124" width="36" height="26" rx="4" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="376" y="124" width="36" height="26" rx="4" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="416" y="124" width="36" height="26" rx="4" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- col labels -->
  <text x="74" y="162" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">c=0</text>
  <text x="154" y="162" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">c=2</text>
  <text x="274" y="162" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">c=5</text>
  <text x="394" y="162" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">c=8</text>
  <text x="434" y="162" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">c=9</text>

  <!-- order badges -->
  <circle cx="92" cy="86" r="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="92" y="89" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold" filter="url(#rough2)">起</text>
  <circle cx="292" cy="86" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <text x="292" y="89" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="172" cy="48" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <text x="172" y="51" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="412" cy="86" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <text x="412" y="89" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="412" cy="48" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <text x="412" y="51" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="452" y="100" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">l 按 2 次</text>
  <text x="452" y="110" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">(3→4 步距 0)</text>

  <!-- movement strip -->
  <text x="260" y="188" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1：s = "hello" 的指尖旅程</text>

  <rect x="50" y="198" width="40" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="70" y="238" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">(1,0)</text>

  <rect x="126" y="198" width="40" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="146" y="238" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">(1,5)</text>

  <rect x="202" y="198" width="40" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="222" y="238" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">(0,2)</text>

  <rect x="278" y="198" width="40" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="298" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="298" y="238" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">(1,8)</text>

  <rect x="354" y="198" width="40" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="374" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="374" y="238" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">(1,8)</text>

  <rect x="430" y="198" width="40" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="450" y="238" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">(0,8)</text>

  <path d="M 92 210 L 124 210" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="108" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <path d="M 168 210 L 200 210" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="184" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 244 210 L 276 210" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <path d="M 320 210 L 352 210" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="336" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 396 210 L 428 210" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="412" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="260" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">总距离 = 5 + 4 + 7 + 0 + 1 = 17</text>

  <!-- bottom notes -->
  <rect x="36" y="272" width="448" height="116" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">① 键盘固定 26 键 → 预处理坐标表 pos[c] = (row, col)，O(26) 建一次全程复用</text>
  <text x="260" y="314" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">② 路径被输入顺序强制：a → s₀ → s₁ → … ，总距离 = Σ 相邻键曼哈顿距离</text>
  <text x="260" y="334" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">③ 单指无决策空间（不能挑顺序）→ 纯模拟；对照 1320 双指版才有「分配 → DP」</text>
  <text x="260" y="354" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">④ 单步最远 p(0,9) ↔ z(2,0) = 2+9 = 11，n ≤ 10⁴ ⇒ ans ≤ 1.1×10⁵，int 足够</text>
  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：s = "a" → 手指已在 a 上，答案 0</text>
</svg>
