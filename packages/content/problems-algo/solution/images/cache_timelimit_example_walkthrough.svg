<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)" font-weight="bold">示例2 演算：覆盖写入 + 定时器到期</text>

  <!-- 表格框架 -->
  <rect x="30" y="44" width="510" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">
    <text x="65" y="65" text-anchor="middle">time</text>
    <text x="180" y="65" text-anchor="middle">action</text>
    <text x="295" y="65" text-anchor="middle">return</text>
    <text x="435" y="65" text-anchor="middle">缓存状态</text>
  </g>

  <!-- 分隔线 -->
  <g stroke="#cccccc" stroke-width="1" filter="url(#rough2)">
    <line x1="100" y1="44" x2="100" y2="350"/>
    <line x1="260" y1="44" x2="260" y2="350"/>
    <line x1="330" y1="44" x2="330" y2="350"/>
  </g>

  <!-- 行1 t=0 set(1,42,50) false -->
  <rect x="30" y="78" width="510" height="36" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="65" y="100" text-anchor="middle">0</text>
    <text x="110" y="100">set(1, 42, 50)</text>
    <text x="295" y="100" text-anchor="middle" fill="#d6a040" font-weight="bold">false</text>
    <text x="340" y="100">1 → 42, ⏰@50</text>
  </g>

  <!-- 行2 t=40 set(1,50,100) true 覆盖 -->
  <rect x="30" y="114" width="510" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="65" y="136" text-anchor="middle">40</text>
    <text x="110" y="136">set(1, 50, 100)</text>
    <text x="295" y="136" text-anchor="middle" fill="#4a7a3a" font-weight="bold">true</text>
    <text x="340" y="136">1 → 50, ⏰@140（清旧⏰）</text>
  </g>

  <!-- 行3 t=50 get 50 -->
  <rect x="30" y="150" width="510" height="36" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="65" y="172" text-anchor="middle">50</text>
    <text x="110" y="172">get(1)</text>
    <text x="295" y="172" text-anchor="middle" fill="#446688" font-weight="bold">50</text>
    <text x="340" y="172" fill="#888888">（未过期，新⏰@140）</text>
  </g>

  <!-- 行4 t=120 get 50 -->
  <rect x="30" y="186" width="510" height="36" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="65" y="208" text-anchor="middle">120</text>
    <text x="110" y="208">get(1)</text>
    <text x="295" y="208" text-anchor="middle" fill="#446688" font-weight="bold">50</text>
    <text x="340" y="208" fill="#888888">（未过期）</text>
  </g>

  <!-- 行5 t=140 定时器到期 -->
  <rect x="30" y="222" width="510" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="65" y="244" text-anchor="middle">140</text>
    <text x="110" y="244" fill="#b85450">⏰ 定时器触发</text>
    <text x="295" y="244" text-anchor="middle" fill="#b85450">—</text>
    <text x="340" y="244" fill="#b85450">∅ delete(1)</text>
  </g>

  <!-- 行6 t=200 get -1 -->
  <rect x="30" y="258" width="510" height="36" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="65" y="280" text-anchor="middle">200</text>
    <text x="110" y="280">get(1)</text>
    <text x="295" y="280" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
    <text x="340" y="280" fill="#888888">∅（空）</text>
  </g>

  <!-- 行7 t=250 count 0 -->
  <rect x="30" y="294" width="510" height="36" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="65" y="316" text-anchor="middle">250</text>
    <text x="110" y="316">count()</text>
    <text x="295" y="316" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
    <text x="340" y="316" fill="#888888">∅（空）</text>
  </g>

  <!-- 结论框 -->
  <rect x="30" y="346" width="510" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="368" font-size="12" fill="#333" filter="url(#rough2)">关键：t=40 覆盖时清掉旧⏰(原@50)，改挂新⏰(@140)；</text>
  <text x="46" y="382" font-size="12" fill="#333" filter="url(#rough2)">　故 t=50 时旧⏰已失效不会误删，get 仍命中新值 50。</text>
</svg>
