<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：+ 触发 valueOf 求和，String() 触发 toString 拼串</text>

  <!-- table header -->
  <rect x="20" y="48" width="560" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例</text>
  <text x="280" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">构造 + 操作</text>
  <text x="500" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输出</text>
  <line x1="180" y1="48" x2="180" y2="88" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="410" y1="48" x2="410" y2="88" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Example 1 -->
  <rect x="20" y="92" width="560" height="62" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">示例 1</text>
  <text x="100" y="134" text-anchor="middle" font-size="11" fill="#888">Add</text>
  <text x="280" y="118" text-anchor="middle" font-size="11" fill="#333">obj1 = AW([1,2]);  obj2 = AW([3,4])</text>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a">obj1 + obj2 → valueOf×2 → 1+2+3+4</text>
  <text x="500" y="128" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">10</text>
  <line x1="180" y1="92" x2="180" y2="154" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="92" x2="410" y2="154" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 2 -->
  <rect x="20" y="160" width="560" height="62" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">示例 2</text>
  <text x="100" y="202" text-anchor="middle" font-size="11" fill="#888">String</text>
  <text x="280" y="186" text-anchor="middle" font-size="11" fill="#333">obj = AW([23,98,42,70])</text>
  <text x="280" y="204" text-anchor="middle" font-size="11" fill="#d6a040">String(obj) → toString → "[23,98,42,70]"</text>
  <text x="500" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"[23,98,</text>
  <text x="500" y="210" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">42,70]"</text>
  <line x1="180" y1="160" x2="180" y2="222" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="160" x2="410" y2="222" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 3 -->
  <rect x="20" y="228" width="560" height="62" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">示例 3</text>
  <text x="100" y="270" text-anchor="middle" font-size="11" fill="#888">Add（空）</text>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#333">obj1 = AW([]);  obj2 = AW([])</text>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a">空数组 sum=0，0+0</text>
  <text x="500" y="264" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <line x1="180" y1="228" x2="180" y2="290" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="228" x2="410" y2="290" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- note -->
  <text x="300" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a">↑ reduce 初值取 0，空数组自然得 0；join 对空数组返回空串 → "[]"</text>

  <!-- constraint -->
  <rect x="20" y="324" width="560" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="346" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">约束：0 ≤ nums.length ≤ 1000，0 ≤ nums[i] ≤ 1000</text>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#888">sum 最大 1000×1000=10⁶，远在 Number 安全整数内，无溢出顾虑</text>

  <text x="300" y="388" text-anchor="middle" font-size="11" fill="#888">💡 三例分别覆盖：双实例相加、单实例转串、边界空数组——钩子逻辑对此全统一</text>
</svg>
