<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针原地压缩</text>

  <!-- Start oval -->
  <rect x="210" y="44" width="120" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">read=0, write=0</text>

  <path d="M270 78 L270 96" stroke="#888" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Diamond: read < n ? -->
  <polygon points="270,100 350,138 270,176 190,138" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">read &lt; n ?</text>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="#888">还有字符待读</text>

  <!-- No branch -> return -->
  <path d="M350 138 L400 138 L400 200" stroke="#888" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="372" y="132" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="338" y="200" width="124" height="34" rx="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 write</text>

  <!-- Yes branch down -->
  <path d="M270 176 L270 194" stroke="#888" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="278" y="188" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Box: c = chars[read]; count = 0 -->
  <rect x="170" y="196" width="200" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">c = chars[read]，count = 0</text>
  <text x="270" y="232" text-anchor="middle" font-size="10.5" fill="#446688">记下本段字符</text>

  <path d="M270 240 L270 258" stroke="#888" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Box: while read<n and chars[read]==c: read++; count++ -->
  <rect x="120" y="260" width="300" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="281" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">while read&lt;n 且 chars[read]==c：</text>
  <text x="270" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">read += 1，count += 1   ← 吞掉整段</text>

  <path d="M270 308 L270 326" stroke="#888" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Box: chars[write++] = c -->
  <rect x="170" y="328" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="353" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">chars[write++] = c</text>

  <path d="M270 368 L270 386" stroke="#888" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Diamond: count > 1 ? -->
  <polygon points="270,390 340,422 270,454 200,422" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="418" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">count &gt; 1 ?</text>
  <text x="270" y="434" text-anchor="middle" font-size="10" fill="#888">多位段长</text>

  <!-- Yes branch right: write digits -->
  <path d="M340 422 L470 422 L470 348 L370 348" stroke="#888" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="350" y="416" font-size="10.5" fill="#d6a040" font-weight="bold">是</text>
  <rect x="370" y="300" width="160" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">逐位写 count 数字</text>
  <text x="450" y="336" text-anchor="middle" font-size="10.5" fill="#d6a040">每位 chars[write++] = d</text>

  <!-- No branch left: skip (back to top loop) -->
  <path d="M200 422 L70 422 L70 138 L190 138" stroke="#888" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="190" y="416" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="80" y="278" font-size="10.5" fill="#888">count=1，跳过数字</text>

  <!-- loop back from digits box to top diamond -->
  <path d="M450 300 L450 138 L350 138" stroke="#888" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="456" y="216" font-size="10" fill="#888">回顶部循环</text>
</svg>
