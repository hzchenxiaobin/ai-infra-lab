<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：HOUR(call_time) 按钟点分桶，跨天同钟点归同一桶</text>

  <rect x="30" y="46" width="115" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-11 21:28</text>

  <rect x="155" y="46" width="115" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-17 22:04</text>

  <rect x="280" y="46" width="115" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-24 22:46</text>

  <rect x="405" y="46" width="115" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="462" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-24 22:57</text>

  <text x="280" y="96" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">Houston 的 4 通电话（call_time 含日期）</text>

  <path d="M 87 80 Q 110 140 158 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 212 80 Q 280 140 370 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 337 80 Q 360 140 395 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462 80 Q 440 140 420 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="200" width="150" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">21 时</text>
  <text x="165" y="248" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cnt = 1</text>

  <rect x="320" y="200" width="150" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="395" y="224" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">22 时</text>
  <text x="395" y="242" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cnt = 3</text>
  <text x="395" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">★ 峰值小时</text>

  <rect x="40" y="292" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">日期不参与分桶：HOUR() 只取钟点（hour-of-day）</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">→ 8/17 的 22:04 与 8/24 的 22:46、22:57 同归「22 时」桶</text>
</svg>
