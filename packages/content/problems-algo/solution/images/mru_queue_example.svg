<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：MRUQueue(8) 的 4 次 fetch</text>

  <!-- column headers -->
  <text x="44" y="48" font-size="10" fill="#aaa" filter="url(#rough2)">操作</text>
  <text x="284" y="48" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">队列状态（绿 = 本次移到队尾）</text>
  <text x="512" y="48" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">返回</text>

  <!-- Row 0: initial -->
  <text x="44" y="76" font-size="11" fill="#888" filter="url(#rough2)">初始</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="150" y="60" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="80" filter="url(#rough2)">1</text>
    <rect x="186" y="60" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="204" y="80" filter="url(#rough2)">2</text>
    <rect x="222" y="60" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="80" filter="url(#rough2)">3</text>
    <rect x="258" y="60" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="276" y="80" filter="url(#rough2)">4</text>
    <rect x="294" y="60" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="312" y="80" filter="url(#rough2)">5</text>
    <rect x="330" y="60" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="348" y="80" filter="url(#rough2)">6</text>
    <rect x="366" y="60" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="384" y="80" filter="url(#rough2)">7</text>
    <rect x="402" y="60" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="420" y="80" filter="url(#rough2)">8</text>
  </g>
  <text x="512" y="80" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">—</text>

  <!-- Row 1: fetch(3) -> 3 -->
  <text x="44" y="116" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">fetch(3)</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="150" y="100" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="120" filter="url(#rough2)">1</text>
    <rect x="186" y="100" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="204" y="120" filter="url(#rough2)">2</text>
    <rect x="222" y="100" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="120" filter="url(#rough2)">4</text>
    <rect x="258" y="100" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="276" y="120" filter="url(#rough2)">5</text>
    <rect x="294" y="100" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="312" y="120" filter="url(#rough2)">6</text>
    <rect x="330" y="100" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="348" y="120" filter="url(#rough2)">7</text>
    <rect x="366" y="100" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="384" y="120" filter="url(#rough2)">8</text>
    <rect x="402" y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="420" y="120" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  </g>
  <text x="512" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- Row 2: fetch(5) -> 6 -->
  <text x="44" y="156" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">fetch(5)</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="150" y="140" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="160" filter="url(#rough2)">1</text>
    <rect x="186" y="140" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="204" y="160" filter="url(#rough2)">2</text>
    <rect x="222" y="140" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="160" filter="url(#rough2)">4</text>
    <rect x="258" y="140" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="276" y="160" filter="url(#rough2)">5</text>
    <rect x="294" y="140" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="312" y="160" filter="url(#rough2)">7</text>
    <rect x="330" y="140" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="348" y="160" filter="url(#rough2)">8</text>
    <rect x="366" y="140" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="384" y="160" filter="url(#rough2)">3</text>
    <rect x="402" y="140" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="420" y="160" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  </g>
  <text x="512" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Row 3: fetch(2) -> 2 -->
  <text x="44" y="196" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">fetch(2)</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="150" y="180" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="200" filter="url(#rough2)">1</text>
    <rect x="186" y="180" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="204" y="200" filter="url(#rough2)">4</text>
    <rect x="222" y="180" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="200" filter="url(#rough2)">5</text>
    <rect x="258" y="180" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="276" y="200" filter="url(#rough2)">7</text>
    <rect x="294" y="180" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="312" y="200" filter="url(#rough2)">8</text>
    <rect x="330" y="180" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="348" y="200" filter="url(#rough2)">3</text>
    <rect x="366" y="180" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="384" y="200" filter="url(#rough2)">6</text>
    <rect x="402" y="180" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="420" y="200" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  </g>
  <text x="512" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 4: fetch(8) -> 2 (already at end) -->
  <text x="44" y="236" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">fetch(8)</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="150" y="220" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="240" filter="url(#rough2)">1</text>
    <rect x="186" y="220" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="204" y="240" filter="url(#rough2)">4</text>
    <rect x="222" y="220" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="240" filter="url(#rough2)">5</text>
    <rect x="258" y="220" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="276" y="240" filter="url(#rough2)">7</text>
    <rect x="294" y="220" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="312" y="240" filter="url(#rough2)">8</text>
    <rect x="330" y="220" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="348" y="240" filter="url(#rough2)">3</text>
    <rect x="366" y="220" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="384" y="240" filter="url(#rough2)">6</text>
    <rect x="402" y="220" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="420" y="240" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  </g>
  <text x="512" y="240" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="448" y="258" font-size="9.5" fill="#aaa" filter="url(#rough2)">已在队尾</text>

  <!-- dashed separator -->
  <path d="M 40 268 L 520 268" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- summary -->
  <rect x="100" y="280" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输出序列：[null, 3, 6, 2, 2]</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">fetch(8) 时第 8 个已在队尾 → 原地返回</text>
</svg>
