<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐轮转模拟，跟踪累计利润的最大值</text>

  <!-- ===== Step 1: early prune ===== -->
  <rect x="30" y="48" width="190" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="125" y="68" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">① 早期剪枝</text>
  <text x="125" y="84" text-anchor="middle" font-size="10" fill="#555">若 4 × boardingCost ≤ runningCost</text>
  <text x="125" y="98" text-anchor="middle" font-size="10" fill="#555">→ 每轮必亏，返回 −1</text>

  <path d="M 220 76 L 250 76" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: init ===== -->
  <rect x="250" y="48" width="170" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="335" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② 初始化</text>
  <text x="335" y="84" text-anchor="middle" font-size="10" fill="#555">i = 0, queue = 0</text>
  <text x="335" y="98" text-anchor="middle" font-size="10" fill="#555">maxProfit = 0, bestK = 0</text>

  <path d="M 420 76 L 450 76" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: loop condition ===== -->
  <polygon points="510,50 560,76 510,102 460,76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="73" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i &lt; n 或</text>
  <text x="510" y="86" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">queue &gt; 0 ?</text>

  <!-- No -> go to return (bottom right) -->
  <path d="M 560 76 L 548 76 L 548 360" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="200" font-size="10" fill="#888">否</text>

  <!-- Yes -> down to step 4 -->
  <path d="M 510 102 L 510 130" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="518" y="120" font-size="10" fill="#888">是</text>

  <!-- ===== Step 4: arrivals + board ===== -->
  <rect x="80" y="132" width="400" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 第 i 次轮转</text>
  <text x="280" y="169" text-anchor="middle" font-size="10" fill="#555">若 i &lt; n：queue += customers[i]</text>
  <text x="280" y="184" text-anchor="middle" font-size="10" fill="#555">board = min(4, queue)；queue -= board；i += 1</text>

  <path d="M 280 192 L 280 210" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: accumulate profit ===== -->
  <rect x="80" y="212" width="400" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">④ 累计利润</text>
  <text x="280" y="250" text-anchor="middle" font-size="10" fill="#555">profit += boardingCost × board − runningCost</text>

  <path d="M 280 260 L 280 278" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 6: update max (decision) ===== -->
  <polygon points="280,280 410,310 280,340 150,310" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">profit &gt; maxProfit ?</text>
  <text x="280" y="320" text-anchor="middle" font-size="9" fill="#888">（严格大于，保证取最小轮次）</text>

  <!-- Yes -> update box (left) -->
  <path d="M 150 310 L 110 310" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="304" font-size="10" fill="#888">是</text>
  <rect x="30" y="290" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="307" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">更新</text>
  <text x="70" y="321" text-anchor="middle" font-size="9" fill="#555">maxProfit, bestK</text>

  <!-- No / loop back: from decision right side back up to loop condition -->
  <path d="M 410 310 L 470 310 L 470 76 L 460 76" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="304" font-size="10" fill="#888">否</text>
  <text x="478" y="200" font-size="9" fill="#888">回到循环判定</text>

  <!-- ===== Step 7: return ===== -->
  <rect x="380" y="340" width="170" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ 返回结果</text>
  <text x="465" y="376" text-anchor="middle" font-size="10" fill="#555">maxProfit &gt; 0 ? bestK : −1</text>
  <text x="465" y="390" text-anchor="middle" font-size="9" fill="#888">bestK 即最小轮转次数</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="340" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="120" y="360" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">停止后剩余轮转免费</text>
  <text x="120" y="376" text-anchor="middle" font-size="9" fill="#555">（让游客安全着陆）</text>
  <text x="120" y="389" text-anchor="middle" font-size="9" fill="#555">故利润 = 停止时累计值</text>
</svg>
