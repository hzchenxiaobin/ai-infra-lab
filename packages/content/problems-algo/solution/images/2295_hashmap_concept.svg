<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：哈希表维护「值→下标」，单次替换 O(1)</text>

  <!-- ===== LEFT: brute force scan ===== -->
  <text x="120" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">暴力：每次操作线性扫描找值</text>

  <!-- array nums row -->
  <text x="40" y="92" font-size="9.5" fill="#888">nums:</text>
  <rect x="68" y="78" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="89" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="110" y="78" width="42" height="30" fill="#fff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="131" y="98" text-anchor="middle" font-size="12" fill="#666">2</text>
  <rect x="152" y="78" width="42" height="30" fill="#fff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="173" y="98" text-anchor="middle" font-size="12" fill="#666">4</text>
  <rect x="194" y="78" width="42" height="30" fill="#fff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="98" text-anchor="middle" font-size="12" fill="#666">6</text>

  <!-- scan arrow across -->
  <path d="M 70 124 L 70 118 L 234 118 L 234 124" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="152" y="114" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">逐个比较找 old=1 ...</text>

  <text x="120" y="142" text-anchor="middle" font-size="10" fill="#b85450">每次操作 O(n)，共 m 次 → O(n×m)</text>
  <rect x="48" y="150" width="144" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="120" y="166" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">n,m ≤ 10⁵ → 10¹⁰ 超时</text>

  <!-- ===== RIGHT: hash map O(1) ===== -->
  <text x="400" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">优化：哈希表 值→下标，O(1) 定位</text>

  <!-- hash map box -->
  <text x="300" y="92" font-size="9.5" fill="#888">map:</text>
  <rect x="318" y="78" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="332" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="360" y="98" text-anchor="middle" font-size="11" fill="#888">→</text>
  <text x="384" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <rect x="318" y="110" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="332" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="360" y="130" text-anchor="middle" font-size="11" fill="#888">→</text>
  <text x="384" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="318" y="142" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="332" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="360" y="162" text-anchor="middle" font-size="11" fill="#888">→</text>
  <text x="384" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="318" y="174" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="332" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="360" y="194" text-anchor="middle" font-size="11" fill="#888">→</text>
  <text x="384" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- op arrow: look up old -->
  <rect x="430" y="78" width="92" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="476" y="98" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">op [1,3]</text>
  <path d="M 402 93 L 428 93" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="415" y="86" text-anchor="middle" font-size="8.5" fill="#4a7a3a">map[1]</text>
  <text x="415" y="108" text-anchor="middle" font-size="8.5" fill="#4a7a3a">=0 O(1)</text>

  <!-- nums on right showing update -->
  <text x="430" y="138" font-size="9.5" fill="#888">nums[0]←3</text>
  <path d="M 476 142 L 476 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="170" font-size="9.5" fill="#888">erase 1, add 3→0</text>

  <rect x="430" y="176" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="476" y="192" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">单次操作 O(1)</text>

  <!-- ===== Bottom: key insight ===== -->
  <rect x="30" y="232" width="500" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：值→下标 反向索引，让「找值」从 O(n) 降到 O(1)</text>
  <text x="280" y="282" text-anchor="middle" font-size="10.5" fill="#555">① 初始：遍历 nums 一遍，建 map{值: 下标}</text>
  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#555">② 每个操作 [old, new]：idx = map[old]，再 nums[idx] = new</text>
  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#555">③ 维护 map：删 old、加 new→idx（保证 new 当前不在数组中，无冲突）</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">值可能被删后再被加回（链式替换），map 天然处理</text>
  <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">总复杂度 O(n + m)，空间 O(n)</text>
</svg>
