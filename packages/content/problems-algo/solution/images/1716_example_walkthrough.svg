<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n = 20 → 96</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w = 20 ÷ 7 = 2 个完整周，r = 20 mod 7 = 6 个剩余天</text>

  <!-- ===== Week 1 ===== -->
  <text x="44" y="76" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 周（完整）</text>
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="86" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="103" y="83" fill="#446688">1</text>
    <rect x="122" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="139" y="83" fill="#446688">2</text>
    <rect x="158" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="175" y="83" fill="#446688">3</text>
    <rect x="194" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="211" y="83" fill="#446688">4</text>
    <rect x="230" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="247" y="83" fill="#446688">5</text>
    <rect x="266" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="283" y="83" fill="#446688">6</text>
    <rect x="302" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="319" y="83" fill="#446688">7</text>
  </g>
  <text x="348" y="80" font-size="10" fill="#888" filter="url(#rough2)">S₁ = 7×1+21 =</text>
  <g filter="url(#rough2)">
    <rect x="430" y="66" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12"/>
    <text x="450" y="83" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">28</text>
  </g>

  <!-- ===== Week 2 ===== -->
  <text x="44" y="118" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 周（完整）</text>
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="86" y="106" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="103" y="125" fill="#446688">2</text>
    <rect x="122" y="106" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="139" y="125" fill="#446688">3</text>
    <rect x="158" y="106" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="175" y="125" fill="#446688">4</text>
    <rect x="194" y="106" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="211" y="125" fill="#446688">5</text>
    <rect x="230" y="106" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="247" y="125" fill="#446688">6</text>
    <rect x="266" y="106" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="283" y="125" fill="#446688">7</text>
    <rect x="302" y="106" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="319" y="125" fill="#446688">8</text>
  </g>
  <text x="348" y="122" font-size="10" fill="#888" filter="url(#rough2)">S₂ = 7×2+21 =</text>
  <g filter="url(#rough2)">
    <rect x="430" y="108" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12"/>
    <text x="450" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">35</text>
  </g>

  <!-- bracket + full weeks sum -->
  <path d="M 336 96 Q 340 96 340 100 L 340 132 Q 340 136 344 136" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 336 138 Q 340 138 340 134 L 340 102 Q 340 98 344 98" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 336 118 L 376 118" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="380" y="146" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="425" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">W_full = 63</text>
  </g>
  <text x="425" y="180" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">2×(28+35)/2</text>

  <!-- ===== Week 3 partial (6 days) ===== -->
  <text x="44" y="206" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 3 周（剩余 6 天）</text>
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="86" y="194" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="103" y="213" fill="#d6a040">3</text>
    <rect x="122" y="194" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="139" y="213" fill="#d6a040">4</text>
    <rect x="158" y="194" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="175" y="213" fill="#d6a040">5</text>
    <rect x="194" y="194" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="211" y="213" fill="#d6a040">6</text>
    <rect x="230" y="194" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="247" y="213" fill="#d6a040">7</text>
    <rect x="266" y="194" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="283" y="213" fill="#d6a040">8</text>
    <rect x="302" y="194" width="34" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="4"/>
    <text x="319" y="213" fill="#ccc">9</text>
  </g>
  <text x="348" y="210" font-size="9" fill="#888" filter="url(#rough2)">首项 w+1=3，r=6</text>
  <g filter="url(#rough2)">
    <rect x="430" y="196" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="12"/>
    <text x="450" y="213" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">33</text>
  </g>
  <text x="450" y="234" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">6×3 + 6×5/2</text>

  <!-- arrow up to W_rem -->
  <path d="M 450 196 L 450 176" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- day index labels -->
  <g filter="url(#rough2)" font-size="8" fill="#aaa" text-anchor="middle">
    <text x="103" y="236">1</text>
    <text x="139" y="236">2</text>
    <text x="175" y="236">3</text>
    <text x="211" y="236">4</text>
    <text x="247" y="236">5</text>
    <text x="283" y="236">6</text>
    <text x="319" y="236">7</text>
  </g>

  <!-- ===== Final sum ===== -->
  <path d="M 425 176 L 425 268 L 280 268 L 280 286" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 218 L 470 218 L 470 268 L 280 268" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="200" y="292" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="280" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">W = W_full + W_rem</text>
    <text x="280" y="328" text-anchor="middle" font-size="11" fill="#555">63 + 33 = ?</text>
  </g>

  <path d="M 280 340 L 280 358" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="220" y="364" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="20"/>
    <text x="280" y="390" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">96</text>
  </g>

  <!-- verification table -->
  <rect x="40" y="424" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="442" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">验算三个示例：</text>
  <text x="52" y="458" font-size="9" fill="#555" filter="url(#rough2)">n=4 → w=0,r=4：0 + 4×1+4×3/2 = 10 ✓   n=10 → w=1,r=3：28 + 3×2+3×2/2 = 37 ✓   n=20 → 63+33 = 96 ✓</text>
</svg>
