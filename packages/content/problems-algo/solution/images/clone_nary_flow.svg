<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DFS 克隆流程：建壳 → 递归孩子 → 接线返回</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888">前序位置建节点，后序位置填 children</text>

  <!-- 1. start: dfs(node) -->
  <ellipse cx="180" cy="80" rx="56" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="85" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">dfs(node)</text>

  <path d="M 180 102 L 180 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. diamond: node == null? -->
  <polygon points="180,130 250,170 180,210 110,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="167" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">node == null?</text>
  <text x="180" y="182" text-anchor="middle" font-size="10" fill="#888">空树</text>

  <!-- yes branch -> return null -->
  <path d="M 250 170 L 320 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="162" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <ellipse cx="380" cy="170" rx="52" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="175" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return null</text>

  <!-- no branch down -->
  <path d="M 180 210 L 180 236" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 3. rect: clone = new Node(node.val) -->
  <rect x="80" y="238" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="263" text-anchor="middle" font-size="12" fill="#335533" font-weight="bold">clone = new Node(node.val)</text>
  <text x="200" y="285" text-anchor="middle" font-size="9.5" fill="#888">前序：先建壳（值复制，children 暂空）</text>

  <path d="M 180 280 L 180 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. rect: for child in node.children -->
  <rect x="80" y="302" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="327" text-anchor="middle" font-size="12" fill="#335577" font-weight="bold">for child in node.children:</text>

  <path d="M 180 344 L 180 364" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. rect: append dfs(child) -->
  <rect x="60" y="366" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="391" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">clone.children.append(dfs(child))</text>

  <!-- loop back arrow from 5 up to 4 (right side) -->
  <path d="M 300 386 Q 340 386 340 322 L 282 322" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="352" y="356" text-anchor="middle" font-size="9.5" fill="#888">下一个孩子</text>

  <!-- 6. after loop: return clone -->
  <path d="M 180 408 L 180 428" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="180" cy="440" rx="60" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="445" text-anchor="middle" font-size="12" fill="#335533" font-weight="bold">return clone</text>

  <!-- right-side annotation: 后序接线 -->
  <rect x="370" y="300" width="130" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">后序位置</text>
  <line x1="390" y1="330" x2="480" y2="330" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="435" y="346" text-anchor="middle" font-size="9.5" fill="#666">所有孩子递归返回</text>
  <text x="435" y="360" text-anchor="middle" font-size="9.5" fill="#666">后，children 才填满</text>

  <path d="M 300 386 L 368 335" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
</svg>
