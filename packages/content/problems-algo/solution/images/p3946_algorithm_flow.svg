<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" font-size="15.5" fill="#333" text-anchor="middle" filter="url(#rough2)">算法流程：筛法求增益 + 首件/追加两趟背包</text>

  <!-- B0 输入 -->
  <rect x="60" y="46" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="65" font-size="12" fill="#33475e" text-anchor="middle" filter="url(#rough2)">输入 items, budget</text>
  <line x1="170" y1="76" x2="170" y2="86" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B1 计数 -->
  <rect x="60" y="88" width="220" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="104" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">① 计数 cnt[f]（factor 值域 F ≤ 1500）</text>
  <text x="170" y="119" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">O(n)</text>
  <line x1="170" y1="126" x2="170" y2="136" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B2 筛法 -->
  <rect x="60" y="138" width="220" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="156" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">② 枚举倍数 mult[f] = Σ cnt[f, 2f, 3f, …]</text>
  <text x="170" y="174" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">g_i = mult[factor_i] − 1　O(F log F)</text>
  <line x1="170" y1="186" x2="170" y2="196" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B3 逐件物品 -->
  <rect x="60" y="198" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="218" font-size="12" fill="#33475e" text-anchor="middle" filter="url(#rough2)">③ 逐件物品 (p, g) 做两趟背包</text>
  <line x1="170" y1="230" x2="170" y2="240" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4 返回 -->
  <rect x="60" y="242" width="220" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="260" font-size="11.5" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">④ 全部物品处理完</text>
  <text x="170" y="277" font-size="11.5" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">返回 dp[budget]　O(n·B)</text>

  <!-- B3 -> T1 -->
  <path d="M 282 214 L 324 178" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- T1 倒序首件 -->
  <rect x="328" y="150" width="200" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="428" y="168" font-size="11" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">倒序趟（首件激活 · 0/1 背包）</text>
  <text x="428" y="186" font-size="11" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">dp[b] = max(dp[b],</text>
  <text x="428" y="201" font-size="11" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">dp[b-p] + 1 + g)</text>

  <!-- T1 -> T2 -->
  <path d="M 428 202 L 428 218" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="214" font-size="10" fill="#888" filter="url(#rough2)">先做</text>

  <!-- T2 正序追加 -->
  <rect x="328" y="222" width="200" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="428" y="240" font-size="11" fill="#33475e" text-anchor="middle" filter="url(#rough2)">正序趟（追加件 · 完全背包）</text>
  <text x="428" y="258" font-size="11" fill="#33475e" text-anchor="middle" filter="url(#rough2)">dp[b] = max(dp[b],</text>
  <text x="428" y="273" font-size="11" fill="#33475e" text-anchor="middle" filter="url(#rough2)">dp[b-p] + 1)</text>

  <!-- 循环回边：T2 -> T1 -->
  <path d="M 530 248 L 548 248 L 548 176 L 534 176" fill="none" stroke="#999" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="553" y="215" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-90 553 215)">下一件物品</text>

  <!-- 底部左：复杂度注记 -->
  <rect x="60" y="302" width="220" height="62" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="320" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">时间 O(F log F + n·B) ≈ 3×10⁶</text>
  <text x="170" y="336" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">空间 O(F + B)</text>
  <text x="170" y="352" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">收益上界 &lt; 1.1×10⁶，int 安全</text>

  <!-- 底部右：方向语义警示 -->
  <rect x="328" y="300" width="200" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="318" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">⚠️ 倒序趟读「未含 i」的旧状态，</text>
  <text x="428" y="334" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">正序趟读「可含 i」的新状态——</text>
  <text x="428" y="350" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">方向即语义，</text>
  <text x="428" y="362" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">别把两种转移混进同一趟</text>
</svg>
