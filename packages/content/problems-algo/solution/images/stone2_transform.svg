<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">转化：石头相撞 ⇔ 分两组求最小差</text>

  <!-- 原问题：石头相撞 -->
  <text x="40" y="60" font-size="11.5" fill="#888">原问题：任意选两块石头相撞，重的那块减去轻的</text>
  <rect x="40" y="70" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="88" text-anchor="middle" font-size="11" fill="#333">石头: [2, 7, 4, 1, 8, 1]</text>
  <text x="290" y="103" text-anchor="middle" font-size="11" fill="#333">相撞规则: x ≤ y → 结果 y−x （相等则同归于尽）</text>

  <path d="M 290 112 L 290 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 关键观察：等价于分正负两组 -->
  <rect x="50" y="134" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="159" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">关键观察：相撞 = 给每块石头赋 + 或 − 号</text>

  <path d="M 290 176 L 290 194" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#rough2)" filter="url(#rough2)"/>

  <!-- 正负两组 -->
  <rect x="40" y="198" width="250" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="218" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">+ 组: {2, 7, 1, 1}</text>
  <text x="165" y="236" text-anchor="middle" font-size="11" fill="#333">sum(+) = 11</text>

  <rect x="310" y="198" width="230" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="218" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">− 组: {4, 8}</text>
  <text x="425" y="236" text-anchor="middle" font-size="11" fill="#333">sum(−) = 12</text>

  <path d="M 290 252 L 290 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#rough2)" filter="url(#rough2)"/>

  <!-- 结果公式 -->
  <rect x="80" y="274" width="420" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="297" text-anchor="middle" font-size="13" fill="#333">最终重量 = | sum(+) − sum(−) | = |11 − 12| = 1</text>

  <path d="M 290 312 L 290 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="325" font-size="10" fill="#888">最小化</text>

  <!-- 最小子集和差 -->
  <rect x="60" y="334" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">最小化 |sum(+) − sum(−)| ⇔ 找子集和最接近 S/2</text>

  <path d="M 290 376 L 290 394" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 0-1 背包 -->
  <rect x="50" y="398" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="417" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">0-1 背包（求最大值）</text>
  <text x="290" y="433" text-anchor="middle" font-size="11.5" fill="#333">容量 S/2，每个石头选或不选，最大化装入总和</text>

  <!-- 底部备注 -->
  <rect x="50" y="448" width="480" height="8" fill="#f5f5f5" stroke="none" rx="4" filter="url(#rough2)"/>
</svg>
