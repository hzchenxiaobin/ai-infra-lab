<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：tokens=[100,200,300,400], power=200 → 最大分数 2</text>

  <!-- header row -->
  <text x="40" y="62" font-size="11" fill="#888" font-weight="bold">步骤</text>
  <text x="100" y="62" font-size="11" fill="#888" font-weight="bold">操作</text>
  <text x="230" y="62" font-size="11" fill="#888" font-weight="bold">能量</text>
  <text x="310" y="62" font-size="11" fill="#888" font-weight="bold">分数</text>
  <text x="390" y="62" font-size="11" fill="#888" font-weight="bold">maxScore</text>
  <text x="500" y="62" font-size="11" fill="#888" font-weight="bold">指针</text>
  <line x1="34" y1="68" x2="570" y2="68" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- step 1: face-up 100 -->
  <rect x="34" y="74" width="540" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="94" font-size="11" fill="#2a4a66" font-weight="bold">①</text>
  <text x="100" y="94" font-size="11" fill="#2a4a66">正面朝上 100</text>
  <text x="230" y="94" font-size="11" fill="#2a4a66">200→100</text>
  <text x="310" y="94" font-size="11" fill="#2a4a66">0→1</text>
  <text x="390" y="94" font-size="11" fill="#2a4a66">1</text>
  <text x="500" y="94" font-size="11" fill="#2a4a66">L=1, R=3</text>

  <!-- step 2: face-down 400 -->
  <rect x="34" y="108" width="540" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="128" font-size="11" fill="#a67830" font-weight="bold">②</text>
  <text x="100" y="128" font-size="11" fill="#a67830">反面朝下 400</text>
  <text x="230" y="128" font-size="11" fill="#a67830">100→500</text>
  <text x="310" y="128" font-size="11" fill="#a67830">1→0</text>
  <text x="390" y="128" font-size="11" fill="#a67830">1</text>
  <text x="500" y="128" font-size="11" fill="#a67830">L=1, R=2</text>

  <!-- step 3: face-up 200 -->
  <rect x="34" y="142" width="540" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="162" font-size="11" fill="#2a4a66" font-weight="bold">③</text>
  <text x="100" y="162" font-size="11" fill="#2a4a66">正面朝上 200</text>
  <text x="230" y="162" font-size="11" fill="#2a4a66">500→300</text>
  <text x="310" y="162" font-size="11" fill="#2a4a66">0→1</text>
  <text x="390" y="162" font-size="11" fill="#2a4a66">1</text>
  <text x="500" y="162" font-size="11" fill="#2a4a66">L=2, R=2</text>

  <!-- step 4: face-up 300 -->
  <rect x="34" y="176" width="540" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="196" font-size="11" fill="#2a4a66" font-weight="bold">④</text>
  <text x="100" y="196" font-size="11" fill="#2a4a66">正面朝上 300</text>
  <text x="230" y="196" font-size="11" fill="#2a4a66">300→0</text>
  <text x="310" y="196" font-size="11" fill="#2a4a66">1→2</text>
  <text x="390" y="196" font-size="11" fill="#2a4a66" font-weight="bold">2 ✓</text>
  <text x="500" y="196" font-size="11" fill="#2a4a66">L=3, R=2</text>

  <!-- end -->
  <rect x="34" y="212" width="540" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">L=3 &gt; R=2，结束。返回 maxScore = 2</text>

  <!-- token timeline visualization -->
  <text x="40" y="266" font-size="12" fill="#888" font-weight="bold">令牌使用顺序</text>
  <!-- token boxes -->
  <rect x="120" y="250" width="60" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="272" text-anchor="middle" font-size="13" fill="#2a4a66" font-weight="bold">100</text>
  <text x="150" y="298" text-anchor="middle" font-size="9" fill="#4a7a3a">↑朝上</text>

  <rect x="210" y="250" width="60" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="272" text-anchor="middle" font-size="13" fill="#a67830" font-weight="bold">400</text>
  <text x="240" y="298" text-anchor="middle" font-size="9" fill="#d6a040">↓朝下</text>

  <rect x="300" y="250" width="60" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="272" text-anchor="middle" font-size="13" fill="#2a4a66" font-weight="bold">200</text>
  <text x="330" y="298" text-anchor="middle" font-size="9" fill="#4a7a3a">↑朝上</text>

  <rect x="390" y="250" width="60" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="272" text-anchor="middle" font-size="13" fill="#2a4a66" font-weight="bold">300</text>
  <text x="420" y="298" text-anchor="middle" font-size="9" fill="#4a7a3a">↑朝上</text>

  <!-- arrows between steps -->
  <line x1="180" y1="267" x2="206" y2="267" stroke="#888" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <line x1="270" y1="267" x2="296" y2="267" stroke="#888" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="360" y1="267" x2="386" y2="267" stroke="#888" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- caption -->
  <rect x="40" y="320" width="520" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="middle" font-size="11" fill="#555">关键转折：第②步能量不足（100 &lt; 200），用 1 分换 400 能量</text>
  <text x="300" y="356" text-anchor="middle" font-size="11" fill="#555">换完后能量 500 充裕，连续正面朝上 200、300 再拿 2 分</text>
  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#555">「花 1 分赚 400 能量」是一次高回报投资，后续用能量换回更多分</text>
</svg>
