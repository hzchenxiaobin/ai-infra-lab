<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定左端点 l，右扩展 r 增量维护频率表，beauty = max − min</text>

  <!-- string label -->
  <text x="40" y="66" font-size="12" fill="#888" filter="url(#rough2)">s = "aabcb"，固定 l=0：</text>

  <!-- string cells: l=0 fixed (orange), r=4 extended (green) -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="180" y="56" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="200" y="79" filter="url(#rough2)">a</text>
    <rect x="220" y="56" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="240" y="79" filter="url(#rough2)">a</text>
    <rect x="260" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="280" y="79" filter="url(#rough2)">b</text>
    <rect x="300" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="320" y="79" filter="url(#rough2)">c</text>
    <rect x="340" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="360" y="79" filter="url(#rough2)">b</text>
  </g>

  <!-- l, r labels -->
  <text x="220" y="110" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↑ l=0（固定）</text>
  <text x="360" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑ r=4（右扩展）</text>

  <!-- divider -->
  <path d="M 40 124 L 520 124" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- freq table label -->
  <text x="40" y="148" font-size="12" fill="#888" filter="url(#rough2)">子串 s[0..4]="aabcb" 的频率表（只列出现过的字母）：</text>

  <!-- freq cells: a=2 (max, red), b=2 (max, red), c=1 (min, orange) -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="120" y="162" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="152" y="180" filter="url(#rough2)">a</text>
    <text x="152" y="196" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="152" y="216" font-size="10" fill="#b85450" filter="url(#rough2)">max</text>

    <rect x="194" y="162" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="226" y="180" filter="url(#rough2)">b</text>
    <text x="226" y="196" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="226" y="216" font-size="10" fill="#b85450" filter="url(#rough2)">max</text>

    <rect x="268" y="162" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="300" y="180" filter="url(#rough2)">c</text>
    <text x="300" y="196" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="300" y="216" font-size="10" fill="#d6a040" filter="url(#rough2)">min</text>
  </g>

  <!-- beauty formula box -->
  <rect x="360" y="166" width="150" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">beauty = <tspan fill="#b85450" font-weight="bold">2</tspan> − <tspan fill="#d6a040" font-weight="bold">1</tspan> = <tspan fill="#b85450" font-weight="bold">1</tspan></text>

  <!-- divider -->
  <path d="M 40 236 L 520 236" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- incremental update illustration: r 3->4 -->
  <text x="40" y="260" font-size="12" fill="#888" filter="url(#rough2)">r 右移一格（3 → 4）的增量更新：</text>

  <!-- state A: r=3 "aabc" -->
  <rect x="60" y="276" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="296" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">r=3  "aabc"</text>
  <text x="150" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt: a=2  b=1  c=1</text>
  <text x="150" y="330" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">beauty = 2−1 = 1</text>

  <!-- arrow -->
  <path d="M 244 304 L 286 304" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r++</text>

  <!-- state B: r=4 "aabcb" -->
  <rect x="290" y="276" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="296" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">r=4  "aabcb"</text>
  <text x="380" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt: a=2  b=<tspan fill="#b85450" font-weight="bold">2</tspan>  c=1</text>
  <text x="380" y="330" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">beauty = 2−1 = 1</text>

  <!-- incremental note -->
  <text x="40" y="356" font-size="11.5" fill="#555" filter="url(#rough2)">• 右扩 r 仅 <tspan fill="#b85450" font-weight="bold">cnt[s[r]]++</tspan>（O(1)），无需重建整张频率表</text>
  <text x="40" y="374" font-size="11.5" fill="#555" filter="url(#rough2)">• 每步对 26 个字母扫一遍取 max 与 min（非零项），O(Σ)=O(26) 算出 beauty</text>
  <text x="40" y="392" font-size="11.5" fill="#555" filter="url(#rough2)">• 单字符子串 max=min=1 → beauty=0，自然不计入</text>
</svg>
