<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：排序 → 连续三个一组 → 只查首尾差</text>

  <!-- 原数组（乱序） -->
  <rect x="40" y="46" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="61" y="68" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="86" y="46" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="107" y="68" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">3</text>
  <rect x="132" y="46" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="153" y="68" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">4</text>
  <rect x="178" y="46" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="199" y="68" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">8</text>
  <rect x="224" y="46" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="68" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">7</text>
  <rect x="270" y="46" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="291" y="68" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">9</text>
  <rect x="316" y="46" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="337" y="68" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">3</text>
  <rect x="362" y="46" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="383" y="68" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">5</text>
  <rect x="408" y="46" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="429" y="68" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>

  <text x="245" y="98" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">原数组 nums（乱序），k = 2</text>

  <!-- sort arrow -->
  <path d="M 245 104 L 245 130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="122" font-size="11.5" fill="#446688" filter="url(#rough2)">sort</text>

  <!-- 排序后三组 -->
  <rect x="40" y="136" width="42" height="34" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="61" y="158" text-anchor="middle" font-size="13" fill="#334" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="82" y="136" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="103" y="158" text-anchor="middle" font-size="13" fill="#334" filter="url(#rough2)">1</text>
  <rect x="124" y="136" width="42" height="34" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="158" text-anchor="middle" font-size="13" fill="#334" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="186" y="136" width="42" height="34" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="207" y="158" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="228" y="136" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="249" y="158" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">4</text>
  <rect x="270" y="136" width="42" height="34" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="291" y="158" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="332" y="136" width="42" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="158" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="374" y="136" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="395" y="158" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">8</text>
  <rect x="416" y="136" width="42" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="437" y="158" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="103" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">极差 2 ≤ k ✓</text>
  <text x="249" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">极差 2 ≤ k ✓</text>
  <text x="395" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">极差 2 ≤ k ✓</text>

  <!-- 说明框 -->
  <rect x="36" y="204" width="448" height="86" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">① 组内任意两元素差 ≤ k ⇔ 极差（max − min）≤ k</text>
  <text x="260" y="250" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 排序后组极差 = a[i+2] − a[i]：红框两端一次比较代替三次</text>
  <text x="260" y="272" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">③ 每组独立判定，全部通过 ⇒ 整个划分合法（充分性显然）</text>

  <!-- 鸽笼框 -->
  <rect x="36" y="302" width="448" height="122" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">反过来：连续三分组失败 ⇒ 一定无解（鸽笼）</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">设 a[3j+2] − a[3j] &gt; k：含 a[3j] 的组装不下任何 ≥ a[3j+2] 的数</text>
  <text x="260" y="368" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">前 3j+2 个「小数」里，能跨去「大数」侧垫背的只有 a[3j+1] 一个</text>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">|U| = 3j+2 ≡ 2 (mod 3)，垫背名额 ≤ 1 ⇒ 凑不成 3 的倍数 ⇒ 矛盾</text>
  <text x="260" y="410" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⇒ 排序后连续三分组「要么是答案，要么无答案」</text>
</svg>
