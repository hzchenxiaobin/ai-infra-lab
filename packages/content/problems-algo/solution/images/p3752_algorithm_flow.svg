<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#556677"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <!-- A: compute S, D -->
  <rect x="150" y="26" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">计算 S、D = S − target</text>
  <path d="M 260 60 L 260 82" stroke="#556677" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: no-solution check -->
  <polygon points="260,86 392,120 260,154 128,120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">target 越界或</text>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">D 为奇数？</text>
  <text x="404" y="112" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 392 120 L 404 120" stroke="#556677" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="410" y="102" width="102" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="461" y="124" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 [ ]</text>
  <text x="270" y="174" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 260 154 L 260 178" stroke="#556677" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D: init x -->
  <rect x="185" y="182" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = n</text>
  <path d="M 260 216 L 260 222" stroke="#556677" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E: x >= 1 ? -->
  <polygon points="260,226 348,262 260,298 172,262" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x ≥ 1 ?</text>
  <text x="356" y="252" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 348 262 L 388 262" stroke="#556677" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F: build answer -->
  <rect x="392" y="234" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="452" y="256" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">构造并返回：</text>
  <text x="452" y="274" text-anchor="middle" font-size="10" fill="#2a4a1a" filter="url(#rough2)">负数降序 + 正数升序</text>
  <text x="270" y="312" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 298 L 260 312" stroke="#556677" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- G: 2x <= D ? -->
  <polygon points="260,316 362,352 260,388 158,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="357" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">2x ≤ D ?</text>
  <text x="148" y="342" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 158 352 L 154 352" stroke="#556677" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- H: flip x -->
  <rect x="50" y="330" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="348" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">翻转 x</text>
  <text x="100" y="366" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">D −= 2x</text>
  <path d="M 100 374 L 100 434 L 206 434" stroke="#556677" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="270" y="412" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 260 388 L 260 416" stroke="#556677" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- I: x-- -->
  <rect x="210" y="420" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="440" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = x − 1</text>

  <!-- loop back edge -->
  <path d="M 260 450 L 260 464 L 20 464 L 20 262 L 166 262" stroke="#556677" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="90" y="458" font-size="10" fill="#556677" filter="url(#rough2)">继续下一轮</text>
</svg>
