<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：dddaaa → daaa → da，答案 2</text>

  <!-- ===== Step 1: shrink d ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 缩 d（出现 3 次）</text>

  <text x="40" y="74" font-size="10" fill="#888" filter="url(#rough2)">s =</text>
  <!-- index labels -->
  <text x="65" y="80" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="97" y="80" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="129" y="80" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="161" y="80" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="193" y="80" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="225" y="80" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">5</text>

  <!-- d index 0: deleted -->
  <rect x="50" y="86" width="30" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="110" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">d</text>
  <!-- d index 1: center -->
  <rect x="82" y="86" width="30" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <!-- d index 2: deleted -->
  <rect x="114" y="86" width="30" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="129" y="110" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">d</text>
  <!-- a index 3,4,5: untouched -->
  <rect x="146" y="86" width="30" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="161" y="110" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <rect x="178" y="86" width="30" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="193" y="110" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <rect x="210" y="86" width="30" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="225" y="110" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">a</text>

  <!-- center marker for d -->
  <path d="M 97 70 L 97 84" stroke="#d6a040" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="97" y="64" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">中心</text>

  <!-- delete arrows -->
  <path d="M 97 126 L 70 126" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 97 126 L 124 126" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- result of step 1 -->
  <path d="M 140 140 L 140 158" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="138" font-size="10" fill="#446688" filter="url(#rough2)">删左右各一个 d → "daaa"</text>

  <!-- ===== Step 2: shrink a ===== -->
  <text x="40" y="178" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 缩 a（出现 3 次）</text>

  <text x="40" y="196" font-size="10" fill="#888" filter="url(#rough2)">s =</text>
  <!-- new string d a a a, indices 0..3 -->
  <text x="65" y="202" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="97" y="202" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="129" y="202" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="161" y="202" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">3</text>

  <!-- d kept -->
  <rect x="50" y="208" width="30" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <!-- a index 1: deleted -->
  <rect x="82" y="208" width="30" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="97" y="232" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">a</text>
  <!-- a index 2: center -->
  <rect x="114" y="208" width="30" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <!-- a index 3: deleted -->
  <rect x="146" y="208" width="30" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="161" y="232" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">a</text>

  <!-- center marker for a -->
  <path d="M 129 192 L 129 206" stroke="#d6a040" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="129" y="186" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">中心</text>

  <!-- delete arrows -->
  <path d="M 129 248 L 102 248" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 129 248 L 156 248" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <path d="M 140 262 L 140 280" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="280" y="260" font-size="10" fill="#4a7a3a" filter="url(#rough2)">删左右各一个 a → "da"</text>

  <!-- ===== Final result ===== -->
  <text x="40" y="300" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终</text>

  <rect x="82" y="288" width="30" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="114" y="288" width="30" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- answer box -->
  <rect x="220" y="288" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="313" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = 2</text>

  <!-- note -->
  <path d="M 152 308 L 215 308" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- summary -->
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">d 缩到 1 + a 缩到 1 = 2 = 不同字符数</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">换序（先缩 a 再缩 d）结论不变 — 互不干扰</text>
</svg>
