<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">贪心构造：一个 '1' 守末位，其余 '1' 全冲最高位</text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">以 s = "0101" 为例：n = 4，'1' 的个数 k = 2</text>

  <!-- input row -->
  <text x="158" y="96" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">输入 s</text>
  <g filter="url(#rough2)">
    <rect x="180" y="72" width="44" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="202" y="96" text-anchor="middle" font-size="14" fill="#777">0</text>
    <rect x="232" y="72" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="254" y="96" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold">1</text>
    <rect x="284" y="72" width="44" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="306" y="96" text-anchor="middle" font-size="14" fill="#777">0</text>
    <rect x="336" y="72" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="358" y="96" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold">1</text>
  </g>

  <!-- arrows: ones -->
  <path d="M 254 116 C 254 166, 202 166, 202 222" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="188" y="170" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">冲最高位</text>
  <path d="M 358 116 L 358 222" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="372" y="172" text-anchor="start" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">守末位</text>
  <!-- arrows: zeros (dashed gray) -->
  <path d="M 202 116 C 202 160, 254 160, 254 222" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 306 116 L 306 222" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="322" y="146" text-anchor="start" font-size="11" fill="#999" filter="url(#rough2)">垫中间</text>

  <!-- result row -->
  <text x="158" y="256" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">答案</text>
  <g filter="url(#rough2)">
    <rect x="180" y="232" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="202" y="256" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold">1</text>
    <rect x="232" y="232" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="254" y="256" text-anchor="middle" font-size="14" fill="#446688">0</text>
    <rect x="284" y="232" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="306" y="256" text-anchor="middle" font-size="14" fill="#446688">0</text>
    <rect x="336" y="232" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="358" y="256" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- place values -->
  <g filter="url(#rough2)" font-size="11" fill="#888">
    <text x="202" y="288" text-anchor="middle">权重 2³ = 8</text>
    <text x="254" y="288" text-anchor="middle">2² = 4</text>
    <text x="306" y="288" text-anchor="middle">2¹ = 2</text>
    <text x="358" y="288" text-anchor="middle">2⁰ = 1</text>
  </g>

  <!-- annotation boxes -->
  <rect x="36" y="306" width="238" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="327" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">高位权重大：'1' 每左移一位翻倍</text>
  <text x="155" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k−1 个 '1' 全部堆到最前面</text>

  <rect x="288" y="306" width="238" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="407" y="327" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">奇偶只看末位：末位 '1' ⇔ 奇数</text>
  <text x="407" y="346" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">这是唯一的硬约束</text>

  <!-- formula -->
  <rect x="86" y="370" width="388" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold" filter="url(#rough2)">答案 = '1'×(k−1) ＋ '0'×(n−k) ＋ '1'</text>
</svg>
