<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：找中点 → 反转后半 → 配对求和取 max</text>

  <!-- ===== ① 找中点 ===== -->
  <rect x="30" y="56" width="560" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="50" y="80" font-size="12" fill="#d6a040" font-weight="bold">① 快慢指针找中点（slow 走 1 步 / fast 走 2 步）</text>
  <g font-size="13">
    <rect x="110" y="100" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="135" y="121" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <line x1="160" y1="116" x2="188" y2="116" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="194" y="100" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="219" y="121" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="244" y1="116" x2="272" y2="116" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="278" y="100" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="303" y="121" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <line x1="328" y1="116" x2="356" y2="116" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="362" y="100" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="387" y="121" text-anchor="middle" fill="#333" font-weight="bold">1</text>
  </g>
  <text x="303" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ slow（后半段起点）</text>
  <text x="460" y="120" font-size="11" fill="#888">fast 到 ∅ 时</text>
  <text x="460" y="135" font-size="11" fill="#888">slow 落在 n/2 处</text>

  <!-- 向下箭头 -->
  <line x1="310" y1="170" x2="310" y2="192" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- ===== ② 反转后半 ===== -->
  <rect x="30" y="200" width="560" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="50" y="224" font-size="12" fill="#b85450" font-weight="bold">② 反转后半段（2→1 掉头成 1→2）</text>
  <g font-size="13">
    <rect x="110" y="244" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="135" y="265" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <line x1="160" y1="260" x2="188" y2="260" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="194" y="244" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="219" y="265" text-anchor="middle" fill="#333" font-weight="bold">4</text>

    <text x="280" y="265" font-size="15" fill="#d6a040" font-weight="bold">⇒</text>

    <rect x="316" y="244" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="341" y="265" text-anchor="middle" fill="#8a3a36" font-weight="bold">1</text>
    <line x1="366" y1="260" x2="394" y2="260" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <rect x="400" y="244" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="425" y="265" text-anchor="middle" fill="#8a3a36" font-weight="bold">2</text>
  </g>
  <text x="219" y="296" text-anchor="middle" font-size="10" fill="#888">前半段不动</text>
  <text x="425" y="296" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">后半段反转后</text>

  <!-- 向下箭头 -->
  <line x1="310" y1="314" x2="310" y2="336" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- ===== ③ 配对求和 ===== -->
  <rect x="30" y="344" width="560" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="50" y="368" font-size="12" fill="#4a7a3a" font-weight="bold">③ p1 从头、p2 从反转后半头同步走，求和取 max</text>
  <g font-size="13">
    <text x="60" y="398" font-size="11" fill="#446688" font-weight="bold">p1:</text>
    <rect x="92" y="384" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="115" y="404" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <line x1="138" y1="399" x2="160" y2="399" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="166" y="384" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="189" y="404" text-anchor="middle" fill="#333" font-weight="bold">4</text>

    <text x="60" y="432" font-size="11" fill="#b85450" font-weight="bold">p2:</text>
    <rect x="92" y="418" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="115" y="438" text-anchor="middle" fill="#8a3a36" font-weight="bold">1</text>
    <line x1="138" y1="433" x2="160" y2="433" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <rect x="166" y="418" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="189" y="438" text-anchor="middle" fill="#8a3a36" font-weight="bold">2</text>
  </g>
  <text x="240" y="404" font-size="12" fill="#4a7a3a" font-weight="bold">5 + 1 = 6</text>
  <text x="240" y="438" font-size="12" fill="#4a7a3a" font-weight="bold">4 + 2 = 6</text>
  <rect x="370" y="412" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="434" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = max(6, 6) = 6</text>
</svg>
