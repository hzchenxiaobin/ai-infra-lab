<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：苹果可拆分 ⇒ 只看总量，大箱子优先</text>

  <!-- left panel: apples -->
  <rect x="20" y="40" width="225" height="300" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="132" y="64" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">苹果侧：包裹可以拆开</text>

  <rect x="36" y="80" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="64" y="102" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="104" y="80" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="132" y="102" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="172" y="80" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="102" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="132" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">apple = [1, 3, 2]</text>

  <path d="M 64 138 C 80 160, 100 168, 118 172" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 132 138 C 132 150, 132 158, 132 168" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 200 138 C 184 160, 164 168, 146 172" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="48" y="176" width="168" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="132" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">苹果总数</text>
  <text x="132" y="212" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">total = 1+3+2 = 6</text>

  <text x="132" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">同一包裹的苹果可分装到不同箱子</text>
  <text x="132" y="264" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">⇒ 装得下 ⇔ 容量和 ≥ total</text>
  <text x="132" y="282" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">包裹怎么拆根本不重要</text>

  <rect x="52" y="294" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="132" y="316" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">约束坍缩成一个数 total</text>

  <!-- right panel: boxes -->
  <rect x="265" y="40" width="235" height="300" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="382" y="64" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">箱子侧：按容量降序拿</text>

  <rect x="286" y="106" width="118" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="7" filter="url(#rough2)"/>
  <text x="345" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">拿第 1 个：5 &lt; 6 ✗</text>
  <path d="M 320 136 C 310 152, 302 172, 298 190" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="412" y="140" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="7" filter="url(#rough2)"/>
  <text x="455" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9 ≥ 6 ✓</text>
  <path d="M 430 170 C 424 186, 366 208, 342 218" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- bars, baseline y=300 -->
  <rect x="282" y="200" width="32" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="298" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="320" y="220" width="32" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="336" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="358" y="240" width="32" height="60" fill="#eef2f7" stroke="#8aa0b8" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="374" y="234" text-anchor="middle" font-size="12" fill="#8aa0b8" filter="url(#rough2)">3</text>

  <rect x="396" y="260" width="32" height="40" fill="#eef2f7" stroke="#8aa0b8" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="412" y="254" text-anchor="middle" font-size="12" fill="#8aa0b8" filter="url(#rough2)">2</text>

  <rect x="434" y="280" width="32" height="20" fill="#eef2f7" stroke="#8aa0b8" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="274" text-anchor="middle" font-size="12" fill="#8aa0b8" filter="url(#rough2)">1</text>

  <path d="M 275 180 L 488 180" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="488" y="173" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">total = 6 的高度线</text>

  <path d="M 278 300 L 470 300" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="300" y="308" width="164" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="382" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前 2 根柱子就够 → 答案 2</text>
</svg>
