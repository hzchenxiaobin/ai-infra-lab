<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：成功匹配 vs 不相交约束失败</text>

  <!-- ===== Example 1: success ===== -->
  <rect x="30" y="38" width="580" height="226" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="50" y="58" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：groups = [[1,−1,−1],[3,−2,0]]，nums = [1,−1,0,1,−1,−1,3,−2,0]</text>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="8.5" fill="#aaa" text-anchor="middle">
    <text x="124" y="76">0</text><text x="172" y="76">1</text><text x="220" y="76">2</text>
    <text x="268" y="76">3</text><text x="316" y="76">4</text><text x="364" y="76">5</text>
    <text x="412" y="76">6</text><text x="460" y="76">7</text><text x="508" y="76">8</text>
  </g>

  <!-- Step 1 label -->
  <text x="44" y="100" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">步骤1</text>
  <text x="44" y="114" font-size="9" fill="#888" filter="url(#rough2)">找 g[0]</text>
  <text x="44" y="126" font-size="9" fill="#888" filter="url(#rough2)">i=0 起</text>

  <!-- Step 1: nums row showing scan for g[0]=[1,-1,-1] -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <!-- j=0,1,2: tried, fail -->
    <rect x="100" y="88" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="124" y="107" fill="#888">1</text>
    <rect x="148" y="88" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="172" y="107" fill="#888">−1</text>
    <rect x="196" y="88" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="220" y="107" fill="#888">0</text>
    <!-- j=3: match! -->
    <rect x="244" y="88" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="268" y="107" fill="#333" font-weight="bold">1</text>
    <rect x="292" y="88" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="316" y="107" fill="#333" font-weight="bold">−1</text>
    <rect x="340" y="88" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="364" y="107" fill="#333" font-weight="bold">−1</text>
    <!-- rest: not yet scanned -->
    <rect x="388" y="88" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="412" y="107" fill="#ccc">3</text>
    <rect x="436" y="88" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="460" y="107" fill="#ccc">−2</text>
    <rect x="484" y="88" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="508" y="107" fill="#ccc">0</text>
  </g>
  <!-- j=0,1,2 fail marks -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <text x="124" y="130" fill="#b85450">✗</text>
    <text x="172" y="130" fill="#b85450">✗</text>
    <text x="220" y="130" fill="#b85450">✗</text>
    <text x="308" y="130" fill="#4a7a3a" font-weight="bold">✓ j=3 命中 → i=6</text>
  </g>

  <!-- arrow down -->
  <path d="M 320 138 L 320 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 label -->
  <text x="44" y="172" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤2</text>
  <text x="44" y="186" font-size="9" fill="#888" filter="url(#rough2)">找 g[1]</text>
  <text x="44" y="198" font-size="9" fill="#888" filter="url(#rough2)">i=6 起</text>

  <!-- Step 2: nums row showing match for g[1]=[3,-2,0] -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <!-- already matched g[0] -->
    <rect x="100" y="160" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="124" y="179" fill="#aaa">1</text>
    <rect x="148" y="160" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="172" y="179" fill="#aaa">−1</text>
    <rect x="196" y="160" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="220" y="179" fill="#aaa">0</text>
    <rect x="244" y="160" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="268" y="179" fill="#aaa">1</text>
    <rect x="292" y="160" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="316" y="179" fill="#aaa">−1</text>
    <rect x="340" y="160" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="364" y="179" fill="#aaa">−1</text>
    <!-- j=6: match! -->
    <rect x="388" y="160" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="412" y="179" fill="#333" font-weight="bold">3</text>
    <rect x="436" y="160" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="460" y="179" fill="#333" font-weight="bold">−2</text>
    <rect x="484" y="160" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="508" y="179" fill="#333" font-weight="bold">0</text>
  </g>
  <text x="460" y="202" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">✓ j=6 命中 → i=9</text>

  <!-- Result 1 -->
  <rect x="200" y="216" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="238" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部匹配 → return true ✓</text>

  <!-- ===== Example 3: failure ===== -->
  <rect x="30" y="276" width="580" height="250" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="50" y="296" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：groups = [[1,2,3],[3,4]]，nums = [7,7,1,2,3,4,7,7]</text>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="8.5" fill="#aaa" text-anchor="middle">
    <text x="148" y="314">0</text><text x="196" y="314">1</text><text x="244" y="314">2</text>
    <text x="292" y="314">3</text><text x="340" y="314">4</text><text x="388" y="314">5</text>
    <text x="436" y="314">6</text><text x="484" y="314">7</text>
  </g>

  <!-- Step 1 label -->
  <text x="44" y="338" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">步骤1</text>
  <text x="44" y="352" font-size="9" fill="#888" filter="url(#rough2)">找 g[0]</text>
  <text x="44" y="364" font-size="9" fill="#888" filter="url(#rough2)">[1,2,3]</text>

  <!-- Step 1: scan for [1,2,3], found at j=2 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="124" y="326" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="148" y="345" fill="#888">7</text>
    <rect x="172" y="326" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="196" y="345" fill="#888">7</text>
    <rect x="220" y="326" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="244" y="345" fill="#333" font-weight="bold">1</text>
    <rect x="268" y="326" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="292" y="345" fill="#333" font-weight="bold">2</text>
    <rect x="316" y="326" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="340" y="345" fill="#333" font-weight="bold">3</text>
    <rect x="364" y="326" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="388" y="345" fill="#ccc">4</text>
    <rect x="412" y="326" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="436" y="345" fill="#ccc">7</text>
    <rect x="460" y="326" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="484" y="345" fill="#ccc">7</text>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <text x="148" y="368" fill="#b85450">✗</text>
    <text x="196" y="368" fill="#b85450">✗</text>
    <text x="292" y="368" fill="#4a7a3a" font-weight="bold">✓ j=2 命中 → i=5</text>
  </g>

  <path d="M 320 376 L 320 390" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 label -->
  <text x="44" y="410" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">步骤2</text>
  <text x="44" y="424" font-size="9" fill="#888" filter="url(#rough2)">找 g[1]</text>
  <text x="44" y="436" font-size="9" fill="#888" filter="url(#rough2)">[3,4]</text>

  <!-- Step 2: from i=5, try [3,4] -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="124" y="398" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="148" y="417" fill="#aaa">7</text>
    <rect x="172" y="398" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="196" y="417" fill="#aaa">7</text>
    <rect x="220" y="398" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="244" y="417" fill="#aaa">1</text>
    <rect x="268" y="398" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="292" y="417" fill="#aaa">2</text>
    <rect x="316" y="398" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" opacity="0.5"/>
    <text x="340" y="417" fill="#aaa">3</text>
    <!-- j=5: [4,7] != [3,4] -->
    <rect x="364" y="398" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="388" y="417" fill="#b85450" font-weight="bold">4</text>
    <rect x="412" y="398" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="436" y="417" fill="#b85450" font-weight="bold">7</text>
    <!-- j=6: [7,7] != [3,4] -->
    <rect x="460" y="398" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="484" y="417" fill="#b85450" font-weight="bold">7</text>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <text x="400" y="440" fill="#b85450" font-weight="bold">✗ j=5: [4,7]≠[3,4]</text>
    <text x="460" y="452" fill="#b85450" font-weight="bold">✗ j=6: [7,7]≠</text>
    <text x="300" y="452" fill="#b85450">j=7: 剩余不足 → </text>
  </g>

  <!-- Result 3 -->
  <rect x="170" y="466" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="488" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">g[1] 找不到 → return false ✗</text>

  <!-- bottom note -->
  <text x="320" y="518" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">⚠ [3,4] 中的 3 已被 g[0] 占用（不相交），指针 i=5 后无法再匹配</text>
</svg>
