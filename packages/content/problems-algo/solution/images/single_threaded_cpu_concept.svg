<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：时间轴推进 + 就绪堆取最短任务</text>

  <!-- Timeline section -->
  <text x="40" y="60" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 任务按入队时间排列</text>
  <line x1="40" y1="90" x2="540" y2="90" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="94" font-size="10" fill="#888" filter="url(#rough2)">time</text>

  <!-- Tasks on timeline -->
  <rect x="80" y="76" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=1</text>
  <text x="105" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2]#0</text>

  <rect x="180" y="76" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=2</text>
  <text x="205" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[4]#1</text>

  <rect x="280" y="76" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=3</text>
  <text x="305" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2]#2</text>

  <rect x="380" y="76" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=4</text>
  <text x="405" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1]#3</text>

  <!-- Arrow from timeline to heap -->
  <path d="M 290 112 L 290 138" stroke="#666" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="130" font-size="9.5" fill="#888" filter="url(#rough2)">enqueueTime ≤ 当前时间 → 入堆</text>

  <!-- Ready queue (min-heap) section -->
  <text x="40" y="156" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 就绪队列：小顶堆（processingTime, index）</text>

  <!-- Heap visualization -->
  <rect x="220" y="172" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">(1, #3)</text>
  <text x="300" y="190" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 堆顶（最短）</text>

  <rect x="160" y="216" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(2, #0)</text>
  <rect x="280" y="216" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(4, #1)</text>
  <path d="M 255 204 L 195 216" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 255 204 L 315 216" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="380" y="234" font-size="10" fill="#888" filter="url(#rough2)">同 procTime → index 小者优先</text>

  <!-- Arrow from heap to CPU -->
  <path d="M 255 248 L 255 278" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="268" y="270" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">pop 堆顶</text>

  <!-- CPU section -->
  <text x="40" y="296" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ CPU 执行（不可抢占）</text>
  <rect x="160" y="286" width="190" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="255" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">执行 #3（procTime=1）</text>
  <text x="365" y="308" font-size="10" fill="#888" filter="url(#rough2)">time += 1</text>

  <!-- Key insights -->
  <path d="M 40 342 L 540 342" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="362" font-size="11" fill="#555" filter="url(#rough2)">• 排序后用游标 ptr 按时间顺序解锁任务入堆，堆内按 (procTime, index) 取最小</text>
  <text x="56" y="380" font-size="11" fill="#555" filter="url(#rough2)">• CPU 空闲且堆空时，时间直接跳到 tasks[ptr].enqueueTime，避免空转等待</text>
  <text x="56" y="398" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠ 入队时间相同 → 全部入堆后由堆决定顺序，而非按到达先后执行</text>
</svg>
