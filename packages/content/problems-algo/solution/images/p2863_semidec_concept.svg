<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">什么是「半递减子数组」？—— 首元素是严格最大值</text>

  <!-- example 1 array -->
  <text x="98" y="64" text-anchor="end" font-size="12" fill="#999" filter="url(#rough2)">nums =</text>
  <rect x="112" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="65" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="154" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="196" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="238" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="280" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="322" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="364" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="406" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="448" y="46" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="469" y="65" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="490" y="46" width="42" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="511" y="65" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">11</text>

  <!-- indices -->
  <text x="133" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="175" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="217" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="259" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="301" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="343" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="385" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="427" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="469" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="511" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">9</text>

  <!-- wall annotation -->
  <text x="469" y="36" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 ≥ 7，挡住扩张</text>

  <!-- bracket under 0..7 -->
  <path d="M 112 102 L 112 114 L 448 114 L 448 102" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">半递减子数组 [7,6,5,4,3,2,1,6]，长度 8 —— 其余元素都 &lt; 7 ✓</text>

  <!-- second insight: middle can wiggle -->
  <text x="60" y="168" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">中间可以任意起伏，例 2 中的 [64, 60, 63]：</text>
  <rect x="112" y="182" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="201" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">64</text>
  <rect x="158" y="182" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">60</text>
  <rect x="204" y="182" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">63</text>
  <path d="M 184 178 Q 204 156 226 176" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="172" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">60 回升到 63 也没关系，只要压在 64 之下</text>

  <!-- definition box -->
  <rect x="40" y="228" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">半递减：子数组首元素严格大于其余每一个元素（其余元素之间无要求）</text>
  <text x="300" y="270" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">单独一个元素也算半递减（长度 1），所以答案至少为 1</text>

  <!-- example 3 footnote -->
  <rect x="90" y="300" width="420" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="323" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">例 3：[1,2,3,4] 纯递增，任何二元组都非法 → 答案 1</text>

  <!-- footnotes -->
  <text x="30" y="362" font-size="10.5" fill="#999" filter="url(#rough2)">「半递减」放松了「严格递减」：不要求逐格下降，只要求全部落在首元素之下</text>
  <text x="30" y="380" font-size="10.5" fill="#999" filter="url(#rough2)">题意为付费题重建版本：由官方 hints 的算法反推，示例输出已用三种独立实现交叉验证</text>
</svg>
