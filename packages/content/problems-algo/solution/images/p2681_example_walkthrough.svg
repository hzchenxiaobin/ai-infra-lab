<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[2,1,4] → 排序 [1,2,4]</text>

  <!-- Step 1: sort -->
  <text x="30" y="58" font-size="12" fill="#888">① 排序:</text>
  <rect x="120" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="63" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="168" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="63" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="216" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="63" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- Step 2: table -->
  <text x="30" y="100" font-size="12" fill="#888">② 递推:</text>

  <!-- header row -->
  <rect x="45" y="110" width="430" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="67" y="127" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">j</text>
  <text x="115" y="127" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">x</text>
  <text x="170" y="127" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">g(进)</text>
  <text x="260" y="127" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">贡献 x²·(g+x)</text>
  <text x="360" y="127" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">ans 累计</text>
  <text x="437" y="127" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">g(出)</text>

  <!-- vertical separators -->
  <line x1="90" y1="110" x2="90" y2="232" stroke="#cdd8e8" stroke-width="1"/>
  <line x1="140" y1="110" x2="140" y2="232" stroke="#cdd8e8" stroke-width="1"/>
  <line x1="200" y1="110" x2="200" y2="232" stroke="#cdd8e8" stroke-width="1"/>
  <line x1="320" y1="110" x2="320" y2="232" stroke="#cdd8e8" stroke-width="1"/>
  <line x1="400" y1="110" x2="400" y2="232" stroke="#cdd8e8" stroke-width="1"/>

  <!-- row 0 -->
  <rect x="45" y="136" width="430" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="67" y="155" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="115" y="155" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="170" y="155" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="260" y="155" text-anchor="middle" font-size="11" fill="#b85450">1·(0+1)=1</text>
  <text x="360" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="437" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>

  <!-- row 1 -->
  <rect x="45" y="166" width="430" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="67" y="185" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="115" y="185" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="170" y="185" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="260" y="185" text-anchor="middle" font-size="11" fill="#b85450">4·(1+2)=12</text>
  <text x="360" y="185" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">13</text>
  <text x="437" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a">4</text>

  <!-- row 2 -->
  <rect x="45" y="196" width="430" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="67" y="218" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="115" y="218" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="170" y="218" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="260" y="218" text-anchor="middle" font-size="11" fill="#b85450">16·(4+4)=128</text>
  <text x="360" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">141</text>
  <text x="437" y="218" text-anchor="middle" font-size="11" fill="#999">12</text>

  <!-- final answer box -->
  <rect x="100" y="252" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">ans = 141 ⭐</text>

  <!-- summary -->
  <rect x="45" y="302" width="430" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每步：先用 g 算贡献 → 再 g=2g+x 更新</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#888">末项 g=12 不再使用</text>
</svg>
