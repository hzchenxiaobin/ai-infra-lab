<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：分桶计数 → 组内 RANK → 取并列第一 → 双降序输出</text>

  <rect x="70" y="46" width="420" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 分桶计数</text>
  <text x="280" y="81" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">GROUP BY city, HOUR(call_time) → COUNT(1) AS cnt</text>

  <path d="M 280 90 L 280 106" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="108" width="420" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 组内排名（并列同名次）</text>
  <text x="280" y="143" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">RANK() OVER (PARTITION BY city ORDER BY cnt DESC) AS rk</text>

  <path d="M 280 152 L 280 168" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="170" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">③ 过滤并列第一</text>
  <text x="280" y="205" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">WHERE rk = 1（并列最多的小时全保留）</text>

  <path d="M 280 214 L 280 230" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="232" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">④ 双降序输出</text>
  <text x="280" y="267" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ORDER BY peak_calling_hour DESC, city DESC</text>

  <path d="M 280 276 L 280 292" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="294" width="420" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">输出三列</text>
  <text x="280" y="329" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">city / peak_calling_hour / number_of_calls</text>
</svg>
