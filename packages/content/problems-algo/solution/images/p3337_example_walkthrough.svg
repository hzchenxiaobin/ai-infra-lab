  <rect x="334" y="58" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="79" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">y</text>
