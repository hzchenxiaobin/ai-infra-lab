  <text x="355" y="150" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="376" y="128" width="42" height="36" fill="#fdeef0" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="397" y="150" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="418" y="128" width="68" height="36" fill="#f4faf5" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="452" y="150" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">5</text>

  <rect x="40" y="164" width="84" height="36" fill="#f2f7fc" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="186" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">t = 2 ✓</text>
  <rect x="124" y="164" width="42" height="36" fill="#f2f7fc" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="145" y="186" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="166" y="164" width="42" height="36" fill="#f2f7fc" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="187" y="186" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
