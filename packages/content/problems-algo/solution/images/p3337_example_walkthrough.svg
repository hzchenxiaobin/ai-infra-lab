  <rect x="376" y="92" width="42" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="397" y="114" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="418" y="92" width="68" height="36" fill="#f4faf5" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="452" y="114" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">5</text>

  <rect x="40" y="128" width="84" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">t = 1</text>
  <rect x="124" y="128" width="42" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
