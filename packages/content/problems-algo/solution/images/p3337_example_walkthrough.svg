  <rect x="250" y="92" width="42" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="271" y="114" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>
