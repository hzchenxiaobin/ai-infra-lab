  <path d="M 400 146 C 428 130, 436 130, 452 160" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="128" text-anchor="middle" font-size="10" fill="#8a3833" font-weight="bold" filter="url(#rough2)">z 分裂出 2 份 "ab"</text>

  <rect x="30" y="216" width="460" height="72" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="238" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">💡 矩阵视角核对</text>
  <text x="44" y="258" font-size="10.5" fill="#555" filter="url(#rough2)">· cnt₁ = M·cnt₀：a b c 进一位成 b c d，两个 y 进成两个 z —— 无增无减，总长仍 5</text>
  <text x="44" y="276" font-size="10.5" fill="#555" filter="url(#rough2)">· cnt₂ = M²·cnt₀：两个 z 各展开 "ab"（回绕！），落在 a、b 两列 —— 总长 5 + 2 = 7 ✓</text>

  <rect x="30" y="304" width="460" height="76" fill="#fffdf5" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="326" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">示例 2：s = "azbk"，t = 1，nums 全 2</text>
  <text x="44" y="346" font-size="10.5" fill="#555" filter="url(#rough2)">· a→"bc"，z→"ab"（越过 z 绕回 a），b→"cd"，k→"lm" —— 四个字符全部一分为二</text>
  <text x="44" y="366" font-size="10.5" fill="#555" filter="url(#rough2)">· 长度 2+2+2+2 = 8 ✓；真实字符串 "bcabcdlm" 与计数法逐列吻合，全程未存字符串</text>
</svg>
