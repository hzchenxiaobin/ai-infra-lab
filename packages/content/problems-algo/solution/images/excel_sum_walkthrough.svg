<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：set A1=2 → sum C3 → set B2=2 → get C3=6</text>

  <!-- ===== Step 1: set(1,A,"2") ===== -->
  <text x="20" y="52" font-size="11" fill="#446688" font-weight="bold">① set(1, A, "2")</text>

  <!-- mini grid 1 -->
  <text x="65" y="68" text-anchor="middle" font-size="8" fill="#888">A</text>
  <text x="85" y="68" text-anchor="middle" font-size="8" fill="#888">B</text>
  <text x="105" y="68" text-anchor="middle" font-size="8" fill="#888">C</text>
  <text x="48" y="84" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="48" y="104" text-anchor="middle" font-size="8" fill="#888">2</text>
  <text x="48" y="124" text-anchor="middle" font-size="8" fill="#888">3</text>

  <rect x="55" y="70" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="65" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>

  <rect x="75" y="70" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="95" y="70" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="55" y="90" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="75" y="90" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="95" y="90" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="55" y="110" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="75" y="110" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="95" y="110" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <text x="80" y="146" text-anchor="middle" font-size="9" fill="#446688">A1 存直接值 2</text>

  <!-- arrow to step 2 -->
  <path d="M135 100 L155 100" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Step 2: sum(3,C,...) ===== -->
  <text x="165" y="52" font-size="11" fill="#b85450" font-weight="bold">② sum(3, C, ["A1","A1:B2"])</text>

  <!-- refs expansion box -->
  <rect x="165" y="58" width="150" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="240" y="74" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">展开 refs：</text>
  <text x="240" y="90" text-anchor="middle" font-size="9" fill="#555">"A1" → [A1]</text>
  <text x="240" y="102" text-anchor="middle" font-size="9" fill="#555">"A1:B2" → [A1,B1,A2,B2]</text>

  <text x="240" y="124" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">refs = [A1, A1, B1, A2, B2]</text>
  <text x="240" y="138" text-anchor="middle" font-size="8" fill="#d6a040">A1 出现 2 次！</text>

  <!-- get result -->
  <rect x="180" y="146" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">get(C3)=2+2+0+0+0=4</text>

  <!-- arrow to step 3 -->
  <path d="M325 100 L345 100" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Step 3: set(2,B,"2") ===== -->
  <text x="355" y="52" font-size="11" fill="#d6a040" font-weight="bold">③ set(2, B, "2")</text>

  <!-- mini grid 3 -->
  <text x="398" y="68" text-anchor="middle" font-size="8" fill="#888">A</text>
  <text x="418" y="68" text-anchor="middle" font-size="8" fill="#888">B</text>
  <text x="438" y="68" text-anchor="middle" font-size="8" fill="#888">C</text>
  <text x="383" y="84" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="383" y="104" text-anchor="middle" font-size="8" fill="#888">2</text>
  <text x="383" y="124" text-anchor="middle" font-size="8" fill="#888">3</text>

  <rect x="388" y="70" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="398" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <rect x="408" y="70" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="428" y="70" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="388" y="90" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="408" y="90" width="20" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="418" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <rect x="428" y="90" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="388" y="110" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="408" y="110" width="20" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="428" y="110" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="438" y="124" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">公式</text>

  <text x="418" y="146" text-anchor="middle" font-size="9" fill="#d6a040">B2=2，C3 公式不变</text>

  <!-- ===== Step 4: get(3,C) → 6 ===== -->
  <text x="20" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">④ get(3, C) → 6</text>

  <rect x="20" y="186" width="520" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <text x="40" y="206" font-size="10" fill="#333">C3.is_sum=true → 沿 refs 递归（memo 已清空，全新计算）：</text>

  <!-- formula evaluation chain -->
  <rect x="40" y="214" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="229" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">C3</text>

  <text x="88" y="229" font-size="11" fill="#555">=</text>

  <rect x="100" y="214" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="118" y="229" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">A1</text>
  <text x="118" y="252" text-anchor="middle" font-size="8" fill="#446688">=2</text>

  <text x="142" y="229" font-size="11" fill="#555">+</text>

  <rect x="152" y="214" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="170" y="229" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">A1</text>
  <text x="170" y="252" text-anchor="middle" font-size="8" fill="#4a7a3a">memo命中!</text>

  <text x="194" y="229" font-size="11" fill="#555">+</text>

  <rect x="204" y="214" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="222" y="229" text-anchor="middle" font-size="9" fill="#888">B1</text>
  <text x="222" y="252" text-anchor="middle" font-size="8" fill="#888">=0</text>

  <text x="246" y="229" font-size="11" fill="#555">+</text>

  <rect x="258" y="214" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="276" y="229" text-anchor="middle" font-size="9" fill="#888">A2</text>
  <text x="276" y="252" text-anchor="middle" font-size="8" fill="#888">=0</text>

  <text x="300" y="229" font-size="11" fill="#555">+</text>

  <rect x="312" y="214" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="229" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">B2</text>
  <text x="330" y="252" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">=2 ✓新值</text>

  <text x="356" y="229" font-size="11" fill="#555">=</text>

  <rect x="370" y="214" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2+2+0+0+2=6</text>

  <!-- ===== Bottom note ===== -->
  <rect x="20" y="278" width="520" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="300" font-size="10" fill="#333" font-weight="bold">核心看点</text>
  <text x="40" y="316" font-size="10" fill="#333">③ <tspan fill="#d6a040" font-weight="bold">set 只改 B2 一格</tspan>，完全没碰 C3 的公式 → ④ 重新 get 时 B2 已是 2，和自动变 6</text>
  <text x="40" y="330" font-size="10" fill="#333">第 2 个 A1 命中 memo 不重算 → <tspan fill="#4a7a3a" font-weight="bold">共享子表达式不爆炸</tspan>，整次 get O(V)</text>

  <!-- timeline -->
  <rect x="20" y="352" width="520" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="372" font-size="10" fill="#446688" font-weight="bold">时间线摘要</text>
  <text x="40" y="388" font-size="10" fill="#333">① A1=2  ②  C3=公式,返回4  ③  B2=2（C3不动）  ④  get(C3)=6（懒重算,看到B2新值）</text>
  <text x="40" y="400" font-size="10" fill="#b85450">set/sum 不传播 → get 按需重算 → 正确性自然成立</text>
</svg>
