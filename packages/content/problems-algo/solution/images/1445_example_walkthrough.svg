<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：每日 apples − oranges → diff</text>
  <text x="330" y="42" text-anchor="middle" font-size="10.5" fill="#888">条件聚合把同日两行 (+苹果, −桔子) 压成一个带符号求和</text>

  <!-- Column headers -->
  <rect x="20" y="54" width="620" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="72" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">sale_date</text>
  <text x="210" y="72" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">apples</text>
  <text x="310" y="72" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">oranges</text>
  <text x="420" y="72" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">符号化</text>
  <text x="530" y="72" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">求和</text>
  <text x="610" y="72" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">diff</text>

  <!-- ===== Day 1 ===== -->
  <rect x="20" y="82" width="620" height="32" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="102" text-anchor="middle" font-size="11" fill="#333">2020-05-01</text>
  <text x="210" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="310" y="102" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">8</text>
  <text x="420" y="102" text-anchor="middle" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">+10, −8</text>
  <text x="530" y="102" text-anchor="middle" font-size="10.5" fill="#555">10 − 8</text>
  <rect x="585" y="86" width="50" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="610" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Day 2 ===== -->
  <rect x="20" y="114" width="620" height="32" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="134" text-anchor="middle" font-size="11" fill="#333">2020-05-02</text>
  <text x="210" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">15</text>
  <text x="310" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">17</text>
  <text x="420" y="134" text-anchor="middle" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">+15, −17</text>
  <text x="530" y="134" text-anchor="middle" font-size="10.5" fill="#555">15 − 17</text>
  <rect x="585" y="118" width="50" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="610" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2</text>

  <!-- ===== Day 3 ===== -->
  <rect x="20" y="146" width="620" height="32" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="166" text-anchor="middle" font-size="11" fill="#333">2020-05-03</text>
  <text x="210" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">20</text>
  <text x="310" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="420" y="166" text-anchor="middle" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">+20, −0</text>
  <text x="530" y="166" text-anchor="middle" font-size="10.5" fill="#555">20 − 0</text>
  <rect x="585" y="150" width="50" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="610" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">20</text>

  <!-- Arrow down -->
  <path d="M 330 184 L 330 200" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <polygon points="325,200 335,200 330,208" fill="#446688" filter="url(#rough2)"/>
  <text x="380" y="198" font-size="10" fill="#446688">↑ GROUP BY sale_date + 条件聚合</text>

  <!-- Note box 1: 符号化 -->
  <rect x="40" y="214" width="580" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="232" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤 ①：行内符号化</text>
  <text x="330" y="250" text-anchor="middle" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">fruit='apples' → +sold_num；fruit='oranges' → −sold_num</text>

  <!-- Note box 2: SUM -->
  <rect x="40" y="266" width="580" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤 ②：组内 SUM 求和</text>
  <text x="330" y="302" text-anchor="middle" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">SUM(IF(fruit='apples', sold_num, -sold_num)) → 同日两行合并为一个 diff</text>

  <!-- Note box 3: output -->
  <rect x="40" y="318" width="580" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="336" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤 ③：SELECT sale_date, diff  ORDER BY sale_date</text>
  <text x="330" y="354" text-anchor="middle" font-size="10.5" fill="#555">3 天 → 3 行结果；正数表示苹果多，负数表示桔子多</text>

  <!-- Footer -->
  <text x="330" y="384" text-anchor="middle" font-size="10.5" fill="#888">关键：把“两类相减”改写为“同列带符号求和”，一次 GROUP BY 即得每日差值</text>
  <text x="330" y="402" text-anchor="middle" font-size="10" fill="#aaa">05-03 的 oranges=0 行仍参与聚合（−0=0），不影响结果但保证该日有桔子记录</text>
</svg>
