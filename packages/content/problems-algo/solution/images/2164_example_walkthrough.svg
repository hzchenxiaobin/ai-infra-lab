<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：[4,1,2,3] → [2,3,4,1] 与 [2,1] → [2,1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">分组 → 排序 → 回填（蓝=偶数下标，橙=奇数下标）</text>

  <!-- ===== Example 1: nums = [4,1,2,3] (left) ===== -->
  <text x="140" y="72" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">示例 1：nums = [4,1,2,3]</text>

  <!-- index labels -->
  <text x="44" y="92" text-anchor="middle" font-size="8.5" fill="#888">0</text>
  <text x="80" y="92" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="116" y="92" text-anchor="middle" font-size="8.5" fill="#888">2</text>
  <text x="152" y="92" text-anchor="middle" font-size="8.5" fill="#888">3</text>

  <!-- original -->
  <rect x="26" y="98" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="62" y="98" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="98" y="98" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="134" y="98" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- split arrows -->
  <path d="M 44 128 L 44 144" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 116 128 L 116 144" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 80 128 L 80 170" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 152 128 L 152 170" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- even group -->
  <text x="20" y="150" font-size="9.5" fill="#446688" font-weight="bold">偶</text>
  <rect x="26" y="148" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="62" y="148" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="116" y="166" text-anchor="middle" font-size="9.5" fill="#888">→ 升序</text>

  <!-- odd group -->
  <text x="20" y="184" font-size="9.5" fill="#d6a040" font-weight="bold">奇</text>
  <rect x="62" y="174" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="134" y="174" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="116" y="192" text-anchor="middle" font-size="9.5" fill="#888">→ 降序</text>

  <!-- sort arrows -->
  <path d="M 80 178 L 80 210" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 116 178 L 116 210" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sorted groups -->
  <rect x="26" y="214" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="62" y="214" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="80" y="252" text-anchor="middle" font-size="9" fill="#4a7a3a">[2,4]</text>

  <rect x="62" y="214" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="98" y="214" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="134" y="214" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="116" y="252" text-anchor="middle" font-size="9" fill="#b85450">[3,1]</text>

  <!-- merge arrows -->
  <path d="M 44 244 L 44 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 80 244 L 80 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 116 244 L 116 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 244 L 152 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="26" y="268" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="62" y="268" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="98" y="268" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="134" y="268" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="36" y="306" width="124" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="98" y="327" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">[2, 3, 4, 1] ✓</text>

  <!-- vertical divider -->
  <line x1="290" y1="60" x2="290" y2="340" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 2: nums = [2,1] (right) ===== -->
  <text x="430" y="72" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">示例 2：nums = [2,1]</text>

  <!-- index labels -->
  <text x="370" y="92" text-anchor="middle" font-size="8.5" fill="#888">0</text>
  <text x="406" y="92" text-anchor="middle" font-size="8.5" fill="#888">1</text>

  <!-- original -->
  <rect x="352" y="98" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="388" y="98" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- split arrows -->
  <path d="M 370 128 L 370 160" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 406 128 L 406 160" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- even group (single) -->
  <text x="332" y="148" font-size="9.5" fill="#446688" font-weight="bold">偶</text>
  <rect x="352" y="164" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="404" y="180" font-size="9" fill="#888">单元素</text>
  <text x="404" y="192" font-size="9" fill="#888">排序不变</text>

  <!-- odd group (single) -->
  <text x="332" y="184" font-size="9.5" fill="#d6a040" font-weight="bold">奇</text>
  <rect x="388" y="164" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- sort arrows (no change) -->
  <path d="M 370 194 L 370 214" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 406 194 L 406 214" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sorted (same) -->
  <rect x="352" y="218" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="370" y="256" text-anchor="middle" font-size="9" fill="#4a7a3a">[2]</text>
  <rect x="388" y="218" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="406" y="256" text-anchor="middle" font-size="9" fill="#b85450">[1]</text>

  <!-- merge arrows -->
  <path d="M 370 248 L 370 268" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 406 248 L 406 268" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="352" y="272" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="388" y="272" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="362" y="310" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="408" y="331" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">[2, 1] ✓</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="350" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：奇偶下标不相交 → 两组独立排序 → 回填原位</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#888">单元素组排序为空操作，n=1 或 n=2 时结果可能与原数组相同</text>
</svg>
