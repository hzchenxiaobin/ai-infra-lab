<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">马的 8 种走法（L 形）与 Warnsdorff 启发式</text>

  <!-- 5x5 grid, origin (180,70), cell=40 -->
  <g filter="url(#rough2)">
    <!-- all cells light -->
    <!-- landing cells (green) -->
    <rect x="220" y="70"  width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="70"  width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="180" y="110" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="340" y="110" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="180" y="190" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="340" y="190" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="220" y="230" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="230" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <!-- empty cells (white) -->
    <rect x="180" y="70"  width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="260" y="70"  width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="220" y="110" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="260" y="110" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="300" y="110" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="220" y="150" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="260" y="150" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="300" y="150" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="180" y="150" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="340" y="150" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="180" y="190" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="220" y="190" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="260" y="190" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="300" y="190" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="340" y="190" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="260" y="230" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="180" y="230" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <rect x="340" y="230" width="40" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <!-- redraw landing cells on top (green) -->
    <rect x="220" y="70"  width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="70"  width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="180" y="110" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="340" y="110" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="180" y="190" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="340" y="190" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="220" y="230" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="230" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <!-- knight center (blue) -->
    <rect x="260" y="150" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="280" y="176" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">马</text>
  </g>

  <!-- 8 arrows from center (280,170) to landing cell centers -->
  <g stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <path d="M 280 170 Q 250 120 240 90"   marker-end="url(#arrG)"/>
    <path d="M 280 170 Q 310 120 320 90"   marker-end="url(#arrG)"/>
    <path d="M 280 170 Q 230 150 200 130"  marker-end="url(#arrG)"/>
    <path d="M 280 170 Q 330 150 360 130"  marker-end="url(#arrG)"/>
    <path d="M 280 170 Q 230 190 200 210"  marker-end="url(#arrG)"/>
    <path d="M 280 170 Q 330 190 360 210"  marker-end="url(#arrG)"/>
    <path d="M 280 170 Q 250 220 240 250"  marker-end="url(#arrG)"/>
    <path d="M 280 170 Q 310 220 320 250"  marker-end="url(#arrG)"/>
  </g>

  <!-- degree labels on landing cells -->
  <g font-size="10" fill="#4a7a3a" filter="url(#rough2)">
    <text x="240" y="92"  text-anchor="middle">出2</text>
    <text x="320" y="92"  text-anchor="middle">出2</text>
    <text x="200" y="132" text-anchor="middle">出3</text>
    <text x="360" y="132" text-anchor="middle">出3</text>
    <text x="200" y="212" text-anchor="middle">出3</text>
    <text x="360" y="212" text-anchor="middle">出3</text>
    <text x="240" y="252" text-anchor="middle">出2</text>
    <text x="320" y="252" text-anchor="middle">出2</text>
  </g>

  <!-- Warnsdorff principle box -->
  <rect x="70" y="300" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">Warnsdorff 启发式</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">下一步优先走「出度最小」的格子——出路少的先走，避免把自己逼进死胡同</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="90" y="362" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="115" y="374" font-size="11" fill="#555">当前马的位置（step k）</text>
    <rect x="270" y="362" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="295" y="374" font-size="11" fill="#555">可达的下一步（标出度）</text>
  </g>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">出度 = 该格未访问的合法马步数；Warnsdorff 用贪心把“难走的格子”先消化掉</text>
</svg>
