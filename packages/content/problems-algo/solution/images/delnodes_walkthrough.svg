<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[1,2,3,4,5,6,7] 删除 [3,5]，DFS 逐节点处理</text>

  <!-- 左侧：小树 + 步骤编号 -->
  <text x="85" y="52" text-anchor="middle" font-size="11" fill="#888">前序访问顺序</text>

  <!-- 连线 -->
  <line x1="78" y1="88" x2="66" y2="110" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="92" y1="88" x2="104" y2="110" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="56" y1="130" x2="48" y2="155" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="68" y1="130" x2="76" y2="155" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="102" y1="130" x2="94" y2="155" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="114" y1="130" x2="122" y2="155" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="85" cy="75" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="79" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="103" y="68" font-size="9" fill="#4a7a3a">①</text>

  <circle cx="62" cy="120" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="124" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="78" y="114" font-size="9" fill="#555">②</text>

  <circle cx="108" cy="120" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="108" y="124" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="124" y="114" font-size="9" fill="#b85450">⑤</text>

  <circle cx="48" cy="165" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="48" y="168" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="62" y="162" font-size="9" fill="#555">③</text>

  <circle cx="80" cy="165" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="168" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="94" y="162" font-size="9" fill="#b85450">④</text>

  <circle cx="96" cy="165" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="96" y="168" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="110" y="162" font-size="9" fill="#4a7a3a">⑥</text>

  <circle cx="124" cy="165" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="124" y="168" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="138" y="162" font-size="9" fill="#4a7a3a">⑦</text>

  <!-- 右侧：表格 -->
  <!-- 表头 -->
  <rect x="170" y="48" width="440" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="192" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
  <text x="242" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="300" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">is_root</text>
  <text x="392" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">操作</text>
  <text x="525" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">forest</text>
  <line x1="214" y1="48" x2="214" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="270" y1="48" x2="270" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="330" y1="48" x2="330" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="455" y1="48" x2="455" y2="74" stroke="#fafafa" stroke-width="1"/>

  <!-- 行 ① 1 True -->
  <rect x="170" y="74" width="440" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="192" y="92" text-anchor="middle" font-size="10" fill="#333">①</text>
  <text x="242" y="92" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="300" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">True</text>
  <text x="392" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a">加入森林</text>
  <text x="525" y="92" text-anchor="middle" font-size="10" fill="#333">[1]</text>

  <!-- 行 ② 2 False -->
  <rect x="170" y="102" width="440" height="28" fill="#f5f5f5" filter="url(#rough2)"/>
  <text x="192" y="120" text-anchor="middle" font-size="10" fill="#333">②</text>
  <text x="242" y="120" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="300" y="120" text-anchor="middle" font-size="10" fill="#888">False</text>
  <text x="392" y="120" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="525" y="120" text-anchor="middle" font-size="10" fill="#333">[1]</text>

  <!-- 行 ③ 4 False -->
  <rect x="170" y="130" width="440" height="28" fill="#f5f5f5" filter="url(#rough2)"/>
  <text x="192" y="148" text-anchor="middle" font-size="10" fill="#333">③</text>
  <text x="242" y="148" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="300" y="148" text-anchor="middle" font-size="10" fill="#888">False</text>
  <text x="392" y="148" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="525" y="148" text-anchor="middle" font-size="10" fill="#333">[1]</text>

  <!-- 行 ④ 5 False 删除 -->
  <rect x="170" y="158" width="440" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="192" y="176" text-anchor="middle" font-size="10" fill="#333">④</text>
  <text x="242" y="176" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="300" y="176" text-anchor="middle" font-size="10" fill="#888">False</text>
  <text x="392" y="176" text-anchor="middle" font-size="10" fill="#b85450">删除 → return null</text>
  <text x="525" y="176" text-anchor="middle" font-size="10" fill="#333">[1]</text>

  <!-- 行 ⑤ 3 False 删除 -->
  <rect x="170" y="186" width="440" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="192" y="204" text-anchor="middle" font-size="10" fill="#333">⑤</text>
  <text x="242" y="204" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="300" y="204" text-anchor="middle" font-size="10" fill="#888">False</text>
  <text x="392" y="204" text-anchor="middle" font-size="10" fill="#b85450">删除 → return null</text>
  <text x="525" y="204" text-anchor="middle" font-size="10" fill="#333">[1]</text>

  <!-- 行 ⑥ 6 True 加入 -->
  <rect x="170" y="214" width="440" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="192" y="232" text-anchor="middle" font-size="10" fill="#333">⑥</text>
  <text x="242" y="232" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="300" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">True</text>
  <text x="392" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a">加入森林</text>
  <text x="525" y="232" text-anchor="middle" font-size="10" fill="#333">[1, 6]</text>

  <!-- 行 ⑦ 7 True 加入 -->
  <rect x="170" y="242" width="440" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="192" y="260" text-anchor="middle" font-size="10" fill="#333">⑦</text>
  <text x="242" y="260" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="300" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">True</text>
  <text x="392" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a">加入森林</text>
  <text x="525" y="260" text-anchor="middle" font-size="10" fill="#333">[1, 6, 7]</text>

  <!-- 表格边框 -->
  <rect x="170" y="48" width="440" height="222" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="214" y1="74" x2="214" y2="270" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="74" x2="270" y2="270" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="74" x2="330" y2="270" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="455" y1="74" x2="455" y2="270" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="40" y="290" width="570" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="325" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 forest = [1, 6, 7] ✓</text>
  <text x="325" y="332" text-anchor="middle" font-size="10" fill="#555">原根 1 未删→保留；删 3→子 6、7 升为新根；删 5→无子无新树</text>

  <!-- 关键观察 -->
  <rect x="40" y="358" width="570" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="325" y="378" text-anchor="middle" font-size="10" fill="#555">⑤ 删 3 时 is_root=False 不入森林，但其子 ⑥⑦ 收到 is_root=True</text>
  <text x="325" y="396" text-anchor="middle" font-size="10" fill="#555">返回 null = 向父节点断边；is_root=True 且未删 = 入森林</text>
</svg>
