<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：153（true）vs 123（false）</text>

  <!-- ===== Example A: n = 153 ===== -->
  <text x="40" y="50" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1：n = 153，k = 3</text>

  <!-- column headers -->
  <text x="60" y="72" text-anchor="middle" font-size="10" fill="#888">位</text>
  <text x="140" y="72" text-anchor="middle" font-size="10" fill="#888">digit</text>
  <text x="250" y="72" text-anchor="middle" font-size="10" fill="#888">digit^3</text>
  <text x="360" y="72" text-anchor="middle" font-size="10" fill="#888">sum 累计</text>

  <line x1="20" y1="78" x2="520" y2="78" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: digit 1 -->
  <text x="60" y="100" text-anchor="middle" font-size="11" fill="#999">百位</text>
  <rect x="118" y="86" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="140" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="200" y="103" font-size="11" fill="#888">→</text>
  <rect x="220" y="86" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="250" y="103" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="310" y="103" font-size="11" fill="#888">→</text>
  <text x="360" y="103" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 2: digit 5 -->
  <text x="60" y="134" text-anchor="middle" font-size="11" fill="#999">十位</text>
  <rect x="118" y="120" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="140" y="137" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="200" y="137" font-size="11" fill="#888">→</text>
  <rect x="220" y="120" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="250" y="137" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">125</text>
  <text x="310" y="137" font-size="11" fill="#888">→</text>
  <text x="360" y="137" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">126</text>

  <!-- row 3: digit 3 -->
  <text x="60" y="168" text-anchor="middle" font-size="11" fill="#999">个位</text>
  <rect x="118" y="154" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="140" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="200" y="171" font-size="11" fill="#888">→</text>
  <rect x="220" y="154" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="250" y="171" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">27</text>
  <text x="310" y="171" font-size="11" fill="#888">→</text>
  <text x="360" y="171" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">153</text>

  <line x1="20" y1="184" x2="520" y2="184" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- compare for 153 -->
  <path d="M 360 188 L 360 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="204" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="223" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">sum=153 == n=153 → true</text>

  <!-- ===== Divider ===== -->
  <line x1="40" y1="252" x2="500" y2="252" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example B: n = 123 ===== -->
  <text x="40" y="274" font-size="12" fill="#b85450" font-weight="bold">示例 2：n = 123，k = 3</text>

  <!-- column headers -->
  <text x="60" y="296" text-anchor="middle" font-size="10" fill="#888">位</text>
  <text x="140" y="296" text-anchor="middle" font-size="10" fill="#888">digit</text>
  <text x="250" y="296" text-anchor="middle" font-size="10" fill="#888">digit^3</text>
  <text x="360" y="296" text-anchor="middle" font-size="10" fill="#888">sum 累计</text>

  <line x1="20" y1="302" x2="520" y2="302" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: digit 1 -->
  <text x="60" y="324" text-anchor="middle" font-size="11" fill="#999">百位</text>
  <rect x="118" y="310" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="140" y="327" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="200" y="327" font-size="11" fill="#888">→</text>
  <rect x="220" y="310" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="250" y="327" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="310" y="327" font-size="11" fill="#888">→</text>
  <text x="360" y="327" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 2: digit 2 -->
  <text x="60" y="358" text-anchor="middle" font-size="11" fill="#999">十位</text>
  <rect x="118" y="344" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="140" y="361" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="200" y="361" font-size="11" fill="#888">→</text>
  <rect x="220" y="344" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="250" y="361" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">8</text>
  <text x="310" y="361" font-size="11" fill="#888">→</text>
  <text x="360" y="361" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- row 3: digit 3 -->
  <text x="60" y="392" text-anchor="middle" font-size="11" fill="#999">个位</text>
  <rect x="118" y="378" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="140" y="395" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="200" y="395" font-size="11" fill="#888">→</text>
  <rect x="220" y="378" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="250" y="395" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">27</text>
  <text x="310" y="395" font-size="11" fill="#888">→</text>
  <text x="360" y="395" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">36</text>

  <line x1="20" y1="408" x2="520" y2="408" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- compare for 123 -->
  <path d="M 360 412 L 360 424" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="428" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="447" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">sum=36 ≠ n=123 → false</text>

  <!-- bottom note -->
  <rect x="60" y="464" width="420" height="12" fill="none" stroke="none"/>
  <text x="270" y="474" text-anchor="middle" font-size="10" fill="#888">同样 k=3，153 各位幂和恰好回环，123 则远远不够</text>
</svg>
