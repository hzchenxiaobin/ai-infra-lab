<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">「强度严格减小」⟺ 至少一列位被「整列清空」</text>

  <!-- 列头 -->
  <text x="132" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">位(4)</text>
  <text x="182" y="70" text-anchor="middle" font-size="12" fill="#a06a20" filter="url(#rough2)">位(2)</text>
  <text x="232" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">位(1)</text>

  <!-- 行: 7 = 111 -->
  <text x="102" y="108" text-anchor="end" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="112" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="162" y="88" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="212" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="182" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="232" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行: 4 = 100 -->
  <text x="102" y="146" text-anchor="end" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="112" y="126" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="162" y="126" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="212" y="126" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="182" y="146" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="232" y="146" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <!-- 行: 6 = 110 -->
  <text x="102" y="184" text-anchor="end" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="112" y="164" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="162" y="164" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="212" y="164" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="182" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="232" y="184" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <!-- S 行 -->
  <rect x="112" y="204" width="140" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="182" y="223" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">S = 7（111）</text>

  <!-- 高亮位(2)列 -->
  <rect x="157" y="83" width="50" height="117" rx="8" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="182" y="255" text-anchor="middle" font-size="12" fill="#a06a20" filter="url(#rough2)">E(2) = {7, 6}</text>

  <!-- 箭头 -->
  <path d="M 260 128 C 278 128, 284 118, 296 112" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 240 C 278 240, 284 244, 296 248" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 有效框 -->
  <rect x="300" y="84" width="196" height="90" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="315" y="107" font-size="13" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">✓ 有效：整列清空</text>
  <text x="315" y="130" font-size="12" fill="#333" filter="url(#rough2)">删 {7, 6}：位(2) 载体全走</text>
  <text x="315" y="152" font-size="12" fill="#333" filter="url(#rough2)">剩 [4]，OR = 4 &lt; 7</text>

  <!-- 无效框 -->
  <rect x="300" y="200" width="196" height="90" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="315" y="223" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✗ 无效：漏了载体</text>
  <text x="315" y="246" font-size="12" fill="#333" filter="url(#rough2)">只删 {6}，位(2) 还有 7 撑着</text>
  <text x="315" y="268" font-size="12" fill="#333" filter="url(#rough2)">剩 [7, 4]，OR = 7 不变</text>

  <!-- 底注 -->
  <rect x="52" y="296" width="416" height="44" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">E(b) = 含位 b 的全部元素（载体集合）</text>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">移除集 R 有效 ⟺ R ⊇ E(b)（至少一个 b）</text>
</svg>
