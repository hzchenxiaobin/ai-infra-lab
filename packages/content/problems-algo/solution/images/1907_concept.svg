<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：三个薪水区间 + 强制输出 3 行</text>

  <!-- Number line -->
  <line x1="40" y1="120" x2="540" y2="120" stroke="#666" stroke-width="2" filter="url(#rough2)"/>

  <!-- Low Salary zone -->
  <rect x="40" y="90" width="150" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="115" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Low Salary</text>
  <text x="115" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">income &lt; 20000</text>
  <text x="115" y="140" text-anchor="middle" font-size="9" fill="#888">严格低于</text>

  <!-- Average Salary zone -->
  <rect x="190" y="90" width="200" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Average Salary</text>
  <text x="290" y="124" text-anchor="middle" font-size="10" fill="#446688">20000 ≤ income ≤ 50000</text>
  <text x="290" y="140" text-anchor="middle" font-size="9" fill="#888">含两端（闭区间）</text>

  <!-- High Salary zone -->
  <rect x="390" y="90" width="150" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="465" y="108" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">High Salary</text>
  <text x="465" y="124" text-anchor="middle" font-size="10" fill="#d6a040">income &gt; 50000</text>
  <text x="465" y="140" text-anchor="middle" font-size="9" fill="#888">严格大于</text>

  <!-- Threshold markers -->
  <line x1="190" y1="82" x2="190" y2="158" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="190" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">20000</text>

  <line x1="390" y1="82" x2="390" y2="158" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="390" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">50000</text>

  <!-- Arrow down -->
  <path d="M 290 160 L 290 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Key challenge -->
  <rect x="40" y="186" width="500" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="208" font-size="12" fill="#b85450" font-weight="bold">⚠️ 关键挑战：必须输出全部 3 个类别，即使某类账户数为 0</text>
  <text x="60" y="226" font-size="10.5" fill="#666">普通 GROUP BY + CASE 会丢失计数为 0 的行 → 需「无 GROUP BY 的聚合」或「补全类别表」</text>

  <!-- Arrow down -->
  <path d="M 290 244 L 290 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Solution insight -->
  <rect x="40" y="270" width="500" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="292" font-size="12" fill="#4a7a3a" font-weight="bold">💡 破题关键：无 GROUP BY 的聚合恒返回 1 行</text>
  <text x="60" y="312" font-size="10.5" fill="#555">SELECT COUNT(*) FROM Accounts WHERE income &lt; 20000</text>
  <text x="60" y="328" font-size="10" fill="#888">→ 即使无匹配行，COUNT(*) 返回 0，仍输出 1 行 (category, 0)</text>
  <text x="60" y="348" font-size="10.5" fill="#555">3 个这样的子查询 UNION ALL → 恒定 3 行，天然补零</text>
  <text x="60" y="368" font-size="10" fill="#4a7a3a" font-weight="bold">→ 无需 LEFT JOIN / IFNULL，结构最简洁</text>
</svg>
