<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：expression = "247+38"</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">num1="247"（i=0,1,2）· num2="38"（j=1,2）→ 6 种组合</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="54" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <rect x="80" y="54" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">j</text>
  <rect x="130" y="54" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="205" y="70" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">表达式 a(b+c)d</text>
  <rect x="280" y="54" width="210" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="385" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">求值 A×(B+C)×D</text>
  <rect x="490" y="54" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="515" y="70" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">值</text>

  <!-- ===== Row 1: i=0, j=1 ===== -->
  <rect x="30" y="82" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="100" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="80" y="82" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="130" y="82" width="150" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="100" text-anchor="middle" font-size="11" fill="#333">(247+3)8</text>
  <rect x="280" y="82" width="210" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="100" text-anchor="middle" font-size="10.5" fill="#555">1×(247+3)×8</text>
  <rect x="490" y="82" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="100" text-anchor="middle" font-size="11" fill="#333">2000</text>

  <!-- ===== Row 2: i=0, j=2 ===== -->
  <rect x="30" y="112" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="130" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="80" y="112" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="130" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="130" y="112" width="150" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="130" text-anchor="middle" font-size="11" fill="#333">(247+38)</text>
  <rect x="280" y="112" width="210" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="130" text-anchor="middle" font-size="10.5" fill="#555">1×(247+38)×1</text>
  <rect x="490" y="112" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="130" text-anchor="middle" font-size="11" fill="#333">285</text>

  <!-- ===== Row 3: i=1, j=1 ===== -->
  <rect x="30" y="142" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="160" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="142" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="160" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="130" y="142" width="150" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="160" text-anchor="middle" font-size="11" fill="#333">2(47+3)8</text>
  <rect x="280" y="142" width="210" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="160" text-anchor="middle" font-size="10.5" fill="#555">2×(47+3)×8</text>
  <rect x="490" y="142" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="160" text-anchor="middle" font-size="11" fill="#333">800</text>

  <!-- ===== Row 4: i=1, j=2  ===== HIGHLIGHTED BEST ===== -->
  <rect x="30" y="172" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="192" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="80" y="172" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="192" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="130" y="172" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2(47+38)</text>
  <rect x="280" y="172" width="210" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="385" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2×(47+38)×1</text>
  <rect x="490" y="172" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="515" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">170</text>

  <!-- ===== Row 5: i=2, j=1 ===== -->
  <rect x="30" y="208" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="226" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="208" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="226" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="130" y="208" width="150" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="226" text-anchor="middle" font-size="11" fill="#333">24(7+3)8</text>
  <rect x="280" y="208" width="210" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="226" text-anchor="middle" font-size="10.5" fill="#555">24×(7+3)×8</text>
  <rect x="490" y="208" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="226" text-anchor="middle" font-size="11" fill="#333">1920</text>

  <!-- ===== Row 6: i=2, j=2 ===== -->
  <rect x="30" y="238" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="256" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="238" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="256" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="130" y="238" width="150" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="256" text-anchor="middle" font-size="11" fill="#333">24(7+38)</text>
  <rect x="280" y="238" width="210" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="256" text-anchor="middle" font-size="10.5" fill="#555">24×(7+38)×1</text>
  <rect x="490" y="238" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="256" text-anchor="middle" font-size="11" fill="#333">1080</text>

  <!-- ===== Conclusion ===== -->
  <path d="M 515 268 L 515 290 L 280 290 L 280 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="304" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最小值 = 170（i=1, j=2）→ 返回 "2(47+38)"</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#555">A=2 拆出 b="47" 让和骤降 200，远超 ×2 代价；D=1（d 空）省去尾部乘数</text>

  <!-- ===== Insight box ===== -->
  <rect x="60" y="362" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">关键张力：让 A/D 变小（缩短前缀/后缀）会让 B/C 变大（和增大）</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#555">乘法耦合 → 无单调性 → 必须枚举，但组合数 ≤ 25 足够小</text>
</svg>
