<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=8 的完整配对过程</text>

  <!-- ===== Round 0: initial array ===== -->
  <text x="40" y="62" font-size="11" fill="#888">R0  n=8</text>
  <!-- 8 cells: centers at 105,155,205,255,305,355,405,455 -->
  <rect x="85" y="50" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="68" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="135" y="50" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="68" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="185" y="50" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="68" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="235" y="50" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="68" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="285" y="50" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="68" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="335" y="50" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="68" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="385" y="50" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="68" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="435" y="50" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="68" text-anchor="middle" font-size="12" fill="#333">8</text>

  <!-- Pairing arcs: 0↔7, 1↔6, 2↔5, 3↔4 -->
  <path d="M 105 78 Q 280 115 455 78" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 155 78 Q 255 108 355 78" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 205 78 Q 255 100 305 78" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 255 78 Q 255 92 305 78" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Down arrow -->
  <path d="M 280 118 L 280 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="133" font-size="10" fill="#888">pair i ↔ n−1−i</text>

  <!-- ===== Round 1: 4 cells ===== -->
  <text x="40" y="168" font-size="11" fill="#888">R1  n=4</text>
  <!-- centers at 145, 255, 335, 415 -->
  <rect x="105" y="156" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="174" text-anchor="middle" font-size="11" fill="#333">(1,8)</text>
  <rect x="215" y="156" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="255" y="174" text-anchor="middle" font-size="11" fill="#333">(2,7)</text>
  <rect x="295" y="156" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="335" y="174" text-anchor="middle" font-size="11" fill="#333">(3,6)</text>
  <rect x="375" y="156" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="174" text-anchor="middle" font-size="11" fill="#333">(4,5)</text>

  <!-- Pairing arcs: 0↔3, 1↔2 -->
  <path d="M 145 184 Q 280 215 415 184" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 255 184 Q 295 205 335 184" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Down arrow -->
  <path d="M 280 218 L 280 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="233" font-size="10" fill="#888">pair i ↔ n−1−i</text>

  <!-- ===== Round 2: 2 cells ===== -->
  <text x="40" y="268" font-size="11" fill="#888">R2  n=2</text>
  <rect x="105" y="256" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="274" text-anchor="middle" font-size="10" fill="#333">((1,8),(4,5))</text>
  <rect x="305" y="256" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="274" text-anchor="middle" font-size="10" fill="#333">((2,7),(3,6))</text>

  <!-- Pairing arc: 0↔1 -->
  <path d="M 180 284 Q 280 310 380 284" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Down arrow -->
  <path d="M 280 312 L 280 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="327" font-size="10" fill="#888">pair 0 ↔ 1</text>

  <!-- ===== Round 3: 1 cell ===== -->
  <text x="40" y="362" font-size="11" fill="#888">R3  n=1</text>
  <rect x="85" y="350" width="390" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#333">(((1,8),(4,5)),((2,7),(3,6)))</text>

  <!-- Checkmark -->
  <text x="490" y="370" font-size="16" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- Legend -->
  <text x="310" y="410" text-anchor="middle" font-size="10" fill="#888">蓝框=前半（保留）  绿框=后半（被配对后废弃）  虚弧线=配对关系</text>
  <text x="310" y="428" text-anchor="middle" font-size="10" fill="#888">每轮 team[i] ← "(" + team[i] + "," + team[n−1−i] + ")"，然后 n 减半</text>
</svg>
