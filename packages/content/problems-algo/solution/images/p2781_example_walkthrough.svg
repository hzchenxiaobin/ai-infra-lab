<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="520" fill="#fafafa"/>

  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：word = "cbaaaabc", forbidden = ["aaa", "cb"]</text>

  <!-- Column headers -->
  <text x="30" y="54" font-size="11" fill="#888" font-weight="bold">r</text>
  <text x="60" y="54" font-size="11" fill="#888" font-weight="bold">word[r]</text>
  <text x="120" y="54" font-size="11" fill="#888" font-weight="bold">检查子串</text>
  <text x="350" y="54" font-size="11" fill="#888" font-weight="bold">命中</text>
  <text x="430" y="54" font-size="11" fill="#888" font-weight="bold">left</text>
  <text x="470" y="54" font-size="11" fill="#888" font-weight="bold">窗口</text>
  <text x="660" y="54" font-size="11" fill="#888" font-weight="bold">ans</text>

  <!-- horizontal divider -->
  <line x1="20" y1="62" x2="700" y2="62" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row r=0: word[0]='c', check "c", no hit ===== -->
  <text x="35" y="80" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="65" y="80" font-size="11" fill="#333" font-weight="bold">c</text>
  <rect x="120" y="68" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="82" text-anchor="middle" font-size="10" fill="#333">"c"</text>
  <text x="350" y="80" font-size="10" fill="#4a7a3a">否</text>
  <text x="437" y="80" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="475" y="80" font-size="11" fill="#446688" font-weight="bold">c</text>
  <text x="665" y="80" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- ===== Row r=1: word[1]='b', check "b","cb", "cb" HIT! left=1 ===== -->
  <text x="35" y="112" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="65" y="112" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="120" y="100" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="114" text-anchor="middle" font-size="10" fill="#333">"b"</text>
  <rect x="170" y="100" width="44" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="192" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">"cb"</text>
  <text x="350" y="112" font-size="10" fill="#b85450" font-weight="bold">"cb" 命中!</text>
  <text x="430" y="112" font-size="10" fill="#b85450">0→1</text>
  <text x="475" y="112" font-size="11" fill="#446688" font-weight="bold">b</text>
  <text x="665" y="112" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- ===== Row r=2: word[2]='a', check "a","ba", no hit ===== -->
  <text x="35" y="144" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="65" y="144" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="120" y="132" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="146" text-anchor="middle" font-size="10" fill="#333">"a"</text>
  <rect x="170" y="132" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="192" y="146" text-anchor="middle" font-size="10" fill="#333">"ba"</text>
  <text x="350" y="144" font-size="10" fill="#4a7a3a">否</text>
  <text x="437" y="144" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="475" y="144" font-size="11" fill="#446688" font-weight="bold">ba</text>
  <text x="665" y="144" font-size="11" fill="#446688" font-weight="bold">2</text>

  <!-- ===== Row r=3: word[3]='a', check "a","aa","baa", no hit ===== -->
  <text x="35" y="176" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="65" y="176" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="120" y="164" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="178" text-anchor="middle" font-size="10" fill="#333">"a"</text>
  <rect x="170" y="164" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="192" y="178" text-anchor="middle" font-size="10" fill="#333">"aa"</text>
  <rect x="220" y="164" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="178" text-anchor="middle" font-size="10" fill="#333">"baa"</text>
  <text x="350" y="176" font-size="10" fill="#4a7a3a">否</text>
  <text x="437" y="176" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="475" y="176" font-size="11" fill="#446688" font-weight="bold">baa</text>
  <text x="665" y="176" font-size="11" fill="#446688" font-weight="bold">3</text>

  <!-- ===== Row r=4: word[4]='a', check "a","aa","aaa", "aaa" HIT! left=3 ===== -->
  <text x="35" y="208" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="65" y="208" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="120" y="196" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="210" text-anchor="middle" font-size="10" fill="#333">"a"</text>
  <rect x="170" y="196" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="192" y="210" text-anchor="middle" font-size="10" fill="#333">"aa"</text>
  <rect x="220" y="196" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="245" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">"aaa"</text>
  <text x="350" y="208" font-size="10" fill="#b85450" font-weight="bold">"aaa" 命中!</text>
  <text x="430" y="208" font-size="10" fill="#b85450">1→3</text>
  <text x="475" y="208" font-size="11" fill="#446688" font-weight="bold">a</text>
  <text x="665" y="208" font-size="11" fill="#446688" font-weight="bold">3</text>

  <!-- ===== Row r=5: word[5]='a', check "a","aa","aaa", "aaa" HIT! left=4 ===== -->
  <text x="35" y="240" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="65" y="240" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="120" y="228" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="242" text-anchor="middle" font-size="10" fill="#333">"a"</text>
  <rect x="170" y="228" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="192" y="242" text-anchor="middle" font-size="10" fill="#333">"aa"</text>
  <rect x="220" y="228" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="245" y="242" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">"aaa"</text>
  <text x="350" y="240" font-size="10" fill="#b85450" font-weight="bold">"aaa" 命中!</text>
  <text x="430" y="240" font-size="10" fill="#b85450">3→4</text>
  <text x="475" y="240" font-size="11" fill="#446688" font-weight="bold">a</text>
  <text x="665" y="240" font-size="11" fill="#446688" font-weight="bold">3</text>

  <!-- ===== Row r=6: word[6]='b', check "b","ab","aab", no hit ===== -->
  <text x="35" y="272" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="65" y="272" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="120" y="260" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="274" text-anchor="middle" font-size="10" fill="#333">"b"</text>
  <rect x="170" y="260" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="192" y="274" text-anchor="middle" font-size="10" fill="#333">"ab"</text>
  <rect x="220" y="260" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="274" text-anchor="middle" font-size="10" fill="#333">"aab"</text>
  <text x="350" y="272" font-size="10" fill="#4a7a3a">否</text>
  <text x="437" y="272" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="475" y="272" font-size="11" fill="#446688" font-weight="bold">aab</text>
  <text x="665" y="272" font-size="11" fill="#446688" font-weight="bold">3</text>

  <!-- ===== Row r=7: word[7]='c', check "c","bc","abc","aabc", no hit ===== -->
  <text x="35" y="304" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="65" y="304" font-size="11" fill="#333" font-weight="bold">c</text>
  <rect x="120" y="292" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="306" text-anchor="middle" font-size="10" fill="#333">"c"</text>
  <rect x="170" y="292" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="192" y="306" text-anchor="middle" font-size="10" fill="#333">"bc"</text>
  <rect x="220" y="292" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="306" text-anchor="middle" font-size="10" fill="#333">"abc"</text>
  <rect x="275" y="292" width="54" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="302" y="306" text-anchor="middle" font-size="10" fill="#333">"aabc"</text>
  <text x="350" y="304" font-size="10" fill="#4a7a3a">否</text>
  <text x="437" y="304" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="475" y="304" font-size="11" fill="#446688" font-weight="bold">aabc</text>
  <text x="665" y="304" font-size="14" fill="#b85450" font-weight="bold">4</text>

  <!-- divider before result -->
  <line x1="20" y1="320" x2="700" y2="320" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="200" y="340" width="320" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="360" y="362" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">最终答案：4</text>
  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a">最长合法子串 = "aabc"（不含 "aaa" 也不含 "cb"）</text>

  <!-- key observations -->
  <rect x="40" y="406" width="640" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="428" font-size="12" fill="#d6a040" font-weight="bold">关键观察</text>
  <text x="60" y="448" font-size="11" fill="#555">• r=1: "cb" 命中，left 从 0 跳到 1（越过 "cb" 的起点 0）</text>
  <text x="60" y="466" font-size="11" fill="#555">• r=4,5: "aaa" 连续命中，left 从 1→3→4（每次跳过 "aaa" 的起点）</text>
  <text x="60" y="484" font-size="11" fill="#555">• left 只增不减，每步最多查 10 个子串 → 整体 O(n)</text>
  <text x="60" y="500" font-size="11" fill="#555">• 命中禁忌词时跳到 right-len+2 而非 left+1，是"跳越式收缩"而非逐格挪动</text>
</svg>
