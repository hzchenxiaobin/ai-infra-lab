<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：前缀异或 + min-max 划分 DP</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1 · nums = [1, 2, 3]，k = 2 · 最优划分 [1] | [2, 3]</text>

  <!-- ============ Panel 1: nums / pre rows ============ -->
  <text x="34" y="72" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 前缀异或</text>

  <g filter="url(#rough2)">
    <!-- bracket over subarray [2,3] -->
    <path d="M 204 52 L 204 44 L 263 44 L 263 52" fill="none" stroke="#b85450" stroke-width="1.8"/>
    <text x="233" y="38" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">子数组 [2,3]</text>

    <!-- nums row -->
    <rect x="162" y="58" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="204" y="58" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="58" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="179" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <text x="221" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="263" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="179" y="98" text-anchor="middle" font-size="8" fill="#999">nums[0]</text>
    <text x="221" y="98" text-anchor="middle" font-size="8" fill="#999">nums[1]</text>
    <text x="263" y="98" text-anchor="middle" font-size="8" fill="#999">nums[2]</text>

    <!-- arrows nums[i] -> pre[i+1] -->
    <path d="M 179 88 L 179 104" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/>
    <path d="M 221 88 L 221 104" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/>
    <path d="M 263 88 L 263 104" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/>

    <!-- pre row, index 1 & 3 highlighted -->
    <rect x="120" y="108" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="162" y="108" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="204" y="108" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="108" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="137" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
    <text x="179" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <text x="221" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="263" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
    <text x="137" y="148" text-anchor="middle" font-size="8" fill="#999">pre[0]</text>
    <text x="179" y="148" text-anchor="middle" font-size="8" fill="#b85450">pre[1]</text>
    <text x="221" y="148" text-anchor="middle" font-size="8" fill="#999">pre[2]</text>
    <text x="263" y="148" text-anchor="middle" font-size="8" fill="#b85450">pre[3]</text>

    <!-- formula panel right -->
    <text x="330" y="96" text-anchor="middle" font-size="9" fill="#888">pre[i+1] = pre[i] ⊕ nums[i]</text>
    <rect x="298" y="106" width="190" height="34" fill="#f7f7f7" stroke="#aaa" stroke-width="1.3" rx="8"/>
    <text x="393" y="119" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold">XOR(2,3) = pre[3] ⊕ pre[1]</text>
    <text x="393" y="133" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">= 0 ⊕ 1 = 1 ✓</text>
    <text x="393" y="156" text-anchor="middle" font-size="8.5" fill="#666">任意子数组异或 → 两个 pre 值相减，O(1)</text>
  </g>

  <!-- ============ Panel 2: recurrence ============ -->
  <text x="60" y="184" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 状态转移（min-max 划分 DP）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="192" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="260" y="212" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold">dp[i][j] = min(t) max( dp[t][j−1] , pre[i] ⊕ pre[t] )</text>
    <text x="260" y="230" text-anchor="middle" font-size="9" fill="#555">dp[t][j−1]：前 t 个数分 j−1 段（子问题已最优）</text>
    <text x="260" y="243" text-anchor="middle" font-size="9" fill="#555">pre[i] ⊕ pre[t]：最后一段 (t, i] 的异或，O(1) 现算</text>
  </g>

  <!-- ============ Panel 3: boundary / answer ============ -->
  <g filter="url(#rough2)">
    <rect x="60" y="264" width="400" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="283" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">边界：dp[0][0] = 0（0 个数分 0 段）；j &gt; i 无效</text>
    <text x="260" y="303" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">答案 = dp[n][k]；本例 dp[3][2] = 1（划分 [1] | [2,3]）</text>
  </g>

  <!-- ============ Panel 4: min-max structure note ============ -->
  <g filter="url(#rough2)">
    <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">「最大值最小」= min 套 max 的两层结构</text>
    <text x="260" y="356" text-anchor="middle" font-size="9" fill="#666">内层 max：定下分割点 t 后，j 段里最坏的那段 · 外层 min：在所有 t 里挑最优分割</text>
    <text x="260" y="374" text-anchor="middle" font-size="8.5" fill="#999">⚠️ XOR 不随段延伸单调 ⇒ 410 题的「二分答案 + 贪心」在此失效，只能老老实实 DP</text>
  </g>
</svg>
