<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：栈顶 = 距 * 最近的左侧非星字符</text>

  <!-- ============ Scenario A: push a letter ============ -->
  <text x="310" y="52" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">情形 A　扫描到字母 → 入栈</text>

  <!-- input string "leet*" -->
  <g filter="url(#rough2)">
    <rect x="60"  y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="77"  y="83" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">l</text>
    <rect x="94"  y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="111" y="83" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">e</text>
    <rect x="128" y="64" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="145" y="83" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">e</text>
    <rect x="162" y="64" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="179" y="83" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">t</text>
    <rect x="196" y="64" width="34" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="213" y="83" text-anchor="middle" font-size="16" fill="#bbb" font-weight="bold">*</text>
  </g>
  <text x="179" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">▼</text>

  <!-- vertical stack (right): bottom-up l, e, e ; new t pushed on top -->
  <g filter="url(#rough2)">
    <rect x="430" y="160" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="452" y="179" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">l</text>
    <rect x="430" y="132" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="452" y="151" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">e</text>
    <rect x="430" y="104" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="452" y="123" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">e</text>
    <rect x="430" y="76" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="452" y="95" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">t</text>
  </g>
  <!-- push arrow: from input t (196,78) curving up-right to new top (430,90) -->
  <path d="M 196 78 C 300 48 380 56 428 88" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="42" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">push 入栈</text>
  <text x="500" y="95" font-size="11" fill="#888">← 栈顶（新）</text>
  <text x="500" y="179" font-size="11" fill="#888">← 栈底</text>

  <!-- divider -->
  <line x1="40" y1="196" x2="580" y2="196" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ============ Scenario B: pop on * ============ -->
  <text x="310" y="222" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">情形 B　扫描到 * → 弹出栈顶</text>

  <!-- input string "leet*" with * active (red) -->
  <g filter="url(#rough2)">
    <rect x="60"  y="234" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="77"  y="253" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">l</text>
    <rect x="94"  y="234" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="111" y="253" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">e</text>
    <rect x="128" y="234" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="145" y="253" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">e</text>
    <rect x="162" y="234" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="179" y="253" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">t</text>
    <rect x="196" y="234" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="213" y="253" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">*</text>
  </g>
  <text x="213" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">▼</text>

  <!-- vertical stack: l, e, e, t (t at top, red, being popped) -->
  <g filter="url(#rough2)">
    <rect x="430" y="330" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="452" y="349" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">l</text>
    <rect x="430" y="302" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="452" y="321" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">e</text>
    <rect x="430" y="274" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="452" y="293" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">e</text>
    <rect x="430" y="246" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="452" y="265" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">t</text>
  </g>
  <!-- pop arrow: from stack top (452,246) up & right out -->
  <path d="M 452 244 C 470 220 490 216 520 208" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="478" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">pop 弹出</text>
  <text x="500" y="265" font-size="11" fill="#888">← 栈顶（被删）</text>

  <!-- ============ Insight box ============ -->
  <rect x="40" y="378" width="540" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="402" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">栈的 LIFO 特性：最近入栈的恰是距 * 最近的左侧字符</text>
  <text x="310" y="422" text-anchor="middle" font-size="12" fill="#666">故一遍扫描：遇字母 push、遇 * pop，最后栈内拼接即答案</text>
</svg>
