<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="240" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, 9, 3]，从右向左扫描，最少 2 次替换</text>

  <!-- ====== 表格底色：表头 + 三行 ====== -->
  <rect x="10" y="44" width="640" height="36" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="10" y="80" width="640" height="38" fill="#eaf5ee" filter="url(#rough2)"/>
  <rect x="10" y="118" width="640" height="38" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="10" y="156" width="640" height="38" fill="#eaf5ee" filter="url(#rough2)"/>

  <!-- ====== 网格线 ====== -->
  <rect x="10" y="44" width="640" height="150" fill="none" stroke="#b0b0b0" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="50"  y1="44" x2="50"  y2="194" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="114" y1="44" x2="114" y2="194" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="198" y1="44" x2="198" y2="194" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="294" y1="44" x2="294" y2="194" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="434" y1="44" x2="434" y2="194" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="504" y1="44" x2="504" y2="194" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="564" y1="44" x2="564" y2="194" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10"  y1="80"  x2="650" y2="80"  stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10"  y1="118" x2="650" y2="118" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10"  y1="156" x2="650" y2="156" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>

  <!-- ====== 表头 ====== -->
  <g font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">
    <text x="30"  y="67" text-anchor="middle">i</text>
    <text x="82"  y="67" text-anchor="middle">nums[i]</text>
    <text x="156" y="67" text-anchor="middle">上限 v</text>
    <text x="246" y="67" text-anchor="middle">动作</text>
    <text x="364" y="67" text-anchor="middle">切分结果</text>
    <text x="469" y="67" text-anchor="middle">本步 ops</text>
    <text x="534" y="67" text-anchor="middle">累计</text>
    <text x="607" y="67" text-anchor="middle">新 v（左传）</text>
  </g>

  <!-- ====== 行 i = 2（右端，初值，不切） ====== -->
  <g filter="url(#rough2)">
    <text x="30"  y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <text x="82"  y="105" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="156" y="105" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3（初值）</text>
    <text x="246" y="105" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">不切</text>
    <rect x="347" y="88" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="364" y="107" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="469" y="105" text-anchor="middle" font-size="13" fill="#888">0</text>
    <text x="534" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
    <text x="607" y="105" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- ====== 行 i = 1（9 > 3，切分，重点行） ====== -->
  <g filter="url(#rough2)">
    <text x="30"  y="143" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
    <text x="82"  y="143" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">9</text>
    <text x="156" y="143" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="246" y="143" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">切（k=3）</text>
    <!-- 三片均匀 -->
    <rect x="309" y="124" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="326" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <rect x="347" y="124" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="364" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <rect x="385" y="124" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="402" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="469" y="143" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
    <text x="534" y="143" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
    <text x="607" y="143" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- ====== 行 i = 0（不切） ====== -->
  <g filter="url(#rough2)">
    <text x="30"  y="181" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
    <text x="82"  y="181" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="156" y="181" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="246" y="181" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">不切</text>
    <rect x="347" y="162" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="364" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="469" y="181" text-anchor="middle" font-size="13" fill="#888">0</text>
    <text x="534" y="181" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <text x="607" y="181" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- ====== 结论 ====== -->
  <text x="330" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">累计 ops = 2 → 数组变为 [3, 3, 3, 3, 3] 非递减 ✓</text>
</svg>
