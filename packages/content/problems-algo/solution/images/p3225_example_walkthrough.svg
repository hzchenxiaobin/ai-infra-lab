<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：示例 1 最优高度 h = (0, 4, 0, 0, 5)，逐列贡献合计 11</text>

  <!-- 表头 -->
  <rect x="18" y="42" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="42" y="59" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">列 j</text>
  <rect x="66" y="42" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="87" y="59" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">h[j]</text>
  <rect x="108" y="42" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="134" y="59" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">左邻</text>
  <rect x="160" y="42" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="186" y="59" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">右邻</text>
  <rect x="212" y="42" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="238" y="59" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">max</text>
  <rect x="264" y="42" width="172" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="350" y="59" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">贡献（闭式）</text>
  <rect x="436" y="42" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="469" y="59" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">值</text>

  <!-- 行 0 -->
  <rect x="18" y="68" width="48" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="86" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="66" y="68" width="42" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="86" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="108" y="68" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="134" y="86" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—(0)</text>
  <rect x="160" y="68" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="86" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="212" y="68" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="238" y="86" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="264" y="68" width="172" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="86" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">P0[4]−P0[0] = 0+0+0+5</text>
  <rect x="436" y="68" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="469" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 ★</text>

  <!-- 行 1 -->
  <rect x="18" y="96" width="48" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="66" y="96" width="42" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="114" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="108" y="96" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="134" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="160" y="96" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="212" y="96" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="238" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="264" y="96" width="172" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">max(0, P1[0]−P1[4])（高列 clamp）</text>
  <rect x="436" y="96" width="66" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="469" y="114" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <!-- 行 2 -->
  <rect x="18" y="124" width="48" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="142" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="66" y="124" width="42" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="142" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="108" y="124" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="134" y="142" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="160" y="124" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="142" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="212" y="124" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="238" y="142" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="264" y="124" width="172" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">P2[4]−P2[0] = 0+3+0+0</text>
  <rect x="436" y="124" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="469" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 ★</text>

  <!-- 行 3 -->
  <rect x="18" y="152" width="48" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="170" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="66" y="152" width="42" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="170" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="108" y="152" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="134" y="170" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="160" y="152" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="170" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="212" y="152" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="238" y="170" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="264" y="152" width="172" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">P3[5]−P3[0] = 0+0+0+3+0</text>
  <rect x="436" y="152" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="469" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 ★</text>

  <!-- 行 4 -->
  <rect x="18" y="180" width="48" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="66" y="180" width="42" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="198" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="108" y="180" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="134" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="160" y="180" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="198" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—(0)</text>
  <rect x="212" y="180" width="52" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="238" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="264" y="180" width="172" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="198" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">整列黑，无白格可得分</text>
  <rect x="436" y="180" width="66" height="28" fill="#ffffff" stroke="#9aa7b8" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="469" y="198" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <!-- 合计行 -->
  <rect x="18" y="212" width="418" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="227" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">合计 = 5 + 3 + 3</text>
  <rect x="436" y="212" width="66" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="469" y="231" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">11</text>

  <!-- 底部注解 -->
  <rect x="18" y="258" width="230" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="133" y="278" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">得分格子</text>
  <text x="133" y="296" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(3,0) = 5，(1,2) = 3，(3,3) = 3</text>
  <text x="133" y="316" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">列 0、3 保持全白（h=0），</text>
  <text x="133" y="332" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">靠染黑的邻居列「点亮」白格</text>

  <rect x="272" y="258" width="230" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="387" y="278" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">隔列帮忙 ⇒ 跨两列依赖</text>
  <text x="387" y="296" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">第 1 列的染黑同时救活了</text>
  <text x="387" y="312" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">左边列 0 与右边列 2、3 的白格</text>
  <text x="387" y="332" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">⇒ DP 状态必须携带两个高度</text>
</svg>
