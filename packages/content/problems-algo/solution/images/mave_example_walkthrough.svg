<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：(+,+,+) 符号组合，f(k) = arr1[k] + arr2[k] + k</text>

  <!-- input -->
  <rect x="40" y="36" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">arr1 = [1, 2, 3, 4],  arr2 = [−1, 4, 5, 6]</text>

  <!-- ===== Table header ===== -->
  <text x="30" y="86" font-size="11" fill="#888" font-weight="bold">逐行计算 f(k)：</text>

  <!-- table: 5 columns: k, arr1[k], arr2[k], k, f(k) -->
  <!-- column positions: 70, 150, 230, 310, 410 -->
  <!-- header row -->
  <rect x="60" y="92" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="90" y="108" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">k</text>

  <rect x="120" y="92" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="108" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">arr1[k]</text>

  <rect x="190" y="92" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="225" y="108" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">arr2[k]</text>

  <rect x="260" y="92" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="290" y="108" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">k</text>

  <rect x="320" y="92" width="180" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="410" y="108" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">f(k) = arr1[k]+arr2[k]+k</text>

  <!-- Row k=0 (min) -->
  <rect x="60" y="116" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="90" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="120" y="116" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="132" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="190" y="116" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="132" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <rect x="260" y="116" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="132" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="320" y="116" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="410" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0 ← min</text>

  <!-- Row k=1 -->
  <rect x="60" y="140" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="90" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="140" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="156" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="190" y="140" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="156" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="260" y="140" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="156" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="320" y="140" width="180" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="156" text-anchor="middle" font-size="11" fill="#333">2 + 4 + 1 = 7</text>

  <!-- Row k=2 -->
  <rect x="60" y="164" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="90" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="120" y="164" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="180" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="190" y="164" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="180" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="260" y="164" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="320" y="164" width="180" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="180" text-anchor="middle" font-size="11" fill="#333">3 + 5 + 2 = 10</text>

  <!-- Row k=3 (max) -->
  <rect x="60" y="188" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="90" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="120" y="188" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="204" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="190" y="188" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="204" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="260" y="188" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="204" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="320" y="188" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="410" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4 + 6 + 3 = 13 ← max</text>

  <!-- ===== Result ===== -->
  <path d="M 410 212 L 410 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="232" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">max(f) − min(f) = 13 − 0 = 13</text>

  <!-- ===== Verification ===== -->
  <text x="30" y="288" font-size="11" fill="#888" font-weight="bold">验证：i=3, j=0 代入原表达式</text>

  <rect x="40" y="296" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">|arr1[3]−arr1[0]| + |arr2[3]−arr2[0]| + |3−0|</text>
  <text x="270" y="336" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= |4−1| + |6−(−1)| + |3−0| = 3 + 7 + 3 = 13 ✓</text>

  <!-- note -->
  <text x="270" y="378" text-anchor="middle" font-size="10" fill="#888">其余 7 种符号组合的 max(f)−min(f) 均 ≤ 13，故最终答案 = 13</text>
</svg>
