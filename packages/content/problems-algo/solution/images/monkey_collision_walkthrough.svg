<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：2ⁿ − 2</text>

  <!-- 左：n=3 枚举 8 种方案 -->
  <rect x="24" y="44" width="222" height="270" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="135" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n = 3 枚举（→ 顺 / ← 逆）</text>

  <text x="50" y="92"  font-size="13" fill="#4a7a3a" filter="url(#rough2)">→→→　✓ 安全</text>
  <text x="50" y="116" font-size="13" fill="#4a7a3a" filter="url(#rough2)">←←←　✓ 安全</text>
  <text x="50" y="140" font-size="13" fill="#b85450" filter="url(#rough2)">→→←　✗ 撞</text>
  <text x="50" y="164" font-size="13" fill="#b85450" filter="url(#rough2)">→←→　✗ 撞</text>
  <text x="50" y="188" font-size="13" fill="#b85450" filter="url(#rough2)">←→→　✗ 撞</text>
  <text x="50" y="212" font-size="13" fill="#b85450" filter="url(#rough2)">→←←　✗ 撞</text>
  <text x="50" y="236" font-size="13" fill="#b85450" filter="url(#rough2)">←→←　✗ 撞</text>
  <text x="50" y="260" font-size="13" fill="#b85450" filter="url(#rough2)">←←→　✗ 撞</text>

  <line x1="40" y1="278" x2="230" y2="278" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="135" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">安全 2 ／ 撞 6</text>
  <text x="135" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">= 2³ − 2 = 6 ✓</text>

  <!-- 右：归纳表 -->
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">归纳</text>
  <!-- 表格外框与列线 -->
  <g stroke="#446688" stroke-width="1.3" fill="none">
    <rect x="278" y="68" width="218" height="158" filter="url(#rough2)"/>
    <line x1="318" y1="68" x2="318" y2="226" filter="url(#rough2)"/>
    <line x1="368" y1="68" x2="368" y2="226" filter="url(#rough2)"/>
    <line x1="420" y1="68" x2="420" y2="226" filter="url(#rough2)"/>
    <line x1="278" y1="96" x2="496" y2="96" filter="url(#rough2)"/>
    <line x1="278" y1="140" x2="496" y2="140" filter="url(#rough2)"/>
    <line x1="278" y1="184" x2="496" y2="184" filter="url(#rough2)"/>
  </g>
  <!-- 表头 -->
  <g font-size="12" fill="#333">
    <text x="298" y="86" text-anchor="middle" filter="url(#rough2)">n</text>
    <text x="343" y="86" text-anchor="middle" filter="url(#rough2)">2ⁿ</text>
    <text x="394" y="86" text-anchor="middle" filter="url(#rough2)">不撞</text>
    <text x="458" y="86" text-anchor="middle" filter="url(#rough2)">碰撞</text>
  </g>
  <!-- n=3 -->
  <g font-size="12" fill="#333">
    <text x="298" y="120" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="343" y="120" text-anchor="middle" filter="url(#rough2)">8</text>
    <text x="394" y="120" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">2</text>
    <text x="458" y="120" text-anchor="middle" fill="#b85450" filter="url(#rough2)">6</text>
  </g>
  <!-- n=4 -->
  <g font-size="12" fill="#333">
    <text x="298" y="164" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="343" y="164" text-anchor="middle" filter="url(#rough2)">16</text>
    <text x="394" y="164" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">2</text>
    <text x="458" y="164" text-anchor="middle" fill="#b85450" filter="url(#rough2)">14</text>
  </g>
  <!-- 一般 -->
  <g font-size="12" fill="#333">
    <text x="298" y="208" text-anchor="middle" filter="url(#rough2)">n</text>
    <text x="343" y="208" text-anchor="middle" filter="url(#rough2)">2ⁿ</text>
    <text x="394" y="208" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">2</text>
    <text x="458" y="208" text-anchor="middle" fill="#b85450" filter="url(#rough2)">2ⁿ−2</text>
  </g>

  <!-- 底注 -->
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n ≥ 3：每顶点有两不同邻接点，全顺 ≠ 全逆 → 恰 2 种不撞</text>
</svg>
