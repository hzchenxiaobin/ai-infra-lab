<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">三段 CTE 流水线：权重 → 汇总 → 排名 → 过滤</text>

  <rect x="50" y="44" width="440" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="64" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 计算每票权重（窗口函数）</text>
  <text x="70" y="84" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">1 / COUNT(candidate) OVER (PARTITION BY voter)</text>
  <text x="70" y="106" font-size="11" fill="#999" filter="url(#rough2)">按选民分区数候选人数 → 1/n 即每票权重</text>

  <path d="M 270 120 L 270 138" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="138" width="440" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="158" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 按候选人汇总</text>
  <text x="70" y="178" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">SUM(vote) AS tot  GROUP BY candidate</text>
  <text x="70" y="198" font-size="11" fill="#999" filter="url(#rough2)">每位候选人的总得票数</text>

  <path d="M 270 208 L 270 226" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="226" width="440" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="246" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 排名</text>
  <text x="70" y="266" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">RANK() OVER (ORDER BY tot DESC) AS rk</text>
  <text x="70" y="286" font-size="11" fill="#999" filter="url(#rough2)">票数降序排名，并列者同 rk=1</text>

  <path d="M 270 296 L 270 314" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="314" width="440" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="334" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 取第一名</text>
  <text x="70" y="354" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">WHERE rk = 1  ORDER BY candidate</text>
  <text x="70" y="374" font-size="11" fill="#999" filter="url(#rough2)">并列时全部返回，按名字升序输出</text>

  <text x="270" y="416" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">关键：RANK 保证并列第一的同 rk 值，不会漏掉</text>
</svg>
