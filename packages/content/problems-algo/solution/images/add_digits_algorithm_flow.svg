<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：模拟法 vs 数学法</text>

  <!-- ===== Left column: simulation ===== -->
  <text x="130" y="52" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">模拟法（循环）</text>

  <!-- Start -->
  <ellipse cx="130" cy="78" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 num</text>

  <line x1="130" y1="96" x2="130" y2="112" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: num >= 10 ? -->
  <polygon points="130,116 210,150 130,184 50,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">num ≥ 10 ?</text>
  <text x="130" y="162" text-anchor="middle" font-size="9.5" fill="#888">还有多位</text>

  <!-- Yes: loop body -->
  <text x="222" y="148" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <path d="M 210 150 Q 260 150 260 188" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="192" width="128" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">逐位取余求和</text>
  <text x="260" y="228" text-anchor="middle" font-size="10" fill="#555">sum += num % 10</text>
  <text x="260" y="242" text-anchor="middle" font-size="10" fill="#555">num //= 10</text>

  <!-- loop back -->
  <path d="M 260 250 Q 260 270 130 270 Q 50 270 50 220 Q 50 170 70 150" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="214" font-size="9.5" fill="#888">num = sum</text>
  <text x="44" y="226" font-size="9.5" fill="#888">回判 ≥10</text>

  <!-- No: return -->
  <text x="118" y="200" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="130" y1="184" x2="130" y2="300" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="76" y="304" width="108" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return num</text>

  <!-- complexity note -->
  <rect x="60" y="352" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="370" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">O(k log n)，有循环</text>

  <!-- ===== Right column: O(1) formula ===== -->
  <text x="430" y="52" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">数学法（O(1) 公式）</text>

  <!-- Start -->
  <ellipse cx="430" cy="78" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="83" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">输入 num</text>

  <line x1="430" y1="96" x2="430" y2="112" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: num == 0 ? -->
  <polygon points="430,116 510,150 430,184 350,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">num == 0 ?</text>
  <text x="430" y="162" text-anchor="middle" font-size="9.5" fill="#888">边界特判</text>

  <!-- Yes: return 0 -->
  <text x="336" y="148" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <path d="M 350 150 Q 300 150 300 188" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="252" y="192" width="96" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="213" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return 0</text>

  <!-- No: formula -->
  <text x="522" y="148" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 510 150 Q 540 150 540 188" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="448" y="192" width="104" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="500" y="212" text-anchor="middle" font-size="10" fill="#555">1 + (num−1)</text>
  <text x="500" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">mod 9</text>
  <text x="500" y="242" text-anchor="middle" font-size="9.5" fill="#888">一次取模</text>

  <line x1="500" y1="250" x2="500" y2="300" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="300" y1="224" x2="300" y2="300" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge return -->
  <rect x="376" y="304" width="108" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return dr</text>

  <!-- complexity note -->
  <rect x="360" y="352" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="370" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">O(1)，无循环 ✓</text>

  <!-- divider between columns -->
  <line x1="280" y1="48" x2="280" y2="390" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- bottom comparison note -->
  <rect x="120" y="400" width="320" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">同一结果，数学法把 k 轮迭代压缩成 1 步</text>
</svg>
