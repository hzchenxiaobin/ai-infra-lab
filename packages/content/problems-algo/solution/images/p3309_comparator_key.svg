<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">扩展：任意 n 的正解 —— 比较器就是「循环小数」比较</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">n = 3 枚举即可；n 更大时按「循环小数」键排序，O(n log n)</text>

  <!-- 左上：反例 -->
  <rect x="36" y="52" width="225" height="116" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="70" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">反例：按数值排序会翻车</text>
  <text x="148" y="88" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">a = 4 ("100")，b = 3 ("11")，数值 4 &gt; 3</text>
  <text x="148" y="104" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">4 在前："100"+"11" = 10011₂ = 19 ✗</text>
  <text x="148" y="120" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">3 在前："11"+"100" = 11100₂ = 28 ✓</text>
  <text x="148" y="140" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">验证：(4&lt;&lt;2)|3 = 19 &lt; (3&lt;&lt;3)|4 = 28</text>

  <!-- 右上：比较器 -->
  <rect x="271" y="52" width="213" height="116" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="377" y="70" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">拼接比较器</text>
  <text x="377" y="88" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">a 排 b 前 ⟺</text>
  <text x="377" y="104" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">(a&lt;&lt;Lb)|b &gt; (b&lt;&lt;La)|a</text>
  <text x="377" y="122" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">⟺ a(2^Lb − 1) &gt; b(2^La − 1)</text>
  <text x="377" y="140" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">⟺ a/(2^La − 1) &gt; b/(2^Lb − 1)</text>
  <text x="377" y="158" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">最后一步：两边同除正数</text>

  <!-- 左下：循环小数视角 -->
  <rect x="36" y="180" width="225" height="130" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="198" text-anchor="middle" font-size="10.5" fill="#2f5424" font-weight="bold" filter="url(#rough2)">循环小数视角</text>
  <text x="148" y="216" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">键 k(x) = x / (2^Lx − 1)</text>
  <text x="148" y="232" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">= 把 bin(x) 无限重复的二进制小数</text>
  <text x="148" y="250" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">k(3) = 0.111111… = 1</text>
  <text x="148" y="266" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">k(4) = 0.100100… = 4/7</text>
  <text x="148" y="284" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0.111… &gt; 0.100… ⇒ 3 在前 ✓</text>
  <text x="148" y="302" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">比较实数 ⇒ 全序 ⇒ 可安全排序</text>

  <!-- 右下：排序 + 拼接 -->
  <rect x="271" y="180" width="213" height="130" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="377" y="198" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">排序 + 依次拼接</text>
  <text x="377" y="216" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">按 k(x) 降序排，再逐个</text>
  <text x="377" y="230" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">v = (v &lt;&lt; Lx) | x 拼接</text>
  <text x="377" y="248" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">交换论证 ⇒ 排序结果最优</text>
  <text x="377" y="264" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">键相等 ⇒ 两种顺序值相等</text>
  <text x="377" y="282" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">注意：x = 0 时分母为 0（本题无）</text>
  <text x="377" y="300" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">一般化到 n 个数：O(n log n)</text>

  <!-- 底部：同族题 -->
  <rect x="36" y="322" width="448" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="339" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">同族：179 最大数 · 剑指 Offer 45 破解闯关密码 · 321 拼接最大数 · 402 移掉 K 位数字</text>
</svg>
