<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：负基数的位权交替变号</text>

  <!-- ===== Section 1: position values ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">base -2 的位权 (−2)^i</text>

  <!-- position labels -->
  <text x="90"  y="80" text-anchor="middle" font-size="10" fill="#888">i=4</text>
  <text x="190" y="80" text-anchor="middle" font-size="10" fill="#888">i=3</text>
  <text x="290" y="80" text-anchor="middle" font-size="10" fill="#888">i=2</text>
  <text x="390" y="80" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <text x="490" y="80" text-anchor="middle" font-size="10" fill="#888">i=0</text>

  <!-- position value boxes: even=green(positive), odd=red(negative) -->
  <rect x="60"  y="86" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90"  y="107" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+16</text>

  <rect x="160" y="86" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="107" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−8</text>

  <rect x="260" y="86" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="290" y="107" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+4</text>

  <rect x="360" y="86" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="390" y="107" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>

  <rect x="460" y="86" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="490" y="107" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- alternating sign note -->
  <path d="M 90 122 L 90 134" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 190 122 L 190 134" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 290 122 L 290 134" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 390 122 L 390 134" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 490 122 L 490 134" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="136" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#d6a040">偶数位 +，奇数位 − → 无需符号位即可表示任意整数</text>

  <!-- ===== Section 2: example n=2 ===== -->
  <text x="40" y="182" font-size="12" fill="#446688" font-weight="bold">示例：n = 2 的 base−2 表示 = "110"</text>

  <!-- digit row -->
  <rect x="260" y="190" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="209" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="360" y="190" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="209" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="460" y="190" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="490" y="209" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">0</text>

  <!-- multiply row -->
  <text x="290" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a">×4</text>
  <text x="390" y="234" text-anchor="middle" font-size="11" fill="#b85450">×(−2)</text>
  <text x="490" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a">×1</text>

  <path d="M 290 238 L 290 250" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 390 238 L 390 250" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 490 238 L 490 250" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- product row -->
  <rect x="260" y="252" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+4</text>
  <rect x="360" y="252" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="390" y="270" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−2</text>
  <rect x="460" y="252" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="270" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">0</text>

  <!-- sum -->
  <path d="M 290 280 L 290 292" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 390 280 L 390 292" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 490 280 L 490 292" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="260" y="294" width="260" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4 + (−2) + 0 = 2 ✓</text>

  <!-- ===== key insight notes ===== -->
  <rect x="40" y="340" width="240" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">位权交替正负</text>
  <text x="160" y="378" text-anchor="middle" font-size="10.5" fill="#555">(-2)^i = (-1)^i · 2^i</text>
  <text x="160" y="394" text-anchor="middle" font-size="10.5" fill="#555">偶位为正，奇位为负</text>
  <text x="160" y="410" text-anchor="middle" font-size="10.5" fill="#555">正负数统一表示，无需符号位</text>

  <rect x="300" y="340" width="240" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="360" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">转换 = 除 (−2) 取余</text>
  <text x="420" y="378" text-anchor="middle" font-size="10.5" fill="#555">与普通进制转换同模板</text>
  <text x="420" y="394" text-anchor="middle" font-size="10.5" fill="#555">余数须 ∈ {0, 1}（非负）</text>
  <text x="420" y="410" text-anchor="middle" font-size="10.5" fill="#555">负余数 → +2 修正商 +1</text>
</svg>
