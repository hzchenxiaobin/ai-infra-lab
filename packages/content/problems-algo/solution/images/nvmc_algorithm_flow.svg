<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：DFS 逐子枚举 + 冲突剪枝</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">为每枚棋子依次选一个移动，与已选移动逐对查冲突，全通过才递归下一枚</text>

  <g filter="url(#rough2)" font-size="11">

    <!-- ===== Step 1: Generate moves ===== -->
    <rect x="30" y="62" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="130" y="80" text-anchor="middle" fill="#446688" font-weight="bold">① 生成每枚棋子的移动表</text>
    <text x="130" y="96" text-anchor="middle" fill="#666" font-size="9">原地 + 各方向 1~7 步（越界即停）</text>

    <path d="M 130 108 L 130 126" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <!-- ===== Step 2: DFS entry ===== -->
    <rect x="30" y="128" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="130" y="146" text-anchor="middle" fill="#4a7a3a" font-weight="bold">② dfs(i)：处理第 i 枚棋子</text>
    <text x="130" y="162" text-anchor="middle" fill="#666" font-size="9">chosen[] 记录前 i−1 枚已选移动</text>

    <path d="M 130 174 L 130 192" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <!-- ===== Decision diamond ===== -->
    <polygon points="130,196 210,238 130,280 50,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="130" y="234" text-anchor="middle" fill="#d6a040" font-weight="bold" font-size="10">i == n ?</text>
    <text x="130" y="250" text-anchor="middle" fill="#888" font-size="9">所有棋子已选完</text>

    <!-- Yes branch -->
    <path d="M 210 238 L 300 238" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="255" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="300" y="218" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="365" y="236" text-anchor="middle" fill="#4a7a3a" font-weight="bold">ans += 1</text>
    <text x="365" y="250" text-anchor="middle" fill="#888" font-size="9">找到一个有效组合</text>

    <!-- No branch -->
    <path d="M 130 280 L 130 300" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <text x="144" y="294" font-size="10" fill="#888" font-weight="bold">否</text>

    <!-- ===== Loop over moves ===== -->
    <rect x="30" y="302" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="130" y="320" text-anchor="middle" fill="#446688" font-weight="bold">③ 遍历 allMoves[i]</text>
    <text x="130" y="336" text-anchor="middle" fill="#666" font-size="9">对每个候选移动 mv</text>

    <path d="M 130 348 L 130 362" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <!-- ===== Conflict check diamond ===== -->
    <polygon points="130,366 230,404 130,432 30,404" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="130" y="400" text-anchor="middle" fill="#b85450" font-weight="bold" font-size="10">mv 与 chosen</text>
    <text x="130" y="414" text-anchor="middle" fill="#b85450" font-weight="bold" font-size="10">有冲突？</text>

    <!-- No conflict -> recurse -->
    <path d="M 230 404 L 320 404" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="275" y="398" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">无冲突</text>
    <rect x="320" y="384" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="420" y="402" text-anchor="middle" fill="#4a7a3a" font-weight="bold">chosen.append(mv)</text>
    <text x="420" y="416" text-anchor="middle" fill="#4a7a3a" font-size="9">dfs(i+1) → chosen.pop() 回溯</text>

    <!-- Conflict -> skip (loop back) -->
    <path d="M 130 366 L 130 352 L 30 352 L 30 324 L 30 324" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3"/>
    <text x="14" y="384" font-size="9" fill="#b85450" font-weight="bold">冲突</text>
    <text x="14" y="396" font-size="9" fill="#b85450">剪枝</text>

    <!-- ===== Right side: conflict check detail ===== -->
    <rect x="380" y="62" width="160" height="100" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="8"/>
    <text x="460" y="80" text-anchor="middle" fill="#444" font-weight="bold" font-size="10">冲突检测 conflict(mv, c)</text>
    <text x="390" y="98" font-size="9" fill="#555">maxT = max(mv步数, c步数)</text>
    <text x="390" y="114" font-size="9" fill="#555">for t in 0..maxT:</text>
    <text x="390" y="130" font-size="9" fill="#555">  posA = pos(mv, t)</text>
    <text x="390" y="146" font-size="9" fill="#555">  posB = pos(c, t)</text>
    <text x="390" y="158" font-size="9" fill="#b85450" font-weight="bold">  if posA == posB: 冲突!</text>

    <!-- ===== Right side: position formula ===== -->
    <rect x="380" y="172" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8"/>
    <text x="460" y="190" text-anchor="middle" fill="#d6a040" font-weight="bold" font-size="10">pos(move, t)</text>
    <text x="390" y="206" font-size="9" fill="#555">tt = min(t, steps)</text>
    <text x="390" y="222" font-size="9" fill="#555">return (sr+dr·tt, sc+dc·tt)</text>

    <!-- complexity note -->
    <rect x="380" y="300" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8"/>
    <text x="460" y="316" text-anchor="middle" fill="#b85450" font-weight="bold" font-size="10">复杂度</text>
    <text x="390" y="332" font-size="9" fill="#555">最多 28⁴ ≈ 600K 组合</text>
    <text x="390" y="338" font-size="9" fill="#555"> </text>
    <text x="390" y="344" font-size="8" fill="#888">剪枝后实际远小于此</text>

  </g>
</svg>
