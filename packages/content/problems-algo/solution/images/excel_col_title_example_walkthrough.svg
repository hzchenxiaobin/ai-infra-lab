<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：701 → ZY，28 → AB</text>

  <!-- ============ Case 1: 701 → ZY ============ -->
  <text x="34" y="56" font-size="12" fill="#446688" font-weight="bold">用例一：n = 701 → "ZY"</text>

  <!-- column headers -->
  <text x="60" y="76" text-anchor="middle" font-size="10" fill="#888">轮次</text>
  <text x="140" y="76" text-anchor="middle" font-size="10" fill="#888">n（进入）</text>
  <text x="230" y="76" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">n-- 后</text>
  <text x="320" y="76" text-anchor="middle" font-size="10" fill="#888">n % 26</text>
  <text x="410" y="76" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">字母</text>
  <text x="490" y="76" text-anchor="middle" font-size="10" fill="#888">n/=26 后</text>

  <!-- Row 1: n=701 -->
  <rect x="34" y="84" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="60" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第1轮</text>
  <rect x="110" y="82" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">701</text>
  <rect x="200" y="82" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="104" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">700</text>
  <rect x="290" y="82" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">24</text>
  <rect x="380" y="82" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Y</text>
  <rect x="460" y="82" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">26</text>

  <!-- arrow row1->row2 -->
  <path d="M 490 118 Q 490 128 140 128 L 140 136" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: n=26 -->
  <rect x="34" y="140" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="60" y="160" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第2轮</text>
  <rect x="110" y="138" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="160" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">26</text>
  <rect x="200" y="138" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="160" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">25</text>
  <rect x="290" y="138" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="160" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">25</text>
  <rect x="380" y="138" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="160" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Z</text>
  <rect x="460" y="138" width="60" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="490" y="160" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">0</text>

  <!-- stop label -->
  <text x="525" y="160" font-size="10" fill="#888" font-weight="bold">停止</text>

  <!-- result bar case1 -->
  <rect x="110" y="184" width="410" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="315" y="204" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">产出 [Y, Z]，反转 → "ZY" ✓</text>

  <!-- ============ Case 2: 28 → AB ============ -->
  <text x="34" y="246" font-size="12" fill="#446688" font-weight="bold">用例二：n = 28 → "AB"</text>

  <text x="60" y="266" text-anchor="middle" font-size="10" fill="#888">轮次</text>
  <text x="140" y="266" text-anchor="middle" font-size="10" fill="#888">n（进入）</text>
  <text x="230" y="266" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">n-- 后</text>
  <text x="320" y="266" text-anchor="middle" font-size="10" fill="#888">n % 26</text>
  <text x="410" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">字母</text>
  <text x="490" y="266" text-anchor="middle" font-size="10" fill="#888">n/=26 后</text>

  <!-- Row 1: n=28 -->
  <rect x="34" y="274" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="60" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第1轮</text>
  <rect x="110" y="272" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">28</text>
  <rect x="200" y="272" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="294" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">27</text>
  <rect x="290" y="272" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="380" y="272" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="294" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="460" y="272" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <path d="M 490 308 Q 490 318 140 318 L 140 326" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: n=1 -->
  <rect x="34" y="330" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="60" y="350" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第2轮</text>
  <rect x="110" y="328" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="350" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="328" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="350" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="290" y="328" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="350" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="380" y="328" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="350" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">A</text>
  <rect x="460" y="328" width="60" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="490" y="350" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">0</text>

  <text x="525" y="350" font-size="10" fill="#888" font-weight="bold">停止</text>

  <!-- result bar case2 -->
  <rect x="110" y="374" width="410" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="315" y="394" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">产出 [B, A]，反转 → "AB" ✓</text>

  <!-- bottom note -->
  <rect x="60" y="418" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">每轮 n-- 把 1~26 平移到 0~25，余数总能对上字母</text>
  <text x="280" y="452" text-anchor="middle" font-size="10.5" fill="#d6a040">字母从低位到高位产出，最后反转字符串</text>
</svg>
