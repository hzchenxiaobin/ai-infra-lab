<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：字符三分——元音计入 v，辅音计入 c，其余不计入</text>

  <!-- 分类规则：三个桶 -->
  <rect x="28" y="36" width="150" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="103" y="58" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">元音：a e i o u</text>
  <text x="103" y="78" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">→ 计入 v</text>

  <rect x="185" y="36" width="150" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">辅音：其它小写字母</text>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">→ 计入 c</text>

  <rect x="342" y="36" width="150" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="417" y="58" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">空格、数字</text>
  <text x="417" y="78" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">→ 两边都不算 ✗</text>

  <!-- 示例 1 字符行 -->
  <text x="112" y="141" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">s =</text>

  <rect x="122" y="116" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>

  <rect x="168" y="116" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="188" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>

  <rect x="214" y="116" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="234" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>

  <rect x="260" y="116" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">e</text>

  <rect x="306" y="116" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="326" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="352" y="116" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="372" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">r</text>

  <text x="430" y="141" font-size="10" fill="#888" filter="url(#rough2)">（示例 1）</text>

  <text x="142" y="172" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">辅</text>
  <text x="188" y="172" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">元</text>
  <text x="234" y="172" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">元</text>
  <text x="280" y="172" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">元</text>
  <text x="326" y="172" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">元</text>
  <text x="372" y="172" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">辅</text>

  <!-- 计数结果 -->
  <text x="150" y="194" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">v = 4（o·o·e·a）</text>
  <text x="370" y="194" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">c = 2（c·r）</text>

  <path d="M 150 200 L 175 212" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 200 L 345 212" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 得分公式 -->
  <rect x="60" y="214" width="400" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="15" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">score = ⌊v / c⌋ = ⌊4 / 2⌋ = 2</text>
  <text x="260" y="260" text-anchor="middle" font-size="10.5" fill="#a8863a" filter="url(#rough2)">c = 0 时直接返回 0 —— 除零保护，根本不做除法</text>

  <!-- 示例 3 -->
  <rect x="60" y="290" width="400" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#a0433f" filter="url(#rough2)">示例 3：s =「au 123」→ 只有 a、u 是字母元音，v = 2、c = 0</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 没有辅音，score = 0（而不是 2 ÷ 0 崩溃）</text>
</svg>
