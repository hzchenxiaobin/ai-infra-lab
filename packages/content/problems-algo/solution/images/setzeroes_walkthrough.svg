<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="300" fill="#fafafa"/>

  <text x="240" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：[[1,1,1],[1,0,1],[1,1,1]]</text>

  <!-- ===== Matrix 1 : initial ===== -->
  <text x="67" y="46" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">① 初始</text>
  <rect x="22" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="37" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="52" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="67" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="82" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="97" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="22" y="88" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="37" y="108" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="52" y="88" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="67" y="108" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="82" y="88" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="97" y="108" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="22" y="118" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="37" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="52" y="118" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="67" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="82" y="118" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="97" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="67" y="166" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">发现 0 at (1,1)</text>

  <!-- arrow M1 -> M2 -->
  <path d="M 116 103 L 146 103" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="131" y="95" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">标记</text>

  <!-- ===== Matrix 2 : after marking ===== -->
  <text x="197" y="46" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">② 标记内部</text>
  <rect x="152" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="167" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="182" y="58" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="197" y="78" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <rect x="212" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="227" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="152" y="88" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="108" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <rect x="182" y="88" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="197" y="108" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="212" y="88" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="227" y="108" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="152" y="118" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="167" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="182" y="118" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="197" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="212" y="118" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="227" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="197" y="166" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">写首行/首列标记</text>

  <!-- arrow M2 -> M3 -->
  <path d="M 246 103 L 276 103" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="261" y="95" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">清零</text>

  <!-- ===== Matrix 3 : after clearing internal = result ===== -->
  <text x="327" y="46" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ 清零内部 = 结果</text>
  <rect x="282" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="297" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="312" y="58" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="327" y="78" text-anchor="middle" font-size="12" fill="#555">0</text>
  <rect x="342" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="357" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="282" y="88" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="297" y="108" text-anchor="middle" font-size="12" fill="#555">0</text>
  <rect x="312" y="88" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="327" y="108" text-anchor="middle" font-size="12" fill="#555">0</text>
  <rect x="342" y="88" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="357" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="282" y="118" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="297" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="312" y="118" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="327" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="342" y="118" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="357" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="327" y="166" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">读标记 → 内部置 0</text>

  <!-- result note -->
  <rect x="30" y="186" width="420" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="240" y="208" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">最终结果：[[1,0,1],[0,0,0],[1,0,1]] ✓ 与期望一致</text>

  <!-- legend -->
  <rect x="60" y="240" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="82" y="252" font-size="10" fill="#555">原始 0</text>
  <rect x="150" y="240" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="172" y="252" font-size="10" fill="#555">标记位（首行/首列）</text>
  <rect x="300" y="240" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="322" y="252" font-size="10" fill="#555">按标记清零的格子</text>

  <text x="240" y="284" text-anchor="middle" font-size="10.5" fill="#888">两 flag 均为 false → 首行首列无需收尾</text>
</svg>
