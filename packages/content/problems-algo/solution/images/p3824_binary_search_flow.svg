<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：二分答案 k ∈ [1, max(M, ⌈√n⌉)]</text>

  <!-- ① 定界 -->
  <g filter="url(#rough2)">
    <rect x="155" y="32" width="260" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="285" y="50" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">① 定界：lo = 1，hi = max(M, ⌈√n⌉)</text>
    <text x="285" y="68" text-anchor="middle" font-size="9.8" fill="#33506b">M = max(nums)；hi 处必真：S(hi) = n ≤ hi²</text>
  </g>

  <path d="M 285 78 L 285 94" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 lo < hi ? -->
  <g filter="url(#rough2)">
    <polygon points="285,98 357,130 285,162 213,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="285" y="134" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">lo &lt; hi ?</text>
  </g>

  <!-- 否 → 返回 -->
  <path d="M 357 130 L 396 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="398" y="112" width="147" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="471" y="134" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">返回 lo（最小可行 k）✓</text>
  </g>

  <!-- 是 → mid -->
  <path d="M 285 162 L 285 178" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="174" font-size="10" fill="#666" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="210" y="180" width="150" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="285" y="200" text-anchor="middle" font-size="11.5" fill="#33506b">mid = (lo + hi) / 2</text>
  </g>

  <path d="M 285 212 L 285 228" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 check(mid) -->
  <g filter="url(#rough2)">
    <polygon points="285,232 382,266 285,300 188,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="285" y="262" text-anchor="middle" font-size="10.5" fill="#8a6d1a">check(mid)：</text>
    <text x="285" y="278" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">Σ⌈nums[i]/mid⌉ ≤ mid² ？</text>
  </g>

  <!-- 真 → hi = mid -->
  <path d="M 188 266 L 150 266" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="169" y="258" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">真</text>
  <g filter="url(#rough2)">
    <rect x="38" y="248" width="112" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="94" y="270" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">hi = mid</text>
  </g>

  <!-- 假 → lo = mid + 1 -->
  <path d="M 382 266 L 420 266" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="401" y="258" text-anchor="middle" font-size="10" fill="#8a3030" filter="url(#rough2)">假</text>
  <g filter="url(#rough2)">
    <rect x="420" y="248" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="480" y="270" text-anchor="middle" font-size="11.5" fill="#8a3030" font-weight="bold">lo = mid + 1</text>
  </g>

  <!-- 循环总线：两个分支汇合回到 lo<hi? -->
  <path d="M 94 284 L 94 316" fill="none" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 480 284 L 480 316 L 30 316 L 30 130 L 209 130" fill="none" stroke="#999999" stroke-width="1.5" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="166" y="310" text-anchor="middle" font-size="9.8" fill="#888" filter="url(#rough2)">循环：区间 [lo, hi] 每轮至少减半</text>

  <!-- 底部注记 -->
  <g filter="url(#rough2)">
    <rect x="70" y="334" width="470" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="305" y="352" text-anchor="middle" font-size="10.3" fill="#8a6d1a">check 细节：各元素独立，⌈v/k⌉ = (v + k − 1) / k 次恰好归零</text>
    <text x="305" y="372" text-anchor="middle" font-size="10.3" fill="#8a6d1a">S(1) 与 k² 均可达 10¹⁰ ⇒ C++ 用 long long；二分 ~17 轮 × O(n)</text>
  </g>
</svg>
