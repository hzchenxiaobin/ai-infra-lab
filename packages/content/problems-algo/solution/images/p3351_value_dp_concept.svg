<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：按「结尾值」建桶，x 只能续接 x−1 / x+1 两桶</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">相邻差恰为 1 ⇒ 好子序列能否续接新元素，只取决于它的结尾值</text>

  <!-- 源桶 x−1 -->
  <rect x="22" y="66" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="102" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结尾值 = x−1 的桶</text>
  <text x="102" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cnt[x−1] 个序列 · 和 sum[x−1]</text>

  <!-- 源桶 x+1 -->
  <rect x="22" y="142" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="102" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结尾值 = x+1 的桶</text>
  <text x="102" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cnt[x+1] 个序列 · 和 sum[x+1]</text>

  <!-- 两条转移箭头 -->
  <path d="M 184 94 C 235 100, 250 112, 292 120" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 184 170 C 235 164, 250 152, 292 144" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="240" y="88" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">全部接上 x</text>
  <text x="240" y="188" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">全部接上 x</text>

  <!-- 新开的单元素序列 -->
  <rect x="22" y="248" width="160" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="102" y="268" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">另起新序列 [x]</text>
  <text x="102" y="285" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">长度 1 天然是好子序列</text>
  <path d="M 184 272 C 240 268, 260 220, 300 178" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- 目标桶 x -->
  <rect x="296" y="96" width="200" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="396" y="118" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">结尾值 = x 的桶（增量）</text>
  <text x="396" y="137" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">新增个数 dc = c + 1</text>
  <text x="396" y="155" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">新增和 ds = s + c·x + x</text>

  <!-- 底部递推式 -->
  <rect x="16" y="314" width="488" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt[x] += c + 1，sum[x] += s + c·x + x（c、s 取自 x±1 两桶，逐元素滚动更新）</text>
</svg>
