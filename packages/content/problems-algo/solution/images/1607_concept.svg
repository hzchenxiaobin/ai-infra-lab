<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：LEFT JOIN 保留 2020 年无销售的卖家（反连接）</text>

  <!-- ===== Seller table (left) ===== -->
  <text x="50" y="54" font-size="10" fill="#888">Seller（左表，全保留）</text>
  <rect x="40" y="60" width="150" height="172" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="76" font-size="9" fill="#446688" font-weight="bold">sid  name</text>
  <line x1="40" y1="82" x2="190" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- s3 Daniel matched -->
  <text x="50" y="98" font-size="9" fill="#4a7a3a">3    Daniel</text>
  <!-- s4 Grace matched -->
  <text x="50" y="120" font-size="9" fill="#4a7a3a">4    Grace</text>
  <!-- s5 Evelyn matched -->
  <text x="50" y="142" font-size="9" fill="#4a7a3a">5    Evelyn</text>
  <!-- s6 Henry unmatched -->
  <rect x="42" y="150" width="146" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="50" y="166" font-size="9" fill="#b85450" font-weight="bold">6    Henry</text>

  <text x="50" y="188" font-size="8" fill="#b85450">1 行 2020 无销售（红）</text>
  <text x="50" y="202" font-size="8" fill="#4a7a3a">3 行 2020 有销售（绿）</text>

  <!-- ===== Orders 2020 table (right) ===== -->
  <text x="380" y="54" font-size="10" fill="#888">Orders（仅 2020 年参与匹配）</text>
  <rect x="370" y="60" width="200" height="172" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="76" font-size="9" fill="#446688" font-weight="bold">oid date        sid</text>
  <line x1="370" y1="82" x2="570" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="98" font-size="9" fill="#4a7a3a">1   2020-03-01  5</text>
  <text x="380" y="120" font-size="9" fill="#4a7a3a">2   2020-05-25  4</text>
  <text x="380" y="142" font-size="9" fill="#888" text-decoration="line-through">3   2019-12-01  5</text>
  <text x="380" y="164" font-size="9" fill="#4a7a3a">4   2020-07-03  3</text>
  <text x="380" y="186" font-size="9" fill="#4a7a3a">5   2020-11-15  5</text>
  <text x="380" y="208" font-size="9" fill="#4a7a3a">6   2020-10-21  3</text>
  <text x="380" y="226" font-size="8" fill="#888">o3 划线：2019 不参与匹配</text>

  <!-- ===== Join arrows (seller_id match, 2020 only) ===== -->
  <!-- s3(98) -> o4(164) and o6(208) -->
  <path d="M 190 94 C 280 94, 280 160, 370 160" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 190 94 C 280 94, 280 204, 370 204" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <!-- s4(118) -> o2(120) -->
  <path d="M 190 116 C 280 116, 280 118, 370 118" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <!-- s5(140) -> o1(98) and o5(186) -->
  <path d="M 190 138 C 280 138, 280 96, 370 96" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 190 138 C 280 138, 280 182, 370 182" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>

  <!-- unmatched seller has no arrow -> NULL -->
  <text x="230" y="180" font-size="9" fill="#b85450" font-weight="bold">无匹配 → o.* = NULL</text>

  <!-- ===== Bottom: filter + select + result ===== -->
  <path d="M 115 252 L 115 272" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- WHERE IS NULL box -->
  <rect x="30" y="276" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="115" y="294" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">WHERE o.order_id</text>
  <text x="115" y="308" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">IS NULL</text>

  <path d="M 200 296 L 230 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- SELECT ORDER BY box -->
  <rect x="234" y="276" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="324" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">SELECT seller_name</text>
  <text x="324" y="308" text-anchor="middle" font-size="9" fill="#888">ORDER BY seller_name ASC</text>

  <path d="M 414 296 L 444 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result table -->
  <rect x="448" y="276" width="120" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="508" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">seller_name</text>
  <text x="508" y="316" text-anchor="middle" font-size="9" fill="#446688">Henry</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="344" width="538" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="299" y="364" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">年份条件 YEAR(sale_date)=2020 写在 ON：只让 2020 订单参与匹配</text>
  <text x="299" y="380" text-anchor="middle" font-size="10" fill="#666">s5 有 2019 订单(o3)但不参与匹配；s6 无任何订单 → IS NULL → 入选</text>

  <!-- ===== Legend ===== -->
  <rect x="380" y="226" width="190" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="390" y="240" font-size="9" fill="#4a7a3a">绿：2020 有销售（匹配）</text>
  <text x="390" y="254" font-size="9" fill="#b85450">红：2020 无销售（IS NULL）</text>
</svg>
