<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">核心观察：a = g·x，b = g·y ⇒ 强度 = (a/g)·(b/g) = x·y</text>
    <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#666">示例数对：a = 6，b = 10，g = gcd(6, 10) = 2</text>

    <!-- a = 6：3 个 g 块 -->
    <text x="74" y="91" text-anchor="end" font-size="12" fill="#333">a = 6</text>
    <rect x="82" y="72" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="124" y="72" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="166" y="72" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="103" y="90" text-anchor="middle" font-size="11" fill="#33506b">g</text>
    <text x="145" y="90" text-anchor="middle" font-size="11" fill="#33506b">g</text>
    <text x="187" y="90" text-anchor="middle" font-size="11" fill="#33506b">g</text>
    <text x="222" y="91" font-size="11" fill="#33506b">= g·x = 2 × 3（x = 3）</text>

    <!-- b = 10：5 个 g 块 -->
    <text x="74" y="141" text-anchor="end" font-size="12" fill="#333">b = 10</text>
    <rect x="82" y="122" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="124" y="122" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="166" y="122" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="208" y="122" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="250" y="122" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="103" y="140" text-anchor="middle" font-size="11" fill="#33506b">g</text>
    <text x="145" y="140" text-anchor="middle" font-size="11" fill="#33506b">g</text>
    <text x="187" y="140" text-anchor="middle" font-size="11" fill="#33506b">g</text>
    <text x="229" y="140" text-anchor="middle" font-size="11" fill="#33506b">g</text>
    <text x="271" y="140" text-anchor="middle" font-size="11" fill="#33506b">g</text>
    <text x="306" y="141" font-size="11" fill="#33506b">= g·y = 2 × 5（y = 5）</text>

    <!-- 各划掉一个 g：g² 被约掉 -->
    <path d="M 86 76 L 120 96 M 120 76 L 86 96" stroke="#b85450" stroke-width="2" fill="none"/>
    <path d="M 86 126 L 120 146 M 120 126 L 86 146" stroke="#b85450" stroke-width="2" fill="none"/>
    <text x="260" y="172" text-anchor="middle" font-size="10" fill="#b85450">a·b = (g·x)·(g·y) = g²·x·y —— 分母 g² 恰好约净，只剩 x·y</text>

    <!-- 公式框 -->
    <rect x="70" y="186" width="380" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="207" text-anchor="middle" font-size="13" fill="#7a5c1a" font-weight="bold">强度 = (a·b) / g² = x·y = 3 × 5 = 15</text>
    <text x="260" y="224" text-anchor="middle" font-size="9.5" fill="#a08040">等价形式：lcm(a, b) / gcd(a, b)</text>

    <!-- 三个推论 -->
    <rect x="70" y="248" width="380" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="260" y="268" text-anchor="middle" font-size="10.5" fill="#2f5d24">① 除法必整除：全程整数运算，无浮点误差</text>
    <text x="260" y="286" text-anchor="middle" font-size="10.5" fill="#2f5d24">② 先除后乘：因子各 ≤ 10⁵，乘积 ≤ 10¹⁰，64 位稳承接</text>
    <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#2f5d24">③ 等值对 a = b ⇒ x = y = 1 ⇒ 强度恒为 1（异值对 ≥ 2）</text>

    <text x="260" y="338" text-anchor="middle" font-size="8.5" fill="#999">强度 =「约掉全部公共质因子后」的乘积：6 与 10 公共的 2 约净，剩 3 × 5</text>
  </g>
</svg>
