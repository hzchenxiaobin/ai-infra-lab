<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">鸽巢论证：锚点固定后，只需看「前 6 个兼容候选」</text>

  <!-- 引理框 -->
  <rect x="22" y="38" width="205" height="168" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">引理（鸽巢）</text>
  <text x="34" y="82" font-size="10.5" fill="#333" filter="url(#rough2)">候选每行 ≤ 3、每列 ≤ 3。若</text>
  <text x="34" y="99" font-size="10.5" fill="#333" filter="url(#rough2)">一组候选两两互相攻击：</text>
  <text x="34" y="116" font-size="10.5" fill="#555" filter="url(#rough2)">任取不同行的两个 → 必同列；</text>
  <text x="34" y="133" font-size="10.5" fill="#555" filter="url(#rough2)">其余成员要同时攻击它们，</text>
  <text x="34" y="150" font-size="10.5" fill="#555" filter="url(#rough2)">只能也落在这条列（或全在一行）</text>
  <text x="124" y="174" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">∴ 两两攻击的候选 ≤ 3 个</text>
  <text x="124" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">∴ 任意 ≥ 4 个候选中必有合法对</text>

  <!-- 情形① -->
  <rect x="245" y="38" width="253" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="58" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">情形①：配对中较大者 Y、较小者 Z 都在前 6</text>
  <text x="371" y="76" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">→ (Y, Z) 本身就在候选里，直接命中 ✓</text>

  <!-- 情形② -->
  <rect x="245" y="94" width="253" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">情形②：Y、Z 都不在前 6 → 前 6 的值全 ≥ v_Y</text>
  <text x="371" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">其中必有合法对（引理，6 &gt; 3）→ 和 ≥ v_Y + v_Z ✓</text>

  <!-- 情形③ -->
  <rect x="245" y="150" width="253" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="170" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">情形③：只有 Y 在前 6。若有 z 与 Y 兼容</text>
  <text x="371" y="187" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">（z 值 ≥ v_Z）→ (Y, z) 命中；若全不兼容 →</text>
  <text x="371" y="202" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">同行 ≤2 + 同列 ≤2 = ≤4 &lt; 5 矛盾！</text>

  <!-- 扫描条带 -->
  <text x="260" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">每个锚点的扫描（候选按值降序）</text>

  <rect x="31" y="242" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="77" y="242" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="123" y="242" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="169" y="242" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="262" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ ✗ ✗ ✗</text>

  <rect x="217" y="242" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="263" y="242" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="309" y="242" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="355" y="242" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="401" y="242" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="447" y="242" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ ✓ ✓ ✓ ✓ ✓</text>

  <text x="122" y="290" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">与锚点同行 ≤2 + 同列 ≤2（跳过）</text>
  <text x="351" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">兼容候选取前 6 个</text>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">至多扫前 10 个必集齐 → 每个锚点 O(1)，主循环合计 O(min(m, n))</text>

  <!-- 结论条 -->
  <rect x="22" y="324" width="476" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">∴ 6 个兼容候选两两配对（15 对）必不劣 —— K = 6 严格可证（官方 hint 的 K = 4 不够！）</text>
</svg>
