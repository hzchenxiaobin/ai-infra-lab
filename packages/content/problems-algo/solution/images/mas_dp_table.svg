<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#fdfcf7"/>

  <text x="390" y="34" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">最小 ASCII 删除和 DP 状态转移</text>
  <path d="M 250 44 Q 390 52 530 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="390" y="58" text-anchor="middle" font-size="11" fill="#888">dp[i][j] = 让 s1[0..i-1] 与 s2[0..j-1] 相等的最小 ASCII 删除和</text>

  <!-- 行/列标签 -->
  <text x="80" y="104" font-size="11" fill="#888" font-weight="bold" text-anchor="end">s2→</text>
  <text x="80" y="124" font-size="11" fill="#888" font-weight="bold" text-anchor="end">s1↓</text>

  <!-- 列标题 -->
  <text x="160" y="96" text-anchor="middle" font-size="11" fill="#666">""</text>
  <text x="240" y="96" text-anchor="middle" font-size="11" fill="#666">e</text>
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#666">a</text>
  <text x="400" y="96" text-anchor="middle" font-size="11" fill="#666">t</text>

  <!-- 行标题 -->
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#666">""</text>
  <text x="120" y="194" text-anchor="middle" font-size="11" fill="#666">s</text>
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#666">e</text>
  <text x="120" y="314" text-anchor="middle" font-size="11" fill="#666">a</text>

  <!-- 第一行：边界 dp[0][j] = sum(s2[0..j-1]) -->
  <g filter="url(#sk)"><rect x="130" y="110" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="160" y="140" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="210" y="110" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="240" y="140" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">101</text>
  <g filter="url(#sk)"><rect x="290" y="110" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="140" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">198</text>
  <g filter="url(#sk)"><rect x="370" y="110" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="400" y="140" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">314</text>

  <!-- 第二行 dp[1][j] (s vs eat) -->
  <g filter="url(#sk)"><rect x="130" y="170" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="160" y="200" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">115</text>
  <g filter="url(#sk)"><rect x="210" y="170" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="240" y="200" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">216</text>
  <g filter="url(#sk)"><rect x="290" y="170" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="320" y="200" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">313</text>
  <g filter="url(#sk)"><rect x="370" y="170" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="400" y="200" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">429</text>

  <!-- 第三行 dp[2][j] (e vs eat) -->
  <g filter="url(#sk)"><rect x="130" y="230" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="160" y="260" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">216</text>
  <!-- 匹配格 dp[2][1] (e==e) 绿色高亮 -->
  <g filter="url(#sk)"><rect x="210" y="230" width="60" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="240" y="260" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">115</text>
  <!-- 不匹配格 dp[2][2] (e vs a) 红色高亮 -->
  <g filter="url(#sk)"><rect x="290" y="230" width="60" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="320" y="260" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">212</text>
  <g filter="url(#sk)"><rect x="370" y="230" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="400" y="260" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">328</text>

  <!-- 第四行 dp[3][j] (a vs eat) -->
  <g filter="url(#sk)"><rect x="130" y="290" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="160" y="320" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">313</text>
  <g filter="url(#sk)"><rect x="210" y="290" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="240" y="320" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">212</text>
  <g filter="url(#sk)"><rect x="290" y="290" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="320" y="320" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">115</text>
  <g filter="url(#sk)"><rect x="370" y="290" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="400" y="320" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">231</text>

  <!-- 匹配箭头：dp[1][0] → dp[2][1] (e==e, 对角) -->
  <path d="M 180 218 Q 210 224 232 230" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="178" y="228" font-size="10" fill="#4a8e4a" font-weight="bold">匹配 e==e</text>

  <!-- 不匹配箭头：dp[1][2] → dp[2][2] (删 s1 的 e, +101) 上箭头 -->
  <path d="M 320 218 L 320 230" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="4,2"/>
  <text x="336" y="226" font-size="10" fill="#b85450">删 s1 的 e (+101)</text>
  <!-- 不匹配箭头：dp[2][1] → dp[2][2] (删 s2 的 a, +97) 左箭头 -->
  <path d="M 270 254 L 290 254" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="248" font-size="10" fill="#b85450" font-weight="bold">删 s2 的 a (+97) ✓</text>

  <!-- 右侧：转移公式 -->
  <g filter="url(#sk)">
    <rect x="470" y="110" width="280" height="168" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="610" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">状态转移方程</text>
  <text x="490" y="160" font-size="11" fill="#4a8e4a" font-weight="bold">字符相同：</text>
  <text x="490" y="178" font-family="monospace" font-size="11" fill="#2b2b2b">dp[i][j] = dp[i-1][j-1]</text>
  <text x="490" y="206" font-size="11" fill="#b85450" font-weight="bold">字符不同：</text>
  <text x="490" y="224" font-family="monospace" font-size="11" fill="#2b2b2b">dp[i][j] = min(</text>
  <text x="510" y="240" font-size="10" fill="#b85450">dp[i-1][j] + s1[i-1]   删 s1</text>
  <text x="510" y="256" font-size="10" fill="#c98a2b">dp[i][j-1] + s2[j-1]   删 s2</text>
  <text x="600" y="272" font-size="11" fill="#2b2b2b">)</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="80" y="300" width="670" height="140" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="100" y="324" font-size="12" fill="#2b2b2b" font-weight="bold">两种情况的 DP 方向（只删不替，权重为字符 ASCII 值）：</text>
  <text x="100" y="350" font-size="11" fill="#4a8e4a" font-weight="bold">匹配 (↖)</text>
  <text x="180" y="350" font-size="11" fill="#444">dp[i-1][j-1] — 两字符相同，这对一起保留，删除和不变</text>
  <text x="100" y="374" font-size="11" fill="#b85450" font-weight="bold">删 s1 (↑)</text>
  <text x="180" y="374" font-size="11" fill="#444">dp[i-1][j] + ord(s1[i-1]) — 删掉 s1[i-1]，累加其 ASCII 值</text>
  <text x="100" y="398" font-size="11" fill="#c98a2b" font-weight="bold">删 s2 (←)</text>
  <text x="180" y="398" font-size="11" fill="#444">dp[i][j-1] + ord(s2[j-1]) — 删掉 s2[j-1]，累加其 ASCII 值</text>
  <text x="100" y="426" font-size="11" fill="#888">边界：dp[0][j]=Σ s2[0..j-1]，dp[i][0]=Σ s1[0..i-1]（空串须删光另一侧）　答案：dp[m][n]</text>
</svg>
