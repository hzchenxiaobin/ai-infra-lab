<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#999" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：除法是「跳板」，上界 U = 2x − y 封住值域</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">以 x = 54, y = 2 为例：纯 −1 需 52 步，借跳板只需 4 步（数轴非等比）</text>

  <!-- number line -->
  <path d="M 50 212 L 492 212" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ticks -->
  <path d="M 80 205 L 80 219 M 122 205 L 122 219 M 205 205 L 205 219 M 330 205 L 330 219 M 362 205 L 362 219 M 474 205 L 474 219" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="122" y="235" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y = 2</text>
  <text x="205" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="330" y="235" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 54</text>
  <text x="362" y="235" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">55</text>
  <text x="474" y="235" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">U = 106</text>
  <text x="474" y="250" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">（2x − y）</text>

  <!-- springboard path arcs -->
  <path d="M 330 208 Q 346 182 362 208" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="346" y="178" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+1</text>

  <path d="M 362 208 Q 284 106 205 208" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="284" y="112" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">÷11</text>
  <text x="284" y="128" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">一步顶 50 步</text>

  <path d="M 205 208 Q 142 146 80 208" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="142" y="150" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">÷5</text>

  <path d="M 80 208 Q 101 180 122 208" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="101" y="176" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+1</text>

  <!-- pure decrement baseline -->
  <path d="M 330 266 L 130 266" fill="none" stroke="#999" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="230" y="258" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">纯 −1：52 步 ✗</text>

  <!-- bottom note -->
  <rect x="40" y="286" width="440" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+1 是唯一的上升通道：爬到 m &gt; U 时光上升就 &gt; x − y 步，必不优</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#8a6420" filter="url(#rough2)">⇒ 最优路径整体落在 [1, U] 内（U ≤ 2×10⁴），状态空间有限，BFS 可行</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">注意：下界是 1 不是 y —— 本例下探到 1 &lt; y = 2 再折返</text>
</svg>
