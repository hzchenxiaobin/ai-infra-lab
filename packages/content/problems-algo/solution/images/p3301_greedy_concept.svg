<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：降序贪心 —— 每座塔顶着「双天花板」</text>
  <text x="260" y="38" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cap 天花板 a[i] ＋ 前塔天花板 h[i−1]−1，谁低听谁的</text>

  <!-- 塔区：示例 [4,3,3,2]（降序后），底线 y=214，每层高 34 -->
  <path d="M 30 214 L 300 214" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 塔 0：cap 4，实心 4 层 -->
  <rect x="44" y="78" width="46" height="136" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <path d="M 44 112 L 90 112 M 44 146 L 90 146 M 44 180 L 90 180" stroke="#8fa8c4" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="98" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">h=4</text>
  <text x="67" y="228" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cap 4</text>

  <!-- 塔 1：cap 3，实心 3 层 -->
  <rect x="102" y="112" width="46" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <path d="M 102 146 L 148 146 M 102 180 L 148 180" stroke="#8fa8c4" stroke-width="1" filter="url(#rough2)"/>
  <text x="125" y="132" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">h=3</text>
  <text x="125" y="228" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cap 3</text>

  <!-- 塔 2：cap 3（灰虚线），被 prev−1 压到 2 层（橙线） -->
  <rect x="160" y="146" width="46" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <path d="M 152 112 L 214 112" stroke="#8fa8c4" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 152 146 L 214 146" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M 183 118 L 183 140" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="183" y="96" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">前塔 h=3</text>
  <text x="207" y="130" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">⇒ ≤2</text>
  <text x="183" y="166" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">h=2</text>
  <text x="183" y="228" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cap 3</text>

  <!-- 塔 3：cap 2（灰虚线），被压到 1 层 -->
  <rect x="218" y="180" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <path d="M 210 146 L 272 146" stroke="#8fa8c4" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 210 180 L 272 180" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M 241 152 L 241 174" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="241" y="132" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">前塔 h=2</text>
  <text x="265" y="166" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">⇒ ≤1</text>
  <text x="241" y="200" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">h=1</text>
  <text x="241" y="228" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cap 2</text>

  <text x="165" y="244" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">输入 [2,3,4,3] → 降序 [4,3,3,2] → 高度 [4,3,2,1]，总高 10</text>

  <!-- 右侧：双约束与公式 -->
  <rect x="316" y="62" width="176" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="404" y="76" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">约束① h[i] ≤ a[i]</text>
  <text x="404" y="90" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">别超过自己的上限</text>

  <rect x="316" y="108" width="176" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="404" y="122" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">约束② h[i] ≤ h[i−1]−1</text>
  <text x="404" y="136" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">互不相同 + 降序 ⇒ 至少矮 1</text>

  <rect x="316" y="154" width="176" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="6" filter="url(#rough2)"/>
  <text x="404" y="170" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">h[i] = min(a[i], h[i−1]−1)</text>
  <text x="404" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">贪心：直接顶到较低的天花板</text>

  <rect x="316" y="202" width="176" height="24" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="404" y="218" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">首塔无前驱 ⇒ h[0] = a[0]</text>

  <!-- 底部：交换论证 -->
  <rect x="26" y="252" width="466" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="259" y="272" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">交换论证：高帽子本来就该戴在高个头上</text>
  <text x="259" y="292" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">若 a[i] ≥ a[j] 却 h[i] &lt; h[j]（矮个戴高帽）⇄ 交换两顶帽子：</text>
  <text x="259" y="310" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">h[j] ≤ a[j] ≤ a[i] ✓，h[i] &lt; h[j] ≤ a[j] ✓ —— 依然合法，总和不变</text>
  <text x="259" y="330" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">逐个消除「逆序」⇒ 存在最优解：cap 降序 ⇔ 高度也降序</text>
</svg>
