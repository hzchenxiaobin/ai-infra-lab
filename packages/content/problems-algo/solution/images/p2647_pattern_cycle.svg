<text x="446" y="259" font-size="10" fill="#b85450" font-weight="bold">k=0：染本行全部▲（奇数列）</text>
<text x="446" y="219" font-size="10" fill="#b85450" font-weight="bold">k=1：只染 (i,2)</text>
