<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：算术取位，位数奇偶定个位符号</text>

  <!-- Start -->
  <rect x="225" y="40" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="270" y="59" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">开始：n</text>
  <path d="M 270 70 L 270 80" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Count digits -->
  <rect x="150" y="84" width="240" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="104" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">统计位数 L</text>
  <text x="270" y="122" text-anchor="middle" font-size="11" fill="#555">L=0,m=n; while m&gt;0: m//=10; L+=1</text>
  <path d="M 270 132 L 270 140" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: L odd? -->
  <polygon points="200,176 270,140 340,176 270,212" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L 是奇数？</text>

  <!-- Yes branch -> right -->
  <path d="M 340 176 L 392 176" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="170" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="392" y="160" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="438" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">sign = +1</text>

  <!-- No branch -> left -->
  <path d="M 200 176 L 148 176" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="170" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="56" y="160" width="92" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="102" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">sign = −1</text>

  <!-- merge down from both sign boxes to ans=0 -->
  <path d="M 438 194 L 438 230 L 270 230" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 102 194 L 102 230 L 270 230" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 270 230 L 270 244" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = 0 -->
  <rect x="210" y="248" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="267" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>
  <path d="M 270 278 L 270 288" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: n > 0? -->
  <polygon points="200,326 270,290 340,326 270,362" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="331" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n &gt; 0？</text>

  <!-- No branch -> right -> return ans -->
  <path d="M 340 326 L 392 326" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="320" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="392" y="310" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="14" filter="url(#rough2)"/>
  <text x="442" y="332" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- Yes branch -> down to loop body -->
  <path d="M 270 362 L 270 372" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="356" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Loop body -->
  <rect x="130" y="376" width="280" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans += sign × (n % 10)</text>
  <text x="270" y="414" text-anchor="middle" font-size="11.5" fill="#555">n //= 10;  sign = −sign</text>

  <!-- loop back: from loop body left up to n>0 diamond left -->
  <path d="M 130 402 L 96 402 L 96 326 L 200 326" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="366" font-size="10.5" fill="#888">回到判定</text>
</svg>
