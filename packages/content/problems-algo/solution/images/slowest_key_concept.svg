<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心概念：第 i 次持续时间 = releaseTimes[i] − releaseTimes[i−1]（第 0 次 = releaseTimes[0]）</text>

  <!-- keysPressed label -->
  <text x="40" y="74" font-size="11" fill="#888">keysPressed =</text>

  <!-- Key cells (equal width for readability) -->
  <g filter="url(#rough2)">
    <rect x="110" y="52" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="200" y="52" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="290" y="52" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="380" y="52" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="20" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="150" y="80">c</text>
    <text x="240" y="80" fill="#b85450">b</text>
    <text x="330" y="80" fill="#b85450">c</text>
    <text x="420" y="80">d</text>
  </g>

  <!-- releaseTimes boundary labels (time = 0 at left edge of seg0) -->
  <text x="40" y="118" font-size="10" fill="#888">松开时刻 →</text>
  <g font-size="11" fill="#446688" text-anchor="middle" font-weight="bold">
    <text x="110" y="118">0</text>
    <text x="190" y="118">9</text>
    <text x="280" y="118">29</text>
    <text x="370" y="118">49</text>
    <text x="460" y="118">50</text>
  </g>
  <!-- boundary tick marks -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.2">
    <line x1="110" y1="98" x2="110" y2="104"/>
    <line x1="190" y1="98" x2="190" y2="104"/>
    <line x1="280" y1="98" x2="280" y2="104"/>
    <line x1="370" y1="98" x2="370" y2="104"/>
    <line x1="460" y1="98" x2="460" y2="104"/>
  </g>

  <!-- Duration bars (proportional, scale 20 -> 64px, floor 10px), baseline y=232 -->
  <!-- seg0 dur=9 -> h=29 ; seg1 dur=20 -> h=64 ; seg2 dur=20 -> h=64 ; seg3 dur=1 -> h=10 -->
  <g filter="url(#rough2)">
    <rect x="120" y="203" width="60" height="29" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="210" y="168" width="60" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="300" y="168" width="60" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="390" y="222" width="60" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <!-- duration value labels (above each bar) -->
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="150" y="197">9</text>
    <text x="240" y="162" fill="#b85450">20</text>
    <text x="330" y="162" fill="#b85450">20</text>
    <text x="420" y="216">1</text>
  </g>

  <!-- baseline -->
  <line x1="100" y1="232" x2="470" y2="232" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="480" y="236" font-size="10" fill="#999">时长</text>

  <!-- subtraction formula row -->
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="150" y="254">9 − 0</text>
    <text x="240" y="254" fill="#b85450" font-weight="bold">29 − 9</text>
    <text x="330" y="254" fill="#b85450" font-weight="bold">49 − 29</text>
    <text x="420" y="254">50 − 49</text>
  </g>

  <!-- max + tie-break highlight box -->
  <rect x="60" y="278" width="440" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="78" y="300" font-size="12" fill="#d6a040" font-weight="bold">最大持续时间 = 20（并列两段）</text>
  <text x="78" y="320" font-size="11" fill="#555">• 第 1 段按键 b：29 − 9 = 20</text>
  <text x="78" y="338" font-size="11" fill="#555">• 第 2 段按键 c：49 − 29 = 20</text>
  <text x="78" y="358" font-size="12" fill="#b85450" font-weight="bold">平手时取字母序更大者：c &gt; b → 返回 'c'</text>
  <text x="78" y="374" font-size="10" fill="#888">注：相邻段等宽绘制便于阅读，松开时刻以数字标注为准</text>
</svg>
