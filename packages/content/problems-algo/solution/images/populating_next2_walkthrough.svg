<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [1,2,3,4,5,null,7]</text>

  <!-- ============ 第 1 轮 ============ -->
  <rect x="24" y="44" width="532" height="116" fill="#ffffff" stroke="#ddd" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="64" font-size="11" fill="#b85450" font-weight="bold">第 1 轮 · levelStart = 1（第0层）</text>

  <!-- cur 行 -->
  <text x="40" y="88" font-size="10" fill="#446688">cur 横向走：</text>
  <circle cx="130" cy="84" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="88" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="152" y="88" font-size="10" fill="#999">→ null</text>

  <!-- 接孩子 -->
  <text x="220" y="88" font-size="10" fill="#888">接左 2、右 3</text>

  <!-- dummy 链 -->
  <text x="40" y="124" font-size="10" fill="#4a7a3a">dummy 链：</text>
  <rect x="104" y="112" width="40" height="22" fill="#eee" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="127" text-anchor="middle" font-size="8" fill="#777">dummy</text>
  <path d="M 144 123 L 168 123" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <circle cx="182" cy="123" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="127" text-anchor="middle" font-size="9" fill="#333">2</text>
  <path d="M 193 123 L 217 123" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <circle cx="231" cy="123" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="231" y="127" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="252" y="127" font-size="10" fill="#999">→ null</text>

  <text x="330" y="120" font-size="10" fill="#333">结果：</text>
  <text x="330" y="136" font-size="10" fill="#b85450" font-weight="bold">2 → 3 → #</text>
  <text x="430" y="128" font-size="10" fill="#4a7a3a">下一层头 = 2</text>

  <!-- ============ 第 2 轮 ============ -->
  <rect x="24" y="170" width="532" height="132" fill="#ffffff" stroke="#ddd" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="190" font-size="11" fill="#b85450" font-weight="bold">第 2 轮 · levelStart = 2（第1层）</text>

  <!-- cur 行 -->
  <text x="40" y="214" font-size="10" fill="#446688">cur 横向走：</text>
  <circle cx="130" cy="210" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="214" text-anchor="middle" font-size="10" fill="#333">2</text>
  <path d="M 142 210 L 166 210" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <circle cx="180" cy="210" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="214" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="200" y="214" font-size="10" fill="#999">→ null</text>

  <text x="250" y="214" font-size="10" fill="#888">2 接左4右5；3 跳null接右7</text>

  <!-- dummy 链 -->
  <text x="40" y="252" font-size="10" fill="#4a7a3a">dummy 链：</text>
  <rect x="104" y="240" width="40" height="22" fill="#eee" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="255" text-anchor="middle" font-size="8" fill="#777">dummy</text>
  <path d="M 144 251 L 168 251" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <circle cx="182" cy="251" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="255" text-anchor="middle" font-size="9" fill="#333">4</text>
  <path d="M 193 251 L 217 251" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <circle cx="231" cy="251" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="231" y="255" text-anchor="middle" font-size="9" fill="#333">5</text>
  <path d="M 242 251 Q 270 244 300 251" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="271" y="240" text-anchor="middle" font-size="8" fill="#b85450">跳null</text>
  <circle cx="314" cy="251" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="314" y="255" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="335" y="255" font-size="10" fill="#999">→ null</text>

  <text x="400" y="248" font-size="10" fill="#333">结果：</text>
  <text x="400" y="264" font-size="10" fill="#b85450" font-weight="bold">4 → 5 → 7 → #</text>
  <text x="400" y="280" font-size="10" fill="#4a7a3a">下一层头 = 4</text>

  <!-- ============ 第 3 轮 ============ -->
  <rect x="24" y="312" width="532" height="116" fill="#ffffff" stroke="#ddd" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="332" font-size="11" fill="#b85450" font-weight="bold">第 3 轮 · levelStart = 4（第2层）</text>

  <!-- cur 行 -->
  <text x="40" y="358" font-size="10" fill="#446688">cur 横向走：</text>
  <circle cx="130" cy="354" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="358" text-anchor="middle" font-size="9" fill="#333">4</text>
  <path d="M 141 354 L 165 354" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <circle cx="179" cy="354" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="179" y="358" text-anchor="middle" font-size="9" fill="#333">5</text>
  <path d="M 190 354 L 214 354" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <circle cx="228" cy="354" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="228" y="358" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="248" y="358" font-size="10" fill="#999">→ null</text>

  <text x="300" y="358" font-size="10" fill="#888">全是叶子，无孩子可接</text>

  <!-- dummy 链为空 -->
  <text x="40" y="396" font-size="10" fill="#4a7a3a">dummy 链：</text>
  <rect x="104" y="384" width="40" height="22" fill="#eee" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="399" text-anchor="middle" font-size="8" fill="#777">dummy</text>
  <text x="156" y="399" font-size="10" fill="#999">→ null</text>

  <text x="300" y="396" font-size="10" fill="#333">dummy.next = null</text>
  <text x="300" y="412" font-size="10" fill="#b85450" font-weight="bold">外层循环结束，返回 root</text>

  <!-- 最终结果 -->
  <rect x="24" y="436" width="532" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="454" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最终：1 → #  ｜  2 → 3 → #  ｜  4 → 5 → 7 → #</text>
</svg>
