<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：模拟到停机点，剩余操作按周期整块快进</text>

  <!-- 开始 -->
  <rect x="125" y="36" width="130" height="26" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="53" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输入 nums, k, multiplier</text>
  <path d="M190,62 L190,76" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 判断 1：multiplier == 1 ? -->
  <polygon points="190,76 252,98 190,120 128,98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="102" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">multiplier = 1 ?</text>
  <path d="M252,98 L296,98" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="274" y="92" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="300" y="85" width="168" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="102" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">直接返回 nums（乘 1 = 没乘）</text>
  <path d="M190,120 L190,136" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="200" y="132" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 建堆 -->
  <rect x="105" y="138" width="170" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="155" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">建小根堆 (值, 下标)；记 mx = max</text>
  <path d="M190,164 L190,180" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 判断 2：循环条件 -->
  <polygon points="190,180 262,208 190,236 118,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">k &gt; 0 且</text>
  <text x="190" y="219" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">堆顶 × m ≤ mx ?</text>
  <path d="M262,208 L304,208" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="283" y="202" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="308" y="195" width="150" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="383" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">弹堆顶 → ×m → 塞回；k−−</text>
  <path d="M383,194 C 383,162 280,158 200,176" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="300" y="166" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">逐轮模拟（真值，不取模）</text>
  <path d="M190,236 L190,252" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="200" y="248" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否（停机或 k 用完）</text>

  <!-- 周期快进 -->
  <rect x="95" y="254" width="190" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="271" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">依序出堆 = 升序表；q, r = k ÷ n, k % n</text>
  <path d="M190,280 L190,294" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="72" y="296" width="236" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="311" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans[i] = x · m^(q + (rank &lt; r)) mod p</text>
  <text x="190" y="327" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（p = 10^9+7，指数用快速幂；rank = 升序名次）</text>
  <path d="M190,334 L190,346" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="125" y="348" width="130" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="363" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- 旁注：两条出路合流 -->
  <text x="330" y="262" font-size="9.5" fill="#888" filter="url(#rough2)">注：k 提前用完时 q = r = 0，</text>
  <text x="330" y="276" font-size="9.5" fill="#888" filter="url(#rough2)">m^0 = 1，同一公式退化为 x mod p</text>
  <text x="330" y="290" font-size="9.5" fill="#888" filter="url(#rough2)">—— 模拟耗尽 / 停机快进两条出路合流，</text>
  <text x="330" y="304" font-size="9.5" fill="#888" filter="url(#rough2)">无需单独分支收尾。</text>

  <text x="60" y="342" font-size="9.5" fill="#888" filter="url(#rough2)">菱形 = 判断；矩形 = 动作；</text>
  <text x="60" y="356" font-size="9.5" fill="#888" filter="url(#rough2)">红回路 = 模拟循环</text>
</svg>
