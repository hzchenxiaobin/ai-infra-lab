<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：4 个用例的逐位贪心填充</text>
  <text x="300" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">红色 = 输入 '?' ；绿色 = 贪心填入的数字 ；灰色 = 原有数字</text>

  <!-- ===== Column headers ===== -->
  <text x="92" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">输入</text>
  <text x="262" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">输出</text>
  <text x="430" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">填充说明</text>

  <!-- ============================================================ -->
  <!-- Row 1: "2?:?0" → "23:50"   y_center = 105 -->
  <!-- ============================================================ -->
  <text x="36" y="110" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1</text>
  <!-- input boxes -->
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="80" y="89" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="92" y="110" fill="#888">2</text>
    <rect x="107" y="89" width="24" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="119" y="110" fill="#b85450">?</text>
    <text x="138" y="110" fill="#888">:</text>
    <rect x="146" y="89" width="24" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="158" y="110" fill="#b85450">?</text>
    <rect x="173" y="89" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="185" y="110" fill="#888">0</text>
  </g>
  <!-- arrow -->
  <path d="M 205 105 L 232 105" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- output boxes -->
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="250" y="89" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="262" y="110" fill="#888">2</text>
    <rect x="277" y="89" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="289" y="110" fill="#4a7a3a">3</text>
    <text x="308" y="110" fill="#888">:</text>
    <rect x="316" y="89" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="328" y="110" fill="#4a7a3a">5</text>
    <rect x="343" y="89" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="355" y="110" fill="#888">0</text>
  </g>
  <!-- annotation -->
  <text x="385" y="100" font-size="10" fill="#555" filter="url(#rough2)">h2='?' + h1='2' → <tspan fill="#4a7a3a" font-weight="bold">'3'</tspan></text>
  <text x="385" y="116" font-size="10" fill="#555" filter="url(#rough2)">m1='?' → <tspan fill="#4a7a3a" font-weight="bold">'5'</tspan></text>

  <!-- ============================================================ -->
  <!-- Row 2: "0?:3?" → "09:39"   y_center = 175 -->
  <!-- ============================================================ -->
  <text x="36" y="180" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2</text>
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="80" y="159" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="92" y="180" fill="#888">0</text>
    <rect x="107" y="159" width="24" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="119" y="180" fill="#b85450">?</text>
    <text x="138" y="180" fill="#888">:</text>
    <rect x="146" y="159" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="158" y="180" fill="#888">3</text>
    <rect x="173" y="159" width="24" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="185" y="180" fill="#b85450">?</text>
  </g>
  <path d="M 205 175 L 232 175" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="250" y="159" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="262" y="180" fill="#888">0</text>
    <rect x="277" y="159" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="289" y="180" fill="#4a7a3a">9</text>
    <text x="308" y="180" fill="#888">:</text>
    <rect x="316" y="159" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="328" y="180" fill="#888">3</text>
    <rect x="343" y="159" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="355" y="180" fill="#4a7a3a">9</text>
  </g>
  <text x="385" y="170" font-size="10" fill="#555" filter="url(#rough2)">h2='?' + h1='0' → <tspan fill="#4a7a3a" font-weight="bold">'9'</tspan></text>
  <text x="385" y="186" font-size="10" fill="#555" filter="url(#rough2)">m2='?' → <tspan fill="#4a7a3a" font-weight="bold">'9'</tspan></text>

  <!-- ============================================================ -->
  <!-- Row 3: "?5:03" → "15:03"   y_center = 245  (KEY CASE) -->
  <!-- ============================================================ -->
  <text x="36" y="250" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3</text>
  <g filter="url(#rough2)" font-size="9" fill="#b85450" font-weight="bold">
    <rect x="30" y="256" width="40" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6"/>
    <text x="50" y="267" text-anchor="middle">⚠ 关键</text>
  </g>
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="80" y="229" width="24" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="92" y="250" fill="#b85450">?</text>
    <rect x="107" y="229" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="119" y="250" fill="#888">5</text>
    <text x="138" y="250" fill="#888">:</text>
    <rect x="146" y="229" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="158" y="250" fill="#888">0</text>
    <rect x="173" y="229" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="185" y="250" fill="#888">3</text>
  </g>
  <path d="M 205 245 L 232 245" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="250" y="229" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="262" y="250" fill="#4a7a3a">1</text>
    <rect x="277" y="229" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="289" y="250" fill="#888">5</text>
    <text x="308" y="250" fill="#888">:</text>
    <rect x="316" y="229" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="328" y="250" fill="#888">0</text>
    <rect x="343" y="229" width="24" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="355" y="250" fill="#888">3</text>
  </g>
  <text x="385" y="240" font-size="10" fill="#555" filter="url(#rough2)">h1='?' + h2='5' &gt; '3'</text>
  <text x="385" y="256" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ h1 退到 '1'（非 '2'）</text>

  <!-- ============================================================ -->
  <!-- Row 4: "??:??" → "23:59"   y_center = 320 -->
  <!-- ============================================================ -->
  <text x="36" y="325" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 4</text>
  <text x="36" y="340" font-size="9" fill="#888" filter="url(#rough2)">全 '?' 情况</text>
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="80" y="304" width="24" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="92" y="325" fill="#b85450">?</text>
    <rect x="107" y="304" width="24" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="119" y="325" fill="#b85450">?</text>
    <text x="138" y="325" fill="#888">:</text>
    <rect x="146" y="304" width="24" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="158" y="325" fill="#b85450">?</text>
    <rect x="173" y="304" width="24" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="185" y="325" fill="#b85450">?</text>
  </g>
  <path d="M 205 320 L 232 320" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="250" y="304" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="262" y="325" fill="#4a7a3a">2</text>
    <rect x="277" y="304" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="289" y="325" fill="#4a7a3a">3</text>
    <text x="308" y="325" fill="#888">:</text>
    <rect x="316" y="304" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="328" y="325" fill="#4a7a3a">5</text>
    <rect x="343" y="304" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="355" y="325" fill="#4a7a3a">9</text>
  </g>
  <text x="385" y="315" font-size="10" fill="#555" filter="url(#rough2)">h2='?' → h1=<tspan fill="#4a7a3a" font-weight="bold">'2'</tspan></text>
  <text x="385" y="331" font-size="10" fill="#555" filter="url(#rough2)">h1='2' → h2=<tspan fill="#4a7a3a" font-weight="bold">'3'</tspan>；m1=<tspan fill="#4a7a3a" font-weight="bold">'5'</tspan>, m2=<tspan fill="#4a7a3a" font-weight="bold">'9'</tspan></text>

  <!-- ===== Footer summary ===== -->
  <rect x="40" y="372" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="392" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">规律总结：</text>
  <text x="52" y="408" font-size="10" fill="#555" filter="url(#rough2)">h2 已知且 &gt; '3' 时，h1 必须退到 '1'（示例 3）；其余情况 h1 尽量取 '2'，h2 在 h1 约束下取最大。</text>
  <text x="52" y="420" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">四个示例输出 23:50 / 09:39 / 15:03 / 23:59 与官方一致 ✓</text>
</svg>
