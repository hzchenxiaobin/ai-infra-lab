<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：判完全平方 → 判质数</text>

  <!-- Start -->
  <rect x="205" y="44" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="240" y="63" text-anchor="middle" font-size="12" fill="#333">输入 n</text>

  <path d="M 240 72 L 240 92" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- k = isqrt(n) -->
  <rect x="170" y="92" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="111" text-anchor="middle" font-size="12" fill="#333">k = ⌊√n⌋（整数开方）</text>

  <path d="M 240 120 L 240 140" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond 1: k² == n ? -->
  <path d="M 240 140 L 330 178 L 240 216 L 150 178 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="174" text-anchor="middle" font-size="11.5" fill="#333">k² == n ?</text>
  <text x="240" y="190" text-anchor="middle" font-size="10.5" fill="#888">(n 是完全平方?)</text>

  <!-- No branch → left to false -->
  <path d="M 150 178 L 96 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="124" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="22" y="164" width="74" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="59" y="183" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes branch → down -->
  <path d="M 240 216 L 240 238" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="256" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Prime check loop label -->
  <rect x="160" y="238" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="257" text-anchor="middle" font-size="11.5" fill="#333">for i = 2 to ⌊√k⌋</text>

  <path d="M 240 266 L 240 286" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond 2: k % i == 0 ? -->
  <path d="M 240 286 L 330 324 L 240 362 L 150 324 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="320" text-anchor="middle" font-size="11.5" fill="#333">k % i == 0 ?</text>
  <text x="240" y="336" text-anchor="middle" font-size="10.5" fill="#888">(k 被 i 整除?)</text>

  <!-- Yes (found factor) → left to false -->
  <path d="M 150 324 L 96 324" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="124" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="22" y="310" width="74" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="59" y="329" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>

  <!-- No → loop back up to for-i -->
  <path d="M 330 324 L 372 324" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="352" y="316" text-anchor="middle" font-size="11" fill="#888">否</text>
  <path d="M 372 324 Q 410 324 410 252 L 320 252" stroke="#aaa" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="426" y="290" font-size="10.5" fill="#888" transform="rotate(-90 426 290)">下一 i</text>

  <!-- Loop exhausted → down to true -->
  <path d="M 240 362 L 240 388" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="266" y="380" font-size="10.5" fill="#4a7a3a">循环结束</text>

  <rect x="190" y="388" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="240" y="407" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- Side note -->
  <text x="170" y="430" font-size="10.5" fill="#888">特例：n = 1 时 k = 1，1 非质数 → return false</text>
</svg>
