<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：枚举根 i，左右子树做笛卡尔积</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">选定根 i 后递归构造左子树列表与右子树列表，两两配对拼出新树</text>

  <!-- ===== Root ===== -->
  <ellipse cx="260" cy="92" rx="46" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">根 = i</text>
  <text x="260" y="102" text-anchor="middle" font-size="9" fill="#b85450">值 {1..n} 中任选</text>

  <!-- arrows root -> left / right -->
  <path d="M 226 108 Q 180 140 150 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 294 108 Q 340 140 370 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Left subtree box ===== -->
  <rect x="60" y="160" width="180" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">左子树列表</text>
  <text x="150" y="200" text-anchor="middle" font-size="10" fill="#333">build(start, i-1)</text>
  <text x="150" y="216" text-anchor="middle" font-size="10" fill="#333">返回一个「树列表」</text>
  <text x="150" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">→ 多棵具体 BST</text>

  <!-- ===== Right subtree box ===== -->
  <rect x="280" y="160" width="180" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">右子树列表</text>
  <text x="370" y="200" text-anchor="middle" font-size="10" fill="#333">build(i+1, end)</text>
  <text x="370" y="216" text-anchor="middle" font-size="10" fill="#333">返回一个「树列表」</text>
  <text x="370" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 多棵具体 BST</text>

  <!-- Cartesian product sign between boxes -->
  <circle cx="260" cy="199" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">⊗</text>
  <text x="260" y="184" text-anchor="middle" font-size="8" fill="#d6a040">笛卡尔积</text>

  <!-- ===== Combine box ===== -->
  <rect x="70" y="252" width="380" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#333">每对 (L, R) → new TreeNode(i, L, R)，加入结果列表</text>

  <!-- ===== Note ===== -->
  <rect x="40" y="292" width="440" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">与 96 题同结构，区别：96 把树压缩成「计数」相乘</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#555">95 必须真正构造树形 → 递归返回「树列表」而非数字</text>
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#888">空区间返回 [None]（含一棵空树），对应 96 的 G(0)=1</text>
</svg>
