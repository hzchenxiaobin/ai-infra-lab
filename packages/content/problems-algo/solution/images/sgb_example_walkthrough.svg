<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = "13"，求最小好进制</text>

  <!-- Step 0: compute m_max -->
  <rect x="40" y="44" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">m_max = ⌊log₂(13+1)⌋ = ⌊3.81⌋ = 3 → 枚举 m = 3, 2</text>

  <!-- ===== m = 3 panel ===== -->
  <rect x="30" y="92" width="260" height="180" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6,3" rx="10" filter="url(#rough2)"/>
  <text x="160" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">m = 3：二分 k 使 1+k+k² = 13</text>

  <!-- binary search steps table -->
  <text x="44" y="130" font-size="10" fill="#888" font-weight="bold">轮次   lo   hi   mid   f(mid)=1+mid+mid²</text>

  <text x="44" y="148" font-size="11" fill="#333">第1轮  2    4    3     1+3+9 = 13 ✓</text>
  <rect x="38" y="136" width="240" height="18" fill="#e6f4ea" stroke="none" opacity="0.5" rx="3" filter="url(#rough2)"/>

  <!-- hi computation note -->
  <text x="44" y="172" font-size="10" fill="#888">hi = ⌊13^(1/2)⌋ + 2 = 3 + 2 = 5 → 取 4</text>
  <text x="44" y="186" font-size="10" fill="#888">（k² ≤ 13 ⇒ k ≤ 3，余量 +1）</text>

  <!-- found callout -->
  <rect x="44" y="200" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="154" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">命中！k = 3</text>
  <text x="154" y="236" text-anchor="middle" font-size="10" fill="#555">13 的 3 进制 = 111 ✓</text>

  <!-- check arrow -->
  <path d="M 154 248 L 154 260" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== m = 2 panel (skipped, but shown for contrast) ===== -->
  <rect x="300" y="92" width="250" height="180" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4,3" rx="10" filter="url(#rough2)"/>
  <text x="425" y="110" text-anchor="middle" font-size="12" fill="#aaa" font-weight="bold">m = 2（不必再试）</text>

  <text x="314" y="132" font-size="11" fill="#aaa">1 + k = 13 ⇒ k = 12</text>
  <text x="314" y="150" font-size="10" fill="#bbb">13 的 12 进制 = 11</text>

  <rect x="314" y="168" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="424" y="188" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k = 12 &gt; 3</text>
  <text x="424" y="204" text-anchor="middle" font-size="10" fill="#888">m 更小 → k 更大，非最优</text>

  <text x="314" y="230" font-size="10" fill="#aaa">m=3 已找到 k=3</text>
  <text x="314" y="246" font-size="10" fill="#aaa">直接返回，无需继续</text>

  <!-- ===== Bottom: verify representation ===== -->
  <rect x="40" y="290" width="480" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">验证：13 的 3 进制表示</text>

  <!-- place values -->
  <rect x="120" y="326" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="348" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="145" y="376" text-anchor="middle" font-size="9" fill="#888">3⁰ = 1</text>

  <rect x="180" y="326" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="348" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="205" y="376" text-anchor="middle" font-size="9" fill="#888">3¹ = 3</text>

  <rect x="240" y="326" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="348" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="265" y="376" text-anchor="middle" font-size="9" fill="#888">3² = 9</text>

  <!-- sum -->
  <text x="310" y="346" font-size="16" fill="#888">→</text>
  <rect x="330" y="326" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="348" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">13</text>
  <text x="360" y="376" text-anchor="middle" font-size="9" fill="#888">1+3+9</text>

  <!-- result -->
  <text x="410" y="346" font-size="14" fill="#4a7a3a" font-weight="bold">k = 3 ✓</text>
  <text x="410" y="364" font-size="10" fill="#888">全 1 → 好进制</text>
</svg>
