<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=1→7 时两状态值</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">每行由上一行按转移方程累加，Σ 即答案</text>

  <!-- ===== Table header ===== -->
  <g font-size="11" fill="#333">
    <text x="108" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">n</text>
    <text x="172" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">aba</text>
    <text x="264" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">abc</text>
    <text x="370" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">Σ = aba+abc</text>
  </g>

  <!-- ===== Row n=1 (init) ===== -->
  <g>
    <rect x="90" y="90" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="108" y="107" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="126" y="90" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="172" y="107" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
    <rect x="218" y="90" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="264" y="107" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
    <rect x="310" y="90" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="370" y="107" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">12</text>
  </g>

  <!-- ===== Row n=2 ===== -->
  <g>
    <rect x="90" y="114" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="108" y="131" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="126" y="114" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="172" y="131" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">30</text>
    <rect x="218" y="114" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="264" y="131" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">24</text>
    <rect x="310" y="114" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="370" y="131" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">54</text>
  </g>

  <!-- ===== Row n=3 ===== -->
  <g>
    <rect x="90" y="138" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="108" y="155" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
    <rect x="126" y="138" width="92" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="172" y="155" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">138</text>
    <rect x="218" y="138" width="92" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="264" y="155" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">108</text>
    <rect x="310" y="138" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="370" y="155" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">246</text>
  </g>

  <!-- ===== Row n=4 ===== -->
  <g>
    <rect x="90" y="162" width="36" height="24" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="108" y="179" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">4</text>
    <rect x="126" y="162" width="92" height="24" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="172" y="179" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">630</text>
    <rect x="218" y="162" width="92" height="24" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="264" y="179" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">492</text>
    <rect x="310" y="162" width="120" height="24" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="370" y="179" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">1122</text>
  </g>

  <!-- ===== Row n=5 ===== -->
  <g>
    <rect x="90" y="186" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="108" y="203" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
    <rect x="126" y="186" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="172" y="203" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2874</text>
    <rect x="218" y="186" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="264" y="203" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2244</text>
    <rect x="310" y="186" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="370" y="203" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5118</text>
  </g>

  <!-- ===== Row n=6 ===== -->
  <g>
    <rect x="90" y="210" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="108" y="227" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="126" y="210" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="172" y="227" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">13110</text>
    <rect x="218" y="210" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="264" y="227" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">10236</text>
    <rect x="310" y="210" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="370" y="227" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">23346</text>
  </g>

  <!-- ===== Row n=7 (answer, emphasized) ===== -->
  <g>
    <rect x="90" y="234" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="108" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7</text>
    <rect x="126" y="234" width="92" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="172" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">59802</text>
    <rect x="218" y="234" width="92" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="264" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">46692</text>
    <rect x="310" y="234" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="370" y="252" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">106494</text>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="60" y="275" width="400" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="76" y="282" width="11" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="92" y="291" font-size="9" fill="#555">n=1 初值</text>
  <rect x="150" y="282" width="11" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="166" y="291" font-size="9" fill="#555">n=3</text>
  <rect x="200" y="282" width="11" height="11" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="216" y="291" font-size="9" fill="#555">n=4</text>
  <rect x="250" y="282" width="11" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="266" y="291" font-size="9" fill="#555">n=7 答案</text>

  <!-- ===== Result note ===== -->
  <rect x="60" y="308" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">n=7：59802 + 46692 = 106494（示例 4 ✓）</text>
  <text x="260" y="342" text-anchor="middle" font-size="9" fill="#888">验证 n=2：3·6+2·6=30，2·6+2·6=24，Σ=54 ✓</text>
</svg>
