<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">累计体重逐人叠加，1000 kg 为上车门槛</text>

  <!-- Y-axis label -->
  <text x="30" y="56" font-size="10" fill="#888">turn</text>
  <text x="65" y="56" font-size="10" fill="#888">姓名</text>
  <text x="125" y="56" font-size="10" fill="#888">累计体重(kg)</text>

  <!-- Threshold line at 1000 kg: x = 120 + 1000*0.27 = 120 + 270 = 390 -->
  <path d="M 390 46 L 390 270" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="350" y="34" width="80" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="46" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1000 kg 门槛</text>

  <!-- Turn 1: Alice, cumulative 250 → 67.5px → x=120 to 188 -->
  <text x="40" y="74" font-size="10" fill="#888">1</text>
  <text x="65" y="74" font-size="10" fill="#333">Alice</text>
  <rect x="120" y="62" width="68" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="76" font-size="10" fill="#4a7a3a" font-weight="bold">250</text>
  <text x="470" y="76" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 上车</text>

  <!-- Turn 2: Alex, cumulative 600 → 162px → x=120 to 282 -->
  <text x="40" y="110" font-size="10" fill="#888">2</text>
  <text x="65" y="110" font-size="10" fill="#333">Alex</text>
  <rect x="120" y="98" width="162" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="289" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">600</text>
  <text x="470" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 上车</text>

  <!-- Turn 3: John Cena, cumulative 1000 → 270px → x=120 to 390 -->
  <text x="40" y="146" font-size="10" fill="#888">3</text>
  <text x="65" y="146" font-size="10" fill="#333">John Cena</text>
  <rect x="120" y="134" width="270" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="397" y="148" font-size="10" fill="#4a7a3a" font-weight="bold">1000</text>
  <text x="470" y="148" font-size="10" fill="#b85450" font-weight="bold">✓ 最后！</text>

  <!-- Turn 4: Marie, cumulative 1200 → 324px → x=120 to 444 (exceeds) -->
  <text x="40" y="182" font-size="10" fill="#888">4</text>
  <text x="65" y="182" font-size="10" fill="#333">Marie</text>
  <rect x="120" y="170" width="270" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="170" width="54" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="451" y="184" font-size="10" fill="#b85450" font-weight="bold">1200</text>
  <text x="470" y="200" font-size="10" fill="#b85450" font-weight="bold">✗ 超重</text>

  <!-- Turn 5: Bob, can't board -->
  <text x="40" y="218" font-size="10" fill="#bbb">5</text>
  <text x="65" y="218" font-size="10" fill="#bbb">Bob</text>
  <rect x="120" y="206" width="60" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="220" font-size="9" fill="#bbb">无法上车</text>
  <text x="470" y="220" font-size="10" fill="#bbb">✗</text>

  <!-- Turn 6: Winston, can't board -->
  <text x="40" y="254" font-size="10" fill="#bbb">6</text>
  <text x="65" y="254" font-size="10" fill="#bbb">Winston</text>
  <rect x="120" y="242" width="60" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="256" font-size="9" fill="#bbb">无法上车</text>
  <text x="470" y="256" font-size="10" fill="#bbb">✗</text>

  <!-- Divider -->
  <path d="M 30 282 L 530 282" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Bottom: key insight -->
  <rect x="40" y="294" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#444">按 turn 排序 → 累计求和 → 取累计 ≤ 1000 的最后一行</text>

  <!-- Result box -->
  <rect x="140" y="336" width="280" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案：John Cena</text>
</svg>
