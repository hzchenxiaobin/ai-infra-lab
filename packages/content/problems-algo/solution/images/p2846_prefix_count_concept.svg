<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心观察②：树上前缀计数 —— 路径权频的容斥
  </text>

  <!-- edges (example 2 tree rooted at 0, query a=4, b=6, LCA=3) -->
  <path d="M219,72 L166,118" stroke="#446688" stroke-width="2.5" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <path d="M243,70 L317,120" stroke="#999" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M144,138 L96,186" stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M166,138 L219,186" stroke="#d6a040" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M230,211 L230,247" stroke="#d6a040" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M218,271 L162,313" stroke="#d6a040" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M242,271 L298,313" stroke="#999" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- edge labels -->
  <text x="182" y="88" font-size="11" fill="#446688" filter="url(#rough2)">w=8</text>
  <text x="285" y="86" font-size="11" fill="#888" filter="url(#rough2)">w=2</text>
  <text x="100" y="150" font-size="11" fill="#4a7a3a" filter="url(#rough2)">w=6</text>
  <text x="204" y="150" font-size="11" fill="#d6a040" filter="url(#rough2)">w=4</text>
  <text x="246" y="233" font-size="11" fill="#d6a040" filter="url(#rough2)">w=6</text>
  <text x="172" y="299" font-size="11" fill="#d6a040" filter="url(#rough2)">w=6</text>
  <text x="284" y="299" font-size="11" fill="#888" filter="url(#rough2)">w=3</text>

  <!-- nodes -->
  <text x="230" y="44" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">根</text>
  <ellipse cx="230" cy="62" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="67" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>

  <text x="118" y="122" font-size="11" fill="#b85450" filter="url(#rough2)">LCA</text>
  <ellipse cx="155" cy="128" rx="15" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="155" y="133" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>

  <ellipse cx="330" cy="128" rx="15" ry="15" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="133" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">7</text>

  <text x="56" y="200" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <ellipse cx="85" cy="196" rx="15" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="85" y="201" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">6</text>

  <ellipse cx="230" cy="196" rx="15" ry="15" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="201" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">1</text>

  <ellipse cx="230" cy="262" rx="15" ry="15" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="267" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">2</text>

  <text x="120" y="326" font-size="11" fill="#d6a040" filter="url(#rough2)">a</text>
  <ellipse cx="150" cy="322" rx="15" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="327" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">4</text>

  <ellipse cx="310" cy="322" rx="15" ry="15" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="327" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">5</text>

  <!-- formula box -->
  <rect x="352" y="66" width="158" height="190" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="431" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">路径 (a=4, b=6)</text>
  <text x="431" y="112" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">freq[w] =</text>
  <text x="431" y="130" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">cnt[4][w] + cnt[6][w]</text>
  <text x="431" y="148" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">− 2·cnt[3][w]</text>
  <text x="431" y="172" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">逐权验证：</text>
  <text x="431" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">w=6: 2+1−0 = 3</text>
  <text x="431" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">w=4: 1+0−0 = 1</text>
  <text x="431" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">w=8: 1+1−2 = 0</text>
  <text x="431" y="248" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">L=4，ans=4−3=1</text>

  <!-- legend -->
  <path d="M30,354 L62,354" stroke="#d6a040" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <text x="68" y="358" font-size="11" fill="#666" filter="url(#rough2)">a→LCA 段</text>
  <path d="M150,354 L182,354" stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <text x="188" y="358" font-size="11" fill="#666" filter="url(#rough2)">b→LCA 段</text>
  <path d="M270,354 L302,354" stroke="#446688" stroke-width="2.5" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="308" y="358" font-size="11" fill="#666" filter="url(#rough2)">根→LCA（×2 减掉）</text>

  <text x="260" y="386" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    与数组前缀和 sum[l..r] = S[r+1] − S[l] 同源：树上前缀和 / 树上差分
  </text>
</svg>
