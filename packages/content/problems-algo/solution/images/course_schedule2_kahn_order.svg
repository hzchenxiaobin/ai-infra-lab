<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Kahn 出队顺序 = 拓扑序：边剥边记入 order</text>

  <!-- ===== Left: DAG ===== -->
  <!-- Edges -->
  <path d="M 112 196 L 196 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 112 224 L 196 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 132 L 324 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 288 L 324 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Nodes -->
  <circle cx="90" cy="210" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="215" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <circle cx="220" cy="120" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="125" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <circle cx="220" cy="300" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="305" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <circle cx="350" cy="210" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="215" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- dequeue labels under nodes -->
  <text x="90" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">第1个出队</text>
  <text x="220" y="88" text-anchor="middle" font-size="10" fill="#446688">第2/3个</text>
  <text x="350" y="250" text-anchor="middle" font-size="10" fill="#446688">最后出队</text>

  <!-- ===== Middle arrow ===== -->
  <path d="M 374 210 L 410 210" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">出队</text>
  <text x="392" y="226" text-anchor="middle" font-size="10" fill="#b85450">追加</text>

  <!-- ===== Right: order array ===== -->
  <text x="490" y="168" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">结果 order</text>

  <rect x="424" y="178" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="441" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>

  <rect x="458" y="178" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="492" y="178" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="509" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="526" y="178" width="24" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="538" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="490" y="232" text-anchor="middle" font-size="10" fill="#888">先入在前，按出队先后填</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="270" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">207 只判能否完成(count==n)；210 要输出一个合法顺序</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#555">把 207 的 count++ 换成 order.push_back(u)，出队先后即拓扑序</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#b85450">若 order.size() &lt; n 说明有环，返回空数组 []</text>
</svg>
