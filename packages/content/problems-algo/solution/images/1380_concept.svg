<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：行最小(绿) ∩ 列最大(橙) = 幸运数(红★)</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">元素互异 ⇒ 至多一个幸运数，且 = max(行最小) = min(列最大)</text>

  <!-- column index labels -->
  <g font-size="10" fill="#888">
    <text x="168" y="86" text-anchor="middle">col 0</text>
    <text x="228" y="86" text-anchor="middle">col 1</text>
    <text x="288" y="86" text-anchor="middle">col 2</text>
  </g>

  <!-- row index labels -->
  <g font-size="10" fill="#888">
    <text x="128" y="129" text-anchor="end">row 0</text>
    <text x="128" y="175" text-anchor="end">row 1</text>
    <text x="128" y="221" text-anchor="end">row 2</text>
  </g>

  <!-- matrix cells: 3x3  [[3,7,8],[9,11,13],[15,16,17]] -->
  <!-- row 0 -->
  <g font-size="17">
    <rect x="138" y="106" width="60" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="168" y="136" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="198" y="106" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="228" y="136" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
    <rect x="258" y="106" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="288" y="136" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
  </g>
  <!-- row 1 -->
  <g font-size="17">
    <rect x="138" y="152" width="60" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="168" y="182" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="198" y="152" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="228" y="182" text-anchor="middle" fill="#446688" font-weight="bold">11</text>
    <rect x="258" y="152" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="288" y="182" text-anchor="middle" fill="#446688" font-weight="bold">13</text>
  </g>
  <!-- row 2: 15=lucky(red), 16/17=col max(orange) ; 15 also row min(green) -> red -->
  <g font-size="17">
    <rect x="138" y="198" width="60" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
    <text x="168" y="228" text-anchor="middle" fill="#b85450" font-weight="bold">15</text>
    <rect x="198" y="198" width="60" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="228" y="228" text-anchor="middle" fill="#d6a040" font-weight="bold">16</text>
    <rect x="258" y="198" width="60" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="288" y="228" text-anchor="middle" fill="#d6a040" font-weight="bold">17</text>
  </g>

  <!-- lucky star on (2,0)=15 -->
  <text x="168" y="200" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">★</text>

  <!-- row-min indicator: green arrows pointing left to col0 cells -->
  <path d="M 132 129 L 138 129" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 132 175 L 138 175" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="86" y="98" font-size="10" fill="#4a7a3a" font-weight="bold">行最小</text>
  <path d="M 104 104 L 120 124" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- col-max indicator: orange arrows pointing down to row2 cells -->
  <path d="M 168 248 L 168 254" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 228 248 L 228 254" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 288 248 L 288 254" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="320" y="262" font-size="10" fill="#d6a040" font-weight="bold">列最大</text>

  <!-- right side: saddle point computation -->
  <rect x="360" y="106" width="240" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">行最小集合 = {3, 9, 15}</text>
  <text x="480" y="148" text-anchor="middle" font-size="11" fill="#666">max(行最小) = 15</text>

  <rect x="360" y="178" width="240" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">列最大集合 = {15, 16, 17}</text>
  <text x="480" y="220" text-anchor="middle" font-size="11" fill="#666">min(列最大) = 15</text>

  <rect x="360" y="250" width="240" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">15 == 15 → 唯一幸运数</text>
  <text x="480" y="286" text-anchor="middle" font-size="10" fill="#888">互异 ⇒ 两个集合至多一个公共元素</text>

  <!-- bottom note -->
  <rect x="40" y="312" width="560" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="334" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">幸运数 = 同时是「本行最小」且「本列最大」的元素</text>
  <text x="310" y="354" text-anchor="middle" font-size="11" fill="#666">预计算 minRow[i] 与 maxCol[j]，再扫一遍判定 matrix[i][j] 是否同时等于二者</text>
  <text x="310" y="372" text-anchor="middle" font-size="10" fill="#888">进阶：元素互异时 max(行最小)=min(列最大) 即为唯一解（鞍点定理）</text>
</svg>
