<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：每个值的频次必须为偶数，才能两两配对</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">n 个数对 ⇔ 每个值出现偶数次 ⇔ 频次全偶</text>

  <!-- ===== Array row: nums = [3,2,3,2,2,2] ===== -->
  <text x="28" y="68" font-size="10.5" fill="#666">数组</text>
  <!-- index labels -->
  <text x="78" y="60" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="118" y="60" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="158" y="60" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="198" y="60" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="238" y="60" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="278" y="60" text-anchor="middle" font-size="9" fill="#888">5</text>
  <!-- value boxes -->
  <rect x="58" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="98" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="138" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="178" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="218" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="258" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- arrow down to frequency table -->
  <path d="M 168 96 L 168 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="108" font-size="9.5" fill="#888">统计频次</text>

  <!-- ===== Frequency table ===== -->
  <text x="28" y="130" font-size="10.5" fill="#666">频次表</text>
  <!-- value 2 -> 4 -->
  <rect x="60" y="118" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="139" font-size="11.5" fill="#333">值 2 → 频次 4</text>
  <text x="184" y="139" font-size="10" fill="#4a7a3a" font-weight="bold">偶 ✓</text>
  <!-- value 3 -> 2 -->
  <rect x="210" y="118" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="222" y="139" font-size="11.5" fill="#333">值 3 → 频次 2</text>
  <text x="334" y="139" font-size="10" fill="#4a7a3a" font-weight="bold">偶 ✓</text>

  <!-- arrow down to pairing -->
  <path d="M 205 154 L 205 170" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="219" y="166" font-size="9.5" fill="#888">全偶 → 可配对</text>

  <!-- ===== Pairing result ===== -->
  <rect x="40" y="176" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">配对结果：(2,2) (2,2) (3,3) → 3 对，全部相等 ✓</text>
  <text x="260" y="214" text-anchor="middle" font-size="10.5" fill="#555">频次 4 → 2 对；频次 2 → 1 对；总对数 = 频次之和 / 2 = n</text>

  <!-- ===== Counter example ===== -->
  <text x="28" y="258" font-size="10.5" fill="#666">反例</text>
  <rect x="58" y="244" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="98" y="244" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="138" y="244" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="178" y="244" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <path d="M 218 259 L 248 259" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="233" y="253" text-anchor="middle" font-size="9" fill="#888">统计</text>

  <!-- frequency for counter example -->
  <rect x="250" y="244" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="264" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">每个值频次=1</text>

  <path d="M 350 259 L 380 259" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="365" y="253" text-anchor="middle" font-size="9" fill="#b85450">全奇</text>

  <rect x="380" y="244" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="264" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">返回 false ✗</text>

  <!-- ===== Footer ===== -->
  <rect x="40" y="296" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">判定准则</text>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#555">∀ v, freq[v] mod 2 == 0 ⇔ 可划分为 n 个相等数对</text>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#888">奇频次值必有一个「落单」无法配对 → 直接判 false</text>
</svg>
