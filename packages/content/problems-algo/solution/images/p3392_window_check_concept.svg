<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">长度为 3 的子数组只有 n−2 个，由中间下标 i 唯一确定</text>

  <!-- Row 1: i=1, window [1,2,1] -->
  <g filter="url(#rough2)">
    <rect x="25" y="52" width="142" height="44" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
    <rect x="30" y="56" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="76" y="56" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="122" y="56" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="56" width="42" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="214" y="56" width="42" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="51" y="79" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="97" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">2</text>
    <text x="143" y="79" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="189" y="79" text-anchor="middle" font-size="14" fill="#888">4</text>
    <text x="235" y="79" text-anchor="middle" font-size="14" fill="#888">1</text>
    <text x="282" y="78" font-size="13" fill="#b85450">i=1: 2×(1+1)=4 ≠ 2 ✗</text>
  </g>

  <!-- Row 2: i=2, window [2,1,4] -->
  <g filter="url(#rough2)">
    <rect x="71" y="117" width="142" height="44" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
    <rect x="30" y="121" width="42" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="76" y="121" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="122" y="121" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="168" y="121" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="214" y="121" width="42" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="51" y="144" text-anchor="middle" font-size="14" fill="#888">1</text>
    <text x="97" y="144" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="143" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">1</text>
    <text x="189" y="144" text-anchor="middle" font-size="14" fill="#333">4</text>
    <text x="235" y="144" text-anchor="middle" font-size="14" fill="#888">1</text>
    <text x="282" y="143" font-size="13" fill="#b85450">i=2: 2×(2+4)=12 ≠ 1 ✗</text>
  </g>

  <!-- Row 3: i=3, window [1,4,1] hit -->
  <g filter="url(#rough2)">
    <rect x="117" y="182" width="142" height="44" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="6"/>
    <rect x="30" y="186" width="42" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="76" y="186" width="42" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="122" y="186" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="168" y="186" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="214" y="186" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="51" y="209" text-anchor="middle" font-size="14" fill="#888">1</text>
    <text x="97" y="209" text-anchor="middle" font-size="14" fill="#888">2</text>
    <text x="143" y="209" text-anchor="middle" font-size="14" fill="#2d4d22">1</text>
    <text x="189" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">4</text>
    <text x="235" y="209" text-anchor="middle" font-size="14" fill="#2d4d22">1</text>
    <text x="282" y="208" font-size="13" fill="#4a7a3a">i=3: 2×(1+1)=4 = 4 ✓</text>
  </g>

  <!-- condition transformation box -->
  <g filter="url(#rough2)">
    <rect x="55" y="252" width="410" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c1e">条件变形：两边同乘 2，消去除法</text>
    <text x="260" y="308" text-anchor="middle" font-size="15" fill="#446688">首 + 尾 == 中 / 2   ⟺   2×(首 + 尾) == 中</text>
    <text x="260" y="334" text-anchor="middle" font-size="12" fill="#555">整数 == 整数：无截断、无浮点、无语言差异</text>
  </g>
</svg>
