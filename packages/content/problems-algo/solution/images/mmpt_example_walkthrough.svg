<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：players=[4,7,9]、trainers=[2,5,8,8]（均已升序）</text>

  <!-- Players row (fixed) -->
  <text x="30" y="62" font-size="12" fill="#4a7a3a" font-weight="bold">运动员</text>
  <rect x="130" y="40" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="68" text-anchor="middle" font-size="16" fill="#333">4</text>
  <rect x="210" y="40" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="68" text-anchor="middle" font-size="16" fill="#333">7</text>
  <rect x="290" y="40" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="68" text-anchor="middle" font-size="16" fill="#333">9</text>

  <!-- i pointer tracking: show pointer position per step below players via small triangles -->
  <text x="30" y="100" font-size="10.5" fill="#888">i 指向 →</text>

  <!-- Step track: 4 trainer cards along bottom area -->
  <!-- Step 1: t=2, skip -->
  <rect x="40" y="200" width="100" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">步1  j=0</text>
  <text x="90" y="240" text-anchor="middle" font-size="12" fill="#555">t = 2</text>
  <text x="90" y="262" text-anchor="middle" font-size="10.5" fill="#b85450">2 &lt; 4 (players[0])</text>
  <text x="90" y="278" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗ 跳过</text>
  <text x="90" y="300" text-anchor="middle" font-size="10" fill="#888">连最小都带不动</text>
  <text x="90" y="314" text-anchor="middle" font-size="10" fill="#888">i 仍 = 0</text>

  <!-- Step 2: t=5, match p4 -->
  <rect x="160" y="200" width="100" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="210" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">步2  j=1</text>
  <text x="210" y="240" text-anchor="middle" font-size="12" fill="#555">t = 5</text>
  <text x="210" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a">5 ≥ 4 ✓</text>
  <text x="210" y="278" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 匹配 p4↔t5</text>
  <text x="210" y="300" text-anchor="middle" font-size="10" fill="#888">i 0 → 1</text>
  <text x="210" y="314" text-anchor="middle" font-size="10" fill="#888">指向 p7</text>

  <!-- Step 3: t=8, match p7 -->
  <rect x="280" y="200" width="100" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">步3  j=2</text>
  <text x="330" y="240" text-anchor="middle" font-size="12" fill="#555">t = 8</text>
  <text x="330" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a">8 ≥ 7 ✓</text>
  <text x="330" y="278" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 匹配 p7↔t8</text>
  <text x="330" y="300" text-anchor="middle" font-size="10" fill="#888">i 1 → 2</text>
  <text x="330" y="314" text-anchor="middle" font-size="10" fill="#888">指向 p9</text>

  <!-- Step 4: t=8, skip (p9) -->
  <rect x="400" y="200" width="100" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="220" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">步4  j=3</text>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#555">t = 8</text>
  <text x="450" y="262" text-anchor="middle" font-size="10.5" fill="#d6a040">8 &lt; 9 (players[2])</text>
  <text x="450" y="278" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">✗ 跳过</text>
  <text x="450" y="300" text-anchor="middle" font-size="10" fill="#888">轮到 p9，8 不够</text>
  <text x="450" y="314" text-anchor="middle" font-size="10" fill="#888">i 仍 = 2</text>

  <!-- matching arrows from trainer cards up to players -->
  <path d="M 210 200 C 210 160, 160 120, 160 88" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 200 C 330 160, 240 120, 240 88" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i pointer triangles (one per step, showing progression) -->
  <polygon points="155,90 165,90 160,100" fill="#4a7a3a" filter="url(#rough2)"/>
  <polygon points="155,108 165,108 160,118" fill="#888" filter="url(#rough2)"/>
  <polygon points="235,108 245,108 240,118" fill="#888" filter="url(#rough2)"/>
  <polygon points="315,108 325,108 320,118" fill="#888" filter="url(#rough2)"/>

  <!-- flow arrow between steps -->
  <path d="M 140 258 L 158 258" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 260 258 L 278 258" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 380 258 L 398 258" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="200" y="338" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">训练师遍尽，返回 i = 2 ✓</text>
</svg>
