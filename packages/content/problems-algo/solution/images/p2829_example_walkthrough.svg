<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n = 5, k = 4，从 1 开始贪心扫描</text>

  <!-- candidate number line 1..7 -->
  <rect x="180" y="40" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="224" y="40" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="268" y="40" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="59" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="312" y="40" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="356" y="40" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="400" y="40" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="444" y="40" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="466" y="59" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">7</text>

  <!-- per-candidate annotation -->
  <text x="202" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 选</text>
  <text x="246" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 选</text>
  <text x="290" y="82" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 与 1 冲突</text>
  <text x="334" y="82" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">✓ 选</text>
  <text x="378" y="82" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">✓ 选</text>
  <text x="422" y="82" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">✓ 选满 5 个</text>
  <text x="466" y="82" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不需要</text>

  <!-- table header -->
  <rect x="50" y="98" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="72" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="94" y="98" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="130" y="98" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="175" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">k−i ∈ S ?</text>
  <rect x="220" y="98" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="285" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="350" y="98" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="425" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">S</text>
  <rect x="500" y="98" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="525" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">sum</text>

  <!-- row 1 -->
  <rect x="50" y="122" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="94" y="122" width="36" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="122" width="90" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 ∉ S</text>
  <rect x="220" y="122" width="130" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="137" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">选 1 ✓</text>
  <rect x="350" y="122" width="150" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1}</text>
  <rect x="500" y="122" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="525" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 2 -->
  <rect x="50" y="144" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="94" y="144" width="36" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="144" width="90" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 ∉ S</text>
  <rect x="220" y="144" width="130" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="159" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">选 2 ✓</text>
  <rect x="350" y="144" width="150" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,2}</text>
  <rect x="500" y="144" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="525" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 3 (skip) -->
  <rect x="50" y="166" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="181" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="94" y="166" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="181" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="130" y="166" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="181" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ∈ S !</text>
  <rect x="220" y="166" width="130" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="181" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">跳过 ✗</text>
  <rect x="350" y="166" width="150" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,2}</text>
  <rect x="500" y="166" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="525" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 4 -->
  <rect x="50" y="188" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="94" y="188" width="36" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="130" y="188" width="90" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 ∉ S</text>
  <rect x="220" y="188" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="203" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">选 4 ✓</text>
  <rect x="350" y="188" width="150" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,2,4}</text>
  <rect x="500" y="188" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="525" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <!-- row 5 -->
  <rect x="50" y="210" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="94" y="210" width="36" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="130" y="210" width="90" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1 ∉ S</text>
  <rect x="220" y="210" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="225" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">选 5 ✓</text>
  <rect x="350" y="210" width="150" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,2,4,5}</text>
  <rect x="500" y="210" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="525" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>

  <!-- row 6 (done) -->
  <rect x="50" y="232" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="247" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="94" y="232" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="247" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="130" y="232" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="247" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">−2 ∉ S</text>
  <rect x="220" y="232" width="130" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="247" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">选 6，选满 ✓</text>
  <rect x="350" y="232" width="150" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="247" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">{1,2,4,5,6}</text>
  <rect x="500" y="232" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="525" y="247" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">18</text>

  <!-- answer -->
  <rect x="80" y="278" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="303" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = 1+2+4+5+6 = 18（公式：t=2, rest=3 → 3+12+3 = 18 ✓）</text>

  <text x="310" y="342" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">候选 3 与已选的 1 凑出 4 = k，跳过它直达 4 = k 起的自由区</text>
</svg>
