<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="640" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单词级滑动窗口算法流程（对每个 offset 各跑一次）</text>

  <!-- Start -->
  <ellipse cx="300" cy="56" rx="130" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="60" text-anchor="middle" font-size="11" fill="#333">开始：for offset ∈ [0,w)：left=offset, cur={}, count=0</text>

  <!-- arrow -->
  <path d="M 300 76 L 300 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: right+w <= n ? -->
  <polygon points="300,94 400,140 300,186 200,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="12" fill="#333">right+w ≤ n ?</text>
  <text x="300" y="152" text-anchor="middle" font-size="10" fill="#888">(还有单词可取)</text>

  <!-- No -> end -->
  <path d="M 400 140 L 470 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="132" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="525" cy="140" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="525" y="144" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes down -->
  <path d="M 300 186 L 300 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="198" font-size="11" fill="#82b366">是</text>

  <!-- Extract word box -->
  <rect x="200" y="206" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="228" text-anchor="middle" font-size="11" fill="#333">word = s.substr(right, w)；right += w</text>

  <!-- arrow -->
  <path d="M 300 240 L 300 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond2: word in target? -->
  <polygon points="300,260 410,306 300,352 190,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="302" text-anchor="middle" font-size="12" fill="#333">word ∈ target ?</text>
  <text x="300" y="318" text-anchor="middle" font-size="10" fill="#888">(查目标词频表)</text>

  <!-- No -> reset box (left) -->
  <path d="M 190 306 L 160 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="298" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="30" y="286" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="303" text-anchor="middle" font-size="10" fill="#333">清空 cur / count=0</text>
  <text x="95" y="318" text-anchor="middle" font-size="10" fill="#333">left = right + w</text>
  <!-- reset -> back to Diamond1 (up) -->
  <path d="M 95 286 L 95 140 L 200 140" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="220" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 80 220)">重置后继续</text>

  <!-- Yes down -->
  <path d="M 300 352 L 300 368" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="364" font-size="11" fill="#82b366">是</text>

  <!-- cur[word]++; count++ -->
  <rect x="210" y="372" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="394" text-anchor="middle" font-size="11" fill="#333">cur[word]++; count++</text>

  <!-- arrow -->
  <path d="M 300 406 L 300 422" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond3: cur[word] > target ? -->
  <polygon points="300,426 410,472 300,518 190,472" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="468" text-anchor="middle" font-size="12" fill="#333">cur[word] &gt; target ?</text>
  <text x="300" y="484" text-anchor="middle" font-size="10" fill="#888">(该词超量?)</text>

  <!-- Yes -> shrink box (left) -->
  <path d="M 190 472 L 160 472" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="464" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="30" y="452" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="469" text-anchor="middle" font-size="10" fill="#333">弹出左词 cur[lw]--</text>
  <text x="95" y="484" text-anchor="middle" font-size="10" fill="#333">left += w; count--</text>
  <!-- shrink -> back to Diamond3 (up) -->
  <path d="M 95 452 L 95 410 L 256 410 L 256 426" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="402" text-anchor="middle" font-size="10" fill="#888">while 循环收缩</text>

  <!-- No down -->
  <path d="M 300 518 L 300 534" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="530" font-size="11" fill="#82b366">否</text>

  <!-- Diamond4: count == m ? -->
  <polygon points="300,538 400,578 300,618 200,578" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="582" text-anchor="middle" font-size="12" fill="#333">count == m ?</text>

  <!-- Yes -> record box (right) -->
  <path d="M 400 578 L 440 578" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="570" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="440" y="558" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="510" y="575" text-anchor="middle" font-size="10" fill="#333">ans.push(left)</text>
  <text x="510" y="590" text-anchor="middle" font-size="10" fill="#333">收缩一个继续</text>
  <!-- record -> back to Diamond1 (up far right then left) -->
  <path d="M 580 578 L 580 110 L 400 110 L 400 140" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No -> back to Diamond1 (far left dashed) -->
  <path d="M 200 578 L 12 578 L 12 140 L 200 140" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="12" y="380" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 12 380)">right 推进，继续主循环</text>

  <!-- summary -->
  <text x="300" y="632" text-anchor="middle" font-size="10" fill="#888">关键不变式：窗口内任一词频 ≤ 目标；窗口凑满 m 个词即一次合法命中</text>
</svg>
