<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：后缀 max 预处理 + 一遍扫描「查 → 判 → 插」</text>

  <!-- step 1: preprocess -->
  <rect x="30" y="44" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="62" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 从右往左预处理 rmax[j]</text>
  <text x="140" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">rmax[j] = max(nums[j+1..])</text>

  <!-- step 2: loop init -->
  <rect x="310" y="44" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="62" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">② j 从左往右扫，维护</text>
  <text x="420" y="80" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">有序集合 seen（已见元素）</text>

  <!-- query step -->
  <rect x="130" y="116" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="11.5" fill="#2d5a1e" filter="url(#rough2)">③ 查：pos = bisect_left(seen, nums[j])，前驱 = seen[pos−1]</text>

  <path d="M 140 88 C 140 100, 200 104, 240 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 420 88 C 420 100, 360 104, 320 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <polygon points="280,172 360,204 280,236 200,204" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">pos &gt; 0 且</text>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nums[j] &lt; rmax[j] ?</text>
  <path d="M 280 156 L 280 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- update ans -->
  <rect x="80" y="258" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="276" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">④ 是：ans = max(ans,</text>
  <text x="200" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">前驱 − nums[j] + rmax[j])</text>
  <path d="M 240 234 C 228 244, 218 250, 210 256" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="228" y="246" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- skip -->
  <text x="346" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否（左侧无更小值</text>
  <text x="346" y="254" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">或右侧不更大）→ 跳过</text>

  <!-- insert -->
  <rect x="350" y="258" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="276" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">⑤ 插：nums[j]</text>
  <text x="440" y="294" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">加入 seen，服务后续</text>

  <!-- loop back -->
  <path d="M 200 302 C 200 330, 160 336, 120 336 C 60 336, 60 160, 130 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="78" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一个 j</text>

  <!-- return -->
  <rect x="130" y="340" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑥ 扫描结束：ans 从未更新则返回 −1</text>
  <path d="M 280 302 L 280 336" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="462" y="340" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每步 O(log n)</text>
</svg>
