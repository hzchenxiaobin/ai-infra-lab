<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：蚂蚁位置 = 前缀和，回到边界 ⇔ 前缀和归零</text>

  <!-- boundary vertical line -->
  <line x1="230" y1="84" x2="230" y2="256" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="230" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">边界（位置 0）</text>

  <!-- number line -->
  <line x1="50" y1="200" x2="470" y2="200" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <g stroke="#999" stroke-width="1" filter="url(#rough2)">
    <line x1="150" y1="194" x2="150" y2="206"/>
    <line x1="190" y1="194" x2="190" y2="206"/>
    <line x1="230" y1="194" x2="230" y2="206"/>
    <line x1="270" y1="194" x2="270" y2="206"/>
    <line x1="310" y1="194" x2="310" y2="206"/>
    <line x1="350" y1="194" x2="350" y2="206"/>
    <line x1="390" y1="194" x2="390" y2="206"/>
    <line x1="430" y1="194" x2="430" y2="206"/>
  </g>
  <text x="150" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">−2</text>
  <text x="190" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">−1</text>
  <text x="230" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="270" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="310" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="350" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="390" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="430" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>

  <!-- step arrows: 0 -> 2 -> 5 -> 0 -->
  <path d="M 236 148 L 300 145" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">+2（右移 2）</text>

  <path d="M 316 122 L 420 119" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="368" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">+3（右移 3）</text>

  <path d="M 424 96 L 242 93" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="333" y="85" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−5（左移 5）</text>

  <!-- landing dots -->
  <circle cx="310" cy="200" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="430" cy="200" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="230" cy="200" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- prefix sums -->
  <text x="310" y="246" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">S₁ = 2</text>
  <text x="430" y="246" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">S₂ = 5</text>
  <text x="230" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">S₃ = 0 ✓ 计数 +1</text>

  <!-- ant at start -->
  <g filter="url(#rough2)">
    <ellipse cx="228" cy="188" rx="9" ry="5.5" fill="#555"/>
    <circle cx="240" cy="186" r="3.5" fill="#555"/>
    <path d="M 242 183 Q 247 178 250 176" stroke="#555" stroke-width="1.2" fill="none"/>
    <path d="M 243 185 Q 249 183 252 182" stroke="#555" stroke-width="1.2" fill="none"/>
    <line x1="222" y1="191" x2="218" y2="199" stroke="#555" stroke-width="1.2"/>
    <line x1="227" y1="193" x2="225" y2="201" stroke="#555" stroke-width="1.2"/>
    <line x1="233" y1="193" x2="235" y2="201" stroke="#555" stroke-width="1.2"/>
  </g>
  <text x="118" y="176" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">蚂蚁从边界出发</text>
  <path d="M 152 180 Q 172 182 190 185" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <!-- warning strip -->
  <rect x="48" y="272" width="424" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⚠️ 穿过 ≠ 返回：从 +2 一步移动 −4 到 −2，途中路过 0，</text>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">但停点 S = −2 ≠ 0，不计数 —— 前缀和只看停点，天然编码这条规则。</text>

  <!-- bottom note -->
  <rect x="48" y="342" width="424" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">nums[i] ≠ 0 ⇒ 每步必动；检查只发生在「移动完成后」，</text>
  <text x="260" y="376" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">起点在边界不计入 —— 代码里检查写在 pos += x 之后，初始 pos = 0 不触发。</text>
</svg>
