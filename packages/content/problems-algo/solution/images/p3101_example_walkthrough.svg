<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="150" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1：nums = [0,1,1,1]</text>
  <text x="435" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ 5 ✓</text>

  <!-- 表 1 -->
  <rect x="55" y="40" width="410" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="140" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <text x="240" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">与前一位比较</text>
  <text x="345" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">cur</text>
  <text x="425" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">ans</text>

  <rect x="55" y="66" width="410" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="140" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="240" y="84" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="345" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="425" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="55" y="92" width="410" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ≠ 0 ✓ 延续</text>
  <text x="345" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="425" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <rect x="55" y="118" width="410" height="26" fill="#fce4ec" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="136" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 = 1 ✗ 断开</text>
  <text x="345" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="425" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="55" y="144" width="410" height="26" fill="#fce4ec" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 = 1 ✗ 断开</text>
  <text x="345" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="385" y="144" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1a" filter="url(#rough2)">5</text>

  <path d="M 105 66 V 170 M 175 66 V 170 M 305 66 V 170 M 385 66 V 170" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 表 2 -->
  <text x="150" y="216" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 2：nums = [1,0,1,0]</text>
  <text x="435" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ 10 ✓</text>

  <rect x="55" y="228" width="410" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="140" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <text x="240" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">与前一位比较</text>
  <text x="345" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">cur</text>
  <text x="425" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">ans</text>

  <rect x="55" y="254" width="410" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="140" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="272" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="345" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="425" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="55" y="280" width="410" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="240" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0 ≠ 1 ✓ 延续</text>
  <text x="345" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="425" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <rect x="55" y="306" width="410" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ≠ 0 ✓ 延续</text>
  <text x="345" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="425" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <rect x="55" y="332" width="410" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="350" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="350" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="240" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0 ≠ 1 ✓ 延续</text>
  <text x="345" y="350" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="385" y="332" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1a" filter="url(#rough2)">10</text>

  <path d="M 105 254 V 358 M 175 254 V 358 M 305 254 V 358 M 385 254 V 358" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">cur 连续翻倍正对应整段交替：1+2+3+4 = 4×5÷2 = 10</text>
</svg>
