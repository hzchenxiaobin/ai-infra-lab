<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：合法性检查 → 下标映射填表</text>

  <!-- Step 1: check dimensions (decision diamond) -->
  <polygon points="280,48 380,86 280,124 180,86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">m × n == r × c ?</text>
  <text x="280" y="96" text-anchor="middle" font-size="10" fill="#888">元素总数是否一致</text>

  <!-- No branch: return original -->
  <path d="M 380 86 L 470 86" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="78" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="68" width="76" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="508" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回</text>
  <text x="508" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">原 mat</text>

  <!-- Yes branch: down -->
  <path d="M 280 124 L 280 156" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="144" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 2: create new matrix -->
  <rect x="160" y="158" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">创建新矩阵 ans[r][c]</text>
  <text x="280" y="192" text-anchor="middle" font-size="10" fill="#888">行数 r，列数 c</text>

  <path d="M 280 200 L 280 232" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop over idx -->
  <rect x="120" y="234" width="320" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold">遍历 idx = 0 … m·n − 1</text>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#444">i = idx ÷ n ， j = idx mod n</text>
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#444">r' = idx ÷ c ， c' = idx mod c</text>

  <path d="M 280 292 L 280 324" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: assign -->
  <rect x="160" y="326" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">ans[r'][c'] = mat[i][j]</text>

  <path d="M 280 368 L 280 396" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="220" y="398" width="120" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- loop back arrow: from step4 left side back up to step3 left side -->
  <path d="M 120 347 L 90 347 L 90 263 L 120 263" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="76" y="308" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 76 308)">下一个 idx</text>
</svg>
