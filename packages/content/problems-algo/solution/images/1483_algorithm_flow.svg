<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD3" markerWidth="9" markerHeight="9" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR3" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>
  <rect width="500" height="410" fill="#fafafa"/>
  <text x="250" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">getKthAncestor 流程：按二进制位跳跃</text>

  <rect x="160" y="40" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="230" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 node, k</text>
  <line x1="230" y1="72" x2="230" y2="84" stroke="#888" stroke-width="1.5" marker-end="url(#arrD3)" filter="url(#rough2)"/>

  <rect x="180" y="86" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="105" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">j ← 0</text>
  <line x1="230" y1="114" x2="230" y2="124" stroke="#888" stroke-width="1.5" marker-end="url(#arrD3)" filter="url(#rough2)"/>

  <polygon points="230,126 310,158 230,190 150,158" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="162" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">j &lt; LOG ?</text>
  <line x1="310" y1="158" x2="368" y2="158" stroke="#888" stroke-width="1.5" marker-end="url(#arrR3)" filter="url(#rough2)"/>
  <text x="338" y="150" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="370" y="142" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="422" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 node</text>
  <line x1="230" y1="190" x2="230" y2="202" stroke="#888" stroke-width="1.5" marker-end="url(#arrD3)" filter="url(#rough2)"/>
  <text x="242" y="200" font-size="10" fill="#888">是</text>

  <polygon points="230,204 320,238 230,272 140,238" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="242" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">k 第 j 位 = 1 ?</text>
  <path d="M 320 238 L 372 238 L 372 308 L 230 308" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD3)" filter="url(#rough2)"/>
  <text x="346" y="230" text-anchor="middle" font-size="10" fill="#888">否（跳过）</text>
  <line x1="230" y1="272" x2="230" y2="282" stroke="#888" stroke-width="1.5" marker-end="url(#arrD3)" filter="url(#rough2)"/>
  <text x="242" y="280" font-size="10" fill="#888">是</text>

  <rect x="150" y="284" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="303" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">node ← up[node][j]</text>
  <line x1="230" y1="312" x2="230" y2="320" stroke="#888" stroke-width="1.5" marker-end="url(#arrD3)" filter="url(#rough2)"/>

  <polygon points="230,322 310,352 230,382 150,352" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="356" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">node = -1 ?</text>
  <line x1="310" y1="352" x2="368" y2="352" stroke="#888" stroke-width="1.5" marker-end="url(#arrR3)" filter="url(#rough2)"/>
  <text x="338" y="344" text-anchor="middle" font-size="10" fill="#888">是</text>
  <rect x="370" y="336" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="422" y="357" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 -1</text>

  <line x1="150" y1="352" x2="104" y2="352" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="344" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="42" y="338" width="62" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="73" y="357" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">j++</text>
  <path d="M 73 338 L 73 158 L 148 158" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR3)" filter="url(#rough2)"/>
  <text x="60" y="250" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 60 250)">循环回 j &lt; LOG</text>
</svg>
