<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <pattern id="obs2" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fce4ec"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b85450" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：obstacleGrid → dp 表逐格填入，中间障碍置 0 削减路径</text>

  <!-- left: obstacleGrid -->
  <text x="105" y="62" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">obstacleGrid（输入）</text>
  <!-- row 0: 0 0 0 -->
  <rect x="52" y="74" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="103" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="104" y="74" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="103" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="156" y="74" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="103" text-anchor="middle" font-size="13" fill="#888">0</text>
  <!-- row 1: 0 1(obstacle) 0 -->
  <rect x="52" y="118" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="147" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="104" y="118" width="52" height="44" fill="url(#obs2)" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="149" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="156" y="118" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="147" text-anchor="middle" font-size="13" fill="#888">0</text>
  <!-- row 2: 0 0 0 -->
  <rect x="52" y="162" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="191" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="104" y="162" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="191" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="156" y="162" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="191" text-anchor="middle" font-size="13" fill="#888">0</text>

  <!-- start/end labels -->
  <text x="78" y="66" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">起</text>
  <text x="182" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">终</text>

  <!-- arrow between two grids -->
  <path d="M 222 142 L 262 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="134" text-anchor="middle" font-size="10.5" fill="#888">填表</text>

  <!-- right: dp -->
  <text x="378" y="62" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">dp（路径条数）</text>
  <!-- row 0: 1 1 1 -->
  <rect x="302" y="74" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="328" y="103" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="354" y="74" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="103" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="406" y="74" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="432" y="103" text-anchor="middle" font-size="15" fill="#333">1</text>
  <!-- row 1: 1 0(obstacle) 1 -->
  <rect x="302" y="118" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="328" y="147" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="354" y="118" width="52" height="44" fill="url(#obs2)" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="149" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="406" y="118" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="432" y="147" text-anchor="middle" font-size="15" fill="#333">1</text>
  <!-- row 2: 1 1 2(answer) -->
  <rect x="302" y="162" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="328" y="191" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="354" y="162" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="191" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="406" y="162" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="191" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2</text>

  <!-- fill order arrows on dp (row-major), skip obstacle -->
  <path d="M 328 96 L 372 96" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 96 L 424 96" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 432 108 L 328 140" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 328 140 L 372 140" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 140 L 424 140" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- obstacle callout -->
  <path d="M 380 118 L 380 86" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="92" font-size="10.5" fill="#b85450" font-weight="bold">障碍 → 0</text>
  <text x="478" y="106" font-size="10" fill="#888">(1,2)只靠上方=1)</text>

  <!-- note boxes -->
  <rect x="40" y="232" width="240" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">首行/首列：遇障碍即截断</text>
  <text x="160" y="276" text-anchor="middle" font-size="11" fill="#555">dp[0][j] = 障碍? 0 : dp[0][j−1]</text>
  <text x="160" y="292" text-anchor="middle" font-size="11" fill="#555">障碍之后全为 0（无法绕行）</text>

  <rect x="290" y="232" width="240" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="256" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">内部格：空格 = 上 + 左</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" fill="#555">dp[1][2] = dp[0][2] + dp[1][1]</text>
  <text x="410" y="292" text-anchor="middle" font-size="11" fill="#555">        = 1 + 0 = 1（被障碍削减）</text>

  <!-- bottom note -->
  <rect x="40" y="318" width="490" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="338" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">答案 = 2：路径①右右下下 / 路径②下下右右（均绕开中间障碍）</text>
  <text x="285" y="355" text-anchor="middle" font-size="10.5" fill="#888">障碍格自身 dp=0，且会把 0 传播给依赖它的右方/下方空格</text>
</svg>
