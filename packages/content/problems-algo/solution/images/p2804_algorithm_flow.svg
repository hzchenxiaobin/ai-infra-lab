<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：缓存长度 → 逐下标判定 → 调用回调</text>

  <!-- Start -->
  <rect x="200" y="50" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="18" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 260 88 L 260 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Cache length -->
  <rect x="170" y="112" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">len = this.length</text>
  <text x="260" y="150" text-anchor="middle" font-size="10" fill="#666">起始时缓存长度（规范行为）</text>
  <path d="M 260 164 L 260 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init i -->
  <rect x="210" y="188" width="100" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="12" fill="#333">i = 0</text>
  <path d="M 260 226 L 260 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < len? -->
  <polygon points="260,250 360,295 260,340 160,295" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i &lt; len ?</text>
  <text x="260" y="305" text-anchor="middle" font-size="10" fill="#666">使用缓存的 len</text>

  <!-- No branch -> End -->
  <path d="M 360 295 L 430 295 L 430 420 L 320 420" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="288" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="200" y="402" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="18" filter="url(#rough2)"/>
  <text x="260" y="425" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结束</text>

  <!-- Yes branch -->
  <path d="M 260 340 L 260 365" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision: i in this? -->
  <polygon points="260,368 340,395 260,422 180,395" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i in this ?</text>
  <text x="260" y="407" text-anchor="middle" font-size="9" fill="#888">跳过稀疏空洞</text>

  <!-- No (hole) -> i++ -->
  <path d="M 180 395 L 80 395 L 80 280 L 160 280" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="95" y="312" font-size="10" fill="#888">跳过</text>

  <!-- Yes -> callback -->
  <path d="M 340 395 L 430 395 L 430 365" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="388" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Callback call -->
  <rect x="350" y="310" width="160" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="330" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">callback.call(</text>
  <text x="430" y="345" text-anchor="middle" font-size="9.5" fill="#666">context, this[i], i, this</text>
  <text x="430" y="358" text-anchor="middle" font-size="9.5" fill="#666">)</text>

  <!-- i++ after callback -->
  <path d="M 430 310 L 430 260 L 80 260 L 80 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="240" width="100" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="262" text-anchor="middle" font-size="12" fill="#333">i++</text>

  <!-- Side notes -->
  <rect x="370" y="460" width="140" height="48" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="440" y="478" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">关键点</text>
  <text x="378" y="492" font-size="9" fill="#666">• len 缓存：回调追加元素不访问</text>
  <text x="378" y="505" font-size="9" fill="#666">• this[i] 实时读取：修改可见</text>
</svg>
