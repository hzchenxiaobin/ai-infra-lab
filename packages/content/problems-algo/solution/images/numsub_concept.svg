<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思想：固定上下边界 → 列压缩成一维 → 套用 560</text>

  <!-- 列标号 c=0..3 -->
  <text x="67" y="72" text-anchor="middle" font-size="10" fill="#999">c=0</text>
  <text x="101" y="72" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="135" y="72" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="169" y="72" text-anchor="middle" font-size="10" fill="#999">3</text>

  <!-- 行标号 r=0..3 -->
  <text x="42" y="101" text-anchor="end" font-size="10" fill="#999">r=0</text>
  <text x="42" y="135" text-anchor="end" font-size="10" fill="#999">1</text>
  <text x="42" y="169" text-anchor="end" font-size="10" fill="#999">2</text>
  <text x="42" y="203" text-anchor="end" font-size="10" fill="#999">3</text>

  <!-- 矩阵网格背景 -->
  <rect x="50" y="80" width="136" height="136" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 网格线（竖） -->
  <path d="M84 80 V216 M118 80 V216 M152 80 V216" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <!-- 网格线（横） -->
  <path d="M50 114 H186 M50 148 H186 M50 182 H186" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <!-- r1 行（top）填充绿 -->
  <rect x="50" y="114" width="136" height="34" fill="#e6f4ea" opacity="0.85" filter="url(#rough2)"/>
  <!-- r2 行（bottom）填充橙 -->
  <rect x="50" y="148" width="136" height="34" fill="#fff8e1" opacity="0.85" filter="url(#rough2)"/>

  <!-- 矩阵数值 -->
  <text x="67" y="101" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="101" y="101" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="135" y="101" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="169" y="101" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="67" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="101" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="135" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="169" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <text x="67" y="169" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="101" y="169" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="135" y="169" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="169" y="169" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>

  <text x="67" y="203" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="101" y="203" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="135" y="203" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="169" y="203" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- top/bottom 标注 -->
  <text x="196" y="135" font-size="11" fill="#4a7a3a" font-weight="bold">← top</text>
  <text x="196" y="169" font-size="11" fill="#d6a040" font-weight="bold">← bottom</text>

  <!-- 向下箭头：列求和 -->
  <path d="M118 224 L118 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="242" font-size="11" fill="#446688">列求和 (r1..r2)</text>

  <!-- 压缩后一维数组 -->
  <rect x="50" y="256" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="84" y="256" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="118" y="256" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="152" y="256" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="67" y="278" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="101" y="278" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="135" y="278" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="169" y="278" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="118" y="306" text-anchor="middle" font-size="10.5" fill="#888">压缩后的一维数组 col_sum</text>

  <!-- 右侧说明面板 -->
  <rect x="220" y="80" width="300" height="136" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="220" y="80" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="370" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">降维 → 一维子数组和问题</text>

  <text x="234" y="128" font-size="11.5" fill="#444">在 col_sum 上统计和为 target 的</text>
  <text x="234" y="146" font-size="11.5" fill="#444">连续子数组 = <tspan fill="#b85450" font-weight="bold">LeetCode 560</tspan></text>
  <text x="234" y="166" font-size="10.5" fill="#888">前缀和 + 哈希：count={0:1}</text>
  <text x="234" y="182" font-size="10.5" fill="#888">for x: s+=x; ans+=count[s−target]; count[s]++</text>
  <text x="234" y="202" font-size="10.5" fill="#4a7a3a" font-style="italic">每个 (top,bottom) 组合跑一次 560</text>

  <!-- 底部总览框 -->
  <rect x="30" y="330" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="354" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">枚举 top/bottom 两行（O(m²) 组合）+ 每对在压缩数组上 O(n) 跑 560</text>
  <text x="270" y="372" text-anchor="middle" font-size="11" fill="#888">总复杂度 O(m²·n)；可枚举较短维使之为 O(min(m,n)² · max(m,n))</text>
</svg>
