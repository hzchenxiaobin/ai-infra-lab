<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：n &amp; (n−1) 抹去最低设置位</text>

  <!-- ===== n = 12 = 1100 ===== -->
  <text x="44" y="86" font-size="12.5" fill="#446688" font-weight="bold">n = 12</text>
  <text x="44" y="102" font-size="10" fill="#888">二进制</text>
  <rect x="130" y="66" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="66" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="88" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="230" y="66" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="66" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="334" y="88" font-size="11" fill="#b85450" font-weight="bold">↑ 最低设置位</text>

  <!-- subtract 1 arrow -->
  <path d="M 201 100 Q 201 116 201 126" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="118" font-size="11" fill="#888">− 1（借位）</text>

  <!-- ===== n-1 = 11 = 1011 ===== -->
  <text x="44" y="156" font-size="12.5" fill="#d6a040" font-weight="bold">n−1 = 11</text>
  <text x="44" y="172" font-size="10" fill="#888">借位翻转</text>
  <rect x="130" y="136" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="158" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="136" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="158" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="136" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="251" y="158" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="136" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="158" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="334" y="158" font-size="10.5" fill="#d6a040" font-weight="bold">最低设置位及以下全翻</text>

  <!-- AND bracket -->
  <text x="108" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">&amp;</text>
  <line x1="130" y1="188" x2="322" y2="188" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- ===== n & (n-1) = 8 = 1000 ===== -->
  <text x="44" y="226" font-size="12.5" fill="#4a7a3a" font-weight="bold">n&amp;(n−1)=8</text>
  <rect x="130" y="206" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="228" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="206" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="228" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="230" y="206" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="228" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="206" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="228" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="334" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">← 抹掉一个 1，少了 1 个 1</text>

  <!-- arrow down to formula -->
  <path d="M 201 240 Q 201 252 201 260" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="60" y="264" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="286" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">每执行 n &amp;= n − 1：抹掉最低设置位，1 的个数 − 1</text>

  <!-- bottom note -->
  <rect x="60" y="316" width="420" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">循环到 n = 0，循环次数即为 1 的个数（popcount）</text>
</svg>
