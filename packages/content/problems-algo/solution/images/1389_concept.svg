<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：插入挤开右侧元素，约束 0≤index[i]≤i 保证位置合法</text>

  <!-- ============ LEFT: insert semantics ============ -->
  <rect x="30" y="56" width="280" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 插入 = 挤开右侧</text>

  <!-- before row: [0,1,2] -->
  <text x="44" y="108" font-size="11" fill="#666">插入前</text>
  <g font-size="15">
    <rect x="96" y="92" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="120" y="118" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="148" y="92" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="172" y="118" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="200" y="92" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="224" y="118" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
  </g>
  <!-- index labels under before -->
  <g font-size="9" fill="#888">
    <text x="120" y="142" text-anchor="middle">idx 0</text>
    <text x="172" y="142" text-anchor="middle">idx 1</text>
    <text x="224" y="142" text-anchor="middle">idx 2</text>
  </g>

  <!-- down arrow with insert label -->
  <path d="M 170 150 L 170 168" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="180" y="162" font-size="11" fill="#b85450" font-weight="bold">insert 3 @ idx 2</text>

  <!-- after row: [0,1,3,2] -->
  <text x="44" y="192" font-size="11" fill="#666">插入后</text>
  <g font-size="15">
    <rect x="96" y="176" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="120" y="202" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="148" y="176" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="172" y="202" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="200" y="176" width="48" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
    <text x="224" y="202" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="252" y="176" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="276" y="202" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="120" y="226" text-anchor="middle">idx 0</text>
    <text x="172" y="226" text-anchor="middle">idx 1</text>
    <text x="224" y="226" text-anchor="middle" fill="#b85450" font-weight="bold">idx 2</text>
    <text x="276" y="226" text-anchor="middle" fill="#d6a040" font-weight="bold">idx 3</text>
  </g>

  <!-- shift-right curved arrow: old pos of 2 (idx2, y=111) -> new pos (idx3, y=195) -->
  <path d="M 248 130 C 300 140 300 180 300 195" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="306" y="170" font-size="10" fill="#d6a040" font-weight="bold">右移</text>
  <text x="306" y="184" font-size="10" fill="#d6a040">一位</text>

  <!-- legend -->
  <rect x="40" y="246" width="260" height="30" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="52" y="254" width="16" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="266" font-size="10" fill="#b85450">新插入</text>
  <rect x="130" y="254" width="16" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="266" font-size="10" fill="#d6a040">被挤开</text>
  <rect x="210" y="254" width="16" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="232" y="266" font-size="10" fill="#446688">不动</text>

  <!-- ============ RIGHT: constraint table ============ -->
  <rect x="340" y="56" width="260" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 约束保证位置合法</text>

  <!-- table header -->
  <rect x="340" y="92" width="260" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="108" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">i</text>
  <text x="420" y="108" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">插入前长度</text>
  <text x="480" y="108" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">合法下标</text>
  <text x="556" y="108" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">index[i]</text>

  <!-- rows -->
  <g font-size="11">
    <rect x="340" y="116" width="260" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="362" y="131" text-anchor="middle" fill="#333">0</text>
    <text x="420" y="131" text-anchor="middle" fill="#666">0</text>
    <text x="480" y="131" text-anchor="middle" fill="#666">[0, 0]</text>
    <text x="556" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>

    <rect x="340" y="138" width="260" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="362" y="153" text-anchor="middle" fill="#333">1</text>
    <text x="420" y="153" text-anchor="middle" fill="#666">1</text>
    <text x="480" y="153" text-anchor="middle" fill="#666">[0, 1]</text>
    <text x="556" y="153" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0~1</text>

    <rect x="340" y="160" width="260" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="362" y="175" text-anchor="middle" fill="#333">2</text>
    <text x="420" y="175" text-anchor="middle" fill="#666">2</text>
    <text x="480" y="175" text-anchor="middle" fill="#666">[0, 2]</text>
    <text x="556" y="175" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0~2</text>

    <rect x="340" y="182" width="260" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="362" y="197" text-anchor="middle" fill="#333">3</text>
    <text x="420" y="197" text-anchor="middle" fill="#666">3</text>
    <text x="480" y="197" text-anchor="middle" fill="#666">[0, 3]</text>
    <text x="556" y="197" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0~3</text>

    <rect x="340" y="204" width="260" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="362" y="219" text-anchor="middle" fill="#4a7a3a" font-weight="bold">i</text>
    <text x="420" y="219" text-anchor="middle" fill="#4a7a3a" font-weight="bold">i</text>
    <text x="480" y="219" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[0, i]</text>
    <text x="556" y="219" text-anchor="middle" fill="#4a7a3a" font-weight="bold">≤ i</text>
  </g>

  <!-- right side note -->
  <rect x="340" y="240" width="260" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">插入前长度 = i ⇒ 合法下标 [0, i]</text>
  <text x="470" y="278" text-anchor="middle" font-size="10" fill="#666">index[i] ≤ i 恒在范围内 ⇒ 无需越界检查</text>

  <!-- bottom note -->
  <rect x="30" y="310" width="560" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="332" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">插入下标 p：原 target[p..] 整体右移一位，新值落入 p 号位</text>
  <text x="310" y="352" text-anchor="middle" font-size="11" fill="#666">⇒ 后插元素可排到先插元素之前（如示例 1 第 5 步把 4 插到下标 1）</text>
  <text x="310" y="372" text-anchor="middle" font-size="10" fill="#888">约束 0 ≤ index[i] ≤ i 与「插入前长度 = i」精确吻合，故位置总是存在</text>
</svg>
