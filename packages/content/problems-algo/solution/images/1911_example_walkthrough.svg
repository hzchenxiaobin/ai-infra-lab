<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：nums = [4, 2, 5, 3]
  </text>

  <!-- Table header -->
  <rect x="30" y="48" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="68" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">步</text>
  <text x="110" y="68" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">num</text>
  <text x="190" y="68" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">even(旧) odd(旧)</text>
  <text x="320" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">new_even</text>
  <text x="420" y="68" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">new_odd</text>
  <text x="525" y="68" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">决策</text>

  <!-- Step 0: num=4 -->
  <rect x="30" y="78" width="540" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="110" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="190" y="101" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0       0</text>
  <text x="320" y="101" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">max(0, 0+4) = 4</text>
  <text x="420" y="101" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">max(0, 0−4) = 0</text>
  <text x="525" y="101" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">even加4</text>

  <!-- Step 1: num=2 -->
  <rect x="30" y="114" width="540" height="36" fill="#f7f7f7" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="110" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="190" y="137" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4       0</text>
  <text x="320" y="137" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">max(4, 0+2) = 4</text>
  <text x="420" y="137" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">max(0, 4−2) = 2</text>
  <text x="525" y="137" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">odd减2</text>

  <!-- Step 2: num=5 -->
  <rect x="30" y="150" width="540" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="110" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="190" y="173" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4       2</text>
  <text x="320" y="173" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">max(4, 2+5) = 7</text>
  <text x="420" y="173" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">max(2, 4−5) = 2</text>
  <text x="525" y="173" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">even加5</text>

  <!-- Step 3: num=3 -->
  <rect x="30" y="186" width="540" height="36" fill="#f7f7f7" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="209" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="110" y="209" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="190" y="209" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">7       2</text>
  <text x="320" y="209" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">max(7, 2+3) = 7</text>
  <text x="420" y="209" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">max(2, 7−3) = 4</text>
  <text x="525" y="209" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">odd减3</text>

  <!-- Answer box -->
  <rect x="30" y="240" width="540" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="263" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    最终 even = 7, odd = 4 → 返回 max(even) = 7
  </text>

  <!-- Explanation boxes -->
  <rect x="30" y="290" width="260" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="310" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">
    选出的子序列：[4, 2, 5]
  </text>
  <text x="160" y="328" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    交替和 = 4 − 2 + 5 = 7
  </text>
  <text x="160" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    偶位（加）：4, 5 ｜ 奇位（减）：2
  </text>

  <rect x="310" y="290" width="260" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="310" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">
    为什么不加 3？
  </text>
  <text x="440" y="328" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    加 5 后 even=7，若再减 3
  </text>
  <text x="440" y="346" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    得 7−3=4 &lt; 7，不如停在 even=7
  </text>
</svg>
