<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：窗口随右端扩展，第二对出现时左端跳越</text>

  <!-- ===== Example 1: 52233 ===== -->
  <text x="40" y="62" font-size="12" fill="#888" font-weight="bold">示例1 52233</text>

  <!-- step r=2: window 522, pair 22 (last=1) -->
  <g font-size="15" font-weight="bold">
    <rect x="80" y="74" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="97" y="96" text-anchor="middle" fill="#333">5</text>
    <rect x="114" y="74" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="131" y="96" text-anchor="middle" fill="#b85450">2</text>
    <rect x="148" y="74" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="165" y="96" text-anchor="middle" fill="#b85450">2</text>
    <text x="200" y="96" font-size="11" fill="#4a7a3a" font-weight="bold">r=2 首对(22)，last=1，ans=3</text>
  </g>

  <!-- step r=3: window 5223 extend -->
  <g font-size="15" font-weight="bold">
    <rect x="80" y="116" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="97" y="138" text-anchor="middle" fill="#333">5</text>
    <rect x="114" y="116" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="131" y="138" text-anchor="middle" fill="#b85450">2</text>
    <rect x="148" y="116" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="165" y="138" text-anchor="middle" fill="#b85450">2</text>
    <rect x="182" y="116" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="199" y="138" text-anchor="middle" fill="#4a7a3a">3</text>
    <text x="240" y="138" font-size="11" fill="#4a7a3a" font-weight="bold">r=3 无新对，扩展，ans=4</text>
  </g>

  <!-- step r=4: window 233, l jumps to 2 -->
  <g font-size="15" font-weight="bold">
    <rect x="80" y="158" width="34" height="34" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
    <text x="97" y="180" text-anchor="middle" fill="#aaa">5</text>
    <rect x="114" y="158" width="34" height="34" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
    <text x="131" y="180" text-anchor="middle" fill="#aaa">2</text>
    <rect x="148" y="158" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="165" y="180" text-anchor="middle" fill="#333">2</text>
    <rect x="182" y="158" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="199" y="180" text-anchor="middle" fill="#b85450">3</text>
    <rect x="216" y="158" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="233" y="180" text-anchor="middle" fill="#b85450">3</text>
    <text x="274" y="180" font-size="11" fill="#d6a040" font-weight="bold">r=4 第二对(33)，l 跳到2，ans=4</text>
  </g>

  <!-- ===== Example 3: 1111111 ===== -->
  <text x="40" y="222" font-size="12" fill="#888" font-weight="bold">示例3 1111111</text>

  <!-- step r=1: window 11, first pair last=0 -->
  <g font-size="15" font-weight="bold">
    <rect x="80" y="234" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="95" y="256" text-anchor="middle" fill="#b85450">1</text>
    <rect x="110" y="234" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="125" y="256" text-anchor="middle" fill="#b85450">1</text>
    <text x="158" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">r=1 首对(11)，last=0，ans=2</text>
  </g>

  <!-- step r=2: l jumps to1, window 11 -->
  <g font-size="15" font-weight="bold">
    <rect x="80" y="276" width="30" height="34" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
    <text x="95" y="298" text-anchor="middle" fill="#aaa">1</text>
    <rect x="110" y="276" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="125" y="298" text-anchor="middle" fill="#b85450">1</text>
    <rect x="140" y="276" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="155" y="298" text-anchor="middle" fill="#b85450">1</text>
    <text x="188" y="298" font-size="11" fill="#d6a040" font-weight="bold">r=2 第二对，l 跳到1，ans=2</text>
  </g>

  <!-- step r=3: l jumps to2, window 11 -->
  <g font-size="15" font-weight="bold">
    <rect x="80" y="318" width="30" height="34" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
    <text x="95" y="340" text-anchor="middle" fill="#aaa">1</text>
    <rect x="110" y="318" width="30" height="34" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
    <text x="125" y="340" text-anchor="middle" fill="#aaa">1</text>
    <rect x="140" y="318" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="155" y="340" text-anchor="middle" fill="#b85450">1</text>
    <rect x="170" y="318" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="185" y="340" text-anchor="middle" fill="#b85450">1</text>
    <text x="218" y="340" font-size="11" fill="#d6a040" font-weight="bold">r=3 同理，l 跳到2，ans=2</text>
  </g>

  <!-- conclusion -->
  <rect x="80" y="372" width="400" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">结论</text>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#446688">示例1：每步扩展，第二对出现即跳左，最长 = 4（5223）</text>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#446688">示例3：连串 1 中每三步必违例，窗口恒为 2，最长 = 2</text>
</svg>
