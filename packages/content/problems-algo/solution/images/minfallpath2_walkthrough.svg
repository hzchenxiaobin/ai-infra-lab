<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid = [[1,2,3],[4,5,6],[7,8,9]]</text>

  <!-- ===== Row 0 ===== -->
  <text x="50" y="66" font-size="11" fill="#888" font-weight="bold">第 0 行</text>
  <text x="50" y="82" font-size="10" fill="#888">dp = grid[0]</text>
  <!-- grid values -->
  <rect x="130" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="73" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="73" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="238" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="73" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <!-- min1/min2 annotation -->
  <rect x="310" y="52" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="73" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min1=1(col0)</text>
  <rect x="418" y="52" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="468" y="73" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">min2=2(col1)</text>

  <path d="M 280 92 L 280 106" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Row 1 ===== -->
  <text x="50" y="132" font-size="11" fill="#888" font-weight="bold">第 1 行</text>
  <text x="50" y="148" font-size="10" fill="#888">grid=[4,5,6]</text>
  <!-- dp[1][0]: j=0 == min1_col → use min2=2 -->
  <rect x="130" y="118" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="139" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <text x="155" y="160" text-anchor="middle" font-size="9" fill="#b85450">4+min2</text>
  <!-- dp[1][1]: j=1 ≠ min1_col → use min1=1 -->
  <rect x="184" y="118" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="139" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="209" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a">5+min1</text>
  <!-- dp[1][2]: j=2 ≠ min1_col → use min1=1 -->
  <rect x="238" y="118" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="139" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="263" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a">6+min1</text>
  <!-- min1/min2 annotation -->
  <rect x="310" y="118" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min1=6(col0)</text>
  <rect x="418" y="118" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="468" y="139" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">min2=6(col1)</text>

  <path d="M 280 168 L 280 182" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Row 2 ===== -->
  <text x="50" y="208" font-size="11" fill="#888" font-weight="bold">第 2 行</text>
  <text x="50" y="224" font-size="10" fill="#888">grid=[7,8,9]</text>
  <!-- dp[2][0]: j=0 == min1_col → use min2=6 -->
  <rect x="130" y="194" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="215" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">13</text>
  <text x="155" y="236" text-anchor="middle" font-size="9" fill="#b85450">7+min2</text>
  <!-- dp[2][1]: j=1 ≠ min1_col → use min1=6 -->
  <rect x="184" y="194" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="215" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">14</text>
  <text x="209" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">8+min1</text>
  <!-- dp[2][2]: j=2 ≠ min1_col → use min1=6 -->
  <rect x="238" y="194" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="215" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">15</text>
  <text x="263" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">9+min1</text>

  <!-- Divider -->
  <path d="M 40 256 L 520 256" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Answer ===== -->
  <rect x="100" y="272" width="360" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="295" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">min(dp[2]) = min(13, 14, 15) = 13</text>

  <!-- ===== Path trace ===== -->
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">最优路径回溯</text>
  <!-- Path cells: 1 → 5 → 7 -->
  <rect x="130" y="340" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="361" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="155" y="382" text-anchor="middle" font-size="9" fill="#888">row0,col0</text>

  <rect x="184" y="340" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="361" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="209" y="382" text-anchor="middle" font-size="9" fill="#888">row1,col1</text>

  <rect x="238" y="340" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="361" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>
  <text x="263" y="382" text-anchor="middle" font-size="9" fill="#888">row2,col0</text>

  <!-- Arrows between path -->
  <path d="M 182 356 L 184 356" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 236 356 L 238 356" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="340" y="361" font-size="11" fill="#888">1 + 5 + 7 =</text>
  <text x="430" y="361" font-size="16" fill="#b85450" font-weight="bold">13 ✓</text>

  <!-- Note -->
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#888">每步列号不同：col0 → col1 → col0，满足「相邻不同列」约束</text>
  <text x="280" y="428" text-anchor="middle" font-size="10" fill="#888">红色 = 同列禁选改用 min2，绿色 = 直接用 min1</text>
</svg>
