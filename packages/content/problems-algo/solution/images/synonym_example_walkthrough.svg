<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：DFS 决策树（happy→3 分支，sad→2 分支 = 6 句）</text>

  <!-- ===== Sentence bar ===== -->
  <text x="20" y="50" font-size="10" fill="#888">原句：</text>
  <rect x="55" y="38" width="28" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="69" y="55" text-anchor="middle" font-size="10" fill="#888">I</text>
  <rect x="87" y="38" width="34" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="55" text-anchor="middle" font-size="10" fill="#888">am</text>
  <rect x="125" y="38" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="153" y="55" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">happy★</text>
  <rect x="185" y="38" width="44" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="207" y="55" text-anchor="middle" font-size="10" fill="#888">today</text>
  <rect x="233" y="38" width="32" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="55" text-anchor="middle" font-size="10" fill="#888">but</text>
  <rect x="269" y="38" width="34" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="55" text-anchor="middle" font-size="10" fill="#888">was</text>
  <rect x="307" y="38" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="327" y="55" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">sad★</text>
  <rect x="351" y="38" width="64" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="55" text-anchor="middle" font-size="10" fill="#888">yesterday</text>
  <text x="430" y="55" font-size="9.5" fill="#888">★ = 可替换的分支点</text>

  <!-- ===== DFS Tree ===== -->
  <!-- linear annotation -->
  <text x="100" y="86" font-size="10" fill="#888">I am →</text>

  <!-- root: happy (branching) -->
  <rect x="250" y="76" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">happy★</text>
  <text x="280" y="120" text-anchor="middle" font-size="9" fill="#b85450">3 个近义词</text>

  <!-- edges from happy to 3 children -->
  <path d="M 265 106 Q 180 130 100 150" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 106 L 280 150" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 295 106 Q 380 130 460 150" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 3 branch children: cheerful, happy, joy -->
  <rect x="62" y="150" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="169" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cheerful</text>

  <rect x="250" y="150" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="169" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">happy</text>

  <rect x="432" y="150" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="169" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">joy</text>

  <!-- linear annotation -->
  <text x="190" y="196" text-anchor="middle" font-size="9.5" fill="#888">today but was →</text>

  <!-- edges to sad nodes -->
  <path d="M 100 178 L 100 208" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 178 L 280 208" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 460 178 L 460 208" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 3 sad nodes (branching) -->
  <rect x="74" y="208" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="227" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sad★</text>

  <rect x="254" y="208" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="227" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sad★</text>

  <rect x="434" y="208" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="227" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sad★</text>

  <text x="310" y="252" text-anchor="middle" font-size="9" fill="#b85450">2 个近义词</text>

  <!-- edges from each sad to 2 children (6 leaves) -->
  <path d="M 90 236 L 55 268" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 110 236 L 145 268" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 270 236 L 235 268" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 290 236 L 325 268" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 450 236 L 415 268" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 470 236 L 505 268" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- linear annotation -->
  <text x="310" y="280" text-anchor="middle" font-size="9.5" fill="#888">→ yesterday</text>

  <!-- 6 leaf nodes -->
  <rect x="28" y="288" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">sad</text>

  <rect x="118" y="288" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">sorrow</text>

  <rect x="208" y="288" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="235" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">sad</text>

  <rect x="298" y="288" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="325" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">sorrow</text>

  <rect x="388" y="288" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">sad</text>

  <rect x="478" y="288" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="505" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">sorrow</text>

  <!-- ===== 6 output sentences ===== -->
  <text x="20" y="338" font-size="10.5" fill="#888" font-weight="bold">输出（6 句，字典序）：</text>

  <rect x="20" y="346" width="580" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="30" y="361" font-size="9.5" fill="#333">① I am cheerful today but was sad yesterday</text>

  <rect x="20" y="368" width="580" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="30" y="383" font-size="9.5" fill="#333">② I am cheerful today but was sorrow yesterday</text>

  <rect x="20" y="390" width="580" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="30" y="405" font-size="9.5" fill="#333">③ I am happy today but was sad yesterday</text>

  <rect x="20" y="412" width="580" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="30" y="427" font-size="9.5" fill="#333">④ I am happy today but was sorrow yesterday</text>

  <rect x="20" y="434" width="580" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="30" y="449" font-size="9.5" fill="#333">⑤ I am joy today but was sad yesterday  ⑥ I am joy today but was sorrow yesterday</text>
</svg>
