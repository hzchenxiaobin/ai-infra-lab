<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：SEND + MORE = MONEY</text>
  <text x="280" y="38" text-anchor="middle" font-size="10.5" fill="#888">按 |coeff| 降序赋值，每步维护累加和 sum，剪枝判断 0 ∈ [sum+lo, sum+hi]</text>

  <!-- Table header -->
  <rect x="20" y="50" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="67" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步</text>
  <text x="105" y="67" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">字符</text>
  <text x="105" y="67" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold"></text>
  <text x="175" y="67" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">coeff</text>
  <text x="235" y="67" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">digit</text>
  <text x="320" y="67" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">sum（累加）</text>
  <text x="460" y="67" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">剪枝检查</text>

  <!-- Step 1: M = 1, coeff=-9000, sum=-9000 -->
  <rect x="20" y="76" width="520" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="92" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="86" y="79" width="38" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">M</text>
  <text x="175" y="92" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−9000</text>
  <text x="235" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="320" y="92" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">−9000</text>
  <text x="460" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 首字母 d≥1</text>

  <!-- Step 2: S = 9, coeff=+1000, sum=0 -->
  <rect x="20" y="101" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="117" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="86" y="104" width="38" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">S</text>
  <text x="175" y="117" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">+1000</text>
  <text x="235" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="320" y="117" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <text x="460" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ −9000+9000=0</text>

  <!-- Step 3: O = 0, coeff=-900, sum=0 -->
  <rect x="20" y="126" width="520" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="142" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="86" y="129" width="38" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">O</text>
  <text x="175" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−900</text>
  <text x="235" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="320" y="142" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <text x="460" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 非首字母 d=0</text>

  <!-- Step 4: N = 6, coeff=-90, sum=-540 -->
  <rect x="20" y="151" width="520" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="167" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="86" y="154" width="38" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">N</text>
  <text x="175" y="167" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−90</text>
  <text x="235" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="320" y="167" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">−540</text>
  <text x="460" y="167" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 剩余可补</text>

  <!-- Step 5: E = 5, coeff=+91, sum=-85 -->
  <rect x="20" y="176" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="192" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="86" y="179" width="38" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">E</text>
  <text x="175" y="192" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">+91</text>
  <text x="235" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="320" y="192" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">−85</text>
  <text x="460" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 剩余可补</text>

  <!-- Step 6: R = 8, coeff=+10, sum=-5 -->
  <rect x="20" y="201" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="217" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <rect x="86" y="204" width="38" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="217" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">R</text>
  <text x="175" y="217" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">+10</text>
  <text x="235" y="217" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="320" y="217" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">−5</text>
  <text x="460" y="217" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 剩余可补</text>

  <!-- Step 7: D = 7, coeff=+1, sum=+2 -->
  <rect x="20" y="226" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="242" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <rect x="86" y="229" width="38" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">D</text>
  <text x="175" y="242" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">+1</text>
  <text x="235" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="320" y="242" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">+2</text>
  <text x="460" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 仅剩 Y</text>

  <!-- Step 8: Y = 2, coeff=-1, sum=0 -->
  <rect x="20" y="251" width="520" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="267" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">8</text>
  <rect x="86" y="254" width="38" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="267" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Y</text>
  <text x="175" y="267" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−1</text>
  <text x="235" y="267" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="320" y="267" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="460" y="267" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ sum == 0!</text>

  <!-- Pruning detail box -->
  <rect x="30" y="290" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">剪枝示例（步骤 4 之后）</text>
  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#555">sum = −540，剩余 E(+91), R(+10), D(+1), Y(−1)：lo = 0+0+0+(−9) = −9，hi = 819+90+9+0 = 918</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#555">→ sum + lo = −549 ≤ 0 ≤ sum + hi = 378 ✓ 不剪枝，继续搜索</text>

  <!-- Result -->
  <rect x="30" y="352" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">M=1, S=9, O=0, N=6, E=5, R=8, D=7, Y=2</text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 9567 + 1085 = 10652 ✓</text>

  <!-- Footer -->
  <text x="280" y="410" text-anchor="middle" font-size="9.5" fill="#aaa">大系数优先赋值 → 前几步即可大幅缩小 sum 范围 → 后续小系数赋值时剪枝命中率极高</text>
</svg>
