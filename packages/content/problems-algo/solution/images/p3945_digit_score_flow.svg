<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：剥位累加求 数位和（n = 122 演算）</text>

  <!-- 左侧流程 -->
  <g filter="url(#rough2)">
    <rect x="40" y="42" width="120" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="100" y="64" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">开始：ans = 0</text>

    <path d="M100,76 L100,96" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <polygon points="100,98 170,132 100,166 30,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="100" y="128" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">n &gt; 0 ?</text>
    <text x="100" y="145" text-anchor="middle" font-size="9.5" fill="#8a6d1a">还有数位没剥？</text>

    <path d="M170,132 L216,132" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="191" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
    <rect x="220" y="114" width="104" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="272" y="137" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">返回 ans</text>

    <path d="M100,166 L100,186" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="88" y="181" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

    <rect x="35" y="188" width="130" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="100" y="206" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">ans += n % 10</text>
    <text x="100" y="221" text-anchor="middle" font-size="9" fill="#33506b">剥下个位，累加</text>

    <path d="M100,228 L100,248" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="35" y="250" width="130" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="100" y="268" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">n //= 10</text>
    <text x="100" y="283" text-anchor="middle" font-size="9" fill="#33506b">丢掉个位</text>

    <path d="M35,270 L14,270 L14,132 L26,132" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)"/>
    <text x="22" y="205" text-anchor="middle" font-size="9" fill="#2f5d24" transform="rotate(-90 22 205)">回边：继续剥</text>
  </g>

  <!-- 右侧演算表 -->
  <g filter="url(#rough2)">
    <rect x="344" y="42" width="196" height="248" rx="8" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="442" y="64" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">n = 122 逐轮演算</text>

    <rect x="360" y="76" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="380" y="93" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">轮</text>
    <rect x="402" y="76" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="424" y="93" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">n</text>
    <rect x="448" y="76" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="470" y="93" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">n%10</text>
    <rect x="494" y="76" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="514" y="93" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">ans</text>

    <rect x="360" y="106" width="40" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="380" y="123" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <rect x="402" y="106" width="44" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="424" y="123" text-anchor="middle" font-size="10.5" fill="#333">122</text>
    <rect x="448" y="106" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="470" y="123" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">2</text>
    <rect x="494" y="106" width="40" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="514" y="123" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">2</text>

    <rect x="360" y="136" width="40" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="380" y="153" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <rect x="402" y="136" width="44" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="424" y="153" text-anchor="middle" font-size="10.5" fill="#333">12</text>
    <rect x="448" y="136" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="470" y="153" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">2</text>
    <rect x="494" y="136" width="40" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="514" y="153" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">4</text>

    <rect x="360" y="166" width="40" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="380" y="183" text-anchor="middle" font-size="10.5" fill="#333">3</text>
    <rect x="402" y="166" width="44" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="424" y="183" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <rect x="448" y="166" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="470" y="183" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">1</text>
    <rect x="494" y="166" width="40" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="514" y="183" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">5</text>

    <rect x="360" y="196" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="380" y="213" text-anchor="middle" font-size="10.5" fill="#8a3030">4</text>
    <rect x="402" y="196" width="44" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="424" y="213" text-anchor="middle" font-size="10.5" fill="#8a3030">0</text>
    <rect x="448" y="196" width="44" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="470" y="213" text-anchor="middle" font-size="9.5" fill="#888">—</text>
    <rect x="494" y="196" width="40" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="514" y="213" text-anchor="middle" font-size="9.5" fill="#888">—</text>

    <text x="442" y="244" text-anchor="middle" font-size="10" fill="#4a6b5a">n = 0，循环终止</text>
    <text x="442" y="270" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">ans = 5 ✓</text>
  </g>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="20" y="304" width="520" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="326" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">要点：每轮「剥一个位」——n % 10 读个位，n //= 10 丢个位</text>
    <text x="280" y="345" text-anchor="middle" font-size="10" fill="#8a6d1a">轮数 = 位数 L；n ≤ 10⁹ ⇒ L ≤ 10，至多 10 轮，常数级闭环</text>
    <text x="280" y="364" text-anchor="middle" font-size="10" fill="#8a6d1a">n = 101：ans 走 1 → 2，第 3 轮 n = 0 终止，0 的贡献天然为 0</text>
  </g>
</svg>
