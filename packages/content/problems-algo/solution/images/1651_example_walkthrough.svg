  <text x="320" y="456" text-anchor="middle" font-size="8" fill="#888">红色行 = 示例窗口 6（对应右侧演算）</text>
  <text x="320" y="470" text-anchor="middle" font-size="8" fill="#888">注意：avg = 三月总和 ÷ 3，无接单月贡献 0，ROUND 到两位小数</text>
