  <text x="150" y="254" text-anchor="middle" font-size="8" fill="#888">橙 = 有接单月  蓝 = 无接单月（补零）</text>

  <!-- ===== Arrow from table to windows ===== -->
  <path d="M275 155 L300 155" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Right panel: 4 window examples ===== -->
  <text x="475" y="46" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口计算示例（3 月求和 ÷ 3）</text>

  <!-- Window 1: months 1-3 -->
  <rect x="310" y="54" width="310" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="465" y="68" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">窗口 1（1-3 月）</text>
  <text x="320" y="82" font-size="8" fill="#333">dist: (0+0+63)/3 = 63/3 = </text>
  <text x="475" y="82" font-size="8" fill="#b85450" font-weight="bold">21.00</text>
  <text x="500" y="82" font-size="8" fill="#333">dur: (0+0+38)/3 = </text>
  <text x="600" y="82" font-size="8" fill="#b85450" font-weight="bold">12.67</text>

  <!-- Window 4: months 4-6 -->
  <rect x="310" y="102" width="310" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="465" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">窗口 4（4-6 月）</text>
  <text x="320" y="130" font-size="8" fill="#333">dist: (0+0+73)/3 = 73/3 = </text>
  <text x="475" y="130" font-size="8" fill="#b85450" font-weight="bold">24.33</text>
  <text x="500" y="130" font-size="8" fill="#333">dur: (0+0+96)/3 = </text>
  <text x="600" y="130" font-size="8" fill="#b85450" font-weight="bold">32.00</text>

  <!-- Window 6: months 6-8 (highlighted) -->
  <rect x="310" y="150" width="310" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="465" y="164" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">窗口 6（6-8 月）⭐</text>
  <text x="320" y="178" font-size="8" fill="#333">dist: (73+100+119)/3 = 292/3 = </text>
  <text x="490" y="178" font-size="8" fill="#b85450" font-weight="bold">97.33</text>
  <text x="520" y="178" font-size="8" fill="#333">dur: (96+28+68)/3 = </text>
  <text x="600" y="178" font-size="8" fill="#b85450" font-weight="bold">64.00</text>

  <!-- Window 10: months 10-12 -->
  <rect x="310" y="198" width="310" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="465" y="212" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">窗口 10（10-12 月）</text>
  <text x="320" y="226" font-size="8" fill="#333">dist: (0+163+6)/3 = 169/3 = </text>
  <text x="485" y="226" font-size="8" fill="#b85450" font-weight="bold">56.33</text>
  <text x="520" y="226" font-size="8" fill="#333">dur: (0+193+38)/3 = </text>
  <text x="600" y="226" font-size="8" fill="#b85450" font-weight="bold">77.00</text>

