<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">24 小时制时钟：13:00 + 11h 回绕到 00:00（即 0）</text>

  <!-- Clock circle -->
  <circle cx="200" cy="180" r="118" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <!-- Hour ticks (24 ticks, every 15deg). 0 at top, clockwise increasing -->
  <g filter="url(#rough2)">
    <!-- minor ticks generated by hand for every hour 0..23 -->
    <line x1="200" y1="62" x2="200" y2="74" stroke="#888" stroke-width="1.2"/>
    <line x1="230" y1="65" x2="228" y2="77" stroke="#aaa" stroke-width="1"/>
    <line x1="259" y1="74" x2="253" y2="85" stroke="#aaa" stroke-width="1"/>
    <line x1="285" y1="89" x2="276" y2="96" stroke="#aaa" stroke-width="1"/>
    <line x1="306" y1="110" x2="295" y2="115" stroke="#aaa" stroke-width="1"/>
    <line x1="320" y1="136" x2="308" y2="138" stroke="#aaa" stroke-width="1"/>
    <line x1="325" y1="165" x2="313" y2="165" stroke="#aaa" stroke-width="1"/>
    <line x1="319" y1="195" x2="308" y2="192" stroke="#aaa" stroke-width="1"/>
    <line x1="303" y1="221" x2="293" y2="216" stroke="#aaa" stroke-width="1"/>
    <line x1="280" y1="243" x2="271" y2="236" stroke="#aaa" stroke-width="1"/>
    <line x1="252" y1="259" x2="246" y2="250" stroke="#aaa" stroke-width="1"/>
    <line x1="220" y1="266" x2="218" y2="255" stroke="#aaa" stroke-width="1"/>
    <line x1="200" y1="266" x2="200" y2="255" stroke="#888" stroke-width="1.2"/>
    <line x1="180" y1="265" x2="182" y2="253" stroke="#aaa" stroke-width="1"/>
    <line x1="155" y1="260" x2="159" y2="249" stroke="#aaa" stroke-width="1"/>
    <line x1="132" y1="248" x2="139" y2="240" stroke="#aaa" stroke-width="1"/>
    <line x1="112" y1="231" x2="121" y2="225" stroke="#aaa" stroke-width="1"/>
    <line x1="97" y1="208" x2="108" y2="204" stroke="#aaa" stroke-width="1"/>
    <line x1="87" y1="183" x2="99" y2="183" stroke="#aaa" stroke-width="1"/>
    <line x1="84" y1="156" x2="96" y2="159" stroke="#aaa" stroke-width="1"/>
    <line x1="87" y1="130" x2="99" y2="134" stroke="#aaa" stroke-width="1"/>
    <line x1="97" y1="106" x2="108" y2="114" stroke="#aaa" stroke-width="1"/>
    <line x1="113" y1="86" x2="122" y2="95" stroke="#aaa" stroke-width="1"/>
    <line x1="135" y1="70" x2="141" y2="80" stroke="#aaa" stroke-width="1"/>
  </g>

  <!-- Cardinal labels -->
  <text x="200" y="55" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 / 00:00</text>
  <text x="320" y="184" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">06:00</text>
  <text x="200" y="286" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">12:00</text>
  <text x="82" y="184" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">18:00</text>

  <!-- Start dot at 13 -->
  <circle cx="170" cy="290" r="7" fill="#446688" stroke="#224" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="308" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">正点 13:00</text>

  <!-- Wrap arc from 13 clockwise to 0 -->
  <path d="M 170 290 A 118 118 0 0 1 200 62"
        fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="120" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">+11h 延误</text>
  <text x="120" y="136" font-size="10" fill="#b85450" filter="url(#rough2)">（越过 24 回到 0）</text>

  <!-- End dot at 0 -->
  <circle cx="200" cy="62" r="8" fill="#b85450" stroke="#7a2" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Right side: formula box -->
  <rect x="360" y="90" width="140" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="115" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">取模公式</text>
  <text x="430" y="140" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">(13 + 11)</text>
  <text x="430" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">= 24</text>
  <text x="430" y="180" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">24 % 24 = 0</text>
  <text x="430" y="200" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">回绕到 00:00</text>

  <!-- Legend -->
  <rect x="60" y="318" width="400" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="338" font-size="11" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#b85450">红</tspan>：延误时长 +11h，沿时钟顺时针走到 24 时回绕到 0</text>
</svg>
