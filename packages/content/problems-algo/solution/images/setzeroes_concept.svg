<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">用首行首列做标记位：把"布尔数组"塞回矩阵自身</text>

  <!-- ===== Matrix label ===== -->
  <text x="134" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">内部发现 0 → 就地写标记</text>

  <!-- ===== Matrix 4x4 : first row & first col = marker region (orange) ===== -->
  <!-- Row 0 (marker row, orange). (0,0) dashed = ambiguous -->
  <rect x="50" y="84" width="42" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="71" y="106" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="92" y="84" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="106" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="134" y="84" width="42" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="106" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">9</text>
  <rect x="176" y="84" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="106" text-anchor="middle" font-size="13" fill="#333">7</text>

  <!-- Row 1 -->
  <rect x="50" y="118" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="140" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="92" y="118" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="140" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="134" y="118" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="140" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="176" y="118" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="140" text-anchor="middle" font-size="13" fill="#333">6</text>

  <!-- Row 2 : contains the 0 at (2,2); matrix[2][0]=3 will be marked -->
  <rect x="50" y="152" width="42" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="174" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="92" y="152" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="174" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="134" y="152" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="174" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="176" y="152" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="174" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Row 3 -->
  <rect x="50" y="186" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="208" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="92" y="186" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="208" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="134" y="186" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="208" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="176" y="186" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="208" text-anchor="middle" font-size="13" fill="#333">9</text>

  <!-- axis captions -->
  <text x="30" y="106" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">列标记</text>
  <text x="30" y="174" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">行标记</text>
  <text x="113" y="236" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">↑ 首行 = 列标记数组　　← 首列 = 行标记数组</text>

  <!-- arrows: from 0 at (2,2) to marker cells -->
  <!-- leftward along row 2 : (134,169) -> (93,169) -->
  <path d="M 134 169 L 93 169" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="113" y="162" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">写行标</text>
  <!-- upward along col 2 : (155,152) -> (155,118) -->
  <path d="M 155 152 L 155 118" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="166" y="138" font-size="9.5" fill="#b85450" font-weight="bold">写列标</text>

  <!-- (0,0) ambiguity callout -->
  <path d="M 71 84 Q 60 60 40 56" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="40" y="50" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">(0,0) 歧义</text>

  <!-- ===== Right side explanation boxes ===== -->
  <rect x="240" y="74" width="320" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="252" y="94" font-size="12" fill="#4a7a3a" font-weight="bold">首行 matrix[0][j] = 列标记数组</text>
  <text x="252" y="111" font-size="11" fill="#555">= 0 表示「第 j 列需清零」，省掉 colZero[]</text>

  <rect x="240" y="128" width="320" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="252" y="148" font-size="12" fill="#4a7a3a" font-weight="bold">首列 matrix[i][0] = 行标记数组</text>
  <text x="252" y="165" font-size="11" fill="#555">= 0 表示「第 i 行需清零」，省掉 rowZero[]</text>

  <rect x="240" y="182" width="320" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="252" y="202" font-size="12" fill="#b85450" font-weight="bold">matrix[0][0] 同时属首行 &amp; 首列 → 歧义</text>
  <text x="252" y="219" font-size="11" fill="#555">单独用两个 flag 提前判定首行/首列本身</text>
  <text x="252" y="233" font-size="11" fill="#555">是否有 0：firstRowZero、firstColZero</text>

  <!-- summary -->
  <rect x="30" y="262" width="520" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="284" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">流程：预检首行首列 → 标记内部 → 按标记清零内部 → 收尾首行首列</text>
  <text x="290" y="301" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">O(mn) 时间 · O(1) 额外空间（仅 2 个 bool）</text>

  <!-- pitfall -->
  <rect x="30" y="324" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="348" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">⚠️ 标记与清零必须分两趟：先读原始值打标，再读标记值清零，顺序不可颠倒</text>
</svg>
