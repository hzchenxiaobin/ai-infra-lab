<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：任意连续 10 个整数中恰有 5 个数位和为偶数</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">块 [10k, 10k+9] 的数位和 = digit_sum(k) + d（d=0..9），奇偶交替</text>

  <!-- ===== Block [10, 19] ===== -->
  <text x="72" y="100" text-anchor="end" font-size="11" fill="#888">[10,19]</text>
  <!-- cells: 10..19, width 42 starting x=80 -->
  <!-- 10 ds=1 O -->
  <rect x="80" y="84" width="42" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="104" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">10</text>
  <text x="101" y="128" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <!-- 11 ds=2 E -->
  <rect x="122" y="84" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="143" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <text x="143" y="128" text-anchor="middle" font-size="9.5" fill="#4a7a3a">2</text>
  <!-- 12 ds=3 O -->
  <rect x="164" y="84" width="42" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="104" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">12</text>
  <text x="185" y="128" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <!-- 13 ds=4 E -->
  <rect x="206" y="84" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">13</text>
  <text x="227" y="128" text-anchor="middle" font-size="9.5" fill="#4a7a3a">4</text>
  <!-- 14 ds=5 O -->
  <rect x="248" y="84" width="42" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="104" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">14</text>
  <text x="269" y="128" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>
  <!-- 15 ds=6 E -->
  <rect x="290" y="84" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="311" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>
  <text x="311" y="128" text-anchor="middle" font-size="9.5" fill="#4a7a3a">6</text>
  <!-- 16 ds=7 O -->
  <rect x="332" y="84" width="42" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="104" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">16</text>
  <text x="353" y="128" text-anchor="middle" font-size="9.5" fill="#aaa">7</text>
  <!-- 17 ds=8 E -->
  <rect x="374" y="84" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">17</text>
  <text x="395" y="128" text-anchor="middle" font-size="9.5" fill="#4a7a3a">8</text>
  <!-- 18 ds=9 O -->
  <rect x="416" y="84" width="42" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="437" y="104" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">18</text>
  <text x="437" y="128" text-anchor="middle" font-size="9.5" fill="#aaa">9</text>
  <!-- 19 ds=10 E -->
  <rect x="458" y="84" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="479" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">19</text>
  <text x="479" y="128" text-anchor="middle" font-size="9.5" fill="#4a7a3a">10</text>
  <text x="516" y="104" font-size="11" fill="#4a7a3a" font-weight="bold">5 个 ✓</text>

  <!-- alternating hint -->
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#888">末位 d=0..9 → 数位和奇偶性 E/O/E/O/… 交替（绿色=偶）</text>

  <!-- ===== Block [20, 29] ===== -->
  <text x="72" y="186" text-anchor="end" font-size="11" fill="#888">[20,29]</text>
  <!-- 20 ds=2 E -->
  <rect x="80" y="170" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">20</text>
  <text x="101" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a">2</text>
  <!-- 21 ds=3 O -->
  <rect x="122" y="170" width="42" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="143" y="190" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">21</text>
  <text x="143" y="214" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <!-- 22 ds=4 E -->
  <rect x="164" y="170" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">22</text>
  <text x="185" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a">4</text>
  <!-- 23 ds=5 O -->
  <rect x="206" y="170" width="42" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="190" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">23</text>
  <text x="227" y="214" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>
  <!-- 24 ds=6 E -->
  <rect x="248" y="170" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">24</text>
  <text x="269" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a">6</text>
  <!-- 25 ds=7 O -->
  <rect x="290" y="170" width="42" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="311" y="190" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">25</text>
  <text x="311" y="214" text-anchor="middle" font-size="9.5" fill="#aaa">7</text>
  <!-- 26 ds=8 E -->
  <rect x="332" y="170" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">26</text>
  <text x="353" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a">8</text>
  <!-- 27 ds=9 O -->
  <rect x="374" y="170" width="42" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="190" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">27</text>
  <text x="395" y="214" text-anchor="middle" font-size="9.5" fill="#aaa">9</text>
  <!-- 28 ds=10 E -->
  <rect x="416" y="170" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="437" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">28</text>
  <text x="437" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a">10</text>
  <!-- 29 ds=11 O -->
  <rect x="458" y="170" width="42" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="479" y="190" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">29</text>
  <text x="479" y="214" text-anchor="middle" font-size="9.5" fill="#aaa">11</text>
  <text x="516" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">5 个 ✓</text>

  <text x="280" y="232" text-anchor="middle" font-size="10" fill="#888">换了个块，前缀 digit_sum(k) 变了，但「5 偶 5 奇」不变</text>

  <!-- ===== Conclusion ===== -->
  <rect x="40" y="252" width="480" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结论：每 10 个连续数贡献 5 个偶数位和</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#555">f(num) = 5 × ⌊num / 10⌋ + 尾部 [q·10, num] 中的偶数位和个数</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#555">答案 = f(num) − 1 （从 [0, num] 计数中扣除 0）</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#888">注：0 的数位和为 0（偶），但题目只要正整数，故减 1</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888">尾部的偶计数取决于 digit_sum(q) 的奇偶（见流程图）</text>
</svg>
