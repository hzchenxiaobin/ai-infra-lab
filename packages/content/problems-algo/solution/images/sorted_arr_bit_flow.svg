<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：逐个插入，BIT 查询两侧计数取 min</text>

  <!-- Start -->
  <rect x="200" y="48" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">初始化 BIT，cost=0, total=0</text>

  <!-- arrow down -->
  <path d="M 270 84 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition (diamond) -->
  <polygon points="270,104 380,144 270,184 160,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">遍历 instructions</text>
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#444">还有未插入元素 x？</text>

  <!-- Yes arrow (down) -->
  <path d="M 270 184 L 270 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 1: less = query(x-1) -->
  <rect x="140" y="204" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="227" text-anchor="middle" font-size="11.5" fill="#333">① less = BIT.query(x − 1)</text>

  <path d="M 270 240 L 270 256" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: greater = total - query(x) -->
  <rect x="140" y="260" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="283" text-anchor="middle" font-size="11.5" fill="#333">② greater = total − BIT.query(x)</text>

  <path d="M 270 296 L 270 312" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: cost += min(less, greater) -->
  <rect x="140" y="316" width="260" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="339" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">③ cost += min(less, greater)</text>

  <path d="M 270 352 L 270 368" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 4: update + total++ -->
  <rect x="140" y="372" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="395" text-anchor="middle" font-size="11.5" fill="#2e6e2e">④ BIT.update(x, +1)；total += 1</text>

  <!-- Loop back arrow: from step4 right side up to diamond right side -->
  <path d="M 400 390 L 440 390 L 440 144 L 380 144" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="450" y="270" font-size="10" fill="#888" font-weight="bold">回循环</text>

  <!-- No arrow from diamond (right) to end -->
  <path d="M 380 144 L 430 144" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="138" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- End -->
  <rect x="370" y="128" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="445" y="150" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">return cost % MOD</text>

  <!-- Bottom notes -->
  <rect x="30" y="424" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="446" text-anchor="middle" font-size="10.5" fill="#555">每轮 O(log V)：两次 query（查 less / greater）+ 一次 update（插入 x）</text>
</svg>
