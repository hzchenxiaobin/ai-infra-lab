<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">最小化数组中的最大偏差：两个核心观察</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888">偏差 = max − min；操作只能让值变小，故缩偏差唯有降低 max</text>

  <!-- ============ LEFT: operation unification ============ -->
  <text x="30" y="78" font-size="12" fill="#446688" font-weight="bold">① 操作统一化：奇数先 ×2，全部变偶</text>

  <!-- odd example: 3 --x2--> 6 -->
  <text x="30" y="100" font-size="11" fill="#666">奇数 x：唯一可做 ×2（变偶），之后只能 ÷2</text>
  <rect x="40" y="112" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="63" y="134" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="63" y="158" text-anchor="middle" font-size="9" fill="#b85450">奇</text>
  <path d="M 90 129 L 120 129" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="122" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">×2</text>
  <rect x="124" y="112" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="134" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>
  <text x="147" y="158" text-anchor="middle" font-size="9" fill="#446688">偶</text>
  <path d="M 174 129 L 204 129" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="189" y="122" text-anchor="middle" font-size="10" fill="#888">÷2</text>
  <rect x="208" y="112" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="231" y="134" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="231" y="158" text-anchor="middle" font-size="9" fill="#b85450">停(奇)</text>

  <!-- even example: 8 -> 4 -> 2 -> 1 -->
  <text x="30" y="184" font-size="11" fill="#666">偶数 x：唯一可做 ÷2，直到变奇停止</text>
  <rect x="40" y="196" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="216" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">8</text>
  <path d="M 84 211 L 104 211" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="204" text-anchor="middle" font-size="9" fill="#888">÷2</text>
  <rect x="108" y="196" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="216" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <path d="M 152 211 L 172 211" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="204" text-anchor="middle" font-size="9" fill="#888">÷2</text>
  <rect x="176" y="196" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="216" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <path d="M 220 211 L 240 211" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="204" text-anchor="middle" font-size="9" fill="#888">÷2</text>
  <rect x="244" y="196" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="264" y="216" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="264" y="240" text-anchor="middle" font-size="9" fill="#b85450">停(奇)</text>

  <!-- insight box left -->
  <rect x="30" y="252" width="270" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="274" font-size="11" fill="#d6a040" font-weight="bold">预处理：所有奇数先 ×2</text>
  <text x="44" y="294" font-size="11" fill="#333">→ 全部变偶 → 此后只剩 ÷2 一种操作</text>
  <text x="44" y="312" font-size="11" fill="#333">→ 每个数取值只能沿链「单调减小」</text>
  <text x="44" y="332" font-size="10" fill="#888">奇数 ×2 不丢最优：若最优用原奇数值，</text>
  <text x="44" y="345" font-size="10" fill="#888">把翻倍后的偶数 ÷2 即还原</text>

  <!-- divider -->
  <path d="M 305 70 L 305 360" stroke="#ddd" stroke-width="1.5" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ============ RIGHT: greedy halve max ============ -->
  <text x="325" y="78" font-size="12" fill="#4a7a3a" font-weight="bold">② 贪心：反复折半当前最大值</text>

  <!-- max-heap illustration -->
  <text x="325" y="100" font-size="11" fill="#666">大顶堆：堆顶 = 当前 max</text>
  <rect x="395" y="112" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="423" y="134" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">max</text>
  <rect x="350" y="156" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="375" y="175" text-anchor="middle" font-size="11" fill="#446688">·</text>
  <rect x="446" y="156" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="471" y="175" text-anchor="middle" font-size="11" fill="#446688">·</text>
  <path d="M 412 146 L 375 156" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 434 146 L 471 156" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- min label -->
  <text x="545" y="100" font-size="11" fill="#666">另维护 min</text>
  <rect x="528" y="112" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="549" y="132" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">min</text>

  <!-- deviation formula -->
  <rect x="325" y="196" width="245" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">dev = max − min，记 ans = min(ans, dev)</text>

  <!-- action -->
  <rect x="325" y="240" width="245" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="262" text-anchor="middle" font-size="12" fill="#333">弹出 max → ÷2 → 放回堆 → 更新 min</text>

  <!-- stop condition -->
  <rect x="325" y="284" width="245" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">堆顶变奇数 → 无法再 ÷2 → 停止</text>

  <!-- insight box right -->
  <rect x="325" y="328" width="245" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="339" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">为何贪心正确？</text>
  <text x="339" y="368" font-size="11" fill="#333">值只能减 → 缩 dev 必须降 max；</text>
  <text x="339" y="384" font-size="11" fill="#333">非 max 元素变小只会拖低 min，无益。</text>
  <text x="339" y="398" font-size="10" fill="#888">每步都是真实可达配置，故记录的 dev 可达</text>

  <!-- footer -->
  <text x="290" y="430" text-anchor="middle" font-size="11" fill="#888">先把奇数 ×2 统一为「只能 ÷2」的世界，再用大顶堆贪心折半最大值，沿途记录 dev 最小值</text>
  <text x="290" y="450" text-anchor="middle" font-size="10" fill="#aaa">同源：1648 销售价值减少的颜色球（堆贪心 + 批量）、239 滑动窗口最大值（堆维护极值）</text>
</svg>
