<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：items1=[[1,1],[4,5],[3,8]] + items2=[[3,1],[1,5]]</text>

  <!-- Table frame -->
  <rect x="30" y="40" width="500" height="266" fill="none" stroke="#cfcfcf" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="30" y="40" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="58" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">来源</text>
  <text x="170" y="58" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">item [v,w]</text>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">map 变化</text>
  <text x="475" y="58" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">map 状态</text>
  <line x1="120" y1="40" x2="120" y2="306" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="40" x2="220" y2="306" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="40" x2="420" y2="306" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: items1 [1,1] -->
  <text x="75" y="84" text-anchor="middle" font-size="11.5" fill="#446688">items1</text>
  <text x="170" y="84" text-anchor="middle" font-size="11.5" fill="#333">[1, 1]</text>
  <text x="320" y="84" text-anchor="middle" font-size="11.5" fill="#4a7a3a">map[1] += 1</text>
  <text x="475" y="84" text-anchor="middle" font-size="11" fill="#333">{1:1}</text>
  <line x1="30" y1="92" x2="530" y2="92" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 2: items1 [4,5] -->
  <text x="75" y="112" text-anchor="middle" font-size="11.5" fill="#446688">items1</text>
  <text x="170" y="112" text-anchor="middle" font-size="11.5" fill="#333">[4, 5]</text>
  <text x="320" y="112" text-anchor="middle" font-size="11.5" fill="#4a7a3a">map[4] += 5</text>
  <text x="475" y="112" text-anchor="middle" font-size="11" fill="#333">{1:1,4:5}</text>
  <line x1="30" y1="120" x2="530" y2="120" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 3: items1 [3,8] -->
  <text x="75" y="140" text-anchor="middle" font-size="11.5" fill="#446688">items1</text>
  <text x="170" y="140" text-anchor="middle" font-size="11.5" fill="#333">[3, 8]</text>
  <text x="320" y="140" text-anchor="middle" font-size="11.5" fill="#4a7a3a">map[3] += 8</text>
  <text x="475" y="140" text-anchor="middle" font-size="11" fill="#333">{1:1,4:5,3:8}</text>
  <line x1="30" y1="148" x2="530" y2="148" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 4: items2 [3,1]  MERGE highlight -->
  <rect x="30" y="148" width="500" height="30" fill="#fce4ec" opacity="0.55" filter="url(#rough2)"/>
  <text x="75" y="168" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">items2</text>
  <text x="170" y="168" text-anchor="middle" font-size="11.5" fill="#333">[3, 1]</text>
  <text x="320" y="168" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">map[3] += 1 → 9</text>
  <text x="475" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">{1:1,4:5,3:9}</text>
  <line x1="30" y1="178" x2="530" y2="178" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 5: items2 [1,5]  MERGE highlight -->
  <rect x="30" y="178" width="500" height="30" fill="#fce4ec" opacity="0.55" filter="url(#rough2)"/>
  <text x="75" y="198" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">items2</text>
  <text x="170" y="198" text-anchor="middle" font-size="11.5" fill="#333">[1, 5]</text>
  <text x="320" y="198" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">map[1] += 5 → 6</text>
  <text x="475" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">{1:6,4:5,3:9}</text>
  <line x1="30" y1="208" x2="530" y2="208" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 6: sort & output -->
  <rect x="30" y="208" width="500" height="30" fill="#e6f4ea" opacity="0.6" filter="url(#rough2)"/>
  <text x="75" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">排序输出</text>
  <text x="170" y="228" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <text x="320" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">按 v 升序取 [v, map[v]]</text>
  <text x="475" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[[1,6],[3,9],[4,5]]</text>

  <!-- bottom note -->
  <text x="30" y="276" font-size="10.5" fill="#555">• items1 扫完 map 有 3 个键；items2 的 [3,1]、[1,5] 命中已有键 → 累加（红行）</text>
  <text x="30" y="294" font-size="10.5" fill="#555">• 最终按 key 升序输出：value 1→6、3→9、4→5，与示例 1 期望一致 ✓</text>
</svg>
