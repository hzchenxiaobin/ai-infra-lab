<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="250" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：fn = (a,b,c) =&gt; (a+b+c)</text>

  <!-- table frame -->
  <!-- column x-edges: 15, 60, 175, 270, 390, 480, 605 -->
  <!-- col widths: 45, 115, 95, 120, 90, 125 -->

  <!-- header row -->
  <rect x="15" y="48" width="590" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="60" y1="48" x2="60" y2="188" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="175" y1="48" x2="175" y2="188" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="48" x2="270" y2="188" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="48" x2="390" y2="188" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="48" x2="480" y2="188" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="37" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">步</text>
  <text x="117" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">调用</text>
  <text x="222" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">called(前)</text>
  <text x="330" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">动作</text>
  <text x="435" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">返回</text>
  <text x="542" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">called(后)</text>

  <!-- row 0 -->
  <rect x="15" y="78" width="590" height="36" rx="0" fill="#fafafa" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="37" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="117" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">once(fn)</text>
  <text x="222" y="100" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="330" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">创建闭包</text>
  <text x="435" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">wrapper</text>
  <text x="542" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- row 1 (first call - green highlight) -->
  <rect x="15" y="114" width="590" height="36" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="117" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">onceFn(1,2,3)</text>
  <text x="222" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">false</text>
  <text x="330" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">fn(1,2,3)=6</text>
  <text x="435" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="542" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">true</text>

  <!-- row 2 (second call - orange highlight) -->
  <rect x="15" y="150" width="590" height="36" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="117" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">onceFn(2,3,6)</text>
  <text x="222" y="172" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">true</text>
  <text x="330" y="172" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">跳过 fn</text>
  <text x="435" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">undefined</text>
  <text x="542" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">true</text>

  <!-- bottom note -->
  <text x="310" y="214" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">输出：[{ "calls":1, "value":6 }] —— fn 只被调 1 次，第 2 次直接返回 undefined</text>
  <text x="310" y="234" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第 1 行是「建状态」，第 2 行「执行」，第 3 行「短路」——开关一旦为 true 便不再回退</text>
</svg>
