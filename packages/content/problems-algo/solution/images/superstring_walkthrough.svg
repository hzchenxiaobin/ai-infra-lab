  <text x="475" y="174" text-anchor="middle" font-size="10" fill="#444">总长 25 − 9 = 16</text>
  <text x="475" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">绿色格 = 路径上的边</text>
  <text x="475" y="216" text-anchor="middle" font-size="10" fill="#d6a040">黄色格 = 次大重叠</text>

  <text x="20" y="276" font-size="11" fill="#555" font-weight="bold">逐步拼接：</text>

  <text x="20" y="300" font-size="10" fill="#446688">① word[2]</text>
  <text x="100" y="300" font-size="11" fill="#333" font-weight="bold">gcta</text>

  <text x="20" y="320" font-size="10" fill="#446688">② +word[1] (ov=3)</text>
