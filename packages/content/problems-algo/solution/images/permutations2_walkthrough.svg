<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1ₐ, 1_b, 2] 的回溯过程</text>

  <!-- Table header -->
  <rect x="40" y="40" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="59" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">步骤</text>
  <text x="175" y="59" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">path</text>
  <text x="290" y="59" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">used</text>
  <text x="445" y="59" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">动作</text>

  <!-- Row 1 -->
  <rect x="40" y="72" width="540" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="92" text-anchor="middle" font-size="11" fill="#333">①</text>
  <text x="175" y="92" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[]</text>
  <text x="290" y="92" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[F, F, F]</text>
  <text x="445" y="92" text-anchor="middle" font-size="11" fill="#333">选 1ₐ → path=[1]</text>

  <!-- Row 2 -->
  <rect x="40" y="106" width="540" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="126" text-anchor="middle" font-size="11" fill="#333">②</text>
  <text x="175" y="126" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[1]</text>
  <text x="290" y="126" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[T, F, F]</text>
  <text x="445" y="126" text-anchor="middle" font-size="11" fill="#333">选 1_b → path=[1,1]</text>

  <!-- Row 3 -->
  <rect x="40" y="140" width="540" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="160" text-anchor="middle" font-size="11" fill="#333">③</text>
  <text x="175" y="160" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[1,1]</text>
  <text x="290" y="160" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[T, T, F]</text>
  <text x="445" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">选 2 → [1,1,2] 收集 ✓</text>

  <!-- Row 4 -->
  <rect x="40" y="174" width="540" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="194" text-anchor="middle" font-size="11" fill="#333">④</text>
  <text x="175" y="194" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[1]</text>
  <text x="290" y="194" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[T, F, F]</text>
  <text x="445" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">撤销后选 2 → [1,2,1] 收集 ✓</text>

  <!-- Row 5 - KEY: pruned! -->
  <rect x="40" y="208" width="540" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤</text>
  <text x="175" y="230" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[]</text>
  <text x="290" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">[F, F, F]</text>
  <text x="445" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=1: 1==1 &amp;&amp; !used[0] → 剪枝 ✗</text>
  <text x="445" y="240" text-anchor="middle" font-size="9" fill="#b85450">used[0]=F → 1ₐ 已回溯 → 同层重复！</text>

  <!-- Row 6 -->
  <rect x="40" y="246" width="540" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="266" text-anchor="middle" font-size="11" fill="#333">⑥</text>
  <text x="175" y="266" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[]</text>
  <text x="290" y="266" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[F, F, F]</text>
  <text x="445" y="266" text-anchor="middle" font-size="11" fill="#333">选 2 → path=[2]</text>

  <!-- Row 7 -->
  <rect x="40" y="280" width="540" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="300" text-anchor="middle" font-size="11" fill="#333">⑦</text>
  <text x="175" y="300" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[2]</text>
  <text x="290" y="300" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[F, F, T]</text>
  <text x="445" y="300" text-anchor="middle" font-size="11" fill="#333">选 1ₐ → path=[2,1]</text>

  <!-- Row 8 - KEY: NOT pruned! -->
  <rect x="40" y="314" width="540" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑧</text>
  <text x="175" y="336" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[2,1]</text>
  <text x="290" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-family="monospace" font-weight="bold">[T, F, T]</text>
  <text x="445" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i=1: 1==1 但 used[0]=T → 不剪！</text>
  <text x="445" y="346" text-anchor="middle" font-size="9" fill="#4a7a3a">选 1_b → [2,1,1] 收集 ✓（不同位置）</text>

  <!-- Contrast box -->
  <rect x="40" y="362" width="540" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="384" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">★ 核心对比：步骤 ⑤ vs ⑧</text>
  <text x="310" y="402" text-anchor="middle" font-size="11" fill="#b85450">⑤ used[0]=F：1ₐ 在同层被选过又撤销 → 再选 1_b 产生重复 → 剪！</text>
  <text x="310" y="420" text-anchor="middle" font-size="11" fill="#4a7a3a">⑧ used[0]=T：1ₐ 已在 path 中（不同位置）→ 选 1_b 是新排列 → 不剪！</text>
  <text x="310" y="434" text-anchor="middle" font-size="10" fill="#888">最终结果：[[1,1,2], [1,2,1], [2,1,1]]（共 3 个，无重复无遗漏）</text>
</svg>
