<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：三表连接链 —— 行程是事实，车定赛道，人供履历</text>
  <text x="290" y="36" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Trips JOIN Vehicles ON vehicle_id 取 fuel_type；Drivers 迟到连接，只在排名时取 accidents</text>

  <rect x="30" y="52" width="150" height="198" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Drivers（司机）</text>
  <rect x="38" y="82" width="134" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="97" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">driver_id (PK)</text>
  <rect x="38" y="106" width="134" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">name / age</text>
  <rect x="38" y="130" width="134" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="145" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">experience</text>
  <rect x="38" y="154" width="134" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="105" y="169" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">accidents ★</text>
  <text x="105" y="198" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">纯维表：只在第三级</text>
  <text x="105" y="212" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">平局时才用得上</text>
  <text x="105" y="234" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（迟到连接）</text>

  <rect x="215" y="52" width="150" height="198" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Vehicles（机动车）</text>
  <rect x="223" y="82" width="134" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="97" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">vehicle_id (PK)</text>
  <rect x="223" y="106" width="134" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">driver_id (FK)</text>
  <rect x="223" y="130" width="134" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="145" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">model / mileage</text>
  <rect x="223" y="154" width="134" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="290" y="169" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">fuel_type ★</text>
  <text x="290" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">赛道：分组的</text>
  <text x="290" y="212" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">一半 + 窗口的分区键</text>
  <text x="290" y="234" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（Gasoline / Electric）</text>

  <rect x="400" y="52" width="150" height="198" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Trips（行程）</text>
  <rect x="408" y="82" width="134" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="97" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">trip_id (PK)</text>
  <rect x="408" y="106" width="134" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">vehicle_id (FK)</text>
  <rect x="408" y="130" width="134" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="145" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">duration</text>
  <rect x="408" y="154" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="440" y="169" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">rating ★</text>
  <rect x="478" y="154" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="510" y="169" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">distance ★</text>
  <text x="475" y="198" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">事实表：聚合的</text>
  <text x="475" y="212" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">原料，每行一个新事实</text>
  <text x="475" y="234" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（无行程 → 自动出局）</text>

  <path d="M 398 106 L 369 106" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="383" y="98" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">ON vehicle_id</text>
  <path d="M 213 106 L 184 106" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="198" y="98" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">ON driver_id</text>

  <rect x="30" y="266" width="164" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="282" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">fuel_type = 赛道（分区）</text>
  <rect x="204" y="266" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="294" y="282" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">rating/distance = 成绩（聚合）</text>
  <rect x="394" y="266" width="156" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="472" y="282" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">accidents = 第三级平局键</text>

  <rect x="30" y="302" width="520" height="82" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="324" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">分组粒度 = (fuel_type, driver_id)：每位司机在每个燃料赛道各一份成绩</text>
  <text x="290" y="348" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">rating = ROUND(AVG(rating), 2)　　distance = SUM(distance)</text>
  <text x="290" y="370" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">两个聚合列恰好就是输出列 —— 聚合算完，输出的原料就齐了</text>
</svg>
