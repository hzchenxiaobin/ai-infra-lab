<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3（zero=3, one=3, limit=2）：盯住最后一列 j = 3</text>

  <!-- table header -->
  <rect x="70" y="48" width="54" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="97" y="70" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">t</text>
  <rect x="124" y="48" width="118" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="70" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">dp[t][3][1]</text>
  <rect x="242" y="48" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="70" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">s1[t][3]</text>

  <!-- row t=0 -->
  <rect x="70" y="82" width="54" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="97" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="124" y="82" width="118" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="183" y="105" text-anchor="middle" font-size="12.5" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="242" y="82" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="292" y="105" text-anchor="middle" font-size="12.5" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- row t=1 -->
  <rect x="70" y="118" width="54" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="97" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="124" y="118" width="118" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="183" y="141" text-anchor="middle" font-size="12.5" fill="#2d5a24" filter="url(#rough2)">2</text>
  <rect x="242" y="118" width="100" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="292" y="141" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>

  <!-- row t=2 -->
  <rect x="70" y="154" width="54" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="97" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="124" y="154" width="118" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="183" y="177" text-anchor="middle" font-size="12.5" fill="#2d5a24" filter="url(#rough2)">5</text>
  <rect x="242" y="154" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="292" y="177" text-anchor="middle" font-size="12.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- row t=3 -->
  <rect x="70" y="190" width="54" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="97" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="124" y="190" width="118" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="183" y="213" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="242" y="190" width="100" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="292" y="213" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">14</text>

  <!-- window bracket around t=1..2 -->
  <rect x="62" y="114" width="288" height="80" fill="none" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="7 5" rx="8" filter="url(#rough2)"/>
  <text x="206" y="248" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">窗口 [i−limit, i−1] = [1, 2]（i=3, limit=2）</text>

  <text x="206" y="268" text-anchor="middle" font-size="10.5" fill="#8c2f28" filter="url(#rough2)">dp[0][3][1] = 0：[1,1,1] 连续 3 个 1 &gt; limit ✗</text>
  <text x="206" y="286" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">s1[t][3]：列内自上而下累加 dp[t][3][1]</text>

  <!-- arrows from s1 cells to computation box -->
  <path d="M342,100 C356,100 358,110 370,116" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M342,172 C354,172 358,158 370,146" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- right panel -->
  <rect x="372" y="60" width="172" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="458" y="82" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">dp[3][3][0]</text>
  <text x="458" y="102" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">= s1[2][3] − s1[0][3]</text>
  <text x="458" y="122" text-anchor="middle" font-size="13" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">= 7 − 0 = 7</text>
  <text x="458" y="142" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（= 窗口和 2 + 5）</text>

  <rect x="372" y="168" width="172" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="458" y="189" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">对称地（沿行用 s0）</text>
  <text x="458" y="209" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">dp[3][3][1] = 7</text>

  <rect x="372" y="236" width="172" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="458" y="258" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = 7 + 7 = 14 ✓</text>
  <text x="458" y="277" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">7 个以 0 结尾 + 7 个以 1 结尾</text>

  <!-- bottom trace -->
  <rect x="30" y="304" width="500" height="106" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3129 的手推：枚举段长 L，逐项加 —— dp[2][3][1] + dp[1][3][1] = 5 + 2</text>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">3130 的做法：一次减法 —— s1[2][3] − s1[0][3] = 7 − 0，同一个和</text>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">规模到 1000 时，「逐项加 → 一次减」正是 10⁹ → 10⁶ 的差距来源</text>
  <text x="280" y="398" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">i−limit−1 = 0：s1[0][3] = 0 恰好是「窗口左端再往前一格」的前缀和，越界取 0 的规则在这里生效</text>
</svg>
