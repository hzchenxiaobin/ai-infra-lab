<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">链表随机节点算法流程：单遍扫描 + 1/i 概率替换</text>

  <!-- 初始化 -->
  <rect x="200" y="46" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">reservoir=head.val; i=1; cur=head</text>

  <!-- 箭头到循环 -->
  <path d="M 290 76 L 290 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="230" y="100" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="290" y="120" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">cur = cur.next</text>
  <text x="358" y="120" font-size="10" fill="#888">↻ 循环体</text>

  <!-- 箭头到判定1 -->
  <path d="M 290 130 L 290 156" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1: cur == null? -->
  <path d="M 290 156 L 380 196 L 290 236 L 200 196 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="194" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">cur == null?</text>
  <text x="290" y="210" text-anchor="middle" font-size="10" fill="#888">链表到头？</text>

  <!-- 是分支：返回 -->
  <path d="M 380 196 L 410 196" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="180" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="470" y="201" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">return reservoir</text>

  <!-- 否分支：i++ -->
  <path d="M 290 236 L 290 258" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="250" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="250" y="258" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="290" y="277" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i = i + 1</text>

  <!-- 箭头到判定2 -->
  <path d="M 290 286 L 290 312" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定2: rand()%i==0? -->
  <path d="M 290 312 L 390 350 L 290 388 L 190 350 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="348" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">rand()%i == 0?</text>
  <text x="290" y="362" text-anchor="middle" font-size="10" fill="#888">概率 1/i</text>

  <!-- 否分支：不替换，回循环（左侧） -->
  <path d="M 190 350 L 100 350" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="146" y="344" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="108" y="368" font-size="10" fill="#b85450">保持不变</text>
  <path d="M 100 350 L 100 115 L 230 115" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="76" y="232" font-size="10" fill="#b85450">↻ 回循环</text>

  <!-- 是分支：替换 -->
  <path d="M 390 350 L 410 350" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="396" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="334" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="470" y="355" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">reservoir = cur.val</text>

  <!-- 替换后回循环（右侧） -->
  <path d="M 530 350 L 550 350 L 550 115 L 350 115" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="540" y="232" font-size="10" fill="#4a7a3a">↻ 回循环</text>

  <!-- 底部注解 -->
  <rect x="30" y="402" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="420" text-anchor="middle" font-size="10.5" fill="#b85450">只遍历一次、只存 reservoir 与 i 两个变量 → O(n) 时间、O(1) 额外空间，链表长度未知亦可用</text>
</svg>
