<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：strs = ["flower","flow","flight"]</text>

  <!-- aligned strings -->
  <text x="40" y="56" font-size="11" fill="#888">下标:</text>
  <text x="130" y="56" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="180" y="56" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="230" y="56" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="280" y="56" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="330" y="56" font-size="11" fill="#888" font-weight="bold">4</text>
  <text x="380" y="56" font-size="11" fill="#888" font-weight="bold">5</text>

  <!-- row 0 flower -->
  <text x="40" y="84" font-size="11" fill="#888">strs[0]</text>
  <rect x="110" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>
  <rect x="156" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="202" y="62" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>
  <rect x="248" y="62" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="84" text-anchor="middle" font-size="13" fill="#999">w</text>
  <rect x="294" y="62" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="84" text-anchor="middle" font-size="13" fill="#999">e</text>
  <rect x="340" y="62" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="84" text-anchor="middle" font-size="13" fill="#999">r</text>

  <!-- row 1 flow -->
  <text x="40" y="122" font-size="11" fill="#888">strs[1]</text>
  <rect x="110" y="100" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="122" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>
  <rect x="156" y="100" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="122" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="202" y="100" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="122" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>
  <rect x="248" y="100" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="13" fill="#999">w</text>

  <!-- row 2 flight -->
  <text x="40" y="160" font-size="11" fill="#888">strs[2]</text>
  <rect x="110" y="138" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>
  <rect x="156" y="138" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="202" y="138" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">i</text>
  <rect x="248" y="138" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="13" fill="#999">g</text>
  <rect x="294" y="138" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="160" text-anchor="middle" font-size="13" fill="#999">h</text>
  <rect x="340" y="138" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="160" text-anchor="middle" font-size="13" fill="#999">t</text>

  <!-- Steps table header -->
  <text x="40" y="196" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="100" y="196" font-size="12" fill="#444" font-weight="bold">列 i</text>
  <text x="160" y="196" font-size="12" fill="#444" font-weight="bold">基准字符 c</text>
  <text x="290" y="196" font-size="12" fill="#444" font-weight="bold">逐串比较</text>
  <text x="450" y="196" font-size="12" fill="#444" font-weight="bold">前缀</text>
  <text x="520" y="196" font-size="12" fill="#444" font-weight="bold">max</text>

  <line x1="30" y1="202" x2="550" y2="202" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <text x="40" y="222" font-size="11" fill="#333">1</text>
  <text x="100" y="222" font-size="11" fill="#333">0</text>
  <text x="160" y="222" font-size="11" fill="#333" font-weight="bold">f</text>
  <text x="290" y="222" font-size="11" fill="#82b366">f = f = f，全一致</text>
  <text x="450" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">"f"</text>
  <text x="520" y="222" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Step 2 -->
  <text x="40" y="244" font-size="11" fill="#333">2</text>
  <text x="100" y="244" font-size="11" fill="#333">1</text>
  <text x="160" y="244" font-size="11" fill="#333" font-weight="bold">l</text>
  <text x="290" y="244" font-size="11" fill="#82b366">l = l = l，全一致</text>
  <text x="450" y="244" font-size="11" fill="#4a7a3a" font-weight="bold">"fl"</text>
  <text x="520" y="244" font-size="11" fill="#333" font-weight="bold">2 ⭐</text>

  <!-- Step 3 -->
  <text x="40" y="266" font-size="11" fill="#333">3</text>
  <text x="100" y="266" font-size="11" fill="#333">2</text>
  <text x="160" y="266" font-size="11" fill="#333" font-weight="bold">o</text>
  <text x="290" y="266" font-size="11" fill="#b85450">o = o ≠ i，分歧!</text>
  <text x="450" y="266" font-size="11" fill="#888">停止</text>
  <text x="520" y="266" font-size="11" fill="#333">2</text>

  <!-- result box -->
  <rect x="60" y="290" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = "fl"（列 2 出现 o ≠ i，扫描终止）</text>
  <text x="290" y="330" text-anchor="middle" font-size="11" fill="#888">公共前缀长度 ≤ 最短串长度（此处 "flow" 长 4，但分歧更早出现）</text>

  <!-- legend -->
  <rect x="60" y="354" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="365" font-size="11" fill="#555">已扫一致的列</text>
  <rect x="190" y="354" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="210" y="365" font-size="11" fill="#555">出现分歧</text>
  <rect x="290" y="354" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="310" y="365" font-size="11" fill="#555">结果</text>
  <text x="400" y="365" font-size="11" fill="#888">⭐ = 当前全局最大</text>
</svg>
