<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：二元一次方程组 + 可行性边界</text>

  <!-- 巨无霸 card -->
  <rect x="30" y="44" width="240" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="150" y="64" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">巨无霸汉堡 × x 个</text>
  <circle cx="70" cy="92" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="92" cy="92" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="114" cy="92" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="136" cy="92" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="96" font-size="11" fill="#b85450">番茄×4</text>
  <rect x="70" y="112" width="40" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="170" y="124" font-size="11" fill="#d6a040">奶酪×1</text>

  <!-- 小皇堡 card -->
  <rect x="290" y="44" width="240" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="410" y="64" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">小皇堡 × y 个</text>
  <circle cx="330" cy="92" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="352" cy="92" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="96" font-size="11" fill="#b85450">番茄×2</text>
  <rect x="330" y="112" width="40" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="386" y="124" font-size="11" fill="#d6a040">奶酪×1</text>

  <!-- Equations box -->
  <rect x="60" y="152" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">①  4x + 2y = tomatoSlices  （番茄总量）</text>
  <text x="280" y="194" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">②  x + y = cheeseSlices  （奶酪总量）</text>

  <!-- derivation arrow -->
  <path d="M 280 212 L 280 226" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="224" font-size="10.5" fill="#888">由②得 y=C−x，代入①</text>

  <!-- Solved formulas -->
  <rect x="60" y="232" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="252" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">x = (T − 2C) / 2</text>
  <text x="160" y="268" text-anchor="middle" font-size="10" fill="#888">巨无霸数</text>

  <rect x="300" y="232" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="252" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">y = (4C − T) / 2</text>
  <text x="400" y="268" text-anchor="middle" font-size="10" fill="#888">小皇堡数</text>

  <!-- Feasibility -->
  <rect x="40" y="300" width="480" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">可行性条件（三者全满足才有解）</text>
  <text x="60" y="350" font-size="12" fill="#444">1. T 为偶数  （4x+2y 恒为偶 → T 奇数直接无解）</text>
  <text x="60" y="374" font-size="12" fill="#444">2. T ≥ 2C     （保证 x ≥ 0，番茄够配奶酪）</text>
  <text x="60" y="398" font-size="12" fill="#444">3. T ≤ 4C     （保证 y ≥ 0，奶酪够配番茄）</text>
  <text x="280" y="432" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇒ 合并：T 为偶 且 2C ≤ T ≤ 4C</text>
</svg>
