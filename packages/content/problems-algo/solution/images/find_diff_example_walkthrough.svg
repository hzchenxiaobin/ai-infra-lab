<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算: s = "abcd", t = "abcde" — 未配对集合的消长</text>

  <!-- phase labels -->
  <text x="120" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段 1: 扫 s（累积）</text>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">阶段 2: 扫 t（抵消 + 落单）</text>

  <!-- divider -->
  <path d="M 270 44 L 270 340" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Phase 1: process s ===== -->
  <!-- step labels -->
  <text x="40" y="92" font-size="11" fill="#888">字符:</text>
  <rect x="80" y="76" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="124" y="76" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="168" y="76" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="212" y="76" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>

  <!-- ans after each s char -->
  <text x="40" y="148" font-size="11" fill="#888">ans:</text>
  <rect x="80" y="130" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="98" y="149" text-anchor="middle" font-size="10" fill="#333">{a}</text>
  <rect x="124" y="130" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="142" y="149" text-anchor="middle" font-size="10" fill="#333">{a,b}</text>
  <rect x="168" y="130" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="186" y="149" text-anchor="middle" font-size="9" fill="#333">{a,b,c}</text>
  <rect x="212" y="130" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="149" text-anchor="middle" font-size="8.5" fill="#333">{a,b,c,d}</text>

  <!-- note -->
  <text x="150" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a">扫完 s: ans = a⊕b⊕c⊕d</text>

  <!-- arrow to phase 2 -->
  <path d="M 270 182 L 270 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 2: process t ===== -->
  <text x="300" y="92" font-size="11" fill="#888">字符:</text>
  <rect x="340" y="76" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="384" y="76" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="428" y="76" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="472" y="76" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="516" y="76" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="534" y="97" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">e</text>

  <!-- ans after each t char -->
  <text x="300" y="148" font-size="11" fill="#888">ans:</text>
  <rect x="340" y="130" width="36" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="358" y="149" text-anchor="middle" font-size="9" fill="#999">{b,c,d}</text>
  <rect x="384" y="130" width="36" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="402" y="149" text-anchor="middle" font-size="9" fill="#999">{c,d}</text>
  <rect x="428" y="130" width="36" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="446" y="149" text-anchor="middle" font-size="10" fill="#999">{d}</text>
  <rect x="472" y="130" width="36" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="490" y="149" text-anchor="middle" font-size="10" fill="#999">∅</text>
  <rect x="516" y="130" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="534" y="149" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">{e}</text>

  <!-- cancel annotations -->
  <text x="358" y="120" text-anchor="middle" font-size="9" fill="#b85450">a⊕a=0</text>
  <text x="402" y="120" text-anchor="middle" font-size="9" fill="#b85450">b⊕b=0</text>
  <text x="446" y="120" text-anchor="middle" font-size="9" fill="#b85450">c⊕c=0</text>
  <text x="490" y="120" text-anchor="middle" font-size="9" fill="#b85450">d⊕d=0</text>

  <!-- note -->
  <text x="430" y="182" text-anchor="middle" font-size="11" fill="#d6a040">前 4 个字符各与 s 中的配对抵消，只剩 e</text>

  <!-- final result -->
  <rect x="180" y="220" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">ans = e  →  返回 'e'</text>

  <!-- bottom note -->
  <rect x="40" y="290" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键洞察：XOR 等价于维护「未配对字符集合」</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555">扫 s 时每个字符「加入」集合；扫 t 时每个字符若已在集合中则「配对消去」</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#555">由于 t = s 打乱 + 1 个多余字符，前 |s| 个 t 字符恰好消空集合</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最后多出的那个字符无法配对，即为答案</text>
</svg>
