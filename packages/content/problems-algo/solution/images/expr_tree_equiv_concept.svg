<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,3 L8,3" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
      <path d="M6,0 L9,3 L6,6" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：结构不同但叶子多重集相同 ⇒ 两表达式等价</text>

  <!-- Sub labels for each tree -->
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">root1 = (a + b) + c</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">root2 = a + (b + c)</text>

  <!-- ============ Tree 1 (left) ============ -->
  <!-- edges -->
  <line x1="140" y1="92" x2="105" y2="140" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="140" y1="92" x2="175" y2="140" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="105" y1="152" x2="82" y2="200" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="105" y1="152" x2="128" y2="200" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- root + (blue, internal) -->
  <circle cx="140" cy="84" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="89" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" font-family="monospace">+</text>
  <!-- left internal + -->
  <circle cx="105" cy="148" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="153" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" font-family="monospace">+</text>
  <!-- right leaf c -->
  <circle cx="175" cy="148" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="153" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-family="monospace">c</text>
  <!-- leaf a -->
  <circle cx="82" cy="206" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="82" y="211" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-family="monospace">a</text>
  <!-- leaf b -->
  <circle cx="128" cy="206" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="128" y="211" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-family="monospace">b</text>

  <!-- ============ Tree 2 (right) ============ -->
  <line x1="420" y1="92" x2="385" y2="140" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="420" y1="92" x2="455" y2="140" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="455" y1="152" x2="432" y2="200" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="455" y1="152" x2="478" y2="200" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- root + -->
  <circle cx="420" cy="84" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="89" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" font-family="monospace">+</text>
  <!-- left leaf a -->
  <circle cx="385" cy="148" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="153" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-family="monospace">a</text>
  <!-- right internal + -->
  <circle cx="455" cy="148" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="153" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" font-family="monospace">+</text>
  <!-- leaf b -->
  <circle cx="432" cy="206" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="211" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-family="monospace">b</text>
  <!-- leaf c -->
  <circle cx="478" cy="206" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="478" y="211" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-family="monospace">c</text>

  <!-- downward arrows from each tree to the multiset -->
  <path d="M 140 232 L 140 262" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 420 232 L 420 262" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ============ Multiset boxes ============ -->
  <rect x="62" y="268" width="156" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="287" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">叶子多重集</text>
  <text x="140" y="305" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" font-weight="bold">{a:1, b:1, c:1}</text>

  <rect x="342" y="268" width="156" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="287" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">叶子多重集</text>
  <text x="420" y="305" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" font-weight="bold">{a:1, b:1, c:1}</text>

  <!-- "=" between two multisets -->
  <text x="280" y="298" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold" font-family="monospace">=</text>

  <!-- bottom insight banner -->
  <rect x="50" y="332" width="460" height="38" fill="#f0f7ff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#555">+ 满足交换律 &amp; 结合律 ⇒ 表达式值仅由「各变量出现次数」决定</text>
</svg>
