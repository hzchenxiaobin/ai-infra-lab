<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：建频率 → 建矩阵 M → 快速幂 M^t → 求和取模</text>

  <rect x="210" y="42" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 72 L 260 88" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="90" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">扫一遍 s，建频率向量 cnt[26]</text>
  <text x="260" y="118" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">O(n)，只数个数不存顺序</text>
  <path d="M 260 124 L 260 142" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="144" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">建转移矩阵：M[(i+k)%26][i] = 1</text>
  <text x="260" y="178" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">k = 1..nums[i]，双重循环 O(26·25)</text>
  <path d="M 260 188 L 260 204" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,206 348,236 260,266 172,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">e &gt; 0 ?</text>
  <path d="M 348 236 L 452 236 L 452 352" fill="none" stroke="#a07830" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="378" y="228" text-anchor="middle" font-size="10" fill="#8a3833" font-weight="bold" filter="url(#rough2)">否：M^e 已乘完</text>
  <text x="238" y="280" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 266 L 260 286" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,288 336,316 260,344 184,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">e &amp; 1 ?</text>
  <path d="M 184 316 L 170 316" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="306" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="278" y="360" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">否（该 bit 为 0）</text>
  <path d="M 260 344 L 260 362" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="28" y="298" width="140" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="98" y="314" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">cnt ← M · cnt</text>
  <text x="98" y="330" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">向量乘 O(26²)，顺手别用矩阵乘</text>
  <path d="M 98 336 C 98 356, 200 350, 236 362" fill="none" stroke="#a07830" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="178" y="364" width="168" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="262" y="380" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">M ← M · M，e >>= 1</text>
  <text x="262" y="397" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">矩阵平方 O(26³)，是复杂度大头</text>
  <path d="M 178 385 L 84 385 L 84 236 L 166 236" fill="none" stroke="#a07830" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="326" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">处理下一个 bit</text>

  <rect x="378" y="354" width="148" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="452" y="372" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = Σ cnt[i]</text>
  <text x="452" y="388" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">mod (1e9+7)</text>
  <text x="452" y="401" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">返回 ans</text>
  <path d="M 452 352 L 452 354" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="420" width="480" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="439" font-size="10.5" fill="#555" filter="url(#rough2)">💡 一轮矩阵平方 26³ ≈ 1.76 万次乘加，快速幂只需 log₂(1e9) ≈ 30 轮 —— 逐轮 2.6×10¹⁰ 步的问题缩成约 5×10⁵ 步</text>
</svg>
