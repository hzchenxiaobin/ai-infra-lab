<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：LEFT JOIN 保留全部员工，无奖金填 NULL</text>

  <!-- Employee table (left) -->
  <text x="115" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Employee（左表，基准）</text>
  <rect x="30" y="62" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="79" font-size="9.5" fill="#333">empId</text>
  <text x="100" y="79" font-size="9.5" fill="#333">name</text>
  <text x="160" y="79" font-size="9.5" fill="#333">salary</text>
  <line x1="75" y1="62" x2="75" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="140" y1="62" x2="140" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="88" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="48" y="103" font-size="9.5" fill="#333">3</text>
  <text x="100" y="103" font-size="9.5" fill="#333">Brad</text>
  <text x="160" y="103" font-size="9.5" fill="#333">4000</text>
  <line x1="75" y1="88" x2="75" y2="110" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="140" y1="88" x2="140" y2="110" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="110" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="48" y="125" font-size="9.5" fill="#333">1</text>
  <text x="100" y="125" font-size="9.5" fill="#333">John</text>
  <text x="160" y="125" font-size="9.5" fill="#333">1000</text>
  <line x1="75" y1="110" x2="75" y2="132" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="140" y1="110" x2="140" y2="132" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="132" width="170" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="147" font-size="9.5" fill="#333">2</text>
  <text x="100" y="147" font-size="9.5" fill="#333">Dan</text>
  <text x="160" y="147" font-size="9.5" fill="#333">2000</text>
  <line x1="75" y1="132" x2="75" y2="154" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="140" y1="132" x2="140" y2="154" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="154" width="170" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="169" font-size="9.5" fill="#333">4</text>
  <text x="100" y="169" font-size="9.5" fill="#333">Thomas</text>
  <text x="160" y="169" font-size="9.5" fill="#333">4000</text>
  <line x1="75" y1="154" x2="75" y2="176" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="140" y1="154" x2="140" y2="176" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="115" y="194" text-anchor="middle" font-size="9" fill="#d6a040">↑ Brad/John 在 Bonus 中无记录</text>

  <!-- LEFT JOIN arrow -->
  <path d="M200 128 L300 128" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="250" y="120" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">LEFT JOIN</text>
  <text x="250" y="140" text-anchor="middle" font-size="9" fill="#446688">ON e.empId = b.empId</text>

  <!-- Bonus table (right) -->
  <text x="445" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Bonus（右表）</text>
  <rect x="380" y="86" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="103" font-size="9.5" fill="#333">empId</text>
  <text x="465" y="103" font-size="9.5" fill="#333">bonus</text>
  <line x1="435" y1="86" x2="435" y2="112" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="380" y="112" width="130" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="127" font-size="9.5" fill="#333">2</text>
  <text x="465" y="127" font-size="9.5" fill="#b85450" font-weight="bold">500</text>
  <line x1="435" y1="112" x2="435" y2="134" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="380" y="134" width="130" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="149" font-size="9.5" fill="#333">4</text>
  <text x="465" y="149" font-size="9.5" fill="#333">2000</text>
  <line x1="435" y1="134" x2="435" y2="156" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="445" y="174" text-anchor="middle" font-size="9" fill="#4a7a3a">↑ empId=3、1 无记录</text>

  <!-- Down arrow to result -->
  <path d="M290 200 L290 226" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="320" y="218" font-size="9.5" fill="#d6a040">无匹配 → bonus 填 NULL</text>

  <!-- Result table after LEFT JOIN -->
  <text x="290" y="244" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">LEFT JOIN 后中间结果（4 行，全部员工保留）</text>
  <rect x="150" y="252" width="280" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="269" font-size="9.5" fill="#333">empId</text>
  <text x="245" y="269" font-size="9.5" fill="#333">name</text>
  <text x="345" y="269" font-size="9.5" fill="#333">bonus</text>
  <line x1="215" y1="252" x2="215" y2="278" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="305" y1="252" x2="305" y2="278" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="278" width="280" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="185" y="292" font-size="9.5" fill="#333">3</text>
  <text x="245" y="292" font-size="9.5" fill="#333">Brad</text>
  <text x="345" y="292" font-size="9.5" fill="#b85450" font-weight="bold">NULL</text>
  <line x1="215" y1="278" x2="215" y2="298" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="305" y1="278" x2="305" y2="298" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="298" width="280" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="185" y="312" font-size="9.5" fill="#333">1</text>
  <text x="245" y="312" font-size="9.5" fill="#333">John</text>
  <text x="345" y="312" font-size="9.5" fill="#b85450" font-weight="bold">NULL</text>
  <line x1="215" y1="298" x2="215" y2="318" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="305" y1="298" x2="305" y2="318" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="318" width="280" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="185" y="332" font-size="9.5" fill="#333">2</text>
  <text x="245" y="332" font-size="9.5" fill="#333">Dan</text>
  <text x="345" y="332" font-size="9.5" fill="#4a7a3a" font-weight="bold">500</text>
  <line x1="215" y1="318" x2="215" y2="338" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="305" y1="318" x2="305" y2="338" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="338" width="280" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="185" y="352" font-size="9.5" fill="#333">4</text>
  <text x="245" y="352" font-size="9.5" fill="#333">Thomas</text>
  <text x="345" y="352" font-size="9.5" fill="#333">2000</text>
  <line x1="215" y1="338" x2="215" y2="358" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="305" y1="338" x2="305" y2="358" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Footer note -->
  <rect x="80" y="380" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="398" text-anchor="middle" font-size="10" fill="#333">INNER JOIN 会丢弃 Brad/John（无匹配行）</text>
  <text x="290" y="414" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LEFT JOIN 才能保住「没有奖金」的员工</text>
</svg>
