<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 368" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="368" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算："abcbcacabbaccba"，n = 15 → 答案 3</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总计数 cnt = {a:5, b:5, c:5}；15 的约数升序：1, 3, 5, 15</text>

  <!-- L=3 切块 -->
  <text x="112" y="68" text-anchor="end" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">L = 3 的切法</text>

  <rect x="125" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="153" y="69" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">abc</text>
  <rect x="187" y="48" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="215" y="69" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">bca</text>
  <rect x="249" y="48" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="277" y="69" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">cab</text>
  <rect x="311" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="339" y="69" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">bac</text>
  <rect x="373" y="48" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="401" y="69" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cba</text>

  <text x="153" y="94" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">块0</text>
  <text x="215" y="94" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">块1</text>
  <text x="277" y="94" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">块2</text>
  <text x="339" y="94" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">块3</text>
  <text x="401" y="94" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">块4</text>

  <!-- 逐候选表 -->
  <rect x="48" y="104" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">候选 L</text>
  <rect x="108" y="104" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">k=n/L</text>
  <rect x="168" y="104" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">检查过程</text>
  <rect x="338" y="104" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">结论</text>

  <!-- 行1：L=1 -->
  <rect x="48" y="126" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="147" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="108" y="126" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="138" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <rect x="168" y="126" width="170" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="253" y="140" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">预检：5 % 15 ≠ 0，除不尽</text>
  <text x="253" y="155" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">O(26) 秒杀，连切块都不用</text>
  <rect x="338" y="126" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="147" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">淘汰 ✗</text>

  <!-- 行2：L=3 -->
  <rect x="48" y="160" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="181" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="108" y="160" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="138" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="168" y="160" width="170" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="253" y="174" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">预检 5/5 = 1 ✓，need = {a:1,b:1,c:1}</text>
  <text x="253" y="189" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">五块计数全部相等 ✓</text>
  <rect x="338" y="160" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="408" y="181" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 3 ✓</text>

  <!-- 行3：合并灰行 -->
  <rect x="48" y="194" width="430" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="263" y="212" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">L = 5（k=3）同样除不尽，本就无效；L = 15 恒有效兜底——已找到 3，停止枚举</text>

  <!-- 结论框 -->
  <rect x="55" y="236" width="410" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 3：t 可取任意一块（如 "abc"），其余块都是它的重排</text>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">同法："abba" → 2（ab|ba）；"cdef" → 4（各字母 1 个，只有 k=1 幸存）</text>

  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">剪枝次序「先 O(26) 预检、后 O(n) 切块」：L = 1 被一次除法直接回绝</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">合法块数 k 对因数向下封闭（k 合法 ⇒ k 的因数也合法）→ 最大合法 k 唯一确定最小 L</text>
</svg>
