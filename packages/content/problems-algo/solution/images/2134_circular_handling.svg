<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">环形处理：复制数组，把环形窗口展平为线性窗口</text>

  <!-- Left: circular array -->
  <text x="140" y="56" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">环形数组（首尾相邻）</text>
  <!-- circle of 7 cells -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="100" y="72" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="117" y="91">0</text>
    <rect x="138" y="72" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="155" y="91" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="100" y="104" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="117" y="123">0</text>
    <rect x="138" y="104" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="155" y="123" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="100" y="136" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="117" y="155" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="138" y="136" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="155" y="155">0</text>
    <rect x="100" y="168" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="117" y="187">0</text>
    <rect x="138" y="168" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="155" y="187">0</text>
  </g>
  <!-- circular arrow connecting top-right to bottom-right -->
  <path d="M 176 86 Q 196 130 176 174" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 96 174 Q 76 130 96 86" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="216" text-anchor="middle" font-size="10.5" fill="#888">窗口可能跨越首尾边界</text>

  <!-- Arrow to right -->
  <path d="M 210 130 L 250 130" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="230" y="122" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">复制</text>

  <!-- Right: duplicated linear array -->
  <text x="400" y="56" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">复制数组 nums + nums（线性展平）</text>

  <!-- first copy label -->
  <text x="160" y="78" font-size="10" fill="#aaa">原数组</text>
  <!-- first copy: 0 1 0 1 1 0 0 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="270" y="84" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="286" y="103">0</text>
    <rect x="304" y="84" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="320" y="103" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="338" y="84" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="354" y="103">0</text>
    <rect x="372" y="84" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="388" y="103" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="406" y="84" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="422" y="103" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="440" y="84" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="456" y="103">0</text>
    <rect x="474" y="84" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="490" y="103">0</text>
  </g>
  <!-- second copy label -->
  <text x="160" y="128" font-size="10" fill="#aaa">复制段</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="270" y="134" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="286" y="153">0</text>
    <rect x="304" y="134" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="320" y="153" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="338" y="134" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="354" y="153">0</text>
    <rect x="372" y="134" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="388" y="153" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="406" y="134" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="422" y="153" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="440" y="134" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="456" y="153">0</text>
    <rect x="474" y="134" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="490" y="153">0</text>
  </g>

  <!-- window wrapping around: highlight last 2 of first copy + first 1 of second copy -->
  <rect x="438" y="82" width="68" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="270" y="132" width="36" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <!-- connecting bracket -->
  <path d="M 472 116 Q 486 124 472 130" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 288 130 Q 274 124 288 116" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="380" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跨边界窗口 → 在复制数组中变成连续窗口</text>

  <!-- Divider -->
  <path d="M 40 210 L 520 210" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Key points -->
  <text x="40" y="236" font-size="12" fill="#555" font-weight="bold">关键点：</text>
  <text x="60" y="258" font-size="11.5" fill="#555">• 环形数组的「跨首尾窗口」等价于在 nums+nums 中间的连续窗口</text>
  <text x="60" y="278" font-size="11.5" fill="#555">• 只需在 nums+nums 上滑窗 n 个位置（起点 0 ~ n−1），窗口大小 = total</text>
  <text x="60" y="298" font-size="11.5" fill="#555">• 第 i 个窗口覆盖 nums[i..i+total−1]，用下标 % n 或直接在拼接数组上访问</text>

  <!-- Complexity box -->
  <rect x="60" y="318" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">空间换时间：O(n) 额外空间存复制数组</text>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#888">也可用下标 % n 直接在原数组上滑窗，省去复制 → O(1) 额外空间</text>

  <!-- Note about window count -->
  <rect x="60" y="374" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="397" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠️ 只需滑 n 个窗口（非 2n），因为第 n 个窗口与第 0 个窗口完全相同</text>
</svg>
