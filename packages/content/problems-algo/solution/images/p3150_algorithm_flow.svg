<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单表扫描 + 三谓词 OR 过滤</text>

  <!-- step 1 -->
  <rect x="160" y="44" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① FROM Tweets</text>
  <text x="260" y="74" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">读取全部推文行</text>

  <path d="M 260 80 L 260 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2: decision diamond -->
  <polygon points="260,98 400,150 260,202 120,150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">② WHERE 逐行判定</text>
  <text x="260" y="141" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">长度 &gt; 140 ?</text>
  <text x="260" y="157" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">'@' 次数 &gt; 3 ?</text>
  <text x="260" y="173" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">'#' 次数 &gt; 3 ?</text>
  <text x="260" y="192" text-anchor="middle" font-size="9.5" fill="#a08430" filter="url(#rough2)">（三个条件取 OR）</text>

  <!-- false branch -->
  <path d="M 120 150 C 92 170, 84 192, 84 214" stroke="#999999" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="30" y="196" font-size="10" fill="#888" filter="url(#rough2)">全为否</text>
  <rect x="18" y="216" width="132" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="84" y="233" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">有效推文</text>
  <text x="84" y="249" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">→ 丢弃</text>

  <!-- true branch -->
  <path d="M 260 202 L 260 222" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="216" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">任一为真（OR）</text>

  <!-- step 3 -->
  <rect x="160" y="224" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ SELECT tweet_id</text>
  <text x="260" y="254" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">只投影编号列，不输出 content</text>

  <path d="M 260 260 L 260 276" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="160" y="278" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">输出（任意顺序）</text>
  <text x="260" y="313" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">tweet_id ∈ {4, 7, 13, 14}</text>

  <!-- side note -->
  <rect x="392" y="224" width="116" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="242" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">计数口径</text>
  <text x="450" y="258" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">'@'、'#' 按</text>
  <text x="450" y="272" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">字符出现次数</text>
  <text x="450" y="286" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">（REPLACE 差值）</text>

  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">窗口/聚合都不需要：纯 WHERE 谓词过滤，一趟扫完</text>
</svg>
