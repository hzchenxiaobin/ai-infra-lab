<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：删 0 不改变 1 的个数 ⟹ 最短候选首尾贴 1</text>

  <!-- Step 1: r=5 窗口 -->
  <text x="60" y="58" font-size="12" fill="#446688" font-weight="bold">Step 1：right = 5，cnt 首次到 3</text>
  <text x="60" y="80" font-size="12" fill="#555">s =</text>

  <rect x="90" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="82" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="126" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="82" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="162" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="82" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="198" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="216" y="82" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="234" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="252" y="82" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="270" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="82" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="306" y="64" width="36" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="82" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="342" y="64" width="36" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="82" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="378" y="64" width="36" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="82" text-anchor="middle" font-size="13" fill="#999">1</text>

  <text x="108" y="104" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="144" y="104" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="180" y="104" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="216" y="104" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="252" y="104" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="288" y="104" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="324" y="104" text-anchor="middle" font-size="10" fill="#999">6</text>
  <text x="360" y="104" text-anchor="middle" font-size="10" fill="#999">7</text>
  <text x="396" y="104" text-anchor="middle" font-size="10" fill="#999">8</text>

  <path d="M 86 60 L 86 40 L 308 40 L 308 60" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="440" y="78" font-size="12" fill="#446688">窗口 [0,5]</text>
  <text x="440" y="96" font-size="12" fill="#333">候选 "100011"</text>
  <text x="440" y="114" font-size="12" fill="#999">长 6，首已是 1</text>

  <!-- Step 2: r=8 收缩 -->
  <text x="60" y="152" font-size="12" fill="#b85450" font-weight="bold">Step 2：right = 8，cnt=4 超载 → 收缩</text>
  <text x="60" y="174" font-size="12" fill="#555">s =</text>

  <rect x="90" y="158" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="176" text-anchor="middle" font-size="13" fill="#b85450">1</text>
  <path d="M 96 170 L 120 178 M 96 178 L 120 170" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="126" y="158" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="144" y="176" text-anchor="middle" font-size="13" fill="#d6a040">0</text>
  <rect x="162" y="158" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="180" y="176" text-anchor="middle" font-size="13" fill="#d6a040">0</text>
  <rect x="198" y="158" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="216" y="176" text-anchor="middle" font-size="13" fill="#d6a040">0</text>
  <rect x="234" y="158" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="176" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="270" y="158" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="176" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="306" y="158" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="176" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="342" y="158" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="176" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="378" y="158" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="176" text-anchor="middle" font-size="13" fill="#333">1</text>

  <path d="M 230 154 L 230 136 L 394 136 L 394 154" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 394 154 L 394 148" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="440" y="156" font-size="12" fill="#b85450">弹出 s₀（cnt→3）</text>
  <text x="440" y="174" font-size="12" fill="#d6a040">left 越过 3 个 0</text>
  <text x="440" y="192" font-size="12" fill="#4a7a3a">窗口 [4,8] = "11001"</text>
  <text x="440" y="210" font-size="12" fill="#4a7a3a" font-weight="bold">长 5，更短 ✓</text>

  <!-- 箭头连接两步 -->
  <path d="M 240 118 L 240 130" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- 结论框 -->
  <rect x="60" y="238" width="440" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">① 删掉首/尾的 0，1 的个数不变 → 最短候选首尾都贴 1</text>
  <text x="280" y="284" text-anchor="middle" font-size="13" fill="#333">② 固定右端点，从右往左数第 k 个 1 唯一 → 候选唯一</text>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a">（尾部 0 同理：right=6,7 的候选更长，直接剪掉）</text>

  <text x="60" y="338" font-size="12" fill="#555">择优规则：</text>
  <rect x="140" y="322" width="170" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="225" y="341" text-anchor="middle" font-size="12" fill="#333">长度更短 → 直接换</text>
  <text x="322" y="341" font-size="12" fill="#555">同长 →</text>
  <rect x="368" y="322" width="150" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="443" y="341" text-anchor="middle" font-size="12" fill="#333">逐字符比字典序</text>

  <text x="60" y="380" font-size="12" fill="#999">⚠ 同长候选都首字符为 1：起点靠左 ≠ 字典序更小，不能偷懒</text>
</svg>
