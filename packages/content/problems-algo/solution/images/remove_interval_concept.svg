<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心观察：区间 [a, b) 减去 [x, y)
  </text>

  <!-- number axis -->
  <path d="M 60 200 L 520 200" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="204" font-size="11" fill="#888" filter="url(#rough2)">数轴</text>

  <!-- Original interval [a,b) -->
  <text x="80" y="92" font-size="13" fill="#446688" filter="url(#rough2)">原区间 [a, b)</text>
  <rect x="120" y="150" width="320" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- tick marks a and b -->
  <path d="M 120 144 L 120 182" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 440 144 L 440 182" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="140" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="440" y="140" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- Removal [x,y) overlay -->
  <text x="300" y="250" font-size="13" fill="#b85450" filter="url(#rough2)">删除区间 [x, y)</text>
  <rect x="200" y="214" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <path d="M 200 208 L 200 246" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 380 208 L 380 246" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="270" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="380" y="270" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">y</text>

  <!-- dashed projection lines from x,y down to axis -->
  <path d="M 200 214 L 200 200" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 380 214 L 380 200" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result: two pieces -->
  <text x="80" y="312" font-size="13" fill="#4a7a3a" filter="url(#rough2)">结果（保留两端）</text>
  <rect x="120" y="322" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="339" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[a, x)</text>
  <rect x="380" y="322" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="339" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[y, b)</text>
  <!-- gap (removed) -->
  <rect x="200" y="322" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="290" y="339" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">已删除</text>

  <!-- Formula box -->
  <rect x="120" y="358" width="320" height="16" fill="none" stroke="none"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    保留 [a, x)（若 a &lt; x）与 [y, b)（若 b &gt; y）
  </text>
</svg>
