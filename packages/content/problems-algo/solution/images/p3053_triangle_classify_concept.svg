<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心概念：四路分类判定——CASE 分支顺序即优先级</text>
  <text x="360" y="44" text-anchor="middle" font-size="10.5" fill="#888">先过合法性筛子，再按「全等 → 恰两等 → 互异」细分；命中即返回（短路）</text>

  <!-- ============ Triangles table (left) ============ -->
  <text x="110" y="78" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">Triangles 表（输入）</text>

  <rect x="40" y="84" width="140" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="100" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">A</text>
  <text x="110" y="100" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">B</text>
  <text x="155" y="100" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">C</text>

  <rect x="40" y="108" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="65" y="124" text-anchor="middle" font-size="10.5" fill="#333">20</text>
  <text x="110" y="124" text-anchor="middle" font-size="10.5" fill="#333">20</text>
  <text x="155" y="124" text-anchor="middle" font-size="10.5" fill="#333">23</text>

  <rect x="40" y="132" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="65" y="148" text-anchor="middle" font-size="10.5" fill="#333">20</text>
  <text x="110" y="148" text-anchor="middle" font-size="10.5" fill="#333">20</text>
  <text x="155" y="148" text-anchor="middle" font-size="10.5" fill="#333">20</text>

  <rect x="40" y="156" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="65" y="172" text-anchor="middle" font-size="10.5" fill="#333">20</text>
  <text x="110" y="172" text-anchor="middle" font-size="10.5" fill="#333">21</text>
  <text x="155" y="172" text-anchor="middle" font-size="10.5" fill="#333">22</text>

  <rect x="40" y="180" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">13</text>
  <text x="110" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">14</text>
  <text x="155" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">30</text>

  <!-- arrows: all rows enter the CASE tower -->
  <path d="M 182 120 L 206 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 182 150 L 206 112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ CASE priority tower (middle) ============ -->
  <text x="335" y="78" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">CASE 优先级塔（自上而下）</text>

  <rect x="210" y="86" width="250" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="335" y="104" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">① 合法性筛（最严）</text>
  <text x="335" y="120" text-anchor="middle" font-size="9.5" fill="#555">A+B≤C 或 A+C≤B 或 B+C≤A</text>

  <rect x="210" y="138" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="335" y="160" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">② 三边全等：A=B 且 B=C</text>

  <rect x="210" y="182" width="250" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="335" y="200" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">③ 恰有两边相等</text>
  <text x="335" y="216" text-anchor="middle" font-size="9.5" fill="#555">A=B 或 B=C 或 A=C</text>

  <rect x="210" y="234" width="250" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="335" y="256" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">④ ELSE 兜底：三边互异</text>

  <!-- arrows: tower -> output labels -->
  <path d="M 462 108 L 488 108" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462 156 L 488 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462 204 L 488 204" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 462 252 L 488 252" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ output labels (right) ============ -->
  <text x="586" y="78" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">输出标签</text>

  <rect x="492" y="90" width="188" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="586" y="112" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">Not A Triangle</text>

  <rect x="492" y="140" width="188" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="586" y="162" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">Equilateral（等边）</text>

  <rect x="492" y="190" width="188" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="586" y="212" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">Isosceles（等腰）</text>

  <rect x="492" y="240" width="188" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="586" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">Scalene（不等边）</text>

  <!-- ============ bottom takeaway ============ -->
  <rect x="40" y="288" width="640" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">查询本质：SELECT A, B, C, CASE WHEN ①→②→③→④ END AS triangle_type FROM Triangles</text>
  <text x="360" y="326" text-anchor="middle" font-size="10" fill="#555">① 合法性最严在前：(1,1,3) 两等但非法 → Not A Triangle（若两等在前必误判）</text>
  <text x="360" y="342" text-anchor="middle" font-size="10" fill="#555">② 全等先于两等：等腰分支借短路语义免写「非全等」排除条件；③ ELSE 收互异</text>
  <text x="360" y="358" text-anchor="middle" font-size="10" fill="#888">CASE 自上而下短路：命中即返回，每行恰好落进一类；输出行数 = 输入行数</text>
</svg>
