<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">扩展：i &amp; (i−1) 抹去最低设置位</text>

  <!-- ===== i = 12 = 1100 ===== -->
  <text x="60" y="62" font-size="12.5" fill="#446688" font-weight="bold">i = 12</text>
  <text x="60" y="80" font-size="10.5" fill="#888">二进制</text>
  <rect x="120" y="66" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="139" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="66" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="66" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="86" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <rect x="240" y="66" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="86" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <text x="290" y="86" font-size="10.5" fill="#b85450" font-weight="bold">↑ 最低设置位在此</text>

  <!-- ===== i-1 = 11 = 1011 ===== -->
  <text x="60" y="120" font-size="12.5" fill="#d6a040" font-weight="bold">i−1 = 11</text>
  <text x="60" y="138" font-size="10.5" fill="#888">借位翻转</text>
  <rect x="120" y="124" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="139" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="124" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="200" y="124" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="219" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="124" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="259" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="290" y="144" font-size="10.5" fill="#d6a040" font-weight="bold">最低设置位及以下全翻</text>

  <!-- AND bracket -->
  <text x="95" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">&amp;</text>
  <line x1="120" y1="162" x2="278" y2="162" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- ===== i & (i-1) = 8 = 1000 ===== -->
  <text x="60" y="190" font-size="12.5" fill="#4a7a3a" font-weight="bold">i&amp;(i−1)=8</text>
  <rect x="120" y="178" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="139" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="178" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="200" y="178" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="219" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="240" y="178" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="259" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="290" y="198" font-size="10.5" fill="#4a7a3a" font-weight="bold">最低设置位被抹掉，少了 1 个 1</text>

  <!-- arrow down -->
  <path d="M 139 210 Q 139 226 139 236" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== DP formula ===== -->
  <rect x="60" y="240" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">ans[i] = ans[i &amp; (i−1)] + 1</text>

  <text x="60" y="294" font-size="11.5" fill="#555">代入 i = 12：</text>
  <rect x="60" y="302" width="420" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">ans[12] = ans[8] + 1 = 1 + 1 = 2</text>

  <!-- bottom note -->
  <rect x="60" y="344" width="420" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="363" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">i&amp;(i−1) &lt; i，子问题更小，同样满足无后效性</text>
</svg>
