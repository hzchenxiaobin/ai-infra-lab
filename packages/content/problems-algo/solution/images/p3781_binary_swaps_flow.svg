<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="150" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：扫描 + 大根堆</text>

  <!-- 右上：不变量说明框 -->
  <g filter="url(#rough2)">
    <rect x="335" y="16" width="172" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="421" y="34" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">不变量（2.2 观察二）</text>
    <text x="421" y="50" text-anchor="middle" font-size="10.5" fill="#8a6d1f">堆内元素全部 ≤ i</text>
    <text x="421" y="66" text-anchor="middle" font-size="10.5" fill="#8a6d1f">⟹ 落点约束自动满足</text>
  </g>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="100" y="16" width="100" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="34" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">开始</text>
  </g>
  <path d="M 150 42 L 150 52" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="68" y="54" width="164" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="74" text-anchor="middle" font-size="11.5" fill="#33506b">ans ← 0，堆 H ← ∅，i ← 0</text>
  </g>
  <path d="M 150 86 L 150 96" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 i < n -->
  <g filter="url(#rough2)">
    <polygon points="150,96 218,122 150,148 82,122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="150" y="126" text-anchor="middle" font-size="12" fill="#2f5d24">i &lt; n ?</text>
  </g>
  <text x="228" y="116" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 218 122 L 320 122" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回与结束 -->
  <g filter="url(#rough2)">
    <rect x="322" y="106" width="110" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="377" y="126" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold">返回 ans</text>
  </g>
  <path d="M 377 138 L 377 150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="347" y="152" width="60" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="377" y="169" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">结束</text>
  </g>

  <text x="158" y="160" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 150 148 L 150 158" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 入堆 -->
  <g filter="url(#rough2)">
    <rect x="62" y="160" width="176" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="179" text-anchor="middle" font-size="11.5" fill="#33506b">nums[i] 压入堆 H</text>
  </g>
  <path d="M 150 190 L 150 200" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 s[i] -->
  <g filter="url(#rough2)">
    <polygon points="150,200 224,226 150,252 76,226" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="150" y="230" text-anchor="middle" font-size="12" fill="#2f5d24">s[i] == '1' ?</text>
  </g>

  <text x="158" y="264" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 150 252 L 150 264" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 弹堆顶 -->
  <g filter="url(#rough2)">
    <rect x="50" y="266" width="200" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="150" y="285" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold">ans += 堆顶，弹出</text>
  </g>

  <!-- 否：绕过弹堆顶 -->
  <text x="232" y="220" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 224 226 Q 300 226 300 296 Q 300 330 226 330" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i 自增 -->
  <path d="M 150 296 L 150 312" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="80" y="314" width="144" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="152" y="332" text-anchor="middle" font-size="11.5" fill="#33506b">i ← i + 1</text>
  </g>

  <!-- 循环回边 -->
  <path d="M 80 328 L 40 328 L 40 122 L 76 122" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text transform="rotate(-90 30 225)" x="30" y="225" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">循环</text>
</svg>
