<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心概念：稳定 = 左邻居严格高于 threshold</text>
  <text x="260" y="44" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">height = [10, 1, 10, 1, 10]，threshold = 3（示例 2）</text>

  <!-- 地面 -->
  <path d="M 58 240 L 400 240" stroke="#b8c2cc" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- threshold 虚线（高度 3 的水位线） -->
  <path d="M 58 216 L 400 216" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="404" y="220" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">threshold = 3</text>

  <!-- 山柱：绿色=高度过线，蓝色=稳定，灰色=不过线 -->
  <rect x="70" y="160" width="44" height="80" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="138" y="232" width="44" height="8" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="206" y="160" width="44" height="80" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="274" y="232" width="44" height="8" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="342" y="160" width="44" height="80" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 柱内高度标注 -->
  <text x="92" y="186" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="92" y="203" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">&gt; 3 ✓</text>
  <text x="228" y="186" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="228" y="203" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">&gt; 3 ✓</text>
  <text x="364" y="186" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="364" y="203" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">&gt; 3 ✓</text>
  <text x="160" y="229" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="296" y="229" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 顶部批注 -->
  <text x="92" y="116" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">自己再高也没用</text>
  <text x="364" y="150" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(右边没山)</text>

  <!-- 庇护箭头：过线的山 → 它右侧的山稳定 -->
  <path d="M 112 158 Q 140 130 156 224" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 248 158 Q 276 130 294 224" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="137" y="127" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">庇护→</text>
  <text x="273" y="127" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">庇护→</text>

  <!-- 下标 -->
  <text x="92" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="160" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="228" y="258" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="296" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="364" y="258" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 每座山的判定结果 -->
  <text x="92" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 无左邻居</text>
  <text x="160" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 稳定</text>
  <text x="228" y="276" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 左邻不过线</text>
  <text x="296" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 稳定</text>
  <text x="364" y="276" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 左邻不过线</text>

  <!-- 底部要点框 -->
  <rect x="55" y="300" width="410" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">反直觉：稳定与自己的高度无关，只由左邻居决定</text>
  <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">绿色高山（10 &gt; 3）庇护右邻 → 答案 = [1, 3]</text>
</svg>
