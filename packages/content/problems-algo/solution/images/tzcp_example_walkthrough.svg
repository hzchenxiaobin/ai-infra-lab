<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：转角 (3,2)，方向「竖直上 + 水平右」满臂延伸</text>

  <!-- ===== Left: 5x5 grid of example 1 ===== -->
  <!-- column index labels -->
  <text x="62" y="62" text-anchor="middle" font-size="9" fill="#aaa">c0</text>
  <text x="106" y="62" text-anchor="middle" font-size="9" fill="#aaa">c1</text>
  <text x="150" y="62" text-anchor="middle" font-size="9" fill="#aaa">c2</text>
  <text x="194" y="62" text-anchor="middle" font-size="9" fill="#aaa">c3</text>
  <text x="238" y="62" text-anchor="middle" font-size="9" fill="#aaa">c4</text>

  <g filter="url(#rough2)">
    <!-- row 0: 23 17 15 3 20 ; (0,2)=15 path -->
    <rect x="40" y="70" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="84" y="70" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="128" y="70" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="172" y="70" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="216" y="70" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <!-- row 1: 8 1 20 27 11 ; (1,2)=20 path -->
    <rect x="40" y="114" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="84" y="114" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="128" y="114" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="172" y="114" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="216" y="114" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <!-- row 2: 9 4 6 2 21 ; (2,2)=6 path -->
    <rect x="40" y="158" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="84" y="158" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="128" y="158" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="172" y="158" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="216" y="158" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <!-- row 3: 40 9 1 10 6 ; (3,2)=1 corner, (3,3)=10 path, (3,4)=6 path -->
    <rect x="40" y="202" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="84" y="202" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="128" y="202" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" rx="3"/>
    <rect x="172" y="202" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="216" y="202" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <!-- row 4: 22 7 4 5 3 -->
    <rect x="40" y="246" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="84" y="246" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="128" y="246" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="172" y="246" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="216" y="246" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
  </g>

  <!-- grid values -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="62" y="98">23</text><text x="106" y="98">17</text><text x="150" y="98" fill="#4a7a3a" font-weight="bold">15</text><text x="194" y="98">3</text><text x="238" y="98">20</text>
    <text x="62" y="142">8</text><text x="106" y="142">1</text><text x="150" y="142" fill="#4a7a3a" font-weight="bold">20</text><text x="194" y="142">27</text><text x="238" y="142">11</text>
    <text x="62" y="186">9</text><text x="106" y="186">4</text><text x="150" y="186" fill="#4a7a3a" font-weight="bold">6</text><text x="194" y="186">2</text><text x="238" y="186">21</text>
    <text x="62" y="230">40</text><text x="106" y="230">9</text><text x="150" y="230" fill="#b85450" font-weight="bold">1</text><text x="194" y="230" fill="#4a7a3a" font-weight="bold">10</text><text x="238" y="230" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="62" y="274">22</text><text x="106" y="274">7</text><text x="150" y="274">4</text><text x="194" y="274">5</text><text x="238" y="274">3</text>
  </g>

  <!-- row index labels -->
  <g font-size="9" fill="#aaa" text-anchor="end">
    <text x="36" y="98">r0</text><text x="36" y="142">r1</text><text x="36" y="186">r2</text><text x="36" y="230">r3</text><text x="36" y="274">r4</text>
  </g>

  <!-- L-arrow along path: (0,2)->(3,2)->(3,4) -->
  <path d="M 150 116 L 150 200 L 238 200" stroke="#4a7a3a" stroke-width="2.2" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- corner label -->
  <text x="150" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">转角 (3,2)=1（被两臂各算一次，结果减一份）</text>

  <!-- divider -->
  <path d="M 280 64 L 280 320" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: factor-count table for path cells ===== -->
  <text x="430" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">路径上每格的 v₂ / v₅</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="300" y="74" width="260" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
  </g>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="335" y="90">格子</text>
    <text x="405" y="90">值</text>
    <text x="465" y="90">v₂</text>
    <text x="525" y="90">v₅</text>
  </g>

  <!-- data rows -->
  <g filter="url(#rough2)">
    <rect x="300" y="100" width="260" height="22" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3"/>
    <rect x="300" y="124" width="260" height="22" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3"/>
    <rect x="300" y="148" width="260" height="22" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3"/>
    <rect x="300" y="172" width="260" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="300" y="196" width="260" height="22" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3"/>
    <rect x="300" y="220" width="260" height="22" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="335" y="115">(0,2)</text><text x="405" y="115">15</text><text x="465" y="115">0</text><text x="525" y="115">1</text>
    <text x="335" y="139">(1,2)</text><text x="405" y="139">20</text><text x="465" y="139">2</text><text x="525" y="139">1</text>
    <text x="335" y="163">(2,2)</text><text x="405" y="163">6</text><text x="465" y="163">1</text><text x="525" y="163">0</text>
    <text x="335" y="187" fill="#b85450" font-weight="bold">(3,2)转角</text><text x="405" y="187" fill="#b85450" font-weight="bold">1</text><text x="465" y="187" fill="#b85450" font-weight="bold">0</text><text x="525" y="187" fill="#b85450" font-weight="bold">0</text>
    <text x="335" y="211">(3,3)</text><text x="405" y="211">10</text><text x="465" y="211">1</text><text x="525" y="211">1</text>
    <text x="335" y="235">(3,4)</text><text x="405" y="235">6</text><text x="465" y="235">1</text><text x="525" y="235">0</text>
  </g>

  <!-- sum row -->
  <g filter="url(#rough2)">
    <rect x="300" y="248" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="11.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle">
    <text x="335" y="266">合计（转角计一次）</text>
    <text x="465" y="266">v₂ = 5</text>
    <text x="525" y="266">v₅ = 3</text>
  </g>

  <!-- result -->
  <g filter="url(#rough2)">
    <rect x="300" y="288" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="430" y="314" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">尾随零 = min(5, 3) = 3 ✓</text>

  <!-- bottom note -->
  <rect x="40" y="356" width="540" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="378" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为什么「满臂」就够？</text>
  <text x="310" y="396" text-anchor="middle" font-size="11" fill="#333">延伸一格加入 (Δv₂, Δv₅) ≥ 0，两分量皆不减 → min 单调不降</text>
  <text x="310" y="412" text-anchor="middle" font-size="11" fill="#333">故固定转角 + 方向后，把两臂延伸到矩阵边缘即为最优，无需枚举臂长</text>
</svg>
