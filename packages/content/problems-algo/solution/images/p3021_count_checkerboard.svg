<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">从判定到计数：n×m 棋盘里数出「一奇一偶」的格子</text>

  <!-- grid: n=3 columns, m=2 rows -->
  <text x="163" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x=1</text>
  <text x="209" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x=2</text>
  <text x="255" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x=3</text>
  <text x="116" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y=1</text>
  <text x="116" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y=2</text>

  <rect x="140" y="70" width="46" height="46" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="99" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <rect x="186" y="70" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="99" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3✓</text>
  <rect x="232" y="70" width="46" height="46" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="99" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>
  <rect x="140" y="116" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="145" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3✓</text>
  <rect x="186" y="116" width="46" height="46" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="145" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>
  <rect x="232" y="116" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="145" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5✓</text>

  <text x="209" y="194" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">n=3, m=2：绿格 = x+y 为奇 = Alice 赢</text>
  <text x="209" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（格子里标的是 x+y 的值，共 3 个绿格）</text>

  <!-- right panel: counting -->
  <rect x="300" y="64" width="190" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="395" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x ∈ [1,3]：奇数 2 个（1、3）</text>
  <text x="395" y="99" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶数 1 个（2）</text>
  <rect x="300" y="116" width="190" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="395" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">y ∈ [1,2]：奇数 1 个（1）</text>
  <text x="395" y="151" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶数 1 个（2）</text>
  <rect x="300" y="168" width="190" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="395" y="186" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">一奇一偶的组合数</text>
  <text x="395" y="205" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2×1 + 1×1 = 3</text>

  <!-- general formula -->
  <rect x="48" y="224" width="424" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">通式：(n+1)/2 × m/2 + n/2 × (m+1)/2</text>
  <text x="260" y="267" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（= x 奇×y 偶 + x 偶×y 奇；[1,k] 内奇数 (k+1)/2 个、偶数 k/2 个）</text>

  <!-- simplify -->
  <rect x="48" y="286" width="424" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="311" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">化简：ans = n·m / 2（整除）—— 棋盘染色，恰一半格子一奇一偶</text>

  <!-- overflow warning -->
  <rect x="48" y="334" width="424" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ n·m 最大 10¹⁰，超出 int32；C++ 要先转 long long 再乘</text>
</svg>
