<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：两类端点配对取 max</text>

  <text x="280" y="56" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1：colors = [1, 1, 1, 6, 1, 1, 1]</text>

  <path d="M 112 78 L 272 78" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="192" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 距离 = 3</text>

  <rect x="87" y="86" width="50" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="102" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">idx 0</text>
  <text x="112" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="143" y="86" width="50" height="46" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">idx 1</text>
  <text x="168" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="199" y="86" width="50" height="46" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">idx 2</text>
  <text x="224" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="255" y="86" width="50" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">idx 3</text>
  <text x="280" y="122" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="311" y="86" width="50" height="46" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">idx 4</text>
  <text x="336" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="367" y="86" width="50" height="46" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">idx 5</text>
  <text x="392" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="423" y="86" width="50" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">idx 6</text>
  <text x="448" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 280 140 L 440 140" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="360" y="154" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 距离 = 6−3 = 3</text>

  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = max(3, 3) = 3 ✓</text>

  <text x="280" y="208" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2：colors = [1, 8, 3, 8, 3]</text>

  <path d="M 168 230 L 384 230" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="276" y="224" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 距离 = 4</text>

  <rect x="143" y="238" width="50" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="254" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">idx 0</text>
  <text x="168" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="199" y="238" width="50" height="46" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="254" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">idx 1</text>
  <text x="224" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <rect x="255" y="238" width="50" height="46" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">idx 2</text>
  <text x="280" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <rect x="311" y="238" width="50" height="46" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="254" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">idx 3</text>
  <text x="336" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <rect x="367" y="238" width="50" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">idx 4</text>
  <text x="392" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 168 292 L 384 292" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="276" y="306" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 距离 = 4−0 = 4</text>

  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = max(4, 4) = 4 ✓</text>

  <rect x="40" y="350" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一次遍历同时算两类候选，取 max 即答案 · O(n) / O(1)</text>

  <rect x="40" y="396" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="407" font-size="10" fill="#666" filter="url(#rough2)">端点 0</text>
  <rect x="110" y="396" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="130" y="407" font-size="10" fill="#666" filter="url(#rough2)">异色房</text>
  <rect x="180" y="396" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="200" y="407" font-size="10" fill="#666" filter="url(#rough2)">端点 n−1</text>
</svg>
