<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：终态唯一 ⇒ 每个块的目标就是 s 的对应段</text>
  <text x="260" y="34" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">旋转不改多重集 ⇒ 非递减终态唯一 = sorted(nums)；第 i 块的目标被钉死为 s[i..i+k)</text>

  <!-- nums row -->
  <text x="138" y="77" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">nums（k=3 分块）</text>
  <g filter="url(#rough2)">
    <rect x="147" y="54" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="183" y="54" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="219" y="54" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="265" y="54" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="301" y="54" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="337" y="54" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="165" y="77" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
    <text x="201" y="77" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
    <text x="237" y="77" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>
    <text x="283" y="77" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5</text>
    <text x="319" y="77" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">6</text>
    <text x="355" y="77" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4</text>
  </g>
  <text x="201" y="104" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">块A</text>
  <text x="319" y="104" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">块B</text>

  <!-- rotation arrows -->
  <g filter="url(#rough2)">
    <path d="M 201 94 L 201 146" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <path d="M 319 94 L 319 146" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  </g>
  <text x="208" y="124" text-anchor="start" font-size="9.5" fill="#2a5a1e" filter="url(#rough2)">左移 1 次</text>
  <text x="326" y="124" text-anchor="start" font-size="9.5" fill="#2a5a1e" filter="url(#rough2)">右移 1 次</text>

  <!-- sorted row -->
  <text x="138" y="175" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">s = sorted(nums)</text>
  <g filter="url(#rough2)">
    <rect x="147" y="152" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="183" y="152" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="219" y="152" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="265" y="152" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="301" y="152" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="337" y="152" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="165" y="175" text-anchor="middle" font-size="12.5" fill="#2a5a1e" font-weight="bold">1</text>
    <text x="201" y="175" text-anchor="middle" font-size="12.5" fill="#2a5a1e" font-weight="bold">2</text>
    <text x="237" y="175" text-anchor="middle" font-size="12.5" fill="#2a5a1e" font-weight="bold">3</text>
    <text x="283" y="175" text-anchor="middle" font-size="12.5" fill="#2a5a1e" font-weight="bold">4</text>
    <text x="319" y="175" text-anchor="middle" font-size="12.5" fill="#2a5a1e" font-weight="bold">5</text>
    <text x="355" y="175" text-anchor="middle" font-size="12.5" fill="#2a5a1e" font-weight="bold">6</text>
  </g>
  <text x="260" y="204" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">块A 的目标 = s[0..3) = [1,2,3]，块B 的目标 = s[3..6) = [4,5,6]——不再模糊</text>

  <!-- block A doubled demo -->
  <text x="58" y="230" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">块A 拼两份 →</text>
  <g filter="url(#rough2)">
    <rect x="158" y="240" width="34" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="192" y="240" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="226" y="240" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="260" y="240" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="294" y="240" width="34" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="328" y="240" width="34" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="175" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="209" y="260" text-anchor="middle" font-size="12" fill="#2a5a1e" font-weight="bold">1</text>
    <text x="243" y="260" text-anchor="middle" font-size="12" fill="#2a5a1e" font-weight="bold">2</text>
    <text x="277" y="260" text-anchor="middle" font-size="12" fill="#2a5a1e" font-weight="bold">3</text>
    <text x="311" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <text x="345" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  </g>
  <text x="260" y="288" text-anchor="middle" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">目标 [1,2,3] 作为窗口出现 ⇒ 块A 可旋转 ✓</text>

  <!-- block B doubled demo -->
  <text x="58" y="314" text-anchor="start" font-size="10" fill="#8a6d1a" filter="url(#rough2)">块B 拼两份 →</text>
  <g filter="url(#rough2)">
    <rect x="158" y="324" width="34" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="192" y="324" width="34" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="226" y="324" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="260" y="324" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="294" y="324" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="328" y="324" width="34" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="175" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
    <text x="209" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
    <text x="243" y="344" text-anchor="middle" font-size="12" fill="#2a5a1e" font-weight="bold">4</text>
    <text x="277" y="344" text-anchor="middle" font-size="12" fill="#2a5a1e" font-weight="bold">5</text>
    <text x="311" y="344" text-anchor="middle" font-size="12" fill="#2a5a1e" font-weight="bold">6</text>
    <text x="345" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  </g>
  <text x="260" y="372" text-anchor="middle" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">目标 [4,5,6] 作为窗口出现 ⇒ 块B 可旋转 ✓</text>

  <!-- bottom box -->
  <rect x="36" y="384" width="448" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="10.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">判据：目标段是块的循环旋转 ⟺ 目标段出现在「块拼两份」的串中</text>
  <text x="260" y="416" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">本例两块全 ✓ ⇒ k=3 可排序（k=1 未有序 ✗、k=6 有 2 个降点 ✗，答案恰为 3）</text>
</svg>
