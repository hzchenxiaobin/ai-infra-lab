<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：字符串拼接法</text>

  <!-- Start -->
  <ellipse cx="260" cy="56" rx="56" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 n</text>

  <line x1="260" y1="76" x2="260" y2="92" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="190" y="96" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ans = []</text>

  <line x1="260" y1="126" x2="260" y2="142" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop decision -->
  <polygon points="260,146 360,180 260,214 160,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ≤ n ?</text>
  <text x="260" y="192" text-anchor="middle" font-size="9.5" fill="#888">i 从 1 起</text>

  <!-- No branch -> return -->
  <text x="378" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 360 180 Q 430 180 430 220" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="224" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="245" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- Yes branch -->
  <text x="142" y="176" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="160" y1="180" x2="120" y2="180" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="120" y1="180" x2="120" y2="232" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- s = "" -->
  <rect x="60" y="236" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="256" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">s = ""</text>

  <line x1="120" y1="266" x2="120" y2="280" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check 3 -->
  <polygon points="120,284 196,310 120,336 44,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="307" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i % 3 == 0 ?</text>
  <text x="120" y="321" text-anchor="middle" font-size="9" fill="#888">规则 1</text>

  <text x="208" y="308" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <path d="M 196 310 Q 226 310 226 322" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="226" y="326" width="104" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="343" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s += "Fizz"</text>

  <line x1="120" y1="336" x2="120" y2="352" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check 5 -->
  <polygon points="120,356 196,382 120,408 44,382" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="379" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i % 5 == 0 ?</text>
  <text x="120" y="393" text-anchor="middle" font-size="9" fill="#888">规则 2</text>

  <text x="208" y="380" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <path d="M 196 382 Q 226 382 226 370" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="226" y="356" width="104" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="373" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s += "Buzz"</text>

  <line x1="120" y1="408" x2="120" y2="422" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- combine: s empty ? -->
  <polygon points="120,426 210,446 120,466 30,446" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="442" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s == "" ?</text>
  <text x="120" y="456" text-anchor="middle" font-size="9" fill="#888">填回数字</text>

  <!-- right side combine outcome -->
  <path d="M 210 446 Q 280 446 280 410" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="316" y="386" width="128" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="380" y="404" text-anchor="middle" font-size="10.5" fill="#555">是 → s = str(i)</text>
  <text x="380" y="420" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans.append(s)</text>

  <!-- loop back arrow -->
  <path d="M 380 386 Q 380 160 360 180" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="300" font-size="9.5" fill="#888">i++</text>
  <text x="388" y="312" font-size="9.5" fill="#888">回循环</text>
</svg>
