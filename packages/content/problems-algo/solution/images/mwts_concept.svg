<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：右段对齐奖品 i，左段取 best[lo[i]]（右端点 &lt; lo[i] 的最大单段）</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">两段可假设不重叠——重叠部分已被右段覆盖，左段退到 lo[i] 之前总数不降</text>

  <!-- ===== Panel A: overlap ===== -->
  <text x="60" y="68" font-size="11" fill="#b85450" font-weight="bold">① 重叠解 [1,3]∪[3,5] = 7</text>
  <text x="60" y="82" font-size="9" fill="#888">左段溢入右段范围（位置 3 的 2 件被双重覆盖）</text>

  <!-- number line A at y=130 -->
  <line x1="60" y1="130" x2="360" y2="130" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- ticks -->
  <g stroke="#aaa" stroke-width="1" filter="url(#rough2)">
    <line x1="140" y1="126" x2="140" y2="134"/>
    <line x1="180" y1="126" x2="180" y2="134"/>
    <line x1="220" y1="126" x2="220" y2="134"/>
    <line x1="300" y1="126" x2="300" y2="134"/>
  </g>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="140" y="150">1</text>
    <text x="180" y="150">2</text>
    <text x="220" y="150">3</text>
    <text x="300" y="150">5</text>
  </g>

  <!-- blue band [1,3] x140..220 -->
  <rect x="140" y="104" width="80" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- orange band [3,5] x220..300 -->
  <rect x="220" y="104" width="80" height="32" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- prize dots: p1(140)x2 p2(180)x2 p3(220)x2 p5(300)x1 ; p3 in red (overlap) -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="120" r="4" fill="#446688"/>
    <circle cx="140" cy="110" r="4" fill="#446688"/>
    <circle cx="180" cy="120" r="4" fill="#446688"/>
    <circle cx="180" cy="110" r="4" fill="#446688"/>
    <circle cx="220" cy="120" r="4" fill="#b85450"/>
    <circle cx="220" cy="110" r="4" fill="#b85450"/>
    <circle cx="300" cy="120" r="4" fill="#d6a040"/>
  </g>

  <text x="180" y="98" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">左[1,3]=6</text>
  <text x="260" y="98" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">右[3,5]=3</text>
  <text x="340" y="120" font-size="10" fill="#b85450" font-weight="bold">∪=7</text>

  <!-- ===== exchange arrow ===== -->
  <path d="M 290 162 L 290 196" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="184" font-size="10" fill="#4a7a3a">交换：左段右端对齐到 index 3 (&lt; lo=4)</text>

  <!-- ===== Panel B: non-overlap ===== -->
  <text x="60" y="216" font-size="11" fill="#4a7a3a" font-weight="bold">② 不重叠解 [0,2]∪[3,5] = 7（同最优）</text>
  <text x="60" y="230" font-size="9" fill="#888">左段换成 best[lo[i]]：右端点 &lt; lo[i] 的最大单段，溢出部分无需重复计</text>

  <!-- number line B at y=280 -->
  <line x1="60" y1="280" x2="360" y2="280" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <g stroke="#aaa" stroke-width="1" filter="url(#rough2)">
    <line x1="140" y1="276" x2="140" y2="284"/>
    <line x1="180" y1="276" x2="180" y2="284"/>
    <line x1="220" y1="276" x2="220" y2="284"/>
    <line x1="300" y1="276" x2="300" y2="284"/>
  </g>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="140" y="300">1</text>
    <text x="180" y="300">2</text>
    <text x="220" y="300">3</text>
    <text x="300" y="300">5</text>
  </g>

  <!-- blue band [0,2] x100..180 -->
  <rect x="100" y="254" width="80" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- orange band [3,5] x220..300 -->
  <rect x="220" y="254" width="80" height="32" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="140" cy="270" r="4" fill="#446688"/>
    <circle cx="140" cy="260" r="4" fill="#446688"/>
    <circle cx="180" cy="270" r="4" fill="#446688"/>
    <circle cx="180" cy="260" r="4" fill="#446688"/>
    <circle cx="220" cy="270" r="4" fill="#d6a040"/>
    <circle cx="220" cy="260" r="4" fill="#d6a040"/>
    <circle cx="300" cy="270" r="4" fill="#d6a040"/>
  </g>

  <text x="140" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">左[0,2]=4</text>
  <text x="260" y="248" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">右[3,5]=3</text>
  <text x="340" y="270" font-size="10" fill="#4a7a3a" font-weight="bold">4+3=7</text>

  <!-- lo marker dashed -->
  <line x1="220" y1="254" x2="220" y2="234" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="220" y="230" text-anchor="middle" font-size="9" fill="#b85450">lo[i]=4</text>

  <!-- ===== bottom note ===== -->
  <rect x="30" y="316" width="520" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="338" font-size="11" fill="#333" font-weight="bold">结论：固定右段右端点为奖品 i，左段取 best[lo[i]] 即可，无需枚举左段位置。</text>
  <text x="50" y="356" font-size="10" fill="#555">best[l] = 右端点下标 &lt; l 的最大单段覆盖数（前缀最大值）；双指针求 lo[i]，单趟 O(n)。</text>
</svg>
