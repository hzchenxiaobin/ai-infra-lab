<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：解锁链复杂度严格递增，答案只有 0 或 (n−1)!</text>

  <!-- ============ 左：情形 A（唯一最小 → 星形解锁） ============ -->
  <g filter="url(#rough2)">
    <text x="132" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">情形 A：c[0] 严格唯一最小</text>

    <!-- 卫星机器（蓝） -->
    <rect x="28" y="64" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="52" y="82" text-anchor="middle" font-size="14" fill="#446688">1</text>
    <text x="52" y="97" text-anchor="middle" font-size="10" fill="#666">c=5</text>

    <rect x="192" y="64" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="216" y="82" text-anchor="middle" font-size="14" fill="#446688">2</text>
    <text x="216" y="97" text-anchor="middle" font-size="10" fill="#666">c=3</text>

    <rect x="12" y="126" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="36" y="144" text-anchor="middle" font-size="14" fill="#446688">3</text>
    <text x="36" y="159" text-anchor="middle" font-size="10" fill="#666">c=2</text>

    <rect x="208" y="126" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="232" y="144" text-anchor="middle" font-size="14" fill="#446688">4</text>
    <text x="232" y="159" text-anchor="middle" font-size="10" fill="#666">c=7</text>

    <rect x="106" y="192" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="130" y="210" text-anchor="middle" font-size="14" fill="#446688">5</text>
    <text x="130" y="225" text-anchor="middle" font-size="10" fill="#666">c=4</text>

    <!-- 中心根节点 0（绿，排第一） -->
    <rect x="104" y="116" width="52" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="130" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a">0</text>
    <text x="130" y="154" text-anchor="middle" font-size="10" fill="#666">c=1</text>

    <!-- 星形解锁箭头（红） -->
    <path d="M 113 124 L 74 92" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <path d="M 147 124 L 194 92" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <path d="M 104 140 L 63 144" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <path d="M 158 140 L 205 144" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <path d="M 130 164 L 130 190" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>

    <text x="132" y="240" text-anchor="middle" font-size="10.5" fill="#333">任何 i：0 &lt; i 且 c[0] &lt; c[i]，0 号机包办</text>

    <rect x="25" y="248" width="214" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="132" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">0 排第一，其余 (n−1)! 种随便排 ✓</text>
  </g>

  <!-- ============ 右：情形 B（存在 c[i] ≤ c[0] → 死锁） ============ -->
  <g filter="url(#rough2)">
    <text x="388" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">情形 B：存在 c[i] ≤ c[0]</text>

    <rect x="300" y="100" width="52" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="326" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a">0</text>
    <text x="326" y="138" text-anchor="middle" font-size="10" fill="#666">c=3</text>

    <rect x="408" y="96" width="52" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="434" y="117" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">1</text>
    <text x="434" y="134" text-anchor="middle" font-size="10" fill="#666">c=3</text>

    <rect x="408" y="176" width="52" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="434" y="197" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">2</text>
    <text x="434" y="214" text-anchor="middle" font-size="10" fill="#666">c=2</text>

    <!-- 失败的解锁尝试（虚线 + ✗） -->
    <path d="M 352 118 L 404 118" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
    <text x="378" y="110" text-anchor="middle" font-size="9.5" fill="#b85450">3 &lt; 3 ？✗</text>

    <path d="M 340 148 L 402 184" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
    <text x="362" y="176" text-anchor="middle" font-size="9.5" fill="#b85450">c &lt; 2 ？✗</text>

    <text x="330" y="240" text-anchor="middle" font-size="10.5" fill="#333">并列（1 号）或更小（2 号）的机器：没有更小复杂度可依</text>

    <rect x="280" y="248" width="214" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="387" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">锁死一台 ⇒ 无合法排列，答案 0 ✗</text>
  </g>

  <!-- ============ 底部：单调引理 ============ -->
  <g filter="url(#rough2)">
    <rect x="25" y="292" width="470" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07818">单调引理：解锁链从根 0 出发，每步复杂度严格递增</text>
    <text x="260" y="331" text-anchor="middle" font-size="10.5" fill="#333">任何被解锁机器的复杂度都严格大于 c[0]（证明甚至用不到编号约束 j &lt; i）</text>

    <ellipse cx="120" cy="350" rx="26" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="120" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a">c=1</text>
    <path d="M 148 350 L 178 350" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)"/>
    <ellipse cx="208" cy="350" rx="26" ry="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="208" y="354" text-anchor="middle" font-size="10" fill="#446688">c=4</text>
    <path d="M 236 350 L 266 350" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)"/>
    <ellipse cx="296" cy="350" rx="26" ry="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="296" y="354" text-anchor="middle" font-size="10" fill="#446688">c=9</text>
    <path d="M 324 350 L 354 350" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)"/>
    <text x="382" y="354" text-anchor="middle" font-size="12" fill="#666">…</text>
  </g>
</svg>
