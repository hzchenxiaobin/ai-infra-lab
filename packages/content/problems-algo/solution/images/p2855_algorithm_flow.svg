<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描数断点，再做环接检查</text>

  <!-- 开始 -->
  <rect x="245" y="32" width="70" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="51" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <line x1="280" y1="60" x2="280" y2="74" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 扫描 -->
  <rect x="110" y="78" width="340" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">一趟扫描 i = 1 … n−1</text>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">遇 nums[i] &lt; nums[i−1]：记录断点 brk = i</text>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">出现第二个断点 → 立即返回 −1</text>
  <line x1="280" y1="140" x2="280" y2="156" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：断点个数 -->
  <polygon points="280,160 388,206 280,252 172,206" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="211" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">断点个数？</text>

  <!-- 左分支：0 -->
  <line x1="172" y1="206" x2="124" y2="206" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="28" y="189" width="94" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="211" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">返回 0</text>
  <text x="75" y="240" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">已递增</text>

  <!-- 右分支：≥2 -->
  <line x1="388" y1="206" x2="436" y2="206" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="407" y="198" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">≥ 2</text>
  <rect x="440" y="189" width="94" height="34" rx="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="487" y="211" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 −1</text>
  <text x="487" y="240" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两处下降</text>

  <!-- 下分支：恰 1 个 -->
  <line x1="280" y1="252" x2="280" y2="270" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="266" font-size="11" fill="#4a7a3a" filter="url(#rough2)">恰 1 个</text>

  <!-- 菱形 2：环接检查 -->
  <polygon points="280,274 388,320 280,366 172,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">环接相容？</text>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">nums[n−1] &lt; nums[0] ?</text>

  <!-- 左分支：是 -->
  <line x1="172" y1="320" x2="124" y2="320" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="28" y="303" width="94" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="325" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">返回 n − brk</text>
  <text x="75" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">brk 为断点下标</text>

  <!-- 右分支：否 -->
  <line x1="388" y1="320" x2="436" y2="320" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="407" y="312" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="440" y="303" width="94" height="34" rx="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="487" y="325" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 −1</text>
  <text x="487" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">拼接后仍降</text>
</svg>
