<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 一维 DP 求最大和不下降子序列</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 270 76 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: Pair and sort -->
  <rect x="130" y="94" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">配对 (age[i], score[i]) 为球员列表</text>
  <text x="270" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">按 (age, score) 升序排序</text>

  <path d="M 270 138 L 270 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Init dp -->
  <rect x="160" y="156" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 dp[i] = score[i], ans = 0</text>

  <path d="M 270 190 L 270 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: more players? -->
  <polygon points="270,210 380,256 270,302 160,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有球员 i?</text>
  <text x="270" y="268" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(i 从 0 到 n−1)</text>

  <!-- No branch -> return -->
  <path d="M 380 256 L 440 256 L 440 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="248" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="378" y="320" width="124" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="341" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- Yes branch -> inner loop -->
  <path d="M 160 256 L 110 256 L 110 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="248" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Inner decision: j < i? -->
  <polygon points="110,316 200,356 110,396 20,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="353" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j &lt; i ?</text>
  <text x="110" y="368" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(j 从 0 起)</text>

  <!-- No: update ans, next i -->
  <path d="M 200 356 L 250 356 L 250 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="348" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="170" y="390" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = max(ans, dp[i])</text>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 处理下一个 i</text>

  <!-- Yes: check score[j] <= score[i] -->
  <path d="M 110 396 L 110 416" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="410" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <polygon points="110,418 210,448 110,478 10,448" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="445" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">score[j] ≤ score[i]?</text>

  <!-- Yes: update dp -->
  <path d="M 210 448 L 250 448 L 250 430" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="440" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- dp update box (floating right) -->
  <rect x="350" y="408" width="170" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="426" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[i] = max(dp[i],</text>
  <text x="435" y="442" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[j] + score[i])</text>
  <path d="M 250 430 L 350 430" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No: skip j -->
  <path d="M 110 478 L 110 488 L 10 488 L 10 356" stroke="#999" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="30" y="482" font-size="9" fill="#999" filter="url(#rough2)">跳过 j</text>

  <!-- Loop back: j++ -->
  <path d="M 10 356 L 10 316" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="-4" y="340" font-size="9" fill="#4a7a3a" filter="url(#rough2)">j++</text>

  <!-- Loop back: i++ from ans update -->
  <path d="M 390 412 L 440 412 L 440 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="340" font-size="9" fill="#4a7a3a" filter="url(#rough2)">i++</text>

  <!-- Legend -->
  <rect x="350" y="94" width="170" height="42" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="358" y="110" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">图例</text>
  <rect x="358" y="116" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="378" y="125" font-size="10" fill="#555" filter="url(#rough2)">处理动作</text>
  <polygon points="460,114 480,114 470,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="486" y="125" font-size="10" fill="#555" filter="url(#rough2)">判定分支</text>
</svg>
