<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：threshold 切一刀，轻边免费走、重边记账本</text>
  <text x="280" y="44" text-anchor="middle" font-size="11.5" fill="#888">示例 1 取 t = 4：w ≤ 4 的边全是轻边，w = 5 的 [0,1] 是重边</text>

  <!-- edges -->
  <!-- 1-2 light, w=3 (bystander) -->
  <path d="M 194 157 L 160 96" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="186" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <!-- 4-5 light, w=1 (bystander) -->
  <path d="M 320 184 L 292 250" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="302" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- path edges -->
  <!-- 0->1 heavy, w=5 -->
  <path d="M 100 170 L 180 170" fill="none" stroke="#b85450" stroke-width="2.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="158" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">5</text>
  <!-- 1->4 light, w=2 -->
  <path d="M 220 170 L 308 170" fill="none" stroke="#4a7a3a" stroke-width="2.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="264" y="158" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">2</text>
  <!-- 4->3 light, w=4 -->
  <path d="M 350 170 L 448 170" fill="none" stroke="#4a7a3a" stroke-width="2.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="399" y="158" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">4</text>

  <text x="280" y="120" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">路径 0→1→4→3：重边 1 条 + 轻边 2 条</text>

  <!-- nodes -->
  <circle cx="80" cy="170" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="200" cy="170" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="80" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="330" cy="170" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="468" cy="170" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="282" cy="264" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="80" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="200" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="150" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="330" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="468" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="282" y="269" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <text x="80" y="203" text-anchor="middle" font-size="10" fill="#a87020">source</text>
  <text x="468" y="203" text-anchor="middle" font-size="10" fill="#b85450">target</text>

  <!-- heavy-edge account book -->
  <rect x="95" y="292" width="370" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">重边账本：只记一条 [0→1]，1 ≤ k = 1 ✓ 有效路径</text>

  <!-- legend -->
  <path d="M 40 356 L 78 356" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="86" y="360" text-anchor="start" font-size="11" fill="#555">轻边 w ≤ t：代价 0</text>
  <path d="M 250 356 L 288 356" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="296" y="360" text-anchor="start" font-size="11" fill="#555">重边 w &gt; t：代价 1</text>

  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#8899aa">t=4 时 dist[3]=1 ≤ k ✓；t=3 时边 3-4 也转重，dist[3]=2 &gt; k ✗ ⇒ 答案 = 4</text>
</svg>
