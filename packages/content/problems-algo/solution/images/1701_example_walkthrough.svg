<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="290" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：customers = [[1,2],[2,5],[4,3]]
  </text>

  <!-- header row -->
  <rect x="30"  y="54" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53"  y="73" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">顾客</text>
  <rect x="76"  y="54" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="73" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">arrival</text>
  <rect x="134" y="54" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="73" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">time</text>
  <rect x="180" y="54" width="72" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="73" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">nf(前)</text>
  <rect x="252" y="54" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">start</text>
  <rect x="308" y="54" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="73" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">finish</text>
  <rect x="364" y="54" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="73" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">wait</text>
  <rect x="420" y="54" width="76" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="73" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">nf(后)</text>

  <!-- Row 0: a=1,t=2, nf前=0, start=1, finish=3, wait=2, nf后=3 -->
  <rect x="30"  y="92" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53"  y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="76"  y="92" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="92" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="180" y="92" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="112" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="252" y="92" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max(0,1)=1</text>
  <rect x="308" y="92" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="364" y="92" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="420" y="92" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- Row 1: a=2,t=5, nf前=3, start=3, finish=8, wait=6, nf后=8 -->
  <rect x="30"  y="124" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53"  y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="76"  y="124" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="134" y="124" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="180" y="124" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="252" y="124" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max(3,2)=3</text>
  <rect x="308" y="124" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="364" y="124" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <rect x="420" y="124" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">8</text>

  <!-- Row 2: a=4,t=3, nf前=8, start=8, finish=11, wait=7, nf后=11 -->
  <rect x="30"  y="156" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53"  y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="76"  y="156" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="134" y="156" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="180" y="156" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <rect x="252" y="156" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max(8,4)=8</text>
  <rect x="308" y="156" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <rect x="364" y="156" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>
  <rect x="420" y="156" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">11</text>

  <!-- sum row: total_wait -->
  <path d="M392,190 L392,206" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="300" y="210" width="190" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="395" y="230" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">total = 2+6+7 = 15</text>

  <!-- answer -->
  <rect x="300" y="246" width="190" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="395" y="268" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">avg = 15/3 = 5.0 ✓</text>

  <!-- side note -->
  <rect x="30" y="210" width="250" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="232" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    next_free 每步更新为 finish，
  </text>
  <text x="155" y="250" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    传递给下一位做 max；
  </text>
  <text x="155" y="268" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    顾客 2 提前到达 (a=4 &lt; nf=8)
  </text>
</svg>
