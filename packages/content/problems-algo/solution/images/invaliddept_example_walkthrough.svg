<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐行 LEFT JOIN，d.id IS NULL 者即答案</text>

  <!-- header row -->
  <rect x="30" y="48" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="65" font-size="10" fill="#446688" font-weight="bold">student.id</text>
  <text x="135" y="65" font-size="10" fill="#446688" font-weight="bold">name</text>
  <text x="215" y="65" font-size="10" fill="#446688" font-weight="bold">dept_id</text>
  <text x="335" y="65" font-size="10" fill="#446688" font-weight="bold">LEFT JOIN Departments</text>
  <text x="485" y="65" font-size="10" fill="#446688" font-weight="bold">输出?</text>
  <line x1="100" y1="48" x2="100" y2="74" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="180" y1="48" x2="180" y2="74" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="48" x2="270" y2="74" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="450" y1="48" x2="450" y2="74" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Alice -->
  <rect x="30" y="74" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">23</text>
  <text x="135" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Alice</text>
  <text x="215" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="285" y="92" font-size="10" fill="#4a7a3a">→ id=1 命中 ✓</text>
  <text x="485" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>
  <line x1="100" y1="74" x2="100" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="180" y1="74" x2="180" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="74" x2="270" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="450" y1="74" x2="450" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Bob -->
  <rect x="30" y="102" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">30</text>
  <text x="135" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Bob</text>
  <text x="215" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="285" y="120" font-size="10" fill="#4a7a3a">→ id=7 命中 ✓</text>
  <text x="485" y="120" text-anchor="middle" font-size="11" fill="#888">—</text>
  <line x1="100" y1="102" x2="100" y2="130" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="180" y1="102" x2="180" y2="130" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="102" x2="270" y2="130" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="450" y1="102" x2="450" y2="130" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Ann (invalid) -->
  <rect x="30" y="130" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">36</text>
  <text x="135" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Ann</text>
  <text x="215" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">13</text>
  <text x="285" y="148" font-size="10" fill="#b85450">→ 无 id=13，d.id = NULL</text>
  <text x="485" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓ 输出</text>
  <line x1="100" y1="130" x2="100" y2="158" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="180" y1="130" x2="180" y2="158" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="130" x2="270" y2="158" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="450" y1="130" x2="450" y2="158" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Peter -->
  <rect x="30" y="158" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">50</text>
  <text x="135" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Peter</text>
  <text x="215" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">15</text>
  <text x="285" y="176" font-size="10" fill="#4a7a3a">→ id=15 命中 ✓</text>
  <text x="485" y="176" text-anchor="middle" font-size="11" fill="#888">—</text>
  <line x1="100" y1="158" x2="100" y2="186" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="180" y1="158" x2="180" y2="186" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="158" x2="270" y2="186" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="450" y1="158" x2="450" y2="186" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- result -->
  <path d="M280 190 L280 206" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="170" y="210" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="227" font-size="10" fill="#b85450" font-weight="bold">id</text>
  <text x="300" y="227" font-size="10" fill="#b85450" font-weight="bold">name</text>
  <line x1="260" y1="210" x2="260" y2="236" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="170" y="236" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="253" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">36</text>
  <text x="300" y="253" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Ann</text>
  <line x1="260" y1="236" x2="260" y2="262" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- note -->
  <rect x="30" y="274" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="292" font-size="10" fill="#333">Departments.id = {1, 7, 15}。Alice/Bob/Peter 的 dept_id 都命中，d.id 非空被 WHERE 滤掉；</text>
  <text x="50" y="307" font-size="10" fill="#333">Ann 的 dept_id=13 找不到，d.id 为 NULL，<tspan fill="#b85450" font-weight="bold">WHERE d.id IS NULL</tspan> 保留 → 输出 Ann。</text>
</svg>
