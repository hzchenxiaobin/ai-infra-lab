<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">KMP 两件套：前缀函数 π ＋ 命中后回跳（允许重叠）</text>

  <!-- part 1: pi array -->
  <text x="60" y="58" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 对模式串 p = "ababc" 预处理 π：</text>
  <text x="112" y="86" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p[j]</text>
  <rect x="140" y="68" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="88" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="196" y="68" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="88" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="252" y="68" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="88" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="308" y="68" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="88" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="364" y="68" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="88" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">c</text>

  <text x="112" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">π[j]</text>
  <rect x="140" y="104" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="166" y="124" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="196" y="104" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="222" y="124" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="252" y="104" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="124" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="308" y="104" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="124" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="364" y="104" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="390" y="124" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <text x="432" y="124" font-size="10.5" fill="#888" filter="url(#rough2)">← π[3] = 2</text>

  <!-- part 2: meaning of pi -->
  <text x="60" y="172" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② π[3] = 2 的含义："abab" 的前缀 "ab" = 后缀 "ab"：</text>
  <text x="82" y="200" font-size="10" fill="#888" filter="url(#rough2)">前缀 →</text>
  <rect x="128" y="182" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="201" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="174" y="182" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="201" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="220" y="182" width="44" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="201" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">a</text>
  <rect x="264" y="182" width="44" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="201" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">b</text>

  <path d="M 150 216 C 180 236 260 236 286 216" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 286 216 C 260 236 180 236 150 216" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="360" y="238" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">蓝格(前2格)=白格尾2格</text>
  <text x="112" y="200" font-size="10" fill="#888" filter="url(#rough2)">j=3</text>

  <!-- part 3: overlap matching -->
  <text x="60" y="276" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 扫 s 时命中：记录起点 i−m+1，再 j = π[m−1] 继续找：</text>

  <text x="88" y="304" font-size="10" fill="#888" filter="url(#rough2)">s =</text>
  <rect x="112" y="288" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="134" y="307" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="156" y="288" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="307" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="200" y="288" width="44" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="222" y="307" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">a</text>
  <rect x="244" y="288" width="44" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="266" y="307" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">a</text>
  <text x="300" y="307" font-size="10.5" fill="#888" filter="url(#rough2)">p = "aa"，m = 2</text>

  <rect x="112" y="330" width="88" height="24" fill="none" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="156" y="347" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">命中 0</text>
  <rect x="156" y="330" width="88" height="24" fill="none" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="347" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">命中 1</text>
  <rect x="200" y="330" width="88" height="24" fill="none" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="244" y="347" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">命中 2</text>
  <text x="308" y="347" font-size="10" fill="#888" filter="url(#rough2)">← 框互相错 1 格：重叠出现也全找到</text>

  <rect x="48" y="364" width="424" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">命中后回跳 π[m−1] 而非清零，重叠匹配（如 "aa" 里的 "aa"）才不漏。</text>
</svg>
