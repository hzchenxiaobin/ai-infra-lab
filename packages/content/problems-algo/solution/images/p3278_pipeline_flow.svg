<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两条 GROUP BY 流水线 → 除法过滤 → 每项目 TOP-1</text>
  <text x="290" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">S 算「候选人-项目对」的共有技能数与分数；T 算每个项目的需求技能数</text>

  <rect x="36" y="50" width="286" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="179" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① S —— 打分流水线</text>
  <text x="179" y="88" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Candidates ⋈ Projects ON skill</text>
  <text x="179" y="102" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">GROUP BY (candidate_id, project_id)</text>
  <text x="179" y="118" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">产出 matched_skills、score = 100 + Σδ</text>

  <rect x="342" y="50" width="202" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="443" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② T —— 需求统计</text>
  <text x="443" y="88" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Projects</text>
  <text x="443" y="102" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">GROUP BY project_id</text>
  <text x="443" y="118" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">产出 required_skills</text>

  <path d="M 179 130 L 179 166" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 443 130 L 443 166" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="170" width="380" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ P —— 除法过滤</text>
  <text x="290" y="208" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">S JOIN T ON project_id</text>
  <text x="290" y="222" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">WHERE matched_skills = required_skills（技能全齐才留下）</text>

  <path d="M 290 236 L 290 256" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="260" width="380" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">④ R —— 每项目 TOP-1</text>
  <text x="290" y="298" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">RANK() OVER (PARTITION BY project_id</text>
  <text x="290" y="312" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">ORDER BY score DESC, candidate_id) AS rk，取 rk = 1</text>
  <text x="290" y="326" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">candidate_id 进 ORDER BY ⇒ 同分时更小 id 必排第一</text>

  <path d="M 290 332 L 290 352" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="356" width="380" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 输出 project_id, candidate_id, score</text>
  <text x="290" y="394" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">ORDER BY project_id；无人全齐的项目早被 INNER JOIN 淘汰</text>
</svg>
