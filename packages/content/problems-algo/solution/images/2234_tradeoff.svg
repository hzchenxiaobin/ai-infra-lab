<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">完善 vs 抬升：全完善未必最优</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">示例2：sorted [2,3,4,5]，target=5，full=2，partial=6，newFlowers=10</text>

  <!-- target line over both panels -->
  <path d="M40,118 L520,118" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="510" y="112" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold">target=5</text>

  <!-- ===== Left panel: complete all ===== -->
  <rect x="30" y="56" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">方案 A：全部完善</text>
  <text x="150" y="89" text-anchor="middle" font-size="9.5" fill="#4a7a3a">补齐 [2,3,4,5] → [5,5,5,5]</text>

  <!-- 4 bars scale 18px/unit baseline y=250 ; val5->90 target line y=250-90=160? recompute: use 18px/u, 5->90, baseline 250 => target y=160. But line above at 118. mismatch. Let me set baseline y=208 so target(5*18=90) at 118. baseline=208. -->
  <!-- bar val2->5 -->
  <rect x="52" y="172" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="52" y="118" width="40" height="54" fill="#b8dab0" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="72" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2→5</text>
  <!-- bar val3->5 -->
  <rect x="98" y="154" width="40" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="98" y="118" width="40" height="36" fill="#b8dab0" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="118" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">3→5</text>
  <!-- bar val4->5 -->
  <rect x="144" y="136" width="40" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="144" y="118" width="40" height="18" fill="#b8dab0" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="164" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">4→5</text>
  <!-- bar val5 already -->
  <rect x="190" y="118" width="40" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">5</text>
  <path d="M44,208 L236,208" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- cost / beauty -->
  <text x="150" y="232" text-anchor="middle" font-size="10" fill="#555">成本 = 3+2+1+0 = 6 ≤ 10</text>
  <rect x="60" y="244" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">美丽值 = 4·2 = 8</text>
  <text x="150" y="292" text-anchor="middle" font-size="9.5" fill="#888">完善数 4，无不完善 → 第二项 0</text>

  <!-- ===== Right panel: complete 3 + raise 1 ===== -->
  <rect x="290" y="56" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="74" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">方案 B：完善3 + 抬1个</text>
  <text x="410" y="89" text-anchor="middle" font-size="9.5" fill="#d6a040">完善 [3,4,5]，留 [2] 抬到 4</text>

  <!-- m line at val4 (y=208-72=136) over the single prefix bar -->
  <path d="M312,136 L352,136" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="332" y="132" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">m=4</text>

  <!-- prefix bar val2 -> raise to 4 (blue) -->
  <rect x="312" y="172" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="312" y="136" width="40" height="36" fill="#aecbe6" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="332" y="202" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">2→4</text>
  <!-- suffix bars complete to 5 -->
  <rect x="358" y="154" width="40" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="358" y="118" width="40" height="36" fill="#b8dab0" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="378" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">3→5</text>
  <rect x="404" y="136" width="40" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="404" y="118" width="40" height="18" fill="#b8dab0" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="424" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">4→5</text>
  <rect x="450" y="118" width="40" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">5</text>
  <path d="M304,208 L496,208" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>

  <text x="410" y="232" text-anchor="middle" font-size="10" fill="#555">成本 = (2+1+0) + 2 = 5 ≤ 10</text>
  <rect x="320" y="244" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">美丽值 = 3·2 + 4·6 = 30</text>
  <text x="410" y="292" text-anchor="middle" font-size="9.5" fill="#888">完善 3 个 + 不完善最小 4</text>

  <!-- vs arrow / conclusion -->
  <path d="M246,259 L314,259" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">却更大</text>

  <!-- bottom insight -->
  <rect x="60" y="312" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">拐点：partial·(target−1) 与 full 的相对大小</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#555">本题 6·4 = 24 &gt; full = 2，留一个不完善更划算</text>
</svg>
