<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">中心在原点的正方形 = 切比雪夫距离的等值线</text>

  <!-- 嵌套正方形 d=3 / d=2 / d=1 -->
  <rect x="84" y="119" width="162" height="162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="111" y="146" width="108" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="173" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <text x="250" y="114" font-size="12" fill="#d6a040" filter="url(#rough2)">d=3</text>
  <text x="223" y="141" font-size="12" fill="#4a7a3a" filter="url(#rough2)">d=2</text>
  <text x="196" y="168" font-size="12" fill="#446688" filter="url(#rough2)">d=1</text>

  <!-- 坐标轴 -->
  <line x1="55" y1="200" x2="285" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="165" y1="305" x2="165" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="205" font-size="12" fill="#666" filter="url(#rough2)">x</text>
  <text x="157" y="80" font-size="12" fill="#666" filter="url(#rough2)">y</text>
  <text x="154" y="216" font-size="11" fill="#666" filter="url(#rough2)">0</text>

  <!-- 点：a(2,2) 在 d=2 角上；b(-1,-2) 在 d=2 边上；c(-3,1) 在 d=3 边上；a(3,-3) 在 d=3 角上（红，冲突预告） -->
  <circle cx="219" cy="146" r="11" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="219" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a</text>
  <text x="232" y="141" font-size="10" fill="#446688" filter="url(#rough2)">(2,2)</text>

  <circle cx="138" cy="254" r="11" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <text x="100" y="272" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(-1,-2)</text>

  <circle cx="84" cy="173" r="11" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="84" y="177" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">c</text>
  <text x="42" y="162" font-size="10" fill="#d6a040" filter="url(#rough2)">(-3,1)</text>

  <circle cx="246" cy="281" r="11" fill="#ffffff" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="246" y="285" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="262" y="290" font-size="10" fill="#b85450" filter="url(#rough2)">(3,-3)</text>

  <!-- 右侧说明框 -->
  <rect x="315" y="100" width="188" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="409" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">点 (x, y) 在半边长 D</text>
  <text x="409" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">的正方形内</text>
  <text x="409" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇔ max(|x|,|y|) ≤ D</text>
  <text x="409" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">记 d = max(|x|,|y|)</text>
  <text x="409" y="224" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（切比雪夫距离）</text>
  <text x="409" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">同一 d 的点同层进场</text>

  <text x="260" y="338" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">D 增大 → 正方形均匀扩张，点按 d 一层一层被吞进</text>
</svg>
