<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">模拟视角：每步把数字往 0 推</text>

  <text x="30" y="78" font-size="12" fill="#4a7a3a" filter="url(#rough2)">num=14</text>

  <rect x="70" y="56" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">14</text>
  <text x="93" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">偶</text>
  <path d="M116,71 L142,71" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <text x="129" y="64" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">/2</text>

  <rect x="146" y="56" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="169" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">奇</text>
  <path d="M192,71 L218,71" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="205" y="64" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">-1</text>

  <rect x="222" y="56" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="245" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">偶</text>
  <path d="M268,71 L294,71" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <text x="281" y="64" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">/2</text>

  <rect x="298" y="56" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="321" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">奇</text>
  <path d="M344,71 L370,71" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="357" y="64" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">-1</text>

  <rect x="374" y="56" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="397" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">偶</text>

  <text x="440" y="60" font-size="11" fill="#888" filter="url(#rough2)">…继续…</text>
  <text x="440" y="78" font-size="11" fill="#888" filter="url(#rough2)">2→1→0</text>

  <rect x="40" y="124" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">偶数 ÷2（右移）；奇数 −1（清最低 1 位）</text>
  <text x="260" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">计数器累加直到 num = 0</text>

  <text x="260" y="198" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">位运算视角：拆成两类操作</text>

  <rect x="40" y="214" width="210" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="236" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">每个 1 位 → 1 次 −1</text>
  <text x="145" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14 = 1110₂，三个 1</text>
  <text x="145" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">贡献 3 次 subtract</text>
  <text x="145" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">= popcount(num)</text>

  <rect x="270" y="214" width="210" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">每位（除最低）→ 1 次 ÷2</text>
  <text x="375" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14 = 1110₂，4 位</text>
  <text x="375" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">贡献 4 − 1 = 3 次右移</text>
  <text x="375" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">= bitlen(num) − 1</text>

  <rect x="60" y="320" width="400" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">总步数 = popcount(num) + bitlen(num) − 1</text>
  <text x="260" y="358" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">14 → 3 + 4 − 1 = 6 步 ✓</text>
</svg>
