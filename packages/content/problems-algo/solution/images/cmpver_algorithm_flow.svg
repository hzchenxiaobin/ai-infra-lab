<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="510" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">比较版本号算法流程（切分 + 逐段比较）</text>

  <!-- Start -->
  <ellipse cx="270" cy="60" rx="50" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 270 80 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Split -->
  <rect x="120" y="94" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="119" text-anchor="middle" font-size="12" fill="#333">按 '.' 切分 v1, v2 → 数组 a, b</text>
  <path d="M 270 134 L 270 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i=0 -->
  <rect x="230" y="148" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="170" text-anchor="middle" font-size="12" fill="#333">i = 0</text>
  <path d="M 270 182 L 270 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond i < max? -->
  <polygon points="270,194 370,235 270,276 170,235" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="231" text-anchor="middle" font-size="12" fill="#333">i &lt; max(len(a),len(b))?</text>
  <text x="270" y="248" text-anchor="middle" font-size="11" fill="#666">(还有未比较的段)</text>

  <!-- No -> return 0 -->
  <path d="M 370 235 L 432 235" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="228" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="476" cy="235" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="476" y="239" text-anchor="middle" font-size="12" fill="#333">返回 0</text>

  <!-- Yes down -->
  <path d="M 270 276 L 270 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="284" font-size="11" fill="#82b366">是</text>

  <!-- get r1, r2 -->
  <rect x="100" y="290" width="340" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="11" fill="#333">r1 = (i &lt; len(a)) ? int(a[i]) : 0</text>
  <text x="270" y="328" text-anchor="middle" font-size="11" fill="#333">r2 = (i &lt; len(b)) ? int(b[i]) : 0</text>
  <path d="M 270 338 L 270 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond r1 vs r2 -->
  <polygon points="270,350 380,395 270,440 160,395" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="12" fill="#333">比较 r1 与 r2</text>
  <text x="270" y="409" text-anchor="middle" font-size="11" fill="#666">(作为整数)</text>

  <!-- r1 > r2 -> return 1 (left) -->
  <path d="M 160 395 L 108 395" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="134" y="388" text-anchor="middle" font-size="11" fill="#b85450">r1&gt;r2</text>
  <ellipse cx="60" cy="395" rx="48" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="399" text-anchor="middle" font-size="12" fill="#333">返回 1</text>

  <!-- r1 < r2 -> return -1 (right) -->
  <path d="M 380 395 L 432 395" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="388" text-anchor="middle" font-size="11" fill="#b85450">r1&lt;r2</text>
  <ellipse cx="478" cy="395" rx="52" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="399" text-anchor="middle" font-size="12" fill="#333">返回 -1</text>

  <!-- r1 == r2 -> i++ down -->
  <path d="M 270 440 L 270 454" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="450" font-size="11" fill="#82b366">r1==r2</text>
  <rect x="230" y="456" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="477" text-anchor="middle" font-size="12" fill="#333">i++</text>

  <!-- loop back to i<max diamond (enter from left) -->
  <path d="M 230 472 L 30 472 L 30 235 L 168 235" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="22" y="350" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 22 350)">i++ 后继续比较下一段</text>

  <!-- summary note -->
  <text x="270" y="502" text-anchor="middle" font-size="11" fill="#888">关键：转 int 比较自动忽略前导零；段数不等时缺省补 0</text>
</svg>
