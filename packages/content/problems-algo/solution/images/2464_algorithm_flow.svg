<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历，遇到 0 计数、遇到 1 推时间</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="50" rx="40" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#333">Start</text>
  <path d="M 280 63 L 280 72" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init box -->
  <rect x="206" y="74" width="148" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="12" fill="#333">zeros = 0, ans = 0</text>
  <path d="M 280 102 L 280 110" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: 还有字符? -->
  <polygon points="280,110 360,150 280,190 200,150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="12" fill="#333">还有字符 c?</text>

  <!-- no -> return (right) -->
  <path d="M 360 150 L 440 150" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="142" font-size="11" fill="#b85450" font-weight="bold">否(结束)</text>
  <rect x="440" y="136" width="104" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="492" y="154" text-anchor="middle" font-size="12" fill="#333">return ans</text>
  <path d="M 492 164 L 492 176" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="492" cy="190" rx="36" ry="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="492" y="194" text-anchor="middle" font-size="12" fill="#333">End</text>

  <!-- yes -> down to diamond1 -->
  <path d="M 280 190 L 280 204" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- diamond1: c=='0'? -->
  <polygon points="280,204 352,238 280,272 208,238" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="12" fill="#333">c == '0'?</text>

  <!-- yes -> left zeros++ -->
  <path d="M 208 238 L 188 238" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="230" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="66" y="224" width="122" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="127" y="242" text-anchor="middle" font-size="12" fill="#333">zeros += 1</text>

  <!-- no -> down to diamond2 -->
  <path d="M 280 272 L 280 286" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="282" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- diamond2: zeros>0? -->
  <polygon points="280,286 360,322 280,358 200,322" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333">zeros &gt; 0?</text>

  <!-- yes -> right ans box -->
  <path d="M 360 322 L 400 322" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="314" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="400" y="308" width="158" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="479" y="326" text-anchor="middle" font-size="11.5" fill="#333">ans = max(ans+1, zeros)</text>

  <!-- no -> down to merge (leading 1, do nothing) -->
  <path d="M 280 358 L 280 372" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="370" font-size="10.5" fill="#888">否(前导1)</text>

  <!-- merge connectors -->
  <path d="M 127 252 L 127 372 L 280 372" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 479 336 L 479 372 L 280 372" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- back arrow to loop diamond -->
  <path d="M 280 372 L 40 372 L 40 150 L 196 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="268" font-size="11" fill="#4a7a3a" font-weight="bold">回到循环</text>

  <!-- hint -->
  <rect x="40" y="400" width="480" height="20" fill="none" stroke="none"/>
  <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#888">注：zeros 是扫描到当前位置时左侧 0 的累计数；ans 即最后一个 1 的到达时间</text>
</svg>
