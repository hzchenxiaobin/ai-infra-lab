<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [1, 2, 3] → 一次洗牌得 [2, 3, 1]</text>

  <!-- 列标题 -->
  <text x="40" y="58" font-size="11" fill="#888" font-weight="bold">步骤</text>
  <text x="100" y="58" font-size="11" fill="#888" font-weight="bold">i</text>
  <text x="150" y="58" font-size="11" fill="#888" font-weight="bold">j(随机)</text>
  <text x="230" y="58" font-size="11" fill="#888" font-weight="bold">交换前 arr</text>
  <text x="430" y="58" font-size="11" fill="#888" font-weight="bold">交换后 arr（锁定区着色）</text>

  <!-- 步骤① i=2, j=0, [1,2,3] -> [3,2,1] -->
  <text x="40" y="108" font-size="12" fill="#555" font-weight="bold">①</text>
  <text x="100" y="108" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="150" y="108" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <!-- 交换前 -->
  <rect x="210" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="228" y="107" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <rect x="248" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="266" y="107" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <rect x="286" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="304" y="107" text-anchor="middle" font-size="11" fill="#446688">3</text>
  <!-- j=0 橙框 -->
  <rect x="208" y="86" width="40" height="32" fill="none" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <!-- i=2 红框 -->
  <rect x="284" y="86" width="40" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <!-- 箭头 -->
  <path d="M 340 102 L 392 102" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 交换后 -->
  <rect x="404" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="422" y="107" text-anchor="middle" font-size="11" fill="#446688">3</text>
  <rect x="442" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="460" y="107" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <rect x="480" y="88" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="498" y="107" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="528" y="107" font-size="10" fill="#4a7a3a" font-weight="bold">←锁定</text>

  <!-- 步骤② i=1, j=0, [3,2,1] -> [2,3,1] -->
  <text x="40" y="168" font-size="12" fill="#555" font-weight="bold">②</text>
  <text x="100" y="168" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="150" y="168" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <rect x="210" y="148" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="228" y="167" text-anchor="middle" font-size="11" fill="#446688">3</text>
  <rect x="248" y="148" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="266" y="167" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <rect x="286" y="148" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="304" y="167" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <rect x="208" y="146" width="40" height="32" fill="none" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <rect x="246" y="146" width="40" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <path d="M 340 162 L 392 162" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="404" y="148" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="422" y="167" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <rect x="442" y="148" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="460" y="167" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="480" y="148" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="498" y="167" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <text x="528" y="167" font-size="10" fill="#4a7a3a" font-weight="bold">←锁定</text>

  <!-- 步骤③ i=0, j=0, 不变 -->
  <text x="40" y="228" font-size="12" fill="#555" font-weight="bold">③</text>
  <text x="100" y="228" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="150" y="228" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <rect x="210" y="208" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="228" y="227" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <rect x="248" y="208" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="266" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <rect x="286" y="208" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="304" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <rect x="208" y="206" width="40" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="228" y="252" text-anchor="middle" font-size="9.5" fill="#888">j=i=0</text>
  <path d="M 340 222 L 392 222" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="404" y="208" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="422" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="442" y="208" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="460" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <rect x="480" y="208" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="498" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <text x="528" y="227" font-size="10" fill="#4a7a3a" font-weight="bold">←锁定</text>

  <!-- 结果行 -->
  <rect x="40" y="280" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="12.5" fill="#d6a040" font-weight="bold">最终结果：</text>
  <rect x="160" y="290" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="309" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="202" y="290" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="222" y="309" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="244" y="290" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="264" y="309" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="300" y="308" font-size="11" fill="#555">= [2, 3, 1]</text>

  <!-- 概率校验 -->
  <rect x="40" y="340" width="520" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="362" font-size="12" fill="#4a7a3a" font-weight="bold">概率校验</text>
  <text x="60" y="382" font-size="11.5" fill="#555">本次路径概率 = (1/3) × (1/2) × (1/1) = 1/6  ✓</text>
  <text x="60" y="402" font-size="11" fill="#555">每条不同路径 → 不同排列；3! = 6 条路径覆盖全部 6 种排列 → 每排列概率 1/6，严格均匀 ✅</text>
  <text x="60" y="418" font-size="10.5" fill="#888">关键：j ∈ [0, i] 含 i 自身；若误写 rand()%i，恒等排列 [1,2,3] 会被系统性排除</text>
</svg>
