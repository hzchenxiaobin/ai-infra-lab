<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[[0,1],[2,3],[4,5],[4,3]] → 2 条直线</text>

  <!-- ===== Left: plane ===== -->
  <rect x="20" y="40" width="230" height="210" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <path d="M 50 220 L 50 56" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 50 220 L 240 220" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="42" y="60" font-size="10" fill="#888">y</text>
  <text x="243" y="224" font-size="10" fill="#888">x</text>

  <!-- line1: y=x+1 through P0,P1,P2 (origin (70,220), scale 35) -->
  <!-- P0=(0,1)->(70,185) ; P1=(2,3)->(140,115) ; P2=(4,5)->(210,45) ; P3=(4,3)->(210,115) -->
  <path d="M 55 200 L 225 30" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="218" y="26" font-size="10" fill="#d6a040" font-weight="bold">L1: y=x+1</text>

  <!-- line2 through P3 alone (a short stub line, any direction) -->
  <path d="M 188 130 L 232 100" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="232" y="138" font-size="10" fill="#b85450" font-weight="bold">L2</text>

  <circle cx="70" cy="185" r="5.5" fill="#446688" stroke="#224" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="182" font-size="10" fill="#224" font-weight="bold">P0</text>
  <text x="54" y="194" font-size="8" fill="#888">(0,1)</text>

  <circle cx="140" cy="115" r="5.5" fill="#446688" stroke="#224" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="124" y="112" font-size="10" fill="#224" font-weight="bold">P1</text>
  <text x="124" y="124" font-size="8" fill="#888">(2,3)</text>

  <circle cx="210" cy="45" r="5.5" fill="#446688" stroke="#224" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="42" font-size="10" fill="#224" font-weight="bold">P2</text>
  <text x="194" y="54" font-size="8" fill="#888">(4,5)</text>

  <circle cx="210" cy="115" r="5.5" fill="#b85450" stroke="#7a2a26" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="112" font-size="10" fill="#7a2a26" font-weight="bold">P3</text>
  <text x="194" y="124" font-size="8" fill="#888">(4,3)</text>

  <!-- ===== Right: lineMask table ===== -->
  <rect x="265" y="40" width="280" height="170" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="405" y="58" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">预计算共线掩码（部分）</text>
  <!-- header -->
  <rect x="275" y="66" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="81" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">点对</text>
  <rect x="357" y="66" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="407" y="81" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">直线</text>
  <rect x="459" y="66" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="497" y="81" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">lineMask</text>
  <!-- rows -->
  <rect x="275" y="90" width="80" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="105" text-anchor="middle" font-size="10" fill="#333">(0,1)</text>
  <rect x="357" y="90" width="100" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="407" y="105" text-anchor="middle" font-size="10" fill="#333">y = x+1</text>
  <rect x="459" y="90" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="497" y="105" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0111=7</text>

  <rect x="275" y="114" width="80" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="129" text-anchor="middle" font-size="10" fill="#333">(0,3)</text>
  <rect x="357" y="114" width="100" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="407" y="129" text-anchor="middle" font-size="10" fill="#333">y=½x+1</text>
  <rect x="459" y="114" width="76" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="497" y="129" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1001=9</text>

  <rect x="275" y="138" width="80" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="153" text-anchor="middle" font-size="10" fill="#333">(1,3)</text>
  <rect x="357" y="138" width="100" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="407" y="153" text-anchor="middle" font-size="10" fill="#333">y = 3</text>
  <rect x="459" y="138" width="76" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="497" y="153" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1010=10</text>

  <rect x="275" y="162" width="80" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="177" text-anchor="middle" font-size="10" fill="#333">(2,3)</text>
  <rect x="357" y="162" width="100" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="407" y="177" text-anchor="middle" font-size="10" fill="#333">x = 4</text>
  <rect x="459" y="162" width="76" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="497" y="177" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1100=12</text>

  <text x="405" y="200" text-anchor="middle" font-size="10" fill="#888">叉积判共线：dx₁·dy₂ == dy₁·dx₂</text>

  <!-- ===== Bottom: DP progression ===== -->
  <rect x="20" y="232" width="525" height="180" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="282" y="250" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">DP 推进（full = 1111 = 15）</text>

  <!-- row 1 -->
  <rect x="32" y="260" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="92" y="277" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[0000]=0</text>
  <text x="160" y="277" font-size="10" fill="#666">i=0</text>
  <path d="M 188 273 L 210 273" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="214" y="260" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="294" y="277" text-anchor="middle" font-size="10" fill="#333">过(0,1): lm=0111</text>
  <path d="M 376 273 L 398 273" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="402" y="260" width="135" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="469" y="277" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[0111]=1</text>

  <!-- row 2 -->
  <rect x="32" y="294" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="92" y="311" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[1001]=1</text>
  <text x="160" y="311" font-size="10" fill="#666">i=1</text>
  <path d="M 188 307 L 210 307" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="214" y="294" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="294" y="311" text-anchor="middle" font-size="10" fill="#333">过(1,2): lm=0111</text>
  <path d="M 376 307 L 398 307" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="402" y="294" width="135" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="469" y="311" text-anchor="middle" font-size="10" fill="#333">dp[1111]=min(2,2)</text>

  <!-- row 3 -->
  <rect x="32" y="328" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="92" y="345" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[0111]=1</text>
  <text x="160" y="345" font-size="10" fill="#666">i=3</text>
  <path d="M 188 341 L 210 341" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="214" y="328" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="294" y="345" text-anchor="middle" font-size="10" fill="#333">单独盖 3</text>
  <path d="M 376 341 L 398 341" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="402" y="328" width="135" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="469" y="345" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[1111]=2 ⭐</text>

  <!-- answer -->
  <rect x="32" y="370" width="505" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="282" y="390" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案 dp[1111] = 2：L1 覆盖 {P0,P1,P2}，L2 覆盖 {P3}</text>
</svg>
