<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">转移条件与「最大合法 j」一箭双雕</text>

  <!-- 状态定义 -->
  <rect x="28" y="50" width="225" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[i]：前缀 i 的最大段数</text>
  <text x="140" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v[i]：此时末段和的最小值</text>
  <text x="140" y="118" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">末段越小，后面越容易接上 → 贪心留余地</text>

  <!-- 转移条件 -->
  <rect x="267" y="50" width="225" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="379" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">合法转移 j → i：</text>
  <text x="379" y="94" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">t[j] = P[j] + v[j] ≤ P[i]</text>
  <text x="379" y="118" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">⟺ 新段 (j, i] 的和 ≥ v[j]</text>

  <!-- 门槛轴 -->
  <text x="60" y="158" font-size="12" fill="#333" filter="url(#rough2)">把每个 j 看成一根「门槛」 t[j]（例：[4,3,2,6] 查 i=3，P[3]=9）：</text>

  <path d="M 60 242 L 470 242" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="468" y="260" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">t 值 →</text>

  <!-- 合法区底色 -->
  <rect x="62" y="182" width="206" height="60" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <rect x="268" y="182" width="202" height="60" fill="#fce4ec" opacity="0.5" filter="url(#rough2)"/>

  <!-- 门槛竖线 -->
  <path d="M 100 238 L 100 200" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j=0  t=0 ✓</text>

  <path d="M 205 238 L 205 196" fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="205" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j=1  t=8 ✓</text>
  <text x="205" y="170" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j* 最大合法</text>

  <path d="M 345 238 L 345 200" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="345" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j=2  t=14 ✗</text>

  <!-- P[i] 查询线 -->
  <path d="M 268 248 L 268 160" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="268" y="152" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">P[i] = 9</text>
  <text x="165" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">门槛 ≤ P[i]：合法（左边一串）</text>
  <text x="369" y="272" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">门槛 &gt; P[i]：接不上</text>

  <!-- 两个偏好 -->
  <rect x="28" y="288" width="225" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① j 越大 → dp[j] 越大</text>
  <text x="140" y="330" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（dp 单调不减：新元素并进末段）</text>
  <text x="140" y="350" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ dp[i] = dp[j]+1 段数最多</text>

  <rect x="267" y="288" width="225" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="379" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② j 越大 → P[j] 越大</text>
  <text x="379" y="330" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">（P 严格递增：nums[i] ≥ 1）</text>
  <text x="379" y="350" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ v[i] = P[i]−P[j] 末段最小</text>
</svg>
