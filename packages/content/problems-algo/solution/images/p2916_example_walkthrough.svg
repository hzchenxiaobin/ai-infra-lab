<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 2, 1]</text>

  <rect x="40" y="46" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r</text>
  <text x="88" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="120" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">p</text>
  <text x="180" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">更新区间</text>
  <text x="252" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">T</text>
  <text x="332" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Δ = 2T+len</text>
  <text x="420" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">S = ΣD²</text>
  <text x="478" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>

  <rect x="40" y="74" width="460" height="32" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="95" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="88" y="95" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="120" y="95" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="136" y="77" width="88" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[0,0]</text>
  <text x="252" y="95" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="332" y="95" text-anchor="middle" font-size="12" fill="#333">2·0+1 = 1</text>
  <text x="420" y="95" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="478" y="95" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="40" y="106" width="460" height="32" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="127" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="88" y="127" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="120" y="127" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="136" y="109" width="88" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[0,1]</text>
  <text x="252" y="127" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="332" y="127" text-anchor="middle" font-size="12" fill="#333">2·1+2 = 4</text>
  <text x="420" y="127" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="478" y="127" text-anchor="middle" font-size="12" fill="#333">6</text>

  <rect x="40" y="138" width="460" height="32" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="159" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="88" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="120" y="159" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="136" y="141" width="88" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[1,2]</text>
  <text x="252" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="332" y="159" text-anchor="middle" font-size="12" fill="#333">2·1+2 = 4</text>
  <text x="420" y="159" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="478" y="159" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">15</text>

  <text x="60" y="198" font-size="12" fill="#555" font-weight="bold">D 数组同步演化（下标 0 → 2）</text>

  <text x="62" y="234" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">r=0 后</text>
  <rect x="100" y="212" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="230" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="136" y="212" width="32" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="152" y="230" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <rect x="172" y="212" width="32" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="188" y="230" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="228" y="230" font-size="12" fill="#333">S = 1² = 1</text>

  <text x="400" y="249" text-anchor="middle" font-size="13" fill="#999">↓</text>

  <text x="62" y="272" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">r=1 后</text>
  <rect x="100" y="250" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="268" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="136" y="250" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="268" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="172" y="250" width="32" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="188" y="268" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="228" y="268" font-size="12" fill="#333">S = 2² + 1² = 5</text>

  <text x="400" y="287" text-anchor="middle" font-size="13" fill="#999">↓</text>

  <text x="62" y="310" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">r=2 后</text>
  <rect x="100" y="288" width="32" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="306" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="136" y="288" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="306" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="172" y="288" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="188" y="306" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="228" y="306" font-size="12" fill="#333">S = 2² + 2² + 1² = 9</text>

  <rect x="40" y="336" width="460" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="356" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终答案 = 1 + 5 + 9 = 15 ✓</text>
  <text x="270" y="376" text-anchor="middle" font-size="11" fill="#555">与示例 1 输出一致（ans 逐轮对 1e9+7 取模）</text>
</svg>
