<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐词定 k → 缩写 / 原词</text>

  <!-- table header -->
  <rect x="30" y="44" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">原词 (len)</text>
  <rect x="184" y="44" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">组内 LCP</text>
  <rect x="278" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k</text>
  <rect x="342" y="44" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">缩写</text>
  <rect x="446" y="44" width="104" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输出</text>

  <!-- rows -->
  <!-- like -->
  <text x="105" y="92" text-anchor="middle" font-size="12" fill="#555">like (4)</text>
  <text x="229" y="92" text-anchor="middle" font-size="11" fill="#888">—独组</text>
  <text x="308" y="92" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="392" y="92" text-anchor="middle" font-size="12" fill="#555">l2e (3)</text>
  <rect x="452" y="78" width="92" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">l2e</text>

  <!-- god -->
  <text x="105" y="122" text-anchor="middle" font-size="12" fill="#555">god (3)</text>
  <text x="229" y="122" text-anchor="middle" font-size="11" fill="#888">—独组</text>
  <text x="308" y="122" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="392" y="122" text-anchor="middle" font-size="12" fill="#b85450">g1d=3 ✗</text>
  <rect x="452" y="108" width="92" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="124" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">god</text>

  <!-- me -->
  <text x="105" y="152" text-anchor="middle" font-size="12" fill="#555">me (2)</text>
  <text x="229" y="152" text-anchor="middle" font-size="11" fill="#888">—独组</text>
  <text x="308" y="152" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="392" y="152" text-anchor="middle" font-size="12" fill="#b85450">m0e=3 ✗</text>
  <rect x="452" y="138" width="92" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="154" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">me</text>

  <!-- face -->
  <text x="105" y="182" text-anchor="middle" font-size="12" fill="#555">face (4)</text>
  <text x="229" y="182" text-anchor="middle" font-size="11" fill="#888">—独组</text>
  <text x="308" y="182" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="392" y="182" text-anchor="middle" font-size="12" fill="#555">f2e (3)</text>
  <rect x="452" y="168" width="92" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">f2e</text>

  <!-- internet -->
  <text x="105" y="212" text-anchor="middle" font-size="12" fill="#555">internet (8)</text>
  <text x="229" y="212" text-anchor="middle" font-size="11" fill="#888">—独组</text>
  <text x="308" y="212" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="392" y="212" text-anchor="middle" font-size="12" fill="#555">i6t (3)</text>
  <rect x="452" y="198" width="92" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i6t</text>

  <!-- internal -->
  <text x="105" y="242" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">internal (8)</text>
  <text x="229" y="242" text-anchor="middle" font-size="11" fill="#446688">inter,5</text>
  <text x="308" y="242" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="392" y="242" text-anchor="middle" font-size="12" fill="#b85450">intern1l=8 ✗</text>
  <rect x="452" y="228" width="92" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">internal</text>

  <!-- interval -->
  <text x="105" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">interval (8)</text>
  <text x="229" y="272" text-anchor="middle" font-size="11" fill="#446688">inter,5</text>
  <text x="308" y="272" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="392" y="272" text-anchor="middle" font-size="12" fill="#b85450">interv1l=8 ✗</text>
  <rect x="452" y="258" width="92" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">interval</text>

  <!-- intension -->
  <text x="105" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">intension (9)</text>
  <text x="229" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a">int,3</text>
  <text x="308" y="302" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="392" y="302" text-anchor="middle" font-size="12" fill="#555">inte4n (6)</text>
  <rect x="452" y="288" width="92" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">inte4n</text>

  <!-- intrusion -->
  <text x="105" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">intrusion (9)</text>
  <text x="229" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a">int,3</text>
  <text x="308" y="332" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="392" y="332" text-anchor="middle" font-size="12" fill="#555">intr4n (6)</text>
  <rect x="452" y="318" width="92" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">intr4n</text>

  <!-- legend -->
  <rect x="30" y="360" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="384" font-size="11" fill="#444">绿框 = 缩写比原词短，采用缩写；</text>
  <text x="280" y="384" font-size="11" fill="#444">红框 = 缩写长度 ≥ 原词，保留原词；</text>
  <text x="50" y="396" font-size="11" fill="#b85450">“intern1l” 长度 8 = 原词 8，不缩短 → 保留 “internal”</text>

  <!-- conflict-free check -->
  <rect x="30" y="412" width="520" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="435" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 9 个输出两两不同：缩写唯一性满足</text>
</svg>
