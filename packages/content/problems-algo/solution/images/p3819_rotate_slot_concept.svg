<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：负数是焊死的槽位，非负槽位连成虚拟链</text>
  <text x="260" y="35" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">轮替只作用在虚拟链上：循环左移 k 位 = 一次下标重映射 (i+k) mod m</text>

  <!-- Row 1: original array -->
  <text x="56" y="80" font-size="10.5" fill="#666" filter="url(#rough2)">原数组</text>
  <rect x="100" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="62" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">-2</text>
  <rect x="180" y="65" width="10" height="7" fill="#b85450" rx="1" filter="url(#rough2)"/>
  <path d="M 182.5 65 v -2.5 a 2.5 2.5 0 0 1 5 0 v 2.5" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="200" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="250" y="62" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">-4</text>
  <rect x="280" y="65" width="10" height="7" fill="#b85450" rx="1" filter="url(#rough2)"/>
  <path d="M 282.5 65 v -2.5 a 2.5 2.5 0 0 1 5 0 v 2.5" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="120" y="102" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="170" y="102" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="220" y="102" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="270" y="102" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">3</text>

  <text x="312" y="76" font-size="9" fill="#b85450" filter="url(#rough2)">负数槽位：焊死不动</text>
  <text x="312" y="89" font-size="8.5" fill="#b85450" filter="url(#rough2)">（值、位置都不变）</text>

  <!-- extraction arrows -->
  <path d="M 120 92 L 133 128" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 220 92 L 212 128" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="170" y="112" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">抽取非负值</text>

  <!-- Chain row A -->
  <text x="72" y="149" font-size="10" fill="#446688" filter="url(#rough2)">虚拟链</text>
  <rect x="115" y="132" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="150" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="175" y="132" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="150" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="245" y="141" font-size="9" fill="#446688" filter="url(#rough2)">m = 2 个非负元素</text>
  <text x="245" y="154" font-size="9" fill="#446688" filter="url(#rough2)">vals = [1, 3]</text>

  <!-- wrap-around rotation arc -->
  <path d="M 213 164 Q 175 190 139 164" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="175" y="196" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">循环左移 k = 3 mod 2 = 1 格</text>
  <text x="175" y="208" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3 移到链首，1 绕回链尾</text>

  <!-- Chain row B -->
  <text x="72" y="229" font-size="10" fill="#4a7a3a" filter="url(#rough2)">轮替后</text>
  <rect x="115" y="212" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="230" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="175" y="212" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="230" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- backfill arrows -->
  <path d="M 135 240 L 122 278" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 195 240 L 218 278" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="178" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">回填原槽位</text>

  <!-- Result row -->
  <text x="58" y="300" font-size="10.5" fill="#666" filter="url(#rough2)">结果</text>
  <rect x="100" y="282" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="301" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="150" y="282" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="301" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">-2</text>
  <rect x="180" y="285" width="10" height="7" fill="#b85450" rx="1" filter="url(#rough2)"/>
  <path d="M 182.5 285 v -2.5 a 2.5 2.5 0 0 1 5 0 v 2.5" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="200" y="282" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="301" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="250" y="282" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="301" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">-4</text>
  <rect x="280" y="285" width="10" height="7" fill="#b85450" rx="1" filter="url(#rough2)"/>
  <path d="M 282.5 285 v -2.5 a 2.5 2.5 0 0 1 5 0 v 2.5" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="120" y="322" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="170" y="322" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="220" y="322" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="270" y="322" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">3</text>

  <!-- Formula box -->
  <rect x="310" y="248" width="197" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="408" y="268" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">左轮替 = 下标重映射</text>
  <text x="408" y="286" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">nums[idx[i]] ← vals[(i+k) mod m]</text>
  <text x="408" y="303" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">示例1：下标0 ← vals[(0+1)%2] = 3</text>
  <text x="408" y="317" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">下标2 ← vals[(1+1)%2] = 1</text>
  <text x="408" y="337" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">负数下标不进 idx，天然不动</text>
</svg>
