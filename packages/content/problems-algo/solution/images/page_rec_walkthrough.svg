<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="490" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：好友关系 → 朋友页面 → 排除己有 → 推荐</text>

  <!-- ===== 左上：Friendship 表 ===== -->
  <text x="30" y="46" font-size="11" fill="#888">Friendship 表（标注含 user=1 的行）</text>
  <rect x="30" y="54" width="180" height="186" fill="white" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="30" y1="76" x2="210" y2="76" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="54" x2="120" y2="240" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="70" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">user1</text>
  <text x="165" y="70" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">user2</text>

  <!-- 含 user=1 的行高亮 -->
  <rect x="31" y="77" width="178" height="20" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="75" y="91" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="165" y="91" text-anchor="middle" font-size="10.5" fill="#446688">2</text>

  <rect x="31" y="97" width="178" height="20" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="75" y="111" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="165" y="111" text-anchor="middle" font-size="10.5" fill="#446688">3</text>

  <rect x="31" y="117" width="178" height="20" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="75" y="131" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="165" y="131" text-anchor="middle" font-size="10.5" fill="#446688">4</text>

  <!-- 不含 user=1 的行 -->
  <text x="75" y="151" text-anchor="middle" font-size="10.5" fill="#ccc">2</text>
  <text x="165" y="151" text-anchor="middle" font-size="10.5" fill="#ccc">3</text>
  <text x="75" y="171" text-anchor="middle" font-size="10.5" fill="#ccc">2</text>
  <text x="165" y="171" text-anchor="middle" font-size="10.5" fill="#ccc">4</text>
  <text x="75" y="191" text-anchor="middle" font-size="10.5" fill="#ccc">2</text>
  <text x="165" y="191" text-anchor="middle" font-size="10.5" fill="#ccc">5</text>
  <text x="75" y="211" text-anchor="middle" font-size="10.5" fill="#ccc">6</text>
  <text x="165" y="211" text-anchor="middle" font-size="10.5" fill="#ccc">7</text>

  <text x="120" y="232" text-anchor="middle" font-size="9" fill="#888">蓝行 = 含 user=1</text>

  <!-- ===== 左下：Likes 表 ===== -->
  <text x="30" y="262" font-size="11" fill="#888">Likes 表</text>
  <rect x="30" y="270" width="180" height="186" fill="white" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="30" y1="292" x2="210" y2="292" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="270" x2="120" y2="456" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="286" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">user_id</text>
  <text x="165" y="286" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">page_id</text>

  <!-- 朋友行（绿色） -->
  <rect x="31" y="293" width="178" height="20" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="75" y="307" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2</text>
  <text x="165" y="307" text-anchor="middle" font-size="10.5" fill="#4a7a3a">23</text>

  <rect x="31" y="313" width="178" height="20" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="75" y="327" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2</text>
  <text x="165" y="327" text-anchor="middle" font-size="10.5" fill="#4a7a3a">77</text>

  <rect x="31" y="333" width="178" height="20" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="75" y="347" text-anchor="middle" font-size="10.5" fill="#4a7a3a">3</text>
  <text x="165" y="347" text-anchor="middle" font-size="10.5" fill="#4a7a3a">24</text>

  <rect x="31" y="353" width="178" height="20" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="75" y="367" text-anchor="middle" font-size="10.5" fill="#4a7a3a">3</text>
  <text x="165" y="367" text-anchor="middle" font-size="10.5" fill="#4a7a3a">77</text>

  <rect x="31" y="373" width="178" height="20" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="75" y="387" text-anchor="middle" font-size="10.5" fill="#4a7a3a">4</text>
  <text x="165" y="387" text-anchor="middle" font-size="10.5" fill="#4a7a3a">77</text>

  <!-- 用户1行（红色高亮） -->
  <rect x="31" y="393" width="178" height="20" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="75" y="407" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="165" y="407" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">88</text>

  <!-- 不相关行 -->
  <text x="75" y="427" text-anchor="middle" font-size="10.5" fill="#ccc">5</text>
  <text x="165" y="427" text-anchor="middle" font-size="10.5" fill="#ccc">23</text>
  <text x="75" y="447" text-anchor="middle" font-size="10.5" fill="#ccc">6</text>
  <text x="165" y="447" text-anchor="middle" font-size="10.5" fill="#ccc">88</text>

  <!-- ===== 右侧：推导过程 ===== -->
  <text x="250" y="46" font-size="11" fill="#888">推导过程</text>

  <!-- 步骤① -->
  <rect x="260" y="54" width="350" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="274" y="72" font-size="11.5" fill="#446688" font-weight="bold">① 找朋友</text>
  <text x="274" y="89" font-size="10.5" fill="#555">user1=1 → {2, 3, 4}（3 行匹配）</text>
  <text x="274" y="104" font-size="10.5" fill="#4a7a3a" font-weight="bold">朋友集合 = {2, 3, 4}</text>

  <!-- 步骤② -->
  <rect x="260" y="120" width="350" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="274" y="138" font-size="11.5" fill="#4a7a3a" font-weight="bold">② JOIN Likes：朋友喜欢的页面</text>
  <text x="274" y="155" font-size="10.5" fill="#555">friend 2→{23,77}, 3→{24,77}, 4→{77}</text>
  <text x="274" y="170" font-size="10.5" fill="#d6a040" font-weight="bold">候选页面 = {23, 77, 24, 77}</text>

  <!-- 步骤③ -->
  <rect x="260" y="186" width="350" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="274" y="204" font-size="11.5" fill="#d6a040" font-weight="bold">③ 排除用户 1 已喜欢的</text>
  <text x="274" y="221" font-size="10.5" fill="#555">用户 1 喜欢 {88}，候选中无 88</text>
  <text x="274" y="236" font-size="10.5" fill="#b85450" font-weight="bold">过滤后 = {23, 77, 24, 77}</text>

  <!-- 步骤④ -->
  <rect x="260" y="252" width="350" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="274" y="270" font-size="11.5" fill="#b85450" font-weight="bold">④ DISTINCT 去重</text>
  <text x="274" y="287" font-size="10.5" fill="#555">77 出现 3 次（3 个朋友都喜欢）→ 去重 1 次</text>
  <text x="274" y="302" font-size="10.5" fill="#446688" font-weight="bold">推荐 = {23, 77, 24}</text>

  <!-- 连接线 -->
  <path d="M 212 88 Q 236 88 258 82" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 212 310 Q 236 200 258 148" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 212 407 Q 236 300 258 214" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== 底部：输出表 ===== -->
  <path d="M 320 314 L 320 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="346" font-size="11" fill="#888">输出（任意顺序）</text>
  <rect x="260" y="338" width="120" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <line x1="260" y1="362" x2="380" y2="362" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="355" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">page_id</text>
  <text x="320" y="378" text-anchor="middle" font-size="11" fill="#333">77</text>
  <text x="320" y="396" text-anchor="middle" font-size="11" fill="#333">23</text>
  <text x="320" y="414" text-anchor="middle" font-size="11" fill="#333">24</text>

  <!-- 底部提示 -->
  <rect x="40" y="438" width="560" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="456" font-size="10.5" fill="#555" font-weight="bold">💡 关键：好友双向需 UNION；朋友喜欢同一页面需 DISTINCT 去重</text>
  <text x="60" y="470" font-size="10" fill="#888">77 被三个朋友喜欢，去重后只推荐一次；用户 1 已喜欢的 88 不在候选中，但 NOT IN 确保正确性</text>
</svg>
