<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：s = "DID"</text>

  <!-- ===== Step 0: i=0, dp=[1] ===== -->
  <text x="35" y="62" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">i=0</text>
  <text x="35" y="78" font-size="10" fill="#888" filter="url(#rough2)">初始</text>
  <rect x="130" y="45" width="50" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="68" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="155" y="95" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>

  <!-- Transition 0→1: D, right to left -->
  <text x="280" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">s[0] = 'D'</text>
  <path d="M 340 108 L 220 108" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">后缀和 ←</text>

  <!-- ===== Step 1: i=1, D, dp=[1, 0] ===== -->
  <text x="35" y="152" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">i=1</text>
  <text x="35" y="168" font-size="10" fill="#888" filter="url(#rough2)">D</text>
  <rect x="130" y="135" width="50" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="195" y="135" width="50" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="155" y="185" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="220" y="185" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=1</text>

  <!-- Transition 1→2: I, left to right -->
  <text x="280" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s[1] = 'I'</text>
  <path d="M 220 198 L 340 198" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">前缀和 →</text>

  <!-- ===== Step 2: i=2, I, dp=[0, 1, 1] ===== -->
  <text x="35" y="242" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">i=2</text>
  <text x="35" y="258" font-size="10" fill="#888" filter="url(#rough2)">I</text>
  <rect x="130" y="225" width="50" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="248" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="195" y="225" width="50" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="248" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="260" y="225" width="50" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="248" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="155" y="275" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="220" y="275" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="285" y="275" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=2</text>

  <!-- Transition 2→3: D, right to left -->
  <text x="320" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">s[2] = 'D'</text>
  <path d="M 380 288 L 260 288" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="320" y="302" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">后缀和 ←</text>

  <!-- ===== Step 3: i=3, D, dp=[2, 2, 1, 0] ===== -->
  <text x="35" y="332" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">i=3</text>
  <text x="35" y="348" font-size="10" fill="#888" filter="url(#rough2)">D</text>
  <rect x="130" y="315" width="50" height="35" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="195" y="315" width="50" height="35" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="260" y="315" width="50" height="35" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="325" y="315" width="50" height="35" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="155" y="365" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="220" y="365" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="285" y="365" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=2</text>
  <text x="350" y="365" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=3</text>

  <!-- ===== Answer ===== -->
  <rect x="110" y="395" width="340" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = Σ dp[3][j]</text>
  <text x="280" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">= 2 + 2 + 1 + 0 = 5</text>
</svg>
