<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：head = [2, 5, 4, 7, 20, 5]</text>
  <text x="360" y="42" text-anchor="middle" font-size="10.5" fill="#888">每轮循环只处理一对；胜负即刻结算进计数器，全程一次遍历、绝不回头</text>

  <!-- ============ Table ============ -->
  <!-- header -->
  <rect x="48" y="76" width="480" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="86" y="96" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">队伍</text>
  <text x="176" y="96" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">节点对（下标）</text>
  <text x="288" y="96" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">值对比</text>
  <text x="398" y="96" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">本局赢家</text>
  <text x="468" y="96" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">even</text>
  <text x="508" y="96" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">odd</text>

  <!-- row 1 -->
  <rect x="48" y="108" width="480" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="135" text-anchor="middle" font-size="10.5" fill="#333">第 1 队</text>
  <text x="176" y="135" text-anchor="middle" font-size="10.5" fill="#333">(0, 1)</text>
  <text x="288" y="135" text-anchor="middle" font-size="10.5" fill="#333">2 vs 5</text>
  <text x="398" y="135" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">Odd 阵营</text>
  <text x="468" y="135" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <text x="508" y="135" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>

  <!-- row 2 -->
  <rect x="48" y="154" width="480" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="181" text-anchor="middle" font-size="10.5" fill="#333">第 2 队</text>
  <text x="176" y="181" text-anchor="middle" font-size="10.5" fill="#333">(2, 3)</text>
  <text x="288" y="181" text-anchor="middle" font-size="10.5" fill="#333">4 vs 7</text>
  <text x="398" y="181" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">Odd 阵营</text>
  <text x="468" y="181" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <text x="508" y="181" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>

  <!-- row 3 -->
  <rect x="48" y="200" width="480" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="227" text-anchor="middle" font-size="10.5" fill="#333">第 3 队</text>
  <text x="176" y="227" text-anchor="middle" font-size="10.5" fill="#333">(4, 5)</text>
  <text x="288" y="227" text-anchor="middle" font-size="10.5" fill="#333">20 vs 5</text>
  <text x="398" y="227" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">Even 阵营</text>
  <text x="468" y="227" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">1</text>
  <text x="508" y="227" text-anchor="middle" font-size="10.5" fill="#555">2</text>

  <!-- final row -->
  <rect x="48" y="246" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">终局</text>
  <text x="176" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a">三队打完</text>
  <text x="338" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">比分 even : odd = 1 : 2</text>
  <text x="468" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="508" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- column separators -->
  <path d="M 124 76 L 124 282" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 228 76 L 228 282" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 348 76 L 348 282" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 448 76 L 448 282" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 488 76 L 488 282" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ============ draw-example panel ============ -->
  <rect x="548" y="76" width="156" height="136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="626" y="96" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">平局怎么算？</text>
  <text x="626" y="114" text-anchor="middle" font-size="9.5" fill="#555">另例 [3, 3, 1, 2]：</text>
  <text x="626" y="132" text-anchor="middle" font-size="9.5" fill="#777">(3,3) 平局 → 不计分</text>
  <text x="626" y="150" text-anchor="middle" font-size="9.5" fill="#d6a040">(1,2) 奇位胜 → odd +1</text>
  <text x="626" y="168" text-anchor="middle" font-size="9.5" fill="#555">终局比分 0 : 1</text>
  <text x="626" y="190" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">→ 返回 "Odd"</text>

  <!-- arrow table -> result -->
  <path d="M 528 264 L 544 264" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="548" y="238" width="156" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="626" y="258" text-anchor="middle" font-size="10.5" fill="#8a6d1a">本例比分 1 : 2</text>
  <text x="626" y="280" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">返回 "Odd"</text>

  <!-- Takeaway -->
  <rect x="40" y="310" width="660" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="332" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">演算三步曲：取一对（head 与 head.next）→ 判胜负进计数器 → 循环尾一次比较定 Winner</text>
  <text x="370" y="352" text-anchor="middle" font-size="10" fill="#555">常见手误：写成 if / else 会把平局记给偶数队——必须 else if 三路互斥，平局谁也不加分</text>
  <text x="370" y="370" text-anchor="middle" font-size="10" fill="#555">守恒校验：n/2 轮打完，even + odd ≤ 轮数，缺口恰好等于平局轮数（本例 1+2=3，无平局）</text>
</svg>
