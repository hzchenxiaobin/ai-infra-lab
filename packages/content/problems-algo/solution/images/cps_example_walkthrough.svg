<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "103301"，逐中心下标 j 累加贡献</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">每行 = 累加前左侧区域 [0,j) 与右侧区域 [j+1,n) 的二元子序列数</text>

  <!-- Table outline -->
  <rect x="40" y="56" width="415" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- header text -->
  <text x="60"  y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j</text>
  <text x="100" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[j]</text>
  <text x="175" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">左区 [0,j)</text>
  <text x="285" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">右区 [j+1,n)</text>
  <text x="367" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">贡献</text>
  <text x="425" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- column separators -->
  <line x1="80"  y1="56" x2="80"  y2="184" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="56" x2="120" y2="184" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="230" y1="56" x2="230" y2="184" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="340" y1="56" x2="340" y2="184" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="395" y1="56" x2="395" y2="184" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row j=0 -->
  <text x="60"  y="97" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="100" y="97" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="175" y="97" text-anchor="middle" font-size="11" fill="#888">∅（无2子序列）</text>
  <text x="285" y="97" text-anchor="middle" font-size="11" fill="#333">03301</text>
  <text x="367" y="97" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="425" y="97" text-anchor="middle" font-size="11" fill="#333">0</text>
  <line x1="40" y1="104" x2="455" y2="104" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row j=1 -->
  <text x="60"  y="119" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="100" y="119" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="175" y="119" text-anchor="middle" font-size="11" fill="#888">1（仅1个元素）</text>
  <text x="285" y="119" text-anchor="middle" font-size="11" fill="#333">3301</text>
  <text x="367" y="119" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="425" y="119" text-anchor="middle" font-size="11" fill="#333">0</text>
  <line x1="40" y1="126" x2="455" y2="126" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row j=2 (highlight) -->
  <rect x="40" y="126" width="415" height="18" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="60"  y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="100" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="175" y="141" text-anchor="middle" font-size="11" fill="#333">10 →「1,0」×1</text>
  <text x="285" y="141" text-anchor="middle" font-size="11" fill="#333">301 →「0,1」×1</text>
  <text x="367" y="141" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="425" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <line x1="40" y1="148" x2="455" y2="148" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row j=3 (highlight) -->
  <rect x="40" y="148" width="415" height="18" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="60"  y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="100" y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="175" y="163" text-anchor="middle" font-size="11" fill="#333">103 →「1,0」×1</text>
  <text x="285" y="163" text-anchor="middle" font-size="11" fill="#333">01 →「0,1」×1</text>
  <text x="367" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="425" y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="40" y1="170" x2="455" y2="170" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row j=4 -->
  <text x="60"  y="181" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="100" y="181" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="175" y="181" text-anchor="middle" font-size="10" fill="#888">1033（无匹配右对）</text>
  <text x="285" y="181" text-anchor="middle" font-size="11" fill="#888">1（无2子序列）</text>
  <text x="367" y="181" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="425" y="181" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- table bottom border -->
  <line x1="40" y1="56" x2="40" y2="184" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="455" y1="56" x2="455" y2="184" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="40" y1="184" x2="455" y2="184" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Callout: explain the two contributing steps -->
  <rect x="40" y="202" width="415" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="55" y="222" font-size="11" fill="#333" font-weight="bold">两次贡献均来自中心 j = 2、3（中间字符 '3'）：</text>
  <text x="55" y="240" font-size="10.5" fill="#555">• j=2：左侧 [0,2)="10" 中「1,0」二元子序列 1 个 × 右侧 [3,6)="301" 中「0,1」1 个 = 1</text>
  <text x="55" y="256" font-size="10.5" fill="#555">• j=3：左侧 [0,3)="103" 中「1,0」1 个 × 右侧 [4,6)="01" 中「0,1」1 个 = 1</text>
  <text x="55" y="274" font-size="10.5" fill="#555">两次合成的回文都是 "1 0 3 0 1"（外对=1，内对=0，中心=3），</text>
  <text x="55" y="288" font-size="10.5" fill="#555">但下标组合不同 → 按位置各计 1 个，合计 2。</text>

  <!-- Footer -->
  <text x="270" y="318" text-anchor="middle" font-size="10.5" fill="#888">left2[a][b]：左侧「先 a 后 b」二元子序列数；right2[b][a]：右侧「先 b 后 a」二元子序列数</text>
  <text x="270" y="336" text-anchor="middle" font-size="10" fill="#aaa">贡献 = Σ_{a,b} left2[a][b]·right2[b][a]，左侧 "ab" 与右侧 "ba" 互为镜像配对</text>
  <text x="270" y="354" text-anchor="middle" font-size="10" fill="#aaa">→ 任何 (a,b) 对，左选法数 × 右选法数 即得以 j 为中心、外=a 内=b 的回文数</text>
</svg>
