<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="540" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums=[1,2,1,2,1,3,3], k=2</text>
  <text x="380" y="46" text-anchor="middle" font-size="11" fill="#888">dp[i]=前 i 个元素切成若干子数组的最小代价；末步 i=7 详细展开 j 扫描</text>

  <!-- dp table header -->
  <text x="40" y="78" font-size="11" fill="#446688" font-weight="bold">dp 表（逐列递推）：</text>
  <g font-size="11">
    <rect x="40" y="86" width="78" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="79" y="105" text-anchor="middle" fill="#333">i</text>
    <rect x="120" y="86" width="68" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="154" y="105" text-anchor="middle" fill="#333">0</text>
    <rect x="190" y="86" width="68" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="224" y="105" text-anchor="middle" fill="#333">1</text>
    <rect x="260" y="86" width="68" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="294" y="105" text-anchor="middle" fill="#333">2</text>
    <rect x="330" y="86" width="68" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="364" y="105" text-anchor="middle" fill="#333">3</text>
    <rect x="400" y="86" width="68" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="434" y="105" text-anchor="middle" fill="#333">4</text>
    <rect x="470" y="86" width="68" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="504" y="105" text-anchor="middle" fill="#333">5</text>
    <rect x="540" y="86" width="68" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="574" y="105" text-anchor="middle" fill="#333">6</text>
    <rect x="610" y="86" width="108" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="664" y="105" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>

    <rect x="40" y="116" width="78" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="79" y="135" text-anchor="middle" fill="#333">dp[i]</text>
    <rect x="120" y="116" width="68" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="154" y="135" text-anchor="middle" fill="#333">0</text>
    <rect x="190" y="116" width="68" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="224" y="135" text-anchor="middle" fill="#333">2</text>
    <rect x="260" y="116" width="68" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="294" y="135" text-anchor="middle" fill="#333">2</text>
    <rect x="330" y="116" width="68" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="364" y="135" text-anchor="middle" fill="#333">4</text>
    <rect x="400" y="116" width="68" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="434" y="135" text-anchor="middle" fill="#333">4</text>
    <rect x="470" y="116" width="68" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="504" y="135" text-anchor="middle" fill="#333">6</text>
    <rect x="540" y="116" width="68" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="574" y="135" text-anchor="middle" fill="#333">6</text>
    <rect x="610" y="116" width="108" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="664" y="135" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
  </g>

  <!-- detailed j-scan for i=7 -->
  <text x="40" y="170" font-size="11" fill="#b85450" font-weight="bold">末步 i=7：j 从 6 ↓ 0，向左扩展窗口 [j..6]，增量维护 trimmed：</text>

  <g font-size="10" font-weight="bold">
    <rect x="40" y="182" width="50" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="65" y="200" text-anchor="middle" fill="#333">j</text>
    <rect x="92" y="182" width="200" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="192" y="200" text-anchor="middle" fill="#333">加入 nums[j] 后窗口</text>
    <rect x="294" y="182" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="349" y="200" text-anchor="middle" fill="#333">频次变化（c→c+1）</text>
    <rect x="406" y="182" width="60" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="436" y="200" text-anchor="middle" fill="#333">trimmed</text>
    <rect x="468" y="182" width="90" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="513" y="200" text-anchor="middle" fill="#333">dp[j]</text>
    <rect x="560" y="182" width="158" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="639" y="200" text-anchor="middle" fill="#333">候选 dp[j]+k+trimmed</text>
  </g>

  <g font-size="10">
    <!-- j=6 -->
    <rect x="40" y="210" width="50" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="65" y="226" text-anchor="middle" fill="#333">6</text>
    <rect x="92" y="210" width="200" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="192" y="226" text-anchor="middle" fill="#333">[3]</text>
    <rect x="294" y="210" width="110" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="349" y="226" text-anchor="middle" fill="#888">3: 0→1（+0）</text>
    <rect x="406" y="210" width="60" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="436" y="226" text-anchor="middle" fill="#333">0</text>
    <rect x="468" y="210" width="90" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="513" y="226" text-anchor="middle" fill="#333">6</text>
    <rect x="560" y="210" width="158" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="639" y="226" text-anchor="middle" fill="#333" font-weight="bold">6+2+0 = 8 ✓</text>

    <!-- j=5 -->
    <rect x="40" y="236" width="50" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="65" y="252" text-anchor="middle" fill="#333">5</text>
    <rect x="92" y="236" width="200" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="192" y="252" text-anchor="middle" fill="#333">[3,3]</text>
    <rect x="294" y="236" width="110" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="349" y="252" text-anchor="middle" fill="#888">3: 1→2（+2）</text>
    <rect x="406" y="236" width="60" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="436" y="252" text-anchor="middle" fill="#333">2</text>
    <rect x="468" y="236" width="90" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="513" y="252" text-anchor="middle" fill="#333">6</text>
    <rect x="560" y="236" width="158" height="24" rx="3" fill="#fafafa" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="639" y="252" text-anchor="middle" fill="#888">6+2+2 = 10</text>

    <!-- j=4 -->
    <rect x="40" y="262" width="50" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="65" y="278" text-anchor="middle" fill="#333">4</text>
    <rect x="92" y="262" width="200" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="192" y="278" text-anchor="middle" fill="#333">[1,3,3]</text>
    <rect x="294" y="262" width="110" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="349" y="278" text-anchor="middle" fill="#888">1: 0→1（+0）</text>
    <rect x="406" y="262" width="60" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="436" y="278" text-anchor="middle" fill="#333">2</text>
    <rect x="468" y="262" width="90" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="513" y="278" text-anchor="middle" fill="#333">4</text>
    <rect x="560" y="262" width="158" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="639" y="278" text-anchor="middle" fill="#333" font-weight="bold">4+2+2 = 8 ✓</text>

    <!-- j=3 -->
    <rect x="40" y="288" width="50" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="65" y="304" text-anchor="middle" fill="#333">3</text>
    <rect x="92" y="288" width="200" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="192" y="304" text-anchor="middle" fill="#333">[2,1,3,3]</text>
    <rect x="294" y="288" width="110" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="349" y="304" text-anchor="middle" fill="#888">2: 0→1（+0）</text>
    <rect x="406" y="288" width="60" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="436" y="304" text-anchor="middle" fill="#333">2</text>
    <rect x="468" y="288" width="90" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="513" y="304" text-anchor="middle" fill="#333">4</text>
    <rect x="560" y="288" width="158" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="639" y="304" text-anchor="middle" fill="#333" font-weight="bold">4+2+2 = 8 ✓</text>

    <!-- j=2 highlighted: the example's split -->
    <rect x="40" y="314" width="50" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="65" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="92" y="314" width="200" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="192" y="330" text-anchor="middle" fill="#333" font-weight="bold">[1,2,1,3,3]</text>
    <rect x="294" y="314" width="110" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="349" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">1: 1→2（+2）</text>
    <rect x="406" y="314" width="60" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="436" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="468" y="314" width="90" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="513" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="560" y="314" width="158" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="639" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">2+2+4 = 8 ✓</text>

    <!-- j=1 -->
    <rect x="40" y="340" width="50" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="65" y="356" text-anchor="middle" fill="#333">1</text>
    <rect x="92" y="340" width="200" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="192" y="356" text-anchor="middle" fill="#333">[2,1,2,1,3,3]</text>
    <rect x="294" y="340" width="110" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="349" y="356" text-anchor="middle" fill="#888">2: 1→2（+2）</text>
    <rect x="406" y="340" width="60" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="436" y="356" text-anchor="middle" fill="#333">6</text>
    <rect x="468" y="340" width="90" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="513" y="356" text-anchor="middle" fill="#333">2</text>
    <rect x="560" y="340" width="158" height="24" rx="3" fill="#fafafa" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="639" y="356" text-anchor="middle" fill="#888">2+2+6 = 10</text>

    <!-- j=0 -->
    <rect x="40" y="366" width="50" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="65" y="382" text-anchor="middle" fill="#333">0</text>
    <rect x="92" y="366" width="200" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="192" y="382" text-anchor="middle" fill="#333">[1,2,1,2,1,3,3]</text>
    <rect x="294" y="366" width="110" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="349" y="382" text-anchor="middle" fill="#888">1: 2→3（+1）</text>
    <rect x="406" y="366" width="60" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="436" y="382" text-anchor="middle" fill="#333">7</text>
    <rect x="468" y="366" width="90" height="24" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="513" y="382" text-anchor="middle" fill="#333">0</text>
    <rect x="560" y="366" width="158" height="24" rx="3" fill="#fafafa" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="639" y="382" text-anchor="middle" fill="#888">0+2+7 = 9</text>
  </g>

  <!-- answer / optimal split -->
  <rect x="40" y="402" width="678" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="424" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">min = 8（j=2 命中）→ dp[7]=8，对应切分 [1,2] | [1,2,1,3,3]</text>

  <!-- optimal split cost breakdown -->
  <rect x="40" y="448" width="678" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="470" font-size="11" fill="#444" font-weight="bold">为何 j=2 最优？子数组 [1,2,1,3,3]：1 出现 2 次、3 出现 2 次、2 仅 1 次被删</text>
  <text x="60" y="488" font-size="11" fill="#555">　→ trimmed.length=4，importance = k+4 = 2+4 = 6；前面 dp[2]=2（[1,2] 无重复，importance=2）</text>
  <text x="60" y="506" font-size="11" fill="#555">　→ 总代价 dp[2] + 6 = 2 + 6 = 8。j 越左窗口越长、trimmed 越大，子数组代价上升抵消了"少切几刀"的收益。</text>
  <text x="60" y="520" font-size="10" fill="#888">关键：每个切分点贡献固定 k，trimmed 随窗口内重复元素累计——把窗口切短往往更省。</text>
</svg>
