<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐买家判定「有 S8 且无 iPhone」</text>

  <!-- Joined table header -->
  <text x="40" y="56" font-size="11.5" fill="#888">① Sales JOIN Product 后的行（只看 buyer_id 与 product_name）</text>
  <rect x="40" y="64" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">buyer_id</text>
  <text x="380" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">product_name</text>
  <text x="150" y="97" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="380" y="97" text-anchor="middle" font-size="12" fill="#333">S8</text>

  <rect x="40" y="106" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="122" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="380" y="122" text-anchor="middle" font-size="12" fill="#333">G4</text>

  <rect x="40" y="148" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="164" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="380" y="164" text-anchor="middle" font-size="12" fill="#333">S8</text>

  <rect x="40" y="190" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="206" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="380" y="206" text-anchor="middle" font-size="12" fill="#333">iPhone</text>

  <path d="M 300 234 L 300 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="249" font-size="10" fill="#888">GROUP BY buyer_id</text>

  <!-- Per-buyer analysis -->
  <text x="40" y="268" font-size="11.5" fill="#888">② 每组用 SUM(CASE…) 算出 hasS8 / hasIPhone 两个计数</text>

  <!-- Buyer 1 -->
  <rect x="40" y="276" width="520" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="296" font-size="11.5" fill="#4a7a3a" font-weight="bold">buyer 1：[S8]</text>
  <text x="60" y="314" font-size="11" fill="#555">hasS8 = 1 &gt; 0 ✓    hasIPhone = 0 = 0 ✓    → 两个条件都满足，保留</text>
  <text x="510" y="306" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓ 保留</text>

  <!-- Buyer 2 -->
  <rect x="40" y="340" width="520" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="360" font-size="11.5" fill="#888" font-weight="bold">buyer 2：[G4]</text>
  <text x="60" y="378" font-size="11" fill="#888">hasS8 = 0 ✗（没买 S8）   hasIPhone = 0 ✓    → hasS8&gt;0 不满足，丢弃</text>
  <text x="510" y="370" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗ 丢弃</text>

  <!-- Buyer 3 -->
  <rect x="40" y="404" width="520" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="424" font-size="11.5" fill="#888" font-weight="bold">buyer 3：[S8, iPhone]</text>
  <text x="60" y="442" font-size="11" fill="#888">hasS8 = 1 &gt; 0 ✓    hasIPhone = 1 ≠ 0 ✗（买过 iPhone） → hasIPhone=0 不满足，丢弃</text>
  <text x="510" y="434" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗ 丢弃</text>

  <path d="M 300 462 L 300 482" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="40" y="486" width="520" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="512" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最终结果：buyer_id = 1</text>
</svg>
