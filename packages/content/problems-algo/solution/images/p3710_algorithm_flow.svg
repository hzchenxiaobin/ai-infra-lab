<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：二分因子 D，check = BFS 染色判二分</text>

  <!-- ① 读入 -->
  <rect x="35" y="44" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="65" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">① 读入 n 个点</text>

  <path d="M 120,78 L 120,90" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② n = 2 ? -->
  <polygon points="120,94 68,124 120,154 172,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="128" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">② n = 2 ?</text>

  <path d="M 172,124 L 238,124" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>

  <rect x="240" y="108" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="295" y="128" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">返回 0</text>

  <path d="M 120,154 L 120,166" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="166" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <!-- ③ 预处理 -->
  <rect x="20" y="170" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="188" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">③ 预处理距离矩阵 dist[][]</text>
  <text x="120" y="206" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">记最大点距 maxD</text>

  <path d="M 120,214 L 120,226" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 二分初始化 -->
  <rect x="20" y="230" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="250" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">④ 开区间二分</text>
  <text x="120" y="268" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">lo = 0，hi = maxD + 1</text>

  <path d="M 120,274 L 120,286" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 循环条件 -->
  <polygon points="120,290 62,322 120,354 178,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="326" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">⑤ lo+1 &lt; hi ?</text>

  <path d="M 120,354 L 120,368" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="368" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <!-- ⑧ 返回 -->
  <rect x="35" y="372" width="170" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="394" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">⑧ 返回 lo（最大因子）</text>

  <!-- ⑤ 是 → ⑥ -->
  <path d="M 178,322 L 240,322 L 240,214 L 281,214" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="314" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>

  <!-- ⑥ mid -->
  <rect x="285" y="196" width="190" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="218" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">⑥ mid = (lo + hi) / 2</text>

  <path d="M 380,232 L 380,244" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check -->
  <rect x="270" y="248" width="220" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="270" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">check(mid)：把 dist &lt; mid</text>
  <text x="380" y="288" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">的点对连边，BFS 逐分量</text>
  <text x="380" y="306" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">2-染色（同色相邻 = 冲突）</text>

  <path d="M 380,312 L 380,321" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑦ 冲突？ -->
  <polygon points="380,324 305,356 380,388 455,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="360" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">⑦ 染色冲突？</text>

  <path d="M 305,356 L 277,356" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="348" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <rect x="145" y="336" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210" y="357" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">lo = mid（可行）</text>

  <path d="M 455,356 L 479,356" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="348" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>

  <rect x="483" y="338" width="112" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="539" y="359" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">hi = mid</text>

  <!-- 回环：lo/hi 更新 → ⑤ -->
  <path d="M 210,370 L 210,415" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 539,372 L 539,415 L 28,415 L 28,322 L 56,322" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="22" y="372" transform="rotate(-90 22 372)" font-size="10" fill="#446688" filter="url(#rough2)">进入下一轮二分</text>

  <!-- 要点注释 -->
  <rect x="400" y="52" width="180" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#d6a040" text-anchor="middle">
    <text x="490" y="72" font-weight="bold">要点</text>
    <text x="490" y="92">· 距离矩阵当隐式邻接表，</text>
    <text x="490" y="108">  每点出队扫一行：</text>
    <text x="490" y="124">  单次 check 即 O(n²)</text>
    <text x="490" y="144">· lo = 0 恒真 /</text>
    <text x="490" y="160">  hi = maxD+1 恒假</text>
    <text x="490" y="176">  （n ≥ 3 时是完全图）</text>
  </g>

  <text x="300" y="426" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">二分约 29 轮（log₂ 4×10⁸），每轮 check O(n²)，总 O(n² log C)</text>
</svg>
