<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：encoding=[3,8,0,9,2,5]，4 次 next 的指针与扣减</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">序列逻辑上为 [8,8,8,5,5]；关注 step 3 连跳两个「0 次对」、step 4 耗尽返回 -1</text>

  <!-- table header -->
  <g font-size="9" fill="#444" font-weight="bold">
    <rect x="20" y="56" width="26" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="33" y="70" text-anchor="middle">步</text>
    <rect x="46" y="56" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="66" y="70" text-anchor="middle">next</text>
    <rect x="86" y="56" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="106" y="70" text-anchor="middle">i 起</text>
    <rect x="126" y="56" width="200" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="226" y="70" text-anchor="middle">比较 / 跳对过程</text>
    <rect x="326" y="56" width="180" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="416" y="70" text-anchor="middle">encoding 变化（划掉=已耗）</text>
    <rect x="506" y="56" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="526" y="70" text-anchor="middle">返回</text>
  </g>

  <!-- rows -->
  <g font-size="9" fill="#333">
    <!-- step 1: next(2) -->
    <rect x="20" y="78" width="26" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="33" y="96" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="46" y="78" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="66" y="96" text-anchor="middle">2</text>
    <rect x="86" y="78" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="106" y="96" text-anchor="middle">0</text>
    <rect x="126" y="78" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="226" y="96" text-anchor="middle" fill="#d6a040" font-weight="bold">A[0]=3 ≥ 2 → 够吃</text>
    <rect x="326" y="78" width="180" height="30" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="416" y="96" text-anchor="middle" font-size="8"><tspan fill="#bbb">[</tspan><tspan fill="#d6a040" font-weight="bold">1</tspan><tspan fill="#bbb">,8,0,9,2,5]</tspan>　次数 3→1</text>
    <rect x="506" y="78" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="526" y="96" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>

    <!-- step 2: next(1) -->
    <rect x="20" y="110" width="26" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="33" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="46" y="110" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="66" y="128" text-anchor="middle">1</text>
    <rect x="86" y="110" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="106" y="128" text-anchor="middle">0</text>
    <rect x="126" y="110" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="226" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">A[0]=1 ≥ 1 → 够吃</text>
    <rect x="326" y="110" width="180" height="30" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="416" y="128" text-anchor="middle" font-size="8"><tspan fill="#bbb">[</tspan><tspan fill="#ccc">0</tspan><tspan fill="#bbb">,8,0,9,2,5]</tspan>　次数 1→0</text>
    <rect x="506" y="110" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="526" y="128" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>

    <!-- step 3: next(1) -- key, skips two zero pairs -->
    <rect x="20" y="142" width="26" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="0.9" rx="1" filter="url(#rough2)"/>
    <text x="33" y="165" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="46" y="142" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="66" y="165" text-anchor="middle">1</text>
    <rect x="86" y="142" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="106" y="165" text-anchor="middle">0</text>
    <rect x="126" y="142" width="200" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="0.9" rx="1" filter="url(#rough2)"/>
    <text x="226" y="156" text-anchor="middle" fill="#b85450" font-weight="bold">A[0]=0 &lt; 1 → 跳 i=2</text>
    <text x="226" y="168" text-anchor="middle" fill="#b85450" font-weight="bold">A[2]=0 &lt; 1 → 跳 i=4</text>
    <text x="226" y="180" text-anchor="middle" fill="#4a7a3a" font-weight="bold">A[4]=2 ≥ 1 → 够吃</text>
    <rect x="326" y="142" width="180" height="38" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="416" y="165" text-anchor="middle" font-size="8"><tspan fill="#bbb">[0,8,</tspan><tspan fill="#ccc">0,9,</tspan><tspan fill="#d6a040" font-weight="bold">1</tspan><tspan fill="#bbb">,5]</tspan>　次数 2→1</text>
    <rect x="506" y="142" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="526" y="165" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>

    <!-- step 4: next(2) -- exhausted, -1 -->
    <rect x="20" y="184" width="26" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="0.9" rx="1" filter="url(#rough2)"/>
    <text x="33" y="207" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="46" y="184" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="66" y="207" text-anchor="middle">2</text>
    <rect x="86" y="184" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="106" y="207" text-anchor="middle">4</text>
    <rect x="126" y="184" width="200" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="0.9" rx="1" filter="url(#rough2)"/>
    <text x="226" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">A[4]=1 &lt; 2 → 跳 i=6</text>
    <text x="226" y="210" text-anchor="middle" fill="#b85450" font-weight="bold">i=6 ≥ len → 越界</text>
    <text x="226" y="222" text-anchor="middle" fill="#888">剩余 1 个无着落</text>
    <rect x="326" y="184" width="180" height="38" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="416" y="207" text-anchor="middle" font-size="8"><tspan fill="#bbb">[0,8,0,9,</tspan><tspan fill="#ccc">0</tspan><tspan fill="#bbb">,5]</tspan>　第 5 对耗尽</text>
    <rect x="506" y="184" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="0.9" rx="1" filter="url(#rough2)"/>
    <text x="526" y="207" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
  </g>

  <!-- divider -->
  <line x1="20" y1="232" x2="568" y2="232" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Final result ===== -->
  <rect x="30" y="246" width="520" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终结果：[8, 8, 5, -1]</text>
  <text x="290" y="286" text-anchor="middle" font-size="10" fill="#555">step 1、2 各吃 1 对；step 3 连跳两个「0 次对」吃到第 3 对；step 4 第 5 对只剩 1 个 &lt; 2 → -1</text>
  <text x="290" y="302" text-anchor="middle" font-size="9" fill="#888">指针 i 轨迹：0→0→0→2→4→4→6（单调不减，每对至多被跳一次）</text>

  <!-- ===== Key insight box ===== -->
  <rect x="30" y="322" width="520" height="138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="344" font-size="11" fill="#d6a040" font-weight="bold">两个关键观察</text>
  <text x="50" y="364" font-size="10" fill="#555">① 「0 次对」天然被跳过：count=0 时 n-=0 不变、i+=2 直接前进，无需特判</text>
  <text x="50" y="380" font-size="10" fill="#555">　 本例 [0,9] 这对从不贡献任何元素，next 经过它时只是 i 前进一格对</text>
  <text x="50" y="402" font-size="10" fill="#555">② 耗不尽返回 -1 的判定：while 结束时若 n 仍 &gt; 0，说明跨过了所有对仍不够 n 个</text>
  <text x="50" y="418" font-size="10" fill="#555">　 step 4 跨过第 5 对后 i=6 越界、n 还剩 1 → 返回 -1（即使「部分耗掉」也不算成功）</text>
  <text x="50" y="440" font-size="9" fill="#888">题意：必须耗尽 n 个并返回「最后一个被耗的」；只要最后一个不存在就 -1，哪怕前面已耗掉一些</text>
  <text x="50" y="454" font-size="9" fill="#888">指针单调：4 次调用 i 共前进 6 步（=3 对），均摊每次 1.5 步 → O(1) 均摊成立</text>
</svg>
