<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="300" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：n=5, edges=[[0,1],[0,2],[0,3],[1,4]] → ✅ 树</text>
  <text x="290" y="40" text-anchor="middle" font-size="10.5" fill="#888">橙色格 = 本步被改动的 parent；4 条边 = n−1，最终 count=1 即连通</text>

  <!-- ===== header row ===== -->
  <rect x="24" y="50" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="104" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作</text>
  <rect x="188" y="50" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="207" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p0</text>
  <rect x="226" y="50" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="245" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p1</text>
  <rect x="264" y="50" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="283" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p2</text>
  <rect x="302" y="50" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="321" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p3</text>
  <rect x="340" y="50" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="359" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p4</text>
  <rect x="386" y="50" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="411" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count</text>
  <rect x="444" y="50" width="124" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="506" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">说明</text>

  <!-- ===== row 1: 初始 ===== -->
  <rect x="24" y="78" width="160" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="104" y="96" text-anchor="middle" font-size="10.5" fill="#333">初始</text>
  <rect x="188" y="78" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="207" y="96" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="226" y="78" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="245" y="96" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="264" y="78" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="283" y="96" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="302" y="78" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="321" y="96" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="340" y="78" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="359" y="96" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="386" y="78" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="411" y="96" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="444" y="78" width="124" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="506" y="96" text-anchor="middle" font-size="10" fill="#666">各自为根</text>

  <!-- ===== row 2: union(0,1) -> p1=0 ===== -->
  <rect x="24" y="106" width="160" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="104" y="124" text-anchor="middle" font-size="10.5" fill="#333">unite(0, 1)</text>
  <rect x="188" y="106" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="207" y="124" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="226" y="106" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/><text x="245" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="264" y="106" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="283" y="124" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="302" y="106" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="321" y="124" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="340" y="106" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="359" y="124" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="386" y="106" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="411" y="124" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="444" y="106" width="124" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="506" y="124" text-anchor="middle" font-size="10" fill="#666">1 挂到 0 下</text>

  <!-- ===== row 3: union(0,2) -> p2=0 ===== -->
  <rect x="24" y="134" width="160" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="104" y="152" text-anchor="middle" font-size="10.5" fill="#333">unite(0, 2)</text>
  <rect x="188" y="134" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="207" y="152" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="226" y="134" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="245" y="152" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="264" y="134" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/><text x="283" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="302" y="134" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="321" y="152" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="340" y="134" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="359" y="152" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="386" y="134" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="411" y="152" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="444" y="134" width="124" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="506" y="152" text-anchor="middle" font-size="10" fill="#666">2 挂到 0 下</text>

  <!-- ===== row 4: union(0,3) -> p3=0 ===== -->
  <rect x="24" y="162" width="160" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="104" y="180" text-anchor="middle" font-size="10.5" fill="#333">unite(0, 3)</text>
  <rect x="188" y="162" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="207" y="180" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="226" y="162" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="245" y="180" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="264" y="162" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="283" y="180" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="302" y="162" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/><text x="321" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="340" y="162" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="359" y="180" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="386" y="162" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="411" y="180" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="444" y="162" width="124" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="506" y="180" text-anchor="middle" font-size="10" fill="#666">3 挂到 0 下</text>

  <!-- ===== row 5: union(1,4) -> find(1)=0, find(4)=4 -> p4=0 ===== -->
  <rect x="24" y="190" width="160" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="104" y="208" text-anchor="middle" font-size="10.5" fill="#333">unite(1, 4)</text>
  <rect x="188" y="190" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="207" y="208" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="226" y="190" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="245" y="208" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="264" y="190" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="283" y="208" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="302" y="190" width="38" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="321" y="208" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="340" y="190" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/><text x="359" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="386" y="190" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="411" y="208" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="444" y="190" width="124" height="26" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/><text x="506" y="208" text-anchor="middle" font-size="10" fill="#666">find(1)=0 ≠ find(4)=4</text>

  <!-- ===== result row ===== -->
  <rect x="24" y="226" width="544" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="296" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 条边 = n−1 ✓，且 count == 1（全连通）→ return true ✅ 是树</text>

  <text x="290" y="280" text-anchor="middle" font-size="10.5" fill="#888">反例：若 n=5 但只给 3 条边 → 边数 ≠ n−1，第一步即 return false，无需并查集</text>
</svg>
