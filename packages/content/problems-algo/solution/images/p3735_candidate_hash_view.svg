<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333"
        filter="url(#rough2)">任何候选串 = 「rev(s) 的一段」拼「s 的一段」</text>

  <!-- 原串 s -->
  <text x="52" y="86" font-size="13.5" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">s =</text>
  <rect x="104" y="62" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="62" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="62" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="242" y="62" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="124" y="83">d</text>
    <text x="170" y="83">c</text>
    <text x="216" y="83">a</text>
    <text x="262" y="83">b</text>
  </g>
  <rect x="104" y="100" width="178" height="19" rx="9.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="193" y="113" text-anchor="middle" font-size="10" fill="#4a7a3a"
        filter="url(#rough2)">前缀哈希数组 hs[0…4]</text>

  <!-- 反串 r -->
  <text x="28" y="164" font-size="12.5" fill="#446688" font-weight="bold"
        filter="url(#rough2)">r = rev(s)</text>
  <rect x="104" y="140" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="140" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="140" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="242" y="140" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="124" y="161">b</text>
    <text x="170" y="161">a</text>
    <text x="216" y="161">c</text>
    <text x="262" y="161">d</text>
  </g>
  <rect x="104" y="178" width="178" height="19" rx="9.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="193" y="191" text-anchor="middle" font-size="10" fill="#446688"
        filter="url(#rough2)">前缀哈希数组 hr[0…4]</text>

  <!-- 哈希拼接公式 -->
  <rect x="352" y="54" width="152" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#8a6a20" text-anchor="middle">
    <text x="428" y="76" font-weight="bold">哈希拼接公式</text>
    <text x="428" y="100">hash(A·B) =</text>
    <text x="428" y="116">hash(A)·base^{|B|}</text>
    <text x="428" y="132">+ hash(B)</text>
    <text x="428" y="156">候选的任意前缀 =</text>
    <text x="428" y="171">r 的一段(可空)</text>
    <text x="428" y="186">+ s 的一段(可空)</text>
    <text x="428" y="201" font-weight="bold">⇒ 哈希 O(1) 读出</text>
  </g>

  <!-- 候选 P(3) -->
  <text x="36" y="248" font-size="12" fill="#446688" font-weight="bold"
        filter="url(#rough2)">P(3)：反转前 3 个</text>
  <rect x="104" y="226" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="226" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="226" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="242" y="226" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="124" y="247">a</text>
    <text x="170" y="247">c</text>
    <text x="216" y="247">d</text>
    <text x="262" y="247">b</text>
  </g>
  <text x="296" y="248" font-size="11" fill="#666"
        filter="url(#rough2)">= "acdb"（示例 1 的答案）</text>
  <path d="M 104 272 L 104 277 L 236 277 L 236 272" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="291" text-anchor="middle" font-size="10.5" fill="#446688"
        filter="url(#rough2)">r[1…4)</text>
  <path d="M 242 272 L 242 277 L 282 277 L 282 272" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="291" text-anchor="middle" font-size="10.5" fill="#4a7a3a"
        filter="url(#rough2)">s[3…4)</text>

  <!-- 候选 Q(3) -->
  <text x="36" y="328" font-size="12" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">Q(3)：反转后 3 个</text>
  <rect x="104" y="306" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="306" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="306" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="242" y="306" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="124" y="327">d</text>
    <text x="170" y="327">b</text>
    <text x="216" y="327">a</text>
    <text x="262" y="327">c</text>
  </g>
  <text x="296" y="328" font-size="11" fill="#666"
        filter="url(#rough2)">= "dbac"</text>
  <path d="M 104 352 L 104 357 L 144 357 L 144 352" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="124" y="371" text-anchor="middle" font-size="10.5" fill="#4a7a3a"
        filter="url(#rough2)">s[0…1)</text>
  <path d="M 150 352 L 150 357 L 282 357 L 282 352" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="216" y="371" text-anchor="middle" font-size="10.5" fill="#446688"
        filter="url(#rough2)">r[0…3)</text>

  <!-- 底部总结 -->
  <rect x="30" y="384" width="460" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="403" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">不必构造 2n 个候选串——hs、hr 两个数组即可 O(1) 读出任意候选的任意前缀哈希</text>
</svg>
