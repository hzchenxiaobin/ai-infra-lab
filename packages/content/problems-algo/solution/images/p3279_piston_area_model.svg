<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">「活塞下方的区域」= 它的位置 p</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">单位宽度的气缸：面积 = 宽 1 × 高 p —— 总区域 A(t) = Σ positions[i]</text>

  <!-- 气缸 A -->
  <rect x="80" y="76" width="68" height="224" fill="#ffffff" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="82" y="225" width="64" height="67" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="80" y="217" width="68" height="9" fill="#446688" rx="2" filter="url(#rough2)"/>
  <path d="M 114 209 L 114 190" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="128" y="200" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">U</text>
  <text x="72" y="88" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">h</text>
  <text x="72" y="292" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">0</text>
  <text x="72" y="226" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="114" y="316" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">面积 = p</text>

  <!-- 气缸 B -->
  <rect x="350" y="76" width="68" height="224" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="352" y="130" width="64" height="162" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="350" y="122" width="68" height="9" fill="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <path d="M 384 140 L 384 158" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="398" y="154" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="342" y="88" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">h</text>
  <text x="342" y="292" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="342" y="131" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p′</text>
  <text x="384" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">面积 = p′ &gt; p</text>

  <!-- 中间过渡箭头 -->
  <path d="M 155 205 Q 250 110 343 125" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="252" y="112" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">时间推移，每秒 ±1</text>
  <text x="252" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">到顶（h）后</text>
  <text x="252" y="228" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">方向反转下行</text>

  <!-- 底部要点框 -->
  <rect x="60" y="328" width="400" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">到达 0 或 height 即反弹——反弹是唯一改变「总和变化率」的事件</text>
</svg>
