<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">双轨 DP：按奇偶性分轨追踪最大分数</text>

  <!-- Even lane label -->
  <text x="50" y="100" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">偶数轨 maxEven</text>
  <!-- Even lane line -->
  <line x1="50" y1="140" x2="490" y2="140" stroke="#446688" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Even nodes -->
  <rect x="95" y="125" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="240" y="125" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <rect x="400" y="125" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- Odd lane label -->
  <text x="50" y="220" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">奇数轨 maxOdd</text>
  <!-- Odd lane line -->
  <line x1="50" y1="260" x2="490" y2="260" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Odd nodes -->
  <rect x="170" y="245" width="40" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <rect x="320" y="245" width="40" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="440" y="245" width="40" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>

  <!-- Same-parity arrow: 2→6 (even→even, green) -->
  <path d="M135,140 L238,140" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="187" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+6</text>

  <!-- Cross-parity arrow: 6→1 (even→odd, red dashed) -->
  <path d="M260,155 Q290,200 318,245" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="200" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">+1−x</text>

  <!-- Same-parity arrow: 1→9 (odd→odd, green) -->
  <path d="M360,260 L438,260" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="399" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+9</text>

  <!-- Legend -->
  <rect x="55" y="298" width="410" height="48" rx="6" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="75" y1="315" x2="105" y2="315" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="115" y="319" font-size="11" fill="#333" filter="url(#rough2)">同奇偶 → +nums[i]</text>
  <line x1="260" y1="315" x2="290" y2="315" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="319" font-size="11" fill="#333" filter="url(#rough2)">异奇偶 → +nums[i] − x</text>
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">最优路径：2 → 6 → 1 → 9，总分 2+6+1+9−5 = 13</text>
</svg>
