<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按位 AND 单调不增 ⟹ 最大子数组 AND = max(nums)</text>

  <!-- Array row [1,2,3,3,2,2] -->
  <text x="120" y="66" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">nums =</text>
  <!-- cells: x=130,182,234,286,338,390 ; width 46, height 40, y=46 -->
  <rect x="130" y="46" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="46" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="234" y="46" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="257" y="72" text-anchor="middle" font-size="13" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="286" y="46" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="72" text-anchor="middle" font-size="13" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="338" y="46" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="390" y="46" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- bracket under [3,3] -->
  <path d="M 234 92 L 234 100 L 332 100 L 332 92" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="283" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max=3 的最长连续段，长度 2 ← 答案</text>

  <!-- Reasoning chain boxes -->
  <!-- Box A -->
  <rect x="90" y="132" width="380" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 任意子数组 AND ≤ 其中每个元素</text>
  <text x="280" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">按位与只清位、不减位 ⇒ a &amp; b ≤ a 且 ≤ b</text>
  <path d="M 280 176 L 280 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box B -->
  <rect x="90" y="194" width="380" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② ∴ 子数组 AND ≤ max(nums)</text>
  <path d="M 280 230 L 280 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box C (key, green) -->
  <rect x="90" y="248" width="380" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">③ 单元素子数组 [max] 的 AND = max</text>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">⟹ 最大 AND 值 k = max(nums)</text>
  <path d="M 280 296 L 280 312" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Box D (conclusion, orange) -->
  <rect x="90" y="314" width="380" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">④ 要使长度&gt;1 的子数组 AND 仍 = max</text>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">⟹ 每个元素都得 = max ⇒ 答案 = max 最长连续段</text>
</svg>
