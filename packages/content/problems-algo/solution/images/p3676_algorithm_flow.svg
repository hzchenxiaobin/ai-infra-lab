<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：两遍单调栈 + 一趟计数</text>

  <!-- Left main flow -->
  <rect x="85" y="44" width="110" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="63" text-anchor="middle" font-size="12" fill="#33445e" filter="url(#rough2)">开始</text>

  <rect x="35" y="96" width="210" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="118" text-anchor="middle" font-size="12" fill="#33445e" filter="url(#rough2)">① 单调栈 左→右</text>
  <text x="140" y="138" text-anchor="middle" font-size="11" fill="#556" filter="url(#rough2)">弹出者记 nxt = i</text>

  <rect x="35" y="172" width="210" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="194" text-anchor="middle" font-size="12" fill="#33445e" filter="url(#rough2)">② 单调栈 右→左</text>
  <text x="140" y="214" text-anchor="middle" font-size="11" fill="#556" filter="url(#rough2)">弹出者记 prv = i</text>

  <rect x="35" y="248" width="210" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="272" text-anchor="middle" font-size="12" fill="#33445e" filter="url(#rough2)">③ 遍历 i，判两类配对</text>

  <rect x="75" y="310" width="130" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="330" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">返回 ans</text>

  <path d="M 140,74 L 140,93" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140,152 L 140,169" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140,228 L 140,245" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140,288 L 140,307" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Connector: box3 -> diamond1 -->
  <path d="M 245,268 L 256,268 L 256,128 L 261,128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1 -->
  <polygon points="350,86 437,128 350,170 263,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="123" text-anchor="middle" font-size="11" fill="#6a5320" filter="url(#rough2)">nxt[i] ≠ −1</text>
  <text x="350" y="141" text-anchor="middle" font-size="11" fill="#6a5320" filter="url(#rough2)">且 nxt[i]−i ≥ 2 ?</text>

  <path d="M 437,128 L 450,128" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="443" y="120" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="452" y="111" width="56" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="132" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">ans++</text>

  <path d="M 350,170 L 350,196" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="189" font-size="10" fill="#667" filter="url(#rough2)">否 / 再判</text>

  <!-- Diamond 2 -->
  <polygon points="350,198 437,240 350,282 263,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="235" text-anchor="middle" font-size="11" fill="#6a5320" filter="url(#rough2)">prv[i] ≠ −1</text>
  <text x="350" y="253" text-anchor="middle" font-size="11" fill="#6a5320" filter="url(#rough2)">且 i−prv[i] ≥ 2 ?</text>

  <path d="M 437,240 L 450,240" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="443" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="452" y="223" width="56" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="244" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">ans++</text>

  <!-- Loop back -->
  <path d="M 350,282 L 350,294" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="283" y="296" width="134" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="314" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#rough2)">i++ / 收尾</text>

  <path d="M 283,310 C 242,332 224,334 209,327" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="243" y="337" text-anchor="middle" font-size="10" fill="#667" filter="url(#rough2)">全部判完</text>
</svg>
