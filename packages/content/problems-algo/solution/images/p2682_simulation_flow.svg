<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：哈希表模拟</text>

  <!-- Init box -->
  <rect x="80" y="42" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化：cur=1，vis[1]=✓，i=1</text>

  <!-- arrow down -->
  <path d="M 200 84 L 200 106" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute box -->
  <rect x="50" y="108" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">next = (cur + i·k − 1) mod n + 1</text>

  <!-- arrow down -->
  <path d="M 200 154 L 200 176" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="200,178 276,214 200,250 124,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">vis[next]?</text>

  <!-- 否 branch: right to update -->
  <path d="M 276 214 L 316 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Update box -->
  <rect x="316" y="190" width="186" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="409" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">vis[next]=✓</text>
  <text x="409" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cur=next，i=i+1</text>

  <!-- loop arrow: update top -> up -> left into compute -->
  <path d="M 409 190 L 409 131 L 354 131" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="423" y="162" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一轮</text>

  <!-- 是 branch: down to result -->
  <path d="M 200 250 L 200 290" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="174" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Result box -->
  <rect x="30" y="292" width="340" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="319" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">收集 vis[i]==✗ 的 i，升序返回</text>

  <!-- side note -->
  <text x="50" y="362" font-size="10" fill="#888" filter="url(#rough2)">mod n + 1 实现 1-indexed 环形回绕；循环至多 n 次（鸽巢）。</text>
</svg>
