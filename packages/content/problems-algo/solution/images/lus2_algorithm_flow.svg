<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 逐串判定子序列</text>

  <!-- Step 1: Sort -->
  <rect x="170" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">步骤 1</text>
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#333">按长度降序排序</text>

  <path d="M 270 90 L 270 108" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: For each string -->
  <rect x="120" y="114" width="300" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">步骤 2：遍历 strs[i]（从最长开始）</text>
  <text x="270" y="150" text-anchor="middle" font-size="11" fill="#555">检查是否为某个 strs[j]（j≠i）的子序列</text>

  <path d="M 270 166 L 270 184" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: is subsequence of any other? -->
  <polygon points="270,190 380,235 270,280 160,235" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">strs[i] 是某个</text>
  <text x="270" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">strs[j] 的子序列？</text>

  <!-- Yes branch (right) -->
  <text x="392" y="232" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 380 235 Q 410 235 410 270" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="370" y="278" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="296" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">strs[i] 不特殊</text>
  <text x="415" y="310" text-anchor="middle" font-size="10.5" fill="#b85450">检查下一个 i</text>

  <!-- loop back arrow from Yes box to step 2 -->
  <path d="M 460 298 Q 500 298 500 138 Q 500 120 420 120" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="496" y="210" font-size="9" fill="#888" text-anchor="middle" transform="rotate(-90 496 210)">下一个字符串</text>

  <!-- No branch (left) -->
  <text x="148" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 160 235 Q 130 235 130 270" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="70" y="278" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">strs[i] 是特殊序列</text>
  <text x="130" y="310" text-anchor="middle" font-size="10.5" fill="#4a7a3a">返回 len(strs[i])</text>

  <path d="M 130 322 L 130 346" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="50" y="352" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="130" y="377" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = len(strs[i])</text>

  <!-- Step 3: if all checked and none found -->
  <path d="M 415 322 Q 415 350 415 378" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="384" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="415" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">所有串都检查完毕</text>
  <text x="415" y="416" text-anchor="middle" font-size="11" fill="#b85450">无特殊序列 → 返回 -1</text>

  <!-- optimization note -->
  <rect x="44" y="416" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="174" y="437" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">优化：只需检查 len ≥ len(strs[i]) 的串</text>
</svg>
