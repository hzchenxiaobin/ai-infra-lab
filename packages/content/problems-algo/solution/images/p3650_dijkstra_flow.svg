<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 590"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="590" fill="#fafafa"/>

  <text x="20" y="32" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">增广图 Dijkstra 流程</text>

  <!-- ① 建图 -->
  <rect x="60" y="46" width="280" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">① 增广建图</text>
  <text x="200" y="88" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">adj[u]+=(v,w)　adj[v]+=(u,2w)</text>
  <path d="M200 102 L200 120" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② 初始化 -->
  <rect x="60" y="126" width="280" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">② 初始化</text>
  <text x="200" y="166" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dist[0]=0，其余 ∞，堆压 (0, 0)</text>
  <path d="M200 176 L200 194" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ 弹堆顶 -->
  <rect x="60" y="200" width="280" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">③ 弹堆顶 (d, u)</text>
  <path d="M342 221 L414 221" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="212" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">堆空</text>
  <rect x="420" y="200" width="128" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="484" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 −1</text>
  <path d="M200 242 L200 264" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形1：陈旧判断 -->
  <polygon points="190,268 288,316 190,364 92,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough)"/>
  <text x="190" y="321" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d &gt; dist[u] ?</text>
  <rect x="4" y="294" width="82" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="45" y="313" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">陈旧条目</text>
  <text x="45" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="76" y="306" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M45 294 L45 224 L56 224" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M190 364 L190 386" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="380" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 菱形2：终点判断 -->
  <polygon points="190,390 283,436 190,482 97,436" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough)"/>
  <text x="190" y="441" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">u == n−1 ?</text>
  <path d="M283 436 L351 436" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="308" y="428" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="355" y="414" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 d</text>
  <text x="430" y="450" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（首弹即最优）</text>
  <path d="M190 482 L190 504" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="498" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- ④ 松弛 -->
  <rect x="45" y="508" width="290" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="528" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">④ 松弛：遍历 adj[u]</text>
  <text x="190" y="546" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">原边 / 虚拟边一视同仁</text>
  <text x="190" y="562" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">d + w′ &lt; dist[v] ⇒ 更新并入堆</text>
  <path d="M45 539 L24 539 L24 212 L54 212" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
</svg>
