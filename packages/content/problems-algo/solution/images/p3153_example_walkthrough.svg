<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [13, 23, 12]，n = 3，D = 2</text>

  <rect x="32" y="42" width="456" height="128" fill="#f2f9f3" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="66" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 个位（p = 0）：剥出 3, 3, 2</text>

  <rect x="48" y="78" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="92" y="78" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="136" y="78" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="196" y="98" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">→ 桶计数：c₂ = 1，c₃ = 2（其余为 0）</text>

  <text x="48" y="134" font-size="11" fill="#4a7a3a" filter="url(#rough2)">贡献 = [c₂·(n−c₂) + c₃·(n−c₃)] ÷ 2 = (1×2 + 2×1) ÷ 2 = 2</text>
  <text x="48" y="156" font-size="10.5" fill="#888" filter="url(#rough2)">等价式：C(3,2) − C(2,2) − C(1,2) = 3 − 1 − 0 = 2 ✓</text>

  <rect x="32" y="182" width="456" height="128" fill="#f3f7fc" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="206" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 十位（p = 1）：剥出 1, 2, 1</text>

  <rect x="48" y="218" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="238" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="92" y="218" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="238" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="136" y="218" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="238" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="196" y="238" font-size="11.5" fill="#446688" filter="url(#rough2)">→ 桶计数：c₁ = 2，c₂ = 1（其余为 0）</text>

  <text x="48" y="274" font-size="11" fill="#446688" filter="url(#rough2)">贡献 = [c₁·(n−c₁) + c₂·(n−c₂)] ÷ 2 = (2×1 + 1×2) ÷ 2 = 2</text>
  <text x="48" y="296" font-size="10.5" fill="#888" filter="url(#rough2)">等价式：C(3,2) − C(2,2) − C(1,2) = 3 − 1 − 0 = 2 ✓</text>

  <rect x="32" y="322" width="456" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = 2 + 2 = 4 ✓</text>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">逐对验证：13↔23 差 1 + 13↔12 差 1 + 23↔12 差 2 = 4 ✓</text>

  <rect x="32" y="378" width="456" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：[10,10,10,10] → 每位只有一个非空桶（c = 4 = n）</text>
  <text x="260" y="420" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">贡献 = 4×(4−4) ÷ 2 = 0 → ans = 0</text>
</svg>
