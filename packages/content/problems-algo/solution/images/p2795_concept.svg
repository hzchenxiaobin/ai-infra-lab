<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：拒绝也落位，不短路，计数器照常收尾</text>

  <!-- functions array (top) -->
  <text x="40" y="62" font-size="11" fill="#888">functions</text>
  <rect x="110" y="50" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="145" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f0()</text>
  <rect x="190" y="50" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="225" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f1()</text>
  <rect x="270" y="50" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="305" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f2()</text>

  <!-- parallel fire arrows -->
  <path d="M 145 86 L 145 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 225 86 L 225 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 305 86 L 305 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="100" font-size="9" fill="#446688">并发触发</text>

  <!-- three promises: f0 resolve, f1 reject, f2 resolve -->
  <rect x="110" y="112" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="145" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">resolve</text>
  <text x="145" y="142" text-anchor="middle" font-size="10" fill="#333">→ 30 ✓</text>

  <rect x="190" y="112" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="225" y="128" text-anchor="middle" font-size="10" fill="#b85450">reject</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" fill="#333">→ "Error" ✗</text>

  <rect x="270" y="112" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="305" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">resolve</text>
  <text x="305" y="142" text-anchor="middle" font-size="10" fill="#333">→ 15 ✓</text>

  <!-- arrows down to results slots: green for resolve, RED for reject reason (both land!) -->
  <path d="M 145 154 L 145 176" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 225 154 L 225 176" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 305 154 L 305 176" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="350" y="168" font-size="9" fill="#b85450">拒绝也落位！</text>

  <!-- results array (preserves order, reject reason in slot 1) -->
  <text x="40" y="198" font-size="11" fill="#888">results</text>
  <rect x="110" y="180" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="145" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[0]=30</text>
  <rect x="190" y="180" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="225" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[1]="Error"</text>
  <rect x="270" y="180" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="305" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[2]=15</text>
  <text x="350" y="198" font-size="9" fill="#4a7a3a">按原索引落位</text>

  <!-- counter -->
  <rect x="110" y="228" width="230" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="225" y="249" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">count: 1 → 2 → 3（不区分成功/失败）</text>

  <!-- arrow: when count == n -->
  <path d="M 225 264 L 225 288" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="240" y="282" font-size="10" fill="#4a7a3a">count == n</text>

  <!-- resolve box (never reject) -->
  <rect x="110" y="292" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="225" y="311" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">resolve([30, "Error", 15])</text>
  <text x="225" y="325" text-anchor="middle" font-size="9" fill="#4a7a3a">外层永不 reject</text>

  <!-- Right side: contrast with Promise.all -->
  <text x="410" y="62" font-size="11" fill="#b85450" font-weight="bold">对比 Promise.all</text>
  <rect x="380" y="74" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="92" text-anchor="middle" font-size="10" fill="#333">f1 reject "Error"</text>
  <text x="465" y="106" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">100ms 即短路</text>

  <path d="M 465 116 L 465 138" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="480" y="132" font-size="9" fill="#b85450">不等 f0</text>

  <rect x="380" y="142" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">reject("Error")</text>
  <text x="465" y="174" text-anchor="middle" font-size="9" fill="#b85450">30 的结果丢失</text>

  <rect x="380" y="200" width="170" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="465" y="220" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">allSettled 的不同</text>
  <text x="465" y="238" text-anchor="middle" font-size="9" fill="#333">① 拒绝不短路</text>
  <text x="465" y="252" text-anchor="middle" font-size="9" fill="#333">② 拒绝原因也存进数组</text>
  <text x="465" y="266" text-anchor="middle" font-size="9" fill="#333">③ 等全部定型才 resolve</text>

  <!-- Bottom note -->
  <rect x="40" y="356" width="510" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="295" y="376" text-anchor="middle" font-size="11" fill="#333">.then(v=>落位, r=>也落位)：成功与失败走同一条收集链，区别只在写入的值</text>
  <text x="295" y="392" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">落位靠「索引」、收尾靠「计数器」、拒绝不短路</text>
</svg>
