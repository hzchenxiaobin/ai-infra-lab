<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">拓扑排序：按入度分层剥离，层数 = 最长路径长度</text>

  <!-- grid colored by layer -->
  <!-- row0 -->
  <rect x="60" y="60" width="60" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="92" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">9</text>
  <text x="90" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">L4</text>

  <rect x="124" y="60" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="92" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">9</text>
  <text x="154" y="112" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">L3</text>

  <rect x="188" y="60" width="60" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="92" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">4</text>
  <text x="218" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">L1</text>

  <!-- row1 -->
  <rect x="60" y="124" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="156" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">6</text>
  <text x="90" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">L3</text>

  <rect x="124" y="124" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="156" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">6</text>
  <text x="154" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">L2</text>

  <rect x="188" y="124" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="156" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">8</text>
  <text x="218" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">L3</text>

  <!-- row2 -->
  <rect x="60" y="188" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="220" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>
  <text x="90" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">L2</text>

  <rect x="124" y="188" width="60" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="220" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <text x="154" y="240" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">L1</text>

  <rect x="188" y="188" width="60" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="220" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <text x="218" y="240" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">L1</text>

  <!-- arrows showing peeling direction (small -> large), one example chain -->
  <path d="M 138 218 L 124 218" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrT)" filter="url(#rough2)"/>
  <path d="M 90 188 L 90 184" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrT)" filter="url(#rough2)"/>
  <path d="M 90 124 L 90 120" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrT)" filter="url(#rough2)"/>
  <text x="40" y="160" text-anchor="middle" font-size="9.5" fill="#888" transform="rotate(-90 40 160)">边：小→大</text>

  <!-- legend -->
  <rect x="310" y="60" width="220" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="420" y="82" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">分层规则（Kahn BFS）</text>

  <rect x="326" y="94" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="356" y="106" font-size="10.5" fill="#555">L1：入度=0（无更小邻居）</text>

  <rect x="326" y="118" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="356" y="130" font-size="10.5" fill="#555">L2：L1 剥离后入度归零</text>

  <rect x="326" y="142" width="20" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="356" y="154" font-size="10.5" fill="#555">L3：L2 剥离后入度归零</text>

  <rect x="326" y="166" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="356" y="178" font-size="10.5" fill="#555">L4：L3 剥离后入度归零</text>

  <text x="420" y="202" text-anchor="middle" font-size="11" fill="#666">每剥离一层，最长路径 +1</text>
  <text x="420" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">层数 = 4 → 答案 4</text>

  <!-- bottom note -->
  <rect x="50" y="262" width="470" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">入度 = 该格「更小的邻居」个数；入度 0 即递增链的起点</text>
  <text x="285" y="304" text-anchor="middle" font-size="11" fill="#666">剥离某格时，把它指向「更大邻居」的边删掉，邻居入度 −1</text>
  <text x="285" y="322" text-anchor="middle" font-size="11" fill="#666">归零者进入下一层 —— 等价于在 DAG 上做最长路（节点数）</text>
</svg>
