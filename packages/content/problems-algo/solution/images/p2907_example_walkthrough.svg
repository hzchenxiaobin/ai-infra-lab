<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：prices = [1,2,3,4,5]，profits = [1,5,3,4,6]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#999">逐个 j 求 left / right 与候选值（left、right 为 0 表示该侧不存在可用商品）</text>

  <!-- 表头 -->
  <rect x="52" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="74" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j</text>
  <rect x="96" y="56" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">prices[j]</text>
  <rect x="172" y="56" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left(j)</text>
  <rect x="302" y="56" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">right(j)</text>
  <rect x="432" y="56" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">候选</text>

  <!-- 行 j=0 -->
  <rect x="52" y="86" width="44" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="74" y="108" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="96" y="86" width="76" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="108" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="172" y="86" width="130" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="108" text-anchor="middle" font-size="11" fill="#999">0（左侧空）</text>
  <rect x="302" y="86" width="130" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="108" text-anchor="middle" font-size="11" fill="#333">6（k=4）</text>
  <rect x="432" y="86" width="86" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="108" text-anchor="middle" font-size="12" fill="#999">—</text>

  <!-- 行 j=1 -->
  <rect x="52" y="120" width="44" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="74" y="142" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="96" y="120" width="76" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="142" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="172" y="120" width="130" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="142" text-anchor="middle" font-size="11" fill="#333">1（i=0）</text>
  <rect x="302" y="120" width="130" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="142" text-anchor="middle" font-size="11" fill="#333">6（k=4）</text>
  <rect x="432" y="120" width="86" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="142" text-anchor="middle" font-size="12" fill="#333">12</text>

  <!-- 行 j=2 -->
  <rect x="52" y="154" width="44" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="74" y="176" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="96" y="154" width="76" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="176" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="172" y="154" width="130" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="176" text-anchor="middle" font-size="11" fill="#333">5（i=1）</text>
  <rect x="302" y="154" width="130" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="176" text-anchor="middle" font-size="11" fill="#333">6（k=4）</text>
  <rect x="432" y="154" width="86" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="176" text-anchor="middle" font-size="12" fill="#333">14</text>

  <!-- 行 j=3：答案行，高亮 -->
  <rect x="52" y="188" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="74" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="96" y="188" width="76" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="172" y="188" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5（i=1）</text>
  <rect x="302" y="188" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6（k=4）</text>
  <rect x="432" y="188" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="475" y="210" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">15 ✓</text>

  <!-- 行 j=4 -->
  <rect x="52" y="222" width="44" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="74" y="244" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="96" y="222" width="76" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="244" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="172" y="222" width="130" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="244" text-anchor="middle" font-size="11" fill="#333">5（i=1）</text>
  <rect x="302" y="222" width="130" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="244" text-anchor="middle" font-size="11" fill="#999">0（右侧空）</text>
  <rect x="432" y="222" width="86" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="244" text-anchor="middle" font-size="12" fill="#999">—</text>

  <!-- 结论框 -->
  <rect x="52" y="272" width="466" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = 15：i=1, j=3, k=4（价格 2 &lt; 4 &lt; 5）</text>
  <text x="285" y="310" text-anchor="middle" font-size="11" fill="#555">利润 5 + 4 + 6 = 15</text>

  <!-- 观察框 -->
  <rect x="52" y="330" width="466" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="285" y="352" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">看 j=2 → j=3：left、right 一模一样（5 和 6），</text>
  <text x="285" y="370" text-anchor="middle" font-size="11" fill="#555">候选从 14 涨到 15 全靠中间元素自身利润 3 → 4 —— 两侧解耦的直观体现</text>
</svg>
