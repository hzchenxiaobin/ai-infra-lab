<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1：grid = [[1,2,4],[3,3,1]] → 8</text>

  <!-- column tints (drawn first, under grid lines) -->
  <rect x="280" y="88" width="110" height="144" fill="#fff8e1" opacity="0.7" filter="url(#rough2)"/>
  <rect x="390" y="88" width="110" height="144" fill="#e6f4ea" opacity="0.7" filter="url(#rough2)"/>

  <!-- table outer + header bg -->
  <rect x="20" y="50" width="480" height="182" fill="none" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="20" y="50" width="480" height="38" fill="#e8f0fe" filter="url(#rough2)"/>

  <!-- column separators -->
  <line x1="80" y1="50" x2="80" y2="232" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="180" y1="50" x2="180" y2="232" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="280" y1="50" x2="280" y2="232" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="390" y1="50" x2="390" y2="232" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- row separators -->
  <line x1="20" y1="88" x2="500" y2="88" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="20" y1="130" x2="500" y2="130" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="20" y1="172" x2="500" y2="172" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="20" y1="214" x2="500" y2="214" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- headers -->
  <text x="50" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">轮次</text>
  <text x="130" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第1行删</text>
  <text x="230" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第2行删</text>
  <text x="335" y="74" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">本轮最大</text>
  <text x="445" y="74" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">累计 ans</text>

  <!-- data row 1 -->
  <text x="50" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="230" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="335" y="116" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="445" y="115" text-anchor="middle" font-size="14" fill="#2f5a22" filter="url(#rough2)">4</text>

  <!-- data row 2 -->
  <text x="50" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="335" y="158" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="445" y="157" text-anchor="middle" font-size="14" fill="#2f5a22" filter="url(#rough2)">7</text>

  <!-- data row 3 -->
  <text x="50" y="199" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="130" y="199" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="199" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="335" y="200" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="445" y="199" text-anchor="middle" font-size="14" fill="#2f5a22" filter="url(#rough2)">8</text>

  <!-- note box -->
  <rect x="30" y="252" width="460" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="13" fill="#2f5a22" filter="url(#rough2)">排序后 grid' = [[1,2,4],[1,3,3]]</text>
  <text x="260" y="306" text-anchor="middle" font-size="13" fill="#2f5a22" filter="url(#rough2)">列最大：max(1,1)=1，max(2,3)=3，max(4,3)=4</text>
  <text x="260" y="336" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 + 3 + 4 = 8  ✓ 与模拟一致</text>
</svg>
