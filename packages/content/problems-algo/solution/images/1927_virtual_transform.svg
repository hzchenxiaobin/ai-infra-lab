<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">虚拟变换：右半 '?' 翻转后归约为互补求和博弈</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">令 virtual = 9 − actual，消去左右差异</text>

  <!-- Step 1: original -->
  <text x="40" y="78" font-size="12" fill="#446688" font-weight="bold">① 原始 S</text>
  <rect x="40" y="86" width="540" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="116" font-size="13" fill="#444">S = (左半 '?' 填数之和) − (右半 '?' 填数之和)</text>

  <!-- arrow -->
  <path d="M 310 140 L 310 162" stroke="#666" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: transform -->
  <text x="40" y="178" font-size="12" fill="#d6a040" font-weight="bold">② 右半 '?' 做 virtual = 9 − actual 变换</text>
  <rect x="40" y="186" width="540" height="60" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="210" font-size="12" fill="#444">actual = 9 − virtual 代入右半：</text>
  <text x="56" y="230" font-size="13" fill="#444">S = Σ左 actual − Σ右(9 − virtual) = (Σ左 virtual + Σ右 virtual) − 9·qR</text>

  <!-- arrow -->
  <path d="M 310 250 L 310 272" stroke="#666" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: reduced game -->
  <text x="40" y="288" font-size="12" fill="#b85450" font-weight="bold">③ 归约：所有 '?' 统一为"填 virtual 0–9"的求和博弈</text>
  <rect x="40" y="296" width="540" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="320" font-size="13" fill="#444">Bob 需要 total_virtual = 9·qR − diff = T</text>
  <text x="56" y="338" font-size="11" fill="#888">共 qL+qR 个槽，每槽填 0–9，轮流填充</text>

  <!-- Step 4: Bob's complement strategy -->
  <text x="40" y="372" font-size="12" fill="#4a7a3a" font-weight="bold">④ Bob 的互补策略（偶数槽时）</text>
  <rect x="40" y="380" width="540" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="56" y="404" font-size="12" fill="#4a7a3a">Alice 填 d → Bob 填 (9 − d)，每对贡献恰好 9</text>
  <text x="56" y="424" font-size="12" fill="#b85450" font-weight="bold">total = 9 × (qL+qR)/2  ← 平衡值</text>
  <text x="56" y="444" font-size="11" fill="#888">Bob 胜 ⇔ T = 平衡值 ⇔ 9·qR − diff = 9·(qL+qR)/2</text>
  <text x="56" y="460" font-size="11" fill="#b85450" font-weight="bold">⇔ 2·diff = 9·(qR − qL)</text>
</svg>
