<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">差分数组：生命周期 → +1/−1 标记</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">人在 [birth, death−1] 活着，等价于半开区间 [birth, death)</text>

  <!-- Year axis -->
  <line x1="60" y1="210" x2="480" y2="210" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1950</text>
  <text x="470" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2050</text>
  <text x="180" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">birth</text>
  <text x="380" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">death</text>

  <!-- tick marks -->
  <line x1="70" y1="206" x2="70" y2="214" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="180" y1="204" x2="180" y2="216" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="380" y1="204" x2="380" y2="216" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="470" y1="206" x2="470" y2="214" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- lifespan bar: alive from birth to death-1 (ends just before death tick) -->
  <rect x="180" y="120" width="195" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="277" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">存活 [birth, death−1]</text>

  <!-- +1 at birth -->
  <path d="M 180 170 L 180 198" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="155" y="168" width="50" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>

  <!-- -1 at death -->
  <path d="M 380 170 L 380 198" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="355" y="168" width="50" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="184" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- diff array snippet -->
  <text x="40" y="278" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">diff</text>
  <rect x="80" y="258" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="104" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">…</text>
  <rect x="132" y="258" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="156" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="184" y="258" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="208" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="236" y="258" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">…</text>
  <rect x="288" y="258" width="48" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="312" y="278" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="340" y="258" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="364" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="156" y="252" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">birth</text>
  <text x="312" y="252" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">death</text>

  <!-- prefix sum explanation -->
  <path d="M 270 296 L 270 316" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="312" font-size="10" fill="#666" filter="url(#rough2)">前缀和</text>

  <rect x="60" y="318" width="420" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">prefix[y] = Σ diff[1950..y] = 年份 y 的存活人数</text>
  <text x="270" y="356" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每个人只动两个位置，O(1) 更新；一次前缀和扫描还原所有年份人口</text>
</svg>
