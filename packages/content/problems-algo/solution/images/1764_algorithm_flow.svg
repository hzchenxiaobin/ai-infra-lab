<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：贪心逐 group 匹配，指针 i 单调前进</text>

  <!-- Start -->
  <ellipse cx="280" cy="54" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 280 72 L 280 90" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="94" width="260" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">i = 0（nums 指针），k = 0（group 下标）</text>
  <text x="280" y="131" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i 单调递增，已匹配段不可回退</text>

  <path d="M 280 140 L 280 160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: k < n ? -->
  <polygon points="280,164 400,210 280,256 160,210" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">k &lt; groups.length ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">还有 group 未匹配？</text>

  <!-- No → return true -->
  <path d="M 400 210 L 470 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="430" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <ellipse cx="500" cy="210" rx="40" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return</text>
  <text x="500" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- Yes → search loop -->
  <path d="M 280 256 L 280 276" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="270" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Inner search box -->
  <rect x="80" y="280" width="400" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">从 i 起，在 nums 中找 groups[k]</text>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">逐位置 j 比较 nums[j : j+len] == groups[k]</text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">找到则 i = j + len，k++；找不到则返回 false</text>

  <!-- Decision: found? -->
  <path d="M 280 352 L 280 372" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,376 380,412 280,448 180,412" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">找到匹配？</text>

  <!-- No → return false -->
  <path d="M 380 412 L 470 412" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="425" y="404" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <ellipse cx="500" cy="412" rx="40" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="410" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return</text>
  <text x="500" y="424" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- Yes → loop back to k < n check -->
  <path d="M 180 412 L 50 412 L 50 210 L 160 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="170" y="404" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="44" y="316" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i += len</text>
  <text x="44" y="330" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">k += 1</text>
  <text x="44" y="344" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">回到外层</text>
</svg>
