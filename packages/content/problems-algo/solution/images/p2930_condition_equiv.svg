<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：能重排出 “leet” ⇔ 字母配额够</text>

  <!-- left: good string -->
  <rect x="25" y="44" width="232" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="141" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">好字符串 s = “lteer”</text>

  <rect x="77" y="76" width="24" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="89" y="95" text-anchor="middle" font-size="12" fill="#333">l</text>
  <rect x="105" y="76" width="24" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="117" y="95" text-anchor="middle" font-size="12" fill="#333">t</text>
  <rect x="133" y="76" width="24" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="145" y="95" text-anchor="middle" font-size="12" fill="#333">e</text>
  <rect x="161" y="76" width="24" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="173" y="95" text-anchor="middle" font-size="12" fill="#333">e</text>
  <rect x="189" y="76" width="24" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="201" y="95" text-anchor="middle" font-size="12" fill="#333">r</text>

  <path d="M 145 108 L 145 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="77" y="124" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="89" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>
  <rect x="105" y="124" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <rect x="133" y="124" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <rect x="161" y="124" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>
  <rect x="189" y="124" width="24" height="28" fill="#f0f0f0" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="201" y="143" text-anchor="middle" font-size="12" fill="#666">r</text>

  <text x="141" y="170" text-anchor="middle" font-size="10" fill="#555">取 l×1 + e×2 + t×1 排成 leet，缀上 r</text>

  <!-- right: bad string -->
  <rect x="277" y="44" width="218" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="386" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">坏字符串 s = “letl”</text>

  <rect x="326" y="76" width="24" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="338" y="95" text-anchor="middle" font-size="12" fill="#333">l</text>
  <rect x="354" y="76" width="24" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="366" y="95" text-anchor="middle" font-size="12" fill="#333">e</text>
  <rect x="382" y="76" width="24" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="394" y="95" text-anchor="middle" font-size="12" fill="#333">t</text>
  <rect x="410" y="76" width="24" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="422" y="95" text-anchor="middle" font-size="12" fill="#333">l</text>

  <text x="386" y="128" text-anchor="middle" font-size="11" fill="#333">字母核对：</text>
  <text x="386" y="148" text-anchor="middle" font-size="11" fill="#333">l×2 ✓　t×1 ✓</text>
  <text x="386" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">e×1 ✗（需要 ≥2）</text>

  <!-- bottom: equivalence -->
  <rect x="25" y="200" width="470" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">好字符串 ⇔ cnt(l) ≥ 1 且 cnt(t) ≥ 1 且 cnt(e) ≥ 2</text>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#333">重排 = 顺序任意 ⇒ 只看「字母多重集」，与位置无关</text>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#555">必要性：子串 leet 要消耗 l×1、e×2、t×1（重排不增删字符）</text>
  <text x="260" y="300" text-anchor="middle" font-size="10" fill="#555">充分性：达标的字母拼出 leet 放开头，其余随意缀后</text>
  <text x="260" y="326" text-anchor="middle" font-size="10" fill="#888">于是问题变成纯计数：数「三配额同时达标」的字符串</text>
</svg>
