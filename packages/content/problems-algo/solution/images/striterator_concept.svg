<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：不展开，只跟踪 (cur, rem, ptr)</text>

  <!-- Compressed string row -->
  <text x="40" y="74" font-size="13" fill="#4a7a3a" filter="url(#rough2)">压缩串 s：</text>
  <g filter="url(#rough2)">
    <!-- L1e2t1C1o1d1e1 : 16 chars -->
    <rect x="120" y="56" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="134" y="76" text-anchor="middle" font-size="13" fill="#333">L</text>
    <rect x="148" y="56" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="162" y="76" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="176" y="56" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="76" text-anchor="middle" font-size="13" fill="#333">e</text>
    <rect x="204" y="56" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="218" y="76" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="232" y="56" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="246" y="76" text-anchor="middle" font-size="13" fill="#333">t</text>
    <rect x="260" y="56" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="274" y="76" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="288" y="56" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="302" y="76" text-anchor="middle" font-size="13" fill="#333">C</text>
    <rect x="316" y="56" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="330" y="76" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="344" y="56" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="358" y="76" text-anchor="middle" font-size="13" fill="#333">o</text>
    <rect x="372" y="56" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="386" y="76" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="400" y="56" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="414" y="76" text-anchor="middle" font-size="13" fill="#333">d</text>
    <rect x="428" y="56" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="442" y="76" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="456" y="56" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="470" y="76" text-anchor="middle" font-size="13" fill="#333">e</text>
    <rect x="484" y="56" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="498" y="76" text-anchor="middle" font-size="13" fill="#333">1</text>
  </g>
  <!-- ptr marker -->
  <path d="M134,96 L134,106 L458,106 L458,96" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="296" y="122" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ptr 扫过已解析的组</text>

  <!-- Wrong way: expand -->
  <text x="40" y="160" font-size="13" fill="#b85450" filter="url(#rough2)">暴力：全部展开成 "LeeTCod e"（占 O(N) 内存，N 可达 25 万）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="170" width="480" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="60" y="192" font-size="13" fill="#b85450">L e e t C o d e  ←  先花 O(N) 展开再迭代</text>
  </g>

  <!-- Arrow down -->
  <path d="M280,212 L280,232" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right way: state variables -->
  <text x="40" y="258" font-size="13" fill="#4a7a3a" filter="url(#rough2)">懒解析：只存压缩串 + 三个变量</text>
  <g filter="url(#rough2)">
    <rect x="80" y="272" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="140" y="292" text-anchor="middle" font-size="13" fill="#333">cur = 'e'</text>
    <text x="140" y="310" text-anchor="middle" font-size="11" fill="#555">当前正在吐的字符</text>

    <rect x="220" y="272" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="292" text-anchor="middle" font-size="13" fill="#333">rem = 2</text>
    <text x="280" y="310" text-anchor="middle" font-size="11" fill="#555">该字符还剩几次</text>

    <rect x="360" y="272" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="420" y="292" text-anchor="middle" font-size="13" fill="#333">ptr = 4</text>
    <text x="420" y="310" text-anchor="middle" font-size="11" fill="#555">压缩串解析位置</text>
  </g>

  <!-- next() effect -->
  <text x="40" y="348" font-size="13" fill="#333" filter="url(#rough2)">next()：吐出 cur，rem−−；rem 归 0 就从 ptr 处再读一组 (字母+数字)</text>
  <path d="M150,356 L405,356" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">hasNext() 只需判 rem &gt; 0</text>
</svg>
