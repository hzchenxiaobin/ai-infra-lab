<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">观察 1：每个元素二选一 —— 组的价值在闭合瞬间结算</text>

  <!-- closed groups -->
  <text x="44" y="64" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">已闭合 j 组</text>
  <rect x="44" y="74" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="91" text-anchor="middle" font-size="10.5" fill="#3a6230" filter="url(#rough2)">组 1 ✓</text>
  <rect x="112" y="74" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="91" text-anchor="middle" font-size="10.5" fill="#3a6230" filter="url(#rough2)">组 2 ✓</text>
  <text x="186" y="92" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⋯</text>

  <!-- current group -->
  <rect x="36" y="116" width="220" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="136" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">当前第 j+1 组（在建）</text>
  <g filter="url(#rough2)">
    <rect x="52" y="146" width="24" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="82" y="146" width="24" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="112" y="146" width="24" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="142" y="146" width="24" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="172" y="146" width="24" height="24" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="3"/>
  </g>
  <text x="146" y="192" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">累积 AND = and</text>

  <!-- current element -->
  <rect x="300" y="128" width="84" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="342" y="154" text-anchor="middle" font-size="13" fill="#a07818" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="342" y="172" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">当前扫到的元素</text>

  <!-- fork arrows -->
  <path d="M 384 142 C 400 128, 398 100, 416 92" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="388" y="96" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">延伸</text>
  <path d="M 384 174 C 402 190, 402 250, 416 262" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="238" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">闭合</text>

  <!-- extend box -->
  <rect x="416" y="44" width="126" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="479" y="66" text-anchor="middle" font-size="12.5" fill="#3a6230" font-weight="bold" filter="url(#rough2)">① 延伸</text>
  <text x="479" y="84" text-anchor="middle" font-size="10.5" fill="#335" filter="url(#rough2)">留在当前组</text>
  <text x="479" y="101" text-anchor="middle" font-size="10.5" fill="#335" filter="url(#rough2)">and &amp;= nums[i]</text>
  <text x="479" y="118" text-anchor="middle" font-size="10.5" fill="#335" filter="url(#rough2)">不产生贡献</text>
  <text x="479" y="136" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">→ dfs(i+1, j, and)</text>

  <!-- close box -->
  <rect x="416" y="224" width="126" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="479" y="246" text-anchor="middle" font-size="12.5" fill="#a04038" font-weight="bold" filter="url(#rough2)">② 闭合</text>
  <text x="479" y="264" text-anchor="middle" font-size="10.5" fill="#335" filter="url(#rough2)">当组尾，开新组</text>
  <text x="479" y="281" text-anchor="middle" font-size="10.5" fill="#335" filter="url(#rough2)">仅当 and ==</text>
  <text x="479" y="297" text-anchor="middle" font-size="10.5" fill="#335" filter="url(#rough2)">andValues[j]</text>
  <text x="479" y="315" text-anchor="middle" font-size="10.5" fill="#a04038" font-weight="bold" filter="url(#rough2)">值和 += nums[i]</text>
  <text x="479" y="330" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">→ dfs(i+1, j+1, −1)</text>

  <!-- state capsule -->
  <path d="M 146 206 L 146 250" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="156" y="232" font-size="9.5" fill="#888" filter="url(#rough2)">只需记住</text>
  <rect x="36" y="252" width="220" height="52" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="146" y="272" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">记忆化状态</text>
  <text x="146" y="294" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">( i , j , and )</text>

  <!-- bottom note -->
  <rect x="36" y="348" width="488" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">『值 = 最后一个元素』⇒ 代价在闭合瞬间由组尾一步结算</text>
  <text x="280" y="385" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">组内长度 / 最小值 / 元素明细统统不用进状态</text>
</svg>
