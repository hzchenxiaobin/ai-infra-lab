<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序去重 + 缺口遍历 + 等差求和</text>

  <!-- Start -->
  <rect x="210" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="17" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 nums, k</text>
  <path d="M 290 78 L 290 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort + dedupe -->
  <rect x="190" y="98" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">排序 + 去重 nums</text>
  <path d="M 290 132 L 290 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="180" y="152" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">next=1, need=k, sum=0</text>
  <path d="M 290 186 L 290 206" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision: need==0? -->
  <polygon points="290,208 400,252 290,296 180,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">need == 0 ?</text>
  <text x="290" y="262" text-anchor="middle" font-size="10" fill="#888">（已取够 k 个）</text>

  <!-- Yes -> break to final -->
  <path d="M 400 252 L 470 252" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="435" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="472" y="236" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">跳出循环</text>

  <!-- No -> process v -->
  <path d="M 290 296 L 290 314" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="305" y="308" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- compute gap -->
  <rect x="180" y="316" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">gap = v − next （缺口长度）</text>
  <path d="M 290 350 L 290 368" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: gap >= need ? -->
  <polygon points="290,370 410,414 290,458 170,414" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="406" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">gap ≥ need ?</text>
  <text x="290" y="424" text-anchor="middle" font-size="10" fill="#888">（缺口够大）</text>

  <!-- Yes: take need numbers -->
  <path d="M 410 414 L 470 414" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="440" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="472" y="386" width="96" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="520" y="406" text-anchor="middle" font-size="10" fill="#333">sum +=</text>
  <text x="520" y="420" text-anchor="middle" font-size="10" fill="#333">(next+next+need−1)</text>
  <text x="520" y="434" text-anchor="middle" font-size="10" fill="#333">× need / 2</text>
  <text x="520" y="446" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">need = 0</text>

  <!-- No: two sub branches -->
  <!-- gap > 0: take whole gap -->
  <path d="M 170 414 L 110 414" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="406" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否,gap&gt;0</text>
  <rect x="14" y="386" width="96" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="62" y="404" text-anchor="middle" font-size="10" fill="#333">sum +=</text>
  <text x="62" y="418" text-anchor="middle" font-size="10" fill="#333">(next+v−1)</text>
  <text x="62" y="432" text-anchor="middle" font-size="10" fill="#333">× gap / 2</text>
  <text x="62" y="446" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">need−=gap</text>

  <!-- gap==0: skip -->
  <path d="M 290 458 L 290 476" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="320" y="472" font-size="10" fill="#b85450" font-weight="bold">gap==0</text>
  <rect x="210" y="478" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="496" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过 v（v 在 nums 中）</text>

  <!-- next = v + 1 then loop back -->
  <path d="M 62 446 L 62 510 L 290 510 L 290 514" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 504 L 470 504 L 470 442" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="498" text-anchor="middle" font-size="10" fill="#446688">next = v+1</text>
  <text x="490" y="512" text-anchor="middle" font-size="10" fill="#446688">回到循环</text>

  <!-- Final: after loop need>0? -->
  <path d="M 510 268 L 510 282 L 290 282" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- After loop box -->
  <rect x="180" y="514" width="220" height="0" fill="none"/>

  <!-- note bottom -->
  <text x="290" y="532" text-anchor="middle" font-size="10" fill="#888">遍历结束后若 need&gt;0，末尾缺口取 next..next+need−1（公式同「是」分支）</text>
</svg>
