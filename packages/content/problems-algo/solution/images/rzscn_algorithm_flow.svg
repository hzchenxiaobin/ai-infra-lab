<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：两遍扫描</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">第一遍建映射（存最后节点），第二遍跳过零和段</text>

  <!-- ===== 第一遍 ===== -->
  <rect x="20" y="56" width="520" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="34" y="80" font-size="12" fill="#446688" font-weight="bold">第一遍：构建 prefix → 最后节点的映射</text>
  <text x="34" y="102" font-size="11" fill="#444">① dummy = ListNode(0, head);  curr = dummy;  prefix = 0</text>
  <text x="34" y="124" font-size="11" fill="#b85450" font-weight="bold">② map[prefix] = curr    ← 覆盖！保留最后出现的节点</text>
  <text x="34" y="146" font-size="11" fill="#444">③ curr = curr.next;  prefix += curr.val</text>
  <text x="34" y="168" font-size="11" fill="#444">④ 重复 ②③ 直到 curr == null</text>

  <!-- arrow down -->
  <path d="M 280 190 L 280 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 第二遍 ===== -->
  <rect x="20" y="210" width="520" height="162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="34" y="234" font-size="12" fill="#8a6a20" font-weight="bold">第二遍：扫描并跳过零和段</text>
  <text x="34" y="256" font-size="11" fill="#444">① curr = dummy;  prefix = 0</text>
  <text x="34" y="278" font-size="11" fill="#444">② 查 map[prefix]</text>
  <text x="34" y="300" font-size="11" fill="#444">③ 若 map[prefix] != curr：</text>
  <text x="54" y="320" font-size="11" fill="#b85450" font-weight="bold">curr.next = map[prefix].next    ← 一跳删去零和段！</text>
  <text x="34" y="342" font-size="11" fill="#444">④ curr = curr.next;  prefix += curr.val</text>
  <text x="34" y="364" font-size="11" fill="#444">⑤ 重复 ②③④ 直到 curr == null，返回 dummy.next</text>

  <!-- ===== 关键洞察 ===== -->
  <rect x="20" y="384" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">删去零和段后后续节点前缀和不变 → 两遍扫描一次性完成全部删除</text>
</svg>
