<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：word = "abcc"，逐个字母试删</text>

  <!-- ====== table header ====== -->
  <rect x="30" y="40" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="59" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">试删字母</text>
  <rect x="130" y="40" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="59" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">剩余频率（非零）</text>
  <rect x="360" y="40" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="59" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">频率集合</text>
  <rect x="440" y="40" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="59" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">判定</text>

  <!-- ====== Row 1: 删 a ====== -->
  <text x="80" y="92" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>
  <!-- freq a:0(drop) b:1 c:2 -->
  <rect x="138" y="78" width="50" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="96" text-anchor="middle" font-size="11" fill="#bbb">a:0</text>
  <rect x="196" y="78" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221" y="96" text-anchor="middle" font-size="11.5" fill="#333">b:1</text>
  <rect x="254" y="78" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="96" text-anchor="middle" font-size="11.5" fill="#333">c:2</text>
  <rect x="360" y="78" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="96" text-anchor="middle" font-size="12" fill="#333">{1, 2}</text>
  <text x="480" y="97" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <path d="M 30 112 L 520 112" stroke="#eee" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ====== Row 2: 删 b ====== -->
  <text x="80" y="136" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">b</text>
  <rect x="138" y="122" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="140" text-anchor="middle" font-size="11.5" fill="#333">a:1</text>
  <rect x="196" y="122" width="50" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="140" text-anchor="middle" font-size="11" fill="#bbb">b:0</text>
  <rect x="254" y="122" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="140" text-anchor="middle" font-size="11.5" fill="#333">c:2</text>
  <rect x="360" y="122" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="140" text-anchor="middle" font-size="12" fill="#333">{1, 2}</text>
  <text x="480" y="141" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <path d="M 30 156 L 520 156" stroke="#eee" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ====== Row 3: 删 c (命中) ====== -->
  <text x="80" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="138" y="166" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="163" y="184" text-anchor="middle" font-size="11.5" fill="#333">a:1</text>
  <rect x="196" y="166" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="221" y="184" text-anchor="middle" font-size="11.5" fill="#333">b:1</text>
  <rect x="254" y="166" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="279" y="184" text-anchor="middle" font-size="11.5" fill="#333">c:1</text>
  <rect x="360" y="166" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{1}</text>
  <text x="480" y="185" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- highlight box around row 3 -->
  <rect x="32" y="162" width="490" height="36" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>

  <!-- arrow to result -->
  <path d="M 270 200 L 270 224" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="150" y="228" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">删一个 c → {1,1,1} 全部为 1 → return true</text>

  <!-- ====== bottom summary ====== -->
  <rect x="30" y="284" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="305" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">关键：删同一字母的任一出现，结果频率多重集相同</text>
  <text x="270" y="323" text-anchor="middle" font-size="10.5" fill="#555">故只对 a、b、c 三类各试一次（≤26 次），不必逐下标试 100 次</text>
  <text x="270" y="340" text-anchor="middle" font-size="10.5" fill="#888">每次删后扫描 26 个桶收集非零频率，判集合大小是否为 1，整体 O(n + 26²) = O(n)</text>
</svg>
