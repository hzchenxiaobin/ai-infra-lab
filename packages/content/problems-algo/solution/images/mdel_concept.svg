<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">核心观察：删前缀后剩余恒为原串后缀</text>

  <!-- index header -->
  <g font-size="11" fill="#888" filter="url(#rough2)">
    <text x="129" y="56" text-anchor="middle">0</text>
    <text x="167" y="56" text-anchor="middle">1</text>
    <text x="205" y="56" text-anchor="middle">2</text>
    <text x="243" y="56" text-anchor="middle">3</text>
    <text x="281" y="56" text-anchor="middle">4</text>
    <text x="319" y="56" text-anchor="middle">5</text>
    <text x="357" y="56" text-anchor="middle">6</text>
    <text x="395" y="56" text-anchor="middle">7</text>
    <text x="433" y="56" text-anchor="middle">8</text>
    <text x="471" y="56" text-anchor="middle">9</text>
  </g>

  <!-- top row: abcabcdabc, prefix i=3 (0..2) blue, next i=3 (3..5) green -->
  <g filter="url(#rough2)">
    <rect x="110" y="66" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="148" y="66" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="186" y="66" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="224" y="66" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="262" y="66" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="300" y="66" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="338" y="66" width="38" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="376" y="66" width="38" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="414" y="66" width="38" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="452" y="66" width="38" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="16" fill="#333" filter="url(#rough2)">
    <text x="129" y="90" text-anchor="middle">a</text>
    <text x="167" y="90" text-anchor="middle">b</text>
    <text x="205" y="90" text-anchor="middle">c</text>
    <text x="243" y="90" text-anchor="middle">a</text>
    <text x="281" y="90" text-anchor="middle">b</text>
    <text x="319" y="90" text-anchor="middle">c</text>
    <text x="357" y="90" text-anchor="middle">d</text>
    <text x="395" y="90" text-anchor="middle">a</text>
    <text x="433" y="90" text-anchor="middle">b</text>
    <text x="471" y="90" text-anchor="middle">c</text>
  </g>

  <!-- brackets: s[0:3] == s[3:6] -->
  <path d="M110 112 L110 120 L224 120 L224 112" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M224 112 L224 120 L338 120 L338 112" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="138" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">前 i=3 个</text>
  <text x="281" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">接下来 i=3 个</text>
  <text x="224" y="138" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">==</text>

  <!-- arrow: delete first 3 -> remaining suffix s[3:] -->
  <path d="M224 144 L224 172" stroke="#b85450" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="244" y="162" font-size="12" fill="#b85450" filter="url(#rough2)">删前 i 个</text>

  <!-- second row: remaining = s[3:] = abcdabc -->
  <g filter="url(#rough2)">
    <rect x="150" y="178" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="188" y="178" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="226" y="178" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="264" y="178" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="302" y="178" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="340" y="178" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="378" y="178" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="16" fill="#333" filter="url(#rough2)">
    <text x="169" y="202" text-anchor="middle">a</text>
    <text x="207" y="202" text-anchor="middle">b</text>
    <text x="245" y="202" text-anchor="middle">c</text>
    <text x="283" y="202" text-anchor="middle">d</text>
    <text x="321" y="202" text-anchor="middle">a</text>
    <text x="359" y="202" text-anchor="middle">b</text>
    <text x="397" y="202" text-anchor="middle">c</text>
  </g>
  <text x="430" y="202" font-size="12" fill="#d6a040" filter="url(#rough2)">= s[3:]（原串后缀）</text>

  <!-- insight box 1 -->
  <rect x="40" y="238" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="265" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">每步只删前缀 → 剩余串恒为原串后缀 s[l:] → 状态只需左端点 l</text>

  <!-- insight box 2 -->
  <rect x="40" y="292" width="520" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="313" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">转移： f(l) = max( 1 , max{ 1 + f(l+i) : s[l:l+i] == s[l+i:2i] } )</text>
  <text x="300" y="332" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">（1 = 选项 A 删整个后缀；枚举合法 i = 选项 B 删前缀）</text>
</svg>
