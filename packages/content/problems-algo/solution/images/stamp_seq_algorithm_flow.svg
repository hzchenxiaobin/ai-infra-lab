<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 640" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="640" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">戳印序列算法流程：BFS 拓扑排序</text>

  <!-- Box1: preprocess todo & affected -->
  <rect x="120" y="40" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="60" text-anchor="middle" font-size="12" fill="#333">枚举窗口 i ∈ [0, n−m]</text>
  <text x="290" y="76" text-anchor="middle" font-size="11" fill="#888">target[i+j]≠stamp[j] → 加入 todo[i]、affected[p]</text>
  <line x1="290" y1="84" x2="290" y2="102" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: init queue -->
  <rect x="120" y="104" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="129" text-anchor="middle" font-size="12" fill="#333">todo[i] 为空的窗口入队（全匹配，可立即撤销）</text>
  <line x1="290" y1="144" x2="290" y2="162" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: queue empty? -->
  <polygon points="290,164 376,206 290,248 204,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="202" text-anchor="middle" font-size="12" fill="#333">队列为空?</text>
  <text x="290" y="218" text-anchor="middle" font-size="10" fill="#888">BFS 结束?</text>
  <!-- 是 -> down to check all made -->
  <text x="304" y="266" font-size="10" fill="#4a7a3a">是</text>
  <line x1="290" y1="248" x2="290" y2="272" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 否 -> loop back right side -->
  <line x1="376" y1="206" x2="430" y2="206" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="200" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="430" y="190" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="212" text-anchor="middle" font-size="11" fill="#333">取出窗口 i</text>

  <!-- from 取出窗口 i down then left to erase loop -->
  <line x1="490" y1="224" x2="490" y2="286" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="490" y1="286" x2="446" y2="286" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box3: erase matched positions -->
  <rect x="100" y="272" width="346" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="273" y="292" text-anchor="middle" font-size="12" fill="#333">消除窗口 i 内「匹配且非?」的位置 p</text>
  <text x="273" y="308" text-anchor="middle" font-size="11" fill="#888">made[p]=true；遍历 affected[p] 通知被阻塞窗口</text>
  <line x1="273" y1="316" x2="273" y2="334" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box4: update todo -->
  <rect x="100" y="336" width="346" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="273" y="356" text-anchor="middle" font-size="12" fill="#333">从 todo[w] 删除 p</text>
  <text x="273" y="372" text-anchor="middle" font-size="11" fill="#888">todo[w] 变空且未处理 → 入队 w</text>
  <line x1="273" y1="380" x2="273" y2="398" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: progressed? -->
  <polygon points="273,400 343,438 273,476 203,438" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="273" y="436" text-anchor="middle" font-size="12" fill="#333">有进展?</text>
  <text x="273" y="452" text-anchor="middle" font-size="10" fill="#888">消除≥1位?</text>
  <!-- 是 -> record i -->
  <line x1="343" y1="438" x2="398" y2="438" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="432" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="398" y="422" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="473" y="444" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans 记录 i</text>
  <!-- 否 -> skip -->
  <text x="287" y="494" font-size="10" fill="#b85450">否</text>
  <line x1="273" y1="476" x2="273" y2="494" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="496" width="146" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="273" y="515" text-anchor="middle" font-size="11" fill="#b85450">跳过（冗余盖印）</text>

  <!-- loop back: from record i / skip back up to queue check -->
  <line x1="473" y1="456" x2="473" y2="540" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="273" y1="524" x2="273" y2="540" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="273" y1="540" x2="473" y2="540" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="540" y1="540" x2="540" y2="206" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="540" y1="206" x2="552" y2="206" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="546" y="374" text-anchor="middle" font-size="9" fill="#888" transform="rotate(90 546 374)">继续循环</text>

  <!-- after queue empty: check all made -->
  <rect x="120" y="276" width="0" height="0" fill="none"/>
  <!-- (placeholder removed) -->

  <!-- final check diamond at bottom -->
  <polygon points="290,560 380,598 290,636 200,598" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="596" text-anchor="middle" font-size="12" fill="#333">所有位消除?</text>
  <text x="290" y="612" text-anchor="middle" font-size="10" fill="#888">made 全 true?</text>
  <!-- 是 -> reverse ans -->
  <line x1="380" y1="598" x2="430" y2="598" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="592" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="430" y="582" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="495" y="604" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">逆序返回 ans</text>
  <!-- 否 -> return [] -->
  <line x1="200" y1="598" x2="150" y2="598" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="174" y="592" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="20" y="582" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="604" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return []</text>
</svg>
