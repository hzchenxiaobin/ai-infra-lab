<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：全括号函数式 = 二叉表达式树，")" 触发归约</text>
  <text x="260" y="40" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">div(mul(4,sub(9,5<tspan fill="#b85450" font-weight="bold" font-size="13">)</tspan>)),add(1,1))</text>

  <!-- ============ 左侧：表达式树 ============ -->
  <text x="150" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">表达式树（分治视角）</text>

  <!-- 树的连线 -->
  <line x1="140" y1="93" x2="95" y2="135" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="170" y1="93" x2="218" y2="135" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="74" y1="161" x2="54" y2="204" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="96" y1="161" x2="120" y2="202" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="117" y1="228" x2="106" y2="259" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="139" y1="228" x2="160" y2="259" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="217" y1="161" x2="198" y2="204" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="239" y1="161" x2="256" y2="204" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 根 div -->
  <rect x="133" y="67" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="155" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">div</text>
  <text x="181" y="82" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">=8</text>
  <text x="129" y="82" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">④</text>

  <!-- 内节点 mul / add / sub -->
  <rect x="63" y="135" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="85" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mul</text>
  <text x="111" y="150" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">=16</text>
  <text x="59" y="150" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">②</text>

  <rect x="206" y="135" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="228" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">add</text>
  <text x="254" y="150" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">=2</text>
  <text x="202" y="150" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">③</text>

  <rect x="106" y="202" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="128" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sub</text>
  <text x="154" y="217" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">=4</text>
  <text x="102" y="217" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">①</text>

  <!-- 叶子（字面量） -->
  <rect x="40" y="204" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="11" filter="url(#rough2)"/>
  <text x="52" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="184" y="204" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="11" filter="url(#rough2)"/>
  <text x="196" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="250" y="204" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="11" filter="url(#rough2)"/>
  <text x="262" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="90" y="259" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="11" filter="url(#rough2)"/>
  <text x="102" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="154" y="259" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="11" filter="url(#rough2)"/>
  <text x="166" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="150" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">①~④ = 归约（自底向上合并）顺序</text>

  <!-- ============ 右侧：双栈快照 ============ -->
  <text x="405" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">扫描至第 1 个 ")" 时的双栈</text>

  <rect x="300" y="64" width="202" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="401" y="84" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">归约：弹 sub + 9、5 → sub(9,5)=4 压回</text>

  <!-- ops 栈 -->
  <rect x="312" y="116" width="60" height="96" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="314" y="118" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="136" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">sub</text>
  <rect x="314" y="146" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">mul</text>
  <rect x="314" y="174" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="192" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">div</text>
  <text x="342" y="228" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">ops</text>

  <!-- nums 栈 -->
  <rect x="422" y="116" width="60" height="96" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="424" y="118" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="452" y="136" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="424" y="146" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="452" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="424" y="174" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="452" y="192" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="452" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">nums</text>

  <!-- 红框即栈顶：弹栈箭头 -->
  <path d="M 342 114 L 342 100" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 452 114 L 452 100" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="397" y="110" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">栈顶</text>

  <!-- 弹序说明 -->
  <text x="405" y="248" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">先弹 5 = 第二参数</text>
  <text x="405" y="263" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">后弹 9 = 第一参数</text>
  <text x="405" y="278" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">sub(9,5) = 9 − 5 = 4</text>

  <!-- ============ 底部要点框 ============ -->
  <rect x="16" y="300" width="488" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="28" y="318" font-size="10" fill="#333" filter="url(#rough2)">① 全括号 ⇒ 结构显式写死，无优先级议题（对比 224/227 中缀式须优先级栈）</text>
  <text x="28" y="335" font-size="10" fill="#333" filter="url(#rough2)">② ")" 宣告最近函数两参凑齐：弹 1 函数 + 2 操作数算完压回——与 150 逆波兰同骨架</text>
  <text x="28" y="352" font-size="10" fill="#333" filter="url(#rough2)">③ 先弹的是第二参数：sub(9,5)=4 而非 5−9；div 同理不可交换</text>
</svg>
