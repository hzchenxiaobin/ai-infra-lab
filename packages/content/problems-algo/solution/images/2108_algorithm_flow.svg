<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：外层遍历 + 内层双指针判回文</text>

  <!-- Start -->
  <rect x="220" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始：遍历 words</text>
  <path d="M 280 80 L 280 98" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Get next word w -->
  <rect x="200" y="100" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#333">取下一个词 w</text>
  <path d="M 280 142 L 280 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check end of array (diamond) -->
  <polygon points="280,160 360,196 280,232 200,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#333">还有词?</text>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#333">否 / 是</text>

  <!-- No: return "" -->
  <path d="M 200 196 L 110 196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="155" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="180" width="68" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="74" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ""</text>

  <!-- Yes: go to palindrome check -->
  <path d="M 280 232 L 280 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="244" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Init l, r -->
  <rect x="200" y="252" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#333">l = 0, r = len(w) − 1</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#333">ok = true</text>
  <path d="M 280 294 L 280 312" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- While l < r diamond -->
  <polygon points="280,314 360,348 280,382 200,348" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#333">l &lt; r ?</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#333">且 ok ?</text>

  <!-- Yes: compare chars -->
  <path d="M 360 348 L 430 348" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="320" width="110" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="485" y="342" text-anchor="middle" font-size="10" fill="#333">w[l] != w[r] ?</text>
  <text x="485" y="358" text-anchor="middle" font-size="9" fill="#b85450">不等 → ok=false</text>
  <text x="485" y="370" text-anchor="middle" font-size="9" fill="#4a7a3a">等 → l++, r−−</text>
  <!-- loop back to while -->
  <path d="M 485 320 L 485 300 L 280 300 L 280 314" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No: exit while, check ok -->
  <path d="M 280 382 L 280 398" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="394" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- ok? diamond -->
  <polygon points="280,400 360,424 280,448 200,424" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#333">ok ?（是回文）</text>

  <!-- Yes: return w -->
  <path d="M 360 424 L 430 424" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="416" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="408" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="429" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return w</text>
  <text x="480" y="460" text-anchor="middle" font-size="9" fill="#4a7a3a">命中即返回（短路）</text>

  <!-- No: loop back to next word -->
  <path d="M 200 424 L 130 424 L 130 120 L 200 120" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="416" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否</text>
  <text x="118" y="270" text-anchor="middle" font-size="9" fill="#888">取下一个词</text>
</svg>
