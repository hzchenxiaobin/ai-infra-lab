<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针归并：谁先结束谁先走</text>

  <!-- firstList label -->
  <text x="36" y="68" font-size="12" fill="#446688" font-weight="bold">A[i]:</text>

  <!-- firstList intervals: [0,2] [5,10] [13,23] [24,25] -->
  <!-- positions: x = start*4 + 60, width = (end-start)*4 -->
  <rect x="60" y="54" width="8" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="80" y="54" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="112" y="54" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="156" y="54" width="4" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <!-- labels for A intervals -->
  <text x="64" y="50" font-size="9" fill="#888">0</text>
  <text x="72" y="50" font-size="9" fill="#888">2</text>
  <text x="80" y="50" font-size="9" fill="#888">5</text>
  <text x="100" y="50" font-size="9" fill="#888">10</text>
  <text x="112" y="50" font-size="9" fill="#888">13</text>
  <text x="144" y="50" font-size="9" fill="#888">23</text>
  <text x="156" y="50" font-size="9" fill="#888">24</text>
  <text x="160" y="50" font-size="9" fill="#888">25</text>

  <!-- secondList label -->
  <text x="36" y="104" font-size="12" fill="#4a7a3a" font-weight="bold">B[j]:</text>

  <!-- secondList intervals: [1,5] [8,12] [15,24] [25,26] -->
  <rect x="64" y="90" width="16" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="92" y="90" width="16" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="120" y="90" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="90" width="4" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <!-- intersection highlight: [1,2] -->
  <rect x="64" y="54" width="8" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)" opacity="0.7"/>
  <rect x="64" y="90" width="8" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)" opacity="0.7"/>

  <!-- pointer i -->
  <path d="M 64 44 L 64 50" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="56" y="40" font-size="11" fill="#446688" font-weight="bold">i</text>

  <!-- pointer j -->
  <path d="M 64 80 L 64 86" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="56" y="84" font-size="11" fill="#4a7a3a" font-weight="bold">j</text>

  <!-- Divider -->
  <path d="M 30 130 L 530 130" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula section -->
  <text x="280" y="156" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">每步操作</text>

  <!-- Step 1: compute intersection -->
  <rect x="60" y="172" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="193" text-anchor="middle" font-size="12" fill="#444">① lo = max(A[i].start, B[j].start), hi = min(A[i].end, B[j].end)</text>

  <!-- Step 2: if lo <= hi -->
  <rect x="60" y="212" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="12" fill="#444">② 若 lo ≤ hi，交集 [lo, hi] 非空，加入结果</text>

  <!-- Step 3: advance pointer -->
  <rect x="60" y="252" width="440" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="273" text-anchor="middle" font-size="12" fill="#444">③ A[i].end &lt; B[j].end → i++; 否则 j++</text>

  <!-- Bottom explanation -->
  <rect x="40" y="302" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为什么让「结束早的」先走？</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#666">右端小的区间已用完——对方后续区间起始更大，不可能再相交</text>
</svg>
