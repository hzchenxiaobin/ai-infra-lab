<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：全覆盖路径 +「下一站」闸门</text>

  <!-- 示例 1 网格（2x3） -->
  <g filter="url(#rough2)">
    <text x="145" y="54" text-anchor="middle" font-size="11" fill="#b85450">起点：值 ∈ {0, 1} 的任意格子</text>

    <rect x="64" y="64" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="118" y="64" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="172" y="64" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="64" y="118" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="118" y="118" width="54" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="172" y="118" width="54" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>

    <text x="91" y="98" text-anchor="middle" font-size="16" fill="#446688">0</text>
    <text x="145" y="98" text-anchor="middle" font-size="16" fill="#446688">0</text>
    <text x="199" y="98" text-anchor="middle" font-size="16" fill="#446688">0</text>
    <text x="91" y="152" text-anchor="middle" font-size="16" fill="#446688">0</text>
    <text x="145" y="152" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a3a">1</text>
    <text x="199" y="152" text-anchor="middle" font-size="17" font-weight="bold" fill="#a07818">2</text>

    <!-- 路径箭头（跨共享边） -->
    <path d="M 91 107 L 91 127" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <path d="M 109 145 L 127 145" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <path d="M 163 145 L 181 145" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <path d="M 199 127 L 199 107" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <path d="M 190 91 L 172 91" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>

    <!-- 步骤徽章 -->
    <circle cx="73" cy="73" r="9" fill="#b85450"/>
    <circle cx="73" cy="127" r="9" fill="#b85450"/>
    <circle cx="127" cy="127" r="9" fill="#b85450"/>
    <circle cx="181" cy="127" r="9" fill="#b85450"/>
    <circle cx="181" cy="73" r="9" fill="#b85450"/>
    <circle cx="127" cy="73" r="9" fill="#b85450"/>
    <text x="73" y="76.5" text-anchor="middle" font-size="10" fill="#fff">1</text>
    <text x="73" y="130.5" text-anchor="middle" font-size="10" fill="#fff">2</text>
    <text x="127" y="130.5" text-anchor="middle" font-size="10" fill="#fff">3</text>
    <text x="181" y="130.5" text-anchor="middle" font-size="10" fill="#fff">4</text>
    <text x="181" y="76.5" text-anchor="middle" font-size="10" fill="#fff">5</text>
    <text x="127" y="76.5" text-anchor="middle" font-size="10" fill="#fff">6</text>

    <text x="145" y="196" text-anchor="middle" font-size="11" fill="#666">示例 1：6 格全部恰好走到，1 → 2 依序踩中</text>
  </g>

  <path d="M 230 130 C 246 130, 252 130, 264 130" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 右侧三条规则 -->
  <g filter="url(#rough2)">
    <rect x="268" y="50" width="238" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="70" font-size="12.5" fill="#446688" font-weight="bold">「覆盖」= 每格恰好一次</text>
    <text x="280" y="88" font-size="11" fill="#333">一条哈密顿路径走遍全网格，</text>
    <text x="280" y="102" font-size="11" fill="#333">path 长度 = m×n 即刻收工</text>

    <rect x="268" y="120" width="238" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="140" font-size="12.5" fill="#a07818" font-weight="bold">「顺序」= 1 → 2 → … → k</text>
    <text x="280" y="158" font-size="11" fill="#333">编号格只许按序踏入，</text>
    <text x="280" y="172" font-size="11" fill="#333">0 格可随时自由穿插</text>

    <rect x="268" y="190" width="238" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="210" font-size="12.5" fill="#4a7a3a" font-weight="bold">「下一站」v：状态只要一个整数</text>
    <text x="280" y="228" font-size="11" fill="#333">邻居值 ∈ {0, v} 才放行；</text>
    <text x="280" y="242" font-size="11" fill="#333">踩中 v ⇒ v ← v+1，</text>
    <text x="280" y="256" font-size="11" fill="#333">无须记录「已踩编号集合」</text>
  </g>

  <!-- 底部：邻居分类速查 -->
  <g filter="url(#rough2)">
    <text x="260" y="294" text-anchor="middle" font-size="12.5" fill="#333">DFS 每一步只看邻居属于哪一类：</text>

    <rect x="58" y="306" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="78" y="332" text-anchor="middle" font-size="14" fill="#4a7a3a">0</text>
    <text x="78" y="366" text-anchor="middle" font-size="10.5" fill="#333">✓ 自由通行</text>

    <rect x="178" y="306" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="198" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07818">v</text>
    <text x="198" y="366" text-anchor="middle" font-size="10.5" fill="#333">✓ 下一站：v+1</text>

    <rect x="298" y="306" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="318" y="332" text-anchor="middle" font-size="14" fill="#b85450">3</text>
    <text x="318" y="366" text-anchor="middle" font-size="10.5" fill="#333">✗ 不是下一站</text>

    <rect x="418" y="306" width="40" height="40" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.6"/>
    <text x="438" y="333" text-anchor="middle" font-size="14" fill="#999999">•</text>
    <text x="438" y="366" text-anchor="middle" font-size="10.5" fill="#333">✗ 已访问（回头路）</text>
  </g>
</svg>
