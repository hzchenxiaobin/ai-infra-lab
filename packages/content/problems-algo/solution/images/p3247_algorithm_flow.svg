<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，两个计数器</text>

  <!-- 开始 -->
  <rect x="175" y="42" width="170" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">even = 1（空），odd = 0</text>
  <path d="M 260 76 L 260 94" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="175" y="96" width="170" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">取下一个元素 x</text>
  <path d="M 260 126 L 260 144" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,146 336,176 260,206 184,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="181" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">x 是奇数？</text>

  <!-- 左分支：偶 -->
  <path d="M 184 176 L 118 176 L 118 232" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="168" font-size="10" fill="#666" filter="url(#rough2)">否（偶）</text>
  <rect x="30" y="234" width="176" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="252" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">even ← 2·even (mod p)</text>
  <text x="118" y="270" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">odd ← 2·odd (mod p)</text>

  <!-- 右分支：奇 -->
  <path d="M 336 176 L 402 176 L 402 232" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="168" font-size="10" fill="#666" filter="url(#rough2)">是（奇）</text>
  <rect x="314" y="234" width="176" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="261" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">even ← odd ← even+odd (mod p)</text>

  <!-- 汇合 -->
  <path d="M 118 278 L 118 306 L 244 306" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 402 278 L 402 306 L 276 306" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判断 -->
  <polygon points="260,292 320,320 260,348 200,320" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">还有元素？</text>

  <!-- 回边 -->
  <path d="M 200 320 L 82 320 L 82 111 L 173 111" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="76" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 76 216)" filter="url(#rough2)">是，继续</text>

  <!-- 输出 -->
  <path d="M 320 320 L 430 320" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="312" font-size="10" fill="#666" filter="url(#rough2)">否</text>
  <rect x="432" y="304" width="70" height="32" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="467" y="325" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">返回 odd</text>
</svg>
