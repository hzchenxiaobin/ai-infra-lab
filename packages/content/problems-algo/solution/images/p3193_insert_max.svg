<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：插入「当前最大值」，右边有几个更小值，就新增几个逆序对</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">已放置 1 0 2（值 0/1/2 各就各位），现在轮到 3 —— 它比谁都大</text>

  <text x="130" y="54" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k=3</text>
  <text x="202" y="54" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k=2</text>
  <text x="262" y="54" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k=1</text>
  <text x="334" y="54" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k=0</text>
  <line x1="130" y1="60" x2="130" y2="82" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <line x1="202" y1="60" x2="202" y2="82" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <line x1="262" y1="60" x2="262" y2="82" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <line x1="334" y1="60" x2="334" y2="82" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="150" y="88" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="114" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="210" y="88" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="114" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">0</text>
  <rect x="270" y="88" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="114" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">2</text>

  <text x="60" y="152" font-size="11" fill="#555" filter="url(#rough2)">例如：插在最前面（k = 3）</text>

  <path d="M 212 168 C 212 146, 270 146, 270 168" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 212 168 C 212 132, 328 132, 328 168" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 212 168 C 212 118, 386 118, 386 168" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">新增 3 个逆序对</text>

  <rect x="190" y="168" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="194" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="248" y="168" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="194" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="306" y="168" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="194" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">0</text>
  <rect x="364" y="168" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="194" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">2</text>

  <rect x="36" y="232" width="448" height="126" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">一次插入 = 选一个「右侧更小值的个数」 k</text>
  <text x="260" y="278" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">插入位置共 i 个 ⇔ k ∈ {0, 1, …, i−1}，每个 k 恰对应一个空位</text>
  <text x="260" y="300" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">新值是当前最大 ⇒ 右侧每个更小值都和它构成逆序对 ⇒ 恰新增 k 个</text>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i][j] = dp[i−1][j] + dp[i−1][j−1] + … + dp[i−1][j−i+1]</text>
  <text x="260" y="346" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（插入序列与排列一一对应：不重不漏的精确计数，即 Mahonian 递推）</text>
</svg>
