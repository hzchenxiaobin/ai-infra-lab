<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">K 次串联：最大子数组的三种形态</text>

  <!-- ===== Top strip: k=5 copies of arr ===== -->
  <text x="40" y="54" font-size="11" fill="#888" filter="url(#rough2)">串联后数组（k = 5 份）：</text>
  <!-- 5 segments, x from 40 to 520, each 96 wide -->
  <rect x="40"  y="62" width="96" height="34" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="62" width="96" height="34" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="62" width="96" height="34" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="328" y="62" width="96" height="34" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="424" y="62" width="96" height="34" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88"  y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">arr₁</text>
  <text x="184" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">arr₂</text>
  <text x="280" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">arr₃</text>
  <text x="376" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">arr₄</text>
  <text x="472" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">arr₅</text>

  <!-- segment number ticks -->
  <text x="88"  y="110" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">第0份</text>
  <text x="184" y="110" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">第1份</text>
  <text x="280" y="110" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">第2份</text>
  <text x="376" y="110" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">第3份</text>
  <text x="472" y="110" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">第4份</text>

  <!-- ===== Form A: interior of one copy ===== -->
  <rect x="40" y="136" width="480" height="20" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="252" y="134" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="150" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">形态 A</text>
  <text x="200" y="174" font-size="11" fill="#4a7a3a" filter="url(#rough2)">单份内部 → kadane(arr)</text>

  <!-- ===== Form B: suffix + prefix across two copies ===== -->
  <rect x="40" y="194" width="480" height="20" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="284" y="192" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="208" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">形态 B</text>
  <text x="160" y="232" font-size="11" fill="#446688" filter="url(#rough2)">跨界两份 → maxSuffix + maxPrefix = kadane(arr∥arr)</text>

  <!-- ===== Form C: suffix + (k-2) full copies + prefix ===== -->
  <rect x="40" y="252" width="480" height="20" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- end of seg1 -->
  <rect x="100" y="250" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- full middle copies seg2-4 -->
  <rect x="136" y="250" width="288" height="24" fill="#fff3c4" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- start of seg5 -->
  <rect x="424" y="250" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="266" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">形态 C</text>
  <text x="280" y="244" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">↑ 吞 (k−2) 份整份：+(k−2)·sum</text>
  <text x="180" y="292" font-size="11" fill="#d6a040" filter="url(#rough2)">跨界 ≥3 份 → maxSuffix + (k−2)·sum + maxPrefix</text>

  <!-- ===== Conclusion box ===== -->
  <rect x="40" y="312" width="480" height="44" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">kadane₂ = kadane(arr∥arr) = max(形态A, 形态B)</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">sum &gt; 0 时 形态C = kadane₂ + (k−2)·sum 且最优</text>

  <!-- Footnote -->
  <rect x="40" y="366" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠️ sum ≤ 0 时整份贡献非正，形态 C 退化，直接用 kadane₂</text>
</svg>
