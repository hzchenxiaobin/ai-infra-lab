<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：10 行按 class 分 4 桶，Math 去重计数 6 通过</text>

  <!-- Courses table (left) -->
  <text x="100" y="50" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Courses（10 行）</text>
  <rect x="20" y="56" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="72" font-size="9" fill="#333">student</text>
  <text x="115" y="72" font-size="9" fill="#b85450">class</text>
  <line x1="80" y1="56" x2="80" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="80" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="45" y="94" font-size="9" fill="#333">A</text>
  <text x="115" y="94" font-size="9" fill="#b85450" font-weight="bold">Math</text>
  <line x1="80" y1="80" x2="80" y2="100" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="100" width="160" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="114" font-size="9" fill="#333">B</text>
  <text x="115" y="114" font-size="9" fill="#446688">English</text>
  <line x1="80" y1="100" x2="80" y2="120" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="120" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="45" y="134" font-size="9" fill="#333">C</text>
  <text x="115" y="134" font-size="9" fill="#b85450" font-weight="bold">Math</text>
  <line x1="80" y1="120" x2="80" y2="140" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="140" width="160" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="154" font-size="9" fill="#333">D</text>
  <text x="115" y="154" font-size="9" fill="#446688">Biology</text>
  <line x1="80" y1="140" x2="80" y2="160" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="160" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="45" y="174" font-size="9" fill="#333">E</text>
  <text x="115" y="174" font-size="9" fill="#b85450" font-weight="bold">Math</text>
  <line x1="80" y1="160" x2="80" y2="180" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="180" width="160" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="194" font-size="9" fill="#333">F</text>
  <text x="115" y="194" font-size="9" fill="#446688">Computer</text>
  <line x1="80" y1="180" x2="80" y2="200" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="200" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="45" y="214" font-size="9" fill="#333">G</text>
  <text x="115" y="214" font-size="9" fill="#b85450" font-weight="bold">Math</text>
  <line x1="80" y1="200" x2="80" y2="220" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="220" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="45" y="234" font-size="9" fill="#333">H</text>
  <text x="115" y="234" font-size="9" fill="#b85450" font-weight="bold">Math</text>
  <line x1="80" y1="220" x2="80" y2="240" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="240" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="45" y="254" font-size="9" fill="#333">I</text>
  <text x="115" y="254" font-size="9" fill="#b85450" font-weight="bold">Math</text>
  <line x1="80" y1="240" x2="80" y2="260" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="260" width="160" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="45" y="274" font-size="9" fill="#b85450" font-weight="bold">A</text>
  <text x="115" y="274" font-size="9" fill="#b85450" font-weight="bold">Math</text>
  <line x1="80" y1="260" x2="80" y2="280" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="100" y="294" text-anchor="middle" font-size="8.5" fill="#b85450">↑ (A, Math) 重复行</text>

  <!-- Arrows: rows to buckets -->
  <path d="M180 170 L300 170" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="240" y="163" text-anchor="middle" font-size="8.5" fill="#d6a040">Math 行 →</text>
  <path d="M180 110 L300 110" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="240" y="104" text-anchor="middle" font-size="8" fill="#888">English</text>

  <!-- Bucket table (right) -->
  <text x="430" y="50" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">分桶 + 去重计数 + HAVING 判定</text>
  <rect x="300" y="56" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="72" font-size="8.5" fill="#333">class</text>
  <text x="380" y="72" font-size="8.5" fill="#333">桶内 students</text>
  <text x="475" y="72" font-size="8.5" fill="#b85450">DISTINCT</text>
  <text x="530" y="72" font-size="8.5" fill="#333">≥5?</text>
  <line x1="360" y1="56" x2="360" y2="80" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="465" y1="56" x2="465" y2="80" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="56" x2="510" y2="80" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="80" width="240" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="315" y="96" font-size="9" fill="#4a7a3a" font-weight="bold">Math</text>
  <text x="380" y="96" font-size="8.5" fill="#333">A,C,E,G,H,I</text>
  <text x="380" y="108" font-size="8" fill="#888">+A(重复,去重)</text>
  <text x="475" y="104" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="530" y="104" font-size="9" fill="#b85450" font-weight="bold">✓</text>
  <line x1="360" y1="80" x2="360" y2="128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="465" y1="80" x2="465" y2="128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="80" x2="510" y2="128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="128" width="240" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="144" font-size="9" fill="#888">English</text>
  <text x="380" y="144" font-size="8.5" fill="#888">B</text>
  <text x="475" y="144" font-size="9" fill="#888">1</text>
  <text x="530" y="144" font-size="9" fill="#888">✗</text>
  <line x1="360" y1="128" x2="360" y2="152" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="465" y1="128" x2="465" y2="152" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="128" x2="510" y2="152" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="152" width="240" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="168" font-size="9" fill="#888">Biology</text>
  <text x="380" y="168" font-size="8.5" fill="#888">D</text>
  <text x="475" y="168" font-size="9" fill="#888">1</text>
  <text x="530" y="168" font-size="9" fill="#888">✗</text>
  <line x1="360" y1="152" x2="360" y2="176" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="465" y1="152" x2="465" y2="176" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="152" x2="510" y2="176" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="176" width="240" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="192" font-size="9" fill="#888">Computer</text>
  <text x="380" y="192" font-size="8.5" fill="#888">F</text>
  <text x="475" y="192" font-size="9" fill="#888">1</text>
  <text x="530" y="192" font-size="9" fill="#888">✗</text>
  <line x1="360" y1="176" x2="360" y2="200" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="465" y1="176" x2="465" y2="200" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="176" x2="510" y2="200" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Verdict annotations -->
  <text x="430" y="218" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">Math: 6 ≥ 5 ✓ 保留</text>
  <text x="430" y="232" text-anchor="middle" font-size="9" fill="#888">其余 3 桶各 1 人 &lt; 5 ✗ 丢弃</text>

  <!-- COUNT(*) vs COUNT(DISTINCT) comparison -->
  <rect x="300" y="244" width="240" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="262" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">⚠️ Math 桶两种 COUNT 对照</text>
  <text x="420" y="276" text-anchor="middle" font-size="8.5" fill="#b85450">COUNT(*) = 7（含重复行 A×2）</text>
  <text x="420" y="290" text-anchor="middle" font-size="8.5" fill="#b85450">COUNT(DISTINCT student) = 6（去重）</text>

  <!-- Down arrow to result -->
  <path d="M420 304 L420 330" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="150" y="334" width="260" height="76" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最终结果</text>
  <rect x="240" y="362" width="80" height="26" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Math</text>
  <text x="280" y="402" text-anchor="middle" font-size="9" fill="#888">Math 有 6 名不同学生 ≥ 5，直接输出分组键</text>

  <text x="280" y="432" text-anchor="middle" font-size="9" fill="#446688">无重复行时 COUNT(*) = COUNT(DISTINCT student)，结果一致</text>
  <text x="280" y="448" text-anchor="middle" font-size="9" fill="#b85450">有重复行时仅 COUNT(DISTINCT student) 正确——题目「每学生每课只算一次」要求去重</text>
  <text x="280" y="464" text-anchor="middle" font-size="9" fill="#888">本例故意加入 (A, Math) 重复行以演示差异，标准测试用例通常无重复</text>
</svg>
