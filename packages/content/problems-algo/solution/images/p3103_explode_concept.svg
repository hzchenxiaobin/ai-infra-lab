<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：炸行——「一行多标签」规整成「一行一标签」再聚合</text>

  <rect x="18" y="46" width="236" height="192" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="136" y="66" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Tweets：一行多标签</text>

  <rect x="28" y="78" width="216" height="46" fill="#fff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="34" y="93" font-size="8.5" fill="#888" filter="url(#rough2)">13 | Enjoying a great start…</text>
  <text x="34" y="110" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">#HappyDay  #MorningVibes</text>

  <rect x="28" y="130" width="216" height="46" fill="#fff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="34" y="145" font-size="8.5" fill="#888" filter="url(#rough2)">14 | Another … with good vibes!</text>
  <text x="34" y="162" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">#HappyDay  #FeelGood</text>

  <rect x="28" y="182" width="216" height="46" fill="#fff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="34" y="197" font-size="8.5" fill="#888" filter="url(#rough2)">16 | Exploring new tech…</text>
  <text x="34" y="214" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">#TechLife  #Innovation</text>

  <path d="M 258 132 L 288 132" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="273" y="112" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">递归</text>
  <text x="273" y="124" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">炸行</text>

  <rect x="292" y="46" width="180" height="192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="382" y="66" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">exploded：一行一标签</text>

  <text x="302" y="90" font-size="9" fill="#888" filter="url(#rough2)">13</text>
  <text x="330" y="90" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">#HappyDay</text>
  <text x="302" y="112" font-size="9" fill="#888" filter="url(#rough2)">13</text>
  <text x="330" y="112" font-size="9.5" fill="#b85450" filter="url(#rough2)">#MorningVibes</text>
  <text x="302" y="134" font-size="9" fill="#888" filter="url(#rough2)">14</text>
  <text x="330" y="134" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">#HappyDay</text>
  <text x="302" y="156" font-size="9" fill="#888" filter="url(#rough2)">14</text>
  <text x="330" y="156" font-size="9.5" fill="#b85450" filter="url(#rough2)">#FeelGood</text>
  <text x="302" y="178" font-size="9" fill="#888" filter="url(#rough2)">16</text>
  <text x="330" y="178" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">#TechLife</text>
  <text x="302" y="200" font-size="9" fill="#888" filter="url(#rough2)">16</text>
  <text x="330" y="200" font-size="9.5" fill="#b85450" filter="url(#rough2)">#Innovation</text>
  <text x="382" y="226" text-anchor="middle" font-size="8.5" fill="#8a6d1a" filter="url(#rough2)">每对 (推文, 标签) 恰好一行</text>

  <rect x="490" y="78" width="76" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="528" y="100" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后半段</text>
  <text x="528" y="118" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">GROUP BY</text>
  <text x="528" y="134" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">COUNT(*)</text>
  <text x="528" y="150" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">双降序</text>
  <text x="528" y="166" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">LIMIT 3</text>
  <text x="528" y="186" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">＝ 3087 原样</text>

  <path d="M 474 138 L 488 138" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="258" width="500" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">GROUP BY + COUNT(*) 只会数「行数」，数不了「一行里的第 2 个标签」</text>
  <text x="290" y="300" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">那就让每个标签自己占一行——先规整成一行一事实（1NF），再聚合；</text>
  <text x="290" y="318" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">逗号分隔标签、分号分隔邮箱、空格分隔关键词——「单元格多值」全是同一道题，</text>
  <text x="290" y="334" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">炸行（explode / split-to-rows）是它们的通用范式</text>
</svg>
