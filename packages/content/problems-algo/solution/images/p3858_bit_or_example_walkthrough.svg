<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：grid = [[3,5],[6,4]]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">b &#8805; 3 的位所有数都是 0，自动排除 &#8594; zero_mask = 1000</text>

  <!-- 表格 -->
  <g filter="url(#rough2)" stroke="#8a97a8" stroke-width="1">
    <rect x="20" y="54" width="525" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <line x1="80" y1="54" x2="80" y2="262"/>
    <line x1="185" y1="54" x2="185" y2="262"/>
    <line x1="350" y1="54" x2="350" y2="262"/>
    <line x1="460" y1="54" x2="460" y2="262"/>
    <rect x="20" y="82" width="525" height="48" fill="#ffffff"/>
    <rect x="20" y="130" width="525" height="48" fill="#ffffff"/>
    <rect x="20" y="178" width="525" height="48" fill="#ffffff"/>
    <rect x="20" y="226" width="525" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>

  <g filter="url(#rough2)" font-size="12" fill="#33506b" font-weight="bold">
    <text x="50" y="72" text-anchor="middle">位 b</text>
    <text x="132" y="72" text-anchor="middle">cand</text>
    <text x="267" y="72" text-anchor="middle">行 1 = [3, 5]</text>
    <text x="405" y="72" text-anchor="middle">行 2 = [6, 4]</text>
    <text x="502" y="72" text-anchor="middle">结果</text>
  </g>

  <!-- b = 2 -->
  <g filter="url(#rough2)">
    <text x="50" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b = 2</text>
    <text x="132" y="110" text-anchor="middle" font-size="13" fill="#333">1100</text>
    <text x="267" y="110" text-anchor="middle" font-size="11.5" fill="#2f5d24">3(0011) &amp; 1100 = 0 &#10003;</text>
    <text x="405" y="100" text-anchor="middle" font-size="11.5" fill="#8a3030">6(0110) &#10007;</text>
    <text x="405" y="118" text-anchor="middle" font-size="11.5" fill="#8a3030">4(0100) &#10007;</text>
    <text x="502" y="110" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">&#10007; ans |= 100</text>
  </g>

  <!-- b = 1 -->
  <g filter="url(#rough2)">
    <text x="50" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b = 1</text>
    <text x="132" y="158" text-anchor="middle" font-size="13" fill="#333">1010</text>
    <text x="267" y="148" text-anchor="middle" font-size="11.5" fill="#8a3030">3(0011) &#10007;</text>
    <text x="267" y="166" text-anchor="middle" font-size="11.5" fill="#2f5d24">5(0101) &amp; 1010 = 0 &#10003;</text>
    <text x="405" y="148" text-anchor="middle" font-size="11.5" fill="#8a3030">6(0110) &#10007;</text>
    <text x="405" y="166" text-anchor="middle" font-size="11.5" fill="#2f5d24">4(0100) &amp; 1010 = 0 &#10003;</text>
    <text x="502" y="158" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">&#10003; Z = 1010</text>
  </g>

  <!-- b = 0 -->
  <g filter="url(#rough2)">
    <text x="50" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b = 0</text>
    <text x="132" y="206" text-anchor="middle" font-size="13" fill="#333">1011</text>
    <text x="267" y="196" text-anchor="middle" font-size="11.5" fill="#8a3030">3(0011) &#10007;</text>
    <text x="267" y="214" text-anchor="middle" font-size="11.5" fill="#8a3030">5(0101) &#10007;</text>
    <text x="405" y="206" text-anchor="middle" font-size="10.5" fill="#888">（行 1 已卡壳）</text>
    <text x="502" y="206" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">&#10007; ans |= 001</text>
  </g>

  <!-- 汇总 -->
  <g filter="url(#rough2)">
    <text x="282" y="249" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">ans = 0101&#8322; = 5 &#10003;&#65039;&#8202;（Z 即 zero_mask = 1010）</text>
  </g>

  <!-- 底部验证 -->
  <g filter="url(#rough2)">
    <rect x="20" y="278" width="525" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="282" y="300" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">构造验证：每行取 x &amp; zero_mask == 0 的数</text>
    <text x="282" y="320" text-anchor="middle" font-size="11.5" fill="#2f5d24">行 1 选 5（0101 &amp; 1010 = 0），行 2 选 4（0100 &amp; 1010 = 0）</text>
    <text x="282" y="338" text-anchor="middle" font-size="11.5" fill="#2f5d24">OR = 5 | 4 = 0101&#8322; = 5 = ans &#10003;</text>
    <text x="282" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a">卡壳位：b=2（行 2 两数都含 100）、b=0（行 1 两数都含 001）</text>
  </g>
</svg>
