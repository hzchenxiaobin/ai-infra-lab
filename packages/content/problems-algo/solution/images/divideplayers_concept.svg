<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后首尾配对，每对和都等于 target = total / (n/2)</text>

  <text x="30" y="64" font-size="12" fill="#888">排序后 skill =</text>

  <!-- 6 boxes: centers 134,182,230,278,326,374 ; width 48 ; y 48-82 -->
  <!-- pair (1,5) blue -->
  <rect x="110" y="48" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="134" y="70" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="350" y="48" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="374" y="70" text-anchor="middle" font-size="14" fill="#333">5</text>
  <!-- pair (2,4) green -->
  <rect x="158" y="48" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="182" y="70" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="302" y="48" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="326" y="70" text-anchor="middle" font-size="14" fill="#333">4</text>
  <!-- pair (3,3) orange -->
  <rect x="206" y="48" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="70" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="254" y="48" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="70" text-anchor="middle" font-size="14" fill="#333">3</text>

  <!-- nested underbraces -->
  <path d="M 134 84 L 134 92 L 374 92 L 374 84" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="254" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1 + 5 = 6, 积 5</text>

  <path d="M 182 116 L 182 124 L 326 124 L 326 116" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="254" y="140" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2 + 4 = 6, 积 8</text>

  <path d="M 230 148 L 230 156 L 278 156 L 278 148" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="254" y="172" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">3 + 3 = 6, 积 9</text>

  <!-- target math box -->
  <rect x="80" y="190" width="380" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">求每队目标和 target</text>
  <text x="270" y="234" text-anchor="middle" font-size="12" fill="#333">total = Σskill = 18，n = 6，队伍数 = n/2 = 3</text>
  <text x="270" y="254" text-anchor="middle" font-size="12" fill="#333">target = total / (n/2) = 18 / 3 = 6（等价于 2·total/n）</text>

  <!-- proof hint -->
  <rect x="40" y="280" width="460" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">为何首尾配对？「最小者必配最大者」</text>
  <text x="270" y="320" text-anchor="middle" font-size="10.5" fill="#555">设 a[0] 配 a[k]、a[n−1] 配 a[j]；由 a[0]≤a[j] 推出 a[k]≥a[n−1]</text>
  <text x="270" y="334" text-anchor="middle" font-size="10.5" fill="#555">又 a[k]≤a[n−1]（最大者），故 a[k]=a[n−1]，归纳递推得首尾配对唯一</text>
</svg>
