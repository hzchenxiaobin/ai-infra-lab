<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">蓄水池抽样核心：单遍扫描，以 1/c 概率替换手中候选</text>

  <!-- 数据流标签 -->
  <text x="36" y="62" font-size="11" fill="#888">数据流 nums（target=3）→</text>

  <!-- 数据流格子 [1, 2, 3, 3, 3] -->
  <rect x="36" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58" y="90" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <rect x="84" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="106" y="90" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <rect x="132" y="70" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="180" y="70" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="228" y="70" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- 候选计数 c 标注 -->
  <text x="154" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">c=1</text>
  <text x="202" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">c=2</text>
  <text x="250" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">c=3</text>

  <!-- 替换概率标注 -->
  <text x="154" y="134" text-anchor="middle" font-size="10" fill="#d6a040">替换 1/1</text>
  <text x="202" y="134" text-anchor="middle" font-size="10" fill="#d6a040">替换 1/2</text>
  <text x="250" y="134" text-anchor="middle" font-size="10" fill="#d6a040">替换 1/3</text>

  <!-- 从三个目标值指向蓄水池的箭头 -->
  <path d="M 154 144 Q 200 178 250 224" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 202 144 Q 226 180 252 224" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 250 144 L 254 224" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 蓄水池（水桶） -->
  <text x="100" y="232" font-size="11" fill="#888">蓄水池 reservoir</text>
  <path d="M 108 230 L 96 300 Q 96 312 110 312 L 230 312 Q 244 312 244 300 L 232 230 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- 水面波纹 -->
  <path d="M 104 248 Q 130 242 156 248 Q 182 254 208 248 Q 230 244 244 250"
        stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 106 260 Q 132 256 158 260 Q 184 264 210 260 Q 232 257 244 262"
        stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <!-- 桶中候选 -->
  <text x="170" y="292" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">当前候选</text>

  <!-- 扫描指针 -->
  <text x="290" y="76" font-size="10" fill="#888">扫描指针 i</text>
  <path d="M 132 64 L 132 48" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧：规则说明 -->
  <rect x="318" y="150" width="220" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="338" y="174" font-size="12" fill="#d6a040" font-weight="bold">替换规则</text>
  <text x="338" y="194" font-size="11" fill="#555">遇到第 c 个目标值：</text>
  <text x="338" y="212" font-size="11" fill="#555">  以 1/c 概率 → 替换 reservoir</text>
  <text x="338" y="230" font-size="11" fill="#555">  以 1−1/c 概率 → 保持不变</text>
  <text x="338" y="252" font-size="10.5" fill="#888">实现：if (rand() % c == 0) reservoir = i;</text>

  <!-- 底部：均匀性论证 -->
  <rect x="30" y="332" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="354" font-size="11" fill="#4a7a3a" font-weight="bold">为何均匀？第 j 个幸存概率 = (1/j)·∏(k-1)/k = (1/j)·(j/C) = 1/C</text>
  <text x="50" y="372" font-size="10.5" fill="#555">连乘望远镜约分：每个目标值最终概率都是 1/C，与位置无关 → 严格等概率 ✅</text>
</svg>
