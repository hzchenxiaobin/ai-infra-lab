<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：words 在 [left=1, right=4] 内逐串判定首尾元音 → 3</text>

  <!-- range bracket -->
  <path d="M132,52 L132,42 L500,42 L500,52" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="36" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">范围 [ left = 1,  right = 4 ]</text>

  <!-- words array -->
  <!-- i=0 hey (out of range, grayed) -->
  <rect x="40" y="54" width="92" height="40" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="86" y="80" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">"hey"</text>
  <text x="86" y="106" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0（范围外）</text>
  <!-- i=1 aeo -->
  <rect x="132" y="54" width="92" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="178" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">"aeo"</text>
  <text x="178" y="106" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i=1</text>
  <!-- i=2 mu -->
  <rect x="224" y="54" width="92" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">"mu"</text>
  <text x="270" y="106" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i=2</text>
  <!-- i=3 ooo -->
  <rect x="316" y="54" width="92" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="362" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">"ooo"</text>
  <text x="362" y="106" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i=3</text>
  <!-- i=4 artro -->
  <rect x="408" y="54" width="92" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="80" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">"artro"</text>
  <text x="454" y="106" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i=4</text>

  <!-- table -->
  <!-- header band -->
  <rect x="40" y="116" width="460" height="30" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="135" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="132" y="135" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">word</text>
  <text x="208" y="135" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">首</text>
  <text x="264" y="135" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">末</text>
  <text x="344" y="135" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">元音串?</text>
  <text x="448" y="135" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">cnt</text>

  <!-- row i=1 aeo: a(green) o(green) -> yes, cnt=1 -->
  <rect x="40" y="146" width="460" height="30" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="165" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="132" y="165" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">"aeo"</text>
  <rect x="190" y="150" width="36" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="208" y="166" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="246" y="150" width="36" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="166" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="344" y="166" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="448" y="166" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row i=2 mu: m(red) u(green) -> no, cnt=1 -->
  <rect x="40" y="176" width="460" height="30" fill="#f7f7f7" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="195" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="132" y="195" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">"mu"</text>
  <rect x="190" y="180" width="36" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="208" y="196" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">m</text>
  <rect x="246" y="180" width="36" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="196" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="344" y="196" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="448" y="196" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row i=3 ooo: o(green) o(green) -> yes, cnt=2 -->
  <rect x="40" y="206" width="460" height="30" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="225" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="132" y="225" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">"ooo"</text>
  <rect x="190" y="210" width="36" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="208" y="226" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>
  <rect x="246" y="210" width="36" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="226" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="344" y="226" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="448" y="226" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- row i=4 artro: a(green) o(green) -> yes, cnt=3 -->
  <rect x="40" y="236" width="460" height="30" fill="#f7f7f7" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="255" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="132" y="255" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">"artro"</text>
  <rect x="190" y="240" width="36" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="208" y="256" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="246" y="240" width="36" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="256" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="344" y="256" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="448" y="256" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- result -->
  <rect x="150" y="284" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果：cnt = 3  ✓</text>

  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">"mu" 末字符 'u' 虽是元音，但首字符 'm' 非元音 → ✗；中间字符一概不看</text>
</svg>
