<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">前缀 DP：dp[i] = max(dp[i−1], dp[j]+1)   当 s[j..i−1] 为长度 ≥ k 回文</text>

  <!-- string row: a b a c c d b b d  (indices 0..8) -->
  <!-- index labels above -->
  <text x="134" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="178" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <text x="222" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="266" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>
  <text x="354" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">5</text>
  <text x="398" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">6</text>
  <text x="442" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">7</text>
  <text x="486" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">8</text>

  <!-- aba (0..2) already-picked, light blue -->
  <rect x="112" y="74" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="103" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">a</text>
  <rect x="156" y="74" width="44" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="103" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">b</text>
  <rect x="200" y="74" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="103" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">a</text>
  <!-- c c (3,4) -->
  <rect x="244" y="74" width="44" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="103" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">c</text>
  <rect x="288" y="74" width="44" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="103" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">c</text>
  <!-- dbbd (5..8) current focus, red -->
  <rect x="332" y="74" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="103" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">d</text>
  <rect x="376" y="74" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="103" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">b</text>
  <rect x="420" y="74" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="103" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">b</text>
  <rect x="464" y="74" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="486" y="103" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">d</text>

  <!-- bracket below dbbd (j=5 .. i-1=8) -->
  <path d="M332 122 L332 134 L508 134 L508 122" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="332" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">j=5</text>
  <text x="420" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">回文 s[j..i−1]，长度 4 ≥ k</text>
  <text x="508" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">i−1=8</text>

  <!-- dp label -->
  <text x="92" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">dp:</text>

  <!-- dp array: 0 0 0 1 1 1 1 1 1 2  (dp[0..9]) -->
  <rect x="110" y="196" width="40" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="150" y="196" width="40" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="190" y="196" width="40" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="230" y="196" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="270" y="196" width="40" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <!-- dp[5] = j -->
  <rect x="310" y="196" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="350" y="196" width="40" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="390" y="196" width="40" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="430" y="196" width="40" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <!-- dp[9] = i -->
  <rect x="470" y="196" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <!-- j / i-1 / i markers under dp cells -->
  <text x="330" y="252" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="450" y="252" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">i−1</text>
  <text x="490" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i</text>

  <!-- skip arrow: dp[8] -> dp[9] over the top -->
  <path d="M450 196 C 450 174 490 174 490 196" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="470" y="170" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">跳过 = dp[i−1]</text>

  <!-- pick arc: dp[5] -> dp[9] under the bottom -->
  <path d="M330 232 C 330 292 490 292 490 232" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="410" y="278" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">选 dbbd：dp[j] + 1 = 1 + 1 = 2</text>

  <!-- summary note -->
  <rect x="50" y="306" width="520" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="330" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[i] = max( 跳过 dp[i−1] ,  max{ dp[j]+1 : s[j..i−1] 回文 且 i−j ≥ k } )</text>
  <text x="310" y="352" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">回文表 isPal 预处理 O(n²) ＋ DP 双层循环 O(n²)，总 O(n²)/O(n²)</text>
</svg>
