<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">关键差异：236 命中即返回 vs 1644 计数验证</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">同一棵树，p=5 存在，q=9 不存在</text>

  <!-- ===== LEFT: 236 approach ===== -->
  <text x="150" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">236 做法（假设都存在）</text>

  <!-- tree nodes -->
  <circle cx="150" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <circle cx="110" cy="142" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <line x1="140" y1="104" x2="122" y2="128" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="190" cy="142" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <line x1="160" y1="104" x2="178" y2="128" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="85" cy="192" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <line x1="100" y1="156" x2="92" y2="180" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="135" cy="192" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="120" y1="156" x2="128" y2="180" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- p marker -->
  <text x="110" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a">p</text>

  <!-- early return annotation: dashed circle around 5's subtree showing NOT explored -->
  <path d="M 70 175 Q 60 210 85 220 Q 135 225 150 210 Q 155 180 140 172" 
        stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="75" y="235" font-size="9" fill="#b85450">子树未查!</text>

  <!-- early return arrow from 5 -->
  <path d="M 126 142 L 175 110" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="120" font-size="9" fill="#b85450">早返回</text>

  <!-- result -->
  <rect x="60" y="262" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="282" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 5 ❌</text>
  <text x="150" y="298" text-anchor="middle" font-size="10" fill="#888">q 不存在却返回了 p</text>

  <path d="M 150 258 L 150 248" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== RIGHT: 1644 approach ===== -->
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1644 做法（计数验证）</text>

  <!-- tree nodes -->
  <circle cx="450" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <circle cx="410" cy="142" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <line x1="440" y1="104" x2="422" y2="128" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="490" cy="142" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <line x1="460" y1="104" x2="478" y2="128" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="385" cy="192" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <line x1="400" y1="156" x2="392" y2="180" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="435" cy="192" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="420" y1="156" x2="428" y2="180" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- p marker -->
  <text x="410" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a">p</text>

  <!-- explored annotation: showing subtree IS explored -->
  <path d="M 370 175 Q 360 210 385 220 Q 435 225 450 210 Q 455 180 440 172" 
        stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="375" y="235" font-size="9" fill="#4a7a3a">子树已查</text>
  <text x="375" y="247" font-size="9" fill="#888">无 q</text>

  <!-- count annotation -->
  <rect x="370" y="262" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="282" text-anchor="middle" font-size="11" fill="#333">count = 1（只找到 p）</text>

  <path d="M 450 296 L 450 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="450,314 540,344 450,374 360,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="342" text-anchor="middle" font-size="11" fill="#333">count == 2?</text>

  <!-- No -->
  <path d="M 450 374 L 450 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="384" font-size="10" fill="#b85450">否</text>

  <rect x="370" y="392" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="410" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 null ✅</text>
  <text x="450" y="424" text-anchor="middle" font-size="9" fill="#4a7a3a">q 不存在</text>

  <!-- divider -->
  <line x1="300" y1="56" x2="300" y2="430" stroke="#ddd" stroke-width="1.5" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- bottom summary -->
  <text x="150" y="332" text-anchor="middle" font-size="10" fill="#888">命中 p 后不查子树</text>
  <text x="150" y="346" text-anchor="middle" font-size="10" fill="#888">→ 无法发现 q 缺失</text>
</svg>
