<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">循环数组 = 环形跑道</text>

  <!-- 轨道虚线圆 -->
  <circle cx="175" cy="202" r="88" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 5" filter="url(#rough2)"/>

  <!-- 方向标注 -->
  <text x="246" y="140" font-size="12" fill="#4a7a3a" filter="url(#rough2)">右 = 顺时针</text>
  <text x="40" y="282" font-size="12" fill="#b85450" filter="url(#rough2)">左 = 逆时针</text>

  <!-- 路径 B：i=1，值 -2，左 2 步（外圈，逆时针，红） -->
  <path d="M 291 202 A 116 116 0 0 0 59 202" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="175" y="74" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">i=1：左 2 步（1→0→3）</text>

  <!-- 路径 A：i=0，值 +3，右 3 步（内圈，顺时针，绿） -->
  <path d="M 175 142 A 60 60 0 1 1 115 202" fill="none" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="175" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">i=0：右 3 步</text>
  <text x="175" y="216" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0→1→2→3</text>

  <!-- 四个节点格子 -->
  <text x="175" y="90" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 0</text>
  <rect x="152" y="96" width="46" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="120" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>

  <text x="263" y="178" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 1</text>
  <rect x="240" y="184" width="46" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="263" y="208" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−2</text>

  <text x="175" y="266" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 2</text>
  <rect x="152" y="272" width="46" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="296" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <text x="87" y="178" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 3</text>
  <rect x="64" y="184" width="46" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="87" y="208" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <!-- 右侧说明框 -->
  <rect x="348" y="62" width="156" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="426" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i=0，值 +3</text>
  <text x="426" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">右移 3 步：0→1→2→3</text>
  <text x="426" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">result[0]=nums[3]=1</text>

  <rect x="348" y="152" width="156" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="426" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i=1，值 −2</text>
  <text x="426" y="197" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">左移 2 步：1→0→3</text>
  <text x="426" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">result[1]=nums[3]=1</text>

  <rect x="348" y="242" width="156" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="426" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">越过边界 ≠ 出错</text>
  <text x="426" y="288" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">左穿开头 → 绕到末尾</text>
  <text x="426" y="310" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">右穿末尾 → 绕到开头</text>

  <!-- 底部总结 -->
  <text x="260" y="348" text-anchor="middle" font-size="13" fill="#666" font-style="italic" filter="url(#rough2)">环上绕整数圈白走 —— 只有 k mod n 有效</text>
</svg>
