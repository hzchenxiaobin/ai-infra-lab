<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：原地前缀和 DP（一维滚动，O(n) 时间 / O(1) 空间）</text>

  <!-- ① 初始化 -->
  <rect x="200" y="50" width="160" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化 dp[0..4] = 1</text>
  <text x="280" y="86" text-anchor="middle" font-size="10" fill="#888">即第 1 行：a,e,i,o,u 各一种</text>

  <!-- 箭头 -->
  <line x1="280" y1="96" x2="280" y2="112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 外层循环判定 -->
  <polygon points="280,116 380,156 280,196 180,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ≤ n ?</text>
  <text x="280" y="166" text-anchor="middle" font-size="10" fill="#888">外层 i 从 2 到 n</text>

  <!-- 否：跳到返回 -->
  <line x1="380" y1="156" x2="430" y2="156" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="150" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- 是：向下 -->
  <line x1="280" y1="196" x2="280" y2="214" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="210" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ③ 内层循环判定 -->
  <polygon points="280,218 370,252 280,286 190,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j ≤ 4 ?</text>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#888">内层 j 从 1 到 4</text>

  <!-- 是：向下到处理框 -->
  <line x1="280" y1="286" x2="280" y2="304" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ④ 处理框：dp[j] += dp[j-1] -->
  <rect x="180" y="308" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ dp[j] += dp[j−1]</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#555">累加左侧 → 原地变成第 i 行</text>

  <!-- j++ 回到 ③ -->
  <path d="M 180 332 L 140 332 L 140 252 L 190 252" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="294" font-size="10" fill="#888">j++</text>

  <!-- ③ 否：i++ 回到 ② -->
  <path d="M 370 252 L 410 252 L 410 156 L 380 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="208" font-size="10" fill="#888" font-weight="bold">否→i++</text>

  <!-- ⑤ 返回 -->
  <rect x="430" y="134" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="154" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑤ 返回 Σdp</text>
  <text x="490" y="170" text-anchor="middle" font-size="10" fill="#888">即第 n 行之和</text>

  <!-- ===== 注释框 ===== -->
  <rect x="40" y="380" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="402" font-size="11" fill="#446688" font-weight="bold">关键点：</text>
  <text x="54" y="420" font-size="11" fill="#333">· 内层必须从左到右（j=1→4），保证 dp[j−1] 已是本行新值，dp[j] 仍是上一行旧值</text>
  <text x="54" y="438" font-size="11" fill="#333">· 每完成一轮内层循环，dp 恰好是第 i 行；n−1 轮后 dp 即第 n 行，求和得答案</text>
</svg>
