<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[1,2,3,null,4,null,5]，x=5, y=4</text>

  <!-- 左侧树，前序访问编号 -->
  <line x1="172" y1="92" x2="142" y2="126" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="188" y1="92" x2="218" y2="126" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="180" cy="80" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="158" y="72" font-size="11" fill="#4a7a3a" font-weight="bold">①</text>

  <line x1="144" y1="150" x2="156" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="220" y1="150" x2="232" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="140" cy="138" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="130" font-size="11" fill="#4a7a3a" font-weight="bold">②</text>
  <circle cx="222" cy="138" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="222" y="142" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="240" y="130" font-size="11" fill="#4a7a3a" font-weight="bold">④</text>

  <circle cx="158" cy="196" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="158" y="200" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="136" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">③</text>
  <circle cx="234" cy="196" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="234" y="200" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="250" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">⑤</text>

  <!-- 深度标注 -->
  <text x="40" y="84" font-size="9" fill="#999">depth 0</text>
  <text x="40" y="142" font-size="9" fill="#999">depth 1</text>
  <text x="40" y="200" font-size="9" fill="#999">depth 2</text>

  <!-- 访问路径虚线箭头 ①→②→③→④→⑤ -->
  <path d="M 170 94 Q 152 116 144 124" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 154 Q 156 174 158 182" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 168 196 Q 195 168 218 142" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 154 Q 232 174 234 182" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧记录表 -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">DFS 记录结果</text>
  <rect x="320" y="70" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="88" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">目标</text>
  <text x="410" y="88" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">depth</text>
  <text x="480" y="88" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">parent</text>

  <rect x="320" y="96" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="114" text-anchor="middle" font-size="10" fill="#333">y=4 (③)</text>
  <text x="410" y="114" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="480" y="114" text-anchor="middle" font-size="10" fill="#333">2</text>

  <rect x="320" y="122" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="140" text-anchor="middle" font-size="10" fill="#333">x=5 (⑤)</text>
  <text x="410" y="140" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="480" y="140" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- 结论框 -->
  <rect x="40" y="244" width="480" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终比较</text>
  <text x="60" y="290" font-size="11" fill="#555">前序访问 ①1 ②2 ③4(命中y) ④3 ⑤5(命中x)，两目标分别在第 3、5 步被记录。</text>
  <text x="60" y="310" font-size="11" fill="#4a7a3a">depth: x=2, y=2 → 同深度 ✓</text>
  <text x="60" y="328" font-size="11" fill="#4a7a3a">parent: x=3, y=2 → 不同父 ✓</text>
  <text x="60" y="348" font-size="11" fill="#b85450" font-weight="bold">→ 同深度且不同父 → return true ✓</text>
</svg>
