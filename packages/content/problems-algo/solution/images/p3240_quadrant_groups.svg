<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="396" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">行列同时回文 ⇒ 四元对称组全相等</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5×5 划分示例：同字母格子受同一相等约束（A/B/C/D 四元组、p/q/r/s 二元组、★ 中心格）</text>

  <!-- 坐标轴标签 -->
  <text x="22" y="90" font-size="10" fill="#888" filter="url(#rough2)">i ↓</text>
  <text x="24" y="56" font-size="10" fill="#888" filter="url(#rough2)">j →</text>
  <text x="67" y="57" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="113" y="57" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="159" y="57" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="205" y="57" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="251" y="57" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="38" y="93" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="38" y="139" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="38" y="185" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="38" y="231" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="38" y="277" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>

  <!-- 行 0：A B r B A -->
  <rect x="44" y="66" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="67" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>
  <rect x="90" y="66" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <rect x="136" y="66" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">r</text>
  <rect x="182" y="66" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <rect x="228" y="66" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>

  <!-- 行 1：C D s D C -->
  <rect x="44" y="112" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="67" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">C</text>
  <rect x="90" y="112" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">D</text>
  <rect x="136" y="112" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">s</text>
  <rect x="182" y="112" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">D</text>
  <rect x="228" y="112" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="251" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">C</text>

  <!-- 行 2：p q ★ q p -->
  <rect x="44" y="158" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="67" y="186" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">p</text>
  <rect x="90" y="158" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="186" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">q</text>
  <rect x="136" y="158" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="159" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">★</text>
  <rect x="182" y="158" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="186" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">q</text>
  <rect x="228" y="158" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="186" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">p</text>

  <!-- 行 3：C D s D C -->
  <rect x="44" y="204" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="67" y="232" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">C</text>
  <rect x="90" y="204" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="232" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">D</text>
  <rect x="136" y="204" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="232" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">s</text>
  <rect x="182" y="204" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="232" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">D</text>
  <rect x="228" y="204" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="251" y="232" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">C</text>

  <!-- 行 4：A B r B A -->
  <rect x="44" y="250" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="67" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>
  <rect x="90" y="250" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="278" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <rect x="136" y="250" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="278" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">r</text>
  <rect x="182" y="250" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="278" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <rect x="228" y="250" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>

  <!-- 右侧说明 1：四元对称组 -->
  <rect x="304" y="66" width="196" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="402" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">四元对称组 × ⌊m/2⌋·⌊n/2⌋ 组</text>
  <text x="402" y="104" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">同字母的 4 格必须全相等</text>
  <text x="402" y="120" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">如 A = (i,j) 及其左右、上下、</text>
  <text x="402" y="136" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">对角三个镜像位，4 格一组</text>

  <!-- 右侧说明 2：二元组 -->
  <rect x="304" y="170" width="196" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="402" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">二元组（中间行 / 中间列）</text>
  <text x="402" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">m 奇 → 中间行 ⌊n/2⌋ 对（p、q）</text>
  <text x="402" y="224" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">n 奇 → 中间列 ⌊m/2⌋ 对（r、s）</text>
  <text x="402" y="240" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">同字母 2 格相等即可</text>

  <!-- 右侧说明 3：中心格 -->
  <rect x="304" y="264" width="196" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="402" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">中心格 ★（m、n 双奇）</text>
  <text x="402" y="302" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">自身即镜像，唯一的「单身」格</text>

  <!-- 底部结论 -->
  <rect x="30" y="332" width="460" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">三类结构互不相交，恰好铺满整个矩阵</text>
  <text x="260" y="370" text-anchor="middle" font-size="10.5" fill="#2f5d27" filter="url(#rough2)">→ 回文代价可逐结构独立计算；「1 的总数 mod 4」最后统一核对</text>
</svg>
