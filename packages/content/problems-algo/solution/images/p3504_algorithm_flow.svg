<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="14" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：回文表预处理 + 剥皮双序列 DP</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <ellipse cx="260" cy="36" rx="40" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="40" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">开始</text>
  </g>
  <line x1="260" y1="50" x2="260" y2="62" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- preprocess -->
  <g filter="url(#rough2)">
    <rect x="115" y="62" width="290" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="77" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">区间 DP 预处理回文表 O(n²)</text>
    <text x="260" y="92" text-anchor="middle" font-size="8.5" fill="#2f5d24">p[i]：s 以 i 起点的最长回文；q[j]：t 以 j 终点的最长回文</text>
  </g>
  <line x1="260" y1="100" x2="260" y2="112" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <g filter="url(#rough2)">
    <rect x="150" y="112" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="260" y="130" text-anchor="middle" font-size="9.5" fill="#33506b">初始化：虚拟行 dp[m][j] = q[j]，ans = 0</text>
  </g>
  <line x1="260" y1="140" x2="260" y2="152" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop -->
  <g filter="url(#rough2)">
    <rect x="155" y="152" width="210" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="260" y="167" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">双层循环（i 倒序，j 正序）</text>
    <text x="260" y="181" text-anchor="middle" font-size="8.5" fill="#8a6d1f">i = m−1 … 0，j = 0 … n−1</text>
  </g>
  <line x1="260" y1="188" x2="260" y2="200" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond -->
  <g filter="url(#rough2)">
    <polygon points="260,200 348,240 260,280 172,240" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="260" y="237" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold">s[i] = t[j] ?</text>
    <text x="260" y="251" text-anchor="middle" font-size="8" fill="#8a3a36">（首尾能配对吗）</text>
  </g>

  <!-- no branch -->
  <line x1="172" y1="240" x2="124" y2="240" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="148" y="232" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="22" y="218" width="102" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="73" y="236" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold">best =</text>
    <text x="73" y="251" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold">max(p[i], q[j])</text>
  </g>

  <!-- yes branch -->
  <line x1="348" y1="240" x2="375" y2="240" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="358" y="232" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="375" y="204" width="132" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="441" y="220" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold">best =</text>
    <text x="441" y="233" text-anchor="middle" font-size="8.5" fill="#8a6d1f">max(p[i], q[j], 2+inner)</text>
    <text x="441" y="250" text-anchor="middle" font-size="8.5" fill="#8a6d1f">inner = dp[i+1][j−1]</text>
    <text x="441" y="266" text-anchor="middle" font-size="8" fill="#8a6d1f">边界：j=0 → p[i+1]</text>
    <text x="441" y="279" text-anchor="middle" font-size="8" fill="#8a6d1f">i=m−1 → q[j−1]</text>
    <text x="441" y="292" text-anchor="middle" font-size="8" fill="#8a6d1f">双越界 → 0</text>
  </g>

  <!-- merge to ans -->
  <path d="M 73 262 V 320 H 183" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 441 300 V 320 H 337" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ans box -->
  <g filter="url(#rough2)">
    <rect x="185" y="304" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="324" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">ans = max(ans, best)</text>
  </g>

  <!-- loop back -->
  <path d="M 215 336 V 368 H 10 V 170 H 153" fill="none" stroke="#aaaaaa" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="86" y="360" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">循环推进 (i, j)</text>

  <!-- exit -->
  <path d="M 305 336 V 368 H 460 V 398" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="382" y="360" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">全部格子算完</text>

  <!-- end -->
  <g filter="url(#rough2)">
    <ellipse cx="460" cy="414" rx="42" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="460" y="418" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">输出 ans</text>
  </g>

  <text x="118" y="418" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">dp 一行滚动（nxt = 当前行）⇒ 空间 O(n)</text>
</svg>
