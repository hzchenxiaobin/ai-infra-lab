<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- title -->
  <text x="260" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">二进制下标从最低位（右）起算，偶位 / 奇位交错排列</text>

  <!-- index row label -->
  <text x="100" y="72" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">下标 →</text>
  <text x="135" y="72" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">5</text>
  <text x="185" y="72" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">4</text>
  <text x="235" y="72" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">3</text>
  <text x="285" y="72" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">2</text>
  <text x="335" y="72" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">1</text>
  <text x="385" y="72" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>

  <!-- bit cells: bit5..bit0 = 1,1,0,0,1,0 ; even(0,2,4) blue, odd(1,3,5) green -->
  <rect x="110" y="85" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="85" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="85" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="85" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="85" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="85" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <!-- bit values -->
  <text x="135" y="119" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <text x="185" y="119" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <text x="235" y="119" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>
  <text x="285" y="119" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>
  <text x="335" y="119" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <text x="385" y="119" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>

  <!-- high-bit / low-bit side labels -->
  <text x="102" y="113" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">高位</text>
  <path d="M438,110 L414,110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="106" font-size="11" fill="#446688" filter="url(#rough2)">最低位</text>
  <text x="446" y="120" font-size="11" fill="#446688" filter="url(#rough2)">（下标0）</text>

  <!-- legend chips -->
  <rect x="60" y="168" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="190" text-anchor="middle" font-size="13" fill="#2a3a55" filter="url(#rough2)">偶数下标 (0,2,4,…) → even</text>

  <rect x="290" y="168" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="390" y="190" text-anchor="middle" font-size="13" fill="#2f5a26" filter="url(#rough2)">奇数下标 (1,3,5,…) → odd</text>

  <!-- note box -->
  <rect x="55" y="230" width="410" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">偶位与奇位在二进制串里交错排列，</text>
  <text x="260" y="280" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">故用 0101…（0x5555…）与 1010…（0xAAAA…）</text>
  <text x="260" y="302" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">两把「梳子掩码」可一次性把两组位分离。</text>
</svg>
