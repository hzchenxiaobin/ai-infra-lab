<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心：同时间会议构成连通分量，秘密瞬时扩散全分量</text>

  <rect x="30" y="48" width="240" height="210" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="150" y="68" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">时间 t 前</text>

  <line x1="100" y1="120" x2="190" y2="100" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="190" y1="100" x2="190" y2="190" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="100" y1="120" x2="100" y2="200" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="190" y1="190" x2="100" y2="200" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="160" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">同时间会议</text>

  <circle cx="100" cy="120" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="100" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">种子 ✓</text>

  <circle cx="190" cy="100" r="18" fill="#eeeeee" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="105" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">2</text>

  <circle cx="190" cy="190" r="18" fill="#eeeeee" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="195" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>

  <circle cx="100" cy="200" r="18" fill="#eeeeee" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="205" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">5</text>

  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">仅 1 知晓秘密</text>

  <line x1="278" y1="150" x2="322" y2="150" stroke="#4a7a3a" stroke-width="2.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">瞬时</text>

  <rect x="330" y="48" width="240" height="210" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="450" y="68" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">时间 t 后（瞬时传播）</text>

  <line x1="400" y1="120" x2="490" y2="100" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="490" y1="100" x2="490" y2="190" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="400" y1="120" x2="400" y2="200" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="490" y1="190" x2="400" y2="200" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="400" cy="120" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <circle cx="490" cy="100" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <circle cx="490" cy="190" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <circle cx="400" cy="200" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="450" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">连通分量内全部知晓 ✓</text>

  <rect x="50" y="282" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">同一时刻的所有会议构成一张图，连通分量内只要有一人知道秘密，</text>
  <text x="290" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">秘密就瞬时扩散到整个分量——因为「接收」与「再分享」在同一时间发生。</text>
  <text x="290" y="348" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">→ 按时间分组处理，组内用并查集连通，组后重置</text>

  <circle cx="525" cy="62" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="540" y="66" font-size="9" fill="#333" filter="url(#rough2)">知</text>
  <circle cx="525" cy="80" r="7" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="540" y="84" font-size="9" fill="#333" filter="url(#rough2)">不知</text>
</svg>
