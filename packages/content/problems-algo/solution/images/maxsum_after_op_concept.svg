<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两个状态跟踪「是否已用平方」</text>

  <!-- 数组格子 -->
  <text x="50" y="64" font-size="12" fill="#888">nums：</text>
  <rect x="90" y="50" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="72" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="150" y="50" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="72" text-anchor="middle" font-size="13" fill="#333">-1</text>
  <rect x="210" y="50" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">-4</text>
  <rect x="270" y="50" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="72" text-anchor="middle" font-size="13" fill="#333">-3</text>

  <!-- 平方箭头标注 -->
  <text x="238" y="42" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ 在此平方</text>
  <text x="238" y="100" text-anchor="middle" font-size="10" fill="#d6a040">(-4)²=16</text>

  <!-- f 状态行：未用操作 -->
  <text x="40" y="150" font-size="12" fill="#4a7a3a" font-weight="bold">f（未平方）：</text>
  <rect x="90" y="134" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="154" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="150" y="134" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="154" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="210" y="134" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="154" text-anchor="middle" font-size="12" fill="#333">-3</text>
  <rect x="270" y="134" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="154" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- g 状态行：已用操作 -->
  <text x="40" y="210" font-size="12" fill="#d6a040" font-weight="bold">g（已平方）：</text>
  <rect x="90" y="194" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="214" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="150" y="194" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="214" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="210" y="194" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">17 ⭐</text>
  <rect x="270" y="194" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="214" text-anchor="middle" font-size="12" fill="#333">14</text>

  <!-- f→g 跨态箭头（在 i=2 处用操作） -->
  <path d="M 178 164 Q 200 180 210 194" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="196" y="184" font-size="9" fill="#b85450">平方</text>

  <!-- 说明区 -->
  <rect x="350" y="120" width="200" height="120" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="360" y="140" font-size="11" fill="#444" font-weight="bold">两状态的含义</text>
  <text x="360" y="160" font-size="10.5" fill="#555">• f[i]：以 i 结尾，还没平方</text>
  <text x="360" y="178" font-size="10.5" fill="#555">  f[i] = max(f[i-1],0) + x</text>
  <text x="360" y="198" font-size="10.5" fill="#555">• g[i]：以 i 结尾，已平方一次</text>
  <text x="360" y="216" font-size="10.5" fill="#555">  g[i] = max( max(f,0)+x²,</text>
  <text x="360" y="232" font-size="10.5" fill="#555">           g[i-1] + x )</text>

  <!-- 底部总结 -->
  <rect x="50" y="270" width="460" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：平方操作「只能用一次」→ 用状态标记是否已用</text>
  <text x="70" y="316" font-size="11" fill="#555">① 在 i 处首次平方：前缀取无操作状态 f[i-1]，当前位置贡献 x²（而非 x）</text>
  <text x="70" y="336" font-size="11" fill="#555">② 操作已在之前用过：继续延展已操作段 g[i-1]，当前位置贡献原值 x</text>
  <text x="70" y="354" font-size="11" fill="#555">③ x² ≥ x 恒成立（整数），故平方永不亏本 → g ≥ f，答案取 max(g)</text>
</svg>
