<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="400" fill="#fafafa"/>
  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序 + 反向交叉穿插流程：O(n log n)</text>

  <!-- Step 1: sort -->
  <rect x="120" y="44" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对 nums 排序</text>
  <text x="240" y="80" text-anchor="middle" font-size="10.5" fill="#555">sorted = sort(nums)</text>

  <path d="M 240 88 L 240 104" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: split -->
  <rect x="100" y="108" width="280" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">计算 mid = (n+1) // 2，分两半</text>
  <text x="240" y="146" text-anchor="middle" font-size="10.5" fill="#d6a040">S = sorted[:mid], L = sorted[mid:]</text>

  <path d="M 240 158 L 240 174" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: reverse -->
  <rect x="100" y="178" width="280" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">反转两半</text>
  <text x="240" y="216" text-anchor="middle" font-size="10.5" fill="#b85450">S' = S[::-1], L' = L[::-1]</text>

  <path d="M 240 228 L 240 244" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: init pointers -->
  <rect x="120" y="248" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化指针</text>
  <text x="240" y="284" text-anchor="middle" font-size="10.5" fill="#446688">j = mid-1 (S 末尾), k = n-1 (L 末尾)</text>

  <path d="M 240 292 L 240 308" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop diamond -->
  <polygon points="240,312 340,344 240,376 140,344" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="240" y="356" text-anchor="middle" font-size="10" fill="#777">遍历每个下标</text>

  <!-- No -> done -->
  <path d="M 340 344 L 400 344" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="352" y="336" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="374" y="328" width="86" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="417" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">完成 ✓</text>

  <!-- Yes -> branch -->
  <path d="M 240 376 L 240 388" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="258" y="382" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- i even: take from S -->
  <path d="M 140 344 L 70 344 L 70 390" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="80" y="338" font-size="9.5" fill="#446688" font-weight="bold">i 偶</text>
  <rect x="24" y="392" width="92" height="0" fill="none"/>
  <text x="70" y="396" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">nums[i]=sorted[j--]</text>

  <!-- i odd: take from L -->
  <path d="M 340 344 L 410 344 L 410 390" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="384" y="338" font-size="9.5" fill="#b85450" font-weight="bold">i 奇</text>
  <text x="410" y="396" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">nums[i]=sorted[k--]</text>
</svg>
