<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">越界与重访合并进 while，循环体每轮执行一条新指令</text>

  <!-- 开始 -->
  <rect x="185" y="42" width="190" height="42" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">i = 0，score = 0（64 位）</text>
  <text x="280" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">visited[ ] 全 false</text>

  <path d="M 280 84 L 280 104" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1：合法性 + 未访问 -->
  <polygon points="280,106 400,148 280,190 160,148" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">0 ≤ i &lt; n</text>
  <text x="280" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">且 !visited[i] ？</text>

  <!-- 否 → 返回 -->
  <path d="M 400 148 L 464 148" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="470" y="128" width="76" height="40" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="508" y="153" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回 score</text>

  <!-- 是 ↓ -->
  <path d="M 280 190 L 280 210" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="204" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">是</text>

  <!-- 标记 visited -->
  <rect x="200" y="214" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">visited[i] = true</text>
  <text x="368" y="237" font-size="10" fill="#b85450" filter="url(#rough2)">← 先标记再执行，防 jump+0 自环</text>

  <path d="M 280 250 L 280 272" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 2：add 还是 jump -->
  <polygon points="280,274 375,312 280,350 185,312" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">instructions[i]</text>
  <text x="280" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">== "add" ？</text>

  <!-- 是 → add 分支 -->
  <path d="M 185 312 L 166 312" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="174" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">是</text>
  <rect x="30" y="290" width="136" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="98" y="307" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">score += values[i]</text>
  <text x="98" y="324" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">i ← i + 1</text>

  <!-- 否 → jump 分支 -->
  <path d="M 375 312 L 394 312" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="400" y="290" width="136" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="468" y="315" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">i ← i + values[i]</text>

  <!-- 回边：两个分支汇合后回到判断 1 -->
  <path d="M 98 334 L 98 372 L 16 372 L 16 148 L 154 148" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 468 334 L 468 372 L 100 372" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">回到条件判断 —— 每轮执行一条新指令，至多 n+1 轮（鸽笼）</text>
</svg>
