<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：字母特殊 ⟺ 末个小写 在 首个大写 之前</text>

  <text x="56" y="63" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">word =</text>

  <!-- word boxes -->
  <rect x="110" y="38" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="135" y="64" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="160" y="38" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="64" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="210" y="38" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="235" y="64" text-anchor="middle" font-size="17" fill="#d6a040" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="260" y="38" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="285" y="64" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="310" y="38" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="335" y="64" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="360" y="38" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="385" y="64" text-anchor="middle" font-size="17" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="410" y="38" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="435" y="64" text-anchor="middle" font-size="17" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>

  <!-- index labels -->
  <text x="135" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="185" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="235" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="285" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="335" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="385" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="435" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>

  <!-- faint vertical gridlines -->
  <path d="M 135 96 L 135 258" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 185 96 L 185 258" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 235 96 L 235 258" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 285 96 L 285 258" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 335 96 L 335 258" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 385 96 L 385 258" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 435 96 L 435 258" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- track a -->
  <text x="78" y="144" text-anchor="end" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">字母 a</text>
  <path d="M 100 140 L 455 140" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="135" cy="140" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="185" cy="140" r="9" fill="#446688" filter="url(#rough2)"/>
  <circle cx="185" cy="140" r="13.5" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="235" cy="140" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="235" cy="140" r="13.5" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="163" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">末小1</text>
  <text x="235" y="163" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">首大2</text>
  <text x="462" y="144" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1&lt;2 ✓</text>

  <!-- track b -->
  <text x="78" y="196" text-anchor="end" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">字母 b</text>
  <path d="M 100 192 L 455 192" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="285" cy="192" r="9" fill="#446688" filter="url(#rough2)"/>
  <circle cx="285" cy="192" r="13.5" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="385" cy="192" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="385" cy="192" r="13.5" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="215" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">末小3</text>
  <text x="385" y="215" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">首大5</text>
  <text x="462" y="196" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3&lt;5 ✓</text>

  <!-- track c -->
  <text x="78" y="248" text-anchor="end" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">字母 c</text>
  <path d="M 100 244 L 455 244" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="335" cy="244" r="9" fill="#446688" filter="url(#rough2)"/>
  <circle cx="335" cy="244" r="13.5" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="435" cy="244" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="435" cy="244" r="13.5" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="267" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">末小4</text>
  <text x="435" y="267" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">首大6</text>
  <text x="462" y="248" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4&lt;6 ✓</text>

  <!-- legend -->
  <circle cx="118" cy="283" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="287" font-size="10.5" fill="#555" filter="url(#rough2)">小写</text>
  <circle cx="178" cy="283" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="287" font-size="10.5" fill="#555" filter="url(#rough2)">大写</text>
  <circle cx="243" cy="283" r="5.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="243" cy="283" r="9" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="287" font-size="10.5" fill="#555" filter="url(#rough2)">加圈 = 极端位置（末小写 / 首大写）</text>

  <!-- verdict box -->
  <rect x="60" y="302" width="400" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">判定：末小写 &lt; 首大写 → 所有小写都在首个大写之前 → 计入答案</text>

  <rect x="60" y="338" width="400" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">全体小写下标 ≤ 末小写：末小写没过线 ⇒ 全员安全；末小写过线 ⇒ 必有越界者</text>

  <rect x="60" y="372" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">3120 只问「来没来过」；3121 追问「先来后到」→ 出勤表升级为位置表</text>
</svg>
