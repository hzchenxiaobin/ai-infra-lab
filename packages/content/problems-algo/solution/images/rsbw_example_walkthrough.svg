<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：9空格4词 / 7空格3词 / 单单词</text>

  <!-- ===== 示例 1 ===== -->
  <text x="40" y="58" font-size="12" fill="#555" font-weight="bold">示例1</text>
  <!-- input box -->
  <rect x="80" y="44" width="200" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="63" text-anchor="middle" font-size="11" fill="#446688" font-family="monospace">"  this   is  a sentence "</text>
  <!-- arrow -->
  <path d="M 284 58 L 308 58" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- output box -->
  <rect x="312" y="44" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="63" text-anchor="middle" font-size="11" fill="#4a7a3a" font-family="monospace">"this   is   a   sentence"</text>
  <!-- computation -->
  <text x="40" y="88" font-size="10.5" fill="#666">空格=9, 单词=4, 间隔=3 → 每间隔=9÷3=<tspan fill="#4a7a3a" font-weight="bold">3</tspan>, 余数=<tspan fill="#b85450" font-weight="bold">0</tspan>（无末尾空格）</text>

  <line x1="30" y1="100" x2="530" y2="100" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 示例 2 ===== -->
  <text x="40" y="128" font-size="12" fill="#555" font-weight="bold">示例2</text>
  <!-- input box -->
  <rect x="80" y="114" width="200" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="133" text-anchor="middle" font-size="11" fill="#446688" font-family="monospace">" practice   makes   perfect"</text>
  <!-- arrow -->
  <path d="M 284 128 L 308 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- output box -->
  <rect x="312" y="114" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="133" text-anchor="middle" font-size="11" fill="#d6a040" font-family="monospace">"practice   makes   perfect "</text>
  <!-- computation -->
  <text x="40" y="158" font-size="10.5" fill="#666">空格=7, 单词=3, 间隔=2 → 每间隔=7÷2=<tspan fill="#4a7a3a" font-weight="bold">3</tspan>, 余数=<tspan fill="#b85450" font-weight="bold">1</tspan>（末尾留 1 个空格）</text>

  <line x1="30" y1="170" x2="530" y2="170" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 示例 3 (highlighted): 单单词特判 ===== -->
  <rect x="30" y="180" width="500" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="206" font-size="12" fill="#b85450" font-weight="bold">示例5</text>
  <text x="80" y="206" font-size="11" fill="#446688" font-family="monospace">输入: "a"</text>
  <path d="M 160 200 L 184 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="206" font-size="11" fill="#4a7a3a" font-family="monospace">输出: "a"</text>
  <text x="40" y="230" font-size="10.5" fill="#b85450">单单词特判：间隔数 = n−1 = 0，无法分配 → 全部空格（此处为 0）追加到末尾</text>

  <!-- ===== Conclusion box ===== -->
  <rect x="60" y="262" width="440" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">总结</text>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#555">多单词：per = spaces ÷ (n−1)，extra = spaces mod (n−1)</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#555">单单词：无间隔，所有空格追加到末尾</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#888">守恒等式 spaces = per × (n−1) + extra 始终成立</text>
</svg>
