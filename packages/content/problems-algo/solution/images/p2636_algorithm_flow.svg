<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：启动 n 个 → 每次 resolve 补一个 → 全部 resolve 则收尾</text>

  <!-- Start node -->
  <rect x="260" y="48" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="320" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">入口</text>
  <path d="M 320 80 L 320 96" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init: start min(n, len) -->
  <rect x="210" y="98" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="320" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">启动 min(n, len) 个函数</text>
  <text x="320" y="134" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i 从 0 推进；每个挂 .then(onResolve)</text>
  <path d="M 320 142 L 320 168" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < total? -->
  <polygon points="320,168 420,210 320,252 220,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">还有未启动函数?</text>
  <text x="320" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(i &lt; total)</text>
  <path d="M 220 210 L 150 210" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="185" y="202" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- No branch: idle (slot waits) -->
  <rect x="40" y="190" width="110" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="95" y="208" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">槽位空闲等待</text>
  <text x="95" y="222" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">不动 i</text>

  <!-- Yes branch: start next -->
  <path d="M 320 252 L 320 270" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="266" font-size="10" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="210" y="272" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="320" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">启动 functions[i]；i++；挂 .then(onResolve)</text>

  <!-- onResolve box (right) -->
  <path d="M 420 210 L 470 210" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="445" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">resolve</text>
  <rect x="472" y="178" width="148" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="546" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">onResolve：</text>
  <text x="546" y="214" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">completed++</text>
  <text x="546" y="230" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">completed==total? → 收尾</text>
  <!-- feedback arrow from onResolve back to decision -->
  <path d="M 546 178 C 546 130, 420 120, 360 110" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="500" y="120" font-size="10" fill="#4a7a3a" filter="url(#rough2)">回到判定：补下一个</text>

  <!-- Final resolve -->
  <path d="M 546 242 L 546 270" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="470" y="272" width="152" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="546" y="293" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ resolve() 全部完成</text>

  <!-- bottom note -->
  <rect x="24" y="324" width="592" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="342" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">关键：用 completed 计数判收尾，而非 i==total（后者只表示“全部已启动”）</text>
</svg>
