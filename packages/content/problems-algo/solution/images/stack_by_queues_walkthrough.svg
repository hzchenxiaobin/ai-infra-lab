<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">用队列实现栈：示例演算</text>
  <path d="M 280 42 Q 450 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="64" text-anchor="middle" font-size="11" fill="#666">队列左端=队首(栈顶)；push 后旋转使新元素到队首，pop 直接出队首</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="30" y="78" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="90" y="78" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="210" y="78" width="280" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="490" y="78" width="280" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="770" y="78" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="60" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">步骤</text>
  <text x="150" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">操作</text>
  <text x="350" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">旋转前队列</text>
  <text x="630" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">旋转后（队首=栈顶）</text>
  <text x="810" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">返回</text>

  <!-- 行 1: push(1) -->
  <text x="60" y="126" text-anchor="middle" font-size="11" fill="#333">①</text>
  <text x="150" y="126" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">push(1)</text>
  <g filter="url(#sk)"><rect x="350" y="112" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="370" y="129" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="470" y="128" font-size="14" fill="#666">→</text>
  <text x="530" y="126" font-size="10" fill="#888">size=1 不转</text>
  <g filter="url(#sk)"><rect x="610" y="112" width="40" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="630" y="129" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="810" y="126" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- 行 2: push(2) -->
  <text x="60" y="166" text-anchor="middle" font-size="11" fill="#333">②</text>
  <text x="150" y="166" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">push(2)</text>
  <g filter="url(#sk)">
    <rect x="330" y="152" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="370" y="152" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="350" y="169" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="390" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="430" y="168" font-size="10" fill="#b85450">转1次</text>
  <text x="490" y="168" font-size="14" fill="#666">→</text>
  <g filter="url(#sk)">
    <rect x="590" y="152" width="40" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="630" y="152" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="610" y="169" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="650" y="169" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="810" y="166" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- 行 3: push(3) -->
  <text x="60" y="206" text-anchor="middle" font-size="11" fill="#333">③</text>
  <text x="150" y="206" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">push(3)</text>
  <g filter="url(#sk)">
    <rect x="310" y="192" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="350" y="192" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="390" y="192" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="330" y="209" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="370" y="209" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="410" y="209" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="450" y="208" font-size="10" fill="#b85450">转2次</text>
  <text x="500" y="208" font-size="14" fill="#666">→</text>
  <g filter="url(#sk)">
    <rect x="570" y="192" width="40" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="610" y="192" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="650" y="192" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="590" y="209" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="630" y="209" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="670" y="209" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="810" y="206" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- 行 4: top() -->
  <text x="60" y="246" text-anchor="middle" font-size="11" fill="#333">④</text>
  <text x="150" y="246" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">top()</text>
  <g filter="url(#sk)">
    <rect x="570" y="232" width="40" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="610" y="232" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="650" y="232" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="590" y="249" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">3</text>
  <text x="630" y="249" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="670" y="249" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="810" y="246" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">3</text>

  <!-- 行 5: pop() -->
  <text x="60" y="286" text-anchor="middle" font-size="11" fill="#333">⑤</text>
  <text x="150" y="286" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">pop()</text>
  <g filter="url(#sk)">
    <rect x="570" y="272" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="610" y="272" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="650" y="272" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="590" y="289" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="630" y="289" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="670" y="289" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="640" y="312" text-anchor="middle" font-size="10" fill="#b85450">↑ 弹出队首</text>
  <text x="810" y="286" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- 行 6: push(4) -->
  <text x="60" y="346" text-anchor="middle" font-size="11" fill="#333">⑥</text>
  <text x="150" y="346" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">push(4)</text>
  <g filter="url(#sk)">
    <rect x="330" y="332" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="370" y="332" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="410" y="332" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="350" y="349" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="390" y="349" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="430" y="349" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <text x="470" y="348" font-size="10" fill="#b85450">转2次</text>
  <text x="520" y="348" font-size="14" fill="#666">→</text>
  <g filter="url(#sk)">
    <rect x="570" y="332" width="40" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="610" y="332" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="650" y="332" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="590" y="349" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">4</text>
  <text x="630" y="349" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="670" y="349" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="810" y="346" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- 行 7: pop() -->
  <text x="60" y="386" text-anchor="middle" font-size="11" fill="#333">⑦</text>
  <text x="150" y="386" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">pop()</text>
  <g filter="url(#sk)">
    <rect x="570" y="372" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="610" y="372" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="650" y="372" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="590" y="389" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <text x="630" y="389" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="670" y="389" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="810" y="386" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>

  <!-- 行 8: pop() -->
  <text x="60" y="426" text-anchor="middle" font-size="11" fill="#333">⑧</text>
  <text x="150" y="426" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">pop()</text>
  <g filter="url(#sk)">
    <rect x="610" y="412" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="650" y="412" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="630" y="429" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="670" y="429" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="810" y="426" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- 行 9: empty() -->
  <text x="60" y="466" text-anchor="middle" font-size="11" fill="#333">⑨</text>
  <text x="150" y="466" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">empty()</text>
  <g filter="url(#sk)">
    <rect x="630" y="452" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="650" y="469" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="810" y="466" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">false</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="30" y="498" width="820" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="440" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">出栈序列 3, 4, 2 与压入序列 1,2,3,4 的逆序一致 → LIFO 达成</text>
  <text x="440" y="538" text-anchor="middle" font-size="11" fill="#444">push 触发旋转（代价 O(n)）；pop/top/empty 直接操作队首，O(1)</text>
</svg>
