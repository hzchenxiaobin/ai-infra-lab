<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, 4, −2]，k = 5</text>

  <!-- givens -->
  <rect x="40" y="40" width="520" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="62" font-size="12.5" fill="#446688" font-weight="bold">total = 2+4 = 6</text>
  <text x="220" y="62" font-size="12.5" fill="#446688" font-weight="bold">|nums| 排序 = [2, 2, 4]</text>
  <text x="410" y="62" font-size="12" fill="#888">求第 5 小子集和</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="40" y="96" width="60"  height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="70"  y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">步</text>
    <rect x="100" y="96" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="170" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">弹出状态 (s, i)</text>
    <rect x="240" y="96" width="90"  height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="285" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">子集和 s</text>
    <rect x="330" y="96" width="230" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="445" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">此步压入堆的后继</text>
  </g>

  <!-- row 1: step 1 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="128" width="60"  height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70"  y="150" text-anchor="middle" font-size="12" fill="#444">1</text>
    <rect x="100" y="128" width="140" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="170" y="150" text-anchor="middle" font-size="12.5" fill="#444">(0, 0)</text>
    <rect x="240" y="128" width="90"  height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="285" y="150" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="330" y="128" width="230" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="445" y="150" text-anchor="middle" font-size="11.5" fill="#446688">① (0+2, 1) = (2, 1)</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="164" width="60"  height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70"  y="186" text-anchor="middle" font-size="12" fill="#444">2</text>
    <rect x="100" y="164" width="140" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="170" y="186" text-anchor="middle" font-size="12.5" fill="#444">(2, 1)</text>
    <rect x="240" y="164" width="90"  height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="285" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="330" y="164" width="230" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="445" y="186" text-anchor="middle" font-size="11.5" fill="#446688">① (4,2)　② (2,2)</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="200" width="60"  height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70"  y="222" text-anchor="middle" font-size="12" fill="#444">3</text>
    <rect x="100" y="200" width="140" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="170" y="222" text-anchor="middle" font-size="12.5" fill="#444">(2, 2)</text>
    <rect x="240" y="200" width="90"  height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="285" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="330" y="200" width="230" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="445" y="222" text-anchor="middle" font-size="11.5" fill="#446688">① (6,3)　② (4,3)</text>
  </g>

  <!-- row 4 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="236" width="60"  height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70"  y="258" text-anchor="middle" font-size="12" fill="#444">4</text>
    <rect x="100" y="236" width="140" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="170" y="258" text-anchor="middle" font-size="12.5" fill="#444">(4, 2)</text>
    <rect x="240" y="236" width="90"  height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="285" y="258" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="330" y="236" width="230" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="445" y="258" text-anchor="middle" font-size="11.5" fill="#446688">① (8,3)　② (6,3)</text>
  </g>

  <!-- row 5: the k-th -->
  <g filter="url(#rough2)">
    <rect x="40"  y="272" width="60"  height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="70"  y="295" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
    <rect x="100" y="272" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="170" y="295" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">(4, 3)</text>
    <rect x="240" y="272" width="90"  height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="285" y="295" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>
    <rect x="330" y="272" width="230" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="445" y="295" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">i = 3 = n，不再分裂</text>
  </g>

  <text x="300" y="330" text-anchor="middle" font-size="12" fill="#888">第 5 小子集和 = 4　（升序：0, 2, 2, 4, 4）</text>

  <!-- formula strip -->
  <rect x="40" y="346" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="374" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">答案 = total − 第 k 小子集和 = 6 − 4 = 2</text>

  <!-- cross check -->
  <rect x="40" y="402" width="520" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300" y="424" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">验证：子序列和降序 = 6, 4, 4, 2, 2, 0, 0, −2</text>
  <text x="300" y="444" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">第 5 大 = 2 ✓（与题面一致）</text>
</svg>
