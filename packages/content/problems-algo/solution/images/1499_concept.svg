<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：|xi−xj| 消为 xj−xi → 方程裂解 → 单调队列维护窗口内 (y−x) 最大</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">x 严格递增，i&lt;j ⇒ xi&lt;xj ⇒ |xi−xj| = xj−xi</text>

  <!-- ===== Equation transformation ===== -->
  <rect x="40" y="58" width="540" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="78" text-anchor="middle" font-size="13" fill="#333">yi + yj + |xi − xj|</text>
  <text x="310" y="96" text-anchor="middle" font-size="13" fill="#333">= yi + yj + (xj − xi) = <tspan fill="#b85450" font-weight="bold">(yi − xi)</tspan> + <tspan fill="#4a7a3a" font-weight="bold">(yj + xj)</tspan></text>

  <!-- ===== Points on x-axis with sliding window ===== -->
  <text x="40" y="128" font-size="11" fill="#446688" font-weight="bold">对每个 j，在 x 距离 ≤ k 的左侧窗口找 max(yi − xi)</text>

  <!-- x-axis -->
  <line x1="60" y1="200" x2="560" y2="200" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- window shading [xj-k, xj] for j=2 (x=5, k=1, window [4,5]) -->
  <rect x="240" y="160" width="40" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">窗口 [xj−k, xj]</text>

  <!-- points: (1,3) (2,0) (5,10) (6,-10) -->
  <!-- point 0: x=1 → px=100 -->
  <circle cx="100" cy="200" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="220" text-anchor="middle" font-size="9" fill="#888">x=1</text>
  <text x="100" y="192" text-anchor="middle" font-size="9" fill="#b85450">v=2</text>

  <!-- point 1: x=2 → px=140 -->
  <circle cx="140" cy="200" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="220" text-anchor="middle" font-size="9" fill="#888">x=2</text>
  <text x="140" y="192" text-anchor="middle" font-size="9" fill="#b85450">v=−2</text>

  <!-- point 2: x=5 → px=260 (current j, in window) -->
  <circle cx="260" cy="200" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">x=5 (j)</text>
  <text x="260" y="192" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">v=5</text>

  <!-- point 3: x=6 → px=300 -->
  <circle cx="300" cy="200" r="5" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="220" text-anchor="middle" font-size="9" fill="#888">x=6</text>
  <text x="300" y="192" text-anchor="middle" font-size="9" fill="#888">v=−16</text>

  <!-- expired markers for points 0,1 (x < 4) -->
  <text x="120" y="238" text-anchor="middle" font-size="9" fill="#b85450">x&lt;4 过期 ✗</text>

  <!-- candidate computation -->
  <rect x="360" y="178" width="220" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="374" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">candidate(j)</text>
  <text x="374" y="212" font-size="10" fill="#555">= (yj + xj) + max(yi − xi)</text>
  <text x="374" y="224" font-size="10" fill="#555">  (窗口内 vi 最大者)</text>

  <!-- ===== Monotonic deque ===== -->
  <text x="40" y="262" font-size="11" fill="#d6a040" font-weight="bold">单调队列（存下标，(y−x) 值单调递减）维护窗口内 (y−x) 最大值</text>

  <!-- deque cells for j=2: after expire, deque=[2:5] -->
  <rect x="70" y="276" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[2]=5</text>
  <text x="70" y="272" font-size="8" fill="#4a7a3a" font-weight="bold">队头 ← 窗口最大</text>

  <text x="180" y="290" font-size="10" fill="#555">j=2 入队后，队头</text>
  <text x="180" y="304" font-size="10" fill="#555">(y−x)=5 即窗口最大</text>

  <!-- operations -->
  <rect x="40" y="324" width="270" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="342" font-size="10" fill="#d6a040" font-weight="bold">两个操作（均摊 O(1)）</text>
  <text x="54" y="358" font-size="10" fill="#555">① <tspan fill="#b85450" font-weight="bold">左端过期出队</tspan>：x[队头] &lt; xj−k 则弹出</text>
  <text x="54" y="372" font-size="10" fill="#555">② <tspan fill="#4a7a3a" font-weight="bold">右端弹尾保单调</tspan>：(y−x)[队尾] ≤ vj 则弹</text>

  <!-- window type note -->
  <rect x="320" y="324" width="260" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="334" y="342" font-size="10" fill="#b85450" font-weight="bold">窗口按 x 差 ≤ k 滑动</text>
  <text x="334" y="358" font-size="10" fill="#555">非"下标差 ≤ k"——x 间距不均</text>
  <text x="334" y="372" font-size="10" fill="#555">过期看 x 值，非下标</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="392" width="540" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="412" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：x 严格递增 ⇒ |xi−xj|=xj−xi ⇒ 方程裂解 ⇒ 单调队列维护 (y−x) 窗口 max</text>
  <text x="310" y="430" text-anchor="middle" font-size="10" fill="#555">与 239/1425 同构——那里维护 nums/dp 的窗口 max，这里维护 (y−x) 的窗口 max</text>
</svg>
