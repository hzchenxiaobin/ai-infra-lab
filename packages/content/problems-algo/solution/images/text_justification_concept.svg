<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：贪心打包 + 空格均匀分配（左侧间隙多分余数）</text>

  <!-- ===== ① Greedy packing ===== -->
  <text x="40" y="56" font-size="12" fill="#b85450" font-weight="bold">① 贪心打包：每行尽可能多放单词，放不下就换行</text>
  <text x="520" y="56" text-anchor="end" font-size="10" fill="#888">maxWidth = 16</text>

  <!-- frame x=40..520 (480px = 16×30) -->
  <rect x="40" y="68" width="480" height="40" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <!-- This (4) -->
  <rect x="40" y="68" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="94" text-anchor="middle" font-size="13" fill="#333">This</text>
  <!-- gap (1 space) -->
  <rect x="160" y="68" width="30" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <!-- is (2) -->
  <rect x="190" y="68" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="94" text-anchor="middle" font-size="13" fill="#333">is</text>
  <!-- gap -->
  <rect x="250" y="68" width="30" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <!-- an (2) -->
  <rect x="280" y="68" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="94" text-anchor="middle" font-size="13" fill="#333">an</text>
  <!-- example rejected -->
  <rect x="370" y="68" width="210" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="475" y="94" text-anchor="middle" font-size="13" fill="#b85450">example</text>
  <text x="345" y="60" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <path d="M 520 88 L 556 88" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="40" y="128" font-size="11" fill="#666">lineLen = 4+1+2+1+2 = 10；+1+7 = 18 &gt; 16 → example 入下一行</text>

  <!-- ===== ② Two-end justify ===== -->
  <text x="40" y="166" font-size="12" fill="#b85450" font-weight="bold">② 两端对齐（非末行，k ≥ 2）：空格均匀分到间隙，左侧多分余数</text>

  <!-- bar: example(7) + 2sp + of(2) + 1sp + text(4) = 16 -->
  <rect x="40" y="180" width="480" height="40" fill="none" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="180" width="210" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="206" text-anchor="middle" font-size="13" fill="#333">example</text>
  <rect x="250" y="180" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="10" fill="#d6a040">2sp</text>
  <rect x="310" y="180" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="206" text-anchor="middle" font-size="13" fill="#333">of</text>
  <rect x="370" y="180" width="30" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="385" y="206" text-anchor="middle" font-size="10" fill="#d6a040">1sp</text>
  <rect x="400" y="180" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="206" text-anchor="middle" font-size="13" fill="#333">text</text>

  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">base+1=2</text>
  <text x="385" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">base=1</text>
  <path d="M 250 240 L 310 240" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 370 240 L 400 240" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="40" y="262" font-size="11" fill="#666">spaces = 16−13 = 3；gaps = 2；base = 3//2 = 1；extra = 3%2 = 1 → 前 1 个 gap 各 +1</text>
  <text x="40" y="280" font-size="10" fill="#888">结果："example  of text"（左 gap=2，右 gap=1，左多右少）</text>

  <!-- ===== ③ Left justify (last line) ===== -->
  <text x="40" y="318" font-size="12" fill="#b85450" font-weight="bold">③ 左对齐（末行 / 单单词）：单词间只留 1 空格，剩余全部补行末</text>

  <rect x="40" y="332" width="480" height="40" fill="none" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="332" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="358" text-anchor="middle" font-size="13" fill="#333">justification.</text>
  <rect x="460" y="332" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" rx="2" filter="url(#rough2)"/>
  <text x="490" y="358" text-anchor="middle" font-size="10" fill="#4a7a3a">行末</text>

  <text x="40" y="392" font-size="11" fill="#666">末行：单词间 1 空格，letters=14，行末补 16−14 = 2 个空格</text>
  <text x="40" y="410" font-size="10" fill="#888">结果："justification.  "（不参与两端对齐，行末允许空格）</text>

  <!-- bottom note -->
  <rect x="40" y="424" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="442" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：余数 extra 从左到右逐个消化 → 左侧间隙分到更多空格</text>
</svg>
