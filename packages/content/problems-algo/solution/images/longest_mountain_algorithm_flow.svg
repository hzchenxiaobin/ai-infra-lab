<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：扫描峰顶，向左右扩展严格单调臂</text>

  <!-- Start -->
  <ellipse cx="270" cy="64" rx="44" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="13" fill="#333">开始</text>
  <path d="M 270 81 L 270 100" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="180" y="100" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="13" fill="#333">ans = 0, i = 1</text>
  <path d="M 270 134 L 270 154" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="150" y="154" width="240" height="30" rx="6" fill="#f6f6f6" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="11.5" fill="#333">while i &lt; n − 1</text>
  <path d="M 270 184 L 270 205" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision1: is peak? -->
  <path d="M 270 205 L 380 248 L 270 291 L 160 248 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="244" text-anchor="middle" font-size="11.5" fill="#333">arr[i−1] &lt; arr[i]</text>
  <text x="270" y="260" text-anchor="middle" font-size="11.5" fill="#333">且 arr[i] &gt; arr[i+1] ?</text>

  <!-- No: not peak → loop back right -->
  <path d="M 380 248 L 440 248 L 440 169 L 390 169" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="418" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="440" y="200" width="86" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="483" y="220" text-anchor="middle" font-size="11.5" fill="#333">i = i + 1</text>
  <path d="M 483 200 L 483 169 L 390 169" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Yes: peak → down -->
  <path d="M 270 291 L 270 316" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="292" y="308" font-size="11" fill="#b85450" font-weight="bold">是·峰顶</text>

  <!-- set l = r = i -->
  <rect x="200" y="316" width="140" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="337" text-anchor="middle" font-size="12.5" fill="#333">l = r = i</text>
  <path d="M 270 348 L 270 368" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- expand left -->
  <rect x="150" y="368" width="240" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="11" fill="#333">while l &gt; 0 且 arr[l−1] &lt; arr[l]</text>
  <text x="270" y="396" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">l = l − 1   （左臂扩展）</text>
  <path d="M 270 402 L 270 422" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- expand right -->
  <rect x="150" y="422" width="240" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="436" text-anchor="middle" font-size="11" fill="#333">while r &lt; n−1 且 arr[r] &gt; arr[r+1]</text>
  <text x="270" y="450" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">r = r + 1   （右臂扩展）</text>
  <path d="M 270 456 L 270 476" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update ans + jump i -->
  <rect x="140" y="476" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="494" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = max(ans, r − l + 1)</text>
  <text x="270" y="510" text-anchor="middle" font-size="11.5" fill="#4a7a3a">i = r + 1  （跳过整座山）</text>

  <!-- loop back left to loop header -->
  <path d="M 140 496 L 70 496 L 70 169 L 150 169" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="332" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">下一轮 i</text>

  <!-- exit + return -->
  <path d="M 270 516 L 270 536" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="530" font-size="10.5" fill="#446688" font-style="italic">i ≥ n−1（循环结束）</text>
  <rect x="210" y="536" width="120" height="0" fill="none"/>
</svg>
