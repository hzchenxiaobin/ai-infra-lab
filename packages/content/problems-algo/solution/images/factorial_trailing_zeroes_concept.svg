<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：末尾零 = 2×5 配对数，2 远多于 5，故数 5 即可</text>

  <!-- ===== Row 1: n! 质因数分解，10=2×5 ===== -->
  <text x="34" y="64" font-size="12" fill="#446688" font-weight="bold">n! 的质因数</text>

  <rect x="120" y="50" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="71" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="150" y="96" text-anchor="middle" font-size="10" fill="#888">v₂(n!)</text>

  <text x="196" y="72" font-size="16" fill="#888" font-weight="bold">×</text>

  <rect x="216" y="50" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="71" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <text x="246" y="96" text-anchor="middle" font-size="10" fill="#b85450">v₅(n!)</text>

  <text x="292" y="72" font-size="16" fill="#888" font-weight="bold">=</text>

  <rect x="312" y="50" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="71" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">10</text>
  <text x="342" y="96" text-anchor="middle" font-size="10" fill="#888">一个零</text>

  <!-- 配对说明 -->
  <rect x="396" y="48" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="476" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">零 = min(v₂, v₅)</text>
  <text x="476" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a">配对数决定零个数</text>

  <!-- arrow down -->
  <path d="M 290 108 Q 290 120 290 132" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: 密度对比——2 多 5 少 ===== -->
  <text x="34" y="160" font-size="12" fill="#446688" font-weight="bold">1~n 中的密度</text>

  <!-- 2 的倍数：密集 -->
  <text x="34" y="186" font-size="11" fill="#446688">2 的倍数</text>
  <g filter="url(#rough2)">
    <rect x="120" y="172" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="146" y="172" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="172" y="172" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="198" y="172" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="224" y="172" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="250" y="172" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
  </g>
  <text x="284" y="188" font-size="14" fill="#bbb" font-weight="bold">···</text>
  <text x="324" y="188" font-size="11" fill="#446688" font-weight="bold">每隔 1 个 → v₂ 多</text>

  <!-- 5 的倍数：稀疏 -->
  <text x="34" y="236" font-size="11" fill="#b85450">5 的倍数</text>
  <g filter="url(#rough2)">
    <rect x="120" y="222" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="146" y="222" width="22" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="172" y="222" width="22" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="198" y="222" width="22" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="224" y="222" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="250" y="222" width="22" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>
  <text x="284" y="238" font-size="14" fill="#bbb" font-weight="bold">···</text>
  <text x="324" y="238" font-size="11" fill="#b85450" font-weight="bold">每隔 5 个 → v₅ 少</text>

  <!-- 结论：v2 >= v5 -->
  <rect x="404" y="206" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="479" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">v₂(n!) ≥ v₅(n!)</text>
  <text x="479" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 零 = v₅(n!)</text>

  <!-- arrow down -->
  <path d="M 290 260 Q 290 272 290 284" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: 勒让德公式 ===== -->
  <rect x="50" y="288" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">勒让德公式 (Legendre, p=5)</text>
  <text x="290" y="328" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">v₅(n!) = ⌊n/5⌋ + ⌊n/25⌋ + ⌊n/125⌋ + …</text>

  <!-- arrow down -->
  <path d="M 290 340 Q 290 350 290 360" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 4: 每一项的含义 ===== -->
  <text x="34" y="384" font-size="12" fill="#446688" font-weight="bold">每一项补一层「额外的 5」</text>

  <rect x="40" y="396" width="150" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="115" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⌊n/5⌋</text>
  <text x="115" y="434" text-anchor="middle" font-size="10" fill="#666">第 1 个 5（5,10,15…）</text>

  <rect x="210" y="396" width="150" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="285" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⌊n/25⌋</text>
  <text x="285" y="434" text-anchor="middle" font-size="10" fill="#666">第 2 个 5（25,50…）</text>

  <rect x="380" y="396" width="150" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="455" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⌊n/125⌋</text>
  <text x="455" y="434" text-anchor="middle" font-size="10" fill="#666">第 3 个 5（125…）</text>
</svg>
