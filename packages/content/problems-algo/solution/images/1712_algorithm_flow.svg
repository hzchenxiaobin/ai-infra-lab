<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双指针 jmin / jmax 随 i 单调右移，O(n)</text>

  <!-- Step 1: prefix sum -->
  <rect x="60" y="46" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 预处理前缀和 P[0..n]，P[k]=Σnums[0..k−1]</text>
  <text x="280" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">非负数组 → P 单调不减（双指针可行的前提）</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init pointers -->
  <rect x="120" y="112" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 初始化 jmin = 1, jmax = 1, ans = 0</text>
  <text x="280" y="146" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（jmin=合法 j 下界，jmax=首个不合法 j）</text>

  <path d="M 280 160 L 280 178" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop over i -->
  <rect x="100" y="182" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 遍历分界 i = 1 .. n−2</text>
  <text x="280" y="216" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">left=nums[0..i−1] 至少 1 个，right 至少 1 个</text>

  <path d="M 280 230 L 280 248" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: find jmin -->
  <rect x="50" y="252" width="460" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="62" y="272" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 推进 jmin：保证 jmin ≥ i+1，再右移到首个满足</text>
  <line x1="62" y1="280" x2="498" y2="280" stroke="#e8c0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="298" font-size="10" fill="#555" filter="url(#rough2)">while jmin &lt; n 且 P[jmin] − P[i] &lt; P[i]：</text>
  <text x="62" y="312" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">　　jmin += 1　　# 即 P[jmin] ≥ 2·P[i]</text>

  <path d="M 280 322 L 280 340" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: find jmax -->
  <rect x="50" y="344" width="460" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="62" y="364" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ 推进 jmax：保证 jmax ≥ jmin，再右移到首个不满足</text>
  <line x1="62" y1="372" x2="498" y2="372" stroke="#e8c0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="390" font-size="10" fill="#555" filter="url(#rough2)">while jmax &lt; n 且 2·P[jmax] ≤ P[n] + P[i]：</text>
  <text x="62" y="404" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">　　jmax += 1　　# 停时 midSum &gt; rightSum</text>

  <path d="M 280 414 L 280 432" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: accumulate -->
  <rect x="80" y="436" width="400" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑥ 合法 j ∈ [jmin, jmax−1]，共 jmax − jmin 个</text>
  <text x="280" y="472" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = (ans + jmax − jmin) % MOD　　（若 &gt; 0）</text>

  <!-- loop back arrow -->
  <path d="M 488 460 L 524 460 L 524 204 L 464 204" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="530" y="324" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下</text>
  <text x="530" y="336" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一</text>
  <text x="530" y="348" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">个</text>
  <text x="530" y="360" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i</text>

  <!-- complexity note -->
  <rect x="60" y="496" width="440" height="36" fill="#fff" stroke="#eee" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="514" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">时间 O(n)　|　空间 O(n)（前缀和数组）</text>
  <text x="280" y="528" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">jmin、jmax 各最多 +1 n 次 → 两指针总移动 2n</text>
</svg>
