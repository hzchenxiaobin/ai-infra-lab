<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD2" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L4.5,8 L9,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：按右端点排序 + 单遍扫描贪心</text>

  <!-- Step 1: sort -->
  <rect x="170" y="48" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">按右端点 b 升序排序</text>
  <line x1="260" y1="82" x2="260" y2="100" stroke="#888" stroke-width="1.6" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="170" y="102" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">end = −∞，count = 0</text>
  <line x1="260" y1="136" x2="260" y2="154" stroke="#888" stroke-width="1.6" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 3: for each pair -->
  <rect x="150" y="156" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历每个数对 [a, b]</text>
  <line x1="260" y1="190" x2="260" y2="208" stroke="#888" stroke-width="1.6" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,210 360,250 260,290 160,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">a &gt; end ?</text>
  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#888">（严格大于）</text>

  <!-- Yes branch -->
  <line x1="360" y1="250" x2="410" y2="250" stroke="#888" stroke-width="1.6" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="380" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="232" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="456" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count++</text>
  <text x="456" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">end = b</text>

  <!-- No branch -->
  <line x1="160" y1="250" x2="110" y2="250" stroke="#888" stroke-width="1.6" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="138" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="22" y="232" width="88" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="66" y="255" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过该数对</text>

  <!-- loop back arrow -->
  <path d="M 456 268 L 456 300 L 260 300 L 260 174" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="360" y="316" text-anchor="middle" font-size="10" fill="#888" font-style="italic">回到遍历下一个数对</text>

  <line x1="260" y1="290" x2="260" y2="324" stroke="#888" stroke-width="1.6" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="276" y="312" font-size="10.5" fill="#888">遍历结束</text>

  <!-- return -->
  <rect x="170" y="326" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 count（最长链长）</text>
</svg>
