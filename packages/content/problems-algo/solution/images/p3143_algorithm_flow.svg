<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">流程：一遍扫描定边界，再数一遍出答案</text>

  <!-- 遍历框 -->
  <rect x="165" y="46" width="190" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">遍历每个点 i</text>
  <line x1="260" y1="82" x2="260" y2="104" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计算 d -->
  <rect x="140" y="106" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d = max(|x|,|y|)，c = s[i]</text>
  <line x1="260" y1="144" x2="260" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,162 355,194 260,226 165,194" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="199" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d &lt; first[c] ?</text>

  <path d="M 165 194 L 132 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355 194 L 392 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="222" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="366" y="222" font-size="12" fill="#d6a040" filter="url(#rough2)">否</text>

  <!-- 左分支：刷新最小 -->
  <rect x="25" y="242" width="215" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="132" y="264" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">minSecond = min(minSecond, first[c])</text>
  <text x="132" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">first[c] = d</text>
  <text x="132" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（新王登基，旧王降级为次小）</text>

  <!-- 右分支：竞逐次小 -->
  <rect x="290" y="242" width="205" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">minSecond = min(minSecond, d)</text>
  <text x="392" y="298" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">（争不到最小，竞逐次小）</text>

  <!-- 回环虚线 -->
  <path d="M 495 280 L 495 64 L 360 64" stroke="#999" stroke-width="1.4" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="56" font-size="11" fill="#999" filter="url(#rough2)">下一个点</text>

  <!-- 汇合到底框 -->
  <path d="M 132 318 L 200 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 392 318 L 320 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="354" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">再扫一遍：数出 d &lt; minSecond</text>
  <text x="260" y="388" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">的点数 → 返回</text>
</svg>
