<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：UNION ALL 把三路额度变动汇成一张「流水表」</text>

  <!-- ===== Source 1: Users (initial credit) ===== -->
  <text x="90" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">① 初始额度 Users</text>
  <rect x="36" y="74" width="108" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="92" text-anchor="middle" font-size="10" fill="#333">user_id, +credit</text>

  <!-- ===== Source 2: paid_by (outflow) ===== -->
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② 支出方 paid_by</text>
  <rect x="226" y="74" width="108" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#333">paid_by, −amount</text>

  <!-- ===== Source 3: paid_to (inflow) ===== -->
  <text x="470" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 收入方 paid_to</text>
  <rect x="416" y="74" width="108" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="92" text-anchor="middle" font-size="10" fill="#333">paid_to, +amount</text>

  <!-- arrows down to UNION ALL -->
  <path d="M 90 102 L 230 168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <path d="M 280 102 L 280 168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <path d="M 470 102 L 330 168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <!-- ===== UNION ALL box ===== -->
  <rect x="150" y="172" width="260" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="193" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">UNION ALL（保留重复行）</text>
  <text x="280" y="211" text-anchor="middle" font-size="10" fill="#666">三路 (user_id, credit_delta) 拼成统一流水</text>

  <path d="M 280 220 L 280 238" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <!-- ===== GROUP BY + SUM ===== -->
  <rect x="120" y="242" width="320" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">GROUP BY user_id  +  SUM(credit_delta)</text>
  <text x="280" y="281" text-anchor="middle" font-size="10" fill="#666">初始额度 − 支出 + 收入 = 当前余额</text>

  <path d="M 280 296 L 280 314" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <!-- ===== IF < 0 then Yes ===== -->
  <rect x="150" y="318" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">IF(SUM(credit) &lt; 0, 'Yes', 'No')</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#666">余额 &lt; 0 → 透支 'Yes'，否则 'No'</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="376" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：用 UNION ALL 而非 JOIN</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#666">UNION ALL 不去重，保留每笔交易；某用户无交易时仅 ① 贡献一行</text>
</svg>
