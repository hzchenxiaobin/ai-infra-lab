<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "a?a?" → "abac"</text>

  <!-- table header -->
  <rect x="40" y="44" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="120" y="44" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="300" y="44" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">freq 变化</text>
  <rect x="410" y="44" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="445" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">filled</text>

  <!-- row 1 -->
  <rect x="40" y="76" width="80" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始</text>
  <rect x="120" y="76" width="180" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">扫一遍 s 统计频次</text>
  <rect x="300" y="76" width="110" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a=2</text>
  <rect x="410" y="76" width="70" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[ ]</text>

  <!-- row 2 -->
  <rect x="40" y="110" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">'?' ①</text>
  <rect x="120" y="110" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">最小频 0 → 选 b</text>
  <rect x="300" y="110" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">b: 0→1</text>
  <rect x="410" y="110" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[b]</text>

  <!-- row 3 -->
  <rect x="40" y="144" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="164" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">'?' ②</text>
  <rect x="120" y="144" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="164" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">最小频 0 → 选 c</text>
  <rect x="300" y="144" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="164" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">c: 0→1</text>
  <rect x="410" y="144" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="164" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[b,c]</text>

  <!-- row 4 -->
  <rect x="40" y="178" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">回填</text>
  <rect x="120" y="178" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">排序（本就有序）→ 依序填 '?'</text>
  <rect x="300" y="178" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">—</text>
  <rect x="410" y="178" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">"bc"</text>

  <path d="M 260 216 L 260 236" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- result string -->
  <text x="60" y="278" font-size="12" fill="#888" filter="url(#rough2)">结果</text>
  <rect x="100" y="256" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="278" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="146" y="256" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="192" y="256" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="278" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="238" y="256" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="296" y="278" font-size="12" fill="#888" filter="url(#rough2)">← 绿色为填入的字母</text>

  <!-- cost check -->
  <text x="120" y="308" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cost=0</text>
  <text x="166" y="308" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cost=0</text>
  <text x="212" y="308" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cost=1</text>
  <text x="258" y="308" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cost=0</text>

  <rect x="40" y="324" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">核对：x_a=2 → 1，x_b=x_c=1 → 0，分数 = 0+0+1+0 = 1</text>
  <text x="260" y="359" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">与示例 2 输出 "abac" 一致 ✓</text>
</svg>
