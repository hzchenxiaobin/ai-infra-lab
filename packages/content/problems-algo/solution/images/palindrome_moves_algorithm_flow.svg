<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贪心配对 + 冒泡（O(n²)）</text>

  <!-- Start -->
  <rect x="220" y="42" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">left=0, right=n−1, ans=0</text>
  <path d="M280,72 L280,86" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: left < right ? -->
  <polygon points="280,90 360,128 280,166 200,128" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">left &lt; right ?</text>
  <text x="280" y="140" text-anchor="middle" font-size="10.5" fill="#888">未配对完？</text>
  <!-- No branch -> return -->
  <path d="M360,128 L420,128" stroke="#888" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="378" y="122" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="113" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="475" y="133" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>
  <!-- Yes branch down -->
  <path d="M280,166 L280,182" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Search box -->
  <rect x="160" y="186" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">j = right</text>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#555">while j&gt;left 且 s[j]≠s[left]: j−−</text>
  <path d="M280,226 L280,242" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: j == left ? (odd char) -->
  <polygon points="280,246 370,286 280,326 190,286" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">j == left ?</text>
  <text x="280" y="298" text-anchor="middle" font-size="10" fill="#888">未找到匹配（奇数字符）</text>

  <!-- Yes (odd) branch -> left side -->
  <path d="M190,286 L120,286" stroke="#888" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="280" font-size="11" fill="#d6a040" font-weight="bold">是</text>
  <rect x="40" y="266" width="78" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="79" y="284" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">交换 s[left],</text>
  <text x="79" y="298" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">s[left+1]</text>
  <text x="79" y="320" text-anchor="middle" font-size="10" fill="#d6a040">ans+1，不推进指针</text>

  <!-- No (found) branch -> right side -->
  <path d="M370,286 L440,286" stroke="#888" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="398" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="440" y="266" width="92" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="486" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">冒泡 s[j] 到 right</text>
  <text x="486" y="298" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans += right−j</text>
  <text x="486" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a">left++, right−−</text>

  <!-- Loop back arrows -->
  <!-- from odd box back up to top diamond -->
  <path d="M79,266 L79,128 L196,128" fill="none" stroke="#888" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="86" y="200" font-size="10" fill="#888">重试本层</text>
  <!-- from found box back up to top diamond -->
  <path d="M486,266 L486,128 L364,128" fill="none" stroke="#888" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="450" y="200" font-size="10" fill="#888">处理下一对</text>

  <!-- Divider -->
  <path d="M 40 350 L 520 350" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Notes -->
  <text x="40" y="372" font-size="11.5" fill="#555" font-weight="bold">要点说明：</text>
  <text x="60" y="392" font-size="11" fill="#555">• 「是」分支：s[left] 是出现奇数次的唯一字符（回文中心），逐次向右挪，最终落到正中。</text>
  <text x="60" y="410" font-size="11" fill="#555">• 「否」分支：取最右侧同字符 j 配对，冒泡距离 right−j 即本轮代价。</text>
  <text x="60" y="428" font-size="11" fill="#555">• 两个分支处理后都回到「left &lt; right?」判断，继续向内层推进。</text>

  <!-- Complexity box -->
  <rect x="60" y="448" width="440" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="466" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">时间 O(n²)（每轮搜索+冒泡共 O(n)，共 n/2 轮）｜空间 O(n)</text>
  <text x="280" y="480" text-anchor="middle" font-size="10.5" fill="#888">n ≤ 2000，O(n²) ≈ 4×10⁶ 可接受；进阶用树状数组降到 O(n log n)</text>
</svg>
