<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">计分规则：一跳 i → j 得 (j − i) × nums[j]</text>
  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">跨度 × 落点值——计分看「落在哪」，不看「从哪起跳」</text>

  <!-- 数组格子：[4,5,2,8,9,1,3]，7 格 w=52 gap=12，start x=42 -->
  <rect x="42" y="140" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="167" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="68" y="200" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下标0·起点</text>

  <rect x="106" y="140" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="167" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="132" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>

  <rect x="170" y="140" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="167" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="196" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <rect x="234" y="140" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="167" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="260" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <rect x="298" y="140" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="167" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="324" y="200" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">4·落点</text>

  <rect x="362" y="140" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="167" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="388" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <rect x="426" y="140" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="167" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="452" y="200" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">6·终点</text>

  <!-- 跳 0→4 的大弧 -->
  <path d="M 68 136 Q 196 48 322 134" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="196" y="72" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">0 → 4：跨度 4 × 落点值 9 = 36</text>

  <!-- 跳 4→6 的小弧 -->
  <path d="M 330 130 Q 390 84 448 134" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="98" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 → 6：2 × 3 = 6</text>

  <text x="260" y="222" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">起点固定为 0，且必须最终停在下标 n−1 = 6</text>

  <!-- 对比框 A：逐格跳 -->
  <rect x="30" y="240" width="222" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="141" y="262" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">逐格跳 0→1→⋯→6</text>
  <text x="141" y="283" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">= 5+2+8+9+1+3 = 28</text>
  <text x="141" y="303" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#rough2)">每步跨度 1，浪费了大落点值 ✗</text>

  <!-- 对比框 B：最优 -->
  <rect x="272" y="240" width="218" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="262" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最优 0→4→6</text>
  <text x="381" y="283" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">= 4×9 + 2×3 = 42</text>
  <text x="381" y="303" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">让大值「承包」尽量长的跨度 ✓</text>

  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">对照示例 1 [1,5,8]：直达 0→2 得 2×8 = 16 &gt; 0→1→2 的 5+8 = 13，同样是「大跨度配大落点值」更赚</text>
</svg>
