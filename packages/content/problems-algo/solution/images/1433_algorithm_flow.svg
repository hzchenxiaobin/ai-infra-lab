<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="500" height="520" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两串排序 → 检查 s1 打破 s2 → 否则检查 s2 打破 s1</text>

  <!-- 开始 -->
  <rect x="200" y="44" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="250" y="62" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- 排序 -->
  <path d="M 250 72 L 250 84" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="88" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="108" text-anchor="middle" font-size="12" fill="#333">s1' = sort(s1)，s2' = sort(s2)</text>

  <!-- 遍历初始化 -->
  <path d="M 250 120 L 250 132" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="150" y="136" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="156" text-anchor="middle" font-size="12" fill="#333">ok1 = ok2 = true，i = 0</text>

  <!-- 累加判定框 -->
  <path d="M 250 168 L 250 180" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="110" y="184" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="205" text-anchor="middle" font-size="11.5" fill="#333">ok1 &amp;= (s1'[i] ≥ s2'[i])，ok2 &amp;= (s2'[i] ≥ s1'[i])</text>

  <!-- 菱形: 两个都失败? -->
  <path d="M 250 218 L 250 230" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <polygon points="250,234 360,274 250,314 140,274" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">ok1 &amp; ok2 都为 false ?</text>
  <text x="250" y="286" text-anchor="middle" font-size="10" fill="#b85450">(两个方向都失败)</text>

  <!-- 是 → 返回 false -->
  <path d="M 360 274 L 410 274 L 410 372" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="372" y="268" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="350" y="376" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="396" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>

  <!-- 否 → 继续？ i<n -->
  <path d="M 140 274 L 90 274 L 90 201 L 110 201" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="128" y="268" font-size="11" fill="#446688" font-weight="bold">否</text>
  <text x="58" y="244" font-size="10" fill="#888">i++，i&lt;n</text>

  <!-- 菱形: 遍历结束 -->
  <path d="M 250 314 L 250 330" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <polygon points="250,334 350,370 250,406 150,370" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="368" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">ok1 || ok2 ?</text>
  <text x="250" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a">(任一方向成立)</text>

  <!-- 是 → 返回 true -->
  <path d="M 250 406 L 250 418" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="266" y="414" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="190" y="422" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="442" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 true</text>

  <!-- 否 → 连到 false 框 -->
  <path d="M 150 370 L 60 370 L 60 392 L 350 392" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="138" y="364" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- 结束 -->
  <path d="M 250 454 L 250 466" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="200" y="470" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="250" y="486" text-anchor="middle" font-size="11" fill="#333">结束</text>
</svg>
