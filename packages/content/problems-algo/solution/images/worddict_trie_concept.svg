<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">Trie 通配符匹配：「.」分叉到所有非空子节点</text>

  <!-- ===== left: inserted words ===== -->
  <rect x="24" y="50" width="120" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="84" y="70" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">插入的单词</text>
  <rect x="40" y="80" width="88" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="96" text-anchor="middle" font-size="12" fill="#333">bad</text>
  <rect x="40" y="108" width="88" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="124" text-anchor="middle" font-size="12" fill="#333">dad</text>
  <rect x="40" y="136" width="88" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="152" text-anchor="middle" font-size="12" fill="#333">mad</text>

  <path d="M 144 110 L 200 90" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="104" font-size="9" fill="#888">建 Trie</text>

  <!-- ===== Trie tree ===== -->
  <!-- root -->
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="80" rx="22" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">root</text>

  <!-- level 1: b / d / m -->
  <path d="M 268 96 L 180 140" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="116" font-size="10" fill="#888">b</text>
  <path d="M 280 98 L 280 138" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="124" font-size="10" fill="#888">d</text>
  <path d="M 292 96 L 380 140" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="116" font-size="10" fill="#888">m</text>

  <!-- dashed orange oval highlighting the three branches = '.' matches -->
  <ellipse cx="280" cy="158" rx="130" ry="34" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">「.」在此分叉 → 尝试 b / d / m 三支</text>

  <g filter="url(#rough2)"><circle cx="174" cy="158" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="174" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <g filter="url(#rough2)"><circle cx="280" cy="158" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d</text>
  <g filter="url(#rough2)"><circle cx="386" cy="158" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="386" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">m</text>

  <!-- level 2: a (shared, drawn three times for clarity) -->
  <path d="M 174 173 L 174 218" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="200" font-size="10" fill="#888">a</text>
  <path d="M 280 173 L 280 218" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="200" font-size="10" fill="#888">a</text>
  <path d="M 386 173 L 386 218" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="200" font-size="10" fill="#888">a</text>

  <g filter="url(#rough2)"><circle cx="174" cy="234" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="174" y="238" text-anchor="middle" font-size="11" fill="#446688">a</text>
  <g filter="url(#rough2)"><circle cx="280" cy="234" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#446688">a</text>
  <g filter="url(#rough2)"><circle cx="386" cy="234" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="386" y="238" text-anchor="middle" font-size="11" fill="#446688">a</text>

  <!-- level 3: d★ (word end) -->
  <path d="M 174 249 L 174 294" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="276" font-size="10" fill="#888">d</text>
  <path d="M 280 249 L 280 294" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="276" font-size="10" fill="#888">d</text>
  <path d="M 386 249 L 386 294" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="276" font-size="10" fill="#888">d</text>

  <g filter="url(#rough2)"><circle cx="174" cy="310" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="174" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">d★</text>
  <g filter="url(#rough2)"><circle cx="280" cy="310" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">d★</text>
  <g filter="url(#rough2)"><circle cx="386" cy="310" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="386" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">d★</text>

  <text x="280" y="345" text-anchor="middle" font-size="9" fill="#4a7a3a">★ = 单词结尾（is_end）</text>

  <!-- ===== bottom: short-circuit note ===== -->
  <rect x="60" y="358" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a">短路：search(".ad") 试到 b→a→d★ 即返回 true，不再探索 d / m 分支</text>
</svg>
