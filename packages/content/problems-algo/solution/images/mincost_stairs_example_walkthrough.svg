<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：cost = [10, 15, 20]</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">dp(0)=10, dp(1)=15, dp(2)=min(10,15)+20=30；答案 min(30,15)=15</text>

  <!-- ===== cost row ===== -->
  <text x="40" y="86" font-size="11" fill="#888" font-weight="bold">cost:</text>
  <text x="120" y="74" text-anchor="middle" font-size="9" fill="#aaa">下标0</text>
  <text x="190" y="74" text-anchor="middle" font-size="9" fill="#aaa">下标1</text>
  <text x="260" y="74" text-anchor="middle" font-size="9" fill="#aaa">下标2</text>
  <text x="360" y="74" text-anchor="middle" font-size="9" fill="#aaa">楼顶(n=3)</text>

  <rect x="100" y="80" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="101" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="166" y="80" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>
  <rect x="232" y="80" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="101" text-anchor="middle" font-size="13" fill="#333">20</text>
  <rect x="320" y="80" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">顶(无cost)</text>

  <!-- ===== dp row ===== -->
  <text x="40" y="158" font-size="11" fill="#888" font-weight="bold">dp:</text>
  <text x="120" y="146" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="190" y="146" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="260" y="146" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>

  <rect x="100" y="152" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="173" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">10</text>
  <rect x="166" y="152" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="173" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">15</text>
  <rect x="232" y="152" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="173" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">30</text>

  <!-- annotation: dp(2)=min(10,15)+20 -->
  <path d="M 122 186 Q 180 214 250 186" stroke="#4a7a3a" stroke-width="0.8" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" opacity="0.6" filter="url(#rough2)"/>
  <path d="M 188 186 Q 220 214 250 186" stroke="#4a7a3a" stroke-width="0.8" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" opacity="0.6" filter="url(#rough2)"/>
  <text x="210" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a">min(10,15)+20 = 30</text>

  <!-- ===== answer box ===== -->
  <rect x="100" y="232" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="252" text-anchor="middle" font-size="11" fill="#444">到楼顶可从 n−1=2 或 n−2=1 跨出</text>
  <text x="250" y="266" text-anchor="middle" font-family="monospace" font-size="12" fill="#b85450" font-weight="bold">ans = min(dp[2], dp[1]) = min(30, 15) = 15</text>

  <!-- ===== optimal path ===== -->
  <text x="40" y="300" font-size="11" fill="#888" font-weight="bold">最优路径:</text>
  <rect x="100" y="288" width="44" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="122" y="306" text-anchor="middle" font-size="11" fill="#aaa">10</text>
  <rect x="166" y="288" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15 ✓</text>
  <rect x="232" y="288" width="44" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="254" y="306" text-anchor="middle" font-size="11" fill="#aaa">20</text>
  <rect x="320" y="288" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">楼顶 ✓</text>

  <!-- arrow: start at 1, jump 2 to top -->
  <path d="M 210 302 Q 265 270 320 302" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="240" y="262" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">跨 2 直达顶</text>

  <!-- ===== footer ===== -->
  <rect x="100" y="332" width="300" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">起点选 1 阶付 15，再跨 2 步登顶</text>
  <text x="250" y="364" text-anchor="middle" font-size="9" fill="#888">总花费 15 &lt; 走 0→2→顶 的 30</text>
</svg>
