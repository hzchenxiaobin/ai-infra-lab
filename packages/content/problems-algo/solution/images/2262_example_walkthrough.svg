<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "abbca"，逐位置滚动 cur = f(i)</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">每步 delta = i − last[s[i]]，cur += delta，ans += cur</text>

  <!-- ===== Table header ===== -->
  <rect x="36" y="54" width="488" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="138" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">s[i]</text>
  <text x="218" y="72" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">last[c](前)</text>
  <text x="312" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">delta=i−last</text>
  <text x="402" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cur=f(i)</text>
  <text x="482" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans(累计)</text>

  <!-- column separators -->
  <line x1="100" y1="54" x2="100" y2="284" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="178" y1="54" x2="178" y2="284" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="262" y1="54" x2="262" y2="284" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="366" y1="54" x2="366" y2="284" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="446" y1="54" x2="446" y2="284" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row data: each 34 high, start y=86 ===== -->
  <!-- row i=0 -->
  <rect x="36" y="82" width="488" height="34" fill="#f4f7fb" stroke="none"/>
  <text x="68" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="138" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <text x="218" y="104" text-anchor="middle" font-size="12" fill="#666">−1</text>
  <text x="312" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0−(−1)=1</text>
  <text x="402" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="482" y="104" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

  <!-- row i=1 -->
  <rect x="36" y="116" width="488" height="34" fill="#fff" stroke="none"/>
  <text x="68" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="138" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <text x="218" y="138" text-anchor="middle" font-size="12" fill="#666">−1</text>
  <text x="312" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1−(−1)=2</text>
  <text x="402" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="482" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>

  <!-- row i=2 -->
  <rect x="36" y="150" width="488" height="34" fill="#f4f7fb" stroke="none"/>
  <text x="68" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="138" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <text x="218" y="172" text-anchor="middle" font-size="12" fill="#666">1</text>
  <text x="312" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2−1=1</text>
  <text x="402" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="482" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">8</text>

  <!-- row i=3 -->
  <rect x="36" y="184" width="488" height="34" fill="#fff" stroke="none"/>
  <text x="68" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="138" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c</text>
  <text x="218" y="206" text-anchor="middle" font-size="12" fill="#666">−1</text>
  <text x="312" y="206" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3−(−1)=4</text>
  <text x="402" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="482" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">16</text>

  <!-- row i=4 HIGHLIGHTED (final) -->
  <rect x="36" y="218" width="488" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="240" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <text x="138" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <text x="218" y="240" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="312" y="240" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4−0=4</text>
  <text x="402" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">12</text>
  <text x="482" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">28</text>

  <!-- table outer border -->
  <rect x="36" y="54" width="488" height="198" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- annotation for final ans -->
  <path d="M 500 234 Q 524 234 524 218" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#rough)" filter="url(#rough2)"/>
  <text x="524" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">总引力</text>
  <text x="524" y="202" text-anchor="middle" font-size="9.5" fill="#888">ans=28</text>

  <!-- ===== Recurrence / cur trace box ===== -->
  <rect x="40" y="266" width="484" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="282" y="288" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">递推：cur_i = cur_{i−1} + (i − last[s[i]])；last[s[i]] ← i；ans += cur_i</text>

  <!-- ===== cur rolling trace ===== -->
  <text x="40" y="322" font-size="11" fill="#444" font-weight="bold">cur 滚动轨迹：</text>
  <rect x="40" y="328" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="328" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="208" y="328" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="292" y="328" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="376" y="328" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="346" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">12</text>
  <text x="282" y="372" text-anchor="middle" font-size="10" fill="#888">cur 即各 f(i)，累加 1+3+4+8+12 = 28 = 总引力</text>
</svg>
