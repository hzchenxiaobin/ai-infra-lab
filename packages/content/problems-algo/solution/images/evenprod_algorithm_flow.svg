<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 444" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="540" height="444" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟扫描维护 oddRun，累加 allOdd，末尾 total − allOdd</text>

  <!-- Start -->
  <rect x="150" y="40" width="240" height="42" rx="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">初始化 i=0, oddRun=0, allOdd=0</text>

  <path d="M 270 82 L 270 96" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: nums[i] even? -->
  <polygon points="270,98 360,138 270,178 180,138" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i] 是偶数?</text>

  <!-- Left branch: odd -->
  <path d="M 180 138 L 125 168" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="120" font-size="11" fill="#4a7a3a" font-weight="bold">否(奇)</text>
  <rect x="40" y="168" width="170" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="195" text-anchor="middle" font-size="12" fill="#333">oddRun += 1</text>

  <!-- Right branch: even -->
  <path d="M 360 138 L 415 168" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="120" font-size="11" fill="#d6a040" font-weight="bold">是(偶)</text>
  <rect x="330" y="168" width="170" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="195" text-anchor="middle" font-size="12" fill="#333">oddRun = 0</text>

  <!-- merge to allOdd -->
  <path d="M 125 212 L 225 244" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 212 L 315 244" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="248" width="140" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="12" fill="#333">allOdd += oddRun</text>

  <path d="M 270 290 L 270 304" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond2: i<n? -->
  <polygon points="270,306 340,338 270,372 200,338" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#333">i += 1</text>
  <text x="270" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- Yes loop back -->
  <path d="M 200 338 L 40 338 L 40 61 L 150 61" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="11" fill="#4a7a3a" font-weight="bold">是（读下一个）</text>

  <!-- No -> return -->
  <path d="M 270 372 L 270 388" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="384" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="160" y="392" width="220" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="417" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return total − allOdd</text>
</svg>
