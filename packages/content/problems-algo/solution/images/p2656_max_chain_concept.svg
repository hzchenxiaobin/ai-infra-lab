<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">每次挑当前最大值 → 该槽每轮 +1</text>

  <!-- 原数组：1,2,3,4,5，5 高亮 -->
  <g filter="url(#rough2)">
    <rect x="90"  y="56" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="136" y="56" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="182" y="56" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="56" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="274" y="56" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="113" y="78" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="159" y="78" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="205" y="78" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="251" y="78" text-anchor="middle" font-size="14" fill="#333">4</text>
    <text x="297" y="78" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>
  </g>
  <text x="200" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums</text>

  <!-- 向下箭头：选最大 M=5 -->
  <path d="M297,94 L297,128" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="350" y="116" font-size="12" fill="#b85450" filter="url(#rough2)">首轮选最大 M=5</text>

  <!-- 链：5 → 6 → 7 -->
  <g filter="url(#rough2)">
    <rect x="110" y="140" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="140" y="166" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">M</text>
    <text x="140" y="196" text-anchor="middle" font-size="11" fill="#888">=5</text>

    <path d="M172,160 L210,160" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none"/>
    <text x="191" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a">+1</text>

    <rect x="214" y="140" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="244" y="166" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">M+1</text>
    <text x="244" y="196" text-anchor="middle" font-size="11" fill="#888">=6</text>

    <path d="M276,160 L314,160" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none"/>
    <text x="295" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a">+1</text>

    <rect x="318" y="140" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="348" y="166" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">M+2</text>
    <text x="348" y="196" text-anchor="middle" font-size="11" fill="#888">=7</text>

    <text x="404" y="166" font-size="16" fill="#888">…</text>
  </g>

  <!-- 锁定说明框 -->
  <rect x="80" y="218" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">最大值链锁死在同一槽位：M+1 &gt; M ≥ 其余，永不被赶超</text>

  <!-- 求和 -->
  <path d="M260,262 L260,290" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)" transform="rotate(180 260 276)"/>
  <text x="300" y="284" font-size="12" fill="#446688" filter="url(#rough2)">等差数列求和</text>

  <rect x="110" y="296" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">ans = k·M + k(k−1)/2</text>
</svg>
