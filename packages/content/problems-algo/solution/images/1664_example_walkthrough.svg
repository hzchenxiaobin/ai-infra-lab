<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,1,6,4],  totalEven = 8,  totalOdd = 5</text>

  <!-- nums array -->
  <text x="40" y="52" font-size="10" fill="#888">nums</text>
  <rect x="80" y="58" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="79" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="140" y="58" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="79" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="200" y="58" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="79" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
  <rect x="260" y="58" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="79" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="110" y="104" text-anchor="middle" font-size="9" fill="#888">i=0 偶</text>
  <text x="170" y="104" text-anchor="middle" font-size="9" fill="#888">i=1 奇</text>
  <text x="230" y="104" text-anchor="middle" font-size="9" fill="#888">i=2 偶</text>
  <text x="290" y="104" text-anchor="middle" font-size="9" fill="#888">i=3 奇</text>

  <!-- ===== Step table ===== -->
  <text x="40" y="128" font-size="10" fill="#888">逐位置演算（leftE/leftO 为 i 之前的偶/奇下标和）</text>

  <!-- table frame -->
  <rect x="40" y="134" width="620" height="180" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <!-- column headers -->
  <rect x="40" y="134" width="620" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="65"  y="151" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">i</text>
  <text x="135" y="151" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">nums[i]</text>
  <text x="215" y="151" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">leftE</text>
  <text x="285" y="151" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">leftO</text>
  <text x="355" y="151" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">rightE</text>
  <text x="425" y="151" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">rightO</text>
  <text x="500" y="151" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">新偶和</text>
  <text x="580" y="151" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">新奇和</text>
  <text x="640" y="151" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">平衡?</text>

  <!-- vertical separators -->
  <line x1="90"  y1="134" x2="90"  y2="314" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="134" x2="180" y2="314" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="134" x2="250" y2="314" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="134" x2="320" y2="314" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="134" x2="390" y2="314" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="460" y1="134" x2="460" y2="314" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="540" y1="134" x2="540" y2="314" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="620" y1="134" x2="620" y2="314" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: i=0, num=2(偶), lE=0, lO=0, rE=6, rO=5, 新偶=5, 新奇=6, 否 -->
  <text x="65"  y="178" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="135" y="178" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2 (偶)</text>
  <text x="215" y="178" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="285" y="178" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="355" y="178" text-anchor="middle" font-size="10" fill="#d6a040">6</text>
  <text x="425" y="178" text-anchor="middle" font-size="10" fill="#d6a040">5</text>
  <text x="500" y="178" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="580" y="178" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="640" y="178" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <line x1="44" y1="186" x2="656" y2="186" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 2: i=1, num=1(奇), lE=2, lO=0, rE=6, rO=4, 新偶=6, 新奇=6, 平衡! (highlight) -->
  <rect x="44" y="190" width="612" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="65"  y="210" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="135" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 (奇)</text>
  <text x="215" y="210" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="285" y="210" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="355" y="210" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">6</text>
  <text x="425" y="210" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <text x="500" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="580" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="640" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <line x1="44" y1="222" x2="656" y2="222" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 3: i=2, num=6(偶), lE=2, lO=1, rE=0, rO=4, 新偶=6, 新奇=1, 否 -->
  <text x="65"  y="246" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="135" y="246" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">6 (偶)</text>
  <text x="215" y="246" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="285" y="246" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="355" y="246" text-anchor="middle" font-size="10" fill="#d6a040">0</text>
  <text x="425" y="246" text-anchor="middle" font-size="10" fill="#d6a040">4</text>
  <text x="500" y="246" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="580" y="246" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="640" y="246" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <line x1="44" y1="254" x2="656" y2="254" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 4: i=3, num=4(奇), lE=8, lO=1, rE=0, rO=0, 新偶=8, 新奇=1, 否 -->
  <text x="65"  y="278" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="135" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4 (奇)</text>
  <text x="215" y="278" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="285" y="278" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="355" y="278" text-anchor="middle" font-size="10" fill="#d6a040">0</text>
  <text x="425" y="278" text-anchor="middle" font-size="10" fill="#d6a040">0</text>
  <text x="500" y="278" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="580" y="278" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="640" y="278" text-anchor="middle" font-size="10" fill="#b85450">否</text>

  <!-- ===== Result explanation ===== -->
  <rect x="40" y="326" width="620" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="348" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i=1 时命中平衡：leftE+rightO = 2+4 = 6 = leftO+rightE = 0+6</text>
  <text x="350" y="366" text-anchor="middle" font-size="10" fill="#666">删除 nums[1]=1，剩余 [2,6,4]：偶位 2+4=6，奇位 6=6 ✓</text>
  <text x="350" y="380" text-anchor="middle" font-size="9" fill="#888">仅此一处满足，故 ans = 1</text>

  <!-- ===== Highlight note ===== -->
  <rect x="40" y="392" width="620" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)" opacity="0.6"/>
  <text x="350" y="414" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">⚠ rightE/rightO = total − left − nums[i]（按 i 奇偶扣除自身），无需显式维护后缀和</text>
</svg>
