<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：以 0 为根建无向树，原始朝外（父→子）的边必翻转</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">示例 1：箭头=原始方向，红=需翻转（朝外），绿=无需翻转（朝内）</text>

  <!-- Edges with original-direction arrows -->
  <!-- 0 -> 1 : red (flip) -->
  <line x1="265.2" y1="93.5" x2="184.8" y2="166.5" stroke="#b85450" stroke-width="2.4"
        marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <!-- 1 -> 3 : red (flip) -->
  <line x1="170" y1="200" x2="170" y2="260" stroke="#b85450" stroke-width="2.4"
        marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <!-- 2 -> 3 : green (no flip, child->parent) -->
  <line x1="170" y1="360" x2="170" y2="300" stroke="#4a7a3a" stroke-width="2.4"
        marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <!-- 4 -> 0 : green (no flip, child->parent) -->
  <line x1="375.2" y1="166.5" x2="294.8" y2="93.5" stroke="#4a7a3a" stroke-width="2.4"
        marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <!-- 4 -> 5 : red (flip) -->
  <line x1="390" y1="200" x2="390" y2="260" stroke="#b85450" stroke-width="2.4"
        marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- Edge labels -->
  <text x="210" y="125" font-size="10.5" fill="#b85450" font-weight="bold">0→1 翻</text>
  <text x="178" y="234" font-size="10.5" fill="#b85450" font-weight="bold">1→3 翻</text>
  <text x="178" y="334" font-size="10.5" fill="#4a7a3a" font-weight="bold">2→3 ✓</text>
  <text x="345" y="125" font-size="10.5" fill="#4a7a3a" font-weight="bold">4→0 ✓</text>
  <text x="398" y="234" font-size="10.5" fill="#b85450" font-weight="bold">4→5 翻</text>

  <!-- Nodes -->
  <!-- 0 root -->
  <circle cx="280" cy="80" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="280" y="62" text-anchor="middle" font-size="9.5" fill="#888">根</text>
  <!-- 1 -->
  <circle cx="170" cy="180" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- 4 -->
  <circle cx="390" cy="180" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- 3 -->
  <circle cx="170" cy="280" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="285" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- 5 -->
  <circle cx="390" cy="280" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="285" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- 2 -->
  <circle cx="170" cy="380" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="385" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- Annotation box -->
  <rect x="50" y="408" width="460" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="11" fill="#333">红边 3 条 = 答案 3；绿边 2 条已朝内不动 — DFS 自根向下数「朝外」边即可</text>
</svg>
