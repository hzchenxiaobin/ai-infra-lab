<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n=3，倒序逐查询认领格子（最终矩阵）</text>

  <!-- Column labels -->
  <text x="95" y="62" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">列 0</text>
  <text x="165" y="62" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">列 1</text>
  <text x="235" y="62" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">列 2</text>

  <!-- Row labels -->
  <text x="50" y="99" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">行 0</text>
  <text x="50" y="149" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">行 1</text>
  <text x="50" y="199" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">行 2</text>

  <!-- ===== Row 0 ===== -->
  <!-- (0,0)=4 blue -->
  <rect x="60" y="70" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="101" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="73" cy="83" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="73" y="87" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- (0,1)=1 red -->
  <rect x="130" y="70" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="101" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="143" cy="83" r="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="143" y="87" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- (0,2)=2 orange -->
  <rect x="200" y="70" width="70" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="101" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="213" cy="83" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <text x="213" y="87" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- ===== Row 1 ===== -->
  <!-- (1,0)=4 blue -->
  <rect x="60" y="120" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="151" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- (1,1)=0 gray (unclaimed) -->
  <rect x="130" y="120" width="70" height="50" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="165" y="151" text-anchor="middle" font-size="18" fill="#bbb" filter="url(#rough2)">0</text>

  <!-- (1,2)=2 orange -->
  <rect x="200" y="120" width="70" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="151" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- ===== Row 2 ===== -->
  <!-- (2,0)=4 blue -->
  <rect x="60" y="170" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="201" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- (2,1)=3 green -->
  <rect x="130" y="170" width="70" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="201" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="143" cy="183" r="8" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="143" y="187" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- (2,2)=3 green -->
  <rect x="200" y="170" width="70" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="201" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- bracket note for col0 -->
  <text x="95" y="240" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">列0 整列</text>

  <!-- unclaimed note -->
  <text x="165" y="240" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">未被覆盖=0</text>

  <!-- ===== Contribution table on right ===== -->
  <text x="430" y="62" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">倒序认领与贡献</text>

  <!-- table header -->
  <rect x="310" y="70" width="250" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="325" y="86" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="360" y="86" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">查询</text>
  <text x="440" y="86" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">新覆盖</text>
  <text x="510" y="86" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">贡献</text>

  <!-- row 1 -->
  <rect x="310" y="98" width="250" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <circle cx="325" cy="111" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="325" y="115" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="360" y="115" font-size="10" fill="#333" filter="url(#rough2)">列0=4</text>
  <text x="440" y="115" font-size="10" fill="#333" filter="url(#rough2)">3 格</text>
  <text x="510" y="115" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4×3=12</text>

  <!-- row 2 -->
  <rect x="310" y="128" width="250" height="26" fill="#f8fcf8" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <circle cx="325" cy="141" r="8" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="325" y="145" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="360" y="145" font-size="10" fill="#333" filter="url(#rough2)">行2=3</text>
  <text x="440" y="145" font-size="10" fill="#333" filter="url(#rough2)">2 格(3−1)</text>
  <text x="510" y="145" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3×2=6</text>

  <!-- row 3 -->
  <rect x="310" y="158" width="250" height="26" fill="#fffdf5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <circle cx="325" cy="171" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <text x="325" y="175" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="360" y="175" font-size="10" fill="#333" filter="url(#rough2)">列2=2</text>
  <text x="440" y="175" font-size="10" fill="#333" filter="url(#rough2)">2 格(3−1)</text>
  <text x="510" y="175" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2×2=4</text>

  <!-- row 4 -->
  <rect x="310" y="188" width="250" height="26" fill="#fff5f7" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <circle cx="325" cy="201" r="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="325" y="205" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="360" y="205" font-size="10" fill="#333" filter="url(#rough2)">行0=1</text>
  <text x="440" y="205" font-size="10" fill="#333" filter="url(#rough2)">1 格(3−2)</text>
  <text x="510" y="205" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1×1=1</text>

  <!-- total -->
  <rect x="310" y="220" width="250" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="325" y="240" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="440" y="240" font-size="10" fill="#333" filter="url(#rough2)">8 格</text>
  <text x="510" y="240" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">23 ⭐</text>

  <!-- legend / note -->
  <rect x="40" y="262" width="520" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="55" y="283" font-size="11" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#555">读法</tspan>：倒序第 1 步（原 Q4 列0=4）整列全占；之后每步只认领「对偶维度中尚未被占」的格子，故</text>
  <text x="55" y="295" font-size="11" fill="#333" filter="url(#rough2)">行查询按 n−colCnt 数、列查询按 n−rowCnt 数。(1,1) 全程无人认领 → 最终为 0。</text>

  <text x="55" y="332" font-size="10" fill="#aaa" filter="url(#rough2)">颜色 = 倒序第几步认领；数字 = 最终格子值</text>
  <text x="55" y="350" font-size="10" fill="#aaa" filter="url(#rough2)">同色步数徽章对应右侧表的步号</text>
</svg>
