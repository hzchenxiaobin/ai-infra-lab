<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[−4,−2,2,4], a=1, b=3, c=5（a &gt; 0）</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">f(x)=x²+3x+5 → fv=[9, 3, 15, 33]，从后往前填（取较大者）</text>

  <!-- ============ Step 0: initial state ============ -->
  <text x="20" y="72" font-size="11" fill="#446688" font-weight="bold">步骤 0：初始化</text>
  <!-- fv row -->
  <text x="20" y="92" font-size="10" fill="#666">fv:</text>
  <rect x="50" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="94" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="104" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="94" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="158" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="94" text-anchor="middle" font-size="11" fill="#333">15</text>
  <rect x="212" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="94" text-anchor="middle" font-size="11" fill="#333">33</text>
  <!-- pointer labels -->
  <text x="75" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑left=0</text>
  <text x="237" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right=3↑</text>
  <!-- res row -->
  <text x="20" y="138" font-size="10" fill="#666">res:</text>
  <rect x="50" y="124" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="124" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="124" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <rect x="212" y="124" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="140" text-anchor="middle" font-size="9" fill="#b85450">←pos=3</text>

  <!-- ============ Step 1 ============ -->
  <text x="310" y="72" font-size="11" fill="#446688" font-weight="bold">步骤 1：9 vs 33 → 33 大</text>
  <text x="310" y="92" font-size="10" fill="#666">fv:</text>
  <rect x="340" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="94" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="394" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="419" y="94" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="448" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="473" y="94" text-anchor="middle" font-size="11" fill="#333">15</text>
  <rect x="502" y="78" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="527" y="94" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">33</text>
  <text x="365" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑left=0</text>
  <text x="527" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right=3↑</text>
  <!-- res row: pos=3 filled with 33 -->
  <text x="310" y="138" font-size="10" fill="#666">res:</text>
  <rect x="340" y="124" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <rect x="394" y="124" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <rect x="448" y="124" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <rect x="502" y="124" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="527" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">33</text>
  <!-- arrow: right moves left -->
  <path d="M 515 108 L 465 108" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="490" y="104" text-anchor="middle" font-size="9" fill="#b85450">right−−</text>

  <!-- ============ Step 2 ============ -->
  <text x="20" y="178" font-size="11" fill="#446688" font-weight="bold">步骤 2：9 vs 15 → 15 大</text>
  <text x="20" y="198" font-size="10" fill="#666">fv:</text>
  <rect x="50" y="184" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="200" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="104" y="184" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="200" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="158" y="184" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="183" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">15</text>
  <rect x="212" y="184" width="50" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="237" y="200" text-anchor="middle" font-size="10" fill="#aaa">✓</text>
  <text x="75" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑left=0</text>
  <text x="183" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right=2↑</text>
  <text x="20" y="244" font-size="10" fill="#666">res:</text>
  <rect x="50" y="230" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="230" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="230" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="183" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">15</text>
  <rect x="212" y="230" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="246" text-anchor="middle" font-size="11" fill="#b85450">33</text>
  <path d="M 171 214 L 121 214" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="146" y="210" text-anchor="middle" font-size="9" fill="#b85450">right−−</text>

  <!-- ============ Step 3 ============ -->
  <text x="310" y="178" font-size="11" fill="#446688" font-weight="bold">步骤 3：9 vs 3 → 9 大</text>
  <text x="310" y="198" font-size="10" fill="#666">fv:</text>
  <rect x="340" y="184" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9</text>
  <rect x="394" y="184" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="419" y="200" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="448" y="184" width="50" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="473" y="200" text-anchor="middle" font-size="10" fill="#aaa">✓</text>
  <rect x="502" y="184" width="50" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="527" y="200" text-anchor="middle" font-size="10" fill="#aaa">✓</text>
  <text x="365" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑left=0</text>
  <text x="419" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right=1↑</text>
  <text x="310" y="244" font-size="10" fill="#666">res:</text>
  <rect x="340" y="230" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <rect x="394" y="230" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="419" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9</text>
  <rect x="448" y="230" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="473" y="246" text-anchor="middle" font-size="11" fill="#b85450">15</text>
  <rect x="502" y="230" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="527" y="246" text-anchor="middle" font-size="11" fill="#b85450">33</text>
  <path d="M 365 214 L 395 214" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="210" text-anchor="middle" font-size="9" fill="#b85450">left++</text>

  <!-- ============ Step 4 ============ -->
  <text x="20" y="284" font-size="11" fill="#446688" font-weight="bold">步骤 4：仅剩 fv[1]=3</text>
  <text x="20" y="304" font-size="10" fill="#666">fv:</text>
  <rect x="50" y="290" width="50" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="306" text-anchor="middle" font-size="10" fill="#aaa">✓</text>
  <rect x="104" y="290" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="158" y="290" width="50" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="183" y="306" text-anchor="middle" font-size="10" fill="#aaa">✓</text>
  <rect x="212" y="290" width="50" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="237" y="306" text-anchor="middle" font-size="10" fill="#aaa">✓</text>
  <text x="129" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">left=right=1</text>
  <text x="20" y="350" font-size="10" fill="#666">res:</text>
  <rect x="50" y="336" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="104" y="336" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="352" text-anchor="middle" font-size="11" fill="#b85450">9</text>
  <rect x="158" y="336" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="352" text-anchor="middle" font-size="11" fill="#b85450">15</text>
  <rect x="212" y="336" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="352" text-anchor="middle" font-size="11" fill="#b85450">33</text>

  <!-- ============ Summary ============ -->
  <rect x="310" y="290" width="250" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4 步完成</text>
  <text x="435" y="330" text-anchor="middle" font-size="11" fill="#555">每步比较两端 fv 值</text>
  <text x="435" y="346" text-anchor="middle" font-size="11" fill="#555">较大者填入 res[pos]，pos−−</text>
  <text x="435" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果：[3, 9, 15, 33] ✓</text>

  <!-- Bottom note -->
  <rect x="40" y="390" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="410" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">循环不变量：每步选出剩余元素中的最大值（a &gt; 0 时）</text>
  <text x="290" y="426" text-anchor="middle" font-size="10" fill="#666">left ≤ right 区间内的未处理元素，两端必含当前最大值 → 比较 + 填入 + 收拢</text>
  <text x="290" y="438" text-anchor="middle" font-size="10" fill="#888">a &lt; 0 时对称：选最小值填入 res[pos++]，从前往后</text>
</svg>
