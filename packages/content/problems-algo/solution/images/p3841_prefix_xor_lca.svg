<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：根前缀异或 —— 公共上段自动抵消，LCA 补回来</text>

  <!-- ===================== 左侧：树 ===================== -->
  <text x="185" y="46" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">root</text>

  <!-- 边 -->
  <g filter="url(#rough2)">
    <line x1="185" y1="89" x2="185" y2="144" stroke="#d6a040" stroke-width="2.5"/>
    <line x1="172" y1="175" x2="116" y2="238" stroke="#446688" stroke-width="2.2"/>
    <line x1="198" y1="175" x2="254" y2="238" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="99" y1="265" x2="78" y2="320" stroke="#446688" stroke-width="2.2"/>
    <line x1="271" y1="265" x2="292" y2="320" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="116" y1="266" x2="158" y2="322" stroke="#bbb" stroke-width="1.2"/>
    <line x1="254" y1="266" x2="228" y2="322" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="237" y="128" font-size="10" fill="#a07020" filter="url(#rough2)">公共上段</text>

  <!-- 节点 -->
  <g filter="url(#rough2)">
    <circle cx="185" cy="72" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <circle cx="185" cy="162" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <circle cx="108" cy="252" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="262" cy="252" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="70" cy="335" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="300" cy="335" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="165" cy="335" r="13" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <circle cx="222" cy="335" r="13" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>

  <!-- 节点字符 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <text x="185" y="77" fill="#a07020" font-weight="bold">a</text>
    <text x="185" y="167" fill="#a07020" font-weight="bold">b</text>
    <text x="108" y="257" fill="#33506b">a</text>
    <text x="262" y="257" fill="#2f5d24">a</text>
    <text x="70" y="340" fill="#33506b" font-weight="bold">c</text>
    <text x="300" y="340" fill="#2f5d24" font-weight="bold">a</text>
    <text x="165" y="339" font-size="10" fill="#999">b</text>
    <text x="222" y="339" font-size="10" fill="#999">c</text>
  </g>

  <!-- 节点名标注 -->
  <g filter="url(#rough2)">
    <text x="212" y="166" font-size="10.5" fill="#a07020" font-weight="bold">lca(u,v)</text>
    <text x="70" y="368" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">u</text>
    <text x="300" y="368" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">v</text>
  </g>

  <!-- ===================== 右侧：公式面板 ===================== -->
  <g filter="url(#rough2)">
    <rect x="350" y="58" width="190" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="445" y="76" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">pre[u] = 根→u 逐点 ⊕</text>
    <text x="445" y="93" text-anchor="middle" font-size="9.5" fill="#557">橙色上段 ＋ 蓝色下段</text>

    <rect x="350" y="114" width="190" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="445" y="132" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">pre[v] = 根→v 逐点 ⊕</text>
    <text x="445" y="149" text-anchor="middle" font-size="9.5" fill="#477">橙色上段 ＋ 绿色下段</text>

    <rect x="350" y="170" width="190" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="445" y="192" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold">path(u, v)</text>
    <text x="445" y="212" text-anchor="middle" font-size="10.5" fill="#a07020">= pre[u] ⊕ pre[v] ⊕ mask[lca]</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10" fill="#666">
    <text x="445" y="254">⊕ 自消：x ⊕ x = 0（异或的逆就是自己）</text>
    <text x="445" y="270">橙色上段在两个 pre 中各出现一次 → 整段抵消</text>
    <text x="445" y="286">lca 本体也随之抵消 → 单独补回 mask[lca]</text>
  </g>

  <!-- ===================== 底部：回文判定 ===================== -->
  <g filter="url(#rough2)">
    <rect x="28" y="378" width="504" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="280" y="400" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">可重排成回文 ⇔ 至多一个字符出现奇数次 ⇔ 掩码 popcount ≤ 1 ⇔ m &amp; (m−1) == 0</text>
    <text x="280" y="419" text-anchor="middle" font-size="10" fill="#b85450">字符 c → 1 &lt;&lt; (c − 'a')；路径掩码 = 沿途节点掩码逐个 ⊕</text>
  </g>
</svg>
