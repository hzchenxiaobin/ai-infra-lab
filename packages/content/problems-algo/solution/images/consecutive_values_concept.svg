<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：可达区间 [0, x] 的扩展条件 c ≤ x + 1</text>

  <!-- ====== Top case: c <= x+1, ranges overlap ====== -->
  <text x="56" y="62" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 情况一：c ≤ x + 1（可扩展）</text>

  <!-- Number line for top case -->
  <path d="M 60 100 L 500 100" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="508" y="104" font-size="10" fill="#888" filter="url(#rough2)">值</text>

  <!-- tick marks: 0, x, c, x+c -->
  <text x="60" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="180" y="118" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">x</text>
  <text x="220" y="118" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">c</text>
  <text x="340" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">x+c</text>

  <!-- existing range [0, x] (blue) -->
  <rect x="60" y="84" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="98" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">已有 [0, x]</text>

  <!-- new range [c, x+c] (green) -->
  <rect x="220" y="84" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">新增 [c, x+c]</text>

  <!-- overlap/adjacent gap (x+1 == c, touching) -->
  <path d="M 180 84 L 220 84" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">无缝</text>

  <!-- merged result -->
  <path d="M 60 130 L 340 130" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="138" width="280" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合并 → [0, x+c]，x 更新为 x+c</text>

  <!-- ====== Bottom case: c > x+1, gap exists ====== -->
  <text x="56" y="194" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 情况二：c &gt; x + 1（出现断点，停止）</text>

  <!-- Number line for bottom case -->
  <path d="M 60 232 L 500 232" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="508" y="236" font-size="10" fill="#888" filter="url(#rough2)">值</text>

  <text x="60" y="250" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="180" y="250" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">x</text>
  <text x="200" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">x+1</text>
  <text x="280" y="250" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">c</text>

  <!-- existing range [0, x] -->
  <rect x="60" y="216" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="230" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">已有 [0, x]</text>

  <!-- gap region (x+1 .. c-1) red hatch -->
  <rect x="180" y="216" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="230" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">无法构造 x+1</text>

  <!-- coin c sits beyond gap -->
  <rect x="280" y="216" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="230" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- stop annotation -->
  <text x="400" y="230" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 断点，停止扩展</text>

  <!-- dashed separator -->
  <path d="M 40 272 L 520 272" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Key invariant -->
  <text x="56" y="294" font-size="11.5" fill="#555" filter="url(#rough2)">• <tspan fill="#446688" font-weight="bold">不变式</tspan>：用 coins 的某子集能构造出 [0, x] 中的每个整数</text>
  <text x="56" y="316" font-size="11.5" fill="#555" filter="url(#rough2)">• <tspan fill="#4a7a3a" font-weight="bold">扩展</tspan>：加入硬币 c 后，[0,x] ⊕ [c, x+c]，当 c ≤ x+1 两段<tspan font-weight="bold">无缝衔接</tspan> → [0, x+c]</text>
  <text x="56" y="338" font-size="11.5" fill="#555" filter="url(#rough2)">• <tspan fill="#b85450" font-weight="bold">断点</tspan>：c &gt; x+1 时 x+1 无法构造（无硬币可填补），后续更大的硬币也无法补</text>
  <text x="56" y="360" font-size="10.5" fill="#888" filter="url(#rough2)">排序后从小到大贪心扫描，保证每个硬币都被考虑在最需要的位置；答案 = x + 1（含 0）</text>
</svg>
