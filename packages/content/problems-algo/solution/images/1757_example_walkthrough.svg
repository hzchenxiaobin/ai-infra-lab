<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：5 行逐行判定，仅 product 1 / 3 入选</text>
  <path d="M 160 36 Q 360 44 560 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="40" y="56" width="640" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="90" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">product_id</text>
  <text x="200" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">low_fats</text>
  <text x="300" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">recyclable</text>
  <text x="420" y="74" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">谓词①='Y'?</text>
  <text x="540" y="74" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">谓词②='Y'?</text>
  <text x="650" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">入选?</text>

  <!-- row 0: 0 Y N -> fail -->
  <g filter="url(#rough2)"><rect x="40" y="88" width="640" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="90" y="109" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="200" y="109" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="300" y="109" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">N</text>
  <text x="420" y="109" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="540" y="109" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="650" y="109" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- row 1: 1 Y Y -> pass -->
  <g filter="url(#rough2)"><rect x="40" y="124" width="640" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/></g>
  <text x="90" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="200" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="300" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="420" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="540" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="650" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row 2: 2 N Y -> fail -->
  <g filter="url(#rough2)"><rect x="40" y="160" width="640" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="90" y="181" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="200" y="181" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">N</text>
  <text x="300" y="181" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="420" y="181" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="540" y="181" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="650" y="181" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- row 3: 3 Y Y -> pass -->
  <g filter="url(#rough2)"><rect x="40" y="196" width="640" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/></g>
  <text x="90" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="200" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="300" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="420" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="540" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="650" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row 4: 4 N N -> fail -->
  <g filter="url(#rough2)"><rect x="40" y="232" width="640" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="90" y="253" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="200" y="253" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">N</text>
  <text x="300" y="253" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">N</text>
  <text x="420" y="253" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="540" y="253" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="650" y="253" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- ===== Result summary ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="284" width="640" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="60" y="306" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果（SELECT product_id）：</text>
  <g filter="url(#rough2)"><rect x="60" y="316" width="40" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
  <text x="80" y="331" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="110" y="316" width="40" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
  <text x="130" y="331" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <text x="380" y="320" text-anchor="middle" font-size="10" fill="#888">⚠️ product 0 / 2 各有一个谓词不满足</text>
  <text x="380" y="336" text-anchor="middle" font-size="10" fill="#888">AND 要求「全真」才放行，缺一即弃</text>
</svg>
