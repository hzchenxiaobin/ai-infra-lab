<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">树形 DP：直径在「折弯点」处 first + second</text>

  <!-- ===== non-diameter branch edge (light) ===== -->
  <line x1="210" y1="150" x2="210" y2="218" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== first path (left, blue): 1 -> 2 -> 3 ===== -->
  <path d="M 196 140 L 88 140" stroke="#446688" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <!-- ===== second path (right, green): 1 -> 4 -> 5 ===== -->
  <path d="M 224 140 L 352 140" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <!-- ===== nodes ===== -->
  <!-- 3 -->
  <circle cx="70" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- 2 -->
  <circle cx="140" cy="140" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="145" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- 1 (bend point) -->
  <circle cx="210" cy="140" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="210" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="210" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">折弯点</text>

  <!-- 0 (branch, not on diameter) -->
  <circle cx="210" cy="232" r="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="210" y="237" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="240" y="237" font-size="9" fill="#888">不在路径上</text>

  <!-- 4 -->
  <circle cx="280" cy="140" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- 5 -->
  <circle cx="350" cy="140" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- ===== path labels ===== -->
  <text x="105" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">first = 2</text>
  <text x="105" y="162" text-anchor="middle" font-size="9" fill="#446688">dfs(2)+1</text>

  <text x="315" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">second = 2</text>
  <text x="315" y="162" text-anchor="middle" font-size="9" fill="#4a7a3a">dfs(4)+1</text>

  <!-- ===== formula box ===== -->
  <rect x="60" y="278" width="400" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = max(ans, first + second)</text>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#555">本例：first(2) + second(2) = 4 ✓</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#888">dfs(u, parent) 返回 u 向下的最长路径边数</text>
  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#888">每个节点都尝试当"折弯点"，全局取最大</text>
</svg>
