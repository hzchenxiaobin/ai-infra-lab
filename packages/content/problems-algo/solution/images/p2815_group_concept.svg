<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">按最大数位分桶：每桶取最大的两个求和</text>

  <!-- 原数组 -->
  <text x="30" y="62" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="78" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">51</text>
  <rect x="138" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">71</text>
  <rect x="198" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">17</text>
  <rect x="258" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">24</text>
  <rect x="318" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">42</text>

  <!-- max digit labels -->
  <text x="106" y="92" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">max位=5</text>
  <text x="166" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">max位=7</text>
  <text x="226" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">max位=7</text>
  <text x="286" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max位=4</text>
  <text x="346" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max位=4</text>

  <!-- arrows down to buckets -->
  <path d="M 166 96 L 166 130" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 226 96 L 226 130" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 286 96 L 286 130" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 346 96 L 346 130" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 106 96 L 106 130" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 桶 7 -->
  <rect x="120" y="134" width="172" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="132" y="154" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">桶 7</text>
  <rect x="160" y="166" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">71</text>
  <rect x="220" y="166" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">17</text>
  <text x="284" y="185" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 88</text>

  <!-- 桶 4 -->
  <rect x="312" y="134" width="172" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="324" y="154" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">桶 4</text>
  <rect x="352" y="166" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">42</text>
  <rect x="412" y="166" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="438" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">24</text>
  <text x="476" y="185" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 66</text>

  <!-- 桶 5 (single) -->
  <rect x="50" y="134" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="158" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">桶5</text>
  <text x="80" y="174" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">(仅1个)</text>

  <!-- answer -->
  <rect x="120" y="240" width="360" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">各桶配对和取 max：max(88, 66) = 88</text>
  <text x="300" y="280" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">桶5 只有一个元素，凑不成一对，跳过</text>

  <!-- arrows to answer -->
  <path d="M 206 202 L 240 240" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 398 202 L 360 240" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="320" font-size="11" fill="#999" filter="url(#rough2)">要点：同一桶内任意两元素都合法配对 → 取最大的两个即该桶最大配对和</text>
</svg>
