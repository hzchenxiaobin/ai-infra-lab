<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">示例演算</text>

  <!-- 示例 2 详细演算 -->
  <text x="40" y="56" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 ②  nums = [1, 3, 3, 2]</text>

  <!-- Step A: 原数组 -->
  <text x="40" y="86" font-size="11" fill="#888" filter="url(#rough2)">原数组</text>
  <rect x="90" y="72" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="72" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="94" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="186" y="72" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="94" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="234" y="72" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="300" y="92" font-size="11" fill="#446688" filter="url(#rough2)">n = max = 3</text>
  <text x="300" y="106" font-size="11" fill="#4a7a3a" filter="url(#rough2)">len = 4 = n+1 ✓</text>

  <path d="M170,116 L170,132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="128" font-size="10" fill="#446688" filter="url(#rough2)">排序</text>

  <!-- Step B: 排序后 -->
  <text x="40" y="156" font-size="11" fill="#888" filter="url(#rough2)">排序后</text>
  <rect x="90" y="142" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="142" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="186" y="142" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="234" y="142" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="300" y="164" font-size="11" fill="#4a7a3a" filter="url(#rough2)">== base[3] ✓</text>

  <!-- 比对表 -->
  <line x1="40" y1="190" x2="480" y2="190" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="212" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">下标 i</text>
  <text x="120" y="212" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="220" y="212" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">期望 i+1</text>
  <text x="320" y="212" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">匹配</text>

  <text x="40" y="234" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="120" y="234" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="220" y="234" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="234" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="40" y="254" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="254" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="220" y="254" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="320" y="254" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="40" y="274" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="274" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="220" y="274" font-size="11" fill="#333" filter="url(#rough2)">3 (= n)</text>
  <text x="320" y="274" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="40" y="294" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="120" y="294" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="220" y="294" font-size="11" fill="#333" filter="url(#rough2)">3 (= n)</text>
  <text x="320" y="294" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <line x1="40" y1="306" x2="400" y2="306" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="326" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ return true ✓</text>

  <!-- 反例 -->
  <line x1="40" y1="342" x2="480" y2="342" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="366" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">反例 ①  nums = [2, 1, 3]</text>
  <text x="40" y="386" font-size="11" fill="#333" filter="url(#rough2)">n = max = 3，但 len = 3 ≠ 4 = n+1</text>
  <text x="300" y="386" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ false ✗</text>

  <text x="40" y="412" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">反例 ④  nums = [3,4,4,1,2,1]</text>
  <text x="40" y="430" font-size="11" fill="#333" filter="url(#rough2)">n = max = 4，但 len = 6 ≠ 5 = n+1</text>
  <text x="300" y="430" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ false ✗</text>
</svg>
