<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#446688" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    DP 状态转移流程
  </text>

  <!-- Step 1: Init -->
  <rect x="180" y="50" width="160" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    dp[0] = 0（初始）
  </text>

  <line x1="260" y1="86" x2="260" y2="104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 2: Process each G1 point -->
  <rect x="60" y="110" width="400" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    遍历第一组点 i = 0, 1, ..., size1-1
  </text>
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    每个 i 选一个 j：ndp[mask | (1&lt;&lt;j)] = min(ndp[mask|...], dp[mask] + cost[i][j])
  </text>

  <line x1="260" y1="172" x2="260" y2="190" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 3: After DP, compute answer -->
  <rect x="60" y="196" width="400" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    DP 结束：dp[mask] = 各点选主连接后的最小代价
  </text>
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    mask = 被主连接覆盖的第二组点集合
  </text>

  <line x1="260" y1="254" x2="260" y2="272" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 4: Extra cost -->
  <rect x="60" y="278" width="400" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    额外连接：extraCost[mask] = Σ minCost2[j]
  </text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    （对 mask 中未覆盖的 j 求和）
  </text>

  <line x1="260" y1="336" x2="260" y2="354" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="100" y="360" width="320" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    ans = min(dp[mask] + extraCost[mask])
  </text>

  <!-- Side annotation: complexity -->
  <rect x="370" y="110" width="140" height="40" rx="6" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="440" y="128" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">
    O(size1 · size2 · 2^size2)
  </text>
  <text x="440" y="142" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">
    ≤ 12 · 12 · 4096 ≈ 5.9×10⁵
  </text>
</svg>
