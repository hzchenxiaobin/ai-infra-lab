<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例演算：id=1，DFS 栈逐层累加重要度</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">emp_map = {1:[5,[2,3]], 2:[3,[4]], 3:[3,[]], 4:[1,[]]}</text>

  <!-- ===== Left: tree reference ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">员工树（id:imp）</text>
  <g font-size="11">
    <!-- node 1 -->
    <circle cx="90" cy="102" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="90" y="107" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="105" y="90" width="20" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="7" filter="url(#rough2)"/>
    <text x="115" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">5</text>

    <!-- node 2 -->
    <circle cx="55" cy="152" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="55" y="157" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="68" y="141" width="20" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="7" filter="url(#rough2)"/>
    <text x="78" y="151" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>

    <!-- node 3 -->
    <circle cx="130" cy="152" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="130" y="157" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="143" y="141" width="20" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="7" filter="url(#rough2)"/>
    <text x="153" y="151" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>

    <!-- node 4 -->
    <circle cx="55" cy="202" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="55" y="207" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="68" y="191" width="20" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="7" filter="url(#rough2)"/>
    <text x="78" y="201" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>

    <!-- edges -->
    <line x1="80" y1="114" x2="62" y2="140" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="102" y1="114" x2="120" y2="140" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="55" y1="166" x2="55" y2="188" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

    <!-- visit order -->
    <text x="30" y="238" font-size="10" fill="#b85450" font-weight="bold">访问顺序：</text>
    <text x="30" y="256" font-size="10.5" fill="#b85450">1 → 3 → 2 → 4</text>
    <text x="30" y="272" font-size="9.5" fill="#888">（LIFO：后入栈先出）</text>
    <text x="30" y="290" font-size="9.5" fill="#888">求和与顺序无关</text>
  </g>

  <!-- ===== Right: step table ===== -->
  <text x="240" y="74" font-size="11" fill="#446688" font-weight="bold">DFS 逐步演算</text>

  <!-- table header -->
  <rect x="240" y="84" width="50" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="265" y="100" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">步骤</text>
  <rect x="290" y="84" width="100" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="340" y="100" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">stack</text>
  <rect x="390" y="84" width="110" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="445" y="100" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">total</text>

  <!-- row 0: initial -->
  <rect x="240" y="108" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="265" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">初始</text>
  <rect x="290" y="108" width="100" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[1]</text>
  <rect x="390" y="108" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="445" y="128" text-anchor="middle" font-size="11" fill="#555">0</text>

  <!-- row 1: pop 1 -->
  <rect x="240" y="138" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="153" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">①</text>
  <text x="265" y="164" text-anchor="middle" font-size="8.5" fill="#888">pop 1</text>
  <rect x="290" y="138" width="100" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[2,3]</text>
  <rect x="390" y="138" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="445" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>

  <!-- row 2: pop 3 -->
  <rect x="240" y="168" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="183" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">②</text>
  <text x="265" y="194" text-anchor="middle" font-size="8.5" fill="#888">pop 3</text>
  <rect x="290" y="168" width="100" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[2]</text>
  <rect x="390" y="168" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="445" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8</text>

  <!-- row 3: pop 2 -->
  <rect x="240" y="198" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="213" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">③</text>
  <text x="265" y="224" text-anchor="middle" font-size="8.5" fill="#888">pop 2</text>
  <rect x="290" y="198" width="100" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[4]</text>
  <rect x="390" y="198" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="445" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">11</text>

  <!-- row 4: pop 4 -->
  <rect x="240" y="228" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="243" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">④</text>
  <text x="265" y="254" text-anchor="middle" font-size="8.5" fill="#888">pop 4</text>
  <rect x="290" y="228" width="100" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="248" text-anchor="middle" font-size="10.5" fill="#888">[]</text>
  <rect x="390" y="228" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="445" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">12</text>

  <!-- row 5: done -->
  <rect x="240" y="258" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="273" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">结束</text>
  <text x="265" y="284" text-anchor="middle" font-size="8.5" fill="#888">stack 空</text>
  <rect x="290" y="258" width="100" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="278" text-anchor="middle" font-size="10.5" fill="#888">空</text>
  <rect x="390" y="258" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="445" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">12</text>

  <!-- explanation callouts -->
  <rect x="240" y="298" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="252" y="314" font-size="10" fill="#446688" font-weight="bold">① pop 1：total = 0 + 5 = 5，压入下属 [2,3]</text>
  <text x="252" y="327" font-size="9.5" fill="#555">② pop 3：total = 5 + 3 = 8，无下属</text>

  <rect x="240" y="338" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="252" y="354" font-size="10" fill="#d6a040" font-weight="bold">③ pop 2：total = 8 + 3 = 11，压入下属 [4]</text>
  <text x="252" y="367" font-size="9.5" fill="#555">④ pop 4：total = 11 + 1 = 12，无下属</text>

  <!-- bottom note -->
  <rect x="30" y="380" width="490" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">每个员工入栈/出栈各 1 次 → 总时间 O(n)，返回 12</text>
</svg>
