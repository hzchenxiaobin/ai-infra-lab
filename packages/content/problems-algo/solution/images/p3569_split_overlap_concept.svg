<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">跨界质数：满足 first(p) &lt; k ≤ last(p) 的 p 被左右各数一次</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例：nums = [2,2,3,3,2]（n=5，分割点 k ∈ {1,2,3,4}）</text>

  <!-- 最优分割点竖直虚线（先画，被后续图形覆盖） -->
  <path d="M 304 48 L 304 243" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- 数组格子 -->
  <g filter="url(#rough2)">
    <rect x="150" y="52" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="202" y="52" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="254" y="52" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="306" y="52" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="358" y="52" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="174" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a">2</text>
    <text x="226" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a">2</text>
    <text x="278" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a">3</text>
    <text x="330" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a">3</text>
    <text x="382" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a">2</text>
    <text x="130" y="100" text-anchor="end" font-size="10" fill="#999">下标</text>
    <text x="174" y="100" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="226" y="100" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="278" y="100" text-anchor="middle" font-size="10" fill="#999">2</text>
    <text x="330" y="100" text-anchor="middle" font-size="10" fill="#999">3</text>
    <text x="382" y="100" text-anchor="middle" font-size="10" fill="#999">4</text>
  </g>

  <!-- 出现下标集合 -->
  <g filter="url(#rough2)">
    <text x="100" y="130" text-anchor="end" font-size="12" fill="#4a7a3a">质数 2</text>
    <path d="M 174 126 L 382 126" stroke="#4a7a3a" stroke-width="1.5" fill="none"/>
    <circle cx="174" cy="126" r="5" fill="#4a7a3a"/>
    <circle cx="226" cy="126" r="5" fill="#4a7a3a"/>
    <circle cx="382" cy="126" r="5" fill="#4a7a3a"/>
    <text x="392" y="130" font-size="10.5" fill="#4a7a3a">{0,1,4} → 区间 [1,4]</text>

    <text x="100" y="156" text-anchor="end" font-size="12" fill="#8a6a1a">质数 3</text>
    <path d="M 278 152 L 330 152" stroke="#8a6a1a" stroke-width="1.5" fill="none"/>
    <circle cx="278" cy="152" r="5" fill="#8a6a1a"/>
    <circle cx="330" cy="152" r="5" fill="#8a6a1a"/>
    <text x="340" y="156" font-size="10.5" fill="#8a6a1a">{2,3} → 区间 [3,3]</text>
  </g>

  <!-- 区间条（叠在 k 轴上方） -->
  <g filter="url(#rough2)">
    <rect x="282" y="168" width="44" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="304" y="180" text-anchor="middle" font-size="10" fill="#8a6a1a">3→[3,3]</text>
    <rect x="178" y="190" width="200" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="278" y="202" text-anchor="middle" font-size="10.5" fill="#2d5a1e">质数 2 → [1,4]</text>
  </g>

  <!-- k 轴 -->
  <g filter="url(#rough2)">
    <path d="M 140 214 L 426 214" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="438" y="212" font-size="11" fill="#555">分割点 k</text>
    <path d="M 200 209 L 200 219" stroke="#555" stroke-width="1.5"/>
    <path d="M 252 209 L 252 219" stroke="#555" stroke-width="1.5"/>
    <path d="M 304 209 L 304 219" stroke="#b85450" stroke-width="2"/>
    <path d="M 356 209 L 356 219" stroke="#555" stroke-width="1.5"/>
    <text x="200" y="234" text-anchor="middle" font-size="11" fill="#555">k=1</text>
    <text x="252" y="234" text-anchor="middle" font-size="11" fill="#555">k=2</text>
    <text x="304" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">k=3</text>
    <text x="356" y="234" text-anchor="middle" font-size="11" fill="#555">k=4</text>
  </g>

  <!-- 重叠数 -->
  <g filter="url(#rough2)">
    <text x="95" y="263" text-anchor="end" font-size="12" fill="#555">重叠数</text>
    <rect x="180" y="246" width="40" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="232" y="246" width="40" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="284" y="246" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="336" y="246" width="40" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <text x="200" y="264" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="252" y="264" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="304" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2</text>
    <text x="356" y="264" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>

  <!-- 答案框 -->
  <g filter="url(#rough2)">
    <rect x="140" y="286" width="280" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="303" text-anchor="middle" font-size="12" fill="#7a5510">answer = total + max cross(k)</text>
    <text x="280" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5510">= 2 + 2 = 4（k=3 处最优）</text>
  </g>

  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">total = 全局不同质数种数（2、3）；跨界的 p 在两半各被数一次，故再补 1</text>
</svg>
