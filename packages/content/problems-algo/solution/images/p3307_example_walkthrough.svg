<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：k = 10，operations = [0,1,0,1] → k−1 = 9 = 1001₂</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">位是 1 → 当时在后半段 → 吃到 op[i] 的染色；位是 0 → op[i] 再大也轮不到它</text>

  <!-- 表头 -->
  <rect x="60" y="56" width="400" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="74" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">位 i</text>
  <text x="162" y="74" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">k−1 的第 i 位</text>
  <text x="250" y="74" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">op[i]</text>
  <text x="325" y="74" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">落在哪半</text>
  <text x="412" y="74" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">贡献</text>

  <!-- 行 1：i=3 -->
  <rect x="60" y="84" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 110 84 L 110 118 M 215 84 L 215 118 M 285 84 L 285 118 M 365 84 L 365 118" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="162" y="104" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="250" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="325" y="104" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">后半段 ✓</text>
  <text x="412" y="104" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1</text>

  <!-- 行 2：i=2 -->
  <rect x="60" y="118" width="400" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 110 118 L 110 152 M 215 118 L 215 152 M 285 118 L 285 152 M 365 118 L 365 152" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="162" y="138" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="250" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="325" y="138" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">前半段</text>
  <text x="412" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 3：i=1（op=1 但位=0，无贡献） -->
  <rect x="60" y="152" width="400" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 110 152 L 110 186 M 215 152 L 215 186 M 285 152 L 285 186 M 365 152 L 365 186" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="170" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="162" y="170" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="250" y="170" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="325" y="170" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">前半段</text>
  <text x="412" y="170" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="412" y="181" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">op=1 也没用</text>

  <!-- 行 4：i=0 -->
  <rect x="60" y="186" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 110 186 L 110 220 M 215 186 L 215 220 M 285 186 L 285 220 M 365 186 L 365 220" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="162" y="206" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="250" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="325" y="206" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">后半段 ✓</text>
  <text x="412" y="206" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">+0</text>

  <!-- 结果 -->
  <path d="M 260 222 L 260 230" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="60" y="234" width="400" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">shift = 1 + 0 = 1 → 返回 'a' + 1 = 'b' ✓</text>

  <!-- 示例 1 -->
  <rect x="60" y="274" width="400" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">示例 1：k = 5 → k−1 = 100₂；仅位 2 为 1，而 op[2] = 0</text>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">shift = 0 → 返回 'a' ✓</text>

  <!-- 要点 -->
  <rect x="60" y="322" width="400" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">① 贡献由「位 = 1 且 op = 1」双条件决定——op[i]=1 只是必要条件的一半</text>
  <text x="260" y="351" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">② mask 视角：mask = 1010₂，(k−1) &amp; mask = 1000₂，popcount = 1 → 同样得 'b'</text>
</svg>
