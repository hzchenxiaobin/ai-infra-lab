<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 删除节点的三种情况</text>

  <!-- ===== 情况1: 叶子节点 ===== -->
  <text x="100" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 叶子节点</text>
  <text x="100" y="74" text-anchor="middle" font-size="10" fill="#888">直接删除，返回 null</text>

  <!-- 父节点 -->
  <circle cx="100" cy="100" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="104" text-anchor="middle" font-size="10" fill="#333">P</text>

  <!-- 待删节点(红色) -->
  <line x1="100" y1="114" x2="100" y2="140" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="100" cy="152" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="156" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">D</text>

  <!-- 删除标记 -->
  <path d="M 120 165 L 148 193" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="130" y="190" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="165" y="206" text-anchor="middle" font-size="10" fill="#b85450">删掉即可</text>

  <!-- 结果：父节点无子 -->
  <text x="100" y="230" text-anchor="middle" font-size="10" fill="#82b366">结果：P.left = null</text>

  <!-- ===== 情况2: 只有一个孩子 ===== -->
  <text x="290" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 只有一个孩子</text>
  <text x="290" y="74" text-anchor="middle" font-size="10" fill="#888">孩子顶替被删节点</text>

  <!-- 待删节点 -->
  <circle cx="290" cy="100" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">D</text>

  <!-- 唯一孩子 -->
  <line x1="290" y1="114" x2="290" y2="140" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="290" cy="152" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="156" text-anchor="middle" font-size="9" fill="#333">C</text>

  <!-- 孩子只有一个子节点 -->
  <line x1="290" y1="163" x2="290" y2="186" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="290" cy="196" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="199" text-anchor="middle" font-size="8" fill="#333">…</text>

  <!-- 顶替箭头 -->
  <path d="M 306 100 L 340 100" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 顶替后结果 -->
  <circle cx="380" cy="100" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="104" text-anchor="middle" font-size="9" fill="#333">C</text>
  <line x1="380" y1="111" x2="380" y2="135" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="380" cy="145" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="148" text-anchor="middle" font-size="8" fill="#333">…</text>

  <text x="345" y="170" text-anchor="middle" font-size="9" fill="#b85450">C 顶替 D</text>
  <text x="290" y="230" text-anchor="middle" font-size="10" fill="#82b366">结果：返回 C（含其子树）</text>

  <!-- ===== 情况3: 有两个孩子 ===== -->
  <text x="490" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 有两个孩子</text>
  <text x="490" y="74" text-anchor="middle" font-size="10" fill="#888">找后继，替换值，再删后继</text>

  <!-- 待删节点 -->
  <circle cx="490" cy="100" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">D</text>

  <!-- 左子树 -->
  <line x1="482" y1="112" x2="455" y2="140" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="450" cy="150" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="450" y="154" text-anchor="middle" font-size="9" fill="#333">L</text>

  <!-- 右子树 -->
  <line x1="498" y1="112" x2="525" y2="140" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="530" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="530" y="154" text-anchor="middle" font-size="9" fill="#333">R</text>

  <!-- 后继：右子树最左 -->
  <line x1="522" y1="158" x2="500" y2="178" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="495" cy="188" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="495" y="192" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">S</text>

  <text x="495" y="210" text-anchor="middle" font-size="8" fill="#d6a040">后继(右子树最左)</text>

  <!-- 替换值箭头 -->
  <path d="M 481 188 Q 440 165 475 112" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="150" font-size="9" fill="#d6a040">S.val</text>
  <text x="428" y="162" font-size="9" fill="#d6a040">→ D</text>

  <text x="490" y="230" text-anchor="middle" font-size="10" fill="#82b366">结果：D.val=S.val，再删 S</text>

  <!-- ===== 底部说明框 ===== -->
  <rect x="30" y="255" width="520" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="280" font-size="12" fill="#333" font-weight="bold">核心逻辑：</text>

  <text x="50" y="304" font-size="11" fill="#446688">① D 无左孩子 ⇒ 返回 D.right（覆盖叶子与仅有右孩子两种子情况）</text>
  <text x="50" y="326" font-size="11" fill="#4a7a3a">② D 无右孩子 ⇒ 返回 D.left（仅有左孩子）</text>
  <text x="50" y="348" font-size="11" fill="#b85450">③ D 有两个孩子 ⇒ 找右子树最左节点 S（中序后继），D.val = S.val，</text>
  <text x="70" y="366" font-size="11" fill="#b85450">　 再在右子树中递归删除 S（S 无左孩子，必落入 ① 或 ②）</text>

  <text x="50" y="392" font-size="11" fill="#555">⭐ 代码技巧：把「叶子」和「只有一个孩子」合并——</text>
  <text x="70" y="410" font-size="11" fill="#555">　if (!left) return right; if (!right) return left; 一行搞定两种情况</text>
</svg>
