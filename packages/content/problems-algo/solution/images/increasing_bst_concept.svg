<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">递增顺序搜索树：BST 中序遍历 → 右单链</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">每个节点只有 right 孩子，left 恒为 null</text>

  <!-- ===== 原 BST (left) ===== -->
  <text x="160" y="66" text-anchor="middle" font-size="12" fill="#888">原二叉搜索树</text>
  <g font-size="11">
    <!-- 5 -->
    <circle cx="160" cy="88" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="160" y="92" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <!-- 3 -->
    <circle cx="120" cy="138" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="120" y="142" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <!-- 6 -->
    <circle cx="210" cy="138" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="210" y="142" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <!-- edges 5-3, 5-6 -->
    <line x1="148" y1="100" x2="130" y2="126" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="172" y1="100" x2="200" y2="126" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <!-- 2 -->
    <circle cx="90" cy="188" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="90" y="192" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
    <!-- 4 -->
    <circle cx="150" cy="188" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="150" y="192" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
    <!-- 8 -->
    <circle cx="240" cy="188" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="240" y="192" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">8</text>
    <!-- edges 3-2, 3-4, 6-8 -->
    <line x1="108" y1="150" x2="98" y2="176" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="132" y1="150" x2="142" y2="176" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="222" y1="150" x2="234" y2="176" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- 1 -->
    <circle cx="65" cy="238" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="65" y="242" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
    <!-- 7 -->
    <circle cx="210" cy="238" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="210" y="242" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">7</text>
    <!-- 9 -->
    <circle cx="270" cy="238" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="270" y="242" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">9</text>
    <!-- edges 2-1, 8-7, 8-9 -->
    <line x1="80" y1="200" x2="72" y2="226" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="228" y1="200" x2="218" y2="226" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="252" y1="200" x2="262" y2="226" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  </g>
  <text x="160" y="278" text-anchor="middle" font-size="10" fill="#888">中序：1 → 2 → 3 → 4 → 5 → 6 → 7 → 8 → 9</text>

  <!-- ===== 中间箭头 ===== -->
  <path d="M 310 150 L 380 150" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="345" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">重连</text>
  <text x="345" y="164" text-anchor="middle" font-size="9" fill="#888">（中序）</text>

  <!-- ===== 展开后右单链 (right) ===== -->
  <text x="470" y="66" text-anchor="middle" font-size="12" fill="#888">展开后（右单链）</text>
  <g font-size="11">
    <!-- vertical chain at x=470 -->
    <circle cx="470" cy="88" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="470" y="92" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <circle cx="470" cy="118" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="122" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <circle cx="470" cy="148" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <circle cx="470" cy="178" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="182" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="470" cy="208" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="470" cy="238" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="242" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <circle cx="470" cy="268" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="272" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <circle cx="470" cy="298" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="302" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>
    <circle cx="470" cy="328" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="332" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <!-- right arrows (downward) -->
    <path d="M 470 100 L 470 106" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 470 130 L 470 136" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 470 160 L 470 166" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 470 190 L 470 196" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 470 220 L 470 226" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 470 250 L 470 256" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 470 280 L 470 286" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 470 310 L 470 316" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <!-- labels -->
    <text x="500" y="106" font-size="9" fill="#4a7a3a">right</text>
    <text x="500" y="120" font-size="9" fill="#888">left=null</text>
  </g>

  <!-- ===== key insight ===== -->
  <rect x="30" y="350" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="300" y="367" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：BST 中序升序 = 目标右链顺序；遍历时用 dummy 哨兵 + prev 尾插即可原地重连</text>
</svg>
