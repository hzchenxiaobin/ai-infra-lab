<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建图 → 留 top3 → 枚举中间边 → 取最大</text>

  <!-- Step 1: build adj -->
  <rect x="160" y="46" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 建邻接表 adj</text>
  <text x="280" y="82" text-anchor="middle" font-size="10" fill="#888">每条边两端互相加入邻居列表</text>
  <path d="M 280 92 L 280 108" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort + keep top3 -->
  <rect x="140" y="110" width="280" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 邻居按 scores 降序，保留前 3</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#888">top[u] = u 的分数最高 3 个邻居</text>
  <path d="M 280 166 L 280 182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: iterate edges (loop header) -->
  <path d="M 280 186 L 380 226 L 280 266 L 180 226 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 遍历每条边 (u,v)</text>
  <text x="280" y="240" text-anchor="middle" font-size="9" fill="#888">还有未处理的边?</text>
  <text x="280" y="254" text-anchor="middle" font-size="9" fill="#888">否 → 跳到 ⑦</text>

  <!-- branch down to step 4 -->
  <path d="M 280 266 L 280 284" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="280" font-size="9" fill="#4a7a3a">是</text>

  <!-- Step 4: two directions -->
  <rect x="130" y="286" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">④ 两个方向各试一次</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#888">(b=u,c=v) 与 (b=v,c=u)</text>
  <path d="M 280 332 L 280 348" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: nested loop a in top3(b), d in top3(c) -->
  <rect x="110" y="350" width="340" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ a ∈ top3(b), d ∈ top3(c) 双层枚举</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#888">每方向 3×3 = 9 组，共 18 组</text>
  <path d="M 280 406 L 280 422" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: check distinct (decision) -->
  <path d="M 280 426 L 400 466 L 280 506 L 160 466 z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="462" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑥ a,b,c,d 互异?</text>
  <text x="280" y="478" text-anchor="middle" font-size="9" fill="#888">a≠c 且 a≠d 且 d≠b 且 d≠a</text>

  <!-- yes branch: update max -->
  <path d="M 400 466 L 440 466" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="460" font-size="9" fill="#4a7a3a">是</text>
  <rect x="442" y="446" width="108" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="496" y="464" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">更新 max</text>
  <text x="496" y="478" text-anchor="middle" font-size="9" fill="#888">sum = Σscores</text>

  <!-- no branch: skip -->
  <path d="M 160 466 L 120 466" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="132" y="460" font-size="9" fill="#b85450">否</text>
  <rect x="12" y="446" width="108" height="40" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="66" y="470" text-anchor="middle" font-size="10" fill="#888">跳过该组</text>

  <!-- loop back arrow from update max / skip to step 3 -->
  <path d="M 496 446 L 496 226 L 380 226" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 66 446 L 66 226 L 180 226" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="218" font-size="9" fill="#4a7a3a">下一条边</text>

  <!-- Step 7: return -->
  <path d="M 280 506 L 280 528" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="524" font-size="9" fill="#888">边遍历完</text>
  <rect x="160" y="530" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="550" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">⑦ 返回 max（若仍 −∞ 则 −1）</text>
  <text x="280" y="566" text-anchor="middle" font-size="10" fill="#888">无长度 4 合法序列时返回 −1</text>

  <text x="280" y="600" text-anchor="middle" font-size="10" fill="#888">总复杂度：建表 O(E) + 排序 O(E log E) + 枚举 O(E) → O(E log E)</text>
</svg>
