<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">为什么必须优化：同一份朴素代码，两题两种命运</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3130 与 3129 题面完全相同，唯一区别：约束规模 200 → 1000（计算量 ×125）</text>

  <!-- left panel: 3129 -->
  <rect x="22" y="56" width="246" height="168" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="145" y="82" text-anchor="middle" font-size="13" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">孪生题 3129</text>
  <text x="145" y="102" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">zero, one, limit ≤ 200</text>
  <text x="145" y="128" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">朴素 DP：三重循环枚举段长</text>
  <text x="145" y="154" text-anchor="middle" font-size="15" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">O(z·o·limit) ≈ 8×10⁶</text>
  <rect x="62" y="170" width="166" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="193" text-anchor="middle" font-size="12.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">✓ 毫秒级通过</text>

  <!-- right panel: 3130 -->
  <rect x="292" y="56" width="246" height="168" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="415" y="82" text-anchor="middle" font-size="13" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">本题 3130</text>
  <text x="415" y="102" text-anchor="middle" font-size="11" fill="#8c2f28" filter="url(#rough2)">zero, one, limit ≤ 1000</text>
  <text x="415" y="128" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">同一份朴素代码</text>
  <text x="415" y="154" text-anchor="middle" font-size="15" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">1000³ = 10⁹</text>
  <rect x="332" y="170" width="166" height="36" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="193" text-anchor="middle" font-size="12.5" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">✗ TLE 超时</text>

  <!-- middle arrows -->
  <path d="M268,105 L292,105" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M292,190 L268,190" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- bottom solution bar -->
  <rect x="48" y="248" width="464" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">前缀和优化：转移里的 Σ 恰是「固定列上长度 ≤ limit 的窗口求和」</text>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">窗口和 = 两个前缀和相减 → limit 这一维被整体消掉</text>
  <text x="280" y="331" text-anchor="middle" font-size="16" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">O(z·o·limit) → O(z·o)</text>
  <text x="280" y="357" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">≈ 10⁹ → 10⁶：一份 O(z·o) 代码，两题通吃 ✓</text>
</svg>
