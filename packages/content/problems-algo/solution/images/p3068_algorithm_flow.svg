<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单遍扫描累计 total / cnt / minAbs，结尾奇偶修正</text>

  <!-- start -->
  <rect x="160" y="34" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">total=0 · cnt=0 · minAbs=+∞</text>
  <path d="M 260 64 L 260 80" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- process -->
  <rect x="140" y="82" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">取下一个 x，算 d = (x⊕k) − x</text>
  <path d="M 260 114 L 260 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <polygon points="260,134 330,168 260,202 190,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="173" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">d &gt; 0 ?</text>

  <path d="M 330 168 L 376 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="346" y="160" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="380" y="148" width="122" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="441" y="165" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">total += x⊕k</text>
  <text x="441" y="182" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">cnt += 1</text>

  <path d="M 190 168 L 144 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="160" y="160" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="18" y="148" width="122" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="79" y="174" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">total += x</text>

  <!-- merge -->
  <path d="M 260 202 L 260 216" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 441 190 L 441 210 L 356 228" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 79 190 L 79 210 L 164 228" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="170" y="218" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">minAbs = min(minAbs, |d|)</text>

  <!-- loop back -->
  <path d="M 350 233 L 500 233 L 500 98 L 384 98" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrB)" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="447" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">下一个 x</text>

  <!-- decision 2 -->
  <path d="M 260 248 L 260 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <polygon points="260,266 340,300 260,334 180,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">cnt % 2 == 0 ?</text>

  <path d="M 180 300 L 136 300" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="292" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="18" y="280" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="76" y="305" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 total</text>

  <path d="M 340 300 L 386 300" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="356" y="292" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="390" y="280" width="116" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="448" y="305" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 total−minAbs</text>

  <!-- footnote -->
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">edges 参数全程未读：奇偶不变量与配对可达性已刻画全部可达状态</text>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">修一刀 = 「放弃最小正增益」或「补上损失最小的负增益」，损失统一是 min|d|</text>
</svg>
