<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">算法流程：哈希 + 二分，全程不构造候选串</text>

  <!-- ① 预处理 -->
  <rect x="60" y="40" width="330" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="225" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold"
        filter="url(#rough2)">① 预处理：幂表 pw + 原串/反串的前缀哈希 hs、hr</text>

  <path d="M 225 74 L 225 88" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 枚举候选 -->
  <rect x="60" y="92" width="330" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="225" y="113" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold"
        filter="url(#rough2)">② 枚举候选（方向, k）：P(k)、Q(k)，k = 1…n</text>

  <path d="M 225 126 L 225 140" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 二分 -->
  <rect x="40" y="144" width="370" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="225" y="165" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">③ 二分定位候选 A 与 best 的首个差异位 m（哈希 O(1) 判等）</text>

  <path d="M 225 178 L 225 192" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：m = n ? -->
  <polygon points="225,192 300,224 225,256 150,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="221" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold"
        filter="url(#rough2)">m = n？</text>
  <text x="225" y="237" text-anchor="middle" font-size="9.5" fill="#8a6a20"
        filter="url(#rough2)">两串完全相同</text>

  <text x="233" y="269" font-size="10" fill="#8a6a20" filter="url(#rough2)">否</text>
  <path d="M 225 256 L 225 270" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2：A[m] < best[m] ? -->
  <polygon points="225,270 300,302 225,334 150,302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="307" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold"
        filter="url(#rough2)">A[m] &lt; best[m]？</text>

  <!-- 是 → best ← A -->
  <text x="315" y="296" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 300 302 L 376 302" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="284" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">best ← A</text>

  <!-- 否 ↓ 汇入回环 -->
  <text x="233" y="349" font-size="10" fill="#8a6a20" filter="url(#rough2)">否</text>
  <path d="M 225 334 L 225 352 L 496 352" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 菱形 1 是 → 汇入回环 -->
  <text x="312" y="217" font-size="10" fill="#8a6a20" filter="url(#rough2)">是</text>
  <path d="M 300 224 L 496 224" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- best ← A 出口汇入回环 -->
  <path d="M 480 302 L 496 302" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 回环主干：取下一候选 -->
  <path d="M 496 352 L 496 109 L 394 109" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="101" font-size="10" fill="#446688" filter="url(#rough2)">取下一候选</text>

  <!-- 枚举完毕 → ④ -->
  <path d="M 60 109 L 22 109 L 22 389 L 56 389" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="14" y="250" transform="rotate(-90 14 250)" font-size="10" fill="#446688"
        filter="url(#rough2)">枚举完毕</text>

  <!-- ④ 物化输出 -->
  <rect x="60" y="372" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="185" y="393" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">④ 按 best 的（方向, k）反转一次输出</text>

  <!-- 注释框 -->
  <rect x="350" y="372" width="146" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9.5" fill="#8a6a20" text-anchor="middle">
    <text x="423" y="390">2n 次比较 × O(log n)</text>
    <text x="423" y="406">全程不构造候选串</text>
    <text x="423" y="422" font-weight="bold">总计 O(n log n)</text>
  </g>

  <text x="26" y="440" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">示例 1 "dcab"：best = P(3) ⇒ 输出 "acdb"</text>
</svg>
