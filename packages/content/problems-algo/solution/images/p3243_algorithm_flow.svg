<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：加一条边 → 跑一遍 BFS</text>

  <rect x="105" y="46" width="310" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 建邻接表：先放链边 i → i+1</text>

  <path d="M 260 86 L 260 100" stroke="#999" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="105" y="104" width="310" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 取查询 (u, v)：g[u] 加入 v</text>

  <path d="M 260 144 L 260 158" stroke="#999" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="105" y="162" width="310" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ BFS(0)：dist 全置 −1，按层扩展</text>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">dist[v] = dist[u] + 1，首次到达即最短</text>

  <path d="M 260 218 L 260 232" stroke="#999" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="105" y="236" width="310" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="261" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">④ ans[i] = dist[n−1]</text>

  <path d="M 260 276 L 260 290" stroke="#999" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="105" y="294" width="310" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">⑤ 查询处理完 → 返回 ans</text>

  <path d="M 417 256 L 466 256 L 466 124 L 419 124" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="190" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">循环</text>

  <text x="98" y="176" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">无权图</text>
  <text x="98" y="192" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最短路</text>
  <text x="98" y="210" text-anchor="end" font-size="11" fill="#a07830" filter="url(#rough2)">O(n+m)</text>

  <text x="98" y="252" text-anchor="end" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">答案单调</text>
  <text x="98" y="268" text-anchor="end" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">不增</text>
</svg>
