<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [7,6,1,2]，逐位滚动两个方向</text>

  <!-- header -->
  <rect x="22" y="36" width="476" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="71" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">y</text>
  <text x="107" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="172" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">+1 (cnt, sum)</text>
  <text x="264" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">−1 (cnt, sum)</text>
  <text x="373" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">本行计入的子数组</text>
  <text x="467" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 0 -->
  <rect x="22" y="60" width="476" height="42" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="85" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="71" y="85" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="107" y="85" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="172" y="85" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 7)</text>
  <text x="264" y="85" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 7)</text>
  <text x="373" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[7]</text>
  <text x="467" y="85" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>

  <!-- row 1 -->
  <rect x="22" y="102" width="476" height="42" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="127" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="71" y="127" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="107" y="127" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="172" y="127" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 6)</text>
  <rect x="232" y="111" width="64" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="127" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(2, 19)</text>
  <text x="373" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[6]、[7,6]</text>
  <text x="467" y="127" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">26</text>

  <!-- row 2 -->
  <rect x="22" y="144" width="476" height="42" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="169" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="71" y="169" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="107" y="169" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">−5</text>
  <text x="172" y="169" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <text x="264" y="169" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <text x="373" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="467" y="169" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">27</text>

  <!-- row 3 -->
  <rect x="22" y="186" width="476" height="42" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="211" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="71" y="211" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="107" y="211" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="140" y="195" width="64" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="211" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(2, 5)</text>
  <text x="264" y="211" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 2)</text>
  <text x="373" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2]、[1,2]</text>
  <rect x="440" y="195" width="54" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="467" y="211" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">32</text>

  <!-- explanations -->
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i=1 行（−1 方向扩展）：旧 [7] 延长成 [7,6]，值 13 = 7+6；再加新单元素 [6]</text>
  <text x="260" y="271" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">down_sum = 7 + 2×6 = 19 = 6 + 13；ans += 6 + 19 − 6 = 19，单元素恰好只计一次</text>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i=3 行（+1 方向扩展）：up_sum = 1 + 2×2 = 5 = [2] + [1,2]</text>

  <rect x="90" y="304" width="340" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终 ans = 32 = 7+6+1+2+13+3，与示例 3 一致 √</text>

  <text x="260" y="364" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">橙色格 = 发生扩展的方向；每行 ans += up_sum + down_sum − y（i=0 行：7+7−7=7）</text>
  <text x="260" y="382" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三种分支全踩到：i=1 是 −1 扩展、i=2 是断开重置、i=3 是 +1 扩展</text>
</svg>
