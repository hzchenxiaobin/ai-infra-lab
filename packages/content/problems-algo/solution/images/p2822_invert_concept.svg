<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">对象反转：键 ⇄ 值 互换</text>

  <!-- Original Object -->
  <rect x="40" y="60" width="180" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">原始对象 obj</text>
  <text x="60" y="108" font-size="12" fill="#333" filter="url(#rough2)">"a" → "1"</text>
  <text x="60" y="128" font-size="12" fill="#333" filter="url(#rough2)">"b" → "2"</text>
  <text x="60" y="148" font-size="12" fill="#333" filter="url(#rough2)">"c" → "3"</text>
  <text x="60" y="168" font-size="12" fill="#333" filter="url(#rough2)">"d" → "4"</text>

  <!-- Arrows showing swap -->
  <path d="M 120 108 Q 280 70, 430 108" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 120 168 Q 280 200, 430 168" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="275" y="62" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">值 → 新键</text>
  <text x="275" y="212" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">键 → 新值</text>

  <!-- Inverted Object -->
  <rect x="340" y="60" width="180" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">反转后 result</text>
  <text x="360" y="108" font-size="12" fill="#333" filter="url(#rough2)">"1" → "a"</text>
  <text x="360" y="128" font-size="12" fill="#333" filter="url(#rough2)">"2" → "b"</text>
  <text x="360" y="148" font-size="12" fill="#333" filter="url(#rough2)">"3" → "c"</text>
  <text x="360" y="168" font-size="12" fill="#333" filter="url(#rough2)">"4" → "d"</text>

  <!-- Divider -->
  <line x1="40" y1="230" x2="520" y2="230" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" filter="url(#rough2)"/>

  <text x="280" y="252" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">两种失败情况 → 返回 null</text>

  <!-- Failure Case 1: Duplicate values -->
  <rect x="40" y="270" width="220" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="292" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">值重复 → null</text>
  <text x="60" y="315" font-size="11" fill="#333" filter="url(#rough2)">{"a":"1", "b":"2",</text>
  <text x="60" y="333" font-size="11" fill="#333" filter="url(#rough2)"> "c":"2", "d":"4"}</text>
  <rect x="145" y="320" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="60" y="368" font-size="11" fill="#b85450" filter="url(#rough2)">→ "2" 出现两次 ✗</text>

  <!-- Failure Case 2: Array input -->
  <rect x="300" y="270" width="220" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="292" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">输入是数组 → null</text>
  <text x="320" y="320" font-size="11" fill="#333" filter="url(#rough2)">["1", "2", "3", "4"]</text>
  <text x="320" y="345" font-size="11" fill="#333" filter="url(#rough2)">Array.isArray → true</text>
  <text x="320" y="368" font-size="11" fill="#b85450" filter="url(#rough2)">→ 无法反转 ✗</text>
</svg>
