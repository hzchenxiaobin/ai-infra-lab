<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：正反相同的数永远可见</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">fronts[i] == backs[i] → 该数无法隐藏，永远暴露在桌面上</text>

  <!-- Card 0: front=1, back=1 (bad) -->
  <rect x="50" y="70" width="70" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="85" y="90" text-anchor="middle" font-size="9" fill="#b85450">正面</text>
  <text x="85" y="108" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <line x1="55" y1="115" x2="115" y2="115" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="85" y="130" text-anchor="middle" font-size="9" fill="#b85450">背面</text>
  <text x="85" y="146" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <text x="85" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">× 永远可见</text>

  <!-- Card 1: front=2, back=3 (good) -->
  <rect x="165" y="70" width="70" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="90" text-anchor="middle" font-size="9" fill="#4a7a3a">正面</text>
  <text x="200" y="108" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="170" y1="115" x2="230" y2="115" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a">背面</text>
  <text x="200" y="146" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="200" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 可翻转</text>

  <!-- Card 2: front=4, back=4 (bad) -->
  <rect x="280" y="70" width="70" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="315" y="90" text-anchor="middle" font-size="9" fill="#b85450">正面</text>
  <text x="315" y="108" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">4</text>
  <line x1="285" y1="115" x2="345" y2="115" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="315" y="130" text-anchor="middle" font-size="9" fill="#b85450">背面</text>
  <text x="315" y="146" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">4</text>
  <text x="315" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">× 永远可见</text>

  <!-- Card 3: front=7, back=3 (good) -->
  <rect x="395" y="70" width="70" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="90" text-anchor="middle" font-size="9" fill="#4a7a3a">正面</text>
  <text x="430" y="108" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">7</text>
  <line x1="400" y1="115" x2="460" y2="115" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="430" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a">背面</text>
  <text x="430" y="146" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="430" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 可翻转</text>

  <!-- Conclusion box: good number criteria -->
  <rect x="40" y="195" width="480" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="215" font-size="11" fill="#8a6a20" font-weight="bold">好数的判定条件</text>
  <text x="52" y="233" font-size="10" fill="#555">① 该数出现在至少一张卡片上（正面或背面）</text>
  <text x="52" y="250" font-size="10" fill="#555">② 没有任何卡片正反面都等于该数（即不在"坏数集合"中）</text>

  <!-- Flip strategy box -->
  <rect x="40" y="280" width="480" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="300" font-size="11" fill="#446688" font-weight="bold">翻转策略：对于含目标数 x 的卡片，翻到 x 朝下即可隐藏</text>
  <text x="52" y="318" font-size="10" fill="#555">front=x → 翻转使 back 朝上（x 藏在正面朝下）</text>
  <text x="52" y="335" font-size="10" fill="#555">back=x → 不翻，front 朝上（x 藏在背面朝下）</text>
  <text x="52" y="352" font-size="10" fill="#446688" font-weight="bold">只要无卡片正反都=x，所有含 x 的卡片都能藏住 x ✓</text>
</svg>
