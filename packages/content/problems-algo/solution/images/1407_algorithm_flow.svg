<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：LEFT JOIN → GROUP BY → SUM → IFNULL → ORDER BY</text>

  <!-- ============ Step 1: FROM Users ============ -->
  <rect x="20" y="60" width="110" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="75" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① FROM Users</text>
  <text x="75" y="98" text-anchor="middle" font-size="9" fill="#555">左表（基准）</text>

  <path d="M132,85 L168,85" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ============ Step 2: LEFT JOIN Rides ============ -->
  <rect x="170" y="60" width="130" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="235" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">② LEFT JOIN</text>
  <text x="235" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Rides</text>
  <text x="235" y="106" text-anchor="middle" font-size="8" fill="#888">ON u.id=r.user_id</text>

  <path d="M302,85 L338,85" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ============ Step 3: GROUP BY ============ -->
  <rect x="340" y="60" width="130" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="80" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">③ GROUP BY</text>
  <text x="405" y="94" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">u.id, u.name</text>
  <text x="405" y="106" text-anchor="middle" font-size="8" fill="#888">按用户分组</text>

  <path d="M472,85 L508,85" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ============ Step 4: SUM + IFNULL ============ -->
  <rect x="510" y="60" width="72" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="546" y="78" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">④ SUM</text>
  <text x="546" y="90" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">+ IFNULL</text>
  <text x="546" y="102" text-anchor="middle" font-size="8" fill="#888">空集→0</text>

  <!-- down arrow from step4 to step5 -->
  <path d="M546,114 Q546,150 546,176" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ============ Step 5: ORDER BY (bottom) ============ -->
  <rect x="340" y="178" width="242" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="461" y="198" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">⑤ ORDER BY</text>
  <text x="461" y="212" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">travelled_distance DESC</text>
  <text x="461" y="224" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">, name ASC</text>

  <path d="M338,203 L302,203" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ============ Step 6: Result ============ -->
  <rect x="20" y="178" width="280" height="50" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">⑥ 输出结果</text>
  <text x="160" y="215" text-anchor="middle" font-size="9" fill="#555">name | travelled_distance</text>

  <!-- ============ annotations ============ -->
  <rect x="20" y="250" width="270" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="34" y="268" font-size="9.5" fill="#d6a040" font-weight="bold">②③ 关键：JOIN 与分组</text>
  <text x="34" y="282" font-size="9" fill="#333">LEFT JOIN 保左表全行（含 Donald）</text>
  <text x="34" y="295" font-size="9" fill="#333">有行程用户裂变为多行 → GROUP BY 收回</text>
  <text x="34" y="308" font-size="9" fill="#333">每组一行；无行程用户占一行 NULL</text>
  <text x="34" y="322" font-size="9" fill="#b85450" font-weight="bold">GROUP BY u.id 用主键区分同名用户</text>
  <text x="34" y="335" font-size="8.5" fill="#888">（不能只按 name 分组，否则同名合并）</text>

  <rect x="310" y="250" width="270" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="324" y="268" font-size="9.5" fill="#b85450" font-weight="bold">④⑤ 关键：兜底与排序</text>
  <text x="324" y="282" font-size="9" fill="#333">SUM 对空集返回 NULL（非 0）</text>
  <text x="324" y="295" font-size="9" fill="#333">IFNULL(SUM(...), 0) 兜底为 0</text>
  <text x="324" y="308" font-size="9" fill="#333">ORDER BY 两列混合升降序</text>
  <text x="324" y="322" font-size="9" fill="#b85450" font-weight="bold">DESC 距离优先 + ASC 名字破并列</text>
  <text x="324" y="335" font-size="8.5" fill="#888">（无需 RANK() 窗口函数）</text>
</svg>
