<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 3, 5, 7, 9, 11]  (0-indexed, n=6)</text>

  <!-- ===== ① 建树结果 ===== -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">① 建树后 tree[1..6]</text>
  <rect x="230" y="50" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="50" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="50" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="50" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="50" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="480" y="50" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="305" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="355" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="405" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">16</text>
  <text x="455" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="505" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">20</text>
  <text x="255" y="94" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="305" y="94" text-anchor="middle" font-size="9" fill="#888">i=2</text>
  <text x="355" y="94" text-anchor="middle" font-size="9" fill="#888">i=3</text>
  <text x="405" y="94" text-anchor="middle" font-size="9" fill="#888">i=4</text>
  <text x="455" y="94" text-anchor="middle" font-size="9" fill="#888">i=5</text>
  <text x="505" y="94" text-anchor="middle" font-size="9" fill="#888">i=6</text>
  <text x="40" y="86" font-size="10" fill="#888">校验 prefixSum(6)</text>
  <text x="40" y="100" font-size="10" fill="#888">= tree[6]+tree[4]</text>
  <text x="40" y="114" font-size="10" fill="#4a7a3a" font-weight="bold">= 20+16 = 36 ✓</text>

  <line x1="30" y1="128" x2="610" y2="128" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== ② update ===== -->
  <text x="40" y="152" font-size="12" fill="#446688" font-weight="bold">② update(index=1, val=5)</text>
  <text x="40" y="172" font-size="11" fill="#444">delta = 5 − 3 = +2，BIT i = index+1 = 2，沿 i += lowbit(i) 向上：</text>

  <!-- jump chain -->
  <rect x="150" y="186" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=2</text>
  <path d="M 196 199 L 226 199" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="211" y="194" text-anchor="middle" font-size="9" fill="#888">+lb2</text>
  <rect x="228" y="186" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=4</text>
  <path d="M 274 199 L 304 199" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="289" y="194" text-anchor="middle" font-size="9" fill="#888">+lb4</text>
  <text x="312" y="204" font-size="11" fill="#b85450" font-weight="bold">8 &gt; n 停</text>

  <!-- before -> after -->
  <text x="40" y="240" font-size="11" fill="#444">tree[2]：</text>
  <rect x="92" y="226" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="243" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <path d="M 134 238 L 162 238" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="166" y="226" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="186" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <text x="260" y="240" font-size="11" fill="#444">tree[4]：</text>
  <rect x="312" y="226" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="243" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16</text>
  <path d="M 354 238 L 382 238" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="386" y="226" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="406" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">18</text>
  <text x="440" y="240" font-size="10" fill="#888">(nums[1]：3 → 5)</text>

  <line x1="30" y1="266" x2="610" y2="266" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== ③ sumRange ===== -->
  <text x="40" y="290" font-size="12" fill="#446688" font-weight="bold">③ sumRange(left=2, right=5) = prefixSum(6) − prefixSum(2)</text>

  <text x="40" y="316" font-size="11" fill="#444">prefixSum(6)：6 → 4 → 0  ⟹  tree[6] + tree[4] = 20 + 18 =</text>
  <rect x="500" y="302" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="318" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">38</text>

  <text x="40" y="344" font-size="11" fill="#444">prefixSum(2)：2 → 0      ⟹  tree[2] =</text>
  <rect x="316" y="330" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="346" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">6</text>

  <!-- result box -->
  <rect x="60" y="372" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="392" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">结果 = 38 − 6 = 32</text>
  <text x="320" y="408" text-anchor="middle" font-size="11" fill="#4a7a3a">校验：nums[2..5] = 5 + 7 + 9 + 11 = 32 ✓</text>

  <!-- footer -->
  <text x="320" y="438" text-anchor="middle" font-size="10" fill="#888">update 与 sumRange 各仅跳跃 ≤ log₂6 ≈ 3 步，规模到 3×10⁴ 仍为 ~15 步</text>
</svg>
