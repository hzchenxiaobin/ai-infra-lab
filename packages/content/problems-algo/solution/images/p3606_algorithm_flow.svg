<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：过滤 + 打分 + 排序</text>

  <!-- 开始 -->
  <ellipse cx="170" cy="56" rx="52" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始 i = 0</text>

  <path d="M 170 74 L 170 92" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环 -->
  <rect x="105" y="96" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &lt; n ? 否 → 跳⑥</text>

  <path d="M 170 128 L 170 146" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1 -->
  <polygon points="170,148 242,172 170,196 98,172" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">isActive[i]</text>
  <text x="170" y="183" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">为 true ?</text>
  <path d="M 242 172 L 300 172" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="272" y="164" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 170 196 L 170 216" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="210" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 菱形2 -->
  <polygon points="170,218 246,244 170,270 94,244" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">code[i] 非空且</text>
  <text x="170" y="254" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">仅字母数字/下划线 ?</text>
  <path d="M 246 244 L 300 244" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="272" y="236" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 170 270 L 170 290" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="284" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 菱形3 -->
  <polygon points="170,292 246,318 170,344 94,318" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">businessLine[i]</text>
  <text x="170" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">在 rank 表中 ?</text>
  <path d="M 246 318 L 300 318" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="272" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 170 344 L 170 362" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="356" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 收集 -->
  <rect x="92" y="366" width="156" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="383" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">收集 (rank[b], code[i])</text>

  <!-- 右侧：丢弃通道 -->
  <rect x="304" y="158" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="339" y="176" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">丢弃</text>
  <text x="339" y="192" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">continue</text>

  <!-- 右下：排序输出 -->
  <rect x="360" y="266" width="146" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="433" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑥ 按 (rank, code)</text>
  <text x="433" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">排序并输出 codes</text>

  <path d="M 374 236 C 340 236 340 260 364 266" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="228" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">遍历结束</text>

  <path d="M 433 306 L 433 330" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="366" y="334" width="134" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="433" y="355" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">返回结果数组</text>
</svg>
