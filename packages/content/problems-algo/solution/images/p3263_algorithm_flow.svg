<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：判空 → 收值 → 前进，恰好 n 轮</text>

  <!-- 开始 -->
  <rect x="180" y="46" width="160" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = [ ]，curr = head</text>
  <path d="M260,80 L260,97" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 判空菱形 -->
  <polygon points="260,100 345,140 260,180 175,140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">curr ≠ ∅ ?</text>

  <!-- 是分支 -->
  <path d="M260,180 L260,196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="268" y="194" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是（未到尾）</text>

  <rect x="165" y="198" width="190" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">收值：ans.push_back(curr.val)</text>
  <path d="M260,232 L260,248" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="165" y="250" width="190" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">前进：curr = curr.next</text>

  <!-- 回环箭头 -->
  <path d="M355,267 L420,267 L420,140 L349,140" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="388" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一轮</text>

  <!-- 否分支 -->
  <text x="160" y="131" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M175,140 L95,140 L95,325 L110,325" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="104" y="210" font-size="10.5" fill="#b85450" filter="url(#rough2)">curr 为空</text>
  <text x="104" y="226" font-size="10.5" fill="#b85450" filter="url(#rough2)">= 已到链尾</text>

  <!-- 返回 -->
  <rect x="113" y="308" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="183" y="329" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>
  <text x="183" y="360" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">循环自然结束，ans 长度 = 节点数</text>

  <!-- 右下注释框 -->
  <rect x="300" y="300" width="190" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每轮两个 O(1) 动作：</text>
  <text x="395" y="340" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">一次尾插 + 一次指针后移</text>
  <text x="395" y="358" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">n 个节点恰好 n 轮</text>
</svg>
