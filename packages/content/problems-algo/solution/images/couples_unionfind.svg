<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">并查集视角：错位沙发连边 → 环长 k 需 k−1 次交换</text>

  <!-- ===== Left panel: row -> couch -> couples edges ===== -->
  <rect x="24" y="44" width="360" height="300" rx="10" fill="#f4faf6" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="204" y="66" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">row = [2,4,0,5,1,3,6,7]（n=4）</text>
  <text x="204" y="82" text-anchor="middle" font-size="10" fill="#666">人 p 属于情侣 p/2</text>

  <!-- Couch 0: persons 2,4 -> couples 1,2 -> edge -->
  <text x="40" y="108" font-size="11" fill="#444">沙发0</text>
  <rect x="84" y="92" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="104" y="111" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="128" y="92" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="111" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="180" y="111" font-size="11" fill="#888">→ 情侣 1 与 2</text>
  <rect x="296" y="96" width="74" height="20" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="110" text-anchor="middle" font-size="10" fill="#b03a3a">连边 1—2</text>

  <!-- Couch 1: persons 0,5 -> couples 0,2 -> edge -->
  <text x="40" y="146" font-size="11" fill="#444">沙发1</text>
  <rect x="84" y="130" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="104" y="149" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="128" y="130" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="149" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="180" y="149" font-size="11" fill="#888">→ 情侣 0 与 2</text>
  <rect x="296" y="134" width="74" height="20" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="148" text-anchor="middle" font-size="10" fill="#b03a3a">连边 0—2</text>

  <!-- Couch 2: persons 1,3 -> couples 0,1 -> edge -->
  <text x="40" y="184" font-size="11" fill="#444">沙发2</text>
  <rect x="84" y="168" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="104" y="187" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="128" y="168" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="187" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="180" y="187" font-size="11" fill="#888">→ 情侣 0 与 1</text>
  <rect x="296" y="172" width="74" height="20" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="186" text-anchor="middle" font-size="10" fill="#b03a3a">连边 0—1</text>

  <!-- Couch 3: persons 6,7 -> couples 3,3 -> no edge -->
  <text x="40" y="222" font-size="11" fill="#444">沙发3</text>
  <rect x="84" y="206" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="104" y="225" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="128" y="206" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="225" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="180" y="225" font-size="11" fill="#888">→ 情侣 3 与 3</text>
  <rect x="296" y="210" width="74" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="224" text-anchor="middle" font-size="10" fill="#2e6e2e">已配对</text>

  <!-- summary on left bottom -->
  <rect x="40" y="252" width="328" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="274" text-anchor="middle" font-size="11" fill="#444">3 条错位沙发边连成情侣 {0,1,2} 的 3-环</text>
  <text x="204" y="292" text-anchor="middle" font-size="11" fill="#444">情侣 3 自成单点（0 条边）</text>
  <text x="204" y="312" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">连通分量数 = 2</text>

  <!-- ===== Right panel: graph of couples ===== -->
  <rect x="404" y="44" width="332" height="300" rx="10" fill="#fdf3f4" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="570" y="66" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">情侣关系图：节点=情侣，边=错位沙发</text>

  <!-- triangle: 0,1,2 -->
  <path d="M 540 140 L 640 140" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 540 140 L 590 230" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 640 140 L 590 230" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- edge labels -->
  <text x="590" y="132" text-anchor="middle" font-size="9" fill="#888">沙发0</text>
  <text x="552" y="200" font-size="9" fill="#888">沙发1</text>
  <text x="624" y="200" font-size="9" fill="#888">沙发2</text>

  <!-- nodes 0,1,2 -->
  <circle cx="540" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="540" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <circle cx="640" cy="140" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="640" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <circle cx="590" cy="230" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="590" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- node 3 singleton -->
  <circle cx="660" cy="250" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="660" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="660" y="284" text-anchor="middle" font-size="9" fill="#2e6e2e">单点(已配对)</text>

  <!-- 3-cycle annotation -->
  <text x="590" y="280" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">3-环：需 3−1=2 次交换</text>
  <text x="590" y="296" text-anchor="middle" font-size="10" fill="#555">每次交换断开一条边 → 剩环长减 1</text>
  <text x="570" y="324" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">ans = n − 分量数 = 4 − 2 = 2</text>

  <!-- arrow connecting left summary to right graph -->
  <path d="M 368 290 L 400 200" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
