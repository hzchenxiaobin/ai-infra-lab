<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：dp 表与最优路径 10 → 8 → 6 → 7</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">arr = [6,4,14,6,8,13,9,7,10,6,12], d = 2，答案 = 4</text>

  <!-- path arrows above boxes -->
  <!-- 10 -> 8 -->
  <path d="M 527 92 Q 481 56 435 92" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>
  <text x="481" y="58" text-anchor="middle" font-size="9" fill="#d6a040">12&gt;10</text>
  <!-- 8 -> 6 -->
  <path d="M 435 92 Q 389 48  343 92" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>
  <text x="389" y="50" text-anchor="middle" font-size="9" fill="#d6a040">10&gt;9</text>
  <!-- 6 -> 7 -->
  <path d="M 343 92 Q 366 64 389 92" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>
  <text x="366" y="66" text-anchor="middle" font-size="9" fill="#d6a040">9&gt;7</text>

  <!-- index labels -->
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="67" y="108">0</text><text x="113" y="108">1</text><text x="159" y="108">2</text>
    <text x="205" y="108">3</text><text x="251" y="108">4</text><text x="297" y="108">5</text>
    <text x="343" y="108">6</text><text x="389" y="108">7</text><text x="435" y="108">8</text>
    <text x="481" y="108">9</text><text x="527" y="108">10</text>
  </g>

  <!-- value boxes -->
  <g font-size="13" font-weight="bold">
    <rect x="47" y="116" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="67" y="138" text-anchor="middle" fill="#666">6</text>
    <rect x="93" y="116" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="113" y="138" text-anchor="middle" fill="#666">4</text>
    <rect x="139" y="116" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="159" y="138" text-anchor="middle" fill="#666">14</text>
    <rect x="185" y="116" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="205" y="138" text-anchor="middle" fill="#666">6</text>
    <rect x="231" y="116" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="251" y="138" text-anchor="middle" fill="#666">8</text>
    <rect x="277" y="116" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="297" y="138" text-anchor="middle" fill="#666">13</text>
    <!-- path nodes 6,7,8,10 highlighted -->
    <rect x="323" y="116" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="343" y="138" text-anchor="middle" fill="#d6a040">9</text>
    <rect x="369" y="116" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="389" y="138" text-anchor="middle" fill="#d6a040">7</text>
    <rect x="415" y="116" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="435" y="138" text-anchor="middle" fill="#d6a040">10</text>
    <rect x="461" y="116" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="481" y="138" text-anchor="middle" fill="#666">6</text>
    <rect x="507" y="116" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="527" y="138" text-anchor="middle" fill="#d6a040">12</text>
  </g>

  <!-- dp value boxes -->
  <g font-size="12" font-weight="bold">
    <rect x="47" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="67" y="182" text-anchor="middle" fill="#446688">2</text>
    <rect x="93" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="113" y="182" text-anchor="middle" fill="#446688">1</text>
    <rect x="139" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="159" y="182" text-anchor="middle" fill="#446688">3</text>
    <rect x="185" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="205" y="182" text-anchor="middle" fill="#446688">1</text>
    <rect x="231" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="251" y="182" text-anchor="middle" fill="#446688">2</text>
    <rect x="277" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="297" y="182" text-anchor="middle" fill="#446688">3</text>
    <rect x="323" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="343" y="182" text-anchor="middle" fill="#446688">2</text>
    <rect x="369" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="389" y="182" text-anchor="middle" fill="#446688">1</text>
    <rect x="415" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="435" y="182" text-anchor="middle" fill="#446688">3</text>
    <rect x="461" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="481" y="182" text-anchor="middle" fill="#446688">1</text>
    <!-- answer dp[10]=4 emphasized -->
    <rect x="507" y="162" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="527" y="182" text-anchor="middle" fill="#4a7a3a">4</text>
  </g>

  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#888">↑ 蓝格 = dp[i]（从 i 出发最多访问的下标数）；绿格 = 全局最大答案</text>

  <!-- key computations -->
  <rect x="40" y="232" width="520" height="132" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="254" font-size="12" fill="#444" font-weight="bold">关键 dp 推导（d=2，遇 ≥ 即停）：</text>
  <text x="60" y="274" font-size="11" fill="#555">dp[7]=1：左 6 值 9 ≥ 7 停；右 8 值 10 ≥ 7 停</text>
  <text x="60" y="292" font-size="11" fill="#555">dp[6]=2：左 5 值 13 ≥ 9 停；右 7 值 7 &lt;9 ✓ → 1+dp[7]=2；右 8 值 10 ≥ 9 停</text>
  <text x="60" y="310" font-size="11" fill="#555">dp[8]=3：左 7 ✓(1)、6 ✓(2) → 1+2=3；右 9 ✓(1)、10 值 12 ≥ 10 停</text>
  <text x="60" y="328" font-size="11" fill="#555">dp[10]=4：左 9 ✓(1)、8 ✓(3) → 1+3=4；右越界</text>
  <text x="60" y="350" font-size="11" fill="#d6a040" font-weight="bold">最优路径：10 → 8 → 6 → 7（值 12→10→9→7，访问 4 个下标）</text>
</svg>
