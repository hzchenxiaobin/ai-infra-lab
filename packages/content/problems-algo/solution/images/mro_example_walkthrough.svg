<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M 0 0 L 8 0 L 4 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算（构造）：n=6, p=0, banned=[], k=3</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">k 奇 → 同奇偶互可达；起点偶 → 奇位全 -1，偶位逐层扩散</text>

  <!-- ===== Top: 6 positions, even/odd color coded ===== -->
  <text x="40" y="74" font-size="10" fill="#888" font-weight="bold">下标 0..5（蓝=偶，灰=奇）</text>
  <g font-size="12">
    <!-- pos 0 even -->
    <rect x="40" y="82" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="68" y="101" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <!-- pos 1 odd -->
    <rect x="96" y="82" width="56" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="124" y="101" text-anchor="middle" fill="#999">0</text>
    <!-- pos 2 even -->
    <rect x="152" y="82" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="101" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <!-- pos 3 odd -->
    <rect x="208" y="82" width="56" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="236" y="101" text-anchor="middle" fill="#999">0</text>
    <!-- pos 4 even -->
    <rect x="264" y="82" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="292" y="101" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <!-- pos 5 odd -->
    <rect x="320" y="82" width="56" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="348" y="101" text-anchor="middle" fill="#999">0</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="68" y="124" text-anchor="middle">0</text>
    <text x="124" y="124" text-anchor="middle">1</text>
    <text x="180" y="124" text-anchor="middle">2</text>
    <text x="236" y="124" text-anchor="middle">3</text>
    <text x="292" y="124" text-anchor="middle">4</text>
    <text x="348" y="124" text-anchor="middle">5</text>
  </g>
  <text x="420" y="101" font-size="10" fill="#b85450" font-weight="bold">奇偶墙</text>
  <path d="M 410 84 L 410 116" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="420" y="124" font-size="9" fill="#888">k=3 奇→同奇偶可达</text>

  <!-- ===== BFS chain (left), blocked odd (right) ===== -->

  <!-- Layer 0 -->
  <rect x="60" y="150" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="170" text-anchor="middle" font-size="12" fill="#333">层0：pos 0，d=0</text>

  <path d="M 150 182 L 150 202" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>
  <text x="160" y="196" font-size="9" fill="#446688">i∈[0,0] → j=2</text>

  <!-- Layer 1 -->
  <rect x="60" y="206" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="226" text-anchor="middle" font-size="12" fill="#333">层1：pos 2，d=1</text>

  <path d="M 150 238 L 150 258" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>
  <text x="160" y="252" font-size="9" fill="#446688">i∈[0,2] → j∈{0,4}，去已访0</text>

  <!-- Layer 2 -->
  <rect x="60" y="262" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="282" text-anchor="middle" font-size="12" fill="#333">层2：pos 4，d=2</text>

  <path d="M 150 294 L 150 314" stroke="#446688" stroke-width="1.5" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <text x="160" y="308" font-size="9" fill="#999">i∈[2,3]→j∈{2,4} 全已访</text>

  <rect x="60" y="318" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">BFS 结束（无新可达）</text>

  <!-- Right: blocked odd positions -->
  <text x="400" y="160" font-size="10" fill="#888" font-weight="bold">奇位 1/3/5：奇偶不符</text>
  <g font-size="11">
    <rect x="380" y="170" width="120" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="440" y="188" text-anchor="middle" fill="#999">pos 1 = -1 ✗</text>
    <rect x="380" y="202" width="120" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="440" y="220" text-anchor="middle" fill="#999">pos 3 = -1 ✗</text>
    <rect x="380" y="234" width="120" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="440" y="252" text-anchor="middle" fill="#999">pos 5 = -1 ✗</text>
  </g>
  <text x="440" y="278" text-anchor="middle" font-size="9" fill="#888">从偶位只能跳到偶位</text>
  <text x="440" y="292" text-anchor="middle" font-size="9" fill="#888">→ 奇位永不入队</text>

  <!-- ===== Bottom: answer array ===== -->
  <text x="40" y="372" font-size="10" fill="#888" font-weight="bold">最终 ans（下标 0..5）</text>
  <g font-size="12">
    <rect x="80" y="380" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="108" y="400" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <rect x="136" y="380" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="164" y="400" text-anchor="middle" fill="#999">-1</text>
    <rect x="192" y="380" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="220" y="400" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="248" y="380" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="276" y="400" text-anchor="middle" fill="#999">-1</text>
    <rect x="304" y="380" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="332" y="400" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="360" y="380" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="388" y="400" text-anchor="middle" fill="#999">-1</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="108" y="422" text-anchor="middle">0</text>
    <text x="164" y="422" text-anchor="middle">1</text>
    <text x="220" y="422" text-anchor="middle">2</text>
    <text x="276" y="422" text-anchor="middle">3</text>
    <text x="332" y="422" text-anchor="middle">4</text>
    <text x="388" y="422" text-anchor="middle">5</text>
  </g>

  <rect x="90" y="448" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="250" y="470" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = [0, -1, 1, -1, 2, -1] ✓</text>
</svg>
