<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">奇偶不变 → 分组排序配对</text>
  <text x="270" y="56" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每次操作 +2 一个 / −2 一个，不改变任一元素的奇偶：奇只能配奇，偶只能配偶</text>

  <text x="144" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">奇组（已排序）</text>
  <text x="374" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">偶组（已排序）</text>

  <text x="92" y="129" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">nums</text>
  <text x="92" y="249" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">target</text>

  <rect x="100" y="110" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="148" y="110" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <rect x="330" y="110" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="378" y="110" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="398" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>

  <path d="M120,142 L120,228" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="134" y="188" font-size="12" fill="#b85450" filter="url(#rough2)">−2</text>
  <path d="M168,142 L168,228" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="188" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>

  <path d="M350,142 L350,228" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="188" font-size="12" fill="#b85450" filter="url(#rough2)">−2</text>
  <path d="M398,142 L398,228" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="188" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>

  <rect x="100" y="230" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="250" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="230" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="250" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>

  <rect x="330" y="230" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="250" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="378" y="230" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="398" y="250" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">14</text>

  <rect x="60" y="288" width="420" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">正差之和 = (+2) + (+2) = 4</text>
  <text x="270" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">每次操作配 1 个 +2 与 1 个 −2 → 答案 = 4 ÷ 2 = 2</text>
</svg>
