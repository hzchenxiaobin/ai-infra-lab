<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：连通三元组度数 = 三顶点度数之和 − 6</text>

  <!-- ===== Left: Graph (example 1) ===== -->
  <!-- Internal edges (trio) - blue thick -->
  <line x1="165" y1="100" x2="85" y2="200" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="165" y1="100" x2="245" y2="200" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="85" y1="200" x2="245" y2="200" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- External edges - red dashed -->
  <line x1="165" y1="100" x2="85" y2="42" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <line x1="85" y1="200" x2="25" y2="288" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <line x1="245" y1="200" x2="305" y2="288" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- Trio nodes - blue filled -->
  <circle cx="165" cy="100" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="85" cy="200" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="205" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="245" cy="200" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="245" y="205" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- External nodes - orange filled -->
  <circle cx="85" cy="42" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="46" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="25" cy="288" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="25" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="305" cy="288" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- Trio label -->
  <rect x="115" y="142" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="157" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">三元组 {1,2,3}</text>

  <!-- Legend -->
  <line x1="20" y1="330" x2="48" y2="330" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="55" y="334" font-size="11" fill="#555" filter="url(#rough2)">内部边 ×3（度和中被计 2 次）</text>
  <line x1="20" y1="350" x2="48" y2="350" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="55" y="354" font-size="11" fill="#555" filter="url(#rough2)">外部边 ×3（度和中被计 1 次）</text>
  <text x="20" y="378" font-size="11" fill="#888" filter="url(#rough2)">度和 = 2×3 + 1×3 = 9 → 度数 = 9−6 = 3</text>

  <!-- ===== Right: Formula ===== -->
  <!-- Formula box -->
  <rect x="350" y="58" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="80" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">三元组 {a, b, c} 的度数</text>
  <text x="450" y="102" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= deg[a]+deg[b]+deg[c] − 6</text>

  <!-- Why -6? -->
  <text x="350" y="138" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">为什么减 6？</text>

  <text x="350" y="160" font-size="11" fill="#555" filter="url(#rough2)">deg[a] 统计 a 的所有邻边</text>
  <text x="350" y="176" font-size="11" fill="#555" filter="url(#rough2)">其中 2 条连向内部（→ b, → c）</text>

  <text x="350" y="198" font-size="11" fill="#555" filter="url(#rough2)">3 个顶点各贡献 2 条内部边</text>
  <text x="350" y="214" font-size="11" fill="#555" filter="url(#rough2)">→ 内部边被重复计 <tspan fill="#b85450" font-weight="bold">2×3 = 6</tspan></text>

  <text x="350" y="236" font-size="11" fill="#555" filter="url(#rough2)">外部边只在三元组内那端</text>
  <text x="350" y="252" font-size="11" fill="#555" filter="url(#rough2)">被计 1 次 → 无冗余</text>

  <!-- Example calculation box -->
  <rect x="350" y="275" width="200" height="95" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="297" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 {1, 2, 3}</text>
  <text x="360" y="318" font-size="11" fill="#333" filter="url(#rough2)">deg[1]=3, deg[2]=3, deg[3]=3</text>
  <text x="360" y="337" font-size="11" fill="#333" filter="url(#rough2)">度和 = 3 + 3 + 3 = 9</text>
  <text x="360" y="358" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">度数 = 9 − 6 = 3 ✓</text>
</svg>
