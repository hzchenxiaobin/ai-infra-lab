<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：word1="cabaa", word2="bcaaa" → "cbcabaaaaa"</text>

  <!-- Table header -->
  <g font-size="11" fill="#555" text-anchor="middle" font-weight="bold">
    <rect x="20" y="38" width="44" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="42" y="54" filter="url(#rough2)">步</text>
    <rect x="64" y="38" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="124" y="54" fill="#446688" filter="url(#rough2)">word1 剩余</text>
    <rect x="184" y="38" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="244" y="54" fill="#4a7a3a" filter="url(#rough2)">word2 剩余</text>
    <rect x="304" y="38" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="359" y="54" fill="#d6a040" filter="url(#rough2)">后缀比较</text>
    <rect x="414" y="38" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="436" y="54" fill="#b85450" filter="url(#rough2)">取</text>
    <rect x="458" y="38" width="86" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="501" y="54" filter="url(#rough2)">merge</text>
  </g>

  <!-- Row data -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- Step 1 -->
    <rect x="20" y="62" width="44" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="42" y="77" filter="url(#rough2)">1</text>
    <rect x="64" y="62" width="120" height="22" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="124" y="77" filter="url(#rough2)">cabaa</text>
    <rect x="184" y="62" width="120" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="244" y="77" filter="url(#rough2)">bcaaa</text>
    <rect x="304" y="62" width="110" height="22" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="359" y="77" filter="url(#rough2)">'c' &gt; 'b'</text>
    <rect x="414" y="62" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="436" y="77" fill="#446688" font-weight="bold" filter="url(#rough2)">w1</text>
    <rect x="458" y="62" width="86" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="501" y="77" filter="url(#rough2)">c</text>

    <!-- Step 2 -->
    <rect x="20" y="84" width="44" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="42" y="99" filter="url(#rough2)">2</text>
    <rect x="64" y="84" width="120" height="22" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="124" y="99" filter="url(#rough2)">abaa</text>
    <rect x="184" y="84" width="120" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="244" y="99" filter="url(#rough2)">bcaaa</text>
    <rect x="304" y="84" width="110" height="22" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="359" y="99" filter="url(#rough2)">'a' &lt; 'b'</text>
    <rect x="414" y="84" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="436" y="99" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">w2</text>
    <rect x="458" y="84" width="86" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="501" y="99" filter="url(#rough2)">cb</text>

    <!-- Step 3 -->
    <rect x="20" y="106" width="44" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="42" y="121" filter="url(#rough2)">3</text>
    <rect x="64" y="106" width="120" height="22" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="124" y="121" filter="url(#rough2)">abaa</text>
    <rect x="184" y="106" width="120" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="244" y="121" filter="url(#rough2)">caaa</text>
    <rect x="304" y="106" width="110" height="22" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="359" y="121" filter="url(#rough2)">'a' &lt; 'c'</text>
    <rect x="414" y="106" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="436" y="121" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">w2</text>
    <rect x="458" y="106" width="86" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="501" y="121" filter="url(#rough2)">cbc</text>

    <!-- Step 4 - key step -->
    <rect x="20" y="128" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="42" y="143" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
    <rect x="64" y="128" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="124" y="143" filter="url(#rough2)">abaa</text>
    <rect x="184" y="128" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="244" y="143" filter="url(#rough2)">aaa</text>
    <rect x="304" y="128" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="359" y="143" fill="#b85450" font-weight="bold" filter="url(#rough2)">abaa&gt;aaa</text>
    <rect x="414" y="128" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="436" y="143" fill="#446688" font-weight="bold" filter="url(#rough2)">w1</text>
    <rect x="458" y="128" width="86" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="501" y="143" filter="url(#rough2)">cbca</text>

    <!-- Step 5 -->
    <rect x="20" y="150" width="44" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="42" y="165" filter="url(#rough2)">5</text>
    <rect x="64" y="150" width="120" height="22" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="124" y="165" filter="url(#rough2)">baa</text>
    <rect x="184" y="150" width="120" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="244" y="165" filter="url(#rough2)">aaa</text>
    <rect x="304" y="150" width="110" height="22" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="359" y="165" filter="url(#rough2)">'b' &gt; 'a'</text>
    <rect x="414" y="150" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="436" y="165" fill="#446688" font-weight="bold" filter="url(#rough2)">w1</text>
    <rect x="458" y="150" width="86" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="501" y="165" filter="url(#rough2)">cbcab</text>

    <!-- Step 6 - key step -->
    <rect x="20" y="172" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="42" y="187" font-weight="bold" fill="#d6a040" filter="url(#rough2)">6</text>
    <rect x="64" y="172" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="124" y="187" filter="url(#rough2)">aa</text>
    <rect x="184" y="172" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="244" y="187" filter="url(#rough2)">aaa</text>
    <rect x="304" y="172" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="359" y="187" fill="#b85450" font-weight="bold" filter="url(#rough2)">aa&lt;aaa</text>
    <rect x="414" y="172" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="436" y="187" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">w2</text>
    <rect x="458" y="172" width="86" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="501" y="187" filter="url(#rough2)">cbcaba</text>

    <!-- Step 7 -->
    <rect x="20" y="194" width="44" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="42" y="209" filter="url(#rough2)">7</text>
    <rect x="64" y="194" width="120" height="22" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="124" y="209" filter="url(#rough2)">aa</text>
    <rect x="184" y="194" width="120" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="244" y="209" filter="url(#rough2)">aa</text>
    <rect x="304" y="194" width="110" height="22" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="359" y="209" fill="#888" filter="url(#rough2)">aa == aa</text>
    <rect x="414" y="194" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="436" y="209" fill="#446688" font-weight="bold" filter="url(#rough2)">w1</text>
    <rect x="458" y="194" width="86" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="501" y="209" filter="url(#rough2)">cbcabaa</text>
  </g>

  <!-- Remaining steps note -->
  <rect x="20" y="228" width="524" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">步 8-10：剩余 "a"/"aa" → "a"/"a" → ""/"a" → "" / ""，全部取 'a' 拼接</text>

  <!-- Final result -->
  <rect x="100" y="272" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">merge = "cbcabaaaaa" ✓</text>

  <!-- Key insight notes -->
  <path d="M 40 328 L 520 328" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="350" font-size="11.5" fill="#555" filter="url(#rough2)">⚠️ 步骤 4 和 6 是关键：首字符都是 'a'，不能随便取，必须比较后缀</text>
  <text x="56" y="370" font-size="11.5" fill="#555" filter="url(#rough2)">• 步 4：<tspan fill="#446688" font-weight="bold">"abaa" &gt; "aaa"</tspan>（第 2 位 'b' &gt; 'a'）→ 取 word1</text>
  <text x="56" y="390" font-size="11.5" fill="#555" filter="url(#rough2)">• 步 6：<tspan fill="#4a7a3a" font-weight="bold">"aa" &lt; "aaa"</tspan>（"aa" 是 "aaa" 前缀，更短更小）→ 取 word2</text>
  <text x="56" y="412" font-size="11" fill="#888" filter="url(#rough2)">若步 4 错取 word2，merge 会变成 "cbca..."，远小于 "cbcab..."，字典序非最大</text>
  <text x="56" y="432" font-size="11" fill="#888" filter="url(#rough2)">若步 6 错取 word1，merge 会变成 "cbcabaa..."，少了 word2 的第三个 'a' 带来的优势</text>
</svg>
