<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 3, k = 2 → 答案 3</text>

  <!-- ===== DP Table (left) ===== -->
  <text x="135" y="46" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">DP 表 dp[i][j]</text>

  <!-- corner cell -->
  <rect x="30" y="54" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="72" text-anchor="middle" font-size="10" fill="#666">i\j</text>

  <!-- header row k=0..3 -->
  <rect x="74" y="54" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="96" y="72" text-anchor="middle" font-size="11" fill="#666">0</text>
  <rect x="118" y="54" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="72" text-anchor="middle" font-size="11" fill="#666">1</text>
  <rect x="162" y="54" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="184" y="72" text-anchor="middle" font-size="11" fill="#666">2</text>
  <rect x="206" y="54" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="228" y="72" text-anchor="middle" font-size="11" fill="#666">3</text>

  <!-- row n=0 -->
  <rect x="30" y="80" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="98" text-anchor="middle" font-size="11" fill="#666">0</text>
  <rect x="74" y="80" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="96" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="118" y="80" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="98" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="162" y="80" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="184" y="98" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="206" y="80" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="228" y="98" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- row n=1 -->
  <rect x="30" y="106" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="124" text-anchor="middle" font-size="11" fill="#666">1</text>
  <rect x="74" y="106" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="96" y="124" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="118" y="106" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="162" y="106" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="184" y="124" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="206" y="106" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="228" y="124" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- row n=2 -->
  <rect x="30" y="132" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="150" text-anchor="middle" font-size="11" fill="#666">2</text>
  <rect x="74" y="132" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="96" y="150" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="118" y="132" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="162" y="132" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="184" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="206" y="132" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="228" y="150" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- row n=3 -->
  <rect x="30" y="158" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="176" text-anchor="middle" font-size="11" fill="#666">3</text>
  <rect x="74" y="158" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="96" y="176" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="118" y="158" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="176" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="162" y="158" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="184" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="206" y="158" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="228" y="176" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- table legend -->
  <text x="30" y="200" font-size="10" fill="#4a7a3a">■</text>
  <text x="42" y="200" font-size="10" fill="#666">边界</text>
  <text x="80" y="200" font-size="10" fill="#d6a040">■</text>
  <text x="92" y="200" font-size="10" fill="#666">递推用</text>
  <text x="135" y="200" font-size="10" fill="#b85450">■</text>
  <text x="147" y="200" font-size="10" fill="#666">答案</text>

  <!-- ===== Recurrence (right) ===== -->
  <rect x="280" y="54" width="260" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="78" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">递推计算 dp[3][2]</text>
  <text x="410" y="100" text-anchor="middle" font-size="12" fill="#333">= dp[2][1] + 2·dp[2][2]</text>
  <text x="410" y="120" text-anchor="middle" font-size="12" fill="#333">= 1 + 2×1 = 3 ⭐</text>

  <!-- arrow from table to recurrence -->
  <path d="M 250 110 L 276 96" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Arrangements section ===== -->
  <text x="280" y="164" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">三种合法排列（绿=可见，粉=不可见）</text>

  <!-- Arrangement 1: [1, 3, 2] -->
  <text x="60" y="226" font-size="12" fill="#666" font-weight="bold">①</text>
  <rect x="120" y="208" width="55" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="147.5" y="231" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="185" y="208" width="55" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212.5" y="231" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="250" y="208" width="55" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277.5" y="231" text-anchor="middle" font-size="14" fill="#999">2</text>
  <text x="340" y="226" font-size="11" fill="#4a7a3a">可见: 1, 3 → 2 根 ✓</text>

  <!-- Arrangement 2: [2, 3, 1] -->
  <text x="60" y="284" font-size="12" fill="#666" font-weight="bold">②</text>
  <rect x="120" y="266" width="55" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="147.5" y="289" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="185" y="266" width="55" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212.5" y="289" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="250" y="266" width="55" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277.5" y="289" text-anchor="middle" font-size="14" fill="#999">1</text>
  <text x="340" y="284" font-size="11" fill="#4a7a3a">可见: 2, 3 → 2 根 ✓</text>

  <!-- Arrangement 3: [2, 1, 3] -->
  <text x="60" y="342" font-size="12" fill="#666" font-weight="bold">③</text>
  <rect x="120" y="324" width="55" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="147.5" y="347" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="185" y="324" width="55" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212.5" y="347" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="250" y="324" width="55" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="277.5" y="347" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="340" y="342" font-size="11" fill="#4a7a3a">可见: 2, 3 → 2 根 ✓</text>

  <!-- footnote -->
  <rect x="40" y="384" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="403" text-anchor="middle" font-size="11" fill="#555">情况 A 贡献 ① (dp[2][1]=1) + 情况 B 贡献 ②③ (2×dp[2][2]=2) = 3</text>
</svg>
