<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：max(arr[i..j]) == j 时块可独立排序</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">arr = [1, 0, 2, 3, 4]，块 [1,0] 的最大值 1 恰等于右端下标 1</text>

  <!-- arr row: 5 cells width 50 start x=80 -->
  <rect x="80"  y="66" width="50" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="66" width="50" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="180" y="66" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="205" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="230" y="66" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="255" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="280" y="66" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>

  <!-- index labels -->
  <text x="105" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">i=0</text>
  <text x="155" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="205" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="255" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="305" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">j=4</text>

  <!-- chunk brackets -->
  <path d="M 80 128 Q 80 136 88 136 L 172 136 Q 180 136 180 128" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="130" y="154" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">块[0..1] max=1=j ✓</text>

  <path d="M 180 128 Q 180 136 188 136 L 222 136 Q 230 136 230 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="205" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a">max=2 ✓</text>

  <path d="M 230 128 Q 230 136 238 136 L 272 136 Q 280 136 280 128" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="255" y="154" text-anchor="middle" font-size="10" fill="#d6a040">max=3 ✓</text>

  <path d="M 280 128 Q 280 136 288 136 L 322 136 Q 330 136 330 128" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="305" y="154" text-anchor="middle" font-size="10" fill="#446688">max=4 ✓</text>

  <!-- arrow down to sorted -->
  <path d="M 205 168 L 205 196" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="215" y="186" font-size="10.5" fill="#4a7a3a">各块排序后归位</text>

  <!-- sorted row -->
  <text x="80" y="210" font-size="11" fill="#888">排序拼接结果：</text>
  <rect x="80"  y="216" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="238" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="130" y="216" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="238" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="180" y="216" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="238" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="230" y="216" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="238" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="280" y="216" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="238" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="335" y="238" font-size="11" fill="#4a7a3a" font-weight="bold">= [0,1,2,3,4] ✓</text>

  <!-- conclusion box -->
  <rect x="40" y="272" width="460" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">排列中：块 arr[i..j] 合法 ⇔ max(arr[i..j]) == j</text>
  <text x="270" y="316" text-anchor="middle" font-size="11.5" fill="#666">块长 j−i+1，块内互异且 ≤ j 的数恰有 j+1 个 ⇒ 集合必为 {i..j}</text>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#888">扫描时维护 mx = max(mx, arr[i])，每当 mx == i 即切一刀</text>
</svg>
