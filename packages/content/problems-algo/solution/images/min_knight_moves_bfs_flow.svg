<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">进击的骑士：BFS 逐层扩散算法流程</text>
  <path d="M 250 42 Q 430 50 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: flowchart ===== -->
  <!-- Start -->
  <g filter="url(#sk)">
    <rect x="80" y="70" width="220" height="38" rx="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="190" y="94" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">开始：读入 (x, y)</text>
  </g>
  <path d="M 190 108 L 190 132" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- abs -->
  <g filter="url(#sk)">
    <rect x="80" y="132" width="220" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="157" text-anchor="middle" font-size="12" fill="#333">x=|x|, y=|y|（折叠到第一象限）</text>
  </g>
  <path d="M 190 172 L 190 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="80" y="196" width="220" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="221" text-anchor="middle" font-size="12" fill="#333">队列入 (0,0)，seen 标记，steps=0</text>
  </g>
  <path d="M 190 236 L 190 260" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop: pop level -->
  <g filter="url(#sk)">
    <rect x="80" y="260" width="220" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="190" y="285" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">取当前层全部 size 个坐标</text>
  </g>
  <path d="M 190 300 L 190 324" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: is target? -->
  <g filter="url(#sk)">
    <path d="M 190 324 L 270 360 L 190 396 L 110 360 Z" fill="#fff3cd" stroke="#d6a040" stroke-width="1.5"/>
    <text x="190" y="356" text-anchor="middle" font-size="11" fill="#7a5415">坐标 ==</text>
    <text x="190" y="372" text-anchor="middle" font-size="11" fill="#7a5415">(x,y) ?</text>
  </g>

  <!-- yes -> return -->
  <path d="M 270 360 L 360 360" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="360" y="341" width="150" height="38" rx="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="435" y="365" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 steps</text>
  </g>

  <!-- no -> expand 8 dirs -->
  <path d="M 190 396 L 190 420" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="200" y="416" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <g filter="url(#sk)">
    <rect x="60" y="420" width="260" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="445" text-anchor="middle" font-size="12" fill="#333">对 8 个方向算 (nx, ny)</text>
  </g>
  <path d="M 190 460 L 190 484" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- prune decision -->
  <g filter="url(#sk)">
    <path d="M 190 484 L 282 516 L 190 548 L 98 516 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="190" y="512" text-anchor="middle" font-size="10" fill="#b85450">nx&lt;-2 或 ny&lt;-2</text>
    <text x="190" y="528" text-anchor="middle" font-size="10" fill="#b85450">或已访问 ?</text>
  </g>

  <!-- yes skip -->
  <path d="M 98 516 L 50 516 L 50 280 L 80 280" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="56" y="396" font-size="10" fill="#888">跳过</text>

  <!-- no enqueue -->
  <path d="M 282 516 L 350 516 L 350 280 L 300 280" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="356" y="396" font-size="10" fill="#4a8edb" font-weight="bold">入队 +</text>
  <text x="356" y="410" font-size="10" fill="#4a8edb" font-weight="bold">标记</text>

  <!-- loop back to pop level: after whole level processed, steps++ -->
  <g filter="url(#sk)">
    <rect x="300" y="232" width="120" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="360" y="254" text-anchor="middle" font-size="11" fill="#7a5415">层结束 steps++</text>
  </g>
  <path d="M 350 280 L 350 266 L 300 249" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Right: key points ===== -->
  <g filter="url(#sk)">
    <rect x="540" y="70" width="290" height="450" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="685" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">关键不变式</text>
  <g font-size="11" fill="#444">
    <text x="558" y="124"><tspan font-weight="bold" fill="#446688">① 对称折叠</tspan></text>
    <text x="570" y="142">取绝对值 → 只在第一象限搜索</text>
    <text x="570" y="158">答案不变（马走法对正负号对称）</text>

    <text x="558" y="188"><tspan font-weight="bold" fill="#b85450">② 负向裁剪</tspan></text>
    <text x="570" y="206">仅放行 nx ≥ -2 且 ny ≥ -2</text>
    <text x="570" y="222">最优路径最多下探到 -1，</text>
    <text x="570" y="238">留 -2 余量保证不剪掉最优解</text>

    <text x="558" y="268"><tspan font-weight="bold" fill="#d6a040">③ 逐层 BFS</tspan></text>
    <text x="570" y="286">每层 steps+1，最先到达即最短</text>
    <text x="570" y="302">无权图最短路天然由 BFS 保证</text>

    <text x="558" y="332"><tspan font-weight="bold" fill="#4a8e4a">④ 去重</tspan></text>
    <text x="570" y="350">seen 哈希集合避免重复访问</text>
    <text x="570" y="366">坐标编码 (x+500)*1000+(y+500)</text>

    <text x="558" y="396"><tspan font-weight="bold" fill="#446688">⑤ 终止</tspan></text>
    <text x="570" y="414">弹出坐标 == (x,y) 即返回 steps</text>
  </g>
  <g filter="url(#sk)">
    <rect x="556" y="436" width="258" height="70" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="685" y="460" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">为什么 BFS 不会无限扩散？</text>
  <text x="566" y="480" font-size="10" fill="#444">目标在第一象限，BFS 按距离递增扩散，</text>
  <text x="566" y="496" font-size="10" fill="#444">到达目标即停，仅探索 O(D²) 个格子。</text>
</svg>
