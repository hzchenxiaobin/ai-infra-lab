<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：遍历入集合，返回集合大小</text>

  <!-- ===== input string row ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s = "dddaaa"</text>

  <rect x="40" y="66" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="72" y="66" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="87" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="104" y="66" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="119" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="136" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="151" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="168" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="183" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="200" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="215" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <!-- cursor -->
  <path d="M 55 60 L 55 50" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="55" y="44" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">ch</text>

  <!-- arrow down to insert -->
  <path d="M 270 110 L 270 132" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== decision: already in set? ===== -->
  <path d="M 270 134 L 350 168 L 270 202 L 190 168 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">seen</text>
  <text x="270" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">.insert(ch)</text>

  <!-- loop back arrow (from diamond left back to string) -->
  <path d="M 190 168 L 30 168 L 30 83 L 36 83" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="160" font-size="10" fill="#888" filter="url(#rough2)">下一字符</text>

  <!-- arrow down from diamond to result -->
  <path d="M 270 202 L 270 224" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="285" y="216" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">遍历结束</text>

  <!-- ===== result box ===== -->
  <rect x="150" y="226" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="251" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return len(seen) = 2</text>

  <!-- ===== seen set visualization ===== -->
  <text x="400" y="64" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">seen =</text>

  <!-- set box -->
  <rect x="400" y="70" width="110" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="95" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">{d, a}</text>

  <!-- step annotations -->
  <rect x="400" y="122" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="137" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">读 d → 加入</text>
  <rect x="400" y="148" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="163" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">读 d → 已在，跳过</text>
  <rect x="400" y="174" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="189" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">读 a → 加入</text>

  <!-- complexity note -->
  <text x="270" y="292" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一次遍历 O(n)，集合大小即答案，无需模拟删除</text>

  <!-- loop counter -->
  <text x="470" y="300" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">最多 26 种 → O(1) 空间</text>

  <text x="270" y="320" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">位掩码等价：mask |= 1 &lt;&lt; (ch - 'a')，popcount 即答案</text>
</svg>
