<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：柱高是「均价水平」而非「总价体量」—— 全国均值即分界线</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">各柱 = AVG(price)（GROUP BY city 分组）；虚线 = 整表 AVG(price)</text>

  <!-- 柱：Chicago -->
  <rect x="74" y="111" width="64" height="185" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="106" y="104" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7,048,706.75</text>
  <text x="106" y="128" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 柱：LosAngeles -->
  <rect x="180" y="132" width="64" height="164" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="212" y="125" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6,262,754.50</text>
  <text x="212" y="146" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 柱：NewYork -->
  <rect x="286" y="180" width="64" height="116" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4,422,739</text>
  <text x="318" y="196" text-anchor="middle" font-size="13" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 柱：SanFrancisco -->
  <rect x="392" y="193" width="64" height="103" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="424" y="186" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3,917,180</text>
  <text x="424" y="209" text-anchor="middle" font-size="13" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 全国均价虚线 -->
  <line x1="44" y1="150" x2="492" y2="150" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="488" y="141" text-anchor="end" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">全国均价 5,574,304.91 ＝ 61,317,354 ÷ 11 套</text>

  <!-- 基线 -->
  <line x1="44" y1="296" x2="492" y2="296" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 城市标签 -->
  <text x="106" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">Chicago</text>
  <text x="106" y="333" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">(4 套)</text>
  <text x="212" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">LosAngeles</text>
  <text x="212" y="333" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">(2 套)</text>
  <text x="318" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">NewYork</text>
  <text x="318" y="333" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">(2 套)</text>
  <text x="424" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">SanFrancisco</text>
  <text x="424" y="333" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">(3 套)</text>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">全国均价必落在最小组与最大组均价之间 → 不可能所有城市都『贵过平均』</text>
</svg>
