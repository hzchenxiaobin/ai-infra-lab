<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次倒扫 + 一次正扫，O(n + q)</text>

  <!-- 开始 -->
  <rect x="168" y="34" width="64" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="51" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 200 60 L 200 72" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="120" y="74" width="160" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="92" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">seen = ∅，ans = [ ]</text>
  <path d="M 200 102 L 200 114" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 阶段① 容器 -->
  <rect x="56" y="116" width="300" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="134" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 逆序扫 queries（i = q−1 → 0）</text>
  <polygon points="140,150 198,172 140,194 82,172" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="176" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">queries[i] 是新 id？</text>
  <path d="M 198 172 L 220 172" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="209" y="165" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="222" y="157" width="118" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="281" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">收入 ans，记入 seen</text>
  <text x="152" y="201" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否 ⇒ 跳过（早就记过）</text>
  <path d="M 342 194 C 366 194, 366 130, 344 124" stroke="#555" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="364" y="162" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i−−</text>

  <path d="M 200 204 L 200 216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 阶段② 容器 -->
  <rect x="56" y="218" width="300" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="236" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 正序扫 windows（j = 0 → n−1）</text>
  <polygon points="140,252 198,274 140,296 82,274" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="278" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">windows[j] 在 seen？</text>
  <path d="M 198 274 L 220 274" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="209" y="267" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="222" y="259" width="118" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="281" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">追加到 ans 尾部</text>
  <text x="152" y="303" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是 ⇒ 跳过</text>
  <path d="M 342 296 C 366 296, 366 232, 344 226" stroke="#555" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="364" y="264" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">j++</text>

  <path d="M 200 306 L 200 318" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="110" y="320" width="180" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="340" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>

  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">两次线性扫描 + 哈希集合 O(1) 判重，共 O(n + q)</text>
</svg>
