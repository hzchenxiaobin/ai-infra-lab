<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：问题 285 回答率 1.0 &gt; 问题 369 回答率 0.5</text>

  <!-- Question 285 walkthrough -->
  <text x="60" y="56" font-size="11" fill="#b85450" font-weight="bold">问题 285：2 行日志，answer=1、show=1 → rate = 1/1 = 1.0</text>

  <!-- Header -->
  <rect x="30" y="66" width="540" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="82" font-size="9.5" fill="#333" font-weight="bold">action</text>
  <text x="160" y="82" font-size="9.5" fill="#333" font-weight="bold">question_id</text>
  <text x="300" y="82" font-size="9.5" fill="#d6a040" font-weight="bold">IF(action='answer',1,0)</text>
  <text x="460" y="82" font-size="9.5" fill="#446688" font-weight="bold">IF(action='show',1,0)</text>

  <!-- Row 1: show 285 -->
  <rect x="30" y="92" width="540" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="108" font-size="10" fill="#446688" font-weight="bold">show</text>
  <text x="160" y="108" font-size="10" fill="#b85450" font-weight="bold">285</text>
  <text x="300" y="108" font-size="10" fill="#888">0</text>
  <text x="460" y="108" font-size="10" fill="#446688" font-weight="bold">1</text>

  <!-- Row 2: answer 285 -->
  <rect x="30" y="118" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="134" font-size="10" fill="#d6a040" font-weight="bold">answer</text>
  <text x="160" y="134" font-size="10" fill="#b85450" font-weight="bold">285</text>
  <text x="300" y="134" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="460" y="134" font-size="10" fill="#888">0</text>

  <!-- Sum row 285 -->
  <rect x="30" y="144" width="540" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="162" font-size="10" fill="#b85450" font-weight="bold">SUM</text>
  <text x="160" y="162" font-size="10" fill="#b85450" font-weight="bold">285</text>
  <text x="300" y="162" font-size="10" fill="#d6a040" font-weight="bold">answer_cnt = 1</text>
  <text x="460" y="162" font-size="10" fill="#446688" font-weight="bold">show_cnt = 1</text>
  <text x="540" y="162" font-size="10" fill="#b85450" font-weight="bold">→ 1.0</text>

  <!-- Divider -->
  <line x1="30" y1="184" x2="570" y2="184" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Question 369 walkthrough -->
  <text x="60" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">问题 369：4 行日志，answer=1、show=2 → rate = 1/2 = 0.5</text>

  <!-- Header -->
  <rect x="30" y="214" width="540" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="230" font-size="9.5" fill="#333" font-weight="bold">action</text>
  <text x="160" y="230" font-size="9.5" fill="#333" font-weight="bold">question_id</text>
  <text x="300" y="230" font-size="9.5" fill="#d6a040" font-weight="bold">IF(action='answer',1,0)</text>
  <text x="460" y="230" font-size="9.5" fill="#446688" font-weight="bold">IF(action='show',1,0)</text>

  <!-- Row 1: show 369 -->
  <rect x="30" y="240" width="540" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="255" font-size="10" fill="#446688" font-weight="bold">show</text>
  <text x="160" y="255" font-size="10" fill="#b85450" font-weight="bold">369</text>
  <text x="300" y="255" font-size="10" fill="#888">0</text>
  <text x="460" y="255" font-size="10" fill="#446688" font-weight="bold">1</text>

  <!-- Row 2: skip 369 -->
  <rect x="30" y="264" width="540" height="22" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="279" font-size="10" fill="#888">skip</text>
  <text x="160" y="279" font-size="10" fill="#b85450" font-weight="bold">369</text>
  <text x="300" y="279" font-size="10" fill="#888">0</text>
  <text x="460" y="279" font-size="10" fill="#888">0</text>

  <!-- Row 3: show 369 -->
  <rect x="30" y="288" width="540" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="303" font-size="10" fill="#446688" font-weight="bold">show</text>
  <text x="160" y="303" font-size="10" fill="#b85450" font-weight="bold">369</text>
  <text x="300" y="303" font-size="10" fill="#888">0</text>
  <text x="460" y="303" font-size="10" fill="#446688" font-weight="bold">1</text>

  <!-- Row 4: answer 369 -->
  <rect x="30" y="312" width="540" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="327" font-size="10" fill="#d6a040" font-weight="bold">answer</text>
  <text x="160" y="327" font-size="10" fill="#b85450" font-weight="bold">369</text>
  <text x="300" y="327" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="460" y="327" font-size="10" fill="#888">0</text>

  <!-- Sum row 369 -->
  <rect x="30" y="336" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="354" font-size="10" fill="#4a7a3a" font-weight="bold">SUM</text>
  <text x="160" y="354" font-size="10" fill="#b85450" font-weight="bold">369</text>
  <text x="300" y="354" font-size="10" fill="#d6a040" font-weight="bold">answer_cnt = 1</text>
  <text x="460" y="354" font-size="10" fill="#446688" font-weight="bold">show_cnt = 2</text>
  <text x="540" y="354" font-size="10" fill="#446688" font-weight="bold">→ 0.5</text>

  <!-- Comparison result -->
  <rect x="120" y="378" width="360" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="399" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1.0 &gt; 0.5 → ORDER BY rate DESC LIMIT 1 → 输出 285</text>
</svg>
