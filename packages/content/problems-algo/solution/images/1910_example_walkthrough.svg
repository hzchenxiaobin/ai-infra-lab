<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "daabcbaabcbc", part = "abc"</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三次「入栈→命中→弹出」，蓝色=已入栈 / 橙色=刚入栈触发匹配 / 红色虚线=被弹出</text>

  <!-- ===== Phase 1: push d a a b c -> match ===== -->
  <text x="40" y="78" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">第 1 次删除：读入 d a a b c</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="84" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="137" y="104" fill="#446688" font-weight="bold">d</text>
    <rect x="154" y="84" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="171" y="104" fill="#446688" font-weight="bold">a</text>
    <rect x="188" y="84" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="205" y="104" fill="#d6a040" font-weight="bold">a</text>
    <rect x="222" y="84" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="239" y="104" fill="#d6a040" font-weight="bold">b</text>
    <rect x="256" y="84" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="273" y="104" fill="#d6a040" font-weight="bold">c</text>
  </g>
  <text x="310" y="104" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">栈顶 "abc" ✓ → 弹出</text>
  <!-- pop arrow -->
  <path d="M 273 120 L 273 138" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- result after phase 1 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="144" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="137" y="164" fill="#446688" font-weight="bold">d</text>
    <rect x="154" y="144" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="171" y="164" fill="#446688" font-weight="bold">a</text>
  </g>
  <text x="220" y="164" font-size="10.5" fill="#888" filter="url(#rough2)">栈 = "da"</text>

  <!-- Divider -->
  <line x1="60" y1="188" x2="540" y2="188" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Phase 2: push b a a b c -> match ===== -->
  <text x="40" y="212" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">第 2 次删除：续读 b a a b c</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- existing da -->
    <rect x="90" y="218" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="107" y="238" fill="#446688" font-weight="bold">d</text>
    <rect x="124" y="218" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="141" y="238" fill="#446688" font-weight="bold">a</text>
    <!-- newly pushed -->
    <rect x="158" y="218" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="175" y="238" fill="#446688" font-weight="bold">b</text>
    <rect x="192" y="218" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="209" y="238" fill="#d6a040" font-weight="bold">a</text>
    <rect x="226" y="218" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="243" y="238" fill="#d6a040" font-weight="bold">a</text>
    <rect x="260" y="218" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="277" y="238" fill="#d6a040" font-weight="bold">b</text>
    <rect x="294" y="218" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="311" y="238" fill="#d6a040" font-weight="bold">c</text>
  </g>
  <text x="350" y="238" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">栈顶 "abc" ✓ → 弹出</text>
  <!-- pop arrow -->
  <path d="M 311 254 L 311 272" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- result after phase 2 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="90" y="278" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="107" y="298" fill="#446688" font-weight="bold">d</text>
    <rect x="124" y="278" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="141" y="298" fill="#446688" font-weight="bold">a</text>
    <rect x="158" y="278" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="175" y="298" fill="#446688" font-weight="bold">b</text>
    <rect x="192" y="278" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="209" y="298" fill="#446688" font-weight="bold">a</text>
  </g>
  <text x="258" y="298" font-size="10.5" fill="#888" filter="url(#rough2)">栈 = "daba"</text>

  <!-- Divider -->
  <line x1="60" y1="322" x2="540" y2="322" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Phase 3: push b c -> match ===== -->
  <text x="40" y="346" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">第 3 次删除：续读 b c</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- existing daba -->
    <rect x="70" y="352" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="87" y="372" fill="#446688" font-weight="bold">d</text>
    <rect x="104" y="352" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="121" y="372" fill="#446688" font-weight="bold">a</text>
    <rect x="138" y="352" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="155" y="372" fill="#446688" font-weight="bold">b</text>
    <!-- newly pushed a b c: a was existing, b c new -->
    <rect x="172" y="352" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="189" y="372" fill="#d6a040" font-weight="bold">a</text>
    <rect x="206" y="352" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="223" y="372" fill="#d6a040" font-weight="bold">b</text>
    <rect x="240" y="352" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="257" y="372" fill="#d6a040" font-weight="bold">c</text>
  </g>
  <text x="300" y="372" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">栈顶 "abc" ✓ → 弹出</text>
  <!-- pop arrow -->
  <path d="M 257 388 L 257 406" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- result after phase 3 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="412" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="137" y="432" fill="#4a7a3a" font-weight="bold">d</text>
    <rect x="154" y="412" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="171" y="432" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="188" y="412" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="205" y="432" fill="#4a7a3a" font-weight="bold">b</text>
  </g>
  <text x="248" y="432" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终栈 = "dab"</text>

  <!-- Divider -->
  <line x1="60" y1="458" x2="540" y2="458" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Summary table -->
  <text x="300" y="478" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">三次删除汇总</text>
  <g filter="url(#rough2)" font-size="10" fill="#333" text-anchor="middle">
    <rect x="60" y="488" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="120" y="504">第1次: daabc→da</text>
    <rect x="200" y="488" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="270" y="504">第2次: dabaabc→daba</text>
    <rect x="360" y="488" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="430" y="504">第3次: dababc→dab</text>
  </g>

  <!-- Note -->
  <rect x="50" y="520" width="500" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="532" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">关键：第3次删除用的 'a' 来自第2次删除后栈中残留 —— 栈保留了历史</text>
</svg>
