<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：离线排序 + 增量建 Trie
  </text>

  <!-- ===== Row 1: sorted nums ===== -->
  <text x="60" y="64" font-size="11" fill="#888" filter="url(#rough2)">nums 排序</text>
  <rect x="110" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="152" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="194" y="48" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="48" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="278" y="48" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- ptr arrows under nums -->
  <path d="M130,84 L130,92 L300,92 L300,84" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="215" y="106" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ptr 只前进，每个数只插入一次</text>

  <!-- ===== Row 2: queries sorted by m ===== -->
  <text x="60" y="138" font-size="11" fill="#888" filter="url(#rough2)">查询按 m 排序</text>

  <!-- q0: m=1, x=3 -->
  <rect x="100" y="122" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">q0: m=1, x=3</text>
  <text x="160" y="155" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">插入 {0,1} → 查 3</text>

  <!-- arrow q0 -> q1 -->
  <path d="M222,142 L246,142" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- q1: m=3, x=1 -->
  <rect x="250" y="122" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">q1: m=3, x=1</text>
  <text x="310" y="155" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">插入 {2,3} → 查 1</text>

  <!-- arrow q1 -> q2 -->
  <path d="M372,142 L396,142" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- q2: m=6, x=5 -->
  <rect x="400" y="122" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">q2: m=6, x=5</text>
  <text x="460" y="155" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">插入 {4} → 查 5</text>

  <!-- ===== Row 3: Trie grows ===== -->
  <text x="60" y="198" font-size="11" fill="#888" filter="url(#rough2)">二进制 Trie</text>

  <!-- Stage 1: Trie with {0,1} -->
  <text x="160" y="194" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">m=1</text>
  <ellipse cx="160" cy="212" rx="14" ry="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="216" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">root</text>
  <line x1="160" y1="222" x2="140" y2="238" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="160" y1="222" x2="180" y2="238" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="135" cy="244" rx="12" ry="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="248" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">0</text>
  <ellipse cx="185" cy="244" rx="12" ry="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="248" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">{0,1}</text>
  <text x="160" y="286" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ans=3</text>

  <!-- Stage 2: Trie with {0,1,2,3} -->
  <text x="310" y="194" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">m=3</text>
  <ellipse cx="310" cy="212" rx="14" ry="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="216" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">root</text>
  <line x1="310" y1="222" x2="290" y2="238" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="310" y1="222" x2="330" y2="238" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="285" cy="244" rx="12" ry="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="248" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">0</text>
  <ellipse cx="335" cy="244" rx="12" ry="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="248" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1*</text>
  <text x="310" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">{0,1,2,3}</text>
  <text x="310" y="286" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ans=3</text>

  <!-- Stage 3: Trie with {0,1,2,3,4} -->
  <text x="460" y="194" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">m=6</text>
  <ellipse cx="460" cy="212" rx="14" ry="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="216" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">root</text>
  <line x1="460" y1="222" x2="440" y2="238" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="460" y1="222" x2="480" y2="238" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="435" cy="244" rx="12" ry="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="248" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">0</text>
  <ellipse cx="485" cy="244" rx="12" ry="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="248" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1*</text>
  <text x="460" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">{0..4}</text>
  <text x="460" y="286" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ans=7</text>

  <!-- arrows between Trie stages -->
  <path d="M220,232 L276,232" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M370,232 L426,232" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Bottom: insight ===== -->
  <rect x="40" y="308" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    按 m 升序处理查询 → ptr 在 nums 上只前进 → 每个数至多插入 Trie 一次
  </text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    把「每次查询过滤 nums ≤ m」O(n·q) 降为「增量建树 + 查询」O((n+q)·31)
  </text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    绿色=已插入（旧）；橙色*=本轮新增；红色=查询结果
  </text>
</svg>
