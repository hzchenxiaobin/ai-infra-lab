<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三表关联：Customers ← Orders → Product</text>

  <!-- ===== Customers table ===== -->
  <rect x="30" y="50" width="160" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Customers</text>
  <line x1="40" y1="78" x2="180" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="94" font-size="11" fill="#333">customer_id  PK</text>
  <text x="42" y="110" font-size="11" fill="#333">name</text>
  <text x="42" y="126" font-size="11" fill="#333">country</text>
  <text x="42" y="148" font-size="10" fill="#888">1: Winston, USA</text>
  <text x="42" y="162" font-size="10" fill="#888">2: Jonathan, Peru</text>

  <!-- ===== Orders table (center) ===== -->
  <rect x="220" y="50" width="180" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="70" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Orders</text>
  <line x1="230" y1="78" x2="390" y2="78" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="232" y="94" font-size="11" fill="#333">order_id  PK</text>
  <text x="232" y="110" font-size="11" fill="#333">customer_id  FK</text>
  <text x="232" y="126" font-size="11" fill="#333">product_id  FK</text>
  <text x="232" y="142" font-size="11" fill="#333">order_date</text>
  <text x="232" y="158" font-size="11" fill="#333">quantity</text>
  <text x="232" y="178" font-size="10" fill="#888">order#1: c=1, p=10</text>

  <!-- ===== Product table ===== -->
  <rect x="430" y="50" width="120" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="70" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Product</text>
  <line x1="440" y1="78" x2="540" y2="78" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="442" y="94" font-size="11" fill="#333">product_id  PK</text>
  <text x="442" y="110" font-size="11" fill="#333">description</text>
  <text x="442" y="126" font-size="11" fill="#333">price</text>
  <text x="442" y="148" font-size="10" fill="#888">10: LC Phone $300</text>
  <text x="442" y="162" font-size="10" fill="#888">20: T-Shirt $10</text>

  <!-- Join arrows -->
  <path d="M 190 105 L 220 105" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="98" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">JOIN</text>
  <text x="205" y="118" text-anchor="middle" font-size="9" fill="#b85450">c_id=c_id</text>

  <path d="M 400 105 L 430 105" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="98" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">JOIN</text>
  <text x="415" y="118" text-anchor="middle" font-size="9" fill="#b85450">p_id=p_id</text>

  <!-- ===== Two conditions ===== -->
  <rect x="30" y="210" width="240" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">条件①：6 月下单</text>
  <text x="150" y="250" text-anchor="middle" font-size="10" fill="#888">order_date ∈ 2020-06-01 ~ 06-30</text>

  <rect x="290" y="210" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="410" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">条件②：总消费 ≥ $100</text>
  <text x="410" y="250" text-anchor="middle" font-size="10" fill="#888">SUM(quantity × price) ≥ 100</text>

  <!-- AND connector -->
  <text x="280" y="240" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">AND</text>

  <!-- ===== Output ===== -->
  <rect x="150" y="285" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输出：customer_id, name</text>
  <text x="280" y="321" text-anchor="middle" font-size="10" fill="#888">同时满足条件① AND 条件②的客户</text>

  <!-- arrows from conditions to output -->
  <path d="M 150 260 L 200 285" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 260 L 360 285" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Core idea box -->
  <rect x="30" y="345" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="11" fill="#444">关键：Orders 是桥梁表，JOIN Product 取 price 算金额，GROUP BY 客户聚合后 HAVING 双条件过滤</text>
</svg>
