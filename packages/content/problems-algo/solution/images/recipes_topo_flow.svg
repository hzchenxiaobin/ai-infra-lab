<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M0,8 L4,1 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="500" height="470" fill="#fafafa"/>

  <text x="250" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BFS 拓扑排序流程</text>

  <!-- Step 1: Init -->
  <rect x="90" y="42" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="250" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="250" y="78" text-anchor="middle" font-size="10.5" fill="#555">available = set(supplies)</text>

  <path d="M 250 96 L 250 112" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: Build dependency -->
  <rect x="70" y="116" width="360" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="250" y="135" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">对每道菜 recipes[i]</text>
  <text x="250" y="151" text-anchor="middle" font-size="10" fill="#555">missing[i] = 不在 available 的原料数</text>
  <text x="250" y="167" text-anchor="middle" font-size="10" fill="#555">reverseAdj[原料].append(i)</text>

  <path d="M 250 184 L 250 200" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: Init queue -->
  <rect x="120" y="204" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="250" y="222" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">queue = { i : missing[i] == 0 }</text>
  <text x="250" y="237" text-anchor="middle" font-size="9.5" fill="#777">原料齐备的菜直接入队</text>

  <path d="M 250 248 L 250 264" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: queue empty? -->
  <polygon points="250,268 360,308 250,348 140,308" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="304" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">queue 空?</text>
  <text x="250" y="322" text-anchor="middle" font-size="9.5" fill="#777">无更多可做的菜?</text>

  <!-- Yes branch: return -->
  <path d="M 360 308 L 430 308 L 430 340" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="398" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <rect x="368" y="344" width="124" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <text x="430" y="376" text-anchor="middle" font-size="9.5" fill="#777">O(n+m), O(n+m)</text>

  <!-- No branch -->
  <path d="M 140 308 L 60 308 L 60 355" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="90" y="300" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Step 5: pop recipe -->
  <rect x="12" y="359" width="96" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="378" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">弹出 r</text>
  <text x="60" y="392" text-anchor="middle" font-size="9.5" fill="#777">ans.append(r)</text>
  <text x="60" y="405" text-anchor="middle" font-size="9.5" fill="#777">available.add(r)</text>

  <path d="M 108 387 L 140 387" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 6: decrement -->
  <rect x="144" y="359" width="216" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="252" y="378" text-anchor="middle" font-size="10.5" fill="#8a6020" font-weight="bold">对 reverseAdj[r] 中每道菜 j</text>
  <text x="252" y="392" text-anchor="middle" font-size="9.5" fill="#555">missing[j] −= 1</text>
  <text x="252" y="406" text-anchor="middle" font-size="9.5" fill="#555">若 == 0 → queue.push(j)</text>

  <!-- Loop back to diamond -->
  <path d="M 252 415 L 252 435 L 250 435 L 250 268" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="262" y="430" font-size="9.5" fill="#888" font-style="italic">回判队列</text>

  <!-- Annotation -->
  <rect x="120" y="430" width="120" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="448" text-anchor="middle" font-size="9.5" fill="#888">每条依赖边只访问一次</text>
</svg>
