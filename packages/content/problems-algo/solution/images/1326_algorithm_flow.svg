<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 512" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="512" fill="#fafafa"/>

  <text x="300" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：预处理 reach[] + 跳跃游戏贪心一趟</text>

  <!-- ① 预处理 -->
  <rect x="90" y="38" width="220" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="58" text-anchor="middle" font-size="11" fill="#444">① 预处理 reach[left] = max(·, right)</text>
  <path d="M 200 68 L 200 82" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ② 初始化 -->
  <rect x="90" y="84" width="220" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="104" text-anchor="middle" font-size="11" fill="#444">② steps=0, end=0, maxPos=0</text>
  <path d="M 200 114 L 200 128" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ③ diamond: i < n ? -->
  <polygon points="200,130 300,158 200,186 100,158" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="162" text-anchor="middle" font-size="11" fill="#444">③ i &lt; n ?</text>
  <!-- ③ No → return -1 -->
  <path d="M 300 158 L 398 158" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="349" y="150" text-anchor="middle" font-size="9" fill="#b85450">No</text>
  <rect x="400" y="144" width="150" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return -1</text>
  <!-- ③ Yes → down -->
  <path d="M 200 186 L 200 200" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="214" y="196" font-size="9" fill="#4a7a3a">Yes</text>

  <!-- ④ maxPos update -->
  <rect x="90" y="202" width="220" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="222" text-anchor="middle" font-size="11" fill="#444">④ maxPos = max(maxPos, reach[i])</text>
  <path d="M 200 232 L 200 246" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ⑤ diamond: i == end ? -->
  <polygon points="200,248 300,276 200,304 100,276" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="280" text-anchor="middle" font-size="11" fill="#444">⑤ i == end ?</text>
  <!-- ⑤ No → loop back to ③ -->
  <path d="M 300 276 L 352 276 L 352 158 L 300 158" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="220" font-size="9" fill="#888">No, i++</text>
  <text x="360" y="232" font-size="9" fill="#888">继续</text>
  <!-- ⑤ Yes → down -->
  <path d="M 200 304 L 200 318" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="214" y="314" font-size="9" fill="#4a7a3a">Yes</text>

  <!-- ⑥ diamond: maxPos <= end ? (stuck check) -->
  <polygon points="200,320 300,348 200,376 100,348" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="352" text-anchor="middle" font-size="11" fill="#444">⑥ maxPos ≤ end ?</text>
  <!-- ⑥ Yes → return -1 -->
  <path d="M 300 348 L 398 348" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="349" y="340" text-anchor="middle" font-size="9" fill="#b85450">Yes 卡住</text>
  <rect x="400" y="334" width="150" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="353" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return -1</text>
  <!-- ⑥ No → down -->
  <path d="M 200 376 L 200 390" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="214" y="386" font-size="9" fill="#4a7a3a">No</text>

  <!-- ⑦ steps++, end = maxPos -->
  <rect x="90" y="392" width="220" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="412" text-anchor="middle" font-size="11" fill="#444">⑦ steps++; end = maxPos</text>
  <path d="M 200 422 L 200 436" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ⑧ diamond: end >= n ? -->
  <polygon points="200,438 300,466 200,494 100,466" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="470" text-anchor="middle" font-size="11" fill="#444">⑧ end ≥ n ?</text>
  <!-- ⑧ Yes → return steps -->
  <path d="M 300 466 L 398 466" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="349" y="458" text-anchor="middle" font-size="9" fill="#4a7a3a">Yes</text>
  <rect x="400" y="452" width="150" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="471" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return steps</text>
  <!-- ⑧ No → loop back to ③ -->
  <path d="M 200 494 L 200 504 L 380 504 L 380 158 L 300 158" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="332" font-size="9" fill="#888">No, i++</text>
  <text x="388" y="344" font-size="9" fill="#888">继续</text>
</svg>
