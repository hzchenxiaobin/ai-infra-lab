<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：筛法计数 → 阶乘取模 → 相乘</text>

  <!-- Step 1: sieve count primes -->
  <rect x="120" y="56" width="320" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 埃氏筛统计 [1, n] 内质数个数 p</text>
  <text x="280" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a">isPrime 数组 + 划倍数，O(n log log n)</text>

  <!-- arrow -->
  <path d="M 280 110 L 280 134" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: factorial p! -->
  <rect x="60" y="140" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 计算 p! mod MOD</text>
  <text x="160" y="180" text-anchor="middle" font-size="11" fill="#446688">fact = 1..p 逐个累乘取模</text>
  <text x="160" y="194" text-anchor="middle" font-size="10" fill="#888">MOD = 10⁹ + 7</text>

  <!-- Step 3: factorial (n-p)! -->
  <rect x="300" y="140" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 计算 (n−p)! mod MOD</text>
  <text x="400" y="180" text-anchor="middle" font-size="11" fill="#446688">fact2 = 1..(n−p) 逐个累乘取模</text>
  <text x="400" y="194" text-anchor="middle" font-size="10" fill="#888">两组独立，可并行</text>

  <!-- arrows converge -->
  <path d="M 160 200 Q 160 224 240 240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 200 Q 400 224 320 240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: multiply mod -->
  <rect x="140" y="232" width="280" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 答案 = p! × (n−p)! mod MOD</text>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#d6a040">每次乘法后立即 % MOD 防溢出</text>

  <!-- arrow -->
  <path d="M 280 286 L 280 310" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result diamond-ish -->
  <rect x="160" y="316" width="240" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">返回答案</text>

  <!-- side note -->
  <rect x="380" y="316" width="170" height="60" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="390" y="336" font-size="10" fill="#888">n ≤ 100 → p ≤ 25</text>
  <text x="390" y="352" font-size="10" fill="#888">阶乘最多 100 项</text>
  <text x="390" y="368" font-size="10" fill="#888">无需预处理幂/逆元</text>
</svg>
