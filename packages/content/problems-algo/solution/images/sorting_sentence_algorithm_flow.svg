<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：拆词 → 读尾数入桶 → 拼接</text>

  <!-- Step 1: split -->
  <rect x="40" y="52" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 按空格切分</text>
  <text x="130" y="92" text-anchor="middle" font-size="10" fill="#666">words = s.split(' ')</text>

  <path d="M 220 77 L 250 77" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop init -->
  <rect x="250" y="52" width="160" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="74" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 初始化桶</text>
  <text x="330" y="92" text-anchor="middle" font-size="10" fill="#666">bucket[0..8] = ""</text>

  <path d="M 410 77 L 440 77" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop -->
  <rect x="440" y="44" width="130" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ 遍历每个 w</text>
  <text x="505" y="82" text-anchor="middle" font-size="10" fill="#666">d = w 末位</text>
  <text x="505" y="96" text-anchor="middle" font-size="10" fill="#666">bucket[d−1] = w[:-1]</text>

  <!-- decision diamond: more words? -->
  <path d="M 505 120 L 505 150 L 460 175 L 505 200 L 550 175 L 505 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="172" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">还有词?</text>
  <text x="505" y="188" text-anchor="middle" font-size="10" fill="#666">是 → ③</text>

  <!-- loop back arrow to step 3 -->
  <path d="M 460 175 Q 380 175 380 110 L 440 110" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- no branch down -->
  <path d="M 505 200 L 505 230" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="514" y="220" font-size="10" fill="#666">否</text>

  <!-- Step 4: join -->
  <rect x="380" y="230" width="250" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="505" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">④ 按桶序拼接</text>
  <text x="505" y="270" text-anchor="middle" font-size="10" fill="#666">return ' '.join(bucket)</text>

  <!-- Example bucket row -->
  <text x="40" y="250" font-size="11" fill="#888">示例桶状态：</text>
  <rect x="40" y="258" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">This</text>
  <rect x="118" y="258" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">is</text>
  <rect x="176" y="258" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="224" y="258" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sentence</text>
  <text x="160" y="312" text-anchor="middle" font-size="10" fill="#888">槽 1        槽 2        槽 3        槽 4</text>

  <!-- Output -->
  <path d="M 505 280 L 505 318" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="318" width="320" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="342" font-size="11" fill="#555">返回：</text>
  <text x="265" y="343" font-size="13" fill="#4a7a3a" font-weight="bold">"This is a sentence"</text>

  <!-- Key insight -->
  <rect x="40" y="372" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="392" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">要点：数字 d 是 1-indexed 位置 ⇒ 直接做下标，无需排序比较</text>
  <text x="300" y="406" text-anchor="middle" font-size="10" fill="#888">一次遍历入桶 + 一次遍历拼接，恒定 O(n) / O(1)</text>
</svg>
