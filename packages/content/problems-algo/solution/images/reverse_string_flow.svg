<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="360" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="180" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">反转字符串 · 算法流程</text>

  <!-- Start oval -->
  <ellipse cx="180" cy="62" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">开始</text>

  <!-- arrow down -->
  <path d="M 180 84 L 180 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init rect -->
  <rect x="104" y="108" width="152" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="128" text-anchor="middle" font-size="12" fill="#333">left = 0</text>
  <text x="180" y="144" text-anchor="middle" font-size="12" fill="#333">right = n − 1</text>

  <!-- arrow down -->
  <path d="M 180 154 L 180 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: left < right ? -->
  <polygon points="180,180 260,228 180,276 100,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left &lt; right ?</text>
  <text x="180" y="240" text-anchor="middle" font-size="11" fill="#666">（指针未相遇）</text>

  <!-- Yes branch: down to swap -->
  <path d="M 180 276 L 180 298" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="292" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Swap rect -->
  <rect x="96" y="302" width="168" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">swap(s[left], s[right])</text>

  <!-- arrow down -->
  <path d="M 180 340 L 180 362" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Increment rect -->
  <rect x="104" y="366" width="152" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="390" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left++; right−−;</text>

  <!-- Loop back arrow: from bottom of increment, right side up to decision right side -->
  <path d="M 256 385 L 318 385 L 318 228 L 262 228" stroke="#666" stroke-width="1.6" fill="none"
        stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="310" text-anchor="middle" font-size="11" fill="#888" transform="rotate(90 328 310)">回循环</text>

  <!-- No branch: from decision right to end (go right then down) -->
  <path d="M 260 228 L 318 228" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" style="display:none"/>

  <!-- No branch: from decision left side out to left, then down to end -->
  <path d="M 100 228 L 56 228 L 56 446 L 132 446" stroke="#666" stroke-width="1.6" fill="none"
        stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="220" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="64" y="338" font-size="11" fill="#888" transform="rotate(-90 64 338)">指针相遇/交叉</text>

  <!-- End oval -->
  <ellipse cx="180" cy="446" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="451" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结束（返回 s）</text>
</svg>
