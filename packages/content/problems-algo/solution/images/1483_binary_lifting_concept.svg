<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：预计算 2^j 级祖先，查询按二进制拆 k</text>

  <g filter="url(#rough2)">
    <line x1="170" y1="55" x2="170" y2="370" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="170" cy="55"  r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="170" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d0</text>
    <circle cx="170" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="170" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d1</text>
    <circle cx="170" cy="145" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="170" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d2</text>
    <circle cx="170" cy="190" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="170" y="195" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d3</text>
    <circle cx="170" cy="235" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="170" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d4</text>
    <circle cx="170" cy="280" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="170" y="285" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d5</text>
    <circle cx="170" cy="325" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="170" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d6</text>
    <circle cx="170" cy="370" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="170" y="375" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">d7</text>
    <text x="142" y="60"  text-anchor="end" font-size="10" fill="#888">根</text>
    <text x="142" y="375" text-anchor="end" font-size="10" fill="#888">起点</text>
  </g>

  <path d="M 186 370 Q 285 280 186 190" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="268" y="285" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">2² = 4</text>

  <path d="M 186 190 Q 258 145 186 100" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="248" y="150" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">2¹ = 2</text>

  <path d="M 186 100 Q 238 77 186 55" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="235" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2⁰ = 1</text>

  <rect x="20" y="150" width="112" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">暴力</text>
  <text x="76" y="189" text-anchor="middle" font-size="10" fill="#888">沿 parent 走 k 步</text>
  <text x="76" y="202" text-anchor="middle" font-size="10" fill="#888">O(k) / 次查询</text>

  <rect x="330" y="150" width="196" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="428" y="172" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">倍增</text>
  <text x="428" y="189" text-anchor="middle" font-size="10" fill="#555">k = 7 = 4 + 2 + 1</text>
  <text x="428" y="202" text-anchor="middle" font-size="10" fill="#555">3 次跳跃 → O(log k)</text>

  <rect x="40" y="392" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="410" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">任意 k 都能拆成若干 2^j 之和 → 预存每个节点的 2^j 级祖先即可</text>
  <text x="270" y="424" text-anchor="middle" font-size="10" fill="#888">查询 = 按二进制位依次跳跃，最多 log k 次</text>
</svg>
