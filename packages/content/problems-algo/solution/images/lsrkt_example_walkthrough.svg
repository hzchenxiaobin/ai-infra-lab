<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "letsleetcode", k = 2</text>

  <!-- s string layout -->
  <text x="20" y="56" font-size="11" fill="#888">s =</text>
  <rect x="50" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>
  <text x="70" y="82" text-anchor="middle" font-size="9" fill="#aaa">0</text>

  <rect x="92" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="112" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="112" y="82" text-anchor="middle" font-size="9" fill="#aaa">1</text>

  <rect x="134" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="154" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>
  <text x="154" y="82" text-anchor="middle" font-size="9" fill="#aaa">2</text>

  <rect x="176" y="42" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="196" y="61" text-anchor="middle" font-size="12" fill="#aaa">s</text>
  <text x="196" y="82" text-anchor="middle" font-size="9" fill="#ccc">3</text>

  <rect x="218" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="238" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>
  <text x="238" y="82" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <rect x="260" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="280" y="82" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <rect x="302" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="322" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="322" y="82" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <rect x="344" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="364" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>
  <text x="364" y="82" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <rect x="386" y="42" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="406" y="61" text-anchor="middle" font-size="12" fill="#aaa">c</text>
  <text x="406" y="82" text-anchor="middle" font-size="9" fill="#ccc">8</text>

  <rect x="428" y="42" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="448" y="61" text-anchor="middle" font-size="12" fill="#aaa">o</text>
  <text x="448" y="82" text-anchor="middle" font-size="9" fill="#ccc">9</text>

  <rect x="470" y="42" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="61" text-anchor="middle" font-size="12" fill="#aaa">d</text>
  <text x="490" y="82" text-anchor="middle" font-size="9" fill="#ccc">10</text>

  <rect x="512" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="532" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="532" y="82" text-anchor="middle" font-size="9" fill="#aaa">11</text>

  <!-- freq summary -->
  <rect x="380" y="92" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="109" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">freq: e=4, l=2, t=2 → available={e,l,t}</text>

  <!-- Layer 0 -->
  <text x="20" y="140" font-size="11" fill="#888" font-weight="bold">L=0</text>
  <rect x="50" y="128" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="145" text-anchor="middle" font-size="11" fill="#333">""</text>

  <!-- Layer 1 -->
  <text x="20" y="178" font-size="11" fill="#888" font-weight="bold">L=1</text>
  <rect x="50" y="166" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <rect x="96" y="166" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="116" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
  <rect x="142" y="166" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="162" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t</text>
  <text x="200" y="183" font-size="10" fill="#4a7a3a">e×2=ee ✓  l×2=ll ✓  t×2=tt ✓</text>

  <!-- Layer 2 -->
  <text x="20" y="216" font-size="11" fill="#888" font-weight="bold">L=2</text>
  <rect x="50" y="204" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="72" y="220" text-anchor="middle" font-size="10" fill="#333">ee</text>
  <rect x="100" y="204" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="122" y="220" text-anchor="middle" font-size="10" fill="#333">et</text>
  <rect x="150" y="204" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="172" y="220" text-anchor="middle" font-size="10" fill="#333">le</text>
  <rect x="200" y="204" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="222" y="220" text-anchor="middle" font-size="10" fill="#333">lt</text>
  <rect x="250" y="204" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="272" y="220" text-anchor="middle" font-size="10" fill="#333">te</text>
  <text x="310" y="220" font-size="10" fill="#888">el ✗(缺l)  ll ✗(仅2个l)  tl ✗  tt ✗(仅2个t)</text>

  <!-- Layer 3 -->
  <text x="20" y="254" font-size="11" fill="#888" font-weight="bold">L=3</text>
  <rect x="50" y="242" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="78" y="259" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ete</text>
  <rect x="116" y="242" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="259" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lee</text>
  <rect x="182" y="242" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="259" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">let</text>
  <text x="260" y="259" font-size="10" fill="#d6a040" font-weight="bold">← 最长合法层（3 个候选）</text>

  <!-- Layer 4 -->
  <text x="20" y="292" font-size="11" fill="#888" font-weight="bold">L=4</text>
  <rect x="50" y="280" width="100" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="296" text-anchor="middle" font-size="10" fill="#888">无法扩展 → break</text>
  <text x="170" y="296" font-size="10" fill="#888">4 字符需匹配 8 次，e/l/t 总数不足</text>

  <!-- Detailed match for "let" * 2 -->
  <rect x="30" y="316" width="560" height="180" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">验证 "let" × 2 = "letlet" 是否为 s 的子序列</text>

  <!-- First "let" -->
  <text x="40" y="362" font-size="10" fill="#888" font-weight="bold">第 1 次 "let"：</text>
  <rect x="48" y="370" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="63" y="387" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">l</text>
  <path d="M 78 382 L 92 382" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="387" font-size="10" fill="#b85450">→ s[0]='l' ✓</text>

  <rect x="218" y="370" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="233" y="387" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">e</text>
  <path d="M 248 382 L 262 382" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="387" font-size="10" fill="#b85450">→ s[1]='e' ✓</text>

  <rect x="388" y="370" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="403" y="387" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">t</text>
  <path d="M 418 382 L 432 382" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="387" font-size="10" fill="#b85450">→ s[2]='t' ✓</text>

  <!-- Second "let" -->
  <text x="40" y="418" font-size="10" fill="#888" font-weight="bold">第 2 次 "let"：</text>
  <rect x="48" y="426" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="63" y="443" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">l</text>
  <path d="M 78 438 L 92 438" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="443" font-size="10" fill="#b85450">→ s[4]='l' ✓</text>

  <rect x="218" y="426" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="233" y="443" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">e</text>
  <path d="M 248 438 L 262 438" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="443" font-size="10" fill="#b85450">→ s[5]='e' ✓</text>

  <rect x="388" y="426" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="403" y="443" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">t</text>
  <path d="M 418 438 L 432 438" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="443" font-size="10" fill="#b85450">→ s[7]='t' ✓</text>

  <!-- Result -->
  <rect x="80" y="468" width="460" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="484" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全部匹配 ✓ → "let" 合法；max({"ete","lee","let"}) = "let"</text>
</svg>
