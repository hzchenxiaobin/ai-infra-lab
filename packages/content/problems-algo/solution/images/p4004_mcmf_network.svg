<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：正点=供给，负点=需求 ⇒ 环上最小费用流</text>
  <text x="280" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">balance = [4, −1, −2] · 总缺口 D = 3 ≤ 总盈余 4 ✓（总额 ≥ 0 才有解）</text>

  <!-- 环底衬 -->
  <circle cx="170" cy="245" r="82" fill="none" stroke="#446688" stroke-width="1.2" opacity="0.28" filter="url(#rough2)"/>

  <!-- 环边（双向弧） -->
  <line x1="179.8" y1="178.5" x2="228.2" y2="269.5" stroke="#446688" stroke-width="1.6" marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="224" y="216" font-size="9.5" fill="#446688" filter="url(#rough2)">费用 1</text>
  <line x1="217" y1="288" x2="123" y2="288" stroke="#446688" stroke-width="1.6" marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="156" y="308" font-size="9.5" fill="#446688" filter="url(#rough2)">费用 1</text>
  <line x1="111.8" y1="269.5" x2="160.2" y2="178.5" stroke="#446688" stroke-width="1.6" marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="86" y="216" font-size="9.5" fill="#446688" filter="url(#rough2)">费用 1</text>

  <!-- 环边流量标注 -->
  <text x="234" y="246" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">流 1</text>
  <text x="170" y="276" font-size="9.5" fill="#999" filter="url(#rough2)">流 0</text>
  <text x="72" y="246" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">流 2</text>

  <!-- 节点 -->
  <circle cx="170" cy="160" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170" y="158" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">+4</text>
  <text x="170" y="171" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">i=0</text>

  <circle cx="238" cy="288" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="238" y="286" text-anchor="middle" font-size="13" fill="#8f3b36" filter="url(#rough2)">−1</text>
  <text x="238" y="299" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">i=1</text>

  <circle cx="102" cy="288" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="102" y="286" text-anchor="middle" font-size="13" fill="#8f3b36" filter="url(#rough2)">−2</text>
  <text x="102" y="299" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">i=2</text>

  <!-- 源 S 与弧 -->
  <circle cx="170" cy="72" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="77" text-anchor="middle" font-size="13" fill="#2c4a68" filter="url(#rough2)">S</text>
  <text x="192" y="70" font-size="10.5" fill="#666" filter="url(#rough2)">源</text>
  <path d="M 170 88 L 170 136" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="178" y="112" font-size="10" fill="#4a7a3a" filter="url(#rough2)">容量 4 · 费用 0</text>
  <text x="178" y="126" font-size="9.5" fill="#d6a040" filter="url(#rough2)">（实际推 3）</text>

  <!-- 汇 T 与弧 -->
  <circle cx="170" cy="386" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="391" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">T</text>
  <text x="192" y="390" font-size="10.5" fill="#666" filter="url(#rough2)">汇</text>
  <path d="M 236 311 L 181 372" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="231" y="352" font-size="10" fill="#b85450" filter="url(#rough2)">容量 1 · 费用 0</text>
  <path d="M 104 311 L 159 372" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="64" y="352" font-size="10" fill="#b85450" filter="url(#rough2)">容量 2 · 费用 0</text>

  <!-- 右侧规则 -->
  <rect x="330" y="74" width="215" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="93" text-anchor="middle" font-size="10.5" fill="#2f5a24" filter="url(#rough2)">① 源 S → 正点：容量 balance[i]，费用 0</text>

  <rect x="330" y="112" width="215" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="131" text-anchor="middle" font-size="10.5" fill="#8f3b36" filter="url(#rough2)">② 负点 → 汇 T：容量 |balance[i]|，费用 0</text>

  <rect x="330" y="150" width="215" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="169" text-anchor="middle" font-size="10.5" fill="#2c4a68" filter="url(#rough2)">③ 环边双向弧：容量 ∞，单位费用 1</text>

  <rect x="330" y="196" width="215" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="214" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">一次移动 = 1 个单位跨 1 条边</text>
  <text x="437" y="231" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⇒ 网络流的费用 = 移动次数</text>

  <rect x="330" y="252" width="215" height="44" rx="8" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="437" y="270" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">流量只需灌满总缺口 D（最大流 = D）</text>
  <text x="437" y="287" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">多余盈余留在原地，不必流走</text>

  <rect x="330" y="308" width="215" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="437" y="326" text-anchor="middle" font-size="10.5" fill="#8f3b36" filter="url(#rough2)">本例：0 → 1 流 1、0 → 2 流 2</text>
  <text x="437" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3b36" filter="url(#rough2)">费用 = 1×1 + 2×1 = 3 ✓</text>

  <text x="437" y="372" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">最小费用最大流的费用</text>
  <text x="437" y="388" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">= 最少移动次数</text>

  <!-- 底部结论 -->
  <rect x="36" y="408" width="488" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">多缺口共享货源 ⇒ 谁绕远是全局决策 ⇒ 环上最小费用流一锤定音</text>
</svg>
