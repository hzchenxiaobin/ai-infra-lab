<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：四类操作都是对「栈顶」的局部操作</text>

  <!-- Token stream: 5  2  C  D  + -->
  <text x="30" y="62" font-size="12" fill="#888">操作流:</text>
  <rect x="96" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="148" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="200" y="46" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">C</text>
  <rect x="248" y="46" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="268" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">D</text>
  <rect x="296" y="46" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">+</text>

  <!-- legend -->
  <rect x="380" y="48" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="396" y="58" font-size="10" fill="#555">整数 x</text>
  <rect x="436" y="48" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="452" y="58" font-size="10" fill="#555">特殊指令</text>

  <!-- Phase 1: 整数 → push -->
  <text x="30" y="116" font-size="11" fill="#888" font-weight="bold">遇整数 x：</text>
  <text x="120" y="116" font-size="11" fill="#446688">push(x) —— 原样入栈</text>
  <rect x="460" y="100" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x</text>
  <text x="510" y="118" font-size="10" fill="#888">← 栈顶</text>

  <path d="M 480 128 L 480 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 2: "C" → pop -->
  <text x="30" y="172" font-size="11" fill="#888" font-weight="bold">遇 "C"：</text>
  <text x="90" y="172" font-size="11" fill="#b85450" font-weight="bold">pop() —— 删除栈顶（撤销上一轮）</text>
  <rect x="460" y="156" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x</text>
  <path d="M 500 162 L 540 150" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="544" y="152" font-size="10" fill="#b85450">移除</text>

  <path d="M 480 184 L 480 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 3: "D" → push(2 * top) -->
  <text x="30" y="228" font-size="11" fill="#888" font-weight="bold">遇 "D"：</text>
  <text x="90" y="228" font-size="11" fill="#446688" font-weight="bold">push(2 × top) —— 读栈顶、翻倍、入栈</text>
  <rect x="460" y="212" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2x</text>
  <rect x="460" y="244" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="259" text-anchor="middle" font-size="10" fill="#333">x</text>
  <text x="510" y="230" font-size="10" fill="#888">← 新栈顶</text>

  <path d="M 480 268 L 480 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 4: "+" → push(top + second) -->
  <text x="30" y="300" font-size="11" fill="#888" font-weight="bold">遇 "+"：</text>
  <text x="90" y="300" font-size="11" fill="#446688" font-weight="bold">push(top + 倒数第二) —— 读栈顶两项之和、入栈</text>
  <rect x="460" y="284" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="300" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">a+b</text>
  <rect x="460" y="310" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="480" y="324" text-anchor="middle" font-size="9" fill="#333">b</text>
  <rect x="460" y="330" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="480" y="344" text-anchor="middle" font-size="9" fill="#333">a</text>

  <!-- bottom callout -->
  <rect x="30" y="354" width="540" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：所有操作都只碰「栈顶 1~2 个元素」，单栈一遍扫描 O(n)</text>
</svg>
