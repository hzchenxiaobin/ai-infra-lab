<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 438"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="438" fill="#fafafa"/>

  <text x="18" y="24" font-size="12.5" fill="#333" filter="url(#rough2)">核心观察：子串数值可达 10⁵ 位 → 只存 mod d 的余数，O(1) 增量转移</text>

  <!-- string "12936" -->
  <rect x="70" y="40" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="61" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="106" y="40" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="61" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="142" y="40" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="159" y="61" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <rect x="178" y="40" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="195" y="61" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">3</text>
  <rect x="214" y="40" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="231" y="61" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="159" y="90" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">i = 3，当前字符 x = '3'（子串的末位 = 除数）</text>

  <!-- right column -->
  <text x="290" y="52" font-size="12" fill="#333" filter="url(#rough2)">以 '3' 结尾的子串：</text>
  <text x="290" y="70" font-size="12" fill="#446688" filter="url(#rough2)">「3」「93」「293」「1293」</text>
  <text x="290" y="90" font-size="11" fill="#666" filter="url(#rough2)">数值越拼越大、存不下，</text>
  <text x="290" y="106" font-size="11" fill="#b85450" filter="url(#rough2)">但整除判定只需要余数！</text>

  <!-- transition boxes -->
  <rect x="48" y="122" width="140" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">以 i−1 结尾的子串</text>
  <text x="118" y="157" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">余数 r = v mod d</text>
  <path d="M190,144 L240,144" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="136" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">×10 + x</text>
  <rect x="244" y="122" width="152" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">以 i 结尾的新子串</text>
  <text x="320" y="157" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">余数 (10r + x) mod d</text>

  <text x="48" y="188" font-size="11" fill="#333" filter="url(#rough2)">例（d=3）：'29' mod 3 = 2 → 右端添 '3'：(2×10+3) mod 3 = 2 ✓（正是 293 mod 3）</text>

  <!-- buckets -->
  <text x="18" y="224" font-size="12" fill="#333" filter="url(#rough2)">f[d][r]：以当前位置结尾、mod d 余数为 r 的子串个数 —— 模数只有 9 种</text>

