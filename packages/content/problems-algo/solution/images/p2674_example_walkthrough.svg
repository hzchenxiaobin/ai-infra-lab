<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">拆分循环链表 · 示例演算</text>

  <!-- ===== 示例 1 ===== -->
  <text x="20" y="52" font-size="12" fill="#888" filter="url(#rough2)">示例1：[1,5,7]  n=3  →  firstSize=2</text>

  <!-- 输入 -->
  <rect x="40" y="62" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="96" y="62" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="116" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="152" y="62" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <path d="M80,76 L94,76" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M136,76 L150,76" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M172,62 C172,38 60,38 60,60" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="60" y="104" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">head</text>
  <text x="116" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">first</text>
  <text x="172" y="104" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">second=last</text>

  <!-- 箭头 -->
  <path d="M212,76 L252,76" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- 输出1a: [1,5] 环 -->
  <rect x="280" y="62" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="336" y="62" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="356" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <path d="M320,76 L334,76" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M356,62 C356,38 300,38 300,60" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <!-- 输出1b: [7] 环 -->
  <rect x="450" y="62" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <path d="M460,64 C444,40 498,40 482,64" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="395" y="54" font-size="10" fill="#888" filter="url(#rough2)">第一半 [1,5]</text>
  <text x="540" y="54" font-size="10" fill="#888" filter="url(#rough2)">第二半 [7]</text>

  <!-- 分隔 -->
  <line x1="40" y1="135" x2="540" y2="135" stroke="#dddddd" stroke-width="1" stroke-dasharray="2,4" filter="url(#rough2)"/>

  <!-- ===== 示例 2 ===== -->
  <text x="20" y="162" font-size="12" fill="#888" filter="url(#rough2)">示例2：[2,6,1,5]  n=4  →  firstSize=2</text>

  <!-- 输入 -->
  <rect x="40" y="172" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="96" y="172" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="116" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="152" y="172" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="208" y="172" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="228" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <path d="M80,186 L94,186" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M136,186 L150,186" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M192,186 L206,186" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M228,172 C228,148 60,148 60,170" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="60" y="214" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">head</text>
  <text x="116" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">first</text>
  <text x="172" y="214" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">second</text>
  <text x="228" y="214" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">last</text>

  <!-- 箭头 -->
  <path d="M268,186 L300,186" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- 输出2a: [2,6] 环 -->
  <rect x="328" y="172" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="348" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="384" y="172" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <path d="M368,186 L382,186" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M404,172 C404,148 348,148 348,170" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 输出2b: [1,5] 环 -->
  <rect x="470" y="172" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="526" y="172" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="546" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <path d="M510,186 L524,186" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M546,172 C546,148 490,148 490,170" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="376" y="164" font-size="10" fill="#888" filter="url(#rough2)">第一半 [2,6]</text>
  <text x="516" y="164" font-size="10" fill="#888" filter="url(#rough2)">第二半 [1,5]</text>

  <!-- 说明 -->
  <rect x="60" y="250" width="460" height="56" rx="8" fill="#fff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="290" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">关键：first = head 起 firstSize−1 步；second = first.next；</text>
  <text x="290" y="290" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">last = second 起 secondSize−1 步。最后 first.next=head、last.next=second 各自成环。</text>
</svg>
