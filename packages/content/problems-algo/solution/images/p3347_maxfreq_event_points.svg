<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">只需检查 3n 个事件点：x−k、x、x+k</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">元素 x 贡献一段覆盖区间 [x−k, x+k]，reach(t) = 点 t 被覆盖的次数</text>
  <text x="260" y="60" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例：x = {2, 9, 14}，k = 4（3 个元素 → 至多 9 个事件点）</text>

  <!-- 三段覆盖区间 -->
  <rect x="60" y="92" width="168" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="144" y="106" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">x₁=2 → [−2, 6]</text>

  <rect x="207" y="127" width="168" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="291" y="141" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">x₂=9 → [5, 13]</text>

  <rect x="312" y="162" width="168" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="396" y="176" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">x₃=14 → [10, 18]</text>

  <!-- 事件点虚线：端点 x±k（橙）与 x 本身（红） -->
  <path d="M 60 84 L 60 232" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 144 84 L 144 232" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 207 84 L 207 232" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 228 84 L 228 232" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 291 84 L 291 232" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 312 84 L 312 232" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 375 84 L 375 232" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 396 84 L 396 232" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 480 84 L 480 232" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <path d="M 40 224 L 500 224" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 元素绿点 -->
  <circle cx="144" cy="224" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="291" cy="224" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="396" cy="224" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 事件点标签 -->
  <text x="60" y="243" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">−2</text>
  <text x="144" y="243" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="207" y="243" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">5</text>
  <text x="228" y="255" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">6</text>
  <text x="291" y="243" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="312" y="255" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">10</text>
  <text x="375" y="243" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">13</text>
  <text x="396" y="255" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">14</text>
  <text x="480" y="243" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">18</text>

  <!-- 段内 reach 标注 -->
  <text x="132" y="268" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">reach=1</text>
  <text x="270" y="268" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">reach=1</text>
  <text x="344" y="268" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">reach=2</text>
  <text x="438" y="268" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">reach=1</text>

  <!-- 结论框 -->
  <rect x="25" y="282" width="470" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="301" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">reach 只在端点 x±k 处变化（橙虚线）；eq 只在 t = x 处非零（红虚线）</text>

  <rect x="25" y="318" width="470" height="28" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">事件点之间的开区间：freq = min(r, numOperations)，r 为该段常数的 reach</text>

  <rect x="25" y="354" width="470" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">端点处覆盖只增不减 → 开区间内的值 ≤ 左端事件点的值 → 只查 3n 个事件点</text>
</svg>
