<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：forbidden 最长 10 → 只查以 right 结尾的至多 10 个子串</text>

  <!-- ===== word as character boxes ===== -->
  <text x="40" y="70" font-size="12" fill="#888" font-weight="bold">word</text>

  <g font-size="16" font-weight="bold">
    <!-- c b a a a a b c : word = "cbaaaabc" -->
    <rect x="70" y="80" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="90" y="107" text-anchor="middle" fill="#333">c</text>
    <rect x="110" y="80" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="130" y="107" text-anchor="middle" fill="#333">b</text>
    <rect x="150" y="80" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="170" y="107" text-anchor="middle" fill="#333">a</text>
    <rect x="190" y="80" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="210" y="107" text-anchor="middle" fill="#333">a</text>
    <rect x="230" y="80" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="250" y="107" text-anchor="middle" fill="#333">a</text>
    <rect x="270" y="80" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="290" y="107" text-anchor="middle" fill="#333">a</text>
    <rect x="310" y="80" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="330" y="107" text-anchor="middle" fill="#333">b</text>
    <rect x="350" y="80" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="370" y="107" text-anchor="middle" fill="#333">c</text>
  </g>

  <!-- index labels -->
  <g font-size="10" fill="#aaa">
    <text x="90" y="136" text-anchor="middle">0</text>
    <text x="130" y="136" text-anchor="middle">1</text>
    <text x="170" y="136" text-anchor="middle">2</text>
    <text x="210" y="136" text-anchor="middle">3</text>
    <text x="250" y="136" text-anchor="middle">4</text>
    <text x="290" y="136" text-anchor="middle">5</text>
    <text x="330" y="136" text-anchor="middle">6</text>
    <text x="370" y="136" text-anchor="middle">7</text>
  </g>

  <!-- ===== left / right pointers ===== -->
  <!-- left at index 4 -->
  <text x="290" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">left</text>
  <path d="M290,66 L290,78" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- right at index 7 -->
  <text x="370" y="62" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">right</text>
  <path d="M370,66 L370,78" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- window bracket [4, 7] -->
  <path d="M268,140 Q268,148 276,148 L374,148 Q382,148 382,140" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="325" y="164" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">窗口 [left, right] = "aabc"</text>

  <!-- ===== check zone: last 10 (here 4) chars ending at right ===== -->
  <rect x="270" y="80" width="120" height="42" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="4,3" rx="5" filter="url(#rough2)"/>
  <text x="330" y="184" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">↑ 只查这 ≤10 个子串（以 right 结尾）</text>

  <!-- ===== forbidden set ===== -->
  <rect x="420" y="80" width="120" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="480" y="98" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">forbidden</text>
  <text x="480" y="116" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">"aaa"</text>
  <text x="480" y="132" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">"cb"</text>

  <!-- ===== check the 4 substrings ===== -->
  <text x="40" y="216" font-size="12" fill="#888" font-weight="bold">检查子串</text>

  <g font-size="13" font-weight="bold">
    <rect x="70" y="226" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="105" y="245" text-anchor="middle" fill="#333">"c"</text>
    <text x="155" y="245" font-size="12" fill="#4a7a3a">✗ 不在 forbidden</text>

    <rect x="70" y="258" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="105" y="277" text-anchor="middle" fill="#333">"bc"</text>
    <text x="155" y="277" font-size="12" fill="#4a7a3a">✗ 不在 forbidden</text>

    <rect x="70" y="290" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="105" y="309" text-anchor="middle" fill="#333">"abc"</text>
    <text x="155" y="309" font-size="12" fill="#4a7a3a">✗ 不在 forbidden</text>

    <rect x="70" y="322" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="105" y="341" text-anchor="middle" fill="#333">"aabc"</text>
    <text x="155" y="341" font-size="12" fill="#4a7a3a">✗ 不在 forbidden</text>
  </g>

  <!-- result -->
  <path d="M255,336 L300,336" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="310" y="322" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="341" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">全部合法 → ans = max(ans, 4) = 4</text>

  <!-- ===== key insight box ===== -->
  <rect x="60" y="362" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">禁忌词最长 10 → 每步只查 10 个子串 → 整体 O(10n) = O(n)</text>
</svg>
