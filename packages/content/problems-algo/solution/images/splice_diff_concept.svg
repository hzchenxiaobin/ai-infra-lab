<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：交换子数组 = 在 diff 上选一段求和</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">diff[i]=nums2[i]−nums1[i]，交换 [l,r] 后 sum1+=S，sum2−=S，S=Σdiff[l..r]</text>

  <!-- ===== nums1 row ===== -->
  <text x="28" y="74" font-size="10.5" fill="#666">nums1</text>
  <rect x="70" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="76" text-anchor="middle" font-size="12" fill="#888">…</text>
  <rect x="114" y="56" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="158" y="56" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="202" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="76" text-anchor="middle" font-size="12" fill="#888">…</text>
  <!-- swap bracket over [l,r] -->
  <path d="M 114 50 L 114 46 L 202 46 L 202 50" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="158" y="40" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">交换区间 [l, r]</text>

  <!-- swap arrows (cross) -->
  <path d="M 136 92 L 180 120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 180 92 L 136 120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== nums2 row ===== -->
  <text x="28" y="138" font-size="10.5" fill="#666">nums2</text>
  <rect x="70" y="120" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="140" text-anchor="middle" font-size="12" fill="#888">…</text>
  <rect x="114" y="120" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="158" y="120" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="202" y="120" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="140" text-anchor="middle" font-size="12" fill="#888">…</text>
  <!-- index labels l, r -->
  <text x="136" y="164" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">l</text>
  <text x="180" y="164" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">r</text>

  <!-- arrow down to diff -->
  <path d="M 158 170 L 158 182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="180" font-size="9" fill="#666">逐位作差</text>

  <!-- ===== diff row ===== -->
  <text x="28" y="206" font-size="10.5" fill="#666">diff</text>
  <rect x="70" y="188" width="44" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="207" text-anchor="middle" font-size="11" fill="#888">…</text>
  <rect x="114" y="188" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a−b</text>
  <rect x="158" y="188" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a−b</text>
  <rect x="202" y="188" width="44" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="207" text-anchor="middle" font-size="11" fill="#888">…</text>
  <text x="256" y="207" font-size="9.5" fill="#888">S = Σ diff[l..r]</text>

  <!-- arrow down to score -->
  <path d="M 158 220 L 158 234" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== score formula boxes ===== -->
  <text x="28" y="252" font-size="10.5" fill="#666">分数</text>
  <rect x="70" y="240" width="190" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum1 = Σnums1</text>
  <text x="165" y="273" text-anchor="middle" font-size="10" fill="#446688">交换后 → sum1 + S</text>

  <rect x="280" y="240" width="190" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="375" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum2 = Σnums2</text>
  <text x="375" y="273" text-anchor="middle" font-size="10" fill="#4a7a3a">交换后 → sum2 − S</text>

  <text x="270" y="266" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">sum1+sum2 = total（定值）</text>

  <!-- score = max(...) -->
  <rect x="120" y="294" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">score(S) = max(sum1 + S, sum2 − S)</text>

  <!-- arrow down -->
  <path d="M 270 330 L 270 344" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="342" font-size="9.5" fill="#666">凸函数，在 S 端点处取最大</text>

  <!-- ===== two extreme candidates ===== -->
  <rect x="40" y="350" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="370" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">S 取最大（Kadane 求 maxS）</text>
  <text x="150" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum1 + maxS</text>
  <text x="150" y="400" text-anchor="middle" font-size="9" fill="#888">把 nums1 在某段换成更大的 nums2</text>

  <rect x="280" y="350" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="370" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">S 取最小（Kadane 求 minS）</text>
  <text x="390" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum2 − minS</text>
  <text x="390" y="400" text-anchor="middle" font-size="9" fill="#888">把 nums2 在某段换成更大的 nums1</text>

  <!-- ===== Footer ===== -->
  <rect x="40" y="418" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="438" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">答案 = max(sum1 + maxS, sum2 − minS)，maxS≥0 / minS≤0 含「不交换」</text>
</svg>
