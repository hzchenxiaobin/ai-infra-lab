<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：贪心——优先放剩余最多的「可用」字符</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">约束：同一字符连续不超过 2 次（不出现 aaa/bbb/ccc）</text>

  <!-- Three piles: a=1, b=1, c=7 -->
  <text x="50" y="80" font-size="12" fill="#888" font-weight="bold">配额（降序）:</text>

  <!-- pile c (tallest, 7 blocks) -->
  <text x="180" y="80" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">c: 7</text>
  <g filter="url(#rough2)">
    <rect x="156" y="90" width="48" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="156" y="112" width="48" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="156" y="134" width="48" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="156" y="156" width="48" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="156" y="178" width="48" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="156" y="200" width="48" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="156" y="222" width="48" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>

  <!-- pile a (1 block) -->
  <text x="290" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a: 1</text>
  <g filter="url(#rough2)">
    <rect x="266" y="222" width="48" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>

  <!-- pile b (1 block) -->
  <text x="400" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b: 1</text>
  <g filter="url(#rough2)">
    <rect x="376" y="222" width="48" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>

  <!-- Arrow: pick the tallest -->
  <path d="M 180 250 L 180 268" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="220" y="266" font-size="11" fill="#d6a040" font-weight="bold">取最高频</text>

  <!-- Rule box: the greedy decision -->
  <rect x="40" y="278" width="270" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="12" fill="#446688" font-weight="bold">规则：每步取剩余最多</text>
  <text x="60" y="318" font-size="11" fill="#555">且不与末尾两字符构成三连</text>
  <text x="60" y="336" font-size="11" fill="#555">的字符，放一个到末尾</text>

  <!-- Block illustration: XX blocked -->
  <rect x="330" y="278" width="270" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="300" font-size="12" fill="#b85450" font-weight="bold">例外：末尾已是 "XX" 时</text>
  <text x="350" y="318" font-size="11" fill="#555">X 被阻塞 → 取次高频做分隔</text>
  <g font-size="13" filter="url(#rough2)">
    <rect x="350" y="328" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="361" y="341" text-anchor="middle" fill="#d6a040" font-weight="bold">c</text>
    <rect x="374" y="328" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="385" y="341" text-anchor="middle" fill="#d6a040" font-weight="bold">c</text>
    <rect x="398" y="328" width="22" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="409" y="341" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <text x="430" y="341" font-size="11" fill="#b85450">← 切换!</text>
  </g>

  <!-- Bottom: bottleneck intuition -->
  <rect x="40" y="360" width="560" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="382" font-size="12" fill="#d6a040" font-weight="bold">💡 直觉：最高频字符是「瓶颈」</text>
  <text x="60" y="400" font-size="11" fill="#666">它最需要被间隔打散 → 尽早消耗它，节约稀缺的分隔符</text>
  <text x="60" y="418" font-size="11" fill="#666">终止时至多一种字符被 "XX" 阻塞且分隔符耗尽 → 任何策略都无法突破</text>
</svg>
