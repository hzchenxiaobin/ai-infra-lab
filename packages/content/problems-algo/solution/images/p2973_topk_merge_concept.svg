<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：三元最大乘积只取决于「最大 3 个 + 最小 2 个」</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">以示例 2 的根节点子树为例：9 个开销排序后，答案只看两端</text>

  <!-- sorted array: bottom2 red / mid gray / top3 green -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="82" y="58" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="102" y="77" text-anchor="middle" fill="#8c3a36">−4</text>
    <rect x="126" y="58" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="146" y="77" text-anchor="middle" fill="#8c3a36">1</text>
    <rect x="170" y="58" width="40" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="190" y="77" text-anchor="middle" fill="#777">2</text>
    <rect x="214" y="58" width="40" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="234" y="77" text-anchor="middle" fill="#777">2</text>
    <rect x="258" y="58" width="40" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="278" y="77" text-anchor="middle" fill="#777">3</text>
    <rect x="302" y="58" width="40" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="322" y="77" text-anchor="middle" fill="#777">4</text>
    <rect x="346" y="58" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="366" y="77" text-anchor="middle" fill="#2e5c22">5</text>
    <rect x="390" y="58" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="410" y="77" text-anchor="middle" fill="#2e5c22">7</text>
    <rect x="434" y="58" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="454" y="77" text-anchor="middle" fill="#2e5c22">8</text>
  </g>

  <!-- braces -->
  <path d="M 83 92 C 103 101, 123 101, 143 92" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="113" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">最小 2 个</text>
  <text x="278" y="116" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">中间 4 个：无关</text>
  <path d="M 347 92 C 377 102, 427 102, 457 92" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">最大 3 个</text>

  <!-- two candidates -->
  <rect x="58" y="130" width="212" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#2e5c22">
    <text x="164" y="152" text-anchor="middle" font-size="12" font-weight="bold">候选 ① 三个最大相乘</text>
    <text x="164" y="172" text-anchor="middle" font-size="12">8 × 7 × 5 = 280 ✓</text>
  </g>
  <rect x="290" y="130" width="212" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#8c3a36">
    <text x="396" y="152" text-anchor="middle" font-size="12" font-weight="bold">候选 ② 两个最小 × 最大</text>
    <text x="396" y="172" text-anchor="middle" font-size="12">(−4) × 1 × 8 = −32</text>
  </g>

  <text x="280" y="206" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">coin[0] = max(280, −32) = 280　（最大乘积为负 → 放 0）</text>

  <line x1="40" y1="222" x2="520" y2="222" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="280" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">观察 ② ③：行囊上溯 —— 子树只带 5 个值，父节点倒池重截</text>

  <!-- mini tree: children packets flow up to parent -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 72.8 349.2 L 114.1 315.3" marker-end="url(#arr)"/>
    <path d="M 183.2 349.2 L 141.9 315.3" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="128" cy="304" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="128" y="309" text-anchor="middle" font-size="12" fill="#2c4a6e">x</text>
    <text x="128" y="340" text-anchor="middle" font-size="10.5" fill="#555">cost[x]</text>
    <circle cx="62" cy="358" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="62" y="362" text-anchor="middle" font-size="11" fill="#2c4a6e">A</text>
    <circle cx="194" cy="358" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="194" y="362" text-anchor="middle" font-size="11" fill="#2c4a6e">B</text>
  </g>

  <!-- packets -->
  <g filter="url(#rough2)">
    <rect x="8" y="384" width="108" height="20" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="62" y="398" text-anchor="middle" font-size="10.5" fill="#8a6414">−9 −7 ∣ 2 4 6</text>
    <rect x="140" y="384" width="108" height="20" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="194" y="398" text-anchor="middle" font-size="10.5" fill="#8a6414">−7 −1 ∣ 4 6 9</text>
  </g>

  <!-- right merge box -->
  <rect x="262" y="266" width="282" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#2e5c22">
    <text x="403" y="288" text-anchor="middle" font-size="12" font-weight="bold">合并：父节点倒池重截</text>
    <text x="403" y="308" text-anchor="middle" font-size="11">pool = cost[x] ∪ 行囊A ∪ 行囊B</text>
    <text x="403" y="324" text-anchor="middle" font-size="11">排序 → 截「最小 2 ∣ 最大 3」</text>
    <text x="403" y="340" text-anchor="middle" font-size="11">= kept[x]，继续向上携带</text>
    <text x="403" y="360" text-anchor="middle" font-size="10.5">安全：并集 top3 ⊆ 成员 top3 之并</text>
    <text x="403" y="374" text-anchor="middle" font-size="10.5">（bottom2 同理）→ 不漏候选</text>
  </g>
  <path d="M 148 302 L 258 316" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n 个节点 × O(1) 行囊 → 信息沿树线性上溯</text>
</svg>
