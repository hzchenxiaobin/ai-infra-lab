<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 前缀和 → 逐英雄二分</text>

  <!-- Step 1 -->
  <rect x="60" y="44" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="69" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 绑定排序：(monsters[i], coins[i]) 按战力升序</text>
  <text x="430" y="69" font-size="11" fill="#999" filter="url(#rough2)">O(m log m)</text>

  <path d="M 280 84 L 280 102" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="106" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="131" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 前缀和：pre[0] = 0, pre[i+1] = pre[i] + coins_sorted[i]</text>

  <path d="M 280 146 L 280 164" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: diamond -->
  <polygon points="280,168 400,212 280,256 160,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">还有英雄未处理？</text>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">j = 0 … n−1</text>

  <!-- No branch to return -->
  <path d="M 400 212 L 480 212 L 480 366" stroke="#446688" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="412" y="206" font-size="10" fill="#999" filter="url(#rough2)">否</text>

  <!-- Yes branch down -->
  <path d="M 280 256 L 280 274" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="269" font-size="10" fill="#999" filter="url(#rough2)">是</text>

  <!-- Step 4: binary search -->
  <rect x="60" y="278" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 二分：pos = upper_bound(战力 &gt; heroes[j] 的首个位置)</text>
  <text x="280" y="313" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">即「战力 ≤ h」的怪物个数，O(log m)</text>

  <path d="M 280 322 L 280 340" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: answer -->
  <rect x="60" y="344" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="367" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ ans[j] = pre[pos]</text>

  <!-- Loop back -->
  <path d="M 60 362 L 30 362 L 30 212 L 156 212" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <text x="14" y="292" font-size="10" fill="#999" filter="url(#rough2)">取下一位英雄</text>

  <!-- Return -->
  <rect x="390" y="366" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="389" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ return ans</text>
</svg>
