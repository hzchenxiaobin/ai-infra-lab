<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：KMP 前缀函数 π 的构造</text>

  <!-- Step 1: init -->
  <rect x="180" y="40" width="240" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">① 初始化 π[0] = 0</text>
  <text x="300" y="73" text-anchor="middle" font-size="10" fill="#555">单字符无「真前缀 = 后缀」</text>

  <!-- arrow -->
  <path d="M 300 82 L 300 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="140" y="98" width="320" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="118" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">② 对每个 i = 1 … n−1 循环</text>
  <text x="300" y="134" text-anchor="middle" font-size="10.5" fill="#555">令 j ← π[i−1]（继承上一位置的最长边界长度）</text>

  <!-- arrow -->
  <path d="M 300 144 L 300 160" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: while fallback -->
  <rect x="130" y="162" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="182" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">③ while j &gt; 0 且 s[i] ≠ s[j]：j ← π[j−1]</text>
  <text x="300" y="198" text-anchor="middle" font-size="10" fill="#666">不断回退到更短的边界，直到能匹配或归零</text>

  <!-- arrow -->
  <path d="M 300 206 L 300 222" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="300,224 400,260 300,296 200,260" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">s[i] ==</text>
  <text x="300" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">s[j] ?</text>

  <!-- Yes branch (right) -->
  <path d="M 400 260 L 440 260" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="420" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="440" y="238" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="258" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold">j ← j + 1</text>
  <text x="500" y="273" text-anchor="middle" font-size="9.5" fill="#555">边界扩展一位</text>

  <!-- No branch (left) -->
  <path d="M 200 260 L 160 260" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="180" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 ✗</text>
  <rect x="40" y="238" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="258" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">j 保持不变</text>
  <text x="100" y="273" text-anchor="middle" font-size="9.5" fill="#555">（此时 j = 0）</text>

  <!-- merge arrows to step 4 -->
  <path d="M 500 282 L 500 339 L 420 339" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 100 282 L 100 339 L 180 339" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: assign pi[i] -->
  <rect x="180" y="318" width="240" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="336" text-anchor="middle" font-size="12.5" fill="#a87020" font-weight="bold">④ π[i] ← j</text>
  <text x="300" y="351" text-anchor="middle" font-size="10" fill="#666">记录 s[0..i] 的最长「真前缀=后缀」长度</text>

  <!-- loop back arrow (right side, dashed) -->
  <path d="M 420 339 L 572 339 L 572 121 L 460 121" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="586" y="230" text-anchor="middle" font-size="10" fill="#888" transform="rotate(90 586 230)">i++ 继续循环</text>

  <!-- arrow down to return -->
  <path d="M 300 360 L 300 378" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="320" y="372" font-size="10" fill="#aaa">循环结束</text>

  <!-- Step 5: return -->
  <rect x="160" y="380" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="405" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">⑤ 返回 s[0 : π[n−1]]</text>

  <!-- footer note -->
  <rect x="80" y="432" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="450" text-anchor="middle" font-size="10.5" fill="#666">O(n) 时间：i 单调递增，j 的回退总次数不超过 n</text>
</svg>
