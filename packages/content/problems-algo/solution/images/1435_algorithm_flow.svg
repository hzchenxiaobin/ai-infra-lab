<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：四个 SELECT 独立分桶计数 → UNION ALL 拼接</text>

  <!-- ============ Sessions table (top) ============ -->
  <text x="290" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Sessions 表（duration 单位：秒）</text>
  <rect x="200" y="58" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="73" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">session_id</text>
  <text x="335" y="73" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">duration</text>

  <rect x="200" y="80" width="180" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="92" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="335" y="92" text-anchor="middle" font-size="8.5" fill="#333">30</text>

  <rect x="200" y="96" width="180" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="108" text-anchor="middle" font-size="8.5" fill="#333">2</text>
  <text x="335" y="108" text-anchor="middle" font-size="8.5" fill="#333">199</text>

  <rect x="200" y="112" width="180" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="124" text-anchor="middle" font-size="8.5" fill="#333">3</text>
  <text x="335" y="124" text-anchor="middle" font-size="8.5" fill="#333">299</text>

  <rect x="200" y="128" width="180" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="140" text-anchor="middle" font-size="8.5" fill="#333">4</text>
  <text x="335" y="140" text-anchor="middle" font-size="8.5" fill="#333">580</text>

  <rect x="200" y="144" width="180" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="156" text-anchor="middle" font-size="8.5" fill="#333">5</text>
  <text x="335" y="156" text-anchor="middle" font-size="8.5" fill="#333">1000</text>

  <!-- ============ Four SELECT branches ============ -->
  <!-- Branch 1 -->
  <rect x="20" y="178" width="120" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="194" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">SELECT ①</text>
  <text x="80" y="208" text-anchor="middle" font-size="8.5" fill="#333">'[0-5&gt;', COUNT(*)</text>
  <text x="80" y="221" text-anchor="middle" font-size="8.5" fill="#4a7a3a">WHERE d &lt; 300</text>
  <path d="M260,168 Q170,178 120,195" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Branch 2 -->
  <rect x="150" y="178" width="120" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="194" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">SELECT ②</text>
  <text x="210" y="208" text-anchor="middle" font-size="8.5" fill="#333">'[5-10&gt;', COUNT(*)</text>
  <text x="210" y="221" text-anchor="middle" font-size="8.5" fill="#4a7a3a">300 ≤ d &lt; 600</text>
  <path d="M275,168 Q240,178 250,195" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Branch 3 (empty bucket) -->
  <rect x="280" y="178" width="120" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="340" y="194" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">SELECT ③</text>
  <text x="340" y="208" text-anchor="middle" font-size="8.5" fill="#333">'[10-15&gt;', COUNT(*)</text>
  <text x="340" y="221" text-anchor="middle" font-size="8.5" fill="#d6a040">600 ≤ d &lt; 900</text>
  <path d="M305,168 Q320,178 340,195" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="340" y="238" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">⚠ 无匹配 → COUNT=0</text>

  <!-- Branch 4 -->
  <rect x="410" y="178" width="120" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="194" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">SELECT ④</text>
  <text x="470" y="208" text-anchor="middle" font-size="8.5" fill="#333">'15 or more', COUNT</text>
  <text x="470" y="221" text-anchor="middle" font-size="8.5" fill="#4a7a3a">d ≥ 900</text>
  <path d="M325,168 Q400,178 410,195" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ============ UNION ALL ============ -->
  <rect x="120" y="255" width="310" height="28" fill="#f3e8f7" stroke="#8844aa" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="275" y="273" text-anchor="middle" font-size="11" fill="#8844aa" font-weight="bold">UNION ALL（纵向拼接，不去重）</text>
  <path d="M80,234 L80,250 L275,250 L275,255" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M210,234 L210,250 L275,250 L275,255" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M340,234 L340,250 L275,250 L275,255" fill="none" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M470,234 L470,250 L275,250 L275,255" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ============ Result ============ -->
  <text x="290" y="300" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果（4 行，含空桶）</text>
  <rect x="190" y="306" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="321" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">bin</text>
  <text x="335" y="321" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">total</text>

  <rect x="190" y="328" width="200" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="340" text-anchor="middle" font-size="8.5" fill="#333">[0-5&gt;</text>
  <text x="335" y="340" text-anchor="middle" font-size="8.5" fill="#333">3</text>

  <rect x="190" y="344" width="200" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="356" text-anchor="middle" font-size="8.5" fill="#333">[5-10&gt;</text>
  <text x="335" y="356" text-anchor="middle" font-size="8.5" fill="#333">1</text>

  <rect x="190" y="360" width="200" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="235" y="372" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">[10-15&gt;</text>
  <text x="335" y="372" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">0</text>

  <rect x="190" y="376" width="200" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="388" text-anchor="middle" font-size="8.5" fill="#333">15 or more</text>
  <text x="335" y="388" text-anchor="middle" font-size="8.5" fill="#333">1</text>

  <!-- ============ Key notes ============ -->
  <rect x="20" y="400" width="540" height="32" fill="#ffffff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="30" y="414" font-size="9" fill="#446688" font-weight="bold">关键点：</text>
  <text x="85" y="414" font-size="8.5" fill="#333">① 单位换算：5/10/15 min → 300/600/900 s</text>
  <text x="85" y="427" font-size="8.5" fill="#333">② 空桶保留：每个 SELECT 显式输出桶标签，COUNT(*) 空集返回 0（非 NULL）</text>
</svg>
