<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：子序列可自由挑选 → 取相邻两值的全量</text>

  <!-- nums row -->
  <text x="40" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="80" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="128" y="58" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="151" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="176" y="58" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="224" y="58" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="247" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="272" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="320" y="58" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="343" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="368" y="58" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="416" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="439" y="78" text-anchor="middle" font-size="12" fill="#333">7</text>

  <text x="103" y="104" text-anchor="middle" font-size="9" fill="#aaa">删</text>
  <text x="151" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">留</text>
  <text x="199" y="104" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">留</text>
  <text x="247" y="104" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">留</text>
  <text x="295" y="104" text-anchor="middle" font-size="9" fill="#aaa">删</text>
  <text x="343" y="104" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">留</text>
  <text x="391" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">留</text>
  <text x="439" y="104" text-anchor="middle" font-size="9" fill="#aaa">删</text>

  <!-- arrow down -->
  <path d="M 260 116 L 260 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="132" font-size="10" fill="#888">只需两种值</text>

  <!-- Two value boxes -->
  <rect x="70" y="150" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="160" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">值 = 2，出现 3 次</text>
  <text x="160" y="192" text-anchor="middle" font-size="11" fill="#555">cnt[2] = 3</text>

  <rect x="270" y="150" width="180" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="360" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">值 = 3，出现 2 次</text>
  <text x="360" y="192" text-anchor="middle" font-size="11" fill="#555">cnt[3] = 2</text>

  <!-- plus sign -->
  <text x="260" y="186" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">+</text>

  <!-- equation box -->
  <rect x="70" y="222" width="380" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">max − min = 3 − 2 = 1 ✓ 和谐</text>
  <text x="260" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">长度 = cnt[2] + cnt[3] = 5</text>

  <!-- generalization -->
  <rect x="40" y="290" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#333">子序列 ⟺ 可任意挑元素 → 顺序无关</text>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#446688">枚举每对相邻值 (x, x+1)，取 cnt[x]+cnt[x+1] 最大</text>
</svg>
