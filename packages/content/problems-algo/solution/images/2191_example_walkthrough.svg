<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：mapping=[8,9,4,0,2,1,3,5,7,6]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">nums = [991, 338, 38]</text>

  <!-- ====== Table header ====== -->
  <rect x="30" y="56" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">num</text>

  <rect x="120" y="56" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">数位分解</text>

  <rect x="250" y="56" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">逐位映射</text>

  <rect x="380" y="56" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">映射值</text>

  <rect x="470" y="56" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="505" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">排序键</text>

  <!-- ====== Row 1: 991 ====== -->
  <rect x="30" y="92" width="80" height="40" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">991</text>

  <rect x="120" y="92" width="120" height="40" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="117" text-anchor="middle" font-size="12" fill="#333">9, 9, 1</text>

  <rect x="250" y="92" width="120" height="40" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="117" text-anchor="middle" font-size="12" fill="#333">6, 6, 9</text>

  <rect x="380" y="92" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">669</text>

  <rect x="470" y="92" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="505" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">669</text>

  <!-- ====== Row 2: 338 ====== -->
  <rect x="30" y="138" width="80" height="40" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">338</text>

  <rect x="120" y="138" width="120" height="40" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="163" text-anchor="middle" font-size="12" fill="#333">3, 3, 8</text>

  <rect x="250" y="138" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="163" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0, 0, 7</text>

  <rect x="380" y="138" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="158" text-anchor="middle" font-size="11" fill="#888">007</text>
  <text x="420" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">→ 7</text>

  <rect x="470" y="138" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="505" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>

  <!-- ====== Row 3: 38 ====== -->
  <rect x="30" y="184" width="80" height="40" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">38</text>

  <rect x="120" y="184" width="120" height="40" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="209" text-anchor="middle" font-size="12" fill="#333">3, 8</text>

  <rect x="250" y="184" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="209" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0, 7</text>

  <rect x="380" y="184" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="204" text-anchor="middle" font-size="11" fill="#888">07</text>
  <text x="420" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">→ 7</text>

  <rect x="470" y="184" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="505" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>

  <!-- note about leading zeros -->
  <text x="310" y="244" text-anchor="middle" font-size="10" fill="#b85450">↑ 映射后前导零在整数重组时自动丢弃：007 → 7，07 → 7</text>

  <!-- ====== Sort result ====== -->
  <rect x="30" y="260" width="510" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.35"/>
  <text x="285" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">按排序键非递减稳定排序</text>

  <!-- sort arrows: 338(7) → 38(7) → 991(669) -->
  <rect x="60" y="296" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">338</text>
  <text x="92" y="340" text-anchor="middle" font-size="10" fill="#d6a040">键=7</text>

  <path d="M 128 311 L 168 311" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="172" y="296" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">38</text>
  <text x="204" y="340" text-anchor="middle" font-size="10" fill="#d6a040">键=7</text>

  <path d="M 240 311 L 280 311" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="284" y="296" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">991</text>
  <text x="316" y="340" text-anchor="middle" font-size="10" fill="#446688">键=669</text>

  <!-- result -->
  <text x="430" y="306" text-anchor="middle" font-size="11" fill="#888">返回</text>
  <rect x="382" y="312" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="447" y="333" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[338, 38, 991]</text>

  <!-- stable note -->
  <text x="285" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a">338 与 38 键值同为 7，稳定排序保持原序（338 在 38 前）</text>
</svg>
