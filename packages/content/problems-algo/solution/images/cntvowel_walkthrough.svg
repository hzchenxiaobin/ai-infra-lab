<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：words = ["aba","bcb","ece","aa","e"]
  </text>

  <!-- words row: 5 boxes, step 84, width 64, x=60+i*84, y=40 -->
  <text x="20" y="62" font-size="12" fill="#4a7a3a" filter="url(#rough2)">words</text>
  <g font-size="13" fill="#333">
    <rect x="60"  y="40" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="92"  y="62" text-anchor="middle" filter="url(#rough2)">aba</text>
    <rect x="144" y="40" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="176" y="62" text-anchor="middle" filter="url(#rough2)">bcb</text>
    <rect x="228" y="40" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="260" y="62" text-anchor="middle" filter="url(#rough2)">ece</text>
    <rect x="312" y="40" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="344" y="62" text-anchor="middle" filter="url(#rough2)">aa</text>
    <rect x="396" y="40" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="428" y="62" text-anchor="middle" filter="url(#rough2)">e</text>
  </g>

  <!-- mark badges b[i]: center 92+i*84, x=77+i*84, y=82, w=30 h=20 -->
  <text x="20" y="96" font-size="12" fill="#4a7a3a" filter="url(#rough2)">b[i]</text>
  <g font-size="12">
    <rect x="77"  y="82" width="30" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="92"  y="97" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <rect x="161" y="82" width="30" height="20" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="176" y="97" text-anchor="middle" fill="#888" filter="url(#rough2)">0</text>
    <rect x="245" y="82" width="30" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="260" y="97" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <rect x="329" y="82" width="30" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="344" y="97" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <rect x="413" y="82" width="30" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="428" y="97" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">1</text>
  </g>

  <!-- word index labels -->
  <g font-size="11" fill="#888">
    <text x="92"  y="116" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="176" y="116" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="260" y="116" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="344" y="116" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="428" y="116" text-anchor="middle" filter="url(#rough2)">4</text>
  </g>

  <!-- pre index labels above pre boxes: center 50+i*84 -->
  <g font-size="10" fill="#888">
    <text x="50"  y="128" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="134" y="128" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="218" y="128" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="302" y="128" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="386" y="128" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="470" y="128" text-anchor="middle" filter="url(#rough2)">5</text>
  </g>

  <!-- pre row: 6 boxes, center 50+i*84, x=18+i*84, y=132, w=64 h=34 ; values 0,1,1,2,3,4 -->
  <text x="20" y="153" font-size="12" fill="#446688" filter="url(#rough2)">pre</text>
  <g font-size="13" fill="#333">
    <!-- pre0 = 0 (highlight) -->
    <rect x="18"  y="132" width="64" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="50"  y="154" text-anchor="middle" filter="url(#rough2)">0</text>
    <!-- pre1 = 1 -->
    <rect x="102" y="132" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="134" y="154" text-anchor="middle" filter="url(#rough2)">1</text>
    <!-- pre2 = 1 -->
    <rect x="186" y="132" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="218" y="154" text-anchor="middle" filter="url(#rough2)">1</text>
    <!-- pre3 = 2 (highlight) -->
    <rect x="270" y="132" width="64" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="302" y="154" text-anchor="middle" filter="url(#rough2)">2</text>
    <!-- pre4 = 3 -->
    <rect x="354" y="132" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="386" y="154" text-anchor="middle" filter="url(#rough2)">3</text>
    <!-- pre5 = 4 -->
    <rect x="438" y="132" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="154" text-anchor="middle" filter="url(#rough2)">4</text>
  </g>

  <!-- query [0,2] bracket under pre0..pre3 -->
  <path d="M50,170 L50,178 L302,178 L302,170" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="176" y="192" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">查询 [0,2]：pre[3] − pre[0]</text>

  <!-- three query results -->
  <g font-size="13" fill="#333">
    <text x="60" y="222" filter="url(#rough2)">[0,2] → pre[3] − pre[0] = 2 − 0 =</text>
    <text x="430" y="222" fill="#b85450" filter="url(#rough2)">2 ✓</text>
    <text x="60" y="246" filter="url(#rough2)">[1,4] → pre[5] − pre[1] = 4 − 1 =</text>
    <text x="430" y="246" fill="#b85450" filter="url(#rough2)">3 ✓</text>
    <text x="60" y="270" filter="url(#rough2)">[1,1] → pre[2] − pre[1] = 1 − 1 =</text>
    <text x="430" y="270" fill="#b85450" filter="url(#rough2)">0 ✓</text>
  </g>

  <!-- final answer box -->
  <rect x="170" y="296" width="180" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">ans = [2, 3, 0]</text>
</svg>
