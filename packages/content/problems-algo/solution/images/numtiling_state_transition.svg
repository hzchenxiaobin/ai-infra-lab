<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">状态转移：每一步只在新边界加一块瓷砖</text>

  <!-- ===== f[k] formula ===== -->
  <rect x="30" y="42" width="540" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">f[k] = f[k−1] + f[k−2] + 2·h[k−1]</text>

  <text x="30" y="92" font-size="11" fill="#888" font-weight="bold">构造完整 2×k 的 4 种「最后一步」（后两种对称，合起来即 2·h[k−1]）：</text>

  <!-- ===== 4 panels for f[k], each 3 cols x 2 rows, cell 22 ===== -->
  <!-- Panel A: f[k-1] + vertical domino, ox=70 -->
  <g>
    <rect x="70" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="70" y="126" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="92" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="92" y="126" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="114" y="104" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="114" y="126" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="114" y="104" width="22" height="44" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="103" y="166" text-anchor="middle" font-size="10" fill="#555">f[k−1] +</text>
    <text x="103" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">竖向多米诺</text>
  </g>

  <!-- Panel B: f[k-2] + 2 horizontal dominos, ox=210 -->
  <g>
    <rect x="210" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="210" y="126" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="232" y="104" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="254" y="104" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="232" y="126" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="254" y="126" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="232" y="104" width="44" height="22" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="232" y="126" width="44" height="22" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="243" y="166" text-anchor="middle" font-size="10" fill="#555">f[k−2] +</text>
    <text x="243" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">两块横向多米诺</text>
  </g>

  <!-- Panel C: h_top[k-1] + tromino -> f[k], ox=350 -->
  <g>
    <rect x="350" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="350" y="126" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="372" y="104" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="372" y="126" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="394" y="104" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="394" y="126" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <path d="M 372 104 L 416 104 L 416 148 L 394 148 L 394 126 L 372 126 Z" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="383" y="166" text-anchor="middle" font-size="10" fill="#555">h[k−1] 缺角 +</text>
    <text x="383" y="180" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">托米诺补齐</text>
  </g>

  <!-- Panel D: h_bot[k-1] + tromino -> f[k] (mirror), ox=490 -->
  <g>
    <rect x="490" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="490" y="126" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="512" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="512" y="126" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="534" y="104" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="534" y="126" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <path d="M 512 104 L 556 104 L 556 148 L 534 148 L 534 126 L 512 126 Z" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="523" y="166" text-anchor="middle" font-size="10" fill="#555">对称缺角 +</text>
    <text x="523" y="180" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">托米诺（共 2 种）</text>
  </g>

  <!-- ===== h[k] formula ===== -->
  <rect x="30" y="206" width="540" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="227" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">h[k] = h[k−1] + f[k−2]</text>

  <text x="30" y="256" font-size="11" fill="#888" font-weight="bold">构造「2×k 缺一角」的 2 种最后一步（h[k−1] 项来自对角缺角，由横向多米诺翻转缺角位置）：</text>

  <!-- Panel E: h_bot[k-1] + horizontal domino -> h_top[k], ox=140 -->
  <g>
    <rect x="140" y="268" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="140" y="290" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="162" y="268" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="162" y="290" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="184" y="268" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <rect x="184" y="290" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="162" y="290" width="44" height="22" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="173" y="330" text-anchor="middle" font-size="10" fill="#555">对角缺角 h[k−1] +</text>
    <text x="173" y="344" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">横向多米诺（缺角翻转）</text>
  </g>

  <!-- Panel F: f[k-2] + tromino -> h_top[k], ox=400 -->
  <g>
    <rect x="400" y="268" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="400" y="290" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="422" y="268" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="422" y="290" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="444" y="268" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <rect x="444" y="290" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <path d="M 422 268 L 466 268 L 466 312 L 444 312 L 444 290 L 422 290 Z" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="433" y="330" text-anchor="middle" font-size="10" fill="#555">f[k−2] +</text>
    <text x="433" y="344" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">托米诺（缺角留在 (k,上)）</text>
  </g>

  <!-- ===== legend ===== -->
  <rect x="30" y="372" width="540" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="48" y="392" font-size="11" fill="#333" font-weight="bold">图例：</text>
  <rect x="100" y="382" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="394" font-size="10" fill="#555">已铺好的旧部分</text>
  <rect x="230" y="382" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="252" y="394" font-size="10" fill="#555">新加的多米诺</text>
  <rect x="360" y="382" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="382" y="394" font-size="10" fill="#555">新加的托米诺</text>
  <rect x="470" y="382" width="16" height="16" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="492" y="394" font-size="10" fill="#555">缺角（空格）</text>
  <text x="300" y="418" text-anchor="middle" font-size="10.5" fill="#888">每格 = 1 单元；3 列分别对应列 k−2 / k−1 / k（从左到右推进）</text>

  <!-- ===== note ===== -->
  <rect x="30" y="448" width="540" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="470" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">为什么 h 的递推里是「对角缺角」？</text>
  <text x="48" y="490" font-size="10.5" fill="#555">缺角在 (k−1, 下) 的形状，加一块横向多米诺铺 (k−1,下)+(k,下)，</text>
  <text x="48" y="506" font-size="10.5" fill="#555">恰好把缺角「翻」到 (k, 上) —— 缺角跨列翻转行，必须用对角方向的 h[k−1]。</text>
  <text x="48" y="526" font-size="10.5" fill="#888">上下镜像对称 ⟹ 两种缺角方案数相等，统一记 h[k−1]，于是 h[k] = h[k−1] + f[k−2]。</text>
</svg>
