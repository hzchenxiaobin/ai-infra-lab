<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：最左可提升位 i + 右侧最大值的最右出现 j</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">同等大值取最右——让被换出的小值尽可能靠右，后段更大</text>

  <!-- ===== original number 1993 ===== -->
  <text x="40" y="92" font-size="12" fill="#888">原数 1993：</text>

  <!-- cell 0: '1' -> improvable position i (blue) -->
  <rect x="150" y="74" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- cell 1: '9' -> earlier 9, not chosen (orange, dashed) -->
  <rect x="204" y="74" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="229" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>

  <!-- cell 2: '9' -> rightmost max, chosen j (green) -->
  <rect x="258" y="74" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="283" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>

  <!-- cell 3: '3' -->
  <rect x="312" y="74" width="50" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <!-- index labels -->
  <text x="175" y="126" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="229" y="126" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="283" y="126" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="337" y="126" text-anchor="middle" font-size="10" fill="#aaa">3</text>

  <!-- i pointer (blue) under index 0 -->
  <path d="M 175 134 L 175 124" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="175" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">i = 0</text>
  <text x="175" y="164" text-anchor="middle" font-size="10" fill="#446688">最左可提升位</text>

  <!-- annotation under index 1: 9 but not chosen -->
  <text x="229" y="150" text-anchor="middle" font-size="10" fill="#d6a040">9（更左）</text>
  <text x="229" y="164" text-anchor="middle" font-size="10" fill="#d6a040">不选</text>

  <!-- j pointer (green) under index 2 -->
  <path d="M 283 134 L 283 124" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="283" y="150" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">j = 2</text>
  <text x="283" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a">最右最大值</text>

  <!-- divider -->
  <line x1="40" y1="184" x2="520" y2="184" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== branch A: swap with index 1 (earlier 9) ===== -->
  <text x="40" y="212" font-size="11.5" fill="#d6a040" font-weight="bold">换下标 1（更左的 9）：</text>

  <rect x="150" y="222" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="175" y="244" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="204" y="222" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="229" y="244" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="258" y="222" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="283" y="244" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="312" y="222" width="50" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="244" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <text x="378" y="244" font-size="13" fill="#888">=</text>
  <rect x="396" y="222" width="68" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="244" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">9193</text>

  <!-- ===== branch B: swap with index 2 (rightmost 9) ===== -->
  <text x="40" y="288" font-size="11.5" fill="#4a7a3a" font-weight="bold">换下标 2（最右的 9）：</text>

  <rect x="150" y="298" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="175" y="320" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="204" y="298" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="229" y="320" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="258" y="298" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="283" y="320" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="312" y="298" width="50" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="320" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <text x="378" y="320" font-size="13" fill="#888">=</text>
  <rect x="396" y="298" width="68" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="320" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">9913</text>
  <text x="472" y="320" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 更大</text>

  <!-- bottom note -->
  <rect x="50" y="356" width="460" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">最右让小值「1」落到 j=2，保留 [i+1, j-1] 段的「9」，后段更大</text>
  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#888">高位权重指数递减 → 先提升最左位；同等大值取最右 → 后段最大</text>
</svg>
