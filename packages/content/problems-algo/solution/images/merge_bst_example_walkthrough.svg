<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：trees = [[2,1],[3,2,5],[5,4]] 的合并全过程</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">根值 3 ∉ 叶值 {1,2,4,5} → Tree1 为最终根，DFS 替换两片叶子</text>

  <!-- ===== Step 1: before merge ===== -->
  <text x="80" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 合并前：Tree1（最终根）</text>
  <g font-size="12" filter="url(#rough2)">
    <!-- root 3 -->
    <circle cx="80" cy="100" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="80" y="105" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <!-- leaf 2 -->
    <circle cx="50" cy="148" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="50" y="152" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <!-- leaf 5 -->
    <circle cx="110" cy="148" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="110" y="152" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <!-- edges -->
    <path d="M 72 112 L 56 136" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 88 112 L 104 136" stroke="#446688" stroke-width="1.3" fill="none"/>
    <!-- annotations -->
    <text x="35" y="172" font-size="9" fill="#d6a040" font-weight="bold">叶2=Tree0根</text>
    <text x="95" y="172" font-size="9" fill="#d6a040" font-weight="bold">叶5=Tree2根</text>
  </g>

  <!-- arrow step1->step2 -->
  <path d="M 150 124 L 180 124" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
  <text x="165" y="118" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">替换</text>
  <text x="165" y="134" text-anchor="middle" font-size="8" fill="#4a7a3a">左叶</text>

  <!-- ===== Step 2: after first merge (left) ===== -->
  <text x="270" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② 合并 Tree0 到左叶（值 2）</text>
  <g font-size="12" filter="url(#rough2)">
    <!-- root 3 -->
    <circle cx="270" cy="100" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="270" y="105" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <!-- node 2 (was leaf, now subtree root) -->
    <circle cx="240" cy="148" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="240" y="152" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <!-- leaf 1 -->
    <circle cx="215" cy="192" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="215" y="196" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <!-- leaf 5 (still leaf) -->
    <circle cx="300" cy="148" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="300" y="152" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <!-- edges -->
    <path d="M 262 112 L 246 136" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 278 112 L 294 136" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 232 160 L 218 182" stroke="#446688" stroke-width="1.3" fill="none"/>
    <!-- annotation -->
    <text x="215" y="212" font-size="9" fill="#888">叶1无匹配</text>
    <text x="300" y="172" font-size="9" fill="#d6a040" font-weight="bold">叶5=Tree2根</text>
  </g>

  <!-- arrow step2->step3 -->
  <path d="M 340 124 L 370 124" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
  <text x="355" y="118" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">替换</text>
  <text x="355" y="134" text-anchor="middle" font-size="8" fill="#4a7a3a">右叶</text>

  <!-- ===== Step 3: final tree ===== -->
  <text x="460" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 合并 Tree2 到右叶（值 5）</text>
  <g font-size="12" filter="url(#rough2)">
    <!-- root 3 -->
    <circle cx="460" cy="100" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="460" y="105" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <!-- node 2 -->
    <circle cx="430" cy="148" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="430" y="152" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <!-- leaf 1 -->
    <circle cx="405" cy="192" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="405" y="196" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <!-- node 5 (was leaf, now subtree root) -->
    <circle cx="490" cy="148" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="490" y="152" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <!-- leaf 4 -->
    <circle cx="465" cy="192" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="465" y="196" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <!-- edges -->
    <path d="M 452 112 L 436 136" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 468 112 L 484 136" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 422 160 L 408 182" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 482 160 L 468 182" stroke="#446688" stroke-width="1.3" fill="none"/>
    <!-- annotation -->
    <text x="465" y="212" font-size="9" fill="#888">叶4无匹配</text>
  </g>

  <!-- ===== Validation table ===== -->
  <line x1="30" y1="232" x2="530" y2="232" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ 上下界递归验证 BST</text>

  <g font-size="10" filter="url(#rough2)">
    <!-- header -->
    <rect x="30" y="264" width="500" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="60" y="279" text-anchor="middle" fill="#446688" font-weight="bold">节点</text>
    <text x="160" y="279" text-anchor="middle" fill="#446688" font-weight="bold">区间 (lo, hi)</text>
    <text x="300" y="279" text-anchor="middle" fill="#446688" font-weight="bold">值</text>
    <text x="380" y="279" text-anchor="middle" fill="#446688" font-weight="bold">判定</text>
    <text x="470" y="279" text-anchor="middle" fill="#446688" font-weight="bold">来源</text>

    <!-- row: node 3 -->
    <rect x="30" y="286" width="500" height="20" fill="#fff" stroke="#ccc" stroke-width="0.8"/>
    <text x="60" y="300" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="160" y="300" text-anchor="middle" fill="#555">(−∞, +∞)</text>
    <text x="300" y="300" text-anchor="middle" fill="#555">3</text>
    <text x="380" y="300" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="470" y="300" text-anchor="middle" font-size="9" fill="#888">Tree1 根</text>

    <!-- row: node 2 -->
    <rect x="30" y="306" width="500" height="20" fill="#fff" stroke="#ccc" stroke-width="0.8"/>
    <text x="60" y="320" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="160" y="320" text-anchor="middle" fill="#555">(−∞, 3)</text>
    <text x="300" y="320" text-anchor="middle" fill="#555">2</text>
    <text x="380" y="320" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="470" y="320" text-anchor="middle" font-size="9" fill="#888">Tree0 根</text>

    <!-- row: node 1 -->
    <rect x="30" y="326" width="500" height="20" fill="#fff" stroke="#ccc" stroke-width="0.8"/>
    <text x="60" y="340" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <text x="160" y="340" text-anchor="middle" fill="#555">(−∞, 2)</text>
    <text x="300" y="340" text-anchor="middle" fill="#555">1</text>
    <text x="380" y="340" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="470" y="340" text-anchor="middle" font-size="9" fill="#888">Tree0 叶</text>

    <!-- row: node 5 -->
    <rect x="30" y="346" width="500" height="20" fill="#fff" stroke="#ccc" stroke-width="0.8"/>
    <text x="60" y="360" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="160" y="360" text-anchor="middle" fill="#555">(3, +∞)</text>
    <text x="300" y="360" text-anchor="middle" fill="#555">5</text>
    <text x="380" y="360" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="470" y="360" text-anchor="middle" font-size="9" fill="#888">Tree2 根</text>

    <!-- row: node 4 -->
    <rect x="30" y="366" width="500" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="60" y="380" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <text x="160" y="380" text-anchor="middle" fill="#555">(3, 5)</text>
    <text x="300" y="380" text-anchor="middle" fill="#555">4</text>
    <text x="380" y="380" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="470" y="380" text-anchor="middle" font-size="9" fill="#888">Tree2 叶</text>
  </g>

  <!-- ===== Result ===== -->
  <rect x="30" y="396" width="500" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">used = {3, 2, 5}，size = 3 = n ✓ | 验证全部通过 ✓</text>
  <text x="280" y="434" text-anchor="middle" font-size="10" fill="#555">返回根节点（值 3），最终 BST：3 / \ 2 5 / / 1 4</text>
</svg>
