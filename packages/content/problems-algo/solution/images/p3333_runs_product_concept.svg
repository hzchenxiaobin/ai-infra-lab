<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">长按只发生在「连续同字符段」内：原串 ↔ 每段保留个数</text>
  <text x="260" y="42" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">以 word = aabbccdd（示例 1）为例：切成 4 段，段长 c₁ = c₂ = c₃ = c₄ = 2</text>

  <!-- ===== 四个 run 分组 ===== -->
  <!-- run1: aa -->
  <rect x="70" y="58" width="68" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="77" y="67" width="26" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="109" y="67" width="26" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="86" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="122" y="86" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <!-- run2: bb -->
  <rect x="146" y="58" width="68" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="153" y="67" width="26" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="185" y="67" width="26" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="166" y="86" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="198" y="86" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <!-- run3: cc -->
  <rect x="222" y="58" width="68" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="229" y="67" width="26" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="261" y="67" width="26" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="86" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="274" y="86" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <!-- run4: dd -->
  <rect x="298" y="58" width="68" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="305" y="67" width="26" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="337" y="67" width="26" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="318" y="86" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="350" y="86" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">d</text>

  <!-- 右侧说明 -->
  <text x="380" y="70" font-size="8.5" fill="#888" filter="url(#rough2)">长按只会把某一段</text>
  <text x="380" y="84" font-size="8.5" fill="#888" filter="url(#rough2)">「拉长」，不会改变</text>
  <text x="380" y="98" font-size="8.5" fill="#888" filter="url(#rough2)">字符顺序、也不会跨段</text>

  <!-- 每段保留个数 -->
  <text x="260" y="126" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">每段独立决定保留 tᵢ 个（1 ≤ tᵢ ≤ cᵢ）→ 2 × 2 × 2 × 2 = 16 种保留方案</text>

  <!-- 具体例子 t = (2,1,2,1) -->
  <text x="96" y="178" font-size="9.5" fill="#666" filter="url(#rough2)">例如 t = (2, 1, 2, 1)：</text>
  <path d="M 240 168 L 268 168" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="278" y="158" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="290" y="176" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="304" y="158" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="176" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="330" y="158" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="342" y="176" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="356" y="158" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="176" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="382" y="158" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="394" y="176" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="408" y="158" width="24" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="446" y="176" font-size="8.5" fill="#888" filter="url(#rough2)">Σtᵢ=6</text>

  <!-- 双射说明框 -->
  <rect x="60" y="200" width="400" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">双射：保留方案 (t₁, …, t_m) 与原字符串一一对应</text>
  <text x="260" y="238" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">字符顺序固定，两个方案只要有一段长度不同 ⇒ 字符串必不同；</text>
  <text x="260" y="248" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">反之任何能打出 word 的原串，逐段保留个数必落在 1…cᵢ 内</text>

  <!-- 乘法原理 + 补集 -->
  <rect x="60" y="262" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="10" fill="#a05a20" font-weight="bold" filter="url(#rough2)">乘法原理：无约束总方案 = ∏ cᵢ = 16</text>
  <text x="260" y="300" text-anchor="middle" font-size="9" fill="#a05a20" filter="url(#rough2)">长度约束 Σ tᵢ ≥ k ⟹ 答案 = ∏ cᵢ − #{Σ tᵢ ≤ k−1}（正难则反）</text>
  <text x="260" y="313" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">k = 7 时：16 − #{Σ tᵢ ≤ 6} = 16 − 11 = 5 ✓</text>

  <text x="260" y="342" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">本例 m = 4 &lt; k = 7，必须减掉「太短」的方案 ——「太短」怎么算，看下一张图</text>
</svg>
