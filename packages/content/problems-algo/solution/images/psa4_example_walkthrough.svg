<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：6 笔销售 → 2 位用户 → 消费最多者 = 102</text>

  <!-- Step 1: JOIN & compute amount per sale -->
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① JOIN 取单价，算每笔金额 amount = quantity × price</text>

  <rect x="40" y="58" width="540" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="73" text-anchor="middle" font-size="9" fill="#446688">sale_id</text>
  <text x="150" y="73" text-anchor="middle" font-size="9" fill="#446688">product_id</text>
  <text x="230" y="73" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="300" y="73" text-anchor="middle" font-size="9" fill="#446688">quantity</text>
  <text x="390" y="73" text-anchor="middle" font-size="9" fill="#4a7a3a">price</text>
  <text x="510" y="73" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">amount</text>

  <!-- user 101 rows shaded red-ish, user 102 rows shaded green-ish -->
  <rect x="40" y="80" width="540" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="93" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="150" y="93" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="230" y="93" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <text x="300" y="93" text-anchor="middle" font-size="9" fill="#333">10</text>
  <text x="390" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a">10</text>
  <text x="510" y="93" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">10×10 = 100</text>

  <rect x="40" y="98" width="540" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="111" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="150" y="111" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="230" y="111" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <text x="300" y="111" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="390" y="111" text-anchor="middle" font-size="9" fill="#4a7a3a">15</text>
  <text x="510" y="111" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">7×15 = 105</text>

  <rect x="40" y="116" width="540" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="129" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="150" y="129" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="230" y="129" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">102</text>
  <text x="300" y="129" text-anchor="middle" font-size="9" fill="#333">9</text>
  <text x="390" y="129" text-anchor="middle" font-size="9" fill="#4a7a3a">10</text>
  <text x="510" y="129" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">9×10 = 90</text>

  <rect x="40" y="134" width="540" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="147" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="150" y="147" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="230" y="147" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">102</text>
  <text x="300" y="147" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="390" y="147" text-anchor="middle" font-size="9" fill="#4a7a3a">25</text>
  <text x="510" y="147" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">6×25 = 150</text>

  <rect x="40" y="152" width="540" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="165" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="150" y="165" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="230" y="165" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">102</text>
  <text x="300" y="165" text-anchor="middle" font-size="9" fill="#333">10</text>
  <text x="390" y="165" text-anchor="middle" font-size="9" fill="#4a7a3a">15</text>
  <text x="510" y="165" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">10×15 = 150</text>

  <rect x="40" y="170" width="540" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="183" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="150" y="183" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="230" y="183" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">102</text>
  <text x="300" y="183" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="390" y="183" text-anchor="middle" font-size="9" fill="#4a7a3a">10</text>
  <text x="510" y="183" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">6×10 = 60</text>

  <line x1="115" y1="58" x2="115" y2="188" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="190" y1="58" x2="190" y2="188" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="270" y1="58" x2="270" y2="188" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="340" y1="58" x2="340" y2="188" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="450" y1="58" x2="450" y2="188" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="40" y1="80" x2="580" y2="80" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="40" y="58" width="540" height="130" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Step 2: group by user_id -->
  <path d="M310 192 L310 212" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="206" text-anchor="start" font-size="9" fill="#b85450" font-weight="bold">② GROUP BY user_id，SUM(amount)</text>

  <!-- Two user buckets -->
  <text x="170" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">用户 101</text>
  <rect x="70" y="240" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="254" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">100</text>
  <text x="200" y="254" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">105</text>
  <path d="M170 260 L170 282" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="80" y="286" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="303" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Σ = 205</text>

  <text x="450" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">用户 102</text>
  <rect x="350" y="240" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="254" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">90</text>
  <text x="437" y="254" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">150</text>
  <text x="487" y="254" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">150</text>
  <text x="537" y="254" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">60</text>
  <path d="M450 260 L450 282" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="360" y="286" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="450" y="303" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Σ = 450</text>

  <!-- Step 3: compare & pick max -->
  <path d="M170 314 L170 336" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M450 314 L450 336" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="310" y="338" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 比总额：450 &gt; 205 → 取最大者</text>

  <rect x="210" y="348" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="366" text-anchor="middle" font-size="10" fill="#446688">ORDER BY total DESC LIMIT 1</text>

  <path d="M310 376 L310 396" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="230" y="400" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="418" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">user_id = 102</text>
</svg>
