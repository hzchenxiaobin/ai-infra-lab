<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：subst × expand 相互递归 + 记忆化</text>
  <text x="310" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">① 建表 val ← {key: value}，memo ← {}　② subst(text) 从左到右扫描拼接</text>

  <!-- subst container -->
  <g filter="url(#rough2)">
    <rect x="90" y="50" width="380" height="140" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="8"/>
    <text x="280" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">subst(s)：从左到右扫描，拼出 res</text>
  </g>
  <g filter="url(#rough2)">
    <polygon points="280,80 342,106 280,132 218,106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="110" text-anchor="middle" font-size="9.5" fill="#333">s[i] == '%' ?</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="118" y="146" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="183" y="163" text-anchor="middle" font-size="8.5" fill="#33506b">字面量：res += s[i++]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="254" y="146" width="132" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="320" y="163" text-anchor="middle" font-size="8.5" fill="#2f5d24">占位符：res += expand(key)</text>
  </g>
  <path d="M 272 130 C 246 138 220 142 200 144" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 288 130 C 312 138 336 142 352 144" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="240" y="140" text-anchor="middle" font-size="8" fill="#55677d" filter="url(#rough2)">否</text>
  <text x="322" y="138" text-anchor="middle" font-size="8" fill="#55677d" filter="url(#rough2)">是</text>
  <path d="M 183 174 L 183 182 L 108 182 L 108 106 L 212 106" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="146" y="178" text-anchor="middle" font-size="8" fill="#8a6d1f" filter="url(#rough2)">i++</text>

  <!-- call arrow subst -> expand -->
  <path d="M 320 174 L 320 226" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="312" y="196" text-anchor="end" font-size="8" fill="#2f5d24" filter="url(#rough2)">调用 expand(key)</text>

  <!-- expand container -->
  <g filter="url(#rough2)">
    <rect x="90" y="204" width="380" height="104" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="8"/>
    <text x="200" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">expand(key)：先查 memo，未命中才展开</text>
  </g>
  <g filter="url(#rough2)">
    <polygon points="320,230 372,256 320,282 268,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="260" text-anchor="middle" font-size="9" fill="#333">memo 命中？</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="100" y="230" width="144" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="172" y="247" text-anchor="middle" font-size="8.5" fill="#2f5d24">是：直接返回 memo[key]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="100" y="272" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="185" y="287" text-anchor="middle" font-size="8.5" fill="#33506b">否：memo[key] = subst(val[key])</text>
  </g>
  <path d="M 268 250 C 258 249 252 248 248 247" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 296 270 C 284 276 276 282 274 285" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- recursion arrow expand -> subst -->
  <path d="M 100 284 L 78 284 L 78 108 L 86 108" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="42" y="192" text-anchor="middle" font-size="8" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">相互递归</text>
  <text x="42" y="206" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">subst(val[key])</text>

  <!-- final -->
  <path d="M 310 308 L 310 316" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="200" y="318" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
    <text x="310" y="337" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">③ 递归全部返回 → 返回最终文本</text>
  </g>

  <!-- right annotations -->
  <g filter="url(#rough2)">
    <path d="M 500 100 L 472 100" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>
    <text x="545" y="86" text-anchor="middle" font-size="8.5" fill="#55677d">split('%')：</text>
    <text x="545" y="100" text-anchor="middle" font-size="8.5" fill="#55677d">偶数段 = 字面量</text>
    <text x="545" y="114" text-anchor="middle" font-size="8.5" fill="#55677d">奇数段 = 键</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 500 194 L 326 194" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>
    <text x="545" y="180" text-anchor="middle" font-size="8.5" fill="#55677d">expand(C)</text>
    <text x="545" y="194" text-anchor="middle" font-size="8.5" fill="#55677d">→ subst("abc%B%")</text>
    <text x="545" y="208" text-anchor="middle" font-size="8.5" fill="#55677d">→ expand(B)…</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 500 287 L 472 287" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>
    <text x="545" y="283" text-anchor="middle" font-size="8.5" fill="#55677d">memo：每个键</text>
    <text x="545" y="297" text-anchor="middle" font-size="8.5" fill="#55677d">只展开一次</text>
  </g>

  <text x="310" y="368" text-anchor="middle" font-size="9" fill="#55677d" filter="url(#rough2)">时间 / 空间 O(M + L)（L = 展开总规模）；递归深度 = 最长依赖链 ≤ 键数</text>
</svg>
