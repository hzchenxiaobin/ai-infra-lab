<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Floyd-Warshall 传递闭包：以 k 为中转</text>

  <!-- Three nodes i, k, j in a triangle -->
  <!-- k on top, i bottom-left, j bottom-right -->
  <circle cx="280" cy="96" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">k</text>
  <text x="280" y="74" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">中转点</text>

  <circle cx="120" cy="220" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="226" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">i</text>

  <circle cx="440" cy="220" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="226" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">j</text>

  <!-- edges i->k and k->j -->
  <path d="M 142 202 L 258 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 302 116 L 418 202" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">reach[i][k]</text>
  <text x="380" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">reach[k][j]</text>

  <!-- direct i->j (dashed, may or may not exist) -->
  <path d="M 146 220 L 414 220" stroke="#b85450" stroke-width="1.6" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">reach[i][j] |= (reach[i][k] &amp; reach[k][j])</text>

  <!-- formula box -->
  <rect x="60" y="268" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">三重循环：for k → for i → for j</text>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#444">枚举中转点 k，若 i 能到 k 且 k 能到 j，则 i 也能到 j</text>

  <!-- step boxes -->
  <rect x="60" y="328" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="120" y="346" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">1. 初始化</text>
  <text x="120" y="360" text-anchor="middle" font-size="10" fill="#666">reach[a][b]=直接边</text>

  <rect x="220" y="328" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">2. Floyd 松弛</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#666">O(V³) 三重循环</text>

  <rect x="380" y="328" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="440" y="346" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">3. 回答查询</text>
  <text x="440" y="360" text-anchor="middle" font-size="10" fill="#666">reach[u][v] O(1)</text>

  <!-- arrows between steps -->
  <path d="M 180 348 L 220 348" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 348 L 380 348" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
