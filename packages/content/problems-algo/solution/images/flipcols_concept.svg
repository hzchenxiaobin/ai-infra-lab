<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">按列翻转：两行同变全等 ⇔ 相同或互补</text>

  <!-- Panel A: identical rows -->
  <rect x="20" y="44" width="520" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">相同行：翻转 0 所在列 → 两行同变全 1</text>

  <text x="40" y="104" font-size="11" fill="#888">原矩阵</text>
  <text x="40" y="128" font-size="10" fill="#888">r1</text>
  <rect x="70" y="114" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="106" y="114" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="131" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="142" y="114" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <text x="40" y="160" font-size="10" fill="#888">r2</text>
  <rect x="70" y="146" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="163" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="106" y="146" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="163" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="142" y="146" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="163" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <line x1="190" y1="140" x2="222" y2="140" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="132" text-anchor="middle" font-size="10" fill="#666">翻转</text>
  <text x="206" y="156" text-anchor="middle" font-size="10" fill="#b85450">列1</text>

  <text x="250" y="104" font-size="11" fill="#888">翻转后</text>
  <text x="250" y="128" font-size="10" fill="#888">r1</text>
  <rect x="280" y="114" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="316" y="114" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="352" y="114" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <text x="250" y="160" font-size="10" fill="#888">r2</text>
  <rect x="280" y="146" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="163" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="316" y="146" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="163" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="352" y="146" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="163" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <text x="430" y="132" font-size="11" fill="#4a7a3a" font-weight="bold">两行全等 ✓</text>
  <text x="430" y="150" font-size="10" fill="#888">a[j]⊕b[j]≡0</text>

  <!-- Panel B: complementary rows -->
  <rect x="20" y="194" width="520" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">互补行：翻转某组列 → 一行全 0、一行全 1</text>

  <text x="40" y="254" font-size="11" fill="#888">原矩阵</text>
  <text x="40" y="278" font-size="10" fill="#888">r1</text>
  <rect x="70" y="264" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="106" y="264" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="281" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="142" y="264" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <text x="40" y="310" font-size="10" fill="#888">r2</text>
  <rect x="70" y="296" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="106" y="296" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="313" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="142" y="296" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <line x1="190" y1="290" x2="222" y2="290" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="282" text-anchor="middle" font-size="10" fill="#666">翻转</text>
  <text x="206" y="306" text-anchor="middle" font-size="10" fill="#b85450">列1</text>

  <text x="250" y="254" font-size="11" fill="#888">翻转后</text>
  <text x="250" y="278" font-size="10" fill="#888">r1</text>
  <rect x="280" y="264" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="316" y="264" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="352" y="264" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <text x="250" y="310" font-size="10" fill="#888">r2</text>
  <rect x="280" y="296" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="316" y="296" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="352" y="296" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <text x="430" y="282" font-size="11" fill="#446688" font-weight="bold">两行全等 ✓</text>
  <text x="430" y="300" font-size="10" fill="#888">a[j]⊕b[j]≡1</text>

  <!-- conclusion box -->
  <rect x="20" y="344" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="362" font-size="11" fill="#555">同变全等 ⇔</text>
  <text x="120" y="362" font-size="11" fill="#4a7a3a" font-weight="bold">a[j]⊕b[j] 恒定</text>
  <text x="248" y="362" font-size="11" fill="#555">→ 恒 0 相同 / 恒 1 互补，按等价类计数取最大</text>
</svg>
