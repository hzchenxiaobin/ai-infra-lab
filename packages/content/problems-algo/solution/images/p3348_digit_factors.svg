<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">数位 1~9 的质因子分解 —— 乘积的世界只有 2、3、5、7</text>

  <!-- 9 个数位格子：29 起步，宽 46，间 6 -->
  <!-- 1 -->
  <rect x="29" y="52" width="46" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="76" text-anchor="middle" font-size="17" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="52" y="96" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">= 1（白占位）</text>
  <!-- 2 -->
  <rect x="81" y="52" width="46" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="104" y="76" text-anchor="middle" font-size="17" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="104" y="96" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">= 2</text>
  <!-- 3 -->
  <rect x="133" y="52" width="46" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="156" y="76" text-anchor="middle" font-size="17" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="156" y="96" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">= 3</text>
  <!-- 4 -->
  <rect x="185" y="52" width="46" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="208" y="76" text-anchor="middle" font-size="17" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="208" y="96" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">= 2²</text>
  <!-- 5 -->
  <rect x="237" y="52" width="46" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="17" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="260" y="96" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">= 5 ★独占</text>
  <!-- 6 -->
  <rect x="289" y="52" width="46" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="312" y="76" text-anchor="middle" font-size="17" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="312" y="96" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">= 2·3 ★双雕</text>
  <!-- 7 -->
  <rect x="341" y="52" width="46" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="364" y="76" text-anchor="middle" font-size="17" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="364" y="96" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">= 7 ★独占</text>
  <!-- 8 -->
  <rect x="393" y="52" width="46" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="416" y="76" text-anchor="middle" font-size="17" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="416" y="96" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">= 2³ ★满载</text>
  <!-- 9 -->
  <rect x="445" y="52" width="46" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="468" y="76" text-anchor="middle" font-size="17" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="468" y="96" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">= 3² ★满载</text>

  <!-- 中部两条要点 -->
  <rect x="30" y="128" width="460" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="46" y="148" font-size="11" fill="#333" filter="url(#rough2)">无零数位的乘积是「7-光滑数」：质因子只有 2、3、5、7。</text>
  <text x="46" y="167" font-size="11" fill="#333" filter="url(#rough2)">t 若含其它质因子（示例 3：26 = 2 × 13）⇒ 永远凑不出，返回 "-1"。</text>

  <path d="M 260 182 L 260 200" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 需求四元组 -->
  <rect x="60" y="204" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="227" text-anchor="middle" font-size="12.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">分解 t = 2^a · 3^b · 5^c · 7^d → 需求向量 (a, b, c, d)</text>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">t ≤ 10¹⁴ ⇒ a≤46, b≤29, c≤20, d≤16（常数级小状态）</text>

  <!-- 底部：名额说明 -->
  <rect x="30" y="278" width="460" height="66" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="46" y="298" font-size="11" fill="#333" filter="url(#rough2)">名额数 slots = c + d + F[a][b]：5 和 7 只有数位 5、7 能提供，各占</text>
  <text x="46" y="316" font-size="11" fill="#333" filter="url(#rough2)">一个名额；2 和 3 由 {2,3,4,6,8,9} 联合供给，F 用小 DP 求，</text>
  <text x="46" y="334" font-size="11" fill="#333" filter="url(#rough2)">t ≤ 10¹⁴ 时 slots ≤ 20 + 16 + 30 = 66 —— m 个自由位能凑出 ⟺ slots ≤ m</text>
</svg>
