<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：前缀/后缀不同字符数，分割点两侧比较</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">s = "aacaba"，分割点 i：左 = s[0..i−1]，右 = s[i..n−1]</text>

  <!-- ===== 字符串盒子，分割点 i=3 ===== -->
  <g font-size="13">
    <!-- 左半 aac 蓝色 -->
    <rect x="80" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="102" y="82" text-anchor="middle" fill="#333">a</text>
    <rect x="128" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="150" y="82" text-anchor="middle" fill="#333">a</text>
    <rect x="176" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="198" y="82" text-anchor="middle" fill="#333">c</text>
    <!-- 右半 aba 绿色 -->
    <rect x="272" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="294" y="82" text-anchor="middle" fill="#333">a</text>
    <rect x="320" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="342" y="82" text-anchor="middle" fill="#333">b</text>
    <rect x="368" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="390" y="82" text-anchor="middle" fill="#333">a</text>
  </g>

  <!-- 分割虚线 i=3 -->
  <line x1="246" y1="56" x2="246" y2="100" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="246" y="50" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=3</text>

  <!-- ===== 左右不同字符集合 ===== -->
  <g font-size="12">
    <rect x="70" y="110" width="170" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="155" y="130" text-anchor="middle" fill="#446688" font-weight="bold">左半不同字符: {a, c}</text>
    <text x="155" y="148" text-anchor="middle" fill="#446688" font-weight="bold" font-size="14">prefix[3] = 2</text>

    <rect x="320" y="110" width="170" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="405" y="130" text-anchor="middle" fill="#4a7a3a" font-weight="bold">右半不同字符: {a, b}</text>
    <text x="405" y="148" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="14">suffix[3] = 2</text>

    <!-- 中间等于号 -->
    <text x="280" y="138" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">==</text>
  </g>

  <!-- ===== prefix / suffix 数组表 ===== -->
  <text x="60" y="184" font-size="11" fill="#666" font-weight="bold">逐分割点比较（i = 1 .. n−1）：</text>

  <!-- 表头：index -->
  <g font-size="11">
    <text x="48" y="208" fill="#888">i</text>
    <rect x="80" y="194" width="44" height="24" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="102" y="210" text-anchor="middle" fill="#666">1</text>
    <rect x="128" y="194" width="44" height="24" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="150" y="210" text-anchor="middle" fill="#666">2</text>
    <rect x="176" y="194" width="44" height="24" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="198" y="210" text-anchor="middle" fill="#666">3</text>
    <rect x="224" y="194" width="44" height="24" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="246" y="210" text-anchor="middle" fill="#666">4</text>
    <rect x="272" y="194" width="44" height="24" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="294" y="210" text-anchor="middle" fill="#666">5</text>
  </g>

  <!-- prefix 行 -->
  <g font-size="11">
    <text x="48" y="246" fill="#446688" font-weight="bold">prefix</text>
    <rect x="80" y="232" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="102" y="248" text-anchor="middle" fill="#333">1</text>
    <rect x="128" y="232" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="150" y="248" text-anchor="middle" fill="#333">1</text>
    <rect x="176" y="232" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="198" y="248" text-anchor="middle" fill="#333">2</text>
    <rect x="224" y="232" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="246" y="248" text-anchor="middle" fill="#333">2</text>
    <rect x="272" y="232" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="294" y="248" text-anchor="middle" fill="#333">3</text>
  </g>

  <!-- suffix 行 -->
  <g font-size="11">
    <text x="48" y="282" fill="#4a7a3a" font-weight="bold">suffix</text>
    <rect x="80" y="268" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="102" y="284" text-anchor="middle" fill="#333">3</text>
    <rect x="128" y="268" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="150" y="284" text-anchor="middle" fill="#333">3</text>
    <rect x="176" y="268" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="198" y="284" text-anchor="middle" fill="#333">2</text>
    <rect x="224" y="268" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="246" y="284" text-anchor="middle" fill="#333">2</text>
    <rect x="272" y="268" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="294" y="284" text-anchor="middle" fill="#333">1</text>
  </g>

  <!-- 高亮 i=3,4 匹配列 -->
  <rect x="174" y="190" width="48" height="106" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="222" y="190" width="48" height="106" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="198" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <text x="246" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <text x="102" y="310" text-anchor="middle" font-size="11" fill="#999">✗</text>
  <text x="150" y="310" text-anchor="middle" font-size="11" fill="#999">✗</text>
  <text x="294" y="310" text-anchor="middle" font-size="11" fill="#999">✗</text>

  <!-- ===== 结论框 ===== -->
  <rect x="40" y="326" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">好分割 ⟺ prefix[i] == suffix[i]</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#333">预算两组「不同字符数」数组，再逐点比较 → O(n)</text>
</svg>
