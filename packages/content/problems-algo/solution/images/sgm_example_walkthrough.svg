<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例 1 演算：k=2, digit1=0, digit2=2 → 答案 20</text>

  <!-- D = {0, 2} -->
  <rect x="40" y="40" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="110" y="59" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">D = {0, 2}，首位 = 2</text>
  <path d="M 110 70 L 110 84" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: init queue -->
  <rect x="40" y="86" width="480" height="40" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="104" font-size="10.5" fill="#888" font-weight="bold">步骤 ① 初始化</text>
  <rect x="50" y="108" width="80" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="120" text-anchor="middle" font-size="10" fill="#333">n=2, r=0</text>
  <text x="140" y="120" font-size="9.5" fill="#888">← 入队首位 2，余数 2%2=0，不标记 visited</text>

  <!-- Step 2: pop (2, 0) -->
  <rect x="40" y="136" width="480" height="64" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="154" font-size="10.5" fill="#888" font-weight="bold">步骤 ② 弹出 (2, 0)</text>
  <rect x="50" y="158" width="120" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="171" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">r=0，但 2 ≤ k=2</text>
  <text x="180" y="171" font-size="9.5" fill="#888">不返回，继续扩展</text>

  <text x="50" y="190" font-size="9.5" fill="#555">扩展：+0 → 20, r=0；+2 → 22, r=0</text>

  <!-- Step 3: pop (20, 0) -->
  <rect x="40" y="210" width="480" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="228" font-size="10.5" fill="#888" font-weight="bold">步骤 ③ 弹出 (20, 0)</text>
  <rect x="50" y="232" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">r=0 且 20 > 2 ✓ 命中！</text>
  <text x="220" y="246" font-size="9.5" fill="#4a7a3a">return 20</text>

  <!-- queue state visualization -->
  <text x="40" y="288" font-size="10.5" fill="#555" font-weight="bold">队列状态变化：</text>

  <!-- Queue step 1 -->
  <rect x="40" y="296" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="312" text-anchor="middle" font-size="10" fill="#333">(2,0)</text>
  <text x="40" y="338" font-size="9" fill="#888">步骤①后</text>

  <path d="M 120 308 L 140 308" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Queue step 2: pop 2, add 20, 22 -->
  <rect x="140" y="296" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="312" text-anchor="middle" font-size="10" fill="#333">(20,0)</text>
  <rect x="210" y="296" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="312" text-anchor="middle" font-size="10" fill="#333">(22,0)</text>
  <text x="150" y="338" font-size="9" fill="#888">步骤②后（弹出2，加入20,22）</text>

  <path d="M 270 308 L 290 308" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- Queue step 3: pop 20 → return -->
  <rect x="290" y="296" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">命中!</text>
  <text x="300" y="338" font-size="9" fill="#4a7a3a">步骤③弹出20 → 返回</text>

  <!-- key insight box -->
  <rect x="40" y="356" width="480" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">关键：余数 0 不标记 visited</text>
  <text x="280" y="388" text-anchor="middle" font-size="9.5" fill="#888">2 的余数为 0 但 ≤ k，不锁定才能继续扩展到 20</text>
</svg>
