<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：searchWord 与每个单词开头逐字符对齐</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">sentence = "i love eating burger"，searchWord = "burg"</text>

  <!-- Word index labels -->
  <text x="116" y="62" text-anchor="middle" font-size="10.5" fill="#888">下标 1</text>
  <text x="236" y="62" text-anchor="middle" font-size="10.5" fill="#888">下标 2</text>
  <text x="356" y="62" text-anchor="middle" font-size="10.5" fill="#888">下标 3</text>
  <text x="476" y="62" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">下标 4</text>

  <!-- Word boxes row: w=96, gap=24, start x=68, y=68, h=34 -->
  <rect x="68" y="68" width="96" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="116" y="90" text-anchor="middle" font-size="13" fill="#333">i</text>

  <rect x="188" y="68" width="96" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="236" y="90" text-anchor="middle" font-size="13" fill="#333">love</text>

  <rect x="308" y="68" width="96" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="356" y="90" text-anchor="middle" font-size="13" fill="#333">eating</text>

  <!-- word 4 highlighted green -->
  <rect x="428" y="68" width="96" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="476" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">burger</text>

  <!-- Per-word first-char compare result -->
  <text x="116" y="124" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="116" y="140" text-anchor="middle" font-size="10" fill="#b85450">i ≠ b</text>

  <text x="236" y="124" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="236" y="140" text-anchor="middle" font-size="10" fill="#b85450">l ≠ b</text>

  <text x="356" y="124" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="356" y="140" text-anchor="middle" font-size="10" fill="#b85450">e ≠ b</text>

  <text x="476" y="124" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="476" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">前缀命中</text>

  <!-- separator -->
  <path d="M 60 158 L 560 158" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="5,5" fill="none" filter="url(#rough2)"/>

  <!-- Alignment detail for word 4 -->
  <text x="310" y="178" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">逐字符对齐（单词 4 "burger" vs "burg"）</text>

  <!-- row labels -->
  <text x="194" y="207" text-anchor="end" font-size="11" fill="#666">单词</text>
  <text x="194" y="247" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">检索词</text>

  <!-- "burger" cells: 6 cells x 36, start x=200, y=192, h=30 -->
  <rect x="200" y="192" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="218" y="212" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="236" y="192" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="254" y="212" text-anchor="middle" font-size="13" fill="#333">u</text>
  <rect x="272" y="192" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="212" text-anchor="middle" font-size="13" fill="#333">r</text>
  <rect x="308" y="192" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="326" y="212" text-anchor="middle" font-size="13" fill="#333">g</text>
  <rect x="344" y="192" width="36" height="30" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="362" y="212" text-anchor="middle" font-size="13" fill="#aaa">e</text>
  <rect x="380" y="192" width="36" height="30" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="398" y="212" text-anchor="middle" font-size="13" fill="#aaa">r</text>

  <!-- "burg" cells: 4 cells x 36, start x=200, y=232, h=30, green (aligned at left) -->
  <rect x="200" y="232" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="218" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="236" y="232" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="254" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">u</text>
  <rect x="272" y="232" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
  <rect x="308" y="232" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="326" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>

  <!-- match ticks under the 4 aligned chars -->
  <text x="218" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="254" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="290" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="326" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- bottom note -->
  <rect x="60" y="300" width="500" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="320" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">searchWord 是某单词前缀 ⟺ 该单词前 m 个字符与 searchWord 逐字符相同</text>
  <text x="310" y="338" text-anchor="middle" font-size="10.5" fill="#888">（m = len(searchWord)；只对齐单词开头比对，无需切分整句）</text>
</svg>
