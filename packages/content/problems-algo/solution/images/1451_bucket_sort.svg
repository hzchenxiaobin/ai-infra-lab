<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">桶排序：按长度分桶，原序入桶即稳定</text>

  <!-- 原序遍历 -->
  <text x="40" y="62" font-size="12" fill="#666" font-weight="bold">原序遍历</text>
  <g filter="url(#rough2)">
    <rect x="40" y="70" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="78" y="91" text-anchor="middle" font-size="12" fill="#333">keep</text>
    <rect x="124" y="70" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="162" y="91" text-anchor="middle" font-size="12" fill="#333">calm</text>
    <rect x="208" y="70" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="246" y="91" text-anchor="middle" font-size="12" fill="#333">and</text>
    <rect x="292" y="70" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="330" y="91" text-anchor="middle" font-size="12" fill="#333">code</text>
    <rect x="376" y="70" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="414" y="91" text-anchor="middle" font-size="12" fill="#333">on</text>
  </g>

  <!-- 单箭头 -->
  <path d="M 280 108 L 280 140" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="292" y="130" font-size="11" fill="#446688" font-weight="bold">按长度入桶</text>

  <!-- 桶 len=2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="150" width="110" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" rx="6"/>
    <text x="95" y="170" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">桶 len=2</text>
    <rect x="60" y="182" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="95" y="203" text-anchor="middle" font-size="12" fill="#333">on</text>
  </g>

  <!-- 桶 len=3 -->
  <g filter="url(#rough2)">
    <rect x="170" y="150" width="130" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" rx="6"/>
    <text x="235" y="170" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">桶 len=3</text>
    <rect x="200" y="182" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="235" y="203" text-anchor="middle" font-size="12" fill="#333">and</text>
  </g>

  <!-- 桶 len=4 -->
  <g filter="url(#rough2)">
    <rect x="320" y="150" width="200" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" rx="6"/>
    <text x="420" y="170" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">桶 len=4</text>
    <rect x="332" y="182" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="360" y="203" text-anchor="middle" font-size="12" fill="#333">keep</text>
    <rect x="392" y="182" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="420" y="203" text-anchor="middle" font-size="12" fill="#333">calm</text>
    <rect x="452" y="182" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="480" y="203" text-anchor="middle" font-size="12" fill="#333">code</text>
  </g>

  <!-- 升序取尽 -->
  <text x="40" y="262" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">升序取尽各桶</text>
  <path d="M 280 244 L 280 268" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 输出 -->
  <g filter="url(#rough2)">
    <rect x="40" y="278" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="78" y="299" text-anchor="middle" font-size="12" fill="#333">on</text>
    <rect x="124" y="278" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="162" y="299" text-anchor="middle" font-size="12" fill="#333">and</text>
    <rect x="208" y="278" width="76" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="246" y="299" text-anchor="middle" font-size="12" fill="#333">keep</text>
    <rect x="292" y="278" width="76" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="330" y="299" text-anchor="middle" font-size="12" fill="#333">calm</text>
    <rect x="376" y="278" width="76" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="414" y="299" text-anchor="middle" font-size="12" fill="#333">code</text>
  </g>

  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同桶内保原序 → 天然稳定，无需任何比较</text>
</svg>
