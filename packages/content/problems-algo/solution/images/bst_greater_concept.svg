<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">反序中序（右→根→左）= 降序，边遍历边累加</text>

  <!-- 左：原 BST -->
  <text x="40" y="58" font-size="12" fill="#888">原 BST：</text>

  <!-- 树枝 -->
  <line x1="158" y1="102" x2="200" y2="148" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="142" y1="102" x2="100" y2="148" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="92" y1="172" x2="60" y2="218" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 节点 3 (根, ②) -->
  <circle cx="150" cy="90" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="176" y="84" font-size="10" fill="#b85450" font-weight="bold">②</text>

  <!-- 节点 2 (③) -->
  <circle cx="100" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="122" y="156" font-size="10" fill="#b85450" font-weight="bold">③</text>

  <!-- 节点 4 (①, 先访问) -->
  <circle cx="200" cy="160" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="164" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="222" y="156" font-size="10" fill="#d6a040" font-weight="bold">①</text>

  <!-- 节点 1 (④) -->
  <circle cx="60" cy="230" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="234" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="78" y="226" font-size="10" fill="#b85450" font-weight="bold">④</text>

  <!-- 右：反序中序序列 + 累加 -->
  <text x="300" y="58" font-size="12" fill="#888">反序中序序列（降序）：</text>

  <!-- 序列方格 4 3 2 1 -->
  <rect x="300" y="68" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <path d="M 344 82 L 358 82" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="362" y="68" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="384" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <path d="M 406 82 L 420 82" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="424" y="68" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="87" text-anchor="middle" font-size="11" fill="#333">2</text>
  <path d="M 468 82 L 482 82" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="486" y="68" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="508" y="87" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- 累加和行 -->
  <text x="300" y="120" font-size="12" fill="#888">滚动累加和 sum：</text>

  <rect x="300" y="128" width="44" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="145" text-anchor="middle" font-size="10" fill="#555">0+4</text>
  <path d="M 344 140 L 358 140" stroke="#888" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="362" y="128" width="44" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="384" y="145" text-anchor="middle" font-size="10" fill="#555">4+3</text>
  <path d="M 406 140 L 420 140" stroke="#888" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="424" y="128" width="44" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="145" text-anchor="middle" font-size="10" fill="#555">7+2</text>
  <path d="M 468 140 L 482 140" stroke="#888" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="486" y="128" width="44" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="508" y="145" text-anchor="middle" font-size="10" fill="#555">9+1</text>

  <!-- 新值行 -->
  <text x="300" y="178" font-size="12" fill="#888">写回新值：</text>

  <rect x="300" y="186" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <rect x="362" y="186" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="384" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>

  <rect x="424" y="186" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="446" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>

  <rect x="486" y="186" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="508" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>

  <!-- 从序列到新值的虚线指引 -->
  <path d="M 322 96 L 322 186" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 384 96 L 384 186" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 446 96 L 446 186" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 508 96 L 508 186" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="40" y="300" width="500" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="324" font-size="12" fill="#333" font-weight="bold">核心：访问到某节点时，sum 已累加好「所有比它大的值」</text>
  <text x="60" y="344" font-size="11" fill="#555">写回时机在 sum += node.val 之后 ⇒ 新值 = (更大值之和) + 自身</text>
  <text x="60" y="362" font-size="11" fill="#b85450" font-weight="bold">一个滚动 sum 即可，无需额外数组，时间 O(n)</text>
</svg>
