<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums=[3,1,5,6,4,2] + 哨兵 0</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">prefix=[0,3,4,9,15,19,21]　栈存下标，对应值递增</text>

  <!-- Table header -->
  <g filter="url(#rough2)" font-size="10.5" fill="#555" font-weight="bold">
    <rect x="20" y="56" width="580" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="38" y="73" text-anchor="start">i</text>
    <text x="70" y="73" text-anchor="start">nums[i]</text>
    <text x="130" y="73" text-anchor="start">动作</text>
    <text x="300" y="73" text-anchor="start">栈(下标)</text>
    <text x="400" y="73" text-anchor="start">结算 sum</text>
    <text x="520" y="73" text-anchor="start">product</text>
  </g>

  <!-- Row i=0 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="84" width="580" height="24" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="38" y="100" text-anchor="start">0</text>
    <text x="70" y="100" text-anchor="start">3</text>
    <text x="130" y="100" text-anchor="start">栈空，入栈</text>
    <text x="300" y="100" text-anchor="start" fill="#446688">[0]</text>
    <text x="400" y="100" text-anchor="start" fill="#aaa">—</text>
    <text x="520" y="100" text-anchor="start" fill="#aaa">—</text>
  </g>

  <!-- Row i=1: pop 0 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="110" width="580" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="38" y="126" text-anchor="start">1</text>
    <text x="70" y="126" text-anchor="start" fill="#b85450">1</text>
    <text x="130" y="126" text-anchor="start" fill="#b85450">3&gt;1 弹0；入栈1</text>
    <text x="300" y="126" text-anchor="start" fill="#446688">[1]</text>
    <text x="400" y="126" text-anchor="start">prefix[1]−0 = 3</text>
    <text x="520" y="126" text-anchor="start" fill="#888">3×3=9</text>
  </g>

  <!-- Row i=2 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="136" width="580" height="24" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="38" y="152" text-anchor="start">2</text>
    <text x="70" y="152" text-anchor="start">5</text>
    <text x="130" y="152" text-anchor="start">1&lt;5，入栈</text>
    <text x="300" y="152" text-anchor="start" fill="#446688">[1,2]</text>
    <text x="400" y="152" text-anchor="start" fill="#aaa">—</text>
    <text x="520" y="152" text-anchor="start" fill="#aaa">—</text>
  </g>

  <!-- Row i=3 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="162" width="580" height="24" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="38" y="178" text-anchor="start">3</text>
    <text x="70" y="178" text-anchor="start">6</text>
    <text x="130" y="178" text-anchor="start">5&lt;6，入栈</text>
    <text x="300" y="178" text-anchor="start" fill="#446688">[1,2,3]</text>
    <text x="400" y="178" text-anchor="start" fill="#aaa">—</text>
    <text x="520" y="178" text-anchor="start" fill="#aaa">—</text>
  </g>

  <!-- Row i=4: pop 3, pop 2 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="188" width="580" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="38" y="204" text-anchor="start">4</text>
    <text x="70" y="204" text-anchor="start" fill="#b85450">4</text>
    <text x="130" y="204" text-anchor="start" fill="#b85450">6&gt;4 弹3</text>
    <text x="300" y="204" text-anchor="start" fill="#446688">[1,2]</text>
    <text x="400" y="204" text-anchor="start">p[4]−p[3]=15−9=6</text>
    <text x="520" y="204" text-anchor="start" fill="#888">6×6=36</text>
    <text x="130" y="220" text-anchor="start" fill="#b85450">5&gt;4 弹2</text>
    <text x="300" y="220" text-anchor="start" fill="#446688">[1]</text>
    <text x="400" y="220" text-anchor="start">p[4]−p[2]=15−4=11</text>
    <text x="520" y="220" text-anchor="start" fill="#888">5×11=55</text>
  </g>

  <!-- Row i=4 cont: push 4 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="228" width="580" height="24" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="38" y="244" text-anchor="start"></text>
    <text x="70" y="244" text-anchor="start"></text>
    <text x="130" y="244" text-anchor="start">1&lt;4，入栈4</text>
    <text x="300" y="244" text-anchor="start" fill="#446688">[1,4]</text>
    <text x="400" y="244" text-anchor="start" fill="#aaa">—</text>
    <text x="520" y="244" text-anchor="start" fill="#aaa">—</text>
  </g>

  <!-- Row i=5: pop 4 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="254" width="580" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="38" y="270" text-anchor="start">5</text>
    <text x="70" y="270" text-anchor="start" fill="#b85450">2</text>
    <text x="130" y="270" text-anchor="start" fill="#b85450">4&gt;2 弹4 ★</text>
    <text x="300" y="270" text-anchor="start" fill="#446688">[1]</text>
    <text x="400" y="270" text-anchor="start" fill="#b85450" font-weight="bold">p[5]−p[2]=19−4=15</text>
    <text x="520" y="270" text-anchor="start" fill="#b85450" font-weight="bold">4×15=60 ⭐</text>
  </g>

  <!-- Row i=5 cont: push 5 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="280" width="580" height="24" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="130" y="296" text-anchor="start">1&lt;2，入栈5</text>
    <text x="300" y="296" text-anchor="start" fill="#446688">[1,5]</text>
    <text x="400" y="296" text-anchor="start" fill="#aaa">—</text>
    <text x="520" y="296" text-anchor="start" fill="#aaa">—</text>
  </g>

  <!-- Row i=6: sentinel, pop 5, pop 1 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="306" width="580" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="38" y="322" text-anchor="start">6</text>
    <text x="70" y="322" text-anchor="start" fill="#b85450">0</text>
    <text x="130" y="322" text-anchor="start" fill="#b85450">哨兵：2&gt;0 弹5</text>
    <text x="300" y="322" text-anchor="start" fill="#446688">[1]</text>
    <text x="400" y="322" text-anchor="start">p[6]−p[2]=21−4=17</text>
    <text x="520" y="322" text-anchor="start" fill="#888">2×17=34</text>
    <text x="130" y="338" text-anchor="start" fill="#b85450">1&gt;0 弹1</text>
    <text x="300" y="338" text-anchor="start" fill="#446688">[]</text>
    <text x="400" y="338" text-anchor="start">p[6]=21</text>
    <text x="520" y="338" text-anchor="start" fill="#888">1×21=21</text>
  </g>

  <!-- Result -->
  <rect x="20" y="354" width="580" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="376" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">maxProduct = 60，返回 60 mod (10⁹+7) = 60 ✓</text>

  <!-- Key insight box -->
  <rect x="20" y="400" width="580" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="422" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键观察</text>

  <text x="36" y="444" font-size="11" fill="#555" filter="url(#rough2)">① i=4 弹出时，栈顶从 [1,4] 变 [1]，左边界=新栈顶+1=2，子数组 [5,6,4]</text>
  <text x="36" y="462" font-size="11" fill="#555" filter="url(#rough2)">   sum = prefix[5] − prefix[2] = 19 − 4 = 15，product = 4 × 15 = 60</text>

  <text x="36" y="486" font-size="11" fill="#555" filter="url(#rough2)">② 哨兵 0 在 i=6 时强制弹出栈中剩余的 2 和 1，保证每个元素都被结算</text>

  <text x="36" y="506" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">与 84 题完全同构：84 用「高×宽(下标差)」，本题用「min×sum(前缀和差)」</text>
</svg>
