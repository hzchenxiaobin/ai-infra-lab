<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：选定目标值 v，小袋清空、大袋削平</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">只能移除不能增加 ⟹ 原始 &lt; v 的袋子清空，原始 ≥ v 的袋子削平到 v</text>

  <!-- ===== Left: operation model ===== -->
  <text x="40" y="74" font-size="11.5" fill="#446688" font-weight="bold">① 排序后选定 v = beans[i]</text>

  <!-- index labels -->
  <text x="60" y="94" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="110" y="94" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="160" y="94" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="210" y="94" text-anchor="middle" font-size="9" fill="#888">3</text>

  <!-- original bags row: [1][2][3][4], pick v=2 (i=1) -->
  <rect x="40" y="100" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="90" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="140" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="190" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>

  <!-- target v marker -->
  <text x="250" y="120" font-size="10.5" fill="#4a7a3a" font-weight="bold">↑ 目标 v=2</text>

  <!-- bracket: front segment (index 0) -->
  <path d="M 40 150 L 40 158 L 80 158 L 80 150" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="60" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">前段：&lt; v → 清空</text>

  <!-- bracket: back segment (index 1..3) -->
  <path d="M 90 150 L 90 158 L 230 158 L 230 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="160" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">后段：≥ v → 削平到 v</text>

  <!-- arrows down to result -->
  <path d="M 60 180 L 60 196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 110 180 L 110 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 160 180 L 160 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 210 180 L 210 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- result row -->
  <rect x="40" y="200" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">空</text>
  <rect x="90" y="200" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="140" y="200" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="190" y="200" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- removed annotations -->
  <text x="60" y="252" text-anchor="middle" font-size="9.5" fill="#b85450">移除 1</text>
  <text x="110" y="252" text-anchor="middle" font-size="9.5" fill="#4a7a3a">移除 0</text>
  <text x="160" y="252" text-anchor="middle" font-size="9.5" fill="#4a7a3a">移除 1</text>
  <text x="210" y="252" text-anchor="middle" font-size="9.5" fill="#4a7a3a">移除 2</text>

  <!-- split line -->
  <line x1="300" y1="60" x2="300" y2="400" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: formula simplification ===== -->
  <text x="430" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② 代价化简</text>

  <!-- formula box 1 -->
  <rect x="320" y="88" width="220" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">removed = 清空段 + 削平超出</text>
  <text x="430" y="126" text-anchor="middle" font-size="10" fill="#555">= Σ(0..i−1) + (Σ(i..n−1) − (n−i)·v)</text>

  <!-- arrow down -->
  <path d="M 430 140 L 430 154" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="152" font-size="9.5" fill="#666">两段和 = 总和</text>

  <!-- formula box 2 -->
  <rect x="320" y="160" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">removed = total − (n−i)·v</text>
  <text x="430" y="198" text-anchor="middle" font-size="10" fill="#555">保留数恰好 = (n−i)·beans[i]</text>

  <!-- arrow down -->
  <path d="M 430 212 L 430 226" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- formula box 3: the key -->
  <rect x="320" y="232" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min removed</text>
  <text x="430" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⟺ max (n−i)·beans[i]</text>
  <text x="430" y="284" text-anchor="middle" font-size="9.5" fill="#888">total 是常数</text>

  <!-- ===== Bottom: final answer ===== -->
  <rect x="40" y="300" width="260" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="170" y="322" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">最终公式</text>
  <text x="170" y="344" text-anchor="middle" font-size="12" fill="#333">答案 = total − maxKeep</text>
  <text x="170" y="358" text-anchor="middle" font-size="10" fill="#888" font-style="italic">maxKeep = max (n−i)·beans[i]</text>

  <!-- mini flow at bottom -->
  <text x="40" y="390" font-size="10.5" fill="#444" font-weight="bold">排序 → 求总和 → 遍历取 max (n−i)·beans[i] → total − maxKeep</text>
  <rect x="40" y="396" width="500" height="14" fill="none"/>
</svg>
