<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：初始化结果数组 → 循环发糖 → 处理余数</text>

  <!-- Start: init -->
  <rect x="180" y="42" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 res=[0]*n，i=0，give=1</text>
  <path d="M 280 76 L 280 88" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: candies > 0 ? -->
  <polygon points="280,90 400,126 280,162 160,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">candies &gt; 0 ?</text>

  <!-- No branch: go right to return -->
  <path d="M 400 126 L 470 126" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="435" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="440" y="110" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490" y="131" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 res</text>

  <!-- Yes branch: go down -->
  <path d="M 280 162 L 280 176" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="172" font-size="11" fill="#888" font-weight="bold">是</text>

  <!-- Decision: candies >= give ? -->
  <polygon points="280,178 400,214 280,250 160,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">candies ≥ give ?</text>

  <!-- Yes: give full amount -->
  <path d="M 400 214 L 440 214" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="208" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">是</text>
  <rect x="440" y="196" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="212" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">res[i%n]+=give</text>
  <text x="490" y="225" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">candies−=give</text>

  <!-- No: give remainder -->
  <path d="M 160 214 L 120 214" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="140" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="196" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">res[i%n]+=</text>
  <text x="70" y="225" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">candies</text>
  <text x="70" y="238" text-anchor="middle" font-size="9" fill="#b85450">（剩余全给）</text>

  <!-- Merge: i++, give++ -->
  <path d="M 490 232 L 490 280 L 280 280" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 70 240 L 70 280 L 280 280" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="180" y="268" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i++，give++</text>

  <!-- Loop back to candies > 0 decision -->
  <path d="M 280 300 L 280 314 L 80 314 L 80 126 L 156 126" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="308" font-size="10" fill="#888">回到循环判断</text>

  <!-- bottom legend -->
  <rect x="40" y="350" width="480" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">关键不变量</text>
  <text x="60" y="388" font-size="10" fill="#888">• give 每轮 +1，模拟等差数列 1,2,3,…</text>
  <text x="300" y="388" font-size="10" fill="#888">• i%n 决定当前分给谁</text>
  <text x="60" y="400" font-size="10" fill="#888">• candies 归零即结束</text>
  <text x="300" y="400" font-size="10" fill="#888">• 循环次数 ≈ √(2×candies)</text>
</svg>
