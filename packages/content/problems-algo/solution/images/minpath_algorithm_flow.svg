<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：初始化首行首列 → 双层循环填表 → 返回右下角</text>

  <!-- Start -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[0][0] = grid[0][0]</text>
  <path d="M 280 80 L 280 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init first row -->
  <rect x="170" y="104" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11.5" fill="#333">首行：dp[0][j] = dp[0][j−1] + grid[0][j]</text>
  <path d="M 280 140 L 280 160" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init first col -->
  <rect x="170" y="164" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="11.5" fill="#333">首列：dp[i][0] = dp[i−1][0] + grid[i][0]</text>
  <path d="M 280 200 L 280 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="170" y="224" width="220" height="30" fill="#f6f6f6" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11.5" fill="#333">for i = 1..m−1,  j = 1..n−1</text>
  <path d="M 280 256 L 280 278" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- transition -->
  <rect x="120" y="282" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i][j] = min(dp[i−1][j], dp[i][j−1])</text>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">           + grid[i][j]</text>

  <!-- loop back -->
  <path d="M 120 310 L 86 310 L 86 239 L 166 239" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="60" y="276" font-size="10" fill="#4a7a3a">下一格</text>

  <!-- after loop -->
  <path d="M 280 340 L 280 364" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: optimize space? -->
  <path d="M 280 368 L 360 404 L 280 440 L 200 404 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11.5" fill="#333">滚动数组?</text>
  <text x="280" y="416" text-anchor="middle" font-size="11.5" fill="#333">dp[j]=min(dp[j],dp[j−1])</text>
  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#888">+grid[i][j]</text>

  <!-- return -->
  <rect x="430" y="388" width="116" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="488" y="410" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return dp[m−1][n−1]</text>
  <path d="M 360 404 L 426 404" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
