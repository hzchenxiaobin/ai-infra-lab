<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：线性流水线（无分支回环）</text>

  <!-- ===== Start ===== -->
  <ellipse cx="270" cy="62" rx="56" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">开始</text>
  <path d="M 270 84 L 270 104" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 1: init mn ===== -->
  <rect x="190" y="108" width="160" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="135" text-anchor="middle" font-size="12.5" fill="#333">mn = nums[0]</text>
  <path d="M 270 152 L 270 172" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: loop find min ===== -->
  <polygon points="270,176 376,224 270,272 164,224" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="12" fill="#333">遍历每个 nums[i]</text>
  <text x="270" y="236" text-anchor="middle" font-size="12" fill="#333">更小则 mn = nums[i]</text>
  <path d="M 270 272 L 270 292" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: digit sum loop ===== -->
  <rect x="160" y="296" width="220" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12.5" fill="#333">s = 0</text>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#d6a040">while mn &gt; 0: s += mn%10; mn/=10</text>
  <path d="M 270 344 L 270 364" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: parity decision ===== -->
  <polygon points="270,368 388,408 270,448 152,408" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="404" text-anchor="middle" font-size="12.5" fill="#333">s % 2 == 0 ?</text>
  <text x="270" y="422" text-anchor="middle" font-size="11" fill="#4a7a3a">（偶 / 奇）</text>

  <!-- yes branch (even -> 1) -->
  <path d="M 388 408 Q 430 408 440 380" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="430" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶</text>
  <rect x="410" y="340" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="442" y="361" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return 1</text>

  <!-- no branch (odd -> 0) -->
  <path d="M 152 408 Q 110 408 100 380" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">奇</text>
  <rect x="66" y="340" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="98" y="361" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return 0</text>

  <!-- side annotations -->
  <text x="40" y="130" font-size="10.5" fill="#888">O(n) 线性扫描</text>
  <text x="40" y="226" font-size="10.5" fill="#888">无排序</text>
  <text x="40" y="322" font-size="10.5" fill="#888">O(log₁₀V) 拆位</text>
</svg>
