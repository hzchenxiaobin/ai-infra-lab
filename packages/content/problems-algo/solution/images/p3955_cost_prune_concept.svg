<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：放 '1' 的代价 = 下标 i，两条约束就是两把剪刀</text>

  <!-- 顶部：下标/代价对照条 -->
  <g filter="url(#rough2)">
    <text x="36" y="63" font-size="11" fill="#333">下标 i：</text>
    <rect x="108" y="42" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="131" y="62" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">0</text>
    <rect x="158" y="42" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="181" y="62" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">1</text>
    <rect x="208" y="42" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="231" y="62" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">2</text>
    <rect x="258" y="42" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="281" y="62" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">3</text>
    <rect x="308" y="42" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="331" y="62" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">4</text>

    <text x="36" y="105" font-size="11" fill="#8a6d1a">放 '1' 的代价：</text>
    <rect x="108" y="86" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="131" y="106" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">0</text>
    <rect x="158" y="86" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="181" y="106" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">1</text>
    <rect x="208" y="86" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="231" y="106" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">2</text>
    <rect x="258" y="86" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="281" y="106" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">3</text>
    <rect x="308" y="86" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="331" y="106" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">4</text>

    <path d="M366,72 L424,72" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrAmber)"/>
    <text x="510" y="60" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">'0' 免费，'1' 花 i</text>
    <text x="510" y="80" text-anchor="middle" font-size="10" fill="#8a6d1a">下标越大越贵 ⇒ 单调递增</text>
    <text x="510" y="102" text-anchor="middle" font-size="9" fill="#777">首位的 '1' 免费（下标 0）</text>
  </g>

  <!-- 剪枝①：无连续 1 -->
  <g filter="url(#rough2)">
    <rect x="30" y="138" width="280" height="116" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="170" y="162" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">剪枝①：无连续 '1'</text>
    <text x="170" y="184" text-anchor="middle" font-size="10" fill="#2f5d24">前一位是 '1' → 本位禁放 '1'</text>
    <text x="170" y="202" text-anchor="middle" font-size="10" fill="#2f5d24">只能走 '0' 分支</text>
    <rect x="100" y="214" width="28" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="114" y="232" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">1</text>
    <rect x="132" y="214" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="146" y="232" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">?</text>
    <text x="238" y="232" text-anchor="middle" font-size="9.5" fill="#2f5d24">此处只能填 '0'</text>
  </g>

  <!-- 剪枝②：预算 -->
  <g filter="url(#rough2)">
    <rect x="330" y="138" width="260" height="116" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="460" y="162" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">剪枝②：预算 ≤ k</text>
    <text x="460" y="184" text-anchor="middle" font-size="10" fill="#8a3030">cost + i &gt; k → 本位 '1' 超支</text>
    <text x="460" y="202" text-anchor="middle" font-size="10" fill="#8a3030">j &gt; i 更贵 ⇒ 以后也超支</text>
    <text x="460" y="224" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">之后只能全是 '0'</text>
    <text x="460" y="244" text-anchor="middle" font-size="9.5" fill="#8a3030">——整棵子树一刀剪掉！</text>
  </g>

  <!-- 左下：规模直觉 -->
  <g filter="url(#rough2)">
    <rect x="30" y="272" width="300" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="294" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">规模直觉</text>
    <text x="46" y="314" font-size="9.5" fill="#33506b">• 无连续 '1' 的长 n 串共 F(n+2) 个</text>
    <text x="58" y="330" font-size="9" fill="#33506b">n=12 → 377 ≪ 2¹² = 4096（≈ 1.618ⁿ 对 2ⁿ）</text>
    <text x="46" y="350" font-size="9.5" fill="#33506b">• 最大成本 ⌊n²/4⌋：k ≥ 它则预算约束失效</text>
    <text x="46" y="370" font-size="9.5" fill="#33506b">• 先试 '0' 再试 '1' ⇒ 输出恰为字典序</text>
  </g>

  <!-- 右下：n=3, k=1 判定表 -->
  <g filter="url(#rough2)">
    <text x="446" y="266" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">n = 3, k = 1：5 个无连续 '1' 的串过预算</text>

    <rect x="360" y="274" width="60" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="390" y="290" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">串</text>
    <rect x="420" y="274" width="56" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="448" y="290" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">成本</text>
    <rect x="476" y="274" width="56" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="504" y="290" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">判定</text>

    <rect x="360" y="298" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="390" y="315" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">000</text>
    <rect x="420" y="298" width="56" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="448" y="315" text-anchor="middle" font-size="10.5" fill="#2f5d24">0</text>
    <rect x="476" y="298" width="56" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="504" y="315" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">✓</text>

    <rect x="360" y="322" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="390" y="339" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">010</text>
    <rect x="420" y="322" width="56" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="448" y="339" text-anchor="middle" font-size="10.5" fill="#2f5d24">1</text>
    <rect x="476" y="322" width="56" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="504" y="339" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">✓</text>

    <rect x="360" y="346" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="390" y="363" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">100</text>
    <rect x="420" y="346" width="56" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="448" y="363" text-anchor="middle" font-size="10.5" fill="#2f5d24">0</text>
    <rect x="476" y="346" width="56" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="504" y="363" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">✓</text>

    <rect x="360" y="370" width="60" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="390" y="387" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">001</text>
    <rect x="420" y="370" width="56" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="448" y="387" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">2</text>
    <rect x="476" y="370" width="56" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="504" y="387" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">✗</text>

    <rect x="360" y="394" width="60" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="390" y="411" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">101</text>
    <rect x="420" y="394" width="56" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="448" y="411" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">2</text>
    <rect x="476" y="394" width="56" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="504" y="411" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">✗</text>

    <text x="446" y="440" text-anchor="middle" font-size="9.5" fill="#2f5d24">恰剩 3 个 —— 与示例输出一致</text>
  </g>
</svg>
