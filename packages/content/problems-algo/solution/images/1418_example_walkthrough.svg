<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：6 条订单 → 累计计数 → 拼成 4×5 展示表</text>

  <!-- ===== 6 orders ===== -->
  <text x="40" y="54" font-size="11" fill="#446688" font-weight="bold">orders（name 灰显=丢弃）</text>

  <!-- row 1 -->
  <g font-size="10">
    <rect x="40" y="62" width="170" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="50" y="83" fill="#bbb" text-decoration="line-through">David</text>
    <text x="92" y="83" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="110" y="83" fill="#333">Ceviche</text>

    <rect x="215" y="62" width="170" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="225" y="83" fill="#bbb" text-decoration="line-through">Corina</text>
    <text x="272" y="83" fill="#4a7a3a" font-weight="bold">10</text>
    <text x="293" y="83" fill="#333">Beef Burrito</text>

    <rect x="390" y="62" width="170" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="83" fill="#bbb" text-decoration="line-through">David</text>
    <text x="442" y="83" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="460" y="83" fill="#333">Fried Chicken</text>
  </g>

  <!-- row 2 -->
  <g font-size="10">
    <rect x="40" y="100" width="170" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="50" y="121" fill="#bbb" text-decoration="line-through">Carla</text>
    <text x="88" y="121" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="106" y="121" fill="#333">Water</text>

    <rect x="215" y="100" width="170" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="225" y="121" fill="#bbb" text-decoration="line-through">Carla</text>
    <text x="263" y="121" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="281" y="121" fill="#333">Ceviche</text>

    <rect x="390" y="100" width="170" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="121" fill="#bbb" text-decoration="line-through">Rous</text>
    <text x="436" y="121" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="454" y="121" fill="#333">Ceviche</text>
  </g>

  <path d="M 300 138 L 300 162" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="310" y="156" font-size="10" fill="#888">丢弃 name · t=int(table) · cnt[t][food]++</text>

  <!-- ===== cnt hash ===== -->
  <text x="40" y="180" font-size="11" fill="#d6a040" font-weight="bold">cnt[table][food] 累计结果</text>

  <g font-size="10">
    <!-- table 3 -->
    <rect x="40" y="188" width="160" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="50" y="204" fill="#4a7a3a" font-weight="bold">桌 3:</text>
    <text x="50" y="220" fill="#333">Ceviche → </text>
    <text x="115" y="220" fill="#b85450" font-weight="bold">2</text>
    <text x="50" y="234" fill="#333">Fried Chicken → </text>
    <text x="140" y="234" fill="#b85450" font-weight="bold">1</text>

    <!-- table 5 -->
    <rect x="210" y="188" width="160" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="220" y="204" fill="#4a7a3a" font-weight="bold">桌 5:</text>
    <text x="220" y="220" fill="#333">Water → </text>
    <text x="272" y="220" fill="#b85450" font-weight="bold">1</text>
    <text x="220" y="234" fill="#333">Ceviche → </text>
    <text x="285" y="234" fill="#b85450" font-weight="bold">1</text>

    <!-- table 10 -->
    <rect x="380" y="188" width="180" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="390" y="204" fill="#4a7a3a" font-weight="bold">桌 10:</text>
    <text x="390" y="226" fill="#333">Beef Burrito → </text>
    <text x="488" y="226" fill="#b85450" font-weight="bold">1</text>
  </g>

  <path d="M 300 242 L 300 266" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="310" y="260" font-size="10" fill="#888">foods=字典序 · tables=数值序 · 按行×列拼表</text>

  <!-- ===== final table ===== -->
  <text x="40" y="284" font-size="11" fill="#b85450" font-weight="bold">输出 displayTable</text>

  <g font-size="11">
    <!-- header row -->
    <rect x="50" y="292" width="70" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="85" y="309" text-anchor="middle" fill="#446688" font-weight="bold">Table</text>
    <rect x="120" y="292" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="175" y="309" text-anchor="middle" fill="#446688" font-weight="bold">Beef Burrito</text>
    <rect x="230" y="292" width="80" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="270" y="309" text-anchor="middle" fill="#446688" font-weight="bold">Ceviche</text>
    <rect x="310" y="292" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="365" y="309" text-anchor="middle" fill="#446688" font-weight="bold">Fried Chicken</text>
    <rect x="420" y="292" width="70" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="455" y="309" text-anchor="middle" fill="#446688" font-weight="bold">Water</text>

    <!-- row 3 -->
    <rect x="50" y="318" width="70" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="85" y="335" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="120" y="318" width="110" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="175" y="335" text-anchor="middle" fill="#999">0</text>
    <rect x="230" y="318" width="80" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="270" y="335" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="310" y="318" width="110" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="365" y="335" text-anchor="middle" fill="#333">1</text>
    <rect x="420" y="318" width="70" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="455" y="335" text-anchor="middle" fill="#999">0</text>

    <!-- row 5 -->
    <rect x="50" y="344" width="70" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="85" y="361" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="120" y="344" width="110" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="175" y="361" text-anchor="middle" fill="#999">0</text>
    <rect x="230" y="344" width="80" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="270" y="361" text-anchor="middle" fill="#333">1</text>
    <rect x="310" y="344" width="110" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="365" y="361" text-anchor="middle" fill="#999">0</text>
    <rect x="420" y="344" width="70" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="455" y="361" text-anchor="middle" fill="#333">1</text>

    <!-- row 10 -->
    <rect x="50" y="370" width="70" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="85" y="387" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="120" y="370" width="110" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="175" y="387" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="230" y="370" width="80" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="270" y="387" text-anchor="middle" fill="#999">0</text>
    <rect x="310" y="370" width="110" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="365" y="387" text-anchor="middle" fill="#999">0</text>
    <rect x="420" y="370" width="70" height="26" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="455" y="387" text-anchor="middle" fill="#999">0</text>
  </g>

  <!-- annotations -->
  <text x="270" y="412" text-anchor="middle" font-size="10" fill="#b85450">↑ 桌3 的 Ceviche=2：David + Rous 各点一次累加</text>
  <text x="270" y="426" text-anchor="middle" font-size="10" fill="#999">↑ 桌10 未点 Ceviche → 查 cnt[10] 缺失 → 补 "0"</text>

  <!-- bottom note -->
  <rect x="40" y="448" width="520" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="468" text-anchor="middle" font-size="11" fill="#444">姓名 David/Corina/Carla/Rous 全程不进入输出；</text>
  <text x="300" y="484" text-anchor="middle" font-size="11" fill="#444">同桌同餐品累加，缺失餐品补 "0"，桌号按数值序 3→5→10</text>

  <!-- order arrow indicating accumulation from orders to cnt for the highlighted Ceviche=2 -->
  <path d="M 425 134 Q 470 160 270 188" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="470" y="170" font-size="9" fill="#b85450">Rous,3,Ceviche</text>
  <text x="470" y="182" font-size="9" fill="#b85450">累入 桌3</text>
</svg>
