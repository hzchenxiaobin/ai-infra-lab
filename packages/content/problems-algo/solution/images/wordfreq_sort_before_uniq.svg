<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">为什么 sort 必须在 uniq -c 之前？</text>
  <path d="M 220 42 Q 360 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#666">uniq -c 只合并「相邻」重复行——不排序会得到碎片化计数</text>

  <!-- ===== 左列：错误流程 ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="80" width="320" height="300" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4"/>
  </g>
  <text x="190" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">✗ 漏掉 sort</text>

  <!-- 拆词后 -->
  <text x="50" y="128" font-size="11" fill="#7a5415">拆词后（原始顺序）：</text>
  <g filter="url(#sk)">
    <rect x="50" y="134" width="280" height="56" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="60" y="150" font-size="10" fill="#333">the</text>
  <text x="60" y="164" font-size="10" fill="#333">day</text>
  <text x="60" y="178" font-size="10" fill="#333">is  sunny  the  the  ...</text>

  <!-- 箭头：直接 uniq -c -->
  <path d="M 190 192 L 190 214" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="200" y="208" font-size="10" fill="#b85450">uniq -c</text>

  <!-- 结果：碎片化 -->
  <text x="50" y="232" font-size="11" fill="#7a5415">结果（错误！）：</text>
  <g filter="url(#sk)">
    <rect x="50" y="238" width="280" height="128" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="60" y="256" font-size="10" fill="#b85450">1 the</text>
  <text x="60" y="270" font-size="10" fill="#b85450">1 day</text>
  <text x="60" y="284" font-size="10" fill="#b85450">1 is</text>
  <text x="60" y="298" font-size="10" fill="#b85450">1 sunny</text>
  <text x="60" y="312" font-size="10" fill="#b85450">1 the</text>
  <text x="60" y="326" font-size="10" fill="#b85450">1 the ...</text>
  <text x="60" y="352" font-size="10" font-weight="bold" fill="#b85450">the 被切成 4 段，每段计 1</text>

  <!-- ===== 右列：正确流程 ===== -->
  <g filter="url(#sk)">
    <rect x="370" y="80" width="320" height="300" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="530" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">✓ 先 sort 再 uniq -c</text>

  <!-- sort 后 -->
  <text x="390" y="128" font-size="11" fill="#2e6e2e">sort 后（相同词聚到一起）：</text>
  <g filter="url(#sk)">
    <rect x="390" y="134" width="280" height="56" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="400" y="150" font-size="10" fill="#333">day</text>
  <text x="400" y="164" font-size="10" fill="#333">is  is  is</text>
  <text x="400" y="178" font-size="10" fill="#333">sunny sunny  the the the the</text>

  <!-- 箭头 -->
  <path d="M 530 192 L 530 214" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="540" y="208" font-size="10" fill="#2e6e2e">uniq -c</text>

  <!-- 结果：正确 -->
  <text x="390" y="232" font-size="11" fill="#2e6e2e">结果（正确）：</text>
  <g filter="url(#sk)">
    <rect x="390" y="238" width="280" height="128" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="400" y="256" font-size="10" fill="#2e6e2e">1 day</text>
  <text x="400" y="270" font-size="10" fill="#2e6e2e">3 is</text>
  <text x="400" y="284" font-size="10" fill="#2e6e2e">2 sunny</text>
  <text x="400" y="298" font-size="10" fill="#2e6e2e">4 the</text>
  <text x="400" y="352" font-size="10" font-weight="bold" fill="#2e6e2e">相邻同类已合并，计数正确</text>
</svg>
