<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">流程：逐位算术反转，再取一次绝对值</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="90" y="42" width="150" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="165" y="61" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">输入 n</text>
  </g>
  <path d="M 165 72 L 165 90" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="90" y="94" width="150" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="165" y="113" text-anchor="middle" font-size="12" fill="#33506b">rev = 0 · m = n</text>
  </g>
  <path d="M 165 124 L 165 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <g filter="url(#rough2)">
    <polygon points="165,144 237,178 165,212 93,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="165" y="183" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">m &gt; 0 ?</text>
  </g>

  <!-- 是：循环体 -->
  <path d="M 165 212 L 165 230" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="177" y="226" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="70" y="234" width="190" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="165" y="255" text-anchor="middle" font-size="11.5" fill="#33506b">rev = rev×10 + m mod 10</text>
    <text x="165" y="273" text-anchor="middle" font-size="11.5" fill="#33506b">m = m ÷ 10（整除）</text>
  </g>
  <!-- 回到菱形 -->
  <path d="M 70 260 L 42 260 L 42 178 L 89 178" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否：出口 -->
  <path d="M 237 178 L 291 178" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="170" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="295" y="162" width="190" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="390" y="182" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">返回 |n − rev|</text>
  </g>

  <!-- 示例追踪面板 -->
  <g filter="url(#rough2)">
    <rect x="288" y="226" width="208" height="118" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="392" y="248" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold">示例追踪 n = 25</text>
    <text x="392" y="268" text-anchor="middle" font-size="10.5" fill="#8a6d1f">初始：m = 25, rev = 0</text>
    <text x="392" y="286" text-anchor="middle" font-size="10.5" fill="#8a6d1f">取 5：rev = 5, m = 2</text>
    <text x="392" y="304" text-anchor="middle" font-size="10.5" fill="#8a6d1f">取 2：rev = 52, m = 0</text>
    <text x="392" y="330" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">|25 − 52| = 27 ✓</text>
  </g>

  <!-- 底部说明框 -->
  <g filter="url(#rough2)">
    <rect x="26" y="300" width="238" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="145" y="318" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">全程 int 安全</text>
    <text x="145" y="335" text-anchor="middle" font-size="10" fill="#b85450">|n − rev| ≤ 999999999 &lt; 2³¹−1</text>
  </g>
</svg>
