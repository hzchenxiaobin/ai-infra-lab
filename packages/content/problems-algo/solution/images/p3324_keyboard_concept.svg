<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：两个按键各管一摊，逐字符贪心即可</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">按键 1 管长度（永远追加 'a'）· 按键 2 只转最后一位 → 前缀锁定，各位置独立</text>

  <!-- 两个按键 -->
  <rect x="26" y="56" width="228" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">按键 1：追加 'a'</text>
  <text x="140" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">屏幕串长度 +1（新位置从 'a' 起步）</text>

  <rect x="266" y="56" width="228" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="78" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">按键 2：末位 +1</text>
  <text x="380" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">'c'→'d'，'z'→'a'（绕回本题用不上）</text>

  <!-- 中部：屏幕串结构 -->
  <text x="260" y="130" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">屏幕串 = 已锁定的前缀 + 一只正在转的转轮</text>

  <text x="32" y="152" font-size="9.5" fill="#4a4a4a" filter="url(#rough2)">● 按键 2 碰不到前缀</text>
  <text x="32" y="168" font-size="9.5" fill="#4a4a4a" filter="url(#rough2)">● 前缀敲定后永不回头</text>
  <text x="32" y="184" font-size="9.5" fill="#4a4a4a" filter="url(#rough2)">● 各位置代价独立</text>

  <rect x="200" y="140" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="162" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">h</text>
  <rect x="240" y="140" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="257" y="162" text-anchor="middle" font-size="14" fill="#a07830" font-weight="bold" filter="url(#rough2)">d</text>
  <path d="M 282 141 A 29 25 0 1 1 279 171" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="217" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">已敲定，锁定</text>
  <text x="257" y="190" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">转到 'e' 中…</text>

  <rect x="300" y="134" width="194" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="154" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">逐字符贪心</text>
  <text x="397" y="170" text-anchor="middle" font-size="9" fill="#4a4a4a" filter="url(#rough2)">对每个 c：按键 1 追加 'a'</text>
  <text x="397" y="185" text-anchor="middle" font-size="9" fill="#4a4a4a" filter="url(#rough2)">再按 (ord(c) − 97) 次按键 2</text>

  <!-- 字母转轮带 -->
  <text x="260" y="214" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">位置 i 的字符：从 'a' 出发正向转，步数 = ord(c) − 97</text>
  <path d="M 34 224 L 150 224" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="228" font-size="9" fill="#a07830" filter="url(#rough2)">7 次按键 2 → 'h'</text>

  <rect x="22" y="232" width="18.2" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="31.1" y="249" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="40.2" y="232" width="18.2" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="49.3" y="249" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">b</text>
  <rect x="58.4" y="232" width="18.2" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="67.5" y="249" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">c</text>
  <rect x="76.6" y="232" width="18.2" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="85.7" y="249" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">d</text>
  <rect x="94.8" y="232" width="18.2" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="103.9" y="249" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">e</text>
  <rect x="113" y="232" width="18.2" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="122.1" y="249" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">f</text>
  <rect x="131.2" y="232" width="18.2" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="140.3" y="249" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">g</text>
  <rect x="149.4" y="232" width="18.2" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="158.5" y="249" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">h</text>
  <rect x="167.6" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="176.7" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">i</text>
  <rect x="185.8" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="194.9" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j</text>
  <rect x="204" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="213.1" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">k</text>
  <rect x="222.2" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="231.3" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">l</text>
  <rect x="240.4" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="249.5" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">m</text>
  <rect x="258.6" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="267.7" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">n</text>
  <rect x="276.8" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285.9" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">o</text>
  <rect x="295" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="304.1" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">p</text>
  <rect x="313.2" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="322.3" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">q</text>
  <rect x="331.4" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="340.5" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">r</text>
  <rect x="349.6" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="358.7" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">s</text>
  <rect x="367.8" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376.9" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">t</text>
  <rect x="386" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="395.1" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">u</text>
  <rect x="404.2" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="413.3" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">v</text>
  <rect x="422.4" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="431.5" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">w</text>
  <rect x="440.6" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="449.7" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">x</text>
  <rect x="458.8" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="467.9" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">y</text>
  <rect x="477" y="232" width="18.2" height="26" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="486.1" y="249" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">z</text>

  <path d="M 486 263 C 420 292, 100 292, 34 263" fill="none" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">'z'→'a' 绕回分支：每位置从 'a' 起步、正向至多 25 步，本题永远走不到</text>

  <rect x="20" y="316" width="480" height="70" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="338" font-size="10" fill="#333" filter="url(#rough2)">💡 方案唯一：每位置恰好 1 次按键 1 + (ord(c) − 97) 次按键 2</text>
  <text x="34" y="356" font-size="10" fill="#333" filter="url(#rough2)">总按键数 = n + Σ(ord(c) − 97) ≤ 26n；输出字符串个数与之相等（每按一次记录一次）</text>
  <text x="34" y="374" font-size="10" fill="#333" filter="url(#rough2)">n = 400 时至多 10400 个字符串、约 4.2×10⁶ 个字符，直接模拟即可</text>
</svg>
