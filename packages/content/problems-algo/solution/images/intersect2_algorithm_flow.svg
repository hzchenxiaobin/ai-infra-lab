<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：哈希计数法 O(n + m)</text>

  <!-- Step 1 -->
  <rect x="60" y="50" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="75" text-anchor="middle" font-size="12" fill="#333">① 选较短数组建 Counter：cnt = Counter(较短者)</text>
  <path d="M 270 92 L 270 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="112" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="137" text-anchor="middle" font-size="12" fill="#333">② 遍历较长数组的每个元素 x</text>
  <path d="M 270 154 L 270 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="270,176 380,226 270,276 160,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt[x] &gt; 0 ?</text>
  <text x="270" y="240" text-anchor="middle" font-size="10" fill="#888">（剩余配额）</text>

  <!-- Yes branch -->
  <path d="M 380 226 L 430 226 L 430 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="320" y="300" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="322" text-anchor="middle" font-size="11" fill="#333">result.append(x)</text>
  <text x="430" y="340" text-anchor="middle" font-size="11" fill="#333">cnt[x] −= 1  （消耗一个配额）</text>

  <!-- No branch -->
  <path d="M 160 226 L 110 226 L 110 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="218" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="300" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="324" text-anchor="middle" font-size="11" fill="#333">配额已用尽</text>
  <text x="120" y="342" text-anchor="middle" font-size="11" fill="#333">跳过 x（不加入）</text>

  <!-- loop back -->
  <path d="M 430 356 L 430 380 L 270 380 L 270 132" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 120 356 L 120 380 L 270 380" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="350" y="374" font-size="10" fill="#888">取下一个 x（直到遍历完）</text>

  <!-- End -->
  <rect x="120" y="410" width="300" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="433" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ 遍历结束，返回 result</text>

  <text x="270" y="456" text-anchor="middle" font-size="10" fill="#888">每个元素 O(1) 查/改，总计 O(n + m) 时间、O(min(n,m)) 空间</text>
</svg>
