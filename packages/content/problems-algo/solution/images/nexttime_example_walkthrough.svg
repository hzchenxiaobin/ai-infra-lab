<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：19:34 与 23:59</text>

  <!-- ===== Example 1: 19:34 ===== -->
  <text x="40" y="60" font-size="12.5" fill="#446688" font-weight="bold">示例 1：time = "19:34"，allowed = {1, 9, 3, 4}，start = 1174</text>

  <!-- header row -->
  <text x="72" y="92" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">cur</text>
  <text x="148" y="92" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">时刻</text>
  <text x="244" y="92" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">数位</text>
  <text x="380" y="92" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">判定</text>
  <line x1="40" y1="98" x2="500" y2="98" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: 1175 / 19:35 / 1,9,3,5 / 5∉ ✗ -->
  <text x="72" y="116" text-anchor="middle" font-size="11" fill="#666">1175</text>
  <rect x="120" y="104" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="119" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">19:35</text>
  <text x="244" y="119" text-anchor="middle" font-size="11" fill="#666">1, 9, 3, 5</text>
  <text x="380" y="119" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5 ∉ 集合 ✗</text>

  <!-- row 2: 1176 / 19:36 -->
  <text x="72" y="140" text-anchor="middle" font-size="11" fill="#666">1176</text>
  <rect x="120" y="128" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">19:36</text>
  <text x="244" y="143" text-anchor="middle" font-size="11" fill="#666">1, 9, 3, 6</text>
  <text x="380" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6 ∉ 集合 ✗</text>

  <!-- row 3: 1177 / 19:37 -->
  <text x="72" y="164" text-anchor="middle" font-size="11" fill="#666">1177</text>
  <rect x="120" y="152" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">19:37</text>
  <text x="244" y="167" text-anchor="middle" font-size="11" fill="#666">1, 9, 3, 7</text>
  <text x="380" y="167" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7 ∉ 集合 ✗</text>

  <!-- row 4: 1178 / 19:38 -->
  <text x="72" y="188" text-anchor="middle" font-size="11" fill="#666">1178</text>
  <rect x="120" y="176" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="191" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">19:38</text>
  <text x="244" y="191" text-anchor="middle" font-size="11" fill="#666">1, 9, 3, 8</text>
  <text x="380" y="191" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8 ∉ 集合 ✗</text>

  <!-- row 5: 1179 / 19:39 HIT -->
  <text x="72" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1179</text>
  <rect x="120" y="200" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="215" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">19:39</text>
  <text x="244" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1, 9, 3, 9</text>
  <text x="380" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全在集合 ✓ → 返回</text>

  <text x="40" y="234" font-size="10.5" fill="#888">5 分钟后命中，无需跨天。</text>

  <!-- divider -->
  <line x1="40" y1="248" x2="520" y2="248" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 2: 23:59 ===== -->
  <text x="40" y="278" font-size="12.5" fill="#b85450" font-weight="bold">示例 2：time = "23:59"，allowed = {2, 3, 5, 9}，start = 1439</text>

  <!-- walk checkpoints -->
  <text x="40" y="308" font-size="11" fill="#666">23:59</text>
  <rect x="78" y="296" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">23:59</text>
  <text x="110" y="332" text-anchor="middle" font-size="9.5" fill="#446688">起点</text>

  <path d="M 146 308 L 162 308" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- wrap marker -->
  <rect x="166" y="296" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">00:00</text>
  <text x="198" y="332" text-anchor="middle" font-size="9.5" fill="#d6a040">+1 %1440 跨天</text>

  <path d="M 234 308 L 250 308" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 13:22 cross -->
  <rect x="254" y="296" width="64" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">13:22</text>
  <text x="286" y="332" text-anchor="middle" font-size="9.5" fill="#b85450">1 ∉ 集合 ✗</text>

  <path d="M 322 308 L 338 308" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- dots -->
  <text x="352" y="312" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">…</text>

  <path d="M 366 308 L 382 308" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 22:22 hit -->
  <rect x="386" y="296" width="72" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="422" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">22:22</text>
  <text x="422" y="332" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 次日命中</text>

  <!-- wrap arc above -->
  <path d="M 110 296 Q 198 268 286 296" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="198" y="272" text-anchor="middle" font-size="9.5" fill="#b85450">23:59 +1 → 00:00（次日）</text>

  <!-- explanation box -->
  <rect x="40" y="352" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="374" font-size="11.5" fill="#446688" font-weight="bold">跨天回绕分析：</text>
  <text x="60" y="392" font-size="11" fill="#444">• 1439 + 1 = 1440 → % 1440 = 0（00:00），自动进入次日，无需 if 特判</text>
  <text x="60" y="408" font-size="11" fill="#444">• 一路扫到 22:22（分钟数 1342），数位 2,2,2,2 全在 {2,3,5,9}，命中返回</text>

  <!-- bottom note -->
  <text x="280" y="448" text-anchor="middle" font-size="10.5" fill="#888">两个示例共同点：从 start+1 起 % 1440 递增，第一个数位全在集合的时刻即答案</text>
  <text x="280" y="464" text-anchor="middle" font-size="10.5" fill="#888">cur ∈ [0,1439] 保证 HH&lt;24、MM&lt;60，无需单独校验时刻合法性</text>
</svg>
