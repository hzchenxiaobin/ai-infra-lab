<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="510" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：一次遍历，累加孤立面 − 减去相邻重叠</text>

  <!-- Start -->
  <ellipse cx="280" cy="64" rx="70" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">area = 0</text>
  <path d="M 280 86 L 280 108" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer loop i -->
  <rect x="170" y="112" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="137" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">for i in 0..n-1  (每行)</text>
  <path d="M 280 152 L 280 174" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner loop j -->
  <rect x="170" y="178" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="203" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">for j in 0..n-1  (每列)</text>
  <path d="M 280 218 L 280 240" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: grid[i][j] > 0? -->
  <polygon points="280,244 370,274 280,304 190,274" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#b85450">grid[i][j] &gt; 0 ?</text>
  <text x="280" y="284" text-anchor="middle" font-size="10" fill="#888">v = grid[i][j]</text>

  <!-- 是 → add 4v+2 -->
  <path d="M 370 274 L 410 274" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="410" y="252" width="140" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="273" text-anchor="middle" font-size="11" fill="#333">area += 4·v + 2</text>
  <text x="480" y="290" text-anchor="middle" font-size="10" fill="#888">（顶1+底1+四侧4v）</text>

  <!-- 下方邻居判定 -->
  <path d="M 280 304 L 280 330" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="334" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="12" fill="#333">if i+1 &lt; n : area −= 2·min(v, grid[i+1][j])</text>

  <!-- 右方邻居判定 -->
  <path d="M 280 374 L 280 400" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="404" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="429" text-anchor="middle" font-size="12" fill="#333">if j+1 &lt; n : area −= 2·min(v, grid[i][j+1])</text>

  <!-- j loop back -->
  <path d="M 410 424 Q 470 424 470 198 L 390 198" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="312" text-anchor="middle" font-size="9" fill="#888">j++ 继续</text>

  <!-- i loop back -->
  <path d="M 150 354 Q 100 354 100 132 L 170 132" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="245" text-anchor="middle" font-size="9" fill="#888">i++ 继续</text>

  <!-- return -->
  <path d="M 410 424 Q 470 460 470 64 L 350 64" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="460" width="118" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="489" y="478" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">遍历结束</text>
  <text x="489" y="493" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return area</text>
</svg>
