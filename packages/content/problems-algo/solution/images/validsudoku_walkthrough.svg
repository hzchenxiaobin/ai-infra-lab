<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：扫描到 (2,2) 时宫 0 已有 8 → 冲突</text>

  <!-- highlight top-left box 0 (rows 0-2, cols 0-2) -->
  <rect x="50" y="70" width="90" height="90" fill="#d6a040" fill-opacity="0.14" filter="url(#rough2)"/>

  <!-- thin grid lines -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="80" y1="70" x2="80" y2="340"/>
    <line x1="110" y1="70" x2="110" y2="340"/>
    <line x1="170" y1="70" x2="170" y2="340"/>
    <line x1="200" y1="70" x2="200" y2="340"/>
    <line x1="260" y1="70" x2="260" y2="340"/>
    <line x1="290" y1="70" x2="290" y2="340"/>
    <line x1="50" y1="100" x2="320" y2="100"/>
    <line x1="50" y1="130" x2="320" y2="130"/>
    <line x1="50" y1="190" x2="320" y2="190"/>
    <line x1="50" y1="220" x2="320" y2="220"/>
    <line x1="50" y1="280" x2="320" y2="280"/>
    <line x1="50" y1="310" x2="320" y2="310"/>
  </g>
  <!-- thick box boundaries -->
  <g stroke="#888" stroke-width="2" filter="url(#rough2)">
    <rect x="50" y="70" width="270" height="270" fill="none"/>
    <line x1="140" y1="70" x2="140" y2="340"/>
    <line x1="230" y1="70" x2="230" y2="340"/>
    <line x1="50" y1="160" x2="320" y2="160"/>
    <line x1="50" y1="250" x2="320" y2="250"/>
  </g>

  <!-- board digits (example 2). '.' drawn faint -->
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <!-- row 0 -->
    <text x="65" y="91" fill="#b85450" font-weight="bold">8</text>
    <text x="95" y="91" fill="#333">3</text>
    <text x="155" y="91" fill="#999">·</text><text x="185" y="91" fill="#999">·</text>
    <text x="215" y="91" fill="#333">7</text>
    <text x="275" y="91" fill="#999">·</text><text x="305" y="91" fill="#999">·</text>
    <!-- row 1 -->
    <text x="65" y="121" fill="#333">6</text>
    <text x="155" y="121" fill="#333">1</text>
    <text x="185" y="121" fill="#333">9</text>
    <text x="215" y="121" fill="#333">5</text>
    <!-- row 2 -->
    <text x="95" y="151" fill="#333">9</text>
    <text x="125" y="151" fill="#b85450" font-weight="bold">8</text>
    <text x="275" y="151" fill="#333">6</text>
    <!-- row 3 -->
    <text x="65" y="181" fill="#888">8</text>
    <text x="185" y="181" fill="#333">6</text>
    <text x="305" y="181" fill="#333">3</text>
    <!-- row 4 -->
    <text x="65" y="211" fill="#333">4</text>
    <text x="155" y="211" fill="#888">8</text>
    <text x="215" y="211" fill="#333">3</text>
    <text x="305" y="211" fill="#333">1</text>
    <!-- row 5 -->
    <text x="65" y="241" fill="#333">7</text>
    <text x="185" y="241" fill="#333">2</text>
    <text x="305" y="241" fill="#333">6</text>
    <!-- row 6 -->
    <text x="95" y="271" fill="#333">6</text>
    <text x="245" y="271" fill="#333">2</text>
    <text x="275" y="271" fill="#333">8</text>
    <!-- row 7 -->
    <text x="155" y="301" fill="#333">4</text>
    <text x="185" y="301" fill="#333">1</text>
    <text x="215" y="301" fill="#333">9</text>
    <text x="305" y="301" fill="#333">5</text>
    <!-- row 8 -->
    <text x="185" y="331" fill="#333">8</text>
    <text x="275" y="331" fill="#333">7</text>
    <text x="305" y="331" fill="#333">9</text>
  </g>

  <!-- red circles on conflicting 8s -->
  <circle cx="65" cy="86" r="13" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="125" cy="146" r="13" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- scan arrow from (0,0) to (2,2) -->
  <path d="M 78 92 Q 110 130 116 132" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box 0 label -->
  <text x="95" y="64" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">宫 0</text>

  <!-- right-side explanation -->
  <rect x="350" y="78" width="200" height="232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="450" y="100" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">扫描到达 (2,2)=8 前</text>
  <line x1="366" y1="110" x2="534" y2="110" stroke="#e0c878" stroke-width="1" filter="url(#rough2)"/>

  <text x="366" y="130" font-size="11" fill="#555" font-weight="bold">宫 0 已见集合：</text>
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <rect x="368" y="140" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="382" y="157" fill="#b85450" font-weight="bold">8</text>
    <rect x="400" y="140" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="414" y="157" fill="#333">3</text>
    <rect x="432" y="140" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="446" y="157" fill="#333">6</text>
    <rect x="464" y="140" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="478" y="157" fill="#333">9</text>
  </g>
  <text x="500" y="157" font-size="10" fill="#888">来自 (0,0)/(0,1)/(1,0)/(2,1)</text>

  <line x1="366" y1="178" x2="534" y2="178" stroke="#e0c878" stroke-width="1" filter="url(#rough2)"/>
  <text x="366" y="198" font-size="11" fill="#555" font-weight="bold">处理 (2,2)=8：</text>
  <text x="366" y="218" font-size="10.5" fill="#555">d = 8 − 1 = 7</text>
  <text x="366" y="236" font-size="10.5" fill="#555">b = (2÷3)×3 + (2÷3) = 0</text>
  <text x="366" y="256" font-size="11" fill="#b85450" font-weight="bold">boxes[0][7] == true</text>
  <text x="386" y="274" font-size="10.5" fill="#b85450">↑ 宫 0 已有 8！</text>

  <rect x="372" y="286" width="156" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="307" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return false</text>

  <!-- bottom note -->
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#888">同理 (3,0)=8 也会与 (0,0)=8 在「列 0」冲突——但扫描在 (2,2) 就已判否</text>
</svg>
