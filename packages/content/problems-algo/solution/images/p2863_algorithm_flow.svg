<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：从右往左一趟单调栈（栈内值自底向上递减）</text>

  <!-- start -->
  <rect x="230" y="42" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：i = n−1，空栈</text>
  <path d="M 300 72 L 300 88" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="210" y="90" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="109" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">处理当前 i（值 nums[i]）</text>
  <path d="M 300 118 L 300 136" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision 1: pop -->
  <polygon points="300,138 420,168 300,198 180,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="164" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">栈非空 且</text>
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">nums[栈顶] &lt; nums[i] ？</text>

  <!-- yes: pop loop -->
  <path d="M 420 168 L 470 168" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="436" y="160" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="474" y="152" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="524" y="165" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹掉栈顶</text>
  <text x="524" y="179" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（严格更小，挡不了路）</text>
  <path d="M 524 152 L 524 130 L 360 120" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 360 120 L 316 130" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="430" y="114" font-size="10" fill="#999" filter="url(#rough2)">继续判断</text>

  <!-- no: go down -->
  <path d="M 300 198 L 300 218" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="310" y="212" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- decision 2: empty -->
  <polygon points="300,220 390,246 300,272 210,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="251" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">栈空？</text>

  <!-- yes: sentinel -->
  <path d="M 210 246 L 150 246" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="186" y="238" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="44" y="230" width="104" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="96" y="243" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">R[i] = n</text>
  <text x="96" y="257" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">（右侧无 ≥ 者）</text>

  <!-- no: top -->
  <path d="M 390 246 L 448 246" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="412" y="238" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="452" y="230" width="122" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="513" y="243" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">R[i] = 栈顶下标</text>
  <text x="513" y="257" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">（留下来的 ≥ 就是墙）</text>

  <!-- merge: settle -->
  <path d="M 96 262 L 96 292 L 296 292" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 513 262 L 513 292 L 320 292" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 308 292 L 302 292" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 300 272 L 300 286" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="200" y="296" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结算：ans = max(ans, R[i]−i)</text>
  <text x="300" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">并把 i 压入栈</text>
  <path d="M 300 326 L 300 344" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision 3: continue -->
  <polygon points="300,346 372,368 300,390 228,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="173" text-anchor="middle" font-size="1" fill="#fafafa" filter="url(#rough2)"> </text>
  <text x="300" y="373" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">i 还有？</text>
  <path d="M 228 368 L 120 368 L 120 104 L 206 104" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 206 104 L 208 104" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="160" y="360" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是，i−− 继续扫</text>
  <path d="M 372 368 L 430 368" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="360" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="434" y="352" width="140" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="504" y="365" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">扫描结束</text>
  <text x="504" y="379" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <!-- footnotes -->
  <text x="30" y="30" font-size="1" fill="#fafafa" filter="url(#rough2)"> </text>
</svg>
