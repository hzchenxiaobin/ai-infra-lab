<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心观察：指纹 = 去掉位置 i 后的子串
  </text>

  <!-- Position labels -->
  <text x="105" y="62" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">pos 0</text>
  <text x="155" y="62" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">pos 1</text>
  <text x="205" y="62" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">pos 2</text>
  <text x="255" y="62" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">pos 3</text>

  <!-- Highlight column for position 1 -->
  <rect x="138" y="68" width="34" height="92" fill="#d6a040" fill-opacity="0.10" rx="4" filter="url(#rough2)"/>

  <!-- s1: abcd -->
  <text x="55" y="92" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">s₁</text>
  <rect x="90" y="72" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="140" y="72" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="92" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="190" y="72" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="240" y="72" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>

  <!-- s2: aacd -->
  <text x="55" y="137" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">s₂</text>
  <rect x="90" y="117" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="137" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="140" y="117" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="137" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="190" y="117" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="137" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="240" y="117" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="137" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>

  <!-- differs label -->
  <text x="295" y="115" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">b ≠ a</text>

  <!-- "去掉 pos1" label -->
  <text x="155" y="170" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">去掉 pos 1</text>

  <!-- Down arrows from pos 0,2,3 -->
  <path d="M105,150 L105,185" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr1)" filter="url(#rough2)"/>
  <path d="M205,150 L205,185" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr1)" filter="url(#rough2)"/>
  <path d="M255,150 L255,185" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr1)" filter="url(#rough2)"/>

  <!-- s1 fingerprint -->
  <text x="50" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s₁指纹</text>
  <rect x="90" y="187" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="207" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="140" y="187" width="30" height="30" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="155" y="207" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">·</text>
  <rect x="190" y="187" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="207" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="240" y="187" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="207" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>

  <!-- s2 fingerprint -->
  <text x="50" y="247" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s₂指纹</text>
  <rect x="90" y="227" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="247" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="140" y="227" width="30" height="30" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="155" y="247" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">·</text>
  <rect x="190" y="227" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="247" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="240" y="227" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="247" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>

  <!-- "相同!" label -->
  <text x="295" y="227" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">相同!</text>
  <text x="295" y="247" font-size="11" fill="#4a7a3a" filter="url(#rough2)">"acd" = "acd"</text>

  <!-- Conclusion box -->
  <rect x="60" y="285" width="420" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    指纹相同 + 位置 i 字符不同
  </text>
  <text x="270" y="328" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    ⟹ 两串恰好只差一个字符 ✓
  </text>

  <!-- Bottom note -->
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    对每个位置 i，用哈希表记录「指纹 → 位置 i 的字符」
  </text>
  <text x="270" y="385" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    指纹碰撞且字符不同 ⟹ 命中
  </text>
</svg>
