<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例 1 演算：nums=[20,1,15]，x=5，n=3</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888">原始数组：下标 0→20，下标 1→1，下标 2→15</text>

  <!-- Column headers -->
  <text x="40" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">k</text>
  <text x="90" y="68" text-anchor="middle" font-size="10" fill="#888">新增位置</text>
  <text x="210" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">cost 数组 [t0, t1, t2]</text>
  <text x="350" y="68" text-anchor="middle" font-size="10" fill="#888">Σcost</text>
  <text x="440" y="68" text-anchor="middle" font-size="10" fill="#888">k·x</text>
  <text x="525" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">cost(k)</text>

  <!-- separator -->
  <path d="M 20 76 L 555 76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row k=0 -->
  <text x="40" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="90" y="104" text-anchor="middle" font-size="10" fill="#888">—（初始）</text>
  <!-- cost array -->
  <rect x="150" y="88" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="108" text-anchor="middle" font-size="12" fill="#333">20</text>
  <rect x="200" y="88" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="108" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="250" y="88" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="108" text-anchor="middle" font-size="12" fill="#333">15</text>
  <text x="350" y="108" text-anchor="middle" font-size="12" fill="#333">36</text>
  <text x="440" y="108" text-anchor="middle" font-size="12" fill="#888">0</text>
  <rect x="490" y="88" width="70" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="525" y="108" text-anchor="middle" font-size="12" fill="#555">36</text>

  <!-- arrow down -->
  <path d="M 525 118 L 525 132" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Row k=1: cost=[15,1,1], idx=(t-1)%3 -->
  <text x="40" y="152" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="90" y="152" text-anchor="middle" font-size="10" fill="#d6a040">(t−1)%3</text>
  <!-- changed cells highlighted -->
  <rect x="150" y="136" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">15↓</text>
  <rect x="200" y="136" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="156" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="250" y="136" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1↓</text>
  <text x="350" y="156" text-anchor="middle" font-size="12" fill="#333">17</text>
  <text x="440" y="156" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="490" y="136" width="70" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="525" y="156" text-anchor="middle" font-size="12" fill="#555">22</text>

  <!-- arrow down -->
  <path d="M 525 166 L 525 180" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Row k=2: cost=[1,1,1], idx=(t-2)%3 -->
  <text x="40" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="90" y="200" text-anchor="middle" font-size="10" fill="#d6a040">(t−2)%3</text>
  <rect x="150" y="184" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1↓</text>
  <rect x="200" y="184" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="204" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="250" y="184" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="204" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="350" y="204" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="440" y="204" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="490" y="184" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="525" y="204" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">13 ✓</text>

  <!-- min tracking arrow: 36 -> 22 -> 13 -->
  <path d="M 200 250 L 200 252" stroke="#b85450" stroke-width="1.6" fill="none"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans 取最小：min(36, 22, 13) = 13</text>

  <!-- Best explanation box -->
  <rect x="20" y="272" width="520" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">为什么 k=2 最优？</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#555">下标 1 的巧克力最便宜（nums[1]=1）。旋转后它依次落入三种类型的窗口：</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#555">k=1 时到 t=2（成本 1→1），k=2 时再到 t=0（成本 20→1）。三类型全以 1 收集。</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#555">收集和 3 + 操作成本 2×5 = 13。再多旋转一次(k=3≡0)只会多花 5 而不降成本。</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">权衡曲线最低点 = 13</text>
</svg>
