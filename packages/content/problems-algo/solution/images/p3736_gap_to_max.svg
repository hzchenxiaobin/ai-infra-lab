<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：只能 +1 ⇒ 终点被 max 钉死</text>
  <text x="260" y="42" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [2, 1, 3]，柱子每抬一格 = 一次操作</text>

  <rect x="366" y="56" width="144" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="76" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">T 每抬高 1：</text>
  <text x="438" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n 个缺口同步各 +1</text>
  <text x="438" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">总代价多花 n 步</text>
  <text x="438" y="136" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⇒ T 越小越好，取 max</text>

  <path d="M 72 208 L 352 208" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">目标线 T = max = 3</text>

  <rect x="104" y="236" width="58" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="272" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="192" y="264" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="285" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="280" y="208" width="58" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="309" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="309" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">已达标</text>

  <rect x="104" y="208" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="133" y="227" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">+1</text>
  <rect x="192" y="208" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="221" y="227" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">+1</text>
  <rect x="192" y="236" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="221" y="255" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">+1</text>

  <text x="96" y="226" text-anchor="end" font-size="11" fill="#d6a040" filter="url(#rough2)">缺口 1</text>
  <text x="184" y="243" text-anchor="end" font-size="11" fill="#d6a040" filter="url(#rough2)">缺口 2</text>

  <path d="M 72 292 L 352 292" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="310" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">a₀ = 2</text>
  <text x="221" y="310" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">a₁ = 1</text>
  <text x="309" y="310" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">a₂ = 3</text>

  <rect x="70" y="322" width="380" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">总操作 = (3−2) + (3−1) + (3−3) = 1 + 2 + 0 = 3</text>
</svg>
