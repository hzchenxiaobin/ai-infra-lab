<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心观察：×2 再 ÷2 精确抵消 → 先除后乘就够了
  </text>

  <!-- 抵消演示 -->
  <text x="262" y="56" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    ⌊2v/2⌋ = v：相邻的「×2 再 ÷2」精确还原，删掉不亏！
  </text>

  <rect x="128" y="72" width="44" height="34" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="94" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>

  <rect x="204" y="72" width="44" height="34" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="94" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>

  <rect x="280" y="72" width="44" height="34" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="94" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 172 89 L 200 89" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="66" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">×2</text>
  <path d="M 248 89 L 276 89" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="66" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">÷2</text>

  <ellipse cx="224" cy="90" rx="112" ry="26" fill="none" stroke="#b85450"
           stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <text x="260" y="128" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    反复消去这种相邻对 ⇒ 任意序列 = 先 ÷ d 次、再 × m 次
  </text>

  <!-- (d, m) 网格：x = 3, sum = 8 -->
  <text x="46" y="152" font-size="12.5" fill="#333" filter="url(#rough2)">
    x = 3 的 (d, m) 可达值网格（sum = 8）：v = ⌊3/2^d⌋ · 2^m，代价 = d + m
  </text>

  <text x="150" y="170" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">d ↓ m →</text>
  <text x="197" y="170" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">m=0</text>
  <text x="259" y="170" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">m=1</text>
  <text x="321" y="170" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">m=2</text>
  <text x="383" y="170" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">m=3</text>

  <!-- 行 1：d=0, y=3 -->
  <text x="162" y="199" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">d=0 (y=3)</text>
  <rect x="170" y="176" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="193" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="197" y="207" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0 次</text>

  <rect x="232" y="176" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="193" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="259" y="207" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1 次</text>

  <rect x="294" y="176" width="54" height="38" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="321" y="193" text-anchor="middle" font-size="14.5" fill="#b85450" filter="url(#rough2)">12</text>
  <text x="321" y="207" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">&gt; sum ✗</text>

  <rect x="356" y="176" width="54" height="38" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="383" y="193" text-anchor="middle" font-size="14.5" fill="#b85450" filter="url(#rough2)">24</text>
  <text x="383" y="207" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">&gt; sum ✗</text>

  <!-- 行 2：d=1, y=1 -->
  <text x="162" y="245" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">d=1 (y=1)</text>
  <rect x="170" y="222" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="239" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="197" y="253" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1 次</text>

  <rect x="232" y="222" width="54" height="38" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="239" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="259" y="253" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">2 次</text>

  <rect x="294" y="222" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="239" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="321" y="253" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 次</text>

  <rect x="356" y="222" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="383" y="239" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="383" y="253" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4 次</text>

  <path d="M 262 268 L 259 258" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="268" y="278" font-size="11.5" fill="#b85450" filter="url(#rough2)">
    高亮的 2 正是 4040 里到不了的值：3 → 1 → 2（先 ÷2 再 ×2）
  </text>

  <!-- 说明框 -->
  <rect x="40" y="292" width="440" height="58" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="315" font-size="12.5" fill="#333" filter="url(#rough2)">
    选项表（v ≤ 8，同值取最小代价）：{3:0, 6:1, 1:1, 2:2, 4:3, 8:4}
  </text>
  <text x="56" y="336" font-size="12.5" fill="#333" filter="url(#rough2)">
    每个元素 O(log x · log sum) 个选项（本题 ≤ 70 个）→ 直接上分组背包！
  </text>
</svg>
