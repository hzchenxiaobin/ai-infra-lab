<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：x=2, y=3, bound=10 的求和矩阵</text>

  <!-- ===== Grid ===== -->

  <!-- Corner cell -->
  <rect x="100" y="48" width="72" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="136" y="64" text-anchor="middle" font-size="10" fill="#888">x⁲ \ yʲ</text>
  <text x="136" y="76" text-anchor="middle" font-size="10" fill="#888">↓ →</text>

  <!-- Header row: y^j values -->
  <rect x="172" y="48" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="208" y="76" text-anchor="middle" font-size="9" fill="#888">3⁰</text>

  <rect x="244" y="48" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="280" y="76" text-anchor="middle" font-size="9" fill="#888">3¹</text>

  <rect x="316" y="48" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="352" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">9</text>
  <text x="352" y="76" text-anchor="middle" font-size="9" fill="#888">3²</text>

  <!-- ===== Row x^i=1 ===== -->
  <rect x="100" y="82" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="98" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="136" y="110" text-anchor="middle" font-size="9" fill="#888">2⁰</text>

  <!-- 1+1=2 ✓ -->
  <rect x="172" y="82" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="104" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2 ✓</text>

  <!-- 1+3=4 ✓ -->
  <rect x="244" y="82" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4 ✓</text>

  <!-- 1+9=10 ✓ -->
  <rect x="316" y="82" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="104" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">10 ✓</text>

  <!-- ===== Row x^i=2 ===== -->
  <rect x="100" y="116" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="136" y="144" text-anchor="middle" font-size="9" fill="#888">2¹</text>

  <!-- 2+1=3 ✓ -->
  <rect x="172" y="116" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="138" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3 ✓</text>

  <!-- 2+3=5 ✓ -->
  <rect x="244" y="116" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5 ✓</text>

  <!-- 2+9=11 ✗ -->
  <rect x="316" y="116" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.7"/>
  <line x1="318" y1="148" x2="386" y2="118" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="138" text-anchor="middle" font-size="13" fill="#b85450">11</text>

  <!-- ===== Row x^i=4 ===== -->
  <rect x="100" y="150" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="136" y="178" text-anchor="middle" font-size="9" fill="#888">2²</text>

  <!-- 4+1=5 ✓ (dup) -->
  <rect x="172" y="150" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="172" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5 ✓</text>
  <text x="208" y="180" text-anchor="middle" font-size="8" fill="#d6a040">重复</text>

  <!-- 4+3=7 ✓ -->
  <rect x="244" y="150" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">7 ✓</text>

  <!-- 4+9=13 ✗ -->
  <rect x="316" y="150" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.7"/>
  <line x1="318" y1="182" x2="386" y2="152" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="172" text-anchor="middle" font-size="13" fill="#b85450">13</text>

  <!-- ===== Row x^i=8 ===== -->
  <rect x="100" y="184" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8</text>
  <text x="136" y="212" text-anchor="middle" font-size="9" fill="#888">2³</text>

  <!-- 8+1=9 ✓ -->
  <rect x="172" y="184" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="206" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">9 ✓</text>

  <!-- 8+3=11 ✗ -->
  <rect x="244" y="184" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.7"/>
  <line x1="246" y1="216" x2="314" y2="186" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="13" fill="#b85450">11</text>

  <!-- 8+9=17 ✗ -->
  <rect x="316" y="184" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.7"/>
  <line x1="318" y1="216" x2="386" y2="186" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="206" text-anchor="middle" font-size="13" fill="#b85450">17</text>

  <!-- arrow down to result -->
  <line x1="208" y1="226" x2="208" y2="244" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="60" y="248" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="11.5" fill="#888">收集所有 ✓ 格子 → 哈希集合去重（5 出现两次，只保留一次）</text>
  <text x="270" y="282" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">结果：{2, 3, 4, 5, 7, 9, 10} ⭐</text>

  <!-- ===== Legend / notes ===== -->
  <rect x="60" y="304" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="323" text-anchor="middle" font-size="11" fill="#333">✓ 绿 = 和 ≤ bound，加入集合</text>

  <rect x="300" y="304" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)" opacity="0.8"/>
  <text x="390" y="323" text-anchor="middle" font-size="11" fill="#333">✗ 红 = 和 &gt; bound，跳过</text>

  <rect x="60" y="340" width="420" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#333">💡 幂次上界：2⁴ = 16 &gt; 10 → xⁱ 枚举到 2³=8 为止；3³ = 27 &gt; 10 → yʲ 到 3²=9 为止</text>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">总共只需 4 × 3 = 12 次配对，远小于 bound</text>
</svg>
