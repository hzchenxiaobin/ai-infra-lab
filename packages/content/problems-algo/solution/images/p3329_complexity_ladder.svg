<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">II 版判分线：n = 10⁶ 下三条路线的量级</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">题面与 I 版（3325）完全相同，Hard 全靠数据范围放大</text>

  <!-- 暴力 -->
  <rect x="30" y="58" width="460" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="80" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">① 暴力枚举两端 O(n²)</text>
  <text x="50" y="98" font-size="10.5" fill="#8a3833" filter="url(#rough2)">n = 10⁶ → 约 10¹² 步，超时约 4 个数量级</text>
  <text x="50" y="116" font-size="10.5" fill="#8a3833" filter="url(#rough2)">I 版 n ≤ 3000：约 4.5×10⁶ 步，同一代码轻松通过</text>
  <text x="466" y="98" text-anchor="end" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 二分 -->
  <rect x="30" y="146" width="460" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="168" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">② 二分终点 + 26 行前缀和 O(n log n)</text>
  <text x="50" y="186" font-size="10.5" fill="#a07830" filter="url(#rough2)">对每个 left 二分 need(left)，用 pre[c][i] 表 O(26) 判合法</text>
  <text x="50" y="204" font-size="10.5" fill="#a07830" filter="url(#rough2)">时间 ≈ 5×10⁸ 边缘；26×(n+1) 个 int ≈ 104 MB，超内存风险大</text>
  <text x="466" y="186" text-anchor="end" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">△</text>

  <!-- 滑窗 -->
  <rect x="30" y="234" width="460" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="256" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ 滑动窗口（need 单调 → 双指针）O(n)</text>
  <text x="50" y="274" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">right 只进不退，每个字符至多入窗 / 出窗各一次</text>
  <text x="50" y="292" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">约 10⁶ 次基本操作，空间 O(26) —— 正解，与官方 hint 一致</text>
  <text x="466" y="274" text-anchor="end" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 底部备注 -->
  <rect x="20" y="322" width="480" height="62" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="342" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">💡 II 版另有一条隐形判分线：答案上界 n(n+1)/2 ≈ 5×10¹¹</text>
  <text x="34" y="360" font-size="10" fill="#555" filter="url(#rough2)">超出 int32（约 2.1×10⁹），C++ 的 ans 累加与返回值必须 long long</text>
  <text x="34" y="376" font-size="10" fill="#555" filter="url(#rough2)">Python 天然大整数；方法二的总数 n(n+1)/2 同样要用 64 位算</text>
</svg>
