<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 比较 d 与 k → 排序求和</text>

  <!-- 开始 -->
  <rect x="120" y="40" width="100" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="58" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">开始</text>

  <!-- 统计频次 -->
  <rect x="95" y="80" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">一次遍历统计频次</text>
  <text x="452" y="100" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">cnt[26] / Counter(s)</text>

  <!-- 收集非零频次 -->
  <rect x="75" y="126" width="190" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="146" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">freqs = 非零频次，d = len(freqs)</text>
  <text x="452" y="146" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">d ≤ 26 种</text>

  <!-- 菱形判断 -->
  <polygon points="170,162 238,190 170,218 102,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="195" text-anchor="middle" font-size="12.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">d ≤ k ?</text>

  <!-- 右分支：返回 0 -->
  <rect x="298" y="173" width="104" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="195" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 0</text>
  <text x="350" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是（本来就不超）</text>

  <!-- 排序 -->
  <rect x="95" y="234" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="254" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">freqs 升序排序</text>
  <text x="452" y="254" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">低频在前</text>

  <!-- 求和 -->
  <rect x="95" y="280" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="300" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = sum(freqs[:d−k])</text>
  <text x="452" y="300" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">拔掉 d−k 种低频字符</text>

  <!-- 返回 -->
  <rect x="120" y="322" width="100" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="340" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- 箭头 -->
  <path d="M 170 66 L 170 78" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 110 L 170 124" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 156 L 170 160" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 238 190 L 296 190" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 170 218 L 170 232" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="230" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 170 264 L 170 278" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 310 L 170 320" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
