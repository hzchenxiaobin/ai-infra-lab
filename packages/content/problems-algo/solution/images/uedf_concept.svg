<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：出现过的数字「频率全相等」即为好子串</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">子串 s = "1212"：统计每个数字的出现次数，非零计数集合 size==1 即合格</text>

  <!-- 顶部原串 -->
  <g font-size="14" filter="url(#rough2)">
    <rect x="200" y="60" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="220" y="82" text-anchor="middle" fill="#2a4a66" font-weight="bold">1</text>
    <rect x="240" y="60" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="260" y="82" text-anchor="middle" fill="#2a4a66" font-weight="bold">2</text>
    <rect x="280" y="60" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="300" y="82" text-anchor="middle" fill="#2a4a66" font-weight="bold">1</text>
    <rect x="320" y="60" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="340" y="82" text-anchor="middle" fill="#2a4a66" font-weight="bold">2</text>
  </g>

  <!-- 长度1 -->
  <text x="24" y="124" font-size="12" fill="#4a7a3a" font-weight="bold">长度 1</text>
  <g font-size="11" filter="url(#rough2)">
    <rect x="80" y="110" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="97" y="128" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
    <rect x="120" y="110" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="137" y="128" text-anchor="middle" fill="#3a5a2a" font-weight="bold">2</text>
    <text x="170" y="128" font-size="10" fill="#4a7a3a">{1:1} ✓</text>
    <text x="250" y="128" font-size="10" fill="#4a7a3a">{2:1} ✓</text>
    <text x="360" y="128" font-size="10" fill="#888">单字符天然满足：只有一种频率</text>
  </g>

  <!-- 长度2 -->
  <text x="24" y="172" font-size="12" fill="#4a7a3a" font-weight="bold">长度 2</text>
  <g font-size="11" filter="url(#rough2)">
    <rect x="80" y="158" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="97" y="176" text-anchor="middle" fill="#3a5a2a" font-weight="bold">12</text>
    <rect x="120" y="158" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="137" y="176" text-anchor="middle" fill="#3a5a2a" font-weight="bold">21</text>
    <text x="170" y="176" font-size="10" fill="#4a7a3a">{1:1,2:1} ✓</text>
    <text x="290" y="176" font-size="10" fill="#4a7a3a">{2:1,1:1} ✓</text>
  </g>

  <!-- 长度3 -->
  <text x="24" y="220" font-size="12" fill="#b85450" font-weight="bold">长度 3</text>
  <g font-size="11" filter="url(#rough2)">
    <rect x="80" y="206" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="97" y="224" text-anchor="middle" fill="#8a3a36" font-weight="bold">121</text>
    <rect x="120" y="206" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="137" y="224" text-anchor="middle" fill="#8a3a36" font-weight="bold">212</text>
    <text x="170" y="224" font-size="10" fill="#b85450">{1:2,2:1} ✗</text>
    <text x="290" y="224" font-size="10" fill="#b85450">{2:2,1:1} ✗</text>
  </g>

  <!-- 长度4 -->
  <text x="24" y="268" font-size="12" fill="#4a7a3a" font-weight="bold">长度 4</text>
  <g font-size="11" filter="url(#rough2)">
    <rect x="80" y="254" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="97" y="272" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1212</text>
    <text x="170" y="272" font-size="10" fill="#4a7a3a">{1:2,2:2} ✓</text>
  </g>

  <!-- 关键结论框 -->
  <rect x="30" y="300" width="500" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="324" font-size="12" fill="#7a5a20" font-weight="bold">判定规则（freq-of-freq 不变式）</text>
  <text x="48" y="346" font-size="11" fill="#444">• 维护每个数字的计数 cnt[d]，再维护「频率的频率」fof[c] = 恰好出现 c 次的数字种数</text>
  <text x="48" y="366" font-size="11" fill="#444">• distinct = 非零 fof 的种类数；<tspan fill="#4a7a3a" font-weight="bold">distinct == 1</tspan> ⟺ 所有出现过的数字频率全相等 ⟺ 好子串</text>
  <text x="48" y="388" font-size="11" fill="#888">• "121"：fof={2:1, 1:1} → distinct=2 ✗   "1212"：fof={2:2} → distinct=1 ✓</text>

  <text x="470" y="128" font-size="10" fill="#4a7a3a" filter="url(#rough2)">答案：5 个去重好子串</text>
</svg>
