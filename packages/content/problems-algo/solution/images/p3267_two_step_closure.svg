<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：对换的复合仍然可逆 —— 两步闭包</text>
  <text x="260" y="37" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">补零定长后「两步可达」双向等价，I 版的哈希骨架原封不动</text>

  <!-- 层 0：自身 -->
  <text x="60" y="48" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">0 次 —— 自身</text>
  <rect x="60" y="54" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="94" y="54" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="128" y="54" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="54" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="75" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="109" y="75" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="143" y="75" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="177" y="75" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="200" y="75" font-size="10.5" fill="#666" filter="url(#rough2)">（x 已在 S 中）</text>

  <path d="M 100 90 L 100 112" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="106" font-size="9.5" fill="#a07830" filter="url(#rough2)">任选两位交换</text>

  <!-- 层 1：一步变体 -->
  <text x="60" y="124" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">1 次 —— 一步变体 ×C(L,2) = 21 种</text>
  <rect x="60" y="130" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="86" y="130" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="130" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="130" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="148" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="98" y="148" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="124" y="148" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="180" y="130" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="130" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="130" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="130" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="148" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="218" y="148" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="244" y="148" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="270" y="148" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="288" y="148" font-size="11" fill="#a07830" filter="url(#rough2)">…</text>

  <path d="M 100 160 L 100 182" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="176" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">在中间串上再换一次</text>

  <!-- 层 2：两步变体 -->
  <text x="60" y="194" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 次 —— 两步变体 ×21×21 = 441 种组合</text>
  <rect x="60" y="200" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="86" y="200" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="200" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="200" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="72" y="218" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="98" y="218" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="124" y="218" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="150" y="218" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="180" y="200" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="200" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="200" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="200" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="218" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="218" y="218" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="244" y="218" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="270" y="218" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="284" y="218" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 213（前导 0 消掉）</text>

  <!-- 右侧：对称性框 -->
  <rect x="316" y="48" width="178" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="68" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">对称性升级 ✓</text>
  <text x="405" y="88" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">(σ∘τ)⁻¹ = τ⁻¹∘σ⁻¹ = τ∘σ</text>
  <text x="405" y="105" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">对换自逆，逆仍是两个对换的复合</text>
  <text x="405" y="124" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">x 两步到 y ⇔ y 两步到 x</text>
  <text x="405" y="141" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">「或」塌缩成单向 → 单向判定成立</text>

  <!-- 右侧：能力边界框 -->
  <rect x="316" y="158" width="178" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="178" text-anchor="middle" font-size="11.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">两步的能力边界</text>
  <text x="405" y="197" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">3-cycle：123 → 231 ✓（恰 2 次）</text>
  <text x="405" y="214" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">4-cycle：1023 → 2130 ✗（需 3 次）</text>
  <text x="405" y="231" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">两步至多撼动 4 个错位位置，</text>
  <text x="405" y="245" text-anchor="middle" font-size="10" fill="#8a3833" font-weight="bold" filter="url(#rough2)">闭包绝不能越界！</text>

  <!-- 底部模板框 -->
  <rect x="36" y="262" width="458" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="283" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">S(x) = {x} ∪ 一步变体 ∪ 两步变体（数值化入集合，≤ 463 个）</text>
  <text x="265" y="304" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">处理 x：先查 ans += Σ seen[v]（v ∈ S(x)），后插 seen[x] += 1</text>
  <text x="265" y="326" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">时间 O(n·L⁴)：n = 5000，L ≤ 7 → 约 2.3×10⁶ 次变换，稳过</text>
</svg>
