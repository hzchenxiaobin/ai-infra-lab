<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：team = [0, 0, 1, 0, 1, 0]，dist = 1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">捉人者(1)在 [2]、[5]；逃跑者(0)在 [0]、[1]、[3]、[5?]…逐轮贪心配对</text>

  <!-- ===== team array reference ===== -->
  <text x="30" y="72" font-size="10" fill="#446688" font-weight="bold">下标</text>
  <g font-size="9" fill="#888">
    <text x="60" y="72" text-anchor="middle">[0]</text>
    <text x="100" y="72" text-anchor="middle">[1]</text>
    <text x="140" y="72" text-anchor="middle">[2]</text>
    <text x="180" y="72" text-anchor="middle">[3]</text>
    <text x="220" y="72" text-anchor="middle">[4]</text>
    <text x="260" y="72" text-anchor="middle">[5]</text>
  </g>
  <g font-size="13">
    <rect x="40" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="60" y="99" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="80" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="100" y="99" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="120" y="78" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="140" y="99" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="160" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="180" y="99" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="200" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="220" y="99" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="240" y="78" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="260" y="99" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- ===== Step 1 ===== -->
  <rect x="30" y="128" width="500" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="150" font-size="12" fill="#b85450" font-weight="bold">步骤 1：i=2(捉人), j=0(逃跑)</text>
  <text x="48" y="168" font-size="11" fill="#555">|2 − 0| = 2 &gt; dist=1，不在范围</text>
  <text x="48" y="184" font-size="11" fill="#b85450" font-weight="bold">j &lt; i → runner[0] 永不可抓（所有捉人者都在 [2] 右侧，更远）→ j++，j=1</text>

  <!-- mini array with pointers -->
  <g font-size="11">
    <rect x="340" y="138" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
    <text x="354" y="153" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="354" y="134" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">j</text>
    <rect x="370" y="138" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
    <text x="384" y="153" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="400" y="138" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="414" y="153" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="414" y="134" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">i</text>
    <text x="440" y="153" font-size="10" fill="#888">…</text>
  </g>
  <text x="500" y="178" text-anchor="middle" font-size="11" fill="#888">count=0</text>

  <!-- ===== Step 2 ===== -->
  <rect x="30" y="208" width="500" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="230" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 2：i=2(捉人), j=1(逃跑)</text>
  <text x="48" y="248" font-size="11" fill="#555">|2 − 1| = 1 ≤ dist=1，在范围内</text>
  <text x="48" y="264" font-size="11" fill="#4a7a3a" font-weight="bold">→ 配对！it[2] 抓 runner[1]，count=1，i++→4, j++→3</text>

  <g font-size="11">
    <rect x="340" y="218" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
    <text x="354" y="233" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="370" y="218" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
    <text x="384" y="233" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="384" y="214" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">j</text>
    <rect x="400" y="218" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="414" y="233" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="414" y="214" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">i</text>
    <path d="M 384 244 L 384 248 L 414 248 L 414 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  </g>
  <text x="500" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count=1</text>

  <!-- ===== Step 3 ===== -->
  <rect x="30" y="288" width="500" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="310" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 3：i=4(捉人), j=3(逃跑)</text>
  <text x="48" y="328" font-size="11" fill="#555">|4 − 3| = 1 ≤ dist=1，在范围内</text>
  <text x="48" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">→ 配对！it[4] 抓 runner[3]，count=2，i++→5(team=1,跳过到6), 结束</text>

  <g font-size="11">
    <rect x="370" y="298" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
    <text x="384" y="313" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="384" y="294" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">j</text>
    <rect x="400" y="298" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
    <text x="414" y="313" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="430" y="298" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="444" y="313" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="444" y="294" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">i</text>
    <path d="M 384 324 L 384 328 L 444 328 L 444 324" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  </g>
  <text x="500" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count=2</text>

  <!-- ===== Result ===== -->
  <rect x="30" y="372" width="500" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="394" font-size="12" fill="#446688" font-weight="bold">最终配对方案：</text>
  <text x="48" y="414" font-size="11" fill="#555">it[2]→runner[1] ✓，it[4]→runner[3] ✓；runner[0] 被跳过（太远），runner[5?] 不存在</text>
  <text x="460" y="408" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">= 2</text>

  <!-- ===== Sample example ===== -->
  <rect x="30" y="440" width="500" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="48" y="460" font-size="11" fill="#d6a040" font-weight="bold">对照官方样例：team=[0,1,0,1,0], dist=3 → it[1]→run[0], it[3]→run[2] = 2</text>
</svg>
