<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：content_id = 2 的 "the QUICK-brown fox" 全流程</text>

  <rect x="30" y="36" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">explode① 按 ' ' 拆 3 词 → explode② 词内按 '-' 拆段（普通词 1 段）</text>

  <rect x="30" y="76" width="62" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="61" y="91" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">word_pos</text>
  <rect x="92" y="76" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="91" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">word</text>
  <rect x="188" y="76" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="91" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">part_pos</text>
  <rect x="248" y="76" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="91" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">part</text>
  <rect x="344" y="76" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="389" y="91" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">cap_part</text>
  <rect x="434" y="76" width="96" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="482" y="91" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cap_word</text>

  <rect x="30" y="98" width="62" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
