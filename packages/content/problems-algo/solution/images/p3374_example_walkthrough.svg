  <text x="140" y="152" text-anchor="middle" font-size="9" fill="#8a3030" filter="url(#rough2)">QUICK-brown</text>
  <rect x="188" y="138" width="60" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="152" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="248" y="138" width="96" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="296" y="152" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">brown</text>
  <rect x="344" y="138" width="90" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
