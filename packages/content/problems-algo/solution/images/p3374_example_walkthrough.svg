  <rect x="30" y="158" width="62" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="61" y="172" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <rect x="92" y="158" width="96" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="172" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">fox</text>
  <rect x="188" y="158" width="60" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="172" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="248" y="158" width="96" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="296" y="172" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">fox</text>
  <rect x="344" y="158" width="90" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="389" y="172" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Fox</text>
  <rect x="434" y="160" width="96" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="482" y="173" text-anchor="middle" font-size="9" fill="#2d5a1e" filter="url(#rough2)">Fox</text>

  <path d="M 220 190 L 220 208" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="212" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="227" text-anchor="middle" font-size="9.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">implode② GROUP_CONCAT(cap_word ORDER BY word_pos SEPARATOR ' ')</text>
  <text x="280" y="241" text-anchor="middle" font-size="10" fill="#2d5a1e" filter="url(#rough2)">The + Quick-Brown + Fox = "The Quick-Brown Fox" ✓</text>

  <rect x="30" y="258" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">连字符词不必特判：explode② 对每个词独立执行，普通词 '-' 数 = 0 → 段数 1</text>

  <rect x="30" y="296" width="500" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">再走一行：id = 4 "web-based FRONT-end development"</text>
  <text x="280" y="330" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">web-based → Web-Based；FRONT-end → Front-End（两段各自变形再拼回）</text>
  <text x="280" y="343" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">→ "Web-Based Front-End Development" —— 一行里两个连字符词也只是多几行 part</text>

  <rect x="30" y="356" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">自查口诀：original_text 原样、converted_text 对照 —— QUICK 压成 Quick、brown 升成 Brown</text>
</svg>
