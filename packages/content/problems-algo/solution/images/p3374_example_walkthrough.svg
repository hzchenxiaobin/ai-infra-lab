  <text x="296" y="112" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">the</text>
  <rect x="344" y="98" width="90" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="389" y="112" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">The</text>
  <rect x="434" y="98" width="96" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="482" y="112" text-anchor="middle" font-size="9" fill="#2d5a1e" filter="url(#rough2)">The</text>

  <rect x="30" y="118" width="62" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="61" y="132" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="92" y="118" width="96" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="132" text-anchor="middle" font-size="9" fill="#8a3030" filter="url(#rough2)">QUICK-brown</text>
  <rect x="188" y="118" width="60" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="132" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="248" y="118" width="96" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="296" y="132" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">QUICK</text>
  <rect x="344" y="118" width="90" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="389" y="132" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Quick</text>
  <rect x="434" y="118" width="96" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="482" y="142" text-anchor="middle" font-size="9.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">Quick-Brown</text>
  <text x="482" y="154" text-anchor="middle" font-size="7.5" fill="#4a7a3a" filter="url(#rough2)">implode① 用 '-'</text>

  <rect x="30" y="138" width="62" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="61" y="152" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
