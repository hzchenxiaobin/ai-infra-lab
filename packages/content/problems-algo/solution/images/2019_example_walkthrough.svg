<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：s = "7+3*1*2", answers = [20,13,42]
  </text>

  <!-- Phase 1: Correct answer -->
  <text x="40" y="56" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    第一步：计算正确答案（先乘后加）
  </text>

  <g filter="url(#rough2)">
    <rect x="40" y="66" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="56" y="84" font-size="11" fill="#333">先算乘法（左→右）：3*1=3, 3*2=6</text>
    <text x="56" y="100" font-size="11" fill="#333">表达式变为 7+6</text>
    <text x="56" y="116" font-size="11" fill="#4a7a3a" font-weight="bold">再算加法：7+6 = 13 ✓</text>
  </g>

  <!-- Phase 2: Interval DP -->
  <text x="40" y="146" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">
    第二步：区间 DP 枚举所有可能的求值结果
  </text>

  <!-- len=1 (diagonal) -->
  <text x="40" y="168" font-size="10" fill="#888" filter="url(#rough2)">len=1（对角线初始化）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="176" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="60" y="192" text-anchor="middle" font-size="10" fill="#333">{7}</text>
    <rect x="84" y="176" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="104" y="192" text-anchor="middle" font-size="10" fill="#333">{3}</text>
    <rect x="128" y="176" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="148" y="192" text-anchor="middle" font-size="10" fill="#333">{1}</text>
    <rect x="172" y="176" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="192" y="192" text-anchor="middle" font-size="10" fill="#333">{2}</text>
  </g>

  <!-- len=2 -->
  <text x="220" y="168" font-size="10" fill="#888" filter="url(#rough2)">len=2</text>
  <g filter="url(#rough2)">
    <rect x="220" y="176" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="255" y="192" text-anchor="middle" font-size="10" fill="#333">7+3={10}</text>
    <rect x="294" y="176" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="329" y="192" text-anchor="middle" font-size="10" fill="#333">3*1={3}</text>
    <rect x="368" y="176" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="403" y="192" text-anchor="middle" font-size="10" fill="#333">1*2={2}</text>
  </g>

  <!-- len=3 -->
  <text x="40" y="216" font-size="10" fill="#888" filter="url(#rough2)">len=3</text>
  <g filter="url(#rough2)">
    <!-- dp[0][2]: 7+3*1, splits at k=0(+), k=1(*) -->
    <rect x="40" y="224" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="50" y="240" font-size="10" fill="#333">dp[0][2]: "7+3*1"</text>
    <text x="50" y="256" font-size="9" fill="#888">k=0: 7+(3*1)=7+3=10</text>
    <text x="160" y="256" font-size="9" fill="#888">k=1: (7+3)*1=10</text>
    <text x="135" y="240" anchor="middle" font-size="10" fill="#446688" font-weight="bold"></text>
  </g>
  <text x="250" y="250" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">→ {10}</text>

  <g filter="url(#rough2)">
    <rect x="300" y="224" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="310" y="240" font-size="10" fill="#333">dp[1][3]: "3*1*2"</text>
    <text x="310" y="256" font-size="9" fill="#888">k=1: 3*(1*2)=3*2=6</text>
    <text x="420" y="256" font-size="9" fill="#888">k=2: (3*1)*2=6</text>
  </g>
  <text x="510" y="250" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">→ {6}</text>

  <!-- len=4: dp[0][3] -->
  <text x="40" y="284" font-size="10" fill="#d6a040" filter="url(#rough2)">len=4: dp[0][3] = "7+3*1*2"（枚举 3 个切分点）</text>

  <g filter="url(#rough2)">
    <!-- k=0: 7 + dp[1][3] -->
    <rect x="40" y="296" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="50" y="312" font-size="10" fill="#333">k=0, ops[0]='+'</text>
    <text x="50" y="328" font-size="9" fill="#333">7 + {6} = {13}</text>
  </g>

  <g filter="url(#rough2)">
    <!-- k=1: dp[0][1] * dp[2][3] -->
    <rect x="200" y="296" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="210" y="312" font-size="10" fill="#333">k=1, ops[1]='*'</text>
    <text x="210" y="328" font-size="9" fill="#333">{10} * {2} = {20}</text>
  </g>

  <g filter="url(#rough2)">
    <!-- k=2: dp[0][2] * 2 -->
    <rect x="370" y="296" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="380" y="312" font-size="10" fill="#333">k=2, ops[2]='*'</text>
    <text x="380" y="328" font-size="9" fill="#333">{10} * 2 = {20}</text>
  </g>

  <!-- Union -->
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">↓ 取并集</text>

  <rect x="180" y="366" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">
    所有结果 = {13, 20}
  </text>

  <!-- Phase 3: Scoring -->
  <text x="40" y="418" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    第三步：打分
  </text>

  <g filter="url(#rough2)">
    <rect x="40" y="430" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="115" y="446" text-anchor="middle" font-size="10" fill="#333">答案 20 ≠ 13</text>
    <text x="115" y="460" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">∈ {13,20} → 2 分</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="200" y="430" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="275" y="446" text-anchor="middle" font-size="10" fill="#333">答案 13 = 13</text>
    <text x="275" y="460" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">正确 → 5 分</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="360" y="430" width="150" height="36" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5" rx="6"/>
    <text x="435" y="446" text-anchor="middle" font-size="10" fill="#333">答案 42</text>
    <text x="435" y="460" text-anchor="middle" font-size="11" fill="#888">不在结果中 → 0 分</text>
  </g>

  <text x="280" y="478" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">
    总分 = 2 + 5 + 0 = 7
  </text>
</svg>
