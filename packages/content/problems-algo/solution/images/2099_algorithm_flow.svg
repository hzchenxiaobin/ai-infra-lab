<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：选 k 个最大值 + 按下标还原</text>

  <rect x="180" y="48" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 构造 (值, 下标) 对</text>
  <text x="280" y="80" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">pairs = [(nums[i], i) for i]</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="180" y="112" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 按值降序排序</text>
  <text x="280" y="144" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">sort by value desc</text>

  <path d="M 280 154 L 280 172" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="180" y="176" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 取前 k 个</text>
  <text x="280" y="208" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">top = pairs[:k]</text>

  <path d="M 280 218 L 280 236" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="180" y="240" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 按下标升序排序 top</text>
  <text x="280" y="272" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">sort by index asc</text>

  <path d="M 280 282 L 280 300" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="180" y="304" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 取 value 输出</text>
  <text x="280" y="336" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">return [v for v,_ in top]</text>

  <!-- 选择阶段分组 -->
  <rect x="40" y="112" width="120" height="104" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="100" y="160" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">选择阶段</text>
  <text x="100" y="174" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">O(n log n)</text>

  <!-- 还原阶段分组 -->
  <rect x="400" y="240" width="120" height="44" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="460" y="258" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">还原阶段</text>
  <text x="460" y="272" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">O(k log k)</text>

  <rect x="40" y="372" width="480" height="48" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">总时间 O(n log n + k log k)，空间 O(n)</text>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k≪n 时可用最小堆 O(n log k) 或 nth_element O(n) 替换 ②③</text>
</svg>
