<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "abbcccaa"，逐位追踪 len 与累加 ans</text>

  <!-- run band labels on far left -->
  <text x="32" y="86" font-size="11" fill="#888" filter="url(#rough2)">段</text>

  <!-- table header -->
  <g font-size="12" fill="#555" font-weight="bold" text-anchor="middle">
    <rect x="60" y="62" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="90" y="80" filter="url(#rough2)">i</text>
    <rect x="120" y="62" width="70" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="155" y="80" filter="url(#rough2)">s[i]</text>
    <rect x="190" y="62" width="110" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="245" y="80" filter="url(#rough2)">与前一字符</text>
    <rect x="300" y="62" width="70" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="335" y="80" filter="url(#rough2)">len</text>
    <rect x="370" y="62" width="90" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="415" y="80" filter="url(#rough2)">ans</text>
  </g>

  <!-- run color bands (left margin) for the 4 runs: a / bb / ccc / aa -->
  <rect x="36" y="94" width="20" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="36" y="126" width="20" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="36" y="190" width="20" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="36" y="286" width="20" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <!-- data rows: i, s[i], relation, len, ans -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <!-- i=0 a, start, len=1, ans=1 -->
    <rect x="60" y="94" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="90" y="115" filter="url(#rough2)">0</text>
    <rect x="120" y="94" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="155" y="115" filter="url(#rough2)">a</text>
    <rect x="190" y="94" width="110" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="245" y="115" fill="#888" filter="url(#rough2)">起始</text>
    <rect x="300" y="94" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="335" y="115" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="370" y="94" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="415" y="115" filter="url(#rough2)">1</text>

    <!-- i=1 b, change, len=1, ans=2 -->
    <rect x="60" y="126" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="90" y="147" filter="url(#rough2)">1</text>
    <rect x="120" y="126" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="155" y="147" filter="url(#rough2)">b</text>
    <rect x="190" y="126" width="110" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="245" y="147" fill="#b85450" filter="url(#rough2)">换 → 重置</text>
    <rect x="300" y="126" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="335" y="147" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="370" y="126" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="415" y="147" filter="url(#rough2)">2</text>

    <!-- i=2 b, same, len=2, ans=4 -->
    <rect x="60" y="158" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="90" y="179" filter="url(#rough2)">2</text>
    <rect x="120" y="158" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="155" y="179" filter="url(#rough2)">b</text>
    <rect x="190" y="158" width="110" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="245" y="179" fill="#4a7a3a" filter="url(#rough2)">同 → +1</text>
    <rect x="300" y="158" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="335" y="179" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
    <rect x="370" y="158" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="415" y="179" filter="url(#rough2)">4</text>

    <!-- i=3 c, change, len=1, ans=5 -->
    <rect x="60" y="190" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="90" y="211" filter="url(#rough2)">3</text>
    <rect x="120" y="190" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="155" y="211" filter="url(#rough2)">c</text>
    <rect x="190" y="190" width="110" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="245" y="211" fill="#b85450" filter="url(#rough2)">换 → 重置</text>
    <rect x="300" y="190" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="335" y="211" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="370" y="190" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="415" y="211" filter="url(#rough2)">5</text>

    <!-- i=4 c, same, len=2, ans=7 -->
    <rect x="60" y="222" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="90" y="243" filter="url(#rough2)">4</text>
    <rect x="120" y="222" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="155" y="243" filter="url(#rough2)">c</text>
    <rect x="190" y="222" width="110" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="245" y="243" fill="#4a7a3a" filter="url(#rough2)">同 → +1</text>
    <rect x="300" y="222" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="335" y="243" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
    <rect x="370" y="222" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="415" y="243" filter="url(#rough2)">7</text>

    <!-- i=5 c, same, len=3, ans=10 -->
    <rect x="60" y="254" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="90" y="275" filter="url(#rough2)">5</text>
    <rect x="120" y="254" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="155" y="275" filter="url(#rough2)">c</text>
    <rect x="190" y="254" width="110" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="245" y="275" fill="#4a7a3a" filter="url(#rough2)">同 → +1</text>
    <rect x="300" y="254" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="335" y="275" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="370" y="254" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="415" y="275" filter="url(#rough2)">10</text>

    <!-- i=6 a, change, len=1, ans=11 -->
    <rect x="60" y="286" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="90" y="307" filter="url(#rough2)">6</text>
    <rect x="120" y="286" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="155" y="307" filter="url(#rough2)">a</text>
    <rect x="190" y="286" width="110" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="245" y="307" fill="#b85450" filter="url(#rough2)">换 → 重置</text>
    <rect x="300" y="286" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="335" y="307" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="370" y="286" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="415" y="307" filter="url(#rough2)">11</text>

    <!-- i=7 a, same, len=2, ans=13 -->
    <rect x="60" y="318" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="90" y="339" filter="url(#rough2)">7</text>
    <rect x="120" y="318" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="155" y="339" filter="url(#rough2)">a</text>
    <rect x="190" y="318" width="110" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="245" y="339" fill="#4a7a3a" filter="url(#rough2)">同 → +1</text>
    <rect x="300" y="318" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="335" y="339" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
    <rect x="370" y="318" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="415" y="339" filter="url(#rough2)">13</text>
  </g>

  <!-- final answer highlight -->
  <path d="M 415 352 L 415 360 L 470 360" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="368" width="118" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="489" y="390" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 13 ✓</text>

  <!-- segment summary -->
  <text x="60" y="384" font-size="11.5" fill="#555" filter="url(#rough2)">分段求和：1 + (1+2) + (1+2+3) + (1+2) = 1+3+6+3 = 13</text>
  <text x="60" y="404" font-size="11.5" fill="#555" filter="url(#rough2)">每段 len 走 1,2,…,k → 累加值恰为 <tspan fill="#b85450" font-weight="bold">k(k+1)/2</tspan>，增量法与公式法等价</text>
</svg>
