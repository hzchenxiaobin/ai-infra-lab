<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举集中目标 i，前缀或 | (nums[i]&lt;&lt;k) | 后缀或</text>

  <!-- Step 0: preprocess suffix or -->
  <rect x="150" y="44" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 预处理后缀或 suf[i]（从右往左）</text>

  <path d="M 280 78 L 280 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="170" y="100" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 初始化 pre=0, ans=0</text>

  <path d="M 280 134 L 280 152" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition diamond -->
  <polygon points="280,156 400,200 280,244 160,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <text x="280" y="214" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">枚举集中目标</text>

  <!-- No branch: right -->
  <path d="M 400 200 L 470 200" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- Return -->
  <rect x="412" y="184" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- Yes branch: down -->
  <path d="M 280 244 L 280 260" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="256" font-size="10" fill="#888" filter="url(#rough2)">是</text>

  <!-- Step 3: compute candidate -->
  <rect x="120" y="264" width="320" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 候选 = pre | (nums[i] &lt;&lt; k) | suf[i]</text>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">左侧或 |  目标左移k  | 右侧或</text>

  <path d="M 280 312 L 280 328" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: update ans -->
  <rect x="160" y="332" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ ans = max(ans, 候选)</text>

  <path d="M 280 366 L 280 382" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: update prefix or -->
  <rect x="160" y="386" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ pre |= nums[i]（累入前缀或）</text>

  <!-- Loop back arrow -->
  <path d="M 160 403 L 80 403 L 80 200 L 160 200" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="300" font-size="10" fill="#888" filter="url(#rough2)">i++</text>
  <text x="88" y="314" font-size="10" fill="#888" filter="url(#rough2)">回到</text>
  <text x="88" y="328" font-size="10" fill="#888" filter="url(#rough2)">判断</text>

  <!-- Annotation -->
  <rect x="410" y="370" width="140" height="76" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="480" y="390" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">pre：单变量</text>
  <text x="480" y="406" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">suf：预处理数组</text>
  <text x="480" y="424" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">O(n) 时间</text>
  <text x="480" y="440" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">O(n) 空间</text>
</svg>
