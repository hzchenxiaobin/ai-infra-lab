<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：双计数器一遍扫描</text>

  <!-- 开始 -->
  <rect x="215" y="34" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 60 L 260 72" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="175" y="76" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">even = 0, odd = 0, i = 0</text>
  <path d="M 260 106 L 260 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 菱形1: i < n? -->
  <polygon points="260,124 330,158 260,192 190,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- no → 右侧终止比较 -->
  <path d="M 330 158 L 380 158" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="352" y="150" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <polygon points="450,124 510,158 450,192 390,158" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="156" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">even == odd ?</text>

  <path d="M 450 124 L 450 106" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="460" y="114" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="395" y="72" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="450" y="91" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return true</text>

  <path d="M 450 192 L 450 210" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="460" y="206" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="395" y="214" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="450" y="233" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- yes ↓ -->
  <path d="M 260 192 L 260 208" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="270" y="204" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- d = num[i] - '0' -->
  <rect x="180" y="212" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">d = num[i] − '0'</text>
  <path d="M 260 242 L 260 256" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 菱形2: i & 1 ? -->
  <polygon points="260,260 340,296 260,332 180,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">i &amp; 1 == 0 ?</text>
  <text x="260" y="310" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">（偶数下标？）</text>

  <!-- 是 → even += d -->
  <path d="M 180 296 L 150 296" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="166" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="42" y="280" width="104" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="94" y="301" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">even += d</text>

  <!-- 否 → odd += d -->
  <path d="M 340 296 L 372 296" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="288" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="378" y="280" width="104" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="301" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">odd += d</text>

  <!-- 汇合 → i++ -->
  <path d="M 94 312 L 94 356 L 245 356" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 430 312 L 430 356 L 275 356" fill="none" stroke="#a07830" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="215" y="342" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="245" y="361" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">i++</text>

  <!-- 回环箭头 -->
  <path d="M 215 356 C 120 356, 120 158, 186 158" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="132" y="264" font-size="10" fill="#666" filter="url(#rough2)">回到 i &lt; n</text>

  <!-- 底部要点 -->
  <rect x="20" y="392" width="480" height="62" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="412" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">💡 每个字符只属于一个桶 ⇒ 分桶互斥且完备 ⇒ 一遍扫描同步累加：</text>
  <text x="34" y="428" font-size="10" fill="#333" filter="url(#rough2)">时间 O(n)：每个位置一次判桶 + 一次加法；空间 O(1)：只有 even / odd 两个 int。</text>
  <text x="34" y="444" font-size="10" fill="#333" filter="url(#rough2)">进阶：奇桶加数取负号合成单变量 diff，最后判 diff == 0（见题解第 5 节）。</text>
</svg>
