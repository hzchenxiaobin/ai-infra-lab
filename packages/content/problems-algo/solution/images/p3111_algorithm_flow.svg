<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 一遍扫描，x 超界就开新矩形</text>

  <!-- start -->
  <rect x="205" y="36" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 points（n ≤ 10⁵）、w</text>

  <path d="M 300 68 L 300 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="210" y="92" width="180" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="113" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">按 x 升序排序（重复 x 无妨）</text>

  <path d="M 300 124 L 300 144" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="195" y="148" width="210" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="169" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">ans = 0，bound = −1（已盖最右 x）</text>

  <path d="M 300 180 L 300 198" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: more points? -->
  <polygon points="300,200 390,236 300,272 210,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有未处理的点？</text>
  <text x="300" y="248" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">y 坐标根本不看</text>

  <!-- no: return -->
  <path d="M 390 236 L 451 236" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="420" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="455" y="218" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="501" y="241" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>

  <!-- yes -->
  <path d="M 300 272 L 300 292" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="312" y="286" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- diamond 2: x > bound? -->
  <polygon points="300,294 385,330 300,366 215,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="326" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x &gt; bound ?</text>
  <text x="300" y="342" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">在已开矩形够得着吗</text>

  <!-- yes: new rectangle -->
  <path d="M 385 330 L 398 330" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="392" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="402" y="304" width="150" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="477" y="324" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">开新矩形</text>
  <text x="477" y="344" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ans += 1；bound = x + w</text>

  <!-- no: skip -->
  <path d="M 215 330 L 202 330" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="208" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="18" y="304" width="184" height="52" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="324" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">跳过：x ≤ bound</text>
  <text x="110" y="344" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">已被上个矩形盖住</text>

  <!-- next point -->
  <rect x="206" y="398" width="190" height="44" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="301" y="416" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">取下一个点 (x, y)</text>
  <text x="301" y="434" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">沿排序后的序列前进</text>

  <!-- merge arrows -->
  <path d="M 477 356 L 477 420 L 400 420" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 110 356 L 110 420 L 202 420" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 300 442 L 300 458 L 22 458 L 22 236 L 206 236" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="452" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">回到「还有未处理的点？」</text>

  <!-- note -->
  <rect x="100" y="466" width="360" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="483" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">正确性：盖住最左点的矩形右端至多 x_min + w，贪心取满右端 ⇒ 不劣</text>
</svg>
