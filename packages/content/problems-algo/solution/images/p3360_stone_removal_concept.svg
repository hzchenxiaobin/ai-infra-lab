<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：移除序列 10, 9, 8, … 完全固定，与谁在玩无关</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第 i 手恰好移除 11−i 个 → Alice 拿奇数手（10, 8, 6, …），Bob 拿偶数手（9, 7, 5, …）</text>

  <!-- 操作序列格子 -->
  <text x="28" y="68" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">操作序列：</text>

  <text x="52" y="66" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第1手</text>
  <rect x="26" y="72" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="52" y="99" text-anchor="middle" font-size="16" fill="#33506b" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="52" y="126" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">Alice</text>

  <text x="108" y="66" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第2手</text>
  <rect x="82" y="72" width="52" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="108" y="99" text-anchor="middle" font-size="16" fill="#a07830" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="108" y="126" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">Bob</text>

  <text x="164" y="66" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第3手</text>
  <rect x="138" y="72" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="99" text-anchor="middle" font-size="16" fill="#33506b" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="164" y="126" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">Alice</text>

  <text x="220" y="66" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第4手</text>
  <rect x="194" y="72" width="52" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="99" text-anchor="middle" font-size="16" fill="#a07830" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="220" y="126" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">Bob</text>

  <text x="276" y="66" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第5手</text>
  <rect x="250" y="72" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="276" y="99" text-anchor="middle" font-size="16" fill="#33506b" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="276" y="126" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">Alice</text>

  <text x="332" y="66" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第6手</text>
  <rect x="306" y="72" width="52" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="99" text-anchor="middle" font-size="16" fill="#a07830" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="332" y="126" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">Bob</text>

  <text x="388" y="66" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第7手</text>
  <rect x="362" y="72" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="388" y="99" text-anchor="middle" font-size="16" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="388" y="126" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">Alice</text>

  <text x="444" y="66" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第8手</text>
  <rect x="418" y="72" width="52" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="444" y="99" text-anchor="middle" font-size="16" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="444" y="126" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">Bob</text>

  <text x="488" y="99" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">…</text>

  <!-- 累计门槛 -->
  <text x="260" y="156" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">累计移除量 T(m) = 10+9+…+(11−m)：奇数 T 是 Bob 的卡壳门槛</text>

  <rect x="32" y="168" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="62" y="182" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">T(1)</text>
  <text x="62" y="196" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10</text>

  <rect x="98" y="168" width="60" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="128" y="182" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">T(2)</text>
  <text x="128" y="196" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">19</text>

  <rect x="164" y="168" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="194" y="182" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">T(3)</text>
  <text x="194" y="196" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">27</text>

  <rect x="230" y="168" width="60" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">T(4)</text>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">34</text>

  <rect x="296" y="168" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="326" y="182" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">T(5)</text>
  <text x="326" y="196" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">40</text>

  <rect x="362" y="168" width="60" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="392" y="182" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">T(6)</text>
  <text x="392" y="196" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">45</text>

  <rect x="428" y="168" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="458" y="182" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">T(7)</text>
  <text x="458" y="196" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">49</text>

  <!-- 判定框 -->
  <rect x="55" y="222" width="410" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最长可完成手数 m = max{ m : T(m) ≤ n }</text>
  <text x="260" y="256" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">m 为奇 → Bob 卡壳，Alice 赢；m 为偶（含 0）→ Alice 卡壳，输</text>

  <!-- 陷阱提示 -->
  <rect x="20" y="282" width="480" height="112" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="302" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 「恰好移除」= 双方零决策空间：这不是博弈 DP 题，是纯模拟！</text>
  <text x="34" y="320" font-size="10" fill="#333" filter="url(#rough2)">· 每手移除量只由规则决定（上一手减 1），玩家没有任何选择；</text>
  <text x="34" y="338" font-size="10" fill="#333" filter="url(#rough2)">· 「移不动」= 剩余石头 n &lt; 本次该移的 k，先移不动者判负；</text>
  <text x="34" y="356" font-size="10" fill="#333" filter="url(#rough2)">· n &lt; 10：Alice 第一手就移不动，m = 0（偶）→ 直接 false；</text>
  <text x="34" y="374" font-size="10" fill="#333" filter="url(#rough2)">· 10+9+…+1 = 55 ≥ 50 ≥ n，游戏至多 10 手内必然结束，循环天然有界。</text>
</svg>
