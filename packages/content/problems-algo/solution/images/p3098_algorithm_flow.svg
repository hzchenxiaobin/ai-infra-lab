<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 逐差值阈值计数</text>

  <!-- 步骤 1 -->
  <rect x="160" y="44" width="150" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="64" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 排序 nums</text>
  <path d="M235,74 L235,90" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="105" y="92" width="260" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="112" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 收集全部数对差 D，升序去重（≤ n²/2 个）</text>
  <path d="M235,122 L235,138" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3：循环头 -->
  <rect x="115" y="140" width="240" height="30" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="160" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③ 循环：d ∈ D（升序），prev = 0</text>
  <path d="M235,170 L235,186" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：贪心判定 -->
  <polygon points="235,188 325,222 235,256 145,222" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贪心 O(n)：存在</text>
  <text x="235" y="235" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k 个间隔 ≥ d ？</text>

  <!-- 否 → break -->
  <path d="M325,222 L360,222" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="341" y="212" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="364" y="200" width="146" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="437" y="218" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">break：d 升序</text>
  <text x="437" y="234" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⇒ 后续全不可行</text>

  <!-- 是 → DP -->
  <path d="M235,256 L235,272" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="268" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="80" y="274" width="310" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="296" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">④ DP 计数 cnt_ge(d)：dp 前缀和转移 k−1 轮</text>
  <path d="M235,308 L235,324" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 5 -->
  <rect x="60" y="326" width="350" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="346" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ ans += (d − prev)·cnt_ge(d)，prev = d，回到 ③</text>

  <!-- 循环回箭头 -->
  <path d="M410,341 C470,341 480,155 355,155" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="478" y="290" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)" transform="rotate(90 478 290)">下一个 d</text>
</svg>
