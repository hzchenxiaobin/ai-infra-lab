<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：分数 = 相邻字符 ASCII 差的绝对值逐对累加</text>

  <text x="76" y="52" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">s = "hello"</text>

  <!-- char boxes: letter + ascii -->
  <rect x="76" y="60" width="52" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102" y="88" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="102" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">104</text>

  <rect x="148" y="60" width="52" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="174" y="88" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="174" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">101</text>

  <rect x="220" y="60" width="52" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="246" y="88" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="246" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">108</text>

  <rect x="292" y="60" width="52" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="318" y="88" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="318" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">108</text>

  <rect x="364" y="60" width="52" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="390" y="88" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="390" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">111</text>

  <!-- dashed connectors box-bottom -> diff tag -->
  <path d="M 102 124 L 138 140" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 174 124 L 138 140" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 174 124 L 210 140" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 246 124 L 210 140" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 246 124 L 282 140" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 318 124 L 282 140" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 318 124 L 354 140" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 390 124 L 354 140" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- diff tags -->
  <rect x="119" y="140" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="138" y="159" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="191" y="140" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="159" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="263" y="140" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="282" y="159" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="312" y="159" font-size="10" fill="#b85450" filter="url(#rough2)">相同字符 → 0</text>

  <rect x="335" y="140" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="354" y="159" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>

  <path d="M 246 172 L 246 194" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="106" y="198" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="246" y="221" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">score = 3 + 7 + 0 + 3 = 13</text>

  <rect x="60" y="250" width="400" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每对贡献 |a−b| 与方向无关："az" 与 "za" 都计 25</text>

  <rect x="60" y="296" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">score(s) = Σ |ord(s[i]) − ord(s[i+1])|，i = 0 … n−2</text>

  <rect x="48" y="344" width="424" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">n−1 个相邻对逐对独立计费 → 一趟扫描累加即可</text>
  <text x="260" y="380" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">答案上界 99 对 × 25 = 2475，int 稳稳装下</text>
</svg>
