<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：示例 1 逐对求交（三对矩形）</text>

  <!-- left panel: coordinates -->
  <rect x="22" y="38" width="214" height="282" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="129" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1 坐标图</text>

  <!-- R0: (1,1)-(3,3) -->
  <rect x="70" y="222" width="52" height="52" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="82" y="266" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">R0</text>

  <!-- R1: (2,2)-(4,4) -->
  <rect x="96" y="196" width="52" height="52" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="104" y="212" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">R1</text>

  <!-- R2: (3,1)-(6,6) -->
  <rect x="122" y="144" width="78" height="130" fill="#fff8e1" fill-opacity="0.35" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="176" y="162" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">R2</text>

  <!-- intersection (0,1): 1x1 square -->
  <rect x="96" y="222" width="26" height="26" fill="#fce4ec" fill-opacity="0.9" stroke="#b85450" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <text x="109" y="239" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1×1</text>

  <!-- intersection (1,2): 1x2 -->
  <rect x="122" y="196" width="26" height="52" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="2" filter="url(#rough2)"/>
  <text x="135" y="226" text-anchor="middle" font-size="8.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1×2</text>

  <!-- touching edge (0,2): x=3 -->
  <path d="M 122 222 L 122 274" stroke="#b85450" stroke-width="2.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="105" y="292" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">贴边 w=0</text>
  <path d="M 112 284 L 120 270" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="34" y="300" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="52" y="310" font-size="9" fill="#b85450" filter="url(#rough2)">正方形</text>
  <rect x="100" y="300" width="12" height="12" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="118" y="310" font-size="9" fill="#8a6d3b" filter="url(#rough2)">交集</text>

  <!-- right panel: pair table -->
  <rect x="246" y="38" width="252" height="282" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="372" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逐对计算</text>

  <!-- header -->
  <rect x="262" y="70" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">对</text>
  <text x="344" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">w × h</text>
  <text x="396" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="448" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">面积</text>

  <!-- row (0,1) -->
  <rect x="262" y="96" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="115" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0,1)</text>
  <text x="344" y="115" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1 × 1</text>
  <text x="396" y="115" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="448" y="115" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row (0,2) -->
  <rect x="262" y="126" width="220" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0,2)</text>
  <text x="344" y="145" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">0 × 2</text>
  <text x="396" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="448" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>

  <!-- row (1,2) -->
  <rect x="262" y="156" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,2)</text>
  <text x="344" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1 × 2</text>
  <text x="396" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="448" y="175" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- answer row -->
  <rect x="262" y="186" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="286" y="205" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="344" y="205" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">—</text>
  <text x="396" y="205" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">1</text>
  <text x="448" y="205" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- notes -->
  <text x="262" y="236" font-size="9.5" fill="#666" filter="url(#rough2)">・(0,2) 只贴边（w=0）→ 交集是线段，记 0</text>
  <text x="262" y="254" font-size="9.5" fill="#666" filter="url(#rough2)">・(1,2) 交集 1×2，正方形边长只能取 1</text>
  <text x="262" y="272" font-size="9.5" fill="#666" filter="url(#rough2)">・(0,1) 与 (1,2) 并列最优</text>
  <text x="262" y="298" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">官方输出：1 ✓</text>

  <!-- bottom strip: example 3 -->
  <rect x="22" y="330" width="476" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3 速览：两两分离，答案 0</text>
  <text x="110" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">(0,1): w = −1 ✗</text>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">(0,2): w = −1 ✗</text>
  <text x="410" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">(1,2): h = −1 ✗</text>
</svg>
