<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 530"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="530" fill="#fafafa"/>

  <text x="20" y="24" font-size="13" fill="#333" filter="url(#rough2)">算法流程：二分水平线 y，check = 线下面积是否过半</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="52" rx="40" ry="16" fill="#f5f5f5" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M260,68 L260,80" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1 -->
  <rect x="60" y="84" width="400" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 计算 total = Σ lᵢ²（总面积）</text>
  <text x="260" y="121" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">二分区间 lo = 0，hi = max(yᵢ + lᵢ)</text>

  <path d="M260,128 L260,140" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2 -->
  <rect x="110" y="144" width="300" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 取中点 mid = (lo + hi) / 2</text>

  <path d="M260,174 L260,186" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3 -->
  <rect x="85" y="190" width="350" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ below = Σ lᵢ · min(max(mid − yᵢ, 0), lᵢ)</text>
  <text x="260" y="227" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每个正方形独立贡献，重叠天然多次计数</text>

  <path d="M260,234 L260,246" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1 -->
  <polygon points="260,248 380,290 260,332 140,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 × below ≥ total ？</text>
  <text x="260" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（线下面积过半了吗）</text>

  <!-- 是 分支 -->
  <path d="M260,332 L260,346" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="344" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="160" y="350" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">hi = mid（上界左压）</text>

  <!-- 否 分支绕行到 lo 框 -->
  <path d="M140,290 L55,290 L55,420 L150,420" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="282" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="155" y="404" width="210" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="424" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">lo = mid（下界右压）</text>

  <!-- hi 框出边向下，lo 框出边汇合 -->
  <path d="M260,380 L260,404" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,434 L260,448" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定2：迭代次数 -->
  <polygon points="260,452 355,478 260,504 165,478" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="483" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">迭代满 100 次？</text>

  <!-- 否：回边 -->
  <path d="M355,478 L490,478 L490,159 L414,159" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="497" y="320" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(90 497,320)">否，继续二分</text>

  <!-- 是：到结束 -->
  <path d="M260,504 L260,516" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="514" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="318" y="526" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">返回 hi</text>
</svg>
