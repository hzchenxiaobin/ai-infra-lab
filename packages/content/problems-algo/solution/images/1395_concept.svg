<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：枚举中间点 j，四量乘积求和</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">固定中位 j，左侧分大小 × 右侧分大小 → 递增队伍 + 递减队伍</text>

  <!-- index labels -->
  <text x="120" y="86" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <text x="180" y="86" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <text x="270" y="86" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j=2</text>
  <text x="360" y="86" text-anchor="middle" font-size="10" fill="#888">k=3</text>
  <text x="420" y="86" text-anchor="middle" font-size="10" fill="#888">k=4</text>

  <!-- rating array: [2, 5, 3, 4, 1] -->
  <!-- leftSmaller: index0 rating2 (green) -->
  <rect x="96" y="96" width="48" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="123" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <!-- leftLarger: index1 rating5 (orange) -->
  <rect x="156" y="96" width="48" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="123" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">5</text>
  <!-- middle j=2 rating3 (red, emphasized) -->
  <rect x="246" y="92" width="48" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">3</text>
  <!-- rightLarger: index3 rating4 (green) -->
  <rect x="336" y="96" width="48" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="123" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">4</text>
  <!-- rightSmaller: index4 rating1 (orange) -->
  <rect x="396" y="96" width="48" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="123" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>

  <!-- region labels -->
  <text x="138" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">← 左侧</text>
  <text x="270" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">中位 j</text>
  <text x="378" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">右侧 →</text>

  <!-- leftSmaller / leftLarger annotations -->
  <path d="M 120 144 L 120 168" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="120" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a">2 &lt; 3 ✓</text>
  <text x="120" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">leftSmaller</text>

  <path d="M 180 144 L 180 168" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="180" y="184" text-anchor="middle" font-size="10" fill="#d6a040">5 &gt; 3 ✓</text>
  <text x="180" y="198" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">leftLarger</text>

  <!-- rightLarger / rightSmaller annotations -->
  <path d="M 360 144 L 360 168" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="360" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a">4 &gt; 3 ✓</text>
  <text x="360" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">rightLarger</text>

  <path d="M 420 144 L 420 168" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="420" y="184" text-anchor="middle" font-size="10" fill="#d6a040">1 &lt; 3 ✓</text>
  <text x="420" y="198" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">rightSmaller</text>

  <!-- two contribution formulas -->
  <!-- increasing team -->
  <rect x="40" y="220" width="560" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="244" font-size="12" fill="#4a7a3a" font-weight="bold">递增队伍  rating[i] &lt; rating[j] &lt; rating[k]</text>
  <text x="60" y="264" font-size="12" fill="#444">方案数 = leftSmaller × rightLarger = 1 × 1 = </text>
  <text x="436" y="264" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="460" y="264" font-size="11" fill="#888">  例：(2, 3, 4)</text>
  <!-- arc 2 -> 3 -> 4 -->
  <path d="M 120 138 Q 195 210 270 138" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 270 138 Q 315 210 360 138" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- decreasing team -->
  <rect x="40" y="288" width="560" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="312" font-size="12" fill="#d6a040" font-weight="bold">递减队伍  rating[i] &gt; rating[j] &gt; rating[k]</text>
  <text x="60" y="332" font-size="12" fill="#444">方案数 = leftLarger × rightSmaller = 1 × 1 = </text>
  <text x="436" y="332" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="460" y="332" font-size="11" fill="#888">  例：(5, 3, 1)</text>
  <!-- arc 5 -> 3 -> 1 -->
  <path d="M 180 138 Q 225 60 270 138" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 270 138 Q 345 60 420 138" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- total contribution for j=2 -->
  <rect x="40" y="360" width="560" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="382" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">j=2 的贡献 = 递增 1 + 递减 1 = 2</text>
  <text x="320" y="400" text-anchor="middle" font-size="10" fill="#888">遍历每个 j 做中位，累加所有贡献即为总方案数</text>

  <!-- footnote -->
  <text x="320" y="432" text-anchor="middle" font-size="10" fill="#999">rating = [2, 5, 3, 4, 1]，固定 j=2（rating=3）示范四量分解</text>
</svg>
