<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：完成先后乱序，最终数组保序</text>

  <!-- ===== Example 3 (all resolve) ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">示例 3：f0→4(50ms), f1→10(150ms), f2→16(100ms)</text>

  <!-- timeline labels -->
  <text x="40" y="90" font-size="10" fill="#888">f0</text>
  <text x="40" y="120" font-size="10" fill="#888">f1</text>
  <text x="40" y="150" font-size="10" fill="#888">f2</text>
  <text x="40" y="180" font-size="10" fill="#888">count</text>
  <text x="40" y="210" font-size="10" fill="#888">results</text>

  <!-- baselines -->
  <line x1="120" y1="85" x2="520" y2="85" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="115" x2="520" y2="115" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="145" x2="520" y2="145" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- time markers -->
  <text x="120" y="240" font-size="9" fill="#aaa">0</text>
  <text x="240" y="240" font-size="9" fill="#aaa">50ms</text>
  <text x="390" y="240" font-size="9" fill="#aaa">100ms</text>
  <text x="490" y="240" font-size="9" fill="#aaa">150ms</text>

  <!-- f0 bar 0→50ms resolve 4 -->
  <rect x="120" y="78" width="120" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="89" font-size="10" fill="#446688" font-weight="bold">→ 4 ✓</text>

  <!-- f1 bar 0→150ms resolve 10 -->
  <rect x="120" y="108" width="370" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500" y="119" font-size="10" fill="#446688" font-weight="bold">→ 10 ✓</text>

  <!-- f2 bar 0→100ms resolve 16 -->
  <rect x="120" y="138" width="270" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="149" font-size="10" fill="#446688" font-weight="bold">→ 16 ✓</text>

  <!-- count steps -->
  <rect x="120" y="173" width="120" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="184" font-size="9" fill="#d6a040">1（f0 完成）</text>
  <rect x="390" y="173" width="10" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="405" y="184" font-size="9" fill="#d6a040">2（f2）</text>
  <rect x="490" y="173" width="10" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="505" y="184" font-size="9" fill="#4a7a3a">3=n ✓</text>

  <!-- results slots -->
  <rect x="120" y="203" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="217" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[0]=4</text>
  <rect x="250" y="203" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="217" text-anchor="middle" font-size="9" fill="#b85450">[1]=空</text>
  <rect x="360" y="203" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="217" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[2]=16</text>

  <!-- final resolve arrow -->
  <path d="M 490 188 L 490 203" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- final result box -->
  <rect x="250" y="250" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">resolve([4, 10, 16])  ← 保序</text>

  <!-- note -->
  <text x="380" y="300" text-anchor="middle" font-size="9" fill="#888">完成顺序 0→2→1，但 results 按索引落位，最终数组仍 [4,10,16]</text>

  <!-- divider -->
  <line x1="40" y1="320" x2="520" y2="320" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Example 2 (reject) ===== -->
  <text x="40" y="348" font-size="12" fill="#b85450" font-weight="bold">示例 2：f0→1(200ms), f1 reject "Error"(100ms)</text>

  <text x="40" y="380" font-size="10" fill="#888">f0</text>
  <text x="40" y="410" font-size="10" fill="#888">f1</text>

  <line x1="120" y1="375" x2="520" y2="375" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="405" x2="520" y2="405" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="120" y="440" font-size="9" fill="#aaa">0</text>
  <text x="310" y="440" font-size="9" fill="#aaa">100ms</text>
  <text x="480" y="440" font-size="9" fill="#aaa">200ms</text>

  <!-- f0 still pending at 100ms -->
  <rect x="120" y="368" width="370" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500" y="379" font-size="10" fill="#888">pending…</text>

  <!-- f1 rejects at 100ms -->
  <rect x="120" y="398" width="190" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="409" font-size="10" fill="#b85450" font-weight="bold">✗ "Error"</text>

  <!-- immediate reject -->
  <path d="M 310 412 L 310 426" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="220" y="428" width="240" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="340" y="446" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">reject("Error") ← 首拒即短路</text>
</svg>
