<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">划分 DP：枚举最后一刀 t，前 t 个分 j−1 组，尾段单独成第 j 组</text>

  <!-- nums row: 5 cells -->
  <text x="40" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="90" y="58" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="78" text-anchor="middle" font-size="12" fill="#333">·</text>
  <rect x="136" y="58" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="78" text-anchor="middle" font-size="12" fill="#333">·</text>
  <rect x="182" y="58" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="78" text-anchor="middle" font-size="12" fill="#333">·</text>
  <rect x="228" y="58" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="251" y="78" text-anchor="middle" font-size="12" fill="#333">·</text>
  <rect x="274" y="58" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="78" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">·</text>

  <!-- index labels: t cut between cell3(index3) and cell4(index4) -->
  <text x="113" y="104" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="205" y="104" text-anchor="middle" font-size="10" fill="#888">t−1</text>
  <text x="228" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">t</text>
  <text x="297" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i−1</text>

  <!-- cut scissors line at t -->
  <path d="M 228 44 L 228 100" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="236" y="40" font-size="10" fill="#d6a040" font-weight="bold">切点 t</text>

  <!-- bracket over left part: 前 t 个 -->
  <path d="M 90 50 Q 90 40 98 40 L 270 40 Q 274 40 274 50" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="180" y="34" text-anchor="middle" font-size="11" fill="#4a7a3a">nums[0..t−1] 分成 j−1 组</text>

  <!-- bracket over right part: 第 j 组 -->
  <path d="M 228 50 Q 228 40 236 40 L 316 40 Q 320 40 320 50" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="274" y="34" text-anchor="middle" font-size="11" fill="#b85450">第 j 组 nums[t..i−1]</text>

  <!-- two boxes below -->
  <rect x="36" y="146" width="200" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">前 t 个分 j−1 组</text>
  <text x="136" y="192" text-anchor="middle" font-size="11" fill="#444">最优分数 = dp[t][j−1]</text>
  <text x="136" y="210" text-anchor="middle" font-size="10" fill="#888">已在上轮算好，直接查表</text>

  <rect x="276" y="146" width="208" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">尾段 nums[t..i−1] 单成一组</text>
  <text x="380" y="192" text-anchor="middle" font-size="11" fill="#444">均值 = (pref[i]−pref[t]) / (i−t)</text>
  <text x="380" y="210" text-anchor="middle" font-size="10" fill="#888">前缀和 O(1) 算出</text>

  <!-- merge arrows -->
  <path d="M 136 220 Q 136 240 200 250" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 380 220 Q 380 240 320 250" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">枚举所有 t，取最大</text>

  <!-- equation box -->
  <rect x="30" y="258" width="460" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">dp[i][j] = max&#8282; dp[t][j−1] + (pref[i] − pref[t]) / (i − t) &#8282;</text>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#666">t ∈ [j−1, i−1]    基准 dp[i][1] = pref[i] / i</text>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = dp[n][k]</text>
</svg>
