<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 435"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="435" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">单遍扫描：规范化求 key → 哈希计数</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="210" y="34" width="100" height="30" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="54" text-anchor="middle" font-size="13" fill="#8a6d1a">开始</text>
  </g>
  <path d="M 260 64 L 260 84" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取单词 -->
  <g filter="url(#rough2)">
    <rect x="185" y="88" width="150" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="109" text-anchor="middle" font-size="12.5" fill="#33506b">取出下一个单词 w</text>
  </g>
  <path d="M 260 120 L 260 140" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 首字符偏移 -->
  <g filter="url(#rough2)">
    <rect x="165" y="144" width="190" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="165" text-anchor="middle" font-size="12.5" fill="#33506b">d = w[0] − 'a'（首字符偏移）</text>
  </g>
  <path d="M 260 176 L 260 196" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 规范化 -->
  <g filter="url(#rough2)">
    <rect x="140" y="200" width="240" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="218" text-anchor="middle" font-size="12" fill="#33506b">规范化：每个字符 c</text>
    <text x="260" y="236" text-anchor="middle" font-size="12" fill="#33506b">→ ( c − 'a' − d + 26 ) % 26</text>
  </g>
  <path d="M 260 244 L 260 264" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 哈希计数 -->
  <g filter="url(#rough2)">
    <rect x="165" y="268" width="190" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="260" y="286" text-anchor="middle" font-size="12.5" fill="#8a3030" font-weight="bold">ans += cnt[key]</text>
    <text x="260" y="304" text-anchor="middle" font-size="12.5" fill="#8a3030">cnt[key] += 1</text>
  </g>
  <path d="M 260 312 L 260 328" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <g filter="url(#rough2)">
    <polygon points="260,330 340,372 260,414 180,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="377" text-anchor="middle" font-size="12" fill="#8a6d1a">还有单词吗？</text>
  </g>

  <!-- 是：回环 -->
  <path d="M 180 372 L 95 372 L 95 104 L 181 104" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="137" y="364" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">是</text>

  <!-- 否：返回 -->
  <path d="M 340 372 L 364 372" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="364" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="368" y="352" width="132" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="434" y="369" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">返回 ans</text>
    <text x="434" y="386" text-anchor="middle" font-size="10.5" fill="#2f5d24">（= Σ c·(c−1)/2）</text>
  </g>

  <!-- 说明框 -->
  <g filter="url(#rough2)">
    <rect x="385" y="88" width="122" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="446" y="108" text-anchor="middle" font-size="10.5" fill="#2f5d24">n·m ≤ 10⁵</text>
    <text x="446" y="127" text-anchor="middle" font-size="10.5" fill="#2f5d24">总时间 O(n·m)</text>
    <text x="446" y="146" text-anchor="middle" font-size="10.5" fill="#2f5d24">同 key 一组 c 个</text>
    <text x="446" y="165" text-anchor="middle" font-size="10.5" fill="#2f5d24">两两成对 ΣC(c,2)</text>
    <text x="446" y="188" text-anchor="middle" font-size="10.5" fill="#8a3030">ans 可达 ~5×10⁹</text>
  </g>
</svg>
