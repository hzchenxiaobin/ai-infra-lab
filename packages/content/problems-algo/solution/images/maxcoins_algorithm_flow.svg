<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 隔一个取一个</text>

  <!-- Step 0: sort -->
  <rect x="150" y="42" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333">排序 piles（升序）</text>

  <!-- arrow down -->
  <path d="M 270 74 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="96" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="12" fill="#333">n = len / 3, ans = 0, i = n</text>

  <!-- arrow down -->
  <path d="M 270 130 L 270 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < 3n? -->
  <polygon points="270,152 380,196 270,240 160,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333">i &lt; 3n ?</text>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#666">(还有堆可取)</text>

  <!-- No branch -> end -->
  <path d="M 380 196 L 452 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="188" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="196" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="200" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 240 L 270 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="254" font-size="11" fill="#82b366">是</text>

  <!-- accumulate -->
  <rect x="110" y="262" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="12" fill="#333">ans += piles[i]   （你拿第 i 堆）</text>

  <!-- arrow down -->
  <path d="M 270 296 L 270 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step i += 2 -->
  <rect x="110" y="318" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="12" fill="#333">i += 2   （跳过 Alice 拿的那堆）</text>

  <!-- loop back arrow from bottom box up to decision -->
  <path d="M 270 352 L 270 372 L 60 372 L 60 196 L 160 196" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="284" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 52 284)">下一轮</text>

  <!-- note box -->
  <rect x="120" y="388" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="406" text-anchor="middle" font-size="11" fill="#666">i 从 n 起、步长 2，恰好取 n 个</text>
  <text x="270" y="422" text-anchor="middle" font-size="11" fill="#888">落在索引 n, n+2, …, 3n−2</text>
</svg>
