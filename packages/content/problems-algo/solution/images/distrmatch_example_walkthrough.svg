<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "IDID"，n = 4</text>

  <!-- Table outer border -->
  <rect x="24" y="50" width="512" height="208" fill="none" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Column headers -->
  <rect x="24" y="50" width="512" height="32" fill="#e8f0fe" stroke="none" rx="6" filter="url(#rough2)"/>
  <rect x="24" y="74" width="512" height="8" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <text x="46" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="86" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="126" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s[i]</text>
  <text x="168" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">low</text>
  <text x="210" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">high</text>
  <text x="268" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">填入</text>
  <text x="420" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果数组</text>

  <!-- Column dividers -->
  <line x1="68" y1="50" x2="68" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="104" y1="50" x2="104" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="148" y1="50" x2="148" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="188" y1="50" x2="188" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="232" y1="50" x2="232" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="304" y1="50" x2="304" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row dividers -->
  <line x1="24" y1="82" x2="536" y2="82" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="118" x2="536" y2="118" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="154" x2="536" y2="154" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="190" x2="536" y2="190" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="224" x2="536" y2="224" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: step 1, i=0, s[0]=I, low=0, high=4, fill 0 -->
  <text x="46" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="86" y="104" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="126" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">I</text>
  <text x="168" y="104" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="210" y="104" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="268" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="330" y="92" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="348" y="107" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="368" y="92" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="386" y="107" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="406" y="92" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="424" y="107" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="444" y="92" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="462" y="107" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="482" y="92" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="500" y="107" text-anchor="middle" font-size="10" fill="#ccc">_</text>

  <!-- Row 2: step 2, i=1, s[1]=D, low=1, high=4, fill 4 -->
  <text x="46" y="140" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="86" y="140" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="126" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">D</text>
  <text x="168" y="140" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="210" y="140" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="268" y="140" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <rect x="330" y="128" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="348" y="143" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="368" y="128" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="386" y="143" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <rect x="406" y="128" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="424" y="143" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="444" y="128" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="462" y="143" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="482" y="128" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="500" y="143" text-anchor="middle" font-size="10" fill="#ccc">_</text>

  <!-- Row 3: step 3, i=2, s[2]=I, low=1, high=3, fill 1 -->
  <text x="46" y="176" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="86" y="176" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="126" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">I</text>
  <text x="168" y="176" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="210" y="176" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="268" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="330" y="164" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="348" y="179" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="368" y="164" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="386" y="179" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="406" y="164" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="424" y="179" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="444" y="164" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="462" y="179" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="482" y="164" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="500" y="179" text-anchor="middle" font-size="10" fill="#ccc">_</text>

  <!-- Row 4: step 4, i=3, s[3]=D, low=2, high=3, fill 3 -->
  <text x="46" y="212" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="86" y="212" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="126" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">D</text>
  <text x="168" y="212" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="210" y="212" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="268" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <rect x="330" y="200" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="348" y="215" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="368" y="200" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="386" y="215" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="406" y="200" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="424" y="215" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="444" y="200" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="462" y="215" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="482" y="200" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="500" y="215" text-anchor="middle" font-size="10" fill="#ccc">_</text>

  <!-- Row 5: step 5, i=4 (end), low=2=high, fill 2 -->
  <text x="46" y="248" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="86" y="248" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="126" y="248" text-anchor="middle" font-size="10" fill="#888">收尾</text>
  <text x="168" y="248" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="210" y="248" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="268" y="248" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <rect x="330" y="236" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="348" y="251" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="368" y="236" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="386" y="251" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="406" y="236" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="424" y="251" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="444" y="236" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="462" y="251" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="482" y="236" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="500" y="251" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>

  <!-- Bottom note -->
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#888">I 取 low 然后 low++；D 取 high 然后 high--；最后 low==high 收尾</text>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果 = [0, 4, 1, 3, 2] ✓</text>
</svg>
