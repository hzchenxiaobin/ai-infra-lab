<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">两个关键观察：链最多 5 节；数字 1 要特判</text>

  <!-- left panel: chain growth -->
  <text x="160" y="52" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">观察 1：平方链死得快（x ≥ 2）</text>

  <rect x="32" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="54" y="84" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 78 79 L 92 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="96" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="118" y="84" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 142 79 L 156 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="160" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="84" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">16</text>
  <path d="M 206 79 L 220 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="224" y="62" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="84" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">256</text>

  <path d="M 250 98 C 250 116, 90 112, 68 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="32" y="128" width="66" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="65" y="150" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">65536</text>
  <path d="M 100 145 L 134 145" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="138" y="128" width="122" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="199" y="150" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2³² ≈ 4.3×10⁹</text>
  <path d="M 144 132 L 254 158 M 254 132 L 144 158" stroke="#b85450" stroke-width="1.6" fill="none" opacity="0.65" filter="url(#rough2)"/>
  <text x="199" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">超出值域 10⁹，链在此断裂 ✗</text>

  <rect x="26" y="192" width="258" height="62" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="155" y="212" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">指数每步 ×2：1, 2, 4, 8, 16，下一步 32</text>
  <text x="155" y="230" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">x ≥ 2 ⇒ 链长 ≤ 5，模式长度 ≤ 9</text>
  <text x="155" y="248" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">这就是「敢对每个值都走一遍链」的底气</text>

  <!-- right panel: x = 1 -->
  <text x="398" y="52" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">观察 2：x = 1 必须特判</text>
  <text x="398" y="74" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1 的任何幂还是 1 ⇒ 模式 = 奇数个 1</text>

  <rect x="310" y="86" width="26" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="323" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="342" y="86" width="26" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="355" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="374" y="86" width="26" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="387" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="406" y="86" width="26" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="419" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="438" y="86" width="26" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="451" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="470" y="86" width="26" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="483" y="108" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 473 90 L 494 116 M 494 90 L 473 116" stroke="#b85450" stroke-width="1.4" fill="none" opacity="0.8" filter="url(#rough2)"/>
  <text x="398" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6 个 1（偶数）→ 模式只要奇数个 → 用 5 个</text>

  <rect x="310" y="150" width="180" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="169" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">c 个 1：c 为奇 → 全用 c</text>
  <text x="400" y="188" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">c 为偶 → 用 c − 1</text>

  <rect x="300" y="206" width="196" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="398" y="226" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 若把 1 放进通用走链循环：</text>
  <text x="398" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1² = 1，next 永远存在 → 死循环</text>

  <!-- bottom takeaway -->
  <rect x="40" y="270" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = max( x &gt; 1 走链的 2m+1 , 1 的最大奇数份 )</text>
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">两条通道互不干扰：x &gt; 1 的链永远不会经过 1</text>

  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">💡 链长 O(log log V)：值域 10⁹ 只有 5 节，全表走链总代价 O(n)</text>
  <text x="260" y="368" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（值域放大到 10¹⁸ 也只是 6 节）</text>
</svg>
