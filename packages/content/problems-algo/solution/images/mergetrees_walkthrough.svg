<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root1=[1,3,2,5] + root2=[2,1,3,null,4,null,7]</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">root1 节点</text>

  <rect x="190" y="44" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">root2 节点</text>

  <rect x="350" y="44" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">合并结果</text>

  <rect x="500" y="44" width="80" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="540" y="64" text-anchor="middle" font-size="11" fill="#555">说明</text>

  <!-- 行 1 -->
  <rect x="30" y="78" width="140" height="30" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="98" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="190" y="78" width="140" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="350" y="78" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="500" y="78" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="540" y="98" text-anchor="middle" font-size="10" fill="#888">1+2</text>

  <!-- 行 2 -->
  <rect x="30" y="112" width="140" height="30" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="190" y="112" width="140" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="350" y="112" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="500" y="112" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="540" y="132" text-anchor="middle" font-size="10" fill="#888">3+1</text>

  <!-- 行 3 -->
  <rect x="30" y="146" width="140" height="30" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="190" y="146" width="140" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="350" y="146" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="500" y="146" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="540" y="166" text-anchor="middle" font-size="10" fill="#888">2+3</text>

  <!-- 行 4：root1=5, root2=null -->
  <rect x="30" y="180" width="140" height="30" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <rect x="190" y="180" width="140" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#aaa">null</text>
  <rect x="350" y="180" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <rect x="500" y="180" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="540" y="200" text-anchor="middle" font-size="10" fill="#888">搬 r1</text>

  <!-- 行 5：root1=null, root2=4 -->
  <rect x="30" y="214" width="140" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="234" text-anchor="middle" font-size="11" fill="#aaa">null</text>
  <rect x="190" y="214" width="140" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="350" y="214" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="500" y="214" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="540" y="234" text-anchor="middle" font-size="10" fill="#888">搬 r2</text>

  <!-- 行 6：root1=null, root2=null -->
  <rect x="30" y="248" width="140" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="268" text-anchor="middle" font-size="11" fill="#aaa">null</text>
  <rect x="190" y="248" width="140" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#aaa">null</text>
  <rect x="350" y="248" width="140" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="268" text-anchor="middle" font-size="11" fill="#aaa">null</text>
  <rect x="500" y="248" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="540" y="268" text-anchor="middle" font-size="10" fill="#888">都空</text>

  <!-- 行 7：root1=null, root2=7 -->
  <rect x="30" y="282" width="140" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="302" text-anchor="middle" font-size="11" fill="#aaa">null</text>
  <rect x="190" y="282" width="140" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="350" y="282" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="500" y="282" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="540" y="302" text-anchor="middle" font-size="10" fill="#888">搬 r2</text>

  <!-- 最终结果 -->
  <rect x="30" y="334" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="356" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">合并后 = [3, 4, 5, 5, 4, null, 7]</text>

  <!-- 递归说明 -->
  <rect x="30" y="378" width="540" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="398" text-anchor="middle" font-size="11" fill="#555">三分支：都非空→相加递归；仅一空→搬非空子树；都空→null</text>
</svg>
