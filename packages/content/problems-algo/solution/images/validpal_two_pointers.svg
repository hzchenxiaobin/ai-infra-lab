<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：左右双指针向中间逼近，跳过非字母数字</text>

  <!-- string row: "A man, a plan, a canal: Panama" -->
  <!-- char cells -->
  <text x="36" y="92" font-size="11" fill="#888">s =</text>

  <!-- A -->
  <rect x="64" y="70" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">A</text>
  <!-- space (skip) -->
  <rect x="92" y="70" width="20" height="32" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="91" text-anchor="middle" font-size="10" fill="#bbb">·</text>
  <!-- m -->
  <rect x="112" y="70" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">m</text>
  <!-- a -->
  <rect x="140" y="70" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <!-- n -->
  <rect x="168" y="70" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">n</text>
  <!-- comma (skip) -->
  <rect x="196" y="70" width="20" height="32" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="91" text-anchor="middle" font-size="12" fill="#bbb">,</text>
  <!-- space (skip) -->
  <rect x="216" y="70" width="20" height="32" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="91" text-anchor="middle" font-size="10" fill="#bbb">·</text>
  <!-- a -->
  <rect x="236" y="70" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <!-- ... -->
  <text x="284" y="91" text-anchor="middle" font-size="14" fill="#999">…</text>
  <!-- a (mid) -->
  <rect x="304" y="70" width="28" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <!-- ... -->
  <text x="352" y="91" text-anchor="middle" font-size="14" fill="#999">…</text>
  <!-- colon (skip) -->
  <rect x="364" y="70" width="20" height="32" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="91" text-anchor="middle" font-size="12" fill="#bbb">:</text>
  <!-- space (skip) -->
  <rect x="384" y="70" width="20" height="32" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="91" text-anchor="middle" font-size="10" fill="#bbb">·</text>
  <!-- P -->
  <rect x="404" y="70" width="28" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">P</text>
  <!-- a -->
  <rect x="432" y="70" width="28" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <!-- ... -->
  <text x="480" y="91" text-anchor="middle" font-size="14" fill="#999">…</text>
  <!-- a (last) -->
  <rect x="500" y="70" width="28" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="514" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <!-- left pointer -->
  <path d="M 78 56 L 78 64" stroke="#446688" stroke-width="2.2" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="78" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left</text>

  <!-- right pointer -->
  <path d="M 514 108 L 514 100" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="514" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">right</text>

  <!-- legend for skipped chars -->
  <rect x="64" y="150" width="20" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="165" font-size="11" fill="#888">非字母数字（空格 / 逗号 / 冒号）→ 跳过，不参与比较</text>

  <!-- legend for valid chars -->
  <rect x="64" y="180" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="195" font-size="11" fill="#888">字母数字 → 停下比较，大小写忽略（A 与 a 视为相同）</text>

  <!-- compare box -->
  <rect x="60" y="226" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">配对比较：tolower(s[left]) == tolower(s[right]) ？</text>
  <text x="300" y="270" text-anchor="middle" font-size="11" fill="#888">相等 → left++ / right-- 继续；不等 → 立即返回 false</text>

  <!-- final box -->
  <rect x="60" y="298" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">相遇仍未发现不配对 → 返回 true</text>
  <text x="300" y="334" text-anchor="middle" font-size="10" fill="#666">全程只用 left / right 两个下标，O(1) 额外空间</text>
</svg>
