<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：pollHighest 的「弹出 — 核对 — 丢弃」循环</text>
  <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">构造与 updatePriority 只管写；幽灵条目的清理全部摊给 pollHighest 的核对循环</text>

  <!-- right: write operations -->
  <rect x="310" y="54" width="182" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="401" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">构造 EventManager(events)</text>
  <text x="401" y="86" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">live 逐个登记 id → p</text>
  <text x="401" y="100" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">全部 (p, −id) 入堆，heapify O(n)</text>

  <rect x="310" y="132" width="182" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="401" y="150" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">updatePriority(id, np)</text>
  <text x="401" y="164" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">live[id] = np（真身换优先级）</text>
  <text x="401" y="178" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">堆 push (np, −id)</text>
  <text x="401" y="192" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">旧版本不动 → 幽灵候选</text>
  <text x="401" y="208" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">一次写两处，O(log n)</text>

  <!-- left: pollHighest flow -->
  <rect x="95" y="48" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="170" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">pollHighest()</text>
  <path d="M 170 76 L 170 90" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="170,92 235,122 170,152 105,122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="126" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">堆空？</text>
  <path d="M 105 122 L 92 122" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="99" y="114" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="12" y="108" width="78" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="51" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return −1</text>
  <path d="M 170 152 L 170 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="178" y="164" font-size="9" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="95" y="168" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">弹出堆顶 (p, id)</text>
  <path d="M 170 196 L 170 210" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="170,212 245,246 170,280 95,246" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="243" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">核对 live：</text>
  <text x="170" y="257" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">live[id] == p ？</text>
  <path d="M 170 280 L 170 294" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="178" y="292" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="85" y="296" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="314" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">live 删除 id，return id</text>

  <path d="M 245 246 L 298 246" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="240" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="300" y="232" width="112" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="356" y="250" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">幽灵条目 · 丢弃</text>

  <path d="M 412 246 L 497 246 L 497 122 L 243 122" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="112" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">弹完幽灵，继续核对下一个堆顶</text>

  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每个堆条目至多被 push 一次、pop 一次 ⇒ pollHighest 均摊 O(log n)</text>
</svg>
