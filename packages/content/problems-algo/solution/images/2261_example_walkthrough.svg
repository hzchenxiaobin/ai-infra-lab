<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums=[2,3,3,2,2], k=2, p=2</text>

  <!-- nums header -->
  <text x="40" y="56" font-size="11" fill="#888" font-weight="bold">数组（红框=可被 2 整除）：</text>
  <rect x="200" y="42" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="240" y="42" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="280" y="42" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="320" y="42" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="360" y="42" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="220" y="36" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="260" y="36" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="300" y="36" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="340" y="36" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="380" y="36" text-anchor="middle" font-size="9" fill="#888">4</text>

  <!-- Column headers -->
  <text x="50" y="96" font-size="11" fill="#555" font-weight="bold">起点 i</text>
  <text x="120" y="96" font-size="11" fill="#555" font-weight="bold">延伸 j</text>
  <text x="200" y="96" font-size="11" fill="#555" font-weight="bold">子数组</text>
  <text x="380" y="96" font-size="11" fill="#555" font-weight="bold">divCnt</text>
  <text x="450" y="96" font-size="11" fill="#555" font-weight="bold">判定</text>

  <line x1="40" y1="102" x2="520" y2="102" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=0 block -->
  <text x="60" y="122" font-size="11" fill="#446688" font-weight="bold">i=0</text>
  <text x="130" y="122" font-size="11" fill="#333">j=0</text>
  <rect x="200" y="110" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="124" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="395" y="122" font-size="11" fill="#333">1</text>
  <text x="460" y="122" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 入集</text>

  <text x="130" y="144" font-size="11" fill="#333">j=1</text>
  <rect x="200" y="132" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="232" y="132" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="146" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="248" y="146" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="395" y="144" font-size="11" fill="#333">1</text>
  <text x="460" y="144" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 入集</text>

  <text x="130" y="166" font-size="11" fill="#333">j=2</text>
  <rect x="200" y="154" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="232" y="154" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="264" y="154" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="168" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="248" y="168" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="280" y="168" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="395" y="166" font-size="11" fill="#333">1</text>
  <text x="460" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 入集</text>

  <text x="130" y="188" font-size="11" fill="#333">j=3</text>
  <rect x="200" y="176" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="232" y="176" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="264" y="176" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="176" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="190" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="248" y="190" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="280" y="190" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="312" y="190" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="395" y="188" font-size="11" fill="#333">2</text>
  <text x="460" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 入集</text>

  <text x="130" y="210" font-size="11" fill="#333">j=4</text>
  <text x="395" y="210" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="460" y="210" font-size="11" fill="#b85450" font-weight="bold">✗ &gt;k break</text>

  <line x1="40" y1="220" x2="520" y2="220" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- i=1 block -->
  <text x="60" y="240" font-size="11" fill="#446688" font-weight="bold">i=1</text>
  <text x="130" y="240" font-size="11" fill="#333">j=1..2</text>
  <rect x="200" y="228" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="242" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="245" y="240" font-size="10" fill="#888">/ [3,3]</text>
  <text x="395" y="240" font-size="11" fill="#333">0/0</text>
  <text x="460" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 入集×2</text>

  <text x="130" y="262" font-size="11" fill="#333">j=3</text>
  <rect x="200" y="250" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="232" y="250" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="264" y="250" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="264" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="248" y="264" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="395" y="262" font-size="11" fill="#333">1</text>
  <text x="460" y="262" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 入集</text>

  <text x="130" y="284" font-size="11" fill="#333">j=4</text>
  <rect x="200" y="272" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="232" y="272" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="264" y="272" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="272" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="286" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="248" y="286" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="280" y="286" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="312" y="286" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="395" y="284" font-size="11" fill="#333">2</text>
  <text x="460" y="284" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 入集</text>

  <line x1="40" y1="296" x2="520" y2="296" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- i=2 block -->
  <text x="60" y="316" font-size="11" fill="#446688" font-weight="bold">i=2</text>
  <text x="130" y="316" font-size="11" fill="#333">j=2</text>
  <rect x="200" y="304" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="318" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="395" y="316" font-size="11" fill="#333">0</text>
  <text x="460" y="316" font-size="11" fill="#d6a040" font-weight="bold">重复 跳过</text>

  <text x="130" y="338" font-size="11" fill="#333">j=3</text>
  <rect x="200" y="326" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="232" y="326" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="340" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="248" y="340" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="395" y="338" font-size="11" fill="#333">1</text>
  <text x="460" y="338" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 入集</text>

  <text x="130" y="360" font-size="11" fill="#333">j=4</text>
  <rect x="200" y="348" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="232" y="348" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="264" y="348" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="362" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="248" y="362" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="395" y="360" font-size="11" fill="#333">2</text>
  <text x="460" y="360" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 入集</text>

  <line x1="40" y1="372" x2="520" y2="372" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- i=3 block -->
  <text x="60" y="392" font-size="11" fill="#446688" font-weight="bold">i=3</text>
  <text x="130" y="392" font-size="11" fill="#333">j=3</text>
  <rect x="200" y="380" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="394" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="395" y="392" font-size="11" fill="#333">1</text>
  <text x="460" y="392" font-size="11" fill="#d6a040" font-weight="bold">重复 跳过</text>

  <text x="130" y="414" font-size="11" fill="#333">j=4</text>
  <rect x="200" y="402" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="232" y="402" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="416" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="248" y="416" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="395" y="414" font-size="11" fill="#333">2</text>
  <text x="460" y="414" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 入集</text>

  <line x1="40" y1="426" x2="520" y2="426" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- i=4 block -->
  <text x="60" y="446" font-size="11" fill="#446688" font-weight="bold">i=4</text>
  <text x="130" y="446" font-size="11" fill="#333">j=4</text>
  <rect x="200" y="434" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="448" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="395" y="446" font-size="11" fill="#333">1</text>
  <text x="460" y="446" font-size="11" fill="#d6a040" font-weight="bold">重复 跳过</text>

  <!-- result box -->
  <rect x="40" y="476" width="480" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="498" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">seen 集合最终内容（11 个不同子数组）：</text>
  <text x="50" y="518" font-size="10.5" fill="#333">[2]·[2,3]·[2,3,3]·[2,3,3,2]·[3]·[3,3]·[3,3,2]·[3,3,2,2]·[3,2]·[3,2,2]·[2,2]</text>
  <text x="280" y="534" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = len(seen) = 11</text>
</svg>
