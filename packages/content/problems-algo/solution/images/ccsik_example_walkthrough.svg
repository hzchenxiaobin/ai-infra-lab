<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：同桶多字符抢占槽位的两种结局</text>

  <!-- ===== Example 3: true ===== -->
  <rect x="24" y="44" width="532" height="178" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="40" y="66" font-size="12" fill="#4a7a3a" font-weight="bold">例 3：s="aab", t="bbb", k=27 → true ✓</text>

  <text x="40" y="92" font-size="10" fill="#888">s=</text>
  <rect x="60" y="78" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="76" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="96" y="78" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="132" y="78" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="148" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>

  <text x="180" y="92" font-size="10" fill="#888">t=</text>
  <rect x="200" y="78" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="236" y="78" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="252" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="272" y="78" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="288" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>

  <text x="40" y="124" font-size="10" fill="#888">d=</text>
  <rect x="60" y="110" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="76" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="110" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="132" y="110" width="32" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="148" y="127" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="180" y="124" font-size="10" fill="#666">→ 桶 d=1：count=2</text>

  <text x="40" y="158" font-size="10" fill="#888" font-weight="bold">占槽：</text>
  <rect x="80" y="144" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="102" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="132" y="160" font-size="12" fill="#999">…</text>
  <rect x="150" y="144" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="172" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">27</text>

  <text x="210" y="158" font-size="10" fill="#666">最大槽 = 1 + 26·(2−1) = 27</text>
  <text x="210" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">27 ≤ k=27 ✓ → true</text>

  <line x1="200" y1="140" x2="200" y2="186" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">k=27</text>

  <!-- ===== Example 2: false ===== -->
  <rect x="24" y="218" width="532" height="194" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="40" y="240" font-size="12" fill="#b85450" font-weight="bold">例 2：s="abc", t="bcd", k=10 → false ✗</text>

  <text x="40" y="266" font-size="10" fill="#888">s=</text>
  <rect x="60" y="252" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="76" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="96" y="252" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="132" y="252" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="148" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>

  <text x="180" y="266" font-size="10" fill="#888">t=</text>
  <rect x="200" y="252" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="236" y="252" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="252" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <rect x="272" y="252" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="288" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d</text>

  <text x="40" y="298" font-size="10" fill="#888">d=</text>
  <rect x="60" y="284" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="76" y="301" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="284" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="301" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="132" y="284" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="301" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="180" y="298" font-size="10" fill="#666">→ 桶 d=1：count=3</text>

  <text x="40" y="332" font-size="10" fill="#888" font-weight="bold">占槽：</text>
  <rect x="80" y="318" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="102" y="336" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="132" y="334" font-size="12" fill="#999">…</text>
  <rect x="150" y="318" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="172" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">27</text>
  <text x="202" y="334" font-size="12" fill="#999">…</text>
  <rect x="220" y="318" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="242" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">53</text>

  <text x="280" y="332" font-size="10" fill="#666">最大槽 = 1 + 26·(3−1) = 53</text>
  <text x="280" y="350" font-size="11" fill="#b85450" font-weight="bold">53 > k=10 ✗ → false</text>

  <line x1="138" y1="314" x2="138" y2="360" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="138" y="374" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">k=10</text>

  <!-- Bottom note -->
  <rect x="24" y="424" width="532" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="40" y="442" font-size="11" fill="#444" font-weight="bold">关键：同桶第 c 个位置必占槽 d + 26·c，最大槽 = d + 26·(count−1)，越界即 false</text>
</svg>
