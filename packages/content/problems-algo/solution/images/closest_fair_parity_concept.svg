<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：公平 = 偶数位个数 = 奇数位个数 ⟹ 总位数必为偶数</text>

  <!-- ===== Row 1: even digits ===== -->
  <text x="44" y="64" font-size="12" fill="#446688" font-weight="bold">偶数位</text>
  <g filter="url(#rough2)">
    <rect x="100" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="142" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="184" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="226" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="268" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" fill="#333" font-weight="bold">
    <text x="120" y="66" text-anchor="middle">0</text>
    <text x="162" y="66" text-anchor="middle">2</text>
    <text x="204" y="66" text-anchor="middle">4</text>
    <text x="246" y="66" text-anchor="middle">6</text>
    <text x="288" y="66" text-anchor="middle">8</text>
  </g>
  <text x="330" y="66" font-size="11" fill="#888">5 种</text>

  <!-- ===== Row 1b: odd digits ===== -->
  <text x="44" y="104" font-size="12" fill="#4a7a3a" font-weight="bold">奇数位</text>
  <g filter="url(#rough2)">
    <rect x="100" y="86" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="142" y="86" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="184" y="86" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="226" y="86" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="268" y="86" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" fill="#333" font-weight="bold">
    <text x="120" y="106" text-anchor="middle">1</text>
    <text x="162" y="106" text-anchor="middle">3</text>
    <text x="204" y="106" text-anchor="middle">5</text>
    <text x="246" y="106" text-anchor="middle">7</text>
    <text x="288" y="106" text-anchor="middle">9</text>
  </g>
  <text x="330" y="106" font-size="11" fill="#888">5 种</text>

  <!-- ===== Row 2: example numbers ===== -->
  <text x="44" y="156" font-size="12" fill="#888" font-weight="bold">示例</text>

  <!-- 10 : fair -->
  <g filter="url(#rough2)">
    <rect x="100" y="138" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="134" y="138" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" fill="#333" font-weight="bold">
    <text x="117" y="158" text-anchor="middle">1</text>
    <text x="151" y="158" text-anchor="middle">0</text>
  </g>
  <text x="178" y="158" font-size="11" fill="#555">奇1 偶1</text>
  <text x="240" y="158" font-size="12" fill="#4a7a3a" font-weight="bold">公平 ✓</text>

  <!-- 403 : unfair -->
  <g filter="url(#rough2)">
    <rect x="100" y="178" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="134" y="178" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="168" y="178" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" fill="#333" font-weight="bold">
    <text x="117" y="198" text-anchor="middle">4</text>
    <text x="151" y="198" text-anchor="middle">0</text>
    <text x="185" y="198" text-anchor="middle">3</text>
  </g>
  <text x="212" y="198" font-size="11" fill="#555">奇1 偶2（3 位）</text>
  <text x="330" y="198" font-size="12" fill="#b85450" font-weight="bold">不公平 ✗（奇位数必无解）</text>

  <!-- 1001 : fair -->
  <g filter="url(#rough2)">
    <rect x="100" y="218" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="134" y="218" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="168" y="218" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="202" y="218" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" fill="#333" font-weight="bold">
    <text x="117" y="238" text-anchor="middle">1</text>
    <text x="151" y="238" text-anchor="middle">0</text>
    <text x="185" y="238" text-anchor="middle">0</text>
    <text x="219" y="238" text-anchor="middle">1</text>
  </g>
  <text x="246" y="238" font-size="11" fill="#555">奇2 偶2</text>
  <text x="320" y="238" font-size="12" fill="#4a7a3a" font-weight="bold">公平 ✓</text>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="272" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">公平 ⟹ 偶位数 = 奇位数 ⟹ 总位数必为偶数</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#555">奇数位数 k 的 n：无任何 k 位公平数，答案至少 k+1 位</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#555">最小 (k+1) 位公平数 = 10^k + repunit(k÷2)（末尾补奇数位 1）</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">偶位数 k：若本身公平返回，否则 +1 逐个找下一个</text>
</svg>
