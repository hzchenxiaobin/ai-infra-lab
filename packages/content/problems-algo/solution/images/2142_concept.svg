<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrDashed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心概念：乘客搭乘到达时间 ≥ 自己的最早公交车</text>
  <path d="M 180 36 Q 360 44 540 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Timeline axis ===== -->
  <text x="40" y="70" font-size="11" fill="#888">时间轴</text>
  <line x1="60" y1="200" x2="660" y2="200" stroke="#999" stroke-width="2" filter="url(#rough2)"/>

  <!-- Time tick marks: 0,1,2,3,4,5,6,7,8 -->
  <g font-size="9" fill="#aaa" text-anchor="middle">
    <line x1="80" y1="196" x2="80" y2="206" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="80" y="220">0</text>
    <line x1="140" y1="196" x2="140" y2="206" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="140" y="220">1</text>
    <line x1="200" y1="196" x2="200" y2="206" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="200" y="220">2</text>
    <line x1="260" y1="196" x2="260" y2="206" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="260" y="220">3</text>
    <line x1="320" y1="196" x2="320" y2="206" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="320" y="220">4</text>
    <line x1="380" y1="196" x2="380" y2="206" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="380" y="220">5</text>
    <line x1="440" y1="196" x2="440" y2="206" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="440" y="220">6</text>
    <line x1="500" y1="196" x2="500" y2="206" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="500" y="220">7</text>
    <line x1="560" y1="196" x2="560" y2="206" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="560" y="220">8</text>
  </g>

  <!-- ===== Buses (above timeline) ===== -->
  <text x="40" y="110" font-size="10" fill="#446688" font-weight="bold">🚌 公交车</text>

  <!-- Bus 1 at t=2 -->
  <g filter="url(#rough2)"><rect x="176" y="118" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/></g>
  <text x="200" y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Bus 1</text>
  <text x="200" y="148" text-anchor="middle" font-size="9" fill="#666">t=2</text>
  <line x1="200" y1="154" x2="200" y2="196" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Bus 2 at t=4 -->
  <g filter="url(#rough2)"><rect x="296" y="118" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/></g>
  <text x="320" y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Bus 2</text>
  <text x="320" y="148" text-anchor="middle" font-size="9" fill="#666">t=4</text>
  <line x1="320" y1="154" x2="320" y2="196" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Bus 3 at t=7 -->
  <g filter="url(#rough2)"><rect x="476" y="118" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/></g>
  <text x="500" y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Bus 3</text>
  <text x="500" y="148" text-anchor="middle" font-size="9" fill="#666">t=7</text>
  <line x1="500" y1="154" x2="500" y2="196" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== Passengers (below timeline) ===== -->
  <text x="40" y="250" font-size="10" fill="#4a7a3a" font-weight="bold">🧑 乘客</text>

  <!-- P11 at t=1 → boards Bus 1 (blue) -->
  <g filter="url(#rough2)"><circle cx="140" cy="250" r="14" fill="#dbeafe" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="140" y="254" text-anchor="middle" font-size="9" fill="#4a8edb" font-weight="bold">P11</text>
  <text x="140" y="276" text-anchor="middle" font-size="8" fill="#888">t=1</text>
  <!-- Arrow P11 -> Bus 1 -->
  <path d="M 148 242 Q 170 210 196 156" stroke="#4a8edb" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrDashed)" filter="url(#rough2)"/>

  <!-- P12 at t=5 → boards Bus 3 (orange) -->
  <g filter="url(#rough2)"><circle cx="380" cy="290" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="380" y="294" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">P12</text>
  <text x="380" y="316" text-anchor="middle" font-size="8" fill="#888">t=5</text>
  <!-- Arrow P12 -> Bus 3 -->
  <path d="M 392 284 Q 430 250 496 156" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrDashed)" filter="url(#rough2)"/>

  <!-- P13 at t=6 → boards Bus 3 (orange) -->
  <g filter="url(#rough2)"><circle cx="440" cy="290" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="440" y="294" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">P13</text>
  <text x="440" y="316" text-anchor="middle" font-size="8" fill="#888">t=6</text>
  <!-- Arrow P13 -> Bus 3 -->
  <path d="M 450 278 Q 470 240 498 156" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrDashed)" filter="url(#rough2)"/>

  <!-- P14 at t=7 → boards Bus 3 (orange) -->
  <g filter="url(#rough2)"><circle cx="500" cy="250" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="500" y="254" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">P14</text>
  <text x="500" y="276" text-anchor="middle" font-size="8" fill="#888">t=7</text>
  <!-- Arrow P14 -> Bus 3 (short, direct up) -->
  <path d="M 500 236 L 500 156" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrDashed)" filter="url(#rough2)"/>

  <!-- ===== Result badges on buses ===== -->
  <g filter="url(#rough2)"><rect x="232" y="124" width="28" height="22" fill="#4a8edb" stroke="none" rx="10"/></g>
  <text x="246" y="139" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>

  <g filter="url(#rough2)"><rect x="352" y="124" width="28" height="22" fill="#ccc" stroke="none" rx="10"/></g>
  <text x="366" y="139" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">0</text>

  <g filter="url(#rough2)"><rect x="532" y="124" width="28" height="22" fill="#d6a040" stroke="none" rx="10"/></g>
  <text x="546" y="139" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)"><rect x="40" y="336" width="640" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="60" y="358" font-size="11" fill="#a06a10" font-weight="bold">⭐ 规则：t_passenger ≤ t_bus 且该乘客未被更早的公交车接走 → 搭乘此车</text>
</svg>
