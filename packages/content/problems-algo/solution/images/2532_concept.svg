<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心场景：一桥跨河，k 位工人往返 n 个箱子</text>

  <!-- ===== Left bank ===== -->
  <rect x="24" y="70" width="150" height="240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="99" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左岸 · 新仓库</text>
  <text x="99" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a">放箱 put_i（可并行）</text>
  <!-- put box icon -->
  <rect x="60" y="250" width="78" height="44" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="268" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">④ 放箱</text>
  <text x="99" y="282" text-anchor="middle" font-size="9" fill="#4a7a3a">put_i 后回桥边</text>

  <!-- ===== Right bank ===== -->
  <rect x="486" y="70" width="150" height="240" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="561" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">右岸 · 旧仓库</text>
  <text x="561" y="106" text-anchor="middle" font-size="9" fill="#446688">取箱 pick_i（可并行）</text>
  <!-- pick box icon -->
  <rect x="522" y="250" width="78" height="44" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="561" y="268" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">② 取箱</text>
  <text x="561" y="282" text-anchor="middle" font-size="9" fill="#446688">pick_i 后回桥边</text>

  <!-- ===== River ===== -->
  <rect x="174" y="120" width="312" height="140" fill="#eaf3fb" stroke="#88aacc" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="330" y="138" text-anchor="middle" font-size="10" fill="#446688">河 · 同时仅一人过桥</text>

  <!-- bridge plank -->
  <rect x="174" y="232" width="312" height="16" fill="#d6a040" stroke="#9a6a20" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <!-- phase arrows on bridge -->
  <text x="200" y="222" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">① right_i</text>
  <path d="M 196 242 Q 330 214 464 242" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="460" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">③ left_i</text>
  <path d="M 464 240 Q 330 268 196 240" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- round-trip dashed loop -->
  <path d="M 99 250 Q 99 150 240 150 Q 330 150 330 232" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="60" y="158" font-size="9" fill="#666">一趟往返 = ①②③④</text>

  <!-- worker dots -->
  <ellipse cx="120" cy="170" rx="7" ry="7" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="174" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">工人</text>

  <!-- ===== Efficiency rule box ===== -->
  <rect x="24" y="330" width="612" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="36" y="350" font-size="11" fill="#9a6a20" font-weight="bold">效率键 = (left_i + right_i)</text>
  <text x="36" y="368" font-size="10" fill="#7a5a10">桥空闲时：先让右岸已取箱的最低效者过；否则左岸最低效者过。最低效 = 和最大；和相等时下标 i 大者更低效。</text>

  <!-- answer note -->
  <rect x="24" y="392" width="612" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="36" y="413" font-size="11" fill="#b85450" font-weight="bold">答案 = 第 n 个箱子“到达桥左侧”的时刻（不含最后一次放箱 put_i）</text>
</svg>
