<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：代价为奇 ⇔ 权为 1 的边有奇数条</text>

  <!-- 左：示例 2 查询 [2,5] 的路径 -->
  <text x="150" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2 的查询 [2,5]：路径 2 → 1 → 3 → 5</text>

  <g filter="url(#rough2)">
    <line x1="55" y1="112" x2="265" y2="112" stroke="#446688" stroke-width="2"/>
    <circle cx="55" cy="112" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="125" cy="112" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="195" cy="112" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="265" cy="112" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="55" y="117" text-anchor="middle" font-size="13" fill="#446688">2</text>
    <text x="125" y="117" text-anchor="middle" font-size="13" fill="#446688">1</text>
    <text x="195" y="117" text-anchor="middle" font-size="13" fill="#446688">3</text>
    <text x="265" y="117" text-anchor="middle" font-size="13" fill="#446688">5</text>

    <rect x="72" y="66" width="36" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="90" y="81" text-anchor="middle" font-size="11" fill="#a07818">1/2</text>
    <rect x="142" y="66" width="36" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="160" y="81" text-anchor="middle" font-size="11" fill="#a07818">1/2</text>
    <rect x="212" y="66" width="36" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="230" y="81" text-anchor="middle" font-size="11" fill="#a07818">1/2</text>
  </g>

  <text x="150" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">路径共 k = 3 条边，每条独立赋 1 或 2</text>

  <text x="150" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k = 3 时恰有 4 种奇代价赋值：</text>

  <g filter="url(#rough2)">
    <rect x="32" y="200" width="58" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="61" y="217" text-anchor="middle" font-size="11" fill="#333">(1,2,2)</text>
    <rect x="98" y="200" width="58" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="127" y="217" text-anchor="middle" font-size="11" fill="#333">(2,1,2)</text>
    <rect x="164" y="200" width="58" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="193" y="217" text-anchor="middle" font-size="11" fill="#333">(2,2,1)</text>
    <rect x="230" y="200" width="58" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="259" y="217" text-anchor="middle" font-size="11" fill="#333">(1,1,1)</text>
  </g>

  <text x="160" y="254" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4 = 2³⁻¹：奇偶方案恰好对半分</text>

  <!-- 右：三个递进的观察 -->
  <g filter="url(#rough2)">
    <rect x="300" y="56" width="196" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="312" y="78" font-size="13" fill="#446688">① 权 2 是偶数</text>
    <text x="312" y="98" font-size="11.5" fill="#333">加多少个 2 都不改变奇偶，</text>
    <text x="312" y="116" font-size="11.5" fill="#333">和为奇 ⇔ 赋 1 的边有奇数条</text>

    <rect x="300" y="140" width="196" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="312" y="162" font-size="13" fill="#a07818">② 组合计数</text>
    <text x="312" y="182" font-size="11.5" fill="#333">C(k,1)+C(k,3)+… = 2ᵏ⁻¹</text>
    <text x="312" y="200" font-size="11.5" fill="#333">（k ≥ 1；k = 0 时答案为 0）</text>

    <rect x="300" y="224" width="196" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="312" y="246" font-size="13" fill="#4a7a3a">③ 问题坍缩</text>
    <text x="312" y="266" font-size="11.5" fill="#333">答案只依赖路径边数 k：</text>
    <text x="312" y="284" font-size="11.5" fill="#333">k = dep[u]+dep[v]−2·dep[l]</text>
  </g>

  <path d="M 272 250 C 282 250, 288 254, 296 258" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="260" y="348" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">计数问题被奇偶性坍缩成「求路径边数 k」——交给 LCA</text>
</svg>
