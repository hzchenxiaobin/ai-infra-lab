<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 相向双指针 → 维护最大合法和</text>

  <!-- Start -->
  <rect x="210" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M270 78 L270 96" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort -->
  <rect x="170" y="98" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="121" text-anchor="middle" font-size="12" fill="#333">对数组 A 升序排序</text>
  <path d="M270 134 L270 152" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="154" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="177" text-anchor="middle" font-size="12" fill="#333">left=0, right=n−1, ans=−1</text>
  <path d="M270 190 L270 210" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: left < right? -->
  <polygon points="270,212 340,246 270,280 200,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#333">left &lt; right?</text>

  <!-- No → return -->
  <path d="M340 246 L430 246 L430 460" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="240" font-size="11" fill="#888">否 →</text>
  <rect x="380" y="448" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="440" y="470" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes → compute s -->
  <path d="M270 280 L270 300" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="294" font-size="11" fill="#888">是 ↓</text>
  <rect x="170" y="302" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="325" text-anchor="middle" font-size="12" fill="#333">s = A[left] + A[right]</text>
  <path d="M270 338 L270 356" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: s < K? -->
  <polygon points="270,358 340,392 270,426 200,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="11" fill="#333">s &lt; K?</text>

  <!-- Yes: ans = max, left++ -->
  <path d="M200 392 L110 392 L110 416" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="386" font-size="10" fill="#4a7a3a">是 ↓</text>
  <rect x="40" y="418" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="437" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = max(ans, s)</text>
  <text x="110" y="453" text-anchor="middle" font-size="11" fill="#4a7a3a">left++</text>

  <!-- No: right-- -->
  <path d="M340 392 L430 392 L430 416" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="386" font-size="10" fill="#b85450">否 ↓</text>
  <rect x="380" y="418" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="445" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right--</text>

  <!-- loop back from left++ to top decision -->
  <path d="M110 462 L110 486 L40 486 L40 246 L200 246" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <!-- loop back from right-- to top decision -->
  <path d="M430 462 L430 486 L40 486" stroke="#555" stroke-width="1.2" fill="none" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="60" y="480" font-size="10" fill="#888">回到循环判断</text>
</svg>
