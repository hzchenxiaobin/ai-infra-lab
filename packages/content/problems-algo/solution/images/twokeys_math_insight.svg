<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">数学洞察：答案 = n 的质因数之和</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">固定积 n 求因子和最小，合数因子拆成质数更优（因 ab ≥ a+b）</text>

  <!-- ===== key inequality ===== -->
  <rect x="40" y="62" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">关键不等式：a·b ≥ a + b  （a, b ≥ 2，等号仅 a=b=2）</text>
  <text x="280" y="100" text-anchor="middle" font-size="10" fill="#888">证明：ab − a − b = (a−1)(b−1) − 1 ≥ 0</text>

  <!-- ===== left: composite decomposition (suboptimal) ===== -->
  <text x="140" y="132" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">合数拆法（次优）</text>

  <rect x="40" y="144" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12 = 6 × 2</text>

  <!-- arrow down: split -->
  <path d="M 140 186 L 140 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="202" font-size="9" fill="#888">拆 6 → 2×3</text>

  <rect x="40" y="212" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="236" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12 = 2 × 3 × 2</text>

  <rect x="40" y="262" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="286" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">步数和 = 6 + 2 = 8</text>

  <!-- ===== right: prime decomposition (optimal) ===== -->
  <text x="400" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">质因数拆法（最优）✓</text>

  <rect x="300" y="144" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12 = 2 × 2 × 3</text>

  <!-- arrow down -->
  <path d="M 410 186 L 410 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="202" font-size="9" fill="#888">全为质数</text>

  <rect x="300" y="212" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a">不能再拆（已全质数）</text>

  <rect x="300" y="262" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="286" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">步数和 = 2 + 2 + 3 = 7 ✓</text>

  <!-- ===== compare arrow ===== -->
  <path d="M 244 282 L 296 282" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="276" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">省 1</text>

  <!-- ===== general formula ===== -->
  <rect x="40" y="320" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">一般结论：n = p₁ · p₂ · … · p_m（质因数，可重复）</text>
  <text x="280" y="362" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">minSteps(n) = p₁ + p₂ + … + p_m</text>
  <text x="280" y="378" text-anchor="middle" font-size="9" fill="#888">试除法 O(√n)：不断除尽小质因子并累加，n=1 时和为 0</text>
</svg>
