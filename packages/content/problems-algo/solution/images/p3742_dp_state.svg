<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：把「花费」升维进状态 —— dp[i][j][c]</text>

  <!-- 面板一：格子贡献表 + 恒等式 -->
  <rect x="18" y="30" width="484" height="102" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 每个格子的贡献（分数 / 花费）—— 值 2 是「性价比之王」</text>

  <rect x="44" y="60" width="42" height="34" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="65" y="110" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">+0 分 / ¥0</text>

  <rect x="112" y="60" width="42" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="82" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="133" y="110" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">+1 分 / ¥1</text>

  <rect x="180" y="60" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="201" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="201" y="110" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">+2 分 / ¥1</text>

  <text x="250" y="68" font-size="11" fill="#b85450" filter="url(#rough2)">恒等式：分数 = 花费 +（2 的个数）</text>
  <text x="250" y="88" font-size="10" fill="#333" filter="url(#rough2)">值 1：花 1 得 1，回本；值 2：花 1 得 2，净赚 1</text>
  <text x="250" y="106" font-size="10" fill="#333" filter="url(#rough2)">值 0：白给 0 分。⇒ 预算内分数 ≥ 花费，</text>
  <text x="250" y="123" font-size="10" fill="#666" filter="url(#rough2)">预算 k 就是「付费格子数」上限，答案上界 = k + 2 的个数</text>

  <!-- 面板二：三维状态 + 转移 -->
  <rect x="18" y="140" width="484" height="210" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② dp[i][j][c] = 走到 (i,j) 且总花费「恰好」c 的最大分数（示例 1）</text>

  <!-- 左：2x2 网格 -->
  <text x="42" y="180" font-size="10" fill="#666" filter="url(#rough2)">grid</text>
  <rect x="34" y="188" width="40" height="32" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="209" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="54" y="184" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">起点</text>
  <rect x="74" y="188" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="209" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="34" y="220" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="241" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="74" y="220" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="94" y="241" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <text x="94" y="265" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">终点</text>
  <path d="M 42 216 L 50 222" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 88 218 L 92 216" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- c 轴 -->
  <path d="M 138 288 L 138 216" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="300" font-size="9" fill="#666" filter="url(#rough2)">花费 c</text>

  <!-- 柱 A: dp[0][1] -->
  <text x="172" y="212" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[0][1][·]</text>
  <rect x="146" y="220" width="52" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="237" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">c=1: 1</text>
  <rect x="146" y="252" width="52" height="24" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="172" y="269" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">c=0: −1</text>

  <!-- 柱 B: dp[1][0] -->
  <text x="258" y="212" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[1][0][·]</text>
  <rect x="232" y="220" width="52" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="237" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">c=1: 2</text>
  <rect x="232" y="252" width="52" height="24" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="269" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">c=0: −1</text>

  <!-- 转移箭头 -->
  <path d="M 200 232 C 240 226, 290 226, 330 232" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 286 232 C 310 238, 320 240, 330 240" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="265" y="205" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">终点格值 0 ⇒ cost=0 不换层</text>
  <text x="265" y="290" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">max(1, 2) + 0 = 2</text>

  <!-- 柱 C: dp[1][1] -->
  <text x="420" y="212" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[1][1][·]（答案柱）</text>
  <rect x="390" y="220" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="420" y="237" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">c=1: 2 ✓</text>
  <rect x="390" y="252" width="60" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="269" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">c=0: −1 ✗</text>

  <text x="42" y="316" font-size="10" fill="#333" filter="url(#rough2)">答案 = max over c≤k 的 dp[m−1][n−1][c]；全为 −1 ⇒ 返回 −1</text>
  <text x="42" y="335" font-size="9.5" fill="#666" filter="url(#rough2)">灰色层 = 不可达（−1 哨兵）；转移只从「上方」和「左方」的 c−cost 层取 max</text>
</svg>
