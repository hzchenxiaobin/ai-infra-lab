<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">1676 算法流程：后序 DFS + 集合查找</text>

  <!-- Start -->
  <ellipse cx="280" cy="52" rx="120" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#333">nodes_set = Set(nodes); return dfs(root)</text>

  <path d="M 280 70 L 280 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Base case: null -->
  <polygon points="280,88 400,124 280,160 160,124" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#333">root == null ?</text>

  <!-- Yes: return null -->
  <path d="M 400 124 L 470 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="116" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <ellipse cx="510" cy="124" rx="44" ry="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510" y="128" text-anchor="middle" font-size="11" fill="#888">return null</text>

  <!-- No: check set -->
  <path d="M 280 160 L 280 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="170" font-size="10" fill="#82b366">否</text>

  <!-- Set membership check -->
  <polygon points="280,178 420,224 280,270 140,224" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333">root ∈ nodes_set ?</text>
  <text x="280" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">命中目标节点</text>

  <!-- Yes: early return root -->
  <path d="M 420 224 L 470 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="216" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="470" y="206" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="222" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">return root</text>
  <text x="510" y="238" text-anchor="middle" font-size="9" fill="#4a7a3a">早返回</text>

  <!-- No: post-order -->
  <path d="M 280 270 L 280 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="280" font-size="10" fill="#b85450">否</text>

  <!-- Post-order recurse -->
  <rect x="100" y="288" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">后序递归</text>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#333">left = dfs(root.left)</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#333">right = dfs(root.right)</text>

  <path d="M 280 344 L 280 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check both non-null -->
  <polygon points="280,362 400,398 280,434 160,398" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#333">left ≠ null 且</text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#333">right ≠ null ?</text>

  <!-- Yes: LCA -->
  <path d="M 400 398 L 470 398" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="390" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="470" y="382" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="400" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">return root</text>
  <text x="510" y="412" text-anchor="middle" font-size="9" fill="#4a7a3a">LCA!</text>

  <!-- No: return non-null side -->
  <path d="M 280 434 L 280 448" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="444" font-size="10" fill="#b85450">否</text>

  <rect x="150" y="452" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="474" text-anchor="middle" font-size="11" fill="#333">return left ? left : right</text>

  <!-- recursion loop back -->
  <path d="M 100 316 L 50 316 L 50 52 L 160 52" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="42" y="184" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 42 184)">递归左右子树</text>
</svg>
