<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="28" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：四条边的约束全压在四个角上，其余 12 格互不相干</text>

  <!-- word labels around grid -->
  <text x="188" y="62" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">top = "able"</text>
  <text x="188" y="262" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">bottom = "also"</text>
  <text x="96" y="161" text-anchor="end" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">left = "area"</text>
  <text x="280" y="161" text-anchor="start" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">right = "echo"</text>

  <!-- 4x4 grid: row 0 -->
  <rect x="104" y="72" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="146" y="72" width="42" height="42" rx="4" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="72" width="42" height="42" rx="4" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="72" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- row 1 -->
  <rect x="104" y="114" width="42" height="42" rx="4" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="114" width="42" height="42" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="188" y="114" width="42" height="42" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="230" y="114" width="42" height="42" rx="4" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- row 2 -->
  <rect x="104" y="156" width="42" height="42" rx="4" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="156" width="42" height="42" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="188" y="156" width="42" height="42" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="230" y="156" width="42" height="42" rx="4" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- row 3 -->
  <rect x="104" y="198" width="42" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="146" y="198" width="42" height="42" rx="4" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="198" width="42" height="42" rx="4" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="198" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- cell letters -->
  <text x="125" y="99" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="167" y="99" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="209" y="99" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">l</text>
  <text x="251" y="99" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">e</text>

  <text x="125" y="141" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">r</text>
  <text x="167" y="141" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">?</text>
  <text x="209" y="141" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">?</text>
  <text x="251" y="141" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">c</text>

  <text x="125" y="183" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">e</text>
  <text x="167" y="183" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">?</text>
  <text x="209" y="183" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">?</text>
  <text x="251" y="183" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">h</text>

  <text x="125" y="225" text-anchor="middle" font-size="15" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="167" y="225" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">l</text>
  <text x="209" y="225" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">s</text>
  <text x="251" y="225" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">o</text>

  <text x="188" y="284" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">示例 1 的方块（中间 2×2 随便放什么，题目不管）</text>

  <!-- right panel: constraint legend -->
  <text x="312" y="80" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">仅有的 4 条约束 = 4 个角</text>
  <text x="312" y="96" font-size="10.5" fill="#777" filter="url(#rough2)">每个角被两条边共用，必须同字母</text>

  <rect x="312" y="108" width="15" height="15" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="334" y="120" font-size="11" fill="#33506b" filter="url(#rough2)">top[0] == left[0]（左上 'a'）</text>

  <rect x="312" y="136" width="15" height="15" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="334" y="148" font-size="11" fill="#2f5d24" filter="url(#rough2)">top[3] == right[0]（右上 'e'）</text>

  <rect x="312" y="164" width="15" height="15" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="334" y="176" font-size="11" fill="#8a6d1f" filter="url(#rough2)">bottom[0] == left[3]（左下 'a'）</text>

  <rect x="312" y="192" width="15" height="15" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="334" y="204" font-size="11" fill="#b85450" filter="url(#rough2)">bottom[3] == right[3]（右下 'o'）</text>

  <rect x="312" y="222" width="232" height="58" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="324" y="240" font-size="10.5" fill="#666" filter="url(#rough2)">非角的 12 格各归一条边独占</text>
  <text x="324" y="256" font-size="10.5" fill="#666" filter="url(#rough2)">不进入任何跨词等式</text>
  <text x="324" y="273" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⟹ 验 4 个等式即判定合法性</text>

  <!-- bottom takeaway -->
  <rect x="20" y="302" width="524" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="326" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">转化：单词方块 ⟺ 4 个互异单词满足 4 个角等式 —— 几何题坍缩为组合枚举</text>
  <text x="36" y="348" font-size="11" fill="#7a6a3a" filter="url(#rough2)">words 两两不同 ⟹ 四元组互异 ⟺ 下标 i, j, k, l 互异（循环里排除即可，零判重）</text>
  <text x="36" y="368" font-size="11" fill="#7a6a3a" filter="url(#rough2)">预排序 + 按序嵌套枚举 ⟹ 产出天然字典序，连最终 sort 都省了</text>
</svg>
