<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：count[v] = v 出现在多少个数组中，count[v] == n 即交集</text>
  <text x="270" y="40" text-anchor="middle" font-size="10.5" fill="#888">n = 3 个数组；每个数组内元素互不相同 → 计数即「数组覆盖率」</text>

  <!-- ===== Array rows ===== -->
  <text x="20" y="78" font-size="10.5" fill="#666">nums[0]</text>
  <rect x="58" y="58" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="92" y="58" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="126" y="58" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="58" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="177" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="194" y="58" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <text x="20" y="116" font-size="10.5" fill="#666">nums[1]</text>
  <rect x="58" y="96" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="92" y="96" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="126" y="96" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="143" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="96" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="177" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <text x="20" y="154" font-size="10.5" fill="#666">nums[2]</text>
  <rect x="58" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="92" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="109" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="126" y="134" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="160" y="134" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- arrow down to count table -->
  <path d="M 143 166 L 143 182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="178" font-size="9.5" fill="#888">逐元素 +1 计数</text>

  <!-- ===== Count table (2 columns) ===== -->
  <!-- Left column: values 1,2,3 -->
  <rect x="40" y="190" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="208" font-size="11" fill="#333">值 1 → count 2</text>
  <text x="200" y="208" font-size="10.5" fill="#b85450" font-weight="bold">≠3 ✗</text>

  <rect x="40" y="220" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="238" font-size="11" fill="#333">值 2 → count 2</text>
  <text x="200" y="238" font-size="10.5" fill="#b85450" font-weight="bold">≠3 ✗</text>

  <rect x="40" y="250" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="54" y="268" font-size="11" fill="#333" font-weight="bold">值 3 → count 3</text>
  <text x="200" y="268" font-size="10.5" fill="#4a7a3a" font-weight="bold">==3 ✓</text>

  <!-- Right column: values 4,5,6 -->
  <rect x="280" y="190" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="208" font-size="11" fill="#333" font-weight="bold">值 4 → count 3</text>
  <text x="440" y="208" font-size="10.5" fill="#4a7a3a" font-weight="bold">==3 ✓</text>

  <rect x="280" y="220" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="238" font-size="11" fill="#333">值 5 → count 2</text>
  <text x="440" y="238" font-size="10.5" fill="#b85450" font-weight="bold">≠3 ✗</text>

  <rect x="280" y="250" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="268" font-size="11" fill="#333">值 6 → count 1</text>
  <text x="440" y="268" font-size="10.5" fill="#b85450" font-weight="bold">≠3 ✗</text>

  <!-- arrow down to result -->
  <path d="M 270 280 L 270 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="292" font-size="9.5" fill="#4a7a3a">count == n</text>

  <!-- ===== Result ===== -->
  <rect x="120" y="300" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">交集结果（升序）</text>
  <text x="270" y="334" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">[ 3, 4 ]</text>

  <!-- ===== Footer ===== -->
  <rect x="40" y="352" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="370" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">判定准则</text>
  <text x="270" y="384" text-anchor="middle" font-size="10" fill="#555">count[v] == n（数组个数）⇔ v 出现在所有数组中 → 属于交集</text>
</svg>
