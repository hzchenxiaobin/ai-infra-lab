<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：判 S≥2k → 0-1 背包数子集 → 2ⁿ−2·bad</text>

  <!-- Step 1: compute S -->
  <rect x="190" y="50" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="12.5" fill="#224466" font-weight="bold">① S = sum(nums)</text>

  <line x1="280" y1="90" x2="280" y2="110" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: decision diamond -->
  <path d="M 280 112 L 380 152 L 280 192 L 180 152 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">S ≥ 2k ?</text>
  <text x="280" y="166" text-anchor="middle" font-size="9.5" fill="#7a5a20">(好分区必要条件)</text>

  <!-- No branch: return 0 -->
  <line x1="380" y1="152" x2="450" y2="152" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="412" y="145" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="450" y="132" width="100" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 0</text>
  <text x="500" y="166" text-anchor="middle" font-size="9" fill="#b85450">两组都≥k 不可能</text>

  <!-- Yes branch: down to knapsack -->
  <line x1="280" y1="192" x2="280" y2="212" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="294" y="206" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 3: knapsack -->
  <rect x="110" y="214" width="340" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">② 0-1 背包计数 dp[0..k−1]</text>
  <text x="280" y="252" text-anchor="middle" font-size="10.5" fill="#3a5a2a">dp[0]=1；对每个 x：j 从 k−1 倒序到 x</text>
  <text x="280" y="267" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">dp[j] += dp[j−x]　（x≥k 跳过）</text>

  <line x1="280" y1="272" x2="280" y2="292" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 4: bad = sum dp -->
  <rect x="150" y="294" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">③ bad = Σ dp[0..k−1] (mod p)</text>
  <text x="280" y="327" text-anchor="middle" font-size="9.5" fill="#7a5a20">组1 和 &lt; k 的划分数</text>

  <line x1="280" y1="334" x2="280" y2="354" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <rect x="110" y="356" width="340" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#224466" font-weight="bold">④ total = 2ⁿ mod p</text>
  <text x="280" y="394" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return (total − 2·bad) mod p</text>
</svg>
