<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：两条根路径 → LCA → 上行 U + 下行 L/R</text>

  <!-- Tree nodes -->
  <!-- root 5 (LCA) -->
  <circle cx="280" cy="70" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">LCA</text>

  <!-- node 1 (left child of 5) -->
  <circle cx="160" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="145" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- node 2 (right child of 5) -->
  <circle cx="400" cy="140" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- node 3 (left child of 1) = startValue -->
  <circle cx="100" cy="220" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="100" y="225" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="100" y="252" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">start</text>

  <!-- node 6 (left child of 2) = destValue -->
  <circle cx="340" cy="220" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="340" y="225" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="340" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">dest</text>

  <!-- node 4 (right child of 2) -->
  <circle cx="460" cy="220" r="18" fill="#fafafa" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="225" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>

  <!-- Edges: blue path 5→1→3 (to start) -->
  <line x1="268" y1="82" x2="172" y2="128" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="152" y1="154" x2="112" y2="206" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="100" font-size="10" fill="#446688" filter="url(#rough2)">L</text>
  <text x="118" y="180" font-size="10" fill="#446688" filter="url(#rough2)">L</text>

  <!-- Edges: green path 5→2→6 (to dest) -->
  <line x1="292" y1="82" x2="388" y2="128" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="392" y1="154" x2="352" y2="206" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="345" y="100" font-size="10" fill="#4a7a3a" filter="url(#rough2)">R</text>
  <text x="358" y="180" font-size="10" fill="#4a7a3a" filter="url(#rough2)">L</text>

  <!-- edge to node 4 (dim) -->
  <line x1="408" y1="154" x2="448" y2="206" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Path decomposition box -->
  <rect x="30" y="278" width="500" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">路径分解：start →(上行 U)→ LCA →(下行 L/R)→ dest</text>

  <rect x="50" y="308" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">start→LCA</text>
  <text x="115" y="344" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">"UU" (全 U)</text>

  <text x="200" y="334" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">+</text>

  <rect x="220" y="308" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">LCA→dest</text>
  <text x="285" y="344" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">"RL"</text>

  <text x="370" y="334" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">=</text>

  <rect x="390" y="308" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="450" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="450" y="344" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">"UURL"</text>
</svg>
