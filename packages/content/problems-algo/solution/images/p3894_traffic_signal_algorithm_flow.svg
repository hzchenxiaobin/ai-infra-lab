<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：三次判断，命中即返回</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">条件互斥 → 顺序可换；照题面顺序写最不易抄错</text>

  <!-- start box -->
  <rect x="100" y="48" width="100" height="32" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="69" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">输入 timer</text>

  <!-- diamond 1 -->
  <polygon points="150,96 220,128 150,160 80,128" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">timer == 0 ?</text>

  <!-- diamond 2 -->
  <polygon points="150,178 220,210 150,242 80,210" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">timer == 30 ?</text>

  <!-- diamond 3 -->
  <polygon points="150,260 225,296 150,332 75,296" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="292" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">30 &lt; timer ≤ 90 ?</text>
  <text x="150" y="306" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">（左开右闭）</text>

  <!-- result boxes -->
  <rect x="330" y="110" width="110" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="385" y="134" text-anchor="middle" font-size="12" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">"Green"</text>

  <rect x="330" y="192" width="110" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="385" y="216" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">"Orange"</text>

  <rect x="330" y="278" width="110" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="385" y="302" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">"Red"</text>

  <!-- invalid box (bottom) -->
  <rect x="95" y="348" width="110" height="34" rx="10" fill="#f0f0f0" stroke="#999" stroke-width="2" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="150" y="370" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">"Invalid" 兜底</text>

  <!-- arrows: vertical flow -->
  <path d="M 150 80 L 150 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 150 160 L 150 174" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="158" y="172" font-size="9" fill="#888" filter="url(#rough2)">否</text>
  <path d="M 150 242 L 150 256" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="158" y="254" font-size="9" fill="#888" filter="url(#rough2)">否</text>
  <path d="M 150 332 L 150 344" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="158" y="342" font-size="9" fill="#888" filter="url(#rough2)">否</text>

  <!-- arrows: yes branches -->
  <path d="M 220 128 L 326 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="122" text-anchor="middle" font-size="9" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 220 210 L 326 210" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="204" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 225 296 L 326 296" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="290" text-anchor="middle" font-size="9" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- side note -->
  <rect x="330" y="48" width="160" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="66" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">每步至多一次比较</text>
  <text x="410" y="82" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">①② 点条件 → ③ 区间 → 兜底</text>
</svg>
