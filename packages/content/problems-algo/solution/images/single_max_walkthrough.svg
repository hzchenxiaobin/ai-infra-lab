<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：有单一数字 → MAX / 无单一数字 → NULL</text>

  <!-- ===== Example 1 (left) ===== -->
  <text x="130" y="48" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1：存在单一数字</text>

  <!-- raw table -->
  <text x="130" y="70" text-anchor="middle" font-size="10" fill="#446688">MyNumbers</text>
  <rect x="100" y="76" width="60" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="93" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="130" y="107" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="130" y="121" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="130" y="135" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="130" y="149" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="130" y="163" text-anchor="middle" font-size="10" fill="#333">4, 5, 6</text>

  <!-- arrow -->
  <path d="M 130 176 L 130 192" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- groups -->
  <text x="130" y="206" text-anchor="middle" font-size="10" fill="#d6a040">GROUP BY + COUNT</text>
  <rect x="70" y="212" width="120" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="228" text-anchor="middle" font-size="10" fill="#333">num</text>
  <text x="160" y="228" text-anchor="middle" font-size="10" fill="#333">cnt</text>
  <line x1="70" y1="234" x2="190" y2="234" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="100" y="248" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="160" y="248" text-anchor="middle" font-size="10" fill="#b85450">2</text>
  <text x="100" y="262" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="160" y="262" text-anchor="middle" font-size="10" fill="#b85450">2</text>
  <text x="100" y="276" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="160" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <text x="100" y="290" text-anchor="middle" font-size="10" fill="#333">4,5,6</text>
  <text x="160" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a">1,1,1</text>

  <!-- arrow -->
  <path d="M 130 316 L 130 332" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="60" y="336" width="140" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a">单一: {1,4,5,6}</text>
  <text x="130" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a">MAX = 6</text>
  <text x="130" y="388" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ 输出 6</text>

  <!-- divider -->
  <path d="M 260 40 L 260 400" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Example 2 (right) ===== -->
  <text x="390" y="48" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例 2：无单一数字</text>

  <!-- raw table -->
  <text x="390" y="70" text-anchor="middle" font-size="10" fill="#446688">MyNumbers</text>
  <rect x="360" y="76" width="60" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="93" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="390" y="107" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="390" y="121" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="390" y="135" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="390" y="149" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="390" y="163" text-anchor="middle" font-size="10" fill="#333">3, 3</text>

  <!-- arrow -->
  <path d="M 390 176 L 390 192" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- groups -->
  <text x="390" y="206" text-anchor="middle" font-size="10" fill="#d6a040">GROUP BY + COUNT</text>
  <rect x="330" y="212" width="120" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="228" text-anchor="middle" font-size="10" fill="#333">num</text>
  <text x="420" y="228" text-anchor="middle" font-size="10" fill="#333">cnt</text>
  <line x1="330" y1="234" x2="450" y2="234" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="360" y="248" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="420" y="248" text-anchor="middle" font-size="10" fill="#b85450">2</text>
  <text x="360" y="262" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="420" y="262" text-anchor="middle" font-size="10" fill="#b85450">2</text>
  <text x="360" y="276" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="420" y="276" text-anchor="middle" font-size="10" fill="#b85450">3</text>
  <text x="360" y="294" text-anchor="middle" font-size="10" fill="#999">∅</text>
  <text x="420" y="294" text-anchor="middle" font-size="10" fill="#999">—</text>

  <!-- arrow -->
  <path d="M 390 316 L 390 332" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="320" y="336" width="140" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="356" text-anchor="middle" font-size="10" fill="#b85450">单一: {} (空集)</text>
  <text x="390" y="372" text-anchor="middle" font-size="10" fill="#b85450">MAX(空集) = NULL</text>
  <text x="390" y="388" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 输出 null</text>
</svg>
