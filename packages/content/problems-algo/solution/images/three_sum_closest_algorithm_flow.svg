<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 初始化 best → 固定 i → 双指针维护最近和</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">O(n²) = 排序 O(n log n) + 外层 n 轮 × 内层双指针 O(n)</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: sort -->
    <rect x="40" y="64" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 排序</text>
    <text x="120" y="84" font-family="monospace" font-size="10" fill="#555">sort(nums.begin(), nums.end())</text>
    <text x="120" y="100" font-size="9" fill="#888">升序排序，让双指针可行（按单调性夹逼），O(n log n)</text>

    <path d="M 260 110 L 260 124" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: init best -->
    <rect x="40" y="128" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="148" font-size="12" fill="#4a7a3a" font-weight="bold">② 初始化 best</text>
    <text x="170" y="148" font-family="monospace" font-size="10" fill="#555">best = nums[0]+nums[1]+nums[2]</text>
    <text x="54" y="166" font-size="9" fill="#888">必须用合法三元组和，不能用 INT_MAX（防 abs 溢出 + 语义正确）</text>

    <path d="M 260 180 L 260 194" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: for i -->
    <rect x="40" y="198" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="218" font-size="12" fill="#4a7a3a" font-weight="bold">③ 枚举第一个数 i</text>
    <text x="200" y="218" font-family="monospace" font-size="10" fill="#555">for (i = 0; i &lt; n-2; ++i)</text>
    <text x="54" y="234" font-size="9" fill="#888">无需去重（只返回一个和，相同 nums[i] 不影响 best）</text>

    <path d="M 260 244 L 260 258" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: two pointers -->
    <rect x="40" y="262" width="440" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="282" font-size="12" fill="#d6a040" font-weight="bold">④ 双指针：left = i+1, right = n-1</text>
    <text x="54" y="300" font-family="monospace" font-size="10" fill="#555">while (left &lt; right):</text>
    <text x="70" y="316" font-family="monospace" font-size="10" fill="#b85450">s = nums[i]+nums[l]+nums[r]</text>
    <text x="70" y="332" font-family="monospace" font-size="10" fill="#b85450">if |s−target| &lt; |best−target|: best = s   // 维护最近和</text>
    <text x="70" y="348" font-family="monospace" font-size="10" fill="#446688">s&lt;target → left++   s&gt;target → right--   s==target → return target</text>

    <path d="M 260 364 L 260 378" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 5: return best -->
    <rect x="40" y="382" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="402" font-size="12" fill="#b85450" font-weight="bold">⑤ 返回 best</text>
    <text x="140" y="402" font-family="monospace" font-size="10" fill="#555">return best;</text>
    <text x="54" y="418" font-size="9" fill="#888">遍历所有 i 后 best 即全局最优和</text>

    <!-- complexity -->
    <rect x="40" y="432" width="440" height="0" fill="none"/>
  </g>
  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(n²)  ·  空间 O(log n)（排序栈）  ·  双指针已是该问题最优解</text>
</svg>
