<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：计数入桶 → 整除筛选 → 加权累加</text>

  <rect x="215" y="30" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 54 L 260 66" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="68" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[101] = 0，ans = 0</text>

  <path d="M 260 94 L 260 106" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="108" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 遍历 nums：cnt[x]++（一趟入桶）</text>

  <path d="M 260 134 L 260 146" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="148" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 遍历 x = 1…100：逐桶判定</text>

  <path d="M 260 174 L 260 186" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 186 L 355 220 L 260 254 L 165 220 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[x] % k</text>
  <text x="260" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">== 0 ?</text>

  <path d="M 260 254 L 260 266" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="264" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="150" y="268" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans += x × cnt[x]</text>

  <path d="M 260 294 L 260 306" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="308" width="170" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return ans</text>

  <!-- 否：右侧跳回下一桶 -->
  <path d="M 355 220 L 446 220" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="212" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否（跳过该桶）</text>
  <path d="M 446 220 L 446 161 L 416 161" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">下一个 x</text>

  <!-- 是：累加后也回到下一桶 -->
  <path d="M 150 281 L 62 281 L 62 161 L 104 161" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="296" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">下一个 x</text>

  <text x="16" y="350" font-size="10" fill="#999" filter="url(#rough2)">⚠️ 空桶 cnt[x] = 0 也满足 0 % k == 0，但贡献 x × 0 = 0，对答案无害</text>
</svg>
