<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：m=2, n=3, indices=[[0,1],[1,1]]</text>

  <!-- ===== Step 0: Initial ===== -->
  <text x="40" y="52" font-size="11" fill="#888" font-weight="bold">初始</text>
  <text x="40" y="66" font-size="9" fill="#aaa">rowOdd [F,F]</text>
  <text x="40" y="78" font-size="9" fill="#aaa">colOdd [F,F,F]</text>

  <!-- Matrix 0: all zeros -->
  <g transform="translate(140,46)">
    <rect x="0" y="0" width="38" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="19" y="16" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">0</text>
    <rect x="40" y="0" width="38" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="59" y="16" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">0</text>
    <rect x="80" y="0" width="38" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="99" y="16" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">0</text>
    <rect x="0" y="26" width="38" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="19" y="42" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">0</text>
    <rect x="40" y="26" width="38" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="59" y="42" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">0</text>
    <rect x="80" y="26" width="38" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="99" y="42" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">0</text>
  </g>

  <!-- Arrow down -->
  <path d="M 280 80 L 280 94" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="90" font-size="9" fill="#b85450" font-weight="bold">[0,1]</text>

  <!-- ===== Step 1: After [0,1] ===== -->
  <text x="40" y="118" font-size="11" fill="#888" font-weight="bold">执行[0,1]</text>
  <text x="40" y="132" font-size="9" fill="#b85450" font-weight="bold">rowOdd [T,F]</text>
  <text x="40" y="144" font-size="9" fill="#4a7a3a" font-weight="bold">colOdd [F,T,F]</text>

  <!-- Matrix 1: [1,2,1] / [0,1,0] -->
  <g transform="translate(140,108)">
    <rect x="0" y="0" width="38" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="19" y="16" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">1</text>
    <rect x="40" y="0" width="38" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="59" y="16" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">2</text>
    <rect x="80" y="0" width="38" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="99" y="16" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">1</text>
    <rect x="0" y="26" width="38" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="19" y="42" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">0</text>
    <rect x="40" y="26" width="38" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="59" y="42" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">1</text>
    <rect x="80" y="26" width="38" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="99" y="42" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">0</text>
  </g>
  <text x="200" y="104" font-size="8.5" fill="#b85450">行0 +1</text>
  <text x="266" y="104" font-size="8.5" fill="#4a7a3a">列1 +1</text>

  <!-- Arrow down -->
  <path d="M 280 142 L 280 156" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="152" font-size="9" fill="#b85450" font-weight="bold">[1,1]</text>

  <!-- ===== Step 2: After [1,1] ===== -->
  <text x="40" y="180" font-size="11" fill="#888" font-weight="bold">执行[1,1]</text>
  <text x="40" y="194" font-size="9" fill="#b85450" font-weight="bold">rowOdd [T,T]</text>
  <text x="40" y="206" font-size="9" fill="#4a7a3a" font-weight="bold">colOdd [F,F,F]</text>

  <!-- Matrix 2: [1,3,1] / [1,3,1]  all odd -->
  <g transform="translate(140,170)">
    <rect x="0" y="0" width="38" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="19" y="16" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" font-family="monospace">1</text>
    <rect x="40" y="0" width="38" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="59" y="16" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" font-family="monospace">3</text>
    <rect x="80" y="0" width="38" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="99" y="16" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" font-family="monospace">1</text>
    <rect x="0" y="26" width="38" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="19" y="42" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" font-family="monospace">1</text>
    <rect x="40" y="26" width="38" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="59" y="42" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" font-family="monospace">3</text>
    <rect x="80" y="26" width="38" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="99" y="42" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" font-family="monospace">1</text>
  </g>
  <text x="266" y="166" font-size="8.5" fill="#4a7a3a">列1 再+1→偶</text>

  <!-- Legend for odd cells -->
  <rect x="320" y="172" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="340" y="184" font-size="9.5" fill="#666">= 奇数格</text>
  <rect x="320" y="192" width="14" height="14" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="340" y="204" font-size="9.5" fill="#666">= 偶数格</text>

  <!-- ===== Bottom: formula calculation ===== -->
  <path d="M 280 210 L 280 232" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="40" y="238" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">统计：oddR = 2（两行皆奇），oddC = 0（三列皆偶）</text>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" font-family="monospace">ans = 2×(3−0) + (2−2)×0 = 6 + 0 = 6</text>
  <text x="280" y="290" text-anchor="middle" font-size="9.5" fill="#888">奇行×偶列 → 2×3=6 ；偶行×奇列 → 0×0=0</text>

  <!-- Verification box -->
  <rect x="40" y="306" width="480" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 验证：最终矩阵全部 6 格为奇数</text>

  <!-- Final matrix -->
  <g transform="translate(195,336)">
    <rect x="0" y="0" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="25" y="20" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" font-family="monospace">1</text>
    <rect x="52" y="0" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="77" y="20" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" font-family="monospace">3</text>
    <rect x="104" y="0" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="129" y="20" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" font-family="monospace">1</text>
    <rect x="0" y="32" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="25" y="52" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" font-family="monospace">1</text>
    <rect x="52" y="32" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="77" y="52" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" font-family="monospace">3</text>
    <rect x="104" y="32" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="129" y="52" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" font-family="monospace">1</text>
  </g>
  <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">公式结果 6 = 矩阵实际奇数格数 6 ✓</text>
</svg>
