<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [2, 4, 6, 4]</text>

  <!-- nums band -->
  <text x="40" y="62" font-size="11.5" fill="#888">nums:</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="78" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="101" y="66">2</text>
    <rect x="128" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="151" y="66">4</text>
    <rect x="178" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="201" y="66">6</text>
    <rect x="228" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="251" y="66">4</text>
  </g>
  <g font-size="9.5" fill="#aaa" text-anchor="middle">
    <text x="101" y="88">0</text>
    <text x="151" y="88">1</text>
    <text x="201" y="88">2</text>
    <text x="251" y="88">3</text>
  </g>

  <!-- precomputed bands -->
  <text x="40" y="118" font-size="10.5" fill="#446688">left_max:</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="78" y="104" width="46" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="101" y="121" fill="#aaa">—</text>
    <rect x="128" y="104" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="151" y="121">2</text>
    <rect x="178" y="104" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="201" y="121">4</text>
    <rect x="228" y="104" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="251" y="121">6</text>
  </g>

  <text x="40" y="156" font-size="10.5" fill="#4a7a3a">right_min:</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="78" y="142" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="101" y="159">4</text>
    <rect x="128" y="142" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="151" y="159">4</text>
    <rect x="178" y="142" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="201" y="159">4</text>
    <rect x="228" y="142" width="46" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="251" y="159" fill="#aaa">—</text>
  </g>

  <!-- Divider -->
  <path d="M 40 186 L 520 186" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">逐下标判定（仅 i = 1 … n−2）</text>

  <!-- table header -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="120" y="230">i</text>
    <text x="180" y="230">nums[i]</text>
    <text x="250" y="230">left_max[i]</text>
    <text x="320" y="230">right_min[i]</text>
    <text x="410" y="230">相邻判定</text>
    <text x="490" y="230">beauty</text>
  </g>

  <!-- row i=1 -->
  <rect x="78" y="238" width="448" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="120" y="260">1</text>
    <text x="180" y="260">4</text>
    <text x="250" y="260" fill="#446688">2</text>
    <text x="320" y="260" fill="#4a7a3a">4</text>
    <text x="410" y="260">2&lt;4&lt;6 ✓</text>
    <text x="490" y="260" fill="#d6a040" font-weight="bold">1</text>
  </g>
  <text x="120" y="288" font-size="9.5" fill="#a87020">2&lt;4 ✓ 但 4&lt;4 ✗ → 非 2 档</text>

  <!-- row i=2 -->
  <rect x="78" y="294" width="448" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="120" y="316">2</text>
    <text x="180" y="316">6</text>
    <text x="250" y="316" fill="#446688">4</text>
    <text x="320" y="316" fill="#4a7a3a">4</text>
    <text x="410" y="316">4&lt;6&lt;4 ✗</text>
    <text x="490" y="316" fill="#b85450" font-weight="bold">0</text>
  </g>
  <text x="120" y="344" font-size="9.5" fill="#b85450">4&lt;6 ✓ 但 6&lt;4 ✗ → 非 2 档；相邻也 ✗ → 0</text>

  <!-- result box -->
  <rect x="150" y="362" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">ans = 1 + 0 = 1 ✓</text>
</svg>
