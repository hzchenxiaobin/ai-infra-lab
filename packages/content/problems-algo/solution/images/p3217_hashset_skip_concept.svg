<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：先花 O(m) 建集合，每次查找降到 O(1)</text>

  <!-- nums 数组 -->
  <text x="90" y="58" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">nums（无序数组）</text>
  <rect x="54" y="64" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="88" y="64" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="122" y="64" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <path d="M166,79 L212,79" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="189" y="70" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">装入</text>

  <!-- 哈希集合 -->
  <ellipse cx="300" cy="79" rx="72" ry="33" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">哈希集合 s</text>
  <text x="300" y="92" text-anchor="middle" font-size="12" fill="#a06a10" filter="url(#rough2)">{1, 2, 3}</text>
  <text x="408" y="76" font-size="11" fill="#4a7a3a" filter="url(#rough2)">查询 O(1)</text>
  <text x="408" y="92" font-size="10" fill="#888" filter="url(#rough2)">比线性扫 O(m) 快</text>

  <path d="M30,112 L490,112" stroke="#999" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <text x="260" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">链表侧：哑节点 + 「跳过」脱链</text>

  <!-- 查询示意：节点 2 → 集合 -->
  <path d="M193,168 C 210,140 250,120 272,104" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="240" y="124" font-size="10.5" fill="#b85450" filter="url(#rough2)">2 ∈ s ? 命中 → 删</text>

  <!-- 链表 -->
  <rect x="40" y="172" width="54" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="67" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dummy</text>

  <rect x="120" y="172" width="38" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="139" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="174" y="172" width="38" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="193" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="228" y="172" width="38" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="247" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="282" y="172" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="301" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="336" y="172" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="355" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <ellipse cx="404" cy="189" rx="17" ry="13" fill="#fafafa" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="404" y="193" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">∅</text>

  <!-- 原指针（灰色，将被废弃） -->
  <path d="M96,189 L116,189" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M160,189 L170,189" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M214,189 L224,189" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M268,189 L278,189" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M322,189 L332,189" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M378,189 L384,189" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>

  <!-- 红叉标记被删 -->
  <text x="139" y="163" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✕</text>
  <text x="193" y="163" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✕</text>
  <text x="247" y="163" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✕</text>

  <!-- 脱链弧线 -->
  <path d="M67,166 C 96,120 272,120 292,168" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="182" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">dummy.next 直接越过 1,2,3</text>

  <!-- curr 光标 -->
  <path d="M55,216 L67,230 L79,216 Z" fill="#446688" filter="url(#rough2)"/>
  <text x="67" y="246" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">curr（盯 curr.next）</text>

  <!-- 底部要点 -->
  <rect x="52" y="268" width="416" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">删除 = 改前驱的 next 指针「跳过」本节点，与 203 移除链表元素同款模板；</text>
  <text x="260" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">唯一区别：判断条件从 val == x 换成 val ∈ s（哈希 O(1) 查询）</text>

  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">虚线灰箭头 = 被废弃的旧指针；红色 ✕ = 命中集合、待脱链的节点</text>
</svg>
