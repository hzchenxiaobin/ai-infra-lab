<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="520" fill="#fafafa"/>

  <text x="220" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">删除并获得点数：算法流程</text>

  <!-- Step 1: build points -->
  <rect x="60" y="40" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 统计每个值的总点数</text>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#555">points[x] += x，范围 0 ~ max(nums)</text>

  <path d="M 220 100 L 220 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 2: init dp -->
  <rect x="60" y="122" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="144" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 初始化 dp</text>
  <text x="220" y="164" text-anchor="middle" font-size="11" fill="#555">dp[0]=0，dp[1]=points[1]</text>

  <path d="M 220 182 L 220 200" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 3: loop -->
  <rect x="80" y="204" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="224" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i = 2 to maxVal</text>
  <text x="220" y="240" text-anchor="middle" font-size="11" fill="#555">逐个值做决策</text>

  <path d="M 220 250 L 220 268" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: take or not -->
  <polygon points="220,273 340,323 220,373 100,323" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取 i 还是 不取 i ?</text>
  <text x="220" y="338" text-anchor="middle" font-size="10.5" fill="#777">比较两种收益</text>

  <!-- Left branch: not take -->
  <path d="M 100 323 L 40 323 L 40 390" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="50" y="316" font-size="11" fill="#b85450" font-weight="bold">不取</text>
  <rect x="6" y="394" width="92" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="52" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">继承上一位</text>
  <text x="52" y="432" text-anchor="middle" font-size="10" fill="#555">dp[i] = dp[i−1]</text>
  <text x="52" y="450" text-anchor="middle" font-size="10" fill="#b85450">跳过值 i</text>

  <!-- Right branch: take -->
  <path d="M 340 323 L 400 323 L 400 390" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="360" y="316" font-size="11" fill="#4a7a3a" font-weight="bold">取</text>
  <rect x="342" y="394" width="92" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="388" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取 i 并跳 i−1</text>
  <text x="388" y="432" text-anchor="middle" font-size="10" fill="#555">dp[i−2]+points[i]</text>
  <text x="388" y="450" text-anchor="middle" font-size="10" fill="#4a7a3a">获得点数</text>

  <!-- Merge -->
  <path d="M 52 460 L 52 480 L 180 480" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 388 460 L 388 480 L 260 480" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- max box -->
  <rect x="100" y="466" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="488" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i] = max(左, 右)</text>

  <!-- loop back -->
  <path d="M 340 483 L 410 483 L 410 226 L 360 226" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- final -->
  <text x="220" y="514" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">循环结束 → return dp[maxVal] (O(n+M), O(M))</text>
</svg>
