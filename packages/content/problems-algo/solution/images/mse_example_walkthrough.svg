<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：seats=[3,1,5], students=[2,7,4]</text>

  <!-- ===== Step 1: sort ===== -->
  <text x="28" y="58" font-size="11" fill="#d6a040" font-weight="bold">步骤①</text>
  <text x="28" y="74" font-size="10" fill="#888">各自排序</text>

  <!-- original seats -->
  <text x="92" y="56" font-size="9.5" fill="#446688">座位</text>
  <rect x="86" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="103" y="62" text-anchor="middle" font-size="12" fill="#446688">3</text>
  <rect x="122" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="139" y="62" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <rect x="158" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="62" text-anchor="middle" font-size="12" fill="#446688">5</text>

  <!-- arrow sort -->
  <path d="M 196 57 L 236 57" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="216" y="50" text-anchor="middle" font-size="8.5" fill="#d6a040">排序</text>

  <!-- sorted seats -->
  <rect x="244" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="280" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="316" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>

  <!-- original students -->
  <text x="92" y="100" font-size="9.5" fill="#d6a040">学生</text>
  <rect x="86" y="86" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="103" y="104" text-anchor="middle" font-size="12" fill="#d6a040">2</text>
  <rect x="122" y="86" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="139" y="104" text-anchor="middle" font-size="12" fill="#d6a040">7</text>
  <rect x="158" y="86" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="104" text-anchor="middle" font-size="12" fill="#d6a040">4</text>

  <path d="M 196 99 L 236 99" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="216" y="92" text-anchor="middle" font-size="8.5" fill="#d6a040">排序</text>

  <rect x="244" y="86" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="104" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="280" y="86" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="104" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <rect x="316" y="86" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="104" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">7</text>

  <!-- divider -->
  <path d="M 360 60 L 384 60" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: pair & sum ===== -->
  <text x="28" y="148" font-size="11" fill="#d6a040" font-weight="bold">步骤②</text>
  <text x="28" y="164" font-size="10" fill="#888">同序配对</text>
  <text x="28" y="178" font-size="10" fill="#888">累加距离</text>

  <!-- Pair 1: seat 1 <-> student 2 -->
  <rect x="86" y="132" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="103" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <path d="M 103 160 L 103 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="86" y="184" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="103" y="202" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="140" y="172" font-size="11" fill="#b85450" font-weight="bold">|1−2| = 1</text>

  <!-- Pair 2: seat 3 <-> student 4 -->
  <rect x="200" y="132" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <path d="M 217 160 L 217 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="200" y="184" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="202" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <text x="254" y="172" font-size="11" fill="#b85450" font-weight="bold">|3−4| = 1</text>

  <!-- Pair 3: seat 5 <-> student 7 -->
  <rect x="314" y="132" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <path d="M 331 160 L 331 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="314" y="184" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="202" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">7</text>
  <text x="368" y="172" font-size="11" fill="#b85450" font-weight="bold">|5−7| = 2</text>

  <!-- Sum arrow down -->
  <path d="M 230 224 L 230 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="80" y="256" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">总移动次数 = 1 + 1 + 2 = 4 ✓</text>

  <!-- Summary box -->
  <rect x="40" y="306" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="10.5" fill="#555">①两个数组分别升序排序  ②按下标 i 一一配对  ③累加 |seats[i]−students[i]|</text>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">无交叉匹配即最优，排序保证无交叉 → 一步到位</text>
</svg>
