<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">滑窗跑一遍：把「右端点 b ↔ 最小合法左端点 L[b]」留下来</text>
  <text x="260" y="38" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">子串 [a, b] 合法 ⟺ a ≥ L[b]（k ≥ 1 时单字符必合法，故 L[b] ≤ b）</text>

  <!-- 字符串行 s = "010101", k = 1 -->
  <text x="62" y="80" font-size="12.5" fill="#333" filter="url(#rough2)">s =</text>
  <rect x="88" y="58" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="126" y="58" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="58" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="202" y="58" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="58" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="278" y="58" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="107" y="80" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="145" y="80" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="183" y="80" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="221" y="80" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="259" y="80" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="297" y="80" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="330" y="80" font-size="12.5" fill="#333" filter="url(#rough2)">, k = 1</text>
  <text x="107" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="145" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="183" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="221" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="259" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="297" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <!-- 每个右端点 b 的合法窗口条：b=0..5 -->
  <text x="46" y="140" font-size="10" fill="#666" filter="url(#rough2)">b=0</text>
  <rect x="88" y="128" width="38" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="132" y="140" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">L=0</text>

  <text x="46" y="164" font-size="10" fill="#666" filter="url(#rough2)">b=1</text>
  <rect x="88" y="152" width="76" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="164" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">L=0</text>

  <text x="46" y="188" font-size="10" fill="#666" filter="url(#rough2)">b=2</text>
  <rect x="88" y="176" width="114" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="188" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">L=0</text>

  <text x="46" y="212" font-size="10" fill="#666" filter="url(#rough2)">b=3</text>
  <rect x="126" y="200" width="114" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="246" y="212" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">L=1（收缩过）</text>

  <text x="46" y="236" font-size="10" fill="#666" filter="url(#rough2)">b=4</text>
  <rect x="164" y="224" width="114" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="284" y="236" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">L=2</text>

  <text x="46" y="260" font-size="10" fill="#666" filter="url(#rough2)">b=5</text>
  <rect x="202" y="248" width="114" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="322" y="260" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">L=3</text>

  <!-- 说明框 1 -->
  <rect x="36" y="272" width="448" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">L = [0, 0, 0, 1, 2, 3] 单调不降 → max(l, L[b]) 只切换一次，pos 可二分</text>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">（滑窗 left 指针只前进不后退，单调性是白送的）</text>

  <!-- 说明框 2 -->
  <rect x="36" y="318" width="448" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">cnt[b] = b − L[b] + 1（以 b 结尾的好子串数）→ 前缀和 pre</text>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">任意区间一段求和 O(1) 截取</text>
</svg>
