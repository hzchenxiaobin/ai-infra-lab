<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：n = 5, x = 2, y = 4</text>

  <!-- 迷你图：链 1..5 + 弦 2–4 -->
  <g stroke="#446688" stroke-width="1.5" filter="url(#rough2)">
    <line x1="72" y1="88" x2="88" y2="88"/>
    <line x1="122" y1="88" x2="138" y2="88"/>
    <line x1="172" y1="88" x2="188" y2="88"/>
    <line x1="222" y1="88" x2="238" y2="88"/>
  </g>

  <rect x="38" y="71" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="88" y="71" width="34" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="138" y="71" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="71" width="34" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="238" y="71" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <g text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    <text x="55" y="92">1</text>
    <text x="105" y="92">2</text>
    <text x="155" y="92">3</text>
    <text x="205" y="92">4</text>
    <text x="255" y="92">5</text>
  </g>

  <path d="M 105 69 Q 155 34 205 69" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="44" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">弦 2–4（1 步）</text>

  <g text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">
    <text x="105" y="120">x</text>
    <text x="205" y="120">y</text>
  </g>

  <!-- 距离矩阵（上三角） -->
  <text x="318" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i＼j</text>
  <g text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    <text x="347" y="66">1</text>
    <text x="381" y="66">2</text>
    <text x="415" y="66">3</text>
    <text x="449" y="66">4</text>
    <text x="483" y="66">5</text>
    <text x="322" y="96">1</text>
    <text x="322" y="130">2</text>
    <text x="322" y="164">3</text>
    <text x="322" y="198">4</text>
    <text x="322" y="232">5</text>
  </g>

  <!-- 下三角：空 -->
  <g fill="none" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)">
    <rect x="330" y="108" width="34" height="34"/>
    <rect x="364" y="142" width="34" height="34"/>
    <rect x="330" y="142" width="34" height="34"/>
    <rect x="398" y="176" width="34" height="34"/>
    <rect x="364" y="176" width="34" height="34"/>
    <rect x="330" y="176" width="34" height="34"/>
    <rect x="432" y="210" width="34" height="34"/>
    <rect x="398" y="210" width="34" height="34"/>
    <rect x="364" y="210" width="34" height="34"/>
    <rect x="330" y="210" width="34" height="34"/>
  </g>

  <!-- 对角线：× -->
  <g filter="url(#rough2)">
    <rect x="330" y="74" width="34" height="34" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
    <rect x="364" y="108" width="34" height="34" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
    <rect x="398" y="142" width="34" height="34" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
    <rect x="432" y="176" width="34" height="34" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
    <rect x="466" y="210" width="34" height="34" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">
    <text x="347" y="96">×</text>
    <text x="381" y="130">×</text>
    <text x="415" y="164">×</text>
    <text x="449" y="198">×</text>
    <text x="483" y="232">×</text>
  </g>

  <!-- 上三角：距离值 -->
  <g filter="url(#rough2)">
    <rect x="364" y="74" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="398" y="74" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="432" y="74" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="466" y="74" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="398" y="108" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="432" y="108" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="466" y="108" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="432" y="142" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="466" y="142" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="466" y="176" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="381" y="96" fill="#2d5a1f">1</text>
    <text x="415" y="96" fill="#8a6a20">2</text>
    <text x="449" y="96" fill="#8a6a20">2</text>
    <text x="483" y="96" fill="#a04040">3</text>
    <text x="415" y="130" fill="#2d5a1f">1</text>
    <text x="449" y="130" fill="#2d5a1f">1</text>
    <text x="483" y="130" fill="#8a6a20">2</text>
    <text x="449" y="164" fill="#2d5a1f">1</text>
    <text x="483" y="164" fill="#8a6a20">2</text>
    <text x="483" y="198" fill="#2d5a1f">1</text>
  </g>

  <text x="415" y="262" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">上三角：无序点对 (i &lt; j) 的距离</text>

  <!-- 图例 -->
  <text x="46" y="140" font-size="12" fill="#333" filter="url(#rough2)">距离分布（无序对 × 2）</text>
  <rect x="46" y="150" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="163" font-size="12" fill="#333" filter="url(#rough2)">距离 1：5 对 × 2 = 10</text>
  <rect x="46" y="180" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="193" font-size="12" fill="#333" filter="url(#rough2)">距离 2：4 对 × 2 = 8</text>
  <rect x="46" y="210" width="16" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="223" font-size="12" fill="#333" filter="url(#rough2)">距离 3：1 对 × 2 = 2</text>
  <text x="46" y="248" font-size="11" fill="#888" filter="url(#rough2)">(i,j) 与 (j,i) 记为 2 个有序对</text>

  <!-- 结果条 -->
  <g filter="url(#rough2)">
    <rect x="100" y="278" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="172" y="278" width="56" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="244" y="278" width="56" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="316" y="278" width="56" height="44" rx="6" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5"/>
    <rect x="388" y="278" width="56" height="44" rx="6" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    <text x="128" y="293">k=1</text>
    <text x="200" y="293">k=2</text>
    <text x="272" y="293">k=3</text>
    <text x="344" y="293">k=4</text>
    <text x="416" y="293">k=5</text>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="bold" filter="url(#rough2)">
    <text x="128" y="315" fill="#2d5a1f">10</text>
    <text x="200" y="315" fill="#8a6a20">8</text>
    <text x="272" y="315" fill="#a04040">2</text>
    <text x="344" y="315" fill="#999">0</text>
    <text x="416" y="315" fill="#999">0</text>
  </g>

  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res = [10, 8, 2, 0, 0]：距离超过 3 的点对不存在</text>
</svg>
