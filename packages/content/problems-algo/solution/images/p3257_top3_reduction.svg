<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">交换论证：最优解的每个车都在「行前 3 大 ∩ 列前 3 大」</text>

  <!-- ① 行方向交换论证 -->
  <text x="260" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 行方向交换（列方向完全同理）</text>

  <rect x="53" y="70" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="113" y="70" width="54" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="173" y="70" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="233" y="70" width="54" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="293" y="70" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="353" y="70" width="54" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="413" y="70" width="54" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="80" y="64" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗占用</text>
  <text x="200" y="64" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗占用</text>
  <text x="140" y="64" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">车</text>
  <text x="320" y="64" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">空列!</text>

  <path d="M 140 108 C 150 132, 310 132, 316 110" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">换到 7 ≥ 5，总和不减</text>

  <text x="260" y="156" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">行前 3 大占 3 个不同列（绿），另外两个车至多占其中 2 列 → 必剩一个空列的前 3 大</text>

  <!-- ② 双重筛选 Venn -->
  <text x="260" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 双重筛选 → 候选数 ≤ min(3m, 3n)</text>

  <ellipse cx="190" cy="258" rx="135" ry="62" fill="#e8f0fe" fill-opacity="0.9" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="330" cy="258" rx="135" ry="62" fill="#e6f4ea" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <text x="120" y="250" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">每行前 3 大</text>
  <text x="120" y="270" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">≤ 3m 个</text>
  <text x="400" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">每列前 3 大</text>
  <text x="400" y="270" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">≤ 3n 个</text>

  <rect x="212" y="222" width="96" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">候选</text>
  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">≤ min(3m, 3n)</text>
  <text x="260" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10" filter="url(#rough2)">≤ 1500 个</text>

  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">500 × 500 = 250,000 个格子 → 最多 1500 个候选（缩到 0.6%）</text>
  <text x="260" y="354" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">平局按 (值, 下标) 字典序取前 3，等价于给格子互异的「虚拟值」，证明不变</text>
</svg>
