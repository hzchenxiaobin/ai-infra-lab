<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：构造 pre 表 + 三次查询</text>

  <!-- nums 索引 0..5 -->
  <text x="120" y="50" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="168" y="50" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="216" y="50" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="264" y="50" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="312" y="50" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="360" y="50" text-anchor="middle" font-size="10" fill="#999">5</text>

  <!-- nums 标签 -->
  <text x="70" y="82" text-anchor="end" font-size="12" fill="#777" font-weight="bold">nums</text>

  <!-- nums 单元格 -->
  <rect x="96" y="58" width="48" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="58" width="48" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="58" width="48" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="58" width="48" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="288" y="58" width="48" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="336" y="58" width="48" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- nums 值 -->
  <text x="120" y="82" text-anchor="middle" font-size="14" fill="#666">−2</text>
  <text x="168" y="82" text-anchor="middle" font-size="14" fill="#666">0</text>
  <text x="216" y="82" text-anchor="middle" font-size="14" fill="#666">3</text>
  <text x="264" y="82" text-anchor="middle" font-size="14" fill="#666">−5</text>
  <text x="312" y="82" text-anchor="middle" font-size="14" fill="#666">2</text>
  <text x="360" y="82" text-anchor="middle" font-size="14" fill="#666">−1</text>

  <!-- pre 索引 0..6 -->
  <text x="96" y="120" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">pre[0]</text>
  <text x="144" y="120" text-anchor="middle" font-size="10" fill="#999">[1]</text>
  <text x="192" y="120" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[2]</text>
  <text x="240" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[3]</text>
  <text x="288" y="120" text-anchor="middle" font-size="10" fill="#999">[4]</text>
  <text x="336" y="120" text-anchor="middle" font-size="10" fill="#999">[5]</text>
  <text x="384" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[6]</text>

  <!-- pre 标签 -->
  <text x="70" y="150" text-anchor="end" font-size="12" fill="#777" font-weight="bold">pre</text>

  <!-- pre 单元格：被查询用到的上色（蓝=left 角色，红=right+1 角色）-->
  <rect x="75" y="126" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="123" y="126" width="42" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="171" y="126" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="219" y="126" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="267" y="126" width="42" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="315" y="126" width="42" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="363" y="126" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <!-- pre 值 -->
  <text x="96" y="150" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <text x="144" y="150" text-anchor="middle" font-size="13" fill="#666">−2</text>
  <text x="192" y="150" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">−2</text>
  <text x="240" y="150" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="288" y="150" text-anchor="middle" font-size="13" fill="#666">−4</text>
  <text x="336" y="150" text-anchor="middle" font-size="13" fill="#666">−2</text>
  <text x="384" y="150" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>

  <!-- 说明 -->
  <text x="270" y="184" text-anchor="middle" font-size="10" fill="#888">pre[i] = nums[0]+…+nums[i−1]，pre[0]=0　|　蓝=pre[left]　红=pre[right+1]</text>

  <!-- 计算框 -->
  <rect x="32" y="196" width="476" height="186" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">三次查询：两段相减</text>

  <!-- Q1 -->
  <text x="270" y="252" text-anchor="middle" font-size="13" fill="#444">
    <tspan>sumRange(0, 2) = </tspan>
    <tspan fill="#b85450" font-weight="bold">pre[3]</tspan>
    <tspan>  −  </tspan>
    <tspan fill="#446688" font-weight="bold">pre[0]</tspan>
    <tspan>  =  1 − 0  =  </tspan>
    <tspan fill="#d6a040" font-weight="bold">1 ✓</tspan>
  </text>

  <!-- Q2 -->
  <text x="270" y="290" text-anchor="middle" font-size="13" fill="#444">
    <tspan>sumRange(2, 5) = </tspan>
    <tspan fill="#b85450" font-weight="bold">pre[6]</tspan>
    <tspan>  −  </tspan>
    <tspan fill="#446688" font-weight="bold">pre[2]</tspan>
    <tspan>  =  (−3) − (−2)  =  </tspan>
    <tspan fill="#d6a040" font-weight="bold">−1 ✓</tspan>
  </text>

  <!-- Q3 -->
  <text x="270" y="328" text-anchor="middle" font-size="13" fill="#444">
    <tspan>sumRange(0, 5) = </tspan>
    <tspan fill="#b85450" font-weight="bold">pre[6]</tspan>
    <tspan>  −  </tspan>
    <tspan fill="#446688" font-weight="bold">pre[0]</tspan>
    <tspan>  =  (−3) − 0  =  </tspan>
    <tspan fill="#d6a040" font-weight="bold">−3 ✓</tspan>
  </text>

  <text x="270" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">三次查询全部 O(1) 命中 ✓</text>
</svg>
