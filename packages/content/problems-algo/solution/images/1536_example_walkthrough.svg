<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：grid = [[0,0,1],[1,1,0],[1,0,0]]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">尾零数 tz = [0, 1, 2]；逐位置贪心，累计交换 3 次</text>

  <!-- Initial state -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">初始 tz：</text>
  <g font-size="12">
    <rect x="86" y="58" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="106" y="76" text-anchor="middle" fill="#333">0</text>
    <rect x="128" y="58" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="148" y="76" text-anchor="middle" fill="#333">1</text>
    <rect x="170" y="58" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="190" y="76" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
  </g>
  <text x="222" y="76" font-size="10" fill="#888">（行 0,1,2 的尾零数）</text>

  <!-- divider -->
  <path d="M 30 100 L 550 100" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <text x="30" y="122" font-size="11" fill="#d6a040" font-weight="bold">步骤 ①：i=0，需求 req = n−1−0 = 2</text>
  <g font-size="12">
    <!-- tz array with scan -->
    <rect x="86" y="132" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="106" y="150" text-anchor="middle" fill="#b85450">0</text>
    <text x="106" y="170" text-anchor="middle" font-size="9" fill="#b85450">✗&lt;2</text>

    <rect x="128" y="132" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="148" y="150" text-anchor="middle" fill="#b85450">1</text>
    <text x="148" y="170" text-anchor="middle" font-size="9" fill="#b85450">✗&lt;2</text>

    <rect x="170" y="132" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="190" y="150" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="190" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ j=2</text>
  </g>

  <!-- swap arrow: j=2 up to i=0, distance 2 -->
  <path d="M 215 145 L 250 145" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrU)" fill="none" filter="url(#rough2)"/>
  <text x="232" y="138" text-anchor="middle" font-size="9" fill="#d6a040">冒泡 2 格</text>

  <!-- after step 1 -->
  <text x="270" y="122" font-size="11" fill="#666" font-weight="bold">交换后 tz →</text>
  <g font-size="12">
    <rect x="350" y="132" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="370" y="150" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="392" y="132" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="412" y="150" text-anchor="middle" fill="#333">0</text>
    <rect x="434" y="132" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="454" y="150" text-anchor="middle" fill="#333">1</text>
  </g>
  <rect x="490" y="134" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="520" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ans=2</text>

  <!-- divider -->
  <path d="M 30 184 L 550 184" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <text x="30" y="206" font-size="11" fill="#d6a040" font-weight="bold">步骤 ②：i=1，需求 req = n−1−1 = 1</text>
  <g font-size="12">
    <rect x="86" y="216" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="106" y="234" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="106" y="254" text-anchor="middle" font-size="9" fill="#888">已用</text>

    <rect x="128" y="216" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="148" y="234" text-anchor="middle" fill="#b85450">0</text>
    <text x="148" y="254" text-anchor="middle" font-size="9" fill="#b85450">✗&lt;1</text>

    <rect x="170" y="216" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="190" y="234" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="190" y="254" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ j=2</text>
  </g>

  <path d="M 215 229 L 250 229" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrU)" fill="none" filter="url(#rough2)"/>
  <text x="232" y="222" text-anchor="middle" font-size="9" fill="#d6a040">冒泡 1 格</text>

  <text x="270" y="206" font-size="11" fill="#666" font-weight="bold">交换后 tz →</text>
  <g font-size="12">
    <rect x="350" y="216" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="370" y="234" text-anchor="middle" fill="#4a7a3a">2</text>
    <rect x="392" y="216" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="412" y="234" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="434" y="216" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="454" y="234" text-anchor="middle" fill="#333">0</text>
  </g>
  <rect x="490" y="218" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="520" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ans=3</text>

  <!-- divider -->
  <path d="M 30 268 L 550 268" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <text x="30" y="290" font-size="11" fill="#d6a040" font-weight="bold">步骤 ③：i=2，需求 req = n−1−2 = 0</text>
  <g font-size="12">
    <rect x="86" y="300" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="106" y="318" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="106" y="338" text-anchor="middle" font-size="9" fill="#888">已用</text>

    <rect x="128" y="300" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="148" y="318" text-anchor="middle" fill="#4a7a3a">1</text>
    <text x="148" y="338" text-anchor="middle" font-size="9" fill="#888">已用</text>

    <rect x="170" y="300" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="190" y="318" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="190" y="338" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ ≥0</text>
  </g>

  <text x="270" y="290" font-size="11" fill="#666" font-weight="bold">无需交换 →</text>
  <rect x="490" y="302" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="520" y="318" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ans=3</text>

  <!-- divider -->
  <path d="M 30 354 L 550 354" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- Final grid -->
  <text x="30" y="376" font-size="11" fill="#446688" font-weight="bold">最终网格（行顺序 [2,1,0]）：</text>
  <g font-size="12">
    <!-- row order: original row 2 [1,0,0], row 1 [1,1,0], row 0 [0,0,1] -->
    <rect x="30" y="386" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="44" y="403" text-anchor="middle" fill="#333">1</text>
    <rect x="60" y="386" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="74" y="403" text-anchor="middle" fill="#333">0</text>
    <rect x="90" y="386" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="104" y="403" text-anchor="middle" fill="#333">0</text>

    <rect x="30" y="412" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="44" y="429" text-anchor="middle" fill="#333">1</text>
    <rect x="60" y="412" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="74" y="429" text-anchor="middle" fill="#333">1</text>
    <rect x="90" y="412" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="104" y="429" text-anchor="middle" fill="#333">0</text>

    <rect x="30" y="438" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="44" y="455" text-anchor="middle" fill="#333">0</text>
    <rect x="60" y="438" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="74" y="455" text-anchor="middle" fill="#333">0</text>
    <rect x="90" y="438" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="104" y="455" text-anchor="middle" fill="#333">1</text>
  </g>

  <!-- diagonal marker -->
  <path d="M 30 386 L 118 438" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>

  <!-- above-diagonal cells all 0 highlight -->
  <text x="150" y="403" font-size="10" fill="#4a7a3a" font-weight="bold">上三角全 0 ✓</text>
  <text x="150" y="429" font-size="10" fill="#888">（绿色 = 上三角区域，均为 0）</text>

  <!-- result box -->
  <rect x="380" y="386" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="455" y="406" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">答案 = 3</text>
  <text x="455" y="420" text-anchor="middle" font-size="9" fill="#d6a040">2 + 1 + 0 = 3 次相邻交换</text>
</svg>
