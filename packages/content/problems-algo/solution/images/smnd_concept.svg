<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">两种情形：有公共数字取最小公共位，无公共则各取最小拼两位数</text>

  <!-- divider -->
  <line x1="300" y1="50" x2="300" y2="372" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4 5" filter="url(#rough2)"/>

  <!-- ===== Case A (left): has common digit ===== -->
  <rect x="24" y="58" width="266" height="312" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情形 A：有公共数字</text>

  <!-- nums1 set -->
  <rect x="44" y="96" width="100" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="94" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums1</text>
  <text x="94" y="138" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">{3,5,2,6}</text>

  <!-- nums2 set -->
  <rect x="170" y="96" width="100" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums2</text>
  <text x="220" y="138" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">{3,1,7}</text>

  <!-- intersection -->
  <rect x="100" y="180" width="114" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="157" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">交集 = {3}</text>

  <!-- arrow down -->
  <path d="M 157 220 L 157 240" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="100" y="248" width="114" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="280" text-anchor="middle" font-size="20" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="157" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">min(交集) = 3</text>
  <text x="157" y="340" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一位数 &lt; 任意两位数</text>
  <text x="157" y="358" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">故有公共时单取最小公共位最优</text>

  <!-- ===== Case B (right): no common digit ===== -->
  <rect x="310" y="58" width="266" height="312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="443" y="80" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">情形 B：无公共数字</text>

  <!-- nums1 set -->
  <rect x="330" y="96" width="100" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums1</text>
  <text x="380" y="138" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">{4,1,3}</text>

  <!-- nums2 set -->
  <rect x="456" y="96" width="100" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="506" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums2</text>
  <text x="506" y="138" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">{5,7}</text>

  <!-- intersection empty -->
  <rect x="386" y="180" width="114" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="443" y="202" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">交集 = ∅</text>

  <!-- arrow down -->
  <path d="M 443 220 L 443 240" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mins -->
  <rect x="330" y="248" width="100" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">min(nums1)=1</text>

  <rect x="456" y="248" width="100" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="506" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">min(nums2)=5</text>

  <!-- arrow to compose -->
  <path d="M 443 288 L 443 306" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="386" y="312" width="114" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="443" y="340" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">15</text>

  <text x="443" y="366" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">min(15, 51) = 15（十位放更小者）</text>
</svg>
