<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：计数 + 奇偶分组取最值</text>

  <!-- 步骤1：计数 -->
  <rect x="130" y="42" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">一次遍历 s，统计 cnt[26]</text>
  <path d="M 230 76 L 230 90" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2：初始化 -->
  <rect x="130" y="92" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">maxOdd = −∞，minEven = +∞</text>
  <path d="M 230 126 L 230 140" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3：遍历字母 -->
  <rect x="130" y="142" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="163" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">遍历 c ∈ 'a' … 'z'</text>
  <path d="M 230 176 L 230 198" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断1：频次为0？ -->
  <polygon points="155,236 260,202 365,236 260,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt[c] = 0 ?</text>

  <text x="372" y="230" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 365 236 L 388 236" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="218" width="72" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="426" y="241" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">跳过</text>
  <path d="M 426 218 L 426 159 L 336 159" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="192" font-size="11" fill="#446688" filter="url(#rough2)">下一轮</text>

  <text x="240" y="292" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 260 270 L 260 326" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断2：奇偶？ -->
  <polygon points="145,372 260,330 375,372 260,414" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cnt[c] 为奇数 ?</text>

  <text x="130" y="364" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <path d="M 145 372 L 122 372" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="8" y="352" width="112" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="64" y="369" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">maxOdd =</text>
  <text x="64" y="386" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">max(maxOdd, cnt[c])</text>

  <text x="380" y="364" font-size="12" fill="#a07020" filter="url(#rough2)">偶</text>
  <path d="M 375 372 L 398 372" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="352" width="112" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="369" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">minEven =</text>
  <text x="456" y="386" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">min(minEven, cnt[c])</text>

  <!-- 返回 -->
  <path d="M 64 396 C 64 432, 100 448, 148 451" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 456 396 C 456 432, 420 448, 372 451" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="260" cy="452" rx="108" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="457" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 maxOdd − minEven</text>

  <!-- 右上提示 -->
  <rect x="355" y="60" width="158" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="434" y="81" text-anchor="middle" font-size="12" fill="#2a4a6a" filter="url(#rough2)">💡 频次 0 必须跳过</text>
  <text x="434" y="100" text-anchor="middle" font-size="12" fill="#2a4a6a" filter="url(#rough2)">否则 minEven 恒为 0</text>
</svg>
