<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：局部倒置 ⊂ 全局倒置，只需检测「远距离倒置」</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">nums = [1, 2, 0]：局部倒置 L=1，全局倒置 G=2，多出的 (0,2) 即远距离倒置</text>

  <!-- array row: 3 cells width 56 start x=120 -->
  <rect x="120" y="64" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="91" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="176" y="64" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="91" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="232" y="64" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="91" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>

  <!-- index labels -->
  <text x="148" y="118" text-anchor="middle" font-size="10" fill="#aaa">i=0</text>
  <text x="204" y="118" text-anchor="middle" font-size="10" fill="#aaa">i=1</text>
  <text x="260" y="118" text-anchor="middle" font-size="10" fill="#aaa">i=2</text>

  <!-- local inversion: adjacent (1,2) red straight arrow -->
  <path d="M 204 128 L 260 128" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="146" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">局部倒置 2&gt;0 ✓</text>

  <!-- far inversion: (0,2) orange curved arc above -->
  <path d="M 148 58 Q 204 18 260 58" stroke="#d6a040" stroke-width="2.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="204" y="30" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">远距离倒置 1&gt;0（j−i=2）</text>

  <!-- Venn diagram on the right -->
  <text x="430" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">包含关系</text>
  <ellipse cx="430" cy="120" rx="74" ry="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="438" cy="128" rx="40" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">全局 G=2</text>
  <text x="438" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">局部 L=1</text>
  <text x="470" y="158" text-anchor="middle" font-size="9.5" fill="#d6a040">远距离=1</text>

  <!-- divider -->
  <line x1="40" y1="186" x2="520" y2="186" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- equivalence chain -->
  <text x="280" y="210" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">判定等价链</text>

  <rect x="50" y="226" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="125" y="251" text-anchor="middle" font-size="11.5" fill="#444">G == L</text>

  <path d="M 200 246 L 232 246" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="234" y="226" width="190" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="329" y="246" text-anchor="middle" font-size="11" fill="#444">不存在远距离倒置</text>
  <text x="329" y="260" text-anchor="middle" font-size="10" fill="#666">∀(i,j), j≥i+2: nums[i]≤nums[j]</text>

  <path d="M 424 246 L 456 246" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="458" y="226" width="78" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="497" y="246" text-anchor="middle" font-size="10.5" fill="#444">∀i:</text>
  <text x="497" y="260" text-anchor="middle" font-size="10" fill="#666">nums[i]≤min(nums[i+2..])</text>

  <!-- conclusion box -->
  <rect x="40" y="296" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">局部倒置天然属于全局倒置 ⇒ G ≥ L 恒成立</text>
  <text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#666">只需逐位检查 nums[i] 是否大于其后第 2 位起的最小值</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#888">维护后缀最小值 mn = min(nums[i+2..])，一次从右向左扫描即可</text>
</svg>
