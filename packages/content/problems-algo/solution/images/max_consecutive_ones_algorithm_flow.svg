<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次遍历状态机</text>

  <!-- Start -->
  <rect x="250" y="42" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">开始</text>
  <line x1="300" y1="70" x2="300" y2="88" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="90" width="300" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="12" fill="#555">count = 0, maxCount = 0, i = 0</text>
  <line x1="300" y1="124" x2="300" y2="142" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond 1: i < n -->
  <polygon points="300,144 384,182 300,220 216,182" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="180" text-anchor="middle" font-size="12" fill="#3a5a2a">i &lt; n ?</text>

  <!-- No -> return maxCount -->
  <line x1="384" y1="182" x2="458" y2="182" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="421" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="168" width="120" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="187" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 maxCount</text>

  <!-- Yes -> down to Diamond 2 -->
  <line x1="300" y1="220" x2="300" y2="236" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="316" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond 2: nums[i] == 1 -->
  <polygon points="300,236 392,278 300,320 208,278" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="275" text-anchor="middle" font-size="12" fill="#3a5a2a">nums[i]</text>
  <text x="300" y="291" text-anchor="middle" font-size="12" fill="#3a5a2a">== 1 ?</text>

  <!-- Yes (count++) -> left box -->
  <line x1="208" y1="278" x2="172" y2="278" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="190" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="258" width="140" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="276" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">count++</text>
  <text x="100" y="291" text-anchor="middle" font-size="10" fill="#2a4a66">maxCount = max(maxCount, count)</text>

  <!-- No (count=0) -> right box -->
  <line x1="392" y1="278" x2="428" y2="278" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="410" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="258" width="140" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="280" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">count = 0</text>
  <text x="500" y="294" text-anchor="middle" font-size="10" fill="#a67830">断链，重新计数</text>

  <!-- Both branches -> i++ -->
  <path d="M 100 300 L 100 340 L 300 340" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 500 300 L 500 340 L 300 340" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- i++ box -->
  <rect x="240" y="340" width="120" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="361" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">i++</text>

  <!-- Loopback to Diamond 1 -->
  <path d="M 300 372 L 300 398 L 30 398 L 30 182 L 212 182" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="42" y="392" font-size="11" fill="#666">↻ 回到「i &lt; n ?」</text>

  <!-- caption -->
  <rect x="60" y="418" width="480" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="436" text-anchor="middle" font-size="11" fill="#555">每个元素只访问一次：遇 1 蓄力，遇 0 归零</text>
  <text x="300" y="451" text-anchor="middle" font-size="11" fill="#555">maxCount 只升不降，遍历结束即为答案</text>
</svg>
