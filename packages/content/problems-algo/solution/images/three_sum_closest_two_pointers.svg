<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：排序后固定 nums[i]，双指针夹逼让 s 逼近 target</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">s = nums[i] + nums[left] + nums[right]，沿途维护 |s−target| 最小的 best</text>

  <!-- sorted array row -->
  <g font-size="12" fill="#333">
    <text x="44" y="92" font-size="11" fill="#888">排序后数组：</text>

    <!-- nums[i] cell (fixed) -->
    <rect x="100" y="76" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="125" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">nums[i]</text>

    <!-- gap -->
    <text x="170" y="98" font-size="14" fill="#888">…</text>

    <!-- left cell -->
    <rect x="200" y="76" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="225" y="98" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">nums[l]</text>

    <!-- middle cells -->
    <rect x="252" y="76" width="44" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="274" y="98" text-anchor="middle" font-size="11" fill="#aaa">·</text>
    <rect x="298" y="76" width="44" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="320" y="98" text-anchor="middle" font-size="11" fill="#aaa">·</text>

    <!-- right cell -->
    <rect x="344" y="76" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="369" y="98" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">nums[r]</text>

    <!-- pointer labels -->
    <text x="125" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">固定 i</text>
    <text x="225" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left →</text>
    <text x="369" y="70" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">← right</text>
  </g>

  <!-- three movement rules -->
  <g font-size="11" fill="#333">
    <!-- rule 1: s < target -->
    <rect x="40" y="128" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="148" font-size="12" fill="#446688" font-weight="bold">情况 ①</text>
    <text x="106" y="148" font-family="monospace" font-size="11" fill="#555">s &lt; target  →  和太小</text>
    <text x="54" y="168" font-size="10" fill="#888">left++（左端换更大的数，让 s 增大去逼近 target）</text>
    <path d="M 280 162 L 330 162" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="305" y="158" text-anchor="middle" font-size="9" fill="#446688">left 右移</text>

    <!-- rule 2: s > target -->
    <rect x="40" y="194" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="214" font-size="12" fill="#d6a040" font-weight="bold">情况 ②</text>
    <text x="106" y="214" font-family="monospace" font-size="11" fill="#555">s &gt; target  →  和太大</text>
    <text x="54" y="234" font-size="10" fill="#888">right--（右端换更小的数，让 s 减小去逼近 target）</text>
    <path d="M 330 228 L 280 228" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="305" y="224" text-anchor="middle" font-size="9" fill="#d6a040">right 左移</text>

    <!-- rule 3: s == target -->
    <rect x="40" y="260" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="280" font-size="12" fill="#b85450" font-weight="bold">情况 ③</text>
    <text x="106" y="280" font-family="monospace" font-size="11" fill="#555">s == target  →  差值 0，绝对最优！</text>
    <text x="54" y="300" font-size="10" fill="#888">直接 return target（不可能更近，提前返回省后续搜索）</text>
  </g>

  <!-- best tracking note -->
  <rect x="40" y="328" width="440" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">沿途维护 best：每当 |s−target| &lt; |best−target|，更新 best = s</text>
  <text x="260" y="362" text-anchor="middle" font-size="10" fill="#888">无需去重（只返回一个和，相同三元组不影响 best）</text>
</svg>
