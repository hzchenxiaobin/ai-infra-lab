<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BFS 建立最短路径 DAG：只保留层间边</text>

  <!-- Level labels -->
  <text x="70" y="52" text-anchor="middle" font-size="11" fill="#888">第 0 层</text>
  <text x="200" y="52" text-anchor="middle" font-size="11" fill="#888">第 1 层</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#888">第 2 层</text>
  <text x="460" y="52" text-anchor="middle" font-size="11" fill="#888">第 3 层</text>
  <text x="570" y="52" text-anchor="middle" font-size="11" fill="#888">第 4 层</text>

  <!-- Dashed level separators -->
  <line x1="135" y1="60" x2="135" y2="245" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="265" y1="60" x2="265" y2="245" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="395" y1="60" x2="395" y2="245" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="515" y1="60" x2="515" y2="245" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Valid DAG edges (kept, blue/solid) -->
  <path d="M 93 175 L 177 175" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 223 170 L 307 145" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 223 180 L 307 205" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 353 145 L 437 145" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 353 205 L 437 205" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 483 150 L 547 172" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 483 210 L 547 188" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Discarded same-level edge (dot/lot, red dashed) -->
  <path d="M 353 158 Q 330 180 353 192" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="318" y="183" text-anchor="middle" font-size="9" fill="#b85450">同层边 ✗</text>

  <!-- Nodes -->
  <!-- hit (level 0, start = green) -->
  <rect x="47" y="162" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">hit</text>

  <!-- hot (level 1) -->
  <rect x="177" y="162" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">hot</text>

  <!-- dot (level 2) -->
  <rect x="307" y="132" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dot</text>

  <!-- lot (level 2) -->
  <rect x="307" y="192" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">lot</text>

  <!-- dog (level 3) -->
  <rect x="437" y="132" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dog</text>

  <!-- log (level 3) -->
  <rect x="437" y="192" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">log</text>

  <!-- cog (level 4, end = orange) -->
  <rect x="524" y="162" width="46" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="547" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">cog</text>

  <!-- Start/End labels -->
  <text x="70" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">起点</text>
  <text x="547" y="215" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">终点</text>

  <!-- Divider -->
  <line x1="30" y1="258" x2="590" y2="258" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Section title -->
  <text x="310" y="284" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">DAG 性质：层号单调递增 → 无环</text>

  <!-- Rule box 1 -->
  <rect x="50" y="306" width="250" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="328" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">保留的边（蓝实线）</text>
  <text x="175" y="346" text-anchor="middle" font-size="10" fill="#444">第 k 层 → 第 k+1 层</text>
  <text x="175" y="361" text-anchor="middle" font-size="10" fill="#444">邻居 nb 未访问 → 记入 children</text>

  <!-- Rule box 2 -->
  <rect x="320" y="306" width="250" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="328" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">丢弃的边（红虚线）</text>
  <text x="445" y="346" text-anchor="middle" font-size="10" fill="#444">同层之间、回退上一层</text>
  <text x="445" y="361" text-anchor="middle" font-size="10" fill="#444">邻居已访问 → 不在最短路上</text>

  <!-- Bottom note -->
  <rect x="60" y="392" width="500" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="412" text-anchor="middle" font-size="11" fill="#444">回溯等价于在 DAG 上枚举所有 beginWord → endWord 路径</text>
  <text x="310" y="428" text-anchor="middle" font-size="11" fill="#444">每条路径长度都等于 BFS 层数（最短），无需再比长度</text>
</svg>
