<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#888" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：子集枚举 → 全排列 → 排序 → 二分</text>

  <!-- 阶段一 标签 -->
  <text x="40" y="56" font-size="11" fill="#446688" font-weight="bold">阶段一 · 预生成（约 300 个候选）</text>

  <!-- Box1: 枚举子集 -->
  <rect x="160" y="64" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="86" text-anchor="middle" font-size="12" fill="#333">位掩码枚举 {1..7} 的子集 S</text>
  <path d="M 270 98 L 270 112" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 总位数 <= 7? -->
  <polygon points="270,116 360,150 270,184 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#444">总位数</text>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#444">Σd ≤ 7 ?</text>
  <!-- No 分支 -->
  <path d="M 360 150 L 410 150" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="144" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="410" y="134" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="155" text-anchor="middle" font-size="11" fill="#b85450">跳过该子集</text>
  <!-- Yes 分支 -->
  <path d="M 270 184 L 270 198" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="196" font-size="10" fill="#4a7a3a">是</text>

  <!-- Box2: 构造多重集 -->
  <rect x="150" y="200" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="12" fill="#333">构造多重集：每个 d 出现 d 次</text>
  <path d="M 270 234 L 270 248" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box3: 全排列 -->
  <rect x="120" y="250" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="12" fill="#333">next_permutation 生成去重全排列</text>
  <path d="M 270 284 L 270 298" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box4: 收集整数 -->
  <rect x="150" y="300" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#333">转整数，收集到候选数组</text>

  <!-- 循环回边 -->
  <path d="M 150 317 Q 90 317 90 200 Q 90 81 160 81" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="200" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 74 200)">遍历所有子集</text>

  <!-- 分隔线 -->
  <path d="M 60 350 L 480 350" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- 阶段二 标签 -->
  <text x="40" y="372" font-size="11" fill="#446688" font-weight="bold">阶段二 · 查询（O(log P)）</text>

  <!-- Box5: 排序 -->
  <rect x="170" y="382" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="402" text-anchor="middle" font-size="12" fill="#333">排序候选数组</text>
  <path d="M 270 412 L 270 422" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box6: upper_bound -->
  <rect x="120" y="424" width="300" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="444" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">upper_bound 找第一个 &gt; n，返回</text>
</svg>
