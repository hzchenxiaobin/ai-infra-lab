<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：D→+4、R→+1 ⟹ 路径下标严格递增 → 网格坍缩成 16 位数字串</text>

  <!-- ① 左：4×4 网格 -->
  <g filter="url(#rough2)">
    <rect x="20" y="38" width="256" height="214" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="148" y="56" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">① 4×4 网格：行优先下标（示例 2，DDRRDR）</text>

    <!-- 网格：origin (78,72)，格 32×32，间距 4 -->
    <!-- 行 0 -->
    <rect x="78" y="72" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="114" y="72" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="72" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="186" y="72" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <!-- 行 1 -->
    <rect x="78" y="108" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="114" y="108" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="108" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="186" y="108" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <!-- 行 2 -->
    <rect x="78" y="144" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="114" y="144" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="150" y="144" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="186" y="144" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <!-- 行 3 -->
    <rect x="78" y="180" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="114" y="180" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="180" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="186" y="180" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>

    <!-- 下标标签（左上角小字） -->
    <text x="81" y="82" font-size="7.5" fill="#8a6d1a">0</text>
    <text x="117" y="82" font-size="7.5" fill="#999">1</text>
    <text x="153" y="82" font-size="7.5" fill="#999">2</text>
    <text x="189" y="82" font-size="7.5" fill="#999">3</text>
    <text x="81" y="118" font-size="7.5" fill="#8a6d1a">4</text>
    <text x="117" y="118" font-size="7.5" fill="#999">5</text>
    <text x="153" y="118" font-size="7.5" fill="#999">6</text>
    <text x="189" y="118" font-size="7.5" fill="#999">7</text>
    <text x="81" y="154" font-size="7.5" fill="#8a6d1a">8</text>
    <text x="117" y="154" font-size="7.5" fill="#8a6d1a">9</text>
    <text x="153" y="154" font-size="7.5" fill="#8a6d1a">10</text>
    <text x="189" y="154" font-size="7.5" fill="#999">11</text>
    <text x="81" y="190" font-size="7.5" fill="#999">12</text>
    <text x="117" y="190" font-size="7.5" fill="#999">13</text>
    <text x="153" y="190" font-size="7.5" fill="#8a6d1a">14</text>
    <text x="189" y="190" font-size="7.5" fill="#8a6d1a">15</text>

    <!-- 格内数字（x = 123456789 补零） -->
    <text x="94" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">0</text>
    <text x="130" y="94" text-anchor="middle" font-size="13" fill="#666">0</text>
    <text x="166" y="94" text-anchor="middle" font-size="13" fill="#666">0</text>
    <text x="202" y="94" text-anchor="middle" font-size="13" fill="#666">0</text>
    <text x="94" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">0</text>
    <text x="130" y="130" text-anchor="middle" font-size="13" fill="#666">0</text>
    <text x="166" y="130" text-anchor="middle" font-size="13" fill="#666">0</text>
    <text x="202" y="130" text-anchor="middle" font-size="13" fill="#666">1</text>
    <text x="94" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
    <text x="130" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
    <text x="166" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">4</text>
    <text x="202" y="166" text-anchor="middle" font-size="13" fill="#666">5</text>
    <text x="94" y="202" text-anchor="middle" font-size="13" fill="#666">6</text>
    <text x="130" y="202" text-anchor="middle" font-size="13" fill="#666">7</text>
    <text x="166" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">8</text>
    <text x="202" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">9</text>

    <!-- 路径箭头 + 移动字母 -->
    <path d="M 94,92 L 94,115" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="102" y="107" font-size="9" fill="#b85450" font-weight="bold">D</text>
    <path d="M 94,128 L 94,151" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="102" y="143" font-size="9" fill="#b85450" font-weight="bold">D</text>
    <path d="M 99,160 L 121,160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="106" y="153" font-size="9" fill="#b85450" font-weight="bold">R</text>
    <path d="M 135,160 L 157,160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="142" y="153" font-size="9" fill="#b85450" font-weight="bold">R</text>
    <path d="M 166,165 L 166,188" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="174" y="180" font-size="9" fill="#b85450" font-weight="bold">D</text>
    <path d="M 171,196 L 193,196" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="178" y="189" font-size="9" fill="#b85450" font-weight="bold">R</text>

    <!-- 说明 -->
    <text x="148" y="229" text-anchor="middle" font-size="10" fill="#33506b">下标 = 4·row + col　⇒　D：+4，R：+1</text>
    <text x="148" y="245" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">路径下标 0 &lt; 4 &lt; 8 &lt; 9 &lt; 10 &lt; 14 &lt; 15 严格递增</text>
  </g>

  <!-- ② 右：坍缩成 16 位串 -->
  <g filter="url(#rough2)">
    <rect x="292" y="38" width="248" height="214" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="416" y="56" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">② 坍缩成 16 位数字串（x = 123456789 补零）</text>

    <!-- 16 格数字串 -->
    <rect x="313" y="76" width="12" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="326" y="76" width="12" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="339" y="76" width="12" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="352" y="76" width="12" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="365" y="76" width="12" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="378" y="76" width="12" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="391" y="76" width="12" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="404" y="76" width="12" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="417" y="76" width="12" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="430" y="76" width="12" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="443" y="76" width="12" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="456" y="76" width="12" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="469" y="76" width="12" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="482" y="76" width="12" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="495" y="76" width="12" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="508" y="76" width="12" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>

    <text x="319" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">0</text>
    <text x="332" y="92" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="345" y="92" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="358" y="92" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="371" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">0</text>
    <text x="384" y="92" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="397" y="92" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="410" y="92" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="423" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">2</text>
    <text x="436" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">3</text>
    <text x="449" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">4</text>
    <text x="462" y="92" text-anchor="middle" font-size="11" fill="#555">5</text>
    <text x="475" y="92" text-anchor="middle" font-size="11" fill="#555">6</text>
    <text x="488" y="92" text-anchor="middle" font-size="11" fill="#555">7</text>
    <text x="501" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">8</text>
    <text x="514" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">9</text>

    <!-- 路径下标标注 -->
    <text x="319" y="111" text-anchor="middle" font-size="8" fill="#b85450">0</text>
    <text x="371" y="111" text-anchor="middle" font-size="8" fill="#b85450">4</text>
    <text x="423" y="111" text-anchor="middle" font-size="8" fill="#b85450">8</text>
    <text x="436" y="111" text-anchor="middle" font-size="8" fill="#b85450">9</text>
    <text x="449" y="111" text-anchor="middle" font-size="8" fill="#b85450">10</text>
    <text x="501" y="111" text-anchor="middle" font-size="8" fill="#b85450">14</text>
    <text x="514" y="111" text-anchor="middle" font-size="8" fill="#b85450">15</text>

    <path d="M 416,117 L 416,129" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
    <text x="425" y="127" font-size="8.5" fill="#2f5d24">抽出路径位</text>

    <!-- 抽出的 7 位序列 -->
    <rect x="340" y="134" width="20" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="362" y="134" width="20" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="384" y="134" width="20" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="406" y="134" width="20" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="428" y="134" width="20" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="450" y="134" width="20" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="472" y="134" width="20" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="350" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
    <text x="372" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
    <text x="394" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
    <text x="416" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
    <text x="438" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4</text>
    <text x="460" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">8</text>
    <text x="482" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">9</text>

    <text x="416" y="177" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">非递减 ⟹ 123456789 是好整数 ✓</text>
    <text x="416" y="196" text-anchor="middle" font-size="9.5" fill="#8a3030">对照 123456790：[0,0,2,3,4,9,0]，末位 0 &lt; 9 ✗</text>
    <text x="416" y="214" text-anchor="middle" font-size="9.5" fill="#4a6b5a">其余 9 个下标不在路径上，数字完全自由</text>
  </g>

  <!-- ③ 底部：结论 -->
  <g filter="url(#rough2)">
    <rect x="20" y="266" width="520" height="126" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="286" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">③ 网格消失：好整数 ⟺ 7 个固定下标处数字非递减 → 区间差分 + 数位 DP</text>
    <text x="280" y="308" text-anchor="middle" font-size="10" fill="#8a6d1a">好整数 ⟺ d(i₀) ≤ d(i₁) ≤ … ≤ d(i₆)，其中 0 = i₀ &lt; i₁ &lt; … &lt; i₆ = 15 由 directions 唯一决定</text>
    <text x="280" y="328" text-anchor="middle" font-size="10" fill="#8a6d1a">r ≤ 9×10¹⁵ &lt; 10¹⁶ ⟹ 每个 x 补零后恰 16 位；前导零即数据（0 ≤ 任何数字，天然不违规）</text>
    <text x="280" y="348" text-anchor="middle" font-size="10" fill="#8a6d1a">ans = f(r) − f(l−1)，f(N) = [0, N] 内好整数个数；f(0) = 1（全零串）边界自洽</text>
    <rect x="56" y="358" width="448" height="26" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="375" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">数位 DP 状态 (pos, tight, cnt, prev)：路径位要求 d ≥ prev 且 cnt+1，自由位无约束</text>
  </g>
</svg>
