<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀 DP 逐位推导 dp[i]</text>

  <!-- Start -->
  <ellipse cx="280" cy="62" rx="78" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">开始：dp[0]=true，其余 false</text>
  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i <= n ? -->
  <polygon points="280,104 370,150 280,196 190,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333">i ≤ n ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#666">(逐个位置)</text>

  <!-- No -> end -->
  <path d="M 370 150 L 454 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="500" cy="150" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="154" text-anchor="middle" font-size="12" fill="#333">返回 dp[n]</text>

  <!-- Yes down -->
  <path d="M 280 196 L 280 214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="210" font-size="11" fill="#82b366">是</text>

  <!-- Decision: 末段合法 且 前缀可行 ? -->
  <polygon points="280,218 390,265 280,312 170,265" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#333">末段 ∈ {①②③}</text>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#666">且 dp[i−2] 或 dp[i−3] 可行?</text>

  <!-- Yes(命中) down -> dp[i]=true -->
  <path d="M 280 312 L 280 330" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="326" font-size="11" fill="#82b366">是(命中)</text>
  <rect x="210" y="330" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#333">dp[i] = true</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#555">(命中合法子段)</text>

  <!-- No(落空) right -> dp[i]=false -->
  <path d="M 390 265 L 430 265" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="258" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="430" y="245" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="485" y="262" text-anchor="middle" font-size="11" fill="#333">dp[i] = false</text>
  <text x="485" y="277" text-anchor="middle" font-size="10" fill="#555">(三类皆落空)</text>

  <!-- converge to i++ -->
  <path d="M 280 372 L 280 405" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 485 285 L 485 405 L 350 405" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="405" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="12" fill="#333">i = i + 1</text>

  <!-- loop back dashed -->
  <path d="M 210 420 L 40 420 L 40 150 L 190 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="40" y="285" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 40 285)">i++ 继续循环</text>

  <!-- summary note -->
  <text x="280" y="458" text-anchor="middle" font-size="11" fill="#888">三类合法子段：①[a,a] ②[b,b,b] ③[c,c+1,c+2]；只回看 dp[i−2]/dp[i−3]，不回看 dp[i−1]</text>
</svg>
