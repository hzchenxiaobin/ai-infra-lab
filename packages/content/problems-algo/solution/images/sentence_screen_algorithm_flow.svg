<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：循环串贪心——每行前进 cols 并对齐词界</text>

  <!-- Start -->
  <rect x="170" y="44" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333">开始：sentence, rows, cols</text>
  <path d="M 270 72 L 270 90" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="100" y="92" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="110" text-anchor="middle" font-size="12" fill="#333">s = " ".join(sentence) + " "</text>
  <text x="270" y="126" text-anchor="middle" font-size="12" fill="#333">m = len(s) ;  cur = 0</text>
  <path d="M 270 132 L 270 158" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop frame ===== -->
  <text x="270" y="174" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">重复 rows 次</text>
  <rect x="40" y="182" width="460" height="258" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>

  <!-- cur += cols -->
  <rect x="150" y="194" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cur += cols</text>
  <path d="M 270 228 L 270 246" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <path d="M 270 248 L 380 286 L 270 324 L 160 286 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#333">s[cur % m]</text>
  <text x="270" y="298" text-anchor="middle" font-size="11" fill="#333">是空格 ?</text>

  <!-- 是 → right: cur += 1 -->
  <path d="M 380 286 L 430 286 L 430 328" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="388" y="280" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="370" y="330" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="348" text-anchor="middle" font-size="10" fill="#333">恰好落在词界</text>
  <text x="430" y="364" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur += 1</text>

  <!-- 否 → left: while backtrack -->
  <path d="M 160 286 L 110 286 L 110 328" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="118" y="280" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="50" y="330" width="120" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="348" text-anchor="middle" font-size="10" fill="#333">落在词中</text>
  <text x="110" y="362" text-anchor="middle" font-size="9" fill="#333">while s[(cur−1)%m]</text>
  <text x="110" y="376" text-anchor="middle" font-size="9" fill="#333">≠ ' ' : cur −= 1</text>

  <!-- merge: both branches down to (270, 410) -->
  <path d="M 430 374 L 430 410 L 270 410" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 110 388 L 110 410 L 270 410" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- back-edge: from (270,410) right to (515,410) up to (515,211) left into cur+=cols -->
  <path d="M 270 410 L 515 410 L 515 211 L 390 211" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="318" font-size="10" fill="#446688">下一行</text>

  <!-- exit loop: from (270,410) down out of frame -->
  <path d="M 270 410 L 270 458" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="438" font-size="10" fill="#888">循环结束</text>

  <!-- Return -->
  <rect x="170" y="472" width="200" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="493" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">return cur // m</text>
</svg>
