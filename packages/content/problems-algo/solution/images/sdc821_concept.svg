<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：每个位置到最近 c 的距离 = min(左侧最近 c, 右侧最近 c)</text>

  <!-- index labels -->
  <text x="56" y="62" font-size="10" fill="#888">下标</text>
  <rect x="84" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="102" y="63" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="124" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="63" text-anchor="middle" font-size="10" fill="#888">1</text>
  <rect x="164" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="182" y="63" text-anchor="middle" font-size="10" fill="#888">2</text>
  <rect x="204" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="222" y="63" text-anchor="middle" font-size="10" fill="#888">3</text>
  <rect x="244" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="262" y="63" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="284" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="302" y="63" text-anchor="middle" font-size="10" fill="#888">5</text>
  <rect x="324" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="342" y="63" text-anchor="middle" font-size="10" fill="#888">6</text>
  <rect x="364" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="382" y="63" text-anchor="middle" font-size="10" fill="#888">7</text>
  <rect x="404" y="48" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="422" y="63" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">8</text>
  <rect x="444" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="462" y="63" text-anchor="middle" font-size="10" fill="#888">9</text>
  <rect x="484" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="502" y="63" text-anchor="middle" font-size="10" fill="#888">10</text>
  <rect x="524" y="48" width="36" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="542" y="63" text-anchor="middle" font-size="10" fill="#888">11</text>

  <!-- char cells -->
  <text x="56" y="104" font-size="11" fill="#888">字符</text>
  <rect x="84" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="108" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="124" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="108" text-anchor="middle" font-size="13" fill="#333">o</text>
  <rect x="164" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="108" text-anchor="middle" font-size="13" fill="#333">v</text>
  <rect x="204" y="88" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">e</text>
  <rect x="244" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="108" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="284" y="88" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">e</text>
  <rect x="324" y="88" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">e</text>
  <rect x="364" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="108" text-anchor="middle" font-size="13" fill="#333">t</text>
  <rect x="404" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="444" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="462" y="108" text-anchor="middle" font-size="13" fill="#333">o</text>
  <rect x="484" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="502" y="108" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="524" y="88" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="542" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">e</text>

  <text x="568" y="104" font-size="10" fill="#888">c='e'</text>

  <!-- sample position i=8 -->
  <text x="40" y="158" font-size="12" fill="#444" font-weight="bold">以 i=8（字符 c）为例：</text>

  <!-- left arrow to e at index 6 -->
  <path d="M 404 168 L 360 168" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="396" y="162" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">左侧最近 e (下标6)</text>
  <rect x="338" y="178" width="84" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="195" text-anchor="middle" font-size="12" fill="#333">距离 = 8−6 = 2</text>

  <!-- right arrow to e at index 11 -->
  <path d="M 440 168 L 524 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="448" y="162" font-size="11" fill="#b85450" font-weight="bold">右侧最近 e (下标11)</text>
  <rect x="448" y="178" width="92" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="494" y="195" text-anchor="middle" font-size="12" fill="#333">距离 = 11−8 = 3</text>

  <!-- min result -->
  <rect x="248" y="214" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="328" y="234" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans[8] = min(2,3) = 2</text>

  <!-- two-pass idea -->
  <rect x="40" y="266" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">两次遍历法</text>
  <text x="300" y="302" text-anchor="middle" font-size="11" fill="#444">正向(左→右)维护「左侧最近 c 位置」算 i−last ；反向(右→left)维护「右侧最近 c 位置」算 last−i</text>

  <text x="40" y="334" font-size="11" fill="#888">关键：单向遍历只能看到一个方向的最近 c，</text>
  <text x="40" y="352" font-size="11" fill="#4a7a3a" font-weight="bold">→ 正反各扫一遍，每个位置取两次结果的较小值，即可覆盖两侧。</text>
</svg>
