<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 552"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="552" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">流程：两遍扫描建 pref/suff，再枚举替换位收割三个候选</text>

  <!-- 开始 -->
  <rect x="100" y="36" width="320" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">两遍扫描建表：pref[i]（以 i 结尾游程）· suff[i]（以 i 起始游程）</text>

  <path d="M 260 68 L 260 80" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 基准 -->
  <rect x="140" y="86" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans ← max(pref)（不替换的基准）</text>

  <path d="M 260 116 L 260 126" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i 初始化 -->
  <rect x="150" y="132" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="151" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i ← 0（枚举每个替换位）</text>

  <path d="M 260 162 L 260 172" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：i < n ? -->
  <polygon points="260,176 185,214 260,252 335,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <text x="352" y="206" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 335 214 L 390 214" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="395" y="198" width="105" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="447" y="218" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 ans</text>

  <text x="272" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 252 L 260 264" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 取段 + 单拼 -->
  <rect x="85" y="266" width="350" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">left ← pref[i−1]，right ← suff[i+1]（越界记 0）</text>
  <text x="260" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans ← max(ans, left+1, right+1)（单拼候选）</text>

  <path d="M 260 314 L 260 326" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2：能否双拼 -->
  <polygon points="260,330 160,380 260,430 360,380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">left &gt; 0 且 right &gt; 0</text>
  <text x="260" y="391" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">且 nums[i−1] ≤ nums[i+1] ?</text>
  <text x="260" y="409" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">⚠ 条件与被替换的 nums[i] 无关</text>

  <text x="272" y="440" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 430 L 260 442" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 双拼候选 -->
  <rect x="140" y="444" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="466" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans ← max(ans, left+1+right)（双拼）</text>

  <!-- 否：绕过双拼框 -->
  <text x="140" y="372" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 160 380 L 90 380 L 90 492" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 双拼框汇合到 i++ -->
  <path d="M 260 480 L 260 510 L 136 510" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="48" y="494" width="84" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="514" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i ← i + 1</text>

  <!-- 回到判定 1 -->
  <path d="M 48 510 L 24 510 L 24 214 L 181 214" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
