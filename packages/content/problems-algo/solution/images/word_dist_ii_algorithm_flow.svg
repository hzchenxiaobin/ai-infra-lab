<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：构造阶段 + 查询阶段</text>

  <!-- ===== Phase 1: Construction ===== -->
  <rect x="30" y="44" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="64" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">阶段一：构造 WordDistance</text>

  <!-- init -->
  <rect x="50" y="86" width="180" height="34" fill="#fff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="140" y="107" text-anchor="middle" font-size="11.5" fill="#333">pos = {}（空哈希表）</text>
  <line x1="140" y1="120" x2="140" y2="134" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>

  <!-- loop decision -->
  <polygon points="140,138 240,172 140,206 40,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="168" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="140" y="184" text-anchor="middle" font-size="10" fill="#555">遍历 wordsDict</text>

  <!-- no -> done -->
  <line x1="240" y1="172" x2="280" y2="172" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="250" y="166" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="282" y="158" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="318" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">完成</text>

  <!-- yes -> append -->
  <line x1="140" y1="206" x2="140" y2="220" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="148" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="222" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="242" text-anchor="middle" font-size="11" fill="#333">w = wordsDict[i]</text>
  <text x="140" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pos[w].append(i)</text>

  <!-- loop back -->
  <path d="M 40 244 Q 20 244 20 172 L 40 172" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arrD)"/>
  <text x="14" y="210" font-size="9" fill="#888" transform="rotate(-90 14 210)">i++</text>

  <!-- ===== Phase 2: Query ===== -->
  <rect x="310" y="44" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="64" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">阶段二：查询 shortest</text>

  <!-- get lists -->
  <rect x="330" y="86" width="180" height="44" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="104" text-anchor="middle" font-size="11" fill="#333">pos1 = pos[word1]</text>
  <text x="420" y="120" text-anchor="middle" font-size="11" fill="#333">pos2 = pos[word2]</text>
  <line x1="420" y1="130" x2="420" y2="144" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>

  <!-- init i j ans -->
  <rect x="330" y="146" width="180" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="167" text-anchor="middle" font-size="11.5" fill="#333">i=0, j=0, ans=∞</text>
  <line x1="420" y1="180" x2="420" y2="194" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>

  <!-- while decision -->
  <polygon points="420,198 520,234 420,270 320,234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="228" text-anchor="middle" font-size="10.5" fill="#333">i&lt;len(p1)</text>
  <text x="420" y="244" text-anchor="middle" font-size="10.5" fill="#333">且 j&lt;len(p2)?</text>

  <!-- no -> return -->
  <line x1="520" y1="234" x2="544" y2="234" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="530" y="228" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="278" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="510" y="299" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>
  <path d="M 544 234 Q 560 234 560 278 Q 560 295 510 295" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arrD)"/>

  <!-- yes -> update ans -->
  <line x1="420" y1="270" x2="420" y2="284" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="428" y="280" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="330" y="286" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="307" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = min(ans, |p1[i]−p2[j]|)</text>
  <line x1="420" y1="320" x2="420" y2="334" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>

  <!-- decision: p1[i] < p2[j]? -->
  <polygon points="420,338 520,370 420,402 320,370" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="374" text-anchor="middle" font-size="11" fill="#333">p1[i] &lt; p2[j] ?</text>

  <!-- yes -> i++ -->
  <line x1="320" y1="370" x2="280" y2="370" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="288" y="364" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="180" y="356" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="228" y="376" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">i++</text>

  <!-- no -> j++ -->
  <line x1="520" y1="370" x2="560" y2="370" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="528" y="364" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="396" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="478" y="416" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">j++</text>
  <path d="M 560 370 Q 560 411 526 411" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arrD)"/>

  <!-- loop back arrows to while -->
  <path d="M 228 386 Q 228 234 320 234" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arrD)" stroke-dasharray="4,3"/>
  <path d="M 478 426 Q 478 234 520 234" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arrD)" stroke-dasharray="4,3"/>
  <text x="200" y="312" font-size="9.5" fill="#888">回循环</text>

  <!-- separator -->
  <line x1="280" y1="44" x2="280" y2="440" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- footer complexity -->
  <rect x="40" y="460" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="478" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">构造 O(n) 时间 / O(n) 空间　|　查询 O(k₁+k₂) 时间 / O(1) 额外空间</text>
  <text x="280" y="496" text-anchor="middle" font-size="10.5" fill="#888">q 次查询总：O(n + q·(k₁+k₂))，远优于暴力 O(q·n)</text>
</svg>
