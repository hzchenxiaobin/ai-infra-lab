<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：枚举开放集合，Floyd 中间点只走开放点</text>

  <!-- left: original graph -->
  <text x="140" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">原图 roads（示例 1）</text>

  <path d="M 92 108 L 188 108" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="100" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 196 122 L 152 196" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="185" y="166" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">10</text>
  <path d="M 84 122 L 128 196" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="96" y="166" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">10</text>

  <ellipse cx="75" cy="112" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="117" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <ellipse cx="205" cy="112" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="205" y="117" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <ellipse cx="140" cy="214" rx="21" ry="19" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="219" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 127 201 L 153 227 M 153 201 L 127 227" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <text x="140" y="262" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mask = 011₂：开放 {0,1}，关闭 {2}</text>

  <path d="M 250 150 L 296 150" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="273" y="140" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">受限 Floyd</text>

  <!-- right: distance matrix -->
  <text x="396" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">受限 Floyd 后的距离矩阵 d</text>

  <rect x="304" y="62" width="32" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i＼j</text>
  <rect x="340" y="62" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="358" y="78" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="380" y="62" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="398" y="78" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="420" y="62" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="438" y="78" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="304" y="86" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="304" y="118" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="137" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="304" y="150" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="169" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="340" y="86" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="358" y="105" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="380" y="86" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="105" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="420" y="86" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="438" y="105" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">—</text>

  <rect x="340" y="118" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="137" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="380" y="118" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="398" y="137" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="420" y="118" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="438" y="137" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">—</text>

  <rect x="340" y="150" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="358" y="169" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">—</text>
  <rect x="380" y="150" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="398" y="169" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">—</text>
  <rect x="420" y="150" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="438" y="169" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">—</text>

  <rect x="306" y="200" width="176" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="394" y="221" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d(0,1) = 2 ≤ 5 ✓</text>
  <text x="394" y="241" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">该关闭方案可行，计数 +1</text>

  <!-- bottom note -->
  <rect x="48" y="272" width="424" height="108" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⚠️ 关闭分部 i ⇔ 距离矩阵第 i 行/列作废 + Floyd 中间点 k 跳过 i</text>
  <text x="260" y="319" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· 不必真的重建子图：非开放点对的 d 初值为 ∞，天然屏蔽被删的点与边</text>
  <text x="260" y="341" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· 删点后可能不连通：不可达点对 d = ∞ &gt; maxDistance，连通检查被距离检查一并覆盖</text>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· roads 存在重边：预处理 g[u][v] ← min(g[u][v], w)，只有最短的那条会进入最短路</text>
</svg>
