<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [1,5,4,2,9,9,9], k = 3</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">窗口每次右移一格，维护 freq 表与 sum；键数 = k 才更新 ans</text>

  <!-- Table header -->
  <text x="34" y="64" font-size="10.5" fill="#666" font-weight="bold">步</text>
  <text x="76" y="64" font-size="10.5" fill="#666" font-weight="bold">窗口元素</text>
  <text x="200" y="64" font-size="10.5" fill="#666" font-weight="bold">freq 表</text>
  <text x="330" y="64" font-size="10.5" fill="#666" font-weight="bold">键数=k?</text>
  <text x="420" y="64" font-size="10.5" fill="#666" font-weight="bold">sum</text>
  <text x="486" y="64" font-size="10.5" fill="#666" font-weight="bold">ans</text>
  <path d="M 26 70 L 534 70" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: [1,5,4] valid -->
  <rect x="26" y="76" width="508" height="30" fill="#f0faf3" stroke="#9cc89c" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="34" y="95" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="76" y="80" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="95" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="106" y="80" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="95" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="136" y="80" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="95" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="200" y="95" font-size="10.5" fill="#333">{1:1, 5:1, 4:1}</text>
  <text x="348" y="95" font-size="11" fill="#4a7a3a" font-weight="bold">3 ✓</text>
  <text x="432" y="95" font-size="11" fill="#333">10</text>
  <text x="498" y="95" font-size="11" fill="#333" font-weight="bold">10</text>

  <!-- Row 1: [5,4,2] valid -->
  <rect x="26" y="108" width="508" height="30" fill="#f0faf3" stroke="#9cc89c" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="34" y="127" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="76" y="112" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="127" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="106" y="112" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="127" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="136" y="112" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="127" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="200" y="127" font-size="10.5" fill="#333">{5:1, 4:1, 2:1}</text>
  <text x="348" y="127" font-size="11" fill="#4a7a3a" font-weight="bold">3 ✓</text>
  <text x="432" y="127" font-size="11" fill="#333">11</text>
  <text x="498" y="127" font-size="11" fill="#333" font-weight="bold">11</text>

  <!-- Row 2: [4,2,9] valid -->
  <rect x="26" y="140" width="508" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="34" y="159" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="76" y="144" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="159" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="106" y="144" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="159" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="136" y="144" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="159" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <text x="200" y="159" font-size="10.5" fill="#333">{4:1, 2:1, 9:1}</text>
  <text x="348" y="159" font-size="11" fill="#4a7a3a" font-weight="bold">3 ✓</text>
  <text x="432" y="159" font-size="11" fill="#333" font-weight="bold">15</text>
  <text x="498" y="159" font-size="11" fill="#333" font-weight="bold">15</text>

  <!-- Row 3: [2,9,9] invalid -->
  <rect x="26" y="172" width="508" height="30" fill="#fce4ec" stroke="#d99894" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="34" y="191" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="76" y="176" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="191" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="106" y="176" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="191" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="136" y="176" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="191" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <text x="200" y="191" font-size="10.5" fill="#333">{2:1, 9:2}</text>
  <text x="354" y="191" font-size="11" fill="#b85450" font-weight="bold">2 ✗</text>
  <text x="432" y="191" font-size="11" fill="#888">20</text>
  <text x="498" y="191" font-size="11" fill="#888">15</text>

  <!-- Row 4: [9,9,9] invalid -->
  <rect x="26" y="204" width="508" height="30" fill="#fce4ec" stroke="#d99894" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="34" y="223" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="76" y="208" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="223" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="106" y="208" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="223" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="136" y="208" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="223" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <text x="200" y="223" font-size="10.5" fill="#333">{9:3}</text>
  <text x="354" y="223" font-size="11" fill="#b85450" font-weight="bold">1 ✗</text>
  <text x="432" y="223" font-size="11" fill="#888">27</text>
  <text x="498" y="223" font-size="11" fill="#888">15</text>

  <!-- divider -->
  <path d="M 26 246 L 534 246" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="120" y="260" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="285" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">最终：ans = 15（来自窗口 [4,2,9]）</text>

  <!-- Bottom note -->
  <rect x="40" y="314" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">要点：sum 随窗口移动一直累加维护，但只有「键数 = k」时才用它更新 ans</text>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#555">无效窗口的 sum 仍要正确维护（左出右进），只是不参与 ans 更新</text>
</svg>
