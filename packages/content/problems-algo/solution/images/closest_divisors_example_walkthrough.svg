<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：num = 999</text>

  <rect x="30" y="42" width="250" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num+1 = 1000，⌊√1000⌋ = 31</text>
  <text x="155" y="75" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w 从 31 向下递减找因子</text>

  <rect x="300" y="42" width="250" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num+2 = 1001，⌊√1001⌋ = 31</text>
  <text x="425" y="75" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1001 = 7 × 11 × 13</text>

  <rect x="40" y="92" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">w</text>
  <rect x="110" y="92" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1000 % w</text>
  <rect x="190" y="92" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">命中?</text>

  <text x="75" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">31</text>
  <text x="150" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="220" y="128" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="75" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">30</text>
  <text x="150" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="220" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="75" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">29</text>
  <text x="150" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>
  <text x="220" y="164" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="150" y="182" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">⋮</text>

  <rect x="36" y="188" width="228" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">25</text>
  <text x="150" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="220" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="30" y="222" width="250" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[25, 40]，1000 = 25 × 40</text>
  <text x="155" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">d₁ = |25 − 40| = 15 ★</text>

  <rect x="310" y="92" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">w</text>
  <rect x="380" y="92" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1001 % w</text>
  <rect x="460" y="92" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">命中?</text>

  <text x="345" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">31</text>
  <text x="420" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="490" y="128" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="345" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">28</text>
  <text x="420" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">21</text>
  <text x="490" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="345" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">22</text>
  <text x="420" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>
  <text x="490" y="164" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="420" y="182" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">⋮ 递减中（1001 因子稀疏）</text>

  <rect x="306" y="188" width="236" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13</text>
  <text x="420" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="490" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="300" y="222" width="250" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[13, 77]，1001 = 13 × 77</text>
  <text x="425" y="260" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">d₂ = |13 − 77| = 64</text>

  <path d="M155,272 L155,300 L290,300" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M425,272 L425,300 L290,300" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="306" width="340" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="328" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">比较两候选：d₁ = 15 &lt; d₂ = 64</text>
  <text x="290" y="348" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回差距更小者 → [25, 40] ✓</text>

  <rect x="60" y="384" width="460" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="406" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">观察：1000 = 2³×5³ 因子稠密，√1000≈31 附近很快命中 25</text>
  <text x="290" y="426" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1001 = 7×11×13 仅 8 个因子、⌊√1001⌋=31 以下最大因子仅 13</text>
  <text x="290" y="444" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">→「因子稠密度」决定单数搜索步数；两数取更优自然落到 num+1</text>
</svg>
