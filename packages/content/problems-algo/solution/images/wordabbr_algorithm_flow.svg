<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L5,9 L9,1 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- 两列标题 -->
  <text x="150" y="32" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">构造 ValidWordAbbr(dictionary)</text>
  <text x="470" y="32" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">查询 isUnique(word)</text>

  <!-- 分隔虚线 -->
  <line x1="310" y1="50" x2="310" y2="360" stroke="#ccc" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- ===== 左列：构造 ===== -->
  <rect x="60" y="56" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">对每个 w ∈ dictionary</text>

  <line x1="150" y1="96" x2="150" y2="118" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="60" y="120" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a = abbr(w)　O(L)</text>

  <line x1="150" y1="160" x2="150" y2="182" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="60" y="184" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">mp[a].add(w)　（去重）</text>

  <!-- 回到循环顶部的弧线 -->
  <path d="M 60 203 Q 30 150 60 75" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrR)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="26" y="160" font-size="10" fill="#666" filter="url(#rough2)">下</text>
  <text x="26" y="174" font-size="10" fill="#666" filter="url(#rough2)">个</text>

  <line x1="150" y1="224" x2="150" y2="246" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="50" y="248" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">abbr_map 就绪</text>

  <text x="150" y="312" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">时间 O(N·L)　空间 O(N·L)</text>

  <!-- ===== 右列：查询 ===== -->
  <rect x="380" y="56" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 word</text>

  <line x1="470" y1="96" x2="470" y2="118" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="380" y="120" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a = abbr(word)</text>

  <line x1="470" y1="160" x2="470" y2="182" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="380" y="184" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s = mp.get(a, ∅)</text>

  <line x1="470" y1="224" x2="470" y2="246" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 菱形判定 -->
  <polygon points="470,250 560,290 470,330 380,290" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="287" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s 中有</text>
  <text x="470" y="301" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">≠ word 的词?</text>

  <!-- 是 -> false -->
  <line x1="560" y1="290" x2="595" y2="290" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="566" y="284" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="540" y="300" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="575" y="320" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">false</text>

  <!-- 否 -> true -->
  <line x1="470" y1="330" x2="470" y2="352" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="478" y="346" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="430" y="354" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">true</text>
</svg>
