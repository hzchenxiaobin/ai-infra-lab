<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：奇偶判定一步出结果</text>

  <!-- Step 1: Input -->
  <ellipse cx="270" cy="62" rx="130" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 coordinates，如 "a1"</text>

  <!-- arrow -->
  <path d="M 270 84 L 270 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Extract col & row chars -->
  <rect x="110" y="106" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">col = coordinates[0]  (字母 a-h)</text>
  <text x="270" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">row = coordinates[1]  (数字 1-8)</text>

  <!-- arrow -->
  <path d="M 270 146 L 270 164" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Compute parity -->
  <rect x="80" y="168" width="380" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">parity = (col + row) % 2</text>
  <text x="270" y="206" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">列号 a=1..h=8，行号 1..8</text>
  <text x="270" y="220" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">技巧：直接用 ASCII 码相加，奇偶性等价</text>

  <!-- arrow -->
  <path d="M 270 224 L 270 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: parity == 1? -->
  <polygon points="270,246 380,294 270,342 160,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(col + row) 为奇?</text>
  <text x="270" y="308" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">parity == 1 ?</text>

  <!-- Yes branch -> white -> true -->
  <path d="M 160 294 L 96 294" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="14" y="274" width="82" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="55" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">白色</text>
  <text x="55" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- No branch -> black -> false -->
  <path d="M 380 294 L 444 294" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="286" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="446" y="274" width="82" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="487" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">黑色</text>
  <text x="487" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- ASCII shortcut explanation -->
  <path d="M 40 360 L 500 360" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="60" y="372" width="420" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ASCII 技巧：'a'=97(奇), 'b'=98(偶), ... 与列号奇偶一致</text>
  <text x="270" y="408" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">'1'=49(奇), '2'=50(偶), ... 与行号奇偶一致</text>
  <text x="270" y="424" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">故 (coordinates[0] + coordinates[1]) % 2 直出结果</text>
</svg>
