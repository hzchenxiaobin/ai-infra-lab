<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：Promise + setTimeout</text>

  <!-- step 1: call -->
  <rect x="180" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">调用 sleep(millis)</text>

  <path d="M 280 86 L 280 102" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: new Promise -->
  <rect x="150" y="104" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">构造 new Promise(executor)</text>

  <path d="M 280 150 L 280 166" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: executor runs sync -->
  <rect x="120" y="168" width="320" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">executor 同步执行（此刻）</text>

  <path d="M 280 214 L 280 230" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: setTimeout -->
  <rect x="100" y="232" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="259" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">setTimeout(resolve, millis) 注册定时器</text>

  <path d="M 280 278 L 280 294" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- step 5: return pending promise -->
  <rect x="140" y="296" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="321" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">立即返回 Promise（pending 状态）</text>

  <path d="M 280 338 L 280 354" stroke="#888" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- wait box -->
  <rect x="160" y="356" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">事件循环等待 millis 毫秒…</text>

  <path d="M 280 398 L 280 414" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- step 6: timer fires -->
  <rect x="110" y="416" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="443" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">定时器到期 → 回调入队 → 执行 resolve()</text>

  <path d="M 280 462 L 280 478" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 7: fulfilled -->
  <rect x="150" y="480" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="507" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Promise → fulfilled，.then 执行</text>

  <!-- side note -->
  <rect x="430" y="232" width="120" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">非阻塞</text>
  <text x="490" y="272" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">注册即返回</text>
  <text x="490" y="286" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">不卡主线程</text>
  <path d="M 460 254 L 360 254" stroke="#b85450" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
</svg>
