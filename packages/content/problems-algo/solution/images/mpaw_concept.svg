<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：前缀最大收益 —— 难度高 ≠ 收益高</text>

  <!-- ===== Jobs section ===== -->
  <text x="36" y="58" font-size="12" fill="#888">工作（按难度排序）:</text>

  <!-- Job 1: diff=2, profit=30 -->
  <rect x="110" y="68" width="90" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="86" text-anchor="middle" font-size="11" fill="#666">难度</text>
  <text x="155" y="104" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="155" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">收益: 30</text>

  <!-- Job 2: diff=4, profit=10 (counter-intuitive!) -->
  <rect x="220" y="68" width="90" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="86" text-anchor="middle" font-size="11" fill="#666">难度</text>
  <text x="265" y="104" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <text x="265" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">收益: 10 ↓</text>

  <!-- Job 3: diff=6, profit=20 -->
  <rect x="330" y="68" width="90" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="86" text-anchor="middle" font-size="11" fill="#666">难度</text>
  <text x="375" y="104" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  <text x="375" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">收益: 20</text>

  <!-- Warning note -->
  <text x="448" y="92" font-size="11" fill="#b85450" font-weight="bold">⚠️ 难度 ↑</text>
  <text x="448" y="110" font-size="11" fill="#b85450" font-weight="bold">收益反而 ↓</text>

  <!-- ===== Arrow down ===== -->
  <path d="M 280 136 L 280 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="150" font-size="11" fill="#888">前缀最大</text>

  <!-- ===== Prefix max section ===== -->
  <text x="36" y="176" font-size="12" fill="#888">前缀最大收益:</text>

  <rect x="110" y="164" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="186" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">30</text>

  <rect x="220" y="164" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="186" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">30</text>

  <rect x="330" y="164" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="186" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">30</text>

  <text x="448" y="186" font-size="11" fill="#4a7a3a">= max(0..i)</text>

  <!-- ===== Arrow down ===== -->
  <path d="M 375 202 L 375 228" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Worker matching section ===== -->
  <text x="36" y="252" font-size="12" fill="#888">工人 (能力=6):</text>

  <rect x="110" y="240" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="263" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">能力 = 6</text>

  <!-- Correct answer -->
  <rect x="330" y="236" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="260" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">30 ✓</text>

  <!-- Arrow from worker to correct answer -->
  <path d="M 200 258 L 326 256" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="263" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a">取最大收益</text>

  <!-- Wrong answer (crossed out) -->
  <rect x="450" y="236" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="493" y="260" text-anchor="middle" font-size="13" fill="#b85450">20 ✗</text>
  <text x="493" y="286" text-anchor="middle" font-size="10" fill="#b85450">(最接近难度的)</text>

  <!-- ===== Summary note ===== -->
  <rect x="50" y="318" width="460" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#444">工人能力 w → 取所有 diff ≤ w 的工作中收益最大的</text>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#444">而非「最接近 w 难度」的工作收益</text>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">排序 + 前缀最大 → 双指针 O(1) / 二分 O(log n) 查询</text>
</svg>
