<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：以 r 结尾的子数组按位与 = 位掩码单调递减链</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">arr = [9, 12, 3, 7, 15]，取 r = 4，枚举 l 从 4 → 0</text>

  <!-- ===== 顶部数组 ===== -->
  <g font-size="12">
    <text x="60" y="78" font-size="10" fill="#888">arr:</text>
    <rect x="90"  y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="112" y="82" text-anchor="middle" fill="#333">9</text>
    <rect x="138" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="160" y="82" text-anchor="middle" fill="#333">12</text>
    <rect x="186" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="208" y="82" text-anchor="middle" fill="#333">3</text>
    <rect x="234" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="256" y="82" text-anchor="middle" fill="#333">7</text>
    <rect x="282" y="62" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="304" y="82" text-anchor="middle" fill="#d6a040" font-weight="bold">15</text>
    <text x="304" y="54" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">r=4</text>
  </g>

  <!-- ===== 子数组与按位与链 ===== -->
  <text x="60" y="124" font-size="11" fill="#666" font-weight="bold">l ↓ (左端向 0 扩展)</text>

  <!-- Row l=4: [4,4] = 15 = 1111 -->
  <g font-size="12">
    <text x="60" y="150" fill="#333">[4,4]</text>
    <rect x="110" y="136" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="130" y="154" text-anchor="middle" fill="#333" font-weight="bold">15</text>
    <text x="170" y="154" font-size="11" fill="#888">=</text>
    <!-- 4-bit pattern 1111 -->
    <g>
      <rect x="190" y="138" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
      <text x="201" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
      <rect x="214" y="138" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
      <text x="225" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
      <rect x="238" y="138" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
      <text x="249" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
      <rect x="262" y="138" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
      <text x="273" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
    </g>
    <text x="300" y="154" font-size="10" fill="#888">arr[r] 本身</text>
  </g>

  <!-- Row l=3: [3,4] = 7 = 0111 -->
  <g font-size="12">
    <text x="60" y="184" fill="#333">[3,4]</text>
    <rect x="110" y="170" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="188" text-anchor="middle" fill="#333" font-weight="bold">7</text>
    <text x="170" y="188" font-size="11" fill="#888">=</text>
    <rect x="190" y="172" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="201" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <rect x="214" y="172" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="225" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="238" y="172" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="249" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="262" y="172" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="273" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="300" y="188" font-size="10" fill="#b85450">清掉 bit3</text>
  </g>

  <!-- Row l=2: [2,4] = 3 = 0011 -->
  <g font-size="12">
    <text x="60" y="218" fill="#333">[2,4]</text>
    <rect x="110" y="204" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="222" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <text x="170" y="222" font-size="11" fill="#888">=</text>
    <rect x="190" y="206" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="201" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <rect x="214" y="206" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="225" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <rect x="238" y="206" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="249" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="262" y="206" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="273" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="300" y="222" font-size="10" fill="#b85450">清掉 bit2</text>
  </g>

  <!-- Row l=1: [1,4] = 0 = 0000 -->
  <g font-size="12">
    <text x="60" y="252" fill="#333">[1,4]</text>
    <rect x="110" y="238" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="256" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <text x="170" y="256" font-size="11" fill="#888">=</text>
    <rect x="190" y="240" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="201" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <rect x="214" y="240" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="225" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <rect x="238" y="240" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="249" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <rect x="262" y="240" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="273" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <text x="300" y="256" font-size="10" fill="#b85450">清掉 bit0,1</text>
  </g>

  <!-- Row l=0: [0,4] = 0 = 0000 (collision) -->
  <g font-size="12">
    <text x="60" y="286" fill="#888">[0,4]</text>
    <rect x="110" y="272" width="40" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
    <text x="130" y="290" text-anchor="middle" fill="#888">0</text>
    <text x="170" y="290" font-size="11" fill="#888">=</text>
    <text x="210" y="290" font-size="10" fill="#888" font-style="italic">与上一行相同（碰撞去重）</text>
  </g>

  <!-- 链箭头：15 -> 7 -> 3 -> 0 -->
  <path d="M 130 166 L 130 170" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 130 200 L 130 204" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 130 234 L 130 238" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== 结论框 ===== -->
  <rect x="40" y="312" width="480" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">位掩码单调递减链：每扩展一次只清位、绝不置位</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#333">值变化 ⟹ 至少清掉 1 个 1 位；arr[r] ≤ 2^20 至多 20 个 1 位</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#333">⟹ 以 r 结尾的子数组按位与至多 20+1 个不同值</text>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">把 O(n) 个候选压缩成 O(log V) ≈ 20 个 → 总复杂度 O(n log V)</text>
</svg>
