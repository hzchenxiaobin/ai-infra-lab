<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">拆分循环链表 · 算法流程</text>

  <!-- step 1 -->
  <rect x="120" y="40" width="280" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 特判：head == ∅ → 返回 [∅, ∅]</text>
  <path d="M260,80 L260,96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="100" y="100" width="320" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 计数 n：从 head 起 while p.next != head 转</text>
  <path d="M260,140 L260,156" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 highlight -->
  <rect x="80" y="160" width="360" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ firstSize = ⌈n/2⌉，secondSize = n − firstSize</text>
  <path d="M260,200 L260,216" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="70" y="220" width="380" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ first ← head，走 firstSize−1 步；second = first.next</text>
  <path d="M260,260 L260,276" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="90" y="280" width="340" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ last ← second，走 secondSize−1 步</text>
  <path d="M260,320 L260,336" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 6 highlight -->
  <rect x="80" y="340" width="360" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑥ first.next = head（第一半成环）</text>
  <path d="M260,380 L260,396" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 7 highlight -->
  <rect x="80" y="400" width="360" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="422" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑦ last.next = second（第二半成环）</text>
  <path d="M260,440 L260,456" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="140" y="460" width="240" height="1" fill="none"/>
  <text x="260" y="456" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⑧ 返回 [head, second]</text>
</svg>
