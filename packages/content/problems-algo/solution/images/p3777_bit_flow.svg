<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：BIT 维护 eq —— 单点改 + 区间和</text>

  <!-- 预处理 -->
  <rect x="150" y="42" width="260" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">预处理：eq[i] = (s[i] == s[i−1])，i = 1..n−1</text>
  <text x="280" y="78" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">逐点插入建 BIT（下标 1..n−1）</text>

  <path d="M 280 86 L 280 108" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 取查询 -->
  <rect x="185" y="110" width="190" height="36" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个查询 query</text>

  <path d="M 280 146 L 280 170" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判类型 -->
  <polygon points="280,172 356,208 280,244 204,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">query[0] = ?</text>

  <!-- 左分支：翻转 -->
  <path d="M 204 208 L 122 208 L 122 262" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="150" y="200" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">1：翻转</text>

  <rect x="30" y="264" width="186" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="123" y="284" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s[j] 翻转（A↔B）</text>
  <text x="123" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">只有 eq[j]、eq[j+1] 可能变</text>

  <path d="M 123 316 L 123 340" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="30" y="342" width="186" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="123" y="361" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">对 idx ∈ {j, j+1}∩[1, n−1]：</text>
  <text x="123" y="378" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">重算 new，BIT.add(idx, new−eq[idx])</text>
  <text x="123" y="393" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">并同步 eq[idx] = new（至多 2 次单点更新）</text>

  <!-- 右分支：查询 -->
  <path d="M 356 208 L 438 208 L 438 262" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="200" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2：询问</text>

  <rect x="344" y="264" width="188" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="438" y="284" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[2, l, r]：</text>
  <text x="438" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = pre(r) − pre(l)</text>

  <path d="M 438 316 L 438 356" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="344" y="358" width="188" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="438" y="377" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">= Σ eq[l+1..r] 入答案数组</text>
  <text x="438" y="394" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">l == r 时作差恰为 0，免特判</text>

  <!-- 汇合循环箭头 -->
  <path d="M 123 394 C 60 410, 40 300, 44 190 C 47 140, 110 122, 180 126" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="76" y="230" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">处理完全部 q 个查询</text>

  <!-- 底部复杂度 -->
  <rect x="228" y="300" width="100" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="322" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">翻转 O(log n)</text>
  <text x="278" y="340" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">询问 O(log n)</text>
  <text x="278" y="355" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">总计 O((n+q)log n)</text>
</svg>
