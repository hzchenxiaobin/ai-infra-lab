<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针贪心流程（箱子降序 + 两端向内）</text>

  <!-- Step 1: sort boxes descending -->
  <rect x="130" y="42" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333">排序 boxes（降序：大箱优先）</text>

  <!-- arrow down -->
  <path d="M 270 72 L 270 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Start node -->
  <ellipse cx="270" cy="112" rx="140" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="12" fill="#333">初始化: left=0, right=n−1, count=0</text>

  <!-- arrow down -->
  <path d="M 270 132 L 270 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: left <= right && boxIdx < n? -->
  <polygon points="270,152 390,198 270,234 150,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="194" text-anchor="middle" font-size="12" fill="#333">left ≤ right 且</text>
  <text x="270" y="210" text-anchor="middle" font-size="12" fill="#333">还有箱子？</text>

  <!-- No branch -> end -->
  <path d="M 390 198 L 452 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="190" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="198" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="202" text-anchor="middle" font-size="12" fill="#333">返回 count</text>

  <!-- Yes branch down -->
  <path d="M 270 234 L 270 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="248" font-size="11" fill="#82b366">是</text>

  <!-- Decision: wh[left] >= wh[right]? -->
  <polygon points="270,254 390,300 270,326 150,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="11" fill="#333">wh[left]</text>
  <text x="270" y="310" text-anchor="middle" font-size="11" fill="#333">≥ wh[right] ?</text>

  <!-- Yes (left higher) -> try left -->
  <path d="M 150 300 L 90 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="292" text-anchor="middle" font-size="11" fill="#82b366">是</text>

  <!-- No (right higher) -> try right -->
  <path d="M 390 300 L 440 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="292" text-anchor="middle" font-size="11" fill="#82b366">否</text>

  <!-- Left branch: box <= wh[left]? -->
  <polygon points="52,314 100,334 52,354 4,334" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="338" text-anchor="middle" font-size="9" fill="#333">box≤wh[L]?</text>

  <!-- Left yes -> place -->
  <path d="M 52 354 L 52 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="368" font-size="9" fill="#82b366">是</text>
  <rect x="14" y="374" width="76" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="390" text-anchor="middle" font-size="10" fill="#333">count++</text>
  <text x="52" y="404" text-anchor="middle" font-size="10" fill="#555">left++</text>

  <!-- Left no -> skip -->
  <path d="M 4 334 L 4 384" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="10" y="360" font-size="8" fill="#b85450">否→跳</text>

  <!-- Right branch: box <= wh[right]? -->
  <polygon points="478,314 526,334 478,354 430,334" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="478" y="338" text-anchor="middle" font-size="9" fill="#333">box≤wh[R]?</text>

  <!-- Right yes -> place -->
  <path d="M 478 354 L 478 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="368" font-size="9" fill="#82b366">是</text>
  <rect x="440" y="374" width="76" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="478" y="390" text-anchor="middle" font-size="10" fill="#333">count++</text>
  <text x="478" y="404" text-anchor="middle" font-size="10" fill="#555">right−−</text>

  <!-- Right no -> skip -->
  <path d="M 526 334 L 526 384" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="520" y="360" text-anchor="end" font-size="8" fill="#b85450">跳→否</text>

  <!-- loop back arrows -->
  <path d="M 52 374 L 52 198 L 150 198" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 478 374 L 478 198 L 390 198" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Center annotation -->
  <rect x="200" y="370" width="140" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="10" fill="#b85450">两端都放不下？</text>
  <text x="270" y="394" text-anchor="middle" font-size="10" fill="#b85450">→ 该箱跳过</text>

  <!-- Side labels -->
  <text x="52" y="424" text-anchor="middle" font-size="9" fill="#446688">从左端放入</text>
  <text x="478" y="424" text-anchor="middle" font-size="9" fill="#b85450">从右端放入</text>
</svg>
