<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：二分 money + 带跳数上限的 BFS 检查</text>

  <!-- 预处理 -->
  <g filter="url(#rough2)">
    <rect x="105" y="36" width="350" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="56" text-anchor="middle" font-size="12" fill="#33506b">预处理：边权去重排序 W = [w₁ &lt; w₂ &lt; …]</text>
    <text x="280" y="74" text-anchor="middle" font-size="10" fill="#33506b">答案必 ∈ W；邻接表整体只建一次，check 时按阈值过滤</text>
  </g>
  <path d="M 280 86 L 280 102" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 二分初始化 -->
  <g filter="url(#rough2)">
    <rect x="95" y="106" width="370" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="133" text-anchor="middle" font-size="12.5" fill="#33506b">二分初始化：lo ← 0，hi ← |W|−1，ans ← −1</text>
  </g>
  <path d="M 280 150 L 280 166" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取 mid + check -->
  <g filter="url(#rough2)">
    <rect x="85" y="170" width="390" height="58" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="280" y="189" text-anchor="middle" font-size="11.5" fill="#8a6d1a">取 mid = (lo+hi)/2，money ← W[mid]</text>
    <text x="280" y="206" text-anchor="middle" font-size="11" fill="#8a6d1a">check(money)：只走 w ≤ money 的边，从 0 开始 BFS</text>
    <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#8a6d1a">dist[v] = 最少跳数；dist[u] = k 的点不再扩展</text>
  </g>
  <path d="M 280 228 L 280 246" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：可达？ -->
  <g filter="url(#rough2)">
    <polygon points="280,250 375,296 280,342 185,296" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="301" text-anchor="middle" font-size="12.5" fill="#33506b">dist[n−1] ≤ k ?</text>
  </g>

  <text x="172" y="286" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 185 296 L 164 296" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="30" y="272" width="128" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="94" y="290" text-anchor="middle" font-size="11" fill="#b85450">不可行</text>
    <text x="94" y="306" text-anchor="middle" font-size="11" fill="#b85450">lo ← mid + 1</text>
    <text x="94" y="319" text-anchor="middle" font-size="9.5" fill="#b85450">（钱不够，往大试）</text>
  </g>

  <text x="384" y="286" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 375 296 L 408 296" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="412" y="272" width="120" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="472" y="290" text-anchor="middle" font-size="11" fill="#2f5d24">可行</text>
    <text x="472" y="306" text-anchor="middle" font-size="11" fill="#2f5d24">ans ← money</text>
    <text x="472" y="319" text-anchor="middle" font-size="9.5" fill="#2f5d24">hi ← mid − 1</text>
  </g>

  <!-- 两分支汇合 -->
  <path d="M 94 324 L 94 396 L 472 396" stroke="#7a8aa0" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 472 324 L 472 396" stroke="#7a8aa0" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 396 L 280 406" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2：lo ≤ hi ? -->
  <g filter="url(#rough2)">
    <polygon points="280,412 355,442 280,472 205,442" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="447" text-anchor="middle" font-size="12" fill="#33506b">lo ≤ hi ?</text>
  </g>

  <!-- 是 → 回到取 mid -->
  <text x="402" y="432" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是 · 下一轮二分</text>
  <path d="M 355 442 L 546 442 L 546 199 L 481 199" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 返回 -->
  <text x="296" y="490" font-size="11" fill="#b85450" filter="url(#rough2)">否 · 结束</text>
  <path d="M 280 472 L 280 492" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="150" y="496" width="260" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="516" text-anchor="middle" font-size="12.5" fill="#2f5d24">返回 ans（最小可行 money）</text>
    <text x="280" y="534" text-anchor="middle" font-size="10" fill="#2f5d24">ans = −1：k 跳内无法从 0 到达 n−1</text>
  </g>
</svg>
