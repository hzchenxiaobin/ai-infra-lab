<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：words = ["lc","cl","gg","gg","aa"]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">cnt = {lc:1, cl:1, gg:2, aa:1} · 三类情况一次集齐</text>

  <!-- Table outer frame -->
  <rect x="20" y="54" width="480" height="160" fill="none" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column dividers -->
  <line x1="55" y1="54" x2="55" y2="214" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="105" y1="54" x2="105" y2="214" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="54" x2="150" y2="214" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="54" x2="215" y2="214" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="415" y1="54" x2="415" y2="214" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header row divider -->
  <line x1="20" y1="80" x2="500" y2="80" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Header background -->
  <rect x="21" y="55" width="478" height="24" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="37" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤</text>
  <text x="80" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">w</text>
  <text x="127" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">cnt</text>
  <text x="182" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">类型</text>
  <text x="315" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">操作</text>
  <text x="457" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">ans</text>

  <!-- Row height 32px, rows from y=81 to y=213 -->

  <!-- Row 1: cl (mirror pair, active) -->
  <rect x="21" y="81" width="478" height="32" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="20" y1="113" x2="500" y2="113" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="37" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="80" y="102" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">cl</text>
  <text x="127" y="102" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="182" y="102" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">镜像</text>
  <text x="315" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a">cl&lt;lc · min(1,1)=1 → +4</text>
  <text x="457" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Row 2: gg (self-pal pair) -->
  <rect x="21" y="113" width="478" height="32" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <line x1="20" y1="145" x2="500" y2="145" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="37" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="80" y="134" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">gg</text>
  <text x="127" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="182" y="134" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">自回文</text>
  <text x="315" y="134" text-anchor="middle" font-size="10" fill="#d6a040">2//2=1 对 → +4; 偶 → central 不变</text>
  <text x="457" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">8</text>

  <!-- Row 3: aa (center, odd leftover) -->
  <rect x="21" y="145" width="478" height="32" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <line x1="20" y1="177" x2="500" y2="177" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="37" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="80" y="166" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">aa</text>
  <text x="127" y="166" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="182" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">自回文</text>
  <text x="315" y="166" text-anchor="middle" font-size="10" fill="#b85450">1//2=0 对; 奇 → central=1</text>
  <text x="457" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8</text>

  <!-- Note: skipped words -->
  <rect x="21" y="177" width="478" height="20" fill="#f5f5f5" stroke="none" filter="url(#rough2)"/>
  <text x="260" y="191" text-anchor="middle" font-size="9.5" fill="#888">lc: lc&gt;cl 已配对跳过 ·（镜像支用 w&lt;rev 去重，每对只计一次）</text>

  <!-- Return row -->
  <rect x="21" y="197" width="478" height="17" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="37" y="209" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回</text>
  <text x="315" y="209" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans + central×2 = 8 + 2</text>
  <text x="457" y="209" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- ===== Constructed palindrome box ===== -->
  <rect x="40" y="232" width="440" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">构造回文串（长度 10）</text>

  <!-- word blocks: lc + gg + aa + gg + cl -->
  <rect x="70" y="262" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="281" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">lc</text>

  <rect x="118" y="262" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="281" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">gg</text>

  <rect x="166" y="259" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="281" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">aa</text>

  <rect x="218" y="262" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="281" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">gg</text>

  <rect x="266" y="262" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="281" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cl</text>

  <path d="M316 276 L336 276" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="346" y="262" width="120" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="281" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">lcggaaggcl</text>

  <text x="260" y="308" text-anchor="middle" font-size="10" fill="#555">镜像对 (lc,cl) 分置两端 · 自回文对 (gg,gg) 分居两侧 · aa 占中心</text>

  <!-- Footer -->
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#aaa">central 至多 1：多个奇数自回文词只能选一个放中心</text>
  <text x="260" y="354" text-anchor="middle" font-size="10" fill="#aaa">w&lt;rev 去重：镜像对只计一次，避免 ans 翻倍</text>
</svg>
