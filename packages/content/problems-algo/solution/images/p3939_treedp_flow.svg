<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：按编号倒序合并的迭代树形 DP</text>

  <!-- 左上注释框 -->
  <rect x="22" y="42" width="120" height="78" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="82" y="60" text-anchor="middle" font-size="10" font-weight="bold" fill="#444" filter="url(#rough2)">为何免递归？</text>
  <text x="82" y="76" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">parent[i] ＜ i</text>
  <text x="82" y="92" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⇒ 编号倒序遍历</text>
  <text x="82" y="108" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">＝ 自底向上合并</text>

  <!-- 初始化 -->
  <rect x="150" y="42" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始化（每个 u）：</text>
  <text x="260" y="76" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp0[u][0]＝1，dp1[u][nums[u]%k]＝1</text>
  <path d="M260,86 L260,96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 主循环 -->
  <rect x="172" y="98" width="176" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">for v ＝ n−1 … 1：u ＝ parent[v]</text>
  <path d="M260,130 L260,140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 余数卷积合并 -->
  <rect x="122" y="142" width="276" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">余数卷积合并孩子 v（r₁, r₂ 双重循环）：</text>
  <text x="260" y="177" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">n0[(r₁+r₂)%k] += dp0[u][r₁]·(dp0[v][r₂]+dp1[v][r₂])</text>
  <text x="260" y="192" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">n1[(r₁+r₂)%k] += dp1[u][r₁]·dp0[v][r₂]</text>
  <text x="260" y="207" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp0[u], dp1[u] ← n0, n1（替换旧值）</text>
  <text x="260" y="221" text-anchor="middle" font-size="9" fill="#556" filter="url(#rough2)">u 选 ⇒ 孩子只配 dp0；u 不选 ⇒ 全配</text>

  <!-- 回环：下一个 v -->
  <path d="M398,184 L455,184" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M455,184 L455,114 L352,114" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="177" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">下一个 v</text>

  <!-- 循环结束出口 -->
  <path d="M260,226 L260,240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="237" text-anchor="start" font-size="9" fill="#b85450" filter="url(#rough2)">v 用尽</text>

  <!-- 答案 -->
  <rect x="150" y="242" width="220" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">ans ＝ dp0[0][0] ＋ dp1[0][0] − 1</text>
  <text x="260" y="279" text-anchor="middle" font-size="9" fill="#556" filter="url(#rough2)">（mod 10⁹＋7；−1 扣掉空子集）</text>
  <path d="M260,288 L260,300" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 复杂度 -->
  <rect x="150" y="304" width="220" height="42" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">n−1 条父子边 × O(k²) 卷积</text>
  <text x="260" y="338" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">总时间 O(n·k²) ≈ 10⁷，空间 O(n·k)</text>

  <!-- 右侧：正确性注记 -->
  <rect x="398" y="242" width="102" height="104" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="449" y="260" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444" filter="url(#rough2)">两个易错点</text>
  <text x="449" y="277" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">① 忘减空集</text>
  <text x="449" y="293" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">② dp1[u] 误乘</text>
  <text x="449" y="306" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">　 (dp0[v]+dp1[v])</text>
  <text x="449" y="323" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">③ 减 1 前先加</text>
  <text x="449" y="336" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">　 MOD 防负数</text>
</svg>
