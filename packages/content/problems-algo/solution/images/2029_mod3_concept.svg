<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：只看 s mod 3，mod-0 石子是「跳板」</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">总和能否被 3 整除只取决于各石子价值 mod 3</text>

  <!-- stones row -->
  <text x="28" y="74" font-size="11" fill="#666" font-weight="bold">原始石子</text>
  <g filter="url(#rough2)">
    <rect x="80" y="58" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="97" y="78" text-anchor="middle" font-size="11" fill="#333">5</text>
    <rect x="118" y="58" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="135" y="78" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="156" y="58" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="173" y="78" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="194" y="58" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="211" y="78" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="232" y="58" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="249" y="78" text-anchor="middle" font-size="11" fill="#333">3</text>
  </g>
  <text x="285" y="78" font-size="11" fill="#888">…</text>

  <!-- arrows down to three piles -->
  <path d="M 97 90 L 97 108" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 173 90 L 173 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 249 90 L 249 108" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- three piles -->
  <text x="28" y="130" font-size="11" fill="#666" font-weight="bold">按 mod 3 分堆</text>

  <!-- pile r=0 (pass) -->
  <rect x="60" y="116" width="120" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="134" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">余 0 ：c₀ 个</text>
  <text x="120" y="150" text-anchor="middle" font-size="10" fill="#555">价值 = 3,6,9…</text>
  <text x="120" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">「跳板 / 跳过」</text>

  <!-- pile r=1 -->
  <rect x="210" y="116" width="120" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">余 1 ：c₁ 个</text>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="#555">价值 = 1,4,7…</text>
  <text x="270" y="164" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">主战石子</text>

  <!-- pile r=2 -->
  <rect x="360" y="116" width="120" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="134" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">余 2 ：c₂ 个</text>
  <text x="420" y="150" text-anchor="middle" font-size="10" fill="#555">价值 = 2,5,8…</text>
  <text x="420" y="164" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">主战石子</text>

  <!-- arrow down to state machine -->
  <path d="M 270 176 L 270 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sum-mod state machine -->
  <text x="28" y="216" font-size="11" fill="#666" font-weight="bold">累加和 mod 3 的转移</text>

  <!-- state 1 -->
  <ellipse cx="150" cy="250" rx="40" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="255" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mod = 1</text>
  <text x="150" y="290" text-anchor="middle" font-size="9.5" fill="#446688">安全出牌：余1 或 余0</text>

  <!-- state 2 -->
  <ellipse cx="390" cy="250" rx="40" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="255" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mod = 2</text>
  <text x="390" y="290" text-anchor="middle" font-size="9.5" fill="#a87020">安全出牌：余2 或 余0</text>

  <!-- state 0 (lose) -->
  <ellipse cx="270" cy="338" rx="38" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="343" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">mod = 0</text>
  <text x="270" y="362" text-anchor="middle" font-size="9.5" fill="#b85450">出此牌者输</text>

  <!-- transitions: 1 --play 1--> 2 ; 2 --play 2--> 1 ; playing the "wrong" remainder -> 0 (lose) -->
  <path d="M 188 244 Q 270 230 352 244" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="226" text-anchor="middle" font-size="10" fill="#446688">出 余1</text>

  <path d="M 352 262 Q 270 276 188 262" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="10" fill="#a87020">出 余2</text>

  <!-- wrong moves to 0 -->
  <path d="M 168 274 L 248 322" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="312" font-size="9.5" fill="#b85450">出 余2→0</text>

  <path d="M 372 274 L 292 322" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="312" font-size="9.5" fill="#b85450">出 余1→0</text>

  <!-- pass note -->
  <rect x="60" y="318" width="130" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="125" y="336" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">出 余0（跳板）</text>
  <text x="125" y="350" text-anchor="middle" font-size="9.5" fill="#555">mod 不变，只换人</text>
  <text x="125" y="360" text-anchor="middle" font-size="9.5" fill="#555">→ 翻转回合归属</text>
</svg>
