<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐对累加的完整轨迹</text>

  <!-- panel 1: hello -->
  <text x="60" y="50" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：s = "hello" → 13</text>

  <rect x="60" y="60" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">相邻对</text>
  <rect x="150" y="60" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ASCII 相减</text>
  <rect x="270" y="60" width="75" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="307" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">|差|</text>
  <rect x="345" y="60" width="115" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="402" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans 累加</text>

  <rect x="60" y="84" width="90" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="103" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(h, e)</text>
  <rect x="150" y="84" width="120" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="103" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">104 − 101</text>
  <rect x="270" y="84" width="75" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="103" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="345" y="84" width="115" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="402" y="103" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0 → 3</text>

  <rect x="60" y="112" width="90" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="131" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(e, l)</text>
  <rect x="150" y="112" width="120" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="131" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">101 − 108</text>
  <rect x="270" y="112" width="75" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="131" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="345" y="112" width="115" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="402" y="131" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3 → 10</text>

  <rect x="60" y="140" width="90" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="159" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(l, l)</text>
  <rect x="150" y="140" width="120" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="159" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">108 − 108</text>
  <rect x="270" y="140" width="75" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="307" y="159" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="345" y="140" width="115" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="402" y="159" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10 → 10</text>

  <rect x="60" y="168" width="90" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="187" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(l, o)</text>
  <rect x="150" y="168" width="120" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="187" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">108 − 111</text>
  <rect x="270" y="168" width="75" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="187" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="345" y="168" width="115" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="402" y="187" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10 → 13 ✓</text>

  <text x="60" y="212" font-size="10.5" fill="#b85450" filter="url(#rough2)">两个 l 相同 → 贡献 0，ans 原地踏步（3 → 10 → 10 → 13）</text>

  <!-- panel 2: zaz -->
  <text x="60" y="238" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：s = "zaz" → 50</text>

  <rect x="60" y="248" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="265" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">相邻对</text>
  <rect x="150" y="248" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="265" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ASCII 相减</text>
  <rect x="270" y="248" width="75" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="307" y="265" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">|差|</text>
  <rect x="345" y="248" width="115" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="402" y="265" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans 累加</text>

  <rect x="60" y="272" width="90" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(z, a)</text>
  <rect x="150" y="272" width="120" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">122 − 97</text>
  <rect x="270" y="272" width="75" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="291" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">25</text>
  <rect x="345" y="272" width="115" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="402" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0 → 25</text>

  <rect x="60" y="300" width="90" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="319" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(a, z)</text>
  <rect x="150" y="300" width="120" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="319" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">97 − 122</text>
  <rect x="270" y="300" width="75" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="319" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">25</text>
  <rect x="345" y="300" width="115" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="402" y="319" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">25 → 50 ✓</text>

  <text x="60" y="344" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">"zaz" 先降 25 再升 25 —— 绝对值与方向无关，两对全额计费</text>

  <rect x="48" y="356" width="424" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="379" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">结论：hello → 3+7+0+3 = 13；zaz → 25+25 = 50</text>
</svg>
