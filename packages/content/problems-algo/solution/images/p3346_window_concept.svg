<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：能变成 x 的元素 ⇔ 原值落在 [x−k, x+k] 内</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">一次操作 = 挑一个没动过的下标 i，给 nums[i] 加上 [−k, k] 内的任意整数（含 0）</text>

  <!-- ================= 情形 A ================= -->
  <text x="20" y="64" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">情形 A：目标 x 就取数组里的值（nums = [1,4,5]，k = 1，取 x = 4）</text>

  <text x="252" y="76" font-size="10" fill="#4a7a3a" filter="url(#rough2)">值域 [x−k, x+k] = [3, 5]</text>
  <rect x="250" y="80" width="156" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <rect x="116" y="84" width="36" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="108" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>

  <rect x="308" y="84" width="36" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="108" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="372" y="84" width="36" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="390" y="108" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">5</text>

  <text x="134" y="140" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">够不着</text>
  <text x="326" y="140" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">就是 x：白赚</text>
  <text x="390" y="140" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">+(−1)→4 花 1 次</text>

  <rect x="60" y="152" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">freq(4) = cnt + min(numOps, reach − cnt) = 1 + min(2, 1) = 2 ✓</text>

  <!-- ================= 情形 B ================= -->
  <text x="20" y="204" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">情形 B：目标 x 不在数组里（nums = [1,5]，k = 2，取 x = 3）</text>

  <text x="262" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">值域 [1, 5]，宽恰为 2k —— 全员都得改</text>
  <rect x="116" y="220" width="292" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <rect x="116" y="224" width="36" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="134" y="248" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>

  <rect x="244" y="218" width="36" height="44" fill="#ffffff" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" rx="4" filter="url(#rough2)"/>
  <text x="262" y="245" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="372" y="224" width="36" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="390" y="248" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">5</text>

  <text x="134" y="284" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">+2 → 3，花 1 次</text>
  <text x="262" y="284" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">虚拟目标（数组里没有）</text>
  <text x="390" y="284" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">−2 → 3，花 1 次</text>

  <rect x="60" y="296" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">freq(3) = 0 + min(numOps, reach) = min(2, 2) = 2 ✓（操作次数全花光）</text>

  <!-- 陷阱提示 -->
  <rect x="20" y="338" width="480" height="64" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="357" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 为什么必须补情形 B？只枚举 x ∈ nums 是经典 WA：</text>
  <text x="34" y="373" font-size="10" fill="#333" filter="url(#rough2)">[1,5], k=2 时目标 1 和 5 的值域各只罩住自己（频率 1），虚拟目标 3 一口罩住两个（频率 2）。</text>
  <text x="34" y="389" font-size="10" fill="#333" filter="url(#rough2)">判据：排序后一段元素存在公共可达目标 ⇔ 区间内 max − min ≤ 2k，一次滑窗即可兜底。</text>
</svg>
