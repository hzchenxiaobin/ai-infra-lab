<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：逐层相邻求和 ⇒ 杨辉三角系数加权</text>

  <!-- 左侧：3902 折叠塔 -->
  <text x="120" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">「3902」折叠 n−2 = 2 步</text>

  <!-- 第 0 层 -->
  <rect x="30" y="62" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="66" y="62" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="102" y="62" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="138" y="62" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="45" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="81" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="117" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="153" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 63 96 L 63 104" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 99 96 L 99 104" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 135 96 L 135 104" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 1 层 -->
  <rect x="48" y="106" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="84" y="106" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="120" y="106" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="63" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="99" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="135" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 81 140 L 81 148" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 117 140 L 117 148" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 2 层（结果） -->
  <rect x="66" y="150" width="30" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="102" y="150" width="30" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="81" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="117" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每层：相邻两位 (a+b) mod 10</text>

  <!-- 右侧：两个最终数字的加权展开 -->
  <rect x="265" y="56" width="235" height="60" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">左数 = 1·3 + 2·9 + 1·0 = 21</text>
  <text x="382" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">21 ≡ 1 (mod 10)</text>

  <rect x="265" y="128" width="235" height="60" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">右数 = 1·9 + 2·0 + 1·2 = 11</text>
  <text x="382" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">11 ≡ 1 (mod 10)</text>

  <!-- 小杨辉三角：系数来源 -->
  <text x="382" y="206" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">系数 1 2 1 从哪来？杨辉三角第 m 行：</text>
  <ellipse cx="348" cy="228" rx="12" ry="12" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="348" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <ellipse cx="382" cy="228" rx="12" ry="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="382" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <ellipse cx="416" cy="228" rx="12" ry="12" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- 底部公式区 -->
  <rect x="30" y="250" width="460" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="269" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k 次操作后：s⁽ᵏ⁾ᵢ = Σⱼ C(k,j)·sᵢ₊ⱼ (mod 10)</text>
  <text x="260" y="287" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">归纳 + 帕斯卡恒等式 C(k,j) = C(k−1,j−1) + C(k−1,j)</text>

  <rect x="30" y="306" width="460" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">判相等 ⟺ D = Σⱼ C(m,j)·(sⱼ − sⱼ₊₁) ≡ 0 (mod 10)，m = n−2</text>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">剩下的事：算 C(m,j) mod 10 ⟶ 拆 mod 2 与 mod 5（Lucas）</text>
</svg>
