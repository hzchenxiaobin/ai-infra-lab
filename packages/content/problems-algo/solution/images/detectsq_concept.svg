<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">查询点 (pₓ, pᵧ) 为角 → 同列点定边长 d → 另外两角 O(1) 查</text>

  <!-- Axes -->
  <line x1="60" y1="370" x2="560" y2="370" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="60" y1="370" x2="60" y2="60" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="568" y="384" font-size="12" fill="#888">x</text>
  <text x="50" y="56" font-size="12" fill="#888">y</text>

  <!-- Square (query as bottom-left corner) -->
  <!-- corners: Q=(120,300) same-col P=(120,180) diag D=(260,180) horiz H=(260,300) -->
  <rect x="120" y="180" width="140" height="120" fill="#e8f0fe" fill-opacity="0.6" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>

  <!-- Query point Q (px, py) -->
  <circle cx="120" cy="300" r="7" fill="#b85450" stroke="#8a3a36" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="318" font-size="12" fill="#b85450" font-weight="bold">查询点 Q</text>
  <text x="92" y="334" font-size="11" fill="#b85450">(pₓ, pᵧ)</text>

  <!-- Same-column point P (px, y) -->
  <circle cx="120" cy="180" r="7" fill="#d6a040" stroke="#a87a26" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="176" font-size="12" fill="#d6a040" font-weight="bold">同列点 P</text>
  <text x="40" y="190" font-size="11" fill="#d6a040">(pₓ, y)</text>

  <!-- Horizontal edge end H (px+d, py) -->
  <circle cx="260" cy="300" r="7" fill="#4a7a3a" stroke="#2f5a22" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="318" font-size="12" fill="#4a7a3a" font-weight="bold">水平边端</text>
  <text x="268" y="334" font-size="11" fill="#4a7a3a">(pₓ+d, pᵧ)</text>

  <!-- Diagonal point D (px+d, y) -->
  <circle cx="260" cy="180" r="7" fill="#666" stroke="#444" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="176" font-size="12" fill="#555" font-weight="bold">对角点</text>
  <text x="268" y="190" font-size="11" fill="#555">(pₓ+d, y)</text>

  <!-- Edge length d annotations -->
  <line x1="120" y1="318" x2="260" y2="318" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="180" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">d = |y − pᵧ|</text>

  <line x1="108" y1="180" x2="108" y2="300" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="98" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" transform="rotate(-90 98 246)">d</text>

  <!-- vertical edge highlight -->
  <line x1="120" y1="300" x2="120" y2="180" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <text x="135" y="244" font-size="10" fill="#d6a040" font-weight="bold">垂直边</text>

  <!-- key insight box -->
  <rect x="340" y="80" width="260" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键观察</text>
  <text x="354" y="128" font-size="11" fill="#555">① 枚举同列点 (pₓ, y)，</text>
  <text x="354" y="146" font-size="11" fill="#555">   边长 d = |y − pᵧ| 立刻确定</text>
  <text x="354" y="170" font-size="11" fill="#555">② 另外两角坐标随之固定：</text>
  <text x="354" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">   朝右 (pₓ+d, pᵧ) & (pₓ+d, y)</text>
  <text x="354" y="206" font-size="11" fill="#4a7a3a" font-weight="bold">   朝左 (pₓ−d, pᵧ) & (pₓ−d, y)</text>
  <text x="354" y="230" font-size="11" fill="#555">③ 方案数 = 三角点数之积</text>
  <text x="354" y="248" font-size="11" fill="#b85450" font-weight="bold">   cnt·cnt·cnt 累加</text>
</svg>
