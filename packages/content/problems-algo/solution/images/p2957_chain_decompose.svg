<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">正确性视角：切成极长冲突链，答案 = Σ ⌊Lᵢ/2⌋</text>
  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">相邻 |差| ≤ 1 连入同一条链，|差| ≥ 2 处断开</text>

  <!-- "abddez" 切链 -->
  <rect x="90" y="58" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="142" y="58" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <rect x="194" y="58" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="246" y="58" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="298" y="58" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>

  <rect x="350" y="58" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">z</text>

  <path d="M 188 66 L 200 78 M 200 66 L 188 78" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="194" y="106" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">|b−d|=2 断</text>
  <path d="M 344 66 L 356 78 M 356 66 L 344 78" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="350" y="106" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">|e−z|=21 断</text>

  <!-- 链标注 -->
  <rect x="88" y="118" width="106" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="141" y="135" text-anchor="middle" font-size="11" fill="#33476b" filter="url(#rough2)">L=2 → ⌊2/2⌋=1</text>
  <rect x="192" y="118" width="158" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="271" y="135" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">L=3 → ⌊3/2⌋=1</text>
  <rect x="348" y="118" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="376" y="135" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">L=1 → 0</text>

  <!-- 合计 -->
  <rect x="150" y="158" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="179" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 1 + 1 + 0 = 2 ✓（示例 2）</text>

  <!-- 下界论证 -->
  <rect x="30" y="204" width="460" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">为什么 Σ⌊Lᵢ/2⌋ 是下界（贪心又恰好取到）？</text>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">链长 L ⟹ 链内 L−1 个相邻对全部冲突</text>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">一次修改至多同时化解 2 个相邻对（改中间字符）</text>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⟹ 每条链至少 ⌈(L−1)/2⌉ = ⌊L/2⌋ 次修改</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">贪心「每隔一个改一个」恰好达到下界 ⟹ 最优</text>
</svg>
