<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：计数 → 回连 → 筛冠军 → 排序，四步走完</text>

  <!-- ① 左上：分组计数 -->
  <rect x="16" y="44" width="236" height="146" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 分组计数 GROUP BY dep_id</text>

  <rect x="46" y="76" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="91" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">dep_id</text>
  <text x="166" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>

  <rect x="46" y="100" width="180" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="91" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100</text>
  <text x="166" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="46" y="124" width="180" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="91" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">101</text>
  <text x="166" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="46" y="148" width="180" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="91" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">107</text>
  <text x="166" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <line x1="136" y1="76" x2="136" y2="172" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="46" y="76" width="180" height="96" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="134" y="186" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">11 行员工 → 3 行部门</text>

  <!-- ② 右上：JOIN 回连 -->
  <rect x="272" y="44" width="236" height="146" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② JOIN 回连：经理各带部门 cnt</text>

  <rect x="302" y="78" width="180" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="392" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Joseph — 100（cnt 4）</text>

  <rect x="302" y="106" width="180" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="392" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Isabella — 101（cnt 4）</text>

  <rect x="302" y="134" width="180" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="150" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">Michael — 107（cnt 3）</text>

  <text x="390" y="184" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">连接条件带 position = 'Manager'</text>

  <!-- ③ 右下：等值筛选 -->
  <rect x="272" y="204" width="236" height="140" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="226" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">③ 等值筛选：cnt = MAX(cnt) = 4</text>

  <rect x="302" y="238" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="254" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Joseph　✓　4 = 4</text>

  <rect x="302" y="266" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="282" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Isabella　✓　4 = 4</text>

  <rect x="302" y="294" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="310" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">Michael　✗　3 &lt; 4　出局</text>

  <text x="390" y="336" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">等值条件让并列冠军全过</text>

  <!-- ④ 左下：排序输出 -->
  <rect x="16" y="204" width="236" height="140" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="226" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ ORDER BY dep_id 升序输出</text>

  <rect x="46" y="238" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="254" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">manager_name</text>
  <text x="196" y="254" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">dep_id</text>

  <rect x="46" y="262" width="180" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="96" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Joseph</text>
  <text x="196" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100</text>

  <rect x="46" y="286" width="180" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="96" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Isabella</text>
  <text x="196" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">101</text>

  <line x1="146" y1="238" x2="146" y2="310" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="46" y="238" width="180" height="72" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="134" y="330" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">并列冠军按 dep_id 升序</text>

  <!-- 顺时针箭头：① → ② → ③ → ④ -->
  <path d="M 254 118 L 268 118" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 390 192 L 390 202" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 270 276 L 256 276" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
</svg>
