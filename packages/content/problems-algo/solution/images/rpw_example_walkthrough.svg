<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：word="abcdefd", ch='d' → i=3</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">双指针 left/right 从前缀两端向中收缩，每步交换</text>

  <!-- ===== Step 0: initial state ===== -->
  <text x="40" y="84" font-size="12" fill="#666" font-weight="bold">初始</text>
  <text x="92" y="78" font-size="10" fill="#b85450">left=0↓</text>
  <text x="232" y="78" font-size="10" fill="#b85450">↓right=3</text>

  <rect x="92" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <rect x="132" y="88" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <rect x="172" y="88" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <rect x="212" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>

  <rect x="252" y="88" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="111" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">e</text>

  <rect x="292" y="88" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="111" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">f</text>

  <rect x="332" y="88" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="111" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">d</text>

  <text x="400" y="111" font-size="11" fill="#888">left=0 &lt; right=3 → 交换</text>

  <!-- arrow down -->
  <path d="M 232 130 L 232 152" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="146" font-size="10" fill="#b85450">swap(a,d)</text>

  <!-- ===== Step 1: after first swap ===== -->
  <text x="40" y="178" font-size="12" fill="#666" font-weight="bold">第1步</text>
  <text x="152" y="172" font-size="10" fill="#b85450">left=1↓</text>
  <text x="192" y="172" font-size="10" fill="#b85450">↓right=2</text>

  <rect x="92" y="182" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>

  <rect x="132" y="182" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <rect x="172" y="182" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <rect x="212" y="182" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <rect x="252" y="182" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="205" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">e</text>

  <rect x="292" y="182" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="205" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">f</text>

  <rect x="332" y="182" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="205" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">d</text>

  <text x="400" y="205" font-size="11" fill="#888">left=1 &lt; right=2 → 交换</text>

  <!-- arrow down -->
  <path d="M 172 224 L 172 246" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="240" font-size="10" fill="#b85450">swap(b,c)</text>

  <!-- ===== Step 2: after second swap, pointers cross ===== -->
  <text x="40" y="272" font-size="12" fill="#666" font-weight="bold">第2步</text>
  <text x="172" y="266" font-size="10" fill="#b85450">right=1, left=2</text>

  <rect x="92" y="276" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="299" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>

  <rect x="132" y="276" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="299" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <rect x="172" y="276" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="299" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <rect x="212" y="276" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="299" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <rect x="252" y="276" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="299" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">e</text>

  <rect x="292" y="276" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="299" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">f</text>

  <rect x="332" y="276" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="299" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">d</text>

  <text x="400" y="299" font-size="11" fill="#b85450" font-weight="bold">left=2 ≥ right=1 → 停止</text>

  <!-- arrow down -->
  <path d="M 232 318 L 232 340" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Final result ===== -->
  <text x="40" y="368" font-size="12" fill="#666" font-weight="bold">结果</text>
  <rect x="92" y="372" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="395" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d c b a e f d  →  "dcbaefd"</text>

  <!-- ===== Summary box ===== -->
  <rect x="40" y="420" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="441" text-anchor="middle" font-size="11" fill="#666">前缀长度 i+1=4，双指针各走 ⌈(i+1)/2⌉=2 步即收敛，后缀 "efd" 全程未动</text>
</svg>
