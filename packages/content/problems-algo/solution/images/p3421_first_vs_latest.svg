<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：分区排序后，每组只看首行与末行的 score</text>
  <text x="280" y="38" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">PARTITION BY student_id, subject　ORDER BY exam_date</text>

  <!-- ① 101 Math ✓ -->
  <rect x="14" y="50" width="532" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="28" y="71" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">101 · Math</text>
  <text x="28" y="88" font-size="8.5" fill="#777" filter="url(#rough2)">cnt = 2 场</text>
  <text x="124" y="69" text-anchor="end" font-size="7.5" fill="#446688" filter="url(#rough2)">first</text>
  <rect x="128" y="61" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">70</text>
  <path d="M 178 75 L 198 75" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="204" y="61" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="227" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">85</text>
  <text x="254" y="69" font-size="7.5" fill="#8a6d1f" filter="url(#rough2)">latest</text>
  <text x="310" y="80" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 85 &gt; 70，进步 → 输出</text>

  <!-- ② 101 Physics ✗ -->
  <rect x="14" y="108" width="532" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="28" y="129" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">101 · Physics</text>
  <text x="28" y="146" font-size="8.5" fill="#777" filter="url(#rough2)">cnt = 2 场</text>
  <text x="124" y="127" text-anchor="end" font-size="7.5" fill="#446688" filter="url(#rough2)">first</text>
  <rect x="128" y="119" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">65</text>
  <path d="M 178 133 L 198 133" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="204" y="119" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="227" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">60</text>
  <text x="254" y="127" font-size="7.5" fill="#8a6d1f" filter="url(#rough2)">latest</text>
  <text x="310" y="138" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 60 &lt; 65，退步 → 滤掉</text>

  <!-- ③ 102 Math ✓ -->
  <rect x="14" y="166" width="532" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="28" y="187" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">102 · Math</text>
  <text x="28" y="204" font-size="8.5" fill="#777" filter="url(#rough2)">cnt = 2 场</text>
  <text x="124" y="185" text-anchor="end" font-size="7.5" fill="#446688" filter="url(#rough2)">first</text>
  <rect x="128" y="177" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">80</text>
  <path d="M 178 191 L 198 191" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="204" y="177" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="227" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">85</text>
  <text x="254" y="185" font-size="7.5" fill="#8a6d1f" filter="url(#rough2)">latest</text>
  <text x="310" y="196" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 85 &gt; 80，进步 → 输出</text>

  <!-- ④ 103 Math ✗ 仅1场 -->
  <rect x="14" y="224" width="532" height="50" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="28" y="245" font-size="11.5" fill="#666" font-weight="bold" filter="url(#rough2)">103 · Math</text>
  <text x="28" y="262" font-size="8.5" fill="#999" filter="url(#rough2)">cnt = 1 场</text>
  <text x="124" y="243" text-anchor="end" font-size="7.5" fill="#446688" filter="url(#rough2)">first</text>
  <rect x="128" y="235" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">90</text>
  <path d="M 178 249 L 198 249" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <rect x="204" y="235" width="46" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="227" y="254" text-anchor="middle" font-size="12" fill="#777" font-weight="bold" filter="url(#rough2)">90</text>
  <text x="254" y="243" font-size="7.5" fill="#999" filter="url(#rough2)">latest＝首</text>
  <text x="310" y="254" font-size="10.5" fill="#777" font-weight="bold" filter="url(#rough2)">✗ 仅 1 场（首＝末）→ 不符资格</text>

  <!-- ⑤ 104 Physics ✓ -->
  <rect x="14" y="282" width="532" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="28" y="303" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">104 · Physics</text>
  <text x="28" y="320" font-size="8.5" fill="#777" filter="url(#rough2)">cnt = 2 场</text>
  <text x="124" y="301" text-anchor="end" font-size="7.5" fill="#446688" filter="url(#rough2)">first</text>
  <rect x="128" y="293" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">75</text>
  <path d="M 178 307 L 198 307" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="204" y="293" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="227" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">85</text>
  <text x="254" y="301" font-size="7.5" fill="#8a6d1f" filter="url(#rough2)">latest</text>
  <text x="310" y="312" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 85 &gt; 75，进步 → 输出</text>

  <!-- 底部注释 -->
  <rect x="14" y="346" width="532" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">一次窗口扫描配齐三样：COUNT(*) OVER → cnt　FIRST_VALUE(升序) → 首分　FIRST_VALUE(降序) → 末分</text>
  <text x="280" y="384" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">外层收口：WHERE rn = 1 AND cnt ≥ 2 AND latest_score &gt; first_score</text>
</svg>
