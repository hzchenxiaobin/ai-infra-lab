<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="370" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = “1001010”，k = 5（m = 3）</text>

  <!-- Table geometry: start x=30, cols: i(44) s[i](44) 动作(150) r(64) 2^r(64) val(60) kept(54) zeros(60) => total 540, end x=570 -->
  <!-- column x-edges: 30,74,118,268,332,396,456,510,570 -->
  <!-- header row y=40..62 -->
  <rect x="30" y="40" width="540" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52"  y="56" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i</text>
  <text x="96"  y="56" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">s[i]</text>
  <text x="193" y="56" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">动作</text>
  <text x="300" y="56" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">r=zr+kept</text>
  <text x="364" y="56" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">2^r</text>
  <text x="426" y="56" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">val</text>
  <text x="483" y="56" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">kept</text>
  <text x="540" y="56" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">zeros</text>

  <!-- vertical separators -->
  <g stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)">
    <line x1="74"  y1="40" x2="74"  y2="320"/>
    <line x1="118" y1="40" x2="118" y2="320"/>
    <line x1="268" y1="40" x2="268" y2="320"/>
    <line x1="332" y1="40" x2="332" y2="320"/>
    <line x1="396" y1="40" x2="396" y2="320"/>
    <line x1="456" y1="40" x2="456" y2="320"/>
    <line x1="510" y1="40" x2="510" y2="320"/>
  </g>
  <line x1="30" y1="64" x2="570" y2="64" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- row heights 32; rows start y=64, each 32 -> centers y=80,112,144,176,208,240,272; then result at 304 -->
  <!-- Row i=6 -->
  <rect x="30" y="64" width="540" height="32" fill="#ffffff" filter="url(#rough2)"/>
  <text x="52"  y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="96"  y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="193" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">留 ‘0’（免费）</text>
  <text x="300" y="84" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="364" y="84" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="426" y="84" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="483" y="84" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="540" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Row i=5 (keep the 1) -->
  <rect x="30" y="96" width="540" height="32" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="52"  y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="96"  y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="193" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">留 ‘1’（2 ≤ 5）</text>
  <text x="300" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="364" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="426" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="483" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="540" y="116" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- Row i=4 -->
  <rect x="30" y="128" width="540" height="32" fill="#ffffff" filter="url(#rough2)"/>
  <text x="52"  y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="96"  y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="193" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">留 ‘0’（免费）</text>
  <text x="300" y="148" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="364" y="148" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="426" y="148" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="483" y="148" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="540" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- Row i=3 (skip 1) -->
  <rect x="30" y="160" width="540" height="32" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="52"  y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="96"  y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="193" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">弃 ‘1’（10 &gt; 5）</text>
  <text x="300" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="364" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">8</text>
  <text x="426" y="180" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="483" y="180" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="540" y="180" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- Row i=2 -->
  <rect x="30" y="192" width="540" height="32" fill="#ffffff" filter="url(#rough2)"/>
  <text x="52"  y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="96"  y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="193" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">留 ‘0’（免费）</text>
  <text x="300" y="212" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="364" y="212" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="426" y="212" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="483" y="212" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="540" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- Row i=1 -->
  <rect x="30" y="224" width="540" height="32" fill="#ffffff" filter="url(#rough2)"/>
  <text x="52"  y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="96"  y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="193" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">留 ‘0’（免费）</text>
  <text x="300" y="244" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="364" y="244" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="426" y="244" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="483" y="244" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="540" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- Row i=0 (skip 1) -->
  <rect x="30" y="256" width="540" height="32" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="52"  y="276" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="96"  y="276" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="193" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">弃 ‘1’（34 &gt; 5）</text>
  <text x="300" y="276" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <text x="364" y="276" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">32</text>
  <text x="426" y="276" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="483" y="276" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="540" y="276" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- outer border -->
  <rect x="30" y="40" width="540" height="248" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="30" y1="288" x2="570" y2="288" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- Result row -->
  <rect x="30" y="296" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终：保留 4 个 ‘0’ + 1 个 ‘1’（位 1，权 2）</text>
  <text x="300" y="332" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = zeros(4) + kept(1) = 5  ←  子序列 “00010”₂ = 2 ≤ 5</text>

  <!-- bottom hint -->
  <text x="300" y="356" text-anchor="middle" font-size="10" fill="#888">从右到左：越靠左的 ‘1’ 位权 r 越大（2^r 越重），超预算即弃</text>
</svg>
