<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "abcdefg"，k = 2</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">2k = 4，i 从 0 按步长 4 推进，共 2 段</text>

  <!-- 表头 -->
  <rect x="30" y="62" width="60" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="82" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">步</text>
  <rect x="90" y="62" width="50" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="82" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i</text>
  <rect x="140" y="62" width="90" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185" y="82" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">本段字符</text>
  <rect x="230" y="62" width="90" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="82" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">情况</text>
  <rect x="320" y="62" width="160" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="82" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">操作</text>
  <rect x="480" y="62" width="90" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="525" y="82" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">结果</text>

  <!-- Row 1: 初始 -->
  <rect x="30" y="94" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="114" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="90" y="94" width="50" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="114" text-anchor="middle" font-size="11" fill="#555">—</text>
  <rect x="140" y="94" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="185" y="114" text-anchor="middle" font-size="11" fill="#555">abcdefg</text>
  <rect x="230" y="94" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="114" text-anchor="middle" font-size="10" fill="#888">初始</text>
  <rect x="320" y="94" width="160" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="114" text-anchor="middle" font-size="10" fill="#888">i = 0</text>
  <rect x="480" y="94" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="525" y="114" text-anchor="middle" font-size="10" fill="#888">abcdefg</text>

  <!-- Row 2: i=0 -->
  <rect x="30" y="126" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="90" y="126" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="115" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <rect x="140" y="126" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="185" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">abcd</text>
  <rect x="230" y="126" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="275" y="148" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① r ≥ 2k</text>
  <rect x="320" y="126" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="400" y="148" text-anchor="middle" font-size="10" fill="#446688">反转 [0,2) ab→ba</text>
  <rect x="480" y="126" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="525" y="148" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">bacdefg</text>

  <!-- Row 3: i=4 -->
  <rect x="30" y="162" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="184" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">2</text>
  <rect x="90" y="162" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="115" y="184" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">4</text>
  <rect x="140" y="162" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="185" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">efg</text>
  <rect x="230" y="162" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="275" y="184" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">② k≤r&lt;2k</text>
  <rect x="320" y="162" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="400" y="184" text-anchor="middle" font-size="10" fill="#8a6a20">反转 [4,6) ef→fe</text>
  <rect x="480" y="162" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="525" y="184" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">bacdfeg</text>

  <!-- Row 4: i=8 结束 -->
  <rect x="30" y="198" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="90" y="198" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="115" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8</text>
  <rect x="140" y="198" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="185" y="218" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="230" y="198" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="275" y="218" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i ≥ n 结束</text>
  <rect x="320" y="198" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#b85450">返回 s</text>
  <rect x="480" y="198" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="525" y="218" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">bacdfeg</text>

  <!-- 情况③补充说明 -->
  <rect x="30" y="252" width="540" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="42" y="272" font-size="11" fill="#8a6a20" font-weight="bold">补充：情况 ③（r &lt; k，剩余少于 k 个全部反转）</text>
  <text x="42" y="292" font-size="11" fill="#555">例 s = "abcde"，k = 6：i = 0，r = 5 &lt; k = 6，end = min(0+6, 5) = 5</text>
  <text x="42" y="308" font-size="11" fill="#555">反转 [0, 5) → "abcde" 变 "edcba"，i = 0 + 12 = 12 ≥ n，结束</text>
  <text x="42" y="328" font-size="11" fill="#888">关键：end = min(i+k, n) 自然把 ②③ 两种「段尾不足」合并为同一个反转调用</text>

  <!-- 核心结论 -->
  <rect x="30" y="352" width="540" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="374" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结论：外层按步长 2k 推进，内层 reverse(i, min(i+k, n))</text>
  <text x="300" y="394" text-anchor="middle" font-size="11" fill="#666">三种情况被 min(i+k, n) 与 i+=2k 优雅合并，无需分支判断</text>
</svg>
