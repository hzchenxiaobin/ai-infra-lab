<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <text x="330" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：rains = [1,2,0,0,2,1]</text>

  <!-- column x positions: 步骤40 i30 rains60 动作200 满90 堆160 ans70  start x=14 -->
  <!-- header -->
  <rect x="14" y="40" width="632" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="34" y="58" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步</text>
  <text x="74" y="58" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i</text>
  <text x="120" y="58" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">rains</text>
  <text x="230" y="58" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">动作</text>
  <text x="370" y="58" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">满集合</text>
  <text x="475" y="58" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">堆(下次日,湖)</text>
  <text x="600" y="58" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ans[i]</text>

  <!-- row 1: i=0 L1 -->
  <rect x="14" y="70" width="632" height="36" fill="#fafafa" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="34" y="92" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="74" y="92" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="120" y="92" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="230" y="92" text-anchor="middle" font-size="9" fill="#333">湖1降雨→入满</text>
  <text x="370" y="92" text-anchor="middle" font-size="10" fill="#333">{1}</text>
  <text x="475" y="92" text-anchor="middle" font-size="10" fill="#333">[(5,1)]</text>
  <text x="600" y="92" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1</text>

  <!-- row 2: i=1 L2 -->
  <rect x="14" y="108" width="632" height="36" fill="#fafafa" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="34" y="130" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="74" y="130" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="120" y="130" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="230" y="130" text-anchor="middle" font-size="9" fill="#333">湖2降雨→入满</text>
  <text x="370" y="130" text-anchor="middle" font-size="10" fill="#333">{1,2}</text>
  <text x="475" y="130" text-anchor="middle" font-size="10" fill="#333">[(4,2),(5,1)]</text>
  <text x="600" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1</text>

  <!-- row 3: i=2 dry -->
  <rect x="14" y="146" width="632" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="34" y="168" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="74" y="168" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="120" y="168" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="230" y="168" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">弹堆顶(4,2)→抽湖2</text>
  <text x="370" y="168" text-anchor="middle" font-size="10" fill="#333">{1}</text>
  <text x="475" y="168" text-anchor="middle" font-size="10" fill="#333">[(5,1)]</text>
  <text x="600" y="168" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>

  <!-- row 4: i=3 dry -->
  <rect x="14" y="184" width="632" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="34" y="206" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="74" y="206" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="120" y="206" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="230" y="206" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">弹堆顶(5,1)→抽湖1</text>
  <text x="370" y="206" text-anchor="middle" font-size="10" fill="#333">∅</text>
  <text x="475" y="206" text-anchor="middle" font-size="10" fill="#333">[]</text>
  <text x="600" y="206" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <!-- row 5: i=4 L2 -->
  <rect x="14" y="222" width="632" height="36" fill="#fafafa" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="34" y="244" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="74" y="244" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="120" y="244" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="230" y="244" text-anchor="middle" font-size="9" fill="#333">湖2未满→入满(无下次)</text>
  <text x="370" y="244" text-anchor="middle" font-size="10" fill="#333">{2}</text>
  <text x="475" y="244" text-anchor="middle" font-size="10" fill="#333">[]</text>
  <text x="600" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1</text>

  <!-- row 6: i=5 L1 -->
  <rect x="14" y="260" width="632" height="36" fill="#fafafa" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="34" y="282" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="74" y="282" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="120" y="282" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="230" y="282" text-anchor="middle" font-size="9" fill="#333">湖1未满→入满(无下次)</text>
  <text x="370" y="282" text-anchor="middle" font-size="10" fill="#333">{2,1}</text>
  <text x="475" y="282" text-anchor="middle" font-size="10" fill="#333">[]</text>
  <text x="600" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1</text>

  <!-- result -->
  <rect x="14" y="306" width="632" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="330" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = [−1, −1, 2, 1, −1, −1] ✓ 无洪水</text>
</svg>
