<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="330" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：按 (1 的个数, 数值) 复合键升序排序</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">popcount 不同 → 1 的个数小的在前；相同 → 数值小的在前</text>

  <!-- 原数组 label -->
  <text x="300" y="74" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">原数组 arr = [0, 1, 2, 3, 4, 5, 6, 7, 8]（颜色 = popcount 分组）</text>

  <!-- 顶部 9 个格子，原始顺序。cell width 52, gap 8, start x=34, centers 60,120,...,540 -->
  <!-- 0 gray -->
  <rect x="34" y="82" width="52" height="50" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="110" text-anchor="middle" font-size="18" fill="#666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="60" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0₂</text>
  <!-- 1 blue -->
  <rect x="94" y="82" width="52" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="110" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="120" y="126" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">1₂</text>
  <!-- 2 blue -->
  <rect x="154" y="82" width="52" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="110" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="180" y="126" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">10₂</text>
  <!-- 3 orange -->
  <rect x="214" y="82" width="52" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="110" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="240" y="126" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">11₂</text>
  <!-- 4 blue -->
  <rect x="274" y="82" width="52" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="110" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="300" y="126" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">100₂</text>
  <!-- 5 orange -->
  <rect x="334" y="82" width="52" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="110" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="360" y="126" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">101₂</text>
  <!-- 6 orange -->
  <rect x="394" y="82" width="52" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="110" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="420" y="126" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">110₂</text>
  <!-- 7 red -->
  <rect x="454" y="82" width="52" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="110" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="480" y="126" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">111₂</text>
  <!-- 8 blue -->
  <rect x="514" y="82" width="52" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="110" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="540" y="126" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">1000₂</text>

  <!-- 中间排序提示 -->
  <text x="300" y="158" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↓ 按 (1 的个数, 数值) 升序排序 ↓</text>

  <!-- 排序结果 label -->
  <text x="300" y="180" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">排序结果</text>

  <!-- 底部 9 个格子，排序后 [0,1,2,4,8,3,5,6,7] -->
  <!-- 0 gray -->
  <rect x="34" y="188" width="52" height="50" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="216" text-anchor="middle" font-size="18" fill="#666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="60" y="232" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0₂</text>
  <!-- 1 blue -->
  <rect x="94" y="188" width="52" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="216" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="120" y="232" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">1₂</text>
  <!-- 2 blue -->
  <rect x="154" y="188" width="52" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="216" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="180" y="232" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">10₂</text>
  <!-- 4 blue -->
  <rect x="214" y="188" width="52" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="216" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="240" y="232" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">100₂</text>
  <!-- 8 blue -->
  <rect x="274" y="188" width="52" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="216" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="300" y="232" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">1000₂</text>
  <!-- 3 orange -->
  <rect x="334" y="188" width="52" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="216" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="360" y="232" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">11₂</text>
  <!-- 5 orange -->
  <rect x="394" y="188" width="52" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="216" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="420" y="232" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">101₂</text>
  <!-- 6 orange -->
  <rect x="454" y="188" width="52" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="216" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="480" y="232" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">110₂</text>
  <!-- 7 red -->
  <rect x="514" y="188" width="52" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="216" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="540" y="232" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">111₂</text>

  <!-- 分组说明 -->
  <text x="300" y="262" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">分组说明（颜色 = 1 的个数）</text>

  <!-- 4 个 legend box: width 132, gap 12, start x=18 -->
  <rect x="18" y="270" width="132" height="42" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="84" y="287" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">1 的个数 = 0</text>
  <text x="84" y="304" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">{ 0 }</text>

  <rect x="162" y="270" width="132" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="228" y="287" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1 的个数 = 1</text>
  <text x="228" y="304" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">{ 1, 2, 4, 8 }</text>

  <rect x="306" y="270" width="132" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="372" y="287" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1 的个数 = 2</text>
  <text x="372" y="304" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">{ 3, 5, 6 }</text>

  <rect x="450" y="270" width="132" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="516" y="287" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 的个数 = 3</text>
  <text x="516" y="304" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">{ 7 }</text>
</svg>
