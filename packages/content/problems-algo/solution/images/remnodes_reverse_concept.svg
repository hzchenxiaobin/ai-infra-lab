<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fdfcf7"/>

  <text x="300" y="26" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">核心观察：反转把「右侧最大值」变「左侧已扫最大值」</text>
  <path d="M 150 34 Q 300 42 450 34" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#888">单链表只能向后走 → 看「右侧」难、看「已走过的左侧」易</text>

  <!-- ===== 行1：原链表 ===== -->
  <text x="30" y="96" font-size="12" fill="#888" font-weight="bold">原链表</text>
  <g filter="url(#sk)">
    <rect x="165" y="76" width="46" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="221" y="76" width="46" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="277" y="76" width="46" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="333" y="76" width="46" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="389" y="76" width="46" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="188" y="96" text-anchor="middle" font-size="13" fill="#2b2b2b">5</text>
  <text x="244" y="96" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>
  <text x="300" y="96" text-anchor="middle" font-size="13" fill="#2b2b2b">13</text>
  <text x="356" y="96" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>
  <text x="412" y="96" text-anchor="middle" font-size="13" fill="#2b2b2b">8</text>
  <path d="M 211 91 L 219 91" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 267 91 L 275 91" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 323 91 L 331 91" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 379 91 L 387 91" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="188" y="70" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删</text>
  <text x="244" y="70" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删</text>
  <text x="300" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">留</text>
  <text x="356" y="70" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删</text>
  <text x="412" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">留</text>
  <text x="455" y="92" font-size="10" fill="#888">右侧有更大→删</text>

  <!-- 箭头 ① 反转 -->
  <path d="M 300 116 L 300 140" stroke="#4a4a4a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="312" y="132" font-size="11" fill="#4a4a4a" font-weight="bold">① 反转链表</text>
  <text x="312" y="146" font-size="10" fill="#888">（复用 206 三指针模板）</text>

  <!-- ===== 行2：反转后 ===== -->
  <text x="30" y="170" font-size="12" fill="#888" font-weight="bold">反转后</text>
  <g filter="url(#sk)">
    <rect x="165" y="150" width="46" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="221" y="150" width="46" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="277" y="150" width="46" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="333" y="150" width="46" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="389" y="150" width="46" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="188" y="170" text-anchor="middle" font-size="13" fill="#2b2b2b">8</text>
  <text x="244" y="170" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>
  <text x="300" y="170" text-anchor="middle" font-size="13" fill="#2b2b2b">13</text>
  <text x="356" y="170" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>
  <text x="412" y="170" text-anchor="middle" font-size="13" fill="#2b2b2b">5</text>
  <path d="M 211 165 L 219 165" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 267 165 L 275 165" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 323 165 L 331 165" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 379 165 L 387 165" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- maxSoFar 子标注 -->
  <text x="188" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">max=8</text>
  <text x="244" y="196" text-anchor="middle" font-size="10" fill="#b85450">3&lt;8 删</text>
  <text x="300" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">max=13</text>
  <text x="356" y="196" text-anchor="middle" font-size="10" fill="#b85450">2&lt;13 删</text>
  <text x="412" y="196" text-anchor="middle" font-size="10" fill="#b85450">5&lt;13 删</text>
  <text x="455" y="166" font-size="10" fill="#888">维护 maxSoFar</text>
  <text x="455" y="180" font-size="10" fill="#888">curr.val&lt;max → 删</text>

  <!-- 箭头 ② 扫描删小 -->
  <path d="M 300 214 L 300 232" stroke="#4a4a4a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="312" y="228" font-size="11" fill="#4a4a4a" font-weight="bold">② 扫描删小</text>

  <!-- ===== 行3：删小后（反转视角） ===== -->
  <text x="30" y="262" font-size="12" fill="#888" font-weight="bold">删小后</text>
  <g filter="url(#sk)">
    <rect x="249" y="246" width="46" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="305" y="246" width="46" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="272" y="266" text-anchor="middle" font-size="13" fill="#2b2b2b">8</text>
  <text x="328" y="266" text-anchor="middle" font-size="13" fill="#2b2b2b">13</text>
  <path d="M 295 261 L 303 261" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="365" y="262" font-size="10" fill="#888">非严格递减（反转视角）</text>

  <!-- 箭头 ③ 反转回 -->
  <path d="M 300 286 L 300 308" stroke="#4a4a4a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="312" y="304" font-size="11" fill="#4a4a4a" font-weight="bold">③ 反转回</text>

  <!-- ===== 行4：答案 ===== -->
  <text x="30" y="342" font-size="12" fill="#4a7a3a" font-weight="bold">答案</text>
  <g filter="url(#sk)">
    <rect x="249" y="326" width="46" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="305" y="326" width="46" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="272" y="346" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">13</text>
  <text x="328" y="346" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">8</text>
  <path d="M 295 341 L 303 341" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="365" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">[13,8]</text>
</svg>
