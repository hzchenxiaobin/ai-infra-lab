<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 演算：枚举部分三点组合</text>

  <!-- Header row -->
  <rect x="20" y="48" width="130" height="30" rx="4" fill="#446688" filter="url(#rough2)"/>
  <text x="85" y="68" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">三点组合</text>

  <rect x="155" y="48" width="315" height="30" rx="4" fill="#446688" filter="url(#rough2)"/>
  <text x="312" y="68" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">鞋带公式计算</text>

  <rect x="475" y="48" width="45" height="30" rx="4" fill="#446688" filter="url(#rough2)"/>
  <text x="497" y="68" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">面积</text>

  <!-- Row 1: A,B,C -->
  <rect x="20" y="82" width="130" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A B C</text>
  <rect x="155" y="82" width="315" height="38" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="312" y="106" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">½|0(1−0)+0(0−0)+1(0−1)| = ½|−1|</text>
  <rect x="475" y="82" width="45" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="497" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0.5</text>

  <!-- Row 2: A,B,D (collinear) -->
  <rect x="20" y="124" width="130" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A B D</text>
  <rect x="155" y="124" width="315" height="38" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="312" y="148" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">½|0(1−2)+0(2−0)+0(0−1)| = 0</text>
  <rect x="475" y="124" width="45" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="497" y="146" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="497" y="158" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">共线</text>

  <!-- Row 3: A,D,E (MAX) -->
  <rect x="20" y="166" width="130" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">A D E ★</text>
  <rect x="155" y="166" width="315" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="190" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">½|0(2−0)+0(0−0)+2(0−2)| = ½|−4|</text>
  <rect x="475" y="166" width="45" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="497" y="192" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2.0</text>

  <!-- Row 4: C,D,E -->
  <rect x="20" y="208" width="130" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">C D E</text>
  <rect x="155" y="208" width="315" height="38" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="312" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">½|1(2−0)+0(0−0)+2(0−2)| = ½|−2|</text>
  <rect x="475" y="208" width="45" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="497" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1.0</text>

  <!-- Row 5: B,C,D -->
  <rect x="20" y="250" width="130" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B C D</text>
  <rect x="155" y="250" width="315" height="38" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="312" y="274" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">½|0(1−2)+1(2−0)+0(0−1)| = ½|2|</text>
  <rect x="475" y="250" width="45" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="497" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1.0</text>

  <!-- Note -->
  <rect x="20" y="300" width="500" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">C(5,3) = 10 种组合逐一计算取最大 → max = 2.0（△ADE）</text>
  <text x="270" y="338" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">共线三点面积为 0，自然被淘汰，无需额外判断</text>
</svg>
