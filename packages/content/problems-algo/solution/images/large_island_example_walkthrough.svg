<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid = [[1,1,0],[1,0,1],[0,1,1]]</text>

  <!-- Step 1 label -->
  <text x="30" y="46" font-size="11.5" fill="#555" font-weight="bold">① DFS 标记岛屿：</text>

  <!-- 3x3 grid (labeled) -->
  <!-- Row 0 -->
  <rect x="30" y="54" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="78" y="54" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="126" y="54" width="48" height="48" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="84" text-anchor="middle" font-size="14" fill="#bbb">0</text>

  <!-- Row 1 -->
  <rect x="30" y="102" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="78" y="102" width="48" height="48" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="102" y="132" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="126" y="102" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- Row 2 -->
  <rect x="30" y="150" width="48" height="48" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="54" y="180" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="78" y="150" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="180" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="126" y="150" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- area table on right -->
  <text x="220" y="60" font-size="11" fill="#555" font-weight="bold">面积表：</text>
  <rect x="220" y="68" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="275" y="84" text-anchor="middle" font-size="11.5" fill="#333">area[2] = 3</text>
  <rect x="220" y="96" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="275" y="112" text-anchor="middle" font-size="11.5" fill="#333">area[3] = 3</text>

  <!-- legend -->
  <text x="220" y="138" font-size="10.5" fill="#888">蓝=岛A(tag2,面积3)　绿=岛B(tag3,面积3)</text>

  <!-- Step 2 label -->
  <text x="30" y="218" font-size="11.5" fill="#555" font-weight="bold">② 遍历 0 格，计算候选面积：</text>

  <!-- candidate table header -->
  <rect x="30" y="228" width="120" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="245" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">0 格 (i,j)</text>
  <rect x="150" y="228" width="140" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="245" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">四邻 unique tag</text>
  <rect x="290" y="228" width="180" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="380" y="245" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">候选面积</text>

  <!-- row 1: (0,2) -->
  <rect x="30" y="254" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="271" text-anchor="middle" font-size="11" fill="#333">(0, 2)</text>
  <rect x="150" y="254" width="140" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="271" text-anchor="middle" font-size="11" fill="#446688">{2}</text>
  <rect x="290" y="254" width="180" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="380" y="271" text-anchor="middle" font-size="11" fill="#333">1 + 3 = 4</text>

  <!-- row 2: (1,1) - highlighted -->
  <rect x="30" y="280" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(1, 1)</text>
  <rect x="150" y="280" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">{2, 3}</text>
  <rect x="290" y="280" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="297" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1 + 3 + 3 = 7 ← max</text>

  <!-- row 3: (2,0) -->
  <rect x="30" y="306" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="323" text-anchor="middle" font-size="11" fill="#333">(2, 0)</text>
  <rect x="150" y="306" width="140" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="323" text-anchor="middle" font-size="11" fill="#4a7a3a">{2}</text>
  <rect x="290" y="306" width="180" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="380" y="323" text-anchor="middle" font-size="11" fill="#333">1 + 3 = 4</text>

  <!-- result -->
  <rect x="30" y="346" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="365" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">ans = max(3, 4, 7, 4) = 7</text>
</svg>
