<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：多源 BFS（01 矩阵）</text>

  <!-- init rect -->
  <rect x="120" y="48" width="320" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 dist：mat[i][j]==0 → dist=0 且入队</text>
  <text x="280" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mat[i][j]==1 → dist=INF</text>

  <path d="M280 94 L280 110" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while diamond -->
  <path d="M280 112 L388 146 L280 180 L172 146 z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">队列空 ?</text>

  <!-- Yes -> return -->
  <path d="M172 146 L150 146" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="161" y="138" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="28" y="125" width="120" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 dist</text>

  <!-- No -> pop -->
  <path d="M280 180 L280 208" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="198" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="160" y="210" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">出队 (i, j)，遍历四邻居</text>

  <path d="M280 250 L280 278" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check diamond -->
  <path d="M280 280 L420 318 L280 356 L140 318 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">越界 &amp;&amp; dist[nb]</text>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">&gt; dist[i][j] + 1 ?</text>

  <!-- Yes -> update + enqueue -->
  <path d="M420 318 L438 318" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="449" y="310" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="440" y="297" width="116" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="498" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dist[nb] =</text>
  <text x="498" y="335" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dist[i][j]+1</text>
  <text x="498" y="350" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">入队 nb</text>

  <!-- No -> skip -->
  <path d="M140 318 L122 318" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="111" y="310" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="16" y="297" width="106" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="69" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">跳过该邻居</text>

  <!-- branches down to junction -->
  <path d="M498 355 L498 392 L280 392" stroke="#555" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M69 339 L69 392 L280 392" stroke="#555" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- loop back to while top -->
  <path d="M280 392 L520 392 L520 146 L388 146" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="534" y="270" font-size="11" fill="#888" filter="url(#rough2)">循</text>
  <text x="534" y="284" font-size="11" fill="#888" filter="url(#rough2)">环</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="60" y="412" width="440" height="72" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="280" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">FIFO 保证按距离非降序处理</text>
  <text x="280" y="456" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">源（dist=0）先出队 → 邻居赋 1 → 再出队赋 2……</text>
  <text x="280" y="473" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">首次触达即最短，每格只入队一次</text>
</svg>
