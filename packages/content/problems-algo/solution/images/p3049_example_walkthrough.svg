<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：check(6) 恰好卡线通过</text>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [3,2,3]，changeIndices = [1,3,2,2,2,2,3]，基准 total = 8 + 3 = 11</text>

  <!-- 表头 -->
  <rect x="36" y="58" width="448" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">秒</text>
  <text x="98" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ci[s]</text>
  <text x="196" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">动作（倒序扫）</text>
  <text x="324" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">小根堆</text>
  <text x="404" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">total</text>
  <text x="452" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>

  <!-- 行 6~4：非首次 -->
  <rect x="36" y="82" width="448" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="98" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="196" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">非首次 → cnt + 1</text>
  <text x="324" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ }</text>
  <text x="404" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <text x="452" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="36" y="104" width="448" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="98" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="196" y="119" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">非首次 → cnt + 1</text>
  <text x="324" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ }</text>
  <text x="404" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <text x="452" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="36" y="126" width="448" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="98" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="196" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">非首次 → cnt + 1</text>
  <text x="324" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ }</text>
  <text x="404" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <text x="452" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 3~1：首次出现，入堆 -->
  <rect x="36" y="148" width="448" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="98" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="196" y="163" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">首次 ✓ 入堆 2（省 1 秒）</text>
  <text x="324" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2}</text>
  <text x="404" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="452" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <rect x="36" y="170" width="448" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="98" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="196" y="185" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">首次 ✓ 入堆 3（省 2 秒）</text>
  <text x="324" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2,3}</text>
  <text x="404" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="452" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <rect x="36" y="192" width="448" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="58" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="98" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="196" y="207" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">首次 ✓ 入堆 3（省 2 秒）</text>
  <text x="324" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2,3,3}</text>
  <text x="404" y="207" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="452" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- 判定框 -->
  <rect x="36" y="226" width="448" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="244" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">total = 6 ≤ 6 ✓ 可行：秒1/2/3 清零下标 1/3/2，秒4/5/6 依次标记</text>
  <text x="52" y="262" font-size="11.5" fill="#333" filter="url(#rough2)">三个候选全部保住（堆大小 3 = 名额 3），11 秒的账硬省下 5 秒</text>

  <!-- check(5) 对比框 -->
  <rect x="36" y="282" width="448" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="302" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">对比 check(5)：扫到秒 1 时堆 {2,3,3} 已超名额 cnt = 2</text>
  <text x="52" y="320" font-size="11.5" fill="#333" filter="url(#rough2)">只能弹最小 2（total 回到 7），7 &gt; 5 ✗ 不可行 ⇒ 答案取 6</text>
</svg>
