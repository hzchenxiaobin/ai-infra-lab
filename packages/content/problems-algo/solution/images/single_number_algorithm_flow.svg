<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="420" fill="#fafafa"/>
  <text x="220" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">全体异或算法流程</text>

  <!-- init -->
  <rect x="100" y="42" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#555">ans = 0</text>

  <path d="M 220 96 L 220 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- loop check -->
  <polygon points="220,118 330,160 220,202 110,160" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">还有元素 x ?</text>
  <text x="220" y="174" text-anchor="middle" font-size="10.5" fill="#777">遍历未结束？</text>

  <!-- No -> return -->
  <path d="M 330 160 L 390 160 L 390 238" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="350" y="152" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="300" y="242" width="130" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="365" y="263" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>
  <text x="365" y="279" text-anchor="middle" font-size="10" fill="#888">ans 即落单数</text>

  <!-- Yes down -->
  <path d="M 220 202 L 220 226" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="238" y="218" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- accumulate -->
  <rect x="110" y="230" width="220" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">累加异或</text>
  <text x="220" y="272" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">ans = ans ⊕ x</text>
  <text x="220" y="290" text-anchor="middle" font-size="10.5" fill="#777">相同抵消，不同保留</text>

  <!-- loop back -->
  <path d="M 110 265 L 50 265 L 50 160 L 110 160" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="58" y="212" font-size="10" fill="#888">回到循环顶</text>

  <!-- note -->
  <rect x="60" y="330" width="320" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="220" y="352" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">一遍扫描 + 一个变量</text>
  <text x="220" y="372" text-anchor="middle" font-size="10.5" fill="#555">⊕ 可交换可结合 → 顺序无关</text>
  <text x="220" y="388" text-anchor="middle" font-size="10.5" fill="#555">成对元素两两抵消为 0，最后只剩落单者</text>
</svg>
