<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：每位顾客的商品频率与 RANK 保留判定</text>

  <!-- ===== Alice panel (top-left) ===== -->
  <rect x="20" y="44" width="255" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Alice (cust=1) · 4 笔订单</text>
  <line x1="30" y1="68" x2="265" y2="68" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="40" y="84" font-size="9" fill="#888">prod</text>
  <text x="120" y="84" font-size="9" fill="#888">cnt</text>
  <text x="180" y="84" font-size="9" fill="#888">rk</text>
  <text x="250" y="84" font-size="9" fill="#888" text-anchor="end">保留?</text>

  <text x="40" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">mouse</text>
  <text x="120" y="102" font-size="10" fill="#333">3</text>
  <text x="180" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="250" y="102" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="40" y="120" font-size="10" fill="#999">keyboard</text>
  <text x="120" y="120" font-size="10" fill="#999">1</text>
  <text x="180" y="120" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="250" y="120" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">✗</text>
  <text x="40" y="142" font-size="9" fill="#4a7a3a">最高频唯一 → 仅 mouse 保留</text>

  <!-- ===== Bob panel (top-right) — TIE highlight ===== -->
  <rect x="285" y="44" width="255" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="412" y="62" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">Bob (cust=2) · 3 笔订单 · 并列!</text>
  <line x1="295" y1="68" x2="530" y2="68" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="305" y="84" font-size="9" fill="#888">prod</text>
  <text x="385" y="84" font-size="9" fill="#888">cnt</text>
  <text x="445" y="84" font-size="9" fill="#888">rk</text>
  <text x="515" y="84" font-size="9" fill="#888" text-anchor="end">保留?</text>

  <text x="305" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">keyboard</text>
  <text x="385" y="102" font-size="10" fill="#333">1</text>
  <text x="445" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="515" y="102" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="305" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">mouse</text>
  <text x="385" y="118" font-size="10" fill="#333">1</text>
  <text x="445" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="515" y="118" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="305" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">screen</text>
  <text x="385" y="134" font-size="10" fill="#333">1</text>
  <text x="445" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="515" y="134" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>
  <text x="305" y="150" font-size="9" fill="#d6a040" font-weight="bold">三商品 cnt 同为 1 → RANK 并列 rk=1，全保留</text>

  <!-- ===== Tom panel (middle-left) ===== -->
  <rect x="20" y="164" width="255" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Tom (cust=3) · 2 笔订单</text>
  <line x1="30" y1="188" x2="265" y2="188" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="40" y="204" font-size="9" fill="#888">prod</text>
  <text x="120" y="204" font-size="9" fill="#888">cnt</text>
  <text x="180" y="204" font-size="9" fill="#888">rk</text>
  <text x="250" y="204" font-size="9" fill="#888" text-anchor="end">保留?</text>

  <text x="40" y="222" font-size="10" fill="#4a7a3a" font-weight="bold">screen</text>
  <text x="120" y="222" font-size="10" fill="#333">2</text>
  <text x="180" y="222" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="250" y="222" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>
  <text x="40" y="244" font-size="9" fill="#4a7a3a">只买 screen → 唯一最高频</text>

  <!-- ===== Jerry panel (middle-right) ===== -->
  <rect x="285" y="164" width="255" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Jerry (cust=4) · 1 笔订单</text>
  <line x1="295" y1="188" x2="530" y2="188" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="305" y="204" font-size="9" fill="#888">prod</text>
  <text x="385" y="204" font-size="9" fill="#888">cnt</text>
  <text x="445" y="204" font-size="9" fill="#888">rk</text>
  <text x="515" y="204" font-size="9" fill="#888" text-anchor="end">保留?</text>

  <text x="305" y="222" font-size="10" fill="#4a7a3a" font-weight="bold">keyboard</text>
  <text x="385" y="222" font-size="10" fill="#333">1</text>
  <text x="445" y="222" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="515" y="222" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>
  <text x="305" y="244" font-size="9" fill="#4a7a3a">单笔订单 → cnt=1 即最高频</text>

  <!-- ===== John panel (bottom, excluded) ===== -->
  <rect x="100" y="268" width="360" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">John (cust=5) · 0 笔订单</text>
  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#666">GROUP BY 不产出任何行 → 天然排除，不出现在结果中</text>

  <!-- ===== Final output ===== -->
  <rect x="40" y="328" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最终输出：6 行（Alice 1 + Bob 3 并列 + Tom 1 + Jerry 1，John 排除）</text>
  <text x="280" y="362" text-anchor="middle" font-size="9" fill="#666">任意顺序返回</text>

  <!-- output table header -->
  <rect x="120" y="374" width="320" height="20" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="388" text-anchor="middle" font-size="9" fill="white" font-weight="bold">customer_id</text>
  <text x="280" y="388" text-anchor="middle" font-size="9" fill="white" font-weight="bold">product_id</text>
  <text x="380" y="388" text-anchor="middle" font-size="9" fill="white" font-weight="bold">product_name</text>

  <!-- output rows -->
  <rect x="120" y="394" width="320" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="180" y="406" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="280" y="406" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="380" y="406" text-anchor="middle" font-size="9" fill="#333">mouse</text>

  <rect x="120" y="410" width="320" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="180" y="422" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="280" y="422" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="380" y="422" text-anchor="middle" font-size="9" fill="#333">keyboard</text>

  <rect x="120" y="426" width="320" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="180" y="438" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="280" y="438" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="380" y="438" text-anchor="middle" font-size="9" fill="#333">mouse</text>

  <rect x="120" y="442" width="320" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="180" y="454" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="280" y="454" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="380" y="454" text-anchor="middle" font-size="9" fill="#333">screen</text>

  <text x="280" y="472" text-anchor="middle" font-size="9" fill="#888">…（共 6 行，Bob 占 3 行为并列）</text>
</svg>
