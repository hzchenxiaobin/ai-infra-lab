<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：解法 A（ORDER BY+LIMIT）与解法 B（RANK 窗口）殊途同归</text>

  <!-- Shared input -->
  <rect x="220" y="44" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">FROM Sales s JOIN Product p ON product_id</text>

  <path d="M260 72 L160 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M360 72 L460 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Left column: Solution A -->
  <text x="160" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">解法 A：聚合 + 排序 + LIMIT</text>

  <rect x="40" y="108" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="123" text-anchor="middle" font-size="10" fill="#333">GROUP BY user_id</text>

  <path d="M160 130 L160 150" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="152" width="240" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="167" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">SUM(quantity * price) AS total</text>

  <path d="M160 174 L160 194" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="196" width="240" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="211" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">ORDER BY total DESC</text>

  <path d="M160 218 L160 238" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="240" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="255" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LIMIT 1  →  取榜首一行</text>

  <path d="M160 262 L160 282" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="80" y="284" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">user_id = 102</text>

  <rect x="30" y="324" width="260" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="160" y="342" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">特点</text>
  <text x="44" y="358" font-size="9" fill="#555">• 通用：所有数据库都支持</text>
  <text x="44" y="372" font-size="9" fill="#555">• 一句到位，语义直观</text>
  <text x="44" y="386" font-size="9" fill="#555">• ⚠️ 并列时只回一个（任意）</text>
  <text x="44" y="400" font-size="9" fill="#555">• 需保证最大值唯一，否则不确定</text>
  <text x="44" y="414" font-size="9" fill="#4a7a3a" font-weight="bold">→ 通用首选</text>

  <!-- Right column: Solution B -->
  <text x="460" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">解法 B：子查询 + RANK 窗口</text>

  <rect x="340" y="108" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="123" text-anchor="middle" font-size="10" fill="#333">GROUP BY user_id（内层子查询 t）</text>

  <path d="M460 130 L460 150" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="340" y="152" width="240" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="167" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">SUM(quantity * price) AS total</text>

  <path d="M460 174 L460 194" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="340" y="196" width="240" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="211" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">RANK() OVER (ORDER BY total DESC) AS rk</text>

  <path d="M460 218 L460 238" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="340" y="240" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="255" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">WHERE rk = 1  →  取所有并列榜首</text>

  <path d="M460 262 L460 282" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="380" y="284" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">user_id = 102</text>

  <rect x="330" y="324" width="260" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="460" y="342" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">特点</text>
  <text x="344" y="358" font-size="9" fill="#555">• 需 MySQL 8.0+ / PG / SQL Server</text>
  <text x="344" y="372" font-size="9" fill="#555">• RANK 保留并列（同额都回）</text>
  <text x="344" y="386" font-size="9" fill="#555">• 扩展 Top-K 友好（rk &lt;= K）</text>
  <text x="344" y="400" font-size="9" fill="#555">• 窗口函数晚于 WHERE，须套子查询</text>
  <text x="344" y="414" font-size="9" fill="#4a7a3a" font-weight="bold">→ 进阶首选（并列稳健）</text>

  <!-- middle vs label -->
  <rect x="280" y="292" width="60" height="20" fill="#fafafa" stroke="#888" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="310" y="306" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">vs</text>
</svg>
