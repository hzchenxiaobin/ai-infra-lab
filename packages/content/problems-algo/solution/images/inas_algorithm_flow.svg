<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一趟扫描 + 严格递增判定</text>

  <!-- Step 1: split -->
  <rect x="170" y="46" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 按空格切分</text>
  <text x="270" y="82" text-anchor="middle" font-size="10" fill="#666">tokens = s.split(' ')</text>

  <path d="M 270 92 L 270 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop init -->
  <rect x="170" y="112" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② prev = -∞（哨兵）</text>
  <text x="270" y="148" text-anchor="middle" font-size="10" fill="#666">用极小值确保首个数字一定 &gt; prev</text>

  <path d="M 270 158 L 270 176" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: for each token -->
  <rect x="120" y="178" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 遍历每个 token</text>
  <text x="270" y="214" text-anchor="middle" font-size="10" fill="#666">for token in tokens</text>

  <path d="M 270 224 L 270 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: is digit? -->
  <polygon points="270,242 410,288 270,334 130,288" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">token 是数字？</text>
  <text x="270" y="296" text-anchor="middle" font-size="9.5" fill="#666">token[0].isdigit()</text>
  <text x="270" y="312" text-anchor="middle" font-size="9.5" fill="#666">(无前导零，首字符即判)</text>

  <!-- No branch: skip -->
  <path d="M 410 288 L 462 288" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="282" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="466" y="270" width="60" height="36" fill="#fff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="496" y="293" text-anchor="middle" font-size="10" fill="#888">跳过</text>
  <path d="M 496 270 L 496 200" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 496 200 L 420 200" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="194" font-size="9" fill="#888">回到循环</text>

  <!-- Yes branch: parse & compare -->
  <path d="M 270 334 L 270 352" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="346" font-size="10" fill="#666">是</text>

  <rect x="100" y="354" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ cur = int(token)</text>
  <text x="270" y="390" text-anchor="middle" font-size="10" fill="#666">若 cur &gt; prev：prev = cur，继续；否则 return false</text>

  <path d="M 270 400 L 270 416" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="120" y="418" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="440" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ 全部遍历完未触发 false → return true</text>
</svg>
