<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：滚动值域 DP——逐元素转移，终查 dp[target]</text>

  <ellipse cx="210" cy="44" rx="34" ry="14" fill="#fafafa" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="49" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 210 58 L 210 68" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="75" y="72" width="270" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="90" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① dp[0] = 0，其余 dp[v] = INF（V = 2¹⁴）</text>

  <text x="355" y="90" font-size="9" fill="#555" filter="url(#rough2)">V=16384 ⇒ 表仅 1.6 万格</text>

  <path d="M 210 100 L 210 112" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="54" y="114" width="316" height="118" rx="12" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="210" y="130" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">对每个元素 e ∈ nums（另开一行 nd）</text>

  <rect x="66" y="140" width="140" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="136" y="160" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">保留 e（费用 +0）</text>
  <text x="136" y="178" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">nd[v⊕e] ← min(·, dp[v])</text>

  <rect x="214" y="140" width="140" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="284" y="160" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">删除 e（费用 +1）</text>
  <text x="284" y="178" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">nd[v] ← min(·, dp[v]+1)</text>

  <rect x="130" y="200" width="160" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="215" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">dp ← nd（滚动交换）</text>

  <text x="298" y="215" font-size="9" fill="#a0433f" filter="url(#rough2)">⚠️ 勿原地滚动</text>

  <path d="M 66 168 H 52 Q 44 168 44 158 V 140 Q 44 130 54 130 H 96" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="152" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">下一个 e</text>

  <path d="M 210 232 L 210 244" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="210,244 296,268 210,292 124,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="272" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">dp[target] = INF？</text>

  <path d="M 296 268 L 340 268" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="261" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">是</text>

  <rect x="344" y="254" width="110" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="399" y="272" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">return −1</text>

  <text x="399" y="244" text-anchor="middle" font-size="9" fill="#a0433f" filter="url(#rough2)">target 不可达</text>

  <path d="M 210 292 L 210 304" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="302" font-size="9.5" fill="#333" filter="url(#rough2)">否</text>

  <rect x="110" y="308" width="200" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="326" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return dp[target]</text>

  <rect x="20" y="340" width="150" height="18" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="353" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例1 [1,2,3] t=2 → 1</text>

  <rect x="185" y="340" width="150" height="18" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="9.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">示例2 [2,4] t=1 → −1</text>

  <rect x="350" y="340" width="150" height="18" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="425" y="353" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例3 [7] t=7 → 0</text>
</svg>
