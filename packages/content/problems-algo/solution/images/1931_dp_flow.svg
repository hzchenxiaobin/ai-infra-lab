<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：枚举 → 建图 → 逐列 DP → 求和</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">四步走，核心是第 3 步的逐列状态转移</text>

  <!-- Step 1: generate columns -->
  <rect x="170" y="64" width="260" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="86" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">① 枚举所有合法列着色</text>
  <text x="300" y="104" text-anchor="middle" font-size="11" fill="#555">DFS：逐行选色，≠ 上一行</text>
  <text x="300" y="118" text-anchor="middle" font-size="10" fill="#888">得到 S = 3×2^(m−1) 个状态</text>

  <path d="M 300 124 L 300 144" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: build compatibility graph -->
  <rect x="170" y="148" width="260" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="170" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">② 建兼容图（邻接表）</text>
  <text x="300" y="188" text-anchor="middle" font-size="11" fill="#555">两两检查：同行不同色 → 兼容</text>
  <text x="300" y="202" text-anchor="middle" font-size="10" fill="#888">O(S²·m)，S ≤ 48 → 最多 ~2304 次</text>

  <path d="M 300 208 L 300 228" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: DP loop -->
  <rect x="140" y="232" width="320" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="254" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">③ 逐列 DP（核心）</text>
  <text x="300" y="272" text-anchor="middle" font-size="11" fill="#555">dp[0][c] = 1（第 0 列每个状态 1 种）</text>
  <text x="300" y="288" text-anchor="middle" font-size="11" fill="#555">dp[col][c] = Σ dp[col−1][c'], c' 兼容 c</text>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#888">滚动数组：next[j] = Σ dp[i], i ∈ adj[j]</text>

  <path d="M 300 308 L 300 328" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: sum -->
  <rect x="170" y="332" width="260" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="354" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">④ 求和返回</text>
  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#555">ans = Σ dp[n−1][c] mod MOD</text>
  <text x="300" y="386" text-anchor="middle" font-size="10" fill="#888">对所有末列状态求和</text>

  <!-- side notes -->
  <rect x="40" y="64" width="80" height="324" rx="6" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="80" y="88" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">预处理</text>
  <text x="80" y="106" text-anchor="middle" font-size="9" fill="#aaa">步骤 ①②</text>
  <text x="80" y="124" text-anchor="middle" font-size="9" fill="#aaa">只与 m 有关</text>
  <text x="80" y="142" text-anchor="middle" font-size="9" fill="#aaa">做一次即可</text>

  <rect x="480" y="232" width="80" height="72" rx="6" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="520" y="256" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">主循环</text>
  <text x="520" y="274" text-anchor="middle" font-size="9" fill="#aaa">步骤 ③</text>
  <text x="520" y="292" text-anchor="middle" font-size="9" fill="#aaa">n−1 轮</text>

  <!-- complexity summary -->
  <rect x="40" y="410" width="520" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="434" font-size="13" fill="#444" font-weight="bold">总复杂度</text>
  <text x="60" y="454" font-size="12" fill="#4a7a3a">时间 O(S²·m + n·S²) = O(n·S²)，S ≤ 48 → n·S² ≤ 1000×2304 ≈ 2.3M，远在限制内</text>
</svg>
