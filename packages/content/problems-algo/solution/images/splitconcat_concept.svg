<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：成环（每串取较大朝向）→ 切点展开 → 字典序最大</text>

  <!-- ============ 左块：贪心定向 ============ -->
  <text x="110" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① 贪心定向 max(s, rev(s))</text>

  <!-- abc -> cba -->
  <rect x="30" y="84" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="102" text-anchor="middle" font-size="13" fill="#333">abc</text>
  <text x="97" y="78" text-anchor="middle" font-size="9" fill="#888">rev</text>
  <path d="M 80 97 L 112 97" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="118" y="84" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="141" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">cba</text>

  <!-- xyz -> zyx -->
  <rect x="30" y="124" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="142" text-anchor="middle" font-size="13" fill="#333">xyz</text>
  <text x="97" y="118" text-anchor="middle" font-size="9" fill="#888">rev</text>
  <path d="M 80 137 L 112 137" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="118" y="124" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="141" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">zyx</text>

  <text x="110" y="172" text-anchor="middle" font-size="10" fill="#888">每个串取自身与反转的较大者</text>

  <!-- ============ 右块：环 + 切点展开 ============ -->
  <text x="380" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② 成环后切一刀，展开成线性串</text>

  <!-- tape: c b a | z y x -->
  <rect x="290" y="108" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="310" y="108" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="330" y="108" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="340" y="128" text-anchor="middle" font-size="13" fill="#333">a</text>

  <rect x="350" y="108" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="360" y="128" text-anchor="middle" font-size="13" fill="#333">z</text>
  <rect x="370" y="108" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="128" text-anchor="middle" font-size="13" fill="#333">y</text>
  <rect x="390" y="108" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="128" text-anchor="middle" font-size="13" fill="#333">x</text>

  <text x="320" y="100" text-anchor="middle" font-size="9" fill="#888">cba</text>
  <text x="380" y="100" text-anchor="middle" font-size="9" fill="#888">zyx</text>

  <!-- loop closure arc (right end back to left end) -->
  <path d="M 415 122 C 470 78, 250 78, 285 122" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="80" text-anchor="middle" font-size="10" fill="#446688">环（首尾相连）</text>

  <!-- cut marker between a and z -->
  <path d="M 350 106 L 350 142" stroke="#b85450" stroke-width="2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="350" y="156" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✂</text>
  <text x="350" y="170" text-anchor="middle" font-size="9.5" fill="#b85450">切点</text>

  <!-- down arrow to result -->
  <path d="M 350 176 L 350 206" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="194" font-size="9.5" fill="#888">展开</text>

  <!-- result tape: z y x c b a  (zyx highlighted) -->
  <rect x="290" y="212" width="20" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">z</text>
  <rect x="310" y="212" width="20" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="232" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">y</text>
  <rect x="330" y="212" width="20" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="340" y="232" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">x</text>
  <rect x="350" y="212" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="360" y="232" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="370" y="212" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="232" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="390" y="212" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="232" text-anchor="middle" font-size="13" fill="#333">a</text>

  <text x="320" y="258" text-anchor="middle" font-size="9" fill="#d6a040">zyx</text>
  <text x="380" y="258" text-anchor="middle" font-size="9" fill="#888">cba</text>
  <text x="350" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= "zyxcba"（字典序最大）</text>

  <!-- ============ 底部洞察框 ============ -->
  <rect x="30" y="296" width="500" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="318" font-size="12" fill="#4a7a3a" font-weight="bold">关键洞察</text>
  <text x="46" y="338" font-size="11" fill="#444">• 非切点串：贪心取 max(s, rev(s))——完整连续段，首位定胜负，引理保证最优</text>
  <text x="46" y="356" font-size="11" fill="#444">• 切点串：被切成「后缀在头 + 前缀在尾」，贪心失效，两种朝向都要试</text>
</svg>
