<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[7,4,3,9,1,8,5,2,6], k=3</text>

  <!-- param note -->
  <rect x="40" y="46" width="560" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="60" y="68" font-size="11" fill="#4a7a3a" font-weight="bold">窗口大小 2k+1 = 7，合法中心 i ∈ [3, 5]，其余下标 ans[i] = −1</text>

  <!-- Header row -->
  <rect x="30" y="96" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">中心 i</text>
  <rect x="102" y="96" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">窗口范围</text>
  <rect x="204" y="96" width="170" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="289" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">进入(+) / 离开(−)</text>
  <rect x="376" y="96" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="421" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum</text>
  <rect x="468" y="96" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="508" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum/7</text>
  <rect x="550" y="96" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="580" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans[i]</text>

  <!-- Row i=3 -->
  <rect x="30" y="128" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="65" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="102" y="128" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="152" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[0, 6]</text>
  <rect x="204" y="128" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="289" y="150" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">初始:7+4+3+9+1+8+5</text>
  <rect x="376" y="128" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="421" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">37</text>
  <rect x="468" y="128" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="508" y="150" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">37//7=5</text>
  <rect x="550" y="128" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="580" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Row i=4 -->
  <rect x="30" y="164" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="65" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="102" y="164" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="152" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1, 7]</text>
  <rect x="204" y="164" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="289" y="186" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">+2(进) −7(出)</text>
  <rect x="376" y="164" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="421" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">32</text>
  <rect x="468" y="164" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="508" y="186" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">32//7=4</text>
  <rect x="550" y="164" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="580" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Row i=5 -->
  <rect x="30" y="200" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="65" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="102" y="200" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="152" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[2, 8]</text>
  <rect x="204" y="200" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="289" y="222" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">+6(进) −4(出)</text>
  <rect x="376" y="200" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="421" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">34</text>
  <rect x="468" y="200" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="508" y="222" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">34//7=4</text>
  <rect x="550" y="200" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="580" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- final result row -->
  <rect x="30" y="252" width="580" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="276" font-size="12" fill="#b85450" font-weight="bold">最终 ans = [−1, −1, −1, 5, 4, 4, −1, −1, −1] ⭐</text>

  <!-- nums grid visualization -->
  <text x="40" y="318" font-size="11" fill="#888" font-weight="bold">nums 网格（标出三个窗口）：</text>

  <!-- nums cells row, k=3 windows highlighted -->
  <!-- cell size 56x30, start x=40 -->
  <rect x="40" y="328" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="68" y="348" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">7</text>
  <rect x="96" y="328" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="124" y="348" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">4</text>
  <rect x="152" y="328" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="180" y="348" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">3</text>
  <!-- window i=3 [0..6] blue underline -->
  <rect x="208" y="328" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="264" y="328" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="292" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="320" y="328" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="348" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="376" y="328" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="404" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="432" y="328" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="460" y="348" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">2</text>
  <rect x="488" y="328" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="516" y="348" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">6</text>

  <!-- index labels -->
  <text x="68" y="372" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="124" y="372" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="180" y="372" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="236" y="372" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="292" y="372" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <text x="348" y="372" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5</text>
  <text x="404" y="372" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="460" y="372" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="516" y="372" text-anchor="middle" font-size="10" fill="#888">8</text>

  <!-- footer -->
  <rect x="30" y="386" width="580" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="408" font-size="11" fill="#555">关键：窗口定长 2k+1，中心右移一位 → 左端出一个、右端进一个，O(1) 转移。</text>
  <text x="50" y="426" font-size="11" fill="#555">灰格 = 边界下标（ans=−1），蓝格 = 合法中心覆盖范围。</text>
  <text x="50" y="440" font-size="11" fill="#4a7a3a" font-weight="bold">一趟滑窗 O(n)、O(1) 额外空间。</text>
</svg>
