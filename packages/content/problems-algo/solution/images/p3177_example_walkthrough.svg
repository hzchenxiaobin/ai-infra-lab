<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [1, 2, 1, 1, 3]，k = 2</text>
  <text x="260" y="38" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每处理一个元素，三行各写一格；格子里只列非零项「值:长度」</text>

  <text x="52" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">当前元素</text>
  <text x="140" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">j = 0 行（0 次不同）</text>
  <text x="260" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">j = 1 行（≤1 次）</text>
  <text x="380" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">j = 2 行（≤2 次）</text>
  <text x="468" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="28" y="70" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="52" y="103" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">i=0</text>
  <rect x="84" y="70" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="94" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1:1</text>
  <rect x="204" y="70" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1:1</text>
  <rect x="324" y="70" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="380" y="94" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1:1</text>
  <rect x="444" y="70" width="48" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="468" y="94" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <rect x="28" y="114" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="132" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="52" y="147" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">i=1</text>
  <rect x="84" y="114" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="126" y="138" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1:1</text>
  <text x="158" y="138" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2:1</text>
  <rect x="204" y="114" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="246" y="138" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1:1</text>
  <text x="278" y="138" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2:2</text>
  <rect x="324" y="114" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="366" y="138" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1:1</text>
  <text x="398" y="138" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2:2</text>
  <rect x="444" y="114" width="48" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="468" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>

  <rect x="28" y="158" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="176" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="52" y="191" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">i=2</text>
  <rect x="84" y="158" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="126" y="182" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1:2</text>
  <text x="158" y="182" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2:1</text>
  <rect x="204" y="158" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="246" y="182" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1:2</text>
  <text x="278" y="182" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2:2</text>
  <rect x="324" y="158" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="366" y="182" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1:3</text>
  <text x="398" y="182" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2:2</text>
  <rect x="444" y="158" width="48" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="468" y="182" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>

  <rect x="28" y="202" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="220" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="52" y="235" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">i=3</text>
  <rect x="84" y="202" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="126" y="226" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1:3</text>
  <text x="158" y="226" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2:1</text>
  <rect x="204" y="202" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="246" y="226" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1:3</text>
  <text x="278" y="226" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2:2</text>
  <rect x="324" y="202" width="112" height="40" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="226" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1:4</text>
  <text x="398" y="226" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2:2</text>
  <rect x="444" y="202" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="468" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="28" y="246" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="264" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="52" y="279" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">i=4</text>
  <rect x="84" y="246" width="112" height="40" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="112" y="270" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1:3</text>
  <text x="144" y="270" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2:1</text>
  <text x="176" y="270" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">3:1</text>
  <rect x="204" y="246" width="112" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="270" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1:3</text>
  <text x="264" y="270" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2:2</text>
  <text x="296" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3:4</text>
  <rect x="324" y="246" width="112" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1:4</text>
  <text x="384" y="270" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2:2</text>
  <text x="416" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3:4</text>
  <rect x="444" y="246" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="468" y="270" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="40" y="296" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">第 4 个元素 1：dp[2][1] ← dp[2][1] + 1 = 3 + 1 = 4（同值接龙）</text>
  <text x="260" y="336" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">对应 [1,2,1,1]，恰好 2 处相邻不同 ≤ k —— 答案在此锁定</text>

  <rect x="40" y="356" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">第 5 个元素 3：dp[1][3] ← mx₁(第 0 行) + 1 = 3 + 1 = 4（换值接龙）</text>
  <text x="260" y="396" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">mx₁ 在值 1 列 ≠ 3，直接取行最大；对应 [1,1,1,3]，只有 1 处不同</text>
</svg>
