<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：KMP 挖出两张有序位置表，再用 |i − j| ≤ k 对齐</text>

  <!-- s strip -->
  <text x="40" y="70" font-size="11" fill="#888" filter="url(#rough2)">s =</text>
  <rect x="70" y="48" width="400" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">"isawsquirrelnearmysquirrelhouseohmy"</text>
  <!-- position marks on strip: pos -> x = 70 + 400/35*pos -->
  <path d="M 116 44 L 116 86" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="116" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b@4</text>
  <path d="M 253 40 L 253 86" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="253" y="36" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">a@16</text>
  <path d="M 276 44 L 276 86" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="288" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b@18</text>
  <path d="M 447 40 L 447 86" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="447" y="36" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">a@33</text>

  <!-- A and B lists -->
  <path d="M 150 86 L 150 116" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 340 86 L 340 116" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="52" y="140" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A =</text>
  <rect x="76" y="122" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="102" y="143" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="132" y="122" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="143" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">33</text>
  <text x="196" y="143" font-size="10.5" fill="#888" filter="url(#rough2)">a 的起点（升序）</text>

  <text x="268" y="140" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B =</text>
  <rect x="292" y="122" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="318" y="143" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="348" y="122" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="374" y="143" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">18</text>
  <text x="412" y="143" font-size="10.5" fill="#888" filter="url(#rough2)">b 的起点（升序）</text>

  <!-- check 1: i = 16 -->
  <text x="60" y="186" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">① i = 16：窗口 [16−15, 16+15] = [1, 31]</text>
  <rect x="81" y="196" width="343" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <line x1="70" y1="228" x2="470" y2="228" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="243" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="470" y="243" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">35</text>
  <circle cx="116" cy="228" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="116" y="256" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <circle cx="276" cy="228" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="276" y="256" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">18</text>
  <path d="M 253 204 C 253 214 253 214 253 220" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="436" y="222" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4、18 都在窗内 ✓</text>
  <text x="392" y="275" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">→ 16 是美丽下标</text>

  <!-- check 2: i = 33 -->
  <text x="60" y="310" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">② i = 33：窗口 [33−15, 33+15] = [18, 48]</text>
  <rect x="276" y="320" width="194" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <line x1="70" y1="352" x2="470" y2="352" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="367" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="470" y="367" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">35</text>
  <circle cx="116" cy="352" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="116" y="380" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <circle cx="276" cy="352" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="276" y="380" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">18</text>
  <path d="M 447 328 C 447 338 447 338 447 344" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="252" y="346" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">18 恰在窗边界 ✓（4 已出窗）</text>
  <text x="392" y="392" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">→ 33 是美丽下标</text>
</svg>
