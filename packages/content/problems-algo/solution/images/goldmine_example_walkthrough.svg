<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：grid=[[0,6,0],[5,8,7],[0,9,0]]，输出 24</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">从 (2,1)=9 出发，DFS 探索 9→8→7 收益最大</text>

  <!-- ===== three grids showing steps ===== -->
  <g font-size="12">
    <!-- Step A: start at 9 -->
    <text x="100" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">① 起点 (2,1)=9</text>
    <rect x="60" y="80" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="75" y="100" text-anchor="middle" fill="#999" font-size="10">0</text>
    <rect x="90" y="80" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="105" y="100" text-anchor="middle" fill="#446688" font-size="10">6</text>
    <rect x="120" y="80" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="135" y="100" text-anchor="middle" fill="#999" font-size="10">0</text>
    <rect x="60" y="110" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="75" y="130" text-anchor="middle" fill="#446688" font-size="10">5</text>
    <rect x="90" y="110" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="105" y="130" text-anchor="middle" fill="#446688" font-size="10">8</text>
    <rect x="120" y="110" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="135" y="130" text-anchor="middle" fill="#446688" font-size="10">7</text>
    <rect x="60" y="140" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="75" y="160" text-anchor="middle" fill="#999" font-size="10">0</text>
    <rect x="90" y="140" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="105" y="160" text-anchor="middle" fill="#b85450" font-weight="bold" font-size="10">9</text>
    <rect x="120" y="140" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="135" y="160" text-anchor="middle" fill="#999" font-size="10">0</text>
    <text x="105" y="184" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">收 9，置 0</text>

    <!-- Step B: move up to 8 -->
    <text x="280" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">② 上移到 (1,1)=8</text>
    <rect x="240" y="80" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="255" y="100" text-anchor="middle" fill="#999" font-size="10">0</text>
    <rect x="270" y="80" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="285" y="100" text-anchor="middle" fill="#446688" font-size="10">6</text>
    <rect x="300" y="80" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="315" y="100" text-anchor="middle" fill="#999" font-size="10">0</text>
    <rect x="240" y="110" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="255" y="130" text-anchor="middle" fill="#446688" font-size="10">5</text>
    <rect x="270" y="110" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="285" y="130" text-anchor="middle" fill="#b85450" font-weight="bold" font-size="10">8</text>
    <rect x="300" y="110" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="315" y="130" text-anchor="middle" fill="#446688" font-size="10">7</text>
    <rect x="240" y="140" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="255" y="160" text-anchor="middle" fill="#999" font-size="10">0</text>
    <rect x="270" y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="285" y="160" text-anchor="middle" fill="#4a7a3a" font-size="10">✓</text>
    <rect x="300" y="140" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="315" y="160" text-anchor="middle" fill="#999" font-size="10">0</text>
    <text x="285" y="184" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">累计 9+8=17</text>

    <!-- Step C: move right to 7 -->
    <text x="460" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">③ 右移到 (1,2)=7</text>
    <rect x="420" y="80" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="435" y="100" text-anchor="middle" fill="#999" font-size="10">0</text>
    <rect x="450" y="80" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="465" y="100" text-anchor="middle" fill="#446688" font-size="10">6</text>
    <rect x="480" y="80" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="495" y="100" text-anchor="middle" fill="#999" font-size="10">0</text>
    <rect x="420" y="110" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="435" y="130" text-anchor="middle" fill="#446688" font-size="10">5</text>
    <rect x="450" y="110" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="465" y="130" text-anchor="middle" fill="#4a7a3a" font-size="10">✓</text>
    <rect x="480" y="110" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="495" y="130" text-anchor="middle" fill="#b85450" font-weight="bold" font-size="10">7</text>
    <rect x="420" y="140" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="435" y="160" text-anchor="middle" fill="#999" font-size="10">0</text>
    <rect x="450" y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="465" y="160" text-anchor="middle" fill="#4a7a3a" font-size="10">✓</text>
    <rect x="480" y="140" width="30" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="495" y="160" text-anchor="middle" fill="#999" font-size="10">0</text>
    <text x="465" y="184" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">累计 17+7=24</text>

    <!-- arrows between grids -->
    <path d="M 160 125 L 230 125" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 340 125 L 410 125" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <!-- ===== legend ===== -->
  <rect x="40" y="210" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="228" font-size="11" fill="#444" font-weight="bold">图例</text>
  <rect x="120" y="220" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="142" y="232" font-size="10" fill="#555">当前格子（刚收集）</text>
  <rect x="270" y="220" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="292" y="232" font-size="10" fill="#555">已访问（置 0，标 ✓）</text>
  <rect x="420" y="220" width="16" height="14" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="442" y="232" font-size="10" fill="#555">空格 / 不可入</text>

  <!-- ===== backtrack note ===== -->
  <rect x="40" y="262" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="282" font-size="12" fill="#d6a040" font-weight="bold">回溯说明</text>
  <text x="60" y="298" font-size="10" fill="#555">从 9 出发也会尝试左 5、上 6 等分支，但收益均不如 9→8→7=24。</text>
  <text x="60" y="312" font-size="10" fill="#555">每条分支结束（四方向均 0）后，grid[i][j] 恢复原值，让其它路径复用。</text>

  <!-- ===== comparison table ===== -->
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">各起点 DFS 最大收益对比</text>
  <g font-size="10">
    <rect x="60" y="356" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="110" y="372" text-anchor="middle" fill="#446688" font-weight="bold">起点</text>
    <rect x="160" y="356" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="240" y="372" text-anchor="middle" fill="#446688" font-weight="bold">最优路径</text>
    <rect x="320" y="356" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="360" y="372" text-anchor="middle" fill="#446688" font-weight="bold">收益</text>
    <rect x="400" y="356" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="450" y="372" text-anchor="middle" fill="#446688" font-weight="bold">是否最优</text>

    <rect x="60" y="380" width="100" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="110" y="395" text-anchor="middle" fill="#555">(0,1)=6</text>
    <rect x="160" y="380" width="160" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="240" y="395" text-anchor="middle" fill="#555">6→8→7</text>
    <rect x="320" y="380" width="80" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="360" y="395" text-anchor="middle" fill="#555">21</text>
    <rect x="400" y="380" width="100" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="450" y="395" text-anchor="middle" fill="#999">否</text>

    <rect x="60" y="402" width="100" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="110" y="417" text-anchor="middle" fill="#555">(1,0)=5</text>
    <rect x="160" y="402" width="160" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="240" y="417" text-anchor="middle" fill="#555">5→8→7</text>
    <rect x="320" y="402" width="80" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="360" y="417" text-anchor="middle" fill="#555">20</text>
    <rect x="400" y="402" width="100" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="450" y="417" text-anchor="middle" fill="#999">否</text>

    <rect x="60" y="424" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="110" y="439" text-anchor="middle" fill="#b85450" font-weight="bold">(2,1)=9</text>
    <rect x="160" y="424" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="240" y="439" text-anchor="middle" fill="#b85450" font-weight="bold">9→8→7</text>
    <rect x="320" y="424" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="360" y="439" text-anchor="middle" fill="#b85450" font-weight="bold">24</text>
    <rect x="400" y="424" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="450" y="439" text-anchor="middle" fill="#b85450" font-weight="bold">✓ 全局最大</text>
  </g>
</svg>
