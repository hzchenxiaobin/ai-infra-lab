<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 游标解锁 + 堆调度</text>

  <!-- Step 1: Sort -->
  <rect x="160" y="46" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">排序：按 enqueueTime 排列任务</text>
  <path d="M 280 80 L 280 98" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Init -->
  <rect x="160" y="98" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始化：time=0, ptr=0, heap=∅</text>
  <path d="M 280 132 L 280 150" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: heap empty and ptr < n? -->
  <polygon points="280,190 380,150 480,190 380,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">heap 空 且</text>
  <text x="380" y="200" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ptr &lt; n ?</text>

  <!-- Yes: jump time -->
  <path d="M 280 190 L 120 190 L 120 218" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="182" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="40" y="218" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="240" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">time = tasks[ptr].enqueueTime</text>
  <path d="M 120 252 L 120 280 L 200 280" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="274" font-size="9.5" fill="#888" filter="url(#rough2)">跳过空转</text>

  <!-- No: go to push -->
  <path d="M 480 190 L 520 190 L 520 280 L 460 280" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="182" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Step 3: Push available tasks -->
  <rect x="200" y="262" width="260" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">while ptr &lt; n 且 enqueueTime ≤ time</text>
  <text x="330" y="300" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">push (procTime, index) 入 heap; ptr++</text>
  <path d="M 330 312 L 330 332" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Pop and execute -->
  <rect x="180" y="332" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="330" y="354" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">pop (procTime, idx) — 堆顶最短</text>
  <text x="330" y="372" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">result.append(idx); time += procTime</text>
  <path d="M 330 382 L 330 402" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: ptr == n and heap empty? -->
  <polygon points="330,438 250,402 330,438 410,402" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="430" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ptr==n 且 heap 空?</text>

  <!-- Loop back -->
  <path d="M 250 420 L 60 420 L 60 170 L 200 170" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="300" font-size="9.5" fill="#888" filter="url(#rough2)">否 → 继续循环</text>

  <!-- End -->
  <path d="M 410 420 L 490 420 L 490 402" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="414" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="430" y="370" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="390" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">返回 result</text>

  <!-- Note -->
  <text x="280" y="452" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每轮 push 多个任务后 pop 一个执行，模拟 CPU 不可抢占</text>
</svg>
