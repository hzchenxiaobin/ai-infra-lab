<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：rectangles = [[1,2],[2,3],[2,5]], points = [[2,1],[1,4]]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">分桶后：h=2→[1], h=3→[2], h=5→[2]，其余桶为空</text>

  <!-- Bucket state visualization -->
  <text x="120" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">桶状态</text>

  <!-- Bucket h=2 -->
  <rect x="40" y="70" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="88" font-size="10" fill="#446688" font-weight="bold">h=2:</text>
  <rect x="85" y="75" width="24" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="97" y="88" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="120" y="88" font-size="9" fill="#888">(l 列表)</text>

  <!-- Bucket h=3 -->
  <rect x="40" y="102" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="120" font-size="10" fill="#d6a040" font-weight="bold">h=3:</text>
  <rect x="85" y="107" width="24" height="16" fill="#fff" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="97" y="120" text-anchor="middle" font-size="9.5" fill="#333">2</text>

  <!-- Bucket h=5 -->
  <rect x="40" y="134" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="152" font-size="10" fill="#4a7a3a" font-weight="bold">h=5:</text>
  <rect x="85" y="139" width="24" height="16" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="97" y="152" text-anchor="middle" font-size="9.5" fill="#333">2</text>

  <!-- Divider -->
  <path d="M 220 70 L 220 370" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- Query P1 (2,1) -->
  <text x="370" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">查询 P₁(2, 1)：遍历 h = 1 → 100</text>

  <!-- Table header for P1 -->
  <rect x="240" y="70" width="40" height="24" fill="#b85450" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">h</text>
  <rect x="280" y="70" width="80" height="24" fill="#b85450" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">l 列表</text>
  <rect x="360" y="70" width="70" height="24" fill="#b85450" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="395" y="86" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">l≥2 个数</text>
  <rect x="430" y="70" width="50" height="24" fill="#b85450" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="455" y="86" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">cnt</text>

  <!-- P1 row: h=2 -->
  <rect x="240" y="96" width="240" height="22" fill="#e8f0fe" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="9.5" fill="#446688">2</text>
  <text x="320" y="111" text-anchor="middle" font-size="9.5" fill="#333">[1]</text>
  <text x="395" y="111" text-anchor="middle" font-size="9.5" fill="#b85450">0</text>
  <text x="455" y="111" text-anchor="middle" font-size="9.5" fill="#333">0</text>

  <!-- P1 row: h=3 -->
  <rect x="240" y="120" width="240" height="22" fill="#fff8e1" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="9.5" fill="#d6a040">3</text>
  <text x="320" y="135" text-anchor="middle" font-size="9.5" fill="#333">[2]</text>
  <text x="395" y="135" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1</text>
  <text x="455" y="135" text-anchor="middle" font-size="9.5" fill="#333">1</text>

  <!-- P1 row: h=5 -->
  <rect x="240" y="144" width="240" height="22" fill="#e6f4ea" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="260" y="159" text-anchor="middle" font-size="9.5" fill="#4a7a3a">5</text>
  <text x="320" y="159" text-anchor="middle" font-size="9.5" fill="#333">[2]</text>
  <text x="395" y="159" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1</text>
  <text x="455" y="159" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2 ★</text>

  <!-- P1 result -->
  <rect x="240" y="170" width="240" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans[0] = 2  ✓ (R₂, R₃ 包含 P₁)</text>

  <!-- Divider between P1 and P2 -->
  <path d="M 240 200 L 480 200" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- Query P2 (1,4) -->
  <text x="370" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">查询 P₂(1, 4)：遍历 h = 4 → 100</text>

  <!-- Table header for P2 -->
  <rect x="240" y="224" width="40" height="24" fill="#b85450" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">h</text>
  <rect x="280" y="224" width="80" height="24" fill="#b85450" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="320" y="240" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">l 列表</text>
  <rect x="360" y="224" width="70" height="24" fill="#b85450" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="395" y="240" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">l≥1 个数</text>
  <rect x="430" y="224" width="50" height="24" fill="#b85450" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="455" y="240" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">cnt</text>

  <!-- P2 row: h=5 -->
  <rect x="240" y="250" width="240" height="22" fill="#e6f4ea" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="260" y="265" text-anchor="middle" font-size="9.5" fill="#4a7a3a">5</text>
  <text x="320" y="265" text-anchor="middle" font-size="9.5" fill="#333">[2]</text>
  <text x="395" y="265" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1</text>
  <text x="455" y="265" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1 ★</text>

  <!-- P2 result -->
  <rect x="240" y="276" width="240" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="292" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans[1] = 1  ✓ (仅 R₃ 包含 P₂)</text>

  <!-- Summary box -->
  <rect x="40" y="310" width="440" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最终输出：[2, 1]</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#555">P₁(2,1)：h≥1 的非空桶有 h=2,3,5 → 各桶二分 l≥2 → 0+1+1=2</text>
  <text x="260" y="365" text-anchor="middle" font-size="10" fill="#555">P₂(1,4)：h≥4 的非空桶仅 h=5 → 二分 l≥1 → 1=1</text>
</svg>
