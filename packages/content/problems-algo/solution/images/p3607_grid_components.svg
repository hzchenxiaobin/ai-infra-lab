<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：电网（连通分量）固定，在线集合可变</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">离线不改变连接性 ⇒ 分量划分全程不变，变的只是每个分量里「谁在线」</text>

  <!-- ============ Band 1: 分量划分 + 在线集合 ============ -->
  <text x="40" y="60" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 预处理：电站 → 电网（连通分量）</text>
  <text x="310" y="60" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 每个电网一个升序「在线集合」</text>

  <!-- 电网 A：链 1-5 -->
  <g filter="url(#rough2)">
    <rect x="42" y="68" width="238" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
    <text x="54" y="84" font-size="9.5" fill="#446688" font-weight="bold">电网 A</text>
    <line x1="89" y1="115" x2="109" y2="115" stroke="#446688" stroke-width="1.6"/>
    <line x1="135" y1="115" x2="155" y2="115" stroke="#446688" stroke-width="1.6"/>
    <line x1="181" y1="115" x2="201" y2="115" stroke="#446688" stroke-width="1.6"/>
    <line x1="227" y1="115" x2="247" y2="115" stroke="#446688" stroke-width="1.6"/>
    <circle cx="76" cy="115" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="122" cy="115" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="168" cy="115" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="214" cy="115" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="260" cy="115" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="76" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <text x="122" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
    <text x="168" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
    <text x="214" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
    <text x="260" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  </g>

  <!-- 电网 B / C：孤立站 -->
  <g filter="url(#rough2)">
    <rect x="42" y="142" width="112" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
    <circle cx="74" cy="164" r="13" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="74" y="169" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">6</text>
    <text x="98" y="168" font-size="9.5" fill="#4a7a3a" font-weight="bold">电网 B</text>

    <rect x="170" y="142" width="112" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
    <circle cx="202" cy="164" r="13" fill="#ffffff" stroke="#d6a040" stroke-width="1.8"/>
    <text x="202" y="169" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">7</text>
    <text x="226" y="168" font-size="9.5" fill="#8a6d1f" font-weight="bold">电网 C</text>
  </g>

  <text x="42" y="200" font-size="8.5" fill="#666" filter="url(#rough2)">示例：c=7，connections=[[1,2],[2,3],[3,4],[4,5]]；6、7 无连接 ⇒ 各自独成一个电网</text>

  <!-- 映射箭头 -->
  <path d="M 288 101 L 306 101" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="297" y="93" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">cid[v]</text>

  <!-- 右侧：在线集合 -->
  <g filter="url(#rough2)">
    <text x="322" y="106" font-size="10" fill="#2a5a2a" font-weight="bold">A:</text>
    <rect x="336" y="87" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="372" y="87" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="408" y="87" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="444" y="87" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="480" y="87" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="352" y="106" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">1</text>
    <text x="388" y="106" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">2</text>
    <text x="424" y="106" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">3</text>
    <text x="460" y="106" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">4</text>
    <text x="496" y="106" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">5</text>

    <text x="318" y="170" font-size="10" fill="#2a5a2a" font-weight="bold">B:</text>
    <rect x="334" y="150" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="350" y="169" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">6</text>
    <text x="388" y="170" font-size="10" fill="#8a6d1f" font-weight="bold">C:</text>
    <rect x="404" y="150" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="420" y="169" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">7</text>

    <text x="424" y="196" text-anchor="middle" font-size="8.5" fill="#666">升序 ⇒ 最小编号在线站一眼可见</text>
  </g>

  <!-- ============ Band 2: 查询 ============ -->
  <text x="40" y="212" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 两类查询都只碰「在线集合」，不碰图结构</text>

  <!-- 左：[2,x] 删除 -->
  <g filter="url(#rough2)">
    <rect x="30" y="220" width="262" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="161" y="238" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[2, x]：x 离线 → 从其集合删除（幂等）</text>

    <text x="44" y="266" font-size="9.5" fill="#333">删 1 后:</text>
    <rect x="100" y="248" width="28" height="24" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <path d="M 104 252 L 124 268 M 124 252 L 104 268" stroke="#b85450" stroke-width="1.6"/>
    <text x="114" y="265" text-anchor="middle" font-size="10.5" fill="#bbb" font-weight="bold">1</text>
    <rect x="132" y="248" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="164" y="248" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="196" y="248" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="228" y="248" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="146" y="265" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">2</text>
    <text x="178" y="265" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">3</text>
    <text x="210" y="265" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">4</text>
    <text x="242" y="265" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">5</text>

    <text x="44" y="300" font-size="9.5" fill="#333">删 2 后:</text>
    <rect x="100" y="282" width="28" height="24" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <path d="M 104 286 L 124 302 M 124 286 L 104 302" stroke="#b85450" stroke-width="1.6"/>
    <text x="114" y="299" text-anchor="middle" font-size="10.5" fill="#bbb" font-weight="bold">2</text>
    <rect x="132" y="282" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="164" y="282" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="196" y="282" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="146" y="299" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">3</text>
    <text x="178" y="299" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">4</text>
    <text x="210" y="299" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">5</text>

    <text x="161" y="318" text-anchor="middle" font-size="8.5" fill="#b85450">erase(x)：对已离线的站再删一次也不出错</text>
  </g>

  <!-- 右：[1,x] 三岔 -->
  <g filter="url(#rough2)">
    <rect x="310" y="220" width="222" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="421" y="238" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">[1, x]：三岔判定</text>
    <text x="322" y="258" font-size="9.5" fill="#333">✓ x 在线（在集合中）→ 返回 x</text>
    <text x="322" y="276" font-size="9.5" fill="#333">✗ x 离线 &amp; 集合非空 → 返回最小元素</text>
    <text x="322" y="294" font-size="9.5" fill="#333">✗ 该电网集合已空 → 返回 −1</text>
    <text x="322" y="314" font-size="9" fill="#555">例 [1,2]：2 已删 → 答案 = min{3,4,5} = </text>
    <text x="446" y="315" font-size="11" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- ============ Band 3: 结论 ============ -->
  <g filter="url(#rough2)">
    <rect x="40" y="340" width="492" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="286" y="360" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">结论：查询与图结构无关，只与每个分量的「在线集合」有关</text>
    <text x="286" y="378" text-anchor="middle" font-size="9.5" fill="#333">① 并查集/DFS 预处理分量编号 cid[v]　② 每个分量维护一个升序在线集合（set / 最小堆+懒删除）</text>
    <text x="286" y="392" text-anchor="middle" font-size="9.5" fill="#333">③ [2,x]：erase(x)；[1,x]：在→x，不在→*begin()，空→−1 —— 每个查询 O(log c)</text>
  </g>
</svg>
