<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="560" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口求最短替换子串</text>

  <!-- Init -->
  <rect x="80" y="44" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="86" text-anchor="middle" font-size="11" fill="#555">统计 cnt[c]，target = n/4，left = 0，ans = n</text>

  <path d="M 230 104 L 230 122" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Check already balanced -->
  <polygon points="230,126 380,166 230,206 80,166" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">所有 cnt ≤ target ?</text>
  <text x="230" y="180" text-anchor="middle" font-size="10.5" fill="#777">原串已平衡？</text>

  <!-- Yes: return 0 -->
  <path d="M 80 166 L 30 166 L 30 210" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="36" y="158" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="-10" y="214" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="30" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return 0</text>

  <!-- No: enter loop -->
  <path d="M 380 166 L 430 166 L 430 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="392" y="158" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Loop entry -->
  <rect x="70" y="224" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="244" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for right in 0..n−1</text>
  <text x="230" y="260" text-anchor="middle" font-size="10.5" fill="#555">右指针遍历每个位置</text>

  <path d="M 230 272 L 230 290" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- cnt[s[right]]-- -->
  <rect x="100" y="294" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="319" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt[s[right]]−−</text>

  <path d="M 230 338 L 230 356" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: all cnt <= target? -->
  <polygon points="230,360 380,406 230,452 80,406" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="402" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">所有 cnt ≤ target ?</text>
  <text x="230" y="420" text-anchor="middle" font-size="10.5" fill="#777">窗口外均不超限？</text>

  <!-- Yes branch: shrink -->
  <path d="M 80 406 L 30 406 L 30 460" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="36" y="398" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="-14" y="464" width="88" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="30" y="484" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">收缩左端</text>
  <text x="30" y="500" text-anchor="middle" font-size="10" fill="#555">ans = min(</text>
  <text x="30" y="514" text-anchor="middle" font-size="10" fill="#555">  ans, r−l+1)</text>
  <text x="30" y="528" text-anchor="middle" font-size="10" fill="#555">cnt[s[l]]++;</text>
  <text x="30" y="540" text-anchor="middle" font-size="10" fill="#555">left++</text>

  <!-- No branch -->
  <path d="M 380 406 L 430 406 L 430 460" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="392" y="398" font-size="11" fill="#82b366" font-weight="bold">No</text>
  <rect x="386" y="464" width="88" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="482" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">继续扩展</text>
  <text x="430" y="496" text-anchor="middle" font-size="10" fill="#555">right++</text>

  <!-- loop back from shrink -->
  <path d="M 30 464 L 30 360 L 78 406" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="14" y="412" font-size="9.5" fill="#aaa" transform="rotate(-90 14 412)">while 循环</text>

  <!-- loop back from no branch -->
  <path d="M 430 504 L 430 246 L 392 246" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="442" y="380" font-size="9.5" fill="#aaa" transform="rotate(-90 442 380)">for 循环</text>

  <!-- final -->
  <text x="230" y="548" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">遍历结束 → return ans （O(n), O(1)）</text>
</svg>
