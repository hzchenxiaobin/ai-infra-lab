<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个相邻词对比较</text>

  <!-- ===== 示例 1 ===== -->
  <rect x="30" y="42" width="500" height="100" fill="none" stroke="#e6f4ea" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="60" font-size="11" fill="#4a7a3a" font-weight="bold">示例 1：words=["hello","leetcode"], order="hlabcdefg…" → true</text>

  <text x="44" y="84" font-size="10" fill="#888">w₁</text>
  <rect x="78" y="70" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">h</text>
  <rect x="110" y="70" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">e</text>
  <rect x="142" y="70" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">l</text>
  <rect x="174" y="70" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="189" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">l</text>
  <rect x="206" y="70" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="221" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">o</text>

  <text x="44" y="116" font-size="10" fill="#888">w₂</text>
  <rect x="78" y="102" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">l</text>
  <rect x="110" y="102" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">e</text>
  <rect x="142" y="102" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">e</text>
  <rect x="174" y="102" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="189" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">t</text>

  <text x="250" y="94" font-size="11" fill="#4a7a3a" font-weight="bold">rank[h]=0 &lt; rank[l]=1</text>
  <text x="250" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">⇒ w₁ &lt; w₂ ✓</text>

  <!-- ===== 示例 2 ===== -->
  <rect x="30" y="156" width="500" height="100" fill="none" stroke="#fce4ec" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="174" font-size="11" fill="#b85450" font-weight="bold">示例 2：words=["word","world",…], order="worldabcef…" → false</text>

  <text x="44" y="198" font-size="10" fill="#888">w₁</text>
  <rect x="78" y="184" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="93" y="202" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">w</text>
  <rect x="110" y="184" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="202" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">o</text>
  <rect x="142" y="184" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157" y="202" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">r</text>
  <rect x="174" y="184" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">d</text>

  <text x="44" y="230" font-size="10" fill="#888">w₂</text>
  <rect x="78" y="216" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="93" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">w</text>
  <rect x="110" y="216" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">o</text>
  <rect x="142" y="216" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">r</text>
  <rect x="174" y="216" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">l</text>
  <rect x="206" y="216" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="221" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">d</text>

  <text x="250" y="208" font-size="11" fill="#b85450" font-weight="bold">rank[d]=4 &gt; rank[l]=3</text>
  <text x="250" y="224" font-size="11" fill="#b85450" font-weight="bold">⇒ w₁ &gt; w₂ ✗ return false</text>

  <!-- ===== 示例 3 ===== -->
  <rect x="30" y="270" width="500" height="100" fill="none" stroke="#fce4ec" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="288" font-size="11" fill="#b85450" font-weight="bold">示例 3：words=["apple","app"], order="abcdef…" → false</text>

  <text x="44" y="312" font-size="10" fill="#888">w₁</text>
  <rect x="78" y="298" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="93" y="316" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <rect x="110" y="298" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="316" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">p</text>
  <rect x="142" y="298" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157" y="316" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">p</text>
  <rect x="174" y="298" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">l</text>
  <rect x="206" y="298" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">e</text>

  <text x="44" y="344" font-size="10" fill="#888">w₂</text>
  <rect x="78" y="330" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="93" y="348" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <rect x="110" y="330" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="348" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">p</text>
  <rect x="142" y="330" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157" y="348" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">p</text>

  <text x="250" y="322" font-size="11" fill="#b85450" font-weight="bold">无首异，w₂ 是 w₁ 前缀</text>
  <text x="250" y="338" font-size="11" fill="#b85450" font-weight="bold">但 len(w₁)=5 &gt; len(w₂)=3</text>
  <text x="250" y="354" font-size="11" fill="#b85450" font-weight="bold">⇒ w₁ &gt; w₂ ✗ return false</text>

  <!-- 底部总结 -->
  <rect x="30" y="384" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">首异字符定序（例1·2）；无首异则前缀规则：短者在前（例3）</text>
  <text x="280" y="420" text-anchor="middle" font-size="10.5" fill="#446688">相邻对全过 ⇒ 整体有序 ⇒ true</text>
</svg>
