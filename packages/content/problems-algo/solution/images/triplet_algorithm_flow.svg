<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="480" fill="#fafafa"/>
  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心双阈值流程：O(n) 一趟扫描</text>

  <!-- init -->
  <rect x="120" y="44" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">first = +∞, second = +∞</text>
  <text x="240" y="80" text-anchor="middle" font-size="10.5" fill="#555">i = 0</text>

  <path d="M 240 88 L 240 104" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop check -->
  <polygon points="240,108 350,148 240,188 130,148" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="240" y="162" text-anchor="middle" font-size="10.5" fill="#777">还有元素？</text>

  <!-- No -> return false -->
  <path d="M 350 148 L 420 148 L 420 240" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="368" y="140" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="340" y="244" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <text x="400" y="282" text-anchor="middle" font-size="10" fill="#888">没找到三元组</text>

  <!-- Yes down -->
  <path d="M 240 188 L 240 210" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="258" y="204" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- x = nums[i] -->
  <rect x="140" y="214" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="236" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">x = nums[i]</text>

  <path d="M 240 248 L 240 264" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond: x > second ? -->
  <polygon points="240,268 360,308 240,348 120,308" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x &gt; second ?</text>
  <text x="240" y="322" text-anchor="middle" font-size="10.5" fill="#777">找到第三个？</text>

  <!-- Yes -> return true -->
  <path d="M 360 308 L 420 308 L 420 374" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="378" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="340" y="378" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true ✓</text>
  <text x="400" y="416" text-anchor="middle" font-size="10" fill="#888">(first, second, x)</text>

  <!-- No -> next diamond -->
  <path d="M 240 348 L 240 366" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="258" y="362" font-size="10" fill="#b85450" font-weight="bold">No</text>

  <!-- diamond: x > first ? -->
  <polygon points="240,370 340,406 240,442 140,406" fill="#f0f0f0" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="402" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">x &gt; first ?</text>

  <!-- Yes -> second = x (left) -->
  <path d="M 140 406 L 70 406 L 70 360" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="92" y="398" font-size="10" fill="#d6a040" font-weight="bold">Yes</text>
  <rect x="20" y="324" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="347" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">second = x</text>

  <!-- No -> first = x (right bottom) -->
  <path d="M 340 406 L 380 406 L 380 448" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="352" y="398" font-size="10" fill="#b85450" font-weight="bold">No</text>

  <!-- first = x and second = x both loop back -->
  <!-- first = x box placed at bottom -->
  <rect x="310" y="448" width="100" height="0" fill="none"/>

  <text x="380" y="442" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">first = x</text>

  <!-- loop back arrows: from second=x and first=x back to loop top -->
  <path d="M 70 324 L 70 148 L 130 148" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="40" y="236" font-size="9.5" fill="#888" transform="rotate(-90, 40, 236)">i++, 回到循环</text>

  <path d="M 380 442 L 380 452 L 60 452 L 60 148 L 130 148" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
</svg>
