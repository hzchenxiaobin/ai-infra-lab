<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="452" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="30" y="32" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：转移 = 直线族取 min —— 单调队列维护下凸壳</text>
  <text x="30" y="52" font-size="11.5" fill="#888" filter="url(#rough2)">以 nums=[5,1,2,1], k=2 的 t=2 层为例：P=[0,5,6,8,9]，查询点 6/8/9</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="300" x2="70" y2="58" stroke="#777" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="60" y1="139" x2="434" y2="139" stroke="#777" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="60" font-size="10.5" fill="#555" filter="url(#rough2)">y = min&#8342; &#8467;&#8342;(x)</text>
  <text x="432" y="126" font-size="11" fill="#555" text-anchor="end" filter="url(#rough2)">x = P[i] 递增 →</text>

  <!-- 三条直线 -->
  <line x1="70" y1="70" x2="430" y2="290" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="111" y1="70" x2="411" y2="290" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="180" y1="70" x2="405" y2="290" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <!-- 下凸壳（红色粗线） -->
  <path d="M 70,70 L 318,221 L 385,271 L 405,290" fill="none" stroke="#b85450" stroke-width="3.5" filter="url(#rough2)"/>
  <circle cx="318" cy="221" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="385" cy="271" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="324" y="210" font-size="10.5" fill="#b85450" filter="url(#rough2)">ℓ₁∩ℓ₂ (x=11)</text>
  <text x="390" y="262" font-size="10.5" fill="#b85450" filter="url(#rough2)">ℓ₂∩ℓ₃ (x=14)</text>

  <!-- 交点 x 轴刻度 -->
  <text x="318" y="153" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">11</text>
  <text x="385" y="153" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">14</text>

  <!-- 查询点：竖直虚线 + 顶标 + 轴刻度 + 包络点 -->
  <line x1="205" y1="98" x2="205" y2="148" stroke="#999" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="250" y1="98" x2="250" y2="176" stroke="#999" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="272" y1="98" x2="272" y2="190" stroke="#999" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="205" y="92" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">P[2]</text>
  <text x="244" y="80" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">P[3]</text>
  <text x="273" y="92" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">P[4]</text>
  <text x="199" y="153" font-size="11" fill="#555" text-anchor="end" filter="url(#rough2)">6</text>
  <text x="244" y="153" font-size="11" fill="#555" text-anchor="end" filter="url(#rough2)">8</text>
  <text x="266" y="153" font-size="11" fill="#555" text-anchor="end" filter="url(#rough2)">9</text>
  <circle cx="205" cy="152" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="250" cy="180" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="272" cy="194" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="196" y="168" font-size="10" fill="#b85450" text-anchor="end" filter="url(#rough2)">−5</text>
  <text x="244" y="196" font-size="10" fill="#b85450" text-anchor="end" filter="url(#rough2)">−15</text>
  <text x="266" y="210" font-size="10" fill="#b85450" text-anchor="end" filter="url(#rough2)">−20</text>

  <!-- 图例 -->
  <rect x="438" y="62" width="118" height="124" rx="6" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="444" y1="74" x2="460" y2="74" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="78" font-size="10.5" fill="#333" filter="url(#rough2)">ℓ₁ (j=1)</text>
  <text x="464" y="92" font-size="10" fill="#446688" filter="url(#rough2)">y=−5x+25</text>
  <line x1="444" y1="106" x2="460" y2="106" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="110" font-size="10.5" fill="#333" filter="url(#rough2)">ℓ₂ (j=2)</text>
  <text x="464" y="124" font-size="10" fill="#4a7a3a" filter="url(#rough2)">y=−6x+36</text>
  <line x1="444" y1="138" x2="460" y2="138" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="142" font-size="10.5" fill="#333" filter="url(#rough2)">ℓ₃ (j=3)</text>
  <text x="464" y="156" font-size="10" fill="#d6a040" filter="url(#rough2)">y=−8x+64</text>
  <line x1="444" y1="170" x2="460" y2="170" stroke="#b85450" stroke-width="3.5" filter="url(#rough2)"/>
  <text x="464" y="174" font-size="10.5" fill="#b85450" filter="url(#rough2)">下凸壳=min</text>

  <!-- 标注框：查询点全在 ℓ₁ 管辖区 -->
  <rect x="75" y="240" width="185" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="258" font-size="11" fill="#b85450" filter="url(#rough2)">查询点 6/8/9 全落在 x&lt;11</text>
  <text x="85" y="274" font-size="11" fill="#b85450" filter="url(#rough2)">⇒ 队首 ℓ₁ 直接命中，队首未弹</text>
  <path d="M 258,258 L 250,198" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 底部：双端队列示意 -->
  <text x="30" y="318" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">双端队列维护下凸壳：队首 → 队尾，斜率严格递减（本例 t=2 层）</text>

  <rect x="60" y="330" width="92" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="106" y="350" font-size="13" font-weight="bold" fill="#446688" text-anchor="middle" filter="url(#rough2)">ℓ₁</text>
  <text x="106" y="365" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">m=−5</text>
  <rect x="162" y="330" width="92" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="208" y="350" font-size="13" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">ℓ₂</text>
  <text x="208" y="365" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">m=−6</text>
  <rect x="264" y="330" width="92" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="350" font-size="13" font-weight="bold" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">ℓ₃</text>
  <text x="310" y="365" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">m=−8</text>

  <text x="106" y="388" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">队首</text>
  <text x="310" y="388" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">队尾</text>

  <!-- 队首弹出 -->
  <path d="M 56,352 L 20,372" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="14" y="402" font-size="10" fill="#b85450" filter="url(#rough2)">队首弹出：被反超</text>
  <!-- 队尾入队 -->
  <path d="M 430,338 L 364,346" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="366" y="330" font-size="10" fill="#4a7a3a" filter="url(#rough2)">队尾入：新线（斜率更小）</text>
  <!-- 队尾弹出 -->
  <path d="M 360,372 L 428,384" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="400" font-size="10" fill="#b85450" filter="url(#rough2)">队尾弹：被新线压扁</text>

  <!-- 结论 -->
  <rect x="24" y="416" width="376" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="435" font-size="12" fill="#7a5c14" filter="url(#rough2)">每条直线至多入队 / 出队一次 ⇒ 均摊 O(1) ⇒ 总复杂度 O(k·n)</text>
</svg>
