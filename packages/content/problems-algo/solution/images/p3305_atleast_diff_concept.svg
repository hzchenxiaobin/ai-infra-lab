<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：恰好 k = 至少 k − 至少 k+1</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">元音「齐全」两个条件都保留，只把不单调的「恰好」拆成两个单调的「至少」之差</text>

  <!-- 左半：单调性 -->
  <text x="138" y="66" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 单调性：扩窗「只增不减」</text>

  <!-- 字符格子 i e a o u q q i -->
  <rect x="28" y="92" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="41" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="54" y="92" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="67" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">e</text>
  <rect x="80" y="92" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="106" y="92" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">o</text>
  <rect x="132" y="92" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">u</text>
  <rect x="158" y="92" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">q</text>
  <rect x="184" y="92" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">q</text>
  <rect x="210" y="92" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>

  <!-- 窗口框 -->
  <rect x="26" y="88" width="158" height="34" fill="none" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="105" y="82" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">窗口 [left..right]</text>
  <path d="M 188 105 L 214 105" fill="none" stroke="#a07830" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="201" y="97" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">扩窗</text>

  <text x="138" y="138" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">加字符 ⇒ 元音种类不减 ↗、辅音数不减 ↗</text>

  <rect x="28" y="152" width="216" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="171" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">「元音齐 &amp; 辅音 ≥ m」</text>
  <text x="136" y="188" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">扩窗后仍满足 ✓ → 可以滑窗</text>

  <rect x="28" y="208" width="216" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="227" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">「辅音 = k（恰好）」</text>
  <text x="136" y="244" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">扩窗随时破坏 ✗ → 不能直接滑窗</text>

  <!-- 分隔线 -->
  <path d="M 262 62 L 262 290" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- 右半：容斥 -->
  <text x="392" y="66" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 容斥：一减挖掉「过多」</text>

  <ellipse cx="392" cy="158" rx="100" ry="66" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="392" cy="182" rx="66" ry="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="392" y="130" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">元音齐 &amp; 辅音 ≥ k</text>
  <text x="392" y="146" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">atLeast(k)</text>
  <text x="392" y="178" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">辅音 ≥ k+1</text>
  <text x="392" y="193" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">atLeast(k+1)</text>

  <path d="M 448 234 C 440 218, 436 212, 430 204" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="246" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">减完剩下的环形区域 = 恰好 k 个辅音</text>

  <rect x="292" y="258" width="200" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="282" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">ans = atLeast(k) − atLeast(k+1)</text>

  <!-- 底部备注 -->
  <rect x="20" y="310" width="480" height="78" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="330" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">💡 滑窗怎么数（shrink while valid）</text>
  <text x="34" y="348" font-size="10.5" fill="#555" filter="url(#rough2)">· 固定左端点 left：合法右端点连成后缀段，right 是 left 的最小合法右端点</text>
  <text x="34" y="365" font-size="10.5" fill="#555" filter="url(#rough2)">· 每次收缩一揽子计数：ans += n − right（此后所有延伸全部合法）</text>
  <text x="34" y="382" font-size="10.5" fill="#555" filter="url(#rough2)">· 主函数跑两遍相减；m = k+1 永不满足时 atLeast 自然返回 0</text>
</svg>
