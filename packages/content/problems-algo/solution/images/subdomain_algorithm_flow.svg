<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：拆分 → 枚举后缀 → 哈希累加 → 格式化输出</text>

  <!-- Start -->
  <ellipse cx="280" cy="56" rx="90" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#333">cnt = {}，遍历 cpdomains</text>

  <path d="M 280 74 L 280 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision -->
  <polygon points="280,92 400,134 280,176 160,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#333">还有下一条 cp？</text>
  <text x="280" y="144" text-anchor="middle" font-size="10" fill="#888">(共 n 条记录)</text>

  <!-- No -> output -->
  <path d="M 400 134 L 470 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="126" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="430" y="116" width="118" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="489" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">遍历 cnt</text>
  <text x="489" y="148" text-anchor="middle" font-size="10" fill="#333">拼 "c d" 返回</text>

  <!-- Yes: split -->
  <path d="M 280 176 L 280 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="186" font-size="10" fill="#82b366">是</text>

  <rect x="130" y="194" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333">按空格拆：c, domain = cp.split()</text>

  <path d="M 280 228 L 280 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner loop -->
  <polygon points="280,246 400,288 280,330 160,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#333">还有下一个后缀？</text>
  <text x="280" y="298" text-anchor="middle" font-size="10" fill="#888">(枚举 i=0..段数-1)</text>

  <!-- inner no -> back to outer loop -->
  <path d="M 160 288 L 90 288 L 90 134 L 160 134" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="210" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 82 210)">下一条记录</text>

  <!-- inner yes: += -->
  <path d="M 280 330 L 280 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="340" font-size="10" fill="#82b366">是</text>

  <rect x="120" y="348" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#333">sub = '.'.join(parts[i:])</text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt[sub] += c</text>

  <!-- back to inner loop -->
  <path d="M 280 388 L 280 402 L 470 402 L 470 288 L 400 288" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="345" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 462 345)">下一个后缀</text>

  <!-- summary -->
  <text x="280" y="436" text-anchor="middle" font-size="10" fill="#888">每条记录枚举至多 L 个后缀，哈希聚合 → O(n·L)</text>
</svg>
