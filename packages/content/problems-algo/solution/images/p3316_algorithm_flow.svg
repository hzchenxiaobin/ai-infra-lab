<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a6a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次填表，O(n·m)</text>

  <!-- 框1：canDel -->
  <rect x="90" y="42" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">① canDel[]：targetIndices → 布尔标记数组</text>
  <text x="260" y="77" text-anchor="middle" font-size="9.5" fill="#668" filter="url(#rough2)">O(1) 判定「下标 i 可删？」（升序互异，直接置位）</text>

  <path d="M 260 86 L 260 100" stroke="#7a6a3a" stroke-width="1.8" fill="none" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <!-- 框2：初始化 -->
  <rect x="90" y="104" width="340" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">② 初始化 dp</text>
  <text x="260" y="143" text-anchor="middle" font-size="9.5" fill="#668" filter="url(#rough2)">dp[0][0]=0；dp[i][0]=前 i 个可删数；dp[0][j&gt;0]=−∞</text>

  <path d="M 260 156 L 260 170" stroke="#7a6a3a" stroke-width="1.8" fill="none" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <!-- 框3：循环体（左侧双竖线 = for 符号） -->
  <rect x="80" y="174" width="360" height="88" fill="#fffdf5" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <line x1="70" y1="180" x2="70" y2="256" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="60" y1="180" x2="60" y2="256" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="60" y1="180" x2="70" y2="180" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="60" y1="256" x2="70" y2="256" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="266" y="193" text-anchor="middle" font-size="11" fill="#8a6510" font-weight="bold" filter="url(#rough2)">③ for i = 1..n，j = 1..m（双重循环）</text>
  <text x="266" y="211" text-anchor="middle" font-size="10" fill="#8a6510" filter="url(#rough2)">best = dp[i−1][j] + canDel[i−1]　（删 +1 / 跳过 +0）</text>
  <text x="266" y="229" text-anchor="middle" font-size="10" fill="#8a6510" filter="url(#rough2)">若 s[i−1] == p[j−1]：best = max(best, dp[i−1][j−1])</text>
  <text x="266" y="247" text-anchor="middle" font-size="10" fill="#8a6510" filter="url(#rough2)">dp[i][j] = best</text>

  <path d="M 260 262 L 260 276" stroke="#7a6a3a" stroke-width="1.8" fill="none" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <!-- 框4：返回 -->
  <rect x="90" y="280" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ 返回 dp[n][m]（题目保证 pattern 是子序列 ⇒ ≥ 0）</text>

  <!-- 底部徽注 -->
  <text x="260" y="342" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">时间 O(n·m) ≈ 9×10⁶ 个状态 ｜ 空间 O(n·m)，滚动数组可压至 O(m)</text>
</svg>
