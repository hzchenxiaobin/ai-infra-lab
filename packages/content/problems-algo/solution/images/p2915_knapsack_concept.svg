<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">子序列选数 → 0-1 背包「恰好装满求最多件数」</text>

  <!-- nums row -->
  <text x="24" y="64" font-size="12" fill="#888">nums:</text>
  <rect x="72" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="67" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="116" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="67" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="160" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="67" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="204" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="67" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="248" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="67" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="330" y="48" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="67" text-anchor="middle" font-size="12" fill="#333">target = 9</text>

  <!-- mapping arrows -->
  <path d="M 160 84 Q 170 108 180 106" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="120" y="104" font-size="10" fill="#d6a040">逐个元素决策</text>

  <!-- mapping table -->
  <text x="24" y="136" font-size="12" fill="#446688" font-weight="bold">翻译成背包语言：</text>
  <rect x="24" y="146" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="166" text-anchor="middle" font-size="11" fill="#333">子序列选元素 ↔ 选物品（每件至多 1 次）</text>
  <rect x="24" y="184" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="204" text-anchor="middle" font-size="11" fill="#333">元素之和 = j ↔ 容量恰好 j（不放回）</text>
  <rect x="24" y="222" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="134" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">子序列长度 ↔ 物品件数 → 求最多！</text>

  <!-- dp definition -->
  <rect x="270" y="146" width="230" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="385" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">状态定义</text>
  <text x="385" y="192" text-anchor="middle" font-size="11" fill="#555">dp[j] = 和恰好为 j 的最长子序列长度</text>
  <text x="385" y="212" text-anchor="middle" font-size="11" fill="#555">dp[0] = 0（空子序列）</text>
  <text x="385" y="232" text-anchor="middle" font-size="11" fill="#b85450">其余初始化为 -1 = 「不可达」哨兵</text>

  <!-- greedy counterexample -->
  <rect x="24" y="272" width="476" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="262" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠ 贪心（从小到大选）不成立</text>
  <text x="262" y="318" text-anchor="middle" font-size="11" fill="#333">nums = [3,3,4]，target = 7</text>
  <text x="262" y="338" text-anchor="middle" font-size="11" fill="#555">贪心：3+3=6，再 +4 = 10 &gt; 7 → 误判无解</text>
  <text x="262" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a">实际：3+4 = 7 ✓（放弃一个 3 换来全局可行）</text>
  <text x="262" y="376" text-anchor="middle" font-size="11" fill="#888">→ 局部最优挡住了全局组合，必须枚举决策 → DP</text>
</svg>
