<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4, 2, 5]，预期 6 次</text>

  <!-- column headers -->
  <text x="70" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">元素</text>
  <text x="170" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">位2(×4)</text>
  <text x="230" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">位1(×2)</text>
  <text x="290" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">位0(×1)</text>
  <text x="400" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">popcount</text>
  <text x="510" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">bit_length</text>

  <!-- header underline -->
  <rect x="40" y="66" width="520" height="2" fill="#ddd" filter="url(#rough2)"/>

  <!-- row 4 = 100 -->
  <rect x="40" y="72" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="140" y="72" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="95" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="200" y="72" width="60" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="95" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="260" y="72" width="60" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="290" y="95" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <text x="400" y="95" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="510" y="95" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>

  <!-- row 2 = 010 -->
  <rect x="40" y="110" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="140" y="110" width="60" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="170" y="133" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="200" y="110" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="133" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="260" y="110" width="60" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="290" y="133" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <text x="400" y="133" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="510" y="133" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>

  <!-- row 5 = 101 -->
  <rect x="40" y="148" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="140" y="148" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="171" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="200" y="148" width="60" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="171" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="260" y="148" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="171" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="400" y="171" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="510" y="171" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>

  <!-- brace for mul columns -->
  <path d="M 140 196 Q 200 208 260 196" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="200" y="224" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3 列 → max bit_length − 1 = 3 − 1 = 2 次 mul</text>

  <!-- summary boxes -->
  <rect x="40" y="240" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125" y="260" text-anchor="middle" font-size="11" fill="#555">加法次数</text>
  <text x="125" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1 + 1 + 2 = 4</text>

  <rect x="215" y="240" width="170" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="260" text-anchor="middle" font-size="11" fill="#555">乘法次数</text>
  <text x="300" y="278" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">max(3,2,3) − 1 = 2</text>

  <rect x="390" y="240" width="170" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="260" text-anchor="middle" font-size="11" fill="#555">总次数</text>
  <text x="475" y="278" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4 + 2 = 6 ✓</text>

  <!-- operation sequence -->
  <text x="300" y="312" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">对应正向操作序列（4 次 add + 2 次 mul）</text>

  <rect x="30" y="324" width="540" height="76" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <text x="42" y="346">[0,0,0]</text>
    <text x="96" y="346" fill="#4a7a3a" font-weight="bold">+1(e0)</text>
    <text x="140" y="346">→</text>
    <text x="156" y="346">[1,0,0]</text>
    <text x="210" y="346" fill="#4a7a3a" font-weight="bold">+1(e2)</text>
    <text x="254" y="346">→</text>
    <text x="270" y="346">[1,0,1]</text>
    <text x="324" y="346" fill="#d6a040" font-weight="bold">×2</text>
    <text x="350" y="346">→</text>
    <text x="366" y="346">[2,0,2]</text>
    <text x="420" y="346" fill="#4a7a3a" font-weight="bold">+1(e1)</text>
    <text x="464" y="346">→</text>
    <text x="480" y="346">[2,1,2]</text>
    <text x="528" y="346" fill="#d6a040" font-weight="bold">×2</text>

    <text x="42" y="372">[4,2,4]</text>
    <text x="96" y="372" fill="#4a7a3a" font-weight="bold">+1(e2)</text>
    <text x="140" y="372">→</text>
    <text x="156" y="372" fill="#b85450" font-weight="bold">[4,2,5]</text>
    <text x="210" y="372" fill="#888">＝ 目标</text>
  </g>
  <text x="300" y="394" text-anchor="middle" font-size="10.5" fill="#888">绿色 = add（单个 +1），橙色 = mul（全体 ×2）</text>
</svg>
