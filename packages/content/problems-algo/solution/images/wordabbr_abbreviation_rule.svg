<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L5,9 L9,1 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">缩写规则：&lt;首字母&gt;&lt;中间字符数&gt;&lt;尾字母&gt;</text>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">中间字符数 = 长度 − 2；长度 ≤ 2 的词不缩写，原样保留</text>

  <!-- ===== Row 1: deer ===== -->
  <text x="40" y="106" font-size="13" fill="#446688" filter="url(#rough2)">原词</text>
  <rect x="90" y="84" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="108" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">d</text>
  <rect x="132" y="84" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="108" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">e</text>
  <rect x="174" y="84" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="194" y="108" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">e</text>
  <rect x="216" y="84" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="108" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">r</text>
  <text x="173" y="76" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">中间 2 个</text>

  <!-- arrow down -->
  <line x1="173" y1="124" x2="173" y2="148" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="40" y="170" font-size="13" fill="#446688" filter="url(#rough2)">缩写</text>
  <rect x="90" y="148" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="172" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">d</text>
  <rect x="132" y="148" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="172" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="174" y="148" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="194" y="172" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">r</text>
  <text x="226" y="172" font-size="12" fill="#666" filter="url(#rough2)">= "d2r"</text>

  <!-- ===== Row 2: internationalization ===== -->
  <text x="40" y="222" font-size="13" fill="#446688" filter="url(#rough2)">原词</text>
  <rect x="90" y="200" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="224" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">i</text>
  <rect x="132" y="200" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="224" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nternationalizatio</text>
  <rect x="312" y="200" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="224" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">n</text>
  <text x="222" y="192" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">中间 18 个</text>

  <line x1="222" y1="240" x2="222" y2="264" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="40" y="286" font-size="13" fill="#446688" filter="url(#rough2)">缩写</text>
  <rect x="90" y="264" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="288" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">i</text>
  <rect x="132" y="264" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="288" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">18</text>
  <rect x="190" y="264" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="288" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">n</text>
  <text x="242" y="288" font-size="12" fill="#666" filter="url(#rough2)">= "i18n"</text>

  <!-- ===== 右侧 it 特例 callout ===== -->
  <rect x="400" y="92" width="140" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="112" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">特例：长度 ≤ 2</text>
  <rect x="418" y="122" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">i</text>
  <rect x="454" y="122" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="471" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">t</text>
  <text x="498" y="142" font-size="13" fill="#b85450" filter="url(#rough2)">→ "it"</text>
  <text x="470" y="170" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">不缩写，原样保留</text>
</svg>
