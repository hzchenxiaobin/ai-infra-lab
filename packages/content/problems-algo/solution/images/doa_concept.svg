<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">数组的度：频次表 + 首末下标</text>
  <path d="M 230 42 Q 360 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- array row: nums = [1,2,2,3,1,4,2], indices 0..6, cell w=46 -->
  <text x="48" y="86" font-size="12" fill="#666" font-weight="bold">nums</text>
  <g filter="url(#rough2)"><rect x="64" y="62" width="46" height="38" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="87" y="88" text-anchor="middle" font-size="15" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="110" y="62" width="46" height="38" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="133" y="88" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">2</text>
  <g filter="url(#rough2)"><rect x="156" y="62" width="46" height="38" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="179" y="88" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">2</text>
  <g filter="url(#rough2)"><rect x="202" y="62" width="46" height="38" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="225" y="88" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">3</text>
  <g filter="url(#rough2)"><rect x="248" y="62" width="46" height="38" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="271" y="88" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="294" y="62" width="46" height="38" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="317" y="88" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">4</text>
  <g filter="url(#rough2)"><rect x="340" y="62" width="46" height="38" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="363" y="88" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">2</text>

  <text x="87" y="116" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="133" y="116" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="179" y="116" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="225" y="116" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="271" y="116" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="317" y="116" text-anchor="middle" font-size="11" fill="#888">5</text>
  <text x="363" y="116" text-anchor="middle" font-size="11" fill="#888">6</text>

  <!-- hash table -->
  <text x="48" y="166" font-size="12" fill="#666" font-weight="bold">map</text>
  <g filter="url(#rough2)"><rect x="64" y="150" width="76" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="102" y="169" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">value</text>
  <g filter="url(#rough2)"><rect x="140" y="150" width="76" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="178" y="169" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">count</text>
  <g filter="url(#rough2)"><rect x="216" y="150" width="76" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="254" y="169" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">first</text>
  <g filter="url(#rough2)"><rect x="292" y="150" width="76" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="330" y="169" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">last</text>

  <!-- row value=1 -->
  <g filter="url(#rough2)"><rect x="64" y="178" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="102" y="196" text-anchor="middle" font-size="13" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="140" y="178" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="178" y="196" text-anchor="middle" font-size="13" fill="#444">2</text>
  <g filter="url(#rough2)"><rect x="216" y="178" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="254" y="196" text-anchor="middle" font-size="13" fill="#444">0</text>
  <g filter="url(#rough2)"><rect x="292" y="178" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="330" y="196" text-anchor="middle" font-size="13" fill="#444">4</text>

  <!-- row value=2 highlighted -->
  <g filter="url(#rough2)"><rect x="64" y="204" width="76" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="102" y="222" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">2</text>
  <g filter="url(#rough2)"><rect x="140" y="204" width="76" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="178" y="222" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">3</text>
  <g filter="url(#rough2)"><rect x="216" y="204" width="76" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="254" y="222" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="292" y="204" width="76" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="330" y="222" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">6</text>

  <!-- row value=3 -->
  <g filter="url(#rough2)"><rect x="64" y="230" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="102" y="248" text-anchor="middle" font-size="13" fill="#444">3</text>
  <g filter="url(#rough2)"><rect x="140" y="230" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="178" y="248" text-anchor="middle" font-size="13" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="216" y="230" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="254" y="248" text-anchor="middle" font-size="13" fill="#444">3</text>
  <g filter="url(#rough2)"><rect x="292" y="230" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="330" y="248" text-anchor="middle" font-size="13" fill="#444">3</text>

  <!-- row value=4 -->
  <g filter="url(#rough2)"><rect x="64" y="256" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="102" y="274" text-anchor="middle" font-size="13" fill="#444">4</text>
  <g filter="url(#rough2)"><rect x="140" y="256" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="178" y="274" text-anchor="middle" font-size="13" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="216" y="256" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="254" y="274" text-anchor="middle" font-size="13" fill="#444">5</text>
  <g filter="url(#rough2)"><rect x="292" y="256" width="76" height="26" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="330" y="274" text-anchor="middle" font-size="13" fill="#444">5</text>

  <!-- right side callouts -->
  <g filter="url(#rough2)">
    <rect x="410" y="150" width="200" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="510" y="170" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">degree = max(count) = 3</text>
  <text x="510" y="186" text-anchor="middle" font-size="11" fill="#b85450">出现 3 次的元素：value = 2</text>

  <g filter="url(#rough2)">
    <rect x="410" y="206" width="200" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="510" y="226" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">最短同度子数组</text>
  <text x="510" y="244" text-anchor="middle" font-size="12" fill="#7a5415">last - first + 1 = 6 - 1 + 1</text>
  <text x="510" y="258" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = 6</text>

  <path d="M 368 217 Q 390 217 410 234" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- core idea box -->
  <g filter="url(#rough2)">
    <rect x="64" y="300" width="560" height="100" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="324" font-size="13" font-weight="bold" fill="#444">核心观察</text>
  <text x="80" y="346" font-size="12" fill="#444">一次遍历记录每个值的 (count, first, last)：数组的度 = count 的最大值。</text>
  <text x="80" y="364" font-size="12" fill="#444">对每个 count == degree 的值，其「同度最短子数组」就是从 first 到 last 的那段，</text>
  <text x="80" y="382" font-size="12" fill="#444">长度 = last - first + 1；在这些候选里取最小值即为答案。</text>
</svg>
