<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：苹果取正 / 桔子取负 → 同日求和 = diff</text>
  <text x="330" y="46" text-anchor="middle" font-size="10.5" fill="#888">条件聚合 SUM(IF(fruit='apples', sold_num, -sold_num)) GROUP BY sale_date</text>

  <!-- ===== Sales table (left) ===== -->
  <text x="140" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">Sales</text>
  <!-- header -->
  <rect x="20" y="80" width="240" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="97" text-anchor="middle" font-size="10.5" fill="#333">sale_date</text>
  <text x="158" y="97" text-anchor="middle" font-size="10.5" fill="#333">fruit</text>
  <text x="230" y="97" text-anchor="middle" font-size="10.5" fill="#333">sold_num</text>

  <!-- row 1: 05-01 apples 10 -->
  <rect x="20" y="106" width="240" height="28" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="124" text-anchor="middle" font-size="11" fill="#333">2020-05-01</text>
  <text x="158" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">apples</text>
  <text x="230" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">10</text>

  <!-- row 2: 05-01 oranges 8 -->
  <rect x="20" y="134" width="240" height="28" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="152" text-anchor="middle" font-size="11" fill="#333">2020-05-01</text>
  <text x="158" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">oranges</text>
  <text x="230" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">8</text>

  <!-- row 3: 05-02 apples 15 -->
  <rect x="20" y="162" width="240" height="28" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="middle" font-size="11" fill="#333">2020-05-02</text>
  <text x="158" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">apples</text>
  <text x="230" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">15</text>

  <!-- row 4: 05-02 oranges 17 -->
  <rect x="20" y="190" width="240" height="28" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="208" text-anchor="middle" font-size="11" fill="#333">2020-05-02</text>
  <text x="158" y="208" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">oranges</text>
  <text x="230" y="208" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">17</text>

  <!-- row 5: 05-03 apples 20 -->
  <rect x="20" y="218" width="240" height="28" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="236" text-anchor="middle" font-size="11" fill="#333">2020-05-03</text>
  <text x="158" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">apples</text>
  <text x="230" y="236" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">20</text>

  <!-- row 6: 05-03 oranges 0 -->
  <rect x="20" y="246" width="240" height="28" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="264" text-anchor="middle" font-size="11" fill="#333">2020-05-03</text>
  <text x="158" y="264" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">oranges</text>
  <text x="230" y="264" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>

  <!-- ===== Signed contribution (middle) ===== -->
  <text x="330" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">符号化</text>
  <!-- arrows from sold_num to signed box -->
  <path d="M 260 120 L 296 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 260 148 L 296 148" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 176 L 296 176" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 260 204 L 296 204" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 232 L 296 232" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 260 260 L 296 260" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- signed boxes -->
  <rect x="300" y="108" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+10</text>

  <rect x="300" y="136" width="60" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−8</text>

  <rect x="300" y="164" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+15</text>

  <rect x="300" y="192" width="60" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−17</text>

  <rect x="300" y="220" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+20</text>

  <rect x="300" y="248" width="60" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="264" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>

  <!-- ===== Group brackets ===== -->
  <!-- bracket 1: rows 1-2 -->
  <path d="M 372 110 L 380 110 L 380 158 L 372 158" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 380 134 L 410 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- bracket 2: rows 3-4 -->
  <path d="M 372 166 L 380 166 L 380 214 L 372 214" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 380 190 L 410 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- bracket 3: rows 5-6 -->
  <path d="M 372 222 L 380 222 L 380 270 L 372 270" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 380 246 L 410 246" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="396" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="396" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">sale_date</text>

  <!-- ===== Result table (right) ===== -->
  <text x="540" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">每日 diff</text>
  <rect x="420" y="80" width="220" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="97" text-anchor="middle" font-size="10.5" fill="#333">sale_date</text>
  <text x="595" y="97" text-anchor="middle" font-size="10.5" fill="#333">diff</text>

  <!-- result row 1 -->
  <rect x="420" y="120" width="220" height="28" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="138" text-anchor="middle" font-size="11" fill="#333">2020-05-01</text>
  <rect x="560" y="124" width="60" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="590" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- result row 2 -->
  <rect x="420" y="176" width="220" height="28" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="194" text-anchor="middle" font-size="11" fill="#333">2020-05-02</text>
  <rect x="560" y="180" width="60" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="590" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2</text>

  <!-- result row 3 -->
  <rect x="420" y="232" width="220" height="28" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="250" text-anchor="middle" font-size="11" fill="#333">2020-05-03</text>
  <rect x="560" y="236" width="60" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="590" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">20</text>

  <!-- ===== Bottom formula box ===== -->
  <rect x="40" y="310" width="580" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="330" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键转换：fruit='apples' → +sold_num，否则 → −sold_num</text>
  <text x="330" y="348" text-anchor="middle" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">diff = SUM( IF(fruit='apples', sold_num, -sold_num) )  →  一条聚合搞定加减</text>

  <!-- footer -->
  <text x="330" y="384" text-anchor="middle" font-size="10.5" fill="#888">把“两类水果相减”转化为“同列带符号求和”，用一次 GROUP BY + 条件聚合即可输出</text>
  <text x="330" y="402" text-anchor="middle" font-size="10" fill="#aaa">正数 = 苹果多于桔子，负数 = 桔子多于苹果</text>
</svg>
