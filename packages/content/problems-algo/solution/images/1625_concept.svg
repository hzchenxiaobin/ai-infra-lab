<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：有限状态空间 — 两种操作生成的状态图必然循环，BFS 枚举取最小</text>

  <!-- Two operation boxes -->
  <rect x="40" y="48" width="230" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="68" font-size="12" fill="#446688" font-weight="bold">累加操作</text>
  <text x="60" y="84" font-size="11" fill="#555">奇数位 +a (mod 10)，下标从 0 起</text>
  <text x="60" y="98" font-size="10" fill="#888">例：s="3456", a=5 → "3951"</text>

  <rect x="290" y="48" width="230" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="68" font-size="12" fill="#4a7a3a" font-weight="bold">轮转操作</text>
  <text x="310" y="84" font-size="11" fill="#555">将 s 向右轮转 b 位</text>
  <text x="310" y="98" font-size="10" fill="#888">例：s="3456", b=1 → "6345"</text>

  <!-- Diamond state graph -->
  <!-- Top node: 5525 -->
  <rect x="248" y="128" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5525</text>

  <!-- Left node: 5424 -->
  <rect x="128" y="188" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="208" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5424</text>

  <!-- Right node: 2555 -->
  <rect x="368" y="188" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="208" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2555</text>

  <!-- Bottom node: 2454 (convergence) -->
  <rect x="248" y="248" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2454</text>

  <!-- Arrows: 5525 -> 5424 (累加) -->
  <path d="M 258 158 L 180 188" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="198" y="168" font-size="10" fill="#446688" font-weight="bold">累加</text>

  <!-- Arrows: 5525 -> 2555 (轮转) -->
  <path d="M 302 158 L 380 188" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="348" y="168" font-size="10" fill="#4a7a3a" font-weight="bold">轮转</text>

  <!-- Arrows: 5424 -> 2454 (轮转) -->
  <path d="M 180 218 L 258 248" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="190" y="242" font-size="10" fill="#4a7a3a" font-weight="bold">轮转</text>

  <!-- Arrows: 2555 -> 2454 (累加) -->
  <path d="M 380 218 L 302 248" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="346" y="242" font-size="10" fill="#446688" font-weight="bold">累加</text>

  <!-- Convergence annotation -->
  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 两条不同操作路径汇聚到同一状态</text>

  <!-- Insight box -->
  <rect x="40" y="310" width="480" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="330" font-size="12" fill="#446688" font-weight="bold">关键洞察</text>
  <text x="58" y="348" font-size="11" fill="#555">• 轮转周期 = n / gcd(n, b)，至多 n 种旋转（本例 4 / gcd(4,2) = 2 种）</text>
  <text x="58" y="364" font-size="11" fill="#555">• 累加周期 = 10 / gcd(a, 10)，至多 10 种增量（本例 10 / gcd(9,10) = 10 种）</text>
  <text x="58" y="380" font-size="11" fill="#555">• 状态总数有界（≤ n × 10），不同操作序列可能汇聚到同一字符串 → 用 visited 去重</text>
  <text x="58" y="396" font-size="11" fill="#b85450" font-weight="bold">→ BFS 遍历所有可达状态，取字典序最小者，必然在有限步内终止</text>
</svg>
