<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：遇到 x 时，能续接就续接，不要轻易新建</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">续接只消耗 x 本身；新建要额外占用 x+1、x+2 两个未来数字</text>

  <!-- current x -->
  <rect x="250" y="64" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">x</text>
  <text x="280" y="112" text-anchor="middle" font-size="10" fill="#d6a040">当前待放置</text>

  <!-- decision diamond -->
  <path d="M 280 120 L 320 150 L 280 180 L 240 150 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="10.5" fill="#333">tails[x-1]</text>
  <text x="280" y="162" text-anchor="middle" font-size="10.5" fill="#333">&gt; 0 ?</text>

  <!-- LEFT branch: 续接 (green) -->
  <path d="M 240 150 L 110 150" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="175" y="142" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是 · 优先</text>

  <!-- existing sequence ending at x-1 -->
  <rect x="30" y="170" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="188" text-anchor="middle" font-size="11" fill="#333">…</text>
  <rect x="70" y="170" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="188" text-anchor="middle" font-size="11" fill="#333">x-1</text>
  <!-- append x -->
  <rect x="110" y="170" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x</text>
  <path d="M 110 184 L 102 184" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="30" y="214" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="231" text-anchor="middle" font-size="10.5" fill="#333">续接：tails[x-1]−−, tails[x]++</text>

  <text x="140" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 免费：只消耗 x，不碰未来</text>

  <!-- RIGHT branch: 新建 (red) -->
  <path d="M 320 150 L 450 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="385" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否 · 新建</text>

  <!-- new sequence [x, x+1, x+2] -->
  <rect x="450" y="170" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="467" y="188" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">x</text>
  <rect x="484" y="170" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="501" y="188" text-anchor="middle" font-size="10.5" fill="#333">x+1</text>
  <rect x="518" y="170" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="535" y="188" text-anchor="middle" font-size="10.5" fill="#333">x+2</text>

  <rect x="450" y="214" width="190" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="545" y="231" text-anchor="middle" font-size="10.5" fill="#333">新建：freq[x+1]−−, freq[x+2]−−</text>

  <text x="545" y="256" text-anchor="middle" font-size="10" fill="#b85450">⚠ 奢侈：额外消耗两个未来数字</text>

  <!-- bottom: exchange argument -->
  <rect x="40" y="288" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">交换论证：续接优先不会错过合法方案</text>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#555">若某方案中 x 被新建而 tails[x−1]&gt;0，把 x 移去续接，释放的 x+1、x+2 归还后续 → 仍合法</text>

  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#888">两个哈希表：freq[x] 剩余可用个数  ·  tails[x] 以 x 结尾、等待 x+1 的序列条数</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#aaa">把"具体序列身份"抽象为"计数" → 线性化</text>
</svg>
