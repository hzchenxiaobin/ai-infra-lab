<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3,1,5,8] → val = [1,3,1,5,8,1]</text>
  <text x="280" y="38" text-anchor="middle" font-size="11" fill="#888">dp[i][j] = 开区间 (i,j) 内最大硬币数，按区间长度递增填充</text>

  <!-- ===== top header: j index + val[j] ===== -->
  <text x="104" y="44" text-anchor="end" font-size="10" fill="#aaa">j→</text>
  <!-- j index labels -->
  <text x="136" y="56" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="188" y="56" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="240" y="56" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="292" y="56" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="344" y="56" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="396" y="56" text-anchor="middle" font-size="10" fill="#888">5</text>
  <!-- val row cells -->
  <rect x="110" y="60" width="52" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="136" y="78" text-anchor="middle" font-size="12" fill="#777" font-weight="bold">1</text>
  <rect x="162" y="60" width="52" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="78" text-anchor="middle" font-size="12" fill="#777" font-weight="bold">3</text>
  <rect x="214" y="60" width="52" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="78" text-anchor="middle" font-size="12" fill="#777" font-weight="bold">1</text>
  <rect x="266" y="60" width="52" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="292" y="78" text-anchor="middle" font-size="12" fill="#777" font-weight="bold">5</text>
  <rect x="318" y="60" width="52" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="344" y="78" text-anchor="middle" font-size="12" fill="#777" font-weight="bold">8</text>
  <rect x="370" y="60" width="52" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="78" text-anchor="middle" font-size="12" fill="#777" font-weight="bold">1</text>

  <!-- ===== left header: i index + val[i] ===== -->
  <text x="58" y="100" text-anchor="middle" font-size="10" fill="#aaa" transform="rotate(-90 58 100)">i↓</text>

  <!-- row 0 : i=0, val=1 -->
  <rect x="64" y="92" width="44" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="108" font-size="9" fill="#aaa">0</text>
  <text x="104" y="114" text-anchor="end" font-size="12" fill="#777" font-weight="bold">1</text>
  <!-- row 1 : i=1, val=3 -->
  <rect x="64" y="126" width="44" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="142" font-size="9" fill="#aaa">1</text>
  <text x="104" y="148" text-anchor="end" font-size="12" fill="#777" font-weight="bold">3</text>
  <!-- row 2 : i=2, val=1 -->
  <rect x="64" y="160" width="44" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="176" font-size="9" fill="#aaa">2</text>
  <text x="104" y="182" text-anchor="end" font-size="12" fill="#777" font-weight="bold">1</text>
  <!-- row 3 : i=3, val=5 -->
  <rect x="64" y="194" width="44" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="210" font-size="9" fill="#aaa">3</text>
  <text x="104" y="216" text-anchor="end" font-size="12" fill="#777" font-weight="bold">5</text>
  <!-- row 4 : i=4, val=8 -->
  <rect x="64" y="228" width="44" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="244" font-size="9" fill="#aaa">4</text>
  <text x="104" y="250" text-anchor="end" font-size="12" fill="#777" font-weight="bold">8</text>
  <!-- row 5 : i=5, val=1 -->
  <rect x="64" y="262" width="44" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="278" font-size="9" fill="#aaa">5</text>
  <text x="104" y="284" text-anchor="end" font-size="12" fill="#777" font-weight="bold">1</text>

  <!-- ===== dp grid : 6x6, cells 52x34, origin (110,92) ===== -->
  <!-- empty background cells (j <= i+1) light -->
  <!-- row0 -->
  <rect x="110" y="92" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="92" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- len3 (0,2)=3 -->
  <rect x="214" y="92" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- len4 (0,3)=30 -->
  <rect x="266" y="92" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="110" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">30</text>
  <text x="292" y="122" text-anchor="middle" font-size="8" fill="#446688">k=1</text>
  <!-- len5 (0,4)=159 -->
  <rect x="318" y="92" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="110" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">159</text>
  <text x="344" y="122" text-anchor="middle" font-size="8" fill="#d6a040">k=1</text>
  <!-- len6 (0,5)=167 ANSWER -->
  <rect x="370" y="90" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="110" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">167</text>
  <text x="396" y="123" text-anchor="middle" font-size="8" fill="#b85450">k=4 ★</text>

  <!-- row1 -->
  <rect x="110" y="126" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="126" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- len3 (1,3)=15 -->
  <rect x="214" y="126" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="148" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>
  <text x="240" y="159" text-anchor="middle" font-size="8" fill="#4a7a3a">k=2</text>
  <!-- len4 (1,4)=135 -->
  <rect x="266" y="126" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="148" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">135</text>
  <text x="292" y="159" text-anchor="middle" font-size="8" fill="#446688">k=3</text>
  <!-- len5 (1,5)=159 -->
  <rect x="318" y="126" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="148" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">159</text>
  <text x="344" y="159" text-anchor="middle" font-size="8" fill="#d6a040">k=4</text>
  <rect x="370" y="126" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- row2 -->
  <rect x="110" y="160" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="160" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="214" y="160" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- len3 (2,4)=40 -->
  <rect x="266" y="160" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="182" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">40</text>
  <!-- len4 (2,5)=48 -->
  <rect x="318" y="160" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="182" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">48</text>
  <text x="344" y="193" text-anchor="middle" font-size="8" fill="#446688">k=4</text>
  <rect x="370" y="160" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- row3 -->
  <rect x="110" y="194" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="194" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="214" y="194" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="194" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- len3 (3,5)=40 -->
  <rect x="318" y="194" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">40</text>
  <rect x="370" y="194" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- row4 (no j>=i+2) -->
  <rect x="110" y="228" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="228" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="214" y="228" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="228" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="318" y="228" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="370" y="228" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- row5 (no j>=i+2) -->
  <rect x="110" y="262" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="262" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="214" y="262" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="262" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="318" y="262" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="370" y="262" width="52" height="34" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- ===== legend ===== -->
  <rect x="436" y="92" width="112" height="150" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="492" y="110" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">区间长度</text>
  <rect x="446" y="118" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470" y="130" font-size="10" fill="#555">len = 3</text>
  <rect x="446" y="142" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470" y="154" font-size="10" fill="#555">len = 4</text>
  <rect x="446" y="166" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470" y="178" font-size="10" fill="#555">len = 5</text>
  <rect x="446" y="190" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="470" y="202" font-size="10" fill="#555">len = 6 (答案)</text>
  <text x="492" y="226" text-anchor="middle" font-size="9" fill="#888">k = 该格选的「最后戳」</text>

  <!-- ===== reconstruction note ===== -->
  <rect x="64" y="306" width="484" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="306" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">回溯「最后戳」顺序：dp[0][5]→k=4 → dp[0][4]→k=1 → dp[1][4]→k=3 → dp[1][3]→k=2</text>
  <text x="306" y="344" text-anchor="middle" font-size="11" fill="#666">正向戳爆顺序：1 → 5 → 3 → 8，硬币 15 + 120 + 24 + 8 = </text>
  <text x="486" y="344" text-anchor="start" font-size="12" fill="#b85450" font-weight="bold">167</text>
</svg>
