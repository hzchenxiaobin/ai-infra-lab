<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案算法流程</text>

  <!-- Start: initialize -->
  <rect x="170" y="40" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo = 1, hi = max(nums), ans = hi</text>

  <path d="M 260 78 L 260 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- While condition -->
  <polygon points="260,100 360,140 260,180 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">lo ≤ hi ?</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#888">否 → 返回 ans</text>

  <!-- No branch: return -->
  <path d="M 360 140 L 420 140 L 420 60 L 356 60" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="30" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="422" y="49" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return ans</text>

  <!-- Yes branch: mid -->
  <path d="M 260 180 L 260 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="200" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mid = lo + (hi − lo) / 2</text>

  <path d="M 260 238 L 260 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check(mid) -->
  <rect x="120" y="258" width="280" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ops = Σ (nums[i] − 1) / mid</text>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a">ops ≤ maxOperations ?</text>

  <!-- Yes: feasible -->
  <path d="M 120 281 L 80 281 L 80 340 L 100 340" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="68" y="274" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="100" y="322" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="345" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = mid</text>
  <path d="M 155 358 L 155 376 L 260 376 L 260 396" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No: infeasible -->
  <path d="M 400 281 L 440 281 L 440 340 L 420 340" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="274" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <rect x="310" y="322" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="365" y="345" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lo = mid + 1</text>
  <path d="M 365 358 L 365 376 L 260 376" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- hi = mid - 1 -->
  <rect x="180" y="396" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="417" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">hi = mid − 1</text>

  <!-- Loop back arrow -->
  <path d="M 180 412 L 60 412 L 60 140 L 156 140" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="278" text-anchor="middle" font-size="9" fill="#999" transform="rotate(-90 48 278)">回循环</text>
</svg>
