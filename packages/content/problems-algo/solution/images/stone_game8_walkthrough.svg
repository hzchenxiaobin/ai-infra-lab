<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：stones = [−1, 2, −3, 4, −5]</text>

  <!-- prefix array -->
  <text x="30" y="48" font-size="11" fill="#888">prefix =</text>
  <rect x="80" y="36" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <rect x="122" y="36" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="52" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="164" y="36" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="184" y="52" text-anchor="middle" font-size="11" fill="#333">−2</text>
  <rect x="206" y="36" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="52" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="248" y="36" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="268" y="52" text-anchor="middle" font-size="11" fill="#333">−3</text>

  <!-- index labels under prefix -->
  <text x="100" y="72" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="142" y="72" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="184" y="72" text-anchor="middle" font-size="9" fill="#888">i=2</text>
  <text x="226" y="72" text-anchor="middle" font-size="9" fill="#888">i=3</text>
  <text x="268" y="72" text-anchor="middle" font-size="9" fill="#888">i=4</text>

  <!-- direction arrow -->
  <path d="M 320 56 L 370 56" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="345" y="48" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">从右往左</text>
  <text x="345" y="68" text-anchor="middle" font-size="9" fill="#888">计算</text>

  <!-- ===== Table ===== -->
  <!-- header -->
  <rect x="30" y="86" width="50" height="26" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="103" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">i</text>
  <rect x="82" y="86" width="80" height="26" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="103" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">prefix[i]</text>
  <rect x="164" y="86" width="80" height="26" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="103" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">f(i)</text>
  <rect x="246" y="86" width="100" height="26" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="296" y="103" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">g(i)=p[i]−f(i)</text>
  <rect x="348" y="86" width="110" height="26" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="403" y="103" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">suffix_max</text>

  <!-- row i=4 (base case) -->
  <rect x="30" y="114" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="55" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="82" y="114" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="132" text-anchor="middle" font-size="11" fill="#333">−3</text>
  <rect x="164" y="114" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="132" text-anchor="middle" font-size="11" fill="#888">0 (边界)</text>
  <rect x="246" y="114" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="296" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−3</text>
  <rect x="348" y="114" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="403" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−3</text>

  <!-- row i=3 -->
  <rect x="30" y="144" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="55" y="162" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="82" y="144" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="162" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="164" y="144" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="162" text-anchor="middle" font-size="11" fill="#333">−3 ←smax</text>
  <rect x="246" y="144" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="296" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <rect x="348" y="144" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="403" y="162" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5 (max)</text>

  <!-- row i=2 -->
  <rect x="30" y="174" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="55" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="82" y="174" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="192" text-anchor="middle" font-size="11" fill="#333">−2</text>
  <rect x="164" y="174" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="192" text-anchor="middle" font-size="11" fill="#333">5 ←smax</text>
  <rect x="246" y="174" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="296" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−7</text>
  <rect x="348" y="174" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="403" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5 (不变)</text>

  <!-- row i=1 -->
  <rect x="30" y="204" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="55" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="82" y="204" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="222" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="164" y="204" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="222" text-anchor="middle" font-size="11" fill="#333">5 ←smax</text>
  <rect x="246" y="204" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="296" y="222" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−4</text>
  <rect x="348" y="204" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="403" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5 (不变)</text>

  <!-- row i=0 (answer) -->
  <rect x="30" y="234" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="82" y="234" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="252" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <rect x="164" y="234" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="204" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5 = 答案</text>
  <rect x="246" y="234" width="100" height="28" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="296" y="252" text-anchor="middle" font-size="10" fill="#888">无需计算</text>
  <rect x="348" y="234" width="110" height="28" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="403" y="252" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- ===== Explanation box ===== -->
  <rect x="30" y="276" width="480" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="296" font-size="11" fill="#446688" font-weight="bold">读表要点</text>
  <text x="46" y="314" font-size="10.5" fill="#333">• i=4 为边界：f(4)=0，g(4)=prefix[4]−0=−3，初始化 suffix_max=−3</text>
  <text x="46" y="330" font-size="10.5" fill="#333">• 每行 f(i)=当前 suffix_max；g(i)=prefix[i]−f(i)；更新 suffix_max=max(suffix_max, g(i))</text>
  <text x="46" y="346" font-size="10.5" fill="#b85450" font-weight="bold">• f(0) = suffix_max = 5 → Alice 最优分差为 5（与示例一致）</text>
</svg>
