<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">长度为 3 的回文 = xyx 结构</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">首尾字符相同(记 x)，中间字符任意(记 y，可与 x 相同)</text>

  <!-- xyx structure boxes -->
  <g font-size="14">
    <rect x="120" y="80" width="80" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="160" y="118" text-anchor="middle" fill="#446688" font-weight="bold">x</text>
    <text x="160" y="158" text-anchor="middle" font-size="10" fill="#888">首</text>

    <rect x="270" y="80" width="80" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="310" y="118" text-anchor="middle" fill="#d6a040" font-weight="bold">y</text>
    <text x="310" y="158" text-anchor="middle" font-size="10" fill="#888">中(任意)</text>

    <rect x="420" y="80" width="80" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="460" y="118" text-anchor="middle" fill="#446688" font-weight="bold">x</text>
    <text x="460" y="158" text-anchor="middle" font-size="10" fill="#888">尾(=首)</text>
  </g>

  <!-- brace linking first and last x -->
  <path d="M 130 175 Q 130 200 160 200 Q 290 215 460 200 Q 490 200 490 175"
        fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="310" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">首尾相同 ⇒ 只需枚举字符对 (x, y)</text>

  <!-- decomposition -->
  <rect x="40" y="260" width="540" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="286" font-size="13" fill="#444" font-weight="bold">按首尾字符 x 分类 (仅 26 种)</text>
  <text x="60" y="308" font-size="12" fill="#4a7a3a">外层：枚举 x ∈ {a..z}</text>
  <text x="60" y="328" font-size="12" fill="#4a7a3a">内层：问「x 的首末出现之间，有哪些不同字符 y」</text>
  <text x="60" y="352" font-size="13" fill="#b85450" font-weight="bold">不同回文数 = Σ_x (区间内不同字符数)</text>
  <text x="60" y="372" font-size="10" fill="#888">取 x 的最左 l、最右 r → s[l+1..r-1] 即所有可配的 y</text>
</svg>
