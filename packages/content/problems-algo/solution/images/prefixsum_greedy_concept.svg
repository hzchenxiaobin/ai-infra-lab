<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">贪心 + 小根堆：前缀和跌破 0 时，把最负元素挪到末尾</text>

  <!-- ===== 数组格子 + 运行和 trace ===== -->
  <text x="40" y="68" font-size="12" fill="#446688" filter="url(#rough2)">nums:</text>
  <!-- i=0  x=3 -->
  <rect x="80" y="56" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <!-- i=1  x=-5  (负数) -->
  <rect x="136" y="56" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="78" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−5</text>
  <!-- i=2  x=-2 -->
  <rect x="192" y="56" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="78" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−2</text>
  <!-- i=3  x=6 -->
  <rect x="248" y="56" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <!-- 运行和 trace -->
  <text x="40" y="112" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s:</text>
  <text x="106" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="162" y="112" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−2 ✗</text>
  <text x="218" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="274" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">7</text>

  <!-- 挪走后 s 抬升的标注 -->
  <path d="M162,116 L162,130 L300,130" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="310" y="134" font-size="11" fill="#d6a040" filter="url(#rough2)">弹 −5 → s=−2−(−5)=3</text>

  <!-- ===== 小根堆 ===== -->
  <text x="40" y="170" font-size="12" fill="#446688" filter="url(#rough2)">小根堆（只入负数）：</text>
  <!-- 堆的树状：根 -5 -->
  <rect x="150" y="180" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="200" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−5</text>
  <text x="210" y="200" font-size="11" fill="#d6a040" filter="url(#rough2)">← 堆顶（最负）</text>

  <!-- 弹堆箭头 -->
  <path d="M175,214 L175,238" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="190" y="232" font-size="11" fill="#b85450" filter="url(#rough2)">pop</text>

  <!-- ===== 挪到末尾 ===== -->
  <text x="40" y="262" font-size="12" fill="#446688" filter="url(#rough2)">挪到末尾（不再拖累前缀）：</text>
  <rect x="150" y="252" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="272" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">−5</text>
  <path d="M205,267 L235,267" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="252" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">拼到数组末尾</text>

  <!-- ===== 结果数组 + 前缀和 ===== -->
  <text x="40" y="318" font-size="12" fill="#446688" filter="url(#rough2)">结果数组:</text>
  <rect x="120" y="306" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="326" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="176" y="306" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="326" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="232" y="306" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="326" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="288" y="306" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="326" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">−5</text>

  <text x="40" y="356" font-size="12" fill="#4a7a3a" filter="url(#rough2)">prefix:</text>
  <text x="146" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="202" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="258" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="314" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="380" y="356" font-size="12" fill="#b85450" filter="url(#rough2)">全部 ≥ 0 ✓  ans = 1</text>

  <!-- 图例 -->
  <rect x="40" y="378" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="58" y="388" font-size="10" fill="#333" filter="url(#rough2)">负数候选</text>
  <rect x="150" y="378" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="168" y="388" font-size="10" fill="#333" filter="url(#rough2)">挪到末尾</text>
  <rect x="250" y="378" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="268" y="388" font-size="10" fill="#333" filter="url(#rough2)">保留</text>
</svg>
