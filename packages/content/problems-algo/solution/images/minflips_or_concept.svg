<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按位独立 —— a|b 的每一位与 c 对齐分类</text>

  <!-- ===== LEFT PANEL: c 位 = 1 ===== -->
  <rect x="24" y="48" width="256" height="364" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="152" y="74" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">c 的位 = 1</text>
  <text x="152" y="92" text-anchor="middle" font-size="11" fill="#888">需要 a|b = 1（至少一个 1）</text>

  <!-- sub-case 1: a|b already 1 -->
  <text x="40" y="124" font-size="11.5" fill="#446688" font-weight="bold">a=1 或 b=1（已是 1）</text>
  <rect x="40" y="132" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="80" y="152" text-anchor="middle" font-size="12" fill="#888">|</text>
  <rect x="92" y="132" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="136" y="152" font-size="12" fill="#888">=</text>
  <rect x="150" y="132" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="168" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="196" y="152" font-size="11" fill="#888">已满足</text>
  <rect x="196" y="160" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="228" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">代价 +0</text>

  <!-- sub-case 2: a=0,b=0 -->
  <text x="40" y="208" font-size="11.5" fill="#b85450" font-weight="bold">a=0 且 b=0（都是 0）</text>
  <rect x="40" y="216" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="236" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <text x="80" y="236" text-anchor="middle" font-size="12" fill="#888">|</text>
  <rect x="92" y="216" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="236" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <text x="136" y="236" font-size="12" fill="#888">=</text>
  <rect x="150" y="216" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="236" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <text x="196" y="236" font-size="11" fill="#b85450">≠ c=1</text>
  <rect x="196" y="244" width="64" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="228" y="259" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">代价 +1</text>

  <!-- arrow + note -->
  <path d="M 110 252 Q 110 268 110 278" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="282" width="220" height="40" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="150" y="300" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">只需翻一个 0→1 即可</text>
  <text x="150" y="316" text-anchor="middle" font-size="10.5" fill="#888">翻 a 或翻 b 都行，花 1 次</text>

  <!-- bottom rule -->
  <rect x="40" y="338" width="220" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="358" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">c=1 时代价 = 0 或 1</text>
  <text x="150" y="376" text-anchor="middle" font-size="10.5" fill="#4a7a3a">a|b 已是 1 → 0；否则 → 1</text>

  <!-- ===== RIGHT PANEL: c 位 = 0 ===== -->
  <rect x="300" y="48" width="256" height="364" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="428" y="74" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">c 的位 = 0</text>
  <text x="428" y="92" text-anchor="middle" font-size="11" fill="#888">需要 a|b = 0（a、b 全为 0）</text>

  <!-- sub-case 1: a=0,b=0 -->
  <text x="316" y="124" font-size="11.5" fill="#4a7a3a" font-weight="bold">a=0 且 b=0（已是 0）</text>
  <rect x="316" y="132" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="334" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="356" y="152" text-anchor="middle" font-size="12" fill="#888">|</text>
  <rect x="368" y="132" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="386" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="412" y="152" font-size="12" fill="#888">=</text>
  <rect x="426" y="132" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="444" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="472" y="152" font-size="11" fill="#888">已满足</text>
  <rect x="472" y="160" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="504" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">代价 +0</text>

  <!-- sub-case 2: one is 1 -->
  <text x="316" y="208" font-size="11.5" fill="#d6a040" font-weight="bold">恰有一个 1</text>
  <rect x="316" y="216" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="356" y="236" text-anchor="middle" font-size="12" fill="#888">|</text>
  <rect x="368" y="216" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="386" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="412" y="236" font-size="12" fill="#888">=</text>
  <rect x="426" y="216" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="444" y="236" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="472" y="236" font-size="11" fill="#b85450">≠ c=0</text>
  <rect x="472" y="244" width="64" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="504" y="259" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">代价 +1</text>

  <!-- sub-case 3: both 1 -->
  <text x="316" y="288" font-size="11.5" fill="#b85450" font-weight="bold">a=1 且 b=1（都是 1）</text>
  <rect x="316" y="296" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="316" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="356" y="316" text-anchor="middle" font-size="12" fill="#888">|</text>
  <rect x="368" y="296" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="316" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="412" y="316" font-size="12" fill="#888">=</text>
  <rect x="426" y="296" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="444" y="316" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="472" y="316" font-size="11" fill="#b85450">≠ c=0</text>
  <rect x="472" y="324" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="504" y="339" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">代价 +2</text>

  <!-- bottom rule -->
  <rect x="316" y="356" width="220" height="40" fill="#fafafa" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="426" y="374" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c=0 时必须把 1 全清掉</text>
  <text x="426" y="390" text-anchor="middle" font-size="10.5" fill="#888">代价 = a 位 + b 位（0/1/2）</text>
</svg>
