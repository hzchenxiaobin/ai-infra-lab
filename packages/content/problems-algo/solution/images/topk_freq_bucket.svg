<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="920" height="440" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">桶排序：以"频率"为下标分桶</text>
  <path d="M 300 44 Q 460 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 频率统计 -->
  <text x="60" y="92" font-size="13" font-weight="bold" fill="#2b2b2b">频率统计 {1:3, 2:2, 3:1}</text>
  <text x="60" y="110" font-size="11" fill="#666">频率取值范围 [1, n]，n = 6 → 可直接当数组下标</text>

  <path d="M 460 122 L 460 142" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="500" y="136" font-size="11" fill="#666">分桶 bucket[f].append(x)</text>

  <!-- 桶数组 -->
  <text x="60" y="166" font-size="13" font-weight="bold" fill="#2b2b2b">bucket 数组（下标 = 频率 f）</text>

  <!-- 桶格子：下标 0..6 -->
  <g filter="url(#sk)">
    <g stroke="#446688" fill="#eef3fb">
      <rect x="120" y="180" width="90" height="44" rx="4"/>
      <rect x="210" y="180" width="90" height="44" rx="4"/>
      <rect x="300" y="180" width="90" height="44" rx="4"/>
      <rect x="390" y="180" width="90" height="44" rx="4"/>
      <rect x="480" y="180" width="90" height="44" rx="4"/>
      <rect x="570" y="180" width="90" height="44" rx="4"/>
      <rect x="660" y="180" width="90" height="44" rx="4"/>
    </g>
  </g>
  <!-- 下标 -->
  <text x="165" y="241" text-anchor="middle" font-size="11" fill="#999">f=0</text>
  <text x="255" y="241" text-anchor="middle" font-size="11" fill="#999">f=1</text>
  <text x="345" y="241" text-anchor="middle" font-size="11" fill="#999">f=2</text>
  <text x="435" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">f=3</text>
  <text x="525" y="241" text-anchor="middle" font-size="11" fill="#999">f=4</text>
  <text x="615" y="241" text-anchor="middle" font-size="11" fill="#999">f=5</text>
  <text x="705" y="241" text-anchor="middle" font-size="11" fill="#999">f=6</text>

  <!-- 桶内元素 -->
  <text x="165" y="207" text-anchor="middle" font-size="11" fill="#ccc">—</text>
  <g filter="url(#sk)">
    <rect x="230" y="190" width="50" height="24" rx="4" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="255" y="207" text-anchor="middle" font-size="12" fill="#b85450">3</text>
  <g filter="url(#sk)">
    <rect x="320" y="190" width="50" height="24" rx="4" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="345" y="207" text-anchor="middle" font-size="12" fill="#7a5415">2</text>
  <g filter="url(#sk)">
    <rect x="410" y="190" width="50" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="435" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="525" y="207" text-anchor="middle" font-size="11" fill="#ccc">—</text>
  <text x="615" y="207" text-anchor="middle" font-size="11" fill="#ccc">—</text>
  <text x="705" y="207" text-anchor="middle" font-size="11" fill="#ccc">—</text>

  <!-- 从右往左扫描箭头 -->
  <path d="M 700 270 L 250 270" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="475" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">从高频率 f 往低频率扫，收集 k 个即停</text>

  <!-- 收集结果 -->
  <text x="60" y="312" font-size="13" font-weight="bold" fill="#2b2b2b">收集过程（k = 2）：</text>

  <g filter="url(#sk)">
    <rect x="60" y="324" width="240" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="76" y="347" font-size="12" fill="#2e6e2e">f=3 → 取到 1，ans=[1]</text>

  <g filter="url(#sk)">
    <rect x="320" y="324" width="260" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="336" y="347" font-size="12" fill="#2e6e2e">f=2 → 取到 2，ans=[1,2]，够 k 停止</text>

  <!-- 结果框 -->
  <g filter="url(#sk)">
    <rect x="60" y="384" width="800" height="42" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="411" font-size="13" font-weight="bold" fill="#7a5415">结果：[1, 2]   ·   时间 O(n)（无比较排序），空间 O(n)</text>
</svg>
