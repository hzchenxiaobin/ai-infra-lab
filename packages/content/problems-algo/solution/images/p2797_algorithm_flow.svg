<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：先填占位符 → 再追加剩余 newArgs → 调用 fn</text>

  <!-- Start -->
  <ellipse cx="280" cy="54" rx="46" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 71 L 280 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop1 entry -->
  <rect x="150" y="92" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">循环①：遍历 args 的每个元素 a</text>
  <path d="M 280 126 L 280 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,150 362,194 280,238 198,194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a === "_"</text>
  <text x="280" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">?</text>

  <!-- Yes (left) -->
  <path d="M 198 194 L 150 194 L 150 252" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="120" y="188" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="62" y="256" width="176" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="277" text-anchor="middle" font-size="11" fill="#333">取 newArgs[i]，i++</text>

  <!-- No (right) -->
  <path d="M 362 194 L 410 194 L 410 252" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="420" y="188" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="322" y="256" width="176" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="277" text-anchor="middle" font-size="11" fill="#333">保留原值 a</text>

  <!-- merge to push combined -->
  <path d="M 150 288 L 150 312 L 280 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 288 L 410 312 L 280 312" stroke="#666" stroke-width="1.5" fill="none"/>
  <rect x="180" y="318" width="200" height="32" fill="#f5f5f5" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="339" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">push 到 combined</text>

  <!-- loop1 back arrow (left side) -->
  <path d="M 180 334 L 64 334 L 64 109 L 150 109" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="225" font-size="10" fill="#888" transform="rotate(-90 40 225)">args 还有元素</text>

  <!-- down to loop2 -->
  <path d="M 280 350 L 280 368" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="363" font-size="9" fill="#888">遍历完</text>

  <!-- Loop2 entry -->
  <rect x="140" y="372" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="393" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">循环②：while i &lt; newArgs.length</text>
  <path d="M 280 404 L 280 420" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- append box -->
  <rect x="180" y="424" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="11" fill="#333">追加 newArgs[i++] 到 combined</text>

  <!-- loop2 back arrow (right side) -->
  <path d="M 380 439 L 500 439 L 500 388 L 420 388" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="514" y="415" font-size="10" fill="#888" transform="rotate(-90 514 415)">还有剩余</text>

  <!-- down to return -->
  <path d="M 280 454 L 280 466" stroke="none"/>
  <rect x="170" y="462" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="482" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">return fn(...combined)</text>
</svg>
