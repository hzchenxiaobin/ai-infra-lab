<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心策略：第一枚鸡蛋按递减步长试探（以 m=4, n=10 为例）</text>

  <!-- ===== Building (10 floors) ===== -->
  <rect x="160" y="90" width="60" height="260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>

  <!-- floor separators + numbers (floor f center y = 337 - (f-1)*26) -->
  <line x1="160" y1="324" x2="220" y2="324" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="341" text-anchor="end" font-size="10" fill="#999">1</text>
  <line x1="160" y1="298" x2="220" y2="298" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="315" text-anchor="end" font-size="10" fill="#999">2</text>
  <line x1="160" y1="272" x2="220" y2="272" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="289" text-anchor="end" font-size="10" fill="#999">3</text>
  <line x1="160" y1="246" x2="220" y2="246" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="263" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <line x1="160" y1="220" x2="220" y2="220" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="237" text-anchor="end" font-size="10" fill="#999">5</text>
  <line x1="160" y1="194" x2="220" y2="194" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="211" text-anchor="end" font-size="10" fill="#999">6</text>
  <line x1="160" y1="168" x2="220" y2="168" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="185" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <line x1="160" y1="142" x2="220" y2="142" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="159" text-anchor="end" font-size="10" fill="#999">8</text>
  <line x1="160" y1="116" x2="220" y2="116" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="133" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">9</text>
  <text x="150" y="107" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">10</text>

  <!-- egg1 drop markers (red eggs) at floors 4, 7, 9, 10 -->
  <ellipse cx="190" cy="259" rx="9" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="263" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">扔</text>
  <ellipse cx="190" cy="181" rx="9" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="185" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">扔</text>
  <ellipse cx="190" cy="129" rx="9" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="133" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">扔</text>
  <ellipse cx="190" cy="103" rx="9" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="107" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">扔</text>

  <!-- ===== Gap brackets on the right ===== -->
  <!-- gap 4: floors 1..4, center y = 298 -->
  <path d="M 226 337 L 232 337 L 232 259 L 226 259" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="301" font-size="11" fill="#446688" font-weight="bold">步长 4</text>
  <text x="240" y="315" font-size="10" fill="#888">(m)</text>
  <!-- gap 3: floors 5..7, center y = 207 -->
  <path d="M 226 233 L 232 233 L 232 181 L 226 181" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="210" font-size="11" fill="#446688" font-weight="bold">步长 3</text>
  <text x="240" y="224" font-size="10" fill="#888">(m−1)</text>
  <!-- gap 2: floors 8..9, center y = 142 -->
  <path d="M 226 155 L 232 155 L 232 129 L 226 129" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="145" font-size="11" fill="#446688" font-weight="bold">步长 2</text>
  <text x="240" y="159" font-size="10" fill="#888">(m−2)</text>
  <!-- gap 1: floor 10, y = 103 -->
  <path d="M 226 116 L 232 116 L 232 90 L 226 90" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="104" font-size="11" fill="#446688" font-weight="bold">步长 1</text>
  <text x="240" y="118" font-size="10" fill="#888">(m−3)</text>

  <!-- ===== Explanation box ===== -->
  <rect x="310" y="60" width="230" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="325" y="84" font-size="13" fill="#4a7a3a" font-weight="bold">为什么步长每次减 1？</text>
  <text x="325" y="108" font-size="12" fill="#444">第 i 次扔：已用 i 次操作</text>
  <text x="325" y="128" font-size="12" fill="#444">若碎，下方 m−i 层用第 2 枚</text>
  <text x="325" y="144" font-size="12" fill="#444">蛋线性扫，需 m−i 次</text>
  <text x="325" y="166" font-size="12" fill="#b85450" font-weight="bold">总操作 = i + (m−i) = m</text>
  <text x="325" y="186" font-size="11" fill="#666">每次扔的最坏代价恒为 m ✓</text>

  <!-- ===== Sum formula box ===== -->
  <rect x="310" y="226" width="230" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="425" y="250" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">总覆盖楼层数</text>
  <text x="425" y="276" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">m + (m−1) + … + 1</text>
  <text x="425" y="300" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= m(m+1)/2</text>

  <!-- footnote -->
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#888">步长递减 1 ⇒ 各次最坏操作数相等 ⇒ 总操作数最小</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#888">求最小 m 使 m(m+1)/2 ≥ n 即得答案</text>
</svg>
