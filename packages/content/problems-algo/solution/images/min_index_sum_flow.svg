<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建表 + 扫描 + 维护最小索引和</text>

  <!-- ===== Step 1: build map ===== -->
  <rect x="60" y="48" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="73" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">① 遍历 list1 建哈希表 map</text>

  <path d="M 160 90 L 160 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: init ===== -->
  <rect x="60" y="116" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="141" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">② minSum=∞, res=[]</text>

  <path d="M 160 158 L 160 180" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: loop list2 ===== -->
  <rect x="40" y="184" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="209" text-anchor="middle" font-size="12" fill="#7a4a10" font-weight="bold">③ 遍历 list2[j]，查 map[list2[j]]</text>

  <!-- ===== Decision: found? ===== -->
  <path d="M 160 226 L 160 246" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="160,250 250,290 160,330 70,290" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="287" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">命中？</text>
  <text x="160" y="302" text-anchor="middle" font-size="10" fill="#888">(在 map 中)</text>

  <!-- No branch -> skip -->
  <path d="M 70 290 L 30 290 L 30 380" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="42" y="282" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="20" y="384" width="80" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="404" text-anchor="middle" font-size="11" fill="#555">跳过</text>

  <!-- Yes branch -> compute sum -->
  <path d="M 250 290 L 300 290 L 300 246" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="282" text-anchor="middle" font-size="10" fill="#888">是</text>

  <rect x="320" y="116" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="141" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">sum = map[list2[j]] + j</text>

  <path d="M 430 158 L 430 180" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: sum vs minSum ===== -->
  <polygon points="430,184 540,224 430,264 320,224" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="221" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">sum vs minSum</text>

  <!-- < branch: reset -->
  <path d="M 320 224 L 300 224 L 300 340" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="216" text-anchor="middle" font-size="10" fill="#888">&lt;</text>
  <rect x="220" y="344" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="364" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">minSum = sum</text>
  <text x="310" y="380" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">res = [list2[j]] (重置)</text>

  <!-- = branch: append -->
  <path d="M 430 264 L 430 340" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="302" text-anchor="middle" font-size="10" fill="#888">=</text>
  <rect x="410" y="344" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="372" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">res.append(list2[j])</text>

  <!-- > branch: ignore -->
  <path d="M 540 224 L 545 224 L 545 340" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="216" text-anchor="middle" font-size="10" fill="#888">&gt;</text>
  <rect x="410" y="344" width="0" height="0" fill="none"/>

  <!-- loop back arrow -->
  <path d="M 100 400 L 100 209 L 38 209" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="115" y="412" text-anchor="middle" font-size="9" fill="#888">下一个 j</text>

  <!-- ===== return ===== -->
  <rect x="200" y="404" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">遍历结束 → 返回 res</text>
</svg>
