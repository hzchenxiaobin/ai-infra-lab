<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：a 的因子 ∩ b 的因子 = gcd(a,b) 的因子（以 a=12, b=6 为例）</text>

  <!-- ====== LEFT: factors of a=12 ====== -->
  <rect x="30" y="52" width="180" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="72" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">a = 12 的因子</text>

  <!-- chips row 1: 1 2 3 (all common -> green) -->
  <rect x="50" y="84" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="96" y="84" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="142" y="84" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- chips row 2: 4 (only a) 6 (common) 12 (only a) -->
  <rect x="50" y="120" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="137" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <rect x="96" y="120" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="137" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="142" y="120" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="137" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">12</text>

  <!-- ====== RIGHT: factors of b=6 ====== -->
  <rect x="330" y="52" width="180" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="72" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">b = 6 的因子</text>

  <!-- chips: 1 2 3 6 (all common -> green) -->
  <rect x="350" y="84" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="396" y="84" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="442" y="84" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="461" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="396" y="120" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="137" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- arrows converging to center -->
  <path d="M 120 172 Q 150 200 195 222" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 420 172 Q 390 200 345 222" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== CENTER: common factors = gcd's divisors ====== -->
  <rect x="155" y="226" width="230" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">公因子 = gcd(a,b) 的约数</text>

  <!-- gcd computation chip -->
  <rect x="195" y="258" width="150" height="24" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="275" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">gcd(12, 6) = 6</text>

  <!-- chips: 1 2 3 6 -->
  <rect x="178" y="288" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="226" y="288" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="274" y="288" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="322" y="288" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- arrow down to count -->
  <path d="M 270 320 L 270 342" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== answer ====== -->
  <rect x="150" y="346" width="240" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="370" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = d(gcd(a,b)) = d(6) = 4</text>
</svg>
