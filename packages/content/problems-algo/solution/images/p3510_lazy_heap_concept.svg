<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">三件套：双链表 × 最小堆(惰性删除) × bad 计数</text>
  <text x="260" y="45" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">以 nums = [5, 2, 3, 1] 为例</text>

  <!-- 链表节点 -->
  <rect x="243" y="70" width="184" height="60" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="335" y="66" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">和最小 = 4 → 合并这对</text>

  <rect x="60" y="80" width="72" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="155" y="80" width="72" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="80" width="72" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="345" y="80" width="72" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <text x="191" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="286" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <text x="381" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <text x="96" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="191" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="286" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="381" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>

  <line x1="135" y1="101" x2="152" y2="101" stroke="#446688" stroke-width="1.5" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="230" y1="101" x2="247" y2="101" stroke="#446688" stroke-width="1.5" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="325" y1="101" x2="342" y2="101" stroke="#446688" stroke-width="1.5" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="143" y="74" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">prv/nxt</text>

  <text x="143" y="156" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">5&gt;2 逆序</text>
  <text x="333" y="156" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">3&gt;1 逆序</text>

  <rect x="432" y="84" width="74" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="469" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">bad = 2</text>

  <!-- 弹出→合并 箭头 -->
  <path d="M 108 183 Q 92 160 110 142" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="58" y="170" font-size="10" fill="#d6a040" filter="url(#rough2)">弹出→校验→合并</text>

  <!-- 最小堆 -->
  <rect x="30" y="185" width="252" height="170" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">最小堆：条目 (和, 左端点)</text>

  <rect x="45" y="218" width="222" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="156" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(4, 2) ← 现堆顶 ✓</text>

  <rect x="45" y="248" width="222" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="156" y="266" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(5, 1) 已过期 ✗（现和=6）</text>
  <line x1="50" y1="261" x2="262" y2="261" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="45" y="278" width="222" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="156" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(6, 1) 合并后补推 ✓</text>

  <rect x="45" y="308" width="222" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="156" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(7, 0) ✓</text>

  <text x="156" y="350" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">校验：alive[i] 且 nxt[i]≠−1 且 和相符</text>

  <!-- bad 计数器 -->
  <rect x="308" y="185" width="182" height="170" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="399" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">bad 计数器</text>
  <text x="399" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">val[i] &gt; val[nxt[i]]</text>
  <text x="399" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">的相邻对个数</text>
  <text x="399" y="287" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450" filter="url(#rough2)">bad = 2</text>
  <text x="399" y="315" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">bad = 0 ⇔ 非递减</text>
  <text x="399" y="333" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">⇒ 停机输出 ops</text>

  <!-- 合并箭头：3 与 1 -->
  <path d="M 286 124 Q 300 140 330 140" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
</svg>
