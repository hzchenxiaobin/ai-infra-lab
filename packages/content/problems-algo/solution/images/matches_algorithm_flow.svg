<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    算法流程：模拟赛制逐轮配对
  </text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 270 76 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="190" y="94" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0</text>

  <path d="M 270 128 L 270 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: n > 1 ? -->
  <polygon points="270,148 376,190 270,232 164,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n &gt; 1 ?</text>
  <text x="270" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">还有 ≥2 支队伍</text>

  <!-- No branch -> return -->
  <path d="M 376 190 L 430 190 L 430 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="182" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="368" y="254" width="124" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="275" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- Yes branch -> parity decision -->
  <path d="M 164 190 L 110 190 L 110 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="182" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: n even ? -->
  <polygon points="110,252 200,290 110,328 20,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="287" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n 是偶数?</text>
  <text x="110" y="302" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">奇偶判定</text>

  <!-- Even branch -->
  <path d="M 200 290 L 250 290 L 250 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="282" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶</text>
  <rect x="170" y="322" width="170" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += n / 2</text>
  <text x="255" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = n / 2</text>
  <text x="255" y="373" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(一半晋级)</text>

  <!-- Odd branch -->
  <path d="M 20 290 L 20 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="316" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">奇</text>
  <rect x="-30" y="334" width="186" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="354" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += (n−1)/2</text>
  <text x="63" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = (n−1)/2 + 1</text>
  <text x="63" y="385" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(1 轮空 + 配对晋级)</text>

  <!-- Loop back: from even box and odd box back to top n>1 decision -->
  <path d="M 340 350 L 392 350 L 392 190" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="276" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一轮</text>
  <path d="M 156 362 L 392 362" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- Legend -->
  <rect x="350" y="322" width="168" height="60" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="358" y="338" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">图例</text>
  <rect x="358" y="344" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="378" y="353" font-size="10" fill="#555" filter="url(#rough2)">偶数轮处理</text>
  <rect x="358" y="360" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="378" y="369" font-size="10" fill="#555" filter="url(#rough2)">奇数轮处理</text>
  <polygon points="358,376 374,376 366,386" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="378" y="386" font-size="10" fill="#555" filter="url(#rough2)">判定分支</text>

  <!-- Bottom note -->
  <rect x="40" y="412" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="434" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    模拟法按题意逐轮累加；数学法直接 return n − 1，O(1) 得解
  </text>
</svg>
