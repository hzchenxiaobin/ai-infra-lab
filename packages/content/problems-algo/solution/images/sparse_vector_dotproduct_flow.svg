<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">点积算法流程：遍历较小哈希表，查另一表同下标</text>

  <!-- Step 1: init -->
  <rect x="180" y="50" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化：ans = 0</text>

  <!-- arrow down -->
  <path d="M 280 94 L 280 112" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: pick smaller map -->
  <rect x="130" y="116" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">选较小的哈希表 a 遍历</text>
  <text x="280" y="153" text-anchor="middle" font-size="10" fill="#666">if len(b) &lt; len(a): swap(a, b)</text>

  <!-- arrow down -->
  <path d="M 280 164 L 280 182" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop header (diamond) -->
  <polygon points="280,186 380,224 280,262 180,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a 还有下一项</text>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#666">(i, v) = next</text>

  <!-- No branch: exit -->
  <path d="M 380 224 L 470 224" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="232" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>

  <!-- Yes branch: down -->
  <path d="M 280 262 L 280 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 4: lookup diamond -->
  <polygon points="280,284 390,322 280,360 170,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b 中存在 i ?</text>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#666">b.count(i)</text>

  <!-- Yes: accumulate -->
  <path d="M 170 322 L 110 322" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="305" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="322" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ans +=</text>
  <text x="70" y="336" text-anchor="middle" font-size="10" fill="#333">v × b[i]</text>

  <!-- No: skip -->
  <path d="M 390 322 L 440 322" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="305" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="328" text-anchor="middle" font-size="10" fill="#333">跳过（贡献 0）</text>

  <!-- loop back arrow: from accumulate box up to loop diamond -->
  <path d="M 70 305 L 70 224 L 180 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <!-- loop back arrow: from skip box up to loop diamond -->
  <path d="M 485 305 L 485 224 L 380 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <text x="70" y="200" text-anchor="middle" font-size="9" fill="#888">回到循环</text>
  <text x="485" y="200" text-anchor="middle" font-size="9" fill="#888">回到循环</text>
</svg>
