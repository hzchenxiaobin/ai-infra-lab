<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：座位两两配对，组间缝隙自由选屏风位置</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">corridor = "SSPPSPS"  →  seats = [0, 1, 4, 6]</text>

  <!-- ===== Index labels ===== -->
  <g font-size="10" fill="#999">
    <text x="74"  y="68" text-anchor="middle">0</text>
    <text x="122" y="68" text-anchor="middle">1</text>
    <text x="170" y="68" text-anchor="middle">2</text>
    <text x="218" y="68" text-anchor="middle">3</text>
    <text x="266" y="68" text-anchor="middle">4</text>
    <text x="314" y="68" text-anchor="middle">5</text>
    <text x="362" y="68" text-anchor="middle">6</text>
  </g>

  <!-- ===== Screen position dashed lines (between cells, above) ===== -->
  <g stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)">
    <line x1="146" y1="56" x2="146" y2="138"/>
    <line x1="194" y1="56" x2="194" y2="138"/>
    <line x1="242" y1="56" x2="242" y2="138"/>
  </g>
  <g font-size="9.5" fill="#b85450" font-weight="bold">
    <text x="146" y="52" text-anchor="middle">缝隙2</text>
    <text x="194" y="52" text-anchor="middle">缝隙3</text>
    <text x="242" y="52" text-anchor="middle">缝隙4</text>
  </g>

  <!-- ===== Corridor cells ===== -->
  <g filter="url(#rough2)">
    <!-- S cells (blue) -->
    <rect x="50"  y="76" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="98"  y="76" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="242" y="76" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="338" y="76" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <!-- P cells (green) -->
    <rect x="146" y="76" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="194" y="76" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="290" y="76" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <text x="74"  y="107" fill="#446688">S</text>
    <text x="122" y="107" fill="#446688">S</text>
    <text x="170" y="107" fill="#4a7a3a">P</text>
    <text x="218" y="107" fill="#4a7a3a">P</text>
    <text x="266" y="107" fill="#446688">S</text>
    <text x="314" y="107" fill="#4a7a3a">P</text>
    <text x="362" y="107" fill="#446688">S</text>
  </g>

  <!-- ===== Pair brackets (orange, below cells) ===== -->
  <g stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)">
    <!-- Pair 0: cells 0-1 -->
    <path d="M52,134 L52,142 L144,142 L144,134"/>
    <!-- Pair 1: cells 4-6 -->
    <path d="M244,134 L244,142 L386,142 L386,134"/>
  </g>
  <g font-size="11" fill="#d6a040" font-weight="bold" text-anchor="middle">
    <text x="98"  y="156">组0 = {s₀, s₁} = {0, 1}</text>
    <text x="315" y="156">组1 = {s₂, s₃} = {4, 6}</text>
  </g>

  <!-- ===== Gap annotation ===== -->
  <rect x="100" y="172" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">组间缝隙 = s₂ − s₁ = 4 − 1 = 3</text>

  <!-- ===== Three valid screen positions visualization ===== -->
  <text x="40" y="226" font-size="11.5" fill="#446688" font-weight="bold">3 种合法方案（| = 额外屏风）：</text>

  <g font-size="11" font-family="'Comic Sans MS', monospace">
    <!-- Plan 1: SS | PPSPS -->
    <rect x="40" y="234" width="460" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="250" fill="#555">方案1：</text>
    <text x="110" y="250" fill="#446688" font-weight="bold">SS</text>
    <text x="140" y="250" fill="#b85450" font-weight="bold">|</text>
    <text x="152" y="250" fill="#4a7a3a">PPSPS</text>
    <text x="300" y="250" fill="#888">→ 段1: 2座  段2: 2座 ✓</text>

    <!-- Plan 2: SSP | PSPS -->
    <rect x="40" y="262" width="460" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="278" fill="#555">方案2：</text>
    <text x="110" y="278" fill="#446688" font-weight="bold">SSP</text>
    <text x="148" y="278" fill="#b85450" font-weight="bold">|</text>
    <text x="160" y="278" fill="#4a7a3a">PSPS</text>
    <text x="300" y="278" fill="#888">→ 段1: 2座  段2: 2座 ✓</text>

    <!-- Plan 3: SSPP | SPS -->
    <rect x="40" y="290" width="460" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="306" fill="#555">方案3：</text>
    <text x="110" y="306" fill="#446688" font-weight="bold">SSPP</text>
    <text x="156" y="306" fill="#b85450" font-weight="bold">|</text>
    <text x="168" y="306" fill="#4a7a3a">SPS</text>
    <text x="300" y="306" fill="#888">→ 段1: 2座  段2: 2座 ✓</text>
  </g>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="326" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">乘法原理：ans = ∏(组间缝隙数) = 3 = 3 × 1（mod 10⁹+7）</text>
  <text x="270" y="360" text-anchor="middle" font-size="10.5" fill="#555">配对唯一确定 · 组间选择独立 · 各缝隙数相乘</text>
</svg>
