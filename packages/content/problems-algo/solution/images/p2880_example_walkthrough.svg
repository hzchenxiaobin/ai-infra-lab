<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="348" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：4 行数据的三步变形</text>

  <!-- Left: original table -->
  <rect x="26" y="46" width="200" height="152" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="126" y="66" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">students</text>

  <rect x="34" y="74" width="22" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="74" width="66" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="126" y="74" width="58" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="186" y="74" width="32" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="91" y="89" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <text x="155" y="89" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="202" y="89" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="34" y="98" width="22" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="98" width="66" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="126" y="98" width="58" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="186" y="98" width="32" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="113" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="91" y="113" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold" filter="url(#rough2)">101</text>
  <text x="155" y="113" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Ulysses</text>
  <text x="202" y="113" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">13</text>

  <rect x="34" y="120" width="22" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="120" width="66" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="126" y="120" width="58" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="186" y="120" width="32" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="135" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="91" y="135" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">53</text>
  <text x="155" y="135" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">William</text>
  <text x="202" y="135" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">10</text>

  <rect x="34" y="142" width="22" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="142" width="66" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="126" y="142" width="58" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="186" y="142" width="32" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="157" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="91" y="157" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">128</text>
  <text x="155" y="157" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Henry</text>
  <text x="202" y="157" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">6</text>

  <rect x="34" y="164" width="22" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="164" width="66" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="126" y="164" width="58" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="186" y="164" width="32" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="179" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="91" y="179" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="155" y="179" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Henry</text>
  <text x="202" y="179" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11</text>

  <text x="126" y="214" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">Ulysses 行高亮：它是唯一幸存者</text>

  <!-- Arrow 1 -->
  <path d="M 228 109 L 248 109" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Mask panel -->
  <rect x="258" y="46" width="86" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="301" y="64" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">① 整列比较</text>
  <text x="301" y="78" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">sid == 101</text>

  <rect x="268" y="98" width="66" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="301" y="113" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">True</text>

  <rect x="268" y="120" width="66" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="135" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">False</text>

  <rect x="268" y="142" width="66" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="157" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">False</text>

  <rect x="268" y="164" width="66" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="179" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">False</text>

  <text x="301" y="214" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">True 留 · False 弃</text>

  <!-- Arrow 2 -->
  <path d="M 346 109 L 356 109" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Intermediate: after row filter -->
  <rect x="358" y="46" width="178" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="64" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">② 留 True 的行（索引不变）</text>

  <rect x="366" y="72" width="20" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="388" y="72" width="56" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="446" y="72" width="54" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="502" y="72" width="28" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="416" y="86" text-anchor="middle" font-size="8" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <text x="473" y="86" text-anchor="middle" font-size="8" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="516" y="86" text-anchor="middle" font-size="8" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="366" y="94" width="20" height="20" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="388" y="94" width="56" height="20" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="446" y="94" width="54" height="20" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="502" y="94" width="28" height="20" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="376" y="108" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="416" y="108" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">101</text>
  <text x="473" y="108" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Ulysses</text>
  <text x="516" y="108" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">13</text>

  <!-- Arrow 3 -->
  <path d="M 447 126 L 447 152" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="447" y="144" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">③ 投影 ['name','age']</text>

  <!-- Output -->
  <rect x="368" y="158" width="168" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="380" y="176" width="82" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="464" y="176" width="58" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="421" y="190" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="493" y="190" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="380" y="198" width="82" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="464" y="198" width="58" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="421" y="212" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Ulysses</text>
  <text x="493" y="212" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">13</text>

  <text x="452" y="248" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">student_id 列被丢弃 · 列序 = 列表序</text>

  <!-- Bottom: wrong forms -->
  <rect x="26" y="244" width="316" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="184" y="266" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⚠️ 对照错误形态</text>
  <text x="184" y="288" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[['age','name']] → 数据对、列序反 → 判错</text>
  <text x="184" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">iterrows 手拼空结果 → 空表连列名都丢</text>
</svg>
