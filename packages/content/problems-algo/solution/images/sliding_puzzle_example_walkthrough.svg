<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：5 步解开谜板</text>
  <path d="M 300 42 Q 440 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="62" text-anchor="middle" font-size="12" fill="#7a7a7a">初始 [[4,1,2],[5,0,3]] → 目标 [[1,2,3],[4,5,0]]</text>

  <!-- 6 boards in a row: step 0..5, each ~130 wide -->
  <!-- helper: each board cell 36x36, board 108x72 -->

  <!-- ===== STEP 0 ===== -->
  <g transform="translate(36,110)">
    <text x="54" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a5a5a">步 0 · 起点</text>
    <g filter="url(#sk2)">
      <rect x="0" y="0" width="108" height="72" rx="5" fill="#fff" stroke="#446688" stroke-width="1.6"/>
      <line x1="36" y1="0" x2="36" y2="72" stroke="#446688" stroke-width="1.3"/>
      <line x1="72" y1="0" x2="72" y2="72" stroke="#446688" stroke-width="1.3"/>
      <line x1="0" y1="36" x2="108" y2="36" stroke="#446688" stroke-width="1.3"/>
    </g>
    <!-- highlight 0 at pos4 (row1,col1) -->
    <g filter="url(#sk2)"><rect x="36" y="36" width="36" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <g font-size="16" font-weight="bold" fill="#34506e" text-anchor="middle">
      <text x="18" y="24">4</text><text x="54" y="24">1</text><text x="90" y="24">2</text>
      <text x="18" y="60">5</text>
    </g>
    <text x="54" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040">0</text>
    <text x="54" y="92" text-anchor="middle" font-size="10" fill="#7f9cc0">"412503"</text>
    <text x="54" y="106" text-anchor="middle" font-size="9.5" fill="#7a7a7a">0 在位置 4</text>
  </g>

  <!-- arrow 0->1 -->
  <path d="M 152 146 L 178 146" stroke="#4a7e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="165" y="138" text-anchor="middle" font-size="9.5" fill="#2e6e2e">↙</text>

  <!-- ===== STEP 1: 0↔3 (left)  board: 4 1 2 / 0 5 3 ===== -->
  <g transform="translate(184,110)">
    <text x="54" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a5a5a">步 1</text>
    <g filter="url(#sk2)">
      <rect x="0" y="0" width="108" height="72" rx="5" fill="#fff" stroke="#446688" stroke-width="1.6"/>
      <line x1="36" y1="0" x2="36" y2="72" stroke="#446688" stroke-width="1.3"/>
      <line x1="72" y1="0" x2="72" y2="72" stroke="#446688" stroke-width="1.3"/>
      <line x1="0" y1="36" x2="108" y2="36" stroke="#446688" stroke-width="1.3"/>
    </g>
    <g filter="url(#sk2)"><rect x="0" y="36" width="36" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <g font-size="16" font-weight="bold" fill="#34506e" text-anchor="middle">
      <text x="18" y="24">4</text><text x="54" y="24">1</text><text x="90" y="24">2</text>
      <text x="54" y="60">5</text><text x="90" y="60">3</text>
    </g>
    <text x="18" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040">0</text>
    <text x="54" y="92" text-anchor="middle" font-size="10" fill="#7f9cc0">"412053"</text>
    <text x="54" y="106" text-anchor="middle" font-size="9.5" fill="#7a7a7a">0↔3 (向左)</text>
  </g>

  <!-- arrow 1->2 -->
  <path d="M 300 146 L 326 146" stroke="#4a7e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="313" y="138" text-anchor="middle" font-size="9.5" fill="#2e6e2e">↖</text>

  <!-- ===== STEP 2: 0↔0 (up) board: 0 1 2 / 4 5 3 ===== -->
  <g transform="translate(332,110)">
    <text x="54" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a5a5a">步 2</text>
    <g filter="url(#sk2)">
      <rect x="0" y="0" width="108" height="72" rx="5" fill="#fff" stroke="#446688" stroke-width="1.6"/>
      <line x1="36" y1="0" x2="36" y2="72" stroke="#446688" stroke-width="1.3"/>
      <line x1="72" y1="0" x2="72" y2="72" stroke="#446688" stroke-width="1.3"/>
      <line x1="0" y1="36" x2="108" y2="36" stroke="#446688" stroke-width="1.3"/>
    </g>
    <g filter="url(#sk2)"><rect x="0" y="0" width="36" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <g font-size="16" font-weight="bold" fill="#34506e" text-anchor="middle">
      <text x="54" y="24">1</text><text x="90" y="24">2</text>
      <text x="18" y="60">4</text><text x="54" y="60">5</text><text x="90" y="60">3</text>
    </g>
    <text x="18" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040">0</text>
    <text x="54" y="92" text-anchor="middle" font-size="10" fill="#7f9cc0">"012453"</text>
    <text x="54" y="106" text-anchor="middle" font-size="9.5" fill="#7a7a7a">0↔0 (向上)</text>
  </g>

  <!-- arrow 2->3 -->
  <path d="M 448 146 L 474 146" stroke="#4a7e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="461" y="138" text-anchor="middle" font-size="9.5" fill="#2e6e2e">→</text>

  <!-- ===== STEP 3: 0↔1 (right) board: 1 0 2 / 4 5 3 ===== -->
  <g transform="translate(480,110)">
    <text x="54" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a5a5a">步 3</text>
    <g filter="url(#sk2)">
      <rect x="0" y="0" width="108" height="72" rx="5" fill="#fff" stroke="#446688" stroke-width="1.6"/>
      <line x1="36" y1="0" x2="36" y2="72" stroke="#446688" stroke-width="1.3"/>
      <line x1="72" y1="0" x2="72" y2="72" stroke="#446688" stroke-width="1.3"/>
      <line x1="0" y1="36" x2="108" y2="36" stroke="#446688" stroke-width="1.3"/>
    </g>
    <g filter="url(#sk2)"><rect x="36" y="0" width="36" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <g font-size="16" font-weight="bold" fill="#34506e" text-anchor="middle">
      <text x="18" y="24">1</text><text x="90" y="24">2</text>
      <text x="18" y="60">4</text><text x="54" y="60">5</text><text x="90" y="60">3</text>
    </g>
    <text x="54" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040">0</text>
    <text x="54" y="92" text-anchor="middle" font-size="10" fill="#7f9cc0">"102453"</text>
    <text x="54" y="106" text-anchor="middle" font-size="9.5" fill="#7a7a7a">0↔1 (向右)</text>
  </g>

  <!-- arrow 3->4 -->
  <path d="M 596 146 L 622 146" stroke="#4a7e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="609" y="138" text-anchor="middle" font-size="9.5" fill="#2e6e2e">→</text>

  <!-- ===== STEP 4: 0↔2 (right) board: 1 2 0 / 4 5 3 ===== -->
  <g transform="translate(628,110)">
    <text x="54" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a5a5a">步 4</text>
    <g filter="url(#sk2)">
      <rect x="0" y="0" width="108" height="72" rx="5" fill="#fff" stroke="#446688" stroke-width="1.6"/>
      <line x1="36" y1="0" x2="36" y2="72" stroke="#446688" stroke-width="1.3"/>
      <line x1="72" y1="0" x2="72" y2="72" stroke="#446688" stroke-width="1.3"/>
      <line x1="0" y1="36" x2="108" y2="36" stroke="#446688" stroke-width="1.3"/>
    </g>
    <g filter="url(#sk2)"><rect x="72" y="0" width="36" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <g font-size="16" font-weight="bold" fill="#34506e" text-anchor="middle">
      <text x="18" y="24">1</text><text x="54" y="24">2</text>
      <text x="18" y="60">4</text><text x="54" y="60">5</text><text x="90" y="60">3</text>
    </g>
    <text x="90" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040">0</text>
    <text x="54" y="92" text-anchor="middle" font-size="10" fill="#7f9cc0">"120453"</text>
    <text x="54" y="106" text-anchor="middle" font-size="9.5" fill="#7a7a7a">0↔2 (向右)</text>
  </g>

  <!-- arrow 4->5 -->
  <path d="M 744 146 L 770 146" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="757" y="138" text-anchor="middle" font-size="9.5" fill="#b85450">↓</text>

  <!-- ===== STEP 5: TARGET board: 1 2 3 / 4 5 0 ===== -->
  <g transform="translate(772,110)">
    <text x="54" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">步 5 · 目标 ⭐</text>
    <g filter="url(#sk2)">
      <rect x="0" y="0" width="108" height="72" rx="5" fill="#fff0f3" stroke="#b85450" stroke-width="2.2"/>
      <line x1="36" y1="0" x2="36" y2="72" stroke="#b85450" stroke-width="1.3"/>
      <line x1="72" y1="0" x2="72" y2="72" stroke="#b85450" stroke-width="1.3"/>
      <line x1="0" y1="36" x2="108" y2="36" stroke="#b85450" stroke-width="1.3"/>
    </g>
    <g filter="url(#sk2)"><rect x="72" y="36" width="36" height="36" rx="3" fill="#fdecee" stroke="#b85450" stroke-width="2"/></g>
    <g font-size="16" font-weight="bold" fill="#b85450" text-anchor="middle">
      <text x="18" y="24">1</text><text x="54" y="24">2</text><text x="90" y="24">3</text>
      <text x="18" y="60">4</text><text x="54" y="60">5</text>
    </g>
    <text x="90" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">0</text>
    <text x="54" y="92" text-anchor="middle" font-size="10" fill="#b85450">"123450"</text>
    <text x="54" y="106" text-anchor="middle" font-size="9.5" fill="#b85450">0↔5 (向下)</text>
  </g>

  <!-- ===== bottom: path trace + insight ===== -->
  <g filter="url(#sk2)">
    <rect x="36" y="270" width="808" height="120" rx="10" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.4"/>
  </g>
  <text x="440" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">0 的游走轨迹：位置 4 → 3 → 0 → 1 → 2 → 5（目标位）</text>

  <!-- mini path dots -->
  <g font-size="11" fill="#34506e" text-anchor="middle">
    <g filter="url(#sk2)"><circle cx="120" cy="330" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="120" y="334">4</text>
    <g filter="url(#sk2)"><circle cx="220" cy="330" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="220" y="334">3</text>
    <g filter="url(#sk2)"><circle cx="320" cy="330" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="320" y="334">0</text>
    <g filter="url(#sk2)"><circle cx="420" cy="330" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="420" y="334">1</text>
    <g filter="url(#sk2)"><circle cx="520" cy="330" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="520" y="334">2</text>
    <g filter="url(#sk2)"><circle cx="620" cy="330" r="16" fill="#fff0f3" stroke="#b85450" stroke-width="2"/></g>
    <text x="620" y="334" fill="#b85450" font-weight="bold">5</text>
  </g>
  <g stroke="#4a7e4a" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ar)">
    <line x1="138" y1="330" x2="200" y2="330"/>
    <line x1="238" y1="330" x2="300" y2="330"/>
    <line x1="338" y1="330" x2="400" y2="330"/>
    <line x1="438" y1="330" x2="500" y2="330"/>
    <line x1="538" y1="330" x2="600" y2="330"/>
  </g>
  <text x="660" y="334" font-size="11" fill="#b85450">⭐ 目标位</text>

  <text x="440" y="366" text-anchor="middle" font-size="11.5" fill="#2e6e2e">把 0 从中心位「拐」到右下角，途中顺带把 4,1,2,3 各就各位</text>
  <text x="440" y="384" text-anchor="middle" font-size="10.5" fill="#5a5a5a">BFS 不需要人工分析，自动探索出这条 5 步最短路径</text>

  <!-- ===== bottom note: unsolvable example 2 ===== -->
  <g filter="url(#sk2)">
    <rect x="36" y="410" width="808" height="96" rx="10" fill="#fdecee" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="440" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">对比：示例 2 [[1,2,3],[5,4,0]] 不可解</text>
  <text x="440" y="460" text-anchor="middle" font-size="11" fill="#7a3a3a">4 与 5 相对目标位置互换，空格已在目标位 → 逆序数为奇（不可解类）</text>
  <text x="440" y="478" text-anchor="middle" font-size="11" fill="#7a3a3a">BFS 遍历完 360 个可达状态后队空 → 自动返回 -1</text>
  <text x="440" y="496" text-anchor="middle" font-size="10.5" fill="#b85450">2x3 板（列数 3，奇）：展平后非零逆序数为偶才可解，720 个排列里恰 360 个可达</text>

  <text x="440" y="526" text-anchor="middle" font-size="10.5" fill="#5a5a5a">每次移动 = 0 与一个相邻格交换；状态总数 6!=720，BFS 复杂度 O(720×4)≈2880</text>
</svg>
