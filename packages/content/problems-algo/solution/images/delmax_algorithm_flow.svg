<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程</text>

  <!-- Box1 sort each row -->
  <rect x="170" y="50" width="180" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="79" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">对每一行升序排序</text>

  <path d="M260,96 L260,118" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2 init j=0 -->
  <rect x="220" y="120" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">j ← 0</text>

  <path d="M260,154 L260,176" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond j < n? -->
  <path d="M260,176 L336,218 L260,260 L184,218 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">j &lt; n ?</text>

  <!-- yes branch down -->
  <text x="270" y="276" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M260,260 L260,286" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box3 colMax -->
  <rect x="140" y="288" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">colMax = max(各行 grid[i][j])</text>

  <path d="M260,334 L260,356" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box4 ans += colMax -->
  <rect x="190" y="358" width="140" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">ans += colMax</text>

  <path d="M260,404 L260,426" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box5 j++ -->
  <rect x="225" y="428" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="450" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">j++</text>

  <!-- loop back: from Box5 left up to diamond left -->
  <path d="M225,445 L120,445 L120,218 L184,218" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="332" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">循环</text>

  <!-- no branch right -->
  <text x="346" y="210" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M336,218 L370,218" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box6 return ans -->
  <rect x="372" y="196" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="432" y="223" text-anchor="middle" font-size="14" fill="#2f5a22" filter="url(#rough2)">return ans</text>
</svg>
