<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：窗口把 ⌊均值⌋ 散射给 9 格，sum/cnt 双板聚合</text>

  <!-- window cards -->
  <rect x="36" y="44" width="176" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="124" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口 (0,0) ✓ 12 对全达标</text>
  <text x="124" y="82" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">sum=81 → avg=⌊81/9⌋=9</text>

  <rect x="36" y="108" width="176" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="124" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">窗口 (0,1) ✓ 12 对全达标</text>
  <text x="124" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sum=87 → ⌊87/9⌋=9.67→9</text>

  <path d="M 212 66 L 248 66" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 212 136 L 248 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="124" y="196" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">每个窗口只判定一次，</text>
  <text x="124" y="212" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">再把 avg 主动发给覆盖的</text>
  <text x="124" y="228" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">9 个像素（scatter 散射）</text>

  <!-- sum/cnt board -->
  <text x="356" y="46" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">sum / cnt 板（示例 1 处理完两个窗口后）</text>

  <g filter="url(#rough2)">
    <rect x="252" y="56" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="304" y="56" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="356" y="56" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="408" y="56" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="252" y="100" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="304" y="100" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="356" y="100" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="408" y="100" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="252" y="144" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="304" y="144" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="356" y="144" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="408" y="144" width="52" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
  </g>

  <!-- overlays -->
  <rect x="252" y="56" width="156" height="132" fill="#446688" fill-opacity="0.08" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="262" y="72" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">①</text>
  <rect x="304" y="56" width="156" height="132" fill="#4a7a3a" fill-opacity="0.08" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="72" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">②</text>

  <!-- board values -->
  <g font-size="14" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="278" y="80">9</text><text x="330" y="80">18</text><text x="382" y="80">18</text><text x="434" y="80">9</text>
    <text x="278" y="124">9</text><text x="330" y="124">18</text><text x="382" y="124">18</text><text x="434" y="124">9</text>
    <text x="278" y="168">9</text><text x="330" y="168">18</text><text x="382" y="168">18</text><text x="434" y="168">9</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="296" y="94">×1</text><text x="348" y="94">×2</text><text x="400" y="94">×2</text><text x="452" y="94">×1</text>
    <text x="296" y="138">×1</text><text x="348" y="138">×2</text><text x="400" y="138">×2</text><text x="452" y="138">×1</text>
    <text x="296" y="182">×1</text><text x="348" y="182">×2</text><text x="400" y="182">×2</text><text x="452" y="182">×1</text>
  </g>

  <!-- final formula box -->
  <rect x="36" y="262" width="448" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">收官：result[i][j] = cnt &gt; 0 ? ⌊sum / cnt⌋ : image[i][j]</text>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">中间列 ⌊18/2⌋=9，两侧列 ⌊9/1⌋=9；cnt=0 的格子沿用原值</text>

  <!-- double-floor warning -->
  <rect x="36" y="316" width="448" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 两次取整：洒进 sum 板的是「取整后」的 avg</text>
  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">窗口 (0,1) 均值 87/9 = 9.67，参与聚合的是 9；多区域最后再 ⌊平均⌋ 一次</text>
</svg>
