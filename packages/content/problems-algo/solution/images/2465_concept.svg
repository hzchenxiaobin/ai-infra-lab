<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：排序后第 i 轮必删 sorted[i] 与 sorted[n−1−i]，配对集合不变</text>

  <!-- Pairing arcs above sorted array (drawn first so cells overlay their ends) -->
  <path d="M 170 76 Q 280 40 390 76" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#446688">第 0 轮：最小=sorted[0]，最大=sorted[n−1]</text>
  <path d="M 214 76 Q 280 58 346 76" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="10.5" fill="#4a7a3a">第 1 轮</text>
  <path d="M 258 76 Q 280 70 302 76" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="10" fill="#d6a040">第 2 轮</text>

  <!-- Sorted array -->
  <text x="92" y="99" font-size="12" fill="#888">sorted =</text>
  <rect x="148" y="76" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="99" text-anchor="middle" font-size="16" fill="#333">0</text>
  <rect x="192" y="76" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="99" text-anchor="middle" font-size="16" fill="#333">1</text>
  <rect x="236" y="76" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="99" text-anchor="middle" font-size="16" fill="#333">3</text>
  <rect x="280" y="76" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="99" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">4</text>
  <rect x="324" y="76" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="99" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">4</text>
  <rect x="368" y="76" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="99" text-anchor="middle" font-size="16" fill="#333">5</text>

  <!-- index labels -->
  <text x="170" y="128" text-anchor="middle" font-size="9.5" fill="#888">i=0</text>
  <text x="214" y="128" text-anchor="middle" font-size="9.5" fill="#888">i=1</text>
  <text x="258" y="128" text-anchor="middle" font-size="9.5" fill="#888">i=2</text>
  <text x="302" y="128" text-anchor="middle" font-size="9.5" fill="#d6a040">n−1−2</text>
  <text x="346" y="128" text-anchor="middle" font-size="9.5" fill="#d6a040">n−1−1</text>
  <text x="390" y="128" text-anchor="middle" font-size="9.5" fill="#888">n−1−0</text>

  <!-- arrow -->
  <path d="M 280 132 L 280 150" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 276 146 L 280 152 L 284 146" fill="#888" filter="url(#rough2)"/>
  <text x="290" y="145" font-size="11" fill="#446688">① 首尾配对，三组 (值, 值)</text>

  <!-- 3 pair cards -->
  <rect x="40" y="154" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="110" y="176" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">pair (0, 5)</text>
  <text x="110" y="196" text-anchor="middle" font-size="11" fill="#446688">sum=5 → avg 2.5</text>

  <rect x="210" y="154" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">pair (1, 4)</text>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a">sum=5 → avg 2.5</text>

  <rect x="380" y="154" width="140" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="176" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">pair (3, 4)</text>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#d6a040">sum=7 → avg 3.5</text>

  <!-- arrow -->
  <path d="M 280 212 L 280 230" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 276 226 L 280 232 L 284 226" fill="#888" filter="url(#rough2)"/>
  <text x="290" y="225" font-size="11" fill="#446688">② 存 (a+b) 入集合（避浮点）</text>

  <!-- result -->
  <rect x="120" y="234" width="320" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">集合 {5, 7} → 不同平均值 = 2 ✓</text>

  <!-- invariant note -->
  <rect x="24" y="292" width="512" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333">⚠️ 重复元素（如两个 4）：删哪个索引都行，但第 i 轮最小值恒为 sorted[i]、最大值恒为 sorted[n−1−i]</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#333">值不变 → 配对集合唯一确定 → 平均值集合与删除顺序无关</text>

  <text x="24" y="360" font-size="10.5" fill="#888">• (a+b)/2 相异 ⟺ (a+b) 相异：存和省去浮点除法，0~100 值域下和在 0~200 内</text>
  <text x="24" y="378" font-size="10.5" fill="#888">• 配对由排序固定：无需逐轮真的删 min/max，一次排序 + 首尾对扫即可</text>
</svg>
