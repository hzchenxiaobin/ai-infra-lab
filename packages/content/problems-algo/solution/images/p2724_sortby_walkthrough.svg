<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2724w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 3 演算：arr = [[3,4],[5,2],[10,1]], fn = x =&gt; x[1]</text>

  <!-- Step 1: decorate -->
  <text x="40" y="62" font-size="13" fill="#446688" font-weight="bold">① decorate：每个元素配一个键</text>

  <rect x="40" y="74" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="80" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[3,4]</text>
  <text x="130" y="96" font-size="11" fill="#888">→ fn →</text>
  <rect x="176" y="74" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="196" y="96" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <text x="226" y="96" font-size="11" fill="#888">配对 →</text>
  <rect x="278" y="74" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="328" y="96" text-anchor="middle" font-size="11" fill="#333">[4, [3,4]]</text>

  <rect x="40" y="116" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="80" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[5,2]</text>
  <text x="130" y="138" font-size="11" fill="#888">→ fn →</text>
  <rect x="176" y="116" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="196" y="138" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="226" y="138" font-size="11" fill="#888">配对 →</text>
  <rect x="278" y="116" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="328" y="138" text-anchor="middle" font-size="11" fill="#333">[2, [5,2]]</text>

  <rect x="40" y="158" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[10,1]</text>
  <text x="130" y="180" font-size="11" fill="#888">→ fn →</text>
  <rect x="176" y="158" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="196" y="180" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="226" y="180" font-size="11" fill="#888">配对 →</text>
  <rect x="278" y="158" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="328" y="180" text-anchor="middle" font-size="11" fill="#333">[1, [10,1]]</text>

  <!-- arrow to step 2 -->
  <path d="M328,196 L328,220" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2724w)" filter="url(#rough2)"/>

  <!-- Step 2: sort by key -->
  <text x="40" y="240" font-size="13" fill="#4a7a3a" font-weight="bold">② sort：按键（首位）升序重排配对</text>

  <rect x="40" y="252" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="90" y="274" text-anchor="middle" font-size="11" fill="#333">[1, [10,1]]</text>

  <rect x="160" y="252" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="210" y="274" text-anchor="middle" font-size="11" fill="#333">[2, [5,2]]</text>

  <rect x="280" y="252" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="330" y="274" text-anchor="middle" font-size="11" fill="#333">[4, [3,4]]</text>

  <text x="400" y="274" font-size="11" fill="#4a7a3a">键：1 &lt; 2 &lt; 4 ✓</text>

  <!-- arrow to step 3 -->
  <path d="M210,290 L210,314" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2724w)" filter="url(#rough2)"/>

  <!-- Step 3: undecorate -->
  <text x="40" y="334" font-size="13" fill="#d6a040" font-weight="bold">③ undecorate：丢弃键，只留元素</text>

  <rect x="40" y="346" width="80" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="80" y="371" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">[10,1]</text>

  <rect x="160" y="346" width="80" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="200" y="371" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">[5,2]</text>

  <rect x="280" y="346" width="80" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="320" y="371" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">[3,4]</text>

  <text x="390" y="371" font-size="11" fill="#888">输出</text>

  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#888">fn 在 ① 只调 n 次；② 只比预存键，不再碰 fn</text>
</svg>
