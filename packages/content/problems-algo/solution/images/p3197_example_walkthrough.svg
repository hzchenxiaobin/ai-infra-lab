<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="348" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：grid = [[1,0,1,0],[0,1,0,1]]，1 在 (0,0) (0,2) (1,1) (1,3)</text>

  <!-- 左：三竖条 -->
  <text x="116" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">三竖条（切 i=2, j=3 为例）</text>
  <rect x="48" y="60" width="68" height="68" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="116" y="60" width="34" height="68" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="150" y="60" width="34" height="68" fill="#fff8e1" filter="url(#rough2)"/>
  <line x1="82" y1="60" x2="82" y2="128" stroke="#ffffff" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="116" y1="60" x2="116" y2="128" stroke="#ffffff" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="60" x2="150" y2="128" stroke="#ffffff" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="48" y1="94" x2="184" y2="94" stroke="#ffffff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="82" text-anchor="middle" font-size="13" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="133" y="82" text-anchor="middle" font-size="13" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="99" y="116" text-anchor="middle" font-size="13" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="167" y="116" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="48" y="60" width="136" height="68" fill="none" stroke="#999" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="48" y="60" width="68" height="68" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" rx="2" filter="url(#rough2)"/>
  <rect x="116" y="60" width="34" height="34" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" rx="2" filter="url(#rough2)"/>
  <rect x="150" y="94" width="34" height="34" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" rx="2" filter="url(#rough2)"/>
  <line x1="116" y1="52" x2="116" y2="138" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="150" y1="52" x2="150" y2="138" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="58" y="142" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="82" y="157" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">2×2=4</text>
  <rect x="116" y="142" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="133" y="157" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="150" y="142" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="167" y="157" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="21" y="176" width="190" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="116" y="197" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">三竖条（最好）= 4+1+1 = 6</text>

  <!-- 右：T 型 -->
  <text x="440" y="50" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">T 型：上整 · 下切（r=1, c=2）</text>
  <rect x="372" y="60" width="136" height="34" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="372" y="94" width="68" height="34" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="440" y="94" width="68" height="34" fill="#fff8e1" filter="url(#rough2)"/>
  <line x1="406" y1="60" x2="406" y2="128" stroke="#ffffff" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="440" y1="60" x2="440" y2="128" stroke="#ffffff" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="474" y1="60" x2="474" y2="128" stroke="#ffffff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="389" y="82" text-anchor="middle" font-size="13" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="457" y="82" text-anchor="middle" font-size="13" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="423" y="116" text-anchor="middle" font-size="13" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="491" y="116" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="372" y="60" width="136" height="68" fill="none" stroke="#999" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="372" y="60" width="102" height="34" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" rx="2" filter="url(#rough2)"/>
  <rect x="406" y="94" width="34" height="34" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" rx="2" filter="url(#rough2)"/>
  <rect x="474" y="94" width="34" height="34" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" rx="2" filter="url(#rough2)"/>
  <line x1="364" y1="94" x2="516" y2="94" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="440" y1="88" x2="440" y2="138" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="372" y="142" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="398" y="157" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1×3=3</text>
  <rect x="440" y="142" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="457" y="157" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="474" y="142" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="491" y="157" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="349" y="176" width="190" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="444" y="197" text-anchor="middle" font-size="12" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">T 型 = 3+1+1 = 5 ✓ 最优</text>

  <!-- 结论 -->
  <rect x="21" y="224" width="518" height="112" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">为什么 T 型能赢？</text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(0,0) 与 (0,2) 同在第 0 行。竖切时 (0,0) 与 (1,1) 被关进同一段，</text>
  <text x="280" y="283" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">段内包围盒被迫跨 2 行（2×2=4，怎么切都 ≥ 6）；</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">T 型让第 0 行独享一条 1×3 横带，第 1 行的两个孤点各占 1 格；</text>
  <text x="280" y="317" text-anchor="middle" font-size="11" fill="#8c2f28" filter="url(#rough2)">直觉：第一刀顺着「1 的聚集方向」切，第二刀再去处理散点。</text>
</svg>
