<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：s = "dart"，k = 3（n = 4）</text>

  <!-- 表头 -->
  <rect x="40" y="48" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="110" y="48" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i + k</text>
  <rect x="190" y="48" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(i+k) mod 4</text>
  <rect x="290" y="48" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s[j]</text>

  <!-- 行 i=0 -->
  <rect x="40" y="82" width="70" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="110" y="82" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="190" y="82" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="101" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="290" y="82" width="90" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t</text>

  <!-- 行 i=1 -->
  <rect x="40" y="116" width="70" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="116" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="190" y="116" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="135" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 ← 绕回</text>
  <rect x="290" y="116" width="90" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d</text>

  <!-- 行 i=2 -->
  <rect x="40" y="150" width="70" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="150" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="190" y="150" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ← 绕回</text>
  <rect x="290" y="150" width="90" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>

  <!-- 行 i=3 -->
  <rect x="40" y="184" width="70" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="110" y="184" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="190" y="184" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="203" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 ← 绕回</text>
  <rect x="290" y="184" width="90" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r</text>

  <!-- 结果串 -->
  <text x="75" y="248" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">结果 res：</text>
  <rect x="40" y="258" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="281" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">t</text>
  <rect x="84" y="258" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="281" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">d</text>
  <rect x="128" y="258" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="281" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <rect x="172" y="258" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="281" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">r</text>
  <text x="130" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">输出 "tdar" ✓</text>

  <!-- 右侧注解框 -->
  <rect x="400" y="82" width="108" height="130" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">红色格 = 绕回</text>
  <text x="454" y="124" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i+k ≥ n 时</text>
  <text x="454" y="140" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">mod n 从头数</text>
  <text x="454" y="162" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">每列一次取模</text>
  <text x="454" y="178" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">无分支无特判</text>
  <text x="454" y="200" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（i, k ≥ 0 安全）</text>

  <!-- 示例2 -->
  <rect x="400" y="226" width="108" height="94" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2</text>
  <text x="454" y="268" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">s = "aaa", k = 1</text>
  <text x="454" y="288" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">字符全相同</text>
  <text x="454" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">→ "aaa"</text>

  <text x="130" y="344" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k = 3 ≡ −1 (mod 4)：等价于把每个字符换成前一个，末字符绕回首格</text>
</svg>
