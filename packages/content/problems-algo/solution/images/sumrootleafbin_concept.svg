<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：根到叶路径按位拼成二进制数，再求所有路径之和</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">每往下一层：cur = cur × 2 + node.val  （即 cur &lt;&lt; 1 | val）</text>

  <!-- tree: 1 -> 0,1 ; 0 -> 0,1 ; 1 -> 0,1 -->
  <!-- root 1 -->
  <circle cx="190" cy="80" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="190" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- level 1: 0 and 1 -->
  <circle cx="120" cy="142" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="148" text-anchor="middle" font-size="14" fill="#333">0</text>
  <circle cx="260" cy="142" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- edges level 1 -->
  <path d="M 175 96 L 135 124" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 205 96 L 245 124" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- level 2 (leaves): 0 1 0 1 -->
  <circle cx="70" cy="210" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="70" y="216" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <circle cx="170" cy="210" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="170" y="216" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <circle cx="210" cy="210" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="210" y="216" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <circle cx="310" cy="210" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="310" y="216" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- edges level 2 -->
  <path d="M 107 158 L 85 190" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 133 158 L 157 190" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 247 158 L 225 190" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 273 158 L 297 190" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- path chips under leaves -->
  <rect x="36" y="240" width="68" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 0 0</text>
  <rect x="136" y="240" width="68" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="170" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 0 1</text>
  <rect x="176" y="240" width="68" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 1 0</text>
  <rect x="276" y="240" width="68" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 1 1</text>

  <!-- right side: explanation -->
  <path d="M 380 56 L 380 320" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <text x="480" y="64" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">四条根到叶路径</text>

  <rect x="410" y="76" width="146" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="483" y="92" text-anchor="middle" font-size="10" fill="#333">1 → 0 → 0</text>
  <text x="483" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">100(2) = 4</text>

  <rect x="410" y="124" width="146" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="483" y="140" text-anchor="middle" font-size="10" fill="#333">1 → 0 → 1</text>
  <text x="483" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">101(2) = 5</text>

  <rect x="410" y="172" width="146" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="483" y="188" text-anchor="middle" font-size="10" fill="#333">1 → 1 → 0</text>
  <text x="483" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">110(2) = 6</text>

  <rect x="410" y="220" width="146" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="483" y="236" text-anchor="middle" font-size="10" fill="#333">1 → 1 → 1</text>
  <text x="483" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">111(2) = 7</text>

  <rect x="396" y="272" width="174" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="483" y="292" text-anchor="middle" font-size="11" fill="#333">总和</text>
  <text x="483" y="310" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">4 + 5 + 6 + 7 = 22</text>

  <text x="190" y="300" text-anchor="middle" font-size="10" fill="#888">每深入一层，已有数字左移一位（×2）再补上当前节点值</text>
</svg>
