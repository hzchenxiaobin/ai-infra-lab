<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,1,3,3]</text>

  <!-- discretization -->
  <rect x="60" y="34" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">离散化：排序去重 [1,2,3]；rank(1)=1，rank(2)=2，rank(3)=3</text>

  <!-- table header -->
  <rect x="40" y="80" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="97" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="147" y="97" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x（名次 r）</text>
  <text x="233" y="97" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c1（arr1）</text>
  <text x="319" y="97" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c2（arr2）</text>
  <text x="421" y="97" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定与去向</text>

  <!-- row 1 -->
  <rect x="40" y="106" width="440" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">①</text>
  <text x="147" y="127" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2（r=2）</text>
  <text x="233" y="127" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="319" y="127" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="421" y="127" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">规定 → arr1</text>

  <!-- row 2 -->
  <rect x="40" y="138" width="440" height="32" fill="#fbfbf6" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">②</text>
  <text x="147" y="159" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1（r=1）</text>
  <text x="233" y="159" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="319" y="159" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="421" y="159" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">规定 → arr2</text>

  <!-- row 3 -->
  <rect x="40" y="170" width="440" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③</text>
  <text x="147" y="191" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3（r=3）</text>
  <text x="233" y="191" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">1 − 1 = 0</text>
  <text x="319" y="191" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">1 − 1 = 0</text>
  <text x="421" y="191" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">平局且等长 → arr1</text>

  <!-- row 4 -->
  <rect x="40" y="202" width="440" height="32" fill="#fbfbf6" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④</text>
  <text x="147" y="223" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3（r=3）</text>
  <text x="233" y="223" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">2 − 2 = 0</text>
  <text x="319" y="223" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">1 − 1 = 0</text>
  <text x="421" y="223" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">平局，arr2 短 → arr2</text>

  <!-- column separators -->
  <path d="M 104 82 L 104 234" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 190 82 L 190 234" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 276 82 L 276 234" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 362 82 L 362 234" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <text x="260" y="251" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">注：c1 = |arr1| − query(tree1, r)，即 arr1 中严格大于 x 的个数（c2 同理）</text>

  <!-- arr1 lane -->
  <text x="52" y="282" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">arr1：</text>
  <rect x="96" y="262" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="115" y="283" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="127" y="273" font-size="8.5" fill="#446688" filter="url(#rough2)">①</text>
  <rect x="142" y="262" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="161" y="283" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="173" y="273" font-size="8.5" fill="#446688" filter="url(#rough2)">③</text>
  <text x="200" y="282" font-size="10" fill="#446688" filter="url(#rough2)">① 首元素规定入 arr1；③ 平局且等长入 arr1</text>

  <!-- arr2 lane -->
  <text x="52" y="322" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">arr2：</text>
  <rect x="96" y="302" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="115" y="323" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="127" y="313" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">②</text>
  <rect x="142" y="302" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="161" y="323" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="173" y="313" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">④</text>
  <text x="200" y="322" font-size="10" fill="#4a7a3a" filter="url(#rough2)">② 次元素规定入 arr2；④ 平局时 arr2 更短</text>

  <!-- result -->
  <rect x="110" y="350" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">result = arr1 + arr2 = [2,3,1,3] ✓</text>
</svg>
