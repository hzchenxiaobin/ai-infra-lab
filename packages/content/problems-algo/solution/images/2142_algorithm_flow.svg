<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：累积计数 + LAG 差分</text>

  <!-- ===== Step 1: LEFT JOIN ===== -->
  <text x="50" y="52" font-size="10" fill="#888">① LEFT JOIN</text>
  <g filter="url(#rough2)"><rect x="40" y="58" width="260" height="52" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8"/></g>
  <text x="170" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Buses LEFT JOIN Passengers</text>
  <text x="170" y="96" text-anchor="middle" font-size="9" fill="#888">ON p.arrival_time ≤ b.arrival_time</text>
  <text x="170" y="108" text-anchor="middle" font-size="9" fill="#888">每辆巴士关联所有已到达的乘客</text>

  <!-- Arrow 1 -->
  <path d="M 170 112 L 170 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: GROUP BY + COUNT ===== -->
  <text x="50" y="136" font-size="10" fill="#888">② GROUP BY + COUNT</text>
  <g filter="url(#rough2)"><rect x="40" y="142" width="260" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/></g>
  <text x="170" y="162" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY bus_id</text>
  <text x="170" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">COUNT(passenger_id)</text>
  <text x="170" y="196" text-anchor="middle" font-size="9" fill="#888">→ 累积乘客数（含被前车接走的）</text>

  <!-- Arrow 2 -->
  <path d="M 170 206 L 170 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: LAG window ===== -->
  <text x="50" y="230" font-size="10" fill="#888">③ LAG 窗口函数</text>
  <g filter="url(#rough2)"><rect x="40" y="236" width="260" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/></g>
  <text x="170" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">LAG(COUNT(...), 1, 0)</text>
  <text x="170" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">OVER (ORDER BY arrival_time)</text>
  <text x="170" y="290" text-anchor="middle" font-size="9" fill="#888">→ 前一辆车的累积乘客数</text>

  <!-- Arrow 3 -->
  <path d="M 170 300 L 170 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: 差分 ===== -->
  <text x="50" y="324" font-size="10" fill="#888">④ 差分 = 本车乘客数</text>
  <g filter="url(#rough2)"><rect x="40" y="330" width="260" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/></g>
  <text x="170" y="350" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">COUNT - LAG(COUNT)</text>
  <text x="170" y="368" text-anchor="middle" font-size="9" fill="#888">= 本车新增乘客（未被前车接走）</text>
  <text x="170" y="378" text-anchor="middle" font-size="9" fill="#888">ORDER BY bus_id 输出</text>

  <!-- ===== Right side: cumulative table ===== -->
  <g filter="url(#rough2)"><rect x="340" y="142" width="200" height="200" rx="8" fill="#fff" stroke="#999" stroke-width="1.2"/></g>
  <text x="440" y="162" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">累积计数表</text>
  <line x1="340" y1="168" x2="540" y2="168" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="354" y="182" font-size="9" fill="#888" font-weight="bold">bus_id</text>
  <text x="400" y="182" font-size="9" fill="#888" font-weight="bold">cum</text>
  <text x="444" y="182" font-size="9" fill="#888" font-weight="bold">lag</text>
  <text x="486" y="182" font-size="9" fill="#888" font-weight="bold">cnt</text>
  <line x1="340" y1="186" x2="540" y2="186" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="358" y="202" font-size="10" fill="#4a8edb" font-weight="bold">1</text>
  <text x="404" y="202" font-size="10" fill="#4a8edb" font-weight="bold">1</text>
  <text x="448" y="202" font-size="10" fill="#888">0</text>
  <text x="490" y="202" font-size="10" fill="#4a8edb" font-weight="bold">1</text>

  <text x="358" y="220" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="404" y="220" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="448" y="220" font-size="10" fill="#888">1</text>
  <text x="490" y="220" font-size="10" fill="#446688" font-weight="bold">0</text>

  <text x="358" y="238" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="404" y="238" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <text x="448" y="238" font-size="10" fill="#888">1</text>
  <text x="490" y="238" font-size="10" fill="#d6a040" font-weight="bold">3</text>

  <text x="440" y="266" text-anchor="middle" font-size="9" fill="#888">cum = COUNT（累积）</text>
  <text x="440" y="280" text-anchor="middle" font-size="9" fill="#888">lag = 前车 cum</text>
  <text x="440" y="294" text-anchor="middle" font-size="9" fill="#888">cnt = cum − lag</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)"><rect x="40" y="400" width="480" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="60" y="420" font-size="11" fill="#b85450" font-weight="bold">💡 累积计数天然排除被前车接走的乘客：差分 = 本车区间新增</text>
</svg>
