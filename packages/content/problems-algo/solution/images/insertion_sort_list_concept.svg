<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fdfcf7"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">对链表插入排序：哑节点 + 正向扫描找位</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11" fill="#888">链表无前驱指针 → 从 dummy 起向后扫，找到首个 prev.next.val ≥ cur.val 的位置</text>

  <!-- ===== 原链表 ===== -->
  <text x="24" y="92" font-size="12" fill="#888" font-weight="bold">原链表</text>
  <g filter="url(#sk)">
    <rect x="90" y="80" width="50" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="160" y="80" width="50" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="230" y="80" width="50" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="300" y="80" width="50" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="115" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">4</text>
  <text x="185" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>
  <text x="255" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="325" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>
  <path d="M 140 96 L 158 96" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 210 96 L 228 96" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 280 96 L 298 96" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- cur 指针 -->
  <text x="185" y="70" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">cur</text>
  <path d="M 185 72 L 185 78" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="2,2" filter="url(#sk)"/>
  <text x="380" y="98" font-size="10" fill="#888">已排序段：[4]</text>
  <text x="380" y="112" font-size="10" fill="#888">待插入：2, 1, 3</text>

  <!-- 分隔线 -->
  <path d="M 40 128 L 600 128" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#sk)"/>

  <!-- ===== 新链表（已排序段 + dummy） ===== -->
  <text x="24" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">新链表</text>
  <g filter="url(#sk)">
    <rect x="60" y="150" width="58" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="138" y="150" width="50" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="208" y="150" width="50" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3,2"/>
  </g>
  <text x="89" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dummy</text>
  <text x="163" y="170" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">4</text>
  <text x="233" y="170" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <path d="M 118 166 L 136 166" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- 即将插入的虚线指针 -->
  <path d="M 188 166 L 206 166" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- prev 指针 -->
  <text x="89" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">prev</text>
  <path d="M 89 142 L 89 150" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="2,2" filter="url(#sk)"/>

  <!-- 扫描说明 -->
  <text x="300" y="162" font-size="11" fill="#4a7a3a" font-weight="bold">① prev = dummy，从头正向扫</text>
  <text x="300" y="178" font-size="11" fill="#4a7a3a">② prev.next.val(4) ≥ cur.val(2) → 停！</text>

  <!-- 插入动作箭头 -->
  <path d="M 233 188 Q 200 210 163 188" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="200" y="222" text-anchor="middle" font-size="10" fill="#b85450">③ 插入：cur.next = prev.next; prev.next = cur</text>

  <!-- ===== 插入后状态 ===== -->
  <text x="24" y="252" font-size="12" fill="#888" font-weight="bold">插入后</text>
  <g filter="url(#sk)">
    <rect x="60" y="242" width="58" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="138" y="242" width="50" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="208" y="242" width="50" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="89" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dummy</text>
  <text x="163" y="262" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">2</text>
  <text x="233" y="262" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">4</text>
  <path d="M 118 258 L 136 258" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 188 258 L 206 258" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="290" y="262" font-size="11" fill="#888">已排序段：[2,4]，cur 前进到下一个待插节点 1</text>

  <!-- 右侧说明框 -->
  <g filter="url(#sk)">
    <rect x="420" y="290" width="200" height="130" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="520" y="314" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">为什么用 dummy？</text>
  <text x="436" y="336" font-size="10.5" fill="#444">① 统一空链表初始态，无需</text>
  <text x="436" y="350" font-size="10.5" fill="#444">　对 head 是否为空特判</text>
  <text x="436" y="372" font-size="10.5" fill="#444">② 新节点可能插在最前端</text>
  <text x="436" y="386" font-size="10.5" fill="#444">　（比所有已排序元素都小）</text>
  <text x="436" y="408" font-size="10.5" fill="#d6a040" font-weight="bold">关键：链表无前驱，只能</text>
  <text x="436" y="421" font-size="10.5" fill="#d6a040" font-weight="bold">从前往后扫找插入点</text>

  <!-- 底部要点 -->
  <rect x="24" y="290" width="380" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#sk)"/>
  <text x="214" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">与数组插入排序的区别</text>
  <text x="40" y="330" font-size="10.5" fill="#444">数组：从已排序段「从后向前」边比边移，腾出空位</text>
  <text x="40" y="344" font-size="10.5" fill="#444">链表：无前驱指针，只能「从前向后」找位置，再改两根指针</text>
</svg>
