<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)" font-weight="bold">groupBy 算法流程</text>

  <!-- 入口 -->
  <rect x="170" y="50" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">array.groupBy(fn) → 遍历 this</text>

  <path d="M 270 86 L 270 104" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取一项 + 算 key -->
  <rect x="150" y="108" width="240" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① key = fn(item)（item 即当前元素）</text>

  <path d="M 270 144 L 270 162" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定：桶是否存在？ -->
  <polygon points="270,166 360,210 270,254 180,210" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res[key]</text>
  <text x="270" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">已有数组？</text>

  <!-- 否：建空桶 -->
  <path d="M 180 210 C 120 210, 90 230, 70 250" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="202" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否（首次出现）</text>
  <rect x="40" y="254" width="150" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② res[key] = []（建空桶）</text>

  <!-- 是：直接拿到桶 -->
  <path d="M 360 210 C 410 210, 430 230, 440 250" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="418" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是（已存在）</text>
  <rect x="350" y="254" width="150" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">直接复用旧桶</text>

  <!-- 汇合到 push -->
  <path d="M 115 290 C 115 320, 200 312, 265 320" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 425 290 C 425 320, 340 312, 275 320" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="322" width="200" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ res[key].push(item)</text>

  <!-- 说明 -->
  <rect x="30" y="370" width="480" height="22" rx="6" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="385" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">遍历完所有元素后，return res；一次遍历，均摊 O(n)</text>
</svg>
