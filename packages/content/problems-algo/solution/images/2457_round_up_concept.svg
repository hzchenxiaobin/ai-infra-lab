<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：进位降和——在第 p 位向上取整</text>

  <text x="30" y="54" font-size="12" fill="#446688" font-weight="bold">n = 467,  target = 6</text>
  <rect x="448" y="40" width="124" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="510" y="57" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">数位和 17 &gt; 6  ✗</text>

  <!-- ===== Ladder of candidates ===== -->
  <!-- columns: label x=70(L) | value x=235(C) | dsum x=345(C) | verdict x=435(C) -->
  <!-- Row A: n itself -->
  <rect x="60" y="70" width="400" height="42" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="70" y="95" font-size="11" fill="#555" font-weight="bold">x=0  m = n</text>
  <text x="235" y="95" text-anchor="middle" font-size="12" fill="#333">467</text>
  <text x="345" y="95" text-anchor="middle" font-size="11" fill="#555">数位和 17</text>
  <text x="435" y="96" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <!-- arrow A->B -->
  <path d="M 300 112 L 300 124" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row B: p=0 -->
  <rect x="60" y="124" width="400" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="70" y="149" font-size="11" fill="#446688" font-weight="bold">p=0  (467+1)·1</text>
  <text x="235" y="149" text-anchor="middle" font-size="12" fill="#333">468</text>
  <text x="345" y="149" text-anchor="middle" font-size="11" fill="#555">数位和 18</text>
  <text x="435" y="150" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <!-- arrow B->C -->
  <path d="M 300 166 L 300 178" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row C: p=1 -->
  <rect x="60" y="178" width="400" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="70" y="203" font-size="11" fill="#d6a040" font-weight="bold">p=1  (46+1)·10</text>
  <text x="235" y="203" text-anchor="middle" font-size="12" fill="#333">470</text>
  <text x="345" y="203" text-anchor="middle" font-size="11" fill="#555">数位和 11</text>
  <text x="435" y="204" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <!-- arrow C->D -->
  <path d="M 300 220 L 300 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Row D: p=2 (winner) -->
  <rect x="60" y="232" width="400" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="70" y="257" font-size="11" fill="#4a7a3a" font-weight="bold">p=2  (4+1)·100</text>
  <text x="235" y="257" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">500</text>
  <text x="345" y="257" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">数位和 5</text>
  <text x="435" y="258" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- caption -->
  <rect x="60" y="286" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.55"/>
  <text x="260" y="303" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">p 增大 → 清零更多低位、进位链更长</text>
  <text x="260" y="319" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 数位和更小（但增量 x 更大）。取首个 ✓ 候选</text>

  <!-- ===== Carry-addition illustration ===== -->
  <text x="300" y="352" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">进位降和：digitSum(467) + digitSum(33) − 9 × 2 = 17 + 6 − 18 = 5</text>

  <!-- carry digits (small, above) -->
  <text x="180" y="386" font-size="10" fill="#b85450" font-weight="bold">进位</text>
  <text x="220" y="386" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="255" y="386" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- Row A: 4 6 7 -->
  <rect x="205" y="392" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="392" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="275" y="392" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="412" font-size="14" fill="#333" font-weight="bold">+</text>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="220" y="412" filter="url(#rough2)">4</text>
    <text x="255" y="412" filter="url(#rough2)">6</text>
    <text x="290" y="412" filter="url(#rough2)">7</text>
  </g>

  <!-- Row B: 3 3 -->
  <rect x="240" y="424" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="275" y="424" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="255" y="444" filter="url(#rough2)">3</text>
    <text x="290" y="444" filter="url(#rough2)">3</text>
  </g>

  <!-- separator -->
  <path d="M 200 458 L 310 458" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- Result: 5 0 0 -->
  <rect x="205" y="462" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="462" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="275" y="462" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <g font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold">
    <text x="220" y="482" filter="url(#rough2)">5</text>
    <text x="255" y="482" filter="url(#rough2)">0</text>
    <text x="290" y="482" filter="url(#rough2)">0</text>
  </g>

  <!-- side annotations -->
  <text x="325" y="412" font-size="10" fill="#888">个位 7+3=10</text>
  <text x="325" y="426" font-size="10" fill="#888">→ 写 0 进 1</text>
  <text x="325" y="446" font-size="10" fill="#888">十位 6+3+1=10</text>
  <text x="325" y="460" font-size="10" fill="#888">→ 写 0 进 1</text>
  <text x="325" y="482" font-size="10" fill="#4a7a3a" font-weight="bold">2 次进位，和 17 → 5 ✓</text>

  <!-- result badge -->
  <rect x="440" y="462" width="130" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="505" y="483" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x = 500 − 467 = 33</text>
</svg>
