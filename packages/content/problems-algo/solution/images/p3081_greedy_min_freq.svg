<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">贪心：每个 '?' 取当前频率最小的字母（例 s = "a?a?"）</text>

  <!-- s cells -->
  <text x="34" y="66" font-size="12" fill="#888" filter="url(#rough2)">s =</text>
  <rect x="66" y="46" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="85" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="110" y="46" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="68" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="154" y="46" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="173" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="198" y="46" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="68" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">?</text>
  <text x="258" y="68" font-size="11.5" fill="#888" filter="url(#rough2)">初始计数：a=2，其余 0</text>

  <!-- freq buckets -->
  <text x="34" y="132" font-size="12" fill="#888" filter="url(#rough2)">freq</text>
  <rect x="78" y="106" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="120" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">a</text>
  <text x="98" y="139" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="124" y="106" width="40" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="120" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">b</text>
  <text x="144" y="139" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="170" y="106" width="40" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="120" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">c</text>
  <text x="190" y="139" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="216" y="106" width="40" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="120" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">d</text>
  <text x="236" y="139" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="262" y="106" width="40" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="282" y="120" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">e</text>
  <text x="282" y="139" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="308" y="106" width="40" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="328" y="120" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">…</text>
  <rect x="354" y="106" width="40" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="374" y="120" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">z</text>
  <text x="374" y="139" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="410" y="132" font-size="11.5" fill="#888" filter="url(#rough2)">（'?' 不计数）</text>

  <!-- step boxes -->
  <path d="M 129 82 L 129 96 L 144 102" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="40" y="168" width="268" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="174" y="182" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">第 1 个 '?'：最小频率 0 → 选 b（并列取字典序小）</text>
  <text x="174" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">freq[b]：0→1；filled = [b]</text>

  <path d="M 217 82 L 217 92 L 320 92 L 320 164" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="40" y="214" width="268" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="174" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">第 2 个 '?'：最小频率仍是 0（b 已变 1）→ 选 c</text>
  <text x="174" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">freq[c]：0→1；filled = [b, c]</text>

  <!-- why min -->
  <rect x="326" y="168" width="160" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="406" y="190" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">选字母 j 的分数增量</text>
  <text x="406" y="208" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">= 选之前的 freq[j]</text>
  <text x="406" y="228" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">→ 每次都挑最矮的桶</text>
  <text x="406" y="244" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（交换论证可证全局最优）</text>

  <!-- bottom -->
  <rect x="40" y="268" width="446" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="263" y="290" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">分数只看多重集，不看排法 → 排列的自由度留给字典序</text>
  <text x="263" y="310" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">把 filled 排序后从左到右填进 '?' 位置 → 字典序最小</text>
  <text x="263" y="330" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">本例：filled = [b, c] 已有序 → 填入得 "abac"</text>
</svg>
