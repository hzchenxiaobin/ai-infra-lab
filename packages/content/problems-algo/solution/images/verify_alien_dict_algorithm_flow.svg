<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：序映射 + 相邻词对扫描</text>

  <!-- 起点：建序映射 -->
  <rect x="170" y="42" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">建 rank[26]：order[i] → i</text>

  <path d="M 280 76 L 280 94" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 外层循环：i 从 0 到 n-2 -->
  <rect x="150" y="96" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">for i in 0 .. n-2（遍历相邻对）</text>

  <path d="M 280 130 L 280 148" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层循环：逐字符比较 -->
  <rect x="130" y="150" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">for k：比较 w₁=words[i], w₂=words[i+1] 的第 k 字符</text>

  <path d="M 280 184 L 280 202" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1：k 越界？ -->
  <polygon points="280,204 410,244 280,284 150,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k 到达某词末尾？</text>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#888">（无首异字符）</text>

  <!-- 否 -> 判定2 -->
  <path d="M 150 244 L 90 244 L 90 300" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="236" font-size="10" fill="#888" font-weight="bold">否</text>

  <!-- 是 -> 前缀判定 -->
  <path d="M 410 244 L 470 244 L 470 300" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="430" y="236" font-size="10" fill="#d6a040" font-weight="bold">是</text>

  <!-- 判定2：rank 比较 -->
  <polygon points="90,302 210,342 90,382 -30,342" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="338" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">rank[w₁[k]] vs</text>
  <text x="90" y="352" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">rank[w₂[k]] ?</text>

  <!-- rank 小于 -> 本对OK -->
  <path d="M 30 342 L 30 300 L 150 300 L 150 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="20" y="330" font-size="9.5" fill="#4a7a3a" font-weight="bold">&lt;</text>
  <text x="20" y="318" font-size="9" fill="#4a7a3a">本对正确</text>

  <!-- rank 大于 -> return false -->
  <path d="M 90 382 L 90 404" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="398" font-size="10" fill="#b85450" font-weight="bold">&gt;</text>
  <rect x="30" y="406" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="426" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- rank 相等 -> 回内层循环 -->
  <path d="M 210 342 L 280 342 L 280 150" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="334" font-size="9.5" fill="#888" font-weight="bold">=</text>
  <text x="250" y="334" font-size="9" fill="#888">k++</text>

  <!-- 前缀判定框 -->
  <rect x="400" y="302" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="320" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">len(w₁) &gt; len(w₂)?</text>
  <text x="470" y="336" text-anchor="middle" font-size="10" fill="#888">长词在前则非法</text>

  <path d="M 470 346 L 470 368" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是 -> return false -->
  <rect x="410" y="370" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- 否 -> 本对OK（回外层） -->
  <path d="M 400 324 L 350 324 L 350 113" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="316" font-size="9.5" fill="#4a7a3a" font-weight="bold">否·OK</text>

  <!-- 外层循环结束 -> true -->
  <path d="M 410 113 L 520 113 L 520 60 L 390 60" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="470" y="105" font-size="9.5" fill="#4a7a3a" font-weight="bold">全过</text>
  <rect x="390" y="42" width="0" height="0" fill="none"/>

  <!-- 终点 -->
  <rect x="410" y="42" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="465" y="64" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- 底部说明 -->
  <text x="280" y="466" text-anchor="middle" font-size="9.5" fill="#aaa">首异字符一锤定音；无首异则短者在前（前缀规则）</text>
</svg>
