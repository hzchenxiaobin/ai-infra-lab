<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">算法流程：排序 → 首尾配对求和 → 入集合 → 返回集合大小</text>

  <!-- ① Input -->
  <rect x="185" y="40" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 输入 nums（n 为偶数）</text>
  <line x1="270" y1="74" x2="270" y2="96" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② sort + init -->
  <rect x="110" y="100" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② sort(nums)；i = 0；set = ∅</text>
  <line x1="270" y1="136" x2="270" y2="156" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ loop diamond -->
  <polygon points="270,158 360,194 270,230 180,194" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n/2 ?</text>
  <text x="270" y="206" text-anchor="middle" font-size="9.5" fill="#888">（还有首尾未配）</text>

  <!-- No branch (left) → return -->
  <line x1="180" y1="194" x2="132" y2="194" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="156" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="18" y="172" width="116" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="76" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤ return</text>
  <text x="76" y="206" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">set.size()</text>

  <!-- Yes branch (down) -->
  <line x1="270" y1="230" x2="270" y2="254" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ③ compute sum -->
  <rect x="150" y="258" width="240" height="36" fill="#f4f7fb" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ s = sorted[i] + sorted[n−1−i]</text>
  <line x1="270" y1="294" x2="270" y2="314" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ distinct? (optional, informational) -->
  <polygon points="270,316 350,350 270,384 190,350" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">s ∈ set ?</text>
  <text x="270" y="362" text-anchor="middle" font-size="9.5" fill="#888">（已是新和？）</text>

  <!-- No branch (down) → insert -->
  <line x1="270" y1="384" x2="270" y2="404" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="398" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Yes branch (right) → skip to i++ -->
  <line x1="350" y1="350" x2="410" y2="350" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="344" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">是</text>

  <!-- ④ insert -->
  <rect x="150" y="406" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="427" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ set.insert(s)</text>

  <!-- i++ box -->
  <rect x="410" y="334" width="80" height="32" fill="#f4f7fb" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="354" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">i++</text>

  <!-- insert → i++ -->
  <path d="M 390 423 L 450 423 L 450 368" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ → loop back to diamond 1 -->
  <path d="M 450 334 L 450 194 L 364 194" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="264" text-anchor="middle" font-size="9.5" fill="#888">下一对</text>

  <!-- footer -->
  <rect x="30" y="452" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="468" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">排序固定首尾配对；(a+b)/2 相异 ⟺ (a+b) 相异 → 存和避浮点</text>
</svg>
