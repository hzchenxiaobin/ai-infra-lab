<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：两趟遍历 —— 先建集合，再计数</text>

  <!-- ===== Pass 1 column (left) ===== -->
  <text x="120" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第一趟：建集合</text>

  <!-- start -->
  <rect x="60" y="64" width="120" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="11" fill="#333">开始遍历 arr</text>

  <!-- arrow -->
  <path d="M 120 94 L 120 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- insert -->
  <rect x="60" y="118" width="120" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="140" text-anchor="middle" font-size="11" fill="#333">seen.insert(x)</text>

  <!-- arrow up loop -->
  <path d="M 60 135 L 36 135 L 36 79 L 56 79" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="20" y="110" font-size="10" fill="#888" transform="rotate(-90 20 110)">下一元素</text>

  <!-- arrow down to end of pass1 -->
  <path d="M 120 152 L 120 172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="60" y="176" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="196" text-anchor="middle" font-size="11" fill="#333">集合 seen 就绪</text>

  <!-- ===== bridge arrow to pass 2 ===== -->
  <path d="M 180 191 L 250 191" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Pass 2 column (right) ===== -->
  <text x="370" y="54" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">第二趟：计数</text>

  <!-- start pass2 -->
  <rect x="310" y="64" width="120" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="84" text-anchor="middle" font-size="11" fill="#333">ans = 0；遍历 arr</text>

  <!-- arrow -->
  <path d="M 370 94 L 370 116" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond decision -->
  <polygon points="370,120 430,150 370,180 310,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="146" text-anchor="middle" font-size="10.5" fill="#333">x + 1</text>
  <text x="370" y="160" text-anchor="middle" font-size="10.5" fill="#333">∈ seen ?</text>

  <!-- Yes branch: right -->
  <path d="M 430 150 L 470 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="474" y="134" width="64" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="506" y="155" text-anchor="middle" font-size="11" fill="#333">ans += 1</text>

  <!-- No branch: left/down -->
  <path d="M 310 150 L 286 150 L 286 200 L 310 200" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="144" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <text x="262" y="184" font-size="10" fill="#b85450">跳过</text>

  <!-- loop back to top of pass2 (next element) -->
  <path d="M 506 166 L 506 79 L 434 79" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="520" y="124" font-size="10" fill="#888" transform="rotate(90 520 124)">下一元素</text>

  <!-- from ans+=1 also loop back -->
  <path d="M 474 150 L 450 150 L 450 210 L 370 210 L 370 196" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3,3" opacity="0"/>

  <!-- arrow down after decision to end -->
  <path d="M 370 180 L 370 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="224" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="244" text-anchor="middle" font-size="11" fill="#333">返回 ans</text>

  <!-- footer notes -->
  <rect x="40" y="276" width="480" height="108" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">两趟严格分离：集合完整建好后才开始计数</text>
  <text x="60" y="320" font-size="10.5" fill="#555">• 第一趟 O(n) 建集合：遍历 arr 把每个值 insert 进 seen（自动去重，只记「哪些值出现过」）</text>
  <text x="60" y="338" font-size="10.5" fill="#555">• 第二趟 O(n) 计数：遍历原数组 arr（保留重复），对每个 x 查 x+1 ∈ seen？命中则 ans += 1</text>
  <text x="60" y="356" font-size="10.5" fill="#555">• 合计 O(n) 时间 / O(n) 空间；计数遍历 arr 而非 seen，重复元素各计一次</text>
  <text x="60" y="374" font-size="10.5" fill="#b85450" font-weight="bold">⚠️ 若边建边查会漏判：处理 x 时 x+1 可能尚未入集</text>
</svg>
