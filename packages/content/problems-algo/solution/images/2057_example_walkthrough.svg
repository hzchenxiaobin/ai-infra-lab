<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">逐步演算：nums = [4, 3, 2, 1]</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">逐位比较 i%10 与 nums[i]，首个命中即返回</text>

  <!-- Table outer frame -->
  <rect x="50" y="62" width="420" height="170" fill="none" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column dividers -->
  <line x1="110" y1="62" x2="110" y2="232" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="155" y1="62" x2="155" y2="232" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="225" y1="62" x2="225" y2="232" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="62" x2="300" y2="232" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="365" y1="62" x2="365" y2="232" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header row divider -->
  <line x1="50" y1="92" x2="470" y2="92" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Header background -->
  <rect x="51" y="63" width="418" height="28" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="80" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="132" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="190" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i % 10</text>
  <text x="262" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums[i]</text>
  <text x="332" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">匹配?</text>
  <text x="417" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作</text>

  <!-- Row 1: i=0, mismatch -->
  <rect x="51" y="93" width="418" height="34" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <line x1="50" y1="127" x2="470" y2="127" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="115" text-anchor="middle" font-size="11.5" fill="#555">1</text>
  <text x="132" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="190" y="115" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="262" y="115" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="332" y="115" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0 ≠ 4 ✗</text>
  <text x="417" y="115" text-anchor="middle" font-size="10.5" fill="#888">i++, 继续</text>

  <!-- Row 2: i=1, mismatch -->
  <rect x="51" y="128" width="418" height="34" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <line x1="50" y1="162" x2="470" y2="162" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="150" text-anchor="middle" font-size="11.5" fill="#555">2</text>
  <text x="132" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="190" y="150" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="262" y="150" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="332" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1 ≠ 3 ✗</text>
  <text x="417" y="150" text-anchor="middle" font-size="10.5" fill="#888">i++, 继续</text>

  <!-- Row 3: i=2, MATCH (highlight green) -->
  <rect x="51" y="163" width="418" height="34" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="50" y1="197" x2="470" y2="197" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="185" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="132" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="190" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="262" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="332" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2 == 2 ✓</text>
  <text x="417" y="185" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回 2 ⭐</text>

  <!-- Row 4: i=3, not checked -->
  <rect x="51" y="198" width="418" height="34" fill="#f5f5f5" stroke="none" filter="url(#rough2)"/>
  <text x="80" y="220" text-anchor="middle" font-size="11.5" fill="#bbb">—</text>
  <text x="132" y="220" text-anchor="middle" font-size="12" fill="#bbb">3</text>
  <text x="190" y="220" text-anchor="middle" font-size="11" fill="#bbb">未检查</text>
  <text x="262" y="220" text-anchor="middle" font-size="11" fill="#bbb">未检查</text>
  <text x="332" y="220" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <text x="417" y="220" text-anchor="middle" font-size="10" fill="#aaa">(已提前返回)</text>

  <!-- Result box -->
  <rect x="110" y="252" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = 2</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#555">只检查 3 个元素即命中退出，无需扫到底</text>

  <!-- Footer note -->
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#888">对比暴力"收集全部再取最小"：本题利用下标升序，首个命中即最优</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#aaa">最坏 O(n)（无匹配时全扫）· 命中时 O(命中位置+1)</text>
</svg>
