<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">按位拆解：AND ≠ 0 ⇔ 存在某一位 b，所选元素第 b 位全为 1</text>

  <!-- 原数组 -->
  <text x="16" y="70" font-size="13" fill="#555" filter="url(#rough2)">nums =</text>
  <rect x="86" y="46" width="54" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="113" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">5</text>
  <rect x="158" y="46" width="54" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">4</text>
  <rect x="230" y="46" width="54" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="257" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">7</text>
  <text x="16" y="96" font-size="10.5" fill="#999" filter="url(#rough2)">二进制</text>
  <text x="113" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">101</text>
  <text x="185" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">100</text>
  <text x="257" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">111</text>

  <!-- 图例 -->
  <rect x="392" y="52" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="64" font-size="11" fill="#555" filter="url(#rough2)">该位为 1 → 保留</text>
  <rect x="392" y="74" width="14" height="14" rx="3" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="86" font-size="11" fill="#555" filter="url(#rough2)">该位为 0 → 剔除</text>

  <!-- ============ b=0 行（答案行）============ -->
  <rect x="4" y="112" width="552" height="58" rx="10" fill="#fce4ec" opacity="0.35" filter="url(#rough2)"/>
  <text x="20" y="110" font-size="11" fill="#b85450" filter="url(#rough2)">★ 本行取得答案</text>
  <rect x="10" y="126" width="46" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="33" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">b=0</text>
  <rect x="86" y="127" width="54" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="113" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">1</text>
  <rect x="158" y="127" width="54" height="26" rx="5" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="145" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="230" y="127" width="54" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="257" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">1</text>
  <path d="M 292 140 L 314 140" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="322" y="127" width="44" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="344" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">5</text>
  <rect x="374" y="127" width="44" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">7</text>
  <rect x="482" y="127" width="68" height="26" rx="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="516" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03028" filter="url(#rough2)">LIS=2</text>

  <!-- ============ b=1 行 ============ -->
  <rect x="10" y="194" width="46" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="33" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">b=1</text>
  <rect x="86" y="195" width="54" height="26" rx="5" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="213" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="158" y="195" width="54" height="26" rx="5" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="213" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="230" y="195" width="54" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="257" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">1</text>
  <path d="M 292 208 L 314 208" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="322" y="195" width="44" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="344" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">7</text>
  <rect x="482" y="195" width="68" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="516" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">LIS=1</text>

  <!-- ============ b=2 行 ============ -->
  <rect x="10" y="262" width="46" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="33" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">b=2</text>
  <rect x="86" y="263" width="54" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="113" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">1</text>
  <rect x="158" y="263" width="54" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">1</text>
  <rect x="230" y="263" width="54" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="257" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">1</text>
  <path d="M 292 276 L 314 276" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="322" y="263" width="44" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="344" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">5</text>
  <rect x="374" y="263" width="44" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">4</text>
  <rect x="426" y="263" width="44" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="448" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">7</text>
  <text x="345" y="303" font-size="10.5" fill="#999" filter="url(#rough2)">严格递增 ⇒ 只能取 [5,7]</text>
  <rect x="482" y="263" width="68" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="516" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">LIS=2</text>

  <!-- 底部结论 -->
  <rect x="20" y="320" width="520" height="66" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">答案 = max(LIS) = 2：例如取 [5, 7]，5 AND 7 = 5 ≠ 0</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每一位独立跑一遍经典 LIS；全 0 数组 → 每位过滤后为空 → 答案 0</text>
</svg>
