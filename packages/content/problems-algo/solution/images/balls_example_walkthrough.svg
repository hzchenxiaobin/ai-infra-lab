<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：balls = [2,1,1]，n = 2</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">枚举所有 aᵢ 满足 a₀+a₁+a₂ = 2 的拆分</text>

  <!-- Table header -->
  <rect x="30" y="56" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">拆分 (a₀,a₁,a₂)</text>
  <rect x="130" y="56" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">排列数</text>
  <rect x="220" y="56" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d1</text>
  <rect x="290" y="56" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d2</text>
  <rect x="360" y="56" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d1==d2?</text>
  <rect x="460" y="56" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">计入</text>

  <!-- Row 1: (0,1,1) -->
  <rect x="30" y="88" width="100" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="108" text-anchor="middle" font-size="11" fill="#333">(0, 1, 1)</text>
  <rect x="130" y="88" width="90" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="108" text-anchor="middle" font-size="11" fill="#333">1×1×1=1</text>
  <rect x="220" y="88" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="108" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="290" y="88" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="108" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="360" y="88" width="100" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="108" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="88" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="108" text-anchor="middle" font-size="11" fill="#888">total+1</text>

  <!-- Row 2: (1,0,1) -->
  <rect x="30" y="122" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="142" text-anchor="middle" font-size="11" fill="#333">(1, 0, 1)</text>
  <rect x="130" y="122" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="142" text-anchor="middle" font-size="11" fill="#333">2×1×1=2</text>
  <rect x="220" y="122" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="142" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="290" y="122" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="142" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="360" y="122" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="460" y="122" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">fav+2</text>

  <!-- Row 3: (1,1,0) -->
  <rect x="30" y="156" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="176" text-anchor="middle" font-size="11" fill="#333">(1, 1, 0)</text>
  <rect x="130" y="156" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="176" text-anchor="middle" font-size="11" fill="#333">2×1×1=2</text>
  <rect x="220" y="156" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="176" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="290" y="156" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="176" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="360" y="156" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="460" y="156" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">fav+2</text>

  <!-- Row 4: (2,0,0) -->
  <rect x="30" y="190" width="100" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="210" text-anchor="middle" font-size="11" fill="#333">(2, 0, 0)</text>
  <rect x="130" y="190" width="90" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="210" text-anchor="middle" font-size="11" fill="#333">1×1×1=1</text>
  <rect x="220" y="190" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="210" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="190" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="210" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="360" y="190" width="100" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="190" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="210" text-anchor="middle" font-size="11" fill="#888">total+1</text>

  <!-- Summary -->
  <rect x="30" y="240" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">汇总</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#666">total = 1+2+2+1 = 6  （= C(4,2)，范德蒙恒等式）</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">favorable = 2+2 = 4  →  概率 = 4/6 = 0.66667</text>

  <!-- note -->
  <rect x="30" y="316" width="500" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键洞察</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#666">同色球不可区分 → 拆分 (a₀..aₖ₋₁) 唯一确定一组"外观"</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#666">外观出现次数 = ∏ C(balls[i], aᵢ)，概率 = favorable / total</text>
</svg>
