<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：构造 mask → 逐词子集判定 → 计数
  </text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M270,76 L270,92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mask = 0; for c in allowed: mask |= 1<<(c-'a') -->
  <rect x="156" y="96" width="228" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mask = ⋃ 1&lt;&lt;(c−'a')  for c in allowed</text>
  <path d="M270,130 L270,144" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = 0 -->
  <rect x="226" y="148" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0</text>
  <path d="M270,178 L270,194" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: 还有 word? -->
  <polygon points="270,198 332,224 270,250 208,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有 word?</text>

  <!-- no branch -> return ans -->
  <path d="M332,224 L398,224" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="217" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="402" y="208" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="452" y="230" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return ans</text>

  <!-- yes branch -->
  <path d="M270,250 L270,266" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="264" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- w_mask = union of word bits -->
  <rect x="156" y="270" width="228" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="291" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">w_mask = ⋃ 1&lt;&lt;(c−'a')  for c in word</text>
  <path d="M270,304 L270,318" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: w_mask & ~mask == 0? -->
  <polygon points="270,322 360,338 270,354 180,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w_mask &amp; ~mask == 0?</text>

  <!-- yes -> ans++ (left) -->
  <path d="M180,338 L120,338" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="331" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="14" y="322" width="104" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="66" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += 1</text>

  <!-- loop back from ans++ up to 还有word? diamond (270,198) -->
  <path d="M66,322 L66,224 L206,224" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no -> loop back (right) directly to 还有word? -->
  <path d="M360,338 L416,338" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="331" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M416,338 L416,224 L334,224" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

</svg>
