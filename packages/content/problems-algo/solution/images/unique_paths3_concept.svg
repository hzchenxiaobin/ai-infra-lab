<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：网格 DFS + 回溯，走遍空格恰好一次</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">从起点出发，标记-递归-撤销，到达终点且步数==target 则计数</text>

  <!-- ===== grid (example 1: 3x4) ===== -->
  <text x="140" y="72" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">网格 grid（示例 1）</text>
  <g font-size="13">
    <!-- row 0: 1 0 0 0 -->
    <rect x="80" y="80" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="100" y="106" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="100" y="76" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">起点</text>
    <rect x="120" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="140" y="106" text-anchor="middle" fill="#446688">0</text>
    <rect x="160" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="180" y="106" text-anchor="middle" fill="#446688">0</text>
    <rect x="200" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="220" y="106" text-anchor="middle" fill="#446688">0</text>
    <!-- row 1: 0 0 0 0 -->
    <rect x="80" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="100" y="146" text-anchor="middle" fill="#446688">0</text>
    <rect x="120" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="140" y="146" text-anchor="middle" fill="#446688">0</text>
    <rect x="160" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="180" y="146" text-anchor="middle" fill="#446688">0</text>
    <rect x="200" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="220" y="146" text-anchor="middle" fill="#446688">0</text>
    <!-- row 2: 0 0 2 -1 -->
    <rect x="80" y="160" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="100" y="186" text-anchor="middle" fill="#446688">0</text>
    <rect x="120" y="160" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="140" y="186" text-anchor="middle" fill="#446688">0</text>
    <rect x="160" y="160" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="180" y="186" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="180" y="214" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">终点</text>
    <rect x="200" y="160" width="40" height="40" fill="#eeeeee" stroke="#999999" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="220" y="186" text-anchor="middle" fill="#999999">-1</text>
    <text x="220" y="214" text-anchor="middle" font-size="9" fill="#999999">障碍</text>
  </g>

  <!-- ===== right side: three-step pattern ===== -->
  <text x="420" y="72" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">回溯三步走</text>
  <rect x="330" y="80" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="345" y="103" font-size="11" fill="#4a7a3a" font-weight="bold">① 选择：grid[i][j] = -1</text>

  <rect x="330" y="124" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="345" y="147" font-size="11" fill="#446688" font-weight="bold">② 递归：dfs(四方向)</text>

  <rect x="330" y="168" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="345" y="191" font-size="11" fill="#d6a040" font-weight="bold">③ 撤销：grid[i][j] = 0</text>

  <path d="M 440 116 L 440 122" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 160 L 440 166" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== bottom: termination ===== -->
  <rect x="40" y="230" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="252" font-size="12" fill="#b85450" font-weight="bold">终止条件（到达终点 2）</text>
  <text x="60" y="268" font-size="10" fill="#555">walked + 1 == target（= empty + 1）→ 走遍全部空格，ans++；否则跳过</text>

  <!-- ===== key insight ===== -->
  <rect x="40" y="286" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="12" fill="#4a7a3a" font-weight="bold">关键：原地标记 = O(1) 额外空间，穷尽所有分支累计计数</text>
  <text x="60" y="324" font-size="10" fill="#555">与 79 单词搜索同构，仅从「判定」升级为「计数」（不短路）</text>

  <!-- ===== complexity ===== -->
  <rect x="40" y="340" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(3^N)，空间 O(N)（N = 无障碍方格数，N ≤ 20）</text>
</svg>
