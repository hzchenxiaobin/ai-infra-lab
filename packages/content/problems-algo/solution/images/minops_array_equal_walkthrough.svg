<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrS" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=3，arr=[1,3,5]，目标=3</text>

  <!-- ===== Step 0: initial ===== -->
  <text x="100" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">初始</text>
  <rect x="60" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="104" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="148" y="68" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="100" y="112" text-anchor="middle" font-size="9" fill="#446688">差2</text>
  <text x="168" y="112" text-anchor="middle" font-size="9" fill="#d6a040">多2</text>

  <!-- arrow down -->
  <path d="M 124 120 L 124 138" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <text x="200" y="132" font-size="9" fill="#888">操作1: x=2,y=0 → arr[2]−1, arr[0]+1</text>

  <!-- ===== Step 1 ===== -->
  <text x="100" y="158" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">操作1后</text>
  <rect x="60" y="168" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="104" y="168" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="148" y="168" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="100" y="212" text-anchor="middle" font-size="9" fill="#446688">差1</text>
  <text x="168" y="212" text-anchor="middle" font-size="9" fill="#d6a040">多1</text>

  <!-- arrow down -->
  <path d="M 124 220 L 124 238" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <text x="200" y="232" font-size="9" fill="#888">操作2: x=2,y=0 → arr[2]−1, arr[0]+1</text>

  <!-- ===== Step 2: done ===== -->
  <text x="100" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">操作2后 ✓</text>
  <rect x="60" y="268" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="287" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="104" y="268" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="287" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="148" y="268" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="287" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- ===== Right panel: n=6 verification ===== -->
  <rect x="320" y="58" width="220" height="240" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="430" y="78" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">n=6 验证</text>
  <text x="335" y="100" font-size="10" fill="#666">arr = [1, 3, 5, 7, 9, 11]</text>
  <text x="335" y="118" font-size="10" fill="#666">目标值 = n = 6</text>
  <text x="335" y="142" font-size="10" fill="#446688">配对: (1,11)(3,9)(5,7)</text>
  <text x="335" y="160" font-size="10" fill="#446688">每对平均值 = 6 = n</text>
  <text x="335" y="184" font-size="10" fill="#b85450">操作数 = 5 + 3 + 1</text>
  <rect x="335" y="194" width="190" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="213" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 9 ✓</text>
  <text x="335" y="240" font-size="10" fill="#888">公式: 6×6/4 = 36/4 = 9</text>
  <text x="335" y="262" font-size="10" fill="#888">奇偶均适用 ⌊n²/4⌋</text>

  <!-- Bottom note -->
  <rect x="40" y="318" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：每次操作搬 1 单位，总搬运量 = 总 deficit</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#555">首尾配对各贡献 (n−1−2i)/2 步，求和得 ⌊n²/4⌋</text>
</svg>
