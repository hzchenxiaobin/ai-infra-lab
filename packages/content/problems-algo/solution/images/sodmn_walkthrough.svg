<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两例对比（一位数 vs 两位数）</text>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="54" font-size="12.5" fill="#446688" font-weight="bold">示例 1：nums = [34,23,1,24,75,33,54,8]</text>

  <!-- array cells row -->
  <g font-size="11" fill="#333">
    <rect x="30"  y="64" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="49"  y="82" text-anchor="middle">34</text>
    <rect x="70"  y="64" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="89"  y="82" text-anchor="middle">23</text>
    <rect x="110" y="64" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="129" y="82" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="150" y="64" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="169" y="82" text-anchor="middle">24</text>
    <rect x="190" y="64" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="209" y="82" text-anchor="middle">75</text>
    <rect x="230" y="64" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="249" y="82" text-anchor="middle">33</text>
    <rect x="270" y="64" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="289" y="82" text-anchor="middle">54</text>
    <rect x="310" y="64" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="329" y="82" text-anchor="middle">8</text>
  </g>
  <path d="M 129 96 L 129 110 L 60 110 L 60 124" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="82" font-size="11" fill="#b85450" font-weight="bold">最小 = 1</text>

  <!-- digit sum steps for 1 -->
  <rect x="44" y="128" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="64" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="92" y="146" font-size="11" fill="#888">%10 =</text>
  <rect x="128" y="128" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="143" y="146" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="166" y="146" font-size="11" fill="#888">/10 → 0, 停</text>

  <!-- result row ex1 -->
  <rect x="44" y="166" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="134" y="186" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">s = 1（奇）→ return 0</text>

  <!-- ===== divider ===== -->
  <line x1="20" y1="212" x2="540" y2="212" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="30" y="236" font-size="12.5" fill="#4a7a3a" font-weight="bold">示例 2：nums = [99,77,33,66,55]</text>

  <g font-size="11" fill="#333">
    <rect x="30"  y="246" width="44" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="52"  y="264" text-anchor="middle">99</text>
    <rect x="78"  y="246" width="44" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="100" y="264" text-anchor="middle">77</text>
    <rect x="126" y="246" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="264" text-anchor="middle" fill="#b85450" font-weight="bold">33</text>
    <rect x="174" y="246" width="44" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="196" y="264" text-anchor="middle">66</text>
    <rect x="222" y="246" width="44" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="244" y="264" text-anchor="middle">55</text>
  </g>
  <path d="M 148 278 L 148 292 L 60 292 L 60 306" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="264" font-size="11" fill="#b85450" font-weight="bold">最小 = 33</text>

  <!-- digit sum steps for 33 -->
  <rect x="44" y="310" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="64" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">33</text>
  <text x="92" y="328" font-size="11" fill="#888">%10 =</text>
  <rect x="128" y="310" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="143" y="328" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="166" y="328" font-size="11" fill="#888">s=3, /10 → 3</text>

  <path d="M 64 338 L 64 352" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="356" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="64" y="374" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="92" y="374" font-size="11" fill="#888">%10 =</text>
  <rect x="128" y="356" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="143" y="374" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="166" y="374" font-size="11" fill="#888">s=6, /10 → 0, 停</text>

  <!-- result row ex2 -->
  <rect x="44" y="396" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="144" y="416" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">s = 6（偶）→ return 1</text>

  <!-- side note -->
  <rect x="300" y="396" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="416" text-anchor="middle" font-size="11" fill="#d6a040">一位数拆 1 轮 / 两位数拆 2 轮</text>
</svg>
