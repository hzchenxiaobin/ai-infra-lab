<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察 2：平方是凸函数 → 位越集中，平方和越大</text>

  <!-- 库存说明 -->
  <rect x="70" y="42" width="420" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333">设位库存：bit2 × 2、bit1 × 2、bit0 × 2（k = 3，每位的 1 至多发给 3 个数）</text>

  <!-- 三种分配方案 -->
  <text x="280" y="100" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">同样 6 个「1」，三种发法：</text>

  <!-- 方案 A：最集中 -->
  <rect x="46" y="112" width="468" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="134" font-size="12" fill="#4a7a3a" font-weight="bold">集中：[7, 7, 0]</text>
  <rect x="70" y="142" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="140" y="142" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="210" y="142" width="60" height="32" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="163" text-anchor="middle" font-size="14" fill="#999">0</text>
  <text x="300" y="155" font-size="13" fill="#4a7a3a" font-weight="bold">49 + 49 + 0 = 98 ★最大</text>
  <text x="300" y="173" font-size="10" fill="#999">高位全喂给前两个数</text>

  <!-- 方案 B：半集中 -->
  <rect x="46" y="194" width="468" height="74" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="216" font-size="12" fill="#555" font-weight="bold">半集中：[7, 5, 2]</text>
  <rect x="70" y="224" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="245" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="140" y="224" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="245" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="210" y="224" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="245" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="300" y="237" font-size="13" fill="#555">49 + 25 + 4 = 78</text>
  <text x="300" y="255" font-size="10" fill="#999">bit0 分给了第三个数</text>

  <!-- 方案 C：最分散 -->
  <rect x="46" y="276" width="468" height="74" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="298" font-size="12" fill="#555" font-weight="bold">分散：[5, 4, 3]</text>
  <rect x="70" y="306" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="327" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="140" y="306" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="327" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="210" y="306" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="327" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="300" y="319" font-size="13" fill="#555">25 + 16 + 9 = 50</text>
  <text x="300" y="337" font-size="10" fill="#999">各位摊平，谁也不突出</text>

  <!-- 交换论证 -->
  <rect x="40" y="360" width="480" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">交换论证：x ≥ y 时，增量 d 给 x 不给 y更优</text>
  <text x="280" y="404" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">(x+d)² + y² − [x² + (y+d)²] = 2d(x−y) ≥ 0</text>
</svg>
