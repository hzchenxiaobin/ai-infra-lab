<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：字典序 (d², area) 一步步长出来</text>

  <!-- ===== Example 1 ===== -->
  <text x="260" y="52" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：[[9,3],[8,6]] —— 对角线一决高下</text>

  <!-- header row -->
  <rect x="36" y="60" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="60" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="196" y="60" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="248" y="60" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="368" y="60" width="116" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="75" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">矩形</text>
  <text x="148" y="75" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">d² = l²+w²</text>
  <text x="222" y="75" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">area</text>
  <text x="308" y="75" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">判定</text>
  <text x="426" y="75" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">best (d², area)</text>

  <!-- row 1 -->
  <rect x="36" y="82" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="100" y="82" width="96" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="196" y="82" width="52" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="248" y="82" width="120" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="368" y="82" width="116" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[9,3]</text>
  <text x="148" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">81+9 = 90</text>
  <text x="222" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">27</text>
  <text x="308" y="99" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">90 &gt; −1 ✓ 更新</text>
  <text x="426" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(90, 27)</text>

  <!-- row 2 -->
  <rect x="36" y="108" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="100" y="108" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="196" y="108" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="248" y="108" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="368" y="108" width="116" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="68" y="125" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[8,6]</text>
  <text x="148" y="125" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">64+36 = 100</text>
  <text x="222" y="125" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">48</text>
  <text x="308" y="125" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">100 &gt; 90 ✓ 更新</text>
  <text x="426" y="125" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(100, 48)</text>

  <text x="260" y="152" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 返回面积 48 ✓</text>

  <!-- ===== Example 2 ===== -->
  <text x="260" y="180" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：[[3,4],[4,3]] —— d² 相同比面积（平局规则）</text>

  <!-- header row -->
  <rect x="36" y="188" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="188" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="196" y="188" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="248" y="188" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="368" y="188" width="116" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="203" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">矩形</text>
  <text x="148" y="203" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">d² = l²+w²</text>
  <text x="222" y="203" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">area</text>
  <text x="308" y="203" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">判定</text>
  <text x="426" y="203" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">best (d², area)</text>

  <!-- row 1 -->
  <rect x="36" y="210" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="100" y="210" width="96" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="196" y="210" width="52" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="248" y="210" width="120" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="368" y="210" width="116" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68" y="227" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[3,4]</text>
  <text x="148" y="227" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">9+16 = 25</text>
  <text x="222" y="227" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">12</text>
  <text x="308" y="227" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">25 &gt; −1 ✓ 更新</text>
  <text x="426" y="227" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(25, 12)</text>

  <!-- row 2 -->
  <rect x="36" y="236" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="100" y="236" width="96" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="196" y="236" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="248" y="236" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="368" y="236" width="116" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="68" y="253" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">[4,3]</text>
  <text x="148" y="253" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">16+9 = 25</text>
  <text x="222" y="253" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">12</text>
  <text x="308" y="253" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">平局，12 不大于 12</text>
  <text x="426" y="253" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">(25, 12) 保持</text>

  <text x="260" y="280" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 返回面积 12 ✓（两个矩形对角线、面积全相同）</text>

  <!-- bottom dashed note -->
  <rect x="48" y="292" width="424" height="94" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">① 全程整数：只出现 d² = l²+w²，从未开方——√ 单调保证排序不变；</text>
  <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">② 更新条件是「字典序更大」：先比 d²，平局再比 area——平局规则藏在比较器里；</text>
  <text x="260" y="362" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">③ 本题 d² ≤ 20000，int 足矣；推广到 10⁹ 级需 long long（见题解第 5 节）。</text>
</svg>
