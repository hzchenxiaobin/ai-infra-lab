<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：买 S8 的买家集合 − 买 iPhone 的买家集合 = 结果</text>

  <!-- Set A: 买 S8 的买家 -->
  <ellipse cx="220" cy="200" rx="130" ry="100" fill="#e8f0fe" stroke="#446688" stroke-width="2" fill-opacity="0.8" filter="url(#rough2)"/>
  <text x="160" y="92" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">集合 A：买 S8 的买家</text>

  <!-- Set B: 买 iPhone 的买家 -->
  <ellipse cx="380" cy="200" rx="130" ry="100" fill="#fce4ec" stroke="#b85450" stroke-width="2" fill-opacity="0.8" filter="url(#rough2)"/>
  <text x="440" y="92" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">集合 B：买 iPhone 的买家</text>

  <!-- buyer 1: only in A (A - B region) -->
  <circle cx="170" cy="200" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="170" y="206" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="170" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">A − B（结果）</text>

  <!-- buyer 3: in intersection (bought both) -->
  <circle cx="300" cy="200" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="300" y="206" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">3</text>
  <text x="300" y="238" text-anchor="middle" font-size="10" fill="#888">A ∩ B（两样都买）</text>

  <!-- buyer 2: outside both -->
  <circle cx="470" cy="200" r="18" fill="#f5f5f5" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="206" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">2</text>
  <text x="470" y="238" text-anchor="middle" font-size="10" fill="#888">不在 A 也不在 B</text>

  <!-- Annotation arrows -->
  <text x="40" y="300" font-size="11.5" fill="#555" font-weight="bold">判定规则：</text>
  <rect x="40" y="310" width="520" height="92" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="11.5" fill="#4a7a3a" font-weight="bold">buyer 1 → 只在 A 中、不在 B 中 → ✓ 保留</text>
  <text x="60" y="352" font-size="11.5" fill="#d6a040" font-weight="bold">buyer 3 → 同时在 A 和 B 中（买过 iPhone）→ ✗ 丢弃</text>
  <text x="60" y="372" font-size="11.5" fill="#888" font-weight="bold">buyer 2 → 不在 A 中（没买 S8）→ ✗ 丢弃</text>
  <text x="60" y="392" font-size="10.5" fill="#888">关键：两个条件缺一不可——「有 S8」AND「无 iPhone」</text>

  <!-- Result box -->
  <rect x="60" y="418" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="439" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">结果 = { 1 } —— 只在 A 中、不在 B 中的买家</text>
</svg>
