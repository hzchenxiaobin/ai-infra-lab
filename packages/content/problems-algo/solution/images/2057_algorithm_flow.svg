<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次遍历 + 命中即返回</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="50" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- Arrow down to init -->
  <path d="M 260 65 L 260 78" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init rect: i = 0 -->
  <rect x="220" y="78" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ← 0</text>

  <!-- Arrow down to diamond1 -->
  <path d="M 260 106 L 260 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: i < n ? -->
  <path d="M 204,140 L 260,118 L 316,140 L 260,162 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- Arrow No (right) to return -1 -->
  <path d="M 316 140 L 376 140" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="340" y="134" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- return -1 rect -->
  <rect x="376" y="126" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 -1</text>

  <!-- Arrow Yes (down) to diamond2 -->
  <path d="M 260 162 L 260 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="172" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond 2: i%10 == nums[i] ? -->
  <path d="M 180,206 L 260,178 L 340,206 L 260,234 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i % 10 ==</text>
  <text x="260" y="216" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">nums[i] ?</text>

  <!-- Arrow Yes (right) to return i -->
  <path d="M 340 206 L 376 206" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- return i rect -->
  <rect x="376" y="192" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 i</text>

  <!-- Arrow No (left) to i++ -->
  <path d="M 180 206 L 142 206" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="200" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">否</text>

  <!-- i++ rect -->
  <rect x="74" y="192" width="68" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i++</text>

  <!-- Loop back arrow: from i++ up then right into diamond1 -->
  <path d="M 108 192 L 108 140 L 200 140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="166" font-size="10" fill="#888">回循环</text>

  <!-- Bottom note box -->
  <rect x="50" y="256" width="420" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">三个出口，无一遗漏</text>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#555">① i%10 == nums[i] → 命中，返回 i（首个即最小）</text>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#555">② 扫完仍未命中（i ≥ n）→ 返回 -1</text>

  <!-- Footer -->
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#aaa">单层循环 · 两判定 · 命中即停 · 无额外空间</text>
</svg>
