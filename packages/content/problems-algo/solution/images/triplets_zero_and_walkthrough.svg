<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [2, 1, 3]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">值只用 3 位（max=3），此处 FULL=7 便于展示；实际解 FULL=2¹⁶−1</text>

  <!-- Section A: pairwise AND matrix -->
  <text x="40" y="72" font-size="12" fill="#446688" font-weight="bold">① 两两 AND 矩阵（行 i，列 j）</text>

  <g font-size="11" fill="#333">
    <!-- col headers -->
    <text x="120" y="92" text-anchor="middle" font-size="10" fill="#888">j=0 (2)</text>
    <text x="170" y="92" text-anchor="middle" font-size="10" fill="#888">j=1 (1)</text>
    <text x="220" y="92" text-anchor="middle" font-size="10" fill="#888">j=2 (3)</text>
    <!-- row labels -->
    <text x="92" y="116" text-anchor="end" font-size="10" fill="#888">i=0 (2)</text>
    <text x="92" y="146" text-anchor="end" font-size="10" fill="#888">i=1 (1)</text>
    <text x="92" y="176" text-anchor="end" font-size="10" fill="#888">i=2 (3)</text>

    <!-- row 0: 2,0,2 -->
    <rect x="98" y="102" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="120" y="121" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
    <rect x="148" y="102" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="170" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="198" y="102" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="220" y="121" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

    <!-- row 1: 0,1,1 -->
    <rect x="98" y="132" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="120" y="151" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="148" y="132" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="151" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <rect x="198" y="132" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="220" y="151" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

    <!-- row 2: 2,1,3 -->
    <rect x="98" y="162" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="120" y="181" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
    <rect x="148" y="162" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="181" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <rect x="198" y="162" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="220" y="181" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- Section B: freq array -->
  <text x="310" y="72" font-size="12" fill="#446688" font-weight="bold">② 频次表 freq[x]</text>
  <g font-size="11" fill="#333">
    <!-- index labels -->
    <text x="338" y="92" text-anchor="middle" font-size="9" fill="#888">x=0</text>
    <text x="382" y="92" text-anchor="middle" font-size="9" fill="#888">x=1</text>
    <text x="426" y="92" text-anchor="middle" font-size="9" fill="#888">x=2</text>
    <text x="470" y="92" text-anchor="middle" font-size="9" fill="#888">x=3</text>

    <rect x="316" y="100" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="338" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="360" y="100" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="382" y="119" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
    <rect x="404" y="100" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="426" y="119" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
    <rect x="448" y="100" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="470" y="119" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

    <text x="500" y="92" font-size="9" fill="#888">x≥4</text>
    <rect x="494" y="100" width="44" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="516" y="119" text-anchor="middle" font-size="11" fill="#aaa">0</text>

    <text x="310" y="146" font-size="10" fill="#888">9 个有序对 (i,j) → 4 种 AND 结果</text>
  </g>

  <!-- arrow down -->
  <path d="M 290 196 L 290 212" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Section C: SOS DP g array -->
  <text x="40" y="232" font-size="12" fill="#4a7a3a" font-weight="bold">③ SOS DP 后 g[s] = Σ(x⊆s) freq[x]</text>
  <g font-size="10" fill="#333">
    <text x="60" y="252" text-anchor="middle" font-size="9" fill="#888">s=0</text>
    <text x="120" y="252" text-anchor="middle" font-size="9" fill="#888">s=1</text>
    <text x="180" y="252" text-anchor="middle" font-size="9" fill="#888">s=2</text>
    <text x="240" y="252" text-anchor="middle" font-size="9" fill="#888">s=3</text>
    <text x="300" y="252" text-anchor="middle" font-size="9" fill="#888">s=4</text>
    <text x="360" y="252" text-anchor="middle" font-size="9" fill="#888">s=5</text>
    <text x="420" y="252" text-anchor="middle" font-size="9" fill="#888">s=6</text>
    <text x="480" y="252" text-anchor="middle" font-size="9" fill="#888">s=7</text>

    <rect x="38" y="260" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="60" y="279" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="98" y="260" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="120" y="279" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
    <rect x="158" y="260" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="180" y="279" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
    <rect x="218" y="260" width="44" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="240" y="279" text-anchor="middle" font-size="11" fill="#999">9</text>
    <rect x="278" y="260" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="300" y="279" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="338" y="260" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="360" y="279" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
    <rect x="398" y="260" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="420" y="279" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
    <rect x="458" y="260" width="44" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="480" y="279" text-anchor="middle" font-size="11" fill="#999">9</text>
  </g>
  <text x="40" y="304" font-size="10" fill="#888">例：g[5]=g[101] = freq[0]+freq[1]+freq[4]+freq[5] = 2+3+0+0 = 5（s=5 的所有子集频次之和）</text>

  <!-- arrow down -->
  <path d="M 290 316 L 290 332" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Section D: per-k contributions -->
  <text x="40" y="352" font-size="12" fill="#d6a040" font-weight="bold">④ 对每个 k 查 g[FULL ^ A[k]] 累加</text>

  <g font-size="11" fill="#333">
    <!-- table header -->
    <rect x="40" y="362" width="500" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="80" y="380" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">k</text>
    <text x="170" y="380" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">A[k]</text>
    <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">FULL^A[k]</text>
    <text x="390" y="380" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">g[...]</text>
    <text x="500" y="380" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">贡献</text>

    <!-- row k=0 -->
    <rect x="40" y="390" width="500" height="26" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="80" y="408" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="170" y="408" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2 (010)</text>
    <text x="280" y="408" text-anchor="middle" font-size="11" fill="#555">7^2 = 5 (101)</text>
    <text x="390" y="408" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
    <text x="500" y="408" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>

    <!-- row k=1 -->
    <rect x="40" y="418" width="500" height="26" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="80" y="436" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="170" y="436" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1 (001)</text>
    <text x="280" y="436" text-anchor="middle" font-size="11" fill="#555">7^1 = 6 (110)</text>
    <text x="390" y="436" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
    <text x="500" y="436" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>

    <!-- row k=2 -->
    <rect x="40" y="446" width="500" height="26" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="80" y="464" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="170" y="464" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 (011)</text>
    <text x="280" y="464" text-anchor="middle" font-size="11" fill="#555">7^3 = 4 (100)</text>
    <text x="390" y="464" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="500" y="464" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- summary -->
  <rect x="40" y="484" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="504" font-size="12" fill="#b85450" font-weight="bold">ans = 5 + 5 + 2 = 12 ✓</text>
  <text x="54" y="520" font-size="10" fill="#888">验证：k=0 时 x&amp;2==0 的 x∈{0,1}，freq[0]+freq[1]=2+3=5；SOS DP 把该求和压缩成 g[5] 一次查得</text>
</svg>
