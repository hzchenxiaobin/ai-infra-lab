<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">受限路径 = dist 严格递减 → 原图变隐式 DAG</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">每条边定向为 大dist→小dist；DAG 上数路径 = 多项式 DP</text>

  <!-- ===== Non-path edges (thin gray) ===== -->
  <!-- 4→1 (w=2, dist 6>4): not on any restricted path from 1 -->
  <path d="M 398 132 Q 260 78 124 207" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="10" fill="#aaa">w=2 (4→1)</text>

  <!-- 4→5 (w=10, dist 6>0): not on any restricted path from 1 -->
  <path d="M 425 147 L 425 276" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="453" y="218" text-anchor="middle" font-size="10" fill="#aaa">w=10</text>

  <!-- ===== Path edges (colored arrows) ===== -->
  <!-- 1→2 (w=3, dist 4>2): paths ①② -->
  <path d="M 121 200 L 226 139" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="158" y="160" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">w=3</text>

  <!-- 1→3 (w=3, dist 4>1): path ③ -->
  <path d="M 121 229 L 226 287" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="158" y="272" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">w=3</text>

  <!-- 2→3 (w=1, dist 2>1): path ② -->
  <path d="M 250 147 L 250 278" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="278" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">w=1</text>

  <!-- 2→5 (w=2, dist 2>0): path ① -->
  <path d="M 270 145 L 404 279" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="348" y="198" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">w=2</text>

  <!-- 3→5 (w=1, dist 1>0): paths ②③ (shared) -->
  <path d="M 278 300 L 395 300" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="292" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">w=1</text>

  <!-- ===== Nodes ===== -->
  <!-- Node 1 (source, dist=4) -->
  <ellipse cx="95" cy="215" rx="30" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="95" y="212" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="95" y="227" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">d=4</text>
  <text x="95" y="255" text-anchor="middle" font-size="8" fill="#d6a040">起点</text>

  <!-- Node 2 (dist=2) -->
  <ellipse cx="250" cy="125" rx="28" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="122" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="250" y="137" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">d=2</text>

  <!-- Node 3 (dist=1) -->
  <ellipse cx="250" cy="300" rx="28" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="297" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="250" y="312" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">d=1</text>

  <!-- Node 4 (dist=6) -->
  <ellipse cx="425" cy="125" rx="28" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="122" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="425" y="137" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">d=6</text>

  <!-- Node 5 (target, dist=0) -->
  <ellipse cx="425" cy="300" rx="30" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="425" y="297" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="425" y="312" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">d=0</text>
  <text x="425" y="340" text-anchor="middle" font-size="8" fill="#b85450">终点 n</text>

  <!-- ===== Legend: 3 restricted paths ===== -->
  <text x="40" y="370" font-size="11" fill="#444" font-weight="bold">三条受限路径（dist 严格递减）：</text>

  <line x1="40" y1="386" x2="60" y2="386" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="66" y="390" font-size="10" fill="#446688">① 1→2→5 (4&gt;2&gt;0)</text>

  <line x1="200" y1="386" x2="220" y2="386" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="226" y="390" font-size="10" fill="#4a7a3a">② 1→2→3→5 (4&gt;2&gt;1&gt;0)</text>

  <line x1="370" y1="386" x2="390" y2="386" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="396" y="390" font-size="10" fill="#d6a040">③ 1→3→5 (4&gt;1&gt;0)</text>

  <text x="280" y="410" text-anchor="middle" font-size="9" fill="#888">灰色虚线 = 不在受限路径上的 DAG 边（4→1, 4→5）</text>
</svg>
