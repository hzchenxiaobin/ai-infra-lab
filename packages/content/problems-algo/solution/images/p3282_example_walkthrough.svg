<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,3,1,5]，从左往右累加</text>

  <!-- 表头 -->
  <rect x="36" y="38" width="448" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="120" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="222" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">mx = max(nums[0..i])</text>
  <text x="310" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans 累积</text>
  <text x="424" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">记入的段</text>

  <!-- i=0 -->
  <rect x="36" y="64" width="448" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="86" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="120" y="86" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="196" y="69" width="52" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="86" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="310" y="86" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="424" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,1]</text>

  <!-- i=1：mx 被 3 接管 -->
  <rect x="36" y="98" width="448" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="196" y="103" width="52" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="120" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="310" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="424" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2] ← 3 接管</text>

  <!-- i=2：完成 -->
  <rect x="36" y="132" width="448" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="222" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="284" y="137" width="52" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="154" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="424" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,3] ← 完成</text>

  <text x="260" y="190" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">ans = 1+3+3 = 7，恰与最优路径 0→1→3 的 1×1 + 2×3 = 7 完全一致</text>
  <text x="260" y="212" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每行执行 ans += mx：把段 [i, i+1] 记为「左侧已扫过的最大值」</text>

  <rect x="90" y="228" width="340" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2 [4,3,1,3,2]：i=0..3 全程 mx=4，ans = 4+4+4+4 = 16</text>
  <text x="260" y="267" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">答案 16 ✓（起点 4 右侧无更大值，直达 0→4，4×4 = 16）</text>

  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">橙色格 = mx 数值发生接管的行；红色格 = 最终答案</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">注意 i 只跑到 n−2：下标 n−1 只是终点，不产生得分项</text>
</svg>
