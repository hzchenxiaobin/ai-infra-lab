<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：a = 80, b = 120 → 前缀差分</text>

  <!-- header -->
  <rect x="24" y="44" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">段</text>
  <rect x="100" y="44" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">范围</text>
  <rect x="196" y="44" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">个数</text>
  <rect x="260" y="44" width="236" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- f(120) group -->
  <rect x="24" y="78" width="76" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="62" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 位数</text>
  <rect x="100" y="78" width="96" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 9]</text>
  <rect x="196" y="78" width="64" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="228" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="260" y="78" width="236" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="378" y="101" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">单数字天然互不相同</text>

  <rect x="24" y="116" width="76" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="62" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 位数</text>
  <rect x="100" y="116" width="96" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[10, 99]</text>
  <rect x="196" y="116" width="64" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="228" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">81</text>
  <rect x="260" y="116" width="236" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="378" y="139" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">9×9：首位 9 种，次位去重后 9 种</text>

  <rect x="24" y="154" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="177" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3 位残段</text>
  <rect x="100" y="154" width="96" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="177" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">[100, 120]</text>
  <rect x="196" y="154" width="64" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="177" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="260" y="154" width="236" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="170" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">102~109 共 8 个 + 120；</text>
  <text x="378" y="186" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">100、101、11x 全部出局</text>

  <rect x="24" y="192" width="472" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① f(b) = f(120) = 9 + 81 + 9 = 99</text>

  <!-- f(79) group -->
  <rect x="24" y="226" width="76" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="62" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 位数</text>
  <rect x="100" y="226" width="96" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 9]</text>
  <rect x="196" y="226" width="64" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="228" y="249" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="260" y="226" width="236" height="38" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="378" y="249" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">同上</text>

  <rect x="24" y="264" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="287" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2 位残段</text>
  <rect x="100" y="264" width="96" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="287" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">[10, 79]</text>
  <rect x="196" y="264" width="64" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="287" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">63</text>
  <rect x="260" y="264" width="236" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="287" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">70 个中剔除 11, 22, …, 77 共 7 个</text>

  <rect x="24" y="302" width="472" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② f(a−1) = f(79) = 9 + 63 = 72</text>

  <!-- final answer -->
  <rect x="24" y="340" width="472" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = f(120) − f(79) = 99 − 72 = 27 ✓（示例 3 一致）</text>

  <text x="260" y="392" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">黄色「残段」是唯一需要精细计数的部分，整段（1、2 位数）直接套排列公式，见 2.2 观察三。</text>
</svg>
