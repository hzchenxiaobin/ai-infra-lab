<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心概念：公司最大工资分级映射税率，再 JOIN 回贴每行</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">税率 = CASE(MAX(salary) OVER company)，同公司所有员工共用一档</text>

  <!-- Three tier boxes (top) -->
  <!-- Tier 1: max < 1000, green, 0% -->
  <rect x="40" y="70" width="170" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">档位 ①</text>
  <text x="125" y="112" text-anchor="middle" font-size="11" fill="#555">max_salary &lt; 1000</text>
  <text x="125" y="132" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">税率 0%</text>

  <!-- Tier 2: 1000..10000, orange, 24% -->
  <rect x="235" y="70" width="170" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="92" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">档位 ②</text>
  <text x="320" y="112" text-anchor="middle" font-size="11" fill="#555">1000 ≤ max ≤ 10000</text>
  <text x="320" y="132" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">税率 24%</text>

  <!-- Tier 3: > 10000, red, 49% -->
  <rect x="430" y="70" width="170" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="515" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">档位 ③</text>
  <text x="515" y="112" text-anchor="middle" font-size="11" fill="#555">max_salary &gt; 10000</text>
  <text x="515" y="132" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">税率 49%</text>

  <!-- Number line ticks between tiers -->
  <text x="222" y="158" text-anchor="middle" font-size="9" fill="#888">1000</text>
  <text x="417" y="158" text-anchor="middle" font-size="9" fill="#888">10000</text>

  <!-- Three company cards (middle), positioned under their tier -->
  <!-- Company 2 -> tier 1 -->
  <rect x="55" y="180" width="140" height="76" rx="6" fill="#f5f5f5" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">公司 2</text>
  <text x="125" y="219" text-anchor="middle" font-size="10" fill="#555">max = 700</text>
  <text x="125" y="237" text-anchor="middle" font-size="10" fill="#555">落入档位 ①</text>
  <text x="125" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">tax_rate = 0</text>

  <!-- Company 3 -> tier 2 -->
  <rect x="250" y="180" width="140" height="76" rx="6" fill="#f5f5f5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="200" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">公司 3</text>
  <text x="320" y="219" text-anchor="middle" font-size="10" fill="#555">max = 7777</text>
  <text x="320" y="237" text-anchor="middle" font-size="10" fill="#555">落入档位 ②</text>
  <text x="320" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">tax_rate = 0.24</text>

  <!-- Company 1 -> tier 3 -->
  <rect x="445" y="180" width="140" height="76" rx="6" fill="#f5f5f5" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="515" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">公司 1</text>
  <text x="515" y="219" text-anchor="middle" font-size="10" fill="#555">max = 21300</text>
  <text x="515" y="237" text-anchor="middle" font-size="10" fill="#555">落入档位 ③</text>
  <text x="515" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">tax_rate = 0.49</text>

  <!-- Arrows from companies up to tiers -->
  <path d="M 125 180 L 125 156" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 320 180 L 320 156" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 515 180 L 515 156" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <!-- JOIN back section -->
  <text x="320" y="280" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">↓ JOIN Salaries ON company_id（税率回贴到每位员工）</text>

  <!-- Result table (bottom) -->
  <rect x="60" y="298" width="520" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">每员工税后工资 = ROUND(salary × (1 − tax_rate), 0)</text>

  <!-- Header row -->
  <rect x="60" y="326" width="520" height="22" fill="#446688" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="341" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">company</text>
  <text x="170" y="341" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">employee</text>
  <text x="320" y="341" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">salary</text>
  <text x="430" y="341" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">tax_rate</text>
  <text x="540" y="341" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">after_tax</text>

  <!-- Company 1 rows (red tier) -->
  <rect x="60" y="348" width="520" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="100" y="362" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="170" y="362" text-anchor="middle" font-size="10" fill="#555">Tony</text>
  <text x="320" y="362" text-anchor="middle" font-size="10" fill="#555">2000</text>
  <text x="430" y="362" text-anchor="middle" font-size="10" fill="#b85450">0.49</text>
  <text x="540" y="362" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1020</text>

  <rect x="60" y="368" width="520" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="100" y="382" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="170" y="382" text-anchor="middle" font-size="10" fill="#555">Pronub</text>
  <text x="320" y="382" text-anchor="middle" font-size="10" fill="#555">21300</text>
  <text x="430" y="382" text-anchor="middle" font-size="10" fill="#b85450">0.49</text>
  <text x="540" y="382" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10863</text>

  <!-- Company 2 row (green tier) -->
  <rect x="60" y="388" width="520" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="100" y="402" text-anchor="middle" font-size="10" fill="#555">2</text>
  <text x="170" y="402" text-anchor="middle" font-size="10" fill="#555">Pam</text>
  <text x="320" y="402" text-anchor="middle" font-size="10" fill="#555">300</text>
  <text x="430" y="402" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="540" y="402" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">300</text>

  <!-- Company 3 row (orange tier) -->
  <rect x="60" y="408" width="520" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="100" y="422" text-anchor="middle" font-size="10" fill="#555">3</text>
  <text x="170" y="422" text-anchor="middle" font-size="10" fill="#555">Morninngcat</text>
  <text x="320" y="422" text-anchor="middle" font-size="10" fill="#555">7777</text>
  <text x="430" y="422" text-anchor="middle" font-size="10" fill="#d6a040">0.24</text>
  <text x="540" y="422" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5911</text>

  <!-- Key insight -->
  <rect x="40" y="438" width="560" height="30" rx="8" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="453" font-size="10" fill="#444" font-weight="bold">💡 税率是「公司级常量」——先 GROUP BY company_id 算 MAX(salary) 定档，</text>
  <text x="60" y="465" font-size="10" fill="#444">   再 CASE 映射 tax_rate，JOIN 回 Salaries 后 ROUND(salary×(1−rate),0) 得税后工资</text>
</svg>
