<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">最低票价：示例演算</text>
  <path d="M 300 42 Q 450 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="450" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">days = [1,4,6,7,8,20]，costs = [2,7,15] → dp[20] = 11</text>
  <text x="450" y="86" text-anchor="middle" font-size="10" fill="#888">旅行日标红/橙/绿（取最小者），非旅行日灰色沿用昨日</text>

  <!-- ===== dp table: d = 0..20, 21 cells ===== -->
  <!-- day index row -->
  <g font-size="10" fill="#888">
    <text x="40" y="120" font-weight="bold">日 d:</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="98" y="120">0</text>
    <text x="134" y="120">1</text>
    <text x="170" y="120">2</text>
    <text x="206" y="120">3</text>
    <text x="242" y="120">4</text>
    <text x="278" y="120">5</text>
    <text x="314" y="120">6</text>
    <text x="350" y="120">7</text>
    <text x="386" y="120">8</text>
    <text x="422" y="120">9</text>
    <text x="458" y="120">10</text>
    <text x="494" y="120">11</text>
    <text x="530" y="120">12</text>
    <text x="566" y="120">13</text>
    <text x="602" y="120">14</text>
    <text x="638" y="120">15</text>
    <text x="674" y="120">16</text>
    <text x="710" y="120">17</text>
    <text x="746" y="120">18</text>
    <text x="782" y="120">19</text>
    <text x="818" y="120">20</text>
  </g>

  <!-- dp value cells -->
  <!-- d=0 base -->
  <g filter="url(#sk2)"><rect x="80" y="130" width="36" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="98" y="151" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">0</text>

  <!-- d=1 travel, dp=2 (1-day) -->
  <g filter="url(#sk2)"><rect x="116" y="130" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="134" y="151" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">2</text>

  <!-- d=2 non -->
  <g filter="url(#sk2)"><rect x="152" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="170" y="151" text-anchor="middle" font-size="11" fill="#888">2</text>

  <!-- d=3 non -->
  <g filter="url(#sk2)"><rect x="188" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="206" y="151" text-anchor="middle" font-size="11" fill="#888">2</text>

  <!-- d=4 travel dp=4 -->
  <g filter="url(#sk2)"><rect x="224" y="130" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="242" y="151" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">4</text>

  <!-- d=5 non -->
  <g filter="url(#sk2)"><rect x="260" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="278" y="151" text-anchor="middle" font-size="11" fill="#888">4</text>

  <!-- d=6 travel dp=6 -->
  <g filter="url(#sk2)"><rect x="296" y="130" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="314" y="151" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">6</text>

  <!-- d=7 travel dp=7 (7-day wins!) -->
  <g filter="url(#sk2)"><rect x="332" y="130" width="36" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="350" y="151" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">7</text>

  <!-- d=8 travel dp=9 -->
  <g filter="url(#sk2)"><rect x="368" y="130" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="386" y="151" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">9</text>

  <!-- d=9..19 non, all 9 -->
  <g filter="url(#sk2)"><rect x="404" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="422" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>
  <g filter="url(#sk2)"><rect x="440" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="458" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>
  <g filter="url(#sk2)"><rect x="476" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="494" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>
  <g filter="url(#sk2)"><rect x="512" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="530" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>
  <g filter="url(#sk2)"><rect x="548" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="566" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>
  <g filter="url(#sk2)"><rect x="584" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="602" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>
  <g filter="url(#sk2)"><rect x="620" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="638" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>
  <g filter="url(#sk2)"><rect x="656" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="674" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>
  <g filter="url(#sk2)"><rect x="692" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="710" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>
  <g filter="url(#sk2)"><rect x="728" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="746" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>
  <g filter="url(#sk2)"><rect x="764" y="130" width="36" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="782" y="151" text-anchor="middle" font-size="10" fill="#888">9</text>

  <!-- d=20 travel dp=11 final -->
  <g filter="url(#sk2)"><rect x="800" y="130" width="36" height="32" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="818" y="151" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">11</text>

  <text x="818" y="176" text-anchor="middle" font-size="9" fill="#c98a2b" font-weight="bold">答案</text>

  <!-- ===== Key transition 1: d=7 (7-day pass wins) ===== -->
  <text x="225" y="210" font-size="12" font-weight="bold" fill="#2e6e2e">关键转移 ①  d=7（旅行日）：7 天票首次反超 1 天票</text>
  <g font-size="11">
    <g filter="url(#sk2)"><rect x="80" y="222" width="130" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="145" y="244" text-anchor="middle" fill="#2b6e9e" font-family="monospace">dp[6]+2 = 8</text>

    <g filter="url(#sk2)"><rect x="80" y="262" width="130" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="145" y="284" text-anchor="middle" fill="#2e6e2e" font-family="monospace" font-weight="bold">dp[0]+7 = 7 ✓</text>

    <g filter="url(#sk2)"><rect x="80" y="302" width="130" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="145" y="324" text-anchor="middle" fill="#2b6e9e" font-family="monospace">dp[0]+15 = 15</text>

    <!-- arrow from dp[0] to d=7 -->
    <path d="M 98 336 Q 98 360 350 360 Q 350 178 350 164" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="225" y="376" text-anchor="middle" font-size="10" fill="#2e6e2e">买 7 天票：覆盖第 1–7 天，之前无花费</text>
  </g>

  <!-- ===== Key transition 2: d=20 (1-day pass, final) ===== -->
  <text x="565" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">关键转移 ②  d=20（旅行日）：1 天票最优</text>
  <g font-size="11">
    <g filter="url(#sk2)"><rect x="470" y="222" width="150" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="545" y="244" text-anchor="middle" fill="#b03a3a" font-family="monospace" font-weight="bold">dp[19]+2 = 11 ✓</text>

    <g filter="url(#sk2)"><rect x="470" y="262" width="150" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="545" y="284" text-anchor="middle" fill="#2b6e9e" font-family="monospace">dp[13]+7 = 16</text>

    <g filter="url(#sk2)"><rect x="470" y="302" width="150" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="545" y="324" text-anchor="middle" fill="#2b6e9e" font-family="monospace">dp[0]+15 = 15</text>

    <path d="M 782 336 Q 782 360 545 360 Q 545 178 545 164" stroke="none"/>
    <text x="545" y="376" text-anchor="middle" font-size="10" fill="#b03a3a">买 1 天票：只覆盖第 20 天，前 19 天已花 9</text>
  </g>

  <!-- ===== Final plan box ===== -->
  <g filter="url(#sk)">
    <rect x="80" y="406" width="740" height="100" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="450" y="432" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">最优购买方案（总花费 $11，与 DP 转移一致）</text>
  <g font-size="11" fill="#444">
    <text x="110" y="458">• 第 1 天：买 <tspan fill="#2e6e2e" font-weight="bold">7 天票 $7</tspan>（覆盖第 1–7 天，含旅行日 1,4,6,7）</text>
    <text x="110" y="478">• 第 8 天：买 <tspan fill="#b03a3a" font-weight="bold">1 天票 $2</tspan>（覆盖第 8 天）</text>
    <text x="110" y="498">• 第 20 天：买 <tspan fill="#b03a3a" font-weight="bold">1 天票 $2</tspan>（覆盖第 20 天）</text>
    <text x="430" y="458" fill="#7a5415" font-weight="bold">对应 DP 路径：</text>
    <text x="430" y="478" font-family="monospace" fill="#555">dp[7]=dp[0]+7=7</text>
    <text x="430" y="498" font-family="monospace" fill="#555">dp[8]=dp[7]+2=9 → dp[20]=dp[19]+2=11</text>
  </g>

  <text x="450" y="528" text-anchor="middle" font-size="10" fill="#888">合计 7 + 2 + 2 = $11。7 天票从第 1 天起覆盖，恰好包住前 4 个旅行日</text>
</svg>
