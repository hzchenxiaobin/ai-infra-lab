<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：A=[1,2,4,−1,2]，B=2 → 输出 [1,3,5]，最小代价 7</text>

  <!-- Top: cells row with final path 1->3->5 highlighted -->
  <text x="300" y="48" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">重建路径（沿 nxt 指针贪心前进，同代价取最小 j）</text>

  <!-- step 1 -->
  <rect x="70" y="60" width="76" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="82" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="108" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a">A₁=1 · dp=7</text>

  <!-- step 2 (not on path) -->
  <rect x="170" y="60" width="76" height="50" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="82" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">2</text>
  <text x="208" y="100" text-anchor="middle" font-size="9" fill="#666">A₂=2 · dp=8</text>

  <!-- step 3 -->
  <rect x="270" y="60" width="76" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="82" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="308" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a">A₃=4 · dp=6</text>

  <!-- step 4 blocked -->
  <rect x="370" y="60" width="76" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="408" y="82" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <text x="408" y="100" text-anchor="middle" font-size="9" fill="#b85450">A₄=−1 · ∞</text>
  <path d="M378 68 L438 102 M438 68 L378 102" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- step 5 (end) -->
  <rect x="470" y="60" width="76" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="508" y="82" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="508" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a">A₅=2 · dp=2</text>
  <text x="508" y="54" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">终点 N</text>

  <!-- path arrows 1->3->5 (skip blocked 4) -->
  <path d="M146 85 L270 85" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M346 85 L470 85" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="208" y="78" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">跳2格</text>
  <text x="408" y="78" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">跳2格(越过−1)</text>

  <!-- Bottom: backward DP computation table -->
  <text x="300" y="138" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">反向填表过程（i = N → 1）</text>

  <!-- table header -->
  <rect x="40" y="150" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">i</text>
  <text x="150" y="166" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">A[i]</text>
  <text x="270" y="166" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">窗口 dp[j]</text>
  <text x="410" y="166" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">min dp[j]</text>
  <text x="510" y="166" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">dp[i] / nxt</text>

  <!-- row i=5 (base) -->
  <rect x="40" y="174" width="520" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="191" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <text x="150" y="191" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="270" y="191" text-anchor="middle" font-size="9.5" fill="#888">—（终点基例）</text>
  <text x="410" y="191" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <text x="510" y="191" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2 / −1</text>

  <!-- row i=4 blocked -->
  <rect x="40" y="200" width="520" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="217" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="150" y="217" text-anchor="middle" font-size="10" fill="#b85450">−1</text>
  <text x="270" y="217" text-anchor="middle" font-size="9.5" fill="#b85450">禁入</text>
  <text x="410" y="217" text-anchor="middle" font-size="9.5" fill="#b85450">—</text>
  <text x="510" y="217" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">∞ / —</text>

  <!-- row i=3 -->
  <rect x="40" y="226" width="520" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="243" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="150" y="243" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="270" y="243" text-anchor="middle" font-size="9.5" fill="#333">dp[4]=∞, dp[5]=2</text>
  <text x="410" y="243" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2（j=5）</text>
  <text x="510" y="243" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6 / 5</text>

  <!-- row i=2 -->
  <rect x="40" y="252" width="520" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="269" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="150" y="269" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="270" y="269" text-anchor="middle" font-size="9.5" fill="#333">dp[3]=6, dp[4]=∞</text>
  <text x="410" y="269" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">6（j=3）</text>
  <text x="510" y="269" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">8 / 3</text>

  <!-- row i=1 (start) -->
  <rect x="40" y="278" width="520" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="70" y="295" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="150" y="295" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="270" y="295" text-anchor="middle" font-size="9.5" fill="#333">dp[2]=8, dp[3]=6</text>
  <text x="410" y="295" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">6（j=3）</text>
  <text x="510" y="295" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7 / 3</text>

  <!-- reconstruct trace -->
  <rect x="40" y="320" width="520" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="60" y="338" font-size="10.5" fill="#446688" font-weight="bold">重建：从 i=1 出发</text>
  <text x="60" y="354" font-size="9.5" fill="#333">i=1 → nxt=3（dp[3]=6 = dp[1]−A[1]=7−1 ✓）→ i=3 → nxt=5（dp[5]=2 = dp[3]−A[3]=6−4 ✓）→ 到达 N=5，停</text>
  <text x="60" y="366" font-size="9.5" fill="#4a7a3a" font-weight="bold">路径 = [1, 3, 5]，总代价 = A₁+A₃+A₅ = 1+4+2 = 7</text>

  <!-- bottom note -->
  <rect x="30" y="382" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="400" font-size="9.5" fill="#333">· 为何不走 [1,2,3,5]？代价 1+2+4+2=9 &gt; 7，非最优。</text>
  <text x="50" y="414" font-size="9.5" fill="#333">· 为何 [1,3,5] 而非 [1,3,4,5]？第 4 格 A₄=−1 禁入，必须从 3 直接跳到 5（跳 2 格 = B）。</text>
  <text x="50" y="428" font-size="9.5" fill="#333">· 同代价时 nxt 取最小 j：本例每格窗口内最小代价后继唯一，无并列；若并列则选更小下标保字典序最小。</text>
</svg>
