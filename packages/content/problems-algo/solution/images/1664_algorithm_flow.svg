<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：奇偶前缀和 → 逐位置判定 → 计数</text>

  <!-- ===== Step 1: compute totalEven / totalOdd ===== -->
  <rect x="120" y="40" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">totalEven = Σ nums[j] (j 偶)</text>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">totalOdd  = Σ nums[j] (j 奇)</text>

  <path d="M 260 86 L 260 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: init ===== -->
  <rect x="100" y="104" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">leftEven = 0,  leftOdd = 0,  ans = 0</text>
  <text x="260" y="136" text-anchor="middle" font-size="9" fill="#888">leftEven/leftOdd 维护 i 之前的偶/奇下标和</text>

  <path d="M 260 146 L 260 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: loop ===== -->
  <rect x="80" y="164" width="360" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">for i in range(n):</text>

  <path d="M 260 202 L 260 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: compute rightEven / rightOdd ===== -->
  <rect x="40" y="218" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">rightEven = totalEven − leftEven − (i 偶 ? nums[i] : 0)</text>
  <text x="260" y="252" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">rightOdd  = totalOdd  − leftOdd  − (i 奇 ? nums[i] : 0)</text>

  <path d="M 260 268 L 260 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: decision balanced? ===== -->
  <polygon points="260,284 380,318 260,352 140,318" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">leftEven+rightOdd</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">== leftOdd+rightEven?</text>

  <!-- yes -> ans++ -->
  <path d="M 140 318 L 80 318" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="110" y="312" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>
  <rect x="20" y="302" width="58" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="49" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans++</text>

  <!-- no -> skip -->
  <path d="M 380 318 L 440 318" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7"/>
  <text x="410" y="312" text-anchor="middle" font-size="9" fill="#b85450">否</text>

  <path d="M 260 352 L 260 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 6: update left sums ===== -->
  <rect x="60" y="368" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">若 i 偶: leftEven += nums[i]</text>
  <text x="260" y="402" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">若 i 奇: leftOdd  += nums[i]   （纳入左侧，进入下一轮）</text>

  <!-- loop back arrow -->
  <path d="M 460 238 L 494 238 L 494 182 L 440 182" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.6"/>
  <text x="498" y="212" font-size="8" fill="#888" transform="rotate(90 498 212)">下一轮</text>

  <!-- final return note -->
  <text x="260" y="428" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return ans</text>
</svg>
