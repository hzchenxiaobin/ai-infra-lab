<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：展开赛道 → 完整圈 + 半圈分解</text>

  <!-- Step 1: Unrolled track concept -->
  <text x="30" y="56" font-size="12" fill="#444" font-weight="bold">① 展开圆形赛道为线性</text>

  <!-- Unrolled track: sectors 1-7 for example 3 -->
  <text x="30" y="78" font-size="10" fill="#888">n=7, rounds=[1,3,5,7]</text>

  <!-- 7 boxes representing sectors -->
  <g>
    <rect x="50" y="86" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="70" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

    <rect x="90" y="86" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="110" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

    <rect x="130" y="86" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

    <rect x="170" y="86" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="190" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

    <rect x="210" y="86" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="230" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

    <rect x="250" y="86" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="270" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

    <rect x="290" y="86" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="310" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  </g>

  <!-- Wrap arrow -->
  <path d="M 330 100 Q 380 80 380 70 Q 380 55 50 55 Q 30 55 30 70 Q 30 80 40 86" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="48" font-size="9" fill="#aaa">环绕</text>

  <!-- Step 2: Full laps + partial -->
  <text x="30" y="140" font-size="12" fill="#444" font-weight="bold">② 分解 = 完整圈（均等）+ 半圈（起点→终点）</text>

  <!-- Full laps row -->
  <text x="30" y="162" font-size="10" fill="#888">完整圈：</text>
  <rect x="80" y="150" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="166" text-anchor="middle" font-size="9" fill="#4a7a3a">1</text>
  <rect x="120" y="150" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="166" text-anchor="middle" font-size="9" fill="#4a7a3a">2</text>
  <rect x="160" y="150" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="166" text-anchor="middle" font-size="9" fill="#4a7a3a">3</text>
  <rect x="200" y="150" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="166" text-anchor="middle" font-size="9" fill="#4a7a3a">4</text>
  <rect x="240" y="150" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="9" fill="#4a7a3a">5</text>
  <rect x="280" y="150" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="166" text-anchor="middle" font-size="9" fill="#4a7a3a">6</text>
  <rect x="320" y="150" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="166" text-anchor="middle" font-size="9" fill="#4a7a3a">7</text>
  <text x="380" y="166" font-size="10" fill="#4a7a3a">每个扇区 +1（均等）</text>

  <!-- Plus sign -->
  <text x="50" y="194" font-size="14" fill="#888" font-weight="bold">+</text>

  <!-- Partial lap row -->
  <text x="30" y="194" font-size="10" fill="#888">半圈：</text>
  <rect x="80" y="182" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="198" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="120" y="182" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="198" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <rect x="160" y="182" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="198" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <rect x="200" y="182" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="198" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <rect x="240" y="182" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">5</text>
  <rect x="280" y="182" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="198" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">6</text>
  <rect x="320" y="182" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="340" y="198" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">7</text>
  <text x="380" y="198" font-size="10" fill="#b85450">起点1→终点7 多 +1</text>

  <!-- Equals -->
  <text x="50" y="226" font-size="14" fill="#888" font-weight="bold">=</text>

  <!-- Result: all sectors tied -->
  <text x="30" y="226" font-size="10" fill="#888">结果：</text>
  <rect x="80" y="214" width="280" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="230" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">所有扇区并列最多 → [1,2,3,4,5,6,7]</text>

  <!-- Step 3: Three cases -->
  <text x="30" y="262" font-size="12" fill="#444" font-weight="bold">③ 三种情况分类</text>

  <!-- Case 1: start < end -->
  <rect x="30" y="274" width="160" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="292" font-size="10" fill="#b85450" font-weight="bold">start &lt; end</text>
  <text x="40" y="308" font-size="9" fill="#666">例：start=1, end=3, n=4</text>
  <text x="40" y="322" font-size="10" fill="#b85450" font-weight="bold">→ [1, 2, 3]</text>

  <!-- Case 2: start > end -->
  <rect x="200" y="274" width="160" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="210" y="292" font-size="10" fill="#446688" font-weight="bold">start &gt; end</text>
  <text x="210" y="308" font-size="9" fill="#666">例：start=3, end=1, n=4</text>
  <text x="210" y="322" font-size="10" fill="#446688" font-weight="bold">→ [3, 4, 1]</text>

  <!-- Case 3: start == end -->
  <rect x="370" y="274" width="160" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="292" font-size="10" fill="#4a7a3a" font-weight="bold">start == end</text>
  <text x="380" y="308" font-size="9" fill="#666">例：start=2, end=2, n=4</text>
  <text x="380" y="322" font-size="10" fill="#4a7a3a" font-weight="bold">→ [2]</text>

  <!-- Note box -->
  <rect x="30" y="348" width="500" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="370" font-size="11" fill="#444" font-weight="bold">⚠️ 为什么中间途径点不重要？</text>
  <text x="50" y="388" font-size="10" fill="#666">• 从 rounds[0] 经 rounds[1], rounds[2], … 到 rounds[-1] 的总路径</text>
  <text x="50" y="402" font-size="10" fill="#666">  等价于若干完整圈 + 一段从 start 到 end 的半圈</text>
  <text x="50" y="416" font-size="10" fill="#b85450" font-weight="bold">→ 中间点只增加完整圈数，不改变「谁被多访问」</text>
</svg>
