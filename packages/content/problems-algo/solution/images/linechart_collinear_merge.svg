<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：排序后把“共线相邻点”合并为同一段</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">最少线段数 = 斜率变化次数 + 1（共线相邻点不再各画一段）</text>

  <!-- ============ Row 1: naive (each pair = 1 segment) ============ -->
  <rect x="30" y="58" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="78" font-size="11" fill="#d6a040" font-weight="bold">朴素：每对相邻点都算一段</text>

  <!-- four collinear points on a slope: (1,7)(2,6)(3,5)(4,4) -->
  <!-- A(110,150) B(200,120) C(290,90) D(380,60)  step x=90, y=-30 -->
  <line x1="110" y1="150" x2="200" y2="120" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="200" y1="120" x2="290" y2="90" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="290" y1="90" x2="380" y2="60" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <circle cx="110" cy="150" r="5" fill="#fff" stroke="#333" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="200" cy="120" r="5" fill="#fff" stroke="#333" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="290" cy="90" r="5" fill="#fff" stroke="#333" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="380" cy="60" r="5" fill="#fff" stroke="#333" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="168" text-anchor="middle" font-size="10" fill="#666">P1</text>
  <text x="200" y="138" text-anchor="middle" font-size="10" fill="#666">P2</text>
  <text x="290" y="108" text-anchor="middle" font-size="10" fill="#666">P3</text>
  <text x="380" y="78" text-anchor="middle" font-size="10" fill="#666">P4</text>

  <!-- segment tags -->
  <text x="155" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">段1</text>
  <text x="245" y="112" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">段2</text>
  <text x="335" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">段3</text>

  <!-- result tag right -->
  <rect x="430" y="108" width="68" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="464" y="127" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3 段</text>

  <!-- ============ Row 2: optimal (merge collinear) ============ -->
  <rect x="30" y="188" width="480" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="208" font-size="11" fill="#4a7a3a" font-weight="bold">最优：共线相邻点合并为一段</text>

  <!-- one long red segment through 4 collinear points (same coords offset +130) -->
  <!-- A(110,280) B(200,250) C(290,220) D(380,190) -->
  <line x1="110" y1="280" x2="380" y2="190" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <circle cx="110" cy="280" r="5" fill="#fff" stroke="#333" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="200" cy="250" r="5" fill="#fff" stroke="#333" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="290" cy="220" r="5" fill="#fff" stroke="#333" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="380" cy="190" r="5" fill="#fff" stroke="#333" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- merge brace -->
  <path d="M 110 294 Q 110 304 130 306 L 360 306 Q 380 304 380 294" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">三点共线 → 同属段1</text>

  <!-- result tag right -->
  <rect x="430" y="238" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="464" y="257" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1 段</text>

  <!-- footer note -->
  <rect x="40" y="318" width="460" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="331" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">折线按 day 顺序连接，因此“共线”只需判相邻三点</text>
</svg>
