<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arf" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">正则表达式匹配：DP 算法流程</text>

  <!-- Start -->
  <rect x="230" y="44" width="140" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 300 78 L 300 92" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arf)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="190" y="94" width="220" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="118" text-anchor="middle" font-size="12" fill="#333">建 dp[(m+1)×(n+1)]，dp[0][0] = true</text>
  <path d="M 300 134 L 300 148" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arf)" filter="url(#rough2)"/>

  <!-- Boundary fill -->
  <rect x="170" y="150" width="260" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="168" text-anchor="middle" font-size="11" fill="#333">填边界：j 从 1 到 n</text>
  <text x="300" y="184" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">若 p[j-1]=='*' : dp[0][j] = dp[0][j-2]</text>
  <path d="M 300 190 L 300 204" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arf)" filter="url(#rough2)"/>

  <!-- Loop -->
  <rect x="200" y="206" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="228" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" font-weight="bold">for i = 1..m,  j = 1..n</text>
  <path d="M 300 240 L 300 256" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arf)" filter="url(#rough2)"/>

  <!-- Diamond decision -->
  <path d="M 300 258 L 396 300 L 300 342 L 204 300 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">p[j-1]</text>
  <text x="300" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">== '*' ?</text>

  <!-- Yes branch (left) -->
  <path d="M 204 300 L 130 300 L 130 358" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arf)" filter="url(#rough2)"/>
  <text x="150" y="292" font-size="11" fill="#d6a040" font-weight="bold">是</text>

  <rect x="40" y="360" width="180" height="92" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="382" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">遇到 x*（x = p[j-2]）</text>
  <text x="50" y="404" font-family="monospace" font-size="10" fill="#555">① 丢 x*：dp[i][j-2]</text>
  <text x="50" y="422" font-family="monospace" font-size="10" fill="#555">② x 匹配 s[i-1]：</text>
  <text x="62" y="438" font-family="monospace" font-size="10" fill="#555">dp[i-1][j]</text>
  <text x="130" y="452" text-anchor="middle" font-family="monospace" font-size="10" fill="#333" font-weight="bold">dp[i][j] = ① OR ②</text>

  <!-- No branch (right) -->
  <path d="M 396 300 L 470 300 L 470 358" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arf)" filter="url(#rough2)"/>
  <text x="430" y="292" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="380" y="360" width="180" height="92" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">普通字符 / '.'</text>
  <text x="390" y="406" font-family="monospace" font-size="10" fill="#555">若 p[j-1] 匹配 s[i-1]</text>
  <text x="390" y="424" font-family="monospace" font-size="10" fill="#555">  (相等 或 p[j-1]='.')：</text>
  <text x="390" y="442" font-family="monospace" font-size="10" fill="#333" font-weight="bold">dp[i][j]=dp[i-1][j-1]</text>
  <text x="390" y="456" font-size="10" fill="#999">否则 = false</text>

  <!-- Merge arrows down -->
  <path d="M 130 452 L 130 486 L 290 486" stroke="#555" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 470 452 L 470 486 L 310 486" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arf)" filter="url(#rough2)"/>

  <!-- loop back arrow (dashed) -->
  <path d="M 300 486 Q 300 510 540 510 Q 560 220 420 224" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="556" y="370" font-size="10" fill="#888" transform="rotate(90 556 370)">继续下一 (i,j)</text>

  <!-- Return -->
  <rect x="200" y="500" width="200" height="0" fill="none"/>

  <rect x="220" y="524" width="160" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="544" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 dp[m][n]</text>
</svg>
