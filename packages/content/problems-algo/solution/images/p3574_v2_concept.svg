<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：翻倍只抬「2 的幂次」，GCD 至多 ×2</text>

  <!-- 子数组原始行 -->
  <text x="32" y="61" font-size="11.5" fill="#555" filter="url(#rough2)">子数组</text>
  <rect x="75" y="40" width="90" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="195" y="40" width="90" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">12</text>
  <rect x="315" y="40" width="90" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>

  <!-- 因子拆分 -->
  <text x="120" y="92" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">= 2² × 1</text>
  <text x="240" y="92" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">= 2² × 3</text>
  <text x="360" y="92" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">= 2³ × 1</text>

  <!-- v2 徽章 -->
  <rect x="92" y="100" width="56" height="17" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="112" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">v2 = 2</text>
  <rect x="212" y="100" width="56" height="17" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="112" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">v2 = 2</text>
  <rect x="332" y="100" width="56" height="17" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="112" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">v2 = 3</text>

  <!-- 最小 v2 括线 -->
  <path d="M92,124 Q166,136 240,124" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="166" y="140" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">min v2 = 2，共 cnt = 2 个（4 和 12）</text>

  <!-- 翻倍箭头 -->
  <path d="M260,150 L260,166" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="162" font-size="10.5" fill="#446688" filter="url(#rough2)">k ≥ cnt：最小幂次的元素全部翻倍</text>

  <!-- 翻倍后行 -->
  <text x="32" y="191" font-size="11.5" fill="#555" filter="url(#rough2)">翻倍后</text>
  <rect x="75" y="170" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <rect x="195" y="170" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">24</text>
  <rect x="315" y="170" width="90" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="360" y="192" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">8</text>
  <text x="412" y="191" font-size="9.5" fill="#777" filter="url(#rough2)">v2=3 不动</text>

  <text x="240" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">新 GCD = 2³ × 1 = 8 = 2 × 旧 GCD（恰好翻一倍）</text>

  <!-- 结论框 -->
  <rect x="30" y="240" width="460" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 翻倍只给 v2 加 1，奇数部分不变 ⇒ GCD 的奇部 m 纹丝不动</text>
  <text x="260" y="282" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② v2(GCD) = min v2：部分翻倍 min 不动，GCD 不变（操作白费）</text>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 最小幂次元素全翻（费用 cnt ≤ k）⇒ GCD 恰好 ×2，再高不可能</text>
  <path d="M60,314 L460,314" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">最优分 = len × g ×（cnt ≤ k ? 2 : 1）</text>
</svg>
