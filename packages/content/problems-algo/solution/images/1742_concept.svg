<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：球号 → 数位和（值域 [1,45]）→ 盒子，定长数组直接索引</text>
  <text x="290" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">highLimit ≤ 10⁵ ⇒ 最多 5 位 99999 ⇒ 数位和 ≤ 9×5 = 45</text>

  <!-- Ball row: balls 1, 2, ..., 9, 10  (centers at 64,108,...,392,432) -->
  <text x="36" y="86" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">球号 x</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <!-- balls 1..9 normal, ball 10 highlighted (collision with ball 1) -->
    <rect x="44" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="64" y="86" fill="#333" font-weight="bold">1</text>
    <rect x="88" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="108" y="86" fill="#333" font-weight="bold">2</text>
    <rect x="132" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="152" y="86" fill="#333" font-weight="bold">3</text>
    <rect x="176" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="196" y="86" fill="#333" font-weight="bold">4</text>
    <rect x="220" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="240" y="86" fill="#333" font-weight="bold">5</text>
    <rect x="264" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="284" y="86" fill="#333" font-weight="bold">6</text>
    <rect x="308" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="328" y="86" fill="#333" font-weight="bold">7</text>
    <rect x="352" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="372" y="86" fill="#333" font-weight="bold">8</text>
    <rect x="396" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="416" y="86" fill="#333" font-weight="bold">9</text>
    <!-- ball 10 highlighted orange -->
    <rect x="440" y="66" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="464" y="86" fill="#d6a040" font-weight="bold">10</text>
  </g>

  <!-- digit sum labels -->
  <text x="36" y="120" font-size="10" fill="#888" filter="url(#rough2)">数位和</text>
  <g filter="url(#rough2)" font-size="10.5" fill="#888" text-anchor="middle">
    <text x="64" y="120">1</text>
    <text x="108" y="120">2</text>
    <text x="152" y="120">3</text>
    <text x="196" y="120">4</text>
    <text x="240" y="120">5</text>
    <text x="284" y="120">6</text>
    <text x="328" y="120">7</text>
    <text x="372" y="120">8</text>
    <text x="416" y="120">9</text>
    <text x="464" y="120" fill="#d6a040" font-weight="bold">1+0=1</text>
  </g>

  <!-- arrows: most go straight down to same box; ball 1 and ball 10 both → box 1 -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.2" fill="none">
    <path d="M 108 126 L 108 150" marker-end="url(#arr)"/>
    <path d="M 152 126 L 152 150" marker-end="url(#arr)"/>
    <path d="M 196 126 L 196 150" marker-end="url(#arr)"/>
    <path d="M 240 126 L 240 150" marker-end="url(#arr)"/>
    <path d="M 284 126 L 284 150" marker-end="url(#arr)"/>
    <path d="M 328 126 L 328 150" marker-end="url(#arr)"/>
    <path d="M 372 126 L 372 150" marker-end="url(#arr)"/>
    <path d="M 416 126 L 416 150" marker-end="url(#arr)"/>
  </g>
  <!-- ball 1 → box 1 straight -->
  <path d="M 64 126 L 64 150" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- ball 10 → box 1 curved (collision!) -->
  <path d="M 464 126 Q 464 138 300 150" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="380" y="140" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">多对一！</text>

  <!-- Box row: boxes 1..9, box 1 highlighted with count 2 -->
  <text x="36" y="174" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">盒子</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <!-- box 1 highlighted green (2 balls) -->
    <rect x="44" y="156" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="64" y="171" fill="#333" font-size="9">盒1</text>
    <text x="64" y="186" fill="#4a7a3a" font-weight="bold" font-size="13">2</text>
    <!-- boxes 2..9 count 1 -->
    <rect x="88" y="156" width="40" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="108" y="171" fill="#555" font-size="9">盒2</text>
    <text x="108" y="186" fill="#555" font-weight="bold">1</text>
    <rect x="132" y="156" width="40" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="152" y="171" fill="#555" font-size="9">盒3</text>
    <text x="152" y="186" fill="#555" font-weight="bold">1</text>
    <rect x="176" y="156" width="40" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="196" y="171" fill="#555" font-size="9">盒4</text>
    <text x="196" y="186" fill="#555" font-weight="bold">1</text>
    <rect x="220" y="156" width="40" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="240" y="171" fill="#555" font-size="9">盒5</text>
    <text x="240" y="186" fill="#555" font-weight="bold">1</text>
    <rect x="264" y="156" width="40" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="284" y="171" fill="#555" font-size="9">盒6</text>
    <text x="284" y="186" fill="#555" font-weight="bold">1</text>
    <rect x="308" y="156" width="40" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="328" y="171" fill="#555" font-size="9">盒7</text>
    <text x="328" y="186" fill="#555" font-weight="bold">1</text>
    <rect x="352" y="156" width="40" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="372" y="171" fill="#555" font-size="9">盒8</text>
    <text x="372" y="186" fill="#555" font-weight="bold">1</text>
    <rect x="396" y="156" width="40" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="416" y="171" fill="#555" font-size="9">盒9</text>
    <text x="416" y="186" fill="#555" font-weight="bold">1</text>
    <!-- ellipsis -->
    <text x="470" y="178" fill="#aaa" font-size="14">···</text>
  </g>

  <!-- ans annotation -->
  <path d="M 64 196 L 64 218" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="14" y="222" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="74" y="242" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = max = 2</text>

  <!-- Bottom: cnt[46] array insight -->
  <rect x="30" y="266" width="520" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">数位和值域 [1, 45] ⇒ 定长数组 cnt[46] 直接索引</text>
  <!-- mini array cells -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <rect x="60" y="300" width="30" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="75" y="315" fill="#aaa">0</text>
    <rect x="90" y="300" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="105" y="315" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="120" y="300" width="30" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="135" y="315" fill="#555">2</text>
    <rect x="150" y="300" width="30" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="165" y="315" fill="#555">3</text>
    <rect x="180" y="300" width="24" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="192" y="315" fill="#555">4</text>
    <rect x="204" y="300" width="24" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="216" y="315" fill="#555">5</text>
    <text x="240" y="315" fill="#aaa" font-size="11">···</text>
    <rect x="268" y="300" width="30" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="283" y="315" fill="#555">43</text>
    <rect x="298" y="300" width="30" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="313" y="315" fill="#555">44</text>
    <rect x="328" y="300" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2"/>
    <text x="343" y="315" fill="#b85450" font-weight="bold">45</text>
  </g>
  <text x="105" y="340" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑ cnt[s]++</text>
  <text x="343" y="340" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">↑ 上界 9×5</text>
  <text x="430" y="315" font-size="9.5" fill="#888" filter="url(#rough2)">O(1) 空间</text>
</svg>
