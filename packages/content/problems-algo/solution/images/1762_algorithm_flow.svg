<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：从右向左单遍扫描，维护右侧最大高度 maxH</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="60" rx="50" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="170" y="98" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">maxH = 0,  res = [ ]</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i = n − 1（从最右端起步）</text>
  <path d="M 280 142 L 280 160" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision diamond -->
  <polygon points="280,162 372,202 280,242 188,202" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ≥ 0 ?</text>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">(尚未扫完)</text>

  <!-- No branch -> reverse + return -->
  <path d="M 372 202 L 460 202 L 460 286" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="194" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="384" y="288" width="152" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">reverse(res)</text>
  <text x="460" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 res</text>

  <!-- Yes branch down -->
  <path d="M 280 242 L 280 260" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="256" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: h[i] > maxH ? -->
  <polygon points="280,262 380,302 280,342 180,302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">heights[i] &gt; maxH ?</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">比右侧都高？</text>

  <!-- Yes -> record + update maxH -->
  <path d="M 180 302 L 96 302" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="294" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="30" y="282" width="66" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="63" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">res 加 i</text>
  <text x="63" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">maxH=h[i]</text>

  <!-- No -> skip -->
  <path d="M 280 342 L 280 360 L 96 360 L 96 324" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="356" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="30" y="342" width="66" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="63" y="367" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">跳过</text>

  <!-- merge to i-- -->
  <path d="M 63 324 L 63 398 L 200 398" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 63 382 L 63 398 L 200 398" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- i-- box -->
  <rect x="200" y="382" width="170" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="406" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i −− （向左移动）</text>

  <!-- loop back -->
  <path d="M 370 401 L 470 401 L 470 202 L 372 202" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="300" font-size="11" fill="#888" filter="url(#rough2)">回到</text>
  <text x="478" y="314" font-size="11" fill="#888" filter="url(#rough2)">循环</text>
  <text x="478" y="328" font-size="11" fill="#888" filter="url(#rough2)">判断</text>

  <!-- footer note -->
  <text x="40" y="456" font-size="11" fill="#555" filter="url(#rough2)">💡 收集到的下标自右向左递减，最后 reverse 得到升序；maxH 单调递增，每个 h[i] 只比较一次</text>
</svg>
