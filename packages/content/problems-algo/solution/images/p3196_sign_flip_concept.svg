<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：分割 ⇄ 给每个元素选符号</text>

  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums = [1, −2, 3, 4]，分割 [1, −2, 3] | [4]：</text>

  <rect x="120" y="56" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="56" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="256" y="56" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="56" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="83" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="218" y="83" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="286" y="83" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="354" y="83" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 320 50 L 320 106" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="320" y="113" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">分割点</text>

  <circle cx="150" cy="128" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="218" cy="128" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="286" cy="128" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="354" cy="128" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="133" text-anchor="middle" font-size="14" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="218" y="133" text-anchor="middle" font-size="14" fill="#8a3030" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="286" y="133" text-anchor="middle" font-size="14" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="354" y="133" text-anchor="middle" font-size="14" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+</text>

  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">段内符号 + − + − 交替、段首必为 +；开新段 = 符号从 + 重新开始</text>

  <rect x="40" y="174" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="197" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">合法符号序列只有两条规则：</text>
  <text x="280" y="219" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">① 首元素必为 +（是段首）　　② 相邻两个 − 非法（负号只出现在段内奇偏移）</text>

  <text x="120" y="266" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ + − + +</text>
  <text x="120" y="286" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">++ 处切一刀即可</text>
  <text x="280" y="266" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ − + +</text>
  <text x="280" y="286" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">首元素为 −</text>
  <text x="440" y="266" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ + − −</text>
  <text x="440" y="286" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">相邻两个 −</text>

  <rect x="40" y="306" width="480" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">分割 ⇄ 选符号：挑若干位置（不含 0 号、两两不相邻）翻成负号</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">最大化 Σ ±nums[i] —— 打家劫舍式线性 DP，O(n) 时间 / O(1) 空间</text>
</svg>
