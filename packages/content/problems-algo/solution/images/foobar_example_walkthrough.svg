<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 2</text>

  <rect x="30" y="42" width="500" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="120" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">线程</text>
  <text x="300" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">动作要点</text>
  <text x="490" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">turn(后)</text>

  <line x1="85" y1="42" x2="85" y2="248" stroke="#ddd" stroke-width="1"/>
  <line x1="155" y1="42" x2="155" y2="248" stroke="#ddd" stroke-width="1"/>
  <line x1="445" y1="42" x2="445" y2="248" stroke="#ddd" stroke-width="1"/>

  <text x="55" y="88" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="92" y="76" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Foo</text>
  <text x="300" y="92" text-anchor="middle" font-size="10" fill="#444">lock → wait(T✓) → printFoo → turn=F → notify</text>
  <rect x="468" y="76" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <text x="55" y="128" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="92" y="116" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Bar</text>
  <text x="300" y="132" text-anchor="middle" font-size="10" fill="#444">lock → wait(F✓) → printBar → turn=T → notify</text>
  <rect x="468" y="116" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">true</text>

  <text x="55" y="168" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="92" y="156" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Foo</text>
  <text x="300" y="172" text-anchor="middle" font-size="10" fill="#444">lock → wait(T✓) → printFoo → turn=F → notify</text>
  <rect x="468" y="156" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <text x="55" y="208" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="92" y="196" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Bar</text>
  <text x="300" y="212" text-anchor="middle" font-size="10" fill="#444">lock → wait(F✓) → printBar → turn=T → notify</text>
  <rect x="468" y="196" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">true</text>

  <path d="M 30 252 Q 280 250 530 252" stroke="#ddd" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="40" y="282" font-size="12" fill="#555" font-weight="bold">输出累积：</text>

  <rect x="120" y="270" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="287" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">foo</text>

  <path d="M 162 282 L 178 282" stroke="#888" stroke-width="1.5" marker-end="url(#rough2)" fill="none"/>

  <rect x="182" y="270" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="287" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">foobar</text>

  <path d="M 248 282 L 264 282" stroke="#888" stroke-width="1.5" marker-end="url(#rough2)" fill="none"/>

  <rect x="268" y="270" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="287" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">foobarfoo</text>

  <path d="M 370 282 L 386 282" stroke="#888" stroke-width="1.5" marker-end="url(#rough2)" fill="none"/>

  <rect x="390" y="270" width="126" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="453" y="287" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">foobarfoobar</text>

  <rect x="90" y="320" width="380" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终输出 = "foobarfoobar" ✓（n=2 组）</text>

  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888">每轮 foo 与 bar 各执行一次，turn 在 true/false 间来回翻转</text>
</svg>
