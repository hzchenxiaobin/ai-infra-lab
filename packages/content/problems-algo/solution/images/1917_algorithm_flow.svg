<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：六步执行（CTE → JOIN → WHERE → GROUP → HAVING → DISTINCT）</text>

  <!-- ===== Step 1: CTE FriendshipBoth ===== -->
  <rect x="60" y="40" width="480" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="60" font-size="11" fill="#d6a040" font-weight="bold">① WITH FriendshipBoth AS (</text>
  <text x="100" y="76" font-size="10" fill="#666">SELECT user1_id AS u1, user2_id AS u2 FROM Friendship</text>
  <text x="100" y="90" font-size="10" fill="#666">UNION  SELECT user2_id AS u1, user1_id AS u2 FROM Friendship</text>
  <text x="80" y="104" font-size="10" fill="#d6a040">)  — 对称化：每对好友双向各一行</text>

  <path d="M 300 112 L 300 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Self-join ===== -->
  <rect x="60" y="132" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">② FROM Listens l1 JOIN Listens l2 ON</text>
  <text x="100" y="168" font-size="10" fill="#666">l1.day = l2.day  AND  l1.song_id = l2.song_id</text>
  <text x="100" y="182" font-size="10" fill="#666">AND  l1.user_id != l2.user_id</text>
  <text x="80" y="196" font-size="10" fill="#4a7a3a">— 自连接物化「同日同曲不同人」的共听行（双向）</text>

  <path d="M 300 206 L 300 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: WHERE NOT EXISTS ===== -->
  <rect x="60" y="226" width="480" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="246" font-size="11" fill="#b85450" font-weight="bold">③ WHERE NOT EXISTS (</text>
  <text x="100" y="262" font-size="10" fill="#666">SELECT 1 FROM FriendshipBoth f</text>
  <text x="100" y="276" font-size="10" fill="#666">WHERE f.u1 = l1.user_id AND f.u2 = l2.user_id</text>
  <text x="80" y="292" font-size="10" fill="#b85450">)  — 反连接：排除已是好友的共听行（行级，先于 GROUP BY）</text>

  <path d="M 300 300 L 300 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: GROUP BY ===== -->
  <rect x="60" y="320" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="340" font-size="11" fill="#446688" font-weight="bold">④ GROUP BY l1.day, l1.user_id, l2.user_id</text>
  <text x="80" y="358" font-size="10" fill="#666">— 按「日期 + 用户对」折叠共听行，每组对应某天两人共同听的全部歌曲</text>
  <text x="80" y="372" font-size="10" fill="#446688">— 如 (3/15, 用户1, 用户3) → {歌10, 歌11, 歌12}</text>

  <path d="M 300 378 L 300 394" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: HAVING ===== -->
  <rect x="60" y="398" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="418" font-size="11" fill="#446688" font-weight="bold">⑤ HAVING COUNT(DISTINCT l1.song_id) >= 3</text>
  <text x="80" y="436" font-size="10" fill="#666">— 组级过滤：同日共听不同歌曲数 ≥ 3（DISTINCT 应对 Listens 重复行）</text>
  <text x="80" y="450" font-size="10" fill="#888">— (1,4) 仅 {10,11} 共 2 首 → 删除；(1,3) {10,11,12} 共 3 首 → 保留</text>

  <path d="M 300 456 L 300 472" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 6: SELECT DISTINCT ===== -->
  <rect x="60" y="476" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="496" font-size="11" fill="#4a7a3a" font-weight="bold">⑥ SELECT DISTINCT l1.user_id, l2.user_id AS recommended_id</text>
  <text x="80" y="514" font-size="10" fill="#666">— 去重输出：同一用户对跨天可能多次满足，DISTINCT 保证只出现一次</text>
  <text x="80" y="528" font-size="10" fill="#4a7a3a">— 双向性：l1.user_id != l2.user_id 不限大小 → (1,3) 与 (3,1) 各一行</text>

  <!-- ===== Left side: SQL clause order ===== -->
  <rect x="560" y="40" width="36" height="492" fill="none" stroke="none"/>
  <text x="578" y="80" font-size="8" fill="#888" transform="rotate(90, 578, 80)">FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT</text>

</svg>
