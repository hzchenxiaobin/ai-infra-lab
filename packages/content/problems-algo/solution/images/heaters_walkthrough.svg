<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：houses=[1,2,3,4], heaters=[1,4]（已排序）</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">每个房屋用 lower_bound 定位，比较左右两个候选供暖器取最小距离</text>

  <!-- ===== Table header ===== -->
  <rect x="40" y="60" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">房屋 h</text>

  <rect x="120" y="60" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">idx</text>

  <rect x="200" y="60" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左候选 h−heaters[idx−1]</text>

  <rect x="360" y="60" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">右候选 heaters[idx]−h</text>

  <rect x="520" y="60" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="540" y="81" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d</text>

  <!-- ===== Row 1: h=1, idx=0, left=—, right=0, d=0 ===== -->
  <rect x="40" y="96" width="80" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="120" y="96" width="80" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="121" text-anchor="middle" font-size="13" fill="#333">0</text>

  <rect x="200" y="96" width="160" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#bbb">—（idx=0 无左候选）</text>

  <rect x="360" y="96" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="121" text-anchor="middle" font-size="12" fill="#333">heaters[0]−1 = 1−1 = 0</text>

  <rect x="520" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="540" y="121" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- ===== Row 2: h=2, idx=1, left=1, right=2, d=1 ===== -->
  <rect x="40" y="140" width="80" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="120" y="140" width="80" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="165" text-anchor="middle" font-size="13" fill="#333">1</text>

  <rect x="200" y="140" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="165" text-anchor="middle" font-size="12" fill="#333">2−heaters[0] = 2−1 = 1</text>

  <rect x="360" y="140" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="165" text-anchor="middle" font-size="12" fill="#333">heaters[1]−2 = 4−2 = 2</text>

  <rect x="520" y="140" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="540" y="165" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== Row 3: h=3, idx=1, left=2, right=1, d=1 ===== -->
  <rect x="40" y="184" width="80" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <rect x="120" y="184" width="80" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="209" text-anchor="middle" font-size="13" fill="#333">1</text>

  <rect x="200" y="184" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="12" fill="#333">3−heaters[0] = 3−1 = 2</text>

  <rect x="360" y="184" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="209" text-anchor="middle" font-size="12" fill="#333">heaters[1]−3 = 4−3 = 1</text>

  <rect x="520" y="184" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="540" y="209" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== Row 4: h=4, idx=1, left=3, right=0, d=0 ===== -->
  <rect x="40" y="228" width="80" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="253" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <rect x="120" y="228" width="80" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="253" text-anchor="middle" font-size="13" fill="#333">1</text>

  <rect x="200" y="228" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="253" text-anchor="middle" font-size="12" fill="#333">4−heaters[0] = 4−1 = 3</text>

  <rect x="360" y="228" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="253" text-anchor="middle" font-size="12" fill="#333">heaters[1]−4 = 4−4 = 0</text>

  <rect x="520" y="228" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="540" y="253" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- ===== Answer row ===== -->
  <rect x="40" y="288" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">ans = max(0, 1, 1, 0) = 1</text>

  <rect x="520" y="288" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="540" y="316" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== Notes ===== -->
  <rect x="40" y="350" width="520" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="372" font-size="11" fill="#555" font-weight="bold">关键观察：</text>
  <text x="60" y="390" font-size="11" fill="#666">• 房屋 1、4 与供暖器重合（d=0），不拉高答案</text>
  <text x="60" y="406" font-size="11" fill="#666">• 房屋 2、3 处于两个供暖器「夹缝」中，各自取较近的一侧（d=1）</text>
  <text x="60" y="422" font-size="11" fill="#b85450" font-weight="bold">• 这两个夹缝房屋共同把统一半径顶到 1 → 这就是最终答案</text>
</svg>
