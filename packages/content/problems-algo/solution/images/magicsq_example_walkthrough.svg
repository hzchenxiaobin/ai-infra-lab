<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：grid = [[4,3,8,4],[9,5,1,9],[2,7,6,2]]</text>

  <!-- ===== 左侧：窗口 (0,0) ===== -->
  <text x="120" y="60" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">窗口 (0,0)</text>
  <!-- 3x3 网格 -->
  <rect x="40" y="72" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="92" y="72" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="72" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="124" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="92" y="124" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="124" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="176" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="92" y="176" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="176" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- 数字 -->
  <text x="66" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">4</text>
  <text x="118" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">3</text>
  <text x="170" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">8</text>
  <text x="66" y="157" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">9</text>
  <text x="118" y="157" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="170" y="157" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <text x="66" y="209" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">2</text>
  <text x="118" y="209" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">7</text>
  <text x="170" y="209" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">6</text>

  <!-- 校验标注 -->
  <text x="40" y="250" font-size="12" fill="#4a7a3a" filter="url(#rough2)">中心 = 5  ✓</text>
  <text x="40" y="268" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1~9 各一次  ✓</text>
  <text x="40" y="286" font-size="12" fill="#4a7a3a" filter="url(#rough2)">行 15 / 列 15 / 对角 15  ✓</text>
  <rect x="36" y="300" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="111" y="320" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是幻方！count=1</text>

  <!-- ===== 右侧：窗口 (0,1) ===== -->
  <text x="410" y="60" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口 (0,1)</text>
  <rect x="330" y="72" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="382" y="72" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="72" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="124" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="382" y="124" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="124" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="176" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="382" y="176" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="176" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- 数字 -->
  <text x="356" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">3</text>
  <text x="408" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">8</text>
  <text x="460" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">4</text>
  <text x="356" y="157" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">5</text>
  <text x="408" y="157" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="460" y="157" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">9</text>
  <text x="356" y="209" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">7</text>
  <text x="408" y="209" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">6</text>
  <text x="460" y="209" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">2</text>

  <!-- 校验标注 -->
  <text x="330" y="250" font-size="12" fill="#b85450" filter="url(#rough2)">中心 = 1 ≠ 5  ✗</text>
  <text x="330" y="268" font-size="12" fill="#b85450" filter="url(#rough2)">剪枝：直接跳过</text>
  <rect x="326" y="300" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="401" y="320" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">非幻方，跳过</text>

  <!-- 底部结果 -->
  <text x="270" y="358" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">最终结果：count = 1</text>
</svg>
