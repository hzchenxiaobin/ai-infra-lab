<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：第 k 块恰好 k 个数 —— 三角形数切分</text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">以 n = 7 为例：块长 1, 2, 3, … 递增；剩余不足 k 个时整体作尾块</text>

  <!-- 阶梯分块 -->
  <g filter="url(#rough2)">
    <!-- 块标签 -->
    <text x="90" y="88" text-anchor="end" font-size="11.5" fill="#33506b" font-weight="bold">块1</text>
    <text x="90" y="126" text-anchor="end" font-size="11.5" fill="#33506b" font-weight="bold">块2</text>
    <text x="90" y="164" text-anchor="end" font-size="11.5" fill="#33506b" font-weight="bold">块3</text>
    <text x="90" y="202" text-anchor="end" font-size="11.5" fill="#8a6d1a" font-weight="bold">块4</text>

    <!-- 行 1：[1] -->
    <rect x="100" y="68" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="119" y="88" text-anchor="middle" font-size="13" fill="#33506b">1</text>

    <!-- 行 2：[2, 3] -->
    <rect x="100" y="106" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="142" y="106" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="119" y="126" text-anchor="middle" font-size="13" fill="#33506b">2</text>
    <text x="161" y="126" text-anchor="middle" font-size="13" fill="#33506b">3</text>

    <!-- 行 3：[4, 5, 6] -->
    <rect x="100" y="144" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="142" y="144" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="144" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="119" y="164" text-anchor="middle" font-size="13" fill="#33506b">4</text>
    <text x="161" y="164" text-anchor="middle" font-size="13" fill="#33506b">5</text>
    <text x="203" y="164" text-anchor="middle" font-size="13" fill="#33506b">6</text>

    <!-- 行 4：[7] 尾块 + 超出 n 的 8,9,10 -->
    <rect x="100" y="182" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="119" y="202" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">7</text>
    <rect x="142" y="182" width="38" height="30" rx="4" fill="#f2f2f2" stroke="#a8a8a8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="184" y="182" width="38" height="30" rx="4" fill="#f2f2f2" stroke="#a8a8a8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="226" y="182" width="38" height="30" rx="4" fill="#f2f2f2" stroke="#a8a8a8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="161" y="202" text-anchor="middle" font-size="13" fill="#999999">8</text>
    <text x="203" y="202" text-anchor="middle" font-size="13" fill="#999999">9</text>
    <text x="245" y="202" text-anchor="middle" font-size="13" fill="#999999">10</text>
    <text x="203" y="228" text-anchor="middle" font-size="10.5" fill="#999999">8、9、10 超出 n = 7，不参与分块</text>
  </g>

  <!-- 每行乘积标注 -->
  <g filter="url(#rough2)" stroke="#7a8aa0" stroke-width="1.5" fill="none">
    <path d="M 144 83 L 292 83" marker-end="url(#arr)"/>
    <path d="M 186 121 L 292 121" marker-end="url(#arr)"/>
    <path d="M 228 159 L 292 159" marker-end="url(#arr)"/>
    <path d="M 270 197 L 292 197" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <text x="300" y="88" font-size="12.5" fill="#33506b">乘积 = 1</text>
    <text x="300" y="126" font-size="12.5" fill="#33506b">乘积 = 2×3 = 6</text>
    <text x="300" y="164" font-size="12.5" fill="#33506b">乘积 = 4×5×6 = 120</text>
    <text x="300" y="202" font-size="12.5" fill="#8a6d1a" font-weight="bold">尾块：乘积 = 7</text>
  </g>

  <!-- 公式框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="246" width="440" height="64" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="270" text-anchor="middle" font-size="13.5" fill="#8a6d1a" font-weight="bold">块 k = [T(k−1)+1, T(k)]，其中 T(k) = k(k+1)/2（三角形数）</text>
    <text x="280" y="294" text-anchor="middle" font-size="11.5" fill="#7a6a3a">完整块数 K = ( √(8n+1) − 1 ) / 2 向下取整；尾块 = 剩余的 [T(K)+1, n]</text>
  </g>

  <text x="280" y="340" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = 7：ans = 1 + 6 + 120 + 7 = 134（尾块 [7] 照常计入）</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">对照 n = 3 恰好分尽（3 = T(2)）：ans = 1 + 6 = 7，无尾块</text>
</svg>
