<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：排序后 a ≤ b ≤ c，只需检查一条不等式</text>

  <!-- triangle -->
  <path d="M 70 250 L 250 250 L 150 110 Z" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <!-- side labels -->
  <text x="95" y="180" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="212" y="180" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="152" y="272" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">c（最大边）</text>
  <text x="60" y="246" font-size="10.5" fill="#888" filter="url(#rough2)">·</text>
  <text x="150" y="102" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">顶点要「够得着」才闭合成三角形</text>

  <!-- right side: three inequalities -->
  <rect x="296" y="64" width="204" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="398" y="86" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">a + b &gt; c ？</text>
  <text x="398" y="106" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">唯一关卡：两条短边拼起来要压过最大边</text>

  <rect x="296" y="132" width="204" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="398" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a + c &gt; b ✓ 自动成立</text>
  <text x="398" y="170" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">c ≥ b 且 a &gt; 0，白送</text>

  <rect x="296" y="196" width="204" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="398" y="216" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b + c &gt; a ✓ 自动成立</text>
  <text x="398" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">b ≥ a 且 c &gt; 0，白送</text>

  <path d="M 268 92 Q 284 92 292 90" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- degenerate case strip -->
  <rect x="48" y="292" width="424" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⚠️ 必须严格大于：a + b == c 是「退化三角形」</text>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">三点共线、面积为 0 → 返回 "none"；a + b &lt; c 同理。</text>

  <!-- bottom note -->
  <rect x="48" y="356" width="424" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">排序消除了三条不等式间的对称性：把「查三次」归一成「查一次」。</text>
</svg>
