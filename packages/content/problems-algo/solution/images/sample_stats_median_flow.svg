<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    中位数求解流程：累加频次定位第 k 位
  </text>

  <!-- ===== 步骤 1: 计算 total ===== -->
  <rect x="60" y="46" width="440" height="44" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    ① total = Σ count[i]，  定位 mid₁ = (total−1)/2，  mid₂ = total/2  （0-indexed）
  </text>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">
    奇数个 → mid₁=mid₂ 取单个；偶数个 → 取相邻两位求平均
  </text>

  <path d="M 280 90 L 280 106" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤 2: 累加扫描 ===== -->
  <rect x="60" y="108" width="440" height="44" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    ② acc = 0，从 idx=0 起逐桶累加：acc += count[idx]
  </text>
  <text x="280" y="144" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">
    acc 表示当前已跨越的样本个数
  </text>

  <path d="M 280 152 L 280 168" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤 3: 判定菱形 ===== -->
  <polygon points="280,170 380,200 280,230 180,200" fill="#fce4ec"
           stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">acc &gt; k ?</text>
  <text x="280" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">(k=mid₁ 或 mid₂)</text>

  <!-- 否分支 -->
  <path d="M 380 200 L 430 200" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="194" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>
  <rect x="430" y="184" width="70" height="32" rx="6" fill="#f0f0f0"
        stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="465" y="204" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">idx++</text>
  <path d="M 465 184 L 465 158 L 280 158 L 280 168" stroke="#666" stroke-width="1.3" fill="none"
        stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是分支 -->
  <path d="M 180 200 L 130 200 L 130 250" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="194" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- ===== 步骤 4: 返回 idx ===== -->
  <rect x="60" y="250" width="140" height="44" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    ③ 返回 idx
  </text>
  <text x="130" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">
    = 第 k 位的值
  </text>

  <path d="M 200 272 L 280 272" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤 5: 合并 ===== -->
  <rect x="280" y="250" width="220" height="44" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    ④ median = (findKth(mid₁) + findKth(mid₂)) / 2
  </text>
  <text x="390" y="286" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">
    奇数时 mid₁=mid₂ → 自然退化为单值
  </text>

  <!-- ===== 累加过程示意 ===== -->
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">
    累加过程（示例 1：total=8，求 mid₁=3, mid₂=4）
  </text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="60" y="338" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="110" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">idx</text>
    <rect x="160" y="338" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="210" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count[idx]</text>
    <rect x="260" y="338" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="310" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">acc（累加）</text>
    <rect x="360" y="338" width="140" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="430" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">覆盖位（0-indexed）</text>
  </g>

  <!-- 行 idx=1 -->
  <g filter="url(#rough2)">
    <rect x="60" y="366" width="100" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="110" y="384" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="160" y="366" width="100" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="210" y="384" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="260" y="366" width="100" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="310" y="384" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="360" y="366" width="140" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="430" y="384" text-anchor="middle" font-size="11" fill="#888">位 0</text>
  </g>

  <!-- 行 idx=2 命中 mid₁=3 -->
  <g filter="url(#rough2)">
    <rect x="60" y="392" width="100" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="110" y="410" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="160" y="392" width="100" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="210" y="410" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="260" y="392" width="100" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="310" y="410" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="360" y="392" width="140" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="430" y="410" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">位 1,2,3 → 命中 mid₁</text>
  </g>

  <!-- 行 idx=3 命中 mid₂=4 -->
  <g filter="url(#rough2)">
    <rect x="60" y="418" width="100" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="110" y="436" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
    <rect x="160" y="418" width="100" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="210" y="436" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="260" y="418" width="100" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="310" y="436" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
    <rect x="360" y="418" width="140" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="430" y="436" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">位 4,5,6,7 → 命中 mid₂</text>
  </g>
</svg>
