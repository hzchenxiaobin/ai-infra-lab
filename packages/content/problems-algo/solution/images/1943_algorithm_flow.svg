<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：差分构建 → 排序端点 → 扫描输出</text>

  <!-- Step 1: build diff -->
  <rect x="40" y="52" width="540" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="76" font-size="13" fill="#446688" font-weight="bold">步骤 1 · 构建差分表</text>
  <g font-size="11" font-family="monospace">
    <text x="60" y="98" fill="#444">for [start, end, color] in segments:</text>
    <text x="80" y="116" fill="#4a7a3a">diff[start] += color   // 起点加色</text>
    <text x="80" y="132" fill="#b85450">diff[end]   -= color   // 终点减色</text>
  </g>

  <path d="M 310 144 L 310 168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: sort keys -->
  <rect x="40" y="174" width="540" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="198" font-size="13" fill="#d6a040" font-weight="bold">步骤 2 · 取出端点并排序</text>
  <text x="60" y="218" font-size="11" font-family="monospace" fill="#555">keys = sorted(diff)   // 所有端点升序，相邻端点间颜色和恒定</text>

  <path d="M 310 234 L 310 258" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: sweep -->
  <rect x="40" y="264" width="540" height="180" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="288" font-size="13" fill="#4a7a3a" font-weight="bold">步骤 3 · 扫描端点，维护前缀和 sum</text>

  <g font-size="11" font-family="monospace">
    <text x="60" y="312" fill="#444">sum = 0, prev = None</text>
    <text x="60" y="332" fill="#444">for pos in keys:</text>
  </g>

  <!-- decision -->
  <polygon points="180,344 280,372 180,400 80,372" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">sum &gt; 0 ?</text>

  <text x="290" y="366" font-size="11" fill="#888">是</text>
  <text x="150" y="412" font-size="11" fill="#888">否</text>

  <!-- emit branch -->
  <rect x="300" y="356" width="260" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="316" y="378" font-size="11" font-family="monospace" fill="#4a7a3a">res.append([prev, pos, sum])</text>

  <!-- skip branch -->
  <rect x="50" y="406" width="200" height="28" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="424" font-size="11" font-family="monospace" fill="#888">跳过（未涂色区域）</text>

  <path d="M 250 372 L 296 372" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 180 400 L 180 406" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- update sum -->
  <rect x="300" y="404" width="260" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="316" y="424" font-size="11" font-family="monospace" fill="#d6a040">sum += diff[pos]; prev = pos</text>

  <path d="M 430 392 L 430 404" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
</svg>
