<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>
  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：两条按幂次降序的链表 → 归并式双指针</text>

  <!-- Legend -->
  <g filter="url(#rough2)">
    <rect x="430" y="44" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="460" y="44" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <text x="445" y="80" text-anchor="middle" font-size="10" fill="#446688">系数</text>
  <text x="475" y="80" text-anchor="middle" font-size="10" fill="#d6a040">幂次</text>

  <!-- ===== poly1 row ===== -->
  <text x="40" y="124" font-size="12" fill="#446688" font-weight="bold">poly1</text>
  <text x="40" y="138" font-size="10" fill="#888">p1→</text>
  <g filter="url(#rough2)">
    <!-- node (2,2) -->
    <rect x="120" y="108" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="162" y="108" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <!-- node (4,1) -->
    <rect x="258" y="108" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="300" y="108" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <!-- node (3,0) -->
    <rect x="396" y="108" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="438" y="108" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <text x="141" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="183" y="131" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">2</text>
  <text x="279" y="131" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="321" y="131" text-anchor="middle" font-size="13" fill="#7a5415">1</text>
  <text x="417" y="131" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="459" y="131" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <g filter="url(#rough2)">
    <path d="M 204 125 L 256 125" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
    <path d="M 342 125 L 394 125" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>
  <text x="492" y="131" font-size="11" fill="#446688">= 2x²+4x+3</text>

  <!-- ===== poly2 row ===== -->
  <text x="40" y="194" font-size="12" fill="#4a7a3a" font-weight="bold">poly2</text>
  <text x="40" y="208" font-size="10" fill="#888">p2→</text>
  <g filter="url(#rough2)">
    <rect x="120" y="178" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="162" y="178" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="258" y="178" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="300" y="178" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="396" y="178" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="438" y="178" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <text x="141" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="183" y="201" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">2</text>
  <text x="279" y="201" text-anchor="middle" font-size="13" fill="#333">-4</text>
  <text x="321" y="201" text-anchor="middle" font-size="13" fill="#7a5415">1</text>
  <text x="417" y="201" text-anchor="middle" font-size="13" fill="#333">-1</text>
  <text x="459" y="201" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <g filter="url(#rough2)">
    <path d="M 204 195 L 256 195" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
    <path d="M 342 195 L 394 195" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>
  <text x="492" y="201" font-size="11" fill="#4a7a3a">= 3x²-4x-1</text>

  <!-- highlight equal power (first nodes) -->
  <g filter="url(#rough2)">
    <path d="M 183 142 L 183 176" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  </g>
  <text x="196" y="162" font-size="10.5" fill="#b85450" font-weight="bold">幂次同=2</text>

  <!-- ===== decision box: 3 cases ===== -->
  <text x="290" y="244" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每次比较 p1.power 与 p2.power，三选一：</text>
  <g filter="url(#rough2)">
    <rect x="30" y="256" width="170" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <rect x="205" y="256" width="170" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <rect x="380" y="256" width="170" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8"/>
  </g>
  <text x="115" y="278" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">p1.pow &gt; p2.pow</text>
  <text x="115" y="298" text-anchor="middle" font-size="10.5" fill="#444">取 p1 项接入结果</text>
  <text x="115" y="314" text-anchor="middle" font-size="10.5" fill="#888">p1 = p1.next</text>

  <text x="290" y="278" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">p1.pow == p2.pow</text>
  <text x="290" y="298" text-anchor="middle" font-size="10.5" fill="#444">系数相加 sum=c1+c2</text>
  <text x="290" y="314" text-anchor="middle" font-size="10.5" fill="#888">sum≠0 才接入；两指针同走</text>

  <text x="465" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p2.pow &gt; p1.pow</text>
  <text x="465" y="298" text-anchor="middle" font-size="10.5" fill="#444">取 p2 项接入结果</text>
  <text x="465" y="314" text-anchor="middle" font-size="10.5" fill="#888">p2 = p2.next</text>

  <!-- ===== result row ===== -->
  <text x="40" y="364" font-size="12" fill="#2e6e2e" font-weight="bold">结果</text>
  <g filter="url(#rough2)">
    <rect x="120" y="348" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="162" y="348" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="258" y="348" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="300" y="348" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
  </g>
  <text x="141" y="371" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="183" y="371" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="279" y="371" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="321" y="371" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">0</text>
  <g filter="url(#rough2)">
    <path d="M 204 365 L 256 365" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>
  <text x="360" y="371" font-size="11" fill="#2e6e2e">= 5x²+2  （-4x 与 +4x 抵消，丢弃）</text>

  <g filter="url(#rough2)">
    <rect x="30" y="402" width="520" height="30" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3" rx="6"/>
  </g>
  <text x="290" y="421" text-anchor="middle" font-size="11" fill="#444">与 21 题「合并两个有序链表」同模板，唯一区别：键相等时不是任取一个，而是合并系数（可能为 0 需丢弃）</text>
</svg>
