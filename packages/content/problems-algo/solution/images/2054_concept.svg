<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：排序 + 前缀最大值 + 二分找兼容前置事件</text>

  <!-- ===== Section 1: Timeline ===== -->
  <text x="40" y="54" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">① 按 endTime 排序后的活动时间线</text>

  <!-- Time axis -->
  <line x1="120" y1="160" x2="440" y2="160" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="176" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="170" y="176" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="220" y="176" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="270" y="176" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="320" y="176" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="370" y="176" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
  <text x="100" y="164" font-size="9.5" fill="#aaa" filter="url(#rough2)">时间→</text>

  <!-- Event A [1,3] v=2 -->
  <rect x="120" y="68" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="85" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">A [1-3] v=2</text>

  <!-- Event B [2,4] v=3 -->
  <rect x="170" y="100" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="117" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B [2-4] v=3</text>

  <!-- Event C [4,5] v=2 (highlighted) -->
  <rect x="270" y="132" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="149" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C [4-5] v=2</text>

  <!-- ===== Section 2: Prefix Max ===== -->
  <text x="40" y="206" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">② 前缀最大值 prefMax[i] = max(val[0..i])</text>

  <!-- Arrows from events to prefMax -->
  <path d="M 170 94 L 170 196" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 220 126 L 220 196" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 295 158 L 295 196" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>

  <!-- prefMax boxes -->
  <rect x="140" y="218" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">prefMax=2</text>

  <rect x="190" y="218" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">prefMax=3</text>

  <rect x="265" y="218" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">prefMax=3</text>

  <text x="350" y="236" font-size="10" fill="#888" filter="url(#rough2)">← 逐位置取 running max</text>

  <!-- ===== Section 3: Binary Search Pairing ===== -->
  <text x="40" y="272" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">③ 对活动 C（start=4），二分找最后一个 endTime &lt; 4 的活动</text>

  <!-- Dashed vertical line at start of C (time=4, x=270) -->
  <path d="M 270 132 L 270 300" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="278" y="292" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">start=4</text>

  <!-- Arrow from C's start line back to A (endTime=3 < 4) -->
  <path d="M 270 300 Q 200 310 170 94" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="195" y="320" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">二分 → A (endTime=3 &lt; 4) ✓</text>

  <!-- Highlight A's end -->
  <rect x="210" y="66" width="14" height="28" fill="none" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="217" y="62" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">end=3</text>

  <!-- Formula box -->
  <rect x="60" y="340" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="362" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">candidate = val[C] + prefMax[A] = 2 + 2 = 4</text>
  <text x="290" y="380" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">遍历所有活动取 max → ans = max(2, 3, 4) = 4</text>

  <!-- Key insight box -->
  <rect x="60" y="404" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="424" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">关键洞察：</text>
  <text x="80" y="440" font-size="10.5" fill="#555" filter="url(#rough2)">排序后 endTime 有序 → 二分 O(log n) 找兼容前置；prefMax 让"前置最优"O(1) 取得</text>
</svg>
