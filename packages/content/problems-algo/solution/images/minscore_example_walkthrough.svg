<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例1演算：n=4, roads=[[1,2,9],[2,3,6],[2,4,5],[1,4,7]]</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">BFS 从1出发，4 个城市全部可达 → 连通块边 {9,6,5,7}，最小=5</text>

  <!-- ===== Graph ===== -->
  <!-- edges -->
  <!-- 1-2 (9) -->
  <path d="M 110 120 L 200 90" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="138" y="92" width="22" height="16" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="149" y="104" text-anchor="middle" font-size="11" fill="#666">9</text>

  <!-- 1-4 (7) -->
  <path d="M 110 140 L 200 200" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="142" y="162" width="22" height="16" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="153" y="174" text-anchor="middle" font-size="11" fill="#666">7</text>

  <!-- 2-4 (5) MIN red -->
  <path d="M 220 95 L 220 195" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <rect x="227" y="138" width="22" height="16" fill="#fff8e1" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="238" y="150" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">5</text>

  <!-- 2-3 (6) -->
  <path d="M 232 88 L 312 130" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="265" y="100" width="22" height="16" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="276" y="112" text-anchor="middle" font-size="11" fill="#666">6</text>

  <!-- nodes -->
  <ellipse cx="100" cy="130" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <ellipse cx="216" cy="80" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="216" y="85" text-anchor="middle" font-size="13" fill="#333">2</text>
  <ellipse cx="328" cy="138" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="143" text-anchor="middle" font-size="13" fill="#333">3</text>
  <ellipse cx="216" cy="210" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="216" y="215" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4=n</text>

  <!-- BFS order arrow on left -->
  <text x="40" y="100" font-size="10.5" fill="#4a7a3a" font-weight="bold">BFS</text>
  <text x="40" y="116" font-size="9.5" fill="#888">访问序</text>

  <!-- ===== Steps table (right side) ===== -->
  <rect x="360" y="60" width="150" height="170" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="76" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">BFS 扩展过程</text>
  <line x1="370" y1="82" x2="500" y2="82" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="368" y="98" font-size="9.5" fill="#555">队首→ 出队</text>
  <text x="470" y="98" text-anchor="end" font-size="9.5" fill="#555">vis 新增</text>
  <text x="368" y="114" font-size="9.5" fill="#333">① 出 1</text>
  <text x="470" y="114" text-anchor="end" font-size="9.5" fill="#333">2,4</text>
  <text x="368" y="130" font-size="9.5" fill="#333">② 出 2</text>
  <text x="470" y="130" text-anchor="end" font-size="9.5" fill="#333">3</text>
  <text x="368" y="146" font-size="9.5" fill="#333">③ 出 4</text>
  <text x="470" y="146" text-anchor="end" font-size="9.5" fill="#888">—</text>
  <text x="368" y="162" font-size="9.5" fill="#333">④ 出 3</text>
  <text x="470" y="162" text-anchor="end" font-size="9.5" fill="#888">—</text>
  <text x="368" y="182" font-size="9.5" fill="#4a7a3a" font-weight="bold">可达集 = {1,2,3,4}</text>
  <text x="368" y="200" font-size="9.5" fill="#4a7a3a" font-weight="bold">块内边权 = {9,7,5,6}</text>
  <text x="368" y="218" font-size="10" fill="#b85450" font-weight="bold">min = 5 ✓</text>

  <!-- ===== Answer box ===== -->
  <rect x="40" y="248" width="470" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="270" font-size="11.5" fill="#333" font-weight="bold">取最小边 e*=2→4 (权5)，构造路径：1 →2 →4</text>
  <text x="60" y="288" font-size="10.5" fill="#555">分数 = min(9, 5) = 5；其它边(权6/7)都 ≥ 5，纳入不会更优</text>
  <text x="60" y="306" font-size="10.5" fill="#555">对照暴力枚举路径：1→4 分数7；1→2→4 分数5；不可能 &lt; 5（5 已是块内最小边）</text>
  <text x="60" y="328" font-size="11" fill="#b85450" font-weight="bold">答案 = 5</text>
</svg>
