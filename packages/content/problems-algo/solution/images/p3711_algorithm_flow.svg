<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：每笔交易的三段判定——白拿 / 接受 / 反悔 / 跳过</text>

  <rect x="155" y="28" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="230" y="44" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始：bal=0，cnt=0，堆空</text>

  <path d="M 230 52 L 230 62" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="64" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 取下一笔交易 t（从左到右）</text>

  <path d="M 230 90 L 230 100" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <path d="M 230 100 L 330 138 L 230 176 L 130 138 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t ≥ 0 ?</text>

  <text x="348" y="130" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 330 138 L 376 138" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="376" y="116" width="169" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="133" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">白拿：bal += t，cnt++</text>
  <text x="460" y="151" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">非负交易永不亏，不入堆</text>

  <text x="242" y="194" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 230 176 L 230 206" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <path d="M 230 206 L 330 244 L 230 282 L 130 244 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="249" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bal + t ≥ 0 ?</text>

  <text x="348" y="236" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 330 244 L 376 244" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="376" y="222" width="169" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">接受：bal += t，cnt++</text>
  <text x="460" y="257" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">t 的绝对值压入大根堆</text>

  <text x="242" y="300" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 230 282 L 230 312" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 3 -->
  <path d="M 230 312 L 330 350 L 230 388 L 130 350 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="345" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">堆非空 且</text>
  <text x="230" y="361" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">堆顶绝对值 &gt; t 绝对值 ?</text>

  <text x="348" y="342" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 330 350 L 376 350" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="376" y="328" width="169" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="345" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">反悔换入：bal 回升差值</text>
  <text x="460" y="363" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">堆顶换成 t，cnt 不变</text>

  <text x="242" y="400" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 230 388 L 230 410" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="412" width="200" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="230" y="429" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">跳过 t（余额、笔数都不动）</text>

  <path d="M 230 438 L 230 450" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="452" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="230" y="470" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">扫完所有交易 → return cnt</text>

  <!-- loop-back bus -->
  <path d="M 545 138 L 553 138" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 545 244 L 553 244" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 545 350 L 553 350" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 553 350 L 553 77 L 354 77" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="455" y="70" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">处理完 → 下一笔 t</text>

  <text x="16" y="492" font-size="10" fill="#999" filter="url(#rough2)">⚠️ 只有「接受」分支的负交易入堆；反悔分支笔数不变、只抬余额，为后续交易腾出空间</text>
</svg>
