<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建 LPS 表 → 取最小周期 → 判整除</text>

  <rect x="170" y="50" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入：字符串 s（长度 n）</text>

  <path d="M270 90 L270 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="114" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="136" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">① 构建 LPS 表</text>
  <text x="270" y="154" text-anchor="middle" font-size="11" fill="#666">对 s 自身跑 KMP 的 lps 构建，O(n)</text>

  <path d="M270 166 L270 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="190" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">② 取最小周期 p = n − lps[n−1]</text>
  <text x="270" y="230" text-anchor="middle" font-size="11" fill="#666">LPS 末项即整个串的最长相同前后缀</text>

  <path d="M270 242 L270 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,266 380,300 270,334 160,300" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">lps[n−1] &gt; 0</text>
  <text x="270" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">且 n % p == 0 ?</text>

  <text x="120" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="420" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <path d="M210 300 L100 300 L100 350" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M330 300 L440 300 L440 350" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="354" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="376" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return true</text>

  <rect x="380" y="354" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="376" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return false</text>

  <text x="270" y="396" text-anchor="middle" font-size="10" fill="#888">两个条件缺一不可：有相同前后缀 + 周期整除串长</text>
</svg>
