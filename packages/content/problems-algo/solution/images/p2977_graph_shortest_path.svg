<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">转换图：字符串是点，规则是有向边，链成本 = 最短路</text>

  <text x="145" y="62" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">示例 2：fgh ⇝ ghh</text>

  <rect x="60" y="86" width="62" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="91" y="106" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">fgh</text>
  <rect x="176" y="128" width="62" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="207" y="148" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">thh</text>
  <rect x="60" y="172" width="62" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="91" y="192" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ghh</text>

  <path d="M 122 108 C 152 116, 158 124, 174 132" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="154" y="112" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">3</text>
  <path d="M 174 156 C 158 166, 152 172, 126 180" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="154" y="184" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">5</text>

  <text x="145" y="228" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">dist(fgh→ghh) = 3+5 = 8</text>
  <text x="145" y="246" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">区间 [5,7] 的链成本</text>

  <text x="385" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：c ⇝ b（绕路更便宜）</text>

  <rect x="292" y="86" width="40" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="312" y="105" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="438" y="86" width="40" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="105" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="365" y="172" width="40" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="385" y="191" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>

  <path d="M 336 98 L 434 98" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="385" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <path d="M 448 116 C 440 138, 420 158, 400 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="440" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <path d="M 314 116 C 322 138, 342 158, 362 170" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="322" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">5 直连</text>

  <text x="385" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">dist(c→b) = min(5, 1+2) = 3</text>
  <text x="385" y="246" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">贪心挑最便宜的直连规则会翻车</text>

  <g font-size="11" fill="#334">
    <rect x="48" y="272" width="66" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="81" y="288" text-anchor="middle" fill="#446688" font-weight="bold" filter="url(#rough2)">dist</text>
    <rect x="114" y="272" width="66" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="147" y="288" text-anchor="middle" filter="url(#rough2)">fgh</text>
    <rect x="180" y="272" width="66" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="213" y="288" text-anchor="middle" filter="url(#rough2)">thh</text>
    <rect x="246" y="272" width="66" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="279" y="288" text-anchor="middle" filter="url(#rough2)">ghh</text>

    <rect x="48" y="296" width="66" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="81" y="312" text-anchor="middle" filter="url(#rough2)">fgh</text>
    <rect x="114" y="296" width="66" height="24" fill="#e6f4ea" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="147" y="312" text-anchor="middle" filter="url(#rough2)">0</text>
    <rect x="180" y="296" width="66" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="213" y="312" text-anchor="middle" filter="url(#rough2)">3</text>
    <rect x="246" y="296" width="66" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/><text x="279" y="312" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>

    <rect x="48" y="320" width="66" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="81" y="336" text-anchor="middle" filter="url(#rough2)">thh</text>
    <rect x="114" y="320" width="66" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/><text x="147" y="336" text-anchor="middle" fill="#b85450" filter="url(#rough2)">∞</text>
    <rect x="180" y="320" width="66" height="24" fill="#e6f4ea" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="213" y="336" text-anchor="middle" filter="url(#rough2)">0</text>
    <rect x="246" y="320" width="66" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="279" y="336" text-anchor="middle" filter="url(#rough2)">5</text>

    <rect x="48" y="344" width="66" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="81" y="360" text-anchor="middle" filter="url(#rough2)">ghh</text>
    <rect x="114" y="344" width="66" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/><text x="147" y="360" text-anchor="middle" fill="#b85450" filter="url(#rough2)">∞</text>
    <rect x="180" y="344" width="66" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/><text x="213" y="360" text-anchor="middle" fill="#b85450" filter="url(#rough2)">∞</text>
    <rect x="246" y="344" width="66" height="24" fill="#e6f4ea" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="279" y="360" text-anchor="middle" filter="url(#rough2)">0</text>
  </g>

  <rect x="330" y="296" width="152" height="72" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="406" y="316" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">W ≤ 2m ≤ 200 个点</text>
  <text x="406" y="334" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">重边（重复规则）取 min</text>
  <text x="406" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">Floyd O(W³) 或 W 次 Dijkstra</text>
</svg>
