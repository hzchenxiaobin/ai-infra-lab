<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：等值游程 + 长度对 3 取模</text>

  <text x="40" y="58" font-size="12.5" fill="#446688" font-weight="bold">步骤① 把 s 切成「等值游程」(同字符连续段)</text>

  <text x="40" y="80" font-size="11" fill="#666">s = "00011111222"</text>

  <rect x="40" y="90" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="70" y="90" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="100" y="90" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <rect x="130" y="90" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="90" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="190" y="90" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="220" y="90" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="250" y="90" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <rect x="280" y="90" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="310" y="90" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="340" y="90" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <path d="M 55 120 L 55 132" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 175 120 L 175 132" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 325 120 L 325 132" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="136" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="152" text-anchor="middle" font-size="11" fill="#333">"000"  len=3</text>
  <rect x="135" y="136" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="152" text-anchor="middle" font-size="11" fill="#333">"11111"  len=5</text>
  <rect x="290" y="136" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="335" y="152" text-anchor="middle" font-size="11" fill="#333">"222"  len=3</text>

  <text x="40" y="186" font-size="12.5" fill="#446688" font-weight="bold">步骤② 每段长度对 3 取模 —— 三种情况决定成败</text>

  <rect x="40" y="198" width="150" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="218" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">L % 3 == 0</text>
  <text x="115" y="238" text-anchor="middle" font-size="10.5" fill="#444">全用长度 3 拼成</text>
  <text x="115" y="254" text-anchor="middle" font-size="10.5" fill="#444">不消耗长度 2</text>
  <text x="115" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a">例 3 → "000"</text>

  <rect x="205" y="198" width="150" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">L % 3 == 2</text>
  <text x="280" y="238" text-anchor="middle" font-size="10.5" fill="#444">必须配 1 个长度 2</text>
  <text x="280" y="254" text-anchor="middle" font-size="10.5" fill="#444">其余补长度 3</text>
  <text x="280" y="270" text-anchor="middle" font-size="10" fill="#d6a040">例 5 → "11"+"111"</text>

  <rect x="370" y="198" width="150" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="218" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">L % 3 == 1</text>
  <text x="445" y="238" text-anchor="middle" font-size="10.5" fill="#444">无法拼成！</text>
  <text x="445" y="254" text-anchor="middle" font-size="10.5" fill="#444">余 1 无解 → false</text>
  <text x="445" y="270" text-anchor="middle" font-size="10" fill="#b85450">例 1 → 单个 "0"</text>

  <text x="40" y="304" font-size="12.5" fill="#446688" font-weight="bold">步骤③ 全局约束：恰好 1 个长度 2</text>

  <rect x="40" y="316" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="11.5" fill="#444">→ 恰好 1 段 L%3==2  且  没有任何段 L%3==1  ⇒ true</text>

  <rect x="40" y="356" width="232" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="376" text-anchor="middle" font-size="11" fill="#b85450">出现 L%3==1 段 ⇒ false</text>

  <rect x="288" y="356" width="232" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="404" y="376" text-anchor="middle" font-size="11" fill="#b85450">L%3==2 段 ≠ 1 个 ⇒ false</text>
</svg>
