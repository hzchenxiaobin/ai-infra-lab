<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：CTE 流水线——双连接 → 全集标记 → 过滤编号 → 岛切分 → MAX</text>

  <!-- ① Joined -->
  <rect x="24" y="52" width="244" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="69" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① Joined：维表双连接</text>
  <text x="36" y="85" font-size="10" fill="#333" filter="url(#rough2)">Passes JOIN Teams t1（pass_from）</text>
  <text x="36" y="100" font-size="10" fill="#333" filter="url(#rough2)">       JOIN Teams t2（pass_to）</text>
  <text x="36" y="115" font-size="10" fill="#666" filter="url(#rough2)">→ (time_stamp, from_team, to_team)</text>

  <!-- ② Marked -->
  <rect x="24" y="142" width="244" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="36" y="159" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② Marked：全集标记 + 行号 ★</text>
  <text x="36" y="175" font-size="10" fill="#333" filter="url(#rough2)">streak_team = 同队 ? 传球方 : NULL</text>
  <text x="36" y="190" font-size="10" fill="#333" filter="url(#rough2)">rn_all = ROW_NUMBER()</text>
  <text x="36" y="205" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">        OVER (ORDER BY ts)【全集！】</text>

  <!-- ③ Intra -->
  <rect x="24" y="232" width="244" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="249" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">③ Intra：过滤 + 队内行号</text>
  <text x="36" y="265" font-size="10" fill="#333" filter="url(#rough2)">WHERE streak_team IS NOT NULL</text>
  <text x="36" y="280" font-size="10" fill="#333" filter="url(#rough2)">rn_team = ROW_NUMBER()</text>
  <text x="36" y="295" font-size="10" fill="#333" filter="url(#rough2)">  OVER (PARTITION BY 队 ORDER BY rn_all)</text>

  <!-- ④ Streaks -->
  <rect x="292" y="52" width="244" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="69" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ Streaks：岛切分计数</text>
  <text x="304" y="85" font-size="10" fill="#333" filter="url(#rough2)">grp = rn_all − rn_team</text>
  <text x="304" y="100" font-size="10" fill="#333" filter="url(#rough2)">GROUP BY team_name, grp</text>
  <text x="304" y="115" font-size="10" fill="#666" filter="url(#rough2)">COUNT(*) = 每段连击长度</text>

  <!-- ⑤ Max -->
  <rect x="292" y="142" width="244" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="159" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 每队最长连击</text>
  <text x="304" y="175" font-size="10" fill="#333" filter="url(#rough2)">GROUP BY team_name</text>
  <text x="304" y="190" font-size="10" fill="#333" filter="url(#rough2)">MAX(streak_len) AS pass_streak</text>
  <text x="304" y="205" font-size="10" fill="#666" filter="url(#rough2)">例：Chelsea 4，Arsenal 3</text>

  <!-- ⑥ Order -->
  <rect x="292" y="232" width="244" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="249" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">⑥ 输出排序</text>
  <text x="304" y="265" font-size="10" fill="#333" filter="url(#rough2)">ORDER BY pass_streak DESC,</text>
  <text x="304" y="280" font-size="10" fill="#333" filter="url(#rough2)">         team_name ASC</text>
  <text x="304" y="295" font-size="10" fill="#666" filter="url(#rough2)">→ Chelsea 4 / Arsenal 3</text>

  <!-- arrows -->
  <path d="M 146 122 L 146 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 146 212 L 146 230" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 414 122 L 414 140" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 414 212 L 414 230" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 270 266 C 284 266 278 88 290 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- trap note -->
  <rect x="24" y="322" width="512" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="346" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 最常见翻车：把 rn_all 写在 WHERE 过滤之后——被截获传球不占行号</text>
  <text x="40" y="368" font-size="11.5" fill="#b85450" filter="url(#rough2)">隔着一次截获的两段成功传球 grp 不变，会被误并成一长段连击！</text>
</svg>
