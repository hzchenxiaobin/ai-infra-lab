<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="510" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：重边压缩 → 枚举开放 mask → 受限 Floyd → 距离检查</text>

  <!-- step 1 -->
  <rect x="125" y="44" width="250" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="67" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">① 预处理：g[u][v] ← min(g[u][v], w)</text>

  <path d="M 250 82 L 250 96" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="125" y="100" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="122" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 枚举开放集合 mask ∈ [0, 2ⁿ)</text>

  <path d="M 250 136 L 250 150" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="250,152 355,180 250,208 145,180" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">mask 已全部枚举完？</text>

  <path d="M 355 180 L 398 180" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="366" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="402" y="160" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="184" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 250 208 L 250 230" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="259" y="224" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- diamond 2 -->
  <polygon points="250,232 355,260 250,288 145,260" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="264" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">开放点 ≤ 1 个？</text>

  <path d="M 355 260 L 398 260" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="366" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="402" y="240" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="264" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <path d="M 250 288 L 250 310" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="259" y="306" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- step 3 -->
  <rect x="125" y="312" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="334" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 初始化 d：开放点对取 g，其余置 ∞</text>

  <path d="M 250 348 L 250 362" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="125" y="364" width="250" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="382" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 受限 Floyd：k, i, j 仅枚举开放点</text>
  <text x="250" y="399" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">d[i][j] ← min(d[i][j], d[i][k] + d[k][j])</text>

  <path d="M 250 408 L 250 422" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 3 -->
  <polygon points="250,424 365,452 250,480 135,452" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="448" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">所有开放点对</text>
  <text x="250" y="464" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">d[i][j] ≤ maxDistance ?</text>

  <path d="M 365 452 L 398 452" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="444" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="402" y="432" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="456" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <!-- loop rail -->
  <path d="M 250 480 L 250 496 L 500 496" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="262" y="494" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 488 260 L 500 260" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 488 452 L 500 452" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 500 496 L 500 118 L 378 118" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="496" y="110" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">汇回 ②：取下一个 mask</text>
</svg>
