<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">示例演算：nums = [3,6,2,7,1]，k = 6 → 4 个子数组</text>
  <text x="270" y="40" text-anchor="middle" font-size="10" fill="#888">每行固定起点 i，向右扩展 j 记录前缀 lcm；绿=命中 k，红=非因子终止，蓝=l&lt;k 继续</text>

  <!-- ====== Header row ====== -->
  <rect x="30" y="50" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <rect x="74" y="50" width="320" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">前缀 lcm 序列（从 j=i 起逐个扩展）</text>
  <rect x="398" y="50" width="112" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">命中（l=6）</text>

  <!-- row height 30, start y=82 -->
  <!-- ====== Row i=0: 3 -> 6 -> 6 ; break(7) ; hits [3,6],[3,6,2] ====== -->
  <text x="50" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="110" y="84" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <line x1="152" y1="97" x2="166" y2="97" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="84" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <line x1="212" y1="97" x2="226" y2="97" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="84" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="282" y="102" font-size="9.5" fill="#b85450" font-weight="bold">7∤6 终止</text>
  <rect x="398" y="84" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[3,6],[3,6,2]</text>

  <!-- ====== Row i=1: 6 -> 6 ; break(7) ; hits [6],[6,2] ====== -->
  <text x="50" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="116" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <line x1="152" y1="129" x2="166" y2="129" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="116" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="222" y="134" font-size="9.5" fill="#b85450" font-weight="bold">7∤6 终止</text>
  <rect x="398" y="116" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[6],[6,2]</text>

  <!-- ====== Row i=2: 2 ; break(7) ; — ====== -->
  <text x="50" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="110" y="148" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="160" y="166" font-size="9.5" fill="#b85450" font-weight="bold">7∤6 终止</text>
  <rect x="398" y="148" width="112" height="26" fill="#f4f7fb" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="454" y="166" text-anchor="middle" font-size="10.5" fill="#999">—</text>

  <!-- ====== Row i=3: 7 ; immediately break ; — ====== -->
  <text x="50" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="110" y="180" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7</text>
  <text x="160" y="198" font-size="9.5" fill="#b85450" font-weight="bold">7∤6 立即终止</text>
  <rect x="398" y="180" width="112" height="26" fill="#f4f7fb" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="454" y="198" text-anchor="middle" font-size="10.5" fill="#999">—</text>

  <!-- ====== Row i=4: 1 ; end ; — ====== -->
  <text x="50" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="110" y="212" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="230" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="160" y="230" font-size="9.5" fill="#446688" font-weight="bold">l=1&lt;k，到末尾结束</text>
  <rect x="398" y="212" width="112" height="26" fill="#f4f7fb" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="454" y="230" text-anchor="middle" font-size="10.5" fill="#999">—</text>

  <!-- ====== Total row ====== -->
  <rect x="30" y="258" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="282" font-size="11.5" fill="#d6a040" font-weight="bold">合计</text>
  <text x="100" y="282" font-size="11" fill="#333" font-weight="bold">4 个子数组：</text>
  <rect x="186" y="268" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="283" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[3,6]</text>
  <rect x="248" y="268" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[3,6,2]</text>
  <rect x="318" y="268" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="283" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[6]</text>
  <rect x="368" y="268" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="283" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[6,2]</text>
  <text x="430" y="283" font-size="11" fill="#b85450" font-weight="bold">= ans = 4</text>
  <text x="270" y="307" text-anchor="middle" font-size="9.5" fill="#888">注：i=3 首元素 7 即非因子，进循环一步就终止；命中后勿停，续加 k 的因子仍 = k</text>
</svg>
