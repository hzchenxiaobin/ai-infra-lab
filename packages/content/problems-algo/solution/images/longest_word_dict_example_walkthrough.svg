<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：words = ["a","ap","app","appl","apple","apply","banana"]
  </text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    排序后顺序遍历，built 初始含 ""
  </text>

  <text x="20" y="78" font-size="11" fill="#446688" filter="url(#rough2)">word</text>
  <text x="120" y="78" font-size="11" fill="#446688" filter="url(#rough2)">word[:-1]</text>
  <text x="230" y="78" font-size="11" fill="#446688" filter="url(#rough2)">∈built?</text>
  <text x="320" y="78" font-size="11" fill="#446688" filter="url(#rough2)">built 加入</text>
  <text x="430" y="78" font-size="11" fill="#446688" filter="url(#rough2)">result</text>
  <text x="520" y="78" font-size="11" fill="#446688" filter="url(#rough2)">说明</text>

  <line x1="15" y1="86" x2="585" y2="86" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="20" y="106" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="120" y="106" font-size="11" fill="#333" filter="url(#rough2)">""</text>
  <text x="230" y="106" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="320" y="106" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="430" y="106" font-size="11" fill="#d6a040" filter="url(#rough2)">a</text>
  <text x="520" y="106" font-size="10" fill="#888" filter="url(#rough2)">空串为基础</text>

  <line x1="15" y1="116" x2="585" y2="116" stroke="#eeeeee" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="20" y="136" font-size="11" fill="#333" filter="url(#rough2)">ap</text>
  <text x="120" y="136" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="230" y="136" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="320" y="136" font-size="11" fill="#333" filter="url(#rough2)">ap</text>
  <text x="430" y="136" font-size="11" fill="#d6a040" filter="url(#rough2)">ap</text>
  <text x="520" y="136" font-size="10" fill="#888" filter="url(#rough2)">更长，更新</text>

  <line x1="15" y1="146" x2="585" y2="146" stroke="#eeeeee" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="20" y="166" font-size="11" fill="#333" filter="url(#rough2)">app</text>
  <text x="120" y="166" font-size="11" fill="#333" filter="url(#rough2)">ap</text>
  <text x="230" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="320" y="166" font-size="11" fill="#333" filter="url(#rough2)">app</text>
  <text x="430" y="166" font-size="11" fill="#d6a040" filter="url(#rough2)">app</text>
  <text x="520" y="166" font-size="10" fill="#888" filter="url(#rough2)">更长，更新</text>

  <line x1="15" y1="176" x2="585" y2="176" stroke="#eeeeee" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="20" y="196" font-size="11" fill="#333" filter="url(#rough2)">appl</text>
  <text x="120" y="196" font-size="11" fill="#333" filter="url(#rough2)">app</text>
  <text x="230" y="196" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="320" y="196" font-size="11" fill="#333" filter="url(#rough2)">appl</text>
  <text x="430" y="196" font-size="11" fill="#d6a040" filter="url(#rough2)">appl</text>
  <text x="520" y="196" font-size="10" fill="#888" filter="url(#rough2)">更长，更新</text>

  <line x1="15" y1="206" x2="585" y2="206" stroke="#eeeeee" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="20" y="226" font-size="11" fill="#333" filter="url(#rough2)">apple</text>
  <text x="120" y="226" font-size="11" fill="#333" filter="url(#rough2)">appl</text>
  <text x="230" y="226" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="320" y="226" font-size="11" fill="#333" filter="url(#rough2)">apple</text>
  <text x="430" y="226" font-size="11" fill="#d6a040" filter="url(#rough2)">apple</text>
  <text x="520" y="226" font-size="10" fill="#888" filter="url(#rough2)">更长，更新</text>

  <line x1="15" y1="236" x2="585" y2="236" stroke="#eeeeee" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="20" y="256" font-size="11" fill="#333" filter="url(#rough2)">apply</text>
  <text x="120" y="256" font-size="11" fill="#333" filter="url(#rough2)">appl</text>
  <text x="230" y="256" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="320" y="256" font-size="11" fill="#333" filter="url(#rough2)">apply</text>
  <text x="430" y="256" font-size="11" fill="#d6a040" filter="url(#rough2)">apple</text>
  <text x="520" y="256" font-size="10" fill="#b85450" filter="url(#rough2)">等长不更新</text>

  <line x1="15" y1="266" x2="585" y2="266" stroke="#eeeeee" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="20" y="286" font-size="11" fill="#333" filter="url(#rough2)">banana</text>
  <text x="120" y="286" font-size="11" fill="#333" filter="url(#rough2)">banan</text>
  <text x="230" y="286" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="320" y="286" font-size="11" fill="#aaaaaa" filter="url(#rough2)">—</text>
  <text x="430" y="286" font-size="11" fill="#d6a040" filter="url(#rough2)">apple</text>
  <text x="520" y="286" font-size="10" fill="#888" filter="url(#rough2)">前缀缺失</text>

  <line x1="15" y1="296" x2="585" y2="296" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>

  <rect x="120" y="320" width="360" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="343" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">关键：等长时用「严格大于」&gt; 判定</text>
  <text x="300" y="362" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">apple 先于 apply 被处理（字典序更小）</text>
  <text x="300" y="380" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">len(apply) == len(apple)，不替换 → 保留 apple</text>

  <rect x="120" y="410" width="360" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="432" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">最终结果：apple</text>
  <text x="300" y="450" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">字典序排序保证同长候选中小者先到</text>

  <text x="300" y="490" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    注：排序后 "ap" 在 "app" 之前——前缀必先于原词出现
  </text>
  <text x="300" y="508" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    （若 A 是 B 的前缀，则 A &lt; B 字典序）
  </text>
</svg>
