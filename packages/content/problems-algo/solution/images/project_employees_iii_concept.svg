<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：JOIN 取经验值 → 求每组最大 → 再 JOIN 取员工</text>

  <!-- Step 1: JOIN Project + Employee -->
  <text x="30" y="56" font-size="11.5" fill="#888">① JOIN：Project ⟕ Employee，补上每人的 experience_years</text>
  <rect x="30" y="64" width="540" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">SELECT p.project_id, e.employee_id, e.experience_years</text>
  <text x="300" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">FROM Project p JOIN Employee e ON p.employee_id = e.employee_id</text>
  <text x="300" y="106" text-anchor="middle" font-size="9" fill="#aaa"></text>
  <text x="300" y="108" text-anchor="middle" font-size="10.5" fill="#555">产出 (project_id, employee_id, experience_years) 三元组</text>

  <path d="M 300 116 L 300 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 子查询求 MAX -->
  <text x="30" y="150" font-size="11.5" fill="#888">② 子查询：GROUP BY project_id，求 MAX(experience_years) 得每个项目最高经验</text>
  <rect x="40" y="158" width="520" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">SELECT project_id, MAX(experience_years) AS max_exp</text>
  <text x="300" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">FROM (JOIN 结果) GROUP BY project_id</text>
  <text x="300" y="210" text-anchor="middle" font-size="10.5" fill="#555">产出 (project_id, max_exp) 二元组集合 m</text>

  <path d="M 300 210 L 300 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: JOIN 回取 employee_id -->
  <text x="30" y="244" font-size="11.5" fill="#888">③ JOIN 回：ON project_id 相同 AND experience_years = max_exp</text>
  <rect x="40" y="252" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="274" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">JOIN m ON t.project_id = m.project_id</text>
  <text x="300" y="290" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">AND t.experience_years = m.max_exp</text>
  <text x="300" y="304" text-anchor="middle" font-size="10.5" fill="#555">并列最高经验全部命中 → 取该项目经验最丰富的全部员工</text>

  <path d="M 300 304 L 300 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="319" font-size="10" fill="#888">输出</text>

  <!-- Result -->
  <rect x="40" y="328" width="520" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="350" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">SELECT project_id, employee_id</text>
  <text x="300" y="368" text-anchor="middle" font-size="10.5" fill="#555">结果 = 每个项目经验最高的员工（并列全保留）</text>

  <!-- Key insight box -->
  <rect x="30" y="392" width="540" height="66" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="412" font-size="11" fill="#555" font-weight="bold">💡 为什么要两次 JOIN？</text>
  <text x="50" y="428" font-size="10.5" fill="#888">第一次 JOIN 把 experience_years 补到 Project 表上（原表只有 id，没有经验列）。</text>
  <text x="50" y="442" font-size="10.5" fill="#888">子查询 MAX 只产出 (project_id, max_exp)，丢失了 employee_id。</text>
  <text x="50" y="456" font-size="10.5" fill="#888">第二次 JOIN 按 (project_id, experience_years) 双键回取，把「谁有最高经验」拉回来。</text>
</svg>
