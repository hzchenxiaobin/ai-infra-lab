<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：power=4, damage=[1,2,3,4], health=[4,5,6,8]</text>
  <text x="260" y="40" text-anchor="middle" font-size="11.5" fill="#7a6a50" filter="url(#rough2)">t=[1,2,2,2]，比值 d/t=[1, 1, 1.5, 2] → 击杀顺序：敌3 → 敌2 → 敌0 → 敌1</text>

  <!-- header -->
  <rect x="45" y="56" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="81" y="72" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">击杀对象</text>
  <rect x="117" y="56" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="141" y="72" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="165" y="56" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="189" y="72" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">t</text>
  <rect x="213" y="56" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="72" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">每秒存活伤害（后缀和）</text>
  <rect x="383" y="56" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="429" y="72" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">本段伤害</text>

  <!-- row 1: 敌3 -->
  <rect x="45" y="84" width="72" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="81" y="101" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">敌 3</text>
  <rect x="117" y="84" width="48" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="141" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="165" y="84" width="48" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="189" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="213" y="84" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="101" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1+2+3+4 = 10</text>
  <rect x="383" y="84" width="92" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="429" y="101" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">2×10 = 20</text>

  <!-- row 2: 敌2 -->
  <rect x="45" y="114" width="72" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="81" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">敌 2</text>
  <rect x="117" y="114" width="48" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="141" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="165" y="114" width="48" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="189" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="213" y="114" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="131" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1+2+3 = 6</text>
  <rect x="383" y="114" width="92" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="429" y="131" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">2×6 = 12</text>

  <!-- row 3: 敌0 -->
  <rect x="45" y="144" width="72" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="81" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">敌 0</text>
  <rect x="117" y="144" width="48" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="141" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="165" y="144" width="48" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="189" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="213" y="144" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="161" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1+2 = 3</text>
  <rect x="383" y="144" width="92" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="429" y="161" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">1×3 = 3</text>

  <!-- row 4: 敌1 -->
  <rect x="45" y="174" width="72" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="81" y="191" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">敌 1</text>
  <rect x="117" y="174" width="48" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="141" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="165" y="174" width="48" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="189" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="213" y="174" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="191" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">2（只剩它了）</text>
  <rect x="383" y="174" width="92" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="429" y="191" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">2×2 = 4</text>

  <!-- sum row -->
  <rect x="45" y="206" width="168" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="129" y="226" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">合计（总伤害）</text>
  <rect x="213" y="206" width="262" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="344" y="226" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">20 + 12 + 3 + 4 = 39 ✓</text>

  <!-- note -->
  <rect x="60" y="252" width="400" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">时间线：秒 1~2 打敌3（全员每秒 10 伤）→ 秒 3~4 打敌2</text>
  <text x="260" y="289" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">（每秒 6 伤）→ 秒 5 打敌0（每秒 3 伤）→ 秒 6~7 打敌1（每秒 2 伤）</text>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">被攻击的敌人在「挨打的那一秒」也照常输出伤害</text>

  <!-- bottom hint -->
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">敌 0 与敌 1 比值同为 1，先后互换总伤害不变</text>
</svg>
