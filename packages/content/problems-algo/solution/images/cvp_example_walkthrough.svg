<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=1→5 时各状态值</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">每行 = 上一行按转移方程累加，Σ 即答案</text>

  <!-- ===== Table header ===== -->
  <g font-size="11" fill="#333">
    <text x="75" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">k</text>
    <text x="125" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">a</text>
    <text x="185" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">e</text>
    <text x="245" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i</text>
    <text x="305" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">o</text>
    <text x="365" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">u</text>
    <text x="430" y="82" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">Σ</text>
  </g>

  <!-- ===== Row k=1 (init) ===== -->
  <g>
    <rect x="55" y="90" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="75" y="110" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="95" y="90" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="125" y="110" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="155" y="90" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="185" y="110" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="215" y="90" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="245" y="110" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="275" y="90" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="305" y="110" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="335" y="90" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="365" y="110" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="395" y="90" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="430" y="110" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  </g>

  <!-- ===== Row k=2 ===== -->
  <g>
    <rect x="55" y="122" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="75" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="95" y="122" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="125" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="155" y="122" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="185" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="215" y="122" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="245" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="275" y="122" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="305" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="335" y="122" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="365" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="395" y="122" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="430" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">10</text>
  </g>

  <!-- ===== Row k=3 ===== -->
  <g>
    <rect x="55" y="154" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="75" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
    <rect x="95" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="125" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">6</text>
    <rect x="155" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="185" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
    <rect x="215" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="245" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
    <rect x="275" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="305" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
    <rect x="335" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="365" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
    <rect x="395" y="154" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="430" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">19</text>
  </g>

  <!-- ===== Row k=4 ===== -->
  <g>
    <rect x="55" y="186" width="40" height="30" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="75" y="206" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">4</text>
    <rect x="95" y="186" width="60" height="30" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="125" y="206" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">11</text>
    <rect x="155" y="186" width="60" height="30" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="185" y="206" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">9</text>
    <rect x="215" y="186" width="60" height="30" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="245" y="206" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">7</text>
    <rect x="275" y="186" width="60" height="30" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="305" y="206" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">3</text>
    <rect x="335" y="186" width="60" height="30" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="365" y="206" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">5</text>
    <rect x="395" y="186" width="70" height="30" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="430" y="206" text-anchor="middle" font-size="12" fill="#7a4a8a" font-weight="bold">35</text>
  </g>

  <!-- ===== Row k=5 (answer, emphasized) ===== -->
  <g>
    <rect x="55" y="218" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="75" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
    <rect x="95" y="218" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="125" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">21</text>
    <rect x="155" y="218" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="185" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">18</text>
    <rect x="215" y="218" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="245" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">12</text>
    <rect x="275" y="218" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="305" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7</text>
    <rect x="335" y="218" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="365" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">10</text>
    <rect x="395" y="218" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="430" y="238" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">68</text>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="60" y="265" width="400" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="76" y="273" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="92" y="284" font-size="9" fill="#555">k=1 初值</text>
  <rect x="150" y="273" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="166" y="284" font-size="9" fill="#555">k=2</text>
  <rect x="200" y="273" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="216" y="284" font-size="9" fill="#555">k=3</text>
  <rect x="250" y="273" width="12" height="12" fill="#f3e8fe" stroke="#7a4a8a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="266" y="284" font-size="9" fill="#555">k=4</text>
  <rect x="300" y="273" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="316" y="284" font-size="9" fill="#555">k=5 答案</text>

  <!-- ===== Result note ===== -->
  <rect x="60" y="305" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">n=5 时 21+18+12+7+10 = 68</text>
  <text x="260" y="341" text-anchor="middle" font-size="9" fill="#888">5 个状态独立滚动，每步 O(1) 转移</text>
</svg>
