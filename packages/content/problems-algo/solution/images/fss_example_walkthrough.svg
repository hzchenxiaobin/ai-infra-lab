<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算（m=4）</text>

  <!-- table header -->
  <rect x="30" y="40" width="540" height="28" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="58" font-size="11" fill="#fff" font-weight="bold">#</text>
  <text x="80" y="58" font-size="11" fill="#fff" font-weight="bold">操作</text>
  <text x="220" y="58" font-size="11" fill="#fff" font-weight="bold">返回</text>
  <text x="300" y="58" font-size="11" fill="#fff" font-weight="bold">chunk_users（块→用户集）</text>
  <text x="540" y="58" font-size="11" fill="#fff" font-weight="bold">recycled</text>

  <!-- Row 1: join([1,2]) -> 1 -->
  <rect x="30" y="70" width="540" height="40" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="94" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="80" y="94" font-size="11" fill="#333">join([1,2])</text>
  <text x="220" y="94" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="300" y="88" font-size="10" fill="#b85450">1→{1}</text>
  <text x="300" y="104" font-size="10" fill="#b85450">2→{1}</text>
  <text x="540" y="94" font-size="10" fill="#888">[]</text>

  <!-- Row 2: join([2,3]) -> 2 -->
  <rect x="30" y="112" width="540" height="40" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="136" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="80" y="136" font-size="11" fill="#333">join([2,3])</text>
  <text x="220" y="136" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="300" y="130" font-size="10" fill="#b85450">2→{1,2}</text>
  <text x="300" y="146" font-size="10" fill="#b85450">3→{2}</text>
  <text x="540" y="136" font-size="10" fill="#888">[]</text>

  <!-- Row 3: join([4]) -> 3 -->
  <rect x="30" y="154" width="540" height="40" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="80" y="178" font-size="11" fill="#333">join([4])</text>
  <text x="220" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="300" y="172" font-size="10" fill="#b85450">4→{3}</text>
  <text x="300" y="188" font-size="10" fill="#888">（其余同上）</text>
  <text x="540" y="178" font-size="10" fill="#888">[]</text>

  <!-- Row 4: request(1,3) -> [2]  KEY -->
  <rect x="30" y="196" width="540" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="222" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="80" y="222" font-size="11" fill="#333" font-weight="bold">request(1,3)</text>
  <text x="220" y="222" font-size="11" fill="#d6a040" font-weight="bold">[2]</text>
  <text x="300" y="214" font-size="10" fill="#b85450">3→{1,2}</text>
  <text x="300" y="232" font-size="9.5" fill="#888">用户1未持有→双写，1 拿到块3</text>
  <text x="540" y="222" font-size="10" fill="#888">[]</text>

  <!-- Row 5: request(2,2) -> [1,2] -->
  <rect x="30" y="242" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="266" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="80" y="266" font-size="11" fill="#333" font-weight="bold">request(2,2)</text>
  <text x="220" y="266" font-size="11" fill="#d6a040" font-weight="bold">[1,2]</text>
  <text x="300" y="260" font-size="10" fill="#888">用户2已持有→不写</text>
  <text x="300" y="276" font-size="9.5" fill="#888">返回含自己</text>
  <text x="540" y="266" font-size="10" fill="#888">[]</text>

  <!-- Row 6: leave(1) -->
  <rect x="30" y="284" width="540" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="310" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="80" y="310" font-size="11" fill="#333" font-weight="bold">leave(1)</text>
  <text x="220" y="310" font-size="11" fill="#888">null</text>
  <text x="300" y="302" font-size="10" fill="#b85450">1→∅（删）</text>
  <text x="300" y="318" font-size="10" fill="#b85450">2→{2}, 3→{2}</text>
  <text x="540" y="310" font-size="10" fill="#d6a040" font-weight="bold">[1]</text>

  <!-- Row 7: request(2,1) -> [] -->
  <rect x="30" y="330" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="354" font-size="11" fill="#d6a040" font-weight="bold">7</text>
  <text x="80" y="354" font-size="11" fill="#333" font-weight="bold">request(2,1)</text>
  <text x="220" y="354" font-size="11" fill="#d6a040" font-weight="bold">[]</text>
  <text x="300" y="348" font-size="10" fill="#888">无人持有块1</text>
  <text x="300" y="364" font-size="9.5" fill="#888">不获块，状态不变</text>
  <text x="540" y="354" font-size="10" fill="#888">[1]</text>

  <!-- Row 8: leave(2) -->
  <rect x="30" y="372" width="540" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="396" font-size="11" fill="#b85450" font-weight="bold">8</text>
  <text x="80" y="396" font-size="11" fill="#333" font-weight="bold">leave(2)</text>
  <text x="220" y="396" font-size="11" fill="#888">null</text>
  <text x="300" y="390" font-size="10" fill="#b85450">2→∅, 3→∅（删）</text>
  <text x="300" y="406" font-size="9.5" fill="#888">只剩 4→{3}</text>
  <text x="540" y="396" font-size="10" fill="#d6a040" font-weight="bold">[1,2]</text>

  <!-- Row 9: join([]) -> 1 (reuse) KEY -->
  <rect x="30" y="414" width="540" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="440" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <text x="80" y="440" font-size="11" fill="#333" font-weight="bold">join([])</text>
  <text x="220" y="440" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="300" y="432" font-size="10" fill="#4a7a3a">复用堆顶 ID=1</text>
  <text x="300" y="450" font-size="9.5" fill="#888">空 chunks，不写 chunk_users</text>
  <text x="540" y="440" font-size="10" fill="#888">[2]</text>

  <!-- summary note -->
  <rect x="30" y="472" width="540" height="40" fill="#f8f8f8" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="490" font-size="10.5" fill="#555" font-weight="bold">关键点</text>
  <text x="50" y="506" font-size="10" fill="#555">① request 返回的是「写入前」的拥有者列表，不含刚获块的请求者；② 无人持有时返回空、请求者不获块；③ ID 离开后进 recycled 堆，join 取最小者复用。</text>
</svg>
