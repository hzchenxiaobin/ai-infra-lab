<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历格子，陆地 +4，左/上邻陆地 −2</text>

  <!-- Start -->
  <ellipse cx="220" cy="56" rx="44" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <line x1="220" y1="71" x2="220" y2="84" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ans = 0 -->
  <rect x="178" y="86" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="105" text-anchor="middle" font-size="12" fill="#333">ans = 0</text>
  <line x1="220" y1="114" x2="220" y2="126" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop note -->
  <rect x="150" y="128" width="140" height="28" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>
  <text x="220" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">对每个格子 (i, j) 重复</text>
  <line x1="220" y1="156" x2="220" y2="168" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond grid[i][j]==1? -->
  <polygon points="220,170 296,196 220,222 144,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="200" text-anchor="middle" font-size="11" fill="#333">grid[i][j] == 1?</text>

  <!-- No branch -->
  <line x1="296" y1="196" x2="360" y2="196" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="320" y="190" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="362" y="182" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="201" text-anchor="middle" font-size="11" fill="#b85450">跳过该格</text>

  <!-- Yes branch -->
  <line x1="220" y1="222" x2="220" y2="236" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="232" y="232" font-size="10" fill="#888">是</text>

  <!-- ans += 4 -->
  <rect x="178" y="238" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans += 4</text>
  <line x1="220" y1="266" x2="220" y2="278" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond left neighbor -->
  <polygon points="220,280 300,306 220,332 140,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="304" text-anchor="middle" font-size="10.5" fill="#333">左邻 == 1?</text>
  <text x="220" y="318" text-anchor="middle" font-size="9" fill="#888">j&gt;0 且 grid[i][j−1]</text>

  <!-- left Yes -->
  <line x1="300" y1="306" x2="362" y2="306" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="328" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="364" y="292" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="311" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans −= 2</text>

  <line x1="220" y1="332" x2="220" y2="344" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond up neighbor -->
  <polygon points="220,346 300,372 220,398 140,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="370" text-anchor="middle" font-size="10.5" fill="#333">上邻 == 1?</text>
  <text x="220" y="384" text-anchor="middle" font-size="9" fill="#888">i&gt;0 且 grid[i−1][j]</text>

  <!-- up Yes -->
  <line x1="300" y1="372" x2="362" y2="372" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="328" y="366" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="364" y="358" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="377" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans −= 2</text>

  <line x1="220" y1="398" x2="220" y2="412" stroke="#888" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- return -->
  <ellipse cx="220" cy="430" rx="58" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="434" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">遍历完，返回 ans</text>

  <!-- converge note for side branches -->
  <path d="M 408 210 L 408 416 L 278 416" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 410 320 L 410 416 L 278 416" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
  <path d="M 410 386 L 410 416 L 278 416" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
</svg>
