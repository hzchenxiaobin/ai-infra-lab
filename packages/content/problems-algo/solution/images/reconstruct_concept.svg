<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：先放高个，矮个怎么插都不影响高个的 k</text>

  <!-- Row A: tall people placed first -->
  <text x="80" y="74" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">① 高个先放</text>
  <rect x="92" y="54" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="128" y="75" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">7,0</text>
  <rect x="170" y="54" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="75" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">7,1</text>
  <text x="256" y="75" font-size="11" fill="#4a7a3a">k 已满足：每人只数 ≥ 自己身高的人</text>

  <!-- arrow A -> B -->
  <path d="M 200 92 L 200 108" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="208" y="104" font-size="10.5" fill="#d6a040" font-weight="bold">插入 6,1 @位置1</text>

  <!-- Row B: insert 6,1 at index 1 -->
  <text x="80" y="138" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">② 插入矮个</text>
  <rect x="92" y="118" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="128" y="139" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">7,0</text>
  <rect x="170" y="118" width="72" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="139" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">6,1</text>
  <rect x="248" y="118" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="284" y="139" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">7,1</text>
  <text x="334" y="138" font-size="11" fill="#4a7a3a">6 &lt; 7，两个 7 的 k 不变 ✓</text>
  <text x="334" y="152" font-size="11" fill="#d6a040">6 前面恰有 1 个 ≥6 的人</text>

  <!-- arrow B -> C -->
  <path d="M 200 156 L 200 172" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="208" y="168" font-size="10.5" fill="#d6a040" font-weight="bold">插入 5,0 @位置0</text>

  <!-- Row C: insert 5,0 at index 0 -->
  <text x="80" y="202" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">③ 再插更矮</text>
  <rect x="92" y="182" width="72" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="203" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5,0</text>
  <rect x="170" y="182" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="203" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">7,0</text>
  <rect x="248" y="182" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="284" y="203" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">6,1</text>
  <rect x="326" y="182" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="362" y="203" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">7,1</text>
  <text x="412" y="202" font-size="11" fill="#4a7a3a">5 &lt; 7,6</text>
  <text x="412" y="216" font-size="11" fill="#4a7a3a">前面全不变 ✓</text>

  <!-- conclusion -->
  <rect x="32" y="240" width="456" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="48" y="262" font-size="12.5" fill="#4a7a3a" font-weight="bold">结论：按身高降序处理，每人插入到位置 k</text>
  <text x="48" y="280" font-size="11" fill="#4a7a3a">已就位的人都比自己高 → 后续插入矮个不会改变自己的 k 值</text>

  <!-- tip box -->
  <rect x="32" y="308" width="456" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="328" font-size="11.5" fill="#b85450" font-weight="bold">⚠️ 同身高必须按 k 升序</text>
  <text x="48" y="346" font-size="11" fill="#b85450">同身高互相计入 k，后插者只能补在前，否则会挤到先放者前面使 k 超标</text>
  <text x="48" y="360" font-size="11" fill="#b85450">排序键：(h 降序, k 升序)</text>
</svg>
