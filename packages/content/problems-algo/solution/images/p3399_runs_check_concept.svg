<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="20" y="30" font-size="13" fill="#333" filter="url(#rough2)">核心观察：游程内每 m+1 个放一次翻转</text>

  <!-- Section A: 原串切游程 -->
  <text x="30" y="80" font-size="13" fill="#333" filter="url(#rough2)">s =</text>

  <rect x="62" y="60" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="88" y="60" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="114" y="60" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="127" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="140" y="60" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="166" y="60" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="179" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="60" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="218" y="60" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="231" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="244" y="60" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="257" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="270" y="60" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="296" y="60" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="309" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="62" y="92" width="104" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="107" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">L=4</text>
  <rect x="166" y="92" width="52" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="107" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">L=2</text>
  <rect x="218" y="92" width="78" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="257" y="107" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">L=3</text>
  <rect x="296" y="92" width="26" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="309" y="107" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">L=1</text>

  <text x="336" y="107" font-size="11" fill="#666" filter="url(#rough2)">← 相同字符连成一段（游程）</text>

  <!-- Section B: 单游程的切法 -->
  <text x="20" y="142" font-size="12" fill="#333" filter="url(#rough2)">单个游程 L=7，目标 m=2：每 m+1=3 个一组，翻组尾 →</text>

  <text x="113" y="150" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">组1</text>
  <text x="215" y="150" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">组2</text>
  <text x="283" y="150" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">余1</text>

  <line x1="164" y1="146" x2="164" y2="192" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="266" y1="146" x2="266" y2="192" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="62" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="96" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="130" y="152" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="147" y="174" text-anchor="middle" font-size="13" fill="#8c3a34" filter="url(#rough2)">1</text>
  <rect x="164" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="198" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="232" y="152" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="249" y="174" text-anchor="middle" font-size="13" fill="#8c3a34" filter="url(#rough2)">1</text>
  <rect x="266" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="316" y="166" font-size="11" fill="#b85450" filter="url(#rough2)">红色 = 翻转</text>
  <text x="316" y="182" font-size="11" fill="#b85450" filter="url(#rough2)">⌊7/3⌋ = 2 次</text>

  <text x="62" y="212" font-size="12" fill="#4a7a3a" filter="url(#rough2)">翻转后 00·1·00·1·0：最长相同段 = 2 ≤ m ✓</text>

  <!-- Section C: check 公式 -->
  <rect x="40" y="232" width="440" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">check(m)：所有游程求和 Σ ⌊L/(m+1)⌋ ≤ numOps ？（m ≥ 2）</text>
  <text x="260" y="273" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">若某组顶到游程末端，改翻该组倒数第 2 个，避免与右邻游程粘连</text>

  <!-- Section D: m=1 特判 -->
  <rect x="40" y="300" width="440" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="13" fill="#8c3a34" filter="url(#rough2)">⚠ m = 1 必须特判：不能用 Σ⌊L/2⌋ ！</text>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m=1 ⟺ 全串交替：与 0101… / 1010… 的失配数取 min，看是否 ≤ numOps</text>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#8c3a34" filter="url(#rough2)">反例 s=001001001：Σ⌊L/2⌋ = 3，但真正最少要翻 4 次</text>
</svg>
