<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">算法流程：从左到右逐位贪心，O(n) 一趟构造</text>

  <!-- Step 1: init -->
  <rect x="180" y="48" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#333">初始化：i = 0, k 不变, ans = ""</text>
  <path d="M 280 90 L 280 108" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop condition (diamond) -->
  <polygon points="280,112 380,158 280,204 180,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="174" text-anchor="middle" font-size="11" fill="#333">(还有位要填)</text>

  <!-- No branch -> return -->
  <path d="M 380 158 L 430 158 L 430 90" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="150" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="430" y="48" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="485" y="73" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch -> down -->
  <path d="M 280 204 L 280 222" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 3: compute rest and v -->
  <rect x="120" y="226" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11.5" fill="#333">rest = n - i  （含本位的剩余位数）</text>
  <text x="280" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">v = max(1, k - 26·(rest-1))</text>
  <path d="M 280 284 L 280 302" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: append + update -->
  <rect x="120" y="306" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11.5" fill="#333">ans += char('a' + v - 1)</text>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#333">k -= v ;  i += 1</text>
  <path d="M 280 364 L 280 382" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow -->
  <path d="M 280 386 L 280 396 L 100 396 L 100 158 L 178 158" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="392" font-size="10" fill="#888">回到循环头</text>

  <!-- footer note -->
  <rect x="40" y="416" width="480" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="58" y="438" font-size="11" fill="#b85450">每步 O(1)：一次减法 + 一次 max + 一次比较；共 n 步 → 时间 O(n)，空间 O(n) 存答案</text>

</svg>
