<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- 开始 -->
  <ellipse cx="260" cy="29" rx="45" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="34" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 260 44 L 260 52" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 一遍扫描 -->
  <rect x="150" y="54" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">一遍扫描 grid</text>
  <text x="260" y="88" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">求 total 与 colSum[]</text>
  <path d="M 260 96 L 260 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 奇偶剪枝 -->
  <polygon points="260,106 340,134 260,162 180,134" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">total 是奇数？</text>
  <path d="M 340 134 L 388 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="127" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <ellipse cx="440" cy="134" rx="52" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">return false</text>
  <path d="M 260 162 L 260 172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="176" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- 分叉 -->
  <path d="M 260 174 C 235 195, 150 190, 124 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 174 C 285 195, 370 190, 396 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="198" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">水平方向</text>
  <text x="352" y="198" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">垂直方向</text>

  <!-- 左列：水平检查 -->
  <rect x="28" y="210" width="185" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">水平检查</text>
  <text x="120" y="246" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">r=0…m-2，逐行累加 pre</text>
  <path d="M 120 256 L 120 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="120,268 200,297 120,326 40,297" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2×pre==total?</text>

  <!-- 右列：垂直检查 -->
  <rect x="307" y="210" width="185" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="399" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">垂直检查</text>
  <text x="399" y="246" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c=0…n-2，逐列累加 pre</text>
  <path d="M 399 256 L 399 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="399,268 479,297 399,326 319,297" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="399" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2×pre==total?</text>

  <!-- 左列 是→true -->
  <path d="M 120 326 L 120 341" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="338" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <ellipse cx="120" cy="363" rx="55" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return true</text>

  <!-- 右列 是→true -->
  <path d="M 399 326 L 399 341" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="407" y="338" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <ellipse cx="399" cy="363" rx="55" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="399" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return true</text>

  <!-- 两个“否”汇合 → false -->
  <path d="M 200 297 L 260 297" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 319 297 L 260 297" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="218" y="290" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <text x="292" y="290" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <path d="M 260 297 L 260 341" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="260" cy="363" rx="55" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">return false</text>
</svg>
