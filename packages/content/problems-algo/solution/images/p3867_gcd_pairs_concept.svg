<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一趟构造 prefixGcd + 首尾双指针配对</text>

  <!-- ① 构造 -->
  <text x="24" y="48" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">① 构造：前缀最大值单调不减，一趟转移</text>

  <text x="62" y="77" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="70" y="58" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="130" y="58" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="58" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="58" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="76" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="155" y="76" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="215" y="76" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="275" y="76" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">8</text>

  <text x="62" y="115" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">mx</text>
  <rect x="70" y="96" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="130" y="96" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="96" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="96" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="114" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="155" y="114" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">6</text>
  <text x="215" y="114" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">6</text>
  <text x="275" y="114" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">8</text>

  <text x="62" y="153" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">g[i]</text>
  <rect x="70" y="134" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="130" y="134" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="134" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="134" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="152" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="155" y="152" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">6</text>
  <text x="215" y="152" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="275" y="152" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">8</text>

  <path d="M 182 72 L 322 74" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="326" y="56" width="182" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="417" y="74" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">破纪录 ⇒ g[i] = nums[i]</text>
  <text x="417" y="91" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">gcd(x,x)=x，如 i=1: gcd(6,6)=6</text>

  <path d="M 242 112 L 322 128" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="326" y="112" width="182" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="417" y="130" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">未破纪录 ⇒ g = gcd(nums[i], mx)</text>
  <text x="417" y="147" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">如 i=2: gcd(2, mx=6) = 2</text>

  <!-- ② 排序配对 -->
  <text x="24" y="192" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">② 排序后：「最小配最大」= 首尾双指针 l / r</text>

  <path d="M 105 212 C 105 158, 315 158, 315 212" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="164" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">gcd(2,8)=2</text>
  <path d="M 175 212 C 175 178, 245 178, 245 212" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <rect x="80" y="214" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="214" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="214" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="214" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="233" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="175" y="233" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="245" y="233" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="315" y="233" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">8</text>

  <rect x="356" y="214" width="152" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="226" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">配两对：gcd(3,6)=3</text>
  <text x="432" y="241" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">ans = 2 + 3 = 5</text>

  <path d="M 105 272 L 105 254" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="287" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">l</text>
  <path d="M 315 272 L 315 254" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="315" y="287" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">r</text>

  <path d="M 114 281 L 164 281" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="139" y="276" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">l++</text>
  <path d="M 306 281 L 256 281" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="276" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">r−−</text>

  <!-- ③ 奇数落单 -->
  <text x="24" y="312" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">③ n 为奇数：l == r 时循环停止，中间落单</text>

  <path d="M 100 318 C 100 300, 196 300, 196 318" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="80" y="322" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="322" width="40" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="176" y="322" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="339" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="148" y="339" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="196" y="339" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="148" y="317" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">忽略</text>
  <path d="M 131 325 L 165 345" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="236" y="332" font-size="10.5" fill="#444" filter="url(#rough2)">while (l &lt; r) 奇数长度</text>
  <text x="236" y="347" font-size="10.5" fill="#444" filter="url(#rough2)">中间元素天然落单，无需特判</text>
</svg>
