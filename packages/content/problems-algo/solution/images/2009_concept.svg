<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：定长窗口 [L, L+n−1] 内已有元素越多，操作越少</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序去重 → 枚举最小值 L=a[i] → 窗口内保留数 c → 答案 = n − max c</text>

  <!-- Row 1: original nums (shuffled) -->
  <text x="44" y="82" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="85" fill="#446688" font-weight="bold">1</text>
    <rect x="162" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="182" y="85" fill="#446688" font-weight="bold">2</text>
    <rect x="204" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="224" y="85" fill="#446688" font-weight="bold">3</text>
    <rect x="246" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="266" y="85" fill="#446688" font-weight="bold">5</text>
    <rect x="288" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="308" y="85" fill="#446688" font-weight="bold">6</text>
  </g>
  <text x="350" y="85" font-size="10.5" fill="#888" filter="url(#rough2)">n = 5（打乱）</text>

  <!-- Arrow: sort + dedup -->
  <path d="M 300 108 L 300 128" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="328" y="124" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">排序 + 去重</text>

  <!-- Row 2: sorted unique a -->
  <text x="44" y="156" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">a（升序去重）</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="138" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="140" y="159" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="162" y="138" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="182" y="159" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="204" y="138" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="224" y="159" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="246" y="138" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="266" y="159" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="288" y="138" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="308" y="159" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
  <text x="350" y="159" font-size="10.5" fill="#888" filter="url(#rough2)">m = 5（不同值）</text>

  <!-- Divider -->
  <line x1="60" y1="190" x2="540" y2="190" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Section: window sliding -->
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">窗口 [a[i], a[i]+n−1] 滑动：绿=保留，灰=需改写</text>

  <!-- Window 1: L=1, window [1,5] -->
  <g filter="url(#rough2)">
    <text x="60" y="248" font-size="10.5" fill="#555" font-weight="bold">L=1</text>
    <!-- window bracket -->
    <rect x="116" y="226" width="172" height="48" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" rx="6"/>
    <text x="202" y="222" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">[1, 1+5−1=5]</text>
    <g font-size="13" text-anchor="middle">
      <rect x="120" y="232" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="140" y="253" fill="#4a7a3a" font-weight="bold">1</text>
      <rect x="162" y="232" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="182" y="253" fill="#4a7a3a" font-weight="bold">2</text>
      <rect x="204" y="232" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="224" y="253" fill="#4a7a3a" font-weight="bold">3</text>
      <rect x="246" y="232" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="266" y="253" fill="#4a7a3a" font-weight="bold">5</text>
      <rect x="288" y="232" width="40" height="32" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
      <text x="308" y="253" fill="#888" font-weight="bold">6</text>
    </g>
    <text x="350" y="253" font-size="10.5" fill="#4a7a3a" font-weight="bold">c = 4（保留 4 个）</text>
  </g>

  <!-- Window 2: L=2, window [2,6] -->
  <g filter="url(#rough2)">
    <text x="60" y="304" font-size="10.5" fill="#555" font-weight="bold">L=2</text>
    <rect x="158" y="282" width="172" height="48" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" rx="6"/>
    <text x="244" y="278" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">[2, 2+5−1=6]</text>
    <g font-size="13" text-anchor="middle">
      <rect x="120" y="288" width="40" height="32" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
      <text x="140" y="309" fill="#888" font-weight="bold">1</text>
      <rect x="162" y="288" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="182" y="309" fill="#4a7a3a" font-weight="bold">2</text>
      <rect x="204" y="288" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="224" y="309" fill="#4a7a3a" font-weight="bold">3</text>
      <rect x="246" y="288" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="266" y="309" fill="#4a7a3a" font-weight="bold">5</text>
      <rect x="288" y="288" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="308" y="309" fill="#4a7a3a" font-weight="bold">6</text>
    </g>
    <text x="350" y="309" font-size="10.5" fill="#4a7a3a" font-weight="bold">c = 4（保留 4 个）</text>
  </g>

  <!-- Window 3: L=3, window [3,7] -->
  <g filter="url(#rough2)">
    <text x="60" y="360" font-size="10.5" fill="#555" font-weight="bold">L=3</text>
    <rect x="200" y="338" width="172" height="48" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" rx="6"/>
    <text x="286" y="334" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">[3, 3+5−1=7]</text>
    <g font-size="13" text-anchor="middle">
      <rect x="120" y="344" width="40" height="32" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
      <text x="140" y="365" fill="#888" font-weight="bold">1</text>
      <rect x="162" y="344" width="40" height="32" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4"/>
      <text x="182" y="365" fill="#888" font-weight="bold">2</text>
      <rect x="204" y="344" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="224" y="365" fill="#4a7a3a" font-weight="bold">3</text>
      <rect x="246" y="344" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="266" y="365" fill="#4a7a3a" font-weight="bold">5</text>
      <rect x="288" y="344" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
      <text x="308" y="365" fill="#4a7a3a" font-weight="bold">6</text>
    </g>
    <text x="350" y="365" font-size="10.5" fill="#888" font-weight="bold">c = 3</text>
  </g>

  <!-- Legend -->
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <rect x="410" y="226" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="430" y="237">窗口内（保留）</text>
    <rect x="410" y="246" width="14" height="14" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <text x="430" y="257">窗口外（改写）</text>
    <rect x="410" y="266" width="14" height="14" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" rx="3"/>
    <text x="430" y="277">定长窗口</text>
  </g>

  <!-- Result -->
  <rect x="80" y="392" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max c = 4 → 答案 = n − max c = 5 − 4 = 1</text>
  <text x="300" y="428" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">把 1 个窗口外元素改写成窗口内缺失值（如 6→4）</text>

  <!-- Note -->
  <rect x="40" y="446" width="520" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="463" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">为何窗口大小是 n？最终数组长度为 n，连续区间 [L, L+n−1] 恰含 n 个整数</text>
</svg>
