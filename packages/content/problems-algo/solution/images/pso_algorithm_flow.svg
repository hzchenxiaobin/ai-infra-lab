<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：埃氏筛预处理 + 从左到右贪心</text>

  <!-- 1. sieve -->
  <rect x="150" y="44" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">埃氏筛：筛出 ≤ max(nums) 的质数，存有序表 primes</text>

  <line x1="300" y1="86" x2="300" y2="104" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. init prev -->
  <rect x="180" y="106" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prev = 0（哨兵，要求每位值 &gt; 0）</text>

  <line x1="300" y1="144" x2="300" y2="160" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. loop -->
  <rect x="200" y="162" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历 x ∈ nums</text>

  <line x1="300" y1="198" x2="300" y2="214" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. diamond target<=0 -->
  <polygon points="300,216 410,256 300,296 190,256" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">target = x − prev</text>
  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">≤ 0 ?</text>

  <!-- yes branch -> false -->
  <line x1="410" y1="256" x2="470" y2="256" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="250" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="472" y="240" width="112" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="528" y="261" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return False</text>

  <!-- no branch down -->
  <line x1="300" y1="296" x2="300" y2="312" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="308" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 5. binary search largest prime < target -->
  <rect x="150" y="314" width="300" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">二分找 &lt; target 的最大质数 p（无则 p = 0）</text>

  <line x1="300" y1="352" x2="300" y2="368" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. update prev -->
  <rect x="170" y="370" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="392" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">new = x − p（恒 &gt; prev），prev ← new</text>

  <line x1="300" y1="408" x2="300" y2="424" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 7. done? -->
  <polygon points="300,426 400,446 300,466 200,446" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历完?</text>
  <line x1="200" y1="446" x2="120" y2="446" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="440" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否，取下个 x</text>
  <text x="430" y="440" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="430" y="430" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="451" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return True</text>
  <!-- loop back arrow from "否" up to loop box -->
  <path d="M 120 446 L 120 179 L 198 179" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
