<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2810a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arr2810b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr2810c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：方向标记代替实际翻转</text>

  <!-- Panel A: brute force -->
  <rect x="30" y="46" width="500" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="68" font-size="12" fill="#b85450" font-weight="bold">暴力：遇 'i' 就整体翻转 O(n²)</text>

  <rect x="60" y="84" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="106" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">s</text>
  <rect x="92" y="84" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="106" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">t</text>
  <rect x="124" y="84" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="106" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">r</text>

  <text x="175" y="100" font-size="14" fill="#b85450" font-weight="bold">i</text>
  <text x="175" y="116" text-anchor="middle" font-size="9" fill="#b85450">翻转</text>
  <path d="M168,108 L218,108" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr2810a)" filter="url(#rough2)"/>

  <rect x="228" y="84" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="243" y="106" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">r</text>
  <rect x="260" y="84" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="275" y="106" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">t</text>
  <rect x="292" y="84" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="307" y="106" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">s</text>

  <text x="360" y="100" font-size="10" fill="#888">每次 reverse()</text>
  <text x="360" y="116" font-size="10" fill="#888">搬运整个串 O(n)</text>

  <!-- Panel B: optimized -->
  <rect x="30" y="160" width="500" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="182" font-size="12" fill="#4a7a3a" font-weight="bold">优化：方向标记 + 双端队列 O(n)</text>

  <!-- direction flag -->
  <rect x="50" y="196" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="218" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dir = 正 / 反</text>

  <!-- i toggle -->
  <text x="190" y="210" font-size="13" fill="#b85450" font-weight="bold">i</text>
  <text x="190" y="226" font-size="9" fill="#b85450">翻转标记</text>
  <path d="M182,218 L232,218" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr2810a)" filter="url(#rough2)"/>

  <rect x="244" y="196" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="304" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dir 翻转 O(1)</text>

  <!-- deque bar -->
  <text x="60" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">front</text>
  <text x="500" y="266" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">back</text>

  <rect x="100" y="272" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="294" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">n</text>
  <rect x="142" y="272" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="294" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">s</text>
  <rect x="184" y="272" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="294" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">t</text>
  <rect x="226" y="272" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="294" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">r</text>

  <!-- push front arrow (dir=反) -->
  <path d="M56,289 L94,289" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr2810b)" filter="url(#rough2)"/>
  <text x="56" y="282" font-size="9" fill="#4a7a3a">dir=反→前插</text>

  <!-- push back arrow (dir=正) -->
  <path d="M272,289 L310,289" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2810c)" filter="url(#rough2)"/>
  <text x="310" y="282" font-size="9" fill="#446688">dir=正→后插</text>

  <!-- bottom note -->
  <rect x="30" y="336" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">翻转 = 改方向标记 + 换插入端，永不真正搬运数据</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#d6a040">'i' 只翻转标记不入队；结束时若 dir=反 则整体逆序读出</text>
</svg>
