<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：三个方法各自 O(1)</text>

  <!-- ============ Column 1: checkIn ============ -->
  <rect x="30" y="56" width="180" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">checkIn(id, 站, t)</text>

  <path d="M 120 104 L 120 120" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="124" width="160" height="40" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="148" text-anchor="middle" font-size="11" fill="#333">checkIns[id] = (站, t)</text>

  <path d="M 120 168 L 120 184" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="188" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">完成 O(1)</text>

  <text x="120" y="240" text-anchor="middle" font-size="10" fill="#888">仅一次哈希写入</text>

  <!-- ============ Column 2: checkOut ============ -->
  <rect x="230" y="56" width="180" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">checkOut(id, 站, t)</text>

  <path d="M 320 104 L 320 120" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="240" y="124" width="160" height="34" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="146" text-anchor="middle" font-size="10" fill="#333">① (start, tIn) = checkIns[id]</text>

  <path d="M 320 162 L 320 174" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="240" y="178" width="160" height="34" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="#333">② erase checkIns[id]</text>

  <path d="M 320 216 L 320 228" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="240" y="232" width="160" height="34" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="254" text-anchor="middle" font-size="10" fill="#333">③ key = (start, 站)</text>

  <path d="M 320 270 L 320 282" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="240" y="286" width="160" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="304" text-anchor="middle" font-size="10" fill="#333">④ travelTimes[key] +=</text>
  <text x="320" y="318" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">(t − tIn,  1)</text>

  <path d="M 320 330 L 320 346" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="260" y="350" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">完成 O(1)</text>

  <text x="320" y="402" text-anchor="middle" font-size="10" fill="#888">查+删+写共四次哈希操作</text>

  <!-- ============ Column 3: getAverageTime ============ -->
  <rect x="430" y="56" width="180" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">getAverageTime(起, 终)</text>

  <path d="M 520 104 L 520 120" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="440" y="124" width="160" height="40" rx="6" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="142" text-anchor="middle" font-size="10" fill="#333">(total, cnt) =</text>
  <text x="520" y="156" text-anchor="middle" font-size="10" fill="#333">travelTimes[(起, 终)]</text>

  <path d="M 520 168 L 520 184" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="440" y="188" width="160" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return total / cnt</text>

  <path d="M 520 232 L 520 248" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="460" y="252" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">完成 O(1)</text>

  <text x="520" y="304" text-anchor="middle" font-size="10" fill="#888">一次哈希读取 + 一次除法</text>

  <!-- dividers -->
  <line x1="220" y1="56" x2="220" y2="400" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <line x1="420" y1="56" x2="420" y2="400" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="60" y="424" width="520" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="447" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">关键：checkOut 配对进站与出站，用时差累加到站对记录——无需存储每次行程</text>
</svg>
