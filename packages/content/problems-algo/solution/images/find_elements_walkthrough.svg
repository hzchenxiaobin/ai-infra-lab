<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[-1,null,-1,-1,null,-1]（示例 3）</text>

  <!-- ===== Tree (left) ===== -->
  <text x="135" y="52" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">还原后的树</text>

  <!-- edges -->
  <line x1="135" y1="90" x2="200" y2="135" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="200" y1="158" x2="155" y2="200" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="155" y1="223" x2="125" y2="265" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- dashed line to null right child -->
  <line x1="200" y1="158" x2="245" y2="200" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="252" y="205" font-size="10" fill="#ccc" font-style="italic">null</text>

  <!-- nodes -->
  <circle cx="135" cy="78" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

  <circle cx="200" cy="143" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <circle cx="155" cy="210" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="215" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>

  <circle cx="125" cy="275" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">11</text>

  <!-- structure note -->
  <text x="135" y="315" text-anchor="middle" font-size="9.5" fill="#888">root.right = 2, root.right.left = 5</text>
  <text x="135" y="328" text-anchor="middle" font-size="9.5" fill="#888">root.right.left.left = 11</text>

  <!-- ===== Right: find traces ===== -->
  <text x="420" y="52" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">find 操作路径追踪</text>

  <!-- find(2) -->
  <rect x="300" y="62" width="245" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="312" y="80" font-size="11" fill="#4a7a3a" font-weight="bold">find(2):</text>
  <text x="312" y="96" font-size="10" fill="#555">2+1=3 = 11₂ → 去1 → "1"</text>
  <text x="312" y="110" font-size="10" fill="#555">bit=1 → 走右 → root.right</text>
  <rect x="490" y="86" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="514" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>
  <text x="312" y="130" font-size="9.5" fill="#888">✓ 节点(2)存在</text>

  <!-- find(3) -->
  <rect x="300" y="150" width="245" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="312" y="168" font-size="11" fill="#b85450" font-weight="bold">find(3):</text>
  <text x="312" y="184" font-size="10" fill="#555">3+1=4 = 100₂ → 去1 → "00"</text>
  <text x="312" y="198" font-size="10" fill="#555">bit=0 → 走左 → root.left = null</text>
  <rect x="490" y="174" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="514" y="189" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>
  <text x="312" y="218" font-size="9.5" fill="#888">✗ 第一步即断路</text>

  <!-- find(5) -->
  <rect x="300" y="238" width="245" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="312" y="256" font-size="11" fill="#d6a040" font-weight="bold">find(5):</text>
  <text x="312" y="272" font-size="10" fill="#555">5+1=6 = 110₂ → 去1 → "10"</text>
  <text x="312" y="288" font-size="10" fill="#555">bit=1 → 走右 → root.right(2)</text>
  <text x="312" y="302" font-size="10" fill="#555">bit=0 → 走左 → (2).left(5)</text>
  <rect x="490" y="270" width="48" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="514" y="285" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">true</text>
  <text x="312" y="322" font-size="9.5" fill="#888">✓ 走完两步，节点(5)存在</text>

  <!-- divider -->
  <line x1="280" y1="44" x2="280" y2="345" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- bottom summary -->
  <rect x="80" y="360" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键：路径中任一步遇到 null → false；走完整条路径 → true</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#888">污染不改结构，节点是否存在只取决于树形拓扑</text>
</svg>
