<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例 1 演算：高级累计 → 偏移 → 初级累计 → 输出 id</text>

  <!-- ===== Step 1: Senior ===== -->
  <text x="40" y="58" font-size="11" fill="#446688" font-weight="bold">步骤 ①  高级组按 salary 升序 + 窗口累计求和（CTE s）</text>

  <!-- header row -->
  <rect x="40" y="66" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="81" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">排序</text>
  <rect x="104" y="66" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="144" y="81" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">employee_id</text>
  <rect x="188" y="66" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="81" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">salary</text>
  <rect x="262" y="66" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="81" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">cur（累计）</text>
  <rect x="356" y="66" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="81" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">cur ≤ 70000?</text>

  <!-- senior rows -->
  <rect x="40" y="90" width="60" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="106" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <rect x="104" y="90" width="80" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="106" text-anchor="middle" font-size="9.5" fill="#333">11</text>
  <rect x="188" y="90" width="70" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="223" y="106" text-anchor="middle" font-size="9.5" fill="#333">16000</text>
  <rect x="262" y="90" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="106" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">16000</text>
  <rect x="356" y="90" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="106" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 雇</text>

  <rect x="40" y="116" width="60" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="132" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <rect x="104" y="116" width="80" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="132" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <rect x="188" y="116" width="70" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="223" y="132" text-anchor="middle" font-size="9.5" fill="#333">20000</text>
  <rect x="262" y="116" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="132" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">36000</text>
  <rect x="356" y="116" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="132" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 雇</text>

  <rect x="40" y="142" width="60" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="158" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <rect x="104" y="142" width="80" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="158" text-anchor="middle" font-size="9.5" fill="#999">13</text>
  <rect x="188" y="142" width="70" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="223" y="158" text-anchor="middle" font-size="9.5" fill="#999">50000</text>
  <rect x="262" y="142" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="158" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">86000</text>
  <rect x="356" y="142" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="158" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✗ 弃</text>

  <!-- spent -->
  <rect x="40" y="172" width="396" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="186" text-anchor="middle" font-size="9.5" fill="#a87020" font-weight="bold">高级花费 spent = MAX(cur ≤ 70000) = 36000 →  剩余预算 = 70000 − 36000 = 34000</text>

  <!-- arrow down -->
  <path d="M238 192 L238 212" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Junior ===== -->
  <text x="40" y="230" font-size="11" fill="#4a7a3a" font-weight="bold">步骤 ②  初级组累计 = 偏移 36000 + 初级前缀和（CTE j）</text>

  <!-- header -->
  <rect x="40" y="238" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="253" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">排序</text>
  <rect x="104" y="238" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="144" y="253" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">employee_id</text>
  <rect x="188" y="238" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="253" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">salary</text>
  <rect x="262" y="238" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="253" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">cur = 36000 + 前缀</text>
  <rect x="356" y="238" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="253" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">cur ≤ 70000?</text>

  <!-- junior rows -->
  <rect x="40" y="262" width="60" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="278" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <rect x="104" y="262" width="80" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="278" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <rect x="188" y="262" width="70" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="223" y="278" text-anchor="middle" font-size="9.5" fill="#333">10000</text>
  <rect x="262" y="262" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="278" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">46000</text>
  <rect x="356" y="262" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="278" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 雇</text>

  <rect x="40" y="288" width="60" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="304" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <rect x="104" y="288" width="80" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="304" text-anchor="middle" font-size="9.5" fill="#333">9</text>
  <rect x="188" y="288" width="70" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="223" y="304" text-anchor="middle" font-size="9.5" fill="#333">15000</text>
  <rect x="262" y="288" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="304" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">61000</text>
  <rect x="356" y="288" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="304" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 雇</text>

  <rect x="40" y="314" width="60" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="330" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <rect x="104" y="314" width="80" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="330" text-anchor="middle" font-size="9.5" fill="#999">4</text>
  <rect x="188" y="314" width="70" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="223" y="330" text-anchor="middle" font-size="9.5" fill="#999">40000</text>
  <rect x="262" y="314" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="330" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">101000</text>
  <rect x="356" y="314" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="330" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✗ 弃</text>

  <!-- ===== Step 3: Output ===== -->
  <path d="M238 340 L238 360" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="40" y="364" width="580" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="55" y="384" font-size="11" fill="#a87020" font-weight="bold">步骤 ③  UNION 合并两段被雇 id → 输出</text>
  <text x="55" y="402" font-size="9.5" fill="#555">高级被雇 id：11, 2     初级被雇 id：1, 9</text>
  <text x="55" y="418" font-size="9.5" fill="#555">SELECT employee_id FROM s WHERE cur &lt;= 70000  UNION  SELECT employee_id FROM j WHERE cur &lt;= 70000</text>
  <rect x="220" y="424" width="220" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="330" y="436" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">输出 employee_id：11, 2, 1, 9 ✓</text>
</svg>
