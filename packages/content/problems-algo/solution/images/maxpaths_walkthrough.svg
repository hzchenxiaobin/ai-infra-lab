<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：board = ["E12","1X1","21S"] → [4, 2]
  </text>

  <text x="90" y="55" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">board</text>
  <rect x="40" y="65" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="90" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="80" y="65" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="120" y="65" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="90" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="40" y="105" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="130" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="80" y="105" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="130" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">X</text>
  <rect x="120" y="105" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="130" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="40" y="145" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="170" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="80" y="145" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="170" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="120" y="145" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="170" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">S</text>

  <text x="270" y="55" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">dp（最大得分）</text>
  <rect x="220" y="65" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="90" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="260" y="65" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="300" y="65" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="90" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="220" y="105" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="130" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="260" y="105" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">−</text>
  <rect x="300" y="105" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="130" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="220" y="145" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="170" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="260" y="145" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="300" y="145" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="170" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="440" y="55" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">cnt（路径数）</text>
  <rect x="390" y="65" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="90" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="430" y="65" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="90" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="470" y="65" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="90" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="390" y="105" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="130" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="430" y="105" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="130" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="470" y="105" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="130" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="390" y="145" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="170" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="430" y="145" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="170" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="470" y="145" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="170" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="30" y="210" width="460" height="195" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="233" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键填表步骤</text>

  <text x="45" y="255" font-size="11" fill="#333" filter="url(#rough2)">(0,0)=E：dp=0, cnt=1（起点，得分 0）</text>
  <text x="45" y="273" font-size="11" fill="#333" filter="url(#rough2)">(0,1)=1：前驱(0,0) dp=0 → dp=0+1=1, cnt=1</text>
  <text x="45" y="291" font-size="11" fill="#333" filter="url(#rough2)">(0,2)=2：前驱(0,1) dp=1 → dp=1+2=3, cnt=1</text>
  <text x="45" y="309" font-size="11" fill="#333" filter="url(#rough2)">(1,0)=1：前驱(0,0) dp=0 → dp=0+1=1, cnt=1</text>
  <text x="45" y="327" font-size="11" fill="#b85450" filter="url(#rough2)">(1,1)=X：障碍，跳过</text>
  <text x="45" y="345" font-size="11" fill="#333" filter="url(#rough2)">(1,2)=1：前驱(0,2)dp=3 > (0,1)dp=1 → dp=3+1=4, cnt=1</text>
  <text x="45" y="363" font-size="11" fill="#333" filter="url(#rough2)">(2,0)=2：前驱(1,0) dp=1 → dp=1+2=3, cnt=1</text>
  <text x="45" y="381" font-size="11" fill="#333" filter="url(#rough2)">(2,1)=1：前驱(2,0)dp=3 > (1,0)dp=1 → dp=3+1=4, cnt=1</text>
  <text x="45" y="399" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(2,2)=S：前驱(2,1)dp=4, (1,2)dp=4 → 都最优！cnt=1+1=2 ✓</text>
</svg>
