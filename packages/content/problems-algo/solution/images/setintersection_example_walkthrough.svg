<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：[[1,3],[1,4],[2,5],[3,5]] → 排序后同序</text>

  <!-- table header -->
  <rect x="20" y="40" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="50" y="58">步</text>
    <text x="115" y="58">区间</text>
    <text x="185" y="58">last1</text>
    <text x="245" y="58">last2</text>
    <text x="330" y="58">判定条件</text>
    <text x="430" y="58">决策</text>
    <text x="510" y="58">count</text>
  </g>

  <!-- Row 0: [1,3] -->
  <rect x="20" y="70" width="520" height="28" fill="#fce4ec" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="50" y="88" font-weight="bold">0</text>
    <text x="115" y="88" fill="#b85450" font-weight="bold">[1,3]</text>
    <text x="185" y="88" fill="#888">−∞</text>
    <text x="245" y="88" fill="#888">−∞</text>
    <text x="330" y="88" fill="#b85450">last2&lt;s</text>
    <text x="430" y="88" fill="#b85450">放 2,3</text>
    <text x="510" y="88" font-weight="bold">2</text>
  </g>

  <!-- Row 1: [1,4] -->
  <rect x="20" y="100" width="520" height="28" fill="#e6f4ea" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="50" y="118" font-weight="bold">1</text>
    <text x="115" y="118" fill="#446688" font-weight="bold">[1,4]</text>
    <text x="185" y="118" fill="#d6a040">2</text>
    <text x="245" y="118" fill="#d6a040">3</text>
    <text x="330" y="118" fill="#4a7a3a">s≤last1</text>
    <text x="430" y="118" fill="#4a7a3a">跳过</text>
    <text x="510" y="118" font-weight="bold">2</text>
  </g>

  <!-- Row 2: [2,5] -->
  <rect x="20" y="130" width="520" height="28" fill="#e6f4ea" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="50" y="148" font-weight="bold">2</text>
    <text x="115" y="148" fill="#446688" font-weight="bold">[2,5]</text>
    <text x="185" y="148" fill="#d6a040">2</text>
    <text x="245" y="148" fill="#d6a040">3</text>
    <text x="330" y="148" fill="#4a7a3a">s≤last1</text>
    <text x="430" y="148" fill="#4a7a3a">跳过</text>
    <text x="510" y="148" font-weight="bold">2</text>
  </g>

  <!-- Row 3: [3,5] -->
  <rect x="20" y="160" width="520" height="28" fill="#e8f0fe" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="50" y="178" font-weight="bold">3</text>
    <text x="115" y="178" fill="#446688" font-weight="bold">[3,5]</text>
    <text x="185" y="178" fill="#d6a040">2</text>
    <text x="245" y="178" fill="#d6a040">3</text>
    <text x="330" y="178" fill="#446688">last1&lt;s≤last2</text>
    <text x="430" y="178" fill="#446688">放 5</text>
    <text x="510" y="178" font-weight="bold">3</text>
  </g>

  <!-- Result box -->
  <rect x="20" y="200" width="520" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果：S = {2, 3, 5}，|S| = 3</text>

  <!-- Verification -->
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">验证每个区间与 S 的交集 ≥ 2：</text>

  <g font-size="10.5" fill="#333" text-anchor="middle">
    <rect x="40" y="262" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="90" y="278" fill="#4a7a3a">[1,3]∩S={2,3} ✓</text>

    <rect x="160" y="262" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="278" fill="#4a7a3a">[1,4]∩S={2,3} ✓</text>

    <rect x="280" y="262" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="335" y="278" fill="#4a7a3a">[2,5]∩S={2,3,5} ✓</text>

    <rect x="410" y="262" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="460" y="278" fill="#4a7a3a">[3,5]∩S={3,5} ✓</text>
  </g>

  <!-- insight -->
  <rect x="40" y="298" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">💡 第 0 步放 {2,3}，3 同时满足 [1,4]、[2,5]、[3,5] — 右端策略的一点多用</text>
</svg>
