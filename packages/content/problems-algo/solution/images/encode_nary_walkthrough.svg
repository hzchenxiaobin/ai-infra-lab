<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：encode 逐节点建链</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">蓝箭头 = left（长子），红箭头 = right（兄弟）</text>

  <!-- ===== 上半：N叉树原图 ===== -->
  <text x="40" y="72" font-size="12" fill="#444" font-weight="bold">输入 N 叉树</text>
  <circle cx="150" cy="96" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="101" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <line x1="136" y1="109" x2="85" y2="134" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="150" y1="113" x2="150" y2="134" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="164" y1="109" x2="215" y2="134" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="80" cy="148" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="153" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <circle cx="150" cy="148" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="153" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <circle cx="220" cy="148" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="153" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <line x1="140" y1="160" x2="115" y2="180" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="160" y1="160" x2="185" y2="180" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="110" cy="192" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>

  <circle cx="190" cy="192" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- 右上：逐步说明 -->
  <rect x="300" y="64" width="280" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="314" y="84" font-size="11" fill="#8a6a20" font-weight="bold">encode(1)：建 1，children=[3,2,4]</text>
  <text x="324" y="102" font-size="10" fill="#555">① bn.left = encode(3)</text>
  <text x="324" y="118" font-size="10" fill="#555">② 3 无 children → bn(3).left=null</text>
  <text x="324" y="134" font-size="10" fill="#b85450">③ curr=bn(3)，curr.right = encode(2)</text>
  <text x="334" y="152" font-size="10" fill="#555">encode(2): children=[5,6]</text>
  <text x="344" y="168" font-size="10" fill="#446688">bn(2).left = encode(5)</text>
  <text x="344" y="184" font-size="10" fill="#b85450">curr=bn(5)，curr.right = encode(6)</text>
  <text x="324" y="200" font-size="10" fill="#b85450">④ curr=bn(2)，curr.right = encode(4)</text>

  <!-- ===== 下半：编码后的二叉树 ===== -->
  <text x="40" y="240" font-size="12" fill="#444" font-weight="bold">输出二叉树（LCRS）</text>

  <!-- 节点 1 -->
  <circle cx="160" cy="270" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="160" y="275" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- 1 --left--> 3 -->
  <path d="M 160 288 L 160 318" stroke="#446688" stroke-width="2.2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="142" y="306" font-size="10" fill="#446688" font-weight="bold">L</text>

  <circle cx="160" cy="334" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="339" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <!-- 3 --right--> 2 -->
  <path d="M 176 334 L 224 334" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="200" y="326" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R</text>

  <circle cx="240" cy="334" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="339" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- 2 --right--> 4 -->
  <path d="M 240 350 L 240 382" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="258" y="370" font-size="10" fill="#b85450" font-weight="bold">R</text>

  <circle cx="240" cy="398" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="403" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- 2 --left--> 5 -->
  <path d="M 228 344 L 195 372" stroke="#446688" stroke-width="2.2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="200" y="354" font-size="10" fill="#446688" font-weight="bold">L</text>

  <circle cx="185" cy="398" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="403" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- 5 --right--> 6 -->
  <path d="M 172 406 L 138 422" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="148" y="410" font-size="10" fill="#b85450" font-weight="bold">R</text>

  <circle cx="125" cy="432" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="437" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- 右下：解码对照 -->
  <rect x="320" y="252" width="260" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="334" y="272" font-size="11" fill="#446688" font-weight="bold">decode 验证（对称还原）</text>
  <text x="334" y="290" font-size="10" fill="#555">decode(1): node(1,[])</text>
  <text x="344" y="306" font-size="10" fill="#446688">curr=root.left=3 → decode(3) 入列</text>
  <text x="354" y="322" font-size="10" fill="#b85450">curr=3.right=2 → decode(2) 入列</text>
  <text x="354" y="338" font-size="10" fill="#b85450">curr=2.right=4 → decode(4) 入列</text>
  <text x="344" y="354" font-size="10" fill="#888">→ 1.children=[3,2,4] ✓</text>

  <!-- 底部说明 -->
  <rect x="20" y="388" width="280" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="408" font-size="11" fill="#4a7a3a" font-weight="bold">关键：递归先深入长子链</text>
  <text x="34" y="426" font-size="10" fill="#555">encode(1) 调 encode(3)，再串兄弟 2、4</text>
  <text x="34" y="442" font-size="10" fill="#555">encode(2) 调 encode(5)，再串兄弟 6</text>
  <text x="34" y="458" font-size="10" fill="#d6a040" font-weight="bold">兄弟链方向 = children 列表顺序</text>
</svg>
