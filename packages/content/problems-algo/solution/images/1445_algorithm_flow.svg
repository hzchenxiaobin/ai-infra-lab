<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：FROM → GROUP BY → 条件聚合 → ORDER BY</text>

  <!-- Start -->
  <ellipse cx="280" cy="54" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 280 70 L 280 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: FROM Sales -->
  <rect x="170" y="84" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="11.5" fill="#333">FROM Sales</text>

  <path d="M 280 116 L 280 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: GROUP BY sale_date -->
  <rect x="120" y="130" width="320" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="11.5" fill="#333">GROUP BY sale_date</text>

  <path d="M 280 162 L 280 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: fruit? -->
  <polygon points="280,178 380,220 280,262 180,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">fruit?</text>
  <text x="280" y="232" text-anchor="middle" font-size="10" fill="#888">(行内判定)</text>

  <!-- Two branches -->
  <!-- apples branch: left -->
  <path d="M 180 220 L 120 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">apples</text>
  <rect x="36" y="204" width="84" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="226" text-anchor="middle" font-size="10.5" fill="#333">+ sold_num</text>

  <!-- oranges branch: right -->
  <path d="M 380 220 L 440 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">oranges</text>
  <rect x="440" y="204" width="84" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="482" y="226" text-anchor="middle" font-size="10.5" fill="#333">− sold_num</text>

  <!-- Lines converging to SUM -->
  <path d="M 78 238 L 78 286 L 200 286" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 482 238 L 482 286 L 360 286" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- SUM box -->
  <rect x="140" y="272" width="280" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#333">SUM(IF(...)) AS diff  —  组内带符号求和</text>

  <path d="M 280 308 L 280 322" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box: ORDER BY sale_date -->
  <rect x="120" y="324" width="320" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11.5" fill="#333">ORDER BY sale_date</text>

  <path d="M 280 356 L 280 370" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="100" y="372" width="360" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#333">SELECT sale_date, diff</text>

  <path d="M 280 402 L 280 414" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="280" cy="428" rx="50" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#333">输出结果</text>

  <!-- footer note -->
  <text x="280" y="464" text-anchor="middle" font-size="10.5" fill="#888">一次 GROUP BY 把同日两行压成一行，条件聚合在组内完成加减</text>
</svg>
