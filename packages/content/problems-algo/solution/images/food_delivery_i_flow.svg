<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐行判定 → 聚合求占比 → ROUND 取整</text>

  <!-- Step 1: Input -->
  <rect x="150" y="42" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入：Delivery 表（n 行订单）</text>

  <path d="M280 76 L280 92" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: CASE WHEN per row -->
  <rect x="50" y="94" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="114" font-size="10" fill="#4a7a3a" font-weight="bold">① 逐行判定：order_date = customer_pref_delivery_date ?</text>
  <text x="70" y="130" font-size="9" fill="#4a7a3a">每行产生布尔值：相等 → 1（即时），不等 → 0（非即时）</text>
  <text x="70" y="142" font-size="8.5" fill="#888">⚠ MySQL 中布尔表达式自动返回 0/1；其他库用 CASE WHEN ... THEN 1 ELSE 0 END</text>

  <path d="M280 150 L280 166" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: Aggregate -->
  <rect x="30" y="168" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="188" font-size="10" fill="#d6a040" font-weight="bold">② 聚合求占比：AVG(布尔) 或 COUNT(即时) / COUNT(*)</text>
  <text x="50" y="204" font-size="9" fill="#d6a040">AVG 版：SUM(0/1 值) / n = 即时行数 / 总行数 = 占比（0~1 之间）</text>
  <text x="50" y="218" font-size="9" fill="#d6a040">COUNT 版：COUNT(CASE WHEN ... THEN 1 END) / COUNT(*) × 100 = 百分比</text>

  <path d="M280 224 L280 240" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: ROUND -->
  <rect x="80" y="242" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="261" font-size="10" fill="#d6a040" font-weight="bold">③ ROUND(占比 × 100, 2)</text>
  <text x="100" y="277" font-size="9" fill="#d6a040">乘 100 转百分比，ROUND 保留 2 位小数（题目要求）</text>

  <path d="M280 286 L280 302" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="140" y="304" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出：immediate_percentage = 33.33</text>

  <!-- ===== Right side: SQL clause execution order ===== -->
  <rect x="430" y="94" width="120" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="490" y="112" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">SQL 执行顺序</text>
  <line x1="440" y1="118" x2="540" y2="118" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="445" y="132" font-size="8" fill="#446688">1. FROM</text>
  <text x="445" y="148" font-size="8" fill="#888">2. WHERE（无）</text>
  <text x="445" y="164" font-size="8" fill="#888">3. GROUP BY（无）</text>
  <text x="445" y="180" font-size="8" fill="#888">4. HAVING（无）</text>
  <text x="445" y="196" font-size="8" fill="#d6a040" font-weight="bold">5. SELECT ✓</text>
  <text x="455" y="208" font-size="7" fill="#d6a040">AVG / COUNT</text>
  <text x="455" y="220" font-size="7" fill="#d6a040">+ ROUND</text>
  <text x="445" y="236" font-size="8" fill="#888">6. ORDER BY（无）</text>
  <text x="445" y="252" font-size="8" fill="#888">7. LIMIT（无）</text>
  <text x="445" y="272" font-size="7" fill="#b85450">⚠ 整表聚合</text>
  <text x="445" y="284" font-size="7" fill="#b85450">无需 GROUP BY</text>

  <!-- ===== Bottom: numeric flow ===== -->
  <rect x="20" y="352" width="520" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">数值流（示例：6 行，2 行即时）</text>

  <rect x="35" y="382" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="399" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">6 行</text>

  <path d="M115 395 L150 395" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="132" y="389" text-anchor="middle" font-size="7" fill="#4a7a3a">判定</text>

  <rect x="155" y="382" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="399" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">0,1,0,1,0,0</text>

  <path d="M250 395 L285 395" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="267" y="389" text-anchor="middle" font-size="7" fill="#d6a040">AVG</text>

  <rect x="290" y="382" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="330" y="399" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2/6≈0.33</text>

  <path d="M375 395 L410 395" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="389" text-anchor="middle" font-size="7" fill="#b85450">×100,ROUND</text>

  <rect x="415" y="382" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="465" y="399" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">33.33</text>

  <text x="280" y="432" text-anchor="middle" font-size="8.5" fill="#888">6 行 → 逐行判定为 0/1 序列 → AVG 得比例 0.333 → × 100 + ROUND 得 33.33</text>
</svg>
