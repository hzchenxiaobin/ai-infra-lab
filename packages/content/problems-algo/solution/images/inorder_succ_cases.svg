<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">中序后继的两种情况</text>

  <!-- ============ 左树：情况1 ============ -->
  <text x="155" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情况1：p 有右子树</text>

  <!-- 边 -->
  <line x1="155" y1="100" x2="115" y2="150" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="165" y1="100" x2="205" y2="150" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="108" y1="165" x2="88" y2="215" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="122" y1="165" x2="138" y2="215" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="212" y1="165" x2="232" y2="215" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="160" cy="90" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="94" text-anchor="middle" font-size="11" fill="#333">5</text>

  <circle cx="110" cy="158" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="110" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="78" y="148" font-size="10" fill="#b85450">p</text>

  <circle cx="210" cy="158" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="162" text-anchor="middle" font-size="11" fill="#333">7</text>

  <circle cx="85" cy="223" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="227" text-anchor="middle" font-size="10" fill="#333">2</text>

  <circle cx="142" cy="223" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="142" y="227" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>

  <circle cx="237" cy="223" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="237" y="227" text-anchor="middle" font-size="10" fill="#333">8</text>

  <!-- 情况1说明 -->
  <path d="M 156 172 Q 130 195 145 210" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="40" y="262" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="160" y="280" text-anchor="middle" font-size="11" fill="#333">后继 = p 右子树的最左节点</text>
  <text x="160" y="297" text-anchor="middle" font-size="10" fill="#666">一路向左走到底 ⇒ 4</text>

  <!-- ============ 右树：情况2 ============ -->
  <text x="455" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情况2：p 无右子树</text>

  <!-- 边 -->
  <line x1="445" y1="100" x2="408" y2="150" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="455" y1="100" x2="492" y2="150" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="400" y1="165" x2="378" y2="215" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="412" y1="165" x2="425" y2="215" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="450" cy="90" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="450" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="466" y="84" font-size="10" fill="#4a7a3a">succ</text>

  <circle cx="402" cy="158" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="162" text-anchor="middle" font-size="11" fill="#333">3</text>

  <circle cx="498" cy="158" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="498" y="162" text-anchor="middle" font-size="11" fill="#333">6</text>

  <circle cx="375" cy="223" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="375" y="227" text-anchor="middle" font-size="10" fill="#333">2</text>

  <circle cx="430" cy="223" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="430" y="227" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="448" y="216" font-size="10" fill="#b85450">p</text>
  <text x="448" y="246" font-size="9" fill="#b85450">(无右子)</text>

  <!-- 搜索路径标注 -->
  <path d="M 460 92 Q 380 110 390 155" stroke="#888" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 170 Q 412 195 425 212" stroke="#888" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="262" width="250" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="455" y="280" text-anchor="middle" font-size="11" fill="#333">后继 = 最低的「向左走」祖先</text>
  <text x="455" y="297" text-anchor="middle" font-size="10" fill="#666">5 &gt; 4 ⇒ 记 succ=5，向左 ⇒ 5</text>

  <!-- 底部总结 -->
  <rect x="40" y="330" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="347" text-anchor="middle" font-size="11" fill="#333">中序后继 = BST 中值大于 p.val 的最小节点</text>
</svg>
