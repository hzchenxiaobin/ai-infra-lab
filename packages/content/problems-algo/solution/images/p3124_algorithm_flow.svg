<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：JOIN 补名字 → 窗口排名 → 前三过滤 → 格式化 → 排序输出</text>

  <rect x="50" y="46" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① Calls ⋈ Contacts</text>
  <text x="230" y="84" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">等值连接补 first_name（contact_id = id）</text>
  <text x="470" y="74" font-size="10.5" fill="#999" filter="url(#rough2)">→ 10 行</text>

  <path d="M 230 94 L 230 110" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="112" width="360" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="230" y="132" text-anchor="middle" font-size="11.5" fill="#a06a10" font-weight="bold" filter="url(#rough2)">② RANK() OVER (PARTITION BY type</text>
  <text x="230" y="150" text-anchor="middle" font-size="11.5" fill="#a06a10" font-weight="bold" filter="url(#rough2)">ORDER BY duration DESC) AS rk</text>
  <text x="470" y="138" font-size="10.5" fill="#999" filter="url(#rough2)">→ 10 行带 rk</text>

  <path d="M 230 160 L 230 176" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="178" width="360" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="198" text-anchor="middle" font-size="11.5" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">③ WHERE rk ≤ 3</text>
  <text x="230" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">各组取前三，并列保留（过滤必须在排名之后）</text>
  <text x="470" y="206" font-size="10.5" fill="#999" filter="url(#rough2)">→ 6 行</text>

  <path d="M 230 226 L 230 242" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="244" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="264" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ DATE_FORMAT(SEC_TO_TIME(duration),</text>
  <text x="230" y="282" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">'%H:%i:%s')</text>
  <text x="470" y="272" font-size="10.5" fill="#999" filter="url(#rough2)">→ 秒转 HH:MM:SS</text>

  <path d="M 230 292 L 230 308" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="310" width="360" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="230" y="330" text-anchor="middle" font-size="11.5" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">⑤ ORDER BY type, duration DESC,</text>
  <text x="230" y="348" text-anchor="middle" font-size="11.5" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">first_name DESC</text>
  <text x="470" y="338" font-size="10.5" fill="#999" filter="url(#rough2)">→ 6 行输出</text>

  <rect x="50" y="368" width="480" height="24" fill="none" stroke="none" filter="url(#rough2)"/>
  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 窗口函数在 WHERE 之后才计算——rk ≤ 3 必须写在 CTE 外层</text>
</svg>
