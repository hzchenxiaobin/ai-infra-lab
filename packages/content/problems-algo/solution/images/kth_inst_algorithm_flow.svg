<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c6ade"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：逐位贪心 + 组合数计数</text>

  <!-- Start: precompute C table -->
  <g filter="url(#rough2)">
    <rect x="120" y="44" width="320" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">预计算 C[i][j]（Pascal 表，i≤30）</text>
  <line x1="280" y1="86" x2="280" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <g filter="url(#rough2)">
    <rect x="150" y="112" width="260" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">row, col = destination；res = ""</text>
  <line x1="280" y1="154" x2="280" y2="176" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition -->
  <g filter="url(#rough2)">
    <polygon points="280,178 400,232 280,286 160,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">len(res) &lt;</text>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">row+col ?</text>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#888">未填满</text>

  <!-- No -> return -->
  <line x1="400" y1="232" x2="448" y2="232" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="452" y="208" width="104" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="504" y="230" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">return res</text>
  <text x="504" y="246" text-anchor="middle" font-size="10" fill="#444">第 k 条指令</text>

  <!-- Yes -> col==0? -->
  <line x1="280" y1="286" x2="280" y2="312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="304" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <g filter="url(#rough2)">
    <polygon points="280,314 400,360 280,406 160,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">col == 0 ?</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#888">H 已用尽</text>

  <!-- col==0 yes -> append V -->
  <line x1="160" y1="360" x2="108" y2="360" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="352" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#rough2)">
    <rect x="20" y="386" width="150" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="95" y="408" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">res += 'V'</text>
  <text x="95" y="426" text-anchor="middle" font-size="10.5" fill="#444">row−−</text>
  <text x="95" y="442" text-anchor="middle" font-size="10" fill="#888">k 不变</text>

  <!-- col!=0 -> compute cnt and compare k -->
  <line x1="280" y1="406" x2="280" y2="432" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="424" font-size="10.5" fill="#d6a040" font-weight="bold">否</text>

  <g filter="url(#rough2)">
    <rect x="180" y="434" width="200" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="280" y="459" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">cnt = C[row+col−1][row]</text>

  <!-- compare k vs cnt -->
  <line x1="280" y1="474" x2="280" y2="494" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- two branches: k<=cnt -> H ; k>cnt -> V -->
  <g filter="url(#rough2)">
    <rect x="20" y="496" width="200" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="340" y="496" width="200" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="120" y="518" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k ≤ cnt → res+='H'</text>
  <text x="120" y="535" text-anchor="middle" font-size="10.5" fill="#444">col−−</text>

  <text x="440" y="518" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k &gt; cnt → res+='V'</text>
  <text x="440" y="535" text-anchor="middle" font-size="10.5" fill="#444">k −= cnt；row−−</text>

  <!-- arrows from compare diamond to two branches -->
  <path d="M 280 494 L 120 494 L 120 496" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 494 L 440 494 L 440 496" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- loop back arrows -->
  <path d="M 95 450 Q 30 480 30 232 Q 30 150 158 232" stroke="#9c6ade" stroke-width="1.5" fill="none" marker-end="url(#arrP)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 120 548 Q 8 548 8 232 Q 8 150 158 232" stroke="#9c6ade" stroke-width="1.5" fill="none" marker-end="url(#arrP)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 440 548 Q 552 548 552 232 Q 552 150 402 232" stroke="#9c6ade" stroke-width="1.5" fill="none" marker-end="url(#arrP)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="540" y="200" font-size="10" fill="#9c6ade" font-weight="bold">回</text>
  <text x="540" y="214" font-size="10" fill="#9c6ade" font-weight="bold">到</text>
  <text x="540" y="228" font-size="10" fill="#9c6ade" font-weight="bold">循</text>
  <text x="540" y="242" font-size="10" fill="#9c6ade" font-weight="bold">环</text>
</svg>
