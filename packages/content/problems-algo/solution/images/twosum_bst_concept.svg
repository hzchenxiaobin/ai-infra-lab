<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST + 哈希表：访问节点时查补数 k−val 是否已见过</text>

  <!-- BST -->
  <text x="150" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">BST（升序性质）</text>
  <circle cx="150" cy="86" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="91" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>

  <circle cx="105" cy="146" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="151" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <line x1="139" y1="99" x2="115" y2="133" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="200" cy="146" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="151" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
  <line x1="164" y1="99" x2="190" y2="133" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="75" cy="208" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="213" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <line x1="98" y1="159" x2="83" y2="195" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="135" cy="208" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="213" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <line x1="113" y1="159" x2="128" y2="195" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="230" cy="208" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="213" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>
  <line x1="212" y1="159" x2="225" y2="195" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 当前访问节点高亮 2 -->
  <circle cx="75" cy="208" r="16" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 箭头 -->
  <text x="310" y="148" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">访问</text>
  <path d="M 285 158 L 335 158" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 哈希表 seen -->
  <text x="445" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">seen 哈希表</text>
  <rect x="380" y="72" width="130" height="178" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <rect x="392" y="84" width="106" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="412" y="101" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="465" y="101" text-anchor="middle" font-size="11" fill="#888">✓ 已存</text>

  <rect x="392" y="116" width="106" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="412" y="133" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="465" y="133" text-anchor="middle" font-size="11" fill="#888">✓ 已存</text>

  <rect x="392" y="148" width="106" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="412" y="165" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="465" y="165" text-anchor="middle" font-size="11" fill="#888">✓ 已存</text>

  <rect x="392" y="180" width="106" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="412" y="197" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="465" y="197" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">当前</text>

  <rect x="392" y="212" width="106" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="412" y="229" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <text x="465" y="229" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">补数!</text>

  <!-- 说明 -->
  <rect x="40" y="278" width="520" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="12" fill="#555" font-weight="bold">核心直觉（承接 1.两数之和）：</text>
  <text x="60" y="318" font-size="11" fill="#555">遍历树时，对当前节点 v 查补数 (k − v) 是否在已访问集合中。</text>
  <text x="60" y="335" font-size="11" fill="#555">BST 只是提供了「升序」这一额外结构性质，</text>
  <text x="60" y="349" font-size="11" fill="#555">哈希表法不依赖 BST 性质——任意树形都成立。</text>

  <!-- k=9 标注 -->
  <text x="300" y="395" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">k = 9：访问 2 时查 7 不在，存入；之后访问 7 时查 2 命中 → true</text>
</svg>
