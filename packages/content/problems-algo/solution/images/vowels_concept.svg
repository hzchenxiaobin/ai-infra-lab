<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：元音位置 i 覆盖 (i+1) × (n−i) 个子串</text>

  <!-- Word row -->
  <text x="40" y="78" font-size="12" fill="#888">word =</text>
  <rect x="100" y="60" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="82" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">a</text>
  <rect x="152" y="60" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="204" y="60" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <!-- position labels -->
  <text x="125" y="110" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <text x="177" y="110" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <text x="229" y="110" text-anchor="middle" font-size="10" fill="#888">i=2</text>

  <text x="290" y="82" font-size="12" fill="#888">n = 3</text>

  <!-- focus marker on i=0 -->
  <text x="125" y="44" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">元音 ↓</text>
  <path d="M 125 48 L 125 58" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Left bracket: l ∈ [0, i] -->
  <text x="40" y="150" font-size="12" fill="#4a7a3a" font-weight="bold">左界 l ∈ [0, i]</text>
  <path d="M 100 158 L 100 168 L 150 168 L 150 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="125" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i + 1 = 1 种</text>

  <!-- Right bracket: r ∈ [i, n-1] -->
  <text x="40" y="218" font-size="12" fill="#d6a040" font-weight="bold">右界 r ∈ [i, n−1]</text>
  <path d="M 100 226 L 100 236 L 254 236 L 254 226" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="177" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">n − i = 3 种</text>

  <!-- Formula box -->
  <rect x="360" y="140" width="230" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="475" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">位置 i 的贡献</text>
  <line x1="390" y1="178" x2="560" y2="178" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="475" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= (i + 1) × (n − i)</text>
  <text x="475" y="222" text-anchor="middle" font-size="12" fill="#555">i = 0, n = 3 时：</text>
  <text x="475" y="244" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">= 1 × 3 = 3 ⭐</text>

  <!-- multiply arrow from brackets to formula -->
  <path d="M 270 180 Q 320 180 360 195" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 270 244 Q 320 244 360 230" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Covered substrings -->
  <text x="40" y="300" font-size="12" fill="#666" font-weight="bold">i=0 这个 'a' 被以下 3 个子串各计一次：</text>
  <rect x="60" y="312" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="100" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"a"</text>
  <text x="100" y="356" text-anchor="middle" font-size="9" fill="#888">l=0, r=0</text>

  <rect x="170" y="312" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="210" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"ab"</text>
  <text x="210" y="356" text-anchor="middle" font-size="9" fill="#888">l=0, r=1</text>

  <rect x="280" y="312" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="320" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"aba"</text>
  <text x="320" y="356" text-anchor="middle" font-size="9" fill="#888">l=0, r=2</text>

  <text x="400" y="332" font-size="13" fill="#b85450" font-weight="bold">→ 贡献 3</text>

  <!-- key insight box -->
  <rect x="50" y="380" width="520" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="402" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：元音属性固定，重复也算多次 → 贡献就是朴素的「包含位置 i 的子串数」</text>
  <text x="310" y="418" text-anchor="middle" font-size="10" fill="#555">无需像 828 题那样找左右最近同字符夹紧范围</text>
</svg>
