<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：x | (x+1) 只改动一个位——把 x 的最低 0 位「点亮」</text>
  <text x="310" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">以 x = 9 = (1001)₂ 为例：末尾 1 个 1（t = 1），最低 0 位是 bit1</text>

  <!-- 左：具体例子 -->
  <rect x="22" y="54" width="330" height="212" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="187" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">具体例子：9 | 10 = 11</text>

  <!-- row 1: x = 1001 -->
  <text x="64" y="103" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">x</text>
  <rect x="72" y="84" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="89" y="103" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="112" y="84" width="34" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="103" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="152" y="84" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="103" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="192" y="84" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="103" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="238" y="99" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">bit1 = 0</text>
  <text x="238" y="111" font-size="8.5" fill="#b85450" filter="url(#rough2)">x 的最低 0 位</text>

  <!-- row 2: x+1 = 1010 -->
  <text x="64" y="147" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">x+1</text>
  <rect x="72" y="128" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="89" y="147" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="112" y="128" width="34" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="147" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="152" y="128" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="147" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="192" y="128" width="34" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="147" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="238" y="143" font-size="8.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">进位链：1→0</text>
  <text x="238" y="155" font-size="8.5" fill="#8a6d1a" filter="url(#rough2)">紧邻的 0→1</text>

  <!-- row 3: OR = 1011 -->
  <text x="64" y="191" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">OR</text>
  <rect x="72" y="172" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="89" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="112" y="172" width="34" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="191" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="152" y="172" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="191" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="192" y="172" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="191" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="238" y="187" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">bit1：0→1</text>
  <text x="238" y="199" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">被点亮！</text>

  <!-- bit labels -->
  <text x="89" y="216" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit3</text>
  <text x="129" y="216" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit2</text>
  <text x="169" y="216" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit1</text>
  <text x="209" y="216" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit0</text>

  <!-- bit1 列虚线高亮 -->
  <rect x="148" y="80" width="42" height="126" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>

  <!-- 右：三步看懂 -->
  <rect x="368" y="54" width="230" height="212" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="483" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">三步看懂</text>
  <text x="382" y="96" font-size="9.5" fill="#444" filter="url(#rough2)">① x 的末尾必然形如</text>
  <text x="392" y="112" font-size="9.5" fill="#444" filter="url(#rough2)">「0 后跟 t 个连续 1」</text>
  <text x="382" y="134" font-size="9.5" fill="#444" filter="url(#rough2)">② x+1 进位：t 个 1 全变 0，</text>
  <text x="392" y="150" font-size="9.5" fill="#444" filter="url(#rough2)">紧邻第 t 位的 0 变 1</text>
  <text x="382" y="172" font-size="9.5" fill="#444" filter="url(#rough2)">③ OR 后：低位 1 不丢，第 t 位</text>
  <text x="392" y="188" font-size="9.5" fill="#444" filter="url(#rough2)">取 x+1 的 1 ⇒ 只变这一位</text>
  <text x="483" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">∴ y = x + 2^t</text>
  <text x="483" y="230" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（与 x 只差一个 2 的幂）</text>

  <!-- 中：通用模式 -->
  <rect x="22" y="280" width="576" height="112" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="298" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">通用模式（H = 更高位部分，全程不变；t = x 末尾连续 1 的个数）</text>

  <text x="50" y="322" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">x</text>
  <rect x="58" y="306" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">H</text>
  <rect x="130" y="306" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="164" y="306" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="322" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="198" y="306" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="322" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="232" y="306" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="322" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="276" y="322" font-size="9" fill="#8a6d1a" filter="url(#rough2)">← 末尾 t 个 1</text>

  <text x="50" y="350" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">x+1</text>
  <rect x="58" y="334" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="350" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">H</text>
  <rect x="130" y="334" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="350" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="164" y="334" width="30" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="179" y="350" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="198" y="334" width="30" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="213" y="350" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="232" y="334" width="30" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="247" y="350" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="276" y="350" font-size="9" fill="#8a6d1a" filter="url(#rough2)">← 进位翻转低位</text>

  <text x="50" y="378" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">OR</text>
  <rect x="58" y="362" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="378" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">H</text>
  <rect x="130" y="362" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="378" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="164" y="362" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="378" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="198" y="362" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="378" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="232" y="362" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="378" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="276" y="378" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">← 只有第 t 位被点亮</text>

  <!-- 底：结论 -->
  <rect x="22" y="404" width="576" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="424" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逆向：x = y − 2^k（k 须满足 y 的第 k 位为 1 且更低位全为 1）</text>
  <text x="310" y="442" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">最小化 ⟺ 取最大的 k = t−1：清掉「末尾连续 1」的最高一个；y 为偶数（t = 0）⟹ 无解，返回 −1</text>
</svg>
