<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 的 Trie：实线 = 边（字符），虚线 = fail 指针</text>

  <!-- Trie 实线边（先画，节点后覆盖） -->
  <line x1="44" y1="205" x2="136" y2="95" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="138" font-size="11" fill="#666" filter="url(#rough2)">a</text>
  <line x1="44" y1="205" x2="136" y2="205" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="198" font-size="11" fill="#666" filter="url(#rough2)">d</text>
  <line x1="44" y1="205" x2="136" y2="315" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="272" font-size="11" fill="#666" filter="url(#rough2)">e</text>
  <line x1="136" y1="95" x2="228" y2="62" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="178" y="70" font-size="11" fill="#666" filter="url(#rough2)">b</text>
  <line x1="228" y1="62" x2="320" y2="40" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="44" font-size="11" fill="#666" filter="url(#rough2)">c</text>
  <line x1="228" y1="62" x2="320" y2="92" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="88" font-size="11" fill="#666" filter="url(#rough2)">d</text>
  <line x1="320" y1="92" x2="412" y2="92" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="366" y="86" font-size="11" fill="#666" filter="url(#rough2)">e</text>
  <line x1="412" y1="92" x2="502" y2="92" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="457" y="86" font-size="11" fill="#666" filter="url(#rough2)">f</text>
  <line x1="136" y1="205" x2="228" y2="168" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="178" y="180" font-size="11" fill="#666" filter="url(#rough2)">e</text>
  <line x1="228" y1="168" x2="320" y2="168" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="274" y="162" font-size="11" fill="#666" filter="url(#rough2)">f</text>
  <line x1="136" y1="315" x2="228" y2="315" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="308" font-size="11" fill="#666" filter="url(#rough2)">f</text>

  <!-- fail 虚线（红） -->
  <path d="M309,103 Q180,190 147,200" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="196" font-size="10" fill="#b85450" filter="url(#rough2)">fail</text>
  <path d="M401,103 Q330,240 243,174" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="222" font-size="10" fill="#b85450" filter="url(#rough2)">fail</text>
  <path d="M490,104 Q420,250 332,178" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="228" font-size="10" fill="#b85450" filter="url(#rough2)">fail</text>
  <path d="M216,178 Q150,240 147,303" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="252" font-size="10" fill="#b85450" filter="url(#rough2)">fail</text>
  <!-- def → ef：fail 同时是 dict（最近单词终点），加粗橙色 -->
  <path d="M308,178 Q250,250 239,303" fill="none" stroke="#d6a040" stroke-width="2.6" stroke-dasharray="7,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="238" y="252" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">fail+dict</text>

  <!-- Trie 节点 -->
  <ellipse cx="44" cy="205" rx="26" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="44" y="209" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">root</text>

  <ellipse cx="136" cy="95" rx="11" ry="14" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>

  <ellipse cx="136" cy="205" rx="11" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="136" y="209" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d</text>
  <text x="136" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥1</text>

  <ellipse cx="136" cy="315" rx="11" ry="14" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>

  <ellipse cx="228" cy="62" rx="16" ry="14" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="228" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ab</text>

  <ellipse cx="228" cy="168" rx="16" ry="14" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="228" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">de</text>

  <ellipse cx="228" cy="315" rx="16" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="228" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ef</text>
  <text x="228" y="342" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥5</text>

  <ellipse cx="320" cy="40" rx="19" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abc</text>
  <text x="320" y="22" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥1</text>

  <ellipse cx="320" cy="92" rx="19" ry="14" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abd</text>

  <ellipse cx="412" cy="92" rx="22" ry="14" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="412" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abde</text>

  <ellipse cx="502" cy="92" rx="27" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="502" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abdef</text>
  <text x="502" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥100</text>

  <ellipse cx="320" cy="168" rx="19" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="320" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">def</text>
  <text x="356" y="160" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥10</text>

  <!-- 底部图例 -->
  <rect x="40" y="352" width="520" height="40" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">fail = 当前串的「最长真后缀，且也是某单词的前缀」；未画出的 fail（a、ab、abc、d、e、ef）都指回 root</text>
  <text x="300" y="384" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dict = fail 链上最近的单词终点（def → ef 这条同时是 fail 与 dict，扫描时靠它白捡 ef）</text>
</svg>
