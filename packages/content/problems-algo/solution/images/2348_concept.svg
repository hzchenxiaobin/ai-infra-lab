<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：长度为 k 的连续 0 段贡献 k(k+1)/2 个全 0 子数组</text>

  <!-- Left labels -->
  <text x="30" y="62" font-size="11" fill="#888" font-weight="bold">下标</text>
  <text x="30" y="98" font-size="11" fill="#888" font-weight="bold">值</text>
  <text x="30" y="164" font-size="11" fill="#d6a040" font-weight="bold">新增</text>
  <text x="30" y="220" font-size="11" fill="#4a7a3a" font-weight="bold">累计</text>

  <!-- nums row: a run of k=4 zeros -->
  <text x="148" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="218" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="288" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="358" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>

  <rect x="116" y="70" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="186" y="70" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="256" y="70" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="326" y="70" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <text x="412" y="96" font-size="11" fill="#4a7a3a" font-weight="bold">← 连续 0 段 (k=4)</text>

  <!-- 新增 row: 1, 2, 3, 4 -->
  <rect x="116" y="138" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="148" y="161" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="186" y="138" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="218" y="161" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="256" y="138" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="288" y="161" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="326" y="138" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="358" y="161" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>

  <text x="412" y="160" font-size="10" fill="#888">以该位置结尾的全0子数组数</text>

  <!-- arrows from nums to 新增 -->
  <path d="M 148 116 L 148 136" stroke="#aaa" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 116 L 218 136" stroke="#aaa" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 288 116 L 288 136" stroke="#aaa" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 358 116 L 358 136" stroke="#aaa" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 累计 row: 1, 3, 6, 10 -->
  <rect x="116" y="194" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="148" y="217" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="186" y="194" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="218" y="217" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="256" y="194" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="288" y="217" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="326" y="194" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="358" y="217" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- running-sum arrows between 累计 chips -->
  <path d="M 184 211 L 186 211" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 254 211 L 256 211" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 324 211 L 326 211" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="120" y="246" width="340" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">1 + 2 + 3 + 4 = 10  =  4×5/2</text>
  <text x="290" y="288" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">即  Σ j = k(k+1)/2 （三角数 T_k）</text>

  <!-- bottom callout -->
  <rect x="20" y="318" width="540" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="340" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">把数组按非零元素切成若干「连续 0 段」，每段独立贡献 k(k+1)/2</text>
  <text x="290" y="358" text-anchor="middle" font-size="11" fill="#666">全数组答案 = 各段贡献之和；无需真正切段，一次遍历维护 cur 即可</text>
</svg>
