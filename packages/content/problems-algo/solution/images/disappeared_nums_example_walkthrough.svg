<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4, 3, 2, 7, 8, 2, 3, 1]，n = 8</text>

  <!-- index labels -->
  <text x="80" y="58" text-anchor="middle" font-size="9.5" fill="#aaa">下标</text>
  <text x="80" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">值</text>

  <!-- helper: draw a cell -->
  <!-- Initial state -->
  <text x="36" y="96" font-size="11" fill="#888" font-weight="bold">初始</text>
  <!-- index row -->
  <text x="80" y="86" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="120" y="86" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="160" y="86" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="200" y="86" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="240" y="86" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="280" y="86" text-anchor="middle" font-size="9" fill="#bbb">5</text>
  <text x="320" y="86" text-anchor="middle" font-size="9" fill="#bbb">6</text>
  <text x="360" y="86" text-anchor="middle" font-size="9" fill="#bbb">7</text>

  <rect x="60" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="140" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="220" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="260" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="340" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- arrow down -->
  <path d="M 270 130 L 270 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 1: i=0, v=4, mark index 3 -->
  <text x="36" y="174" font-size="10.5" fill="#d6a040" font-weight="bold">i=0</text>
  <text x="36" y="188" font-size="10" fill="#888">v=4</text>
  <!-- arrow from value 4 (index 0) to mark index 3 -->
  <path d="M 80 160 Q 140 156 200 160" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="60" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="140" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="168" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="191" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−7</text>
  <rect x="220" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="260" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="340" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <path d="M 270 206 L 270 222" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 4: i=3, v=7, mark index 6 -->
  <text x="36" y="250" font-size="10.5" fill="#d6a040" font-weight="bold">i=3</text>
  <text x="36" y="264" font-size="10" fill="#888">v=7</text>
  <path d="M 200 236 Q 260 232 320 236" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="60" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="244" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="267" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>
  <rect x="140" y="244" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="267" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <rect x="180" y="244" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="267" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−7</text>
  <rect x="220" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="260" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="244" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="267" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>
  <rect x="340" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <path d="M 270 282 L 270 298" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- After all marking -->
  <text x="36" y="326" font-size="10.5" fill="#888" font-weight="bold">标记</text>
  <text x="36" y="340" font-size="10" fill="#888">完成</text>

  <rect x="60" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−4</text>
  <rect x="100" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>
  <rect x="140" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <rect x="180" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−7</text>
  <rect x="220" y="320" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="343" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">8</text>
  <rect x="260" y="320" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <rect x="300" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>
  <rect x="340" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>

  <!-- arrows pointing to the two positive cells -->
  <path d="M 240 362 L 240 380" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 280 362 L 280 380" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result -->
  <text x="410" y="338" font-size="11" fill="#4a7a3a" font-weight="bold">仍为正</text>
  <text x="410" y="352" font-size="10.5" fill="#555">→ 缺失!</text>

  <rect x="170" y="388" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="406" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">nums[4] > 0 → 5 缺失</text>
  <text x="270" y="422" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">nums[5] > 0 → 6 缺失</text>

  <text x="270" y="448" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">结果 = [5, 6] ✓</text>
</svg>
