<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "XXOX"（长度 4）</text>

  <!-- Step 1 label -->
  <text x="28" y="58" font-size="11" fill="#d6a040" font-weight="bold">步骤①</text>
  <text x="28" y="74" font-size="10" fill="#888">i=0, ans=0</text>

  <!-- String row 1: X X O X, highlight i=0 -->
  <rect x="80" y="44" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="70" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">X</text>
  <rect x="130" y="44" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="70" text-anchor="middle" font-size="16" fill="#b85450">X</text>
  <rect x="180" y="44" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="70" text-anchor="middle" font-size="16" fill="#4a7a3a">O</text>
  <rect x="230" y="44" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="70" text-anchor="middle" font-size="16" fill="#b85450">X</text>

  <!-- Position labels -->
  <text x="102" y="96" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="152" y="96" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="202" y="96" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="252" y="96" text-anchor="middle" font-size="9" fill="#999">3</text>

  <!-- Window bracket [0,1,2] -->
  <rect x="76" y="100" width="152" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="152" y="116" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">窗口 [0,1,2] → ans=1, i=3</text>

  <!-- Arrow down -->
  <path d="M 260 92 L 260 130" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <text x="28" y="158" font-size="11" fill="#d6a040" font-weight="bold">步骤②</text>
  <text x="28" y="174" font-size="10" fill="#888">i=3, ans=1</text>

  <!-- String row 2: O O O X (after op1), highlight i=3 -->
  <rect x="80" y="144" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="170" text-anchor="middle" font-size="16" fill="#4a7a3a">O</text>
  <rect x="130" y="144" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="170" text-anchor="middle" font-size="16" fill="#4a7a3a">O</text>
  <rect x="180" y="144" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="170" text-anchor="middle" font-size="16" fill="#4a7a3a">O</text>
  <rect x="230" y="144" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="170" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">X</text>

  <text x="102" y="196" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="152" y="196" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="202" y="196" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="252" y="196" text-anchor="middle" font-size="9" fill="#999">3 ←</text>

  <!-- Window bracket covering i=3 -->
  <rect x="126" y="200" width="152" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="202" y="216" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">覆盖 i=3 → ans=2, i=6</text>

  <!-- Arrow down -->
  <path d="M 260 224 L 260 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="244" font-size="10" fill="#888">i=6 ≥ n=4 → 结束</text>

  <!-- Final result -->
  <text x="28" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">结果</text>
  <rect x="80" y="262" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="288" text-anchor="middle" font-size="16" fill="#4a7a3a">O</text>
  <rect x="130" y="262" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="288" text-anchor="middle" font-size="16" fill="#4a7a3a">O</text>
  <rect x="180" y="262" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="288" text-anchor="middle" font-size="16" fill="#4a7a3a">O</text>
  <rect x="230" y="262" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="288" text-anchor="middle" font-size="16" fill="#4a7a3a">O</text>

  <text x="300" y="288" font-size="13" fill="#4a7a3a" font-weight="bold">全 O ✓ ans = 2</text>

  <!-- Summary table -->
  <rect x="40" y="312" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#555">步骤①：i=0 遇 X → 窗口 [0,1,2]，ans=1，跳到 i=3</text>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#555">步骤②：i=3 遇 X → 覆盖 i=3，ans=2，跳到 i=6 ≥ n → 结束</text>
</svg>
