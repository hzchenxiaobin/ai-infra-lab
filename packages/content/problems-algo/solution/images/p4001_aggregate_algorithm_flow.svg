<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：双指针归并，一趟输出</text>

  <g filter="url(#rough2)">
    <text x="132" y="52" text-anchor="end" font-size="9" fill="#777">ans = [] · 循环至多 n+m 轮</text>

    <rect x="140" y="32" width="120" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="200" y="51" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">i = 0, j = 0</text>
    <path d="M 200 62 L 200 74" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <polygon points="200,80 274,110 200,140 126,110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="200" y="114" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">i &lt; n 或 j &lt; m ？</text>

    <text x="287" y="103" text-anchor="middle" font-size="9" fill="#8a3030">否</text>
    <path d="M 274 110 L 296 110" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>
    <rect x="300" y="94" width="110" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="355" y="114" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">return ans</text>

    <text x="210" y="156" text-anchor="middle" font-size="9" fill="#444">是</text>
    <path d="M 200 140 L 200 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <rect x="105" y="162" width="190" height="34" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="200" y="183" text-anchor="middle" font-size="10" fill="#333">t = min(t1, t2)，耗尽方取 +∞</text>
    <path d="M 200 196 L 200 210" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <rect x="100" y="214" width="200" height="34" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="200" y="235" text-anchor="middle" font-size="10" fill="#333">v1 = s1[i][1]（i 耗尽则 0）；v2 同理</text>
    <path d="M 200 248 L 200 260" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <rect x="105" y="264" width="190" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="200" y="285" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">ans 追加 [t, v1 + v2]</text>
    <path d="M 200 298 L 200 312" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <rect x="100" y="316" width="200" height="34" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="200" y="337" text-anchor="middle" font-size="10" fill="#333">t == t1 则 i++；t == t2 则 j++</text>

    <path d="M 100 333 L 62 333 L 62 110 L 122 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <rect x="330" y="166" width="212" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="436" y="188" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">为什么不用区分「命中/缺失」？</text>
    <text x="436" y="210" text-anchor="middle" font-size="9.5" fill="#555">s1[i].ts &gt; t ⇒ s1[i] 正是 t 的</text>
    <text x="436" y="224" text-anchor="middle" font-size="9.5" fill="#555">「下一个更晚」，填充值就是它</text>
    <text x="436" y="246" text-anchor="middle" font-size="9.5" fill="#555">s1[i].ts == t ⇒ 精确命中</text>
    <text x="436" y="268" text-anchor="middle" font-size="9.5" fill="#8a3030" font-weight="bold">两种情况 v1 都 = s1[i][1]</text>
    <text x="436" y="290" text-anchor="middle" font-size="9.5" fill="#555">分支只出现在「是否推进」</text>
    <text x="436" y="308" text-anchor="middle" font-size="9.5" fill="#555">i == n ⇒ 再无更晚 ⇒ 取 0</text>

    <text x="280" y="405" text-anchor="middle" font-size="10" fill="#555">每轮至少推进一个指针 ⇒ O(n + m)</text>
  </g>
</svg>
