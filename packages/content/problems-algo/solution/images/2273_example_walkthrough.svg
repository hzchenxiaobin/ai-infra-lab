<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：words = ["abba","baba","bbaa","cd","cd"]</text>
  <text x="290" y="42" text-anchor="middle" font-size="10.5" fill="#888">prevSig 始终为「最后一个保留者」的 σ，与上一保留者比对决定去留</text>

  <!-- ====== Step 0 : init ====== -->
  <rect x="40" y="56" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="74" font-size="11" fill="#446688" font-weight="bold">初始</text>
  <text x="56" y="90" font-size="10.5" fill="#333">res = ["abba"]，prevSig = σ("abba") = "aabb"</text>
  <text x="524" y="86" text-anchor="end" font-size="10" fill="#888">保留 words[0]</text>

  <!-- ====== Step table header ====== -->
  <rect x="40" y="110" width="40" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="128" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">i</text>
  <rect x="80" y="110" width="100" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="128" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">words[i]</text>
  <rect x="180" y="110" width="90" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="225" y="128" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">sig</text>
  <rect x="270" y="110" width="90" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="128" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">prevSig</text>
  <rect x="360" y="110" width="70" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="395" y="128" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">判定</text>
  <rect x="430" y="110" width="110" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="485" y="128" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">res</text>

  <!-- row i=1 -->
  <rect x="40" y="136" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="136" width="100" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="156" text-anchor="middle" font-size="11" fill="#333">baba</text>
  <rect x="180" y="136" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="225" y="156" text-anchor="middle" font-size="11" fill="#333">aabb</text>
  <rect x="270" y="136" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="156" text-anchor="middle" font-size="11" fill="#333">aabb</text>
  <rect x="360" y="136" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="395" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过</text>
  <rect x="430" y="136" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="485" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[abba]</text>

  <!-- row i=2 -->
  <rect x="40" y="166" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="80" y="166" width="100" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="186" text-anchor="middle" font-size="11" fill="#333">bbaa</text>
  <rect x="180" y="166" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="225" y="186" text-anchor="middle" font-size="11" fill="#333">aabb</text>
  <rect x="270" y="166" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="186" text-anchor="middle" font-size="11" fill="#333">aabb</text>
  <rect x="360" y="166" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="395" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过</text>
  <rect x="430" y="166" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="485" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[abba]</text>

  <!-- row i=3 -->
  <rect x="40" y="196" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="80" y="196" width="100" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="216" text-anchor="middle" font-size="11" fill="#333">cd</text>
  <rect x="180" y="196" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="225" y="216" text-anchor="middle" font-size="11" fill="#333">cd</text>
  <rect x="270" y="196" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="216" text-anchor="middle" font-size="11" fill="#333">aabb</text>
  <rect x="360" y="196" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="395" y="216" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">保留</text>
  <rect x="430" y="196" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="485" y="216" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[abba,cd]</text>

  <!-- row i=4 -->
  <rect x="40" y="226" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="80" y="226" width="100" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="246" text-anchor="middle" font-size="11" fill="#333">cd</text>
  <rect x="180" y="226" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="225" y="246" text-anchor="middle" font-size="11" fill="#333">cd</text>
  <rect x="270" y="226" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="246" text-anchor="middle" font-size="11" fill="#333">cd</text>
  <rect x="360" y="226" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="395" y="246" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过</text>
  <rect x="430" y="226" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="485" y="246" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[abba,cd]</text>

  <!-- result -->
  <rect x="40" y="266" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="285" font-size="11" fill="#446688" font-weight="bold">结果</text>
  <text x="60" y="300" font-size="11.5" fill="#333" font-weight="bold">res = ["abba","cd"]  ✓</text>
  <text x="524" y="292" text-anchor="end" font-size="10" fill="#888">两个 σ 连续段各留首个</text>

  <!-- ====== Key notes ====== -->
  <rect x="40" y="322" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="342" font-size="10.5" fill="#333" font-weight="bold">关键点：</text>
  <text x="56" y="358" font-size="10" fill="#333">• i=1、2 与 prevSig="aabb" 相同 → 跳过；段 1 仅留 "abba"</text>
  <text x="56" y="372" font-size="10" fill="#333">• i=3 σ 变 "cd"，与 "aabb" 不同 → 保留并更新 prevSig="cd"；i=4 与之相同 → 跳过</text>

  <!-- footer -->
  <rect x="40" y="392" width="500" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="412" font-size="10.5" fill="#b85450" font-weight="bold">对照：若误与原 words[i−1] 比对（而非 res[-1]），跨段边界会判错。</text>
  <text x="56" y="428" font-size="10" fill="#666">必须与「上一保留者」比，因被删者已不在序列中，prevSig 是真正的左邻签名。</text>
</svg>
