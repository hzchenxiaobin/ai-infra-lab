<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：三层循环填 DP 表</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">外层逐枚骰子 → 中层逐个目标和 → 内层逐个面值累加</text>

  <!-- Step 1: Init -->
  <rect x="180" y="62" width="160" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">初始化 dp[0][0] = 1，其余 = 0</text>
  <path d="M 260 100 L 260 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: outer loop i -->
  <rect x="160" y="118" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="11" fill="#2a3f55" font-weight="bold">for i = 1 to n</text>
  <text x="260" y="148" text-anchor="middle" font-size="10" fill="#6688aa">逐枚骰子（外层循环）</text>
  <path d="M 260 156 L 260 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: middle loop j -->
  <rect x="160" y="174" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="191" text-anchor="middle" font-size="11" fill="#2d4d22" font-weight="bold">for j = 1 to target</text>
  <text x="260" y="204" text-anchor="middle" font-size="10" fill="#5a8a5a">逐个目标和（中层循环）</text>
  <path d="M 260 212 L 260 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: inner loop f -->
  <rect x="120" y="230" width="280" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="11" fill="#7a3a38" font-weight="bold">for f = 1 to min(k, j)</text>
  <text x="260" y="260" text-anchor="middle" font-size="10" fill="#a05a5a">逐个面值（内层循环），j-f ≥ 0 剪枝</text>
  <path d="M 260 268 L 260 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: accumulate -->
  <rect x="80" y="286" width="360" height="36" fill="#f6f6f6" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[i][j] = (dp[i][j] + dp[i-1][j-f]) % MOD</text>

  <!-- loop back arrows -->
  <path d="M 420 304 Q 460 304 460 248 L 400 248" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="278" font-size="9" fill="#b85450">f++</text>

  <path d="M 360 192 Q 400 192 400 136 L 360 136" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="168" font-size="9" fill="#4a7a3a">j++</text>

  <path d="M 360 136 Q 420 120 420 90 L 340 80" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="108" font-size="9" fill="#446688">i++</text>

  <!-- return -->
  <path d="M 180 304 Q 80 304 80 200 Q 80 80 180 80" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="200" font-size="10" fill="#a07820" font-weight="bold">返回</text>
  <text x="40" y="214" font-size="10" fill="#a07820">dp[n][target]</text>
</svg>
