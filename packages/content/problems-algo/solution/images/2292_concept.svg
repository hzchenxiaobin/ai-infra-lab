<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两阶段：聚合筛达标年 → 找相邻年差=1 的配对</text>

  <!-- ===== Step 1: Orders raw ===== -->
  <text x="40" y="48" font-size="10" fill="#888">① FROM Orders</text>
  <rect x="34" y="54" width="250" height="104" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="159" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Orders 表（节选）</text>
  <line x1="34" y1="76" x2="284" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="46" y="90" font-size="9" fill="#888">oid pid qty  date</text>
  <text x="46" y="104" font-size="9" fill="#4a7a3a">#1  1   7   2020</text>
  <text x="46" y="118" font-size="9" fill="#4a7a3a">#2  1   4   2020</text>
  <text x="46" y="132" font-size="9" fill="#4a7a3a">#3  1   7   2020</text>
  <text x="46" y="146" font-size="8" fill="#999">...7 行，quantity 是干扰列</text>

  <!-- Arrow 1 -->
  <path d="M 159 160 L 159 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: GROUP BY + HAVING ===== -->
  <text x="40" y="190" font-size="10" fill="#888">②③ 聚合 + 过滤</text>
  <rect x="24" y="196" width="270" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="159" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">GROUP BY product_id, YEAR(date)</text>
  <text x="159" y="228" text-anchor="middle" font-size="9" fill="#555">COUNT(*) AS cnt</text>
  <text x="159" y="244" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">HAVING COUNT(*) &gt;= 3</text>

  <!-- Arrow 2 -->
  <path d="M 159 254 L 159 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: 达标年表 ===== -->
  <text x="40" y="284" font-size="10" fill="#888">达标年表（cnt≥3 的组）</text>
  <rect x="34" y="290" width="250" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="159" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">yearly</text>
  <line x1="34" y1="312" x2="284" y2="312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="326" font-size="9" fill="#888">prod year  cnt</text>
  <text x="50" y="340" font-size="9" fill="#4a7a3a">1    2020  3 ✓</text>
  <text x="50" y="354" font-size="9" fill="#4a7a3a">1    2021  3 ✓</text>
  <text x="50" y="366" font-size="8" fill="#b85450">2    2022  1 ✗ 丢弃</text>

  <!-- Arrow 3 -->
  <path d="M 159 370 L 159 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: self-join ===== -->
  <text x="40" y="400" font-size="10" fill="#888">④ 自连接</text>
  <rect x="24" y="406" width="270" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="159" y="424" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">JOIN yearly b ON a.yr = b.yr − 1</text>
  <text x="159" y="440" text-anchor="middle" font-size="9" fill="#555">同产品 + 相邻年（差恰好 1）</text>
  <text x="159" y="454" text-anchor="middle" font-size="8" fill="#888">2020 与 2021 配对成功 → 命中</text>

  <!-- ===== Right: consecutive pair viz + output ===== -->
  <!-- pair labels -->
  <text x="380" y="298" font-size="10" fill="#888">相邻年配对判定</text>
  <rect x="320" y="304" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="322" font-size="11" fill="#4a7a3a" font-weight="bold">2020</text>
  <text x="420" y="322" font-size="9" fill="#888">→</text>
  <text x="460" y="322" font-size="11" fill="#4a7a3a" font-weight="bold">2021</text>
  <text x="420" y="336" text-anchor="middle" font-size="8" fill="#4a7a3a">差=1 ✓ 命中</text>

  <rect x="320" y="354" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="372" font-size="11" fill="#b85450" font-weight="bold">2020</text>
  <text x="420" y="372" font-size="9" fill="#888">→</text>
  <text x="460" y="372" font-size="11" fill="#b85450" font-weight="bold">2022</text>
  <text x="420" y="386" text-anchor="middle" font-size="8" fill="#b85450">差=2 ✗ 不相邻</text>

  <!-- output -->
  <path d="M 294 434 L 318 392" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="416" font-size="10" fill="#888">输出</text>
  <rect x="340" y="422" width="140" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="438" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">product_id</text>
  <text x="410" y="454" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
</svg>
