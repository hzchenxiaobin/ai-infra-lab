<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：每轮一次「删旧 + 插新」，尾部即答案</text>

  <!-- start -->
  <rect x="185" y="38" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="250" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 0 … n−1</text>
  <path d="M 250 68 L 250 88" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- compute old/new -->
  <rect x="140" y="92" width="220" height="40" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="109" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">id = nums[i]，f = freq[i]</text>
  <text x="250" y="125" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">old = cnt[id]，new = old + f</text>
  <path d="M 250 132 L 250 150" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="188,186 250,154 312,186 250,218" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="191" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">old &gt; 0 ?</text>

  <path d="M 312 186 L 358 186" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="362" y="164" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="432" y="182" text-anchor="middle" font-size="11" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">从 ms 删除一个 old</text>
  <text x="432" y="198" text-anchor="middle" font-size="10" fill="#3a5a2e" filter="url(#rough2)">erase(ms.find(old))</text>
  <path d="M 432 208 L 432 228 L 256 228" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 250 218 L 250 238" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="234" font-size="10.5" fill="#888" filter="url(#rough2)">否（首次出现），跳过删除</text>

  <!-- diamond 2 -->
  <polygon points="188,274 250,242 312,274 250,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="279" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">new &gt; 0 ?</text>

  <path d="M 312 274 L 358 274" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="266" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="362" y="252" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="432" y="270" text-anchor="middle" font-size="11" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">把 new 插入 ms</text>
  <text x="432" y="286" text-anchor="middle" font-size="10" fill="#3a5a2e" filter="url(#rough2)">ms.insert(new)</text>
  <path d="M 432 296 L 432 316 L 256 316" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 250 306 L 250 322" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="318" font-size="10.5" fill="#888" filter="url(#rough2)">否（被删空），不插入</text>

  <!-- update cnt -->
  <rect x="185" y="326" width="130" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="346" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">cnt[id] ← new</text>
  <path d="M 250 356 L 250 372" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="130" y="376" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="399" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans[i] ← ms 空 ? 0 : *ms.rbegin()</text>

  <!-- loop back -->
  <path d="M 370 394 L 404 394 L 404 53 L 318 53" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="418" y="230" font-size="10.5" fill="#b85450" filter="url(#rough2)" transform="rotate(90 418 230)">下一轮，每轮 O(log n)</text>
</svg>
