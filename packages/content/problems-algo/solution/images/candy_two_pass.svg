<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">两次单向遍历：各管一侧约束，取 max 合并</text>

  <!-- 7 boxes per row: x=60,124,188,252,316,380,444 ; w=56 ; centers 88,152,216,280,344,408,472 -->

  <!-- index axis -->
  <text x="88"  y="58" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="152" y="58" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="216" y="58" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="280" y="58" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="344" y="58" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="408" y="58" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>
  <text x="472" y="58" text-anchor="middle" font-size="9.5" fill="#aaa">6</text>

  <!-- ratings row -->
  <text x="18" y="88" font-size="11" fill="#888">ratings</text>
  <rect x="60"  y="70" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88"  y="90" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="124" y="70" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="90" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="188" y="70" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="216" y="90" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="252" y="70" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="316" y="70" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="344" y="90" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="380" y="70" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="90" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="444" y="70" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="472" y="90" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- left pass direction arrow -->
  <path d="M 60 124 L 494 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="10.5" fill="#446688">左→右：r[i]&gt;r[i−1] ⇒ left[i]=left[i−1]+1，否则 1</text>

  <!-- left row -->
  <text x="18" y="158" font-size="11" fill="#446688" font-weight="bold">left[]</text>
  <rect x="60"  y="142" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88"  y="162" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="124" y="142" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="162" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="188" y="142" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="252" y="142" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="316" y="142" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="162" text-anchor="middle" font-size="12" fill="#b85450">1</text>
  <rect x="380" y="142" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="162" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="444" y="142" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="472" y="162" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- right pass direction arrow -->
  <path d="M 500 204 L 66 204" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="10.5" fill="#b85450">右→左：r[i]&gt;r[i+1] ⇒ right[i]=right[i+1]+1，否则 1</text>

  <!-- right row -->
  <text x="18" y="238" font-size="11" fill="#b85450" font-weight="bold">right[]</text>
  <rect x="60"  y="222" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88"  y="242" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="124" y="222" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="242" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="188" y="222" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="242" text-anchor="middle" font-size="12" fill="#b85450">1</text>
  <rect x="252" y="222" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="316" y="222" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="242" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="380" y="222" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="242" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="444" y="222" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="472" y="242" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- merge arrows from left & right into candy (at idx2 and idx4) -->
  <path d="M 216 176 Q 216 286 216 300" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="2 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 216 256 Q 216 280 216 300" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="2 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 344 176 Q 344 286 344 300" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="2 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 344 256 Q 344 280 344 300" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="2 3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- candy row -->
  <text x="18" y="322" font-size="11" fill="#4a7a3a" font-weight="bold">candy[]</text>
  <rect x="60"  y="306" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88"  y="326" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="124" y="306" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="326" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="188" y="306" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="326" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <rect x="252" y="306" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="316" y="306" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="326" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <rect x="380" y="306" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="326" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="444" y="306" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="472" y="326" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- max callouts -->
  <text x="216" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a">max(3,1)=3</text>
  <text x="344" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a">max(1,3)=3</text>

  <!-- legend -->
  <rect x="60" y="366" width="440" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="383" text-anchor="middle" font-size="10.5" fill="#666">虚线红框 = 单向遍历在该处偏小（不够另一侧约束）；取 max 后恰好补足，总和最小 = 13</text>
</svg>
