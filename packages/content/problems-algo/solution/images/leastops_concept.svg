<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">表示数字的最少运算符：代价模型</text>

  <!-- ===== Section 1: Term construction cost ===== -->
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">项的构造与运算符代价（唯一操作数是 x）</text>

  <!-- Term 1: x = x^1, 0 ops -->
  <rect x="30" y="58" width="110" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x</text>
  <text x="85" y="92" text-anchor="middle" font-size="10" fill="#888">值 = x¹</text>
  <text x="85" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0 个运算符</text>

  <!-- Term 2: x*x = x^2, 1 op -->
  <rect x="150" y="58" width="110" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="205" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x * x</text>
  <text x="205" y="92" text-anchor="middle" font-size="10" fill="#888">值 = x²</text>
  <text x="205" y="106" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1 个运算符</text>

  <!-- Term 3: x*x*x = x^3, 2 ops -->
  <rect x="270" y="58" width="110" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="325" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x * x * x</text>
  <text x="325" y="92" text-anchor="middle" font-size="10" fill="#888">值 = x³</text>
  <text x="325" y="106" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2 个运算符</text>

  <!-- Term 4: x/x = 1, 1 op -->
  <rect x="390" y="58" width="110" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x / x</text>
  <text x="445" y="92" text-anchor="middle" font-size="10" fill="#888">值 = 1 = x⁰</text>
  <text x="445" y="106" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1 个运算符</text>

  <!-- Arrow / rule -->
  <rect x="30" y="124" width="470" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="265" y="139" text-anchor="middle" font-size="10" fill="#333">规律：xⁱ 需 i−1 个 *；常数 1 = x/x 需 1 个 /</text>

  <!-- ===== Section 2: Example expression ===== -->
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例：x = 3, target = 19 → 3*3 + 3*3 + 3/3</text>

  <!-- Token boxes: 3 * 3 + 3 * 3 + 3 / 3 -->
  <!-- positions: x=40 step=42, width=38 -->
  <!-- token 0: 3 -->
  <rect x="40" y="178" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- token 1: * -->
  <rect x="82" y="178" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="198" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">*</text>
  <!-- token 2: 3 -->
  <rect x="124" y="178" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- token 3: + -->
  <rect x="166" y="178" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="198" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+</text>
  <!-- token 4: 3 -->
  <rect x="208" y="178" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- token 5: * -->
  <rect x="250" y="178" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="198" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">*</text>
  <!-- token 6: 3 -->
  <rect x="292" y="178" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- token 7: + -->
  <rect x="334" y="178" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="198" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+</text>
  <!-- token 8: 3 -->
  <rect x="376" y="178" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- token 9: / -->
  <rect x="418" y="178" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="437" y="198" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">/</text>
  <!-- token 10: 3 -->
  <rect x="460" y="178" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="479" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- Operator count annotations -->
  <text x="101" y="224" text-anchor="middle" font-size="9" fill="#d6a040">①</text>
  <text x="185" y="224" text-anchor="middle" font-size="9" fill="#4a7a3a">②</text>
  <text x="269" y="224" text-anchor="middle" font-size="9" fill="#d6a040">③</text>
  <text x="353" y="224" text-anchor="middle" font-size="9" fill="#4a7a3a">④</text>
  <text x="437" y="224" text-anchor="middle" font-size="9" fill="#d6a040">⑤</text>

  <!-- Value breakdown -->
  <rect x="40" y="234" width="460" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= 9 + 9 + 1 = 19 ✓  （5 个运算符）</text>

  <!-- ===== Section 3: Cost formula ===== -->
  <rect x="30" y="272" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">总运算符数 = Σ |cᵢ| · w(i) − 1</text>
  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#888">w(i) = i （i ≥ 1）；w(0) = 2（常数 1 = x/x）</text>
  <text x="280" y="320" text-anchor="middle" font-size="10" fill="#888">cᵢ 为位置 i 的带符号系数（正=加，负=减），|cᵢ| = 该位置项数</text>

  <!-- Legend -->
  <rect x="30" y="340" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="352" font-size="10" fill="#555">操作数 x</text>
  <rect x="130" y="340" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="150" y="352" font-size="10" fill="#555">* / 运算符（项内）</text>
  <rect x="290" y="340" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="310" y="352" font-size="10" fill="#555">+ − 运算符（项间连接）</text>
  <rect x="460" y="340" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="480" y="352" font-size="10" fill="#555">常数 1</text>

  <!-- Note -->
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#888">先算Σ|cᵢ|·w(i)再−1：首项无需前导运算符</text>
</svg>
