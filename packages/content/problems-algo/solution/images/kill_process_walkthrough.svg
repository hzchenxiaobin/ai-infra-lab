<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例演算：pid=[1,3,10,5], ppid=[3,0,5,3], kill=5</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">邻接表 children = {3:[1,5], 5:[10], 1:[], 10:[]}</text>

  <!-- ===== Left: tree reference ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">进程树</text>
  <g font-size="11">
    <circle cx="90" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="90" y="105" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <circle cx="50" cy="150" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="50" y="155" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="130" cy="150" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="130" y="155" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <line x1="80" y1="112" x2="58" y2="138" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="100" y1="112" x2="122" y2="138" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

    <circle cx="130" cy="200" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="130" y="205" text-anchor="middle" fill="#d6a040" font-weight="bold">10</text>
    <line x1="130" y1="165" x2="130" y2="185" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

    <!-- traversal order arrows -->
    <text x="30" y="240" font-size="10" fill="#b85450" font-weight="bold">访问顺序：</text>
    <text x="30" y="258" font-size="10.5" fill="#b85450">5 → 10</text>
    <text x="30" y="274" font-size="9.5" fill="#888">（先根 → 子节点）</text>
  </g>

  <!-- ===== Right: step table ===== -->
  <text x="240" y="74" font-size="11" fill="#446688" font-weight="bold">DFS 逐步演算</text>

  <!-- table header -->
  <rect x="240" y="84" width="60" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="270" y="100" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">步骤</text>
  <rect x="300" y="84" width="100" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="350" y="100" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">stack</text>
  <rect x="400" y="84" width="100" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="450" y="100" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">ans</text>

  <!-- row 0: initial -->
  <rect x="240" y="108" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">初始</text>
  <rect x="300" y="108" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[5]</text>
  <rect x="400" y="108" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="450" y="130" text-anchor="middle" font-size="11" fill="#555">[]</text>

  <!-- row 1: pop 5 -->
  <rect x="240" y="142" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">①</text>
  <text x="270" y="170" text-anchor="middle" font-size="9" fill="#888">pop 5</text>
  <rect x="300" y="142" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[10]</text>
  <rect x="400" y="142" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="450" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[5]</text>

  <!-- row 2: pop 10 -->
  <rect x="240" y="176" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">②</text>
  <text x="270" y="204" text-anchor="middle" font-size="9" fill="#888">pop 10</text>
  <rect x="300" y="176" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="198" text-anchor="middle" font-size="11" fill="#888">[]</text>
  <rect x="400" y="176" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="450" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[5,10]</text>

  <!-- row 3: done -->
  <rect x="240" y="210" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">结束</text>
  <text x="270" y="238" text-anchor="middle" font-size="9" fill="#888">stack 空</text>
  <rect x="300" y="210" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="232" text-anchor="middle" font-size="10.5" fill="#888">空</text>
  <rect x="400" y="210" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[5,10]</text>

  <!-- explanation callouts -->
  <rect x="240" y="260" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="252" y="278" font-size="10.5" fill="#446688" font-weight="bold">步骤 ①：弹出 5 → ans 加入 5</text>
  <text x="252" y="294" font-size="10" fill="#555">children[5]=[10]，把 10 压入 stack</text>

  <rect x="240" y="310" width="260" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="252" y="328" font-size="10.5" fill="#d6a040" font-weight="bold">步骤 ②：弹出 10 → ans 加入 10</text>
  <text x="252" y="344" font-size="10" fill="#555">children[10]=[]，无新节点入栈</text>

  <!-- bottom note -->
  <rect x="30" y="362" width="490" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">每个节点入栈 1 次、出栈 1 次 → 总时间 O(n)</text>
</svg>
