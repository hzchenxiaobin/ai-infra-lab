<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：重排抹平顺序 → 单词 = 字母集合 = 26 位掩码</text>

  <!-- ====== Section A: the transform operation ====== -->
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">转换操作 = 追加一个新字母 + 任意重排</text>

  <!-- start word: act -->
  <text x="50" y="96" font-size="11" fill="#666" font-weight="bold">startWord</text>
  <rect x="40" y="100" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="74" y="100" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="108" y="100" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">t</text>

  <!-- +k arrow -->
  <path d="M 150 117 L 188 117" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="98" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="112" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">+ k</text>

  <!-- actk -->
  <rect x="196" y="100" width="34" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="213" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="230" y="100" width="34" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="247" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="264" y="100" width="34" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">t</text>
  <rect x="298" y="100" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="122" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">k</text>

  <!-- rearrange arrow (loop) -->
  <path d="M 348 117 L 386 117" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="354" y="98" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="371" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">重排</text>

  <!-- target: tack -->
  <text x="470" y="96" font-size="11" fill="#666" font-weight="bold">targetWord</text>
  <rect x="430" y="100" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">t</text>
  <rect x="464" y="100" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="498" y="100" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="532" y="100" width="20" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="542" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">k</text>

  <!-- note line -->
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="#666">字母集合相同：{a,c,t} ∪ {k} = {a,c,k,t}，顺序无所谓</text>

  <!-- ====== Section B: bitmask encoding ====== -->
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">字母集合 → 26 位掩码（每位对应一个字母）</text>

  <!-- 26 cells row: a..z, each 18px wide => 468 total, start x=46 -->
  <g font-size="10" fill="#555">
    <!-- letters a..z labels -->
  </g>
  <!-- highlight a(0), c(2), t(19) -->
  <rect x="46" y="200" width="18" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="217" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">a</text>
  <rect x="64" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="73" y="217" text-anchor="middle" font-size="9" fill="#aaa">b</text>
  <rect x="82" y="200" width="18" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="91" y="217" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">c</text>
  <!-- d..s dim -->
  <rect x="100" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="217" text-anchor="middle" font-size="9" fill="#aaa">d</text>
  <rect x="118" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="217" text-anchor="middle" font-size="9" fill="#aaa">e</text>
  <rect x="136" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="217" text-anchor="middle" font-size="9" fill="#aaa">f</text>
  <rect x="154" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="163" y="217" text-anchor="middle" font-size="9" fill="#aaa">g</text>
  <rect x="172" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="181" y="217" text-anchor="middle" font-size="9" fill="#aaa">h</text>
  <rect x="190" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="199" y="217" text-anchor="middle" font-size="9" fill="#aaa">i</text>
  <rect x="208" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="217" y="217" text-anchor="middle" font-size="9" fill="#aaa">j</text>
  <rect x="226" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="217" text-anchor="middle" font-size="9" fill="#aaa">k</text>
  <rect x="244" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="253" y="217" text-anchor="middle" font-size="9" fill="#aaa">l</text>
  <rect x="262" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="271" y="217" text-anchor="middle" font-size="9" fill="#aaa">m</text>
  <rect x="280" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="289" y="217" text-anchor="middle" font-size="9" fill="#aaa">n</text>
  <rect x="298" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="307" y="217" text-anchor="middle" font-size="9" fill="#aaa">o</text>
  <rect x="316" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="217" text-anchor="middle" font-size="9" fill="#aaa">p</text>
  <rect x="334" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="343" y="217" text-anchor="middle" font-size="9" fill="#aaa">q</text>
  <rect x="352" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="361" y="217" text-anchor="middle" font-size="9" fill="#aaa">r</text>
  <rect x="370" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="379" y="217" text-anchor="middle" font-size="9" fill="#aaa">s</text>
  <rect x="388" y="200" width="18" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="397" y="217" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">t</text>
  <rect x="406" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="217" text-anchor="middle" font-size="9" fill="#aaa">u</text>
  <rect x="424" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="433" y="217" text-anchor="middle" font-size="9" fill="#aaa">v</text>
  <rect x="442" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="451" y="217" text-anchor="middle" font-size="9" fill="#aaa">w</text>
  <rect x="460" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="469" y="217" text-anchor="middle" font-size="9" fill="#aaa">x</text>
  <rect x="478" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="487" y="217" text-anchor="middle" font-size="9" fill="#aaa">y</text>
  <rect x="496" y="200" width="18" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="505" y="217" text-anchor="middle" font-size="9" fill="#aaa">z</text>

  <!-- mask value box -->
  <rect x="120" y="236" width="320" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="255" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">mask("act") = (1&lt;&lt;0)|(1&lt;&lt;2)|(1&lt;&lt;19)  → 一个整数即可表示单词</text>

  <!-- ====== Section C: key equivalence ====== -->
  <rect x="30" y="282" width="500" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">等价判定（去掉一「位」即还原）</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555">target 可由某 start 得到 ⟺ 从 target 掩码中去掉某一位后，结果 ∈ startMasks</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#666">"tack" 去掉 k 位 → {a,c,t} = mask("act") ∈ startMasks ✓</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#666">"act" 去掉任一位 → {c,t}/{a,t}/{a,c}，均不在 startMasks ✗（必须多一个字母）</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#888">每位字母至多出现一次 → 掩码无重复位，去掉一位即 mask &amp; ~(1&lt;&lt;bit)</text>
</svg>
