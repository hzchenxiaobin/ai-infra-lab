<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心：一组房屋共享 1 个邮筒，邮筒放中位数处总距离最小
  </text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    一维绝对偏差最小化 → 中位数（不是均值）
  </text>

  <!-- ====== 上图：邮筒在中位数 8 处（最优）====== -->
  <text x="40" y="86" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">邮筒在中位数 8 处</text>

  <!-- 数轴 上 -->
  <line x1="60" y1="120" x2="500" y2="120" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- 房屋位置 1,4,8,10,20 -> x = 60 + p*22  : 82,148,236,280,500 -->
  <!-- house 1 -->
  <rect x="70" y="104" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="82" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <!-- house 4 -->
  <rect x="136" y="104" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <!-- house 8 -->
  <rect x="224" y="104" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <!-- house 10 -->
  <rect x="268" y="104" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <!-- house 20 -->
  <rect x="488" y="104" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="500" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">20</text>

  <!-- 邮筒 (中位数 8, x=236) 橙色 -->
  <rect x="222" y="148" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="236" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">邮筒</text>
  <!-- 邮筒到中位房屋的连线 -->
  <path d="M236,136 L236,148" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 距离虚线标注 -->
  <text x="82" y="186" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">|1−8|=7</text>
  <text x="148" y="186" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">|4−8|=4</text>
  <text x="236" y="186" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="280" y="186" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">|10−8|=2</text>
  <text x="500" y="186" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">|20−8|=12</text>

  <!-- 合计 -->
  <rect x="330" y="148" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="165" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 = 25 ✓ 最小</text>

  <!-- ====== 下图：邮筒在最左 1 处（次优）====== -->
  <text x="40" y="226" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">邮筒在最左 1 处（偏移后变差）</text>

  <line x1="60" y1="260" x2="500" y2="260" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- house 1 -->
  <rect x="70" y="244" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="82" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="244" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="224" y="244" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="268" y="244" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="488" y="244" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="500" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">20</text>

  <!-- 邮筒在 1 处 -->
  <rect x="68" y="288" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">邮筒</text>
  <path d="M82,276 L82,288" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="82" y="326" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="148" y="326" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="236" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="500" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">19</text>

  <rect x="330" y="288" width="170" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="305" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">合计 = 38 ✗ 更大</text>

  <!-- 底部说明：交换论证 -->
  <rect x="40" y="340" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    交换论证：邮筒偏离中位数 1 单位 → 右侧房屋数 ≥ 左侧 → 总距离只增不减
  </text>
</svg>
