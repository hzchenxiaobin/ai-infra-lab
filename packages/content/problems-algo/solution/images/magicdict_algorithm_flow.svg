<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="540" fill="#fdfcf7"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">search(word) 算法流程：带「1 次替换预算」的 Trie DFS</text>
  <path d="M 210 40 Q 380 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><ellipse cx="380" cy="78" rx="60" ry="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="380" y="82" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">dfs(node=root, i=0, diff=0)</text>
  <path d="M 380 96 L 380 114" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: i == len(word)? -->
  <g filter="url(#sk)"><polygon points="380,116 470,158 380,200 290,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">i == len(word)?</text>
  <text x="380" y="170" text-anchor="middle" font-size="9" fill="#9a6a20">(走到词尾)</text>

  <!-- yes branch -> return -->
  <path d="M 290 158 L 200 158 L 200 210" stroke="#2e8b57" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="248" y="150" text-anchor="middle" font-size="10" fill="#2e8b57" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="120" y="214" width="160" height="50" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/></g>
  <text x="200" y="234" text-anchor="middle" font-size="10" fill="#2e6e2e">return node.is_end</text>
  <text x="200" y="250" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">AND diff == 1</text>
  <text x="200" y="278" text-anchor="middle" font-size="9" fill="#888">必须恰好用掉 1 次替换</text>

  <!-- no branch -->
  <path d="M 380 200 L 380 224" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="396" y="216" font-size="10" fill="#888">否</text>

  <!-- diamond: diff == 0 ? (还有预算) -->
  <g filter="url(#sk)"><polygon points="380,226 480,272 380,318 280,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="268" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">diff == 0 ?</text>
  <text x="380" y="284" text-anchor="middle" font-size="9" fill="#9a6a20">(替换预算未用)</text>

  <!-- yes: 遍历所有子节点 -->
  <path d="M 480 272 L 560 272" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="520" y="264" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="564" y="232" width="180" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="654" y="252" text-anchor="middle" font-size="10" fill="#9a6a20" font-weight="bold">遍历 node 的每个子节点 c</text>
  <text x="654" y="270" text-anchor="middle" font-size="9" fill="#9a6a20">c == word[i] → dfs(child, i+1, 0)</text>
  <text x="654" y="286" text-anchor="middle" font-size="9" fill="#9a6a20">c != word[i] → dfs(child, i+1, 1)</text>
  <text x="654" y="306" text-anchor="middle" font-size="9" fill="#9a6a20" font-weight="bold">任一分支 true 即返回 true</text>

  <!-- no: 预算已用, 必须精确 -->
  <path d="M 380 318 L 380 344" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="396" y="336" font-size="10" fill="#888">否(diff=1)</text>
  <g filter="url(#sk)"><rect x="280" y="348" width="200" height="60" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="380" y="368" text-anchor="middle" font-size="10" fill="#2b6e9e">预算已用完：只能精确匹配</text>
  <text x="380" y="386" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">word[i] ∈ node.children ?</text>
  <text x="380" y="400" text-anchor="middle" font-size="9" fill="#2b6e9e">是 → dfs(child, i+1, 1)；否 → false</text>

  <!-- merge down to a "递归" note -->
  <path d="M 654 318 L 654 360" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="280" y="430" width="200" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="380" y="448" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">所有路径都 false → return false</text>
  <text x="380" y="462" text-anchor="middle" font-size="9" fill="#b85450">(无任何「恰好 1 处替换」的命中)</text>

  <path d="M 380 408 L 380 430" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 654 360 Q 540 430 480 450" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- bottom legend -->
  <g filter="url(#sk)">
    <rect x="40" y="490" width="680" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="380" y="508" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 状态 = (当前 Trie 节点, 当前字符下标 i, 已用替换数 diff)；diff∈{0,1}</text>
  <text x="380" y="522" text-anchor="middle" font-size="10" fill="#2b6e9e">diff=0 时在某一位「分支」枚举 25 种替换；diff=1 时退化为普通 Trie 精确查找，剪枝极强</text>
</svg>
