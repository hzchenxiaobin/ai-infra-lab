<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    算法流程：哈希表 + 前缀和一次遍历
  </text>

  <!-- ===== Init box ===== -->
  <rect x="180" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始化：s[0]=0, d={}, ans=−∞</text>
  <text x="280" y="76" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">d 记录每个值首次出现的下标</text>

  <!-- arrow down -->
  <path d="M280,84 L280,100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop header ===== -->
  <rect x="160" y="100" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">for i, v in enumerate(flowers):</text>

  <!-- arrow down to decision -->
  <path d="M280,134 L280,152" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond: v in d? ===== -->
  <polygon points="280,152 360,190 280,228 200,190" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v ∈ d ?</text>
  <text x="280" y="202" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（之前见过）</text>

  <!-- ===== Yes branch (left) ===== -->
  <path d="M200,190 L120,190 L120,250" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="184" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="40" y="250" width="200" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">计算花园美观度</text>
  <text x="140" y="288" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">beauty = s[i] − s[d[v]+1] + 2·v</text>
  <text x="140" y="302" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">i=当前下标, d[v]=首次下标</text>
  <text x="140" y="314" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">ans = max(ans, beauty)</text>

  <!-- ===== No branch (right) ===== -->
  <path d="M360,190 L440,190 L440,250" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="390" y="184" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="340" y="250" width="180" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">记录首次出现</text>
  <text x="430" y="288" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">d[v] = i</text>
  <text x="430" y="304" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">只记最早下标</text>
  <text x="430" y="318" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（s 单调→最早最优）</text>

  <!-- ===== Merge: update prefix sum ===== -->
  <path d="M140,318 L140,340 L280,340 L280,352" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M430,318 L430,340 L280,340" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="160" y="352" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s[i+1] = s[i] + max(v, 0)</text>
  <text x="280" y="384" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">负数对前缀和贡献为 0</text>

  <!-- ===== Loop back ===== -->
  <path d="M400,372 Q480,372 480,118 Q480,117 400,117" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="248" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下一朵</text>

  <!-- ===== Return ===== -->
  <path d="M280,392 L280,408" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="408" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="11" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">return ans</text>
</svg>
