<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：num = 28，逐 i 跟踪 sum</text>

  <!-- ===== table header ===== -->
  <rect x="40" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">i</text>

  <rect x="102" y="48" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">i*i &lt;= 28 ?</text>

  <rect x="224" y="48" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="279" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">28 % i == 0 ?</text>

  <rect x="336" y="48" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="391" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">加入的因子</text>

  <rect x="448" y="48" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="483" y="66" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">sum</text>

  <!-- ===== row: init (i=1) ===== -->
  <text x="70" y="96" text-anchor="middle" font-size="11.5" fill="#888">init</text>
  <rect x="102" y="82" width="120" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="162" y="99" text-anchor="middle" font-size="11" fill="#888">—（预置 1）</text>
  <rect x="224" y="82" width="110" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="279" y="99" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="336" y="82" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="391" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="448" y="82" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="483" y="99" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== row: i=2 ===== -->
  <text x="70" y="130" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <rect x="102" y="116" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="162" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4 &lt;= 28 ✓</text>
  <rect x="224" y="116" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="279" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">余 0 ✓</text>
  <rect x="336" y="116" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="391" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2, 14</text>
  <rect x="448" y="116" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="483" y="133" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">17</text>

  <!-- ===== row: i=3 ===== -->
  <text x="70" y="164" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="102" y="150" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="162" y="167" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9 &lt;= 28 ✓</text>
  <rect x="224" y="150" width="110" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="279" y="167" text-anchor="middle" font-size="11" fill="#999">余 1 ✗</text>
  <rect x="336" y="150" width="110" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="391" y="167" text-anchor="middle" font-size="11" fill="#999">—</text>
  <rect x="448" y="150" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="483" y="167" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">17</text>

  <!-- ===== row: i=4 ===== -->
  <text x="70" y="198" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <rect x="102" y="184" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="162" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">16 &lt;= 28 ✓</text>
  <rect x="224" y="184" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="279" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">余 0 ✓</text>
  <rect x="336" y="184" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="391" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4, 7</text>
  <rect x="448" y="184" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="483" y="201" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">28</text>

  <!-- ===== row: i=5 ===== -->
  <text x="70" y="232" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">5</text>
  <rect x="102" y="218" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="162" y="235" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">25 &lt;= 28 ✓</text>
  <rect x="224" y="218" width="110" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="279" y="235" text-anchor="middle" font-size="11" fill="#999">余 3 ✗</text>
  <rect x="336" y="218" width="110" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="391" y="235" text-anchor="middle" font-size="11" fill="#999">—</text>
  <rect x="448" y="218" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="483" y="235" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">28</text>

  <!-- ===== row: i=6 (stop) ===== -->
  <text x="70" y="266" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">6</text>
  <rect x="102" y="252" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="162" y="269" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">36 &gt; 28 ✗</text>
  <rect x="224" y="252" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="279" y="269" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">退出循环</text>
  <rect x="336" y="252" width="110" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="391" y="269" text-anchor="middle" font-size="11" fill="#999">—</text>
  <rect x="448" y="252" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="483" y="269" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">28</text>

  <!-- ===== final verdict ===== -->
  <line x1="40" y1="294" x2="520" y2="294" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="60" y="324" font-size="12" fill="#555" font-weight="bold">真因子集合：</text>
  <rect x="150" y="310" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="168" y="325" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <rect x="192" y="310" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="325" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="234" y="310" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="252" y="325" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="276" y="310" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="294" y="325" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="318" y="310" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="336" y="325" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">14</text>

  <text x="370" y="325" font-size="12.5" fill="#555" font-weight="bold">→ 和 = 28 == num</text>

  <rect x="150" y="348" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="370" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">return true  ⭐ 28 是完美数</text>
</svg>
