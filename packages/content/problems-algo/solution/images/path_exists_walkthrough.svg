<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">BFS 逐步演算：示例 1 命中 dest，示例 2 遍历完无路径</text>
  <path d="M 310 40 Q 450 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT: Example 1 ===== -->
  <g filter="url(#sk)">
    <rect x="20" y="62" width="430" height="540" rx="10" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="235" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">示例 1：source=0, dest=2</text>

  <!-- graph triangle -->
  <!-- node 0 source -->
  <g filter="url(#sk)">
    <circle cx="130" cy="130" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="130" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#34506e">0</text>
  <!-- node 1 -->
  <g filter="url(#sk)">
    <circle cx="80" cy="220" r="20" fill="#fff" stroke="#7f9cc0" stroke-width="1.4"/>
  </g>
  <text x="80" y="226" text-anchor="middle" font-size="13" fill="#34506e">1</text>
  <!-- node 2 dest -->
  <g filter="url(#sk)">
    <circle cx="190" cy="220" r="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
  </g>
  <text x="190" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <!-- edges -->
  <path d="M 130 152 L 88 202" stroke="#7f9cc0" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 96 220 L 170 220" stroke="#7f9cc0" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 190 198 L 130 152" stroke="#4a8e4a" stroke-width="2.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="168" y="170" font-size="10.5" font-weight="bold" fill="#2e6e2e">命中!</text>

  <!-- step table -->
  <g filter="url(#sk)">
    <rect x="36" y="260" width="398" height="158" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="284" font-size="12" font-weight="bold" fill="#7a5415">步骤 ①：出队 0，遍历邻居 [1, 2]</text>
  <text x="56" y="306" font-size="11.5" fill="#5a4a1a">  • v=1：未访问 → visited[1]=1，入队</text>
  <text x="56" y="326" font-size="11.5" font-weight="bold" fill="#2e6e2e">  • v=2：2 == dest → ★ 返回 true</text>
  <text x="56" y="352" font-size="11" fill="#7a5415">队列状态：[0] → 出队 0 → 处理邻居</text>
  <text x="56" y="372" font-size="11" fill="#7a5415">visited：{0, 1}（2 命中前未及标记）</text>
  <text x="56" y="396" font-size="11.5" font-weight="bold" fill="#2e6e2e">→ 仅 1 步即命中，无需遍历完整个连通分量</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="36" y="438" width="398" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="235" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">输出：true ✓</text>

  <!-- note -->
  <text x="235" y="584" text-anchor="middle" font-size="10.5" fill="#3a6a3a">连通图：任意两点同分量，BFS 必命中</text>

  <!-- ===== RIGHT: Example 2 ===== -->
  <g filter="url(#sk)">
    <rect x="470" y="62" width="410" height="540" rx="10" fill="#fdecee" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="675" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">示例 2：source=0, dest=5</text>

  <!-- component A -->
  <g filter="url(#sk)">
    <circle cx="540" cy="130" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="540" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#34506e">0</text>
  <g filter="url(#sk)">
    <circle cx="490" cy="220" r="20" fill="#fff" stroke="#7f9cc0" stroke-width="1.4"/>
  </g>
  <text x="490" y="226" text-anchor="middle" font-size="13" fill="#34506e">1</text>
  <g filter="url(#sk)">
    <circle cx="600" cy="220" r="20" fill="#fff" stroke="#7f9cc0" stroke-width="1.4"/>
  </g>
  <text x="600" y="226" text-anchor="middle" font-size="13" fill="#34506e">2</text>
  <path d="M 540 152 L 498 202" stroke="#7f9cc0" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 540 152 L 590 202" stroke="#7f9cc0" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- component B -->
  <g filter="url(#sk)">
    <circle cx="790" cy="130" r="20" fill="#fff" stroke="#7f9cc0" stroke-width="1.4"/>
  </g>
  <text x="790" y="136" text-anchor="middle" font-size="13" fill="#34506e">3</text>
  <g filter="url(#sk)">
    <circle cx="740" cy="220" r="20" fill="#fff" stroke="#7f9cc0" stroke-width="1.4"/>
  </g>
  <text x="740" y="226" text-anchor="middle" font-size="13" fill="#34506e">4</text>
  <g filter="url(#sk)">
    <circle cx="840" cy="220" r="22" fill="#fdecee" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="840" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">5</text>
  <path d="M 790 152 L 748 202" stroke="#7f9cc0" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 752 220 L 820 220" stroke="#7f9cc0" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 820 202 L 790 152" stroke="#7f9cc0" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- separator -->
  <path d="M 680 100 L 680 250" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <text x="680" y="96" text-anchor="middle" font-size="9.5" fill="#b85450">分离</text>

  <!-- step table -->
  <g filter="url(#sk)">
    <rect x="486" y="260" width="378" height="178" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="506" y="284" font-size="12" font-weight="bold" fill="#7a5415">步骤 ①：出队 0，邻居 [1,2] → 均入队</text>
  <text x="506" y="306" font-size="11.5" fill="#5a4a1a">  队列：[0] → [1, 2]    visited：{0,1,2}</text>
  <text x="506" y="332" font-size="12" font-weight="bold" fill="#7a5415">步骤 ②：出队 1，邻居 [0] → 已访问跳过</text>
  <text x="506" y="354" font-size="11.5" fill="#5a4a1a">  队列：[2]    visited 不变</text>
  <text x="506" y="380" font-size="12" font-weight="bold" fill="#7a5415">步骤 ③：出队 2，邻居 [0] → 已访问跳过</text>
  <text x="506" y="402" font-size="11.5" fill="#5a4a1a">  队列：[]（空）</text>
  <text x="506" y="424" font-size="11.5" font-weight="bold" fill="#b85450">  连通分量 {0,1,2} 遍历完，未遇 5</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="486" y="458" width="378" height="44" rx="8" fill="#fdecee" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="675" y="486" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">输出：false ✗</text>

  <!-- note -->
  <text x="675" y="584" text-anchor="middle" font-size="10.5" fill="#8a3a3a">非连通图：跨分量无路径，BFS 遍历完即判否</text>
</svg>
