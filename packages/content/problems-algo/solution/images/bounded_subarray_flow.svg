<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次遍历，维护三指针 + 区间长度累加</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">i 单调前进，每步 O(1)，总 O(n)</text>

  <!-- Init box -->
  <rect x="150" y="52" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="11.5" fill="#333">初始化 lastInvalid=lastMin=lastMax=−1, ans=0</text>

  <!-- arrow down -->
  <path d="M 260 88 L 260 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="150" y="106" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for i = 0 … n−1 : x = nums[i]</text>

  <!-- arrow down to branches -->
  <path d="M 260 136 L 260 152" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Three parallel if branches -->
  <!-- branch 1 : out of range -->
  <rect x="30" y="156" width="145" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="102" y="173" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">if x &lt; minK or x &gt; maxK</text>
  <text x="102" y="190" text-anchor="middle" font-size="10.5" fill="#333">lastInvalid := i</text>

  <!-- branch 2 : == minK -->
  <rect x="187" y="156" width="145" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="259" y="173" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">if x == minK</text>
  <text x="259" y="190" text-anchor="middle" font-size="10.5" fill="#333">lastMin := i</text>

  <!-- branch 3 : == maxK -->
  <rect x="344" y="156" width="145" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="416" y="173" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">if x == maxK</text>
  <text x="416" y="190" text-anchor="middle" font-size="10.5" fill="#333">lastMax := i</text>

  <!-- note: parallel -->
  <text x="260" y="216" text-anchor="middle" font-size="9.5" fill="#888">↑ 三段并列 if（非 elif）：minK==maxK 时同一 x 同时命中后两支</text>

  <!-- arrow down -->
  <path d="M 260 224 L 260 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Accumulate box -->
  <rect x="80" y="242" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans += max(0, min(lastMin, lastMax) − lastInvalid)</text>
  <text x="260" y="274" text-anchor="middle" font-size="10" fill="#888">合法左端点区间 (lastInvalid, min(lastMin,lastMax)] 的长度</text>

  <!-- loop back arrow -->
  <path d="M 440 262 L 478 262 L 478 120 L 370 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="486" y="194" text-anchor="middle" font-size="9.5" fill="#888" transform="rotate(90 486 194)">下一 i</text>

  <!-- arrow down to return -->
  <path d="M 260 284 L 260 300" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return box -->
  <rect x="190" y="302" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">return ans  (long long)</text>

  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#aaa">每步仅三处比较 + 一次 max/min，常数极小；n=10⁵ 线性可过</text>
</svg>
