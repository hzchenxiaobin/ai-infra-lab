<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 follower_id 自连接，每条结果 = 一对用户的一个共同关注者</text>

  <!-- Section 1: Relations grouped by follower_id -->
  <text x="50" y="58" font-size="11.5" fill="#446688" font-weight="bold">① Relations 按 follower_id 分组（同一关注者关注了哪些用户）</text>

  <!-- Group: follower 3 -->
  <rect x="40" y="70" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="88" font-size="10.5" fill="#888">follower_id</text>
  <text x="140" y="88" font-size="10.5" fill="#888">关注的 user_id 集合</text>
  <text x="62" y="112" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="140" y="112" font-size="12" fill="#333">{1, 2, 7}</text>

  <!-- Group: follower 4 -->
  <rect x="40" y="132" width="180" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="62" y="162" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="140" y="162" font-size="12" fill="#333">{1, 2, 7}</text>

  <!-- Group: follower 5 -->
  <rect x="40" y="186" width="180" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="62" y="216" font-size="13" fill="#d6a040" font-weight="bold">5</text>
  <text x="140" y="216" font-size="12" fill="#333">{1, 7}</text>

  <!-- Group: follower 6 -->
  <rect x="40" y="240" width="180" height="40" fill="#fafafa" stroke="#888" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="62" y="266" font-size="12" fill="#888">6</text>
  <text x="140" y="266" font-size="11" fill="#888">{2} → 无法配对</text>

  <!-- Arrow to section 2 -->
  <path d="M 230 170 L 268 170" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="249" y="160" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">自连接</text>
  <text x="249" y="184" text-anchor="middle" font-size="8" fill="#888">user1&lt;user2</text>

  <!-- Section 2: pairs generated -->
  <text x="290" y="58" font-size="11.5" fill="#b85450" font-weight="bold">② 每组内两两配对（r1.user_id &lt; r2.user_id）</text>

  <rect x="280" y="70" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="295" y="88" font-size="10" fill="#888">follower=3</text>
  <text x="295" y="112" font-size="11" fill="#b85450" font-weight="bold">(1,2) (1,7) (2,7)</text>

  <rect x="280" y="132" width="160" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="295" y="156" font-size="10" fill="#888">follower=4</text>
  <text x="295" y="170" font-size="11" fill="#b85450" font-weight="bold">(1,2) (1,7) (2,7)</text>

  <rect x="280" y="186" width="160" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="295" y="210" font-size="10" fill="#888">follower=5</text>
  <text x="295" y="224" font-size="11" fill="#b85450" font-weight="bold">(1,7)</text>

  <rect x="280" y="240" width="160" height="40" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="295" y="266" font-size="10" fill="#888">follower=6 → 无配对</text>

  <!-- Arrow down -->
  <path d="M 360 286 L 360 304" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="298" font-size="9.5" fill="#666" font-weight="bold">GROUP BY 配对 + COUNT</text>

  <!-- Section 3: grouped result -->
  <text x="50" y="324" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ GROUP BY (user1, user2) + COUNT(*) = 共同关注者数</text>

  <rect x="40" y="336" width="540" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">user1_id</text>
  <text x="180" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">user2_id</text>
  <text x="300" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">COUNT(*)</text>
  <text x="440" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">共同关注者</text>
  <line x1="50" y1="366" x2="570" y2="366" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="78" y="386" font-size="12" fill="#333">1</text><text x="188" y="386" font-size="12" fill="#333">2</text><text x="310" y="386" font-size="12" fill="#d6a040" font-weight="bold">2</text><text x="445" y="386" font-size="11" fill="#888">{3, 4}</text>
  <text x="78" y="406" font-size="12" fill="#333">1</text><text x="188" y="406" font-size="12" fill="#333">7</text><text x="310" y="406" font-size="12" fill="#b85450" font-weight="bold">3 ← max</text><text x="445" y="406" font-size="11" fill="#888">{3, 4, 5}</text>
  <text x="78" y="422" font-size="11" fill="#333">2</text><text x="188" y="422" font-size="11" fill="#333">7</text><text x="310" y="422" font-size="11" fill="#d6a040" font-weight="bold">2</text><text x="445" y="422" font-size="10.5" fill="#888">{3, 4}</text>

  <!-- Formula box -->
  <rect x="40" y="432" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="452" font-size="11" fill="#d6a040" font-weight="bold">💡 COUNT(*) = |followers(u1) ∩ followers(u2)|，RANK() 取最大即为所求</text>
  <text x="60" y="466" font-size="9.5" fill="#555">user1 &lt; user2 一步三得：去自配 / 去重复对 / 满足输出顺序要求</text>
</svg>
