<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">前 K 高频单词：最小堆算法流程</text>
  <path d="M 300 44 Q 460 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① 统计频率 -->
  <g filter="url(#sk)">
    <rect x="370" y="70" width="180" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="460" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 哈希表统计词频</text>
  <text x="460" y="108" text-anchor="middle" font-size="11" fill="#666">freq[word]++，O(n)</text>

  <path d="M 460 116 L 460 138" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- ② 遍历 -->
  <g filter="url(#sk)">
    <rect x="360" y="140" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="460" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 遍历每个 (单词, 频率)</text>

  <path d="M 460 180 L 460 202" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- ③ 入堆 -->
  <g filter="url(#sk)">
    <rect x="350" y="204" width="220" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="460" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ push 进大小为 k 的最小堆</text>
  <text x="460" y="242" text-anchor="middle" font-size="10" fill="#666">比较器：频率↑，同频字典序↓（堆顶=最差）</text>

  <path d="M 460 250 L 460 274" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- 判断菱形 -->
  <g filter="url(#sk)">
    <polygon points="460,276 560,322 460,368 360,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="460" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">堆大小 &gt; k ？</text>
  <text x="460" y="334" text-anchor="middle" font-size="10" fill="#999">(size &gt; k)</text>

  <!-- Yes 分支：弹出 -->
  <path d="M 360 322 L 230 322" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="300" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <rect x="60" y="300" width="170" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="145" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">弹出堆顶 pop()</text>
  <text x="145" y="338" text-anchor="middle" font-size="10" fill="#b85450">淘汰频率最低/字典序最大，O(log k)</text>
  <path d="M 145 300 Q 145 230 358 162" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arL)" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="172" y="208" font-size="10" fill="#999">继续下一个</text>

  <!-- No 分支：继续 -->
  <path d="M 560 322 L 690 322" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="625" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">否</text>
  <g filter="url(#sk)">
    <rect x="690" y="300" width="170" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="775" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">堆未满，保留</text>
  <text x="775" y="338" text-anchor="middle" font-size="10" fill="#2e6e2e">直接进入下一个</text>
  <path d="M 775 300 Q 775 230 562 162" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arL)" stroke-dasharray="5 3" filter="url(#sk)"/>

  <!-- ④ 输出 -->
  <path d="M 460 368 L 460 398" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="540" y="388" font-size="11" fill="#666">遍历结束</text>
  <g filter="url(#sk)">
    <rect x="330" y="400" width="260" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="460" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">④ 取出堆中 k 个，按答案顺序排序</text>
  <text x="460" y="440" text-anchor="middle" font-size="11" fill="#2e6e2e">频率↓、同频字典序↑，即得前 K 高频单词</text>
</svg>
