<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 436" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="436" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：首尾配对成「复合字符」，前缀+后缀 ⟶ 一个前缀匹配</text>

  <!-- word row -->
  <text x="64" y="69" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">w =</text>
  <rect x="96" y="48" width="40" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="116" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <rect x="142" y="48" width="40" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="162" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="162" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <rect x="188" y="48" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="69" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">a</text>
  <text x="208" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <rect x="234" y="48" width="40" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="254" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="254" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <rect x="280" y="48" width="40" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="300" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="300" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <!-- two pointers -->
  <text x="44" y="30" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">k（向后读前缀）</text>
  <path d="M 52 36 L 108 42" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="364" y="112" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">L−1−k（向前读后缀）</text>
  <path d="M 358 106 L 306 94" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- pair stack -->
  <text x="460" y="40" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">配对序列（复合字符串）</text>
  <path d="M 336 64 L 374 64" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="380" y="48" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="65" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k=0 → (a, a)</text>
  <rect x="380" y="80" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="97" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k=1 → (b, b)</text>
  <rect x="380" y="112" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="129" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k=2 → (a, a)</text>
  <text x="460" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">两端同步向中间收拢，</text>
  <text x="460" y="170" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">奇数长度的正中字符自成一对</text>

  <!-- trie -->
  <text x="280" y="200" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">把配对序列当作「字符串」插入 Trie：</text>
  <ellipse cx="70" cy="240" rx="17" ry="14" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="244" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">root</text>
  <path d="M 89 240 L 174 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 246 240 L 296 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 368 240 L 418 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="210" y="220" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">深1</text>
  <rect x="178" y="226" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="245" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">(a,a)</text>
  <rect x="182" y="262" width="56" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="210" y="276" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">cnt = 2</text>

  <text x="332" y="220" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">深2</text>
  <rect x="300" y="226" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="332" y="245" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">(b,b)</text>
  <rect x="304" y="262" width="56" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="332" y="276" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">cnt = 1</text>

  <text x="454" y="220" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">深3</text>
  <rect x="422" y="226" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="454" y="245" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">(a,a)</text>
  <rect x="426" y="262" width="56" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="454" y="276" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">cnt = 1</text>

  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">cnt = 以该节点结尾的已插入单词个数（复合字符共 26×26 = 676 种）</text>

  <!-- equivalence box -->
  <rect x="30" y="314" width="500" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">u 既是 w 的前缀又是后缀 ⇔ u 的配对序列 = w 配对序列的前 |u| 项（|u| ≤ |w|）</text>
  <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">两个方向的匹配被压进一条 Trie 路径 —— 一次下走同时核对首尾</text>

  <!-- note -->
  <rect x="30" y="378" width="500" height="48" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡「a」「aa」都终止在深 1 的 (a,a)：插入 w 时沿途累加节点 cnt，</text>
  <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">正好数出所有先前「既是前缀又是后缀」的单词——一次遍历完成插入+查询</text>
</svg>
