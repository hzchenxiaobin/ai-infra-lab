<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">归约链路：n 轮模拟 → 因子奇偶 → 完全平方数个数 → ⌊√n⌋</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每一步把问题"换视角"压缩，直到只剩一次整数平方根</text>

  <!-- ===== Step 1: bulb k toggled d(k) times ===== -->
  <rect x="40" y="68" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="150" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">观察：灯泡 k 在第 i 轮被切</text>
  <text x="150" y="100" text-anchor="middle" font-size="10" fill="#555">⇔ i 是 k 的因子 ⇒ 切换次数 = d(k)</text>

  <!-- arrow down -->
  <path d="M 150 110 L 150 128" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: odd d(k) iff square ===== -->
  <rect x="40" y="132" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">因子成对：(d, k/d)</text>
  <text x="150" y="164" text-anchor="middle" font-size="10" fill="#555">d(k) 为奇 ⇔ k 是完全平方数</text>

  <!-- arrow down -->
  <path d="M 150 174 L 150 192" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: count squares = floor(sqrt) ===== -->
  <rect x="40" y="196" width="220" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[1, n] 内完全平方数个数</text>
  <text x="150" y="228" text-anchor="middle" font-size="10" fill="#555">= 1², 2², …, m²  共 m 个</text>

  <!-- arrow right (to step 4) -->
  <path d="M 260 217 L 318 217" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: compute integer sqrt ===== -->
  <rect x="320" y="132" width="200" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="420" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">求 m = ⌊√n⌋</text>

  <rect x="338" y="168" width="164" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="420" y="185" text-anchor="middle" font-size="10" fill="#333">C++: (int)sqrt((double)n)</text>

  <rect x="338" y="202" width="164" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="420" y="219" text-anchor="middle" font-size="10" fill="#333">整数二分（防浮点误差）</text>

  <rect x="338" y="236" width="164" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="420" y="253" text-anchor="middle" font-size="10" fill="#333">Python: math.isqrt(n)</text>

  <text x="420" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a">详见 69. x 的平方根</text>
  <text x="420" y="296" text-anchor="middle" font-size="9" fill="#888">时间 O(log n) / O(1)</text>

  <!-- ===== Bottom note: complexity drop ===== -->
  <rect x="40" y="300" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">复杂度：O(n log n) 时间 + O(n) 空间 → O(log n) 时间 + O(1) 空间</text>
</svg>
