<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 + 双指针模拟 + 跳块取候选</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">O(n log n + m log m) 时间 / O(m) 空间</text>

  <!-- init -->
  <rect x="40" y="62" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">排序 buses、passengers</text>
  <text x="170" y="96" text-anchor="middle" font-size="10" fill="#446688">建 pset(哈希) · 预处理 block_start[]（连续块首）</text>

  <path d="M170 110 L170 126" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="56" y="130" width="228" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="152" text-anchor="middle" font-size="11" fill="#333">for 每辆车 bus（已排序）</text>

  <path d="M170 166 L170 182" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1: take passengers -->
  <rect x="40" y="186" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="170" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">指针 j 顺取 ≤ bus 的乘客，最多 capacity 个</text>
  <text x="170" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a">记录 cnt 与「末位乘客 last」</text>

  <path d="M170 232 L170 248" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: decide X -->
  <rect x="40" y="252" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="170" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt &lt; capacity ?  X = bus  :  X = last − 1</text>
  <text x="170" y="286" text-anchor="middle" font-size="10" fill="#888">未满→发车时刻；已满→末位前一刻</text>

  <path d="M170 298 L170 314" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: largest free <= X -->
  <rect x="40" y="318" width="260" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="170" y="338" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cand = largestFree( X )</text>
  <text x="170" y="354" text-anchor="middle" font-size="10" fill="#b85450">X 空闲→X；X 被占→块首 − 1（二分定位）</text>
  <text x="170" y="366" text-anchor="middle" font-size="9.5" fill="#888">ans = max(ans, cand)</text>

  <!-- loop back arrow -->
  <path d="M40 343 L18 343 L18 147 L56 147" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="18" y="246" text-anchor="middle" font-size="9.5" fill="#888" transform="rotate(-90 18 246)">下一辆车</text>

  <!-- after loop -->
  <path d="M300 343 L330 343 L330 386" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="362" text-anchor="middle" font-size="9.5" fill="#888">车用完</text>

  <!-- return -->
  <ellipse cx="330" cy="404" rx="74" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="409" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- side note box -->
  <rect x="360" y="120" width="184" height="246" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="452" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">largestFree 怎么 O(1)？</text>
  <text x="452" y="164" text-anchor="middle" font-size="10" fill="#333">① 乘客排序后，相邻整数</text>
  <text x="452" y="178" text-anchor="middle" font-size="10" fill="#333">　 p[i]==p[i−1]+1 视为同块</text>
  <text x="452" y="196" text-anchor="middle" font-size="10" fill="#333">② block_start[i] 指块首下标</text>
  <text x="452" y="214" text-anchor="middle" font-size="10" fill="#333">③ 查 X：若 X∉pset 返回 X</text>
  <text x="452" y="228" text-anchor="middle" font-size="10" fill="#333">　 否则二分得 k 使 p[k]=X</text>
  <text x="452" y="242" text-anchor="middle" font-size="10" fill="#333">　 返回 p[ block_start[k] ] − 1</text>
  <line x1="380" y1="254" x2="524" y2="254" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="452" y="272" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">为何不会 TLE？</text>
  <text x="452" y="288" text-anchor="middle" font-size="9.5" fill="#333">朴素「逐 −1 下探」遇</text>
  <text x="452" y="300" text-anchor="middle" font-size="9.5" fill="#333">连续块最坏 O(n·m)</text>
  <text x="452" y="314" text-anchor="middle" font-size="9.5" fill="#333">预处理块首 + 二分后</text>
  <text x="452" y="326" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">每次查询 O(log m)</text>
  <text x="452" y="342" text-anchor="middle" font-size="9.5" fill="#333">总计 O((n+m)log m)</text>
  <text x="452" y="358" text-anchor="middle" font-size="9.5" fill="#888">单指针 j 全程只前进</text>
</svg>
