<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 590"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="590" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：按长度分层 + 定长滑窗</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">ans 初值取 +∞：仅「严格 &gt; 0」的窗口才更新；返回前用 +∞ 判空输出 −1</text>

  <!-- 开始 -->
  <rect x="215" y="50" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 78 L 260 90" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B1 枚举长度 -->
  <rect x="150" y="92" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">枚举窗口长度 k = l … r</text>
  <path d="M 260 130 L 260 142" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B2 首窗口 -->
  <rect x="150" y="144" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="167" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">sum ← 前 k 项之和（首窗口）</text>
  <path d="M 260 182 L 260 194" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 判断 -->
  <polygon points="260,196 322,232 260,268 198,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">sum &gt; 0 ?</text>
  <path d="M 322 232 L 382 232" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="344" y="226" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <rect x="386" y="212" width="118" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="445" y="236" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">ans ← min(ans, sum)</text>
  <path d="M 445 252 L 445 290 L 429 290" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <path d="M 260 268 L 260 284" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="280" font-size="9.5" fill="#a07830" filter="url(#rough2)">否</text>

  <!-- B3 滑窗 -->
  <rect x="95" y="286" width="330" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">i 从 k 到 n−1（窗口右端前进）</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">sum ← sum + nums[i] − nums[i−k]</text>
  <path d="M 260 330 L 260 342" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2 判断 -->
  <polygon points="260,344 322,380 260,416 198,380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">sum &gt; 0 ?</text>
  <path d="M 322 380 L 382 380" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="344" y="374" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <rect x="386" y="360" width="118" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="445" y="384" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">ans ← min(ans, sum)</text>
  <path d="M 445 400 L 445 436 L 268 436" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <path d="M 260 416 L 260 431" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="427" font-size="9.5" fill="#a07830" filter="url(#rough2)">否</text>

  <!-- i 内层循环（虚线回边） -->
  <path d="M 198 380 L 66 380 L 66 308 L 91 308" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="132" y="372" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i 未滑到底：i ← i+1，继续滑</text>

  <!-- 汇合点 -->
  <circle cx="260" cy="436" r="3.5" fill="#666" filter="url(#rough2)"/>

  <!-- k 外层循环（虚线回边） -->
  <path d="M 260 436 L 34 436 L 34 111 L 146 111" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="150" y="428" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">k ≤ r：k ← k+1，换下一档长度</text>

  <path d="M 260 440 L 260 452" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="450" font-size="9" fill="#a07830" filter="url(#rough2)">k &gt; r（长度全试完）</text>

  <!-- D3 终判 -->
  <polygon points="260,456 330,492 260,528 190,492" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="496" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">ans ≠ +∞ ?</text>

  <path d="M 190 492 L 170 492 L 170 538" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="180" y="484" text-anchor="end" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <rect x="110" y="542" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="564" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 330 492 L 350 492 L 350 538" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="484" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="290" y="542" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="350" y="564" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>
</svg>
