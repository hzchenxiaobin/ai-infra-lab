<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：JOIN 关联 → WHERE 筛行 → GROUP BY 求和 → HAVING 筛组</text>

  <!-- ===== Candidates table (left) ===== -->
  <text x="50" y="52" font-size="10" fill="#888">Candidates（候选人）</text>
  <rect x="40" y="58" width="170" height="116" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="74" font-size="9" fill="#446688" font-weight="bold">cand  name    exp  iv</text>
  <line x1="40" y1="80" x2="210" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="42" y="84" width="166" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="50" y="97" font-size="9" fill="#b85450">11   Atticus  1   101</text>
  <rect x="42" y="104" width="166" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="50" y="117" font-size="9" fill="#4a7a3a" font-weight="bold">9    Ruben    6   104</text>
  <rect x="42" y="124" width="166" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="50" y="137" font-size="9" fill="#d6a040">6    Aliza   10   109</text>
  <rect x="42" y="144" width="166" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="50" y="157" font-size="9" fill="#b85450">8    Alfredo  0   107</text>

  <!-- ===== Rounds table (right) ===== -->
  <text x="370" y="52" font-size="10" fill="#888">Rounds（轮次打分）</text>
  <rect x="350" y="58" width="200" height="256" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="74" font-size="9" fill="#446688" font-weight="bold">iv    round  score</text>
  <line x1="350" y1="80" x2="550" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <!-- 101 rows (red/pink) -->
  <rect x="352" y="84" width="196" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="97" font-size="9" fill="#b85450">101    2      8</text>
  <rect x="352" y="104" width="196" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="117" font-size="9" fill="#b85450">101    1      8</text>
  <!-- 104 rows (green) -->
  <rect x="352" y="124" width="196" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="360" y="137" font-size="9" fill="#4a7a3a">104    3      6</text>
  <rect x="352" y="142" width="196" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="360" y="155" font-size="9" fill="#4a7a3a">104    4      7</text>
  <rect x="352" y="160" width="196" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="360" y="173" font-size="9" fill="#4a7a3a">104    1      2</text>
  <rect x="352" y="178" width="196" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="360" y="191" font-size="9" fill="#4a7a3a">104    2      7</text>
  <!-- 109 rows (orange) -->
  <rect x="352" y="196" width="196" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="360" y="209" font-size="9" fill="#d6a040">109    3      4</text>
  <rect x="352" y="214" width="196" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="360" y="227" font-size="9" fill="#d6a040">109    4      1</text>
  <rect x="352" y="232" width="196" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="360" y="245" font-size="9" fill="#d6a040">109    1      4</text>
  <rect x="352" y="250" width="196" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="360" y="263" font-size="9" fill="#d6a040">109    2      1</text>
  <!-- 107 rows (red/pink) -->
  <rect x="352" y="268" width="196" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="281" font-size="9" fill="#b85450">107    1      3</text>
  <rect x="352" y="286" width="196" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="299" font-size="9" fill="#b85450">107    2      3</text>

  <!-- ===== JOIN arrows (interview_id match) ===== -->
  <text x="220" y="48" font-size="9" fill="#888">JOIN USING(iv)</text>
  <!-- Atticus(101) -> 101 rows -->
  <path d="M 210 95 C 280 95, 280 95, 350 95" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)" opacity="0.6"/>
  <path d="M 210 95 C 280 95, 280 113, 350 113" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)" opacity="0.6"/>
  <!-- Ruben(104) -> 104 rows -->
  <path d="M 210 115 C 280 115, 280 133, 350 133" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.75"/>
  <path d="M 210 115 C 280 115, 280 151, 350 151" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.75"/>
  <path d="M 210 115 C 280 115, 280 169, 350 169" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.75"/>
  <path d="M 210 115 C 280 115, 280 187, 350 187" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.75"/>
  <!-- Aliza(109) -> 109 rows -->
  <path d="M 210 135 C 280 135, 280 205, 350 205" stroke="#d6a040" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 210 135 C 280 135, 280 223, 350 223" stroke="#d6a040" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 210 135 C 280 135, 280 241, 350 241" stroke="#d6a040" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 210 135 C 280 135, 280 259, 350 259" stroke="#d6a040" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7"/>
  <!-- Alfredo(107) -> 107 rows -->
  <path d="M 210 155 C 280 155, 280 277, 350 277" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)" opacity="0.6"/>
  <path d="M 210 155 C 280 155, 280 295, 350 295" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)" opacity="0.6"/>

  <!-- ===== Arrow down to WHERE ===== -->
  <path d="M 290 322 L 290 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== WHERE filter box ===== -->
  <rect x="100" y="342" width="380" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">WHERE years_of_exp &gt;= 2</text>
  <text x="290" y="374" text-anchor="middle" font-size="9" fill="#b85450">行级过滤：裁掉 Atticus(1年) 与 Alfredo(0年)</text>

  <!-- Arrow down -->
  <path d="M 290 384 L 290 398" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== GROUP BY + SUM box ===== -->
  <rect x="100" y="402" width="380" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="420" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY candidate_id</text>
  <text x="290" y="434" text-anchor="middle" font-size="9" fill="#888">SUM(score) AS 总分：Ruben=22，Aliza=10</text>

  <!-- Arrow down -->
  <path d="M 290 444 L 290 458" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== HAVING decision ===== -->
  <polygon points="290,462 420,498 290,534 160,498" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="494" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">HAVING</text>
  <text x="290" y="510" text-anchor="middle" font-size="10" fill="#d6a040">SUM &gt; 10?</text>

  <!-- No branch (left) -->
  <path d="M 160 498 L 108 498" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="134" y="492" text-anchor="middle" font-size="9" fill="#b85450">否</text>
  <rect x="28" y="484" width="78" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="67" y="504" text-anchor="middle" font-size="9" fill="#b85450">Aliza 10</text>

  <!-- Yes branch (right) -->
  <path d="M 420 498 L 470 498" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="445" y="492" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>
  <rect x="472" y="482" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="522" y="498" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">candidate_id</text>
  <text x="522" y="512" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- Legend -->
  <rect x="224" y="170" width="152" height="58" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="234" y="184" font-size="8" fill="#b85450">红：Atticus / Alfredo（经验不足）</text>
  <text x="234" y="198" font-size="8" fill="#4a7a3a">绿：Ruben（经验6年，总分22 ✓）</text>
  <text x="234" y="212" font-size="8" fill="#d6a040">橙：Aliza（经验10年，总分10 ✗）</text>
  <text x="234" y="224" font-size="8" fill="#888">虚线同色 = 同 interview_id</text>
</svg>
