<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：next(n) → 比较当前对 → 扣减或跳对 → 返回</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">指针 i 单调前进；时间 O(L) 总 / O(1) 均摊每次，空间 O(L) 存 encoding</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: init / constructor -->
    <rect x="40" y="62" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="82" font-size="12" fill="#446688" font-weight="bold">① 构造 RLEIterator(encoding)</text>
    <text x="260" y="82" font-family="monospace" font-size="10" fill="#555">A = encoding;   i = 0;</text>
    <text x="260" y="98" font-size="9" fill="#888">拷贝编码数组，i 指向第一个「次数」位置（偶数下标）</text>

    <path d="M 260 110 L 260 124" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: next(n) entry -->
    <rect x="40" y="128" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="148" font-size="12" fill="#4a7a3a" font-weight="bold">② next(n) 被调用</text>
    <text x="200" y="148" font-family="monospace" font-size="10" fill="#555">while i &lt; len(A) &amp;&amp; n &gt; 0:</text>
    <text x="200" y="162" font-size="9" fill="#888">还有剩余对、且仍需消耗</text>

    <path d="M 260 172 L 260 190" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: decision diamond -->
    <polygon points="260,196 380,238 260,280 140,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="260" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">A[i] ≥ n ?</text>
    <text x="260" y="248" text-anchor="middle" font-size="9" fill="#888">当前对的次数够吃 n 个吗</text>

    <!-- Yes branch: left -->
    <path d="M 140 238 L 70 238 L 70 270" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="86" y="232" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

    <rect x="20" y="276" width="100" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="70" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">扣减</text>
    <text x="70" y="312" text-anchor="middle" font-size="9" fill="#555" font-family="monospace">A[i] -= n</text>
    <text x="70" y="326" text-anchor="middle" font-size="9" fill="#555" font-family="monospace">return A[i+1]</text>

    <!-- No branch: right -->
    <path d="M 380 238 L 450 238 L 450 270" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="402" y="232" font-size="10" fill="#b85450" font-weight="bold">否</text>

    <rect x="400" y="276" width="100" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="450" y="296" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">跳过整对</text>
    <text x="450" y="312" text-anchor="middle" font-size="9" fill="#555" font-family="monospace">n -= A[i]</text>
    <text x="450" y="326" text-anchor="middle" font-size="9" fill="#555" font-family="monospace">i += 2</text>

    <!-- loop back from No -->
    <path d="M 450 276 L 450 150 L 480 150 L 480 118 L 480 110" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="456" y="210" font-size="8" fill="#b85450">回到 while</text>

    <!-- Step 4: return -1 -->
    <path d="M 260 280 L 260 350" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="268" y="300" font-size="9" fill="#888">while 结束</text>
    <text x="268" y="314" font-size="9" fill="#888">（i 越界或 n&gt;0）</text>

    <rect x="150" y="356" width="220" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="260" y="376" font-size="11" fill="#b85450" font-weight="bold">③ 不足：return -1</text>
    <text x="260" y="390" text-anchor="middle" font-size="9" fill="#888">耗不尽 n 个 → 最后一个被耗的不存在 → -1</text>

    <!-- summary -->
    <rect x="40" y="416" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
    <text x="260" y="436" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">每个「对」最多被扣减 1 次 + 跳过 1 次 → i 单调 → 总 O(L)，均摊 O(1)</text>
    <text x="260" y="450" text-anchor="middle" font-size="9" fill="#555">n 高达 10⁹ 也安全：按对批量跳，而非逐元素消耗</text>
  </g>
</svg>
