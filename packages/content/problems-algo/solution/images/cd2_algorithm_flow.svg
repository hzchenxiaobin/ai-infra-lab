<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：单层循环 + 查表比距离 + 覆盖更新</text>
  <path d="M 140 42 Q 280 50 420 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="70" rx="48" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="#333">开始</text>
  <path d="M 280 88 L 280 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取下一个 nums[i] -->
  <g filter="url(#rough2)">
    <rect x="200" y="102" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="125" text-anchor="middle" font-size="13" fill="#333">取下一个 nums[i]</text>
  <path d="M 280 138 L 280 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策菱形 1 -->
  <g filter="url(#rough2)">
    <polygon points="280,152 395,196 280,240 165,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="190" text-anchor="middle" font-size="12" fill="#333">nums[i] ∈ last</text>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#333">且 i − last ≤ k ?</text>

  <!-- 是 → 返回 true -->
  <path d="M 395 196 L 432 196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#rough2)">
    <ellipse cx="490" cy="196" rx="56" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="490" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 true</text>

  <!-- 否 → 下一步 -->
  <path d="M 280 240 L 280 252" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="250" font-size="11" font-weight="bold" fill="#666">否</text>

  <!-- 覆盖更新 -->
  <g filter="url(#rough2)">
    <rect x="200" y="254" width="160" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="280" y="277" text-anchor="middle" font-size="13" fill="#333">last[nums[i]] = i （覆盖）</text>
  <path d="M 280 290 L 280 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策菱形 2 -->
  <g filter="url(#rough2)">
    <polygon points="280,302 365,336 280,370 195,336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="341" text-anchor="middle" font-size="12" fill="#333">i 还有下一个 ?</text>

  <!-- 是 → 回到取下一个 nums[i] -->
  <path d="M 195 336 L 120 336 L 120 120 L 200 120" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- 否 → 返回 false -->
  <path d="M 365 336 L 432 336" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#rough2)">
    <ellipse cx="490" cy="336" rx="56" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="490" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 false</text>
</svg>
