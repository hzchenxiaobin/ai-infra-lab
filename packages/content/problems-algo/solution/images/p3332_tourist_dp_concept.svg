<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：状态只需「第几天 + 在哪座城」</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">dp[i][j] = 前 i 天结束、身处城市 j 时已拿到的最多点数 —— 怎么来的不影响以后</text>

  <!-- 左侧 DP 网格 -->
  <text x="168" y="66" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">看第 i+1 天「城市 1」的状态从哪里来（以 n = 3 为例）</text>

  <!-- 列头 -->
  <text x="90" y="84" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">城市 0</text>
  <text x="170" y="84" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">城市 1</text>
  <text x="250" y="84" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">城市 2</text>

  <!-- 行标签 -->
  <text x="14" y="108" font-size="9.5" fill="#888" filter="url(#rough2)">第 i 天</text>
  <text x="6" y="230" font-size="9.5" fill="#888" filter="url(#rough2)">第 i+1 天</text>

  <!-- 第 i 行 -->
  <rect x="60" y="90" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="109" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">dp[i][0]</text>
  <rect x="140" y="90" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="109" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">dp[i][1]</text>
  <rect x="220" y="90" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="109" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">dp[i][2]</text>

  <!-- 留城箭头 -->
  <path d="M 170 122 L 170 205" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="162" y="158" text-anchor="end" font-size="9.5" fill="#33506b" filter="url(#rough2)">留在本城</text>
  <text x="162" y="171" text-anchor="end" font-size="9" fill="#33506b" filter="url(#rough2)">+stay[i][1]</text>

  <!-- 跨城箭头 -->
  <path d="M 90 122 C 58 172, 132 180, 157 205" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 122 C 282 172, 208 180, 183 205" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="152" text-anchor="start" font-size="9.5" fill="#a07830" filter="url(#rough2)">从别的城 p 来</text>
  <text x="278" y="165" text-anchor="start" font-size="9" fill="#a07830" filter="url(#rough2)">+travel[p][1]</text>

  <!-- 第 i+1 行 -->
  <rect x="60" y="210" width="60" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="229" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">dp[i+1][0]</text>
  <rect x="140" y="210" width="60" height="30" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="229" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">dp[i+1][1]</text>
  <rect x="220" y="210" width="60" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="229" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">dp[i+1][2]</text>

  <text x="168" y="258" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">n 个来源取最大：本城「留」1 种 + 其他城「赶来」n−1 种</text>

  <!-- 右侧公式卡 -->
  <rect x="316" y="90" width="188" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="112" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">状态转移方程</text>
  <text x="410" y="136" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[i+1][j] = max(</text>
  <text x="410" y="155" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">dp[i][j] + stay[i][j],</text>
  <text x="410" y="174" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">dp[i][p] + travel[p][j] )</text>
  <text x="410" y="192" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（p 取遍所有城，含 j）</text>
  <text x="410" y="216" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">travel[j][j] = 0：p = j 的「走」</text>
  <text x="410" y="230" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">永远被「留」压制（stay ≥ 1）</text>

  <!-- 底部结论 -->
  <rect x="20" y="278" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="299" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">无后效性：未来的收益只取决于「第几天 + 身在哪座城」</text>
  <text x="260" y="317" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">完整历史被「当前城市」一个数压缩 —— 才能把指数级路径折叠成 (k+1)×n 个子问题</text>
</svg>
