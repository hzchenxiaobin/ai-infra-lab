<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    差分数组：5 次标记/对 → 前缀和 → 取最小
  </text>

  <!-- Pair box -->
  <rect x="36" y="50" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="73" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(a, b)</text>

  <!-- arrow to deltas -->
  <path d="M112,67 L132,67" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每对产生 5 个差分标记</text>

  <!-- delta 1: diff[2] +2 -->
  <rect x="140" y="50" width="62" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="66" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">[2] +2</text>

  <!-- delta 2: diff[a+1] -1 -->
  <rect x="212" y="50" width="72" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="66" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">[a+1] −1</text>

  <!-- delta 3: diff[a+b] -1 -->
  <rect x="294" y="50" width="72" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="66" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[a+b] −1</text>

  <!-- delta 4: diff[a+b+1] +1 -->
  <rect x="376" y="50" width="82" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="66" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">[a+b+1] +1</text>

  <!-- delta 5: diff[limit+b+1] +1 -->
  <rect x="376" y="80" width="118" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="96" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">[limit+b+1] +1</text>

  <!-- Accumulation text -->
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    ↓ 所有 n/2 对的标记叠加到同一个 diff 数组
  </text>

  <!-- Diff array bar -->
  <text x="58" y="156" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">diff</text>
  <rect x="66" y="140" width="410" height="30" fill="#f5f5f5" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="160" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    索引 [2, 3, 4, …, 2·limit]  各位置累加增量
  </text>

  <!-- arrow to prefix sum -->
  <path d="M271,172 L271,192" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="186" font-size="10" fill="#888" filter="url(#rough2)">前缀和</text>

  <!-- Cost array bar -->
  <text x="58" y="222" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">cost</text>
  <rect x="66" y="206" width="410" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    cost[S] = Σ diff[2..S]  →  每个目标和的总操作数
  </text>

  <!-- arrow to min -->
  <path d="M271,238 L271,258" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="252" font-size="10" fill="#888" filter="url(#rough2)">取最小</text>

  <!-- Answer box -->
  <rect x="156" y="262" width="230" height="36" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="271" y="285" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    ans = min(cost[2 … 2·limit])
  </text>

  <!-- Complexity note -->
  <rect x="50" y="316" width="420" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    时间 O(n + limit)：每对 O(1) 标记 + 一次线性扫描
  </text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    空间 O(limit)：差分数组大小 2·limit+2
  </text>
</svg>
