<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：滚动 W 计数 + 维护最小值</text>

  <!-- ===== Example 1: blocks="WBBWWBBWBW", k=7 ===== -->
  <text x="30" y="50" font-size="12" fill="#446688" font-weight="bold">示例 1：blocks = "WBBWWBBWBW"，k = 7（窗口 i=0..3）</text>

  <!-- Table header -->
  <rect x="30" y="58" width="480" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="155" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">窗口 blocks[i:i+k]</text>
  <text x="265" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">去头 blocks[i−1]</text>
  <text x="355" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">加尾 blocks[i+k−1]</text>
  <text x="427" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cnt</text>
  <text x="482" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <!-- column separators -->
  <line x1="90"  y1="58" x2="90"  y2="196" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="58" x2="220" y2="196" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="58" x2="310" y2="196" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="58" x2="400" y2="196" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="455" y1="58" x2="455" y2="196" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=0 (init) HIGHLIGHT -->
  <rect x="30" y="84" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="103" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="155" y="103" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">WBBWWBB</text>
  <text x="265" y="103" text-anchor="middle" font-size="11" fill="#888">—（首窗统计）</text>
  <text x="355" y="103" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="427" y="103" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="482" y="103" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- i=1 -->
  <rect x="30" y="112" width="480" height="28" fill="#f4f7fb" stroke="none"/>
  <text x="60"  y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="155" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BBWWBBW</text>
  <text x="265" y="131" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">W → cnt−1</text>
  <text x="355" y="131" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">W → cnt+1</text>
  <text x="427" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="482" y="131" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>

  <!-- i=2 -->
  <rect x="30" y="140" width="480" height="28" fill="#f4f7fb" stroke="none"/>
  <text x="60"  y="159" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="155" y="159" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BWWBBWB</text>
  <text x="265" y="159" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">B → 不变</text>
  <text x="355" y="159" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">B → 不变</text>
  <text x="427" y="159" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="482" y="159" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>

  <!-- i=3 HIGHLIGHT (cnt=4, not min) -->
  <rect x="30" y="168" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="155" y="187" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">WWBBWBW</text>
  <text x="265" y="187" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">B → 不变</text>
  <text x="355" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">W → cnt+1</text>
  <text x="427" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="482" y="187" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- table outer border ex1 -->
  <rect x="30" y="58" width="480" height="138" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result ex1 -->
  <rect x="190" y="204" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">答案 = min cnt = 3 ✓</text>

  <!-- ===== Example 2: blocks="WBWBBBW", k=2 ===== -->
  <text x="30" y="258" font-size="12" fill="#b85450" font-weight="bold">示例 2：blocks = "WBWBBBW"，k = 2（已有连续 2 个 B，答案 0）</text>

  <!-- string boxes: W B W B B B W -->
  <!-- 0 W -->
  <rect x="80"  y="266" width="40" height="34" fill="#fff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="289" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">W</text>
  <!-- 1 B -->
  <rect x="124" y="266" width="40" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="289" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  <!-- 2 W -->
  <rect x="168" y="266" width="40" height="34" fill="#fff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="289" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">W</text>
  <!-- 3 B (optimal window start, highlight green) -->
  <rect x="212" y="266" width="40" height="34" fill="#446688" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="289" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  <!-- 4 B (optimal window end, highlight green) -->
  <rect x="256" y="266" width="40" height="34" fill="#446688" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="289" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  <!-- 5 B -->
  <rect x="300" y="266" width="40" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="289" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  <!-- 6 W -->
  <rect x="344" y="266" width="40" height="34" fill="#fff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="289" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">W</text>

  <!-- bracket for window i=3 (boxes 3,4): "BB" -->
  <path d="M 212 308 Q 212 318 232 320 L 276 320 Q 296 318 296 308" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="254" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 i=3："BB"，含 W × 0 → 无需涂色</text>

  <!-- result ex2 -->
  <rect x="190" y="346" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="366" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">答案 = 0 ✓</text>

  <!-- footer note -->
  <rect x="30" y="390" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="408" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">滚动核心：去头判 W 则 cnt−1，加尾判 W 则 cnt+1，全程 min(ans, cnt)</text>
  <text x="270" y="422" text-anchor="middle" font-size="10" fill="#888">示例 2 中窗口 cnt 一度降到 0，ans 即刻更新为 0 并保持到结束</text>
</svg>
