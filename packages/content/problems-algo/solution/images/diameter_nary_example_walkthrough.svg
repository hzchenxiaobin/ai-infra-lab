<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,null,3,2,4,null,5,6]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">后序递归：每个节点返回高度，并用 top2 更新直径</text>

  <!-- 树结构 -->
  <circle cx="110" cy="78" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="83" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <circle cx="62" cy="142" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="147" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>

  <circle cx="110" cy="142" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="147" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <circle cx="158" cy="142" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <line x1="98" y1="89" x2="72" y2="131" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="110" y1="93" x2="110" y2="129" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="122" y1="89" x2="148" y2="131" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="86" cy="204" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="209" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>

  <circle cx="134" cy="204" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="134" y="209" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>

  <line x1="103" y1="153" x2="92" y2="194" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="121" y1="153" x2="128" y2="194" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

  <!-- 直径路径高亮 5->3->1->4 -->
  <path d="M 86 204 L 62 142 L 110 78 L 158 142" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <!-- 演算表 -->
  <rect x="230" y="56" width="320" height="232" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="76" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">递归过程（后序）</text>
  <line x1="230" y1="84" x2="550" y2="84" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="242" y="100" font-size="10" fill="#4a7a3a" font-weight="bold">节点</text>
  <text x="284" y="100" font-size="10" fill="#4a7a3a" font-weight="bold">孩子高度</text>
  <text x="366" y="100" font-size="10" fill="#4a7a3a" font-weight="bold">h₁</text>
  <text x="396" y="100" font-size="10" fill="#4a7a3a" font-weight="bold">h₂</text>
  <text x="424" y="100" font-size="10" fill="#4a7a3a" font-weight="bold">更新 ans</text>
  <text x="514" y="100" font-size="10" fill="#4a7a3a" font-weight="bold">返回</text>
  <line x1="230" y1="106" x2="550" y2="106" stroke="#ccc" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="242" y="122" font-size="10" fill="#333">5</text>
  <text x="284" y="122" font-size="10" fill="#888">[]</text>
  <text x="366" y="122" font-size="10" fill="#555">0</text>
  <text x="396" y="122" font-size="10" fill="#555">0</text>
  <text x="424" y="122" font-size="10" fill="#555">max(0,0)=0</text>
  <text x="514" y="122" font-size="10" fill="#555">1</text>

  <text x="242" y="140" font-size="10" fill="#333">6</text>
  <text x="284" y="140" font-size="10" fill="#888">[]</text>
  <text x="366" y="140" font-size="10" fill="#555">0</text>
  <text x="396" y="140" font-size="10" fill="#555">0</text>
  <text x="424" y="140" font-size="10" fill="#555">max(0,0)=0</text>
  <text x="514" y="140" font-size="10" fill="#555">1</text>

  <text x="242" y="158" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="284" y="158" font-size="10" fill="#555">[1,1]</text>
  <text x="366" y="158" font-size="10" fill="#555">1</text>
  <text x="396" y="158" font-size="10" fill="#555">1</text>
  <text x="424" y="158" font-size="10" fill="#d6a040" font-weight="bold">max(0,2)=2</text>
  <text x="514" y="158" font-size="10" fill="#555">2</text>

  <text x="242" y="176" font-size="10" fill="#333">2</text>
  <text x="284" y="176" font-size="10" fill="#888">[]</text>
  <text x="366" y="176" font-size="10" fill="#555">0</text>
  <text x="396" y="176" font-size="10" fill="#555">0</text>
  <text x="424" y="176" font-size="10" fill="#555">max(2,0)=2</text>
  <text x="514" y="176" font-size="10" fill="#555">1</text>

  <text x="242" y="194" font-size="10" fill="#333">4</text>
  <text x="284" y="194" font-size="10" fill="#888">[]</text>
  <text x="366" y="194" font-size="10" fill="#555">0</text>
  <text x="396" y="194" font-size="10" fill="#555">0</text>
  <text x="424" y="194" font-size="10" fill="#555">max(2,0)=2</text>
  <text x="514" y="194" font-size="10" fill="#555">1</text>

  <!-- Highlight row for node 1 -->
  <rect x="232" y="202" width="316" height="18" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <text x="242" y="216" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="284" y="216" font-size="10" fill="#b85450" font-weight="bold">[2,1,1]</text>
  <text x="366" y="216" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="396" y="216" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="424" y="216" font-size="10" fill="#b85450" font-weight="bold">max(2,3)=3</text>
  <text x="514" y="216" font-size="10" fill="#b85450" font-weight="bold">3</text>

  <line x1="230" y1="224" x2="550" y2="224" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="390" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最终直径 ans = 3 ✅</text>
  <text x="390" y="262" text-anchor="middle" font-size="10" fill="#888">路径 5 → 3 → 1 → 4，共 3 条边</text>

  <!-- 汇总说明 -->
  <rect x="20" y="232" width="200" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="38" y="252" font-size="11" fill="#333" font-weight="bold">关键点：</text>
  <text x="38" y="270" font-size="10" fill="#555">• 返回值 = 单边高度</text>
  <text x="38" y="286" font-size="10" fill="#555">• ans 用 top2 双边更新</text>
  <text x="38" y="302" font-size="10" fill="#555">• 直径在节点 1 折弯</text>
  <text x="38" y="318" font-size="10" fill="#555">  (h₁=2 来自子树 3，</text>
  <text x="38" y="332" font-size="10" fill="#555">   h₂=1 来自子树 4)</text>
</svg>
