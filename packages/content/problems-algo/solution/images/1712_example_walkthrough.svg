<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,2,2,5,0]　→　ans = 3</text>

  <!-- Prefix sum array -->
  <text x="40" y="52" font-size="10" fill="#888" filter="url(#rough2)">前缀和 P =</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="110" y="40" width="40" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <text x="130" y="56" fill="#888">0</text>
    <rect x="150" y="40" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="170" y="56" fill="#446688" font-weight="bold">1</text>
    <rect x="190" y="40" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="210" y="56" fill="#446688" font-weight="bold">3</text>
    <rect x="230" y="40" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="250" y="56" fill="#446688" font-weight="bold">5</text>
    <rect x="270" y="40" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="290" y="56" fill="#446688" font-weight="bold">7</text>
    <rect x="310" y="40" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="330" y="56" fill="#d6a040" font-weight="bold">12</text>
    <rect x="350" y="40" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="370" y="56" fill="#d6a040" font-weight="bold">12</text>
  </g>
  <text x="400" y="56" font-size="10" fill="#aaa" filter="url(#rough2)">total = P[n] = 12</text>

  <!-- index labels under P -->
  <g filter="url(#rough2)" font-size="8" fill="#aaa" text-anchor="middle">
    <text x="130" y="74">0</text>
    <text x="170" y="74">1</text>
    <text x="210" y="74">2</text>
    <text x="250" y="74">3</text>
    <text x="290" y="74">4</text>
    <text x="330" y="74">5</text>
    <text x="370" y="74">6</text>
  </g>

  <!-- ===== Table ===== -->
  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="40" y="92" width="520" height="28" fill="#446688" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">
    <text x="68" y="110">i</text>
    <text x="130" y="110">leftSum=P[i]</text>
    <text x="230" y="110">jmin（首满足≥2P[i]）</text>
    <text x="350" y="110">jmax（首不满足≤(12+P[i])/2）</text>
    <text x="470" y="110">合法 j 区间</text>
    <text x="540" y="110">方案</text>
  </g>

  <!-- row i=1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="120" width="520" height="44" fill="#fff" stroke="#ccc" stroke-width="1" rx="2"/>
    <line x1="96" y1="120" x2="96" y2="164" stroke="#eee"/>
    <line x1="170" y1="120" x2="170" y2="164" stroke="#eee"/>
    <line x1="290" y1="120" x2="290" y2="164" stroke="#eee"/>
    <line x1="420" y1="120" x2="420" y2="164" stroke="#eee"/>
    <line x1="510" y1="120" x2="510" y2="164" stroke="#eee"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="68" y="146" fill="#555">1</text>
    <text x="133" y="140" fill="#446688" font-weight="bold">1</text>
    <text x="133" y="154" fill="#aaa" font-size="8">2·1=2</text>
    <text x="233" y="140" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="233" y="154" fill="#aaa" font-size="8">P[2]=3≥2 ✓</text>
    <text x="355" y="140" fill="#b85450" font-weight="bold">4</text>
    <text x="355" y="154" fill="#aaa" font-size="8">2·P[4]=14&gt;13</text>
    <text x="465" y="146" fill="#555">[2, 3]</text>
    <text x="540" y="146" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- row i=2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="164" width="520" height="44" fill="#f7f9fc" stroke="#ccc" stroke-width="1" rx="2"/>
    <line x1="96" y1="164" x2="96" y2="208" stroke="#eee"/>
    <line x1="170" y1="164" x2="170" y2="208" stroke="#eee"/>
    <line x1="290" y1="164" x2="290" y2="208" stroke="#eee"/>
    <line x1="420" y1="164" x2="420" y2="208" stroke="#eee"/>
    <line x1="510" y1="164" x2="510" y2="208" stroke="#eee"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="68" y="190" fill="#555">2</text>
    <text x="133" y="184" fill="#446688" font-weight="bold">3</text>
    <text x="133" y="198" fill="#aaa" font-size="8">2·3=6</text>
    <text x="233" y="184" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="233" y="198" fill="#aaa" font-size="8">P[4]=7≥6 ✓</text>
    <text x="355" y="184" fill="#b85450" font-weight="bold">5</text>
    <text x="355" y="198" fill="#aaa" font-size="8">2·P[5]=24&gt;15</text>
    <text x="465" y="190" fill="#555">[4, 4]</text>
    <text x="540" y="190" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- row i=3 -->
  <g filter="url(#rough2)">
    <rect x="40" y="208" width="520" height="44" fill="#fff" stroke="#ccc" stroke-width="1" rx="2"/>
    <line x1="96" y1="208" x2="96" y2="252" stroke="#eee"/>
    <line x1="170" y1="208" x2="170" y2="252" stroke="#eee"/>
    <line x1="290" y1="208" x2="290" y2="252" stroke="#eee"/>
    <line x1="420" y1="208" x2="420" y2="252" stroke="#eee"/>
    <line x1="510" y1="208" x2="510" y2="252" stroke="#eee"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="68" y="234" fill="#555">3</text>
    <text x="133" y="228" fill="#446688" font-weight="bold">5</text>
    <text x="133" y="242" fill="#aaa" font-size="8">2·5=10</text>
    <text x="233" y="228" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="233" y="242" fill="#aaa" font-size="8">P[5]=12≥10 ✓</text>
    <text x="355" y="228" fill="#b85450" font-weight="bold">5</text>
    <text x="355" y="242" fill="#aaa" font-size="8">2·P[5]=24&gt;17</text>
    <text x="465" y="234" fill="#aaa">∅</text>
    <text x="540" y="234" fill="#aaa">0</text>
  </g>

  <!-- row i=4 -->
  <g filter="url(#rough2)">
    <rect x="40" y="252" width="520" height="44" fill="#f7f9fc" stroke="#ccc" stroke-width="1" rx="2"/>
    <line x1="96" y1="252" x2="96" y2="296" stroke="#eee"/>
    <line x1="170" y1="252" x2="170" y2="296" stroke="#eee"/>
    <line x1="290" y1="252" x2="290" y2="296" stroke="#eee"/>
    <line x1="420" y1="252" x2="420" y2="296" stroke="#eee"/>
    <line x1="510" y1="252" x2="510" y2="296" stroke="#eee"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="68" y="278" fill="#555">4</text>
    <text x="133" y="272" fill="#446688" font-weight="bold">7</text>
    <text x="133" y="286" fill="#aaa" font-size="8">2·7=14</text>
    <text x="233" y="272" fill="#b85450" font-weight="bold">6(=n)</text>
    <text x="233" y="286" fill="#aaa" font-size="8">无满足</text>
    <text x="355" y="272" fill="#b85450" font-weight="bold">6</text>
    <text x="355" y="286" fill="#aaa" font-size="8">无满足</text>
    <text x="465" y="278" fill="#aaa">∅</text>
    <text x="540" y="278" fill="#aaa">0</text>
  </g>

  <!-- ===== Total ===== -->
  <rect x="40" y="306" width="520" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总方案数 = 2 + 1 + 0 + 0 = 3　✓</text>

  <!-- ===== footnotes ===== -->
  <rect x="40" y="354" width="520" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="52" y="374" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">读表要点：</text>
  <text x="52" y="390" font-size="9" fill="#555" filter="url(#rough2)">• jmin = 首个 P[j] ≥ 2·P[i] 的 j；jmax = 首个 2·P[j] &gt; P[n]+P[i] 的 j（即首个不合法）</text>
  <text x="52" y="404" font-size="9" fill="#555" filter="url(#rough2)">• 合法 j ∈ [jmin, jmax−1]，个数 = jmax − jmin（注意是减法，不是 +1）</text>
  <text x="52" y="418" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">• i=1→2：jmin 2→4、jmax 4→5，均只右移不回退 → 单调性体现 → 双指针 O(n)</text>
</svg>
