<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">加权随机采样核心：权重 → 前缀和 → [0, total) 整数轴分段</text>

  <!-- 前缀和标注 -->
  <text x="40" y="68" font-size="11" fill="#888">前缀和 pre[i]</text>

  <!-- 前缀和格子（对齐到各自右边界） -->
  <rect x="112" y="50" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <rect x="232" y="50" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>

  <rect x="312" y="50" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>

  <rect x="472" y="50" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="492" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">10</text>

  <text x="520" y="68" font-size="11" fill="#888">=total</text>

  <!-- 虚线：前缀和右边界 → 数轴边界 -->
  <path d="M 130 80 L 130 138" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 250 80 L 250 138" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 330 80 L 330 138" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 492 80 L 492 138" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <!-- 整数轴分段（宽度按权重比例） 80..492, total=10 → 41.2px/单位 -->
  <rect x="90" y="140" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="110" y="160" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i=0</text>

  <rect x="130" y="140" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="190" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i=1</text>

  <rect x="250" y="140" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="290" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i=2</text>

  <rect x="330" y="140" width="162" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="411" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=3</text>

  <!-- 权重标注（段内第二行） -->
  <text x="110" y="184" text-anchor="middle" font-size="10" fill="#888">w=1</text>
  <text x="190" y="184" text-anchor="middle" font-size="10" fill="#888">w=3</text>
  <text x="290" y="184" text-anchor="middle" font-size="10" fill="#888">w=2</text>
  <text x="411" y="184" text-anchor="middle" font-size="10" fill="#888">w=4</text>

  <!-- 边界刻度 -->
  <text x="90" y="200" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="130" y="200" text-anchor="middle" font-size="10" fill="#666">1</text>
  <text x="250" y="200" text-anchor="middle" font-size="10" fill="#666">4</text>
  <text x="330" y="200" text-anchor="middle" font-size="10" fill="#666">6</text>
  <text x="492" y="200" text-anchor="middle" font-size="10" fill="#666">10</text>

  <!-- 随机点 r=5 落在 i=2 段 -->
  <path d="M 296 110 L 296 138" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="262" y="92" width="68" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="296" y="106" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">r=5 落入 i=2</text>

  <!-- 概率说明框 -->
  <rect x="36" y="222" width="488" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="246" font-size="12" fill="#4a7a3a" font-weight="bold">为什么这样采样是「按权重」的？</text>
  <text x="56" y="268" font-size="11" fill="#555">• 下标 i 在整数轴 [0, total) 上占据长度恰好为 w[i] 的一段：[pre[i−1], pre[i])</text>
  <text x="56" y="288" font-size="11" fill="#555">• r = rand() % total 均匀落在 [0, total) 中某一点</text>
  <text x="56" y="308" font-size="11" fill="#555">• r 落入第 i 段的概率 = 段长 / total = w[i] / total  →  恰为所求权重比</text>
  <text x="56" y="332" font-size="11" fill="#b85450" font-weight="bold">本例：P(0)=1/10, P(1)=3/10, P(2)=2/10, P(3)=4/10</text>
  <text x="56" y="352" font-size="10.5" fill="#888">实现：在 pre 上二分找「首个 pre[i] &gt; r」的下标 i 即为返回值</text>
</svg>
