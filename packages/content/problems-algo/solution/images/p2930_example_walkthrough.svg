<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 4，答案 12</text>

  <!-- left: computation steps -->
  <rect x="25" y="46" width="268" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="159" y="64" text-anchor="middle" font-size="12" fill="#333">总数：26⁴ = 456976</text>
  <text x="159" y="80" text-anchor="middle" font-size="9" fill="#888">全部长度为 4 的字符串</text>
  <path d="M 159 92 L 159 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="104" width="268" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="159" y="122" text-anchor="middle" font-size="12" fill="#333">单事件：|A|+|B|+|C|</text>
  <text x="159" y="138" text-anchor="middle" font-size="11" fill="#333">= 3·25⁴ + 4·25³ = 1234375</text>
  <text x="159" y="156" text-anchor="middle" font-size="9" fill="#888">其中 4·25³ = 62500 是「恰 1 个 e」</text>
  <path d="M 159 164 L 159 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="174" width="268" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="159" y="192" text-anchor="middle" font-size="12" fill="#333">两两交集：|A∩B|+|A∩C|+|B∩C|</text>
  <text x="159" y="208" text-anchor="middle" font-size="11" fill="#333">= 3·24⁴ + 2·4·24³ = 1105920</text>
  <text x="159" y="226" text-anchor="middle" font-size="9" fill="#888">容斥展开中要「加回」</text>
  <path d="M 159 234 L 159 242" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="244" width="268" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="159" y="262" text-anchor="middle" font-size="12" fill="#333">三交集：|A∩B∩C|</text>
  <text x="159" y="278" text-anchor="middle" font-size="11" fill="#333">= 23⁴ + 4·23³ = 328509</text>
  <path d="M 159 298 L 159 306" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="308" width="268" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="159" y="326" text-anchor="middle" font-size="11" fill="#333">|A∪B∪C| = 1234375 − 1105920 + 328509</text>
  <text x="159" y="344" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">= 456964</text>
  <path d="M 159 352 L 159 358" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="360" width="268" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="159" y="383" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = 456976 − 456964 = 12 ✓</text>

  <!-- right: the 12 strings -->
  <text x="310" y="62" font-size="12" fill="#555" font-weight="bold">n = 4 的 12 个好字符串</text>

  <rect x="318" y="74" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="344" y="92" text-anchor="middle" font-size="11" fill="#333">eelt</text>
  <rect x="376" y="74" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="402" y="92" text-anchor="middle" font-size="11" fill="#333">eetl</text>
  <rect x="434" y="74" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="460" y="92" text-anchor="middle" font-size="11" fill="#333">elet</text>

  <rect x="318" y="110" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="344" y="128" text-anchor="middle" font-size="11" fill="#333">elte</text>
  <rect x="376" y="110" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="402" y="128" text-anchor="middle" font-size="11" fill="#333">etel</text>
  <rect x="434" y="110" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="460" y="128" text-anchor="middle" font-size="11" fill="#333">etle</text>

  <rect x="318" y="146" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">leet</text>
  <rect x="376" y="146" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="402" y="164" text-anchor="middle" font-size="11" fill="#333">lete</text>
  <rect x="434" y="146" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="460" y="164" text-anchor="middle" font-size="11" fill="#333">ltee</text>

  <rect x="318" y="182" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="344" y="200" text-anchor="middle" font-size="11" fill="#333">teel</text>
  <rect x="376" y="182" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="402" y="200" text-anchor="middle" font-size="11" fill="#333">tele</text>
  <rect x="434" y="182" width="52" height="28" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="460" y="200" text-anchor="middle" font-size="11" fill="#333">tlee</text>

  <rect x="310" y="228" width="185" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="402" y="250" text-anchor="middle" font-size="11" fill="#333">n = 4 时好字符串</text>
  <text x="402" y="268" text-anchor="middle" font-size="11" fill="#333">= l, e, e, t 的全排列</text>
  <text x="402" y="286" text-anchor="middle" font-size="11" fill="#333">= 4! / 2! = 12</text>
  <text x="402" y="304" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">与容斥结果互相印证 ✓</text>

  <rect x="310" y="326" width="185" height="50" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="402" y="346" text-anchor="middle" font-size="9" fill="#666">n &lt; 4 时配额凑不齐</text>
  <text x="402" y="364" text-anchor="middle" font-size="9" fill="#666">公式与 DP 都自动给 0，无需特判</text>
</svg>
