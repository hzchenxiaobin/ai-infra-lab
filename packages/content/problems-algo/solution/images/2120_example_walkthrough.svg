  <!-- ===== Bottom summary ===== -->
  <rect x="60" y="380" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终结果</text>
  <text x="280" y="418" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">answer = [1, 5, 4, 3, 1, 0]  ✓</text>
</svg>
