<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=3, startPos=[0,1], s="RRDDLU"</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">绿=S 起点 · 蓝=成功步 · 红=越界步 · answer 标于下方</text>

  <!-- ========================================================= -->
  <!-- Helper: each mini-grid is 3x3, cell 26x26, total 78x78    -->
  <!-- (r,c) center = (ox + c*26 + 13, oy + r*26 + 13)           -->
  <!-- ========================================================= -->

  <!-- ===== Row 1 ===== -->

  <!-- ----- i=0: "RRDDLU", path: (0,1)->(0,2)->out(R), ans=1 ----- -->
  <g>
    <text x="79" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=0 : "RRDDLU"</text>
    <!-- grid origin (40, 80) -->
    <rect x="40" y="80" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="66" y="80" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
    <rect x="92" y="80" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="40" y="106" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="66" y="106" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="92" y="106" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="40" y="132" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="66" y="132" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="92" y="132" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <!-- startPos (0,1) center (79, 93) -->
    <circle cx="79" cy="93" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
    <!-- R to (0,2) center (105,93) -->
    <path d="M 85 93 L 99 93" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <circle cx="105" cy="93" r="5" fill="#446688" filter="url(#rough2)"/>
    <!-- R out to (0,3) -->
    <path d="M 110 93 L 132 93" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <text x="140" y="97" font-size="11" fill="#b85450" font-weight="bold">✗</text>
    <text x="79" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">answer[0] = 1</text>
  </g>

  <!-- ----- i=1: "RDDLU", path: (0,1)->(0,2)->(1,2)->(2,2)->(2,1)->(1,1), ans=5 ----- -->
  <g>
    <text x="239" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=1 : "RDDLU"</text>
    <!-- grid origin (200, 80) -->
    <rect x="200" y="80" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="226" y="80" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
    <rect x="252" y="80" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="200" y="106" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="226" y="106" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="252" y="106" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="200" y="132" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="226" y="132" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="252" y="132" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <!-- startPos (0,1) center (239, 93) -->
    <circle cx="239" cy="93" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
    <!-- R to (0,2) (265,93) -->
    <path d="M 245 93 L 259 93" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- D to (1,2) (265,119) -->
    <path d="M 265 99 L 265 113" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- D to (2,2) (265,145) -->
    <path d="M 265 125 L 265 139" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- L to (2,1) (239,145) -->
    <path d="M 259 145 L 245 145" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- U to (1,1) (239,119) -->
    <path d="M 239 139 L 239 125" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <circle cx="239" cy="119" r="5" fill="#446688" filter="url(#rough2)"/>
    <text x="239" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">answer[1] = 5</text>
  </g>

  <!-- ----- i=2: "DDLU", path: (0,1)->(1,1)->(2,1)->(2,0)->(1,0), ans=4 ----- -->
  <g>
    <text x="399" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=2 : "DDLU"</text>
    <!-- grid origin (360, 80) -->
    <rect x="360" y="80" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="386" y="80" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
    <rect x="412" y="80" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="360" y="106" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="386" y="106" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="412" y="106" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="360" y="132" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="386" y="132" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="412" y="132" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <!-- startPos (0,1) center (399, 93) -->
    <circle cx="399" cy="93" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
    <!-- D to (1,1) (399,119) -->
    <path d="M 399 99 L 399 113" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- D to (2,1) (399,145) -->
    <path d="M 399 125 L 399 139" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- L to (2,0) (373,145) -->
    <path d="M 393 145 L 379 145" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- U to (1,0) (373,119) -->
    <path d="M 373 139 L 373 125" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <circle cx="373" cy="119" r="5" fill="#446688" filter="url(#rough2)"/>
    <text x="399" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">answer[2] = 4</text>
  </g>

  <!-- ===== Row 2 ===== -->

  <!-- ----- i=3: "DLU", path: (0,1)->(1,1)->(1,0)->(0,0), ans=3 ----- -->
  <g>
    <text x="79" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=3 : "DLU"</text>
    <!-- grid origin (40, 250) -->
    <rect x="40" y="250" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="66" y="250" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
    <rect x="92" y="250" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="40" y="276" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="66" y="276" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="92" y="276" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="40" y="302" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="66" y="302" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="92" y="302" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <!-- startPos (0,1) center (79, 263) -->
    <circle cx="79" cy="263" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
    <!-- D to (1,1) (79,289) -->
    <path d="M 79 269 L 79 283" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- L to (1,0) (53,289) -->
    <path d="M 73 289 L 59 289" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- U to (0,0) (53,263) -->
    <path d="M 53 283 L 53 269" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <circle cx="53" cy="263" r="5" fill="#446688" filter="url(#rough2)"/>
    <text x="79" y="350" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">answer[3] = 3</text>
  </g>

  <!-- ----- i=4: "LU", path: (0,1)->(0,0)->out(U), ans=1 ----- -->
  <g>
    <text x="239" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=4 : "LU"</text>
    <!-- grid origin (200, 250) -->
    <rect x="200" y="250" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="226" y="250" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
    <rect x="252" y="250" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="200" y="276" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="226" y="276" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="252" y="276" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="200" y="302" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="226" y="302" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="252" y="302" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <!-- startPos (0,1) center (239, 263) -->
    <circle cx="239" cy="263" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
    <!-- L to (0,0) (213,263) -->
    <path d="M 233 263 L 219 263" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <circle cx="213" cy="263" r="5" fill="#446688" filter="url(#rough2)"/>
    <!-- U out to (-1,0) -->
    <path d="M 213 257 L 213 235" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <text x="225" y="240" font-size="11" fill="#b85450" font-weight="bold">✗</text>
    <text x="239" y="350" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">answer[4] = 1</text>
  </g>

  <!-- ----- i=5: "U", path: (0,1)->out(U), ans=0 ----- -->
  <g>
    <text x="399" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=5 : "U"</text>
    <!-- grid origin (360, 250) -->
    <rect x="360" y="250" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="386" y="250" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
    <rect x="412" y="250" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="360" y="276" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="386" y="276" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="412" y="276" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="360" y="302" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="386" y="302" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <rect x="412" y="302" width="26" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <!-- startPos (0,1) center (399, 263) -->
