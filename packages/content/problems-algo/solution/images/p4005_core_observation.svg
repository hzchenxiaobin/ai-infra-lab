<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">核心观察：固定目标 x，元素代价三分 0 / 1 / 2</text>
    <text x="24" y="38" font-size="10" fill="#555">示例 nums = [6, 12, 2, 5]，候选目标 x = 6（n = 4）</text>

    <!-- 元素行 -->
    <rect x="30" y="48" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="52" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
    <rect x="78" y="48" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="100" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12</text>
    <rect x="126" y="48" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="148" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <rect x="174" y="48" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="196" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

    <path d="M222 63 L290 63" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="296" y="46" width="76" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="334" y="67" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">目标 x = 6</text>

    <rect x="388" y="46" width="108" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="442" y="64" text-anchor="middle" font-size="8" fill="#7a5c1a">操作：新值须为旧值的</text>
    <text x="442" y="78" text-anchor="middle" font-size="8" fill="#7a5c1a">因子或倍数，且 &gt; 1</text>

    <!-- 三档代价 -->
    <rect x="24" y="96" width="258" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="153" y="115" text-anchor="middle" font-size="9.5" fill="#2f5d24">① v = x　→　0 次　·　元素 6</text>
    <rect x="24" y="130" width="258" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="153" y="149" text-anchor="middle" font-size="9.5" fill="#33506b">② v|x 或 x|v　→　1 次　·　12、2</text>
    <rect x="24" y="164" width="258" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="153" y="183" text-anchor="middle" font-size="9.5" fill="#8f3a36">③ 无整除关系　→　2 次　·　元素 5</text>

    <!-- 两步中转 -->
    <rect x="296" y="96" width="200" height="98" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="396" y="114" text-anchor="middle" font-size="9.5" fill="#7a5c1a" font-weight="bold">无关系？公倍数中转两步</text>
    <rect x="306" y="122" width="34" height="24" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.6"/>
    <text x="323" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
    <path d="M342 134 L364 134" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="353" y="127" text-anchor="middle" font-size="8" fill="#7a5c1a">×6</text>
    <rect x="368" y="122" width="34" height="24" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.6"/>
    <text x="385" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">30</text>
    <path d="M404 134 L426 134" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="415" y="127" text-anchor="middle" font-size="8" fill="#7a5c1a">÷5</text>
    <rect x="430" y="122" width="34" height="24" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="447" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
    <text x="396" y="163" text-anchor="middle" font-size="8" fill="#7a5c1a">30 既是 5 的倍数、又是 6 的倍数</text>
    <text x="396" y="178" text-anchor="middle" font-size="8" fill="#7a5c1a">一步只走一条整除关系 ⇒ ③ 至少 2 次</text>

    <!-- 代价公式 -->
    <rect x="24" y="210" width="472" height="90" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="228" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">代价公式（只需评测出现过的 x &gt; 1）</text>
    <text x="260" y="251" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">cost(x) = 2n − mul(x) − div(x) = 8 − 2 − 2 = 4</text>
    <text x="260" y="270" text-anchor="middle" font-size="8.5" fill="#555">mul(x) = 被 x 整除的元素数 = |{6,12}| = 2　　div(x) = 整除 x 的元素数 = |{6,2}| = 2</text>
    <text x="260" y="287" text-anchor="middle" font-size="8.5" fill="#4a7a3a">与 x 相等的元素在 mul、div 里各计一次 ⇒ 贡献 2 − 1 − 1 = 0，公式无需特判</text>

    <!-- 底部两条 -->
    <rect x="24" y="312" width="228" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="138" y="326" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold">候选收缩：ans = min(n, 出现值代价)</text>
    <text x="138" y="339" text-anchor="middle" font-size="7.5" fill="#4a7a3a">未出现的目标每元素 ≥ 1 次 ⇒ ≥ n；公倍数目标 ≤ n</text>

    <rect x="268" y="312" width="228" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="382" y="326" text-anchor="middle" font-size="9" fill="#8f3a36" font-weight="bold">全为 1 的数组：特判返回 0</text>
    <text x="382" y="339" text-anchor="middle" font-size="7.5" fill="#b85450">目标须 &gt; 1；混合数组里 1 整除一切，计入 div(x)</text>

    <text x="260" y="357" text-anchor="middle" font-size="8" fill="#999">示例验证：[6,12,8] → 3　[5,15,20] → 2　[7,7,7] → 0</text>
  </g>
</svg>
