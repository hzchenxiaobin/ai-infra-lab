<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <text x="270" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：i=1..n 顺序贪心，遇 banned 跳过、超预算即停</text>

  <!-- ===== Example 1: banned=[1,6,5], n=5, maxSum=6 -> 2 ===== -->
  <text x="30" y="44" font-size="11.5" fill="#888" font-weight="bold">示例 1</text>
  <!-- boxes 1..5 ; banned {1,5}, taken {2,3}, avail-not-taken {4} -->
  <rect x="30" y="50" width="34" height="28" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="47" y="69" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">1</text>
  <path d="M 34 54 L 60 74 M 60 54 L 34 74" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="69" y="50" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="69" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="108" y="50" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="69" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="147" y="50" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="69" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">4</text>
  <rect x="186" y="50" width="34" height="28" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="203" y="69" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">5</text>
  <path d="M 190 54 L 216 74 M 216 54 L 190 74" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="30" y="92" font-size="10.5" fill="#888">灰=禁选  绿=已选  蓝=可选但超预算停</text>
  <text x="240" y="64" font-size="11.5" fill="#4a7a3a" font-weight="bold">2+3=5 ≤ 6；+4→9 &gt; 6 停</text>
  <text x="470" y="66" font-size="13" fill="#b85450" font-weight="bold">→ 2</text>

  <!-- ===== Example 2: banned=[1..7], n=8, maxSum=1 -> 0 ===== -->
  <text x="30" y="116" font-size="11.5" fill="#888" font-weight="bold">示例 2</text>
  <!-- boxes 1..8 ; 1..7 banned, 8 available but 8>1 -->
  <rect x="30" y="122" width="30" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="45" y="140" text-anchor="middle" font-size="12.5" fill="#999" font-weight="bold">1</text>
  <rect x="64" y="122" width="30" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="79" y="140" text-anchor="middle" font-size="12.5" fill="#999" font-weight="bold">2</text>
  <rect x="98" y="122" width="30" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="113" y="140" text-anchor="middle" font-size="12.5" fill="#999" font-weight="bold">3</text>
  <rect x="132" y="122" width="30" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="147" y="140" text-anchor="middle" font-size="12.5" fill="#999" font-weight="bold">4</text>
  <rect x="166" y="122" width="30" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="181" y="140" text-anchor="middle" font-size="12.5" fill="#999" font-weight="bold">5</text>
  <rect x="200" y="122" width="30" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="215" y="140" text-anchor="middle" font-size="12.5" fill="#999" font-weight="bold">6</text>
  <rect x="234" y="122" width="30" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="249" y="140" text-anchor="middle" font-size="12.5" fill="#999" font-weight="bold">7</text>
  <rect x="268" y="122" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="283" y="140" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold">8</text>

  <text x="315" y="136" font-size="11.5" fill="#b85450" font-weight="bold">仅 8 可用，8 &gt; 1 → 不取</text>
  <text x="470" y="138" font-size="13" fill="#b85450" font-weight="bold">→ 0</text>

  <!-- ===== Example 3: banned=[11], n=7, maxSum=50 -> 7 ===== -->
  <text x="30" y="184" font-size="11.5" fill="#888" font-weight="bold">示例 3</text>
  <!-- boxes 1..7 all taken (11 not in range) -->
  <rect x="30" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="47" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="69" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="108" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="147" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="186" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="225" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="264" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>

  <text x="315" y="204" font-size="11.5" fill="#4a7a3a" font-weight="bold">1+2+…+7=28 ≤ 50，全取</text>
  <text x="470" y="206" font-size="13" fill="#b85450" font-weight="bold">→ 7</text>

  <!-- summary -->
  <rect x="30" y="240" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="10.5" fill="#555">贪心按 i=1..n 扫描：在 banned 集合中就跳过，否则累加；</text>
  <text x="270" y="274" text-anchor="middle" font-size="10.5" fill="#555">一旦 sum+i 超预算，后续更大的数只会更超 → 立即停，cnt 即答案。</text>
</svg>
