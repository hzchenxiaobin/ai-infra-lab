<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [0,1,2,0,1,2] → 答案 f₂ = 7</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">高亮格 = 本步被更新的计数器；MOD 较大，中间值不取余</text>

  <!-- nums 数组 -->
  <g font-size="13">
    <rect x="210" y="62" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="230" y="83" text-anchor="middle" fill="#333" filter="url(#rough2)">0</text>
    <rect x="252" y="62" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="272" y="83" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>
    <rect x="294" y="62" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="314" y="83" text-anchor="middle" fill="#333" filter="url(#rough2)">2</text>
    <rect x="336" y="62" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="356" y="83" text-anchor="middle" fill="#333" filter="url(#rough2)">0</text>
    <rect x="378" y="62" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="398" y="83" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>
    <rect x="420" y="62" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="440" y="83" text-anchor="middle" fill="#333" filter="url(#rough2)">2</text>
  </g>

  <!-- 表格边框 -->
  <rect x="40" y="108" width="580" height="292" rx="4" fill="none" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="108" width="580" height="32" fill="#f0f0f0" filter="url(#rough2)"/>
  <g font-size="12" fill="#555" font-weight="bold">
    <text x="62" y="128" text-anchor="middle" filter="url(#rough2)">步</text>
    <text x="108" y="128" text-anchor="middle" filter="url(#rough2)">v</text>
    <text x="200" y="128" text-anchor="middle" filter="url(#rough2)">转移</text>
    <text x="320" y="128" text-anchor="middle" filter="url(#rough2)">f₀</text>
    <text x="400" y="128" text-anchor="middle" filter="url(#rough2)">f₁</text>
    <text x="480" y="128" text-anchor="middle" filter="url(#rough2)">f₂</text>
    <text x="565" y="128" text-anchor="middle" filter="url(#rough2)">说明</text>
  </g>
  <!-- 表头分隔 -->
  <line x1="40" y1="140" x2="620" y2="140" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="85" y1="108" x2="85" y2="400" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="130" y1="108" x2="130" y2="400" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="108" x2="270" y2="400" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="108" x2="360" y2="400" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="108" x2="440" y2="400" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="520" y1="108" x2="520" y2="400" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行间分隔 -->
  <g stroke="#eee" stroke-width="1">
    <line x1="40" y1="174" x2="620" y2="174" filter="url(#rough2)"/>
    <line x1="40" y1="206" x2="620" y2="206" filter="url(#rough2)"/>
    <line x1="40" y1="238" x2="620" y2="238" filter="url(#rough2)"/>
    <line x1="40" y1="270" x2="620" y2="270" filter="url(#rough2)"/>
    <line x1="40" y1="302" x2="620" y2="302" filter="url(#rough2)"/>
    <line x1="40" y1="334" x2="620" y2="334" filter="url(#rough2)"/>
    <line x1="40" y1="366" x2="620" y2="366" filter="url(#rough2)"/>
  </g>

  <!-- 数据行 -->
  <g font-size="12" fill="#333">
    <!-- 初 -->
    <text x="62" y="161" text-anchor="middle" fill="#888" filter="url(#rough2)">初</text>
    <text x="108" y="161" text-anchor="middle" fill="#888" filter="url(#rough2)">—</text>
    <text x="200" y="161" text-anchor="middle" fill="#888" filter="url(#rough2)">—</text>
    <text x="320" y="161" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="400" y="161" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="480" y="161" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="565" y="161" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">全空</text>

    <!-- 步1 v=0 -->
    <text x="62" y="193" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="108" y="193" text-anchor="middle" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
    <text x="200" y="193" text-anchor="middle" font-size="11" filter="url(#rough2)">2·0+1</text>
    <rect x="305" y="180" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="320" y="193" text-anchor="middle" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="400" y="193" text-anchor="middle" fill="#aaa" filter="url(#rough2)">0</text>
    <text x="480" y="193" text-anchor="middle" fill="#aaa" filter="url(#rough2)">0</text>
    <text x="565" y="193" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">新开 [0]</text>

    <!-- 步2 v=1 -->
    <text x="62" y="225" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="108" y="225" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="200" y="225" text-anchor="middle" font-size="11" filter="url(#rough2)">2·0+f₀</text>
    <text x="320" y="225" text-anchor="middle" fill="#aaa" filter="url(#rough2)">1</text>
    <rect x="385" y="212" width="30" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="400" y="225" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="480" y="225" text-anchor="middle" fill="#aaa" filter="url(#rough2)">0</text>
    <text x="565" y="225" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">[0]→[0,1]</text>

    <!-- 步3 v=2 -->
    <text x="62" y="257" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="108" y="257" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="200" y="257" text-anchor="middle" font-size="11" filter="url(#rough2)">2·0+f₁</text>
    <text x="320" y="257" text-anchor="middle" fill="#aaa" filter="url(#rough2)">1</text>
    <text x="400" y="257" text-anchor="middle" fill="#aaa" filter="url(#rough2)">1</text>
    <rect x="465" y="244" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="480" y="257" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="565" y="257" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">凑出完整 [0,1,2]</text>

    <!-- 步4 v=0 -->
    <text x="62" y="289" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="108" y="289" text-anchor="middle" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
    <text x="200" y="289" text-anchor="middle" font-size="11" filter="url(#rough2)">2·1+1</text>
    <rect x="305" y="276" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="320" y="289" text-anchor="middle" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
    <text x="400" y="289" text-anchor="middle" fill="#aaa" filter="url(#rough2)">1</text>
    <text x="480" y="289" text-anchor="middle" fill="#aaa" filter="url(#rough2)">1</text>
    <text x="565" y="289" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3 个 0⁺</text>

    <!-- 步5 v=1 -->
    <text x="62" y="321" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="108" y="321" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="200" y="321" text-anchor="middle" font-size="11" filter="url(#rough2)">2·1+f₀</text>
    <text x="320" y="321" text-anchor="middle" fill="#aaa" filter="url(#rough2)">3</text>
    <rect x="385" y="308" width="30" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="400" y="321" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
    <text x="480" y="321" text-anchor="middle" fill="#aaa" filter="url(#rough2)">1</text>
    <text x="565" y="321" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">翻倍+3升级</text>

    <!-- 步6 v=2 -->
    <text x="62" y="353" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="108" y="353" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="200" y="353" text-anchor="middle" font-size="11" filter="url(#rough2)">2·1+f₁</text>
    <text x="320" y="353" text-anchor="middle" fill="#aaa" filter="url(#rough2)">3</text>
    <text x="400" y="353" text-anchor="middle" fill="#aaa" filter="url(#rough2)">5</text>
    <rect x="465" y="340" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="480" y="353" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
    <text x="565" y="353" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">翻倍+5升级</text>

    <!-- 终 -->
    <text x="62" y="385" text-anchor="middle" fill="#888" filter="url(#rough2)">终</text>
    <text x="200" y="385" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">返回 f₂</text>
    <text x="320" y="385" text-anchor="middle" fill="#aaa" filter="url(#rough2)">3</text>
    <text x="400" y="385" text-anchor="middle" fill="#aaa" filter="url(#rough2)">5</text>
    <text x="480" y="385" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
    <text x="565" y="385" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">= 答案</text>
  </g>

  <!-- 底部说明 -->
  <rect x="60" y="412" width="540" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="434" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 4 步直观：到此时 0⁺ 子序列有 3 个</text>
  <text x="80" y="454" font-size="11" fill="#555" filter="url(#rough2)">[idx0] / [idx3] / [idx0,idx3]（不取idx3 / 只取idx3 / 都取）→ 第6步各可升级为完整 0⁺1⁺2⁺，加翻倍得 7</text>
</svg>
