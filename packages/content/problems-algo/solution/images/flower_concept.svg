<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：度数 ≤ 3 vs 颜色 4，贪心必然成功</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 3 的 K4 完全图：每个花园度数 = 3</text>

  <!-- ===== Left: K4 graph ===== -->
  <text x="140" y="78" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">① 图结构：4 节点两两相连</text>

  <!-- Edges of K4 (drawn first, behind nodes) -->
  <g filter="url(#rough2)" stroke="#aaa" stroke-width="1.5" fill="none">
    <line x1="80" y1="120" x2="200" y2="120"/>
    <line x1="80" y1="120" x2="140" y2="210"/>
    <line x1="80" y1="120" x2="200" y2="210"/>
    <line x1="200" y1="120" x2="140" y2="210"/>
    <line x1="200" y1="120" x2="200" y2="210"/>
    <line x1="140" y1="210" x2="200" y2="210"/>
  </g>

  <!-- Nodes colored 1,2,3,4 -->
  <g filter="url(#rough2)" font-size="13" font-weight="bold">
    <circle cx="80" cy="120" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="80" y="125" text-anchor="middle" fill="#b85450">1</text>
    <text x="80" y="100" text-anchor="middle" font-size="9" fill="#b85450">花1</text>

    <circle cx="200" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="200" y="125" text-anchor="middle" fill="#446688">2</text>
    <text x="200" y="100" text-anchor="middle" font-size="9" fill="#446688">花2</text>

    <circle cx="140" cy="210" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="140" y="215" text-anchor="middle" fill="#4a7a3a">3</text>
    <text x="118" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a">花3</text>

    <circle cx="220" cy="210" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="220" y="215" text-anchor="middle" fill="#d6a040">4</text>
    <text x="244" y="222" text-anchor="middle" font-size="9" fill="#d6a040">花4</text>
  </g>

  <!-- Degree annotation -->
  <g filter="url(#rough2)">
    <rect x="55" y="250" width="180" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8"/>
    <text x="145" y="269" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">每个节点度数 = 3</text>
    <text x="145" y="284" text-anchor="middle" font-size="10" fill="#888">邻居最多封禁 3 种颜色</text>
  </g>

  <!-- ===== Right: Color availability ===== -->
  <text x="410" y="78" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">② 颜色池：4 种花色总够用</text>

  <!-- 4 color swatches -->
  <g filter="url(#rough2)" font-size="11" font-weight="bold">
    <rect x="330" y="100" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5"/>
    <text x="355" y="121" text-anchor="middle" fill="#b85450">花1</text>

    <rect x="390" y="100" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="415" y="121" text-anchor="middle" fill="#446688">花2</text>

    <rect x="450" y="100" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="475" y="121" text-anchor="middle" fill="#4a7a3a">花3</text>

    <rect x="510" y="100" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <text x="530" y="121" text-anchor="middle" fill="#d6a040">花4</text>
  </g>

  <!-- Node 4 critical case -->
  <g filter="url(#rough2)">
    <rect x="315" y="152" width="235" height="92" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="8"/>
    <text x="432" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">节点 4 的临界情形</text>
    <text x="432" y="190" text-anchor="middle" font-size="10" fill="#666">邻居 1、2、3 已用花 1、2、3</text>
    <text x="432" y="206" text-anchor="middle" font-size="10" fill="#666">封禁 {1, 2, 3}，仅剩 {4}</text>
    <text x="432" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4 − 3 = 1 种可用 ✓</text>
  </g>

  <!-- Formula box -->
  <g filter="url(#rough2)">
    <rect x="315" y="256" width="235" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="432" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">颜色数 k = 度数上界 + 1</text>
    <text x="432" y="292" text-anchor="middle" font-size="10" fill="#666">4 = 3 + 1 → 贪心恒成功</text>
  </g>

  <!-- ===== Bottom: takeaway ===== -->
  <g filter="url(#rough2)">
    <rect x="50" y="320" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8"/>
    <text x="280" y="342" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">贪心定理：度数 ≤ k−1 时，k 色贪心着色必成功</text>
    <text x="280" y="360" text-anchor="middle" font-size="10" fill="#888">每个节点至多被邻居封禁 k−1 种颜色，至少剩 1 种可选，无需回溯</text>
  </g>

  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">红=花1 | 蓝=花2 | 绿=花3 | 橙=花4 | K4 是度数=3 的紧例</text>
</svg>
