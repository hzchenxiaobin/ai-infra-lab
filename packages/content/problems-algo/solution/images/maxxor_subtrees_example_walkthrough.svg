<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 的 dfs2 逐步演算</text>
  <text x="300" y="42" text-anchor="middle" font-size="10" fill="#888">子树权和 s = {0:26, 1:16, 2:8, 3:6, 4:2, 5:5}；遍历序 0→1→3,4→2→5</text>

  <!-- column x bounds: step 20-66 | action 66-148 | i 148-188 | s[i] 188-240 | trie 240-384 | query 384-478 | ans 478-580 -->
  <!-- table outer -->
  <rect x="18" y="52" width="564" height="412" rx="6" fill="#fff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="18" y="52" width="564" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="43" y="69" text-anchor="middle" font-size="9.5" fill="#2b3f5e" font-weight="bold">步骤</text>
  <text x="107" y="69" text-anchor="middle" font-size="9.5" fill="#2b3f5e" font-weight="bold">动作</text>
  <text x="168" y="69" text-anchor="middle" font-size="9.5" fill="#2b3f5e" font-weight="bold">i</text>
  <text x="214" y="69" text-anchor="middle" font-size="9.5" fill="#2b3f5e" font-weight="bold">s[i]</text>
  <text x="312" y="69" text-anchor="middle" font-size="9.5" fill="#2b3f5e" font-weight="bold">查询前 Trie</text>
  <text x="431" y="69" text-anchor="middle" font-size="9.5" fill="#2b3f5e" font-weight="bold">查询结果</text>
  <text x="529" y="69" text-anchor="middle" font-size="9.5" fill="#2b3f5e" font-weight="bold">ans</text>

  <!-- column separators -->
  <path d="M 66 52 L 66 464" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 148 52 L 148 464" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 188 52 L 188 464" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 240 52 L 240 464" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 384 52 L 384 464" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 478 52 L 478 464" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row height 44, start y=78 -->
  <!-- row 1: step1 node0 -->
  <text x="43" y="104" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">1</text>
  <text x="107" y="104" text-anchor="middle" font-size="9" fill="#666">查/递/插</text>
  <text x="168" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="214" y="104" text-anchor="middle" font-size="10" fill="#333">26</text>
  <text x="312" y="104" text-anchor="middle" font-size="9.5" fill="#999">{ }  ← 空</text>
  <text x="431" y="104" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="529" y="104" text-anchor="middle" font-size="10" fill="#666">0</text>

  <!-- row 2: node1 -->
  <rect x="18" y="110" width="564" height="44" fill="#f7f7f7" opacity="0.6" filter="url(#rough2)"/>
  <text x="43" y="138" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">2</text>
  <text x="107" y="138" text-anchor="middle" font-size="9" fill="#666">查/递</text>
  <text x="168" y="138" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="214" y="138" text-anchor="middle" font-size="10" fill="#333">16</text>
  <text x="312" y="138" text-anchor="middle" font-size="9.5" fill="#999">{ }  ← 空</text>
  <text x="431" y="138" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="529" y="138" text-anchor="middle" font-size="10" fill="#666">0</text>

  <!-- row 3: node3 -->
  <text x="43" y="172" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">3</text>
  <text x="107" y="172" text-anchor="middle" font-size="9" fill="#666">查/插</text>
  <text x="168" y="172" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="214" y="172" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="312" y="172" text-anchor="middle" font-size="9.5" fill="#999">{ }</text>
  <text x="431" y="172" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="529" y="172" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="529" y="184" text-anchor="middle" font-size="7.5" fill="#4a7a3a">→{6}</text>

  <!-- row 4: node4 -->
  <rect x="18" y="198" width="564" height="44" fill="#f7f7f7" opacity="0.6" filter="url(#rough2)"/>
  <text x="43" y="226" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">4</text>
  <text x="107" y="226" text-anchor="middle" font-size="9" fill="#666">查/插</text>
  <text x="168" y="226" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="214" y="226" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="312" y="226" text-anchor="middle" font-size="9.5" fill="#4a7a3a">{6}</text>
  <text x="431" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2⊕6=4</text>
  <text x="529" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="529" y="238" text-anchor="middle" font-size="7.5" fill="#4a7a3a">→{6,2}</text>

  <!-- row 5: insert node1 -->
  <text x="43" y="270" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">5</text>
  <text x="107" y="270" text-anchor="middle" font-size="9" fill="#a8680a">插</text>
  <text x="168" y="270" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="214" y="270" text-anchor="middle" font-size="10" fill="#333">16</text>
  <text x="312" y="270" text-anchor="middle" font-size="9.5" fill="#999">—</text>
  <text x="431" y="270" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="529" y="270" text-anchor="middle" font-size="10" fill="#666">4</text>
  <text x="529" y="282" text-anchor="middle" font-size="7.5" fill="#4a7a3a">→{6,2,16}</text>

  <!-- row 6: node2 HIGHLIGHT -->
  <rect x="18" y="286" width="564" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="43" y="314" text-anchor="middle" font-size="11" fill="#a8680a" font-weight="bold">6</text>
  <text x="107" y="314" text-anchor="middle" font-size="9" fill="#a8680a">查/递</text>
  <text x="168" y="314" text-anchor="middle" font-size="11" fill="#a8680a" font-weight="bold">2</text>
  <text x="214" y="314" text-anchor="middle" font-size="11" fill="#a8680a" font-weight="bold">8</text>
  <text x="312" y="314" text-anchor="middle" font-size="9.5" fill="#2b3f5e" font-weight="bold">{6, 2, 16}</text>
  <text x="431" y="314" text-anchor="middle" font-size="9.5" fill="#a8680a" font-weight="bold">8⊕16=24</text>
  <text x="529" y="314" text-anchor="middle" font-size="11" fill="#a8680a" font-weight="bold">24</text>

  <!-- row 7: node5 -->
  <text x="43" y="358" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">7</text>
  <text x="107" y="358" text-anchor="middle" font-size="9" fill="#666">查/插</text>
  <text x="168" y="358" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="214" y="358" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="312" y="358" text-anchor="middle" font-size="9.5" fill="#2b3f5e">{6,2,16}</text>
  <text x="431" y="358" text-anchor="middle" font-size="10" fill="#666">5⊕16=21</text>
  <text x="529" y="358" text-anchor="middle" font-size="10" fill="#666">24</text>
  <text x="529" y="370" text-anchor="middle" font-size="7.5" fill="#4a7a3a">→{…,5}</text>

  <!-- row 8: insert node2 -->
  <rect x="18" y="374" width="564" height="44" fill="#f7f7f7" opacity="0.6" filter="url(#rough2)"/>
  <text x="43" y="402" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">8</text>
  <text x="107" y="402" text-anchor="middle" font-size="9" fill="#a8680a">插</text>
  <text x="168" y="402" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="214" y="402" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="312" y="402" text-anchor="middle" font-size="9.5" fill="#999">—</text>
  <text x="431" y="402" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="529" y="402" text-anchor="middle" font-size="10" fill="#666">24</text>
  <text x="529" y="414" text-anchor="middle" font-size="7.5" fill="#4a7a3a">→{…,8}</text>

  <!-- row 9: insert node0 -->
  <text x="43" y="446" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">9</text>
  <text x="107" y="446" text-anchor="middle" font-size="9" fill="#a8680a">插</text>
  <text x="168" y="446" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="214" y="446" text-anchor="middle" font-size="10" fill="#333">26</text>
  <text x="312" y="446" text-anchor="middle" font-size="9.5" fill="#999">—</text>
  <text x="431" y="446" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="529" y="446" text-anchor="middle" font-size="10" fill="#666">24</text>
  <text x="529" y="458" text-anchor="middle" font-size="7.5" fill="#4a7a3a">→{…,26}</text>

  <!-- callout arrow to row 6 -->
  <text x="300" y="490" text-anchor="middle" font-size="9.5" fill="#a8680a" font-weight="bold">关键：第 6 步查询 s[2]=8 时，s[1]=16 已于第 5 步入库 → 8⊕16=24</text>
</svg>
