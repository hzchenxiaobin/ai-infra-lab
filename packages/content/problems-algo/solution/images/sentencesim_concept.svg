<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：词对预存哈希集合，双向存键，逐位 O(1) 查询</text>

  <!-- index labels -->
  <text x="40" y="78" font-size="11" fill="#888">下标:</text>
  <text x="150" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="250" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="350" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>

  <!-- sentence1 row -->
  <text x="40" y="116" font-size="12" fill="#888">s1:</text>
  <rect x="110" y="98" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">great</text>
  <rect x="210" y="98" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">acting</text>
  <rect x="310" y="98" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">skills</text>

  <!-- sentence2 row -->
  <text x="40" y="166" font-size="12" fill="#888">s2:</text>
  <rect x="110" y="148" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">fine</text>
  <rect x="210" y="148" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">drama</text>
  <rect x="310" y="148" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">talent</text>

  <!-- vertical compare arrows -->
  <path d="M 150 134 L 150 146" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 134 L 250 146" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 134 L 350 146" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- lookup arrows to set -->
  <path d="M 150 184 Q 150 210 230 230" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 184 L 290 226" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 184 Q 350 210 330 230" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- hash set box -->
  <rect x="110" y="226" width="360" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="248" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">哈希集合 sim（双向存键）</text>
  <text x="130" y="272" font-size="11" fill="#4a7a3a">great#fine</text>
  <text x="250" y="272" font-size="11" fill="#4a7a3a">fine#great</text>
  <text x="370" y="272" font-size="11" fill="#4a7a3a">acting#drama</text>
  <text x="130" y="292" font-size="11" fill="#4a7a3a">drama#acting</text>
  <text x="250" y="292" font-size="11" fill="#4a7a3a">skills#talent</text>
  <text x="370" y="292" font-size="11" fill="#4a7a3a">talent#skills</text>
  <text x="290" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">查 "great#fine" → 命中 ✓ (只需查一个方向)</text>

  <!-- footer hint -->
  <text x="290" y="372" text-anchor="middle" font-size="10" fill="#888">词对表静态不变 → 预处理成集合，把每次 O(m) 查找压成 O(1)</text>
  <text x="290" y="388" text-anchor="middle" font-size="10" fill="#888">相似不传递：只用集合查直接配对，不用并查集</text>
</svg>
