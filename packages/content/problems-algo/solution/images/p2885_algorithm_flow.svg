<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="330" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">rename 一行流程：建映射 → 换列标签 → 返回新表</text>

  <!-- Step 1 -->
  <rect x="24" y="60" width="126" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="87" y="84" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① 输入</text>
  <text x="87" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">students</text>
  <text x="87" y="122" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">id · first · last · age</text>

  <path d="M 152 96 L 174 96" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="178" y="60" width="126" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="241" y="84" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">② 构造映射</text>
  <text x="241" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{'旧名': '新名'}</text>
  <text x="241" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">共 4 对</text>

  <path d="M 306 96 L 328 96" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="332" y="60" width="138" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="401" y="82" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">③ 改名</text>
  <text x="401" y="101" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">students.rename(</text>
  <text x="401" y="117" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">  columns=mapper)</text>

  <path d="M 472 96 L 494 96" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="498" y="60" width="100" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="548" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">④ 返回新表</text>
  <text x="548" y="103" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">student_id …</text>
  <text x="548" y="120" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">age_in_years</text>

  <!-- Notes row -->
  <rect x="24" y="156" width="288" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="168" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✔ 未列出的列 → 保持原名</text>
  <text x="168" y="198" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">部分改名语义：dict 只覆盖要改的列</text>

  <rect x="328" y="156" width="268" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="462" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✘ 键写错 → 静默忽略</text>
  <text x="462" y="198" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">errors='raise' 可升级为报错</text>

  <!-- Bottom summary -->
  <rect x="24" y="240" width="572" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="264" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">返回新 DataFrame，原 students 不动</text>
  <text x="310" y="286" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">经典实现默认拷贝数据 O(n·m)；pandas 2.x CoW 下只重建列索引，近乎零拷贝</text>
</svg>
