<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：遇 ')' 弹栈至 '(' 即得反转段</text>

  <!-- ===== Phase 1: 压栈后 (left) ===== -->
  <text x="85" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 压栈后</text>
  <!-- 栈顶 to 栈底: d c b a ( -->
  <rect x="62" y="66" width="46" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="62" y="92" width="46" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="109" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="62" y="118" width="46" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="135" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="62" y="144" width="46" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="161" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="62" y="170" width="46" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="187" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">(</text>
  <text x="114" y="80" font-size="10" fill="#b85450" font-weight="bold">遇 ')'</text>
  <text x="114" y="95" font-size="9" fill="#888">← 栈顶</text>

  <!-- arrow phase1 -> phase2 -->
  <path d="M 108 130 C 150 130, 170 156, 200 162" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="150" y="138" font-size="10" fill="#b85450" font-weight="bold">弹出</text>

  <!-- ===== Phase 2: tmp (middle) ===== -->
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② 弹出收集 → tmp</text>
  <rect x="200" y="148" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="166" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">d</text>
  <rect x="242" y="148" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="262" y="166" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">c</text>
  <rect x="284" y="148" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="304" y="166" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>
  <rect x="326" y="148" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="346" y="166" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <text x="280" y="192" text-anchor="middle" font-size="10" fill="#888">逆序 = 反转结果，无需再 reverse</text>
  <text x="280" y="208" text-anchor="middle" font-size="9" fill="#d6a040">'(' 已弹出丢弃</text>

  <!-- arrow phase2 -> phase3 -->
  <path d="M 366 162 C 400 156, 420 130, 452 130" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="408" y="140" font-size="10" fill="#4a7a3a" font-weight="bold">原样压回</text>

  <!-- ===== Phase 3: 压回后 (right) ===== -->
  <text x="475" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 压回后</text>
  <rect x="452" y="66" width="46" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="475" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="452" y="92" width="46" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="109" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="452" y="118" width="46" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="135" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="452" y="144" width="46" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="161" text-anchor="middle" font-size="13" fill="#333">d</text>
  <text x="504" y="80" font-size="9" fill="#888">← 栈顶</text>

  <!-- result bar -->
  <rect x="150" y="252" width="260" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="273" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结果：dcba（原 "abcd" 的反转）</text>
</svg>
