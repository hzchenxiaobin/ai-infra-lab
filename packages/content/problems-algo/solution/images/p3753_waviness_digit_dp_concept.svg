<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">峰 / 谷：与两侧相邻数位的严格大小关系</text>

  <!-- Panel A: 4848 -->
  <text x="60" y="46" font-size="12" fill="#555" filter="url(#rough2)">以 4848 为例：</text>

  <text x="165" y="62" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">4 &lt; 8 &gt; 4</text>
  <text x="235" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">8 &gt; 4 &lt; 8</text>

  <rect x="70" y="68" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="93" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="140" y="68" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="93" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="210" y="68" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="93" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="280" y="68" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="93" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <text x="95" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">首位不判</text>
  <text x="165" y="124" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">峰 ↑</text>
  <text x="235" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">谷 ↓</text>
  <text x="305" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">末位不判</text>

  <text x="382" y="84" font-size="12" fill="#333" filter="url(#rough2)">波动值 = 2</text>
  <text x="382" y="102" font-size="11" fill="#555" filter="url(#rough2)">（&lt;3 位数恒为 0）</text>

  <path d="M 40 140 L 480 144" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- Panel B: settle on transition -->
  <text x="60" y="164" font-size="12" fill="#555" filter="url(#rough2)">状态 (pos, tight, prev, prev2)——在「填 d」的瞬间结算 prev：</text>

  <rect x="80" y="178" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="203" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">prev2</text>
  <rect x="160" y="178" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="203" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">prev</text>
  <rect x="240" y="178" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="203" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>

  <text x="110" y="234" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">左邻居</text>
  <text x="190" y="234" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">被判定者</text>
  <text x="270" y="234" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">右邻居（正在填）</text>

  <path d="M 304 198 L 330 198" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="334" y="174" width="158" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="413" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">贡献 = c × 后继方案数</text>
  <text x="413" y="216" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c = 1 若 prev 是峰/谷</text>

  <rect x="60" y="256" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prev / prev2 = −1 表示「还没开始填」（前导零）</text>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prev2 = −1 ⇒ prev 是首位 ⇒ 判定自动跳过</text>

  <text x="260" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">dfs 返回 (cnt, sum) 成对二元组：数位 DP 从「计数」升级到「求和」</text>
</svg>
