<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟计数 + 三类分流</text>

  <!-- 开始：统计频次 -->
  <rect x="95" y="40" width="190" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计频次 cnt（一趟扫 nums）</text>

  <path d="M190,76 L190,94" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断1：k == n -->
  <polygon points="115,132 190,96 265,132 190,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="137" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">k == n ?</text>

  <path d="M265,132 L326,132" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="328" y="108" width="164" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="127" text-anchor="middle" font-size="10.5" fill="#2c5222" filter="url(#rough2)">唯一的子数组 = 整个数组</text>
  <text x="410" y="145" text-anchor="middle" font-size="12" fill="#2c5222" font-weight="bold" filter="url(#rough2)">返回 max(nums)</text>

  <path d="M190,168 L190,190" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="184" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 判断2：k == 1 -->
  <polygon points="115,228 190,192 265,228 190,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="233" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">k == 1 ?</text>

  <path d="M265,228 L326,228" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="328" y="204" width="164" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="223" text-anchor="middle" font-size="10.5" fill="#2c5222" filter="url(#rough2)">子数组 = 单个元素</text>
  <text x="410" y="240" text-anchor="middle" font-size="12" fill="#2c5222" font-weight="bold" filter="url(#rough2)">返回频次为 1 的最大值</text>
  <text x="410" y="254" text-anchor="middle" font-size="10.5" fill="#2c5222" filter="url(#rough2)">（无则 −1）</text>

  <path d="M190,264 L190,286" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="280" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 1 < k < n 分支 -->
  <rect x="70" y="288" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="311" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 &lt; k &lt; n：候选只有 nums[0] 与 nums[n−1]</text>
  <text x="330" y="305" font-size="10" fill="#999" filter="url(#rough2)">（内部下标</text>
  <text x="330" y="318" font-size="10" fill="#999" filter="url(#rough2)"> 覆盖数 ≥ 2）</text>

  <path d="M190,324 L190,340" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="95" y="342" width="190" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="360" text-anchor="middle" font-size="11.5" fill="#2c5222" filter="url(#rough2)">两个候选各需频次 = 1</text>
  <text x="190" y="377" text-anchor="middle" font-size="12" fill="#2c5222" font-weight="bold" filter="url(#rough2)">返回合法候选最大值（无则 −1）</text>
</svg>
