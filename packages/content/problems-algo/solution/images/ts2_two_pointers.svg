<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">有序数组双指针：和 vs target 决定移动方向</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">数组升序 → 左指针右移使和增大，右指针左移使和减小</text>

  <!-- ===== Array cells ===== -->
  <text x="40" y="82" font-size="11" fill="#446688" font-weight="bold">numbers[]（已升序）</text>

  <g font-size="13">
    <!-- cell 0: value 2, left pointer -->
    <rect x="70" y="96" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="102" y="124" text-anchor="middle" font-size="15" fill="#223" font-weight="bold">2</text>
    <text x="102" y="158" text-anchor="middle" font-size="10" fill="#888">下标 0</text>
    <text x="102" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">left ↑</text>

    <!-- cell 1: value 7 -->
    <rect x="148" y="96" width="64" height="44" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="180" y="124" text-anchor="middle" font-size="15" fill="#223">7</text>
    <text x="180" y="158" text-anchor="middle" font-size="10" fill="#888">下标 1</text>

    <!-- cell 2: value 11 -->
    <rect x="226" y="96" width="64" height="44" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="258" y="124" text-anchor="middle" font-size="15" fill="#223">11</text>
    <text x="258" y="158" text-anchor="middle" font-size="10" fill="#888">下标 2</text>

    <!-- cell 3: value 15, right pointer -->
    <rect x="304" y="96" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="336" y="124" text-anchor="middle" font-size="15" fill="#223" font-weight="bold">15</text>
    <text x="336" y="158" text-anchor="middle" font-size="10" fill="#888">下标 3</text>
    <text x="336" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">↑ right</text>
  </g>

  <!-- ===== Sum & compare ===== -->
  <text x="430" y="120" font-size="12" fill="#444">sum =</text>
  <rect x="468" y="104" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="496" y="124" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">17</text>

  <line x1="470" y1="142" x2="522" y2="142" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="496" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">17 &gt; target 9</text>

  <!-- ===== Reasoning box ===== -->
  <rect x="40" y="186" width="460" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="208" font-size="11" fill="#b85450" font-weight="bold">和太大 → right--</text>
  <text x="54" y="226" font-size="11" fill="#7a3a38">15 已和最小值 2 相加都超了 9，</text>
  <text x="54" y="242" font-size="11" fill="#7a3a38">它和任何更大的左端只会更大 → 15 不可能是答案，丢弃 right--</text>

  <!-- ===== Movement direction arrows ===== -->
  <text x="40" y="288" font-size="11" fill="#446688" font-weight="bold">指针移动规则（单调性）</text>

  <rect x="40" y="298" width="218" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="54" y="318" font-size="11" fill="#446688" font-weight="bold">sum &lt; target</text>
  <text x="54" y="336" font-family="monospace" font-size="11" fill="#446688">→ left++ （换更大左端）</text>
  <path d="M 150 348 L 150 356" stroke="#446688" stroke-width="0"/>

  <rect x="282" y="298" width="218" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="296" y="318" font-size="11" fill="#4a7a3a" font-weight="bold">sum &gt; target</text>
  <text x="296" y="336" font-family="monospace" font-size="11" fill="#4a7a3a">→ right-- （换更小右端）</text>
</svg>
