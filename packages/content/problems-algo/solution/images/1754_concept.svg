<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：首字符相同时，必须比较整个后缀</text>

  <!-- Case 1: first chars differ -->
  <text x="40" y="58" font-size="12" fill="#888" filter="url(#rough2)">情况一：首字符不同 → 直接取大的</text>
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="80" y="66" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="98" y="88" filter="url(#rough2)">c</text>
    <rect x="116" y="66" width="36" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="134" y="88" fill="#aaa" filter="url(#rough2)">…</text>
    <text x="172" y="86" font-size="12" fill="#888" filter="url(#rough2)">word1</text>
    <rect x="240" y="66" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="258" y="88" filter="url(#rough2)">b</text>
    <rect x="276" y="66" width="36" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="294" y="88" fill="#aaa" filter="url(#rough2)">…</text>
    <text x="332" y="86" font-size="12" fill="#888" filter="url(#rough2)">word2</text>
  </g>
  <text x="210" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">'c' &gt; 'b' → 取 word1</text>

  <!-- divider -->
  <path d="M 40 116 L 520 116" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Case 2: first chars equal - the key insight -->
  <text x="40" y="138" font-size="12" fill="#888" filter="url(#rough2)">情况二：首字符相同 → 比较整个后缀决定取谁</text>

  <!-- word1 = "abaa" -->
  <text x="56" y="168" font-size="12" fill="#446688" filter="url(#rough2)">word1:</text>
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="108" y="152" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="128" y="174" filter="url(#rough2)">a</text>
    <rect x="148" y="152" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="168" y="174" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
    <rect x="188" y="152" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="208" y="174" filter="url(#rough2)">a</text>
    <rect x="228" y="152" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="248" y="174" filter="url(#rough2)">a</text>
  </g>

  <!-- word2 = "aaa" -->
  <text x="56" y="212" font-size="12" fill="#4a7a3a" filter="url(#rough2)">word2:</text>
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="108" y="196" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="128" y="218" filter="url(#rough2)">a</text>
    <rect x="148" y="196" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="168" y="218" filter="url(#rough2)">a</text>
    <rect x="188" y="196" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="208" y="218" filter="url(#rough2)">a</text>
  </g>

  <!-- comparison bracket -->
  <path d="M 128 146 L 128 138 L 168 138 L 168 146" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 128 190 L 128 198" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="190" y="136" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 第 2 位首次不同</text>

  <!-- comparison result -->
  <rect x="300" y="160" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)"><tspan fill="#446688" font-weight="bold">"abaa"</tspan> &gt; <tspan fill="#4a7a3a" font-weight="bold">"aaa"</tspan></text>
  <text x="410" y="198" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">(第 2 位 'b' &gt; 'a')</text>

  <!-- arrow down -->
  <path d="M 410 212 L 410 232" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <rect x="300" y="238" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="263" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 取 word1 的 'a'</text>

  <!-- bottom insight -->
  <path d="M 40 300 L 520 300" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="322" font-size="11.5" fill="#555" filter="url(#rough2)">• 首字符不同：取大的，一步到位</text>
  <text x="56" y="342" font-size="11.5" fill="#555" filter="url(#rough2)">• 首字符相同：比较 <tspan fill="#b85450" font-weight="bold">word1[i:]</tspan> 与 <tspan fill="#b85450" font-weight="bold">word2[j:]</tspan> 整个后缀</text>
  <text x="56" y="362" font-size="11.5" fill="#555" filter="url(#rough2)">  后缀更大的一方，取其首字符 → 贪心保证字典序最大</text>
</svg>
