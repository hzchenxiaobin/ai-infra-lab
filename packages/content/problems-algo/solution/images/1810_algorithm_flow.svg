<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程</text>

  <!-- Start -->
  <rect x="200" y="38" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="11.5" fill="#333">从 (0,0) 开始</text>

  <path d="M260 66 L260 80" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 1 -->
  <rect x="30" y="80" width="460" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段 1：DFS 探图（物理移动）</text>
  <text x="50" y="120" font-size="10.5" fill="#555">cost[(0,0)]=0, seen={(0,0)}</text>
  <text x="50" y="136" font-size="10.5" fill="#555">dfs(r, c):</text>
  <text x="50" y="152" font-size="10.5" fill="#555">  if isTarget(): 记录 target = (r,c)</text>
  <text x="50" y="168" font-size="10.5" fill="#555">  for d in {U,D,L,R}: w = move(d)</text>
  <text x="50" y="184" font-size="10.5" fill="#555">    w == −1 → 墙, 跳过;  else cost[邻]=w, dfs(邻), move(oppo)</text>

  <path d="M260 198 L260 212" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: found target? -->
  <polygon points="260,212 345,240 260,268 175,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="11" fill="#333">找到目标?</text>

  <!-- No branch -->
  <path d="M175 240 L110 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="234" text-anchor="middle" font-size="10" fill="#888">No</text>
  <rect x="20" y="228" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="244" text-anchor="middle" font-size="11" fill="#b85450">return −1</text>

  <!-- Yes branch -->
  <path d="M260 268 L260 282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="278" font-size="10" fill="#888">Yes</text>

  <!-- Phase 2 -->
  <rect x="30" y="282" width="460" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阶段 2：Dijkstra 寻路（纯计算）</text>
  <text x="50" y="322" font-size="10.5" fill="#555">dist[(0,0)]=0, 小顶堆 pq=[(0,(0,0))]</text>
  <text x="50" y="338" font-size="10.5" fill="#555">while pq 非空:</text>
  <text x="50" y="354" font-size="10.5" fill="#555">  (d, cell) = pq.pop()  // 懒删除: d &gt; dist[cell] 则 continue</text>
  <text x="50" y="370" font-size="10.5" fill="#555">  if cell == target: return d  ← 首次弹出即最小消耗</text>
  <text x="50" y="386" font-size="10.5" fill="#555">  for 邻居 n in cost: nd = d + cost[n]; if nd &lt; dist[n]: 更新, 入堆</text>
  <text x="50" y="402" font-size="10.5" fill="#b85450">  → 弹出目标时的 d 即为答案</text>

  <path d="M260 410 L260 424" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="180" y="424" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="442" text-anchor="middle" font-size="11.5" fill="#333">返回最小消耗</text>
</svg>
