<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程</text>

  <!-- Start -->
  <rect x="210" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 nums, m</text>
  <path d="M270,78 L270,92" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: n <= 2 ? -->
  <polygon points="270,94 360,134 270,174 180,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n ≤ 2 ?</text>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">(n=1 已完成 / n=2 直拆)</text>

  <!-- yes branch -->
  <path d="M180,134 L120,134 L120,158" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="128" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="60" y="160" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">return true</text>

  <!-- no branch -->
  <path d="M360,134 L430,134 L430,158" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="128" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- scan adjacent pairs -->
  <rect x="350" y="160" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历相邻对</text>
  <text x="430" y="190" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i = 0 .. n-2</text>
  <path d="M430,194 L430,210" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: pair sum >= m ? -->
  <polygon points="430,212 510,244 430,276 350,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[i]+nums[i+1]</text>
  <text x="430" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">≥ m ?</text>

  <!-- yes -->
  <path d="M350,244 L260,244 L260,278" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="238" font-size="11" fill="#4a7a3a" filter="url(#rough2)">存在任一</text>
  <rect x="200" y="280" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">return true</text>

  <!-- no: all pairs < m -->
  <path d="M510,244 L470,244 L470,278" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="238" font-size="11" fill="#b85450" filter="url(#rough2)">全部不满足</text>
  <rect x="410" y="280" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="302" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return false</text>

  <!-- note -->
  <rect x="40" y="328" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">关键：剥一个元素 + 正数单调性 → 只需相邻长度为 2 的和</text>
</svg>
