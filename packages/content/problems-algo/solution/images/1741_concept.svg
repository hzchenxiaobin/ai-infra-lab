<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心概念：按 (event_day, emp_id) 二维分组 + SUM 差值</text>
  <path d="M 220 36 Q 390 44 560 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Left: Employees table (raw) ===== -->
  <text x="40" y="66" font-size="11" fill="#888">① FROM Employees</text>
  <g filter="url(#rough2)"><rect x="30" y="72" width="240" height="158" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6"/></g>
  <text x="150" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Employees 表（原始）</text>
  <line x1="30" y1="96" x2="270" y2="96" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- header -->
  <text x="48" y="110" font-size="9" fill="#888" font-weight="bold">emp_id</text>
  <text x="108" y="110" font-size="9" fill="#888" font-weight="bold">event_day</text>
  <text x="195" y="110" font-size="9" fill="#888" font-weight="bold">in_time</text>
  <text x="240" y="110" font-size="9" fill="#888" font-weight="bold">out</text>
  <line x1="90" y1="98" x2="90" y2="230" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="178" y1="98" x2="178" y2="230" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="222" y1="98" x2="222" y2="230" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows, color-coded by (day, emp) group -->
  <text x="52" y="128" font-size="10" fill="#4a8edb">1</text>
  <text x="100" y="128" font-size="9" fill="#4a8edb">2020-11-28</text>
  <text x="195" y="128" font-size="10" fill="#4a8edb">4</text>
  <text x="240" y="128" font-size="10" fill="#4a8edb">32</text>

  <text x="52" y="146" font-size="10" fill="#4a8edb">1</text>
  <text x="100" y="146" font-size="9" fill="#4a8edb">2020-11-28</text>
  <text x="195" y="146" font-size="10" fill="#4a8edb">55</text>
  <text x="240" y="146" font-size="10" fill="#4a8edb">200</text>

  <text x="52" y="164" font-size="10" fill="#d6a040">1</text>
  <text x="100" y="164" font-size="9" fill="#d6a040">2020-12-03</text>
  <text x="195" y="164" font-size="10" fill="#d6a040">1</text>
  <text x="240" y="164" font-size="10" fill="#d6a040">42</text>

  <text x="52" y="182" font-size="10" fill="#4a7a3a">2</text>
  <text x="100" y="182" font-size="9" fill="#4a7a3a">2020-11-28</text>
  <text x="195" y="182" font-size="10" fill="#4a7a3a">3</text>
  <text x="240" y="182" font-size="10" fill="#4a7a3a">33</text>

  <text x="52" y="200" font-size="10" fill="#b85450">2</text>
  <text x="100" y="200" font-size="9" fill="#b85450">2020-12-09</text>
  <text x="195" y="200" font-size="10" fill="#b85450">47</text>
  <text x="240" y="200" font-size="10" fill="#b85450">74</text>

  <text x="150" y="222" text-anchor="middle" font-size="9" fill="#999">共 5 行</text>

  <!-- Arrow 1: table -> group by -->
  <path d="M 276 151 L 312 151" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: GROUP BY (event_day, emp_id) ===== -->
  <text x="322" y="66" font-size="11" fill="#888">② GROUP BY event_day, emp_id</text>
  <g filter="url(#rough2)"><rect x="316" y="80" width="200" height="178" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/></g>
  <text x="416" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">二维分组（4 组）</text>

  <!-- group (11-28, 1) -->
  <g filter="url(#rough2)"><rect x="328" y="110" width="176" height="34" fill="#dbeafe" stroke="#4a8edb" stroke-width="1.2" rx="4"/></g>
  <text x="340" y="125" font-size="9" fill="#4a8edb" font-weight="bold">11-28, emp 1</text>
  <text x="340" y="139" font-size="9" fill="#4a8edb">(32-4)+(200-55)</text>

  <!-- group (11-28, 2) -->
  <g filter="url(#rough2)"><rect x="328" y="150" width="176" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/></g>
  <text x="340" y="165" font-size="9" fill="#4a7a3a" font-weight="bold">11-28, emp 2</text>
  <text x="340" y="179" font-size="9" fill="#4a7a3a">(33-3)</text>

  <!-- group (12-03, 1) -->
  <g filter="url(#rough2)"><rect x="328" y="190" width="176" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/></g>
  <text x="340" y="205" font-size="9" fill="#d6a040" font-weight="bold">12-03, emp 1</text>
  <text x="340" y="219" font-size="9" fill="#d6a040">(42-1)</text>

  <!-- group (12-09, 2) -->
  <g filter="url(#rough2)"><rect x="328" y="230" width="176" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/></g>
  <text x="340" y="245" font-size="9" fill="#b85450" font-weight="bold">12-09, emp 2</text>
  <text x="340" y="259" font-size="9" fill="#b85450">(74-47)</text>

  <!-- Arrow 2: group by -> sum -->
  <path d="M 522 187 L 558 187" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right: SUM + result ===== -->
  <text x="568" y="66" font-size="11" fill="#888">③ SUM → 输出</text>
  <g filter="url(#rough2)"><rect x="562" y="80" width="200" height="178" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6"/></g>
  <text x="662" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果表</text>
  <line x1="562" y1="104" x2="762" y2="104" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="576" y="118" font-size="9" fill="#888" font-weight="bold">day</text>
  <text x="652" y="118" font-size="9" fill="#888" font-weight="bold">emp_id</text>
  <text x="716" y="118" font-size="9" fill="#888" font-weight="bold">total_time</text>
  <line x1="640" y1="106" x2="640" y2="258" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="700" y1="106" x2="700" y2="258" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="572" y="134" font-size="9" fill="#4a8edb">2020-11-28</text>
  <text x="660" y="134" font-size="10" fill="#4a8edb">1</text>
  <text x="724" y="134" font-size="11" fill="#4a8edb" font-weight="bold">173</text>

  <text x="572" y="158" font-size="9" fill="#4a7a3a">2020-11-28</text>
  <text x="660" y="158" font-size="10" fill="#4a7a3a">2</text>
  <text x="724" y="158" font-size="11" fill="#4a7a3a" font-weight="bold">30</text>

  <text x="572" y="182" font-size="9" fill="#d6a040">2020-12-03</text>
  <text x="660" y="182" font-size="10" fill="#d6a040">1</text>
  <text x="724" y="182" font-size="11" fill="#d6a040" font-weight="bold">41</text>

  <text x="572" y="206" font-size="9" fill="#b85450">2020-12-09</text>
  <text x="660" y="206" font-size="10" fill="#b85450">2</text>
  <text x="724" y="206" font-size="11" fill="#b85450" font-weight="bold">27</text>

  <text x="662" y="240" text-anchor="middle" font-size="9" fill="#888">顺序无要求</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)"><rect x="40" y="288" width="700" height="108" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="60" y="312" font-size="12" fill="#a06a10" font-weight="bold">⭐ 分组键是二维组合：(event_day, emp_id) ——「每人每天」两个维度合成的粒度</text>
  <text x="60" y="334" font-size="11" fill="#a06a10">• 只 GROUP BY emp_id → 员工 1 的 11-28 与 12-03 被错误合并成 214（丢失「每天」维度）</text>
  <text x="60" y="356" font-size="11" fill="#a06a10">• 只 GROUP BY event_day → 11-28 两员工被混成 203（丢失「每位」维度）</text>
  <text x="60" y="378" font-size="11" fill="#a06a10">• SUM(out_time - in_time) 对每行先求差再求和，等价于 SUM(out_time) - SUM(in_time)</text>
</svg>
