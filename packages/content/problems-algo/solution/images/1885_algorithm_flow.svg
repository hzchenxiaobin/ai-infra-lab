<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：构造 diff → 排序 → 双指针计数</text>

  <!-- Step 1 -->
  <rect x="40" y="58" width="200" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 构造 diff</text>
  <text x="140" y="98" text-anchor="middle" font-size="10.5" fill="#666">diff[i] = nums1[i] − nums2[i]</text>

  <!-- arrow 1 -> 2 -->
  <path d="M 240 83 L 290 83" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="300" y="58" width="200" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 升序排序</text>
  <text x="400" y="98" text-anchor="middle" font-size="10.5" fill="#666">sort(diff)</text>

  <!-- arrow 2 -> 3 (down) -->
  <path d="M 400 118 L 400 168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: two pointers loop -->
  <rect x="60" y="178" width="440" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 双指针计数（left = 0, right = n − 1, count = 0）</text>

  <!-- decision diamond -->
  <polygon points="280,210 360,236 280,262 200,236" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="10.5" fill="#333">diff[l]+diff[r]</text>
  <text x="280" y="248" text-anchor="middle" font-size="10.5" fill="#333">&gt; 0 ?</text>

  <!-- left branch: yes -->
  <path d="M 200 236 L 110 236 L 110 270" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="40" y="276" width="140" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="296" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">count += right−left</text>
  <text x="110" y="312" text-anchor="middle" font-size="10.5" fill="#333">right −−</text>
  <text x="110" y="326" text-anchor="middle" font-size="9.5" fill="#888">left..right−1 全合法</text>

  <!-- right branch: no -->
  <path d="M 360 236 L 450 236 L 450 270" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="228" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">否</text>
  <rect x="380" y="276" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="300" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">left ++</text>
  <text x="450" y="318" text-anchor="middle" font-size="9.5" fill="#888">换更大的 left</text>

  <!-- loop back arrow -->
  <path d="M 110 332 L 110 348 L 450 348 L 450 332" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888">left &lt; right 时循环；否则返回 count</text>
</svg>
