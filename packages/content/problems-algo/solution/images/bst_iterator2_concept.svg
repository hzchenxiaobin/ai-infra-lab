<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双向指针：在中序序列上左右移动</text>

  <!-- BST 树 -->
  <text x="30" y="56" font-size="12" fill="#888">BST：</text>
  <circle cx="130" cy="88" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <circle cx="85" cy="140" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85" y="144" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <line x1="120" y1="98" x2="92" y2="130" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="185" cy="140" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="144" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">15</text>
  <line x1="140" y1="98" x2="178" y2="130" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="155" cy="190" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="155" y="194" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">9</text>
  <line x1="180" y1="150" x2="160" y2="182" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="215" cy="190" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="215" y="194" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">20</text>
  <line x1="192" y1="150" x2="210" y2="182" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <!-- 箭头：中序遍历 -->
  <path d="M 130 210 Q 200 230 260 232" stroke="#666" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="228" font-size="10" fill="#888">中序遍历</text>

  <!-- 中序序列数组 -->
  <text x="290" y="56" font-size="12" fill="#446688" font-weight="bold">中序序列（升序）</text>

  <!-- 格子：3 7 9 15 20，下标 0-4 -->
  <rect x="240" y="80" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="288" y="80" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="336" y="80" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="384" y="80" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>
  <rect x="432" y="80" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="456" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">20</text>

  <!-- 下标 -->
  <text x="264" y="132" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="312" y="132" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="360" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2 ← i</text>
  <text x="408" y="132" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="456" y="132" text-anchor="middle" font-size="10" fill="#999">4</text>

  <!-- 指针标记 -->
  <path d="M 360 58 L 360 74" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="360" y="50" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">指针</text>

  <!-- next 箭头 -->
  <text x="400" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">next()</text>
  <path d="M 375 160 L 425 160" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="400" y="152" text-anchor="middle" font-size="9" fill="#4a7a3a">i++ → 返回 nums[i]</text>

  <!-- prev 箭头 -->
  <text x="300" y="172" font-size="11" fill="#b85450" font-weight="bold">prev()</text>
  <path d="M 345 175 L 295 175" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="320" y="166" text-anchor="middle" font-size="9" fill="#b85450">i-- → 返回 nums[i]</text>

  <!-- 初始状态 -->
  <rect x="40" y="240" width="240" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="262" font-size="12" fill="#333" font-weight="bold">初始状态：i = -1</text>
  <text x="60" y="280" font-size="10" fill="#555">指针在第一个元素之前</text>
  <text x="60" y="292" font-size="10" fill="#555">hasNext()=true, hasPrev()=false</text>

  <!-- 对比 173 -->
  <rect x="300" y="240" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="262" font-size="12" fill="#333" font-weight="bold">vs 173（单向迭代器）</text>
  <text x="320" y="280" font-size="10" fill="#555">173：next() 返回当前再后移</text>
  <text x="320" y="292" font-size="10" fill="#555">1586：next() 先后移再返回</text>

  <!-- 说明框 -->
  <rect x="40" y="320" width="500" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="342" font-size="12" fill="#333" font-weight="bold">核心：指针 i 落在元素上，起点 -1（首元素之前）</text>
  <text x="60" y="360" font-size="11" fill="#555">• next()：i++，返回 nums[i]（先后移再返回）</text>
  <text x="60" y="376" font-size="11" fill="#555">• prev()：i--，返回 nums[i]（先前移再返回）</text>
  <text x="60" y="392" font-size="11" fill="#555">• hasNext()：i &lt; n-1　　• hasPrev()：i &gt; 0</text>
</svg>
