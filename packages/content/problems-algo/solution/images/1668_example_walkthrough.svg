<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">示例演算：sequence = "ababc", word = "ab"</text>

  <!-- ===== Table ===== -->
  <!-- column x boundaries: 步=30, k=80, s=130, s+word=240, 子串?=370, 动作=430 -->
  <!-- header row y=40-62 -->
  <rect x="20" y="40" width="520" height="24" fill="#446688" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="40" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">步</text>
  <text x="95" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">k(进入)</text>
  <text x="160" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">s</text>
  <text x="270" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">判定 s + word</text>
  <text x="390" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">子串?</text>
  <text x="475" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">动作</text>

  <!-- vertical separators for header -->
  <line x1="65" y1="40" x2="65" y2="64" stroke="#fafafa" stroke-width="1"/>
  <line x1="125" y1="40" x2="125" y2="64" stroke="#fafafa" stroke-width="1"/>
  <line x1="210" y1="40" x2="210" y2="64" stroke="#fafafa" stroke-width="1"/>
  <line x1="345" y1="40" x2="345" y2="64" stroke="#fafafa" stroke-width="1"/>
  <line x1="430" y1="40" x2="430" y2="64" stroke="#fafafa" stroke-width="1"/>

  <!-- ===== Row 1: k=0, s="", check "ab" ✓ ===== -->
  <rect x="20" y="66" width="520" height="44" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="95" y="93" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="160" y="93" text-anchor="middle" font-size="12" fill="#999">∅ (空串)</text>
  <!-- s+word = "ab" mini box -->
  <rect x="248" y="80" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ab</text>
  <text x="390" y="93" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="475" y="87" text-anchor="middle" font-size="10" fill="#555">s = "ab"</text>
  <text x="475" y="101" text-anchor="middle" font-size="10" fill="#555">k = 1</text>

  <!-- ===== Row 2: k=1, s="ab", check "abab" ✓ ===== -->
  <rect x="20" y="112" width="520" height="44" fill="#f6faff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="95" y="139" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="138" y="126" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ab</text>
  <!-- s+word = "abab" -->
  <rect x="226" y="126" width="88" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ab</text>
  <text x="292" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ab</text>
  <text x="390" y="139" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="475" y="133" text-anchor="middle" font-size="10" fill="#555">s = "abab"</text>
  <text x="475" y="147" text-anchor="middle" font-size="10" fill="#555">k = 2</text>

  <!-- ===== Row 3: k=2, s="abab", check "ababab" ✗ (highlight) ===== -->
  <rect x="20" y="158" width="520" height="44" fill="#fff5f7" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="95" y="185" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="138" y="172" width="88" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ab</text>
  <text x="204" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ab</text>
  <!-- s+word = "ababab" (grayed, too long) -->
  <rect x="216" y="172" width="132" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="238" y="188" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">ab</text>
  <text x="282" y="188" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">ab</text>
  <text x="326" y="188" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">ab</text>
  <text x="390" y="185" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="475" y="179" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">退出循环</text>
  <text x="475" y="193" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回 k = 2</text>

  <!-- separator lines between columns for data rows -->
  <line x1="65" y1="66" x2="65" y2="202" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="125" y1="66" x2="125" y2="202" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="210" y1="66" x2="210" y2="202" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="345" y1="66" x2="345" y2="202" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="430" y1="66" x2="430" y2="202" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ===== sequence match visualization ===== -->
  <text x="40" y="232" font-size="11" fill="#666" font-weight="bold">在 sequence 中定位命中：</text>

  <!-- step 1: "ab" matches at pos 0 -->
  <text x="40" y="258" font-size="10" fill="#888">步1 "ab" →</text>
  <rect x="120" y="246" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="132" y="261" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="144" y="246" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="156" y="261" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="168" y="246" width="24" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="261" text-anchor="middle" font-size="11" fill="#999">a</text>
  <rect x="192" y="246" width="24" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="261" text-anchor="middle" font-size="11" fill="#999">b</text>
  <rect x="216" y="246" width="24" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="228" y="261" text-anchor="middle" font-size="11" fill="#999">c</text>
  <text x="252" y="261" font-size="10" fill="#4a7a3a" font-weight="bold">位置 0 命中 ✓</text>

  <!-- step 2: "abab" matches at pos 0 -->
  <text x="40" y="292" font-size="10" fill="#888">步2 "abab" →</text>
  <rect x="120" y="280" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="132" y="295" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="144" y="280" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="156" y="295" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="168" y="280" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="295" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="192" y="280" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="204" y="295" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="216" y="280" width="24" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="228" y="295" text-anchor="middle" font-size="11" fill="#999">c</text>
  <text x="252" y="295" font-size="10" fill="#4a7a3a" font-weight="bold">位置 0 命中 ✓</text>

  <!-- step 3: "ababab" no match (too long) -->
  <text x="40" y="326" font-size="10" fill="#888">步3 "ababab" →</text>
  <rect x="120" y="314" width="24" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="132" y="329" text-anchor="middle" font-size="11" fill="#999">a</text>
  <rect x="144" y="314" width="24" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="156" y="329" text-anchor="middle" font-size="11" fill="#999">b</text>
  <rect x="168" y="314" width="24" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="329" text-anchor="middle" font-size="11" fill="#999">a</text>
  <rect x="192" y="314" width="24" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="329" text-anchor="middle" font-size="11" fill="#999">b</text>
  <rect x="216" y="314" width="24" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="228" y="329" text-anchor="middle" font-size="11" fill="#999">c</text>
  <text x="252" y="329" font-size="10" fill="#b85450" font-weight="bold">长度 6 > 5，无法容纳 ✗</text>

  <!-- bottom note -->
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 三轮后退出，返回 k = 2</text>
</svg>
