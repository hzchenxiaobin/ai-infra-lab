<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [2,5,1,3,4,7]，n = 3</text>

  <!-- Step lines -->
  <text x="40" y="54" font-size="11.5" fill="#333">① X = nums[0..2] = [2,5,1]（蓝），Y = nums[3..5] = [3,4,7]（绿）</text>
  <text x="40" y="74" font-size="11.5" fill="#333">② 遍历 i = 0..2，每轮填 res[2i]（偶位）与 res[2i+1]（奇位）</text>

  <!-- Table header row -->
  <rect x="50" y="88" width="500" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <text x="210" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[n+i]</text>
  <text x="300" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res[2i]</text>
  <text x="380" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res[2i+1]</text>
  <text x="490" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res 进展</text>

  <!-- vertical separators -->
  <path d="M 110 88 L 110 232 M 175 88 L 175 232 M 250 88 L 250 232 M 345 88 L 345 232 M 425 88 L 425 232" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row 0 -->
  <rect x="50" y="116" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="139" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="140" y="139" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <text x="210" y="139" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="300" y="139" text-anchor="middle" font-size="11" fill="#333">res[0]=2</text>
  <text x="380" y="139" text-anchor="middle" font-size="11" fill="#333">res[1]=3</text>
  <text x="490" y="139" text-anchor="middle" font-size="10.5" fill="#555">[2,3,_,_,_,_]</text>

  <!-- row 1 -->
  <rect x="50" y="152" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="175" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="140" y="175" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">5</text>
  <text x="210" y="175" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="300" y="175" text-anchor="middle" font-size="11" fill="#333">res[2]=5</text>
  <text x="380" y="175" text-anchor="middle" font-size="11" fill="#333">res[3]=4</text>
  <text x="490" y="175" text-anchor="middle" font-size="10.5" fill="#555">[2,3,5,4,_,_]</text>

  <!-- row 2 -->
  <rect x="50" y="188" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="211" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="140" y="211" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <text x="210" y="211" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="300" y="211" text-anchor="middle" font-size="11" fill="#333">res[4]=1</text>
  <text x="380" y="211" text-anchor="middle" font-size="11" fill="#333">res[5]=7</text>
  <text x="490" y="211" text-anchor="middle" font-size="10.5" fill="#555">[2,3,5,4,1,7]</text>

  <!-- Result -->
  <text x="300" y="248" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">结果 res = [2, 3, 5, 4, 1, 7]</text>

  <!-- color legend -->
  <rect x="120" y="262" width="18" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146" y="274" font-size="10.5" fill="#555">X（前半，落偶位 2i）</text>
  <rect x="330" y="262" width="18" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="356" y="274" font-size="10.5" fill="#555">Y（后半，落奇位 2i+1）</text>

  <!-- footer note -->
  <rect x="60" y="296" width="480" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="11" fill="#555">每轮 i 同时写两个相邻位置：偶位取 X[i]，奇位取 Y[i]</text>
  <text x="300" y="334" text-anchor="middle" font-size="11" fill="#555">n = 3 轮 → 填满 2n = 6 个位置，无重复无遗漏</text>
  <text x="300" y="352" text-anchor="middle" font-size="10" fill="#888">源下标 [i] 与 [n+i] 始终落在不同半段，互不干扰</text>
</svg>
