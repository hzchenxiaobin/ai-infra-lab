<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：多维数组 = 递归树；yield* 把子生成器的值逐个「透传」给外层</text>

  <!-- column headers -->
  <text x="60" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">根数组</text>
  <text x="250" y="56" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">第 1 层</text>
  <text x="250" y="71" text-anchor="middle" font-size="10" fill="#888">数组节点</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">第 2 层</text>
  <text x="630" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">整数叶</text>

  <!-- vertical guide lines -->
  <line x1="355" y1="80" x2="355" y2="250" stroke="#cfd8e3" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="545" y1="80" x2="545" y2="250" stroke="#cfd8e3" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- root arr -->
  <rect x="34" y="158" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">arr</text>

  <!-- depth1: [[6]] -->
  <rect x="212" y="96" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[[6]]</text>

  <!-- depth1: [1,3] -->
  <rect x="212" y="158" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1,3]</text>

  <!-- depth1: [] -->
  <rect x="212" y="220" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[]</text>

  <!-- depth2: [6] -->
  <rect x="402" y="96" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[6]</text>

  <!-- depth2: 1 -->
  <rect x="420" y="150" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="440" y="169" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- depth2: 3 -->
  <rect x="420" y="186" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="440" y="205" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- depth3: 6 -->
  <rect x="610" y="104" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="630" y="123" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- edges root->depth1 -->
  <path d="M 86 173 C 150 173, 160 111, 212 111" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 86 173 L 212 173" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 86 173 C 150 173, 160 235, 212 235" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- edges [[6]]->[6], [1,3]->1,3 -->
  <path d="M 288 111 L 402 111" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 288 173 C 340 173, 370 164, 420 164" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 288 173 C 340 173, 370 200, 420 200" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- edge [6]->6 -->
  <path d="M 478 111 C 530 111, 565 118, 610 118" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- yield order arrows along bottom -->
  <text x="60" y="278" font-size="11" fill="#b85450" font-weight="bold">中序产出顺序：</text>
  <rect x="150" y="266" width="36" height="24" fill="#e6f4ea" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="168" y="283" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <path d="M 190 278 L 226 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="230" y="266" width="36" height="24" fill="#e6f4ea" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="248" y="283" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <path d="M 270 278 L 306 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="310" y="266" width="36" height="24" fill="#e6f4ea" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="328" y="283" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <path d="M 350 278 L 386 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="390" y="266" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="420" y="283" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">done</text>

  <!-- legend -->
  <rect x="475" y="270" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="494" y="282" font-size="11" fill="#555">数组节点</text>
  <rect x="560" y="270" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="579" y="282" font-size="11" fill="#555">整数叶</text>

  <!-- bottom note: yield* delegation -->
  <rect x="40" y="304" width="640" height="40" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="58" y="322" font-size="11" fill="#333">遇到数组节点 → </text>
  <text x="172" y="322" font-size="11" fill="#b85450" font-weight="bold">yield* inorderTraversal(sub)</text>
  <text x="330" y="322" font-size="11" fill="#333">：新建子生成器，其值被外层逐个「透传」，无需手动收集成数组</text>
  <text x="58" y="338" font-size="11" fill="#888">遇到整数叶 → yield item：直接吐出一个值，next() 调用即拿到它（惰性，按需计算）</text>
</svg>
