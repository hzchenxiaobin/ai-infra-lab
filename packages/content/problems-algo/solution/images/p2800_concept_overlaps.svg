<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2800a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">拼接只有「重叠」与「包含」；对非末位串枚举所有重叠量</text>

  <!-- ===== ① 重叠 overlap ===== -->
  <text x="40" y="60" font-size="12" fill="#446688" font-weight="bold">① 重叠 overlap：s1 后缀 = s2 前缀 → s1 + s2[o:]</text>

  <!-- s1 row: a b c -->
  <g font-size="16" font-weight="bold">
    <rect x="160" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="180" y="94" text-anchor="middle" fill="#333">a</text>
    <rect x="200" y="72" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="220" y="94" text-anchor="middle" fill="#4a7a3a">b</text>
    <rect x="240" y="72" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="260" y="94" text-anchor="middle" fill="#4a7a3a">c</text>
    <text x="150" y="94" text-anchor="end" font-size="10" fill="#888">s1</text>
  </g>

  <!-- s2 row: b c d (shifted to align bc) -->
  <g font-size="16" font-weight="bold">
    <rect x="200" y="114" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="220" y="136" text-anchor="middle" fill="#4a7a3a">b</text>
    <rect x="240" y="114" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="260" y="136" text-anchor="middle" fill="#4a7a3a">c</text>
    <rect x="280" y="114" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="300" y="136" text-anchor="middle" fill="#d6a040">d</text>
    <text x="190" y="136" text-anchor="end" font-size="10" fill="#888">s2</text>
  </g>

  <!-- overlap bracket + o label -->
  <path d="M196,156 L284,156" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2800a)" filter="url(#rough2)"/>
  <text x="240" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">o = 2（后缀 "ab" = 前缀 "ab"）</text>

  <!-- result row: a b c d -->
  <g font-size="16" font-weight="bold">
    <rect x="160" y="184" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="180" y="206" text-anchor="middle" fill="#333">a</text>
    <rect x="200" y="184" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="220" y="206" text-anchor="middle" fill="#333">b</text>
    <rect x="240" y="184" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="260" y="206" text-anchor="middle" fill="#333">c</text>
    <rect x="280" y="184" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="300" y="206" text-anchor="middle" fill="#333">d</text>
    <text x="150" y="206" text-anchor="end" font-size="10" fill="#888">结果</text>
  </g>
  <text x="330" y="206" font-size="10" fill="#888">= s1 + s2[2:]</text>

  <!-- divider -->
  <path d="M40,236 L520,236" fill="none" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== ② 包含 containment ===== -->
  <text x="40" y="262" font-size="12" fill="#446688" font-weight="bold">② 包含 containment：s2 ⊆ s1 → 不追加，结果即 s1</text>

  <g font-size="16" font-weight="bold">
    <rect x="160" y="276" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="180" y="298" text-anchor="middle" fill="#333">x</text>
    <rect x="200" y="276" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="220" y="298" text-anchor="middle" fill="#4a7a3a">a</text>
    <rect x="240" y="276" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="260" y="298" text-anchor="middle" fill="#4a7a3a">b</text>
    <rect x="280" y="276" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="300" y="298" text-anchor="middle" fill="#333">y</text>
    <text x="150" y="298" text-anchor="end" font-size="10" fill="#888">s1</text>
  </g>
  <text x="330" y="298" font-size="10" fill="#4a7a3a">s2="ab" 已在 s1 内部 → 不追加</text>

  <!-- ===== ③ note ===== -->
  <rect x="50" y="330" width="460" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 枚举策略</text>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#d6a040">非末位串 s2：枚举 o = 0..min(|s1|,|s2|) 的所有合法值（含非最大）+ 包含分支</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#d6a040">末位串 s3：只取最大重叠或包含即可（其后无串可借接缝）</text>
</svg>
