<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "aababcaab"，minSize=3，maxLetters=2</text>

  <!-- string row with indices -->
  <text x="30" y="62" font-size="11" fill="#888">下标</text>
  <g font-size="10" fill="#aaa" text-anchor="middle">
    <text x="78" y="62">0</text>
    <text x="114" y="62">1</text>
    <text x="150" y="62">2</text>
    <text x="186" y="62">3</text>
    <text x="222" y="62">4</text>
    <text x="258" y="62">5</text>
    <text x="294" y="62">6</text>
    <text x="330" y="62">7</text>
    <text x="366" y="62">8</text>
  </g>

  <text x="30" y="88" font-size="11" fill="#888">s =</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="72" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="78" y="91">a</text>
    <rect x="96" y="72" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="114" y="91">a</text>
    <rect x="132" y="72" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="150" y="91">b</text>
    <rect x="168" y="72" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="186" y="91">a</text>
    <rect x="204" y="72" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="222" y="91">b</text>
    <rect x="240" y="72" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="258" y="91">c</text>
    <rect x="276" y="72" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="294" y="91">a</text>
    <rect x="312" y="72" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="91">a</text>
    <rect x="348" y="72" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="366" y="91">b</text>
  </g>

  <!-- highlight the two "aab" windows -->
  <rect x="58" y="70" width="112" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="274" y="70" width="112" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>

  <!-- Table header -->
  <rect x="40" y="120" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="139" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">起点 i</text>
  <text x="170" y="139" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">子串 sub</text>
  <text x="290" y="139" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">不同字母数</text>
  <text x="400" y="139" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">是否合法</text>
  <text x="485" y="139" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">count</text>

  <!-- Row 0: aab valid -->
  <rect x="40" y="150" width="480" height="26" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="168" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="170" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">aab</text>
  <text x="290" y="168" text-anchor="middle" font-size="11" fill="#333">2 {a,b}</text>
  <text x="400" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ ≤ 2</text>
  <text x="485" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- Row 1: aba valid -->
  <rect x="40" y="178" width="480" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="196" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="170" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">aba</text>
  <text x="290" y="196" text-anchor="middle" font-size="11" fill="#333">2 {a,b}</text>
  <text x="400" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ ≤ 2</text>
  <text x="485" y="196" text-anchor="middle" font-size="11" fill="#b85450">1</text>

  <!-- Row 2: bab valid -->
  <rect x="40" y="206" width="480" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="224" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="170" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">bab</text>
  <text x="290" y="224" text-anchor="middle" font-size="11" fill="#333">2 {a,b}</text>
  <text x="400" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ ≤ 2</text>
  <text x="485" y="224" text-anchor="middle" font-size="11" fill="#b85450">1</text>

  <!-- Row 3: abc invalid -->
  <rect x="40" y="234" width="480" height="26" fill="#fce4ec" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="252" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="170" y="252" text-anchor="middle" font-size="11" fill="#888">abc</text>
  <text x="290" y="252" text-anchor="middle" font-size="11" fill="#333">3 {a,b,c}</text>
  <text x="400" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ &gt; 2</text>
  <text x="485" y="252" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 4: bca invalid -->
  <rect x="40" y="262" width="480" height="26" fill="#fce4ec" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="280" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="170" y="280" text-anchor="middle" font-size="11" fill="#888">bca</text>
  <text x="290" y="280" text-anchor="middle" font-size="11" fill="#333">3 {a,b,c}</text>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ &gt; 2</text>
  <text x="485" y="280" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 5: caa invalid -->
  <rect x="40" y="290" width="480" height="26" fill="#fce4ec" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="308" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="170" y="308" text-anchor="middle" font-size="11" fill="#888">caa</text>
  <text x="290" y="308" text-anchor="middle" font-size="11" fill="#333">3 {a,b,c}</text>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ &gt; 2</text>
  <text x="485" y="308" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 6: aab valid again -->
  <rect x="40" y="318" width="480" height="26" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="336" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="170" y="336" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">aab</text>
  <text x="290" y="336" text-anchor="middle" font-size="11" fill="#333">2 {a,b}</text>
  <text x="400" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ ≤ 2</text>
  <text x="485" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 ↑</text>

  <!-- Summary -->
  <path d="M 40 366 L 520 366" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="60" y="388" font-size="11.5" fill="#555">最终哈希表：{ "aab": 2, "aba": 1, "bab": 1 }，其余子串不合法</text>
  <text x="60" y="408" font-size="11.5" fill="#555">最大出现次数 = <tspan fill="#b85450" font-weight="bold">2</tspan>（"aab"）</text>

  <!-- Conclusion box -->
  <rect x="60" y="418" width="440" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ans = 2 ✓（与示例 1 一致）</text>
</svg>
