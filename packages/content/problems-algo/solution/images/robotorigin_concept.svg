<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：四方向两两抵消，只看计数不看顺序</text>

  <!-- ===== Coordinate cross ===== -->
  <!-- axes -->
  <path d="M 280 250 L 280 70" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 120 180 L 450 180" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- origin dot -->
  <circle cx="280" cy="180" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="288" y="196" font-size="11" fill="#888">(0,0) 起点</text>

  <!-- U arrow (up, green) -->
  <path d="M 268 170 L 268 96" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="248" y="96" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">U</text>
  <text x="248" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">y +1</text>

  <!-- D arrow (down, red) -->
  <path d="M 292 190 L 292 264" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="312" y="276" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">D</text>
  <text x="312" y="232" text-anchor="middle" font-size="10" fill="#b85450">y −1</text>

  <!-- L arrow (left, orange) -->
  <path d="M 270 192 L 196 192" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="184" y="196" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">L</text>
  <text x="232" y="208" text-anchor="middle" font-size="10" fill="#d6a040">x −1</text>

  <!-- R arrow (right, blue) -->
  <path d="M 290 168 L 374 168" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="386" y="172" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">R</text>
  <text x="332" y="156" text-anchor="middle" font-size="10" fill="#446688">x +1</text>

  <!-- ===== Two cancellation boxes ===== -->
  <rect x="40" y="300" width="230" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">纵轴抵消：#U = #D</text>
  <text x="155" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a">⇒ 净位移 y = 0</text>

  <rect x="290" y="300" width="230" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="320" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">横轴抵消：#L = #R</text>
  <text x="405" y="336" text-anchor="middle" font-size="11" fill="#446688">⇒ 净位移 x = 0</text>

  <!-- ===== Conclusion ===== -->
  <rect x="60" y="358" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">回到原点 ⇔ #U = #D 且 #L = #R</text>
</svg>
