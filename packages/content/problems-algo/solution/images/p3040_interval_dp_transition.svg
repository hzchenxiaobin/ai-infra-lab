<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">固定分数 s 后：dfs(l, r) 的三种转移</text>

  <!-- top interval -->
  <g filter="url(#rough2)">
    <rect x="32" y="52" width="76" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <rect x="116" y="52" width="76" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <rect x="200" y="52" width="76" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="284" y="52" width="76" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="368" y="52" width="76" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <rect x="452" y="52" width="76" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="70" y="73" text-anchor="middle" font-size="11" fill="#333">nums[l]</text>
    <text x="154" y="73" text-anchor="middle" font-size="11" fill="#333">nums[l+1]</text>
    <text x="238" y="73" text-anchor="middle" font-size="12" fill="#999">⋯</text>
    <text x="322" y="73" text-anchor="middle" font-size="12" fill="#999">⋯</text>
    <text x="406" y="73" text-anchor="middle" font-size="11" fill="#333">nums[r−1]</text>
    <text x="490" y="73" text-anchor="middle" font-size="11" fill="#333">nums[r]</text>
  </g>
  <text x="70" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">← l</text>
  <text x="490" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">r →</text>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">当前区间 [l, r]，还剩 r−l+1 个元素</text>

  <!-- arrows -->
  <path d="M 110 96 L 109 174" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 96 L 280 174" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 96 L 451 174" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- child 1: front two -->
  <rect x="30" y="180" width="158" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="109" y="204" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 删前两个</text>
  <text x="109" y="226" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">若 nums[l]+nums[l+1] = s</text>
  <text x="109" y="250" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">→ dfs(l+2, r) + 1</text>

  <!-- child 2: ends -->
  <rect x="201" y="180" width="158" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="12.5" fill="#b07830" font-weight="bold" filter="url(#rough2)">② 删首尾</text>
  <text x="280" y="226" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">若 nums[l]+nums[r] = s</text>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">→ dfs(l+1, r−1) + 1</text>

  <!-- child 3: last two -->
  <rect x="372" y="180" width="158" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="451" y="204" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 删后两个</text>
  <text x="451" y="226" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">若 nums[r−1]+nums[r] = s</text>
  <text x="451" y="250" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">→ dfs(l, r−2) + 1</text>

  <!-- note boxes -->
  <rect x="36" y="288" width="488" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">三个分支取 max，条件不成立的分支直接跳过；结果存入 memo[l][r] 记忆化</text>

  <rect x="36" y="346" width="488" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">边界：r − l + 1 &lt; 2 → 返回 0；更换分数 s 时必须清空 memo 重新计算</text>
</svg>
