<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：路径格分布 → 逐层计数 → 判定</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">两例同为 3×3，差别只在 (1,2) 由 0 变 1</text>

  <!-- ===== Example 1 ===== -->
  <text x="150" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例1  grid=[[1,1,1],[1,0,0],[1,1,1]]</text>

  <!-- path-cell grid (f&&g), 3x3 cell=38, origin x=46 y=84 -->
  <!-- (0,0) P -->
  <rect x="46" y="84" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (0,1) -->
  <rect x="84" y="84" width="38" height="38" fill="#f4f4f4" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="103" y="108" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <!-- (0,2) -->
  <rect x="122" y="84" width="38" height="38" fill="#f4f4f4" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="141" y="108" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <!-- (1,0) P -->
  <rect x="46" y="122" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (1,1) 0 -->
  <rect x="84" y="122" width="38" height="38" fill="#e8e8e8" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="103" y="146" text-anchor="middle" font-size="10.5" fill="#bbb">0</text>
  <!-- (1,2) 0 -->
  <rect x="122" y="122" width="38" height="38" fill="#e8e8e8" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="141" y="146" text-anchor="middle" font-size="10.5" fill="#bbb">0</text>
  <!-- (2,0) P -->
  <rect x="46" y="160" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (2,1) P -->
  <rect x="84" y="160" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="103" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (2,2) P -->
  <rect x="122" y="160" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="141" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>

  <text x="103" y="218" text-anchor="middle" font-size="10" fill="#888">P = f[i][j] &amp;&amp; g[i][j]（在路径上）</text>

  <!-- count table for ex1 -->
  <!-- header -->
  <rect x="40" y="234" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="65" y="250" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">层k</text>
  <rect x="90" y="234" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="130" y="250" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">cnt[k]</text>

  <rect x="40" y="258" width="50" height="20" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="65" y="272" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="90" y="258" width="80" height="20" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="130" y="272" text-anchor="middle" font-size="10" fill="#888">1（起点）</text>

  <rect x="40" y="278" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="65" y="292" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="90" y="278" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="130" y="292" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1 ✓</text>

  <rect x="40" y="298" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="65" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <rect x="90" y="298" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="130" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1 ✓</text>

  <rect x="40" y="318" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="65" y="332" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <rect x="90" y="318" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="130" y="332" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1 ✓</text>

  <rect x="40" y="338" width="50" height="20" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="65" y="352" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="90" y="338" width="80" height="20" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="130" y="352" text-anchor="middle" font-size="10" fill="#888">1（终点）</text>

  <rect x="40" y="366" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="105" y="385" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">层1 cnt=1 → true</text>

  <!-- ===== Example 2 ===== -->
  <text x="410" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例2  grid=[[1,1,1],[1,0,1],[1,1,1]]</text>

  <!-- path-cell grid 3x3, origin x=306 y=84 -->
  <!-- (0,0) P -->
  <rect x="306" y="84" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (0,1) P -->
  <rect x="344" y="84" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="363" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (0,2) P -->
  <rect x="382" y="84" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="401" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (1,0) P -->
  <rect x="306" y="122" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (1,1) 0 -->
  <rect x="344" y="122" width="38" height="38" fill="#e8e8e8" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="363" y="146" text-anchor="middle" font-size="10.5" fill="#bbb">0</text>
  <!-- (1,2) P -->
  <rect x="382" y="122" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="401" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (2,0) P -->
  <rect x="306" y="160" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (2,1) P -->
  <rect x="344" y="160" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="363" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>
  <!-- (2,2) P -->
  <rect x="382" y="160" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="401" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">P</text>

  <text x="401" y="218" text-anchor="middle" font-size="10" fill="#888">两条路径：左路 &amp; 右路，无公共中段</text>

  <!-- count table for ex2 -->
  <rect x="300" y="234" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="325" y="250" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">层k</text>
  <rect x="350" y="234" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="390" y="250" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">cnt[k]</text>

  <rect x="300" y="258" width="50" height="20" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="325" y="272" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="350" y="258" width="80" height="20" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="390" y="272" text-anchor="middle" font-size="10" fill="#888">1（起点）</text>

  <rect x="300" y="278" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="325" y="292" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <rect x="350" y="278" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="390" y="292" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>

  <rect x="300" y="298" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="325" y="312" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <rect x="350" y="298" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="390" y="312" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>

  <rect x="300" y="318" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="325" y="332" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <rect x="350" y="318" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="390" y="332" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>

  <rect x="300" y="338" width="50" height="20" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="325" y="352" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="350" y="338" width="80" height="20" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="390" y="352" text-anchor="middle" font-size="10" fill="#888">1（终点）</text>

  <rect x="300" y="366" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="365" y="385" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">中间层均=2 → false</text>

  <!-- center divider note -->
  <rect x="180" y="366" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="235" y="385" text-anchor="middle" font-size="10.5" fill="#a87020">扫 k∈[1, m+n−3]</text>
</svg>
