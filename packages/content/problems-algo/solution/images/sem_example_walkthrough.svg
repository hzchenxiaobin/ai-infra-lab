<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：枚举倍数取交集，首个公共项即 lcm(2,n)</text>

  <!-- ===================== Row 1: n=5 (odd) ===================== -->
  <text x="30" y="56" font-size="13" fill="#d6a040" font-weight="bold">n = 5（奇）</text>
  <text x="120" y="56" font-size="11" fill="#888">gcd(2,5)=1 → lcm = 2n = 10</text>

  <!-- multiples of 5 -->
  <text x="30" y="84" font-size="11" fill="#888">5 的倍数：</text>
  <rect x="110" y="68" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="85" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="152" y="68" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="85" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">10</text>
  <rect x="194" y="68" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="85" text-anchor="middle" font-size="13" fill="#333">15</text>
  <text x="240" y="85" font-size="12" fill="#888">…</text>

  <!-- multiples of 2 -->
  <text x="30" y="114" font-size="11" fill="#888">2 的倍数：</text>
  <rect x="110" y="98" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="115" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="152" y="98" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="115" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="194" y="98" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="115" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="236" y="98" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="115" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="278" y="98" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="115" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">10</text>
  <text x="324" y="115" font-size="12" fill="#888">…</text>

  <!-- arrows to common 10 -->
  <path d="M 170 92 L 170 96 L 296 96 L 296 98" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- answer row1 -->
  <rect x="360" y="74" width="150" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="95" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">首个公共项 → ans = 10</text>

  <!-- divider -->
  <path d="M 30 138 L 510 138" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===================== Row 2: n=6 (even) ===================== -->
  <text x="30" y="164" font-size="13" fill="#4a7a3a" font-weight="bold">n = 6（偶）</text>
  <text x="120" y="164" font-size="11" fill="#888">gcd(2,6)=2 → lcm = n = 6</text>

  <!-- multiples of 6 -->
  <text x="30" y="192" font-size="11" fill="#888">6 的倍数：</text>
  <rect x="110" y="176" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="193" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <rect x="152" y="176" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="193" text-anchor="middle" font-size="13" fill="#333">12</text>
  <text x="198" y="193" font-size="12" fill="#888">…</text>

  <!-- multiples of 2 -->
  <text x="30" y="222" font-size="11" fill="#888">2 的倍数：</text>
  <rect x="110" y="206" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="223" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="152" y="206" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="223" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="194" y="206" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="223" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <rect x="236" y="206" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="223" text-anchor="middle" font-size="13" fill="#333">8</text>
  <text x="282" y="223" font-size="12" fill="#888">…</text>

  <!-- arrows to common 6 -->
  <path d="M 128 200 L 128 204 L 212 204 L 212 206" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- answer row2 -->
  <rect x="360" y="182" width="150" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="203" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">首个公共项 → ans = 6</text>

  <!-- ===================== bottom summary ===================== -->
  <rect x="40" y="252" width="460" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">规律：n 的倍数序列 kn 中，首个已是 2 的倍数者即答案</text>
  <text x="270" y="294" text-anchor="middle" font-size="10.5" fill="#555">n 偶 → k=1 时 n 即 2 的倍数，ans = n</text>
  <text x="270" y="312" text-anchor="middle" font-size="10.5" fill="#555">n 奇 → k=1 时 n 非 2 的倍数，k=2 时 2n 才是，ans = 2n</text>
  <text x="270" y="332" text-anchor="middle" font-size="10" fill="#888">枚举验证 O(n) → 公式压缩 O(1)：识别 gcd(2,n)=奇偶 把搜索压成判定</text>
</svg>
