<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">通配符匹配 DP 流程</text>

  <!-- Start -->
  <rect x="200" y="48" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化 dp[0][0] = true</text>

  <path d="M 280 86 L 280 104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Boundary -->
  <rect x="150" y="106" width="260" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">边界：空串 s 的匹配</text>
  <text x="280" y="146" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">p[j-1]=='*' → dp[0][j] = dp[0][j-1]</text>

  <path d="M 280 156 L 280 174" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Double loop -->
  <rect x="170" y="176" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="199" text-anchor="middle" font-family="monospace" font-size="11" fill="#446688" font-weight="bold">for i in 1..m,  for j in 1..n</text>

  <path d="M 280 214 L 280 230" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision diamond: p[j-1]=='*' ? -->
  <polygon points="280,232 380,278 280,324 180,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">p[j-1]</text>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">== '*' ?</text>

  <!-- Yes branch (left) -->
  <path d="M 180 278 L 100 278 L 100 310" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="120" y="270" font-size="11" fill="#d6a040" font-weight="bold">是</text>

  <rect x="30" y="312" width="140" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="334" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">* 两分支取或</text>
  <text x="100" y="354" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">dp[i][j-1]</text>
  <text x="100" y="368" text-anchor="middle" font-size="9" fill="#888">空串</text>
  <text x="100" y="382" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">dp[i-1][j]</text>

  <!-- No branch (right) -->
  <path d="M 380 278 L 460 278 L 460 310" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="420" y="270" font-size="11" fill="#4a8e4a" font-weight="bold">否</text>

  <rect x="390" y="312" width="140" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">单字符匹配</text>
  <text x="460" y="354" text-anchor="middle" font-size="10" fill="#555">p[j-1]=='?'</text>
  <text x="460" y="368" text-anchor="middle" font-size="10" fill="#555">或 ==s[i-1]</text>
  <text x="460" y="384" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">dp[i-1][j-1]</text>

  <!-- Merge to answer -->
  <path d="M 100 392 Q 100 410 200 410" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <path d="M 460 392 Q 460 410 360 410" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)" stroke-dasharray="3,2"/>

  <rect x="200" y="398" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 dp[m][n]</text>
</svg>
