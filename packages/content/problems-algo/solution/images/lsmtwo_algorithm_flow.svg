<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口算法流程（freq 哈希表 + 种类计数）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="90" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: left=0, max=0, freq={}</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: right < n? -->
  <polygon points="270,104 360,150 270,196 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">right &lt; n ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(遍历每个字符)</text>

  <!-- No branch -> end -->
  <path d="M 360 150 L 460 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="490" cy="150" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="154" text-anchor="middle" font-size="12" fill="#333">返回 max</text>

  <!-- Yes branch down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#82b366">是</text>

  <!-- Action: add s[right] to freq -->
  <rect x="140" y="218" width="260" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="11" fill="#333">freq[s[right]]++  （新字符入窗）</text>
  <text x="270" y="252" text-anchor="middle" font-size="11" fill="#555">若 freq 为 0→1，种类数 distinct++</text>

  <!-- arrow down -->
  <path d="M 270 260 L 270 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: distinct > 2? -->
  <polygon points="270,282 370,328 270,374 170,328" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="12" fill="#333">种类数 &gt; 2 ?</text>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#666">(窗口字符种类超限)</text>

  <!-- Yes (distinct > 2) -> shrink left -->
  <path d="M 170 328 L 100 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="320" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="10" y="306" width="88" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="324" text-anchor="middle" font-size="10" fill="#333">freq[s[left]]−−</text>
  <text x="54" y="338" text-anchor="middle" font-size="10" fill="#555">若归 0: distinct−−</text>
  <text x="54" y="352" text-anchor="middle" font-size="10" fill="#555">left++</text>

  <!-- loop back from shrink to distinct check -->
  <path d="M 54 354 L 54 388 L 270 388 L 270 374" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="402" text-anchor="middle" font-size="10" fill="#888">继续收缩直到 distinct ≤ 2</text>

  <!-- No (distinct <= 2) -> update max -->
  <path d="M 270 374 L 270 392 L 420 392 L 420 328 L 380 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="316" text-anchor="middle" font-size="11" fill="#82b366">否</text>

  <rect x="380" y="306" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="324" text-anchor="middle" font-size="10" fill="#333">max =</text>
  <text x="430" y="338" text-anchor="middle" font-size="10" fill="#555">max(max,</text>
  <text x="430" y="352" text-anchor="middle" font-size="10" fill="#555">right−left+1)</text>

  <!-- loop back to right++ -->
  <path d="M 430 306 L 430 130 L 360 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="220" font-size="10" fill="#888" transform="rotate(-90 450 220)">right++ 继续循环</text>

  <!-- summary note -->
  <text x="270" y="440" text-anchor="middle" font-size="11" fill="#888">关键：left、right 各至多移动 n 次 → O(n)；freq 哈希表让「查种类数」变成 O(1)</text>
</svg>
