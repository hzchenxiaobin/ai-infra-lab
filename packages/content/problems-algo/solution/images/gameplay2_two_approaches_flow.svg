<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两种解法流程对比：子查询 JOIN vs 窗口函数</text>

  <!-- divider -->
  <line x1="280" y1="44" x2="280" y2="320" stroke="#bbb" stroke-width="0.8" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- Left: Approach A - Subquery JOIN -->
  <text x="140" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">解法 A：子查询 JOIN</text>

  <rect x="30" y="66" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① 子查询求 min_date</text>
  <text x="140" y="102" text-anchor="middle" font-size="9" fill="#555">GROUP BY player_id + MIN(event_date)</text>

  <path d="M140 114 L140 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="30" y="130" width="220" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">② JOIN 回原表 Activity</text>
  <text x="140" y="166" text-anchor="middle" font-size="9" fill="#555">ON player_id + event_date = min_date</text>

  <path d="M140 178 L140 192" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="30" y="194" width="220" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">③ SELECT device_id</text>
  <text x="140" y="230" text-anchor="middle" font-size="9" fill="#555">定位到行，直接取 device_id</text>

  <!-- Right: Approach B - Window function -->
  <text x="420" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">解法 B：窗口函数 ROW_NUMBER</text>

  <rect x="310" y="66" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① 给每行按日期排名</text>
  <text x="420" y="102" text-anchor="middle" font-size="9" fill="#555">ROW_NUMBER() OVER (PARTITION</text>

  <path d="M420 114 L420 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="310" y="130" width="220" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="148" text-anchor="middle" font-size="9" fill="#555">BY player_id ORDER BY event_date)</text>
  <text x="420" y="164" text-anchor="middle" font-size="9.5" fill="#4a7a3a">每个玩家首登行 rn = 1</text>

  <path d="M420 178 L420 192" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="310" y="194" width="220" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">② 外层 WHERE rn = 1</text>
  <text x="420" y="230" text-anchor="middle" font-size="9" fill="#555">取出首登行，含 device_id</text>

  <!-- bottom comparison note -->
  <rect x="30" y="252" width="500" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">两种解法对比</text>
  <text x="50" y="298" font-size="10" fill="#446688" font-weight="bold">A 子查询 JOIN：</text>
  <text x="50" y="314" font-size="10" fill="#555">先求最值再定位行；需扫两遍表 + JOIN，但思路直观</text>
  <text x="300" y="298" font-size="10" fill="#4a7a3a" font-weight="bold">B 窗口函数：</text>
  <text x="300" y="314" font-size="10" fill="#555">一次扫描排序即得 rn；能顺带取整行所有列</text>
  <text x="50" y="336" font-size="10" fill="#b85450" font-weight="bold">注意：</text>
  <text x="92" y="336" font-size="10" fill="#555">主键保证首登日期唯一，两种解法等价；若日期可并列，ROW_NUMBER 只取一行，JOIN 会展开多行</text>
  <text x="50" y="354" font-size="10" fill="#555">选择口诀：只要每组的某个最值 → GROUP BY；还要最值所在行的其他列 → JOIN 回原表 或 窗口函数</text>
</svg>
