<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="470" height="470" fill="#fafafa"/>

  <text x="235" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">编码最短字符串：算法流程</text>

  <!-- Step 1: loop by length -->
  <rect x="60" y="44" width="350" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="235" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">按长度 len = 1 → n 遍历每个区间 [i, j]</text>
  <text x="235" y="78" text-anchor="middle" font-size="10" fill="#888">j = i + len − 1，保证更短的子区间已算好</text>

  <path d="M 235 90 L 235 108" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="60" y="110" width="350" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="235" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 dp[i][j] = s[i..j]（原串不编码）</text>

  <path d="M 235 152 L 235 170" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: decision diamond - whole repeat? -->
  <polygon points="235,172 360,214 235,256 110,214" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="206" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">整段是重复串？</text>
  <text x="235" y="222" text-anchor="middle" font-size="10" fill="#555">p = (sub+sub).find(sub,1)</text>
  <text x="235" y="236" text-anchor="middle" font-size="10" fill="#555">p &lt; len 且 len % p == 0 ?</text>

  <!-- Yes branch -->
  <path d="M 360 214 L 392 214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="392" y="196" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="424" y="212" text-anchor="middle" font-size="9" fill="#333">候选 =</text>
  <text x="424" y="224" text-anchor="middle" font-size="9" fill="#333">k[dp[i][i+p−1]]</text>

  <!-- No branch -->
  <path d="M 110 214 L 78 214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="208" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="14" y="196" width="64" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="46" y="218" text-anchor="middle" font-size="9" fill="#888">跳过整段</text>

  <!-- converge -->
  <path d="M 424 232 L 424 268 L 235 268" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 46 232 L 46 268 L 235 268" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 235 268 L 235 286" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: split loop -->
  <rect x="60" y="288" width="350" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="235" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举切点 k = i … j−1</text>
  <text x="235" y="324" text-anchor="middle" font-size="10" fill="#555">候选 = dp[i][k] + dp[k+1][j]</text>
  <text x="235" y="338" text-anchor="middle" font-size="10" fill="#888">若 len(候选) &lt; len(dp[i][j]) 则更新</text>

  <path d="M 235 346 L 235 364" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: keep shortest -->
  <rect x="60" y="366" width="350" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="235" y="391" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i][j] 取所有候选中长度最短者</text>

  <path d="M 235 408 L 235 424" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="90" y="426" width="290" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="235" y="447" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 dp[0][n−1] ⭐</text>
</svg>
