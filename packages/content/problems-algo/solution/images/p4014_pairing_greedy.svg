<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：大价格配大折扣，省得最多</text>
  <text x="260" y="50" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">示例 1：prices = [30, 21, 10]，discounts = [60, 50]</text>

  <!-- 列标签 -->
  <text x="88" y="80" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">prices ↓ 降序</text>
  <text x="430" y="80" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">discounts ↓ 降序</text>

  <!-- 价格格子 -->
  <rect x="56" y="90" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="56" y="144" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="56" y="198" width="64" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>

  <text x="88" y="114" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">30</text>
  <text x="88" y="168" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">21</text>
  <text x="88" y="222" text-anchor="middle" font-size="17" fill="#888" filter="url(#rough2)">10</text>

  <!-- 折扣格子 -->
  <rect x="398" y="117" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="398" y="171" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>

  <text x="430" y="141" text-anchor="middle" font-size="17" fill="#7a5518" filter="url(#rough2)">60%</text>
  <text x="430" y="195" text-anchor="middle" font-size="17" fill="#7a5518" filter="url(#rough2)">50%</text>

  <!-- 配对箭头 -->
  <path d="M 124 108 L 392 133" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 124 162 L 392 187" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="258" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">省 30×60% = 18</text>
  <text x="258" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">省 21×50% = 10.5</text>

  <!-- 无券说明 -->
  <path d="M 126 216 L 150 216" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.6"/>
  <text x="156" y="220" font-size="11.5" fill="#888" filter="url(#rough2)">无券，付原价 10</text>

  <!-- 结果框 -->
  <rect x="170" y="240" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="15" fill="#7a5518" filter="url(#rough2)">总价 = 61 − 28.5 = 32.5</text>

  <!-- 交叉配对比 -->
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">交叉配对只省 30×50% + 21×60% = 27.6，亏 0.9 ✗</text>

  <!-- 说明框 -->
  <rect x="30" y="312" width="460" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="50" y="336" font-size="13.5" font-weight="bold" fill="#2a5330" filter="url(#rough2)">交换论证：p₁d₁ + p₂d₂ ≥ p₁d₂ + p₂d₁</text>
  <text x="50" y="358" font-size="12.5" fill="#333" filter="url(#rough2)">两边之差 = (p₁−p₂)(d₁−d₂) ≥ 0（当 p₁≥p₂ 且 d₁≥d₂）⇒ 同序不劣</text>
  <text x="50" y="378" font-size="12.5" fill="#333" filter="url(#rough2)">节省恒为正 ⇒ 用满 min(n, m) 张券，且全给前 k 大价格</text>
</svg>
