<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="436" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="16" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">核心观察：位串回文 ⇔ 虚拟位串上镜像位逐对相等</text>
    <text x="260" y="32" text-anchor="middle" font-size="9.5" fill="#666">第 i 位 = s[i÷8] 的第 7−(i mod 8) 位（高位在前）—— 位串不必真的拼出来</text>

    <!-- ===== A: "ff" ===== -->
    <text x="70" y="54" font-size="11" fill="#333" font-weight="bold">示例 1：s = "ff"</text>
    <rect x="128" y="62" width="76" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="166" y="77" text-anchor="middle" font-size="10.5" fill="#7a5c1a">f = 102</text>
    <rect x="326" y="62" width="76" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="364" y="77" text-anchor="middle" font-size="10.5" fill="#7a5c1a">f = 102</text>

    <!-- byte 0 cells: 01100110 -->
    <rect x="70"  y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="94"  y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="118" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="142" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="166" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="190" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="214" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="238" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="82"  y="111" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="106" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="130" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="154" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="178" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="202" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="226" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="250" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>

    <!-- byte 1 cells: 01100110 -->
    <rect x="268" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="292" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="316" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="340" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="364" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="388" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="412" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="436" y="94" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="280" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="304" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="328" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="352" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="376" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="400" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="424" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="448" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>

    <!-- mirror arcs -->
    <path d="M 82 126 Q 265 176 448 126" stroke="#4a7a3a" stroke-width="1.4" fill="none"/>
    <path d="M 106 126 Q 265 156 424 126" stroke="#4a7a3a" stroke-width="1.4" fill="none"/>
    <path d="M 130 126 Q 265 142 400 126" stroke="#4a7a3a" stroke-width="1.4" fill="none"/>
    <path d="M 154 126 Q 265 130 376 126" stroke="#4a7a3a" stroke-width="1.4" fill="none"/>
    <circle cx="82"  cy="126" r="2" fill="#4a7a3a"/>
    <circle cx="106" cy="126" r="2" fill="#4a7a3a"/>
    <circle cx="130" cy="126" r="2" fill="#4a7a3a"/>
    <circle cx="154" cy="126" r="2" fill="#4a7a3a"/>
    <circle cx="376" cy="126" r="2" fill="#4a7a3a"/>
    <circle cx="400" cy="126" r="2" fill="#4a7a3a"/>
    <circle cx="424" cy="126" r="2" fill="#4a7a3a"/>
    <circle cx="448" cy="126" r="2" fill="#4a7a3a"/>
    <text x="265" y="172" text-anchor="middle" font-size="10" fill="#2f5527" font-weight="bold">✓ 8 对镜像位全部相等 → true</text>

    <!-- ===== B: "leet" ===== -->
    <text x="70" y="216" font-size="11" fill="#333" font-weight="bold">示例 2：s = "leet" —— 看首尾两个字节即可出局</text>
    <text x="166" y="224" text-anchor="middle" font-size="9.5" fill="#666">l = 108</text>
    <text x="364" y="224" text-anchor="middle" font-size="9.5" fill="#666">t = 116</text>

    <!-- 'l' byte: 01101100, top-3 highlighted -->
    <rect x="70"  y="230" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="94"  y="230" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="118" y="230" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="142" y="230" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="166" y="230" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="190" y="230" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="214" y="230" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="238" y="230" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="82"  y="247" text-anchor="middle" font-size="11" fill="#7a5c1a">0</text>
    <text x="106" y="247" text-anchor="middle" font-size="11" fill="#7a5c1a">1</text>
    <text x="130" y="247" text-anchor="middle" font-size="11" fill="#7a5c1a">1</text>
    <text x="154" y="247" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="178" y="247" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="202" y="247" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="226" y="247" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="250" y="247" text-anchor="middle" font-size="11" fill="#333">0</text>

    <!-- 't' byte: 01110100, low-3 highlighted -->
    <rect x="268" y="230" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="292" y="230" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="316" y="230" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="340" y="230" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="364" y="230" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="388" y="230" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="412" y="230" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="436" y="230" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="280" y="247" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="304" y="247" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="328" y="247" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="352" y="247" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="376" y="247" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="400" y="247" text-anchor="middle" font-size="11" fill="#8a3a35">1</text>
    <text x="424" y="247" text-anchor="middle" font-size="11" fill="#8a3a35">0</text>
    <text x="448" y="247" text-anchor="middle" font-size="11" fill="#8a3a35">0</text>

    <text x="70" y="272" font-size="9.5" fill="#8a6d1f">'l' 高 3 位 = 011：小写字母 ASCII ∈ [97, 122]，每个字节天生以 011 开头</text>
    <text x="70" y="288" font-size="9.5" fill="#b85450">镜像要求位串末 3 位 = 110，而 't' 低 3 位 = 100 → 矛盾，false ✗</text>

    <!-- ===== C: theorem ===== -->
    <rect x="50" y="298" width="420" height="124" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#2f5527" font-weight="bold">必要条件：s 的每个字符只能是 f / n / v（否则直接 false）</text>
    <text x="68" y="338" font-size="9.5" fill="#3d5a33">· 每字节恒以 011 开头 + 回文镜像 ⇒ 每字节的低 3 位必须是 110（011 的反序）</text>
    <text x="68" y="354" font-size="9.5" fill="#3d5a33">· ASCII ∈ [97, 122] 且低 3 位 = 110 的只有下面三个字母：</text>
    <rect x="166" y="362" width="52" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="192" y="377" text-anchor="middle" font-size="10.5" fill="#7a5c1a">f · 102</text>
    <rect x="234" y="362" width="52" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="377" text-anchor="middle" font-size="10.5" fill="#7a5c1a">n · 110</text>
    <rect x="302" y="362" width="52" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="328" y="377" text-anchor="middle" font-size="10.5" fill="#7a5c1a">v · 118</text>
    <text x="68" y="408" font-size="9" fill="#4a7a3a">彩蛋：奇数长度时正中间字符还必须是 'f'（唯一自身回文的字节）—— 详见题解第 5 节</text>
  </g>
</svg>
