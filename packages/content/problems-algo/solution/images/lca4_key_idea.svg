<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：从 2 节点 LCA 到 k 节点 LCA 的自然推广</text>

  <!-- ===== TOP: 236 vs 1676 ===== -->
  <rect x="30" y="44" width="240" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">236：LCA(p, q) — 2 个节点</text>
  <text x="150" y="80" text-anchor="middle" font-size="10" fill="#555">命中判定：</text>
  <text x="150" y="97" text-anchor="middle" font-size="10" fill="#333">root == p || root == q</text>

  <path d="M 275 76 L 325 76" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="9" fill="#888">推广</text>

  <rect x="330" y="44" width="240" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1676：LCA(nodes[]) — k 个节点</text>
  <text x="450" y="80" text-anchor="middle" font-size="10" fill="#555">命中判定：</text>
  <text x="450" y="97" text-anchor="middle" font-size="10" fill="#333">root ∈ nodes_set</text>

  <!-- Divider -->
  <line x1="30" y1="124" x2="570" y2="124" stroke="#ddd" stroke-width="1" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== MIDDLE: Tree ===== -->
  <text x="300" y="144" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">nodes = {4, 7, 0}，后序 DFS 自底向上汇聚</text>

  <!-- 3 = LCA -->
  <circle cx="300" cy="172" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="300" y="177" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="325" y="168" font-size="9" fill="#4a7a3a" font-weight="bold">LCA</text>

  <!-- 5 -->
  <circle cx="235" cy="218" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <line x1="287" y1="186" x2="245" y2="206" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 1 -->
  <circle cx="365" cy="218" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <line x1="313" y1="186" x2="355" y2="206" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 6 -->
  <circle cx="185" cy="264" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <line x1="225" y1="231" x2="193" y2="253" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 2 = subset LCA -->
  <circle cx="275" cy="264" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="275" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="275" y="292" text-anchor="middle" font-size="8" fill="#d6a040">子集LCA</text>
  <line x1="247" y1="231" x2="267" y2="253" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 0 = target -->
  <circle cx="345" cy="264" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="345" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="361" y="256" font-size="9" fill="#b85450" font-weight="bold">目标</text>
  <line x1="355" y1="231" x2="348" y2="253" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 8 -->
  <circle cx="415" cy="264" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <line x1="375" y1="231" x2="407" y2="253" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 7 = target -->
  <circle cx="248" cy="310" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="248" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="232" y="298" font-size="9" fill="#b85450" font-weight="bold">目标</text>
  <line x1="267" y1="276" x2="253" y2="299" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 4 = target -->
  <circle cx="305" cy="310" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="305" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="320" y="298" font-size="9" fill="#b85450" font-weight="bold">目标</text>
  <line x1="283" y1="276" x2="298" y2="299" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== BOTTOM: Insight ===== -->
  <rect x="30" y="340" width="540" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键洞察</text>
  <text x="300" y="380" text-anchor="middle" font-size="10" fill="#555">① 决策逻辑与 236 完全一致：left、right 都非空 → root 是 LCA</text>
  <text x="300" y="396" text-anchor="middle" font-size="10" fill="#555">② 仅把"逐个比较 p、q"替换为"集合查找 root ∈ set"，O(1) 判定</text>
  <text x="300" y="412" text-anchor="middle" font-size="10" fill="#555">③ 子集 LCA 自然合并：节点 2 先求出 LCA({7,4})=2，再在节点 3 与 {0} 汇聚</text>
  <text x="300" y="428" text-anchor="middle" font-size="10" fill="#555">④ 所有节点保证存在 → 可像 236 一样早返回，无需计数验证（对照 1644）</text>
</svg>
