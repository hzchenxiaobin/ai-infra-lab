<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">下标奇偶性 → 决定该位的可选数字集合</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">下标从 0 开始：偶位放偶数(5种)，奇位放质数(4种)</text>

  <!-- position boxes row -->
  <g font-size="13">
    <!-- i=0 even -->
    <rect x="50" y="90" width="64" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="82" y="112" text-anchor="middle" fill="#446688" font-weight="bold">i=0</text>
    <text x="82" y="130" text-anchor="middle" font-size="10" fill="#446688">偶位</text>

    <!-- i=1 odd -->
    <rect x="150" y="90" width="64" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="182" y="112" text-anchor="middle" fill="#d6a040" font-weight="bold">i=1</text>
    <text x="182" y="130" text-anchor="middle" font-size="10" fill="#d6a040">奇位</text>

    <!-- i=2 even -->
    <rect x="250" y="90" width="64" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="282" y="112" text-anchor="middle" fill="#446688" font-weight="bold">i=2</text>
    <text x="282" y="130" text-anchor="middle" font-size="10" fill="#446688">偶位</text>

    <!-- i=3 odd -->
    <rect x="350" y="90" width="64" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="382" y="112" text-anchor="middle" fill="#d6a040" font-weight="bold">i=3</text>
    <text x="382" y="130" text-anchor="middle" font-size="10" fill="#d6a040">奇位</text>

    <!-- i=4 even -->
    <rect x="450" y="90" width="64" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="482" y="112" text-anchor="middle" fill="#446688" font-weight="bold">i=4</text>
    <text x="482" y="130" text-anchor="middle" font-size="10" fill="#446688">偶位</text>
  </g>

  <!-- arrows down -->
  <path d="M 82 150 L 82 178" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 182 150 L 182 178" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 282 150 L 282 178" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 382 150 L 382 178" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 482 150 L 482 178" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- allowed digit sets -->
  <g font-size="12">
    <rect x="44" y="186" width="76" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="82" y="206" text-anchor="middle" fill="#446688">0 2 4 6 8</text>
    <text x="82" y="228" text-anchor="middle" fill="#b85450" font-weight="bold">5 种</text>

    <rect x="144" y="186" width="76" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="182" y="206" text-anchor="middle" fill="#d6a040">2 3 5 7</text>
    <text x="182" y="228" text-anchor="middle" fill="#b85450" font-weight="bold">4 种</text>

    <rect x="244" y="186" width="76" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="282" y="206" text-anchor="middle" fill="#446688">0 2 4 6 8</text>
    <text x="282" y="228" text-anchor="middle" fill="#b85450" font-weight="bold">5 种</text>

    <rect x="344" y="186" width="76" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="382" y="206" text-anchor="middle" fill="#d6a040">2 3 5 7</text>
    <text x="382" y="228" text-anchor="middle" fill="#b85450" font-weight="bold">4 种</text>

    <rect x="444" y="186" width="76" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="482" y="206" text-anchor="middle" fill="#446688">0 2 4 6 8</text>
    <text x="482" y="228" text-anchor="middle" fill="#b85450" font-weight="bold">5 种</text>
  </g>

  <!-- bottom summary -->
  <rect x="40" y="270" width="520" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="296" font-size="13" fill="#444" font-weight="bold">每位选择互相独立 → 乘法原理</text>
  <text x="60" y="318" font-size="12" fill="#4a7a3a">设 #偶位 = ⌈n/2⌉，#奇位 = ⌊n/2⌋</text>
  <text x="60" y="340" font-size="13" fill="#b85450" font-weight="bold">总数 = 5^(#偶位) × 4^(#奇位)</text>
  <text x="60" y="362" font-size="10" fill="#888">关键：各位独立 ⇒ 不需 DP，直接组合计数 + 快速幂</text>
</svg>
