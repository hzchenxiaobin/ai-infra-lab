<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一遍扫描维护最低前缀和 → 1 − minPrefix</text>

  <!-- 1. init -->
  <rect x="160" y="44" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化</text>
  <text x="260" y="78" text-anchor="middle" font-size="10.5" fill="#555">prefix = 0, minPrefix = 0</text>

  <path d="M 260 84 L 260 102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. loop check -->
  <polygon points="260,102 370,148 260,194 150,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#333">还有元素?</text>
  <text x="260" y="160" text-anchor="middle" font-size="10.5" fill="#888">(遍历 nums)</text>

  <!-- 否 → return -->
  <path d="M 370 148 L 430 148" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="140" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="424" y="130" width="86" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="467" y="148" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">return</text>
  <text x="467" y="162" text-anchor="middle" font-size="10" fill="#b85450">1 − minPrefix</text>

  <!-- 是 ↓ -->
  <path d="M 260 194 L 260 212" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="208" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 3. accumulate -->
  <rect x="150" y="212" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="12" fill="#333">② prefix += nums[i]</text>
  <text x="260" y="246" text-anchor="middle" font-size="10.5" fill="#555">累加当前元素到前缀和</text>

  <path d="M 260 252 L 260 270" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. update min -->
  <rect x="150" y="270" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="12" fill="#333">③ minPrefix = min(minPrefix, prefix)</text>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#555">记录历史最低谷</text>

  <!-- loop back to ② check -->
  <path d="M 150 290 L 80 290 L 80 148 L 148 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="54" y="220" font-size="10.5" fill="#666" font-weight="bold">下一元素</text>

  <!-- bottom note -->
  <rect x="60" y="336" width="400" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">为什么 minPrefix 初值取 0？</text>
  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#555">“空前缀”（尚未加任何元素）的和 = 0，对应 startValue 本身</text>
  <text x="260" y="394" text-anchor="middle" font-size="10.5" fill="#555">它也必须 ≥ 1，即 startValue + 0 ≥ 1 ⟹ startValue ≥ 1</text>
  <text x="260" y="412" text-anchor="middle" font-size="10" fill="#888">于是 minPrefix ≤ 0 恒成立，1 − minPrefix ≥ 1，无需再 max(1, …)</text>
</svg>
