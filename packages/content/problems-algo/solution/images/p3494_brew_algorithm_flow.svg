<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐药水推进，每条两个 O(n) 循环</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="115" y="40" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="200" y="59" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">开始：pre = skill 前缀和，f = [0]×n</text>
  </g>
  <line x1="200" y1="70" x2="200" y2="84" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <g filter="url(#rough2)">
    <path d="M 200 86 L 268 122 L 200 158 L 132 122 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="200" y="119" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">还有药水？</text>
    <text x="200" y="134" text-anchor="middle" font-size="8.5" fill="#8a6d1f">(j &lt; m)</text>
  </g>

  <!-- yes branch -->
  <line x1="200" y1="158" x2="200" y2="172" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="209" y="170" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- box1 -->
  <g filter="url(#rough2)">
    <rect x="115" y="176" width="170" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="200" y="194" text-anchor="middle" font-size="9.5" fill="#33506b">x ← mana[j]</text>
    <text x="200" y="212" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">t₀ ← max_i(f[i] − pre[i]·x)</text>
  </g>
  <line x1="200" y1="222" x2="200" y2="236" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- box2 -->
  <g filter="url(#rough2)">
    <rect x="115" y="238" width="170" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="200" y="256" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">f[i] ← t₀ + pre[i+1]·x</text>
    <text x="200" y="274" text-anchor="middle" font-size="9" fill="#55677d">(i = 0..n−1，重建楼梯状时间线)</text>
  </g>

  <!-- loop back -->
  <path d="M 200 284 L 200 302 L 78 302 L 78 122 L 126 122" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="139" y="296" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">j ← j + 1，下一条药水</text>

  <!-- no branch -->
  <line x1="268" y1="122" x2="334" y2="122" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="292" y="116" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- end box -->
  <g filter="url(#rough2)">
    <rect x="338" y="104" width="152" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
    <text x="414" y="126" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">返回 f[n−1]</text>
  </g>

  <!-- side box: official hints equivalent -->
  <g filter="url(#rough2)">
    <rect x="298" y="160" width="206" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4" rx="8"/>
    <text x="401" y="178" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">等价写法（官方 hints）</text>
    <text x="401" y="196" text-anchor="middle" font-size="8.5" fill="#8a6d1f">顺序递推：now = max(now +</text>
    <text x="401" y="210" text-anchor="middle" font-size="8.5" fill="#8a6d1f">skill[i−1]·x, f[i])，得末位完工</text>
    <text x="401" y="226" text-anchor="middle" font-size="8.5" fill="#8a6d1f">再反向回填：f[i] = f[i+1] −</text>
    <text x="401" y="240" text-anchor="middle" font-size="8.5" fill="#8a6d1f">skill[i+1]·x（与前缀和法等值）</text>
  </g>

  <!-- side box: complexity -->
  <g filter="url(#rough2)">
    <rect x="298" y="262" width="206" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="401" y="282" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">时间 O(n·m)，空间 O(n)</text>
    <text x="401" y="300" text-anchor="middle" font-size="8.5" fill="#2f5d24">答案上界 ≈ 6.25×10¹⁴ → 64 位整数</text>
  </g>

  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">「不许停」⇒ 刚性木条：一趟 max 定位瓶颈，一趟重建时间线</text>
</svg>
