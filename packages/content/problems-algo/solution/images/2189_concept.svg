<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：行卡片数 = 3k−1 + 取异即合法</text>

  <!-- ====== Left: House of Cards visual ====== -->
  <rect x="20" y="42" width="260" height="210" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.4"/>
  <text x="150" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">纸牌屋结构（2 行）</text>

  <!-- Top row: 1 triangle on horizontal card 1 -->
  <!-- top triangle: apex (90,100), base left (60,135), base right (120,135) -->
  <line x1="90" y1="100" x2="60" y2="135" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="90" y1="100" x2="120" y2="135" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- Horizontal cards (orange) at apex level y=135 -->
  <line x1="60" y1="135" x2="120" y2="135" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <line x1="120" y1="135" x2="180" y2="135" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>

  <!-- Bottom row: 3 triangles -->
  <!-- tri1: apex (60,135), base (40,170)-(80,170) -->
  <line x1="60" y1="135" x2="40" y2="170" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="60" y1="135" x2="80" y2="170" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- tri2: apex (120,135), base (100,170)-(140,170) -->
  <line x1="120" y1="135" x2="100" y2="170" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="120" y1="135" x2="140" y2="170" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- tri3: apex (180,135), base (160,170)-(200,170) -->
  <line x1="180" y1="135" x2="160" y2="170" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="180" y1="135" x2="200" y2="170" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- ground line -->
  <line x1="32" y1="172" x2="208" y2="172" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- labels -->
  <text x="90" y="92" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1 个△ = 2 张</text>
  <text x="150" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3 个△ + 2 水平 = 8 张</text>

  <!-- legend -->
  <line x1="40" y1="195" x2="60" y2="195" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="66" y="199" font-size="10" fill="#666">斜靠牌（2 张/△）</text>
  <line x1="160" y1="195" x2="180" y2="195" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <text x="186" y="199" font-size="10" fill="#666">水平牌</text>

  <!-- total -->
  <rect x="60" y="212" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">总计 2 + 8 = 10 张 ✓</text>

  <!-- ====== Right: Card counting formula ====== -->
  <rect x="300" y="42" width="240" height="210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.4"/>
  <text x="420" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">每行卡片数公式</text>

  <!-- formula box -->
  <rect x="316" y="76" width="208" height="56" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k 个三角形的一行：</text>
  <text x="420" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2k（斜靠）+ (k−1)（水平）</text>
  <text x="420" y="132" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= 3k − 1 张</text>

  <!-- value table -->
  <text x="420" y="156" text-anchor="middle" font-size="10" fill="#888">k 个三角形 → 卡片数</text>
  <g filter="url(#rough2)">
    <rect x="324" y="164" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="339" y="180" text-anchor="middle" font-size="10" fill="#333">2</text>
    <rect x="358" y="164" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="373" y="180" text-anchor="middle" font-size="10" fill="#333">5</text>
    <rect x="392" y="164" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="407" y="180" text-anchor="middle" font-size="10" fill="#333">8</text>
    <rect x="426" y="164" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="441" y="180" text-anchor="middle" font-size="10" fill="#333">11</text>
    <rect x="460" y="164" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="475" y="180" text-anchor="middle" font-size="10" fill="#333">14</text>
    <text x="496" y="180" font-size="10" fill="#888">…</text>
  </g>
  <text x="339" y="200" text-anchor="middle" font-size="9" fill="#888">k=1</text>
  <text x="373" y="200" text-anchor="middle" font-size="9" fill="#888">k=2</text>
  <text x="407" y="200" text-anchor="middle" font-size="9" fill="#888">k=3</text>
  <text x="441" y="200" text-anchor="middle" font-size="9" fill="#888">k=4</text>
  <text x="475" y="200" text-anchor="middle" font-size="9" fill="#888">k=5</text>

  <!-- note -->
  <rect x="316" y="210" width="208" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="420" y="226" text-anchor="middle" font-size="10" fill="#666">候选集 = {2, 5, 8, 11, 14, …}</text>
  <text x="420" y="240" text-anchor="middle" font-size="10" fill="#666">每个值至多取一次（0-1 背包）</text>

  <!-- ====== Bottom: Key insight ====== -->
  <rect x="20" y="264" width="520" height="162" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.35"/>
  <text x="280" y="286" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">关键洞察：行大小互异 ⟹ 堆叠约束自动满足</text>

  <!-- insight 1 -->
  <text x="40" y="312" font-size="11" fill="#444" font-weight="bold">① 堆叠约束：</text>
  <rect x="120" y="300" width="180" height="22" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="316" text-anchor="middle" font-size="10" fill="#333">上行△数 ≤ 下行水平牌数 = k−1</text>

  <!-- insight 2 -->
  <text x="40" y="346" font-size="11" fill="#444" font-weight="bold">② 互异即合法：</text>
  <rect x="120" y="334" width="280" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#333">选 t₁ &lt; t₂ &lt; … ⟹ tᵢ ≤ tᵢ₊₁−1 自动成立 ✓</text>

  <!-- insight 3 -->
  <text x="40" y="380" font-size="11" fill="#444" font-weight="bold">③ 问题归约：</text>
  <rect x="120" y="368" width="380" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="384" text-anchor="middle" font-size="10" fill="#333">从 {3k−1 : k=1,2,…} 中选子集求和恰为 n 的方案数</text>

  <!-- summary arrow -->
  <text x="280" y="410" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 经典 0-1 背包计数 / 记忆化搜索</text>
  <text x="280" y="426" text-anchor="middle" font-size="10" fill="#888">dfs(剩余 r, 最小行号 t) = dfs(r−cost, t+1) + dfs(r, t+1)</text>
</svg>
