<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="380" fill="#fafafa"/>

  <text x="390" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：主键 (subject_id, dept_id) 不含 teacher_id → 同一教师同一科目可跨系重复</text>

  <!-- ===== Panel A: Teacher table ===== -->
  <text x="144" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Teacher（原始，PK = subject_id + dept_id）</text>
  <rect x="24" y="60" width="240" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="74" text-anchor="middle" font-size="9" fill="#333">teacher_id</text>
  <text x="144" y="74" text-anchor="middle" font-size="9" fill="#333">subject_id</text>
  <text x="224" y="74" text-anchor="middle" font-size="9" fill="#333">dept_id</text>
  <line x1="104" y1="60" x2="104" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="184" y1="60" x2="184" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- teacher1 rows green -->
  <rect x="24" y="80" width="240" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="94" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="144" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="224" y="94" text-anchor="middle" font-size="9" fill="#333">3</text>

  <rect x="24" y="100" width="240" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="114" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="144" y="114" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="224" y="114" text-anchor="middle" font-size="9" fill="#333">4</text>

  <rect x="24" y="120" width="240" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="134" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="144" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="224" y="134" text-anchor="middle" font-size="9" fill="#333">3</text>

  <!-- teacher2 rows orange -->
  <rect x="24" y="140" width="240" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="154" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="144" y="154" text-anchor="middle" font-size="9" fill="#d6a040">1</text>
  <text x="224" y="154" text-anchor="middle" font-size="9" fill="#333">1</text>

  <rect x="24" y="160" width="240" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="174" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="144" y="174" text-anchor="middle" font-size="9" fill="#d6a040">2</text>
  <text x="224" y="174" text-anchor="middle" font-size="9" fill="#333">1</text>

  <rect x="24" y="180" width="240" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="194" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="144" y="194" text-anchor="middle" font-size="9" fill="#d6a040">3</text>
  <text x="224" y="194" text-anchor="middle" font-size="9" fill="#333">1</text>

  <rect x="24" y="200" width="240" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="214" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="144" y="214" text-anchor="middle" font-size="9" fill="#d6a040">4</text>
  <text x="224" y="214" text-anchor="middle" font-size="9" fill="#333">1</text>

  <line x1="104" y1="80" x2="104" y2="220" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="184" y1="80" x2="184" y2="220" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- bracket marking duplicate subject_id=2 for teacher 1 -->
  <path d="M270 84 L280 84 L280 116 L270 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="288" y="96" font-size="9" fill="#b85450" font-weight="bold">科目 2 重复</text>
  <text x="288" y="110" font-size="8" fill="#b85450">（跨 3 / 4 系）</text>

  <!-- Arrow A -> B -->
  <path d="M372 150 L420 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="396" y="142" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">DISTINCT</text>
  <text x="396" y="166" text-anchor="middle" font-size="8" fill="#888">对 subject_id 去重</text>

  <!-- ===== Panel B: result ===== -->
  <text x="610" y="54" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每位教师去重后科目集合 → cnt</text>
  <rect x="440" y="60" width="316" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="74" text-anchor="middle" font-size="9" fill="#333">teacher_id</text>
  <text x="590" y="74" text-anchor="middle" font-size="9" fill="#333">不同科目集合</text>
  <text x="710" y="74" text-anchor="middle" font-size="9" fill="#333">cnt</text>
  <line x1="500" y1="60" x2="500" y2="80" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="680" y1="60" x2="680" y2="80" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="440" y="80" width="316" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="470" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="590" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">{ 2 , 3 }</text>
  <text x="710" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="440" y="100" width="316" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="470" y="114" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text>
  <text x="590" y="114" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">{ 1, 2, 3, 4 }</text>
  <text x="710" y="114" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4</text>
  <line x1="500" y1="80" x2="500" y2="120" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="680" y1="80" x2="680" y2="120" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- ===== Bottom note ===== -->
  <rect x="24" y="250" width="732" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 陷阱：COUNT(*) 会把教师 1 的 3 行算成 3，但科目 2 跨系重复 → 真实不同科目只有 {2,3}=2</text>
  <text x="390" y="292" text-anchor="middle" font-size="10" fill="#666">主键是 (subject_id, dept_id) 而非 (teacher_id, subject_id)：同一教师可在不同系教同一科目 → 产生重复行</text>
  <text x="390" y="312" text-anchor="middle" font-size="10" fill="#666">故须 COUNT(DISTINCT subject_id)：分组键是 teacher_id，对 subject_id 在组内去重后计数</text>
  <text x="390" y="332" text-anchor="middle" font-size="10" fill="#666">识别口诀：「计数前先看分组内计数列是否可能与分组键重复」——可能重复即上 DISTINCT</text>
</svg>
