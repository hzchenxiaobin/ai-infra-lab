<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：交替串 = 奇偶位轮流值班 ⇒ 计数差 ≤ 1</text>

  <!-- 左上：交替串示例 -->
  <text x="24" y="42" font-size="10" fill="#555" filter="url(#rough2)">长度 5 的交替串 "01010"：</text>

  <rect x="40" y="50" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="74" y="50" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="108" y="50" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="142" y="50" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="176" y="50" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="56" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="90" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="124" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="158" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="192" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="56" y="96" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">位置0</text>
  <text x="90" y="96" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">位置1</text>
  <text x="124" y="96" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">位置2</text>
  <text x="158" y="96" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">位置3</text>
  <text x="192" y="96" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">位置4</text>

  <text x="56" y="110" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="90" y="110" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="124" y="110" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="158" y="110" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="192" y="110" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">偶</text>

  <rect x="24" y="122" width="150" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="99" y="136" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">偶位 ⌈L/2⌉ 格 ← 一种字符</text>
  <rect x="24" y="146" width="150" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="99" y="160" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">奇位 ⌊L/2⌋ 格 ← 另一种字符</text>

  <!-- 左中：三种构造情形 -->
  <text x="24" y="176" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">构造（充分性）：按计数差三种情形</text>

  <rect x="24" y="181" width="252" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="195" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">c0 = c1　→　0101…01（两种起点任选）<tspan fill="#4a7a3a" font-weight="bold">✓</tspan></text>

  <rect x="24" y="204" width="252" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="218" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">c0 = c1+1　→　0101…0（'0' 占偶位）<tspan fill="#4a7a3a" font-weight="bold">✓</tspan></text>

  <rect x="24" y="227" width="252" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="241" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">c1 = c0+1　→　1010…1（'1' 占偶位）<tspan fill="#4a7a3a" font-weight="bold">✓</tspan></text>

  <!-- 右侧：引理面板 -->
  <rect x="300" y="44" width="196" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="62" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">引理：充要条件</text>
  <text x="398" y="80" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">{0×c0, 1×c1} 可重排成交替串</text>
  <text x="398" y="99" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⟺ |c0 − c1| ≤ 1</text>
  <text x="398" y="117" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">奇偶位个数差天然只有 0 或 1（必要性）</text>
  <text x="398" y="133" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">按差值情形构造即得（充分性，见左）</text>

  <rect x="300" y="156" width="196" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="173" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">|c0 − c1| ≥ 2 ⇒ 无解</text>
  <text x="398" y="191" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">多出的同类字符无处安放，必相邻</text>

  <rect x="300" y="216" width="196" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="233" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀嵌套 ⇒ 增量维护</text>
  <text x="398" y="250" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">s[0..i] 比 s[0..i−1] 恰多一个字符</text>

  <!-- 底部：示例演算 -->
  <text x="24" y="260" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 s = "00101"：逐前缀看计数差</text>

  <rect x="28" y="272" width="88" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="292" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">"0"</text>
  <text x="72" y="307" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">c0:c1 = 1:0</text>
  <text x="72" y="322" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">diff = 1 <tspan fill="#4a7a3a" font-weight="bold" font-size="10">✓</tspan></text>

  <rect x="124" y="272" width="88" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="292" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">"00"</text>
  <text x="168" y="307" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">c0:c1 = 2:0</text>
  <text x="168" y="322" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">diff = 2 <tspan fill="#b85450" font-weight="bold" font-size="10">✗</tspan></text>

  <rect x="220" y="272" width="88" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="292" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">"001"</text>
  <text x="264" y="307" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">c0:c1 = 2:1</text>
  <text x="264" y="322" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">diff = 1 <tspan fill="#4a7a3a" font-weight="bold" font-size="10">✓</tspan></text>

  <rect x="316" y="272" width="88" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="292" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">"0010"</text>
  <text x="360" y="307" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">c0:c1 = 3:1</text>
  <text x="360" y="322" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">diff = 2 <tspan fill="#b85450" font-weight="bold" font-size="10">✗</tspan></text>

  <rect x="412" y="272" width="88" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="456" y="292" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">"00101"</text>
  <text x="456" y="307" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">c0:c1 = 3:2</text>
  <text x="456" y="322" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">diff = 1 <tspan fill="#4a7a3a" font-weight="bold" font-size="10">✓</tspan></text>

  <text x="260" y="352" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">答案 = 3（✓ 的个数）—— 判定只看计数，与前缀自身顺序无关</text>
</svg>
