<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">记忆化搜索流程</text>

  <!-- 起点 -->
  <rect x="200" y="46" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">调用 dfs(start, fuel)</text>
  <path d="M280 80 L280 96" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- 判 memo -->
  <polygon points="280,100 380,140 280,180 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">memo[city][f]</text>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">已计算?</text>

  <!-- 命中返回 -->
  <rect x="400" y="124" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="465" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">直接返回 memo 值</text>
  <path d="M380 140 L396 140" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <text x="388" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 否，继续 -->
  <path d="M280 182 L280 198" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="296" y="194" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- 计数初始化 -->
  <rect x="180" y="200" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="221" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">cnt = (city == finish) ? 1 : 0</text>
  <path d="M280 236 L280 252" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- 枚举 j 循环 -->
  <polygon points="280,256 400,300 280,344 160,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">枚举 j != city</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">cost = |loc[i]-loc[j]|</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">cost ≤ f ?</text>

  <!-- 递归调用 -->
  <rect x="420" y="284" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="300" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">cnt += dfs(j,</text>
  <text x="480" y="314" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">      f - cost)</text>
  <path d="M400 300 L416 300" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="408" y="294" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- 循环结束 -->
  <path d="M280 346 L280 362" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M160 300 Q 110 300 110 250 Q 110 218 176 218" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="100" y="262" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">下一个 j</text>

  <!-- 写 memo 返回 -->
  <rect x="170" y="364" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">memo[city][f] = cnt % MOD; 返回</text>
  <path d="M280 398 L280 414" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arrG)"/>

  <!-- 终点 -->
  <rect x="200" y="416" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="435" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 dfs(start, fuel)</text>
</svg>
