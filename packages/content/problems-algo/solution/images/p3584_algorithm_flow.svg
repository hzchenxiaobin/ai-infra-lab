<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="240" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">一遍扫描：尾指针 j 右移，前缀双极值增量维护</text>

  <!-- 开始 -->
  <rect x="200" y="38" width="90" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">开始</text>
  <path d="M 245 68 L 245 84" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="90" y="86" width="310" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="107" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">preMax = preMin = nums[0]，ans = −∞，j = m−1</text>
  <path d="M 245 118 L 245 132" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="245,134 355,172 245,210 135,172" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="245" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">j &lt; n ?</text>

  <!-- 否 → 返回 -->
  <path d="M 355 172 L 412 172" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="414" y="154" width="92" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="177" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <!-- 是 → 更新前缀极值 -->
  <path d="M 245 210 L 245 228" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="224" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <rect x="80" y="230" width="330" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="251" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i = j−m+1；若 i &gt; 0：preMax / preMin 纳入 nums[i]</text>
  <path d="M 245 262 L 245 278" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 打分 -->
  <rect x="52" y="280" width="386" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="245" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">ans ← max( ans, nums[j]×preMax, nums[j]×preMin )</text>
  <path d="M 245 312 L 245 328" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- j++ -->
  <rect x="192" y="330" width="106" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="350" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">j ← j + 1</text>

  <!-- 回环 -->
  <path d="M 245 360 L 245 392 L 66 392 L 66 172 L 130 172" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="386" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">循环下一尾元素</text>

  <!-- 说明 -->
  <rect x="318" y="330" width="188" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="351" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">每步 O(1)：区间右端点</text>
  <text x="412" y="367" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">i = j−m+1 随 j 同步右移，</text>
  <text x="412" y="382" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">前缀极值只增不回退</text>
</svg>
