<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟计数，返回差值绝对值</text>

  <!-- 主干 -->
  <rect x="155" y="30" width="70" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="47" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 190 56 L 190 68" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="70" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="87" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = 0</text>
  <path d="M 190 96 L 190 108" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="110" width="116" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个字符 c</text>
  <path d="M 190 136 L 190 150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：c == 'a' ? -->
  <polygon points="190,152 254,178 190,204 126,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c == 'a' ?</text>

  <path d="M 254 178 L 298 178" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="302" y="165" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d += 1</text>

  <path d="M 126 178 L 82 178" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="170" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="10" y="165" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="46" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d -= 1</text>

  <!-- 分支汇合 -->
  <path d="M 338 191 L 338 228 L 190 228" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 46 191 L 46 228 L 190 228" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 190 228 L 190 242" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：还有字符? -->
  <polygon points="190,244 258,270 190,296 122,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">还有字符?</text>

  <!-- 否 → 返回 |d| → 结束 -->
  <path d="M 258 270 L 306 270" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="262" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="310" y="257" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">返回 |d|</text>
  <path d="M 402 270 L 436 270" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="257" width="64" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">结束</text>

  <!-- 是 → 回到取字符 -->
  <path d="M 122 270 L 60 270 L 60 123 L 128 123" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="90" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 侧注 -->
  <rect x="300" y="44" width="204" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="64" font-size="9.5" fill="#333" filter="url(#rough2)">💡 等价一行（Python）：</text>
  <text x="312" y="80" font-size="9.5" fill="#446688" filter="url(#rough2)">abs(s.count('a') - s.count('b'))</text>
  <text x="312" y="98" font-size="9.5" fill="#333" filter="url(#rough2)">栈消除（相邻 "ab"/"ba" 配对删）</text>
  <text x="312" y="114" font-size="9.5" fill="#333" filter="url(#rough2)">同样得到 |d|，O(n) 不变量验证</text>

  <!-- 底部总结 -->
  <rect x="16" y="312" width="488" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">一趟计数：'a' 记 +1、'b' 记 −1，累出差值 d，返回 |d| —— O(n) 时间 / O(1) 空间</text>

  <text x="16" y="354" font-size="9.5" fill="#999" filter="url(#rough2)">⚠️ 别真去模拟删除：删除顺序不影响结果，计数即答案</text>
</svg>
