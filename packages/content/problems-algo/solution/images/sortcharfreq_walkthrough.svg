<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：tree 与 Aabb</text>

  <!-- ===== Example 1: tree ===== -->
  <text x="40" y="58" font-size="13" fill="#446688" font-weight="bold">示例 1：s = "tree"</text>

  <!-- Table header -->
  <rect x="40" y="68" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="120" y="68" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">频率统计</text>
  <rect x="300" y="68" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">排序后</text>
  <rect x="420" y="68" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结果</text>

  <!-- Row 1: count -->
  <rect x="40" y="92" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="middle" font-size="11" fill="#333">① 统计</text>
  <rect x="120" y="92" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="110" font-size="11" fill="#333">t:1, r:1, </text>
  <text x="216" y="110" font-size="11" fill="#d6a040" font-weight="bold">e:2</text>
  <rect x="300" y="92" width="120" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="110" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="420" y="92" width="100" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="470" y="110" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 2: sort -->
  <rect x="40" y="120" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="138" text-anchor="middle" font-size="11" fill="#333">② 排序</text>
  <rect x="120" y="120" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="138" text-anchor="middle" font-size="11" fill="#888">(同上)</text>
  <rect x="300" y="120" width="120" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="138" font-size="11" fill="#d6a040" font-weight="bold">e:2</text>
  <text x="346" y="138" font-size="11" fill="#333">, t:1, r:1</text>
  <rect x="420" y="120" width="100" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="470" y="138" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 3: build -->
  <rect x="40" y="148" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="166" text-anchor="middle" font-size="11" fill="#333">③ 展开</text>
  <rect x="120" y="148" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="166" text-anchor="middle" font-size="11" fill="#888">ee + t + r</text>
  <rect x="300" y="148" width="120" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="166" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="420" y="148" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"eert"</text>

  <!-- ===== Example 2: Aabb ===== -->
  <text x="40" y="208" font-size="13" fill="#446688" font-weight="bold">示例 2：s = "Aabb"</text>

  <!-- Table header -->
  <rect x="40" y="218" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="120" y="218" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">频率统计</text>
  <rect x="300" y="218" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">排序后</text>
  <rect x="420" y="218" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结果</text>

  <!-- Row 1: count -->
  <rect x="40" y="242" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="260" text-anchor="middle" font-size="11" fill="#333">① 统计</text>
  <rect x="120" y="242" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="260" font-size="11" fill="#333">A:1, a:1, </text>
  <text x="226" y="260" font-size="11" fill="#d6a040" font-weight="bold">b:2</text>
  <rect x="300" y="242" width="120" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="260" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="420" y="242" width="100" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="470" y="260" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 2: sort -->
  <rect x="40" y="270" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="288" text-anchor="middle" font-size="11" fill="#333">② 排序</text>
  <rect x="120" y="270" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="288" text-anchor="middle" font-size="11" fill="#888">(同上)</text>
  <rect x="300" y="270" width="120" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="288" font-size="11" fill="#d6a040" font-weight="bold">b:2</text>
  <text x="346" y="288" font-size="11" fill="#333">, A:1, a:1</text>
  <rect x="420" y="270" width="100" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="470" y="288" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 3: build -->
  <rect x="40" y="298" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="316" text-anchor="middle" font-size="11" fill="#333">③ 展开</text>
  <rect x="120" y="298" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="316" text-anchor="middle" font-size="11" fill="#888">bb + A + a</text>
  <rect x="300" y="298" width="120" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="316" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="420" y="298" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"bbAa"</text>

  <!-- Note box -->
  <rect x="40" y="340" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">注意：'A' 与 'a' 是不同字符；同频字符（如 A:1, a:1）顺序任意</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#666">"bbAa" 与 "bbaA" 均合法，但 "Aabb" 不合法（未按频率降序）</text>
</svg>
