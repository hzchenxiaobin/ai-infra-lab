<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">单趟扫描：k 每右移一格，恰有一个值 u 的左右计数各变化 1</text>

  <!-- array strip: pre | k | suf -->
  <g filter="url(#rough2)">
    <rect x="80" y="44" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="124" y="44" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="44" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="212" y="44" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="260" y="44" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="304" y="44" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="348" y="44" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="100" y="66" text-anchor="middle" font-size="13" fill="#333">…</text>
    <text x="144" y="66" text-anchor="middle" font-size="13" fill="#333">…</text>
    <text x="188" y="66" text-anchor="middle" font-size="13" fill="#333">…</text>
    <text x="234" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">v</text>
    <text x="280" y="66" text-anchor="middle" font-size="13" fill="#333">…</text>
    <text x="324" y="66" text-anchor="middle" font-size="13" fill="#333">…</text>
    <text x="368" y="66" text-anchor="middle" font-size="13" fill="#333">…</text>
    <text x="152" y="94" text-anchor="middle" font-size="12" fill="#446688">pre 区（下标 &lt; k）</text>
    <text x="234" y="94" text-anchor="middle" font-size="12" fill="#8a6d1a">中间 k</text>
    <text x="324" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a">suf 区（下标 &gt; k）</text>
  </g>

  <!-- transition note -->
  <g filter="url(#rough2)">
    <text x="280" y="122" text-anchor="middle" font-size="12.5" fill="#555">k → k+1 时：u = nums[k] 离开 suf、进入 pre（suf[u] −1，pre[u] +1）</text>
    <path d="M 234 104 L 234 130" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- panel 1: remove from suffix -->
  <g filter="url(#rough2)">
    <rect x="28" y="138" width="248" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="152" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d4d22">移出后缀（记 p = pre[u]，s = suf[u] 新值）</text>
    <text x="44" y="182" font-size="12" fill="#333">sumSuf2 −= s             （C(s+1,2) − C(s,2) = s）</text>
    <text x="44" y="202" font-size="12" fill="#333">S₁ −= p                 （p·s 只降 1 个 s）</text>
    <text x="44" y="222" font-size="12" fill="#333">S₂ −= p·p               （p²·s 变 p²·(s−1)）</text>
    <text x="44" y="238" font-size="12" fill="#333">S₃ −= p·(2s + 1)        （p·((s+1)²−s²) = p(2s+1)）</text>
  </g>

  <!-- panel 2: add to prefix -->
  <g filter="url(#rough2)">
    <rect x="284" y="138" width="248" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="408" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d4d22">移入前缀（记 p = pre[u] 新值，s = suf[u]）</text>
    <text x="300" y="182" font-size="12" fill="#333">sumPre2 += p − 1        （C(p,2) − C(p−1,2)）</text>
    <text x="300" y="202" font-size="12" fill="#333">S₁ += s                 （s·p 只涨 1 个 p）</text>
    <text x="300" y="222" font-size="12" fill="#333">S₂ += s·(2p − 1)        （s·(p²−(p−1)²)）</text>
    <text x="300" y="238" font-size="12" fill="#333">S₃ += s·s               （s² 不动，只换 p）</text>
  </g>

  <!-- aggregate definitions -->
  <g filter="url(#rough2)">
    <rect x="42" y="256" width="476" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c1e">五个全局标量（对所有值 x 求和，右式用于 O(1) 导出 E_L、E_R、cross 项）</text>
    <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333">S₁ = Σ pre·suf　　S₂ = Σ pre²·suf　　S₃ = Σ pre·suf²</text>
    <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333">sumPre2 = Σ C(pre,2)　　sumSuf2 = Σ C(suf,2)</text>
  </g>

  <!-- why O(1) works -->
  <g filter="url(#rough2)">
    <rect x="42" y="346" width="476" height="58" rx="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="280" y="368" text-anchor="middle" font-size="12" fill="#444">聚合量都是计数的二次型；计数 ±1 时，二次型变化量有闭式</text>
    <text x="280" y="388" text-anchor="middle" font-size="12" fill="#444">（如 p·s² 在 s→s−1 时恰减 p·(2s+1)），无需重新求和</text>
  </g>

  <!-- conclusion -->
  <g filter="url(#rough2)">
    <rect x="42" y="418" width="476" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2e2a">n = 10⁵ 时按值遍历求和是 O(n·m) ≈ 10¹⁰，必超时</text>
    <text x="280" y="462" text-anchor="middle" font-size="12.5" fill="#7a2e2a">把「按值求和」改写成全局标量的线性组合 + O(1) 增量 → 单趟 O(n)</text>
  </g>
</svg>
