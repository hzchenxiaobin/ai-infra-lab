<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="580" fill="#fafafa"/>

  <text x="20" y="30" font-size="13" fill="#333" filter="url(#rough2)">算法流程：特判 + 枚举起点打擂台</text>
  <text x="500" y="30" font-size="11" fill="#666" text-anchor="end" filter="url(#rough2)">O(n·maxLen) ≤ O(n²)</text>

  <ellipse cx="110" cy="66" rx="40" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M110,86 L110,102" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="110,106 195,138 110,170 25,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">numFriends = 1 ?</text>

  <text x="207" y="130" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M195,138 L233,138" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="237" y="116" width="258" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="366" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 word（唯一分法：整串）</text>

  <text x="118" y="190" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M110,170 L110,204" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="208" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">maxLen = n − numFriends + 1</text>

  <path d="M110,248 L110,264" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="35" y="268" width="150" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="289" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">best = ""，i = 0</text>

  <path d="M110,302 L110,318" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="110,324 170,356 110,388 50,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="360" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <text x="184" y="348" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M170,356 L208,356" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="212" y="334" width="253" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="338" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 best（字典序最大候选）</text>

  <text x="118" y="404" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M110,388 L110,408" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="10" y="412" width="200" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="432" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cand = word[i : i+maxLen]</text>
  <text x="110" y="448" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（超出末尾自动截断）</text>

  <path d="M110,458 L110,474" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="110,480 180,512 110,544 40,512" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="516" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cand &gt; best ?</text>

  <text x="196" y="504" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M180,512 L218,512" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="222" y="492" width="118" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="516" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">best = cand</text>

  <text x="118" y="560" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M110,544 L110,566" fill="none" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M281,532 L281,566" fill="none" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M281,566 L28,566 L28,356 L44,356" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="560" font-size="10.5" fill="#666" filter="url(#rough2)">i++，继续下一个起点</text>
</svg>
