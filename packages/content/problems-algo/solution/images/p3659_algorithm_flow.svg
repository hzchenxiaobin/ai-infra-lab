<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 446"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="446" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：两道闸门，一趟线性扫描</text>
  <text x="498" y="60" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">时间 O(n)；空间 O(U)</text>
  <text x="498" y="76" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">值域 1..10⁵ 可开桶计数</text>

  <!-- 开始 -->
  <rect x="70" y="46" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="67" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">输入 nums, k（n 个元素）</text>

  <path d="M 145 80 L 145 96" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1：整除 -->
  <polygon points="145,98 225,146 145,194 65,146" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="143" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">n % k == 0 ?</text>
  <text x="145" y="160" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">组数须为整数</text>

  <path d="M 225 146 L 340 146" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="138" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="345" y="128" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="150" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">return false</text>

  <path d="M 145 194 L 145 212" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 统计 -->
  <rect x="70" y="216" width="150" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">g = n / k（份数上限）</text>
  <text x="145" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">统计每个值出现次数</text>

  <path d="M 145 268 L 145 284" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定2：频次 -->
  <polygon points="145,286 225,334 145,382 65,334" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="331" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">max freq ≤ g ?</text>
  <text x="145" y="348" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">桶或哈希表一趟取 max</text>

  <path d="M 225 334 L 340 334" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="326" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="345" y="316" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="338" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">return false</text>

  <path d="M 145 382 L 145 398" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="394" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 结束 -->
  <rect x="70" y="402" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="423" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">return true</text>
</svg>
