<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：编号 pos = i×n + j —— 四类指令就是 ±1 / ±n 四个增量</text>

  <!-- 列标签 -->
  <text x="87" y="54" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="133" y="54" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="179" y="54" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=2</text>
  <!-- 行标签 -->
  <text x="52" y="93" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="52" y="139" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="52" y="185" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>

  <!-- 3x3 网格 -->
  <rect x="64" y="60" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="60" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="60" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="64" y="106" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="106" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="106" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="64" y="152" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="152" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="152" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <text x="87" y="84" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="87" y="98" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">蛇起点</text>
  <text x="133" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="179" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="87" y="130" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="133" y="130" text-anchor="middle" font-size="12.5" fill="#b07818" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="179" y="130" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="87" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="133" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="179" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>

  <!-- 从中心格 4 出发的四个增量箭头 -->
  <path d="M 158 129 L 173 129" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="166" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <path d="M 108 129 L 93 129" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="100" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <path d="M 133 155 L 133 170" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="148" y="167" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">+n</text>
  <path d="M 133 103 L 133 88" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="148" y="98" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">−n</text>

  <text x="133" y="220" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n = 3：grid[i][j] = i×3 + j，高亮格 = 1×3+1 = 4</text>

  <!-- 右侧指令增量表 -->
  <text x="370" y="54" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">指令 → 坐标变化 → 编号增量</text>
  <rect x="248" y="62" width="244" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">指令</text>
  <text x="372" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">坐标</text>
  <text x="452" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Δpos</text>

  <rect x="248" y="88" width="244" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="288" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">RIGHT</text>
  <text x="372" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j + 1</text>
  <text x="452" y="104" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>

  <rect x="248" y="114" width="244" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="288" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">LEFT</text>
  <text x="372" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j − 1</text>
  <text x="452" y="130" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <rect x="248" y="140" width="244" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="288" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">DOWN</text>
  <text x="372" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i + 1</text>
  <text x="452" y="156" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">+n</text>

  <rect x="248" y="166" width="244" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="288" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">UP</text>
  <text x="372" y="182" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">i − 1</text>
  <text x="452" y="182" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">−n</text>

  <!-- 底部要点框 -->
  <rect x="36" y="238" width="448" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">把 pos 看成「两位 n 进制数」：行 i 是高位、列 j 是低位</text>
  <text x="260" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">水平走一格 → 低位 ±1；竖直走一格 → 跨一整行 → ±n</text>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">蛇从 0 出发且全程不出界 ⇒ 终局编号 = Σ(指令增量)</text>
</svg>
