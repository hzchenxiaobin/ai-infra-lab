<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：逐层收集 → 每层独立求最少交换排序 → 求和</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">值互不相同 → 每层排序是确定的置换 → 环分解计数</text>

  <!-- ===== Tree (left) ===== -->
  <text x="110" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">二叉树（按层）</text>
  <g font-size="10">
    <!-- edges -->
    <line x1="110" y1="86" x2="68" y2="124" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="110" y1="86" x2="152" y2="124" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="68" y1="134" x2="46" y2="172" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="68" y1="134" x2="90" y2="172" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="152" y1="134" x2="130" y2="172" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="152" y1="134" x2="174" y2="172" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <!-- L0 -->
    <circle cx="110" cy="80" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="110" y="84" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <!-- L1 -->
    <circle cx="68" cy="130" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="68" y="134" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <circle cx="152" cy="130" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="152" y="134" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <!-- L2 -->
    <circle cx="46" cy="180" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="46" y="184" text-anchor="middle" fill="#b85450" font-size="9">7</text>
    <circle cx="90" cy="180" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="90" y="184" text-anchor="middle" fill="#b85450" font-size="9">6</text>
    <circle cx="130" cy="180" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="130" y="184" text-anchor="middle" fill="#b85450" font-size="9">5</text>
    <circle cx="174" cy="180" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="174" y="184" text-anchor="middle" fill="#b85450" font-size="9">4</text>
    <!-- layer labels -->
    <text x="14" y="84" font-size="9" fill="#446688" font-weight="bold">L0</text>
    <text x="14" y="134" font-size="9" fill="#d6a040" font-weight="bold">L1</text>
    <text x="14" y="184" font-size="9" fill="#b85450" font-weight="bold">L2</text>
  </g>

  <!-- arrow tree -> arrays -->
  <path d="M 200 132 L 246 132" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="223" y="124" text-anchor="middle" font-size="9" fill="#888">BFS</text>
  <text x="223" y="148" text-anchor="middle" font-size="9" fill="#888">逐层</text>

  <!-- ===== Level arrays (middle) ===== -->
  <text x="320" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">每层值数组</text>
  <g font-size="10">
    <!-- L0 -->
    <rect x="262" y="78" width="116" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="320" y="95" text-anchor="middle" fill="#446688">L0: [1] → 已有序</text>
    <!-- L1 -->
    <rect x="252" y="112" width="136" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="320" y="129" text-anchor="middle" fill="#d6a040">L1: [3,2] → 排序</text>
    <!-- L2 -->
    <rect x="242" y="146" width="156" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="320" y="163" text-anchor="middle" fill="#b85450" font-size="9">L2: [7,6,5,4] → 排序</text>
  </g>

  <!-- arrow arrays -> swaps -->
  <path d="M 404 132 L 448 132" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="124" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">环分解</text>
  <text x="426" y="148" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">计数</text>

  <!-- ===== Swap counts (right) ===== -->
  <text x="486" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">交换数</text>
  <g font-size="10">
    <rect x="452" y="78" width="68" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="486" y="95" text-anchor="middle" fill="#446688">0</text>
    <rect x="452" y="112" width="68" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="486" y="129" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="452" y="146" width="68" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="486" y="163" text-anchor="middle" fill="#b85450">2</text>
  </g>

  <!-- ===== bottom summary box ===== -->
  <rect x="30" y="200" width="490" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="220" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">逐层独立处理：L0 贡献 0 + L1 贡献 1 + L2 贡献 2</text>
  <text x="270" y="236" text-anchor="middle" font-size="10" fill="#555">每层排序互不影响（交换只在同层内） → 直接求和 = 总最少操作数</text>

  <!-- ===== cycle formula box ===== -->
  <rect x="30" y="258" width="490" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">环分解公式（值互不相同）</text>
  <text x="50" y="302" font-size="10" fill="#555">1. 排序得到目标位置：sorted = 排序后数组</text>
  <text x="50" y="318" font-size="10" fill="#555">2. 元素 i 的目标位置 j = 它在 sorted 中的下标 → 形成置换</text>
  <text x="50" y="334" font-size="10" fill="#555">3. 把置换拆成若干不相交的环（cycle）</text>
  <text x="50" y="350" font-size="10" fill="#b85450" font-weight="bold">4. 最少交换 = Σ(环长 − 1) = n − 环的个数</text>
  <text x="50" y="368" font-size="9" fill="#888">长 k 的环只需 k−1 次交换：沿环逐一放对，最后一次自动归位</text>
</svg>
