<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：customers=[1,0,1,2,1,1,7,5]，grumpy=[0,1,0,1,0,1,0,1]，X=3</text>

  <!-- table outline -->
  <rect x="30" y="44" width="460" height="246" rx="6" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- column dividers -->
  <line x1="130" y1="44" x2="130" y2="290" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="44" x2="360" y2="290" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="44" x2="430" y2="290" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="30" y="44" width="460" height="30" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="80"  y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">窗口</text>
  <text x="245" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">窗口内「气」处顾客</text>
  <text x="395" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">gain</text>
  <text x="460" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">maxGain</text>

  <!-- row separator lines -->
  <line x1="30" y1="74"  x2="490" y2="74"  stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="104" x2="490" y2="104" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="134" x2="490" y2="134" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="164" x2="490" y2="164" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="194" x2="490" y2="194" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="224" x2="490" y2="224" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: [0,2] -->
  <text x="80"  y="94"  text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[0,2]</text>
  <text x="245" y="94"  text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1→0</text>
  <text x="395" y="94"  text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="460" y="94"  text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 2: [1,3] -->
  <text x="80"  y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[1,3]</text>
  <text x="245" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1→0, 3→2</text>
  <text x="395" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="460" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 3: [2,4] -->
  <text x="80"  y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[2,4]</text>
  <text x="245" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3→2</text>
  <text x="395" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="460" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 4: [3,5] -->
  <text x="80"  y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[3,5]</text>
  <text x="245" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3→2, 5→1</text>
  <text x="395" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="460" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 5: [4,6] -->
  <text x="80"  y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[4,6]</text>
  <text x="245" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5→1</text>
  <text x="395" y="214" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <text x="460" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 6: [5,7] highlighted -->
  <rect x="30" y="224" width="460" height="30" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="80"  y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">[5,7]</text>
  <text x="245" y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">5→1, 7→5</text>
  <text x="395" y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="460" y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- footer note -->
  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">↑ 窗口 [5,7] 增益最大 = 6 → 答案 = base 10 + 6 = 16</text>
</svg>
