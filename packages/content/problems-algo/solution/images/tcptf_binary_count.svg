<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心：bisect_right(hi) − bisect_left(lo) = 区间计数</text>

  <!-- 有序数组：tweet3 = [0, 10, 60, 120] -->
  <text x="60" y="78" font-size="13" fill="#555" filter="url(#rough2)">有序数组（tweet3 的时间）：</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="92" width="70" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="130" y="92" width="70" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="200" y="92" width="70" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="270" y="92" width="70" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="95"  y="118" text-anchor="middle" font-size="14" fill="#333">0</text>
    <text x="165" y="118" text-anchor="middle" font-size="14" fill="#333">10</text>
    <text x="235" y="118" text-anchor="middle" font-size="14" fill="#333">60</text>
    <text x="305" y="118" text-anchor="middle" font-size="14" fill="#333">120</text>
    <text x="95"  y="148" text-anchor="middle" font-size="11" fill="#888">idx 0</text>
    <text x="165" y="148" text-anchor="middle" font-size="11" fill="#888">idx 1</text>
    <text x="235" y="148" text-anchor="middle" font-size="11" fill="#888">idx 2</text>
    <text x="305" y="148" text-anchor="middle" font-size="11" fill="#888">idx 3</text>
  </g>

  <!-- 区间 [0,59] -->
  <text x="60" y="178" font-size="13" fill="#b85450" filter="url(#rough2)">区间 [0, 59]：</text>
  <g filter="url(#rough2)">
    <!-- bisect_left(0) 指向 idx0 -->
    <path d="M95,158 L95,172" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <text x="95" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a">bisect_left(0)=0</text>
    <!-- bisect_right(59) 指向 idx2 -->
    <path d="M235,158 L235,172" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="248" y="190" font-size="11" fill="#b85450">bisect_right(59)=2</text>
    <!-- 高亮命中段 -->
    <rect x="58" y="88" width="142" height="48" rx="6" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="5,3"/>
  </g>
  <text x="430" y="186" font-size="13" fill="#333" filter="url(#rough2)">计数 = 2 − 0 = 2</text>

  <!-- 区间 [60,119] -->
  <text x="60" y="232" font-size="13" fill="#b85450" filter="url(#rough2)">区间 [60, 119]：</text>
  <g filter="url(#rough2)">
    <path d="M235,210 L235,224" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <text x="235" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a">bisect_left(60)=2</text>
    <path d="M305,210 L305,224" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="318" y="244" font-size="11" fill="#b85450">bisect_right(120)=4</text>
    <rect x="198" y="88" width="144" height="48" rx="6" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="5,3"/>
  </g>
  <text x="430" y="240" font-size="13" fill="#333" filter="url(#rough2)">计数 = 4 − 2 = 2</text>

  <!-- 要点框 -->
  <rect x="40" y="288" width="480" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">bisect_left(lo)：首个 ≥ lo 的下标</text>
  <text x="280" y="334" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">bisect_right(hi)：首个 &gt; hi 的下标；二者之差即 [lo,hi] 内元素数</text>
</svg>
