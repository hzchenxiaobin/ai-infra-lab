<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：删除 = 保留子序列重新编号，固定点由 (v, d) 链决定</text>
  <text x="280" y="44" text-anchor="middle" font-size="11.5" fill="#888">示例 nums = [1, 0, 1, 2]：删掉下标 0 的元素，剩余 [0, 1, 2] 全是固定点</text>

  <!-- original array -->
  <rect x="62" y="58" width="76" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="182" y="58" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="302" y="58" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="422" y="58" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="85" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="220" y="85" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="340" y="85" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="460" y="85" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="100" y="122" text-anchor="middle" font-size="10.5" fill="#b85450">下标 0 ✗</text>
  <text x="220" y="122" text-anchor="middle" font-size="10.5" fill="#8899aa">下标 1</text>
  <text x="340" y="122" text-anchor="middle" font-size="10.5" fill="#8899aa">下标 2</text>
  <text x="460" y="122" text-anchor="middle" font-size="10.5" fill="#8899aa">下标 3</text>
  <text x="100" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">删除</text>

  <!-- shift arrows -->
  <path d="M 220 132 L 112 160" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 340 132 L 232 160" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 460 132 L 352 160" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- new array -->
  <rect x="62" y="164" width="76" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="182" y="164" width="76" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="302" y="164" width="76" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="190" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="220" y="190" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="340" y="190" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="100" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a">新下标 0 ✓</text>
  <text x="220" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a">新下标 1 ✓</text>
  <text x="340" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a">新下标 2 ✓</text>
  <text x="470" y="180" text-anchor="middle" font-size="10.5" fill="#8899aa">剩余元素左移</text>
  <text x="470" y="197" text-anchor="middle" font-size="10.5" fill="#8899aa">下标从 0 重排</text>

  <text x="280" y="241" text-anchor="middle" font-size="10.5" fill="#8899aa">关键：元素的新下标 = 它前面保留下来的元素个数</text>

  <!-- pair table -->
  <text x="280" y="268" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">候选下标写成 (v, d) 二元组：v = nums[i]，d = i − v</text>

  <rect x="90" y="278" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="278" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="278" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="278" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="295" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">下标 i</text>
  <text x="220" y="295" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">值 v</text>
  <text x="310" y="295" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">差 d = i−v</text>
  <text x="425" y="295" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">入围？</text>

  <rect x="90" y="308" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="308" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="308" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="308" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="325" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="220" y="325" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="310" y="325" text-anchor="middle" font-size="11.5" fill="#333">−1</text>
  <text x="425" y="325" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 永无缘（v &gt; i）</text>

  <rect x="90" y="336" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="336" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="336" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="336" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="353" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="220" y="353" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="310" y="353" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="425" y="353" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓ 可入链</text>

  <rect x="90" y="364" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="364" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="364" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="364" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="381" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="220" y="381" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="310" y="381" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="425" y="381" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓ 可入链</text>

  <rect x="90" y="392" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="392" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="392" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="392" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="409" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="220" y="409" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="310" y="409" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="425" y="409" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓ 可入链</text>

  <text x="280" y="440" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">选中链 (v,d)：(0,1) → (1,1) → (2,1)：v 严格递增 ✓，d 非递减 ✓ ⇒ 答案 3</text>
  <text x="280" y="462" text-anchor="middle" font-size="10.5" fill="#b85450">⚠️ v 必须严格递增（新下标互不相同）；d 只需非递减——[3,1,2] 的 d = 0,0 也能同链</text>
</svg>
