<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：三组输入的频率统计与瓶颈分析</text>

  <!-- ============ Example 1 ============ -->
  <text x="40" y="46" font-size="11.5" fill="#446688" font-weight="bold">示例 1：s = "ilovecodingonleetcode"，target = "code"</text>

  <g filter="url(#rough2)">
    <!-- header -->
    <rect x="40" y="54" width="120" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="100" y="69" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">字母</text>
    <rect x="160" y="54" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="200" y="69" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">c</text>
    <rect x="240" y="54" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="280" y="69" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">o</text>
    <rect x="320" y="54" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="360" y="69" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">d</text>
    <rect x="400" y="54" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="440" y="69" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">e</text>
    <rect x="480" y="54" width="60" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="510" y="69" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">min</text>

    <!-- req row -->
    <rect x="40" y="76" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="100" y="91" text-anchor="middle" font-size="10.5" fill="#333">req（单个需求）</text>
    <rect x="160" y="76" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="200" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="240" y="76" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="280" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="320" y="76" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="360" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="400" y="76" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="440" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="480" y="76" width="60" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="510" y="91" text-anchor="middle" font-size="10.5" fill="#888"></text>

    <!-- cnt row -->
    <rect x="40" y="98" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="100" y="113" text-anchor="middle" font-size="10.5" fill="#333">cnt（s 中供应）</text>
    <rect x="160" y="98" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="200" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="240" y="98" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="280" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="320" y="98" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="360" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="400" y="98" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="440" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="480" y="98" width="60" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="510" y="113" text-anchor="middle" font-size="10.5" fill="#888"></text>

    <!-- divide row -->
    <rect x="40" y="120" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="100" y="135" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">⌊cnt ÷ req⌋</text>
    <rect x="160" y="120" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="200" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="240" y="120" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="280" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="320" y="120" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="360" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="400" y="120" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="440" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="480" y="120" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2"/>
    <text x="510" y="135" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  </g>
  <text x="280" y="158" text-anchor="middle" font-size="10.5" fill="#4a7a3a">min(2,4,2,4)=2 ✓ 最多 2 个 "code"</text>

  <!-- ============ Example 2 ============ -->
  <text x="40" y="184" font-size="11.5" fill="#446688" font-weight="bold">示例 2：s = "abcba"，target = "abc"</text>

  <g filter="url(#rough2)">
    <rect x="40" y="192" width="120" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="100" y="207" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">字母</text>
    <rect x="160" y="192" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="200" y="207" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">a</text>
    <rect x="240" y="192" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="280" y="207" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">b</text>
    <rect x="320" y="192" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="360" y="207" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">c</text>

    <rect x="40" y="214" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="100" y="229" text-anchor="middle" font-size="10.5" fill="#333">req</text>
    <rect x="160" y="214" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="200" y="229" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="240" y="214" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="280" y="229" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="320" y="214" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="360" y="229" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

    <rect x="40" y="236" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="100" y="251" text-anchor="middle" font-size="10.5" fill="#333">cnt</text>
    <rect x="160" y="236" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="200" y="251" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="240" y="236" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="280" y="251" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="320" y="236" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="360" y="251" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

    <rect x="40" y="258" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="100" y="273" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">⌊cnt ÷ req⌋</text>
    <rect x="160" y="258" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="200" y="273" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="240" y="258" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="280" y="273" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="320" y="258" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2"/>
    <text x="360" y="273" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  </g>
  <text x="280" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a">min(2,2,1)=1 ✓ c 只剩 1 个，卡住第 2 份</text>

  <!-- ============ Example 3 ============ -->
  <text x="40" y="322" font-size="11.5" fill="#446688" font-weight="bold">示例 3：s = "abbaccaddaeea"，target = "aaaaa"</text>

  <g filter="url(#rough2)">
    <rect x="40" y="330" width="120" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="100" y="345" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">字母</text>
    <rect x="160" y="330" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="200" y="345" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">a</text>

    <rect x="40" y="352" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="100" y="367" text-anchor="middle" font-size="10.5" fill="#333">req（target 5 个 a）</text>
    <rect x="160" y="352" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2"/>
    <text x="200" y="367" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

    <rect x="40" y="374" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="100" y="389" text-anchor="middle" font-size="10.5" fill="#333">cnt（s 中 5 个 a）</text>
    <rect x="160" y="374" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="200" y="389" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

    <rect x="40" y="396" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="100" y="411" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">⌊cnt ÷ req⌋</text>
    <rect x="160" y="396" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2"/>
    <text x="200" y="411" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  </g>
  <text x="280" y="434" text-anchor="middle" font-size="10.5" fill="#4a7a3a">min(1)=1 ✓ s 中恰好 5 个 a，只够 1 份 "aaaaa"</text>

  <!-- footer note -->
  <rect x="40" y="444" width="480" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="457" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">规律：瓶颈永远是最短缺字母；某字母缺键为 0 时答案即 0</text>
</svg>
