<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：自底向上合并 size / flag</text>
  <text x="280" y="43" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例 3：edges = [[0,1],[0,2],[2,3],[2,4]]，colors = [1,2,3,3,3]</text>

  <!-- subtree highlight ellipse: {2,3,4} -->
  <ellipse cx="173" cy="200" rx="88" ry="85" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- tree edges -->
  <g filter="url(#rough2)" stroke="#999" stroke-width="1.5">
    <line x1="140" y1="85" x2="65" y2="160"/>
    <line x1="140" y1="85" x2="170" y2="160"/>
    <line x1="170" y1="160" x2="125" y2="240"/>
    <line x1="170" y1="160" x2="220" y2="240"/>
  </g>

  <!-- nodes: fill = color value (1=blue, 2=orange, 3=green) -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <circle cx="140" cy="85" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="140" y="90" text-anchor="middle">0</text>
    <text x="140" y="117" text-anchor="middle" font-size="11" fill="#555">c=1</text>

    <circle cx="65" cy="160" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="65" y="165" text-anchor="middle">1</text>
    <text x="65" y="192" text-anchor="middle" font-size="11" fill="#8a6414">c=2</text>

    <circle cx="170" cy="160" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="170" y="165" text-anchor="middle">2</text>
    <text x="170" y="192" text-anchor="middle" font-size="11" fill="#2e5c22">c=3</text>

    <circle cx="125" cy="240" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="125" y="245" text-anchor="middle">3</text>
    <text x="125" y="272" text-anchor="middle" font-size="11" fill="#2e5c22">c=3</text>

    <circle cx="220" cy="240" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="220" y="245" text-anchor="middle">4</text>
    <text x="220" y="272" text-anchor="middle" font-size="11" fill="#2e5c22">c=3</text>
  </g>

  <!-- size / flag badges -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="153" y="58" width="58" height="15" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="182" y="69.5" text-anchor="middle" fill="#b85450">s=5 f=0 ✗</text>

    <rect x="78" y="133" width="52" height="15" fill="#fff" stroke="#999" stroke-width="1.2" rx="3"/>
    <text x="104" y="144.5" text-anchor="middle" fill="#555">s=1 f=1</text>

    <rect x="188" y="133" width="60" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="218" y="144.5" text-anchor="middle" fill="#2e5c22" font-weight="bold">s=3 f=1 ✓</text>

    <rect x="140" y="213" width="52" height="15" fill="#fff" stroke="#999" stroke-width="1.2" rx="3"/>
    <text x="166" y="224.5" text-anchor="middle" fill="#555">s=1 f=1</text>

    <rect x="236" y="213" width="52" height="15" fill="#fff" stroke="#999" stroke-width="1.2" rx="3"/>
    <text x="262" y="224.5" text-anchor="middle" fill="#555">s=1 f=1</text>
  </g>

  <!-- subtree annotation -->
  <text x="173" y="300" text-anchor="middle" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">子树(2) = {2,3,4} 全为色 3 → flag=1, size=3</text>

  <!-- legend + note -->
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <rect x="56" y="322" width="13" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="2"/>
    <text x="74" y="332">色 1</text>
    <rect x="108" y="322" width="13" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="126" y="332">色 2</text>
    <rect x="160" y="322" width="13" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2"/>
    <text x="178" y="332">色 3</text>
  </g>
  <text x="170" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">flag[0]=0：colors[1]=2 ≠ 1 → 根的整树候选被封死</text>
  <text x="170" y="376" text-anchor="middle" font-size="10.5" fill="#8a6414" filter="url(#rough2)">后序处理：1, 3, 4（叶子）→ 2 → 0，孩子必先于父</text>

  <!-- table -->
  <rect x="315" y="58" width="233" height="156" fill="#fff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="315" y="58" width="233" height="26" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="315" y="162" width="233" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="315" y="188" width="233" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#c5d0dd" stroke-width="1">
    <line x1="315" y1="84" x2="548" y2="84"/>
    <line x1="315" y1="110" x2="548" y2="110"/>
    <line x1="315" y1="136" x2="548" y2="136"/>
    <line x1="315" y1="162" x2="548" y2="162"/>
    <line x1="315" y1="188" x2="548" y2="188"/>
    <line x1="362" y1="58" x2="362" y2="214"/>
    <line x1="478" y1="58" x2="478" y2="214"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#2c4a6e">
    <text x="338" y="75" text-anchor="middle" font-weight="bold">节点(色)</text>
    <text x="420" y="75" text-anchor="middle" font-weight="bold">合并过程</text>
    <text x="513" y="75" text-anchor="middle" font-weight="bold">size·ans</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#444">
    <text x="338" y="101" text-anchor="middle">1 (2)</text>
    <text x="420" y="101" text-anchor="middle">叶子 → 天然同色</text>
    <text x="513" y="101" text-anchor="middle">s=1, ans=1</text>

    <text x="338" y="127" text-anchor="middle">3 (3)</text>
    <text x="420" y="127" text-anchor="middle">叶子 → 天然同色</text>
    <text x="513" y="127" text-anchor="middle">s=1, ans=1</text>

    <text x="338" y="153" text-anchor="middle">4 (3)</text>
    <text x="420" y="153" text-anchor="middle">叶子 → 天然同色</text>
    <text x="513" y="153" text-anchor="middle">s=1, ans=1</text>

    <text x="338" y="179" text-anchor="middle">2 (3)</text>
    <text x="420" y="179" text-anchor="middle">孩子全 f=1 且色 3=3</text>
    <text x="513" y="179" text-anchor="middle" fill="#2e5c22" font-weight="bold">s=3, ans=3 ★</text>

    <text x="338" y="205" text-anchor="middle">0 (1)</text>
    <text x="420" y="205" text-anchor="middle">色[1]=2 ≠ 1 → 拦下</text>
    <text x="513" y="205" text-anchor="middle" fill="#b85450">s=5, f=0</text>
  </g>

  <!-- answer box -->
  <rect x="315" y="228" width="233" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#2e5c22">
    <text x="431" y="250" text-anchor="middle" font-size="12" font-weight="bold">答案 = 3：子树(2) = {2,3,4}</text>
    <text x="431" y="270" text-anchor="middle" font-size="12">三个节点全部为颜色 3 ✓</text>
    <text x="431" y="286" text-anchor="middle" font-size="10.5">（根 0 因孩子异色被拦下）</text>
  </g>

  <!-- order note -->
  <rect x="315" y="306" width="233" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#8a6414">
    <text x="431" y="324" text-anchor="middle">flag 为真才拿 size 更新答案</text>
    <text x="431" y="342" text-anchor="middle">size 无论真假都要继续向上累加</text>
  </g>
</svg>
