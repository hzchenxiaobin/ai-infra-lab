<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：encrypt(x) = 最大数位 m × 循环整数 R_d</text>

  <!-- left: example 523 -->
  <text x="128" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">x = 523</text>

  <rect x="60" y="74" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="101" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="106" y="74" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="127" y="101" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="152" y="74" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="173" y="101" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="81" y="134" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">最大数位 m = 5</text>

  <path d="M 128 142 L 128 166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="142" y="160" font-size="10" fill="#888" filter="url(#rough2)">每一位都换成 m</text>

  <rect x="60" y="176" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="203" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="106" y="176" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="203" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="152" y="176" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="203" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="128" y="244" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">encrypt(523) = 555</text>
  <text x="128" y="262" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三个数位全部由 m 摆满</text>

  <!-- right: formula boxes -->
  <rect x="292" y="54" width="198" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="391" y="78" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">555 = 5 × 111</text>
  <text x="391" y="100" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">位权展开：5·100 + 5·10 + 5·1</text>

  <rect x="292" y="126" width="198" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="391" y="150" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">一般地：encrypt(x) = m × R_d</text>
  <text x="391" y="172" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">R_d = 11…1（d 个 1，repunit）</text>

  <rect x="292" y="202" width="198" height="58" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="391" y="226" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">R_d = (10^d − 1) / 9</text>
  <text x="391" y="248" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">R_1=1，R_2=11，R_3=111，R_4=1111</text>

  <!-- bottom strip -->
  <rect x="48" y="278" width="424" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一趟数位扫描同时攒出两个量：</text>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">m = max(m, 当前位)，rep = rep × 10 + 1（每吃一位长出一个 1）</text>

  <!-- dashed note -->
  <rect x="48" y="344" width="424" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">encrypt(x) 只由「最大数位 m」和「位数 d」决定，其余数位怎么排都不影响结果</text>
</svg>
