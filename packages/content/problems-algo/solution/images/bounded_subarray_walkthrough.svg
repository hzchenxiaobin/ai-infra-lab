<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums=[1,3,5,2,7,5], minK=1, maxK=5</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">逐 i 维护三指针，累加 max(0, min(lastMin,lastMax) − lastInvalid)</text>

  <!-- Column header labels : x positions -->
  <!-- cols: i=40, nums=78, lastInv=128, lastMin=192, lastMax=256, min=306, -lastInv=360, 贡献=420, ans=478 -->
  <text x="40"  y="64" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">i</text>
  <text x="84"  y="64" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">nums[i]</text>
  <text x="140" y="64" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">lastInvalid</text>
  <text x="200" y="64" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">lastMin</text>
  <text x="256" y="64" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">lastMax</text>
  <text x="312" y="64" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">min</text>
  <text x="372" y="64" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">−lastInv</text>
  <text x="432" y="64" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">贡献</text>
  <text x="498" y="64" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans</text>

  <!-- separator line -->
  <path d="M 16 72 L 544 72" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- row y positions : start 90, step 34 -->
  <!-- Row 0 : i=0, nums=1, lastInv=-1, lastMin=0, lastMax=-1, min=-1, -li=0, 贡献0, ans0 -->
  <text x="40"  y="96" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="84"  y="96" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="140" y="96" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="200" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="256" y="96" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="312" y="96" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="372" y="96" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="432" y="96" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="498" y="96" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- Row 1 : i=1, nums=3, lastInv=-1, lastMin=0, lastMax=-1 -->
  <text x="40"  y="130" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="84"  y="130" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="200" y="130" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="256" y="130" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="312" y="130" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="372" y="130" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="432" y="130" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="498" y="130" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- Row 2 : i=2, nums=5, lastInv=-1, lastMin=0, lastMax=2, min=0, -li=1, 贡献1, ans1  HIGHLIGHT -->
  <rect x="14" y="148" width="532" height="20" fill="#fff8e1" opacity="0.55" rx="4" filter="url(#rough2)"/>
  <text x="40"  y="164" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="84"  y="164" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="140" y="164" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="200" y="164" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="256" y="164" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="312" y="164" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="372" y="164" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="432" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="498" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 3 : i=3, nums=2, lastInv=-1, lastMin=0, lastMax=2, min=0, -li=1, 贡献1, ans2  HIGHLIGHT -->
  <rect x="14" y="182" width="532" height="20" fill="#fff8e1" opacity="0.55" rx="4" filter="url(#rough2)"/>
  <text x="40"  y="198" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="84"  y="198" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="140" y="198" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="200" y="198" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="256" y="198" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="312" y="198" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="372" y="198" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="432" y="198" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="498" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row 4 : i=4, nums=7(越界), lastInv=4, lastMin=0, lastMax=2, min=0, -li=-4, 贡献0, ans2 -->
  <rect x="14" y="216" width="532" height="20" fill="#fce4ec" opacity="0.45" rx="4" filter="url(#rough2)"/>
  <text x="40"  y="232" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="84"  y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <text x="140" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="200" y="232" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="256" y="232" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="312" y="232" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="372" y="232" text-anchor="middle" font-size="11" fill="#b85450">−4</text>
  <text x="432" y="232" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="498" y="232" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- Row 5 : i=5, nums=5, lastInv=4, lastMin=0, lastMax=5, min=0, -li=-4, 贡献0, ans2 -->
  <text x="40"  y="266" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="84"  y="266" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="140" y="266" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="200" y="266" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="256" y="266" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="312" y="266" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="372" y="266" text-anchor="middle" font-size="11" fill="#b85450">−4</text>
  <text x="432" y="266" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="498" y="266" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- total -->
  <path d="M 16 280 L 544 280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="432" y="298" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">合计 2</text>
  <text x="498" y="298" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">= 2 ✓</text>

  <!-- annotation -->
  <rect x="30" y="312" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="330" font-size="10.5" fill="#333">i=2：l ∈ (−1, 0] = {0} → [1,3,5]</text>
  <text x="300" y="330" font-size="10.5" fill="#333">i=3：l ∈ (−1, 0] = {0} → [1,3,5,2]</text>
  <text x="40" y="348" font-size="10.5" fill="#b85450">i=4：7 越界把 lastInvalid 顶到 4，min(lastMin,lastMax)=0 &lt; 4 ⟹ 区间空</text>
  <text x="300" y="348" font-size="10.5" fill="#555">之后左界被钉在 4，min 仍为 0，再无正贡献</text>
</svg>
