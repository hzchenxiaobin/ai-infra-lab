<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算（示例 1）：换根后每个根的正确猜测数</text>
  <text x="300" y="46" text-anchor="middle" font-size="10.5" fill="#888">edges=[[0,1],[1,2],[1,3],[4,2]]，guesses=[[1,3],[0,1],[1,0],[2,4]]，k=3</text>

  <!-- ===== Tree ===== -->
  <!-- edges -->
  <line x1="78" y1="108" x2="162" y2="108" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="198" y1="108" x2="282" y2="108" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="318" y1="108" x2="402" y2="108" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="180" y1="126" x2="180" y2="190" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- nodes 0 1 2 4 in a row, 3 below 1 -->
  <ellipse cx="60" cy="108" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="112" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">0</text>
  <ellipse cx="180" cy="108" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="112" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">1</text>
  <ellipse cx="300" cy="108" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">2</text>
  <ellipse cx="420" cy="108" rx="22" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="112" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">4</text>
  <ellipse cx="180" cy="208" rx="22" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="212" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">3</text>

  <!-- cnt labels below nodes -->
  <text x="60" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cnt=3 ✓</text>
  <text x="180" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cnt=3 ✓</text>
  <text x="300" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cnt=3 ✓</text>
  <text x="420" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt=2 ✗</text>
  <text x="180" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt=2 ✗</text>

  <!-- arrow to table -->
  <line x1="300" y1="262" x2="300" y2="280" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="276" font-size="10" fill="#888">逐根核对</text>

  <!-- ===== Table ===== -->
  <!-- header -->
  <rect x="40" y="288" width="520" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="305" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">根</text>
  <text x="300" y="305" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">命中的猜测</text>
  <text x="450" y="305" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">cnt</text>
  <text x="525" y="305" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">≥k=3?</text>

  <!-- rows -->
  <rect x="40" y="316" width="520" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="331" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="300" y="331" text-anchor="middle" font-size="11" fill="#333">(1,3) (0,1) (2,4)</text>
  <text x="450" y="331" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">3</text>
  <text x="525" y="331" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="40" y="340" width="520" height="22" fill="#f7f7f7" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="355" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="300" y="355" text-anchor="middle" font-size="11" fill="#333">(1,3) (1,0) (2,4)</text>
  <text x="450" y="355" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">3</text>
  <text x="525" y="355" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="40" y="364" width="520" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="379" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="300" y="379" text-anchor="middle" font-size="11" fill="#333">(1,3) (1,0) (2,4)</text>
  <text x="450" y="379" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">3</text>
  <text x="525" y="379" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="40" y="388" width="520" height="22" fill="#f7f7f7" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="403" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="300" y="403" text-anchor="middle" font-size="11" fill="#333">(1,0) (2,4)</text>
  <text x="450" y="403" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="525" y="403" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <rect x="40" y="412" width="520" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="427" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="300" y="427" text-anchor="middle" font-size="11" fill="#333">(1,3) (1,0)</text>
  <text x="450" y="427" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="525" y="427" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- answer -->
  <text x="525" y="427" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="300" y="438" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = 3（根 0、1、2 满足 cnt ≥ 3）</text>
</svg>
