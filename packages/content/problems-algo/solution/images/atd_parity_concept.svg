<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心：加一条边 ⇔ 翻转两端点度数的奇偶性</text>

  <!-- ===== Before: two odd nodes ===== -->
  <text x="110" y="58" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">加边前</text>
  <circle cx="80" cy="100" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="105" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">u</text>
  <text x="80" y="140" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">奇</text>

  <circle cx="180" cy="100" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="105" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">v</text>
  <text x="180" y="140" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">奇</text>

  <!-- dashed new edge -->
  <path d="M 102 100 L 158 100" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">加边 (u,v)</text>

  <!-- arrow to after -->
  <path d="M 210 100 L 244 100" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- After: both even -->
  <text x="330" y="58" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">加边后</text>
  <circle cx="300" cy="100" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="105" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">u</text>
  <text x="300" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">偶</text>

  <circle cx="400" cy="100" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="105" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">v</text>
  <text x="400" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">偶</text>

  <path d="M 322 100 L 378 100" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="475" y="105" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">odd 2 → 0</text>

  <!-- ===== delta table ===== -->
  <text x="280" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">加一条边对「奇点计数 odd」的影响</text>

  <rect x="70" y="184" width="420" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="201" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">连两个奇点：odd − 2</text>
  <text x="400" y="201" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">最划算（一条边消两个奇点）</text>

  <rect x="70" y="212" width="420" height="26" rx="4" fill="#f5f5f5" stroke="#a8a8a8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="229" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">连一奇一偶：odd 不变</text>
  <text x="400" y="229" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">奇点只是搬家，总数不减</text>

  <rect x="70" y="240" width="420" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="257" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">连两个偶点：odd + 2</text>
  <text x="400" y="257" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">反而新增奇点，反向操作</text>

  <!-- ===== conclusion ===== -->
  <rect x="50" y="284" width="460" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="13" fill="#2c4a26" filter="url(#rough2)">至多加 2 条边 ⇒ odd 最多减少 4</text>
  <text x="280" y="326" text-anchor="middle" font-size="13" fill="#2c4a26" filter="url(#rough2)">又由握手定理：odd 恒为偶数</text>
  <text x="280" y="350" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 起始 odd ∈ {0, 2, 4} 才可能有解</text>
</svg>
