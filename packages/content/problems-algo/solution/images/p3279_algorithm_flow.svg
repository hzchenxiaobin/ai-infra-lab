<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：登记事件 → 排序 → 一次扫描</text>

  <!-- 开始框 -->
  <rect x="140" y="34" width="240" height="30" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="11" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">area = Σp，ans = area，diff = #U − #D</text>
  <path d="M 260 64 L 260 80" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 登记事件框 -->
  <rect x="60" y="82" width="400" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="11.5" fill="#2e4460" font-weight="bold" filter="url(#rough2)">逐个活塞登记 2 个临界事件（差分表 delta）</text>
  <text x="260" y="116" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">U：delta[h−p] −= 2；delta[2h−p] += 2</text>
  <text x="260" y="131" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">D：delta[p] += 2；delta[p+h] −= 2</text>
  <path d="M 260 138 L 260 154" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序框 -->
  <rect x="150" y="156" width="220" height="28" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">事件按时刻升序排序（map / sorted）</text>
  <path d="M 260 184 L 260 198" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,200 340,222 260,244 180,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">还有事件？</text>

  <path d="M 260 244 L 260 256" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="254" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 结算框 -->
  <rect x="70" y="258" width="380" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#2e4460" font-weight="bold" filter="url(#rough2)">area += (t − prev) × diff（先用旧斜率结算）</text>
  <text x="260" y="293" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">ans = max(ans, area)；diff += delta[t]；prev = t</text>

  <!-- 回环箭头 -->
  <path d="M 450 281 L 487 281 L 487 222 L 344 222" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 返回 -->
  <path d="M 180 222 L 108 222 L 108 322 L 146 322" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="214" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="148" y="308" width="130" height="30" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="213" y="327" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">易错点：先按旧斜率加面积、再应用本时刻的斜率变化；同一时刻多个反弹只结算一次</text>
</svg>
