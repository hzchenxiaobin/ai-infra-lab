<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举根 + 分支 DFS + 增量相乘</text>

  <!-- B1 -->
  <rect x="95" y="40" width="330" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">建带权无向邻接表（每条边存 (邻居, 边权)）</text>

  <path d="M 260 76 L 260 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B2 -->
  <rect x="95" y="92" width="330" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">枚举信号塔 c = 0 … n−1（外层循环）</text>

  <path d="M 260 128 L 260 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B3 -->
  <rect x="95" y="144" width="330" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="167" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">初始化 total = 0（已累计合格数）、pairs = 0（对数）</text>

  <path d="M 260 180 L 260 192" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B4 -->
  <rect x="95" y="196" width="330" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取 c 的下一个邻居 v —— 每个邻居对应一个分支</text>

  <path d="M 260 232 L 260 244" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B5 -->
  <rect x="95" y="248" width="330" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">在该分支内 DFS（记录父节点防回头）</text>
  <text x="260" y="287" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">cnt = 距离 d 满足 d mod signalSpeed = 0 的节点数</text>

  <path d="M 260 296 L 260 308" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B6 -->
  <rect x="95" y="312" width="330" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">pairs += total × cnt（新分支与已有分支两两组合）</text>
  <text x="260" y="351" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">total += cnt</text>

  <path d="M 260 360 L 260 372" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B7 -->
  <rect x="95" y="376" width="330" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="399" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans[c] = pairs</text>

  <!-- branch loop (left, dashed) -->
  <path d="M 95 336 L 45 336 L 45 214 L 91 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="36" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 36 278)" filter="url(#rough2)">分支未完</text>

  <!-- root loop (right) -->
  <path d="M 425 394 L 488 394 L 488 110 L 429 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="498" y="252" text-anchor="middle" font-size="10" fill="#446688" transform="rotate(90 498 252)" filter="url(#rough2)">下一个 c</text>

  <text x="260" y="430" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">总复杂度 O(n²)：每个根一次全树遍历（n ≤ 1000）</text>
</svg>
