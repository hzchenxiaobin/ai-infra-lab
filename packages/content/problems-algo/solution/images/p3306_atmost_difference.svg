<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">恰 k 个辅音 = 至多 k − 至多 k−1（差分）</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">固定右端点 right，观察合法起点 s 组成的区间（元音齐 + 辅音数受限）</text>

  <!-- 起点轴（三条共用刻度） -->
  <line x1="70" y1="70" x2="490" y2="70" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="150" x2="490" y2="150" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="230" x2="490" y2="230" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="64" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">s=0</text>
  <line x1="160" y1="66" x2="160" y2="74" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="66" x2="250" y2="74" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="146" x2="160" y2="154" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="146" x2="250" y2="154" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="226" x2="160" y2="234" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="245" y1="226" x2="245" y2="234" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行1：atMost(k) -->
  <text x="40" y="106" font-size="12" fill="#33506b" font-weight="bold" text-anchor="middle" filter="url(#rough2)">f(k)</text>
  <rect x="160" y="80" width="290" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="97" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">辅音 ≤ k 且元音齐的起点</text>
  <text x="160" y="132" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">left_k（下界）</text>
  <text x="450" y="132" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">lastAll（上界）</text>
  <path d="M 450 74 L 450 78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 减号 -->
  <text x="105" y="170" font-size="18" fill="#b85450" font-weight="bold" text-anchor="middle" filter="url(#rough2)">−</text>

  <!-- 行2：atMost(k-1) -->
  <text x="40" y="186" font-size="12" fill="#a07830" font-weight="bold" text-anchor="middle" filter="url(#rough2)">f(k−1)</text>
  <rect x="250" y="160" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="350" y="177" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">辅音 ≤ k−1 且元音齐</text>
  <text x="250" y="212" font-size="10" fill="#a07830" text-anchor="middle" filter="url(#rough2)">left_{k−1}（更靠右）</text>
  <path d="M 240 152 L 244 158" stroke="#d6a040" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="146" font-size="9.5" fill="#a07830" filter="url(#rough2)">约束更紧 → 下界右移</text>

  <!-- 等号 -->
  <text x="105" y="250" font-size="18" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">=</text>

  <!-- 行3：恰好 k -->
  <text x="40" y="266" font-size="12" fill="#2f5d24" font-weight="bold" text-anchor="middle" filter="url(#rough2)">恰 k</text>
  <rect x="160" y="240" width="85" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="257" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">恰 k 个</text>
  <text x="330" y="257" font-size="10" fill="#666" filter="url(#rough2)">← 这段窗口里恰好多出 1 个辅音</text>
  <text x="202" y="282" font-size="10" fill="#2f5d24" text-anchor="middle" filter="url(#rough2)">[left_k, left_{k−1}−1]</text>

  <!-- 底部结论 -->
  <rect x="34" y="296" width="452" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">对每个 right 求和：ans = f(k) − f(k−1)，k = 0 时 f(−1) = 0</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">「至多」型约束才好滑窗 —— 先把「恰好」差分成两个「至多」（1248 同款转化）</text>

  <text x="260" y="354" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每个 f 都是标准滑窗计数：O(n) 一趟扫完</text>
</svg>
