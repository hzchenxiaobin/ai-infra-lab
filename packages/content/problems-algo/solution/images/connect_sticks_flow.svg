<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：小顶堆 + 反复合并最短两根</text>

  <!-- Step 1 -->
  <rect x="40" y="48" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="73" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 全部入小顶堆</text>
  <rect x="280" y="48" width="240" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="296" y="73" font-size="11" fill="#7a5a20" filter="url(#rough2)">sticks 全部 push 进 min-heap</text>
  <path d="M 150 92 L 150 110" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop decision -->
  <polygon points="150,112 250,150 150,188 50,150" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">堆中 &gt; 1 根？</text>
  <text x="150" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(heap.size() &gt; 1)</text>

  <!-- No branch -->
  <path d="M 250 150 L 380 150" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="144" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否 → 结束</text>
  <rect x="380" y="132" width="150" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="157" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 total</text>

  <!-- Yes branch -->
  <path d="M 150 188 L 150 210" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="170" y="204" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Step 3 -->
  <rect x="40" y="212" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="237" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 弹出最小两根 a, b</text>
  <rect x="280" y="212" width="240" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="296" y="237" font-size="11" fill="#7a5a20" filter="url(#rough2)">a=pop(); b=pop()  (a ≤ b)</text>
  <path d="M 150 256 L 150 274" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="276" width="220" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="301" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ cost = a + b，累加 total</text>
  <rect x="280" y="276" width="240" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="296" y="301" font-size="11" fill="#7a5a20" filter="url(#rough2)">total += a + b</text>
  <path d="M 150 320 L 150 338" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="40" y="340" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="365" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">④ 新棒 (a+b) push 回堆</text>
  <rect x="280" y="340" width="240" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="296" y="365" font-size="11" fill="#7a5a20" filter="url(#rough2)">push(a + b)</text>
  <path d="M 150 384 L 150 402" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: loop back -->
  <rect x="40" y="404" width="220" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="429" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 回到 ② 继续循环</text>

  <!-- loop back arrow -->
  <path d="M 150 444 Q 150 462 150 480 Q 30 480 30 150 Q 30 132 50 150" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="472" font-size="10" fill="#4a7a3a" filter="url(#rough2)">循环 n−1 次</text>

  <!-- note box -->
  <rect x="280" y="404" width="240" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="296" y="426" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 边界 &amp; 复杂度</text>
  <text x="296" y="446" font-size="10.5" fill="#b85450" filter="url(#rough2)">· 初始仅 1 根 → 循环不执行，返 0</text>
  <text x="296" y="464" font-size="10.5" fill="#b85450" filter="url(#rough2)">· 每轮 pop 2 / push 1，堆减 1</text>
  <text x="296" y="482" font-size="10.5" fill="#b85450" filter="url(#rough2)">· 共 n−1 轮，每轮 O(log n)</text>
</svg>
