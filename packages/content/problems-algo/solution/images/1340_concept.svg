<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：从 i 向左右扫描，遇 ≥ arr[i] 即停</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">arr = [6,4,14,6,8,13,9,7,10,6,12], d = 2，以 i=8 (值 10) 为例</text>

  <!-- index labels -->
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="67" y="100">0</text>
    <text x="113" y="100">1</text>
    <text x="159" y="100">2</text>
    <text x="205" y="100">3</text>
    <text x="251" y="100">4</text>
    <text x="297" y="100">5</text>
    <text x="343" y="100">6</text>
    <text x="389" y="100">7</text>
    <text x="435" y="100">8</text>
    <text x="481" y="100">9</text>
    <text x="527" y="100">10</text>
  </g>

  <!-- array boxes -->
  <g font-size="13" font-weight="bold">
    <rect x="47" y="108" width="40" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="67" y="133" text-anchor="middle" fill="#666">6</text>
    <rect x="93" y="108" width="40" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="113" y="133" text-anchor="middle" fill="#666">4</text>
    <rect x="139" y="108" width="40" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="159" y="133" text-anchor="middle" fill="#666">14</text>
    <rect x="185" y="108" width="40" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="205" y="133" text-anchor="middle" fill="#666">6</text>
    <rect x="231" y="108" width="40" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="251" y="133" text-anchor="middle" fill="#666">8</text>
    <rect x="277" y="108" width="40" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="297" y="133" text-anchor="middle" fill="#666">13</text>
    <!-- valid targets: 6,7,9 green -->
    <rect x="323" y="108" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="343" y="133" text-anchor="middle" fill="#4a7a3a">9</text>
    <rect x="369" y="108" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="389" y="133" text-anchor="middle" fill="#4a7a3a">7</text>
    <!-- source 8 orange -->
    <rect x="415" y="108" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="435" y="133" text-anchor="middle" fill="#d6a040">10</text>
    <!-- valid target 9 green -->
    <rect x="461" y="108" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="481" y="133" text-anchor="middle" fill="#4a7a3a">6</text>
    <!-- blocker 10 red -->
    <rect x="507" y="108" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="527" y="133" text-anchor="middle" fill="#b85450">12</text>
  </g>

  <!-- left scan arrow (from 8 toward 6) -->
  <path d="M 415 168 Q 380 196 343 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="345" y="206" font-size="10" fill="#4a7a3a" font-weight="bold">← 向左扫</text>
  <text x="345" y="220" font-size="9" fill="#4a7a3a">7&lt;10 ✓ 9&lt;10 ✓</text>

  <!-- right scan arrow (from 8 toward 10) -->
  <path d="M 455 168 Q 490 196 527 178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="470" y="206" font-size="10" fill="#b85450" font-weight="bold">向右扫 →</text>
  <text x="470" y="220" font-size="9" fill="#b85450">6&lt;10 ✓ 12≥10 ✗停</text>

  <!-- check / cross marks above boxes -->
  <text x="343" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="389" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="481" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="527" y="96" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- formula box -->
  <rect x="40" y="248" width="520" height="134" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="272" font-size="12" fill="#444" font-weight="bold">跳跃合法性（从 i 跳到 j）：</text>
  <text x="60" y="292" font-size="11" fill="#555">① |i − j| ≤ d 且 j ≠ i    ② arr[j] &lt; arr[i]</text>
  <text x="60" y="310" font-size="11" fill="#555">③ i、j 之间所有 k 满足 arr[k] &lt; arr[i]（中间不能有「高个子」挡路）</text>
  <text x="60" y="334" font-size="12" fill="#444" font-weight="bold">关键化简：方向性扫描 + 遇阻即停</text>
  <text x="60" y="352" font-size="10" fill="#888">向某方向依次看 j=i−1, i−2, …：一旦 arr[j] ≥ arr[i]，该方向立即停止——</text>
  <text x="60" y="368" font-size="10" fill="#888">j 自身不合法（违反②），更远的位置也会被 j 挡住（违反③）。每个方向至多扫 d 步。</text>
</svg>
