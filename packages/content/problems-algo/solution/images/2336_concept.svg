<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：连续尾压成指针 cur ＋ 回收堆 added，popSmallest 取两者较小者</text>

  <!-- label -->
  <text x="40" y="80" font-size="11" fill="#888">正整数集:</text>

  <!-- cell 1 (popped, gray, crossed) -->
  <rect x="110" y="62" width="46" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="133" y="88" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">1</text>
  <line x1="116" y1="68" x2="150" y2="96" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- cell 2 (popped, gray, crossed) -->
  <rect x="158" y="62" width="46" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="181" y="88" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">2</text>
  <line x1="164" y1="68" x2="198" y2="96" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- cell 3 (popped, gray, crossed) -->
  <rect x="206" y="62" width="46" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="229" y="88" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">3</text>
  <line x1="212" y1="68" x2="246" y2="96" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- cell 4 (present, green, cur points here) -->
  <rect x="254" y="62" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="277" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <!-- cell 5 (present, green) -->
  <rect x="302" y="62" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <!-- cell 6 (present, green) -->
  <rect x="350" y="62" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <!-- ellipsis -->
  <text x="410" y="90" font-size="18" fill="#888" font-weight="bold">…</text>

  <!-- "已弹出" annotation -->
  <path d="M 181 128 L 181 104" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="181" y="144" text-anchor="middle" font-size="10" fill="#888">1,2,3 已弹出</text>

  <!-- cur pointer arrow pointing up at cell 4 -->
  <path d="M 277 138 L 277 104" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="277" y="154" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cur = 4（连续尾最小）</text>

  <!-- added heap box (left) -->
  <rect x="36" y="170" width="220" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="146" y="190" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">回收堆 added（元素 &lt; cur）</text>
  <rect x="70" y="200" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="220" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="130" y="220" font-size="13" fill="#888" font-weight="bold">← 堆顶 = min</text>

  <!-- popSmallest decision (right) -->
  <text x="430" y="188" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">popSmallest()</text>
  <polygon points="430,196 528,236 430,276 332,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="232" text-anchor="middle" font-size="12" fill="#333">added 非空?</text>
  <text x="430" y="248" text-anchor="middle" font-size="10" fill="#888">（堆顶 &lt; cur 必然）</text>

  <!-- yes branch: from diamond left to added heap -->
  <path d="M 332 236 L 256 236 L 256 215 L 244 215" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="300" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a">弹出堆顶 →</text>

  <!-- no branch: from diamond top up to cur cell -->
  <path d="M 430 196 L 430 162 L 277 162 L 277 158" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="182" font-size="11" fill="#446688" font-weight="bold">否</text>
  <text x="354" y="158" text-anchor="middle" font-size="10" fill="#446688">取 cur，cur++</text>

  <!-- addBack box (bottom) -->
  <rect x="36" y="262" width="220" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="146" y="282" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">addBack(num)</text>
  <text x="146" y="300" text-anchor="middle" font-size="11" fill="#666">num &lt; cur 且 不在 added</text>
  <text x="146" y="318" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">→ push 进 added 堆</text>

  <!-- addBack arrow up into added heap -->
  <path d="M 146 262 L 146 246" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom principle callout -->
  <rect x="288" y="288" width="276" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="426" y="308" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">无限集 = 连续尾 [cur, ∞) ＋ 离散回收堆 added</text>
  <text x="426" y="326" text-anchor="middle" font-size="11" fill="#666">只存「偏离连续」的少量回收元素</text>
  <text x="426" y="344" text-anchor="middle" font-size="11" fill="#666">主体连续尾用 O(1) 指针表示，不随规模增长</text>
</svg>
