<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">独生节点：父母恰好只有一个孩子时，该孩子即为独生</text>

  <!-- 树结构：root=1, left=2, right=3, 2的右孩子=4 -->
  <!-- 连线 -->
  <line x1="268" y1="86" x2="202" y2="134" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="292" y1="86" x2="368" y2="134" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="202" y1="166" x2="238" y2="224" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <!-- 根节点 1：双孩子 → 不产生独生 -->
  <circle cx="280" cy="72" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="306" y="64" font-size="9" fill="#446688">双孩子</text>

  <!-- 节点 2：只有右孩子 → 橙色标注 -->
  <circle cx="190" cy="150" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="154" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="142" y="144" font-size="9" fill="#d6a040" font-weight="bold">只右孩子 ⚠</text>

  <!-- 节点 3：叶节点 → 无孩子 -->
  <circle cx="380" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="154" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="400" y="144" font-size="9" fill="#888">叶节点</text>

  <!-- 节点 4：独生节点 → 绿色高亮 -->
  <circle cx="250" cy="240" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="250" y="244" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="272" y="234" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 独生</text>

  <!-- 视角翻转箭头：从"问4"翻转为"问2" -->
  <path d="M 318 232 Q 360 200 340 168" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="210" font-size="9" fill="#b85450">翻转视角</text>

  <!-- 说明框 -->
  <rect x="36" y="286" width="488" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">视角翻转：从"4 是否独生"到"2 是否只有一个孩子"</text>
  <text x="54" y="330" font-size="11" fill="#4a7a3a">绿色 ✓ 节点 = 独生节点（父母恰好只有一个孩子，此处节点 4 是节点 2 的唯一孩子）</text>
  <text x="54" y="350" font-size="11" fill="#d6a040">橙色 ⚠ 节点 = 只有一个孩子的父母（产生独生子女，此处节点 2 只有右孩子）</text>
  <text x="54" y="370" font-size="11" fill="#446688">根节点 1 有两个孩子 → 2、3 都不独生；叶节点 3 无孩子 → 不产生独生子女</text>
</svg>
