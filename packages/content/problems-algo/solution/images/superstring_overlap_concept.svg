<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最短超级串：后缀-前缀重叠 overlap( i → j )</text>

  <text x="60" y="62" font-size="11" fill="#446688" font-weight="bold">word[i] = gcta</text>
  <rect x="60" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="91" text-anchor="middle" font-size="13" fill="#446688">g</text>
  <rect x="100" y="70" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="91" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">c</text>
  <rect x="140" y="70" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="91" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">t</text>
  <rect x="180" y="70" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="91" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a</text>

  <text x="300" y="62" font-size="11" fill="#b85450" font-weight="bold">word[j] = ctaagt</text>
  <rect x="300" y="70" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="91" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">c</text>
  <rect x="340" y="70" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="91" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">t</text>
  <rect x="380" y="70" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="91" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <rect x="420" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="91" text-anchor="middle" font-size="13" fill="#446688">a</text>
  <rect x="460" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="91" text-anchor="middle" font-size="13" fill="#446688">g</text>
  <rect x="500" y="70" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="514" y="91" text-anchor="middle" font-size="13" fill="#446688">t</text>

  <path d="M 160 106 Q 230 130 160 150" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 106 Q 290 130 360 150" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="138" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="220" y="163" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">重叠区 = "cta"（长度 3）</text>

  <text x="270" y="206" text-anchor="middle" font-size="11" fill="#888">合并：保留 word[i] 全部 + 追加 word[j] 去掉重叠部分</text>

  <rect x="60" y="222" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="243" text-anchor="middle" font-size="13" fill="#446688">g</text>
  <rect x="100" y="222" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="243" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">c</text>
  <rect x="140" y="222" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="243" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">t</text>
  <rect x="180" y="222" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="243" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a</text>
  <rect x="220" y="222" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="243" text-anchor="middle" font-size="13" fill="#446688">a</text>
  <rect x="260" y="222" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="243" text-anchor="middle" font-size="13" fill="#446688">g</text>
  <rect x="300" y="222" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="243" text-anchor="middle" font-size="13" fill="#446688">t</text>

  <text x="200" y="276" font-size="11" fill="#888">= gcta + ctaagt[3:] = gcta + agt</text>

  <text x="60" y="243" font-size="9" fill="#888" text-anchor="end">→</text>

  <rect x="20" y="298" width="500" height="66" fill="#f5f5f5" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">overlap[i][j] = word[i] 后缀与 word[j] 前缀的最长公共部分</text>
  <text x="270" y="340" text-anchor="middle" font-size="10" fill="#666">从大到小试 k：word[i][len-k:] == word[j][:k] ?</text>
  <text x="270" y="356" text-anchor="middle" font-size="10" fill="#666">合并后长度 = len(word[i]) + len(word[j]) − overlap[i][j]</text>
</svg>
