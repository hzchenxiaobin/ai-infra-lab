<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Kruskal 算法流程</text>

  <!-- step 1: sort -->
  <rect x="190" y="48" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① 边按 cost 升序排序</text>
  <path d="M280,82 L280,100" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: init uf -->
  <rect x="190" y="104" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">② 初始化并查集 parent[i]=i</text>
  <path d="M280,138 L280,156" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: loop over edges -->
  <rect x="160" y="160" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ for 每条边 (u, v, cost)：</text>
  <path d="M280,194 L280,212" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: find(u)==find(v)? -->
  <polygon points="280,216 380,260 280,304 180,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">find(u)==</text>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">find(v) ?</text>

  <!-- yes branch: skip (left) -->
  <path d="M180,260 L110,260 L110,300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="252" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="40" y="304" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="321" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过该边</text>
  <text x="110" y="336" text-anchor="middle" font-size="10" fill="#888">（已连通，加入会成环）</text>
  <path d="M110,344 L110,372 L200,372" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch: union (right) -->
  <path d="M380,260 L450,260 L450,300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="252" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="380" y="304" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">union + ans+=cost</text>
  <text x="450" y="336" text-anchor="middle" font-size="10" fill="#888">count++（选入 MST）</text>
  <path d="M450,344 L450,372 L360,372" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check: count == n-1 ? -->
  <rect x="200" y="356" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">count == n−1 ? 提前返回 ans</text>
  <path d="M280,390 L280,408" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end: loop ends -->
  <rect x="150" y="412" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="433" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">遍历完仍 count &lt; n−1 → 返回 −1（图不连通）</text>
</svg>
