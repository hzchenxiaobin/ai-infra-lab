<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[5,1,5,5,5,null,5] 后序遍历逐节点判定</text>

  <!-- 小树示意 -->
  <text x="90" y="56" text-anchor="middle" font-size="11" fill="#888">后序顺序</text>
  <circle cx="90" cy="74" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="10" fill="#333">5</text>
  <line x1="82" y1="84" x2="62" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="98" y1="84" x2="118" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="58" cy="110" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="113" text-anchor="middle" font-size="9" fill="#333">1</text>
  <circle cx="122" cy="110" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="113" text-anchor="middle" font-size="9" fill="#333">5</text>
  <line x1="52" y1="118" x2="40" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="118" x2="76" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="128" y1="118" x2="140" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="37" cy="142" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="37" y="145" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="48" y="148" font-size="8" fill="#4a7a3a">①</text>
  <circle cx="79" cy="142" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="145" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="90" y="148" font-size="8" fill="#4a7a3a">②</text>
  <text x="58" y="124" font-size="8" fill="#b85450">③</text>
  <circle cx="143" cy="142" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="143" y="145" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="154" y="148" font-size="8" fill="#4a7a3a">④</text>
  <text x="122" y="124" font-size="8" fill="#4a7a3a">⑤</text>
  <text x="90" y="64" font-size="8" fill="#b85450">⑥</text>

  <!-- 表格 -->
  <!-- 表头 -->
  <rect x="200" y="48" width="400" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="240" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="310" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">值检查</text>
  <text x="400" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">同值?</text>
  <text x="510" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">count</text>
  <line x1="280" y1="48" x2="280" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="360" y1="48" x2="360" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="440" y1="48" x2="440" y2="74" stroke="#fafafa" stroke-width="1"/>

  <!-- 行 ① 叶5 -->
  <rect x="200" y="74" width="400" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="240" y="92" text-anchor="middle" font-size="10" fill="#333">① 叶 5</text>
  <text x="310" y="92" text-anchor="middle" font-size="9" fill="#888">无孩子，跳过</text>
  <text x="400" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ true</text>
  <text x="510" y="92" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- 行 ② 叶5 -->
  <rect x="200" y="102" width="400" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="240" y="120" text-anchor="middle" font-size="10" fill="#333">② 叶 5</text>
  <text x="310" y="120" text-anchor="middle" font-size="9" fill="#888">无孩子，跳过</text>
  <text x="400" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ true</text>
  <text x="510" y="120" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 行 ③ 节点1 -->
  <rect x="200" y="130" width="400" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="240" y="148" text-anchor="middle" font-size="10" fill="#333">③ 节点 1</text>
  <text x="310" y="148" text-anchor="middle" font-size="9" fill="#b85450">1 ≠ 5（左孩子）</text>
  <text x="400" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">❌ false</text>
  <text x="510" y="148" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 行 ④ 叶5 -->
  <rect x="200" y="158" width="400" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="240" y="176" text-anchor="middle" font-size="10" fill="#333">④ 叶 5</text>
  <text x="310" y="176" text-anchor="middle" font-size="9" fill="#888">无孩子，跳过</text>
  <text x="400" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ true</text>
  <text x="510" y="176" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- 行 ⑤ 节点5右 -->
  <rect x="200" y="186" width="400" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="240" y="204" text-anchor="middle" font-size="10" fill="#333">⑤ 节点 5（右）</text>
  <text x="310" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a">5 == 5 ✓（右孩子）</text>
  <text x="400" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ true</text>
  <text x="510" y="204" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- 行 ⑥ 根5 -->
  <rect x="200" y="214" width="400" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="240" y="232" text-anchor="middle" font-size="10" fill="#333">⑥ 根 5</text>
  <text x="310" y="232" text-anchor="middle" font-size="9" fill="#b85450">左子树不同值 → 短路</text>
  <text x="400" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">❌ false</text>
  <text x="510" y="232" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- 表格边框 -->
  <rect x="200" y="48" width="400" height="194" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="280" y1="74" x2="280" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="360" y1="74" x2="360" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="440" y1="74" x2="440" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="60" y="270" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 count = 4 ✓</text>
  <text x="310" y="312" text-anchor="middle" font-size="10" fill="#555">3 个叶子（①②④）+ 右上 5 子树（⑤）= 4 棵同值子树</text>

  <!-- 关键观察 -->
  <rect x="60" y="340" width="500" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="10" fill="#555">③ 虽两子树都同值，但 1≠5 连累自身 → 传递 false 给根</text>
  <text x="310" y="378" text-anchor="middle" font-size="10" fill="#555">⑥ 左子已 false → 无需检查值即短路，整棵树不同值</text>
</svg>
