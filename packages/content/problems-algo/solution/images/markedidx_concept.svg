<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后从 n/2 处切半，小值池 ↔ 大值池 双指针配对</text>

  <!-- sorted array row: 2 4 | 5 9 -->
  <!-- left half (small pool) -->
  <text x="70" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">小值池 i</text>
  <rect x="90" y="84" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="118" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">2</text>
  <rect x="150" y="84" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">4</text>

  <!-- split dashed line -->
  <path d="M 214 78 L 214 150" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="214" y="70" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">切半 n/2</text>

  <!-- right half (large pool) -->
  <text x="446" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">大值池 j</text>
  <rect x="230" y="84" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">5</text>
  <rect x="290" y="84" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="318" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">9</text>

  <!-- index ticks -->
  <text x="118" y="156" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <text x="178" y="156" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <text x="258" y="156" text-anchor="middle" font-size="10" fill="#888">j=2</text>
  <text x="318" y="156" text-anchor="middle" font-size="10" fill="#888">j=3</text>

  <!-- pairing arrows: 2 -> 5, 4 -> 9 -->
  <path d="M 118 84 C 118 188 258 188 258 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 178 84 C 178 200 318 200 318 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- condition label on first arrow -->
  <rect x="150" y="176" width="118" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="209" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2·2=4 ≤ 5 ✓</text>

  <rect x="232" y="214" width="118" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="291" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2·4=8 ≤ 9 ✓</text>

  <!-- key formula -->
  <rect x="40" y="262" width="480" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">配对条件：2 · nums[i] ≤ nums[j]　（小值 ×2 仍不超过大值）</text>

  <!-- takeaway -->
  <rect x="40" y="312" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">交换论证：最优解中“小值”必取最小 k 个、“大值”必取最大 k 个</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#555">故把数组排序后于 n/2 切半即可，配对数上限 ⌊n/2⌋</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#888">（奇数时正中间那个元素既不当小值也不当大值，自然落选）</text>
</svg>
