<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：共享坐标 = 连通分量；新点的两个坐标各至多钩住一块</text>

  <!-- 坐标系（示例 3） -->
  <text x="150" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 3：points = [[2,3],[2,2],[1,1],[4,5]]</text>

  <line x1="48" y1="305" x2="48" y2="52" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="48" y1="305" x2="252" y2="305" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="42" y="318" font-size="9" fill="#777" filter="url(#rough2)">0</text>
  <text x="90" y="318" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">1</text>
  <text x="135" y="318" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">2</text>
  <text x="180" y="318" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">3</text>
  <text x="225" y="318" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">4</text>
  <text x="38" y="270" text-anchor="end" font-size="9" fill="#777" filter="url(#rough2)">1</text>
  <text x="38" y="230" text-anchor="end" font-size="9" fill="#777" filter="url(#rough2)">2</text>
  <text x="38" y="190" text-anchor="end" font-size="9" fill="#777" filter="url(#rough2)">3</text>
  <text x="38" y="150" text-anchor="end" font-size="9" fill="#777" filter="url(#rough2)">4</text>
  <text x="38" y="110" text-anchor="end" font-size="9" fill="#777" filter="url(#rough2)">5</text>

  <!-- 分量虚线圈 -->
  <ellipse cx="138" cy="207" rx="27" ry="46" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <ellipse cx="93" cy="267" rx="24" ry="17" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <ellipse cx="228" cy="107" rx="24" ry="17" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 新点参考线：x=2 与 y=1 -->
  <line x1="138" y1="267" x2="138" y2="160" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="138" y1="267" x2="72" y2="267" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 已有点 -->
  <circle cx="138" cy="187" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="138" cy="227" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="93" cy="267" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="228" cy="107" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 新增点 -->
  <circle cx="138" cy="267" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="150" y="284" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">新增点 (2,1)</text>

  <!-- 激活箭头 -->
  <path d="M 138 258 L 138 238" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="146" y="252" font-size="9" fill="#b85450" filter="url(#rough2)">x=2 钩住 A</text>
  <path d="M 128 267 L 106 267" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="78" y="256" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">y=1 钩住 B</text>

  <!-- 分量标签 -->
  <text x="172" y="182" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">分量 A size=2</text>
  <text x="70" y="296" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">分量 B size=1</text>
  <text x="258" y="103" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">分量 C size=1</text>
  <text x="258" y="117" font-size="9" fill="#999" filter="url(#rough2)">（钩不住它）</text>

  <!-- 右侧账本 -->
  <text x="400" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">分量账本</text>
  <rect x="310" y="60" width="180" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="74" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">分量</text>
  <text x="440" y="74" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">size</text>
  <rect x="310" y="82" width="180" height="18" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="95" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">A</text>
  <text x="440" y="95" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="310" y="102" width="180" height="18" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="115" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">B</text>
  <text x="440" y="115" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="310" y="122" width="180" height="18" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">C</text>
  <text x="440" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <text x="400" y="158" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">top1 = 2，top2 = 1</text>

  <rect x="300" y="168" width="200" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="188" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = top1+top2+1 = 4</text>

  <rect x="300" y="206" width="200" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="224" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">⚠️ 只有一个分量时 → n+1（示例 1）</text>

  <!-- 底部论证 -->
  <text x="260" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">上界：新点只有两个坐标，每个坐标唯一归属一个分量（同 x 的点两两连通）</text>
  <text x="260" y="274" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">⇒ 激活集合 ⊆ {新点} ∪ f(x₀) ∪ g(y₀) ≤ 1 + top1 + top2</text>
  <text x="260" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">可达：从 top1、top2 两块各借一个旧坐标拼新点——两块不同 ⇒ 拼出的点必不在 points 中</text>
  <text x="260" y="310" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">（若与已有点重合，该点自己早就把两块连成一块了，矛盾）</text>

  <rect x="90" y="324" width="340" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">激活传播的传递性 ⇒ “共享坐标”的连通块 = 一次激活能点亮的全部</text>
</svg>
