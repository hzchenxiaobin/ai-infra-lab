<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分长度，每轮定长滑窗双哈希数频次</text>

  <!-- step 1 -->
  <rect x="170" y="38" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 预处理双哈希前缀 h1、h2 与幂表 p1、p2</text>

  <path d="M 320 76 L 320 88" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="170" y="92" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 二分：lo = 1，hi = n</text>

  <path d="M 320 130 L 320 142" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="140" y="146" width="360" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 取 mid，滑窗 i = 0 … n−mid：</text>
  <text x="320" y="186" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">O(1) 算复合指纹 key = (H1, H2)，cnt[key]++</text>

  <path d="M 320 198 L 320 210" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 4 decision -->
  <polygon points="320,212 455,262 320,312 185,262" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">④ 存在频次</text>
  <text x="320" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">恰为 1 的键 ?</text>

  <!-- yes branch -->
  <path d="M 185 262 L 160 262" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="172" y="253" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="32" y="242" width="126" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="95" y="259" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">hi = mid</text>
  <text x="95" y="275" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（答案 ≤ mid）</text>

  <!-- no branch -->
  <path d="M 455 262 L 482 262" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="468" y="253" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="486" y="242" width="126" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="549" y="259" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">lo = mid + 1</text>
  <text x="549" y="275" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（答案 &gt; mid）</text>

  <!-- join to step 5 -->
  <path d="M 95 282 L 95 352 L 196 352" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 549 282 L 549 352 L 448 352" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 5 decision -->
  <polygon points="322,316 445,358 322,400 199,358" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="363" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">⑤ lo &lt; hi ?</text>

  <!-- yes: loop back to step 2 -->
  <path d="M 199 358 L 70 358 L 70 111 L 166 111" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="80" y="349" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是：继续二分</text>

  <!-- no: return -->
  <path d="M 322 400 L 322 422" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="333" y="416" font-size="10.5" fill="#a87020" filter="url(#rough2)">否：收敛</text>

  <rect x="192" y="426" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="322" y="451" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">⑥ 返回 lo（最小唯一长度）</text>

  <text x="320" y="490" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">每轮 check O(n) × O(log n) 轮 ⇒ 总 O(n log n)；双哈希把碰撞概率压到约 5×10⁻⁹</text>
</svg>
