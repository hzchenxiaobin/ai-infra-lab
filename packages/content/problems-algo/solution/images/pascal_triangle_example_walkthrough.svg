<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：numRows=5 逐行构造</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">首尾为 1，中间数 = 肩上两数相加</text>

  <!-- ===== Triangle: cell w=40 h=38, cx spacing 42 (offset 21), cy spacing 44 ===== -->
  <!-- Row 0 cy=80, Row1 124, Row2 168, Row3 212, Row4 256 -->
  <g font-size="13" fill="#333">
    <!-- Row 0: [1] -->
    <rect x="240" y="61" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="260" y="85" text-anchor="middle" fill="#446688" font-weight="bold">1</text>

    <!-- Row 1: [1,1] -->
    <rect x="219" y="105" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="239" y="129" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="261" y="105" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="281" y="129" text-anchor="middle" fill="#446688" font-weight="bold">1</text>

    <!-- Row 2: [1,2,1]  2=1+1 -->
    <rect x="198" y="149" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="218" y="173" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="240" y="149" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="260" y="173" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="282" y="149" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="302" y="173" text-anchor="middle" fill="#446688" font-weight="bold">1</text>

    <!-- Row 3: [1,3,3,1]  3=1+2, 3=2+1 -->
    <rect x="177" y="193" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="197" y="217" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="219" y="193" width="40" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="239" y="217" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="261" y="193" width="40" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="281" y="217" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="303" y="193" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="323" y="217" text-anchor="middle" fill="#446688" font-weight="bold">1</text>

    <!-- Row 4: [1,4,6,4,1]  4=1+3, 6=3+3, 4=3+1  (final answer row) -->
    <rect x="156" y="237" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="176" y="261" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="198" y="237" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="218" y="261" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="240" y="237" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="260" y="261" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="282" y="237" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="302" y="261" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="324" y="237" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="344" y="261" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- ===== Addition arrows for Row 4 ===== -->
  <!-- 4 (cx=218) <- 1(cx=197) + 3(cx=239) -->
  <path d="M 197 231 Q 205 235 214 237" stroke="#d6a040" stroke-width="0.9" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" opacity="0.7" filter="url(#rough2)"/>
  <path d="M 239 231 Q 230 235 222 237" stroke="#d6a040" stroke-width="0.9" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" opacity="0.7" filter="url(#rough2)"/>
  <text x="218" y="288" text-anchor="middle" font-size="9" fill="#d6a040">1+3=4</text>

  <!-- 6 (cx=260) <- 3(cx=239) + 3(cx=281) -->
  <path d="M 239 231 Q 249 235 256 237" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" opacity="0.8" filter="url(#rough2)"/>
  <path d="M 281 231 Q 271 235 264 237" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" opacity="0.8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3+3=6</text>

  <!-- 4 (cx=302) <- 3(cx=281) + 1(cx=323) -->
  <path d="M 281 231 Q 290 235 298 237" stroke="#d6a040" stroke-width="0.9" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" opacity="0.7" filter="url(#rough2)"/>
  <path d="M 323 231 Q 314 235 306 237" stroke="#d6a040" stroke-width="0.9" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" opacity="0.7" filter="url(#rough2)"/>
  <text x="302" y="288" text-anchor="middle" font-size="9" fill="#d6a040">3+1=4</text>

  <!-- ===== Legend ===== -->
  <rect x="60" y="305" width="400" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="74" y="311" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="92" y="321" font-size="9" fill="#555">边界=1</text>
  <rect x="150" y="311" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="168" y="321" font-size="9" fill="#555">第2行</text>
  <rect x="216" y="311" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="234" y="321" font-size="9" fill="#555">第3行</text>
  <rect x="282" y="311" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="300" y="321" font-size="9" fill="#555">第4行（最终）</text>

  <!-- ===== Result ===== -->
  <rect x="60" y="335" width="400" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="349" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">共 n(n+1)/2 个元素 → 时间 O(n²)，输出空间 O(n²)</text>
</svg>
