<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">步数最短 ≠ 损失最小：示例 3 的两条 4 步路径</text>

  <!-- 左面板：路径 A -->
  <rect x="18" y="42" width="234" height="264" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="135" y="62" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">路径 A：贴边直走（红色）</text>

  <!-- 网格 A：3x3，格子 46px -->
  <rect x="62" y="80" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="85" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="108" y="80" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="131" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="154" y="80" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="177" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="62" y="126" width="46" height="46" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="154" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="108" y="126" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="131" y="154" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="154" y="126" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="177" y="154" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="62" y="172" width="46" height="46" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="200" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="108" y="172" width="46" height="46" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="131" y="200" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="154" y="172" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="177" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 85 103 L 177 103 L 177 195" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="85" cy="103" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="177" cy="195" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="135" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">4 步，5 个格子全是 1</text>
  <text x="135" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">损失 = 1×5 = 5（含起点！）</text>
  <text x="135" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">health=5 → 剩 0，不安全 ✗</text>

  <!-- 右面板：路径 B -->
  <rect x="268" y="42" width="234" height="264" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="385" y="62" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">路径 B：绕进中心的 0（绿色）</text>

  <rect x="312" y="80" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="335" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="358" y="80" width="46" height="46" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="381" y="108" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="404" y="80" width="46" height="46" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="427" y="108" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="312" y="126" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="335" y="154" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="358" y="126" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="381" y="154" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="404" y="126" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="427" y="154" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="312" y="172" width="46" height="46" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="200" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="358" y="172" width="46" height="46" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="381" y="200" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="404" y="172" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="427" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 335 103 L 335 149 L 427 149 L 427 195" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="335" cy="103" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="427" cy="195" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="142" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">借道 0 格</text>

  <text x="385" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">同为 4 步，但只有 4 个 1</text>
  <text x="385" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">损失 = 1+1+0+1+1 = 4</text>
  <text x="385" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">health=5 → 剩 1，安全 ✓</text>

  <!-- 底部结论 -->
  <rect x="18" y="318" width="484" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">按「步数」分层的普通 BFS 分不出 A / B —— 应改为最小化「路径格子值之和」</text>
  <text x="260" y="345" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">边权只有 0 / 1 的最短路 → 0-1 BFS（双端队列），终点判 dist &lt; health</text>
</svg>
