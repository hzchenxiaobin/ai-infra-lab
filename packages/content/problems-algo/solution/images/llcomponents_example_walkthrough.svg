<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：head = [0,1,2,3], nums = [0,1,3]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">set = {0,1,3}，绿=在集合中，灰=不在，红框=新分量起点</text>

  <!-- 列头 -->
  <text x="36" y="68" font-size="10" fill="#888" font-weight="bold">节点</text>
  <text x="80" y="68" font-size="10" fill="#888" font-weight="bold">链表与当前节点</text>
  <text x="350" y="68" font-size="10" fill="#888" font-weight="bold">判断</text>
  <text x="490" y="68" font-size="10" fill="#888" font-weight="bold">count</text>

  <!-- ===== 节点 0 ===== -->
  <text x="44" y="104" font-size="10" fill="#888">val=0</text>
  <g font-size="11">
    <rect x="80" y="88" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="105" y="107" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="134" y="88" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="159" y="107" text-anchor="middle" fill="#888">1</text>
    <rect x="188" y="88" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="213" y="107" text-anchor="middle" fill="#888">2</text>
    <rect x="242" y="88" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="267" y="107" text-anchor="middle" fill="#888">3</text>
  </g>
  <text x="350" y="100" font-size="9" fill="#4a7a3a" font-weight="bold">在集合 ✓</text>
  <text x="350" y="114" font-size="9" fill="#b85450" font-weight="bold">prev_in=False → 起点</text>
  <text x="490" y="107" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== 节点 1 ===== -->
  <text x="44" y="156" font-size="10" fill="#888">val=1</text>
  <g font-size="11">
    <rect x="80" y="140" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="105" y="159" text-anchor="middle" fill="#4a7a3a">0</text>
    <rect x="134" y="140" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="159" y="159" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="188" y="140" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="213" y="159" text-anchor="middle" fill="#888">2</text>
    <rect x="242" y="140" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="267" y="159" text-anchor="middle" fill="#888">3</text>
  </g>
  <text x="350" y="152" font-size="9" fill="#4a7a3a" font-weight="bold">在集合 ✓</text>
  <text x="350" y="166" font-size="9" fill="#888">prev_in=True → 续接</text>
  <text x="490" y="159" font-size="12" fill="#888">1</text>

  <!-- ===== 节点 2 ===== -->
  <text x="44" y="208" font-size="10" fill="#888">val=2</text>
  <g font-size="11">
    <rect x="80" y="192" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="105" y="211" text-anchor="middle" fill="#4a7a3a">0</text>
    <rect x="134" y="192" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="159" y="211" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="188" y="192" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="213" y="211" text-anchor="middle" fill="#aaa">2</text>
    <rect x="242" y="192" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="267" y="211" text-anchor="middle" fill="#888">3</text>
  </g>
  <text x="350" y="204" font-size="9" fill="#aaa" font-weight="bold">不在集合 ✗</text>
  <text x="350" y="218" font-size="9" fill="#888">prev_in 重置为 False</text>
  <text x="490" y="211" font-size="12" fill="#888">1</text>

  <!-- ===== 节点 3 ===== -->
  <text x="44" y="260" font-size="10" fill="#888">val=3</text>
  <g font-size="11">
    <rect x="80" y="244" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="105" y="263" text-anchor="middle" fill="#4a7a3a">0</text>
    <rect x="134" y="244" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="159" y="263" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="188" y="244" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="213" y="263" text-anchor="middle" fill="#888">2</text>
    <rect x="242" y="244" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="267" y="263" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>
  <text x="350" y="256" font-size="9" fill="#4a7a3a" font-weight="bold">在集合 ✓</text>
  <text x="350" y="270" font-size="9" fill="#b85450" font-weight="bold">prev_in=False → 起点</text>
  <text x="490" y="263" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== 结束 ===== -->
  <text x="44" y="308" font-size="10" fill="#888" font-weight="bold">结束</text>
  <text x="350" y="308" font-size="10" fill="#555">node = null，退出循环</text>
  <text x="490" y="308" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== 分量汇总 ===== -->
  <rect x="30" y="330" width="520" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="352" font-size="11" fill="#4a7a3a" font-weight="bold">分量汇总：count = 2</text>
  <text x="50" y="370" font-size="10" fill="#555">分量 ① = [0, 1]（节点 0 起点，节点 1 续接）</text>
  <text x="50" y="384" font-size="10" fill="#555">分量 ② = [3]（节点 2 不在集合切断链，节点 3 成为新起点）</text>

  <!-- ===== 关键洞察 ===== -->
  <rect x="30" y="402" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="422" font-size="11" fill="#8a6a20" font-weight="bold">关键洞察：只需看「在集合中」状态由 False→True 的跳变</text>
  <text x="50" y="440" font-size="10" fill="#555">每次 False→True 跳变 = 一个新分量起点。True→True 是续接，True→False/False→False 都不算</text>
</svg>
