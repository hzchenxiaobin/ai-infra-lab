<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：只需跟踪「上一个 1」的位置</text>

  <!-- ===== Row 1: n = 22 = 10110, MSB→LSB ===== -->
  <text x="40" y="72" font-size="12.5" fill="#446688" font-weight="bold">n = 22</text>
  <text x="40" y="88" font-size="10" fill="#888">二进制</text>

  <rect x="120" y="56" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="80" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="170" y="56" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="80" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <rect x="220" y="56" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="80" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="270" y="56" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="80" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="320" y="56" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="345" y="80" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>

  <text x="145" y="108" text-anchor="middle" font-size="10.5" fill="#888">位 4</text>
  <text x="195" y="108" text-anchor="middle" font-size="10.5" fill="#888">位 3</text>
  <text x="245" y="108" text-anchor="middle" font-size="10.5" fill="#888">位 2</text>
  <text x="295" y="108" text-anchor="middle" font-size="10.5" fill="#888">位 1</text>
  <text x="345" y="108" text-anchor="middle" font-size="10.5" fill="#888">位 0</text>

  <!-- ===== Row 2: extracted 1 positions with gaps ===== -->
  <text x="40" y="150" font-size="12.5" fill="#d6a040" font-weight="bold">1 的位置</text>
  <text x="40" y="166" font-size="10" fill="#888">按序排列</text>

  <rect x="120" y="138" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="148" y="159" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <rect x="240" y="138" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="268" y="159" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <rect x="360" y="138" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="388" y="159" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>

  <!-- gap arrow 4→2 (distance 2, MAX) -->
  <path d="M 176 154 L 238 154" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="186" y="170" width="44" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= 2 ★</text>

  <!-- gap arrow 2→1 (distance 1) -->
  <path d="M 296 154 L 358 154" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="312" y="170" width="32" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="328" y="184" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">= 1</text>

  <!-- arrow down -->
  <path d="M 270 196 Q 270 206 270 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== insight box ===== -->
  <rect x="50" y="218" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">每遇 1：ans = max(ans, pos − last)；last = pos</text>
  <text x="270" y="256" text-anchor="middle" font-size="11.5" fill="#4a7a3a">只记「上一个 1」即可，无需存全部位置</text>

  <!-- complexity tag -->
  <rect x="130" y="282" width="280" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="301" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">时间 O(log n)，空间 O(1)</text>
</svg>
