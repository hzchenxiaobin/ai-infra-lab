<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>
  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：grid2 有 5 座岛，其中 3 座是子岛屿</text>

  <text x="120" y="100" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">grid1</text>
  <text x="430" y="100" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">grid2</text>

  <!-- ===== grid1 background + grid lines (5x5, cell=24, origin 60,110) ===== -->
  <rect x="60" y="110" width="120" height="120" fill="#ffffff" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="84"  y1="110" x2="84"  y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="108" y1="110" x2="108" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="132" y1="110" x2="132" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="156" y1="110" x2="156" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="60" y1="134" x2="180" y2="134" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="60" y1="158" x2="180" y2="158" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="60" y1="182" x2="180" y2="182" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="60" y1="206" x2="180" y2="206" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- grid1 land cells (blue) -->
  <rect x="60"  y="110" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="84"  y="110" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="108" y="110" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="84"  y="134" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="108" y="134" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="132" y="134" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="156" y="134" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="60"  y="182" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="60"  y="206" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="84"  y="206" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="132" y="206" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="156" y="206" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>

  <!-- grid1 failing-cell markers (grid2 land but grid1 water) -->
  <text x="96"  y="177" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="120" y="201" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="144" y="201" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="120" y="252" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ = grid1 此处为水</text>

  <!-- ===== grid2 background + grid lines (origin 370,110) ===== -->
  <rect x="370" y="110" width="120" height="120" fill="#ffffff" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="394" y1="110" x2="394" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="418" y1="110" x2="418" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="442" y1="110" x2="442" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="466" y1="110" x2="466" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="134" x2="490" y2="134" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="158" x2="490" y2="158" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="182" x2="490" y2="182" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="206" x2="490" y2="206" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- grid2 island ① green: (0,0)(0,1)(0,2)(1,2)(1,3)(1,4) -->
  <rect x="370" y="110" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="394" y="110" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="418" y="110" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="418" y="134" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="442" y="134" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="466" y="134" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="127" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">①</text>

  <!-- grid2 island ② red: (2,1) -->
  <rect x="394" y="158" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="175" text-anchor="middle" font-size="11" fill="#7a3030" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="406" y="177" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- grid2 island ③ green: (3,0) -->
  <rect x="370" y="182" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="199" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">③</text>

  <!-- grid2 island ④ red: (3,2)(3,3)(4,3) -->
  <rect x="418" y="182" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="442" y="182" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="442" y="206" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="199" text-anchor="middle" font-size="11" fill="#7a3030" font-weight="bold" filter="url(#rough2)">④</text>
  <text x="430" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="454" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- grid2 island ⑤ green: (4,1) -->
  <rect x="394" y="206" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="223" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">⑤</text>

  <!-- legend -->
  <rect x="60" y="280" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="302" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">
    ① ✓ 子岛屿（6 格 grid1 全为 1）  ② ✗ 非子岛屿（grid1[2][1]=0）
  </text>
  <text x="290" y="322" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">
    ③ ✓ 子岛屿  ④ ✗ 非子岛屿（grid1[3][2]=grid1[3][3]=0）  ⑤ ✓ 子岛屿
  </text>

  <!-- summary -->
  <rect x="120" y="360" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="385" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">
    子岛屿 = ① + ③ + ⑤ = 3
  </text>

  <text x="290" y="425" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    红岛即使只有 1 格不在 grid1 陆地上，整座岛都不算子岛屿
  </text>
</svg>
