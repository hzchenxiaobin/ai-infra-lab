<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：两侧最近更大元素夹出 nums[i] 的「统治区间」</text>

  <!-- array cells -->
  <text x="98" y="64" text-anchor="end" font-size="12" fill="#999" filter="url(#rough2)">nums =</text>
  <rect x="160" y="44" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="216" y="44" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="64" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="272" y="44" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="328" y="44" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="384" y="44" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="64" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- indices -->
  <text x="188" y="94" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="244" y="94" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="300" y="94" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="356" y="94" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="412" y="94" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>

  <!-- left virtual fence -->
  <path d="M 156 38 L 156 80" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="148" y="52" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">左侧无更大</text>
  <text x="148" y="67" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">left = −1</text>

  <!-- right blocker annotation -->
  <path d="M 442 59 L 450 59" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="456" y="53" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6 &gt; 5 是墙</text>
  <text x="456" y="69" font-size="11" fill="#b85450" filter="url(#rough2)">right = 4</text>

  <!-- bracket under cells 0..3 -->
  <path d="M 160 104 L 160 116 L 384 116 L 384 104" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="272" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">nums[1]=5 的最大区间 [0, 3]，长度 4</text>

  <!-- insight box -->
  <rect x="40" y="152" width="520" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="175" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">墙内畅通：(left, right) 内所有元素都 &lt; nums[i]，它就是这段的最大值</text>
  <text x="300" y="196" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">墙外受阻：两端第一个更大的元素不可逾越，扩张必须止步</text>

  <!-- formula box -->
  <rect x="90" y="228" width="420" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="251" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">ans[i] = right[i] − left[i] − 1 = 4 − (−1) − 1 = 4</text>

  <!-- second example -->
  <text x="300" y="290" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">再如 nums[2]=4：left = 1（被 5 挡）、right = 4（被 6 挡）→ ans = 4 − 1 − 1 = 2</text>

  <!-- footnotes -->
  <text x="30" y="326" font-size="10.5" fill="#999" filter="url(#rough2)">left[i]：左侧最近更大元素下标，无则记 −1；right[i]：右侧最近更大元素下标，无则记 n —— 哨兵统一边界公式，免特判</text>
  <text x="30" y="344" font-size="10.5" fill="#999" filter="url(#rough2)">与 84. 柱状图中最大的矩形 同构：那里找两侧最近更矮夹出矩形，这里找两侧最近更高夹出「统治区间」</text>
</svg>
