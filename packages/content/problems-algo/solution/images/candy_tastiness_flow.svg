<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 二分答案，check(d) 贪心验证</text>

  <!-- Step 1: sort -->
  <rect x="190" y="44" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">排序 price（O(n log n)）</text>
  <path d="M 280 80 L 280 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="170" y="104" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo=0, hi=price[n-1]-price[0], ans=0</text>
  <path d="M 280 140 L 280 162" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: loop condition -->
  <polygon points="280,164 380,210 280,256 180,210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo ≤ hi ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#888">循环</text>

  <!-- No branch -> return -->
  <path d="M 380 210 L 470 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="204" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="194" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="510" y="216" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Yes branch: mid -->
  <path d="M 280 256 L 280 278" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="272" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="200" y="282" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mid = (lo + hi) / 2</text>
  <path d="M 280 316 L 280 338" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: check(mid) -->
  <polygon points="280,340 410,386 280,432 150,386" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">check(mid): 贪心选 k 颗</text>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">相邻差都 ≥ mid ?</text>

  <!-- Yes: feasible -->
  <path d="M 150 386 L 60 386 L 60 326" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="378" font-size="11" fill="#4a7a3a" font-weight="bold">可行</text>
  <rect x="20" y="300" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans=mid</text>
  <text x="60" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">lo=mid+1</text>
  <!-- loop back arrow to diamond -->
  <path d="M 60 300 L 60 210 L 180 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="256" font-size="10" fill="#4a7a3a">向右找更大</text>

  <!-- No: infeasible -->
  <path d="M 410 386 L 500 386 L 500 326" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="378" font-size="11" fill="#b85450" font-weight="bold">不可行</text>
  <rect x="460" y="300" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="500" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">hi=mid-1</text>
  <path d="M 500 300 L 500 210 L 380 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="506" y="256" font-size="10" fill="#b85450">向左收紧</text>

  <!-- check detail box (bottom-left) -->
  <rect x="20" y="356" width="0" height="0" fill="none"/>
</svg>
