<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：4 个员工逐对判定 → 输出 3 行（红竖带 = 两班共存的时刻）</text>

  <path d="M 100 50 L 460 50" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 100 46 L 100 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 160 46 L 160 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 220 46 L 220 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 280 46 L 280 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 340 46 L 340 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 400 46 L 400 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 460 46 L 460 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="42" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">08:00</text>
  <text x="160" y="42" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">10</text>
  <text x="220" y="42" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">12</text>
  <text x="280" y="42" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">14</text>
  <text x="340" y="42" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">16</text>
  <text x="400" y="42" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">18</text>
  <text x="460" y="42" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">20</text>

  <text x="48" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">员工 1</text>
  <text x="48" y="108" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">3 个班次</text>

  <rect x="190" y="64" width="30" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="280" y="64" width="30" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="100" y="66" width="120" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="77" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">s1 08–12</text>
  <rect x="190" y="84" width="120" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="95" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">s2 11–15</text>
  <rect x="280" y="102" width="120" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340" y="113" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">s3 14–18</text>
  <text x="472" y="86" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">(s1,s2): 12&gt;11 ✓</text>
  <text x="472" y="100" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">(s2,s3): 15&gt;14 ✓</text>
  <text x="472" y="114" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">(s1,s3): 12&gt;14 ✗</text>
  <text x="560" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 2 对</text>

  <path d="M 90 138 L 460 138" stroke="#dddddd" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <text x="48" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">员工 2</text>
  <text x="48" y="186" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">2 个班次</text>

  <rect x="340" y="146" width="30" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="148" width="240" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="159" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">s1 09–17</text>
  <rect x="340" y="168" width="120" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="400" y="179" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">s2 16–20</text>
  <text x="472" y="166" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">(s1,s2): 17&gt;16 ✓</text>
  <text x="560" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 1 对</text>

  <path d="M 90 216 L 460 216" stroke="#dddddd" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <text x="48" y="250" text-anchor="middle" font-size="11" fill="#999999" font-weight="bold" filter="url(#rough2)">员工 3</text>
  <text x="48" y="264" text-anchor="middle" font-size="8.5" fill="#999999" filter="url(#rough2)">3 个班次</text>

  <rect x="160" y="224" width="60" height="14" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="235" text-anchor="middle" font-size="8" fill="#999999" filter="url(#rough2)">s1 10–12</text>
  <rect x="250" y="242" width="60" height="14" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="253" text-anchor="middle" font-size="8" fill="#999999" filter="url(#rough2)">s2 13–15</text>
  <rect x="340" y="260" width="60" height="14" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="370" y="271" text-anchor="middle" font-size="8" fill="#999999" filter="url(#rough2)">s3 16–18</text>
  <text x="472" y="244" text-anchor="start" font-size="9.5" fill="#999999" filter="url(#rough2)">(s1,s2): 12&gt;13 ✗</text>
  <text x="472" y="258" text-anchor="start" font-size="9.5" fill="#999999" filter="url(#rough2)">(s2,s3): 15&gt;16 ✗</text>
  <text x="472" y="272" text-anchor="start" font-size="9.5" fill="#999999" filter="url(#rough2)">(s1,s3): 12&gt;16 ✗</text>
  <text x="560" y="258" text-anchor="middle" font-size="11" fill="#999999" font-weight="bold" filter="url(#rough2)">0 对</text>
  <text x="560" y="272" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">不输出</text>

  <path d="M 90 294 L 460 294" stroke="#dddddd" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <text x="48" y="328" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">员工 4</text>
  <text x="48" y="342" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">2 个班次</text>

  <rect x="130" y="302" width="30" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="100" y="304" width="60" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="315" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">s1 08–10</text>
  <rect x="130" y="324" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="335" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">s2 09–11</text>
  <text x="472" y="322" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">(s1,s2): 10&gt;09 ✓</text>
  <text x="560" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 1 对</text>

  <rect x="170" y="374" width="150" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="245" y="386" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">employee_id</text>
  <rect x="320" y="374" width="150" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="395" y="386" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">overlapping_shifts</text>

  <rect x="170" y="391" width="150" height="16" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="403" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="391" width="150" height="16" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="403" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="170" y="407" width="150" height="16" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="419" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="407" width="150" height="16" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="419" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="170" y="423" width="150" height="16" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="435" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="320" y="423" width="150" height="16" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="435" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>

  <text x="95" y="395" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出</text>
  <text x="95" y="410" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">（升序）</text>
</svg>
