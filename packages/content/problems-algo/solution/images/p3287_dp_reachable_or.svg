<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">值域背包：dp[c][s] = 已扫元素中恰选 c 个、OR 出 s（值域仅 2⁷ = 128 个桶）</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示意：前缀 [4, 2] 之后吃进 v = 5（k = 2），只画 s ∈ [0, 8)</text>

  <!-- 列标签 -->
  <text x="60" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">选 c 个 ↓</text>
  <text x="254" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">OR 值 s →</text>

  <text x="128" y="80" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="164" y="80" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="200" y="80" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="236" y="80" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="272" y="80" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="308" y="80" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="344" y="80" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>

  <!-- 行标签 -->
  <text x="92" y="107" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">c=0</text>
  <text x="92" y="141" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">c=1</text>
  <text x="92" y="175" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">c=2</text>

  <!-- 网格：3 行 × 8 列，起点 (110, 88)，格 36×34 -->
  <g stroke="#c9d4e0" stroke-width="1.1" filter="url(#rough2)">
    <rect x="110" y="88" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="146" y="88" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="182" y="88" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="218" y="88" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="254" y="88" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="290" y="88" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="326" y="88" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="362" y="88" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="110" y="122" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="146" y="122" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="182" y="122" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="218" y="122" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="254" y="122" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="290" y="122" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="326" y="122" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="362" y="122" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="110" y="156" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="146" y="156" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="182" y="156" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="218" y="156" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="254" y="156" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="290" y="156" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="326" y="156" width="36" height="34" fill="#ffffff" rx="3"/>
    <rect x="362" y="156" width="36" height="34" fill="#ffffff" rx="3"/>
  </g>

  <!-- 旧可达（蓝） -->
  <text x="128" y="110" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="200" y="144" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="272" y="144" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="344" y="178" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 吃进 v=5 新增（橙） -->
  <rect x="290" y="122" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="308" y="144" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="290" y="156" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="308" y="178" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="362" y="156" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="380" y="178" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 转移箭头 -->
  <path d="M 136 108 C 220 108, 290 122, 302 128" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 208 144 C 260 150, 330 156, 372 162" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 278 144 C 286 150, 296 156, 302 162" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吃进 v=5</text>
  <text x="440" y="146" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">s → s|5</text>

  <!-- 图例 -->
  <rect x="118" y="204" width="14" height="14" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="140" y="216" font-size="10.5" fill="#555" filter="url(#rough2)">处理 5 之前已达（如 c=2 行的 6 = 4|2）</text>
  <rect x="118" y="224" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="140" y="236" font-size="10.5" fill="#555" filter="url(#rough2)">本轮新增：dp[c][s|5] |= dp[c−1][s]</text>

  <!-- 两个要点框 -->
  <rect x="40" y="254" width="215" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="147" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">转移：dp[c][s|v] |= dp[c−1][s]</text>
  <text x="147" y="291" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">c 从 k 倒序到 1（每个元素至多用一次）</text>

  <rect x="275" y="254" width="215" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="382" y="273" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">快照：处理完 nums[i] 后</text>
  <text x="382" y="291" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">F[i] = dp[k] 整行，此处 = {5, 6, 7}</text>

  <!-- 底部结论 -->
  <rect x="60" y="316" width="400" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">正向快照得 F[i]，反着再扫一遍得 G[i]（同一套 build，对称）</text>
</svg>
