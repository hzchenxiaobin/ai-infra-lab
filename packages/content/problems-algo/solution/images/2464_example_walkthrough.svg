<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 312" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="420" height="312" fill="#fafafa"/>

  <!-- Title -->
  <text x="210" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：s = "0110101"，红框 = 本秒将互换的 "01"</text>

  <!-- positions axis -->
  <g font-size="9.5" fill="#bbb" text-anchor="middle">
    <text x="87" y="42">0</text><text x="121" y="42">1</text><text x="155" y="42">2</text>
    <text x="189" y="42">3</text><text x="223" y="42">4</text><text x="257" y="42">5</text>
    <text x="291" y="42">6</text>
  </g>

  <!-- ===== Row t=0: 0 1 1 0 1 0 1 ; swap pairs (0,1)(3,4)(5,6) ===== -->
  <text x="24" y="63" font-size="12" fill="#888" font-weight="bold">t=0</text>
  <g font-size="13" text-anchor="middle" fill="#333">
    <rect x="70" y="48" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="87" y="67">0</text>
    <rect x="104" y="48" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="121" y="67">1</text>
    <rect x="138" y="48" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="155" y="67">1</text>
    <rect x="172" y="48" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="189" y="67">0</text>
    <rect x="206" y="48" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="223" y="67">1</text>
    <rect x="240" y="48" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="257" y="67">0</text>
    <rect x="274" y="48" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="291" y="67">1</text>
  </g>
  <rect x="68" y="46" width="72" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="170" y="46" width="72" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="238" y="46" width="72" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <path d="M 210 80 L 210 88" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row t=1: 1 0 1 1 0 1 0 ; swap pairs (1,2)(4,5) ===== -->
  <text x="24" y="109" font-size="12" fill="#888" font-weight="bold">t=1</text>
  <g font-size="13" text-anchor="middle" fill="#333">
    <rect x="70" y="94" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="87" y="113">1</text>
    <rect x="104" y="94" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="121" y="113">0</text>
    <rect x="138" y="94" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="155" y="113">1</text>
    <rect x="172" y="94" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="189" y="113">1</text>
    <rect x="206" y="94" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="223" y="113">0</text>
    <rect x="240" y="94" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="257" y="113">1</text>
    <rect x="274" y="94" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="291" y="113">0</text>
  </g>
  <rect x="102" y="92" width="72" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="204" y="92" width="72" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <path d="M 210 126 L 210 134" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row t=2: 1 1 0 1 1 0 0 ; swap pair (2,3) ===== -->
  <text x="24" y="155" font-size="12" fill="#888" font-weight="bold">t=2</text>
  <g font-size="13" text-anchor="middle" fill="#333">
    <rect x="70" y="140" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="87" y="159">1</text>
    <rect x="104" y="140" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="121" y="159">1</text>
    <rect x="138" y="140" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="155" y="159">0</text>
    <rect x="172" y="140" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="189" y="159">1</text>
    <rect x="206" y="140" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="223" y="159">1</text>
    <rect x="240" y="140" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="257" y="159">0</text>
    <rect x="274" y="140" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="291" y="159">0</text>
  </g>
  <rect x="136" y="138" width="72" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <path d="M 210 172 L 210 180" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row t=3: 1 1 1 0 1 0 0 ; swap pair (3,4) ===== -->
  <text x="24" y="201" font-size="12" fill="#888" font-weight="bold">t=3</text>
  <g font-size="13" text-anchor="middle" fill="#333">
    <rect x="70" y="186" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="87" y="205">1</text>
    <rect x="104" y="186" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="121" y="205">1</text>
    <rect x="138" y="186" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="155" y="205">1</text>
    <rect x="172" y="186" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="189" y="205">0</text>
    <rect x="206" y="186" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="223" y="205">1</text>
    <rect x="240" y="186" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="257" y="205">0</text>
    <rect x="274" y="186" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="291" y="205">0</text>
  </g>
  <rect x="170" y="184" width="72" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <path d="M 210 218 L 210 226" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row t=4: 1 1 1 1 0 0 0 ; no 01 ===== -->
  <text x="24" y="247" font-size="12" fill="#888" font-weight="bold">t=4</text>
  <g font-size="13" text-anchor="middle" fill="#333">
    <rect x="70" y="232" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="87" y="251">1</text>
    <rect x="104" y="232" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="121" y="251">1</text>
    <rect x="138" y="232" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="155" y="251">1</text>
    <rect x="172" y="232" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="189" y="251">1</text>
    <rect x="206" y="232" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="223" y="251">0</text>
    <rect x="240" y="232" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="257" y="251">0</text>
    <rect x="274" y="232" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="291" y="251">0</text>
  </g>

  <!-- conclusion -->
  <rect x="70" y="274" width="280" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="291" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">无 "01" 存在 → 结束，答案 = 4</text>
</svg>
