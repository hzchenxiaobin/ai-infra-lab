  <text x="146" y="226" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">子矩阵 = 行 x..x+k−1 × 列 y..y+k−1</text>
  <text x="406" y="226" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">行 0 与列 3 原封不动</text>

  <text x="165" y="250" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">双指针相向而行</text>

  <rect x="100" y="260" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="277" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">顶行 · l = x</text>
  <rect x="100" y="292" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="309" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">中间行（不动）</text>
  <rect x="100" y="324" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="341" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">底行 · r = x+k−1</text>

  <path d="M 242 273 L 242 337" stroke="#4a7a3a" stroke-width="1.8" marker-start="url(#arrg)" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="252" y="309" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">swap</text>
  <text x="252" y="324" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">列段</text>

  <rect x="330" y="258" width="182" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="421" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每轮交换两行的</text>
  <text x="421" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">列段 [y, y+k−1]</text>
  <text x="421" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">然后 l++ · r−−</text>
  <text x="421" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">直到 l ≥ r 结束</text>
