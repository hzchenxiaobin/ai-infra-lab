  <rect x="68" y="110" width="115" height="98" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="68" y="106" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(x, y) 左上角</text>

  <text x="276" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">垂直翻转</text>
  <path d="M 232 148 L 318 148" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="276" y="168" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k×k 子矩阵</text>

  <rect x="330" y="80" width="38" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="368" y="80" width="38" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="406" y="80" width="38" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
