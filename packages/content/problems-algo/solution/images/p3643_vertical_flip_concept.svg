  <text x="127" y="74" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="165" y="74" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="203" y="74" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="62" y="100" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">0</text>
