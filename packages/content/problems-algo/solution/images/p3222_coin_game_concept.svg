<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：115 的凑法唯一，每步固定扣 1 枚 75 币 + 4 枚 10 币</text>

  <!-- 左：唯一分解 -->
  <rect x="20" y="44" width="232" height="158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="136" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">75a + 10b = 115 ?</text>

  <rect x="36" y="82" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="101" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a = 0 → 115 不是 10 的倍数 ✗</text>

  <rect x="36" y="118" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="137" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a = 1 → b = 4 ✓ 唯一解</text>

  <rect x="36" y="154" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="173" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a ≥ 2 → 150 &gt; 115 ✗</text>

  <!-- 右：两种库存 -->
  <rect x="278" y="44" width="222" height="158" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="389" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">两种库存</text>

  <text x="333" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x 枚</text>
  <circle cx="333" cy="118" r="12" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="333" y="122" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">75</text>
  <circle cx="333" cy="140" r="12" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="333" y="144" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">75</text>
  <text x="333" y="172" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">每步 −1</text>

  <text x="445" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">y 枚</text>
  <circle cx="445" cy="118" r="12" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="445" y="122" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10</text>
  <circle cx="445" cy="140" r="12" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="445" y="144" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10</text>
  <text x="445" y="172" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">每步 −4</text>

  <!-- 汇合箭头 -->
  <path d="M 136 204 C 136 218, 190 218, 224 228" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 389 204 C 389 218, 330 218, 296 228" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 短板公式 -->
  <rect x="60" y="232" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">总步数 k = min(x, ⌊y/4⌋)：75 币撑 x 步，10 币撑 ⌊y/4⌋ 步</text>

  <!-- 结论 -->
  <rect x="60" y="290" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">拿法唯一 ⇒ 双方零选择 ⇒「最优策略」是纸老虎，胜负只看奇偶</text>
</svg>
