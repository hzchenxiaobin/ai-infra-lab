<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：哈希数频率 → 枚举小尺寸 x → O(1) 判定累加</text>

  <!-- step 1 -->
  <rect x="60" y="48" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="73" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">① 哈希统计频率 freq</text>

  <path d="M 150 92 L 150 112" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <rect x="60" y="116" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="141" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">② minFreq = 最小频率</text>

  <path d="M 150 160 L 150 180" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="60" y="184" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="209" text-anchor="middle" font-size="12" fill="#8a6414" filter="url(#rough2)">③ 枚举 x = 1 … minFreq</text>

  <path d="M 244 204 L 288 204" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- step 4: inner loop -->
  <rect x="292" y="150" width="238" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="411" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5c22" filter="url(#rough2)">④ 对每个频率 f（固定 x）</text>
  <g filter="url(#rough2)" font-size="12" fill="#2e5c22">
    <text x="411" y="194" text-anchor="middle">g = ⌈f / (x+1)⌉   （最少盒数）</text>
    <text x="411" y="216" text-anchor="middle">若 g·x &gt; f → x 不可行，break</text>
    <text x="411" y="238" text-anchor="middle">否则 total += g</text>
  </g>

  <path d="M 411 262 L 411 288 L 150 288 L 150 306" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- step 5 decision -->
  <polygon points="150,310 232,344 150,378 68,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="340" text-anchor="middle" font-size="12" fill="#8a6414" filter="url(#rough2)">所有 f 都可行？</text>
  <text x="150" y="358" text-anchor="middle" font-size="12" fill="#8a6414" filter="url(#rough2)">ans = min(ans, total)</text>

  <path d="M 232 344 L 292 344" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="248" y="336" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">否</text>
  <path d="M 330 344 L 396 344" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- back edge: yes -> next x -->
  <path d="M 150 378 L 150 386 L 30 386 L 30 204 L 52 204" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="38" y="300" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)" transform="rotate(-90 38 300)">是 → 试下一个 x</text>

  <!-- step 6 -->
  <rect x="400" y="322" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475" y="341" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">枚举完返回 ans</text>
  <text x="475" y="358" text-anchor="middle" font-size="11" fill="#2c4a6e" filter="url(#rough2)">（x=1 恒可行，必有解）</text>
</svg>
