<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：5 个矩形拼成 (1,1)–(4,4) 完美矩形</text>

  <!-- Grid coordinate system -->
  <text x="90"  y="312" font-size="9" fill="#888">1</text>
  <text x="190" y="312" font-size="9" fill="#888">3</text>
  <text x="240" y="312" font-size="9" fill="#888">4</text>
  <text x="140" y="312" font-size="9" fill="#888">2</text>
  <text x="82"  y="294" font-size="9" fill="#888">1</text>
  <text x="82"  y="244" font-size="9" fill="#888">2</text>
  <text x="82"  y="194" font-size="9" fill="#888">3</text>
  <text x="82"  y="144" font-size="9" fill="#888">4</text>

  <!-- Axes -->
  <line x1="90"  y1="300" x2="260" y2="300" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90"  y1="300" x2="90"  y2="130" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 5 rectangles: origin (90,290), cell 50px; y grows up -->
  <!-- R1 [1,1,3,3]: (1,1)-(3,3) -->
  <rect x="90"  y="190" width="100" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="244" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">R1</text>
  <text x="140" y="258" text-anchor="middle" font-size="8" fill="#446688">area=4</text>

  <!-- R2 [3,1,4,2]: (3,1)-(4,2) -->
  <rect x="190" y="240" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="268" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">R2</text>
  <text x="215" y="280" text-anchor="middle" font-size="7" fill="#4a7a3a">1</text>

  <!-- R3 [3,2,4,4]: (3,2)-(4,4) -->
  <rect x="190" y="140" width="50" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="190" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">R3</text>
  <text x="215" y="204" text-anchor="middle" font-size="7" fill="#d6a040">2</text>

  <!-- R4 [1,3,2,4]: (1,3)-(2,4) -->
  <rect x="90"  y="140" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="168" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">R4</text>
  <text x="115" y="180" text-anchor="middle" font-size="7" fill="#b85450">1</text>

  <!-- R5 [2,3,3,4]: (2,3)-(3,4) -->
  <rect x="140" y="140" width="50" height="50" fill="#f6f6f6" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="168" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">R5</text>
  <text x="165" y="180" text-anchor="middle" font-size="7" fill="#555">1</text>

  <!-- Bounding box dashed -->
  <rect x="90" y="140" width="150" height="150" fill="none" stroke="#333" stroke-width="2.2" stroke-dasharray="6,3" filter="url(#rough2)"/>

  <!-- 4 outer corners (red, remain in set) -->
  <circle cx="90"  cy="290" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="240" cy="290" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="90"  cy="140" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="240" cy="140" r="5" fill="#b85450" filter="url(#rough2)"/>

  <!-- Interior corners that cancel (blue) -->
  <circle cx="190" cy="290" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="190" cy="240" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="190" cy="190" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="140" cy="190" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="90"  cy="190" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="190" cy="140" r="4" fill="#446688" filter="url(#rough2)"/>

  <!-- Right side: checks -->
  <text x="300" y="86" font-size="11" fill="#444" font-weight="bold">面积校验</text>
  <rect x="300" y="96" width="240" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="312" y="116" font-family="monospace" font-size="10" fill="#555">area_sum = 4+1+2+1+1</text>
  <text x="312" y="132" font-family="monospace" font-size="10" fill="#d6a040" font-weight="bold">         = 9</text>
  <text x="312" y="146" font-family="monospace" font-size="10" fill="#555">bbox 3×3 = 9   ✓</text>

  <text x="300" y="186" font-size="11" fill="#444" font-weight="bold">顶点 XOR 校验</text>
  <rect x="300" y="196" width="240" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="312" y="214" font-size="9" fill="#888">内部点 ×2/×4 → 抵消</text>
  <text x="312" y="232" font-family="monospace" font-size="9" fill="#446688">(3,1)×2 (3,2)×2 (3,3)×2</text>
  <text x="312" y="246" font-family="monospace" font-size="9" fill="#446688">(2,3)×2 (1,3)×2 (3,4)×2</text>
  <text x="312" y="264" font-size="9" fill="#888">外框 4 角 ×1 → 保留</text>
  <text x="312" y="280" font-family="monospace" font-size="9" fill="#b85450" font-weight="bold">corners = 4 角   ✓</text>

  <!-- Result -->
  <rect x="40" y="330" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="350" font-size="12" fill="#4a7a3a" font-weight="bold">面积 9 == 9  ∧  顶点集 == 4 外角  →  return true</text>
  <text x="60" y="366" font-size="9" fill="#888">两条件同时成立：无重叠、无空隙，5 块恰好拼满 (1,1)–(4,4)</text>

  <!-- Footer -->
  <rect x="40" y="382" width="500" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="9" fill="#888">遍历 5 矩形 → 20 次顶点翻转，最终集合恰剩 4 个外框角</text>
</svg>
