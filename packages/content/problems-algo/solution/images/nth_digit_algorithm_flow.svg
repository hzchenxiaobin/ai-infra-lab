<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：三步定位——找位数、找数字、找数位</text>

  <!-- Start -->
  <rect x="210" y="44" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333">开始：输入 n</text>
  <path d="M 270 72 L 270 90" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="170" y="92" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="114" text-anchor="middle" font-size="12" fill="#333">len = 1,  start = 1</text>
  <path d="M 270 126 L 270 142" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 1: 找位数 (while loop) ===== -->
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 找位数 d</text>

  <rect x="50" y="160" width="440" height="170" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <path d="M 270 168 L 370 206 L 270 244 L 170 206 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="11" fill="#333">n &gt;</text>
  <text x="270" y="216" text-anchor="middle" font-size="11" fill="#333">9·start·len ?</text>

  <!-- 是 → body -->
  <path d="M 270 244 L 270 260" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="278" y="256" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- body: update box -->
  <rect x="120" y="262" width="300" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#333">n −= 9·start·len ;  start *= 10</text>
  <text x="270" y="298" text-anchor="middle" font-size="11" fill="#333">len += 1</text>

  <!-- back edge to decision -->
  <path d="M 420 287 L 470 287 L 470 206 L 370 206" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="478" y="250" font-size="10" fill="#4a7a3a">下一层</text>

  <!-- 否 → exit to step 2 -->
  <path d="M 170 206 L 90 206 L 90 348 L 270 348" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="200" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="96" y="276" font-size="10" fill="#b85450">落在</text>
  <text x="96" y="290" font-size="10" fill="#b85450">第 d 层</text>

  <!-- ===== Step 2: 找数字 ===== -->
  <text x="270" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 找数字 num</text>

  <rect x="110" y="378" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="403" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">num = start + (n − 1) // len</text>
  <path d="M 270 418 L 270 436" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: 找数位 ===== -->
  <text x="270" y="452" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 找数位 digit</text>

  <rect x="90" y="464" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="489" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">digit = str(num)[(n − 1) % len]</text>
  <path d="M 270 504 L 270 518" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="190" y="520" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="540" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">return digit</text>
</svg>
