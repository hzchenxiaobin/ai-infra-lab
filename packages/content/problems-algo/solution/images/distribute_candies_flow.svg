<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="240" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希集合统计 + 取 min</text>

  <!-- Step 1: input -->
  <rect x="24" y="92" width="96" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="72" y="116" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">输入 candyType</text>
  <text x="72" y="134" text-anchor="middle" font-size="10" fill="#666">长度 n（偶数）</text>

  <!-- arrow 1 -->
  <path d="M 122 120 L 152 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: hash set -->
  <rect x="156" y="92" width="116" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="214" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">装入哈希集合</text>
  <text x="214" y="130" text-anchor="middle" font-size="10" fill="#666">unordered_set</text>
  <text x="214" y="143" text-anchor="middle" font-size="10" fill="#666">types = {…}</text>

  <!-- arrow 2 -->
  <path d="M 274 120 L 304 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: read size -->
  <rect x="308" y="92" width="100" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="358" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">取 size 与 n/2</text>
  <text x="358" y="130" text-anchor="middle" font-size="10" fill="#666">|unique| = size()</text>
  <text x="358" y="143" text-anchor="middle" font-size="10" fill="#666">half = n / 2</text>

  <!-- arrow 3 -->
  <path d="M 410 120 L 440 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: min return -->
  <rect x="444" y="92" width="96" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="492" y="116" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 min</text>
  <text x="492" y="134" text-anchor="middle" font-size="10" fill="#666">min(|unique|, half)</text>

  <!-- one-liner box -->
  <rect x="80" y="170" width="400" height="50" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Python 一行版</text>
  <text x="280" y="208" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">return min(len(set(candyType)), len(candyType) // 2)</text>
</svg>
