<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">逐个入场 DP：第 i 位表演者的两条出路</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">dp[i][j] = 前 i 位恰好占 j 个节目的方案数（含用了哪几个节目）</text>

  <!-- 源状态 A：占 j-1 个节目 -->
  <rect x="15" y="66" width="170" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[i−1][j−1]</text>
  <rect x="38" y="96" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="112" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">人</text>
  <rect x="68" y="96" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="112" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">人</text>
  <rect x="98" y="96" width="24" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="112" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">空</text>
  <text x="100" y="134" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">前 i−1 人，只占 j−1 个节目</text>

  <!-- 源状态 B：占 j 个节目 -->
  <rect x="15" y="212" width="170" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i−1][j]</text>
  <rect x="38" y="242" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="258" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">人</text>
  <rect x="68" y="242" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="258" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">人</text>
  <rect x="98" y="242" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="258" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">人</text>
  <text x="100" y="280" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">前 i−1 人，已占 j 个节目</text>

  <!-- 两条转移边 -->
  <path d="M 185 103 C 250 103, 290 130, 342 156" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 185 249 C 250 249, 290 222, 342 198" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="262" y="96" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">新开一个空节目</text>
  <text x="262" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">x − j + 1 种（空节目随便挑）</text>
  <text x="262" y="256" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">挤进已有节目</text>
  <text x="262" y="232" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">j 种（占了的节目随便挑）</text>

  <!-- 第 i 位表演者 -->
  <circle cx="238" cy="176" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="238" y="181" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="238" y="214" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">第 i 位表演者入场</text>

  <!-- 目标状态 -->
  <rect x="345" y="140" width="160" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="160" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[i][j]</text>
  <rect x="362" y="170" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="187" text-anchor="middle" font-size="8" fill="#8a6a20" filter="url(#rough2)">人</text>
  <rect x="394" y="170" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="407" y="187" text-anchor="middle" font-size="8" fill="#8a6a20" filter="url(#rough2)">人</text>
  <rect x="426" y="170" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="439" y="187" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold" filter="url(#rough2)">i!</text>
  <text x="425" y="214" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">占满 j 个节目（谁进来都行）</text>

  <!-- 底部递推式 -->
  <rect x="15" y="296" width="490" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i][j] = j · dp[i−1][j] + (x − j + 1) · dp[i−1][j−1]</text>
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">边界 dp[0][0] = 1；答案 = Σ dp[n][k] · y^k（打分独立，最后统一乘）</text>
</svg>
