<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：4 条边 = 4 个容量为 target 的桶</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">total % 4 == 0，target = total / 4；每根火柴归一条边，边长恰为 target</text>

  <!-- ===== Top: matchsticks array ===== -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">matchsticks = [1, 1, 2, 2, 2]</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="60"  y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="80"  y="108" fill="#446688">1</text>
    <rect x="100" y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="120" y="108" fill="#446688">1</text>
    <rect x="140" y="86" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="160" y="108" fill="#b85450">2</text>
    <rect x="180" y="86" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="200" y="108" fill="#b85450">2</text>
    <rect x="220" y="86" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="240" y="108" fill="#b85450">2</text>
  </g>

  <!-- ===== Formula box ===== -->
  <rect x="290" y="80" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="365" y="100" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">total = 8,  k = 4</text>
  <text x="365" y="118" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">target = 8 / 4 = 2</text>

  <!-- arrow down -->
  <path d="M 160 128 L 160 146" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="144" font-size="10" fill="#888">拼成边长为 2 的正方形</text>

  <!-- ===== Square with 4 edges ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <!-- top edge: {2} -->
    <rect x="170" y="156" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="230" y="162" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="260" y="179" fill="#b85450">2</text>
    <text x="350" y="178" font-size="10.5" fill="#4a7a3a">=2 ✓</text>
    <text x="190" y="178" font-size="10" fill="#4a7a3a">上</text>

    <!-- right edge: {2} -->
    <rect x="370" y="192" width="36" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="376" y="232" width="24" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="388" y="257" fill="#b85450">2</text>
    <text x="388" y="200" font-size="10" fill="#4a7a3a">右</text>
    <text x="388" y="304" font-size="9.5" fill="#4a7a3a">=2✓</text>

    <!-- bottom edge: {2} -->
    <rect x="170" y="312" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="230" y="318" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="260" y="335" fill="#b85450">2</text>
    <text x="350" y="334" font-size="10.5" fill="#4a7a3a">=2 ✓</text>
    <text x="190" y="334" font-size="10" fill="#4a7a3a">下</text>

    <!-- left edge: {1,1} -->
    <rect x="134" y="192" width="36" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="140" y="218" width="24" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="152" y="238" fill="#446688">1</text>
    <rect x="140" y="256" width="24" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="152" y="276" fill="#446688">1</text>
    <text x="152" y="200" font-size="10" fill="#4a7a3a">左</text>
    <text x="152" y="304" font-size="9.5" fill="#4a7a3a">=2✓</text>
  </g>

  <!-- ===== Pruning summary ===== -->
  <line x1="20" y1="356" x2="520" y2="356" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="362" width="490" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="381" font-size="11" fill="#d6a040" font-weight="bold">k=4 固定 → 套用 698 桶填充回溯：降序排序 + 跳过同容量边 + 空边失败即停</text>
</svg>
