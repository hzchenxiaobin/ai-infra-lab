<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：可行性随 k 单调 —— 二分找第一个「✓」</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">查询一条条累加，每个下标的「可减券总量」只增不减：前 k 条可行 → 前 k+1 条也可行</text>

  <!-- 答案标签 -->
  <rect x="244" y="92" width="54" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="271" y="107" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">答案</text>
  <path d="M 271 114 L 271 146" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 单调性弧线箭头 -->
  <path d="M 317 132 C 345 104 427 104 455 132" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="386" y="98" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">可行 → 永远可行</text>

  <!-- k=0..3 不可行 -->
  <rect x="66" y="150" width="42" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="87" y="178" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="112" y="150" width="42" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="133" y="178" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="158" y="150" width="42" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="179" y="178" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="204" y="150" width="42" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="225" y="178" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- k=4 答案（加粗） -->
  <rect x="250" y="150" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="271" y="178" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- k=5..8 可行 -->
  <rect x="296" y="150" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="317" y="178" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="342" y="150" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="363" y="178" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="388" y="150" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="409" y="178" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="434" y="150" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="455" y="178" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- k 刻度 -->
  <text x="87" y="212" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=0</text>
  <text x="133" y="212" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=1</text>
  <text x="179" y="212" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=2</text>
  <text x="225" y="212" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=3</text>
  <text x="271" y="212" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">k=4</text>
  <text x="317" y="212" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=5</text>
  <text x="363" y="212" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=6</text>
  <text x="409" y="212" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=7</text>
  <text x="455" y="212" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=8</text>

  <!-- k 轴 -->
  <path d="M 60 234 L 484 234" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="250" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">k（顺序处理查询的条数）</text>

  <!-- 二分过程 -->
  <rect x="24" y="262" width="472" height="76" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="280" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">二分过程示意（上例 q = 8：先验 check(8) = ✓，再在 [0, 8] 里找最小）</text>
  <text x="34" y="298" font-size="10.5" fill="#333" filter="url(#rough2)">① mid = 4：check(4) = ✓ → 答案 ≤ 4，hi = 4，继续往左找</text>
  <text x="34" y="316" font-size="10.5" fill="#333" filter="url(#rough2)">② mid = 2：check(2) = ✗ → 答案 &gt; 2，lo = 3，往右补量</text>
  <text x="34" y="334" font-size="10.5" fill="#333" filter="url(#rough2)">③ mid = 3：check(3) = ✗ → lo = 4 = hi，收敛：答案 = 4</text>

  <!-- 底部边界注 -->
  <rect x="24" y="348" width="472" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="34" y="366" font-size="10.5" fill="#333" filter="url(#rough2)">两个出口：nums 全零 → check(0) 成立，答案 0；check(q) 失败 → 返回 −1。</text>
  <text x="34" y="384" font-size="10.5" fill="#666" filter="url(#rough2)">check(k) 的内核 = 3355 的差分判定：打点 O(k) + 前缀和逐位比较 O(n)。</text>
</svg>
