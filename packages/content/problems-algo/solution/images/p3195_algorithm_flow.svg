<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描，维护四个极值变量</text>

  <!-- start -->
  <rect x="70" y="50" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="160" y="72" text-anchor="middle" font-size="12.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">初始化极值</text>
  <text x="290" y="72" font-size="11" fill="#777" filter="url(#rough2)">minR=minC=+∞, maxR=maxC=−∞</text>

  <line x1="160" y1="84" x2="160" y2="106" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop box -->
  <rect x="70" y="108" width="180" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="130" text-anchor="middle" font-size="12.5" fill="#2c4a6b" filter="url(#rough2)">枚举每个格子 (i, j)</text>
  <text x="290" y="130" font-size="11" fill="#777" filter="url(#rough2)">i = 0..m−1, j = 0..n−1</text>

  <line x1="160" y1="142" x2="160" y2="164" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="160,166 254,206 160,246 66,206" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="202" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">grid[i][j] == 1 ?</text>
  <text x="160" y="220" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">(v == 1)</text>

  <!-- yes branch: right -->
  <line x1="254" y1="206" x2="330" y2="206" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="198" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="332" y="170" width="200" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="432" y="192" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">收紧四个变量：</text>
  <text x="432" y="210" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">minR = min(minR, i)</text>
  <text x="432" y="226" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">maxR = max(maxR, i)</text>
  <text x="432" y="242" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">(minC, maxC 同理用 j)</text>

  <!-- no branch: down -->
  <line x1="160" y1="246" x2="160" y2="268" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="262" font-size="11.5" fill="#999" filter="url(#rough2)">否，跳过</text>

  <!-- back edge from yes box down to loop -->
  <path d="M 532 206 L 548 206 L 548 125 L 250 125" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="452" y="118" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">继续枚举下一格</text>

  <line x1="160" y1="268" x2="160" y2="290" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- scan done -->
  <rect x="70" y="292" width="180" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="314" text-anchor="middle" font-size="12.5" fill="#2c4a6b" filter="url(#rough2)">扫描结束（必有 1）</text>
  <line x1="250" y1="309" x2="300" y2="309" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="302" y="272" width="230" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="417" y="294" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">高 = maxR − minR + 1</text>
  <text x="417" y="312" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">宽 = maxC − minC + 1</text>
  <text x="417" y="336" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 高 × 宽</text>
</svg>
