<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态转移：从上一字符位置 k 旋转到当前字符位置 j（环上取较短方向）</text>

  <!-- Linear strip of n=8 positions (ring unrolled) -->
  <!-- cell i: x = 46 + i*42, w=42, h=40, y=170 -->
  <text x="46" y="162" font-size="10" fill="#888">ring 展开为线性（首尾 0 与 7 相邻）:</text>

  <rect x="46"  y="170" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="67"  y="195" text-anchor="middle" font-size="13" fill="#333">0</text>

  <rect x="88"  y="170" width="42" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">k=1</text>

  <rect x="130" y="170" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="151" y="195" text-anchor="middle" font-size="13" fill="#333">2</text>

  <rect x="172" y="170" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="193" y="195" text-anchor="middle" font-size="13" fill="#333">3</text>

  <rect x="214" y="170" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="235" y="195" text-anchor="middle" font-size="13" fill="#333">4</text>

  <rect x="256" y="170" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="277" y="195" text-anchor="middle" font-size="13" fill="#333">5</text>

  <rect x="298" y="170" width="42" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">j=6</text>

  <rect x="340" y="170" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="361" y="195" text-anchor="middle" font-size="13" fill="#333">7</text>

  <!-- Wrap adjacency hint: dashed link below between cell 0 and cell 7 -->
  <path d="M 67 212 C 67 250, 361 250, 361 212" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="214" y="252" text-anchor="middle" font-size="10" fill="#888">首尾相邻（环形）</text>

  <!-- Direct arc above: k=1 -> j=6, length |j-k| = 5 -->
  <path d="M 109 168 C 109 110, 319 110, 319 168" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="178" y="104" width="72" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="214" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">直接 |j−k|=5</text>

  <!-- Wrap arc below: k=1 -> j=6 via wrap, length n-|j-k| = 3 (shorter) -->
  <path d="M 109 212 C 109 300, 319 300, 319 212" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="170" y="294" width="88" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="214" y="309" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">绕行 n−|j−k|=3 ✓</text>

  <!-- Formula box on the right -->
  <rect x="398" y="104" width="112" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="454" y="124" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">距离公式</text>
  <text x="454" y="146" text-anchor="middle" font-size="11" fill="#333">dist(k, j) =</text>
  <text x="454" y="164" text-anchor="middle" font-size="11" fill="#333">min(|j−k|,</text>
  <text x="454" y="180" text-anchor="middle" font-size="11" fill="#333">n−|j−k|)</text>

  <rect x="398" y="200" width="112" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="454" y="220" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">转移方程</text>
  <text x="454" y="240" text-anchor="middle" font-size="10" fill="#333">dp[i][j] =</text>
  <text x="454" y="256" text-anchor="middle" font-size="10" fill="#333">min_k { dp[i−1][k]</text>
  <text x="454" y="270" text-anchor="middle" font-size="10" fill="#333">+ dist(k,j) } + 1</text>
  <text x="454" y="282" text-anchor="middle" font-size="9" fill="#888">+1 = 按按钮</text>

  <!-- Legend -->
  <rect x="40" y="40" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="52" font-size="10" fill="#555">k：上一字符所在位置</text>
  <rect x="180" y="40" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="52" font-size="10" fill="#555">j：当前要拼的字符位置</text>
</svg>
