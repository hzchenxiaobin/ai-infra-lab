<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4,5,2,8,9,1,3]，从右往左累加</text>

  <!-- 表头 -->
  <rect x="36" y="38" width="448" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="120" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="222" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">mx = max(nums[i..6])</text>
  <text x="310" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans 累积</text>
  <text x="424" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">记入的段</text>

  <!-- i=6 -->
  <rect x="36" y="64" width="448" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="82" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="120" y="82" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="196" y="67" width="52" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="82" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="310" y="82" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="424" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[5,6]</text>

  <!-- i=5 -->
  <rect x="36" y="90" width="448" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="120" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="222" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="310" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="424" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4,5]</text>

  <!-- i=4：mx 被 9 接管 -->
  <rect x="36" y="116" width="448" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="120" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="196" y="119" width="52" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="134" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="310" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="424" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,4] ← 9 接管</text>

  <!-- i=3 -->
  <rect x="36" y="142" width="448" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="120" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="222" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="310" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">24</text>
  <text x="424" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,3]</text>

  <!-- i=2 -->
  <rect x="36" y="168" width="448" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="222" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="310" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">33</text>
  <text x="424" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2]</text>

  <!-- i=1：完成 -->
  <rect x="36" y="194" width="448" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="222" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="284" y="197" width="52" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="212" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">42</text>
  <text x="424" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,1] ← 完成</text>

  <text x="260" y="246" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">ans = 3+3+9+9+9+9 = 42，恰与路径 0→4→6 的 4×9 + 2×3 = 42 一致</text>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每行执行 ans += mx：把段 [i−1, i] 记为「右侧剩余部分的最大值」</text>

  <rect x="90" y="284" width="340" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1 [1,5,8]：i=2 时 mx=8, ans=8；i=1 时 mx=8, ans=16</text>
  <text x="260" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">答案 16 ✓（路径 0→2 直达，2×8 = 16）</text>

  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">橙色格 = mx 数值发生接管的行；红色格 = 最终答案</text>
</svg>
