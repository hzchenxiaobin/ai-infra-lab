<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, 6, 5, 8]，k = 2</text>

  <!-- 原数组的 bit 展开 -->
  <text x="120" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原数组按位展开：</text>

  <text x="60" y="76" font-size="12" fill="#555">2 =</text>
  <rect x="90" y="60" width="32" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="77" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="122" y="60" width="32" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="77" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="154" y="60" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="77" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="186" y="60" width="32" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="77" text-anchor="middle" font-size="12" fill="#999">0</text>

  <text x="60" y="108" font-size="12" fill="#555">6 =</text>
  <rect x="90" y="92" width="32" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="109" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="122" y="92" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="138" y="109" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="154" y="92" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="109" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="186" y="92" width="32" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="109" text-anchor="middle" font-size="12" fill="#999">0</text>

  <text x="60" y="140" font-size="12" fill="#555">5 =</text>
  <rect x="90" y="124" width="32" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="141" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="122" y="124" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="138" y="141" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="154" y="124" width="32" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="141" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="186" y="124" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="202" y="141" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="60" y="172" font-size="12" fill="#555">8 =</text>
  <rect x="90" y="156" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="106" y="173" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="122" y="156" width="32" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="173" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="154" y="156" width="32" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="173" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="186" y="156" width="32" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="173" text-anchor="middle" font-size="12" fill="#999">0</text>

  <text x="106" y="192" text-anchor="middle" font-size="10" fill="#999">bit3</text>
  <text x="138" y="192" text-anchor="middle" font-size="10" fill="#999">bit2</text>
  <text x="170" y="192" text-anchor="middle" font-size="10" fill="#999">bit1</text>
  <text x="202" y="192" text-anchor="middle" font-size="10" fill="#999">bit0</text>

  <!-- 位计数 -->
  <rect x="250" y="60" width="130" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="315" y="82" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">位库存 cnt[b]</text>
  <text x="315" y="104" text-anchor="middle" font-size="12" fill="#333">bit3 → 1（8）</text>
  <text x="315" y="124" text-anchor="middle" font-size="12" fill="#333">bit2 → 2（6, 5）</text>
  <text x="315" y="144" text-anchor="middle" font-size="12" fill="#333">bit1 → 2（2, 6）</text>
  <text x="315" y="164" text-anchor="middle" font-size="12" fill="#333">bit0 → 1（5）</text>

  <text x="430" y="104" font-size="12" fill="#555">k = 2</text>
  <text x="430" y="124" font-size="11" fill="#999">只选 2 个数</text>
  <text x="430" y="144" font-size="11" fill="#999">每位最多发 min(cnt, 2) 份</text>

  <!-- 贪心过程表 -->
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">高位 → 低位逐位发放（vals 保持降序）：</text>

  <rect x="60" y="236" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="255" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">处理位</text>
  <rect x="150" y="236" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="255" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">份数 c</text>
  <rect x="240" y="236" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="255" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">发给谁</text>
  <rect x="380" y="236" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="255" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">vals 变化</text>

  <rect x="60" y="264" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="282" text-anchor="middle" font-size="12" fill="#333">初始</text>
  <rect x="150" y="264" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="282" text-anchor="middle" font-size="12" fill="#999">—</text>
  <rect x="240" y="264" width="140" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="282" text-anchor="middle" font-size="12" fill="#999">—</text>
  <rect x="380" y="264" width="120" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="282" text-anchor="middle" font-size="12" fill="#333">[0, 0]</text>

  <rect x="60" y="290" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="308" text-anchor="middle" font-size="12" fill="#333">bit3（8）</text>
  <rect x="150" y="290" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="308" text-anchor="middle" font-size="12" fill="#333">min(1,2)=1</text>
  <rect x="240" y="290" width="140" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="308" text-anchor="middle" font-size="12" fill="#333">最大的 1 个</text>
  <rect x="380" y="290" width="120" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="308" text-anchor="middle" font-size="12" fill="#333">[8, 0]</text>

  <rect x="60" y="316" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="334" text-anchor="middle" font-size="12" fill="#333">bit2（4）</text>
  <rect x="150" y="316" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="334" text-anchor="middle" font-size="12" fill="#333">min(2,2)=2</text>
  <rect x="240" y="316" width="140" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="334" text-anchor="middle" font-size="12" fill="#333">最大的 2 个</text>
  <rect x="380" y="316" width="120" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="334" text-anchor="middle" font-size="12" fill="#333">[12, 4]</text>

  <rect x="60" y="342" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="360" text-anchor="middle" font-size="12" fill="#333">bit1（2）</text>
  <rect x="150" y="342" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="360" text-anchor="middle" font-size="12" fill="#333">min(2,2)=2</text>
  <rect x="240" y="342" width="140" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="12" fill="#333">最大的 2 个</text>
  <rect x="380" y="342" width="120" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="360" text-anchor="middle" font-size="12" fill="#333">[14, 6]</text>

  <rect x="60" y="368" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="386" text-anchor="middle" font-size="12" fill="#333">bit0（1）</text>
  <rect x="150" y="368" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="386" text-anchor="middle" font-size="12" fill="#333">min(1,2)=1</text>
  <rect x="240" y="368" width="140" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="386" text-anchor="middle" font-size="12" fill="#333">最大的 1 个</text>
  <rect x="380" y="368" width="120" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="386" text-anchor="middle" font-size="12" fill="#333">[15, 6]</text>

  <!-- 结论 -->
  <rect x="60" y="406" width="440" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">最终选中的两个数：15 和 6</text>
  <text x="280" y="448" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">15² + 6² = 225 + 36 = 261 ✓（与官方答案一致）</text>
</svg>
