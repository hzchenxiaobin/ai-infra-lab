<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：四条边界沿圈走，走完向内收缩 1 格</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">右 → 下 → 左 → 上，收缩，重复，直至 top&gt;bottom 或 left&gt;right</text>

  <!-- ===== 4x4 matrix ===== -->
  <!-- cell 48, origin x=150 y=110 ; cols 150,198,246,294 ; rows 110,158,206,254 ; end x=342 y=302 -->
  <g font-size="15" fill="#333">
    <!-- outer ring (orange) -->
    <rect x="150" y="110" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="174" y="140" text-anchor="middle">1</text>
    <rect x="198" y="110" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="222" y="140" text-anchor="middle">2</text>
    <rect x="246" y="110" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="270" y="140" text-anchor="middle">3</text>
    <rect x="294" y="110" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="318" y="140" text-anchor="middle">4</text>
    <rect x="294" y="158" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="318" y="188" text-anchor="middle">8</text>
    <rect x="294" y="206" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="318" y="236" text-anchor="middle">12</text>
    <rect x="294" y="254" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="318" y="284" text-anchor="middle">16</text>
    <rect x="246" y="254" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="270" y="284" text-anchor="middle">15</text>
    <rect x="198" y="254" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="222" y="284" text-anchor="middle">14</text>
    <rect x="150" y="254" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="174" y="284" text-anchor="middle">13</text>
    <rect x="150" y="206" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="174" y="236" text-anchor="middle">9</text>
    <rect x="150" y="158" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="174" y="188" text-anchor="middle">5</text>
    <!-- inner ring (green) -->
    <rect x="198" y="158" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="222" y="188" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="246" y="158" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="270" y="188" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="246" y="206" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="270" y="236" text-anchor="middle" fill="#4a7a3a" font-weight="bold">11</text>
    <rect x="198" y="206" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="222" y="236" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
  </g>

  <!-- ring labels -->
  <text x="346" y="120" font-size="10" fill="#d6a040" font-weight="bold">外圈</text>
  <text x="346" y="172" font-size="10" fill="#4a7a3a" font-weight="bold">内圈</text>

  <!-- ===== four directional arrows (red) ===== -->
  <!-- right: above top row -->
  <path d="M 162 100 L 332 100" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">① 右</text>
  <!-- down: right of right col -->
  <path d="M 352 122 L 352 292" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="210" font-size="11" fill="#b85450" font-weight="bold">② 下</text>
  <!-- left: below bottom row -->
  <path d="M 330 314 L 160 314" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 左</text>
  <!-- up: left of left col -->
  <path d="M 140 290 L 140 120" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ 上</text>

  <!-- ===== boundary labels (dashed brackets) ===== -->
  <text x="246" y="76" text-anchor="middle" font-size="10" fill="#446688">top</text>
  <line x1="150" y1="82" x2="342" y2="82" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="246" y="356" text-anchor="middle" font-size="10" fill="#446688">bottom</text>
  <line x1="150" y1="348" x2="342" y2="348" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="120" y="106" text-anchor="end" font-size="10" fill="#446688">left</text>
  <line x1="124" y1="110" x2="124" y2="302" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="372" y="106" font-size="10" fill="#446688">right</text>
  <line x1="368" y1="110" x2="368" y2="302" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- legend -->
  <line x1="20" y1="372" x2="540" y2="372" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="382" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="392" font-size="10" fill="#555">外圈（第 1 层）</text>
  <rect x="180" y="382" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="392" font-size="10" fill="#555">内圈（第 2 层）</text>
  <path d="M 320 388 L 360 388" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="392" font-size="10" fill="#555">遍历方向</text>
</svg>
