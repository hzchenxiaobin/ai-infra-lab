<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">删除一次得最大子数组和：两状态 DP</text>

  <!-- State dp0: no deletion -->
  <rect x="50" y="70" width="160" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="130" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp0[i]</text>
  <text x="130" y="110" text-anchor="middle" font-size="11" fill="#555">以 i 结尾</text>
  <text x="130" y="126" text-anchor="middle" font-size="11" fill="#555">未删除任何元素</text>

  <!-- State dp1: one deletion -->
  <rect x="310" y="70" width="160" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="390" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp1[i]</text>
  <text x="390" y="110" text-anchor="middle" font-size="11" fill="#555">以 i 结尾</text>
  <text x="390" y="126" text-anchor="middle" font-size="11" fill="#555">已删 1 个元素</text>

  <!-- dp0 self-loop: extend or restart -->
  <path d="M 130 70 Q 70 36 110 68" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="70" y="44" font-size="10" fill="#4a7a3a">续接/重启</text>

  <!-- dp0 -> dp1: delete arr[i] -->
  <path d="M 210 102 L 310 102" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">删 arr[i]</text>
  <text x="260" y="118" text-anchor="middle" font-size="10" fill="#888">= dp0[i−1]</text>

  <!-- dp1 self-loop: extend with arr[i] -->
  <path d="M 390 70 Q 470 36 410 68" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="430" y="44" font-size="10" fill="#d6a040">续接 arr[i]</text>

  <!-- Transition equations box -->
  <rect x="30" y="160" width="460" height="86" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="182" font-size="12" fill="#446688" font-weight="bold">状态转移：</text>
  <text x="50" y="202" font-size="12" fill="#333">dp0[i] = max(arr[i], dp0[i−1] + arr[i])   ← 普通 Kadane</text>
  <text x="50" y="222" font-size="12" fill="#333">dp1[i] = max(dp0[i−1], dp1[i−1] + arr[i]) ← 删当前 / 已删后续接</text>
  <text x="50" y="240" font-size="11" fill="#888">dp1[0] = −∞（单个元素无法既删又非空）</text>

  <!-- Answer box -->
  <rect x="30" y="262" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">answer = max( max dp0[i], max dp1[i] )</text>

  <!-- Footnote -->
  <rect x="30" y="318" width="460" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#b85450">⚠️ 至多删一次：dp0 覆盖「不删」，dp1 覆盖「删一次」，取两者最大</text>
</svg>
