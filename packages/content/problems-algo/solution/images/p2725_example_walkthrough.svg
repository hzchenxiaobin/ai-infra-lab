<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">三个示例时间线演算</text>

  <!-- 示例1 -->
  <text x="30" y="62" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例1 t=35 cancel=190 fn(4)=8</text>
  <line x1="40" y1="85" x2="530" y2="85" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 刻度 0,35,70,105,140,175 ; 映射 x=50 + ms*1.4 -->
  <!-- 0->50,35->99,70->148,105->197,140->246,175->295, 190->316(cancel) -->
  <g font-size="10" fill="#4a7a3a">
    <line x1="50" y1="75" x2="50" y2="95" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/><text x="50" y="108" text-anchor="middle" filter="url(#rough2)">0</text>
    <line x1="99" y1="77" x2="99" y2="93" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="99" y="108" text-anchor="middle" filter="url(#rough2)">35</text>
    <line x1="148" y1="77" x2="148" y2="93" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="148" y="108" text-anchor="middle" filter="url(#rough2)">70</text>
    <line x1="197" y1="77" x2="197" y2="93" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="197" y="108" text-anchor="middle" filter="url(#rough2)">105</text>
    <line x1="246" y1="77" x2="246" y2="93" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="246" y="108" text-anchor="middle" filter="url(#rough2)">140</text>
    <line x1="295" y1="77" x2="295" y2="93" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="295" y="108" text-anchor="middle" filter="url(#rough2)">175</text>
  </g>
  <line x1="316" y1="73" x2="316" y2="97" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="316" y="68" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">cancel190</text>
  <text x="360" y="88" font-size="10" fill="#b85450" filter="url(#rough2)">→ 共 6 条 {8}</text>

  <!-- 示例2 -->
  <text x="30" y="160" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例2 t=30 cancel=165 fn(2,5)=10</text>
  <line x1="40" y1="183" x2="530" y2="183" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 0,30,60,90,120,150 ; x=50+ms*1.4 : 50,92,134,176,218,260 ; cancel165->281 -->
  <g font-size="10" fill="#4a7a3a">
    <line x1="50" y1="173" x2="50" y2="193" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/><text x="50" y="206" text-anchor="middle" filter="url(#rough2)">0</text>
    <line x1="92" y1="175" x2="92" y2="191" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="92" y="206" text-anchor="middle" filter="url(#rough2)">30</text>
    <line x1="134" y1="175" x2="134" y2="191" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="134" y="206" text-anchor="middle" filter="url(#rough2)">60</text>
    <line x1="176" y1="175" x2="176" y2="191" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="176" y="206" text-anchor="middle" filter="url(#rough2)">90</text>
    <line x1="218" y1="175" x2="218" y2="191" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="218" y="206" text-anchor="middle" filter="url(#rough2)">120</text>
    <line x1="260" y1="175" x2="260" y2="191" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="260" y="206" text-anchor="middle" filter="url(#rough2)">150</text>
  </g>
  <line x1="281" y1="171" x2="281" y2="195" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="281" y="166" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">cancel165</text>
  <text x="330" y="186" font-size="10" fill="#b85450" filter="url(#rough2)">→ 共 6 条 {10}</text>

  <!-- 示例3 -->
  <text x="30" y="258" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例3 t=50 cancel=180 fn(5,1,3)=9</text>
  <line x1="40" y1="281" x2="530" y2="281" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 0,50,100,150 ; x=50+ms*1.4 : 50,120,190,260 ; cancel180->302 -->
  <g font-size="10" fill="#4a7a3a">
    <line x1="50" y1="271" x2="50" y2="291" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/><text x="50" y="304" text-anchor="middle" filter="url(#rough2)">0</text>
    <line x1="120" y1="273" x2="120" y2="289" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="120" y="304" text-anchor="middle" filter="url(#rough2)">50</text>
    <line x1="190" y1="273" x2="190" y2="289" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="190" y="304" text-anchor="middle" filter="url(#rough2)">100</text>
    <line x1="260" y1="273" x2="260" y2="289" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/><text x="260" y="304" text-anchor="middle" filter="url(#rough2)">150</text>
  </g>
  <line x1="302" y1="269" x2="302" y2="293" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="302" y="264" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">cancel180</text>
  <text x="350" y="284" font-size="10" fill="#b85450" filter="url(#rough2)">→ 共 4 条 {9}</text>

  <!-- 汇总表 -->
  <rect x="30" y="335" width="500" height="70" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="42" y="353" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">规律：条数 = floor(cancelTimeMs / t) + 1</text>
  <text x="42" y="370" font-size="10" fill="#333" filter="url(#rough2)">示例1 floor(190/35)+1 = 5+1 = 6   示例2 floor(165/30)+1 = 5+1 = 6</text>
  <text x="42" y="386" font-size="10" fill="#333" filter="url(#rough2)">示例3 floor(180/50)+1 = 3+1 = 4   （那个 +1 来自 0ms 的手动调用）</text>
  <text x="42" y="402" font-size="10" fill="#b85450" filter="url(#rough2)">所有触发时刻 &lt; cancelTimeMs 才会计入；clearInterval 在 cancelT 切断后续。</text>
</svg>
