<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">「一对相邻置位」= 相邻两位同为 1（按位置计、可重叠）——111 有两对！</text>

  <!-- 左面板：三个判例 -->
  <g filter="url(#rough2)">
    <rect x="20" y="38" width="242" height="262" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="141" y="58" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">三个判例（高位 → 低位）</text>

    <!-- 判例 A：n=6 -->
    <text x="34" y="93" font-size="11" fill="#2f5d24" font-weight="bold">n = 6 →</text>
    <rect x="104" y="76" width="28" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="118" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
    <rect x="136" y="76" width="28" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="150" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
    <rect x="168" y="76" width="28" height="30" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="182" y="97" text-anchor="middle" font-size="14" fill="#333">0</text>
    <path d="M104,110 L104,118 L164,118 L164,110" fill="none" stroke="#b85450" stroke-width="1.5"/>
    <text x="134" y="133" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1 对</text>
    <text x="226" y="93" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">true ✓</text>

    <!-- 判例 B：n=7 -->
    <text x="34" y="171" font-size="11" fill="#2f5d24" font-weight="bold">n = 7 →</text>
    <path d="M104,152 L104,144 L164,144 L164,152" fill="none" stroke="#b85450" stroke-width="1.5"/>
    <text x="134" y="139" text-anchor="middle" font-size="9.5" fill="#b85450">对①</text>
    <rect x="104" y="154" width="28" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="118" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
    <rect x="136" y="154" width="28" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="150" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
    <rect x="168" y="154" width="28" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="182" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
    <path d="M136,188 L136,196 L196,196 L196,188" fill="none" stroke="#b85450" stroke-width="1.5"/>
    <text x="166" y="210" text-anchor="middle" font-size="9.5" fill="#b85450">对②</text>
    <text x="226" y="171" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">false ✗</text>
    <text x="134" y="230" text-anchor="middle" font-size="9.5" fill="#8a3030">重叠也算两对</text>

    <!-- 判例 C：n=5 -->
    <text x="34" y="251" font-size="11" fill="#2f5d24" font-weight="bold">n = 5 →</text>
    <rect x="104" y="234" width="28" height="30" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="118" y="255" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="136" y="234" width="28" height="30" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="150" y="255" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="168" y="234" width="28" height="30" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="182" y="255" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="134" y="284" text-anchor="middle" font-size="9.5" fill="#4a6b5a">1 全孤立，0 对</text>
    <text x="226" y="251" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">false ✗</text>
  </g>

  <!-- 右面板：掩码运算 -->
  <g filter="url(#rough2)">
    <rect x="282" y="38" width="258" height="262" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="411" y="58" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">一步提取：m = n &amp; (n &gt;&gt; 1)</text>

    <text x="398" y="80" text-anchor="middle" font-size="9.5" fill="#33506b">bit2</text>
    <text x="440" y="80" text-anchor="middle" font-size="9.5" fill="#33506b">bit1</text>
    <text x="482" y="80" text-anchor="middle" font-size="9.5" fill="#33506b">bit0</text>

    <text x="368" y="104" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold">n</text>
    <rect x="382" y="86" width="32" height="28" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="398" y="105" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="424" y="86" width="32" height="28" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="440" y="105" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="466" y="86" width="32" height="28" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="482" y="105" text-anchor="middle" font-size="13" fill="#333">1</text>

    <text x="368" y="138" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold">n&gt;&gt;1</text>
    <rect x="382" y="120" width="32" height="28" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="398" y="139" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="424" y="120" width="32" height="28" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="440" y="139" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="466" y="120" width="32" height="28" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="482" y="139" text-anchor="middle" font-size="13" fill="#333">1</text>

    <text x="368" y="172" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">m</text>
    <rect x="382" y="154" width="32" height="28" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="398" y="173" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="424" y="154" width="32" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="440" y="173" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
    <rect x="466" y="154" width="32" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="482" y="173" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

    <text x="440" y="196" text-anchor="middle" font-size="9.5" fill="#b85450">对①</text>
    <text x="482" y="196" text-anchor="middle" font-size="9.5" fill="#b85450">对②</text>

    <rect x="296" y="206" width="230" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="411" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">m 的每个 1 ⟺ 一对相邻置位</text>
    <text x="411" y="239" text-anchor="middle" font-size="10" fill="#555">对数 = popcount(m)，答案 ⟺ 对数 = 1</text>

    <text x="411" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">n = 110 ⇒ m = 010，恰一个 1 ⇒ true</text>
    <text x="411" y="286" text-anchor="middle" font-size="10" fill="#33506b">答案一行：popcount(n &amp; (n&gt;&gt;1)) == 1</text>
  </g>

  <!-- 底部：run 视角 -->
  <g filter="url(#rough2)">
    <rect x="20" y="316" width="520" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="338" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">run 视角：长为 k 的连续 1 段内部恰含 k − 1 对</text>
    <text x="280" y="358" text-anchor="middle" font-size="10" fill="#555">恰一对 ⟺ 恰有一段长为 2 的「11」且其余 1 全孤立 —— 1100 ✓（1 对） / 1110 ✗（段长 3 ⇒ 2 对）</text>
    <text x="280" y="376" text-anchor="middle" font-size="10" fill="#4a6b5a">n = 0、1、2 天然零对 ⇒ false，全程零特判</text>
  </g>
</svg>
