<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两遍扫描——先建频次表，再按原序找首个 cnt==1</text>

  <!-- ===== s row with indices ===== -->
  <text x="40" y="72" font-size="12" fill="#888">s:</text>
  <!-- 12 chars of "loveleetcode" -->
  <rect x="66" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="83" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="100" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>
  <rect x="134" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">v</text>
  <rect x="168" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="202" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="236" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="270" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="304" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">t</text>
  <rect x="338" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="372" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="389" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>
  <rect x="406" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="423" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
  <rect x="440" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="457" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <!-- index labels -->
  <text x="83" y="98" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="117" y="98" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="151" y="98" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="185" y="98" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="219" y="98" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="253" y="98" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="287" y="98" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="321" y="98" text-anchor="middle" font-size="9" fill="#aaa">7</text>
  <text x="355" y="98" text-anchor="middle" font-size="9" fill="#aaa">8</text>
  <text x="389" y="98" text-anchor="middle" font-size="9" fill="#aaa">9</text>
  <text x="423" y="98" text-anchor="middle" font-size="9" fill="#aaa">10</text>
  <text x="457" y="98" text-anchor="middle" font-size="9" fill="#aaa">11</text>

  <!-- arrow: 统计频次 -->
  <path d="M 257 104 L 257 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="270" y="120" font-size="10" fill="#888">第一遍：统计频次</text>

  <!-- ===== count table ===== -->
  <text x="40" y="158" font-size="12" fill="#888">cnt[26]:</text>
  <rect x="70" y="138" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l: 2</text>
  <rect x="126" y="138" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">o: 2</text>
  <rect x="182" y="138" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">v: 1</text>
  <rect x="238" y="138" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e: 4</text>
  <rect x="294" y="138" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t: 1</text>
  <rect x="350" y="138" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c: 1</text>
  <rect x="406" y="138" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="434" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d: 1</text>

  <!-- arrow: 第二遍按原序 -->
  <path d="M 257 178 L 257 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="270" y="194" font-size="10" fill="#888">第二遍：按原序找首个 cnt==1</text>

  <!-- ===== scan row ===== -->
  <text x="40" y="232" font-size="12" fill="#888">扫描:</text>
  <!-- l: cnt=2 -> skip -->
  <rect x="66" y="212" width="34" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="83" y="234" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">l</text>
  <text x="83" y="256" text-anchor="middle" font-size="9" fill="#b85450">2 ✗</text>
  <!-- o: cnt=2 -> skip -->
  <rect x="100" y="212" width="34" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="117" y="234" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">o</text>
  <text x="117" y="256" text-anchor="middle" font-size="9" fill="#b85450">2 ✗</text>
  <!-- v: cnt=1 -> HIT -->
  <rect x="134" y="212" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="234" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">v</text>
  <text x="151" y="256" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1 ✓</text>
  <!-- remaining dimmed -->
  <rect x="168" y="212" width="34" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="234" text-anchor="middle" font-size="14" fill="#ccc">e</text>
  <rect x="202" y="212" width="34" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="219" y="234" text-anchor="middle" font-size="14" fill="#ccc">l</text>
  <rect x="236" y="212" width="34" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="253" y="234" text-anchor="middle" font-size="14" fill="#ccc">e</text>
  <rect x="270" y="212" width="34" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="287" y="234" text-anchor="middle" font-size="14" fill="#ccc">e</text>
  <rect x="304" y="212" width="34" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="321" y="234" text-anchor="middle" font-size="14" fill="#ccc">t</text>
  <rect x="338" y="212" width="34" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="234" text-anchor="middle" font-size="14" fill="#ccc">c</text>
  <rect x="372" y="212" width="34" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="389" y="234" text-anchor="middle" font-size="14" fill="#ccc">o</text>
  <rect x="406" y="212" width="34" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="423" y="234" text-anchor="middle" font-size="14" fill="#ccc">d</text>
  <rect x="440" y="212" width="34" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="457" y="234" text-anchor="middle" font-size="14" fill="#ccc">e</text>

  <!-- result tag -->
  <rect x="150" y="280" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">v 是首个频次为 1 → 返回索引 2</text>

  <!-- contrast note -->
  <rect x="40" y="330" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键：「不重复」是全局性质，需先完整计数</text>
  <text x="270" y="370" text-anchor="middle" font-size="11" fill="#555">第二遍按原序扫描保证返回的是「第一个」；遇 cnt==1 立即返回，无需扫完</text>
</svg>
