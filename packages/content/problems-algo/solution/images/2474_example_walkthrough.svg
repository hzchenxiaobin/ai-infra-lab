<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：三位客户逐行 LAG → 标记违反 → 汇总</text>
  <text x="360" y="42" text-anchor="middle" font-size="10.5" fill="#888">客户 1 / 2 无违反（合格），客户 3 出现 900 ≤ 900（不合格）</text>

  <!-- ================= Customer 1 column ================= -->
  <rect x="44" y="58" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="129" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">客户 1（5 单）</text>

  <!-- table header -->
  <rect x="44" y="86" width="86" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="100" text-anchor="middle" font-size="9.5" fill="#666">price</text>
  <rect x="130" y="86" width="84" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="100" text-anchor="middle" font-size="9.5" fill="#666">prev→ok</text>

  <!-- rows customer1 -->
  <rect x="44" y="106" width="86" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="119" text-anchor="middle" font-size="9.5" fill="#333">1100</text>
  <rect x="130" y="106" width="84" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="119" text-anchor="middle" font-size="9.5" fill="#999">— 首行</text>

  <rect x="44" y="124" width="86" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="137" text-anchor="middle" font-size="9.5" fill="#333">1200</text>
  <rect x="130" y="124" width="84" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="137" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1100 ✓</text>

  <rect x="44" y="142" width="86" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="155" text-anchor="middle" font-size="9.5" fill="#333">3000</text>
  <rect x="130" y="142" width="84" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="155" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1200 ✓</text>

  <rect x="44" y="160" width="86" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="173" text-anchor="middle" font-size="9.5" fill="#333">3100</text>
  <rect x="130" y="160" width="84" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="173" text-anchor="middle" font-size="9.5" fill="#4a7a3a">3000 ✓</text>

  <rect x="44" y="178" width="86" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="191" text-anchor="middle" font-size="9.5" fill="#333">4700</text>
  <rect x="130" y="178" width="84" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="191" text-anchor="middle" font-size="9.5" fill="#4a7a3a">3100 ✓</text>

  <rect x="44" y="200" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="129" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bad=0 → 合格 ✓</text>

  <!-- ================= Customer 2 column ================= -->
  <rect x="248" y="58" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="333" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">客户 2（2 单）</text>

  <rect x="248" y="86" width="86" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="291" y="100" text-anchor="middle" font-size="9.5" fill="#666">price</text>
  <rect x="334" y="86" width="84" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="376" y="100" text-anchor="middle" font-size="9.5" fill="#666">prev→ok</text>

  <rect x="248" y="106" width="86" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="291" y="119" text-anchor="middle" font-size="9.5" fill="#333">700</text>
  <rect x="334" y="106" width="84" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="376" y="119" text-anchor="middle" font-size="9.5" fill="#999">— 首行</text>

  <rect x="248" y="124" width="86" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="291" y="137" text-anchor="middle" font-size="9.5" fill="#333">1000</text>
  <rect x="334" y="124" width="84" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="376" y="137" text-anchor="middle" font-size="9.5" fill="#4a7a3a">700 ✓</text>

  <rect x="248" y="200" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="333" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bad=0 → 合格 ✓</text>

  <!-- ================= Customer 3 column ================= -->
  <rect x="452" y="58" width="170" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="537" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">客户 3（2 单）</text>

  <rect x="452" y="86" width="86" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="495" y="100" text-anchor="middle" font-size="9.5" fill="#666">price</text>
  <rect x="538" y="86" width="84" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="580" y="100" text-anchor="middle" font-size="9.5" fill="#666">prev→ok</text>

  <rect x="452" y="106" width="86" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="495" y="119" text-anchor="middle" font-size="9.5" fill="#333">900</text>
  <rect x="538" y="106" width="84" height="18" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="580" y="119" text-anchor="middle" font-size="9.5" fill="#999">— 首行</text>

  <rect x="452" y="124" width="86" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="495" y="137" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">900</text>
  <rect x="538" y="124" width="84" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="580" y="137" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">900 ✗</text>

  <rect x="452" y="200" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="537" y="215" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">bad=1 → 不合格 ✗</text>

  <!-- arrows to output -->
  <path d="M 129 224 L 280 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 333 224 L 360 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 537 224 L 440 250" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="244" font-size="9" fill="#b85450" filter="url(#rough2)">被过滤</text>

  <!-- Output box -->
  <rect x="170" y="258" width="380" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="278" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">输出（HAVING bad = 0，按 customer_id 升序）</text>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#446688" font-family="monospace">customer_id :  1 ,  2</text>

  <!-- Bottom note -->
  <rect x="60" y="330" width="600" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="350" text-anchor="middle" font-size="10.5" fill="#555">关键判据：客户 3 第二单 900 ≤ prev 900 → price ≤ prev_price 成立 → 记一次违反</text>
  <text x="360" y="368" text-anchor="middle" font-size="10.5" fill="#555">「等于」不算严格递增；只要存在一条违反，整客户即不合格（bad &gt; 0 即出局）</text>
  <text x="360" y="386" text-anchor="middle" font-size="10.5" fill="#555">客户 1 虽单价跨度大（1100→4700），但每一步都严格更大 → 合格</text>

  <text x="360" y="424" text-anchor="middle" font-size="10" fill="#999">子句执行顺序：FROM/JOIN → 窗口函数 LAG（①）→ 逐行 violation（②）→ GROUP BY + SUM（③）→ HAVING + ORDER BY（④）</text>
</svg>
