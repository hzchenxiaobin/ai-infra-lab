<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：单循环扫描——计数、判 2、就地收集</text>

  <!-- 开始 -->
  <rect x="100" y="40" width="100" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="57" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 150 66 L 150 86" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 A：还有元素? -->
  <polygon points="150,90 212,120 150,150 88,120" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">还有元素?</text>

  <!-- A 是 → 循环体 -->
  <path d="M 212 120 L 271 120" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 循环体虚线框 -->
  <rect x="262" y="88" width="176" height="242" rx="10" fill="none" stroke="#b8c2cc" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="350" y="82" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">循环体（一遍扫描）</text>

  <!-- B：取元素 -->
  <rect x="273" y="106" width="154" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v ← nums 中下一元素</text>
  <path d="M 350 134 L 350 151" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C：计数 -->
  <rect x="273" y="153" width="154" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[v] ← cnt[v] + 1</text>
  <path d="M 350 181 L 350 204" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D：判 2 菱形 -->
  <polygon points="350,208 412,240 350,272 288,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">cnt[v] = 2 ?</text>

  <!-- D 是 → E 收集 -->
  <path d="M 350 272 L 350 288" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="284" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="273" y="290" width="154" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans ← ans ∪ {v}</text>

  <!-- 回边：收集完 → 回到取元素 -->
  <path d="M 273 304 L 240 304 L 240 126" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="240" cy="120" r="3.5" fill="#d6a040" filter="url(#rough2)"/>

  <!-- D 否 → 汇入回边 -->
  <path d="M 288 240 L 246 240" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="240" cy="240" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="262" y="232" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- A 否 → 返回 -->
  <path d="M 150 150 L 150 286" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="200" text-anchor="start" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="158" y="214" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">(遍历完)</text>

  <!-- 返回 -->
  <rect x="55" y="290" width="190" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="309" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">返回 ans（恰好 2 个）</text>

  <!-- 底部要点 -->
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">判 2 在自增之后立刻做——不用第二趟扫 cnt，答案在循环里顺手收集</text>
</svg>
