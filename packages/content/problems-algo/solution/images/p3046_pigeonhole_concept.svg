<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：同一个值最多养 2 份（鸽巢原理）</text>

  <!-- left panel: bad case -->
  <rect x="22" y="40" width="232" height="316" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="138" y="64" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">情形 A：某值出现 3 次</text>

  <circle cx="74" cy="96" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="74" y="101" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="138" cy="96" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="101" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="202" cy="96" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="202" y="101" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 70 114 L 82 158" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 136 114 L 106 158" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 206 114 L 196 158" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="48" y="162" width="92" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="94" y="180" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nums1</text>
  <text x="94" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1, 1 ✗重复</text>

  <rect x="152" y="162" width="92" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="198" y="180" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nums2</text>
  <text x="198" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="40" y="238" width="196" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="138" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 只鸽子 2 个巢</text>
  <text x="138" y="282" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">必有一侧装下 ≥ 2 个 1</text>
  <text x="138" y="302" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">组内互不相同被破坏</text>
  <text x="138" y="322" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ return false</text>

  <!-- right panel: good case -->
  <rect x="266" y="40" width="232" height="316" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="382" y="64" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情形 B：每个值 ≤ 2 次</text>

  <circle cx="318" cy="96" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="318" y="101" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="382" cy="96" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="382" y="101" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="446" cy="96" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="446" y="101" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="350" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">成对值</text>
  <text x="446" y="132" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">单值</text>

  <path d="M 314 114 L 308 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 386 114 L 428 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 442 114 L 348 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="292" y="162" width="92" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="338" y="180" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nums1</text>
  <text x="338" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2, 3</text>

  <rect x="396" y="162" width="92" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="442" y="180" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nums2</text>
  <text x="442" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="284" y="238" width="196" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="382" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">成对值一左一右错开</text>
  <text x="382" y="282" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">单值个数 s = n − 2d 为偶数</text>
  <text x="382" y="302" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">平分补齐，两侧恰好各 n/2</text>
  <text x="382" y="322" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ return true</text>
</svg>
