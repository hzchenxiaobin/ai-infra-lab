<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：clips = [[0,2],[4,6],[8,10],[1,9],[1,5],[5,9]], time = 10</text>

  <!-- Sorted clips note -->
  <text x="40" y="46" font-size="11" fill="#888">排序后: [0,2] [1,9] [1,5] [4,6] [5,9] [8,10]</text>

  <!-- ===== Table header ===== -->
  <rect x="40" y="56" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">轮次</text>
  <text x="140" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">curEnd</text>
  <text x="255" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">扫描片段 (start≤curEnd)</text>
  <text x="385" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">nextEnd</text>
  <text x="475" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">ans</text>

  <!-- Column dividers -->
  <line x1="100" y1="56" x2="100" y2="220" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="56" x2="180" y2="220" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="56" x2="330" y2="220" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="56" x2="440" y2="220" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1: curEnd=0 ===== -->
  <rect x="40" y="80" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="140" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <!-- scanned clips -->
  <rect x="195" y="92" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="107" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[0,2]</text>
  <text x="255" y="107" font-size="10" fill="#999">（仅此1个）</text>
  <text x="385" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="475" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- ===== Row 2: curEnd=2 ===== -->
  <rect x="40" y="124" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="140" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <!-- scanned clips -->
  <rect x="190" y="136" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="151" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[1,9]</text>
  <rect x="245" y="136" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="151" text-anchor="middle" font-size="10" fill="#999">[1,5]</text>
  <text x="385" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">9</text>
  <text x="475" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- ===== Row 3: curEnd=9 ===== -->
  <rect x="40" y="168" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="194" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="140" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <!-- scanned clips -->
  <rect x="185" y="180" width="45" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="207" y="195" text-anchor="middle" font-size="9" fill="#999">[4,6]</text>
  <rect x="233" y="180" width="45" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="255" y="195" text-anchor="middle" font-size="9" fill="#999">[5,9]</text>
  <rect x="281" y="180" width="55" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="195" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[8,10]</text>
  <text x="385" y="194" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">10</text>
  <text x="475" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- Result note -->
  <rect x="100" y="212" width="360" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">curEnd=10 ≥ time=10 → 返回 ans=3</text>

  <!-- ===== Coverage timeline visualization ===== -->
  <text x="40" y="260" font-size="11" fill="#888" font-weight="bold">覆盖区域生长：</text>

  <!-- Timeline -->
  <line x1="80" y1="340" x2="480" y2="340" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Ticks -->
  <g filter="url(#rough2)">
    <line x1="80" y1="336" x2="80" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="160" y1="336" x2="160" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="440" y1="336" x2="440" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="480" y1="336" x2="480" y2="344" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="80" y="358" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="160" y="358" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="440" y="358" text-anchor="middle" font-size="10" fill="#999">9</text>
  <text x="480" y="358" text-anchor="middle" font-size="10" fill="#999">10</text>

  <!-- Round 1 coverage: [0,2] green -->
  <rect x="80" y="280" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="293" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">[0,2]</text>
  <text x="172" y="293" font-size="9" fill="#4a7a3a">第1轮</text>

  <!-- Round 2 coverage: [0,9] blue (extends to 9) -->
  <rect x="80" y="302" width="360" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">[0,9]（选 [1,9] 扩展）</text>
  <text x="452" y="315" font-size="9" fill="#446688">第2轮</text>

  <!-- Round 3 coverage: [0,10] orange (extends to 10) -->
  <rect x="80" y="324" width="400" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">[0,10] 完全覆盖！第3轮选 [8,10]</text>

  <!-- Arrows showing extension -->
  <path d="M 160 298 L 160 300 L 440 300" stroke="#446688" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 440 320 L 440 322 L 480 322" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- Summary -->
  <rect x="120" y="372" width="320" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 个片段：[0,2] + [1,9] + [8,10] → 覆盖 [0,10]</text>
</svg>
