<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">指针重连：中序访问时 prev ↔ curr 互连</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">每个节点被访问时，把它和上一个访问的节点 prev 双向互连</text>

  <!-- ===== 访问 curr 前 ===== -->
  <text x="40" y="76" font-size="12" fill="#444" font-weight="bold">访问 curr 前：prev 已串好，curr 刚被中序到达</text>

  <!-- prev 链 -->
  <g font-size="12">
    <rect x="40" y="88" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="62" y="108" text-anchor="middle" fill="#888">...</text>
    <line x1="84" y1="103" x2="102" y2="103" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="108" y="88" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
    <text x="130" y="108" text-anchor="middle" fill="#333" font-weight="bold">prev</text>
  </g>
  <text x="130" y="132" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">上一访问节点</text>

  <!-- 中序到达 curr -->
  <text x="240" y="103" font-size="10" fill="#b85450" font-weight="bold">中序访问到达</text>
  <path d="M 230 103 L 280 103" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="286" y="88" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="308" y="108" text-anchor="middle" fill="#333" font-weight="bold">curr</text>
  <text x="308" y="132" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">当前节点</text>

  <!-- 还未连的标注 -->
  <text x="218" y="80" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">尚未互连</text>

  <!-- ===== 访问 curr 后 ===== -->
  <text x="40" y="166" font-size="12" fill="#444" font-weight="bold">访问 curr 后：prev 与 curr 双向互连</text>

  <g font-size="12">
    <rect x="40" y="178" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="62" y="198" text-anchor="middle" fill="#888">...</text>
    <line x1="84" y1="193" x2="102" y2="193" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="108" y="178" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="130" y="198" text-anchor="middle" fill="#333" font-weight="bold">prev</text>
    <!-- ① prev.right = curr -->
    <line x1="152" y1="190" x2="282" y2="190" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
    <!-- ② curr.left = prev -->
    <line x1="282" y1="198" x2="152" y2="198" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
    <rect x="286" y="178" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="308" y="198" text-anchor="middle" fill="#333" font-weight="bold">curr</text>
  </g>
  <text x="218" y="170" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">① prev.right = curr</text>
  <text x="218" y="226" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">② curr.left = prev</text>

  <!-- prev 滑动 -->
  <rect x="380" y="178" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="470" y="197" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">然后 prev = curr（滑动）</text>

  <!-- ===== 首节点特判 ===== -->
  <text x="40" y="252" font-size="12" fill="#444" font-weight="bold">首节点特判：prev 为 null 时记 head</text>
  <g font-size="12">
    <rect x="40" y="264" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="62" y="284" text-anchor="middle" fill="#333" font-weight="bold">curr</text>
    <text x="62" y="310" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">head = curr</text>
    <text x="120" y="280" font-size="10" fill="#b85450" font-weight="bold">prev == null</text>
    <path d="M 110 284 L 100 284" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  </g>
  <rect x="200" y="264" width="330" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="365" y="282" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">中序第一个被访问的节点 = 最小节点</text>
  <text x="365" y="298" text-anchor="middle" font-size="10" fill="#8a6a20">此时 prev 为 null，记录 head = curr，仍把 prev 滑到 curr</text>

  <!-- ===== 首尾成环 ===== -->
  <text x="40" y="332" font-size="12" fill="#444" font-weight="bold">遍历结束：首尾互连成环</text>
  <g font-size="12">
    <rect x="40" y="344" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="62" y="364" text-anchor="middle" fill="#333" font-weight="bold">head</text>
    <line x1="84" y1="359" x2="102" y2="359" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="108" y="344" width="44" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="130" y="364" text-anchor="middle" fill="#888">...</text>
    <line x1="152" y1="359" x2="170" y2="359" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="176" y="344" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
    <text x="198" y="364" text-anchor="middle" fill="#333" font-weight="bold">prev</text>
  </g>
  <text x="198" y="388" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">遍历结束 = last</text>
  <!-- 成环箭头 -->
  <path d="M 220 359 Q 280 320 360 320 Q 440 320 440 359" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 440 365 Q 360 405 280 405 Q 200 405 84 365" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="430" y="316" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">③ prev.right = head</text>
  <text x="430" y="410" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">④ head.left = prev</text>

  <!-- 关键 -->
  <rect x="30" y="420" width="520" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="440" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键：① prev.right=curr　② curr.left=prev　③ last.right=head　④ head.left=last</text>
</svg>
