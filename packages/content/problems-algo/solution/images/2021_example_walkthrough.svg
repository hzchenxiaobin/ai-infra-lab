<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 312" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="312" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：lights = [[-3,2],[1,2],[3,3]]</text>

  <!-- Interval reminder chips -->
  <g font-size="11">
    <rect x="60" y="40" width="118" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="119" y="54" text-anchor="middle" fill="#333" font-weight="bold">灯0: [-5, -1]</text>
    <rect x="194" y="40" width="106" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="247" y="54" text-anchor="middle" fill="#333" font-weight="bold">灯1: [-1, 3]</text>
    <rect x="316" y="40" width="106" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="369" y="54" text-anchor="middle" fill="#333" font-weight="bold">灯2: [0, 6]</text>
  </g>

  <!-- Table row backgrounds -->
  <rect x="50" y="68" width="440" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="50" y="94" width="440" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="50" y="120" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="50" y="146" width="440" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="50" y="172" width="440" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="50" y="198" width="440" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- vertical dividers -->
  <g stroke="#bbb" stroke-width="1.2" filter="url(#rough2)">
    <line x1="146" y1="68" x2="146" y2="224"/>
    <line x1="226" y1="68" x2="226" y2="224"/>
    <line x1="314" y1="68" x2="314" y2="224"/>
    <line x1="402" y1="68" x2="402" y2="224"/>
  </g>

  <!-- Header text -->
  <g font-size="12" fill="#555" font-weight="bold">
    <text x="98" y="85" text-anchor="middle">位置 k</text>
    <text x="186" y="85" text-anchor="middle">d[k]</text>
    <text x="270" y="85" text-anchor="middle">亮度 s</text>
    <text x="358" y="85" text-anchor="middle">最大 mx</text>
    <text x="446" y="85" text-anchor="middle">答案 ans</text>
  </g>

  <!-- Row data -->
  <g font-size="12" fill="#333">
    <!-- row1: k=-5 -->
    <text x="98" y="111" text-anchor="middle">-5</text>
    <text x="186" y="111" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+1</text>
    <text x="270" y="111" text-anchor="middle">1</text>
    <text x="358" y="111" text-anchor="middle">1</text>
    <text x="446" y="111" text-anchor="middle">-5</text>

    <!-- row2: k=-1 (MAX) -->
    <text x="98" y="137" text-anchor="middle" font-weight="bold">-1</text>
    <text x="186" y="137" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+1</text>
    <text x="270" y="137" text-anchor="middle" font-weight="bold">2</text>
    <text x="358" y="137" text-anchor="middle" font-weight="bold">2</text>
    <text x="446" y="137" text-anchor="middle" font-weight="bold" fill="#b85450">-1</text>

    <!-- row3: k=0 (tie, no update) -->
    <text x="98" y="163" text-anchor="middle">0</text>
    <text x="186" y="163" text-anchor="middle" fill="#999">0</text>
    <text x="270" y="163" text-anchor="middle">2</text>
    <text x="358" y="163" text-anchor="middle">2</text>
    <text x="446" y="163" text-anchor="middle" fill="#999">-1</text>

    <!-- row4: k=4 -->
    <text x="98" y="189" text-anchor="middle">4</text>
    <text x="186" y="189" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <text x="270" y="189" text-anchor="middle">1</text>
    <text x="358" y="189" text-anchor="middle">2</text>
    <text x="446" y="189" text-anchor="middle">-1</text>

    <!-- row5: k=7 -->
    <text x="98" y="215" text-anchor="middle">7</text>
    <text x="186" y="215" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <text x="270" y="215" text-anchor="middle">0</text>
    <text x="358" y="215" text-anchor="middle">2</text>
    <text x="446" y="215" text-anchor="middle">-1</text>
  </g>

  <!-- row annotations -->
  <text x="500" y="137" text-anchor="start" font-size="10" fill="#d6a040" font-weight="bold">← 命中最大</text>
  <text x="500" y="163" text-anchor="start" font-size="10" fill="#999">并列不更新</text>

  <!-- Callout -->
  <rect x="60" y="240" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="262" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最大亮度 mx = 2，首次达到于 k = -1 → 返回 -1</text>
  <text x="290" y="282" text-anchor="middle" font-size="11" fill="#666">亮度为 2 的位置：-1, 0, 1, 2, 3；升序扫描 + 严格 &lt; 保留最小者</text>
</svg>
