<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2772c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：从左到右贪心 + 差分数组追踪活跃操作</text>

  <!-- ===== insight box ===== -->
  <rect x="40" y="38" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">位置 i 只能被 [i−k+1, i] 内启动的 k 长操作减到 0</text>
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#d6a040">→ 从左到右扫描：need = nums[i] − curr，curr = 当前活跃操作数</text>

  <!-- ===== array with window ===== -->
  <text x="50" y="104" font-size="12" fill="#888" font-weight="bold">nums = [2, 2, 3, 1, 1, 0],  k = 3</text>

  <!-- array elements: 6 × 50px, start x=130 -->
  <g font-size="18" font-weight="bold">
    <rect x="130" y="112" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="155" y="140" text-anchor="middle" fill="#333">2</text>

    <rect x="180" y="112" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="205" y="140" text-anchor="middle" fill="#333">2</text>

    <rect x="230" y="112" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="255" y="140" text-anchor="middle" fill="#333">3</text>

    <rect x="280" y="112" width="50" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="305" y="140" text-anchor="middle" fill="#4a7a3a">1</text>

    <rect x="330" y="112" width="50" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="355" y="140" text-anchor="middle" fill="#4a7a3a">1</text>

    <rect x="380" y="112" width="50" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="405" y="140" text-anchor="middle" fill="#4a7a3a">0</text>
  </g>

  <!-- window bracket [0..2] -->
  <path d="M128,158 Q128,168 137,168 L271,168 Q280,168 280,158" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">k=3：操作从 i 启动，覆盖 [i, i+k−1]</text>

  <!-- ===== i=0 example ===== -->
  <rect x="40" y="192" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i=0: curr=0, need = nums[0] − curr = 2 − 0 = 2</text>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#446688">→ 启动 2 个操作（覆盖 [0,1,2]）, curr=2, diff[3] −= 2（操作到位置 3 失效）</text>

  <!-- ===== three rules ===== -->
  <rect x="40" y="250" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">need &lt; 0 → 已被过量减，只能减不能加 → return false</text>

  <rect x="40" y="298" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">need &gt; 0 且 i + k &gt; n → 放不下 k 长窗口 → return false</text>

  <rect x="40" y="346" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">否则 → curr += need, diff[i+k] −= need, i++</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#4a7a3a">全部扫描完无异常 → return true</text>
</svg>
