<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">转移 = 剥掉末尾一整段，段长 L 是求和变量</text>

  <!-- labels above cells -->
  <text x="146" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">前缀（末尾是 1）</text>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">末段：L 个 0</text>

  <!-- array cells: [1,1,0,1 | 0,0] -->
  <rect x="60" y="64" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="92" text-anchor="middle" font-size="15" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="104" y="64" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="92" text-anchor="middle" font-size="15" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="148" y="64" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="92" text-anchor="middle" font-size="15" fill="#2d5a24" filter="url(#rough2)">0</text>
  <rect x="192" y="64" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="214" y="92" text-anchor="middle" font-size="15" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="236" y="64" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="258" y="92" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="280" y="64" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="302" y="92" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- divider -->
  <line x1="236" y1="58" x2="236" y2="116" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- brackets -->
  <path d="M62,116 L62,123 L230,123 L230,116" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="141" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i−L][j][1]</text>
  <path d="M240,116 L240,123 L322,123 L322,116" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="281" y="141" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">拼上 L 个 0</text>
  <text x="281" y="158" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">1 ≤ L ≤ min(i, limit)</text>

  <!-- arrow to formulas -->
  <line x1="328" y1="86" x2="346" y2="86" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- state box -->
  <rect x="60" y="190" width="264" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="192" y="210" text-anchor="middle" font-size="12.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">状态 dp[i][j][k]</text>
  <text x="192" y="228" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">用 i 个 0、j 个 1、末尾为 k 的稳定数组个数</text>

  <!-- right panel: formulas -->
  <rect x="350" y="64" width="192" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="446" y="86" text-anchor="middle" font-size="12.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">dp[i][j][0] =</text>
  <text x="446" y="105" text-anchor="middle" font-size="10.5" fill="#2c4a6b" filter="url(#rough2)">Σ (L=1..min(i,limit)) dp[i−L][j][1]</text>

  <rect x="350" y="140" width="192" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="446" y="162" text-anchor="middle" font-size="12.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">dp[i][j][1] =</text>
  <text x="446" y="181" text-anchor="middle" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">Σ (L=1..min(j,limit)) dp[i][j−L][0]</text>

  <rect x="350" y="212" width="192" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="446" y="232" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = dp[zero][one][0]</text>
  <text x="446" y="250" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">+ dp[zero][one][1]</text>

  <!-- bottom note -->
  <rect x="30" y="278" width="500" height="92" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">不重不漏：每个数组按「末段长度 L」唯一分解 = 前缀（末尾值 ≠ 末段值）+ 末段</text>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">哨兵 dp[0][0][0] = dp[0][0][1] = 1（空数组）：覆盖「整个数组就是一段纯 0 / 纯 1」</text>
  <text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">例：[1,1,0,1,0,0] = 前缀 [1,1,0,1]（dp[1][3][1]）+ 末段 00 → 计入 dp[3][3][0]</text>
  <text x="280" y="360" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">状态只需 (i, j, 末尾值) 三维 —— 段长被吸收进转移的求和变量里</text>
</svg>
