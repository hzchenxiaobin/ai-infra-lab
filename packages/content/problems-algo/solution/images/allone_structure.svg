<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#fdfcf7"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">全 O(1) 数据结构：哈希表 + 计数桶双向链表</text>
  <path d="M 250 40 Q 450 48 650 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Hash table -->
  <text x="115" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">哈希表 keyTable (O(1) 定位)</text>
  <g filter="url(#sk)">
    <rect x="40" y="84" width="160" height="220" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="58" y="106" font-size="11" fill="#444">key</text>
  <text x="170" y="106" font-size="11" fill="#444">→ Bucket*</text>
  <line x1="50" y1="112" x2="190" y2="112" stroke="#9e9e9e" stroke-width="1" filter="url(#sk)"/>
  <text x="58" y="132" font-size="11" fill="#444">"a"</text>
  <text x="170" y="132" font-size="11" fill="#2e6e2e">→ B1</text>
  <text x="58" y="156" font-size="11" fill="#444">"b"</text>
  <text x="170" y="156" font-size="11" fill="#2e6e2e">→ B2</text>
  <text x="58" y="180" font-size="11" fill="#444">"c"</text>
  <text x="170" y="180" font-size="11" fill="#2e6e2e">→ B3</text>
  <text x="58" y="228" font-size="10" fill="#888">value 记录</text>
  <text x="58" y="244" font-size="10" fill="#888">key 所在桶的</text>
  <text x="58" y="260" font-size="10" fill="#888">指针，O(1) 定位</text>

  <!-- Sorted bucket doubly linked list -->
  <text x="600" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">计数桶双向链表 (按 count 升序)</text>

  <!-- head sentinel -->
  <g filter="url(#sk)">
    <rect x="260" y="170" width="40" height="40" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="3 2"/>
  </g>
  <text x="280" y="187" text-anchor="middle" font-size="10" fill="#888">head</text>
  <text x="280" y="201" text-anchor="middle" font-size="9" fill="#888">哨兵</text>

  <!-- B1: count=1 -->
  <g filter="url(#sk)">
    <rect x="330" y="120" width="120" height="140" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="390" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">B1 · count=1</text>
  <line x1="340" y1="146" x2="440" y2="146" stroke="#9e9e9e" stroke-width="1" filter="url(#sk)"/>
  <text x="390" y="166" text-anchor="middle" font-size="10" fill="#888">keys:</text>
  <g filter="url(#sk)">
    <rect x="350" y="174" width="34" height="22" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="367" y="190" text-anchor="middle" font-size="10" fill="#2e6e2e">"a"</text>
  <text x="430" y="250" text-anchor="middle" font-size="9" fill="#b85450">↑ getMinKey</text>

  <!-- B2: count=2 -->
  <g filter="url(#sk)">
    <rect x="490" y="120" width="120" height="140" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="550" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">B2 · count=2</text>
  <line x1="500" y1="146" x2="600" y2="146" stroke="#9e9e9e" stroke-width="1" filter="url(#sk)"/>
  <text x="550" y="166" text-anchor="middle" font-size="10" fill="#888">keys:</text>
  <g filter="url(#sk)">
    <rect x="510" y="174" width="34" height="22" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="527" y="190" text-anchor="middle" font-size="10" fill="#7a5415">"b"</text>

  <!-- B3: count=3 -->
  <g filter="url(#sk)">
    <rect x="650" y="120" width="120" height="140" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="710" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">B3 · count=3</text>
  <line x1="660" y1="146" x2="760" y2="146" stroke="#9e9e9e" stroke-width="1" filter="url(#sk)"/>
  <text x="710" y="166" text-anchor="middle" font-size="10" fill="#888">keys:</text>
  <g filter="url(#sk)">
    <rect x="670" y="174" width="34" height="22" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="687" y="190" text-anchor="middle" font-size="10" fill="#b85450">"c"</text>
  <text x="710" y="250" text-anchor="middle" font-size="9" fill="#b85450">↑ getMaxKey</text>

  <!-- tail sentinel -->
  <g filter="url(#sk)">
    <rect x="800" y="170" width="40" height="40" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="3 2"/>
  </g>
  <text x="820" y="187" text-anchor="middle" font-size="10" fill="#888">tail</text>
  <text x="820" y="201" text-anchor="middle" font-size="9" fill="#888">哨兵</text>

  <!-- list links (bidirectional) -->
  <path d="M 300 185 L 330 185" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 330 200 L 300 200" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 450 185 L 490 185" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 490 200 L 450 200" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 610 185 L 650 185" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 650 200 L 610 200" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 770 185 L 800 185" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 800 200 L 770 200" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- min / max labels -->
  <text x="390" y="282" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">最小计数</text>
  <text x="710" y="282" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">最大计数</text>

  <!-- hash -> bucket pointers -->
  <path d="M 200 128 Q 250 110 340 175" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 2" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 200 152 Q 280 130 500 175" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 2" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 200 176 Q 320 110 660 175" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 2" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- operations summary -->
  <g filter="url(#sk)">
    <rect x="40" y="320" width="820" height="130" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="344" font-size="13" font-weight="bold" fill="#444">三大不变量：</text>
  <text x="60" y="368" font-size="11" fill="#2e6e2e" font-weight="bold">① 链表升序：</text>
  <text x="170" y="368" font-size="11" fill="#444">head.next → tail，count 严格递增；head/tail 是 count=0 哨兵，消除边界特判</text>
  <text x="60" y="392" font-size="11" fill="#d6a040" font-weight="bold">② 桶内无序：</text>
  <text x="170" y="392" font-size="11" fill="#444">同 count 的 key 装在 unordered_set，增删 O(1)，取任意 key O(1)</text>
  <text x="60" y="416" font-size="11" fill="#b85450" font-weight="bold">③ 空桶即删：</text>
  <text x="170" y="416" font-size="11" fill="#444">keys 变空后立刻从链表摘除，保证 head.next / tail.prev 永远非空（链表非空时）</text>
  <text x="60" y="438" font-size="11" fill="#4a8edb" font-weight="bold">±1 是关键：</text>
  <text x="170" y="438" font-size="11" fill="#444">inc 后新 count = 旧+1，只看 next 桶；dec 后新 count = 旧−1，只看 prev 桶 → O(1) 搬动</text>
</svg>
