<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：扫描平衡值，] 跌入负值即"超前"，需与未来 [ 交换</text>

  <!-- ===== Section A: balanced ===== -->
  <text x="40" y="56" font-size="12.5" fill="#555" font-weight="bold">情形一：平衡串 — 任意前缀 #[ ≥ #]，balance ≥ 0 恒成立</text>

  <text x="40" y="84" font-size="11" fill="#888">s =</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="78" y="70" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="98" y="90">[</text>
    <rect x="118" y="70" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="138" y="90">]</text>
    <rect x="158" y="70" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="90">[</text>
    <rect x="198" y="70" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="218" y="90">[</text>
    <rect x="238" y="70" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="258" y="90">]</text>
    <rect x="278" y="70" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="298" y="90">]</text>
  </g>

  <text x="340" y="84" font-size="10.5" fill="#888">(="[][[]]")</text>

  <text x="40" y="120" font-size="11" fill="#888">bal:</text>
  <g font-size="11.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle">
    <text x="98" y="120">1</text>
    <text x="138" y="120">0</text>
    <text x="178" y="120">1</text>
    <text x="218" y="120">2</text>
    <text x="258" y="120">1</text>
    <text x="298" y="120">0</text>
  </g>

  <rect x="78" y="132" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="198" y="149" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">全程 balance ≥ 0 → 已平衡，0 次交换</text>

  <!-- Divider -->
  <path d="M 40 174 L 560 174" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section B: unbalanced ===== -->
  <text x="40" y="200" font-size="12.5" fill="#555" font-weight="bold">情形二：不平衡 s="]]][[[" — 前 3 个 ] 超前，balance 跌入负值</text>

  <text x="40" y="228" font-size="11" fill="#888">s =</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="78" y="214" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="98" y="234">]</text>
    <rect x="118" y="214" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="138" y="234">]</text>
    <rect x="158" y="214" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="178" y="234">]</text>
    <rect x="198" y="214" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="218" y="234">[</text>
    <rect x="238" y="214" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="258" y="234">[</text>
    <rect x="278" y="214" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="298" y="234">[</text>
  </g>

  <text x="40" y="266" font-size="11" fill="#888">bal:</text>
  <g font-size="11.5" text-anchor="middle">
    <text x="98" y="266" fill="#b85450" font-weight="bold">-1</text>
    <text x="138" y="266" fill="#b85450" font-weight="bold">-2</text>
    <text x="178" y="266" fill="#b85450" font-weight="bold">-3</text>
    <text x="218" y="266" fill="#888">-2</text>
    <text x="258" y="266" fill="#888">-1</text>
    <text x="298" y="266" fill="#888">0</text>
  </g>

  <text x="340" y="266" font-size="10.5" fill="#b85450" font-weight="bold">← 负值 = 超前 ]</text>

  <!-- deficit down arrows under negative balances -->
  <path d="M 98 248 L 98 256" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 138 248 L 138 256" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 178 248 L 178 256" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Divider -->
  <path d="M 40 288 L 560 288" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section C: greedy ===== -->
  <text x="40" y="314" font-size="12.5" fill="#555" font-weight="bold">贪心：每遇 balance &lt; 0 触发一次交换（与未来 [ 互换，bal += 2 纠正）</text>

  <text x="40" y="342" font-size="11" fill="#888">扫</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="78" y="328" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="98" y="348">]</text>
    <rect x="118" y="328" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="138" y="348">]</text>
    <rect x="158" y="328" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="178" y="348">]</text>
    <rect x="198" y="328" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="218" y="348">[</text>
    <rect x="238" y="328" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="258" y="348">[</text>
    <rect x="278" y="328" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="298" y="348">[</text>
  </g>

  <text x="40" y="380" font-size="11" fill="#888">bal:</text>
  <g font-size="11" text-anchor="middle">
    <text x="98" y="380" fill="#b85450" font-weight="bold">-1→1</text>
    <text x="138" y="380" fill="#888">0</text>
    <text x="178" y="380" fill="#b85450" font-weight="bold">-1→1</text>
    <text x="218" y="380" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="258" y="380" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="298" y="380" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <text x="98" y="398" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">交换①</text>
  <text x="178" y="398" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">交换②</text>

  <!-- swap arrows: pos0 -> pos5, pos2 -> pos4 -->
  <path d="M 98 362 Q 198 432 298 362" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 178 362 Q 218 412 258 362" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="78" y="446" width="420" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="288" y="465" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">balance 跌负 2 次 → 最少 2 次交换（每次纠 +2）</text>

  <!-- formula box -->
  <rect x="78" y="486" width="420" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="288" y="503" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">等价公式：k = 栈消配对后剩余 ] 个数（形如 ]^k [^k）</text>
  <text x="288" y="520" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案 = ⌈k/2⌉ = (k+1)//2</text>
</svg>
