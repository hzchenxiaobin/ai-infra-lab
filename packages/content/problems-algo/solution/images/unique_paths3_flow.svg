<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：找起点 → 统计空格 → 标记起点 → DFS 四方向</text>

  <!-- ===== Step 1: preprocess ===== -->
  <rect x="60" y="46" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">① 预处理</text>
  <text x="80" y="80" font-size="10" fill="#555">遍历网格：记录起点 (si,sj)；统计空格数 empty；令 target = empty + 1</text>

  <path d="M 310 86 L 310 92" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: mark start ===== -->
  <rect x="60" y="94" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="116" font-size="11" fill="#446688" font-weight="bold">② 标记起点：grid[si][sj] = -1（防绕回）；调用 dfs(si, sj, target, 0)</text>

  <path d="M 310 128 L 310 134" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: DFS ===== -->
  <rect x="40" y="136" width="540" height="290" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310" y="156" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ dfs(i, j, target, walked) —— 对四个方向 (ni, nj)：</text>

  <!-- decision diamond: 越界/障碍/已访问? -->
  <polygon points="310,168 410,200 310,232 210,200" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">越界 / 值==-1</text>
  <text x="310" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">（障碍或已访问）?</text>

  <!-- yes branch -->
  <path d="M 210 200 L 130 200" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="194" text-anchor="middle" font-size="9" fill="#888">是</text>
  <rect x="56" y="186" width="74" height="28" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="204" text-anchor="middle" font-size="10" fill="#777">跳过 continue</text>

  <!-- no branch -> value check -->
  <path d="M 310 232 L 310 244" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="324" y="240" font-size="9" fill="#888">否</text>

  <!-- value == 2 ? -->
  <polygon points="310,246 400,276 310,306 220,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="274" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">grid[ni][nj]==2</text>
  <text x="310" y="288" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">（终点）?</text>

  <!-- yes: check walked -->
  <path d="M 400 276 L 470 276" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="9" fill="#888">是</text>
  <polygon points="500,250 560,276 500,302 440,276" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="274" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">walked+1</text>
  <text x="500" y="286" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">==target?</text>
  <rect x="466" y="312" width="68" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="500" y="329" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans++</text>
  <path d="M 500 302 L 500 312" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: == 0 ? -->
  <path d="M 220 276 L 150 276" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="270" text-anchor="middle" font-size="9" fill="#888">否</text>
  <polygon points="80,250 150,276 80,302 10,276" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="274" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">grid[ni][nj]</text>
  <text x="80" y="286" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">==0?</text>

  <!-- yes: mark/recurse/unmark -->
  <path d="M 80 302 L 80 318" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="314" font-size="9" fill="#888">是</text>
  <rect x="20" y="320" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">① grid[ni][nj]=-1</text>
  <path d="M 80 346 L 80 352" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="354" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="372" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">② dfs(walked+1)</text>
  <path d="M 80 380 L 80 386" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="388" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="406" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">③ grid[ni][nj]=0</text>

  <!-- bottom note -->
  <rect x="180" y="380" width="380" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="398" font-size="10" fill="#b85450" font-weight="bold">⚠ 终点只计数不递归</text>
  <text x="200" y="410" font-size="9" fill="#555">终点是路径最后一格，过了终点不能再走；故不标记/不递归/不撤销</text>

  <!-- ===== return ===== -->
  <rect x="180" y="432" width="260" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="448" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ 遍历完所有起点分支 → 返回 ans</text>
</svg>
