<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">操作、gcd 不变量与三分支判定</text>

  <!-- Operation demo: pair [a | b] -->
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#666">操作：选 i，把 a 或 b 之一换成 gcd(a,b)</text>
  <rect x="232" y="62" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="256" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="280" y="62" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="304" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <text x="280" y="60" text-anchor="middle" font-size="10" fill="#b85450">↑ 选 i</text>

  <!-- two outcome branches -->
  <path d="M 250 104 Q 170 120 150 138" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 104 Q 390 120 410 138" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outcome 1: replace a -->
  <rect x="92" y="138" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="116" y="164" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">gcd</text>
  <rect x="140" y="138" width="48" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="164" y="164" text-anchor="middle" font-size="16" fill="#999">b</text>
  <text x="140" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">替换 a</text>

  <!-- outcome 2: replace b -->
  <rect x="368" y="138" width="48" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="392" y="164" text-anchor="middle" font-size="16" fill="#999">a</text>
  <rect x="416" y="138" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="440" y="164" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">gcd</text>
  <text x="416" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">替换 b</text>

  <!-- Invariant callout -->
  <rect x="40" y="208" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#333"><tspan font-weight="bold" fill="#d6a040">不变量</tspan>：gcd(其余, a, b) = gcd(其余, gcd(a,b))</text>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#7a5a20">→ 全数组 gcd 在任何操作下恒等于初值 g₀</text>

  <!-- Three branches -->
  <!-- Branch A: red -->
  <rect x="22" y="266" width="160" height="190" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="22" y="266" width="160" height="30" fill="#b85450" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="22" y="284" width="160" height="12" fill="#b85450" filter="url(#rough2)"/>
  <text x="102" y="286" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">A. 整体 gcd &gt; 1</text>
  <text x="102" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 -1</text>
  <text x="100" y="342" text-anchor="middle" font-size="10.5" fill="#555">gcd 恒 &gt;1</text>
  <text x="100" y="358" text-anchor="middle" font-size="10.5" fill="#555">永远造不出 1</text>
  <rect x="40" y="378" width="124" height="60" fill="#ffffff" stroke="#d8a0a0" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="102" y="396" text-anchor="middle" font-size="10" fill="#888">例 [2,10,6,14]</text>
  <text x="102" y="412" text-anchor="middle" font-size="10" fill="#888">整体 gcd = 2</text>
  <text x="102" y="428" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">→ -1</text>

  <!-- Branch B: green -->
  <rect x="200" y="266" width="160" height="190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="200" y="266" width="160" height="30" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="200" y="284" width="160" height="12" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">B. gcd=1 且含 1</text>
  <text x="280" y="316" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">n − ones</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#555">gcd(1,x)=1</text>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#555">每个非1 一次扩散</text>
  <rect x="218" y="378" width="124" height="60" fill="#ffffff" stroke="#9abf8a" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#888">例 [1,2,1,3]</text>
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#888">ones=2 → 4−2</text>
  <text x="280" y="428" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ 2</text>

  <!-- Branch C: blue -->
  <rect x="378" y="266" width="160" height="190" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="378" y="266" width="160" height="30" fill="#446688" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="378" y="284" width="160" height="12" fill="#446688" filter="url(#rough2)"/>
  <text x="458" y="286" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">C. gcd=1 但无 1</text>
  <text x="458" y="316" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">(L−1)+(n−1)</text>
  <text x="458" y="342" text-anchor="middle" font-size="10.5" fill="#555">L=最短 gcd=1 段</text>
  <text x="458" y="358" text-anchor="middle" font-size="10.5" fill="#555">先造1 再扩散</text>
  <rect x="396" y="378" width="124" height="60" fill="#ffffff" stroke="#9ab0c8" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="458" y="396" text-anchor="middle" font-size="10" fill="#888">例 [2,6,3,4]</text>
  <text x="458" y="412" text-anchor="middle" font-size="10" fill="#888">L=2 → 1+3</text>
  <text x="458" y="428" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">→ 4</text>

  <!-- bottom note -->
  <text x="280" y="472" text-anchor="middle" font-size="10.5" fill="#888">A 定可行性，B 直接计数，C 造首个 1（取最短 L）后转入 B 的扩散</text>
</svg>
