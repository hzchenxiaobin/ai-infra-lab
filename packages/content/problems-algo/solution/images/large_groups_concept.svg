<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="320" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：连续相同字符构成"分组"，长度 ≥ 3 即"较大分组"</text>

  <!-- index labels: 0..9, cell w=40, start x=70, centers 90,130,...,450 -->
  <text x="90" y="56" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="130" y="56" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="170" y="56" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="210" y="56" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="250" y="56" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="290" y="56" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="330" y="56" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="370" y="56" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="410" y="56" text-anchor="middle" font-size="10" fill="#888">8</text>
  <text x="450" y="56" text-anchor="middle" font-size="10" fill="#888">9</text>

  <!-- cells: a b b x x x x z z y -->
  <rect x="70" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="110" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="150" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="190" y="64" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="90" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">x</text>
  <rect x="230" y="64" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="90" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">x</text>
  <rect x="270" y="64" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="90" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">x</text>
  <rect x="310" y="64" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="90" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">x</text>
  <rect x="350" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">z</text>
  <rect x="390" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">z</text>
  <rect x="430" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">y</text>

  <!-- group frames (slightly larger, no fill) -->
  <rect x="66" y="60" width="48" height="48" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <rect x="106" y="60" width="88" height="48" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <rect x="186" y="60" width="168" height="48" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <rect x="346" y="60" width="88" height="48" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <rect x="426" y="60" width="48" height="48" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>

  <!-- group length labels below frames -->
  <text x="90" y="128" text-anchor="middle" font-size="10.5" fill="#888">"a" len=1 ✗</text>
  <text x="150" y="128" text-anchor="middle" font-size="10.5" fill="#888">"bb" len=2 ✗</text>
  <text x="270" y="128" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">"xxxx" len=4 ✓</text>
  <text x="390" y="128" text-anchor="middle" font-size="10.5" fill="#888">"zz" len=2 ✗</text>
  <text x="450" y="128" text-anchor="middle" font-size="10.5" fill="#888">"y" len=1 ✗</text>

  <!-- large group interval callout -->
  <path d="M 270 132 L 270 150" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="150" y="152" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">较大分组区间 [3, 6] → 记入结果</text>

  <!-- rule box -->
  <rect x="48" y="200" width="444" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">判定规则</text>
  <text x="270" y="242" text-anchor="middle" font-size="11.5" fill="#d6a040">分组长度 = end − start + 1 ≥ 3  ⇔  end − start ≥ 2</text>

  <!-- example note -->
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#666">输入 s = "abbxxxxzzy" → 输出 [[3,6]]</text>
  <text x="270" y="300" text-anchor="middle" font-size="10.5" fill="#888">只有 "xxxx" 这一个分组长度达到 3</text>
</svg>
