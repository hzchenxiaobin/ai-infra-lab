<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">IPv4 vs IPv6：分隔符、段数、段内规则三处不同</text>

  <!-- ===== IPv4 ===== -->
  <rect x="26" y="74" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="54" y="96" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">IPv4</text>

  <rect x="100" y="72" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="125" y="94" text-anchor="middle" font-size="12" fill="#333">172</text>
  <text x="165" y="95" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">.</text>
  <rect x="178" y="72" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="203" y="94" text-anchor="middle" font-size="12" fill="#333">16</text>
  <text x="243" y="95" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">.</text>
  <rect x="256" y="72" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="281" y="94" text-anchor="middle" font-size="12" fill="#333">254</text>
  <text x="321" y="95" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">.</text>
  <rect x="334" y="72" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="359" y="94" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="404" y="72" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="469" y="93" text-anchor="middle" font-size="11" fill="#7a5415">3 个 “.” → 4 段</text>

  <rect x="100" y="128" width="92" height="24" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="146" y="144" text-anchor="middle" font-size="11" fill="#555">每段 0-255</text>
  <rect x="200" y="128" width="92" height="24" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="246" y="144" text-anchor="middle" font-size="11" fill="#555">纯十进制数字</text>
  <rect x="300" y="128" width="92" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="346" y="144" text-anchor="middle" font-size="11" fill="#b85450">无前导零</text>

  <path d="M 30 176 L 530 176" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- ===== IPv6 ===== -->
  <rect x="26" y="204" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="54" y="226" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">IPv6</text>

  <rect x="100" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="122" y="224" text-anchor="middle" font-size="11" fill="#333">2001</text>
  <text x="150" y="224" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">:</text>
  <rect x="156" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="224" text-anchor="middle" font-size="11" fill="#333">0db8</text>
  <text x="206" y="224" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">:</text>
  <rect x="212" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="234" y="224" text-anchor="middle" font-size="11" fill="#333">85a3</text>
  <text x="262" y="224" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">:</text>
  <rect x="268" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="290" y="224" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="318" y="224" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">:</text>
  <rect x="324" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="346" y="224" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="374" y="224" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">:</text>
  <rect x="380" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="402" y="224" text-anchor="middle" font-size="11" fill="#333">8A2E</text>
  <text x="430" y="224" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">:</text>
  <rect x="436" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="458" y="224" text-anchor="middle" font-size="11" fill="#333">0370</text>
  <text x="486" y="224" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">:</text>
  <rect x="492" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="514" y="224" text-anchor="middle" font-size="11" fill="#333">7334</text>

  <rect x="100" y="258" width="80" height="24" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="140" y="274" text-anchor="middle" font-size="11" fill="#555">7 个 “:”→8 段</text>
  <rect x="188" y="258" width="80" height="24" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="228" y="274" text-anchor="middle" font-size="11" fill="#555">每段 1-4 位</text>
  <rect x="276" y="258" width="80" height="24" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="316" y="274" text-anchor="middle" font-size="11" fill="#555">十六进制</text>
  <rect x="364" y="258" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="410" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a">允许前导零</text>

  <text x="280" y="312" text-anchor="middle" font-size="11.5" fill="#666">切分后段数 == 4 / 8 即分流版本，再逐段套段内规则</text>
  <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#999">空段（连续分隔符 / 首尾分隔符）会被 “段数不对” 或 “p 为空” 自然拦截</text>
</svg>
