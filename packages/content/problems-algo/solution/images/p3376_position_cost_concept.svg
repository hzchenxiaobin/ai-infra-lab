<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 385"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="385" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：开锁耗时只由「第几个开」决定</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">能量从 0 出发每分钟 +x → 攒够 s 恰需 ⌈s/x⌉ 分钟；开完能量清零，x += k</text>

  <!-- ===== 四个开锁档位 ===== -->
  <rect x="25" y="58" width="100" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="75" y="78" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">第 1 把</text>
  <text x="75" y="103" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 1</text>
  <text x="75" y="121" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">t = ⌈s/1⌉ 分钟</text>

  <rect x="148" y="58" width="100" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="198" y="78" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">第 2 把</text>
  <text x="198" y="103" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 1+k</text>
  <text x="198" y="121" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">t = ⌈s/(1+k)⌉ 分钟</text>

  <rect x="271" y="58" width="100" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="321" y="78" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">第 3 把</text>
  <text x="321" y="103" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 1+2k</text>
  <text x="321" y="121" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">t = ⌈s/(1+2k)⌉ 分钟</text>

  <rect x="394" y="58" width="100" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="444" y="78" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">第 4 把</text>
  <text x="444" y="103" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 1+3k</text>
  <text x="444" y="121" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">t = ⌈s/(1+3k)⌉ 分钟</text>

  <!-- 档位之间的 +k 箭头 -->
  <line x1="128" y1="94" x2="145" y2="94" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="136" y="85" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">+k</text>
  <line x1="251" y1="94" x2="268" y2="94" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="259" y="85" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">+k</text>
  <line x1="374" y1="94" x2="391" y2="94" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="382" y="85" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">+k</text>

  <text x="260" y="149" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">开第 j 把时的能量因子 x = 1 + (j−1)·k（例：k = 2 → 依次 1, 3, 5, 7）</text>

  <!-- ===== 关键洞察 ===== -->
  <rect x="25" y="162" width="469" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">已开 j 把 ⇒ x = 1 + j·k —— 只数「个数」，不看「开的是哪几把、先后如何」</text>
  <text x="260" y="203" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">同一 popcount(mask) 的所有开局历史完全等价，历史被压缩成一个数字</text>

  <!-- ===== 排列 vs 子集 ===== -->
  <rect x="25" y="238" width="205" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="127" y="258" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">按「顺序」枚举</text>
  <text x="127" y="274" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">全排列 n! = 8! = 40320 条路径</text>
  <text x="127" y="290" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">「先 A 后 B」与「先 B 后 A」重复算</text>

  <line x1="234" y1="272" x2="283" y2="272" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="258" y="262" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">坍缩</text>
  <text x="258" y="289" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">n! → 2ⁿ</text>

  <rect x="289" y="238" width="205" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="391" y="258" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">按「集合」枚举</text>
  <text x="391" y="274" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">子集 2ⁿ = 256 个状态</text>
  <text x="391" y="290" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">dp[mask]：已开集合恰为 mask</text>

  <!-- ===== 结论 ===== -->
  <rect x="25" y="326" width="469" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">dp[mask] = 打开 mask 中全部锁的最少时间；转移时 x = 1 + k·popcount(mask)</text>
  <text x="260" y="360" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">dp[mask | 1&lt;&lt;i] ← min(dp[mask | 1&lt;&lt;i], dp[mask] + ⌈s[i]/x⌉)</text>
</svg>
