<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGrn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：关系除法——应修集合 C(s) ⊆ 拿 A 集合 E(s)</text>

  <!-- Alice card -->
  <rect x="16" y="34" width="244" height="112" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="138" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Alice（id 1）· CS 专业</text>
  <text x="28" y="73" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">应修 C(s) =</text>
  <rect x="112" y="59" width="46" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="135" y="73" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">101</text>
  <rect x="164" y="59" width="46" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="187" y="73" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">102</text>
  <text x="28" y="103" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">拿 A E(s) =</text>
  <rect x="112" y="89" width="46" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="135" y="103" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">101</text>
  <rect x="164" y="89" width="46" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="187" y="103" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">102</text>
  <text x="138" y="134" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C ⊆ E ✓ 全修全 A（此处恰有 C = E）</text>

  <!-- Bob card -->
  <rect x="262" y="34" width="244" height="112" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Bob（id 2）· CS 专业</text>
  <text x="274" y="73" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">应修 C(s) =</text>
  <rect x="358" y="59" width="46" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="381" y="73" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">101</text>
  <rect x="410" y="59" width="46" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="433" y="73" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">102</text>
  <text x="274" y="103" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">拿 A E(s) =</text>
  <rect x="358" y="89" width="46" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="381" y="103" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">102</text>
  <rect x="410" y="89" width="46" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="433" y="103" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">101✗</text>
  <text x="384" y="134" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">101 没拿到 A（只有 B）→ C ⊄ E ✗</text>

  <!-- arrows down to venns -->
  <path d="M 132 148 L 132 160" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGrn)" filter="url(#rough2)"/>
  <path d="M 384 148 L 384 160" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrGrn)" filter="url(#rough2)"/>

  <!-- Alice venn: C inside E -->
  <ellipse cx="130" cy="216" rx="80" ry="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="130" cy="216" rx="42" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="184" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">E（拿 A）</text>
  <text x="130" y="220" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">C（应修）</text>
  <text x="130" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C 整个落在 E 里 → 包含 ✓</text>

  <!-- Bob venn: C sticks out -->
  <ellipse cx="402" cy="216" rx="58" ry="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="374" cy="216" rx="54" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="336" cy="216" rx="20" ry="18" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="336" y="250" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">101 在 E 外</text>
  <text x="432" y="180" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">E（拿 A）</text>
  <text x="396" y="220" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">C（应修）</text>
  <text x="396" y="280" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">C 有缺口（101）→ 不包含 ✗</text>

  <!-- bottom equivalence strip -->
  <rect x="16" y="292" width="490" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="261" y="310" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">等价链：C(s) ⊆ E(s) ⟺ 不存在任何一门本专业课「没拿到 A」</text>
  <text x="261" y="327" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">SQL 化（解法 A）：SUM(grade = 'A') = COUNT(*) ⟺ A 行数 = 总行数</text>
  <text x="261" y="343" text-anchor="middle" font-size="8.5" fill="#a08430" filter="url(#rough2)">credits 列是干扰信息（3188 才参与计算）；外专业课的 A 不算数</text>
</svg>
