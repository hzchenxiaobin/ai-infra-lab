<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：把每个 1×1 格子再切成 4 个小三角</text>

  <!-- ===== Cell 1: space ' ' ===== -->
  <text x="100" y="62" text-anchor="middle" font-size="12" fill="#888">空格 ' '</text>
  <!-- square outline -->
  <rect x="52" y="72" width="96" height="96" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- diagonals to make 4 triangles (dashed, light) -->
  <line x1="52" y1="72" x2="148" y2="168" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="148" y1="72" x2="52" y2="168" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <!-- all 4 triangles same color = 1 region -->
  <polygon points="52,72 148,72 100,120" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="148,72 148,168 100,120" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="148,168 52,168 100,120" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="52,168 52,72 100,120" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="100" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="132" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="100" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="68" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="62" y="180" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="100" y="195" text-anchor="middle" font-size="10.5" fill="#4a7a3a">合 4 块 → 1 区</text>

  <!-- ===== Cell 2: slash '/' ===== -->
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#888">斜杠 '/'</text>
  <rect x="222" y="72" width="96" height="96" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- the slash from bottom-left to top-right, bold -->
  <line x1="222" y1="168" x2="318" y2="72" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <!-- top(0)+left(3) one color ; right(1)+bottom(2) another -->
  <polygon points="222,72 318,72 270,120" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <polygon points="318,72 318,168 270,120" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <polygon points="318,168 222,168 270,120" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <polygon points="222,168 222,72 270,120" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <text x="270" y="106" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>
  <text x="302" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="270" y="142" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="238" y="124" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <rect x="232" y="180" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="195" text-anchor="middle" font-size="10.5" fill="#446688">0∪3 ; 1∪2</text>

  <!-- ===== Cell 3: backslash '\' ===== -->
  <text x="440" y="62" text-anchor="middle" font-size="12" fill="#888">反斜杠 '\'</text>
  <rect x="392" y="72" width="96" height="96" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- the backslash from top-left to bottom-right, bold -->
  <line x1="392" y1="72" x2="488" y2="168" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <!-- top(0)+right(1) one color ; bottom(2)+left(3) another -->
  <polygon points="392,72 488,72 440,120" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <polygon points="488,72 488,168 440,120" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <polygon points="488,168 392,168 440,120" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <polygon points="392,168 392,72 440,120" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <text x="440" y="106" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>
  <text x="472" y="124" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="440" y="142" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="408" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <rect x="402" y="180" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="440" y="195" text-anchor="middle" font-size="10.5" fill="#446688">0∪1 ; 2∪3</text>

  <!-- ===== Between cells ===== -->
  <text x="270" y="232" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">相邻格子的共边三角也要合并</text>

  <!-- two adjacent cells horizontally -->
  <rect x="120" y="252" width="80" height="80" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="200" y="252" width="80" height="80" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- center points -->
  <line x1="120" y1="252" x2="200" y2="332" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="200" y1="252" x2="120" y2="332" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="200" y1="252" x2="280" y2="332" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="280" y1="252" x2="200" y2="332" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="160" y="296" text-anchor="middle" font-size="9" fill="#888">左格</text>
  <text x="240" y="296" text-anchor="middle" font-size="9" fill="#888">右格</text>
  <!-- highlight right(1) of left cell and left(3) of right cell -->
  <polygon points="200,252 200,332 160,292" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <polygon points="200,252 200,332 240,292" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <text x="185" y="278" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">1</text>
  <text x="215" y="278" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">3</text>
  <!-- merge arrow -->
  <path d="M 186 300 Q 200 312 214 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="350" text-anchor="middle" font-size="10" fill="#b85450">union(左.1, 右.3)</text>

  <!-- vertical adjacency illustration -->
  <rect x="340" y="252" width="80" height="80" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="340" y="332" width="80" height="80" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="340" y1="252" x2="420" y2="332" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="420" y1="252" x2="340" y2="332" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="340" y1="332" x2="420" y2="412" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="420" y1="332" x2="340" y2="412" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="380" y="296" text-anchor="middle" font-size="9" fill="#888">上格</text>
  <text x="380" y="376" text-anchor="middle" font-size="9" fill="#888">下格</text>
  <polygon points="340,332 420,332 380,292" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="340,332 420,332 380,372" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="380" y="322" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="380" y="350" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">0</text>
  <path d="M 366 330 Q 380 346 394 330" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
