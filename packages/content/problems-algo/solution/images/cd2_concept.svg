<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">哈希映射：存最近下标，比距离即判</text>
  <path d="M 150 44 Q 280 52 410 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 数组行 -->
  <text x="60" y="92" text-anchor="end" font-size="13" fill="#666">nums</text>

  <g filter="url(#rough2)">
    <rect x="90" y="76" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="120" y="101" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="120" y="70" text-anchor="middle" font-size="10" fill="#888">0</text>

  <g filter="url(#rough2)">
    <rect x="160" y="76" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="190" y="101" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="190" y="70" text-anchor="middle" font-size="10" fill="#888">1</text>

  <g filter="url(#rough2)">
    <rect x="230" y="76" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="101" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="260" y="70" text-anchor="middle" font-size="10" fill="#888">2</text>

  <!-- index 3: 1 当前（高亮） -->
  <g filter="url(#rough2)">
    <rect x="300" y="76" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="330" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">1</text>
  <text x="330" y="70" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- 扫描指针 -->
  <path d="M 330 56 L 330 70" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="354" y="58" font-size="11" fill="#d6a040">i=3</text>

  <!-- 查询说明 -->
  <text x="330" y="142" text-anchor="middle" font-size="11" fill="#888">当前 nums[i] = 1，k = 3</text>
  <path d="M 330 152 Q 330 184 220 214" stroke="#3a3a3a" stroke-width="1.6" fill="none"
        stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="182" text-anchor="middle" font-size="12" fill="#3a3a3a">1 ∈ last ?</text>

  <!-- last 映射框 -->
  <g filter="url(#rough2)">
    <rect x="90" y="220" width="280" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="230" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">last（值 → 最近下标）</text>

  <g filter="url(#rough2)">
    <ellipse cx="140" cy="270" rx="26" ry="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="140" y="274" text-anchor="middle" font-size="11" fill="#333">1 : 0</text>

  <g filter="url(#rough2)">
    <ellipse cx="200" cy="270" rx="26" ry="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="200" y="274" text-anchor="middle" font-size="11" fill="#333">2 : 1</text>

  <g filter="url(#rough2)">
    <ellipse cx="260" cy="270" rx="26" ry="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#333">3 : 2</text>

  <!-- 命中标记：1:0 高亮 -->
  <g filter="url(#rough2)">
    <ellipse cx="140" cy="270" rx="26" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="140" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">1 : 0</text>

  <!-- 命中结果箭头 -->
  <path d="M 140 287 Q 140 302 170 316" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 结果框 -->
  <g filter="url(#rough2)">
    <rect x="110" y="316" width="280" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="250" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✓ 3 − 0 = 3 ≤ k=3 → 返回 true</text>

  <!-- 右侧说明 -->
  <g filter="url(#rough2)">
    <rect x="400" y="220" width="140" height="86" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="470" y="242" text-anchor="middle" font-size="11" fill="#666">覆盖更新：</text>
  <text x="470" y="258" text-anchor="middle" font-size="11" fill="#666">只留最近下标</text>
  <text x="470" y="276" text-anchor="middle" font-size="11" fill="#446688">更近 → 距离更小</text>
  <text x="470" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 更易 ≤ k</text>
</svg>
