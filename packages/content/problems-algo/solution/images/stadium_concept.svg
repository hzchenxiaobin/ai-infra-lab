<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：筛 people≥100 → 找连续 id 段(≥3) → 输出段内全部行</text>

  <!-- Stadium table (left) -->
  <text x="110" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Stadium 表（按 id 排序）</text>
  <rect x="40" y="62" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="77" font-size="10" fill="#333">id</text>
  <text x="98" y="77" font-size="10" fill="#333">visit_date</text>
  <text x="148" y="77" font-size="10" fill="#333">people</text>
  <line x1="74" y1="62" x2="74" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="128" y1="62" x2="128" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: people=10, invalid -->
  <rect x="40" y="84" width="140" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="98" font-size="10" fill="#999">1</text>
  <text x="98" y="98" font-size="9" fill="#999">01-01</text>
  <text x="148" y="98" font-size="10" fill="#999">10</text>
  <line x1="74" y1="84" x2="74" y2="104" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="128" y1="84" x2="128" y2="104" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 2: people=109, valid but streak<3 -->
  <rect x="40" y="104" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="118" font-size="10" fill="#333">2</text>
  <text x="98" y="118" font-size="9" fill="#333">01-02</text>
  <text x="148" y="118" font-size="10" fill="#333">109</text>
  <line x1="74" y1="104" x2="74" y2="124" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="128" y1="104" x2="128" y2="124" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 3: people=150, valid but streak<3 -->
  <rect x="40" y="124" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="138" font-size="10" fill="#333">3</text>
  <text x="98" y="138" font-size="9" fill="#333">01-03</text>
  <text x="148" y="138" font-size="10" fill="#333">150</text>
  <line x1="74" y1="124" x2="74" y2="144" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="128" y1="124" x2="128" y2="144" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 4: people=99, invalid (breaks streak) -->
  <rect x="40" y="144" width="140" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="158" font-size="10" fill="#999">4</text>
  <text x="98" y="158" font-size="9" fill="#999">01-04</text>
  <text x="148" y="158" font-size="10" fill="#999">99</text>
  <line x1="74" y1="144" x2="74" y2="164" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="128" y1="144" x2="128" y2="164" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- rows 5-8: streak of 4 (highlighted) -->
  <rect x="40" y="164" width="140" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="178" font-size="10" fill="#333">5</text>
  <text x="98" y="178" font-size="9" fill="#333">01-05</text>
  <text x="148" y="178" font-size="10" fill="#333">145</text>
  <line x1="74" y1="164" x2="74" y2="184" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="128" y1="164" x2="128" y2="184" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="184" width="140" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="198" font-size="10" fill="#333">6</text>
  <text x="98" y="198" font-size="9" fill="#333">01-06</text>
  <text x="148" y="198" font-size="10" fill="#333">1455</text>
  <line x1="74" y1="184" x2="74" y2="204" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="128" y1="184" x2="128" y2="204" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="204" width="140" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="218" font-size="10" fill="#333">7</text>
  <text x="98" y="218" font-size="9" fill="#333">01-07</text>
  <text x="148" y="218" font-size="10" fill="#333">199</text>
  <line x1="74" y1="204" x2="74" y2="224" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="128" y1="204" x2="128" y2="224" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="224" width="140" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="238" font-size="10" fill="#333">8</text>
  <text x="98" y="238" font-size="9" fill="#333">01-08</text>
  <text x="148" y="238" font-size="10" fill="#333">188</text>
  <line x1="74" y1="224" x2="74" y2="244" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="128" y1="224" x2="128" y2="244" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Streak bracket on left side of table -->
  <path d="M34 104 Q28 104 28 134 Q28 144 34 144" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="20" y="128" font-size="9" fill="#b85450" font-weight="bold">段长2</text>
  <text x="20" y="139" font-size="9" fill="#b85450">✗&lt;3</text>

  <path d="M34 164 Q26 164 26 204 Q26 244 34 244" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="16" y="208" font-size="10" fill="#b85450" font-weight="bold">段长4</text>
  <text x="16" y="220" font-size="10" fill="#b85450" font-weight="bold">✓≥3</text>

  <!-- Arrow to output -->
  <path d="M190 204 L300 204" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="245" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a">输出整段</text>

  <!-- Output table (right) -->
  <text x="420" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出（按 visit_date 排序）</text>
  <rect x="330" y="170" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="185" font-size="10" fill="#333">id</text>
  <text x="402" y="185" font-size="10" fill="#333">visit_date</text>
  <text x="468" y="185" font-size="10" fill="#333">people</text>
  <line x1="372" y1="170" x2="372" y2="192" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="438" y1="170" x2="438" y2="192" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="330" y="192" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="352" y="206" font-size="10" fill="#333">5</text>
  <text x="402" y="206" font-size="9" fill="#333">2017-01-05</text>
  <text x="468" y="206" font-size="10" fill="#333">145</text>
  <line x1="372" y1="192" x2="372" y2="212" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="438" y1="192" x2="438" y2="212" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="330" y="212" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="352" y="226" font-size="10" fill="#333">6</text>
  <text x="402" y="226" font-size="9" fill="#333">2017-01-06</text>
  <text x="468" y="226" font-size="10" fill="#333">1455</text>
  <line x1="372" y1="212" x2="372" y2="232" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="438" y1="212" x2="438" y2="232" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="330" y="232" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="352" y="246" font-size="10" fill="#333">7</text>
  <text x="402" y="246" font-size="9" fill="#333">2017-01-07</text>
  <text x="468" y="246" font-size="10" fill="#333">199</text>
  <line x1="372" y1="232" x2="372" y2="252" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="438" y1="232" x2="438" y2="252" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="330" y="252" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="352" y="266" font-size="10" fill="#333">8</text>
  <text x="402" y="266" font-size="9" fill="#333">2017-01-08</text>
  <text x="468" y="266" font-size="10" fill="#333">188</text>
  <line x1="372" y1="252" x2="372" y2="272" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="438" y1="252" x2="438" y2="272" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Bottom insight box -->
  <rect x="30" y="300" width="520" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="322" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">核心观察：行属于"3+连续段" ⟺ 它是某合法三元组的第1/2/3个元素</text>
  <text x="48" y="344" font-size="10" fill="#333">① 灰行(people&lt;100)断开连续性：id=4 的 99 把 2,3 与 5,6,7,8 劈成两段</text>
  <text x="48" y="362" font-size="10" fill="#333">② 段{2,3} 长度 2 &lt; 3 → 丢弃；段{5,6,7,8} 长度 4 ≥ 3 → 全部输出</text>
  <text x="48" y="380" font-size="10" fill="#b85450">⚠️ 与 180 题关键区别：180 输出"去重的 num 值"，601 输出"整段全部完整行"（id 不去重）</text>
  <text x="48" y="396" font-size="10" fill="#333">③ 4 连段含两个三元组(5-6-7, 6-7-8)，故 5/6/7/8 都是某三元组成员 → 都输出</text>
</svg>
