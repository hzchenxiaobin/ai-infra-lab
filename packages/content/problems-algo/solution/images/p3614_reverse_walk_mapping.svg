<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：正向只记长度，逆向把 k 映射回字母</text>

  <!-- ① 正向长度条 -->
  <text x="200" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">① 正向一趟：只维护长度（例 s = cd%#*#）</text>

  <rect x="16" y="58" width="36" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="34" y="75" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>

  <rect x="76" y="58" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <rect x="132" y="58" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d</text>
  <rect x="188" y="58" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">%</text>
  <rect x="244" y="58" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">#</text>
  <rect x="300" y="58" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">*</text>
  <rect x="356" y="58" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">#</text>

  <path d="M 52 71 L 74 71" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 110 71 L 130 71" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 166 71 L 186 71" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 222 71 L 242 71" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 278 71 L 298 71" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 334 71 L 354 71" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="93" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="149" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="205" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="261" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="317" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="373" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">6</text>

  <text x="455" y="64" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">result 长度可达 10^15</text>
  <text x="455" y="80" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">存不下串 ⇒ 只存长度</text>

  <!-- ② 逆向撤销链 -->
  <text x="16" y="128" font-size="12" fill="#666" filter="url(#rough2)">② 逆向撤销：从末尾把 k 逐步还原（k = 3）</text>

  <rect x="24" y="136" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="109" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k=3 · 撤销 s[5]='#'</text>

  <path d="M 109 160 L 109 178" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="172" font-size="10" fill="#d6a040" filter="url(#rough2)">k ≥ 3 ⇒ k−=3</text>

  <rect x="24" y="178" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="109" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k=0 · 撤销 s[4]='*'</text>

  <path d="M 109 202 L 109 220" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="214" font-size="10" fill="#b85450" filter="url(#rough2)">删尾 ⇒ k 不变</text>

  <rect x="24" y="220" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="109" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k=0 · 撤销 s[3]='#'</text>

  <path d="M 109 244 L 109 262" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="256" font-size="10" fill="#d6a040" filter="url(#rough2)">k &lt; 2 ⇒ 不变</text>

  <rect x="24" y="262" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="109" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k=0 · 撤销 s[2]='%'</text>

  <path d="M 109 286 L 109 304" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="298" font-size="10" fill="#d6a040" filter="url(#rough2)">镜像 k=2−1−0=1</text>

  <rect x="24" y="304" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="109" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">k=1==len ⇒ 答案 'd'</text>

  <!-- 撤销规则框 -->
  <rect x="246" y="136" width="258" height="194" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="375" y="158" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">撤销规则（len = 该操作前的长度）</text>

  <text x="260" y="182" font-size="10.5" fill="#446688" filter="url(#rough2)">字母 c：k == len ⇒ 返回 c</text>
  <text x="260" y="196" font-size="10" fill="#999" filter="url(#rough2)">（c 恰好追加在位置 len）</text>

  <text x="260" y="222" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">'#'：k ≥ len ⇒ k −= len</text>
  <text x="260" y="236" font-size="10" fill="#999" filter="url(#rough2)">（k 落在后半份拷贝）</text>

  <text x="260" y="262" font-size="10.5" fill="#d6a040" filter="url(#rough2)">'%'：k = len − 1 − k</text>
  <text x="260" y="276" font-size="10" fill="#999" filter="url(#rough2)">（反转 = 下标镜像）</text>

  <text x="260" y="302" font-size="10.5" fill="#b85450" filter="url(#rough2)">'*'：只删最后一个字符</text>
  <text x="260" y="316" font-size="10" fill="#999" filter="url(#rough2)">⇒ 合法 k 保持不变</text>

  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">答案 'd'，与示例 2 一致 ✅</text>
</svg>
