<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="120" y="30" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">阶段一 · 逆序填表（定最优性）</text>
  <text x="402" y="30" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">阶段二 · 贪心重构（定字典序）</text>

  <!-- Phase 1 -->
  <rect x="20" y="44" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="60" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 初始化（收尾项）</text>
  <text x="120" y="78" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">dp[full][last] = |last − nums[0]|</text>

  <path d="M 120 88 L 120 98" stroke="#446688" stroke-width="1.6" stroke-linecap="round" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="20" y="100" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="116" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 倒序填表</text>
  <text x="120" y="131" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">mask 从 full−1 递减到 1</text>
  <text x="120" y="144" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">（转移只走向更大的 mask，右侧先就绪）</text>

  <path d="M 120 148 L 120 158" stroke="#446688" stroke-width="1.6" stroke-linecap="round" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="20" y="160" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="176" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 枚举 v ∉ mask</text>
  <text x="120" y="192" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">dp[mask][last] = min(</text>
  <text x="120" y="207" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">|last−nums[v]| + dp[mask∪{v}][v] )</text>

  <path d="M 120 216 L 120 226" stroke="#446688" stroke-width="1.6" stroke-linecap="round" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="20" y="228" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="244" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">dp 表就绪！</text>
  <text x="120" y="259" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">dp[{0}][0] = 最低分数</text>

  <!-- connector -->
  <path d="M 220 248 L 254 248 Q 260 248 260 242 L 260 70 Q 260 64 266 64 L 294 64" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text transform="rotate(-90 252 152)" x="252" y="152" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">dp 表就绪，转重构</text>

  <!-- Phase 2 -->
  <rect x="300" y="44" width="204" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="402" y="58" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">初始化</text>
  <text x="402" y="72" text-anchor="middle" font-size="8.5" fill="#8a6a1f" filter="url(#rough2)">mask = {0}，last = 0，perm = [0]</text>

  <path d="M 402 80 L 401 86" stroke="#446688" stroke-width="1.6" stroke-linecap="round" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond 1 -->
  <polygon points="400,88 512,118 400,148 288,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="107" text-anchor="middle" font-size="8" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">按 v 从小到大试探</text>
  <text x="400" y="121" text-anchor="middle" font-size="8" fill="#8a6a1f" filter="url(#rough2)">|last−nums[v]| + dp[mask∪{v}][v]</text>
  <text x="400" y="134" text-anchor="middle" font-size="8" fill="#8a6a1f" filter="url(#rough2)">= dp[mask][last] ？</text>

  <path d="M 512 118 C 518 110 516 96 502 92" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="519" y="103" text-anchor="end" font-size="7.5" fill="#b85450" filter="url(#rough2)">否：下一个 v</text>

  <path d="M 400 148 L 400 156" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="408" y="156" font-size="9" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">是</text>

  <rect x="300" y="158" width="204" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="402" y="174" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">选定 v ✓</text>
  <text x="402" y="189" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">perm 追加 v；mask ∪= {v}；last = v</text>

  <path d="M 402 196 L 401 202" stroke="#446688" stroke-width="1.6" stroke-linecap="round" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond 2 -->
  <polygon points="400,204 468,226 400,248 332,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="229" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">已放满 n 个？</text>

  <path d="M 332 226 C 288 226 284 130 288 120" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text transform="rotate(-90 276 172)" x="276" y="172" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">是：填下一个位置</text>

  <path d="M 400 248 L 400 258" stroke="#b85450" stroke-width="1.6" stroke-linecap="round" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="408" y="258" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">否·放满</text>

  <rect x="300" y="260" width="204" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="402" y="278" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">输出 perm</text>
  <text x="402" y="293" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">最低分且字典序最小，总分 = dp[{0}][0]</text>

  <!-- bottom note -->
  <rect x="16" y="312" width="488" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">贪心重构：每步取「能守住 dp 值的最小 v」—— 等式保证不丢最优，v 升序保证逐位最小</text>
  <text x="260" y="344" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">⇒ 构造出的正是字典序最小的最低分排列（示例 2 中 v=1 更小，但 4 ≠ 2，必须让位）</text>
</svg>
