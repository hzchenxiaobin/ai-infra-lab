<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [1, 5, 0, 10, 14]</text>

  <!-- Step 1: original array -->
  <text x="56" y="58" font-size="11" fill="#888">原数组</text>
  <g font-size="13">
    <rect x="159" y="44" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="180" y="64" text-anchor="middle" fill="#333">1</text>
    <rect x="204" y="44" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="225" y="64" text-anchor="middle" fill="#333">5</text>
    <rect x="249" y="44" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="270" y="64" text-anchor="middle" fill="#333">0</text>
    <rect x="294" y="44" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="315" y="64" text-anchor="middle" fill="#333">10</text>
    <rect x="339" y="44" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="360" y="64" text-anchor="middle" fill="#333">14</text>
  </g>

  <!-- sort arrow (down) -->
  <path d="M 270 78 L 270 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="90" font-size="10" fill="#d6a040" font-weight="bold">排序</text>

  <!-- sorted array with index labels -->
  <text x="56" y="118" font-size="11" fill="#888">排序后</text>
  <g font-size="9" fill="#888">
    <text x="180" y="104" text-anchor="middle">0</text>
    <text x="225" y="104" text-anchor="middle">1</text>
    <text x="270" y="104" text-anchor="middle">2</text>
    <text x="315" y="104" text-anchor="middle">3</text>
    <text x="360" y="104" text-anchor="middle">4</text>
  </g>
  <g font-size="13">
    <rect x="159" y="108" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="128" text-anchor="middle" fill="#333">0</text>
    <rect x="204" y="108" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="225" y="128" text-anchor="middle" fill="#333">1</text>
    <rect x="249" y="108" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="270" y="128" text-anchor="middle" fill="#333">5</text>
    <rect x="294" y="108" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="315" y="128" text-anchor="middle" fill="#333">10</text>
    <rect x="339" y="108" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="360" y="128" text-anchor="middle" fill="#333">14</text>
  </g>

  <!-- divider -->
  <path d="M 20 148 L 520 148" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- n=5 > 4 check -->
  <text x="30" y="168" font-size="11" fill="#444">n = 5 &gt; 4，计算四种差值：</text>

  <!-- 4 computation rows -->
  <!-- Row 1: i=0, highlighted -->
  <rect x="30" y="178" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="48" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">i=0</text>
  <text x="92" y="200" font-size="12" fill="#333">nums[n−4]−nums[0]</text>
  <text x="250" y="200" font-size="12" fill="#888">= nums[1] − nums[0]</text>
  <text x="400" y="200" font-size="12" fill="#333">= 1 − 0 =</text>
  <text x="478" y="200" font-size="15" fill="#4a7a3a" font-weight="bold">1 ★</text>

  <!-- Row 2: i=1 -->
  <rect x="30" y="218" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="48" y="240" font-size="12" fill="#446688" font-weight="bold">i=1</text>
  <text x="92" y="240" font-size="12" fill="#333">nums[n−3]−nums[1]</text>
  <text x="250" y="240" font-size="12" fill="#888">= nums[2] − nums[1]</text>
  <text x="400" y="240" font-size="12" fill="#333">= 5 − 1 =</text>
  <text x="484" y="240" font-size="15" fill="#333" font-weight="bold">4</text>

  <!-- Row 3: i=2 -->
  <rect x="30" y="258" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="48" y="280" font-size="12" fill="#446688" font-weight="bold">i=2</text>
  <text x="92" y="280" font-size="12" fill="#333">nums[n−2]−nums[2]</text>
  <text x="250" y="280" font-size="12" fill="#888">= nums[3] − nums[2]</text>
  <text x="400" y="280" font-size="12" fill="#333">= 10 − 5 =</text>
  <text x="480" y="280" font-size="15" fill="#333" font-weight="bold">5</text>

  <!-- Row 4: i=3 -->
  <rect x="30" y="298" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="48" y="320" font-size="12" fill="#446688" font-weight="bold">i=3</text>
  <text x="92" y="320" font-size="12" fill="#333">nums[n−1]−nums[3]</text>
  <text x="250" y="320" font-size="12" fill="#888">= nums[4] − nums[3]</text>
  <text x="400" y="320" font-size="12" fill="#333">= 14 − 10 =</text>
  <text x="478" y="320" font-size="15" fill="#333" font-weight="bold">4</text>

  <!-- Answer arrow -->
  <path d="M 270 336 L 270 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Answer box -->
  <rect x="80" y="356" width="380" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = min(1, 4, 5, 4) =</text>
  <text x="402" y="382" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="270" y="398" text-anchor="middle" font-size="10" fill="#888">删右端 3 个（i=0），保留 [0, 1]，差值最小</text>
</svg>
