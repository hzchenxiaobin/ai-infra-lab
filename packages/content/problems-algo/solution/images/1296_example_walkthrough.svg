<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [1,2,3,3,4,4,5,6], k = 4</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">初始 freq：{1:1, 2:1, 3:2, 4:2, 5:1, 6:1}　n=8, k=4, 8 % 4 == 0 ✓</text>

  <!-- Table header row -->
  <text x="36" y="74" font-size="10.5" fill="#666">步骤</text>
  <text x="86" y="74" font-size="10.5" fill="#666">x</text>
  <text x="126" y="74" font-size="10.5" fill="#666">cnt</text>
  <text x="178" y="74" font-size="10.5" fill="#666">消耗的组</text>
  <text x="306" y="74" font-size="10.5" fill="#666">freq 变化</text>
  <text x="500" y="74" font-size="10.5" fill="#666">结果</text>

  <!-- header underline -->
  <path d="M 28 80 L 540 80" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: x=1, cnt=1, [1,2,3,4] -->
  <rect x="28" y="86" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="86" y="106" font-size="11" fill="#333">1</text>
  <text x="126" y="106" font-size="11" fill="#333">1</text>
  <rect x="170" y="90" width="132" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="106" text-anchor="middle" font-size="10.5" fill="#333">[1, 2, 3, 4]</text>
  <text x="306" y="106" font-size="10" fill="#555">2:1→0, 3:2→1, 4:2→1</text>
  <text x="506" y="106" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Step 2: x=2, cnt=0 skip -->
  <rect x="28" y="120" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="86" y="140" font-size="11" fill="#333">2</text>
  <text x="126" y="140" font-size="11" fill="#888">0</text>
  <rect x="170" y="124" width="132" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="236" y="140" text-anchor="middle" font-size="10" fill="#888">—（跳过）</text>
  <text x="306" y="140" font-size="10" fill="#888">—</text>
  <text x="506" y="140" font-size="11" fill="#888">—</text>

  <!-- Step 3: x=3, cnt=1, [3,4,5,6] -->
  <rect x="28" y="154" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="86" y="174" font-size="11" fill="#333">3</text>
  <text x="126" y="174" font-size="11" fill="#333">1</text>
  <rect x="170" y="158" width="132" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="174" text-anchor="middle" font-size="10.5" fill="#333">[3, 4, 5, 6]</text>
  <text x="306" y="174" font-size="10" fill="#555">4:1→0, 5:1→0, 6:1→0</text>
  <text x="506" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Step 4: x=4,5,6 all cnt=0 -->
  <rect x="28" y="188" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="86" y="208" font-size="11" fill="#333">4,5,6</text>
  <text x="126" y="208" font-size="11" fill="#888">0</text>
  <rect x="170" y="192" width="132" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="236" y="208" text-anchor="middle" font-size="10" fill="#888">—（均跳过）</text>
  <text x="306" y="208" font-size="10" fill="#888">—</text>
  <text x="506" y="208" font-size="11" fill="#888">—</text>

  <!-- divider -->
  <path d="M 28 230 L 540 230" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="80" y="244" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终：所有 freq = 0 → return true</text>

  <!-- Two resulting groups visualized -->
  <text x="36" y="304" font-size="10.5" fill="#666">分成的两组：</text>

  <!-- Group 1 [1,2,3,4] blue -->
  <rect x="100" y="290" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="117" y="311" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="138" y="290" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="311" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="176" y="290" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="193" y="311" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="214" y="290" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="231" y="311" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- Group 2 [3,4,5,6] green -->
  <rect x="300" y="290" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="317" y="311" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="338" y="290" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="355" y="311" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="376" y="290" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="393" y="311" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="414" y="290" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="431" y="311" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- Bottom note -->
  <rect x="60" y="340" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：处理 x=3 时 cnt=1（原始 2 个，被步骤 1 消耗了 1 个）</text>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#555">需 freq[4] ≥ 1、freq[5] ≥ 1、freq[6] ≥ 1，恰好满足 → 一次性消耗 1 组 [3,4,5,6]</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888">反例 nums=[1,2,3,4], k=3：n=4 不能被 3 整除，① 直接 return false</text>
</svg>
