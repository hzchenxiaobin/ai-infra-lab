<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：RXXLRXRXL → XRLXXRRLX</text>

  <!-- start string with index labels -->
  <text x="40" y="58" font-size="11" fill="#888">下标:</text>
  <text x="100" y="58" font-size="10" fill="#aaa" text-anchor="middle">0</text>
  <text x="136" y="58" font-size="10" fill="#aaa" text-anchor="middle">1</text>
  <text x="172" y="58" font-size="10" fill="#aaa" text-anchor="middle">2</text>
  <text x="208" y="58" font-size="10" fill="#aaa" text-anchor="middle">3</text>
  <text x="244" y="58" font-size="10" fill="#aaa" text-anchor="middle">4</text>
  <text x="280" y="58" font-size="10" fill="#aaa" text-anchor="middle">5</text>
  <text x="316" y="58" font-size="10" fill="#aaa" text-anchor="middle">6</text>
  <text x="352" y="58" font-size="10" fill="#aaa" text-anchor="middle">7</text>
  <text x="388" y="58" font-size="10" fill="#aaa" text-anchor="middle">8</text>

  <text x="40" y="82" font-size="12" fill="#888">start:</text>
  <!-- R@0 -->
  <rect x="82" y="62" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>
  <!-- X@1 -->
  <rect x="118" y="62" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>
  <!-- X@2 -->
  <rect x="154" y="62" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>
  <!-- L@3 -->
  <rect x="190" y="62" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">L</text>
  <!-- R@4 -->
  <rect x="226" y="62" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>
  <!-- X@5 -->
  <rect x="262" y="62" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>
  <!-- R@6 -->
  <rect x="298" y="62" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>
  <!-- X@7 -->
  <rect x="334" y="62" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>
  <!-- L@8 -->
  <rect x="370" y="62" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">L</text>

  <!-- end string -->
  <text x="40" y="130" font-size="12" fill="#888">end:</text>
  <!-- X@0 -->
  <rect x="82" y="110" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>
  <!-- R@1 -->
  <rect x="118" y="110" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>
  <!-- L@2 -->
  <rect x="154" y="110" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">L</text>
  <!-- X@3 -->
  <rect x="190" y="110" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>
  <!-- X@4 -->
  <rect x="226" y="110" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>
  <!-- R@5 -->
  <rect x="262" y="110" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>
  <!-- R@6 -->
  <rect x="298" y="110" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>
  <!-- L@7 -->
  <rect x="334" y="110" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">L</text>
  <!-- X@8 -->
  <rect x="370" y="110" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>

  <!-- Separator -->
  <path d="M 40 158 L 520 158" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- Pairing table header -->
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">双指针配对（跳过 X 后逐个对齐）</text>

  <!-- Pairing 1: R@0 → R@1 -->
  <text x="40" y="206" font-size="11" fill="#888">配对1:</text>
  <rect x="100" y="190" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">R</text>
  <text x="150" y="209" font-size="11" fill="#888">i=0</text>
  <path d="M 175 204 L 215 204" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="195" y="196" text-anchor="middle" font-size="9" fill="#4a7a3a">右移</text>
  <rect x="220" y="190" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">R</text>
  <text x="270" y="209" font-size="11" fill="#888">j=1</text>
  <text x="330" y="209" font-size="11" fill="#4a7a3a" font-weight="bold">j=1 ≥ i=0 ✓</text>

  <!-- Pairing 2: L@3 → L@2 -->
  <text x="40" y="246" font-size="11" fill="#888">配对2:</text>
  <rect x="100" y="230" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="249" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">L</text>
  <text x="150" y="249" font-size="11" fill="#888">i=3</text>
  <path d="M 215 244 L 175 244" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="195" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">左移</text>
  <rect x="220" y="230" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="249" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">L</text>
  <text x="270" y="249" font-size="11" fill="#888">j=2</text>
  <text x="330" y="249" font-size="11" fill="#4a7a3a" font-weight="bold">j=2 ≤ i=3 ✓</text>

  <!-- Pairing 3: R@4 → R@5 -->
  <text x="40" y="286" font-size="11" fill="#888">配对3:</text>
  <rect x="100" y="270" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="289" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">R</text>
  <text x="150" y="289" font-size="11" fill="#888">i=4</text>
  <path d="M 175 284 L 215 284" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="195" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a">右移</text>
  <rect x="220" y="270" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="289" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">R</text>
  <text x="270" y="289" font-size="11" fill="#888">j=5</text>
  <text x="330" y="289" font-size="11" fill="#4a7a3a" font-weight="bold">j=5 ≥ i=4 ✓</text>

  <!-- Pairing 4: R@6 → R@6 -->
  <text x="40" y="326" font-size="11" fill="#888">配对4:</text>
  <rect x="100" y="310" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="329" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">R</text>
  <text x="150" y="329" font-size="11" fill="#888">i=6</text>
  <text x="195" y="329" text-anchor="middle" font-size="11" fill="#888">不动</text>
  <rect x="220" y="310" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="329" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">R</text>
  <text x="270" y="329" font-size="11" fill="#888">j=6</text>
  <text x="330" y="329" font-size="11" fill="#4a7a3a" font-weight="bold">j=6 ≥ i=6 ✓</text>

  <!-- Pairing 5: L@8 → L@7 -->
  <text x="40" y="366" font-size="11" fill="#888">配对5:</text>
  <rect x="100" y="350" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="369" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">L</text>
  <text x="150" y="369" font-size="11" fill="#888">i=8</text>
  <path d="M 215 364 L 175 364" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="195" y="356" text-anchor="middle" font-size="9" fill="#4a7a3a">左移</text>
  <rect x="220" y="350" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="369" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">L</text>
  <text x="270" y="369" font-size="11" fill="#888">j=7</text>
  <text x="330" y="369" font-size="11" fill="#4a7a3a" font-weight="bold">j=7 ≤ i=8 ✓</text>

  <!-- Result -->
  <rect x="40" y="392" width="480" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">5 次配对全部通过，去 X 序列相同 → return true ✓</text>
</svg>
