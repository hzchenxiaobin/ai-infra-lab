<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：字符可自由搬运 → 只看各字符总数能否被 n 整除</text>

  <!-- Left label: words -->
  <text x="44" y="68" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">words</text>

  <!-- Row 1: abc -->
  <rect x="80"  y="50" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="50" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="50" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="140" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="180" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="230" y="71" font-size="12" fill="#888" filter="url(#rough2)">← "abc"</text>

  <!-- Row 2: aabc -->
  <rect x="80"  y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="92" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="92" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="113" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="140" y="113" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="180" y="113" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="220" y="113" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="260" y="113" font-size="12" fill="#888" filter="url(#rough2)">← "aabc"</text>

  <!-- Row 3: bc -->
  <rect x="80"  y="134" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="134" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="140" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="180" y="155" font-size="12" fill="#888" filter="url(#rough2)">← "bc"</text>

  <!-- Aggregate arrow -->
  <path d="M 170 178 L 170 208" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="198" font-size="11" fill="#888" filter="url(#rough2)">汇总</text>

  <!-- Total frequency section -->
  <text x="280" y="222" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">各字符总数</text>

  <rect x="90" y="232" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="251" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="130" y="268" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="190" y="232" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="230" y="268" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="290" y="232" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="330" y="251" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="330" y="268" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="410" y="232" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="465" y="251" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">字符串数</text>
  <text x="465" y="268" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">n = 3</text>

  <!-- Arrow down -->
  <path d="M 280 286 L 280 308" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Divisibility check -->
  <rect x="60" y="314" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 % 3 = 0 ✓     3 % 3 = 0 ✓     3 % 3 = 0 ✓   →  每串分到 1a 1b 1c = "abc"</text>

  <!-- Result -->
  <rect x="160" y="362" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="385" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部整除 → 返回 true</text>
</svg>
