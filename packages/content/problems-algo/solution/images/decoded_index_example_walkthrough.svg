<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "ha22", k = 5 → 答案 "h"</text>

  <!-- ===== Forward pass result ===== -->
  <rect x="30" y="36" width="500" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">阶段一（正向算 size）：</text>
  <text x="50" y="76" font-size="11" fill="#444">h→1, a→2, 2→4, 2→8 ≥ k=5，停！ size=8, i=3</text>

  <!-- decoded string preview -->
  <text x="320" y="56" font-size="11" fill="#888">解码串 = "hahahaha"</text>
  <text x="320" y="76" font-size="10" fill="#b85450">第5个 = 'h' ✓</text>

  <!-- ===== Backward pass table ===== -->
  <text x="30" y="108" font-size="12" fill="#b85450" font-weight="bold">阶段二（逆向定位）：从 j=3 往左扫</text>

  <!-- Table header -->
  <rect x="30" y="116" width="500" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">步骤</text>
  <text x="140" y="134" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">s[j]</text>
  <text x="210" y="134" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">类型</text>
  <text x="300" y="134" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">操作</text>
  <text x="420" y="134" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">size / k</text>

  <!-- Step 1: j=3, '2', digit -->
  <rect x="30" y="142" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="162" text-anchor="middle" font-size="11" fill="#333">j=3</text>
  <text x="140" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="210" y="162" text-anchor="middle" font-size="11" fill="#d6a040">数字</text>
  <text x="300" y="162" text-anchor="middle" font-size="10" fill="#444">size/=2 → 4; k=(5-1)%4+1</text>
  <text x="420" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4 / 1</text>

  <!-- Step 2: j=2, '2', digit -->
  <rect x="30" y="172" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="192" text-anchor="middle" font-size="11" fill="#333">j=2</text>
  <text x="140" y="192" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="210" y="192" text-anchor="middle" font-size="11" fill="#d6a040">数字</text>
  <text x="300" y="192" text-anchor="middle" font-size="10" fill="#444">size/=2 → 2; k=(1-1)%2+1</text>
  <text x="420" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2 / 1</text>

  <!-- Step 3: j=1, 'a', letter, no match -->
  <rect x="30" y="202" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="222" text-anchor="middle" font-size="11" fill="#333">j=1</text>
  <text x="140" y="222" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <text x="210" y="222" text-anchor="middle" font-size="11" fill="#446688">字母</text>
  <text x="300" y="222" text-anchor="middle" font-size="10" fill="#444">k≠size → size-=1</text>
  <text x="420" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1 / 1</text>

  <!-- Step 4: j=0, 'h', letter, match! -->
  <rect x="30" y="232" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="70" y="252" text-anchor="middle" font-size="11" fill="#333">j=0</text>
  <text x="140" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">h</text>
  <text x="210" y="252" text-anchor="middle" font-size="11" fill="#b85450">字母</text>
  <text x="300" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">k==size → 命中!</text>
  <text x="420" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 / 1 ✓</text>

  <!-- ===== Visualization of folding ===== -->
  <line x1="30" y1="276" x2="530" y2="276" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="30" y="296" font-size="12" fill="#446688" font-weight="bold">折叠过程可视化：</text>

  <!-- Full decoded: hahahaha (8 chars), k=5 highlighted -->
  <text x="30" y="316" font-size="10" fill="#888">解码串 (size=8):</text>
  <g filter="url(#rough2)">
    <rect x="130" y="304" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="147" y="320" text-anchor="middle" font-size="11" fill="#333">h</text>
    <rect x="166" y="304" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="183" y="320" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="202" y="304" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="219" y="320" text-anchor="middle" font-size="11" fill="#333">h</text>
    <rect x="238" y="304" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="255" y="320" text-anchor="middle" font-size="11" fill="#333">a</text>
    <!-- k=5 highlighted -->
    <rect x="274" y="304" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="291" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">h</text>
    <rect x="310" y="304" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="327" y="320" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="346" y="304" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="363" y="320" text-anchor="middle" font-size="11" fill="#333">h</text>
    <rect x="382" y="304" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="399" y="320" text-anchor="middle" font-size="11" fill="#333">a</text>
  </g>
  <text x="291" y="340" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ k=5</text>

  <!-- After first fold (÷2): size=4, k=1 -->
  <path d="M 260 346 L 260 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="355" font-size="10" fill="#d6a040">÷2</text>

  <text x="30" y="374" font-size="10" fill="#888">折一版 (size=4):</text>
  <g filter="url(#rough2)">
    <rect x="200" y="362" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="217" y="378" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">h</text>
    <rect x="236" y="362" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="253" y="378" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="272" y="362" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="289" y="378" text-anchor="middle" font-size="11" fill="#333">h</text>
    <rect x="308" y="362" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="325" y="378" text-anchor="middle" font-size="11" fill="#333">a</text>
  </g>
  <text x="217" y="398" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ k=1</text>

  <!-- After second fold (÷2): size=2, k=1 -->
  <path d="M 260 396 L 260 404" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="403" font-size="10" fill="#d6a040">÷2</text>

  <text x="370" y="374" font-size="10" fill="#888">折两版 (size=2):</text>
  <g filter="url(#rough2)">
    <rect x="440" y="362" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="457" y="378" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">h</text>
    <rect x="476" y="362" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="493" y="378" text-anchor="middle" font-size="11" fill="#333">a</text>
  </g>
  <text x="457" y="398" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ k=1 = size → 命中 'h'</text>
</svg>
