<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：按 (年龄, 得分) 排序后，无冲突 ⟺ 得分不下降</text>

  <!-- Axes labels -->
  <text x="30" y="200" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">得</text>
  <text x="30" y="214" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">分</text>
  <text x="285" y="262" font-size="11" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">年龄 →</text>

  <!-- Axes -->
  <line x1="50" y1="240" x2="520" y2="240" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="50" y1="240" x2="50" y2="70" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Axis tick labels (age) -->
  <g font-size="9" fill="#aaa" text-anchor="middle">
    <text x="100" y="256" filter="url(#rough2)">1</text>
    <text x="160" y="256" filter="url(#rough2)">2</text>
    <text x="220" y="256" filter="url(#rough2)">3</text>
    <text x="280" y="256" filter="url(#rough2)">4</text>
    <text x="340" y="256" filter="url(#rough2)">5</text>
  </g>
  <!-- Axis tick labels (score) -->
  <g font-size="9" fill="#aaa" text-anchor="end">
    <text x="44" y="224" filter="url(#rough2)">2</text>
    <text x="44" y="194" filter="url(#rough2)">4</text>
    <text x="44" y="164" filter="url(#rough2)">6</text>
    <text x="44" y="134" filter="url(#rough2)">8</text>
    <text x="44" y="104" filter="url(#rough2)">10</text>
  </g>

  <!-- Players from example 2: (age,score) = (2,4),(1,5),(2,6),(1,5) -->
  <!-- Player A: age=1, score=5 -->
  <circle cx="100" cy="180" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="172" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <!-- Player B: age=1, score=5 -->
  <circle cx="105" cy="175" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="168" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">B</text>
  <!-- Player C: age=2, score=4 -->
  <circle cx="160" cy="210" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="202" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>
  <!-- Player D: age=2, score=6 -->
  <circle cx="165" cy="150" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">D</text>

  <!-- Conflict arrow: A(age=1,score=5) -> C(age=2,score=4): younger with higher score -->
  <path d="M 108 178 Q 130 195 154 208" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="200" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">冲突!</text>
  <text x="120" y="212" font-size="8" fill="#b85450" filter="url(#rough2)">年轻+分高</text>

  <!-- Valid chain: A -> B -> D (non-decreasing score) -->
  <path d="M 108 175 Q 120 162 160 150" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sorted order annotation -->
  <rect x="350" y="78" width="190" height="128" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后序列</text>
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="350" y1="106" x2="540" y2="106"/>
  </g>
  <g font-size="10" fill="#333" text-anchor="middle">
    <text x="368" y="122" font-weight="bold" fill="#888" filter="url(#rough2)">序</text>
    <text x="410" y="122" font-weight="bold" fill="#888" filter="url(#rough2)">球员</text>
    <text x="462" y="122" font-weight="bold" fill="#888" filter="url(#rough2)">年龄</text>
    <text x="514" y="122" font-weight="bold" fill="#888" filter="url(#rough2)">得分</text>
  </g>
  <g font-size="10" fill="#333" text-anchor="middle">
    <text x="368" y="142" filter="url(#rough2)">0</text>
    <text x="410" y="142" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
    <text x="462" y="142" filter="url(#rough2)">1</text>
    <text x="514" y="142" filter="url(#rough2)">5</text>

    <text x="368" y="160" filter="url(#rough2)">1</text>
    <text x="410" y="160" fill="#446688" font-weight="bold" filter="url(#rough2)">B</text>
    <text x="462" y="160" filter="url(#rough2)">1</text>
    <text x="514" y="160" filter="url(#rough2)">5</text>

    <text x="368" y="178" filter="url(#rough2)">2</text>
    <text x="410" y="178" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>
    <text x="462" y="178" filter="url(#rough2)">2</text>
    <text x="514" y="178" filter="url(#rough2)">4</text>

    <text x="368" y="196" filter="url(#rough2)">3</text>
    <text x="410" y="196" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">D</text>
    <text x="462" y="196" filter="url(#rough2)">2</text>
    <text x="514" y="196" filter="url(#rough2)">6</text>
  </g>

  <!-- Insight box -->
  <rect x="30" y="280" width="500" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="300" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">关键洞察</text>
  <text x="48" y="318" font-size="11" fill="#555" filter="url(#rough2)">• 按 (age, score) 升序排序 → 同龄球员按得分升序，消除"同龄高分在前"的假冲突</text>
  <text x="48" y="336" font-size="11" fill="#555" filter="url(#rough2)">• 排序后，无冲突球队 ⟺ 得分序列的不下降子序列</text>
  <text x="48" y="354" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 归约为「最大和不下降子序列」= LIS 求和变体</text>

  <!-- Legend -->
  <rect x="30" y="380" width="500" height="44" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <circle cx="50" cy="396" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="400" font-size="10" fill="#555" filter="url(#rough2)">入选球员</text>
  <line x1="135" y1="396" x2="160" y2="396" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="168" y="400" font-size="10" fill="#555" filter="url(#rough2)">不下降链</text>
  <line x1="240" y1="396" x2="265" y2="396" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="273" y="400" font-size="10" fill="#b85450" filter="url(#rough2)">冲突对（年轻+分高）</text>
  <circle cx="430" cy="396" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442" y="400" font-size="10" fill="#555" filter="url(#rough2)">冲突球员</text>
  <text x="50" y="418" font-size="9" fill="#aaa" filter="url(#rough2)">数据来自示例 2：scores=[4,5,6,5], ages=[2,1,2,1]</text>
</svg>
