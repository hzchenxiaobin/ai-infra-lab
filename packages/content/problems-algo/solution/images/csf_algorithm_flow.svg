<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预处理 f 值直方图 → 后缀和 → 逐查询 O(1) 查表</text>

  <!-- ===== Phase 0: compute f for all words ===== -->
  <text x="40" y="52" font-size="11" fill="#446688" font-weight="bold">预处理一：遍历 words，计算 f(w)，cnt[f]++</text>

  <rect x="90" y="62" width="360" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="12" fill="#333">对每个 w：找最小字母 + 数其频次 → cnt[f(w)] ++</text>

  <path d="M 270 92 L 270 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 1: build suffix sum ===== -->
  <text x="40" y="128" font-size="11" fill="#4a7a3a" font-weight="bold">预处理二：从 v=10 往左累加后缀和</text>

  <rect x="90" y="138" width="360" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="12" fill="#333">suffix[v] = suffix[v+1] + cnt[v+1]（v: 10→1）</text>

  <path d="M 270 168 L 270 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 2: query loop ===== -->
  <text x="40" y="204" font-size="11" fill="#b85450" font-weight="bold">查询阶段：遍历 queries，逐个查表</text>

  <!-- Start -->
  <ellipse cx="270" cy="222" rx="120" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="226" text-anchor="middle" font-size="12" fill="#333">开始: i = 0</text>

  <path d="M 270 240 L 270 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: more queries? -->
  <polygon points="270,254 390,284 270,314 150,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="12" fill="#333">还有查询</text>
  <text x="270" y="296" text-anchor="middle" font-size="11" fill="#666">queries[i] ?</text>

  <!-- No -> right to end -->
  <path d="M 390 284 L 460 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="276" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <ellipse cx="488" cy="284" rx="50" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="280" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="488" y="294" text-anchor="middle" font-size="11" fill="#333">answer</text>

  <!-- Yes -> down -->
  <path d="M 270 314 L 270 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="326" font-size="11" fill="#82b366">是</text>

  <!-- Compute f(query) box -->
  <rect x="110" y="332" width="320" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="12" fill="#333">计算 q = f(queries[i])</text>

  <path d="M 270 362 L 270 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Lookup box -->
  <rect x="90" y="378" width="360" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="398" text-anchor="middle" font-size="12" fill="#333">answer[i] = suffix[q]（O(1) 查表）</text>

  <path d="M 270 408 L 270 420" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- accumulate box -->
  <rect x="170" y="422" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="440" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i++，继续下一查询</text>

  <!-- loop back to diamond1 -->
  <path d="M 270 448 L 270 460 L 40 460 L 40 284 L 150 284" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary -->
  <text x="270" y="496" text-anchor="middle" font-size="10" fill="#888">预处理 O(ΣL_words) + 后缀和 O(10) + 查询 O(ΣL_queries) → 总 O(ΣL)；空间 O(1)</text>
</svg>
