<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两趟扫描——求 max + 非负值去重求和</text>

  <!-- 开始 -->
  <rect x="180" y="40" width="170" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="59" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">第一趟：求 mx = max(nums)</text>

  <path d="M 265 70 L 265 92" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <polygon points="265,95 345,135 265,175 185,135" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="140" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">mx &lt; 0 ?</text>

  <!-- 是分支 -->
  <path d="M 185 135 L 150 135" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="167" y="127" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="30" y="113" width="118" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="89" y="131" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 mx</text>
  <text x="89" y="148" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">（全负：留最大的一个）</text>
  <text x="89" y="178" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">漏判此特例会错返 0</text>

  <!-- 否分支 -->
  <path d="M 265 175 L 265 197" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="190" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 右侧小贴士 -->
  <rect x="360" y="100" width="145" height="64" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="432" y="120" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">值域仅 [-100, 100]</text>
  <text x="432" y="136" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">bool seen[101] 即可</text>
  <text x="432" y="152" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">值域大 → 换哈希集合</text>

  <!-- 初始化 -->
  <rect x="180" y="200" width="170" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="218" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">ans = 0，seen[ ] 清零</text>

  <path d="M 265 228 L 265 244" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二趟循环 -->
  <rect x="90" y="246" width="350" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="266" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">第二趟：对每个 x ∈ nums</text>
  <text x="265" y="285" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x ≥ 0 且 x 未标记 → ans += x 并标记</text>
  <text x="265" y="302" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">（负数与重复值直接跳过）</text>
  <path d="M 440 262 C 468 256, 470 298, 442 292" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 265 310 L 265 326" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="180" y="328" width="170" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="346" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 ans（互异非负值之和）</text>
</svg>
