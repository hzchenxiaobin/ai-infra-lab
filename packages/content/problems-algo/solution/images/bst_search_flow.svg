<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">searchBST 递归流程</text>

  <!-- 起点：函数入口 -->
  <rect x="180" y="42" width="180" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">searchBST(root, val)</text>
  <line x1="270" y1="76" x2="270" y2="98" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1: root == null? -->
  <polygon points="270,100 360,140 270,180 180,140" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="11" fill="#333">root == null?</text>
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#333"></text>

  <!-- yes → return null -->
  <line x1="360" y1="140" x2="408" y2="140" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="410" y="124" width="110" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return null</text>

  <!-- no → 判定2 -->
  <line x1="270" y1="180" x2="270" y2="202" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="194" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- 判定2: val == root.val? -->
  <polygon points="270,204 365,244 270,284 175,244" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="11" fill="#333">val == root.val?</text>

  <!-- yes → return root -->
  <line x1="365" y1="244" x2="408" y2="244" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="228" width="120" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="249" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return root ✅</text>

  <!-- no → 判定3 -->
  <line x1="270" y1="284" x2="270" y2="306" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="298" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- 判定3: val < root.val? -->
  <polygon points="270,308 365,348 270,388 175,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="11" fill="#333">val &lt; root.val?</text>

  <!-- yes → 左 -->
  <line x1="175" y1="348" x2="128" y2="348" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="342" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">是</text>
  <rect x="10" y="332" width="118" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="69" y="353" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">searchBST(left)</text>

  <!-- no → 右 -->
  <line x1="365" y1="348" x2="408" y2="348" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="342" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">否</text>
  <rect x="410" y="332" width="120" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="353" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">searchBST(right)</text>

  <!-- 底部说明 -->
  <rect x="30" y="410" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="432" font-size="11" fill="#555">⭐ 每层只走一条路径——比较一次即淘汰另一侧子树，无需回溯。</text>
  <text x="50" y="450" font-size="11" fill="#555">　 时间 O(H)，H 为树高；平衡 BST 为 O(log n)，链状退化 O(n)。</text>

</svg>
